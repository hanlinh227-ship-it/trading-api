runtime:
  dry_run: false
  worker_enabled: true
  external_spend_limit_usd: "0"
  scan_interval_seconds: 300
  max_concurrent_tasks: 1
  max_active_claims: 1
  opportunity_allowlist:
    - "cmn67bp7x0001jmullewz0dvy"
  worker_pools:
    scouts: 1
    code_fix: 1
    research_data: 0
    service: 1
    verification: 1
    submission: 1

sources:
  taskforce:
    enabled: true
    base_url: "https://task-force.app"
    agent_native: true
    read_only: false
    request_timeout_seconds: 20
    min_poll_interval_seconds: 60
    capabilities:
      source_class: "job"
      agent_allowed: true
      auto_discovery: true
      auto_claim: true
      auto_execute: true
      auto_submit: true
      auto_publish: false
      auto_payout_observation: true
      requires_human_onboarding: true
      requires_kyc: false
      requires_tax_setup: false
      requires_manual_review: false
      external_spend_required: false
      mutation_verified_at: "2026-09-11T17:30:00+00:00"
      terms_verified_at: "2026-09-11T17:30:00+00:00"
      rate_limit_policy: "single exact canary only; max one active application; no paid actions"
