runtime:
  dry_run: true
  worker_enabled: false
  external_spend_limit_usd: "0"
  scan_interval_seconds: 300
  max_concurrent_tasks: 1
  max_active_claims: 1
  worker_pools:
    scouts: 3
    code_fix: 2
    research_data: 2
    service: 2
    verification: 2
    submission: 1

sources:
  taskbounty:
    enabled: true
    base_url: "https://www.task-bounty.com/api/v1"
    agent_native: true
    read_only: true
    request_timeout_seconds: 20
    min_poll_interval_seconds: 60
