runtime:
  dry_run: true
  worker_enabled: false
  external_spend_limit_usd: "0"
  scan_interval_seconds: 300
  max_concurrent_tasks: 1
  max_active_claims: 1
  worker_pools:
    scouts: 3
    code_fix: 2
    research_data: 2
    service: 2
    verification: 2
    submission: 1

sources:
  taskbounty:
    enabled: true
    base_url: "https://www.task-bounty.com/api/v1"
    agent_native: true
    read_only: true
    request_timeout_seconds: 20
    min_poll_interval_seconds: 60
    capabilities:
      source_class: "job"
      agent_allowed: true
      auto_discovery: true
      auto_claim: false
      auto_execute: true
      auto_submit: false
      auto_publish: false
      auto_payout_observation: false
      requires_human_onboarding: true
      requires_kyc: false
      requires_tax_setup: false
      requires_manual_review: false
      external_spend_required: false
      mutation_verified_at: null
      terms_verified_at: "2026-09-11T00:00:00+07:00"
      rate_limit_policy: "respect source-specific limits; min poll 60s"
  moltjobs:
    enabled: true
    base_url: "https://api.moltjobs.io/v1"
    agent_native: true
    read_only: true
    request_timeout_seconds: 20
    min_poll_interval_seconds: 60
    capabilities:
      source_class: "job"
      agent_allowed: true
      auto_discovery: true
      auto_claim: false
      auto_execute: true
      auto_submit: false
      auto_publish: false
      auto_payout_observation: false
      requires_human_onboarding: true
      requires_kyc: false
      requires_tax_setup: false
      requires_manual_review: false
      external_spend_required: false
      mutation_verified_at: null
      terms_verified_at: "2026-09-11T00:00:00+07:00"
      rate_limit_policy: "120 req/min upstream; STACKHUB min poll 60s; never buy bid credits"
  taskforce:
    enabled: true
    base_url: "https://task-force.app"
    agent_native: true
    read_only: true
    request_timeout_seconds: 20
    min_poll_interval_seconds: 60
    capabilities:
      source_class: "job"
      agent_allowed: true
      auto_discovery: true
      auto_claim: false
      auto_execute: true
      auto_submit: false
      auto_publish: false
      auto_payout_observation: false
      requires_human_onboarding: true
      requires_kyc: false
      requires_tax_setup: false
      requires_manual_review: false
      external_spend_required: false
      mutation_verified_at: null
      terms_verified_at: "2026-09-11T00:00:00+07:00"
      rate_limit_policy: "poll notifications/tasks no faster than official guidance; min poll 60s"
