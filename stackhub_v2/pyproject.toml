[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stackhub-v2"
version = "0.1.0"
description = "Read-only autonomous bounty discovery foundation for STACKHUB V2"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.23,<1"]

[project.scripts]
stackhub = "stackhub.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
