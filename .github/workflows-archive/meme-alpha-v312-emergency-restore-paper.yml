name: Meme Alpha v3.12 Emergency Paper Restore
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v312-emergency-restore-paper-exec.sh'
      - '.github/workflows/meme-alpha-v312-emergency-restore-paper.yml'
permissions:
  contents: read
jobs:
  restore:
    runs-on: [self-hosted, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Restore executable mode and paper service
        run: bash ops/meme-alpha/v312-emergency-restore-paper-exec.sh
