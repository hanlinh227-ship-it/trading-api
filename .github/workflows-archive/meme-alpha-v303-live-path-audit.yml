name: Meme Alpha v3.03 Live Path Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v303-live-path-audit.sh'
      - '.github/workflows/meme-alpha-v303-live-path-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Audit live activation path safely
        run: bash ops/meme-alpha/v303-live-path-audit.sh
