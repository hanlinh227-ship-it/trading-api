name: Meme Alpha v3.69 Deploy Capability Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/meme-alpha-v369-sudo-capability-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Audit active signal and executor hooks
        shell: bash
        run: |
          set -u
          echo RUNNER_IDENTITY="$(id)"
          sudo -n -l || true
          echo '--- safe deploy wrapper markers ---'
          grep -nE 'SAFE_DEPLOY_DISARM|ARMED=NO|micro-live-armed' /usr/local/sbin/meme-alpha-safe-deploy || true
          echo '--- signal source ---'
          sed -n '1,220p' /opt/meme-alpha/app/src/safe-signal-export.js || true
          echo '--- executor signal/gate hooks ---'
          grep -nE 'signal-snapshot|micro-live-gate|function candidates|hardSafetyBroken|trendEntryEligible|function candidate' /opt/meme-alpha/app/src/micro-live-executor.js || true
          echo V369_DEPLOY_CAPABILITY_AUDIT=COMPLETE
