name: Meme Alpha v3.14 Radar Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v314-radar-diagnostic.sh'
      - '.github/workflows/meme-alpha-v314-radar-diagnostic.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose radar runtime
        run: bash ops/meme-alpha/v314-radar-diagnostic.sh
