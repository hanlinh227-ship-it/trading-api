name: Meme Alpha Funnel Now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-funnel-now.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify v384 adaptive opportunity queue
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ROOT=/opt/trading/trading-api
          echo "ROOT_HEAD=$(git -c safe.directory=$ROOT -C $ROOT rev-parse HEAD 2>/dev/null || true)"
          echo "ROOT_REMOTE=$(git -c safe.directory=$ROOT -C $ROOT rev-parse origin/auto-futures-v1 2>/dev/null || true)"
          echo '=== UPDATE LOG ==='
          tail -n 80 "$ROOT/auto-futures-v1/logs/auto_update.log" 2>/dev/null || true
          echo '=== SCANNER BREADTH ==='
          grep -nE 'V384_ADAPTIVE_OPPORTUNITY_QUEUE|V383_SAFE_BREADTH_EXPANSION|MAX_SELLABILITY_CHECKS_V216|V384_TOP_PRIORITY|V384_ROTATING_BUDGET|baseDeep = ' "$APP/src/scanner.js" || true
          echo '=== SIGNAL ==='
          python3 -c "import json,os,time; p='$APP/runtime-status/signal-snapshot.json'; d=json.load(open(p)); print({'ageSec':round(time.time()-os.path.getmtime(p),1),'timestamp':d.get('timestamp'),'count':len(d.get('candidates') or []),'probe':(d.get('intelSummary') or {}).get('probeCandidates'),'routed':(d.get('intelSummary') or {}).get('routedCandidates'),'summary':d.get('intelSummary')})"
          echo '=== GATE ==='
          python3 -c "import json; d=json.load(open('$APP/runtime-status/micro-live-gate.json')); print({k:d.get(k) for k in ['allowed','armOk','armAttested','executionMode','sourceHealthy','riskEntryAllowed','liveRiskReady','reasons']})"
