name: Run SignalHub V3.9 Clean Entries Fix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-signalhub-v39-clean-entries-fix.yml']

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-v39-clean-entries
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V3.9 patch and ID fix
        run: |
          python3 scripts/patch_signalhub_v39_clean_entries.py
          python3 scripts/fix_signalhub_v39_id.py

      - name: Verify V3.9 source
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text()
          api=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java').read_text()
          g=Path('signalhub-android/app/build.gradle').read_text()
          for x in ['SIGNALHUB-V3-GATEWAY-3.9.0','CLEAN_MARKET_STORY_NO_SCORE','DURABLE_OBJECT_REALTIME_SINGLE_SOURCE','REALTIME_PENDING_INVALIDATION','REPLACED_BY_V39_CLEAN_STORY','V39-${market}-${style}',"regime='NO_TRADE'",'marketStory:story','H1 alone cannot define the trade']:
              assert x in w,x
          assert "async function trackV31Signals(env,market,style,priceMap){\n  return [];\n}" in w
          assert 'passesV35QualityGate' not in w and 'admissionMinScore' not in w and 'admissionMinRR' not in w
          assert "versionName '3.9.0'" in g
          assert 'APP_VERSION="3.9.0"' in a
          assert '3.9.0-clean-market-story' in api
          print('SOURCE_OK')
          PY

      - name: Validate worker
        run: npx --yes wrangler@latest deploy --dry-run --config signalhub-worker/wrangler.jsonc --outdir /tmp/v39-worker

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config signalhub-worker/wrangler.jsonc

      - name: Wait for V3.9
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 40); do
            if curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" >/tmp/status.json; then
              if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.9.0'
          PY
              then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1

      - name: Verify realtime and four engines
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM" >/tmp/status.json
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/forex/live?probe=$RANDOM" >/tmp/live.json
          python3 - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'));q=s.get('decisionPolicy') or {}
          assert s.get('version')=='SIGNALHUB-V3-GATEWAY-3.9.0'
          assert q.get('scoreGate') is False and q.get('timeGate') is False and q.get('rrGate') is False
          assert q.get('qualityMode')=='CLEAN_MARKET_STORY_NO_SCORE'
          assert q.get('lifecycleSource')=='DURABLE_OBJECT_REALTIME_SINGLE_SOURCE'
          x=json.load(open('/tmp/live.json'))
          assert x.get('transport')=='DURABLE_OBJECT_REALTIME' and x.get('count',0)>=30
          print('LIVE',x.get('state'),x.get('quoteAgeMs'),x.get('count'))
          PY
          : > /tmp/engine-summary.txt
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              ok=0
              for n in $(seq 1 12); do
                if curl -fsS --max-time 90 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/scan?market=$m&style=$s&probe=$RANDOM-$n" >/tmp/scan.json; then
                  if M="$m" S="$s" python3 - <<'PY'
          import json,os
          p=json.load(open('/tmp/scan.json'));q=p.get('decisionPolicy') or {}
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.9.0'
          assert q.get('qualityMode')=='CLEAN_MARKET_STORY_NO_SCORE'
          assert q.get('lifecycleSource')=='DURABLE_OBJECT_REALTIME_SINGLE_SOURCE'
          expected='SCALP_MICROSTRUCTURE' if os.environ['S']=='SCALP' else 'SWING_HTF_STRUCTURE'
          for x in p.get('topAnalyses',[]):
              assert x.get('styleExecutionModel')==expected
              assert x.get('marketStory') and x.get('entryModel') and x.get('slModel') and x.get('tpModel')
              e,sl,t1,t2,t3=map(float,[x['entry'],x['sl'],x['tp1'],x['tp2'],x['tp3']])
              if x.get('side') in ('LONG','BUY'): assert sl<e<t1<t2<t3
              else: assert sl>e>t1>t2>t3
          actionable=int(p.get('actionable') or 0)
          if os.environ['M']=='FOREX':
              scanned=int(p.get('scanned') or 0)
              assert scanned>=20 and actionable<scanned,(actionable,scanned)
              assert int(p.get('noTrade') or 0)==scanned-actionable
          else:
              deep=int(p.get('deepAnalyzed') or 0)
              assert actionable<=deep
              assert int(p.get('noTrade') or 0)==deep-actionable
          print(os.environ['M'],os.environ['S'],'actionable',actionable,'noTrade',p.get('noTrade'),'created',p.get('created'))
          PY
                  then
                    M="$m" S="$s" python3 - <<'PY' >> /tmp/engine-summary.txt
          import json,os
          p=json.load(open('/tmp/scan.json'))
          print(os.environ['M'],os.environ['S'],p.get('actionable'),p.get('noTrade'),p.get('created'))
          PY
                    ok=1; break
                  fi
                fi
                sleep 2
              done
              test "$ok" = 1
            done
          done
          cat /tmp/engine-summary.txt

      - name: Build APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage and verify APK
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
          mkdir -p dist
          cp "$APK" dist/SignalHub-v3.9.0-Clean-Market-Story.apk
          sha256sum dist/SignalHub-v3.9.0-Clean-Market-Story.apk > dist/SHA256SUMS.txt
          cp /tmp/engine-summary.txt dist/ENGINE-SUMMARY.txt

      - name: Commit V3.9 generated source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java
          git commit -m "SignalHub v3.9 clean market story entries" || true
          git push origin HEAD:signalhub-v39-clean-entries

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.9.0-Clean-Market-Story
          path: dist/
          retention-days: 30

      - name: Publish V3.9 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='signalhub-v3.9.0-clean-market-story'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SignalHub-v3.9.0-Clean-Market-Story.apk dist/SHA256SUMS.txt dist/ENGINE-SUMMARY.txt --clobber
          else
            gh release create "$TAG" dist/SignalHub-v3.9.0-Clean-Market-Story.apk dist/SHA256SUMS.txt dist/ENGINE-SUMMARY.txt --target signalhub-v39-clean-entries --prerelease --title 'SignalHub v3.9.0 Clean Market Story' --notes 'No score/time/RR admission gate. Bot returns NO TRADE when the market story is ambiguous. SCALP and SWING use separate structure models. Pending LIMIT/STOP lifecycle is driven only by realtime prices and invalidates by price, not by time.'
          fi
