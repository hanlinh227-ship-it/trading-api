name: Meme Alpha v3.26 Phantom Public Chain Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v326-phantom-public-chain-audit.sh'
      - '.github/workflows/meme-alpha-v326-phantom-public-chain-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Read live Phantom balance, holdings and recent on-chain activity
        run: bash ops/meme-alpha/v326-phantom-public-chain-audit.sh
