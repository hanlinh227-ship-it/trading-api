name: Meme Alpha V426 Conflict Cleanup Active
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v426-conflict-cleanup-active.yml'
permissions:
  contents: write
  actions: write
jobs:
  activate:
    runs-on: [self-hosted, trading-vps]
    steps:
      - name: Build validate activate and audit V426
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; E="$APP/src/micro-live-executor.js"; C="$RT/deploy-candidates/v426-conflict-cleanup.js"; RUN="$APP/run-paper.sh"
          mkdir -p "$RT/deploy-candidates"; cp "$E" "$C"
          python3 - "$C" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          def rep(old,new,name,count=1):
            global s
            n=s.count(old); assert n==count,(name,n,count); s=s.replace(old,new,count)

          old="function newEntryMode(c){if(trendEntryEligible(c)&&opportunityLane(c))return 'STANDARD';if(trendEntryEligible(c)&&idleCapitalProbeEligible(c))return 'IDLE_PROBE';return 'BLOCK'}"
          new="""function runtimeFileFresh(path,maxMs){try{const age=Date.now()-fs.statSync(path).mtimeMs;return Number.isFinite(age)&&age>=0&&age<=maxMs}catch{return false}}
          function signerCandidateCompatible(c,p=rootPolicy()){
            if(!c||!runtimeFileFresh(SIGNAL,180000))return false;
            let imp,base,liq,scanChg,net,avg,slope,con;try{imp=Math.abs(Number(c.sellPriceImpactPct??c.sellImpactPct??c.priceImpactPct));base=Number(c.score||0);liq=Number(c.liquidityUsd||0);scanChg=Number(c.priceChange5m);net=Number(c.netBuyers5m);avg=Number(c.avgNetBuyersLast2??net);slope=Number(c.scoreSlopeLast2??0);con=Number(c.consecutiveEligible||0)}catch{return false}
            if(![imp,base,liq,scanChg,net,avg,slope,con].every(Number.isFinite))return false;
            const hard=c.universeClass==='MEME_CONFIRMED'&&c.securityDecision==='PASS'&&c.holderClusterDecision==='PASS'&&c.decision==='PROBE_CANDIDATE'&&c.token2022!==true&&c.sellRoute===true&&Array.isArray(c.hardReject)&&c.hardReject.length===0&&liq>=50000&&imp<=n(p.maxBuyPriceImpactPct,1.25);if(!hard||con<1||base<58)return false;
            const trendPath='/opt/meme-alpha/app/runtime-status/trend-pulse.json',trend=runtimeFileFresh(trendPath,10000)?read(trendPath,{}):{},rows=trend.rows||[],themes=trend.themes||[],pulse=rows.find(x=>x.mint===c.mint);let score=base,chg=scanChg,pulseFlow=false;
            if(pulse){try{const va=Number(pulse.volumeAcceleration||0),ta=Number(pulse.txnAcceleration||0),br=Number(pulse.buySellRatio||0),ps=Number(pulse.pulseScore||0),tx5=Number(pulse.tx5||0);chg=Number(pulse.price5m??scanChg);const strength=Number((themes.find(x=>x.narrative===pulse.narrative)||{}).strength||0),add=(va>=1.45?4:va>=1.10?2:0)+(ta>=1.30?3:ta>=1.05?1:0)+(br>=1.25?2:0)+(strength>=60?2:0)+(ps>=70?1:0)+(pulse.status==='EXHAUSTED'?-8:0)+(pulse.promotionFlag===true&&ps<65?-3:0);score=Math.max(base-8,Math.min(base+12,base+add));pulseFlow=pulse.status!=='EXHAUSTED'&&ps>=55&&va>=1.05&&ta>=1.0&&br>=1.10&&tx5>=4}catch{}}
            const stable=c.liquidityStableLast2!==false,standard=score>=72,liquid=score>=66&&liq>=500000&&net>=1&&imp<=.80,flow=score>=62&&liq>=100000&&net>=5&&avg>=3&&scanChg>=.20&&imp<=.80,buyerFlow=net>=2&&avg>=1.5,fastFlow=net>=1&&pulseFlow,floor=pulseFlow?.05:.15;
            return chg>=floor&&chg<=15&&(buyerFlow||fastFlow)&&slope>=-4&&stable&&(standard||liquid||flow)
          }
          function entryReadiness(st,c,p=rootPolicy()){
            if(!signerCandidateCompatible(c,p))return{ready:false,mode:'BLOCK',reason:'SIGNER_CONTRACT_NOT_READY'};
            const mode=trendEntryEligible(c)&&opportunityLane(c)?'STANDARD':trendEntryEligible(c)&&idleCapitalProbeEligible(c)?'IDLE_PROBE':'BLOCK';if(mode==='BLOCK')return{ready:false,mode,reason:'ENTRY_SIGNAL_NOT_READY'};
            const edge=expectedEdge(st,c),pulse=pulseFor(c),rt=realtimeFor(c),trustedEarly=preBreakoutSignal(c)&&pulse?.flowRiseConfirmed===true&&!!rt&&n(rt.lastEventAgeMs,99999)<=2000&&n(rt.eventMomentum)>=1.10,baseFloor=mode==='IDLE_PROBE'?60:56,floor=trustedEarly?Math.max(52,baseFloor-4):baseFloor;
            if(edge<floor)return{ready:false,mode,reason:'EXPECTANCY_EDGE_BELOW_FLOOR',expectedEdge:edge,edgeFloor:floor,trustedEarly};return{ready:true,mode,reason:'READY',expectedEdge:edge,edgeFloor:floor,trustedEarly}
          }
          function newEntryMode(c){if(!signerCandidateCompatible(c))return 'BLOCK';if(trendEntryEligible(c)&&opportunityLane(c))return 'STANDARD';if(trendEntryEligible(c)&&idleCapitalProbeEligible(c))return 'IDLE_PROBE';return 'BLOCK'}"""
          rep(old,new,'UNIFIED_SIGNER_READINESS')

          old="function rankedCandidates(p,held,st){return candidates().filter(c=>!held.has(c.mint)&&newEntryMode(c)!=='BLOCK').sort((a,b)=>(entryPriority(b)-entryPriority(a))||(Number(preBreakoutSignal(b))-Number(preBreakoutSignal(a)))||(expectedEdge(st,b)-expectedEdge(st,a))||rank(b)-rank(a))}"
          new="function rankedCandidates(p,held,st){return candidates().filter(c=>!held.has(c.mint)&&entryReadiness(st,c,p).ready).sort((a,b)=>(entryPriority(b)-entryPriority(a))||(Number(preBreakoutSignal(b))-Number(preBreakoutSignal(a)))||(expectedEdge(st,b)-expectedEdge(st,a))||rank(b)-rank(a))}"
          rep(old,new,'RANKING_USES_UNIFIED_READINESS')

          old="const p=rootPolicy(),isAdd=posIndex>=0,existing=isAdd?st.positions[posIndex]:null,entryDecision=isAdd?(trendEntryEligible(c)&&opportunityLane(c)&&scalePositionEligible(existing,c,p)?'STANDARD_SCALE':'BLOCK'):newEntryMode(c);if(entryDecision==='BLOCK')return{placed:false,reason:isAdd?'SCALE_WINNER_CONFIRMATION_NOT_READY':'ENTRY_SIGNAL_NOT_READY'};if(!isAdd){const edge=expectedEdge(st,c),pulse=pulseFor(c),rt=realtimeFor(c),trustedEarly=preBreakoutSignal(c)&&pulse?.flowRiseConfirmed===true&&!!rt&&n(rt.lastEventAgeMs,99999)<=2000&&n(rt.eventMomentum)>=1.10,baseFloor=entryDecision==='IDLE_PROBE'?60:56,floor=trustedEarly?Math.max(52,baseFloor-4):baseFloor;if(edge<floor)return{placed:false,reason:'EXPECTANCY_EDGE_BELOW_FLOOR',expectedEdge:edge,edgeFloor:floor,trustedEarly}}const h=await signer({op:'health'});"
          new="const p=rootPolicy(),isAdd=posIndex>=0,existing=isAdd?st.positions[posIndex]:null,readiness=isAdd?null:entryReadiness(st,c,p),entryDecision=isAdd?(trendEntryEligible(c)&&opportunityLane(c)&&scalePositionEligible(existing,c,p)?'STANDARD_SCALE':'BLOCK'):(readiness?.ready?readiness.mode:'BLOCK');if(entryDecision==='BLOCK')return{placed:false,reason:isAdd?'SCALE_WINNER_CONFIRMATION_NOT_READY':(readiness?.reason||'ENTRY_SIGNAL_NOT_READY'),readiness};const h=await signer({op:'health'});"
          rep(old,new,'PLACEBUY_USES_UNIFIED_READINESS')

          old="if(!pos.weakSince)pos.weakSince=null;if(!pos.lastWeakCountAt)pos.lastWeakCountAt=null;if(!pos.severeBreakSince)pos.severeBreakSince=null;if(!pos.lowLiquiditySince)pos.lowLiquiditySince=null;if(!pos.lossSince)pos.lossSince=null;if(!pos.previewDegradedUntil)pos.previewDegradedUntil=null;if(!Number.isFinite(Number(pos.runnerProtectStage)))pos.runnerProtectStage=0;if(!Number.isFinite(Number(pos.concentrationTrimCount)))pos.concentrationTrimCount=0;if(!pos.lastConcentrationTrimAt)pos.lastConcentrationTrimAt=null;"
          new=old+"if(!pos.lastCapitalReleaseAt)pos.lastCapitalReleaseAt=null;if(pos.scaleInLockedAfterProfit&&n(pos.concentrationTrimCount)>0&&!pos.tp1Done&&!pos.tp2Done&&!pos.tp3Done&&!pos.profitProtectDone&&n(pos.runnerProtectStage)<1&&n(pos.peakReturnPct)<4){pos.scaleInLockedAfterProfit=false;pos.lastCapitalReleaseAt=pos.lastCapitalReleaseAt||pos.lastConcentrationTrimAt||null;}"
          rep(old,new,'MIGRATE_FALSE_PROFIT_LOCKS')

