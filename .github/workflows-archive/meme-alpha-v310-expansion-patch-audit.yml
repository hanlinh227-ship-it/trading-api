name: Meme Alpha v3.10 Expansion Patch Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v310-expansion-patch-audit.sh'
      - '.github/workflows/meme-alpha-v310-expansion-patch-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect scanner discovery and capital hot paths
        run: bash ops/meme-alpha/v310-expansion-patch-audit.sh
