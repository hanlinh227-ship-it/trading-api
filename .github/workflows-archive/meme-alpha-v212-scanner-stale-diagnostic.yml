name: Meme Alpha v2.12 Scanner Stale Diagnostic
on:
  push:
    paths:
      - 'ops/meme-alpha/v212-scanner-stale-diagnostic.sh'
      - '.github/workflows/meme-alpha-v212-scanner-stale-diagnostic.yml'
  workflow_dispatch:

jobs:
  diag:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v212-scanner-stale-diagnostic.sh
