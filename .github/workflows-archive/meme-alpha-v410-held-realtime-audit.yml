name: Meme Alpha V410C Held Pair Resolver Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v410-held-realtime-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - name: Verify trusted DEX pair fallback for held positions
        shell: bash
        run: |
          set -euo pipefail
          RT=/opt/meme-alpha/app/runtime-status
          python3 - <<'PY'
          import json,pathlib,subprocess,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          obs=json.loads((rt/'portfolio-observability.json').read_text()); held=obs.get('positionMints') or []
          cache=json.loads((rt/'mint-pair-cache.json').read_text()); known={x.get('mint') for x in cache.get('entries',[]) if isinstance(x,dict) and x.get('pair')}
          unresolved=[m for m in held if m not in known]
          print('UNRESOLVED_COUNT',len(unresolved))
          for mint in unresolved:
            url=f'https://api.dexscreener.com/latest/dex/tokens/{mint}'
            try:
              p=subprocess.run(['curl','-fsSL','--max-time','8',url],capture_output=True,text=True,timeout=10)
              if p.returncode: print({'mint':mint,'http':'FAIL','stderr':p.stderr[-120:]}); continue
              j=json.loads(p.stdout); pairs=[]
              for x in j.get('pairs') or []:
                if x.get('chainId')!='solana': continue
                b=(x.get('baseToken') or {}).get('address'); q=(x.get('quoteToken') or {}).get('address')
                if mint not in (b,q): continue
                pa=x.get('pairAddress'); liq=float((x.get('liquidity') or {}).get('usd') or 0); vol=float((x.get('volume') or {}).get('h24') or 0); dex=x.get('dexId')
                if pa: pairs.append((liq,vol,pa,dex,b,q))
              pairs.sort(reverse=True)
              print({'mint':mint,'pairCount':len(pairs),'best':pairs[0] if pairs else None,'top3':pairs[:3]})
            except Exception as e: print({'mint':mint,'error':repr(e)})
            time.sleep(.3)
          PY
          echo V410C_HELD_PAIR_RESOLVER_AUDIT=COMPLETE
