name: Meme Alpha v3.01 Scanner Freshness Autotune
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v301-scanner-freshness-autotune.sh'
      - '.github/workflows/meme-alpha-v301-scanner-freshness-autotune.yml'
  workflow_dispatch:

jobs:
  autotune:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Autotune scanner freshness with fail-safe rollback
        run: bash ops/meme-alpha/v301-scanner-freshness-autotune.sh
