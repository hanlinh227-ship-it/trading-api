name: Meme Alpha v3.04 Cycle5 Live Gate Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v304-cycle5-live-gate-audit.sh'
      - '.github/workflows/meme-alpha-v304-cycle5-live-gate-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Audit cycle5 bottleneck and live gate
        run: bash ops/meme-alpha/v304-cycle5-live-gate-audit.sh
