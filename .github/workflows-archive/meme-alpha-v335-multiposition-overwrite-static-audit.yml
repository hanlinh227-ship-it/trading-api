name: Meme Alpha v3.35 Multi Position Overwrite Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v335-multiposition-overwrite-static-audit.sh'
      - '.github/workflows/meme-alpha-v335-multiposition-overwrite-static-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Audit production executor overwrite safety
        run: bash ops/meme-alpha/v335-multiposition-overwrite-static-audit.sh
