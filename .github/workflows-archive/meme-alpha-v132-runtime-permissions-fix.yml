name: Meme Alpha v1.3.2 Runtime Permission Fix
on:
  push:
    paths:
      - 'ops/meme-alpha/v132-runtime-permissions-fix.sh'
      - '.github/workflows/meme-alpha-v132-runtime-permissions-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-alpha-v132
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Fix runtime ownership and verify v1.3 soak
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v132-runtime-permissions-fix.sh
          nice -n 15 bash ops/meme-alpha/v132-runtime-permissions-fix.sh
