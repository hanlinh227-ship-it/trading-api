name: Meme Alpha V416E Postwarmup Verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v416e-postwarmup-verify.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Verify V416 after source warmup
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; sleep 45
          EXPECT=ccb729c9bbec72eeb1313199ee00b1f287d157c3337577dd1606aecfa1427624
          echo PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1||true)
          echo COUNT=$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js'||true)
          echo EXEC_SHA=$(sha256sum "$APP/src/micro-live-executor.js"|awk '{print $1}')
          test "$(sha256sum "$APP/src/micro-live-executor.js"|awk '{print $1}')" = "$EXPECT"
          [ "$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js'||true)" -eq 1 ]
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$svc"; systemctl is-active "$svc"; done
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          def load(n):
            p=rt/n; return json.loads(p.read_text()),round(time.time()-p.stat().st_mtime,2)
          g,ga=load('micro-live-gate.json'); co,ca=load('capital-observability.json'); al,aa=load('allocator-status.json'); rp,ra=load('realtime-pool-pulse.json'); po,pa=load('portfolio-observability.json'); s,sa=load('signal-snapshot.json'); tr,ta=load('trend-pulse.json')
          print('GATE_AGE',ga,{k:g.get(k) for k in ['allowed','armOk','armAttested','sourceHealthy','riskEntryAllowed','liveRiskReady','scaleAllowed','reasons']})
          print('CAPITAL_AGE',ca,{k:co.get(k) for k in ['walletSol','investedSol','deployableSol','reserveSol','openPositions','scaleAllowed']})
          print('ALLOC_AGE',aa,{k:al.get(k) for k in ['action','reason','symbol','targetSymbol','openPositions','scaleAllowed']})
          print('REALTIME_AGE',ra,{k:rp.get(k) for k in ['status','heldTotal','heldResolved','heldUnresolved','heldCoveragePct','heldSubscriptions','activeSetSize','lastError']})
          print('PORTFOLIO_AGE',pa,{k:po.get(k) for k in ['openPositions','stateReadable','positionMints']})
          print('SIGNAL_AGE',sa,'COUNT',len(s.get('candidates') or []),'INTEL',s.get('intelSummary'))
          rows=tr.get('rows') or []; print('TREND_AGE',ta,'VERSION',tr.get('version'),'ROWS',len(rows),'PRE',sum(x.get('status')=='PREBREAKOUT' for x in rows),'BREAK',sum(x.get('status')=='BREAKOUT' for x in rows),'RISING',sum(x.get('flowRiseConfirmed') is True for x in rows))
          le=rt/'last-execution.json'
          if le.exists(): print('LAST_EXEC_AGE',round(time.time()-le.stat().st_mtime,2),'LAST_EXEC',json.loads(le.read_text()))
          assert g.get('allowed') is True and g.get('armOk') is True and g.get('armAttested') is True and g.get('sourceHealthy') is True and g.get('riskEntryAllowed') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True
          assert rp.get('status')=='HEALTHY' and int(rp.get('heldUnresolved') or 0)==0 and int(rp.get('heldSubscriptions') or 0)>=int(rp.get('heldTotal') or 0)
          assert po.get('stateReadable') is True
          PY
          echo V416_POSTWARMUP=PASS
