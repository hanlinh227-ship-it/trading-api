name: Meme Alpha v1.1.1 Reactive Orchestration

on:
  push:
    paths:
      - 'ops/meme-alpha/v111-reactive-orchestration.sh'
      - '.github/workflows/meme-alpha-v111-reactive-orchestration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-alpha-v111-reactive-orchestration
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Meme Alpha v1.1.1 reactive orchestration
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v111-reactive-orchestration.sh
          nice -n 15 bash ops/meme-alpha/v111-reactive-orchestration.sh
