name: Meme Alpha v3.54 Runtime Integrity Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v354-runtime-integrity-audit.sh'
      - '.github/workflows/meme-alpha-v354-runtime-integrity-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Audit runtime integrity
        run: bash ops/meme-alpha/v354-runtime-integrity-audit.sh
