name: Meme Alpha v2.16 Fast Pipeline
on:
  push:
    paths:
      - 'ops/meme-alpha/v216-stage-fast-pipeline.sh'
      - 'ops/meme-alpha/v216-root-apply-fast-pipeline.sh'
      - '.github/workflows/meme-alpha-v216-fast-pipeline.yml'
  workflow_dispatch:

jobs:
  stage:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v216-stage-fast-pipeline.sh
