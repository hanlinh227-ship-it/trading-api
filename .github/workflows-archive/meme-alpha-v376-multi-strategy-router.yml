name: Meme Alpha v3.76 Multi Strategy Router
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v376-safe-signal-multi-strategy-router.js'
      - 'ops/meme-alpha/v376-stage-multi-strategy-router.sh'
      - '.github/workflows/meme-alpha-v376-multi-strategy-router.yml'
concurrency:
  group: meme-alpha-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Stage and self-test
        run: bash ops/meme-alpha/v376-stage-multi-strategy-router.sh
      - name: Safe deploy multi-strategy signal router
        shell: bash
        run: |
          set -euo pipefail
          STAGE=/opt/meme-alpha/app/runtime-status/v376-router-stage
          NAME=$(cat "$STAGE/deploy-name.txt")
          SHA=$(cat "$STAGE/signal.sha256")
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal "$NAME" "$SHA"
      - name: Wait for live gate recovery
        shell: bash
        run: |
          set -euo pipefail
          G=/opt/meme-alpha/app/runtime-status/micro-live-gate.json
          for i in $(seq 1 44); do
            if /usr/bin/node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));process.exit(x.allowed===true?0:1)" "$G" 2>/dev/null; then
              echo V376_GATE_RECOVERED_AFTER_SEC=$((i*5))
              exit 0
            fi
            sleep 5
          done
          echo V376_GATE_RECOVERY_TIMEOUT=TRUE
          cat "$G" 2>/dev/null || true
          exit 1
      - name: Production audit
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          STAGE="$APP/runtime-status/v376-router-stage"
          EXPECT=$(cat "$STAGE/signal.sha256")
          ACT=$(sha256sum "$APP/src/safe-signal-export.js" | awk '{print $1}')
          echo EXPECTED_SIGNAL_SHA="$EXPECT"
          echo ACTIVE_SIGNAL_SHA="$ACT"
          [ "$ACT" = "$EXPECT" ]
          for svc in meme-alpha-paper meme-alpha-micro-live meme-alpha-realtime-pulse meme-alpha-signer meme-alpha-trend-pulse meme-alpha-whale-flow; do systemctl is-active --quiet "$svc.service"; done
          /usr/bin/node - "$APP/runtime-status/signal-snapshot.json" "$APP/runtime-status/micro-live-gate.json" "$APP/runtime-status/realtime-pool-pulse.json" "$APP/runtime-status/portfolio-observability.json" <<'NODE'
          const fs=require('fs');
          const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const g=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const r=JSON.parse(fs.readFileSync(process.argv[4],'utf8'));
          const p=JSON.parse(fs.readFileSync(process.argv[5],'utf8'));
          if(s.version!=='3.76.0-multi-strategy-router')throw new Error('SIGNAL_VERSION_NOT_V376');
          if(!Array.isArray(s.candidates)||!s.intelSummary||!s.marketRegime)throw new Error('V376_SIGNAL_SCHEMA_INVALID');
          if(g.allowed!==true||g.signer?.ok!==true||g.signer?.signingEnabled!==true)throw new Error('MICRO_LIVE_GATE_NOT_READY');
          if(r.version!=='3.74.0-held-continuity'||r.status!=='HEALTHY')throw new Error('V374_REALTIME_NOT_HEALTHY');
          if(p.stateReadable!==true)throw new Error('PORTFOLIO_STATE_NOT_READABLE');
          const imp=c=>Math.abs(Number(c.sellPriceImpactPct??c.sellImpactPct??c.priceImpactPct??99));
          const probes=s.candidates.filter(c=>c.decision==='PROBE_CANDIDATE');
          const unsafe=probes.filter(c=>(c.hardReject||[]).length||c.universeClass!=='MEME_CONFIRMED'||c.securityDecision!=='PASS'||c.holderClusterDecision!=='PASS'||c.token2022===true||c.sellRoute!==true||Number(c.liquidityUsd)<50000||imp(c)>1.25);
          if(unsafe.length)throw new Error('V376_UNSAFE_PROBE_LEAK');
          const down=probes.filter(c=>c.intelMode==='BOTH_FEEDS_DOWN');if(down.length)throw new Error('V376_BOTH_FEEDS_DOWN_ENTRY_LEAK');
          const lanes=['LAUNCH_FAST','MOMENTUM','RECOVERY_FLOW','ESTABLISHED_ROTATION'];
          const badLane=probes.filter(c=>c.entryGuardReasons?.some(x=>String(x).startsWith('V376_ROUTED_'))&&!lanes.includes(c.strategyRouter?.selectedLane));if(badLane.length)throw new Error('V376_ROUTER_LANE_INVALID');
          console.log('SIGNAL_CANDIDATES='+s.candidates.length);
          console.log('PROBE_CANDIDATES='+probes.length);
          console.log('ROUTED_CANDIDATES='+Number(s.intelSummary.routedCandidates||0));
          console.log('MARKET_REGIME='+s.marketRegime.name);
          console.log('LANE_SUMMARY='+JSON.stringify(s.intelSummary.lanes||{}));
          console.log('MICRO_LIVE_GATE_ALLOWED='+g.allowed);
          console.log('REALTIME_FAST_SUBSCRIPTIONS='+Number(r.fastSubscriptions||0));
          console.log('OPEN_POSITIONS='+Number(p.openPositions||0));
          NODE
          grep -q '3.60.0-profit-aware-exits' "$APP/src/micro-live-executor.js"
          grep -q 'FAST_DISCOVERY_V372' "$APP/src/new-listing-radar.js"
          grep -q 'FAST_DISCOVERY_V372_MERGE' "$APP/src/scanner.js"
          echo V376_LAUNCH_FAST=ACTIVE
          echo V376_MOMENTUM=ACTIVE
          echo V376_RECOVERY_FLOW=ACTIVE
          echo V376_ESTABLISHED_ROTATION=ACTIVE
          echo V376_MARKET_REGIME_ROUTER=ACTIVE
          echo V376_HARD_SECURITY_GUARDS=PRESERVED
          echo V376_SELLABILITY_GUARD=PRESERVED
          echo V376_V374_HELD_CONTINUITY=PRESERVED
          echo V376_V360_PROFIT_AWARE_EXECUTOR=PRESERVED
          echo V376_NO_POSITION_LIMIT_INCREASE=TRUE
          echo V376_MULTI_STRATEGY_ROUTER_PRODUCTION_ACTIVE=TRUE
