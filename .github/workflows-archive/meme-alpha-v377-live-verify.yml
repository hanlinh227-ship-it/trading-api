name: Meme Alpha V377 Live Verify

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v377-live-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify production state without secrets
        shell: bash
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/meme-alpha-runtime/V377-LIVE.md"
          ROOT=/opt/trading/trading-api
          APP=/opt/meme-alpha/app
          SIGNER=/opt/meme-alpha-signer/ready_signer.py
          EXPECT=400bb05a43b1f79d8cca902335f5cc044c9533bf
          HEAD="$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          if [[ "$HEAD" == "$EXPECT" ]]; then SYNC=true; else SYNC=false; fi
          if [[ -x "$ROOT/auto-futures-v1/runtime/deploy_meme_alpha_v377.sh" ]]; then HOOK=true; else HOOK=false; fi
          if grep -q '3.77.0-objective-insider-risk' "$APP/src/safe-signal-export.js" 2>/dev/null \
             && grep -q 'function insiderSafe(c)' "$APP/src/micro-live-executor.js" 2>/dev/null \
             && grep -q 'def objective_insider_ok(c):' "$SIGNER" 2>/dev/null \
             && grep -q "'version':'8.0'" "$SIGNER" 2>/dev/null; then LIVE=true; else LIVE=false; fi
          if [[ -f /var/lib/meme-alpha/deploy-v377-maintenance.json ]]; then MAINT=true; else MAINT=false; fi
          if [[ -f "$APP/runtime-status/v377-deployed.json" ]]; then MARKER=true; else MARKER=false; fi
          PAPER="$(systemctl is-active meme-alpha-paper.service 2>/dev/null || echo unknown)"
          MICRO="$(systemctl is-active meme-alpha-micro-live.service 2>/dev/null || echo unknown)"
          SIG="$(systemctl is-active meme-alpha-signer.service 2>/dev/null || echo unknown)"
          cat > "$OUT" <<EOF
          # Meme Alpha V377 Production Verify

          - updater_synced_to_v377_hook_commit: \`$SYNC\`
          - root_deploy_hook_present: \`$HOOK\`
          - objective_insider_hardening_live: \`$LIVE\`
          - deployment_marker_present: \`$MARKER\`
          - maintenance_drain_active: \`$MAINT\`
          - paper_service: \`$PAPER\`
          - micro_live_service: \`$MICRO\`
          - signer_service: \`$SIG\`
          - checked_at_utc: \`$(date -u +%FT%TZ)\`
          EOF
      - name: Commit verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "meme-alpha-vps-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add meme-alpha-runtime/V377-LIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(meme): record v377 production verification"
          git push origin HEAD:main
