name: Meme Alpha V429 Residual Degradation Audit
on:
  push:
    paths:
      - '.github/workflows/meme-alpha-v429-residual-degradation-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    steps:
      - name: Inspect residual realtime rate-limit and idle-capital degradation
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; DATA=/var/lib/meme-alpha/data/micro-live
          echo '=== SERVICE EXECSTART ==='
          for svc in meme-alpha-realtime-pulse.service meme-alpha-micro-live.service meme-alpha-signer.service; do
            echo ---$svc---; systemctl show "$svc" -p MainPID -p ExecStart -p ExecMainStartTimestamp -p User -p Group --no-pager
          done
          echo '=== REALTIME FULL SNAPSHOT ==='
          cat "$RT/realtime-pool-pulse.json" || true
          echo '=== CAPITAL/ALLOCATOR ==='
          cat "$RT/capital-observability.json" || true
          cat "$RT/allocator-status.json" || true
          echo '=== SOURCES MATCHING REALTIME/PENDING/MEMORY FALLBACK ==='
          grep -RniE 'pendingTimeouts|memoryFallback|heldCoverage|DEXSCREENER_HELD_RESOLVE|lastEventAgeMs|pending.*timeout' "$APP/src" 2>/dev/null | head -260 || true
          echo '=== RATE LIMIT / BACKOFF SOURCE ==='
          grep -nE 'exitPreviewRateLimits|exitPreviewBackoff|429|rate.limit|previewDegraded|urgentLifecycle' "$APP/src/micro-live-executor.js" | head -180 || true
          echo '=== RECENT 429 / TIMEOUT / FALLBACK EVENTS ==='
          journalctl --since '60 minutes ago' -u meme-alpha-realtime-pulse.service -u meme-alpha-micro-live.service -u meme-alpha-signer.service --no-pager 2>/dev/null | grep -Ei '429|rate.?limit|timeout|fallback|reconnect|error|fail' | tail -260 || true
          echo '=== RUNTIME FILES POTENTIALLY RELEVANT ==='
          find "$RT" -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %f\n' | sort | tail -100
          echo V429_RESIDUAL_DEGRADATION_AUDIT=PASS
