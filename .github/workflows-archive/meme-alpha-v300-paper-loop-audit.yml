name: Meme Alpha v3.00 Paper Loop Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v300-paper-loop-audit.sh'
      - '.github/workflows/meme-alpha-v300-paper-loop-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Audit paper scanner loop timing
        run: bash ops/meme-alpha/v300-paper-loop-audit.sh
