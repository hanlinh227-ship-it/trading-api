name: Meme Alpha V385 Coverage Monitor (Legacy Manual Only)

# Historical read-only monitor. It previously ran on pushes and could report false
# failures during expected source-health warm-up, while also competing for the
# self-hosted trading runner. Keep it manual-only; production stack is V412B/V413C.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-monitor:
    runs-on: self-hosted
    timeout-minutes: 1
    steps:
      - name: Legacy monitor retired from automatic runs
        shell: bash
        run: |
          set -euo pipefail
          echo LEGACY_AUTO_MONITOR_DISABLED=TRUE
          echo OBSOLETE_MONITOR=V385
          echo CURRENT_REALTIME=V412B
          echo CURRENT_PREBREAKOUT=V413C
          echo PRODUCTION_MUTATION=FALSE
