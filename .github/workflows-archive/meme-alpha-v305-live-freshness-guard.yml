name: Meme Alpha v3.05 Live Freshness Guard
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v305-live-freshness-guard.sh'
      - '.github/workflows/meme-alpha-v305-live-freshness-guard.yml'
  workflow_dispatch:

jobs:
  activate:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Activate fail-closed live freshness guard
        run: bash ops/meme-alpha/v305-live-freshness-guard.sh
