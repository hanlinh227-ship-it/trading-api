name: Meme Alpha v2.99 Runtime Discovery
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v299-runtime-discovery.sh'
      - '.github/workflows/meme-alpha-v299-runtime-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Discover Meme Alpha runtime safely
        run: bash ops/meme-alpha/v299-runtime-discovery.sh
