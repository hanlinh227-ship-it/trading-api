name: Meme Alpha v1.4.3 Runtime Diagnostic
on:
  push:
    paths:
      - 'ops/meme-alpha/v143-diagnose-runtime.sh'
      - '.github/workflows/meme-alpha-v143-diagnose-runtime.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v143-diagnose-runtime.sh
          bash ops/meme-alpha/v143-diagnose-runtime.sh
