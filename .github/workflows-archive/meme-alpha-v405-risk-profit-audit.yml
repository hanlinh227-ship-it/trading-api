name: Meme Alpha V405 Risk Profit Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v405-risk-profit-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect exact profit plan and exit timing
        shell: bash
        run: |
          set -euo pipefail
          EXE=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== CORE RISK/PROFIT LOGIC LINES 85-130 ==='
          sed -n '85,130p' "$EXE"
          echo '=== MANAGE / ROTATION LINES 220-290 ==='
          sed -n '220,290p' "$EXE"
          echo '=== TOP CONSTANTS / POLICY READER ==='
          sed -n '1,48p' "$EXE"
          echo '=== CURRENT EXECUTOR SHA ==='
          sha256sum "$EXE"
          echo V405_PROFIT_PLAN_DETAIL=COMPLETE
