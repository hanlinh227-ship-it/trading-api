name: Run SignalHub V3.10 Disciplined Book

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-signalhub-v310-disciplined-book.yml']

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-v310-disciplined-book
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V3.10 disciplined book patch
        run: python3 scripts/patch_signalhub_v310_disciplined_book.py

      - name: Verify source policy
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text()
          g=Path('signalhub-android/app/build.gradle').read_text()
          for x in [
            'SIGNALHUB-V3-GATEWAY-3.10.0','HARD_STRUCTURE_CHECKS_NO_NUMERIC_SCORE',
            'maxActiveTotal:6','maxActivePerMarket:4','maxActivePerStyle:3','maxNewPerScan:2',
            'oneActivePerSymbolAcrossStyles:true','activeAnyPointer','V310-${market}-${style}',
            'REPLACED_BY_V310_DISCIPLINED_BOOK','entryAssessment:assessment'
          ]: assert x in w,x
          assert 'APP_VERSION="3.10.0"' in a
          assert "versionName '3.10.0'" in g
          print('V310_SOURCE_OK')
          PY

      - name: Validate worker
        run: npx --yes wrangler@latest deploy --dry-run --config signalhub-worker/wrangler.jsonc --outdir /tmp/v310-worker

      - name: Deploy V3.10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config signalhub-worker/wrangler.jsonc

      - name: Wait for production V3.10
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 40); do
            if curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" >/tmp/status.json; then
              if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.10.0'
          q=p.get('decisionPolicy') or {}; pp=q.get('portfolioPolicy') or {}
          assert pp.get('maxActiveTotal')==6 and pp.get('maxActivePerMarket')==4 and pp.get('maxActivePerStyle')==3 and pp.get('maxNewPerScan')==2
          assert pp.get('oneActivePerSymbolAcrossStyles') is True
          PY
              then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1

      - name: Migrate old book and exercise all four engines
        run: |
          set -euo pipefail
          : >/tmp/engine-summary.txt
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              ok=0
              for n in $(seq 1 10); do
                if curl -fsS --max-time 90 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/scan?market=$m&style=$s&probe=$RANDOM-$n" >/tmp/scan.json; then
                  if M="$m" S="$s" python3 - <<'PY'
          import json,os
          p=json.load(open('/tmp/scan.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.10.0',p.get('version')
          pp=p.get('portfolioPolicy') or {}
          assert pp.get('maxActiveTotal')==6 and pp.get('maxNewPerScan')==2,pp
          assert int(p.get('created') or 0)<=2,p
          for x in p.get('topAnalyses',[]):
              ea=x.get('entryAssessment') or {}
              assert ea.get('verdict')=='PASS',x
              assert ea.get('method')=='HARD_STRUCTURE_CHECKS_NO_NUMERIC_SCORE',ea
              checks=ea.get('checks') or {}; assert checks and all(checks.values()),checks
          print(os.environ['M'],os.environ['S'],'evaluated',p.get('evaluated'),'pass',p.get('actionable'),'created',p.get('created'),'blocked',p.get('portfolioBlocked'))
          PY
                  then ok=1; break; fi
                fi
                sleep 2
              done
              test "$ok" = 1
              cat /tmp/scan.json | python3 -c "import json,sys; p=json.load(sys.stdin); print('$m $s',p.get('evaluated'),p.get('actionable'),p.get('created'),p.get('portfolioBlocked'))" >>/tmp/engine-summary.txt
            done
          done
          cat /tmp/engine-summary.txt

      - name: Verify disciplined active book in production
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,os
          base=os.environ['SIGNALHUB_URL']
          allsig=[]
          for m in ('FOREX','CRYPTO'):
            for s in ('SCALP','SWING'):
              u=f'{base}/v3/signals?market={m}&style={s}&status=active&limit=200&probe={m}-{s}'
              with urllib.request.urlopen(u,timeout=30) as r:p=json.load(r)
              assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.10.0',p.get('version')
              for x in p.get('signals',[]):
                if x.get('status') in ('OPEN','PENDING'): allsig.append(x)
          print('ACTIVE_TOTAL',len(allsig))
          assert len(allsig)<=6,[(x.get('market'),x.get('style'),x.get('symbol')) for x in allsig]
          for m in ('FOREX','CRYPTO'): assert sum(x.get('market')==m for x in allsig)<=4
          for s in ('SCALP','SWING'): assert sum(x.get('style')==s for x in allsig)<=3
          keys=[(x.get('market'),x.get('symbol')) for x in allsig]
          assert len(keys)==len(set(keys)),keys
          for x in allsig:
            assert x.get('engineVersion')=='SIGNALHUB-V3-GATEWAY-3.10.0',x
            ea=x.get('entryAssessment') or {}; assert ea.get('verdict')=='PASS',x
          open('/tmp/active-book.json','w').write(json.dumps(allsig,indent=2))
          print('UNIQUE_SYMBOLS',len(set(keys)))
          PY

      - name: Verify realtime Forex source
        run: |
          curl -fsS --max-time 25 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/forex/live?probe=$RANDOM" >/tmp/live.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/live.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.10.0'
          assert p.get('transport')=='DURABLE_OBJECT_REALTIME'
          assert p.get('count',0)>=30
          print('FOREX_LIVE',p.get('state'),'age',p.get('quoteAgeMs'),'count',p.get('count'))
          PY

      - name: Build Android APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
          mkdir -p dist
          cp "$APK" dist/SignalHub-v3.10.0-Disciplined-Book.apk
          sha256sum dist/SignalHub-v3.10.0-Disciplined-Book.apk > dist/SHA256SUMS.txt
          cp /tmp/engine-summary.txt dist/ENGINE-SUMMARY.txt
          cp /tmp/active-book.json dist/ACTIVE-BOOK-AUDIT.json

      - name: Commit generated V3.10 source
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java
          git commit -m "SignalHub v3.10 disciplined active book" || true
          git push origin HEAD:signalhub-v310-disciplined-book

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.10.0-Disciplined-Book
          path: dist/
          retention-days: 30

      - name: Publish V3.10 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='signalhub-v3.10.0-disciplined-book'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target signalhub-v310-disciplined-book --prerelease --title 'SignalHub v3.10.0 Disciplined Book' --notes 'Every order must pass explicit hard structure checks. Max 6 active total, 4 per market, 3 per style, max 2 new per scan, and one active idea per symbol across SCALP/SWING. No numeric score/time/RR admission gate. Old active signal-feed entries are retired without broker actions.'
          fi
