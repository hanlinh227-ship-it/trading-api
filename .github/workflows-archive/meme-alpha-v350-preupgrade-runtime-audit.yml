name: Meme Alpha v3.50 Preupgrade Runtime Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v350-preupgrade-runtime-audit.sh'
      - '.github/workflows/meme-alpha-v350-preupgrade-runtime-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Audit runtime topology
        run: bash ops/meme-alpha/v350-preupgrade-runtime-audit.sh
