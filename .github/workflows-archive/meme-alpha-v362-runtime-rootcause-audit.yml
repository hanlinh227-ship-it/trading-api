name: Meme Alpha v3.62 Runtime Rootcause Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v362-runtime-rootcause-audit.sh'
      - '.github/workflows/meme-alpha-v362-runtime-rootcause-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose deploy boundary and source health
        run: bash ops/meme-alpha/v362-runtime-rootcause-audit.sh
