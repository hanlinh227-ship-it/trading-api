name: Meme Alpha v3.23 Runtime Account Conflict Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v323-runtime-account-conflict-audit.sh'
      - '.github/workflows/meme-alpha-v323-runtime-account-conflict-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Read-only runtime, account and conflict audit
        run: bash ops/meme-alpha/v323-runtime-account-conflict-audit.sh
