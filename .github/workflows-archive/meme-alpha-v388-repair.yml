name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect live idle-cash allocation path
        shell: bash
        run: |
          set -euo pipefail
          SRC=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== CORE FUNCTIONS ==='
          grep -nE '^function (coreSafe|hardSafetyBroken|trendEntryEligible|bestCandidate|rank|allocationProfile|targetPlan)|^async function (maybeScaleIn|maybeRotate|tick|placeBuy)' "$SRC" || true
          echo '=== BEST CANDIDATE AREA ==='
          n=$(grep -n 'function bestCandidate' "$SRC" | head -1 | cut -d: -f1 || true); if [ -n "$n" ]; then sed -n "$((n-15)),$((n+55))p" "$SRC"; fi
          echo '=== TICK AREA ==='
          n=$(grep -n '^async function tick' "$SRC" | head -1 | cut -d: -f1 || true); if [ -n "$n" ]; then sed -n "$((n-20)),$((n+85))p" "$SRC"; fi
          echo '=== SAFETY AREA ==='
          n=$(grep -n 'function trendEntryEligible' "$SRC" | head -1 | cut -d: -f1 || true); if [ -n "$n" ]; then sed -n "$((n-25)),$((n+45))p" "$SRC"; fi
          echo V388_IDLE_CASH_INSPECT=COMPLETE
