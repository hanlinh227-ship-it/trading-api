name: Meme Alpha v1.5.1 Schema Audit
on:
  push:
    paths:
      - 'ops/meme-alpha/v151-schema-audit.sh'
      - '.github/workflows/meme-alpha-v151-schema-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Inspect runtime schemas
        run: bash ops/meme-alpha/v151-schema-audit.sh
