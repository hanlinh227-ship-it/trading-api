name: Meme Alpha v1.4.1 Runner Isolation Verify
on:
  push:
    paths:
      - 'ops/meme-alpha/v141-runner-isolation-verify.sh'
      - '.github/workflows/meme-alpha-v141-runner-isolation-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify non-root runner isolation
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v141-runner-isolation-verify.sh
          bash ops/meme-alpha/v141-runner-isolation-verify.sh
