name: Meme Alpha v2.10 Runtime Smart Exit Audit
on:
  push:
    paths:
      - 'ops/meme-alpha/v211-runtime-smart-exit-audit.sh'
      - '.github/workflows/meme-alpha-v211-runtime-smart-exit-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v211-runtime-smart-exit-audit.sh
