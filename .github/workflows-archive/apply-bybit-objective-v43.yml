name: Apply Bybit Objective V4.3

on:
  push:
    paths:
      - '.github/bybit-objective-v43-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-objective-v43
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V4.3 objective entry hold leverage rebalance
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/apply-bybit-objective-v43.py
          python3 -m py_compile bybit-live-bridge/bybit_live_bridge.py
          cd cloudflare-worker
          node --check bybit-auto-config.js
          node --check bybit-symbol-strategy.js
          node --check bybit-symbol-engine.js
          node --check bybit-runtime-contract.js
          node validate-btc-hyperscale.mjs
      - name: Commit validated V4.3 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker bybit-live-bridge
          git commit -m 'Rebalance Bybit entry hold and adaptive leverage V4.3'
          git pull --rebase origin main
          git push origin HEAD:main
