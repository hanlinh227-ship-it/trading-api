name: Meme Alpha V430 Expectancy Readonly Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v430-expectancy-readonly-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Read current profitability and scale-up logic
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          RT="$APP/runtime-status"
          E="$APP/src/micro-live-executor.js"
          echo '=== IDENTITY ==='
          sha256sum "$E"
          node --check "$E"
          OUT=$(node "$E" --self-test)
          grep -E 'V428_|V429_|HARD_SECURITY|SCALE_ALLOWED' <<<"$OUT" || true
          echo '=== SERVICES ==='
          pgrep -af '/opt/meme-alpha/app/src/micro-live-executor.js' || true
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do echo "$svc=$(systemctl is-active "$svc" || true)"; done
          echo '=== RUNTIME SNAPSHOTS ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          names=['micro-live-gate.json','portfolio-observability.json','allocator-status.json','realtime-pool-pulse.json','micro-live-status.json','learning-status.json','capital-observability.json']
          for name in names:
            p=rt/name
            print(f'--- {name} exists={p.exists()} ageSec={(time.time()-p.stat().st_mtime) if p.exists() else None}')
            if not p.exists(): continue
            try:
              x=json.loads(p.read_text())
              print(json.dumps(x,ensure_ascii=False)[:18000])
            except Exception as e: print('READ_ERROR',repr(e))
          PY
          echo '=== SOURCE TARGETS ==='
          python3 - "$E" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          keys=['function allocationProfile','function pumpScaleEligible','function scalePositionEligible','function concentrationReleaseSource','function proactiveRotationEligible','function rotationSource','function signerCompatible','function previewExitReturn','learningClosed','learningWins','meanReturn','entryMode','opportunityScore','scaleAllowed:true']
          for key in keys:
            print('\n### KEY',key)
            start=0; hit=0
            while True:
              i=s.find(key,start)
              if i<0: break
              hit+=1
              a=max(0,i-1400); b=min(len(s),i+5000)
              print(s[a:b])
              start=i+len(key)
              if hit>=4: break
            print('HITS',hit)
          PY
          echo '=== RECENT EVENTS/LOG-LIKE RUNTIME FILES ==='
          find "$RT" -maxdepth 1 -type f -printf '%T@ %f\n' | sort -nr | head -40
          for f in "$RT"/*event* "$RT"/*trade* "$RT"/*position* "$RT"/*rotation* "$RT"/*execution*; do
            [ -f "$f" ] || continue
            echo "--- $f"
            tail -n 120 "$f" 2>/dev/null | tail -c 24000 || true
            echo
          done
          echo V430_READONLY_AUDIT=COMPLETE
