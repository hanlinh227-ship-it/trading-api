name: Apply Bybit Objective V4.3.1

on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-objective-v431-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-objective-v431
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V4.3.1 freshness fairness and portfolio fixes
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/apply-bybit-objective-v431.py
          cd cloudflare-worker
          node --check bybit-auto-config.js
          node --check bybit-symbol-strategy.js
          node --check bybit-symbol-engine.js
          node --check bybit-multi-asset-controller.js
          node --check bybit-runtime-contract.js
          node validate-btc-hyperscale.mjs
      - name: Commit validated V4.3.1 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker
          git commit -m 'Fix Bybit freshness entry fairness and protected risk V4.3.1'
          git pull --rebase origin main
          git push origin HEAD:main
