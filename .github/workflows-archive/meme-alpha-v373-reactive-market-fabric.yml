name: Meme Alpha v3.73 Reactive Market Fabric
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v373-realtime-reactive.js'
      - 'ops/meme-alpha/v373-stage-reactive-market-fabric.sh'
      - '.github/workflows/meme-alpha-v373-reactive-market-fabric.yml'
jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 12
    concurrency:
      group: meme-alpha-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - name: Stage and deterministic self-test
        run: bash ops/meme-alpha/v373-stage-reactive-market-fabric.sh
      - name: Safe deploy incremental realtime fabric
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          S="$APP/runtime-status/v373-reactive-market-fabric-stage"
          echo '--- portfolio before realtime deploy ---'
          cat "$S/portfolio-before.json" 2>/dev/null || true
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy realtime "$(cat "$S/realtime-name.txt")" "$(cat "$S/realtime.sha256")"
          sleep 20
      - name: Production compatibility and health audit
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-realtime-pulse.service meme-alpha-signer.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do
            V=$(systemctl is-active "$svc" || true); echo "$svc=$V"; [ "$V" = active ];
          done
          grep -q 'FAST_DISCOVERY_V372' "$APP/src/new-listing-radar.js"
          grep -q 'FAST_DISCOVERY_V372_MERGE' "$APP/src/scanner.js"
          grep -q 'DISCOVERY_RADAR_ONLY_MAX = 240' "$APP/src/scanner.js"
          grep -q '3.60.0-profit-aware-exits' "$APP/src/micro-live-executor.js"
          echo '--- realtime v373 ---'
          cat "$APP/runtime-status/realtime-pool-pulse.json"
          echo '--- signal guard ---'
          cat "$APP/runtime-status/signal-snapshot.json" 2>/dev/null || true
          echo '--- portfolio after realtime deploy ---'
          cat "$APP/runtime-status/portfolio-observability.json"
          /usr/bin/node - "$APP/runtime-status/realtime-pool-pulse.json" "$APP/runtime-status/signal-snapshot.json" "$APP/runtime-status/portfolio-observability.json" <<'NODE'
          const fs=require('fs');const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const rt=read(process.argv[2]),sig=read(process.argv[3]),obs=read(process.argv[4]);
          if(rt.version!=='3.73.0-reactive-fabric')throw new Error('REALTIME_V373_NOT_ACTIVE');
          if(rt.policy!=='INCREMENTAL_SUBSCRIPTIONS_NO_HOTSET_RECONNECT')throw new Error('INCREMENTAL_POLICY_MISSING');
          if(!['HEALTHY','CONNECTING','DEGRADED','RECONNECTING'].includes(rt.status))throw new Error('REALTIME_BAD_STATUS_'+rt.status);
          if(Number(rt.hotsetLimit)!==56)throw new Error('HOTSET_LIMIT_NOT_56');
          if(Number(rt.desiredRefreshMs)!==250||Number(rt.reconcileMs)!==100)throw new Error('REACTIVE_TIMING_MISMATCH');
          if(Number(rt.maxAddsPerTick)>8||Number(rt.maxRemovesPerTick)>8)throw new Error('UNBOUNDED_RECONCILE');
          if(rt.websocketOpen===true&&Number(rt.heartbeatAgeMs)>15000)throw new Error('RPC_HEARTBEAT_STALE');
          if(sig.version!=='3.69.1-modern-signal-guard')throw new Error('SIGNAL_GUARD_3691_NOT_PRESERVED');
          if(obs.stateReadable!==true||!Number.isFinite(Number(obs.openPositions)))throw new Error('PORTFOLIO_STATE_UNREADABLE');
          const leak=(sig.candidates||[]).filter(c=>c.intelMode==='BOTH_FEEDS_DOWN'&&c.decision==='PROBE_CANDIDATE');
          if(leak.length)throw new Error('INTEL_FAIL_CLOSED_LEAK');
          console.log('V373_REALTIME_STATUS='+rt.status);
          console.log('V373_ACTIVE_SUBSCRIPTIONS='+Number(rt.subscriptions||0));
          console.log('V373_DESIRED_SET='+Number(rt.desiredSetSize||0));
          console.log('V373_PENDING_SUBSCRIPTIONS='+Number(rt.pendingSubscriptions||0));
          console.log('V373_RECONNECT_COUNT='+Number(rt.reconnectCount||0));
          console.log('V373_HEARTBEAT_AGE_MS='+Number(rt.heartbeatAgeMs||0));
          console.log('V373_RECONCILE_DURATION_MS='+Number(rt.lastReconcileDurationMs||0));
          console.log('V373_WRITE_ERRORS='+Number(rt.writeErrors||0));
          console.log('V373_OPEN_POSITIONS='+Number(obs.openPositions));
          NODE
          echo V373_INCREMENTAL_SUBSCRIPTIONS=ACTIVE
          echo V373_HOTSET_CHANGE_RECONNECT=DISABLED
          echo V372_FAST_DISCOVERY=PRESERVED
          echo V3691_SIGNAL_GUARD=PRESERVED
          echo V360_PROFIT_AWARE_EXECUTOR=PRESERVED
          echo V373_REACTIVE_MARKET_FABRIC_PRODUCTION_ACTIVE=TRUE
# deploy-v373-20260906-0747
