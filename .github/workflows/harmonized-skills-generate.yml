name: Harmonized Skills Generate Artifacts

on:
  push:
    branches: ['brain/harmonized-skills-expansion']
    paths:
      - '.github/workflows/harmonized-skills-generate.yml'
      - 'AI_SKILL_LIBRARY/skills/catalog.yaml'
      - 'AI_SKILL_LIBRARY/v4/stable/**'
      - 'AI_SKILL_LIBRARY/v4/skills/**'
      - 'AI_SKILL_LIBRARY/v4/evergreen/**'

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, 'chore(brain): regenerate harmonized artifacts') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/harmonized-skills-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Generate retrieval index and immutable release metadata
        run: |
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.4.0 \
            --source harmonized_skills_expansion \
            --class feature
      - name: Verify generated artifacts before commit
        run: |
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --check
          python AI_SKILL_LIBRARY/v4/tools/release.py verify
      - name: Commit generated artifacts to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml AI_SKILL_LIBRARY/v4/releases
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore(brain): regenerate harmonized artifacts"
          git push origin HEAD:brain/harmonized-skills-expansion
