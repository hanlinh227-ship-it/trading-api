name: Tiny Calibration Extract
on:
  push:
    paths: ["tiny-request.json"]
permissions:
  contents: write
jobs:
  tiny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          python3 <<'PY'
          import json
          with open('data/calibration-blind.json',encoding='utf-8') as f:d=json.load(f)
          o={'cutoff':d['cutoff'],'symbols':{}}
          for s,v in d['symbols'].items():
            if v.get('status')!='ok':
              o['symbols'][s]={'c':v.get('class'),'status':v.get('status'),'error':v.get('error')};continue
            z={'c':v.get('class')}
            for tf in ['D1','H4','H1','M15','M5','M1']:
              x=v['frames'][tf]
              z[tf]=[x.get('close'),x.get('ema20'),x.get('ema50'),x.get('ema200'),x.get('rsi14'),x.get('atr14'),x.get('recent50High'),x.get('recent50Low'),x.get('trend')]
            o['symbols'][s]=z
          with open('data/calibration-tiny.json','w',encoding='utf-8') as f:json.dump(o,f,separators=(',',':'))
          PY
      - run: |
          git config user.name market-data-bot
          git config user.email market-data-bot@users.noreply.github.com
          git add data/calibration-tiny.json
          git diff --cached --quiet && exit 0
          git commit -m "Update tiny calibration extract"
          git pull --rebase origin main
          git push origin HEAD:main
