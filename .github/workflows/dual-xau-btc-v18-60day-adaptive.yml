name: Dual XAU BTC V18 Adaptive 60Day

on:
  push:
    paths:
      - 'research/dual_xau_btc_v18_60day_adaptive.py'
      - '.github/workflows/dual-xau-btc-v18-60day-adaptive.yml'
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} V18 adaptive 60-day backtest
        run: |
          mkdir -p research/results
          python3 research/dual_xau_btc_v18_60day_adaptive.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_v18_60day_adaptive.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v18-60day-adaptive-result
          path: research/results/${{ matrix.symbol }}_v18_60day_adaptive.txt
          retention-days: 30
