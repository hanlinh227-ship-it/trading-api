name: Offline Crypto TAO 31Day V39
on:
  push:
    paths:
      - 'scripts/offline_crypto_tao_31day_v39.py'
      - '.github/workflows/offline-crypto-tao-31day-v39.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run TAO extended forced-daily test
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_tao_31day_v39.py
