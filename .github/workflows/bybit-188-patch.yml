name: Apply Bybit 1.8.8 Patch
on:
  push:
    branches: [feat/bybit-1.8.8-full-scale-capital-allocation]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bybit-1.8.8-full-scale-capital-allocation
          fetch-depth: 0
      - name: Apply patch
        run: node scripts/apply-bybit-188.mjs
      - name: Commit patched source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "feat: Bybit 1.8.8 continuous scale and full-capital allocation"
          git push origin HEAD:feat/bybit-1.8.8-full-scale-capital-allocation
