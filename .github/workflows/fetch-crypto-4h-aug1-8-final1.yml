name: Fetch Crypto 4H Aug1-8 Final1
on:
  push:
    paths:
      - 'scripts/fetch_crypto_4h_aug1_8_2026_final1.py'
      - '.github/workflows/fetch-crypto-4h-aug1-8-final1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  final1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch untouched Aug week one for all 61 symbols
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/fetch_crypto_4h_aug1_8_2026_final1.py
      - name: Freeze final holdout snapshot
        run: |
          git config user.name 'crypto-final-holdout-bot'
          git config user.email 'crypto-final-holdout-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_4h_aug1_8_2026_final1.json
          git commit -m 'Freeze untouched crypto Aug week-one holdout' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
