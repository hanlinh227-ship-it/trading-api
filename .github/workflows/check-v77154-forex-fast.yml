name: Check V77.15.4 Diversified Forex
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77154-forex-fast.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fresh Twelve Data minute
        shell: bash
        run: |
          S=$(date -u +%S); W=$((65-10#$S)); if [ "$W" -lt 5 ]; then W=$((W+60)); fi; sleep "$W"
      - name: Verify Forex
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'; : > V77154_FOREX_LIVE.txt
          curl -fsS --max-time 55 "$BASE/run-now?group=forex" -o /tmp/f.json; echo "CURL=$?" >> V77154_FOREX_LIVE.txt
          node <<'NODE' >> V77154_FOREX_LIVE.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};const f=j('/tmp/f.json'),n=s=>(f.analyses||[]).filter(a=>a.status===s).length;
          console.log('VERSION='+(f.version||'-'));console.log('FOREX='+(f.broadOk??'-')+'/'+(f.requested??'-')+' deep='+(f.deepOk??'-')+'/'+(f.deepRequested??'-'));
          console.log('ACTIONS=M'+n('MARKET')+',L'+n('LIMIT')+',MP'+n('MARKET_PLAN')+',LP'+n('LIMIT_PLAN')+',W'+n('WATCH'));
          console.log('RESULTS='+(f.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':RR='+(a.targetRR??a.planned?.targetRR??'-')+':DIST='+(a.planned?.geometry?.distanceATR??'-')).join('|'));
          const pairs=(f.analyses||[]).map(a=>a.symbol),cc={};for(const p of pairs){cc[p.slice(0,3)]=(cc[p.slice(0,3)]||0)+1;cc[p.slice(3)]=(cc[p.slice(3)]||0)+1;}console.log('CURRENCY_COUNTS='+JSON.stringify(cc));
          console.log('VERDICT='+((f.version==='V77.15.4'&&f.broadOk===28&&f.deepOk===3)?'PASS':'FAIL'));
          NODE
      - name: Commit
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77154_FOREX_LIVE.txt; git commit -m 'Report V77.15.4 diversified Forex live check' || exit 0; git push origin main
