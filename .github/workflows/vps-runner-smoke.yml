name: V11 VPS Bridge Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Read-only V11 bridge diagnostics
        shell: bash
        run: |
          set -euo pipefail
          echo "hostname: $(hostname)"
          echo "user: $(whoami)"
          python3 --version || true
          node --version || true
          git --version || true
          test -d /opt/trading/trading-api-main && echo 'canonical repo: present'
          unit=v11-manual-ai-bridge.service
          systemctl is-active "$unit" >/dev/null 2>&1 && echo "$unit: active" || echo "$unit: not-active-or-missing"
          systemctl is-enabled "$unit" >/dev/null 2>&1 && echo "$unit: enabled" || echo "$unit: not-enabled-or-missing"
