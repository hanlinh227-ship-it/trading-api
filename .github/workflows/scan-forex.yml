name: Scan Forex Market — V75 Fast Grow55

on:
  workflow_dispatch:
  push:
    paths: ["scan-request.json"]

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  forex-scan:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Run V75 fast 28-pair scan
        run: python3 scripts/scan_forex_v75.py data
      - name: Commit scan snapshots
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/forex-scan.json data/forex-fast.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V75 fast Grow55 Forex scan"
          git pull --rebase origin main
          git push origin HEAD:main
