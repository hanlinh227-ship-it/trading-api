name: Scan Forex Market — Grow 55

on:
  workflow_dispatch:
  push:
    paths:
      - "scan-request.json"

permissions:
  contents: write

# Twelve Data Grow 55 policy:
# - 55 API credits/minute, no daily limit.
# - Broad scan: 28 pairs ~= 28 credits.
# - Deep analysis: Top 3 x 5 timeframes ~= 15 credits.
# - Final M1 refresh: Top 3 ~= 3 credits.
# - Normal total ~= 46 credits, leaving ~= 9 credits for retries/overlap.
# - No routine 65-second sleeps. Waiting is used only after exceptional failures.
#
# Crypto continues to use exchange-native market data and does not spend this budget.

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

env:
  FOREX_WORKER: https://forex-chart-api.hanlinh227.workers.dev
  FINALISTS: "3"

jobs:
  forex-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize
        shell: bash
        run: |
          mkdir -p scan/broad scan/deep scan/refresh data

      # =====================================================
      # STAGE A — BROAD 28-PAIR SCAN
      # One lightweight worker /scan call per pair.
      # Calls are parallelized to reduce wall-clock latency.
      # =====================================================
      - name: Broad scan all 28 Forex pairs
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.error
          import urllib.request

          worker = os.environ["FOREX_WORKER"].rstrip("/")
          pairs = [
              "EURUSD","GBPUSD","USDJPY","USDCHF","USDCAD","AUDUSD","NZDUSD",
              "EURJPY","EURGBP","EURCHF","EURAUD","EURNZD","EURCAD","GBPJPY",
              "GBPCHF","GBPAUD","GBPNZD","GBPCAD","AUDJPY","AUDNZD","AUDCAD",
              "AUDCHF","NZDJPY","NZDCAD","NZDCHF","CADJPY","CADCHF","CHFJPY"
          ]

          def fetch(symbol):
              url = f"{worker}/scan/{symbol}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "trading-api-grow55/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read().decode("utf-8")
                      data = json.loads(raw)
                      return symbol, data, None
              except Exception as exc:
                  return symbol, None, str(exc)

          def run(symbols, workers=12):
              results = {}
              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
                  futures = [pool.submit(fetch, symbol) for symbol in symbols]
                  for future in concurrent.futures.as_completed(futures):
                      symbol, data, error = future.result()
                      results[symbol] = {"data": data, "error": error}
                      if data is not None:
                          with open(f"scan/broad/{symbol}.json", "w", encoding="utf-8") as f:
                              json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
                      print(symbol, "OK" if data and data.get("status") == "ok" else f"FAIL {error or (data or {}).get('message')}")
              return results

          first = run(pairs)
          failed = [
              symbol for symbol in pairs
              if not first[symbol]["data"] or first[symbol]["data"].get("status") != "ok"
          ]

          # Normal budget is 46 credits. Up to 9 immediate retries still fits Grow 55.
          # If failures exceed the reserve, wait for the next minute only then retry.
          if failed:
              print("Initial failures:", failed)
              if len(failed) > 9:
                  print("Failure count exceeds 9-credit reserve; waiting for quota reset.")
                  time.sleep(61)
              else:
                  time.sleep(2)

              second = run(failed, workers=min(6, len(failed)))
              failed = [
                  symbol for symbol in failed
                  if not second[symbol]["data"] or second[symbol]["data"].get("status") != "ok"
              ]

          if failed:
              raise SystemExit(f"Broad scan failed after retry: {failed}")

          print("BROAD_SCAN_OK=28/28")
          PY

      # =====================================================
      # BROAD RANKING — H1/scan summary
      # This only narrows the universe. It is NOT an entry signal.
      # =====================================================
      - name: Rank broad scan and select Top 3
        id: broad
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os

          pairs = [
              "EURUSD","GBPUSD","USDJPY","USDCHF","USDCAD","AUDUSD","NZDUSD",
              "EURJPY","EURGBP","EURCHF","EURAUD","EURNZD","EURCAD","GBPJPY",
              "GBPCHF","GBPAUD","GBPNZD","GBPCAD","AUDJPY","AUDNZD","AUDCAD",
              "AUDCHF","NZDJPY","NZDCAD","NZDCHF","CADJPY","CADCHF","CHFJPY"
          ]

          rankings = []
          for symbol in pairs:
              with open(f"scan/broad/{symbol}.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              s = data.get("summary") or {}
              close = s.get("close")
              e20 = s.get("ema20")
              e50 = s.get("ema50")
              e200 = s.get("ema200")
              rsi = s.get("rsi14")
              atr = s.get("atr14")
              hi = s.get("recent50High")
              lo = s.get("recent50Low")

              if any(v is None for v in (close, e20, e50, rsi, atr)):
                  continue

              direction = "NEUTRAL"
              score = 0.0

              if close > e20 > e50:
                  direction = "BUY"
                  score += 3
              elif close < e20 < e50:
                  direction = "SELL"
                  score += 3

              if e200 is not None:
                  if direction == "BUY" and close > e200:
                      score += 2
                  elif direction == "SELL" and close < e200:
                      score += 2

              if direction == "BUY":
                  if 52 <= rsi <= 68:
                      score += 2
                  elif 68 < rsi <= 72:
                      score += 1
              elif direction == "SELL":
                  if 32 <= rsi <= 48:
                      score += 2
                  elif 28 <= rsi < 32:
                      score += 1

              if rsi >= 75 or rsi <= 25:
                  score -= 3

              if direction == "BUY" and hi not in (None, 0):
                  if abs(hi - close) / abs(hi) < 0.001:
                      score -= 1
              if direction == "SELL" and lo not in (None, 0):
                  if abs(close - lo) / abs(lo) < 0.001:
                      score -= 1

              momentum_target = 60 if direction == "BUY" else 40 if direction == "SELL" else 50
              momentum_quality = -abs(rsi - momentum_target)

              rankings.append({
                  "symbol": symbol,
                  "direction": direction,
                  "broadScore": round(score, 3),
                  "momentumQuality": round(momentum_quality, 3),
                  "close": close,
                  "ema20": e20,
                  "ema50": e50,
                  "ema200": e200,
                  "rsi14": rsi,
                  "atr14": atr,
                  "recent50High": hi,
                  "recent50Low": lo,
                  "provider": data.get("provider"),
                  "generatedAt": data.get("generatedAt")
              })

          rankings.sort(
              key=lambda x: (x["broadScore"], x["momentumQuality"], x["atr14"]),
              reverse=True
          )

          finalist_count = int(os.environ.get("FINALISTS", "3"))
          finalists = rankings[:finalist_count]

          result = {
              "status": "ok",
              "pairsRequested": 28,
              "pairsRanked": len(rankings),
              "topCandidates": rankings[:10],
              "finalists": [item["symbol"] for item in finalists]
          }

          with open("scan/ranking.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, indent=2)

          with open("scan/finalists.txt", "w", encoding="utf-8") as f:
              for item in finalists:
                  f.write(item["symbol"] + "\n")

          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      # =====================================================
      # STAGE B — DEEP TOP-3 ANALYSIS
      # D1 + H4 + H1 + M15 + M5 for each finalist.
      # ~= 15 credits total.
      # =====================================================
      - name: Deep analyze Top 3 finalists
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import urllib.request

          worker = os.environ["FOREX_WORKER"].rstrip("/")
          with open("scan/finalists.txt", "r", encoding="utf-8") as f:
              symbols = [line.strip() for line in f if line.strip()]

          def fetch(symbol):
              url = f"{worker}/analysis/{symbol}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "trading-api-grow55/1.0"})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      return symbol, json.loads(response.read().decode("utf-8")), None
              except Exception as exc:
                  return symbol, None, str(exc)

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures = [pool.submit(fetch, symbol) for symbol in symbols]
              for future in concurrent.futures.as_completed(futures):
                  symbol, data, error = future.result()
                  valid = (
                      data is not None
                      and data.get("status") in ("ok", "partial")
                      and data.get("analysisReady") is True
                      and data.get("successfulFrames") == 5
                      and data.get("failedFrames", 0) == 0
                  )
                  if not valid:
                      failures.append({"symbol": symbol, "error": error, "data": data})
                      continue
                  with open(f"scan/deep/{symbol}.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
                  print(symbol, "DEEP_OK 5/5")

          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit("Deep analysis failed")
          PY

      # =====================================================
      # FINAL LIVE REFRESH — TOP 3
      # M1/latest quote data for all finalists, not only Top 1.
      # ~= 3 credits total.
      # =====================================================
      - name: Refresh Top 3 finalists
        shell: bash
        run: |
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import urllib.request

          worker = os.environ["FOREX_WORKER"].rstrip("/")
          with open("scan/finalists.txt", "r", encoding="utf-8") as f:
              symbols = [line.strip() for line in f if line.strip()]

          def fetch(symbol):
              url = f"{worker}/refresh/{symbol}"
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "trading-api-grow55/1.0"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return symbol, json.loads(response.read().decode("utf-8")), None
              except Exception as exc:
                  return symbol, None, str(exc)

          failures = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures = [pool.submit(fetch, symbol) for symbol in symbols]
              for future in concurrent.futures.as_completed(futures):
                  symbol, data, error = future.result()
                  if not data or data.get("status") not in ("ok", "partial") or data.get("currentPrice") is None:
                      failures.append({"symbol": symbol, "error": error, "data": data})
                      continue
                  with open(f"scan/refresh/{symbol}.json", "w", encoding="utf-8") as f:
                      json.dump(data, f, ensure_ascii=False, separators=(",", ":"))
                  print(
                      symbol,
                      "PRICE", data.get("currentPrice"),
                      "BID", data.get("bid"),
                      "ASK", data.get("ask"),
                      "AGE", data.get("dataAgeSeconds"),
                      "EXEC", data.get("executionReady")
                  )

          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit("Final refresh failed")
          PY

      # =====================================================
      # MULTI-TIMEFRAME FINAL RANKING
      # This produces candidates for V74 review; it does NOT
      # bypass the required M15 location + M5 confirmed trigger.
      # =====================================================
      - name: Build Grow 55 final result
        shell: bash
        run: |
          python3 <<'PY'
          import json
          from datetime import datetime, timezone

          with open("scan/ranking.json", "r", encoding="utf-8") as f:
              broad = json.load(f)

          broad_map = {item["symbol"]: item for item in broad.get("topCandidates", [])}
          with open("scan/finalists.txt", "r", encoding="utf-8") as f:
              symbols = [line.strip() for line in f if line.strip()]

          def frame_direction(summary):
              if not summary:
                  return "NEUTRAL"
              c = summary.get("close")
              e20 = summary.get("ema20")
              e50 = summary.get("ema50")
              if None in (c, e20, e50):
                  return "NEUTRAL"
              if c > e20 > e50:
                  return "BUY"
              if c < e20 < e50:
                  return "SELL"
              return "NEUTRAL"

          candidates = []
          for symbol in symbols:
              with open(f"scan/deep/{symbol}.json", "r", encoding="utf-8") as f:
                  analysis = json.load(f)
              with open(f"scan/refresh/{symbol}.json", "r", encoding="utf-8") as f:
                  refresh = json.load(f)

              broad_item = broad_map.get(symbol, {})
              direction = broad_item.get("direction", "NEUTRAL")
              frames = analysis.get("timeframes") or {}

              frame_states = {}
              deep_score = float(broad_item.get("broadScore", 0))
              weights = {"D1": 1.0, "H4": 2.0, "H1": 2.0, "M15": 2.0, "M5": 2.0}

              for tf, weight in weights.items():
                  summary = (frames.get(tf) or {}).get("summary") or {}
                  state = frame_direction(summary)
                  frame_states[tf] = state
                  if direction != "NEUTRAL":
                      if state == direction:
                          deep_score += weight
                      elif state not in ("NEUTRAL", direction):
                          deep_score -= weight

              m5_summary = (frames.get("M5") or {}).get("summary") or {}
              m15_summary = (frames.get("M15") or {}).get("summary") or {}
              m5_rsi = m5_summary.get("rsi14")
              m15_rsi = m15_summary.get("rsi14")

              if direction == "BUY":
                  if m5_rsi is not None and 50 <= m5_rsi <= 70:
                      deep_score += 0.5
                  if m15_rsi is not None and 48 <= m15_rsi <= 68:
                      deep_score += 0.5
              elif direction == "SELL":
                  if m5_rsi is not None and 30 <= m5_rsi <= 50:
                      deep_score += 0.5
                  if m15_rsi is not None and 32 <= m15_rsi <= 52:
                      deep_score += 0.5

              age = refresh.get("dataAgeSeconds")
              stale = refresh.get("stale")
              market_closed = refresh.get("marketClosedPossible")
              quote_valid = (
                  refresh.get("currentPrice") is not None
                  and stale is not True
                  and market_closed is not True
                  and age is not None
                  and age <= 30
              )

              candidates.append({
                  "symbol": symbol,
                  "directionPrior": direction,
                  "broadScore": broad_item.get("broadScore"),
                  "deepScore": round(deep_score, 3),
                  "frameDirection": frame_states,
                  "currentPrice": refresh.get("currentPrice"),
                  "currentPriceTime": refresh.get("currentPriceTime"),
                  "bid": refresh.get("bid"),
                  "ask": refresh.get("ask"),
                  "spread": refresh.get("spread"),
                  "dataAgeSeconds": age,
                  "quoteAgeMs": refresh.get("quoteAgeMs"),
                  "stale": stale,
                  "executionReadyFromFeed": refresh.get("executionReady"),
                  "quoteValidForV74": quote_valid,
                  "analysis": analysis,
                  "refresh": refresh
              })

          candidates.sort(key=lambda item: item["deepScore"], reverse=True)

          result = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "dataPolicy": "TWELVE_DATA_GROW_55",
              "creditBudget": {
                  "apiCreditsPerMinute": 55,
                  "broadScanEstimated": 28,
                  "deepTop3Estimated": 15,
                  "refreshTop3Estimated": 3,
                  "normalEstimatedTotal": 46,
                  "reserveEstimated": 9
              },
              "scanComplete": True,
              "pairsScanned": 28,
              "broadRanking": broad,
              "deepCandidates": candidates,
              "bestCandidateForV74Review": candidates[0]["symbol"] if candidates else None,
              "executionRule": "Candidate only. V74 still requires fresh executable quote, symbol/news context, M15 location and M5 close-confirmed MSS/displacement/retest before MARKET."
          }

          with open("data/forex-scan.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, separators=(",", ":"))

          print(json.dumps({
              "updatedAt": result["updatedAt"],
              "creditBudget": result["creditBudget"],
              "bestCandidateForV74Review": result["bestCandidateForV74Review"],
              "deepCandidates": [
                  {
                      "symbol": item["symbol"],
                      "direction": item["directionPrior"],
                      "score": item["deepScore"],
                      "frames": item["frameDirection"],
                      "price": item["currentPrice"],
                      "bid": item["bid"],
                      "ask": item["ask"],
                      "age": item["dataAgeSeconds"],
                      "quoteValidForV74": item["quoteValidForV74"]
                  }
                  for item in candidates
              ]
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit Forex scan
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/forex-scan.json

          if git diff --cached --quiet; then
            echo "No Forex scan changes."
            exit 0
          fi

          git commit -m "Update Forex market scan"

      - name: Sync latest main and push safely
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "^Update Forex market scan"; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing to push."
          fi
