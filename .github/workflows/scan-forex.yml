name: Scan Forex Market — Grow 55

on:
  workflow_dispatch:
  push:
    paths:
      - "scan-request.json"

permissions:
  contents: write

# Canonical 28-pair Forex universe scan.
# Normal Grow 55 budget:
#   28 x /scan                  ~= 28 credits
#    3 x /analysis (5 TF each) ~= 15 credits
#    3 x /price                ~=  3 credits
# Total                         ~= 46 / 55 credits
# Reserve                       ~=  9 credits
#
# /price gives the latest aggregated price reference in this integration.
# Worker generatedAt is FETCH TIME, not a verified broker quote timestamp.
# This workflow never fabricates bid/ask/spread or marks a candidate
# executable solely because /price was fetched moments ago.

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

env:
  FOREX_WORKER: https://forex-chart-api.hanlinh227.workers.dev

jobs:
  forex-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run staged Grow 55 scan
        shell: bash
        run: |
          mkdir -p data
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import time
          import urllib.request
          from datetime import datetime, timezone

          WORKER = os.environ["FOREX_WORKER"].rstrip("/")
          PAIRS = [
              "EURUSD","GBPUSD","USDJPY","USDCHF","USDCAD","AUDUSD","NZDUSD",
              "EURJPY","EURGBP","EURCHF","EURAUD","EURNZD","EURCAD","GBPJPY",
              "GBPCHF","GBPAUD","GBPNZD","GBPCAD","AUDJPY","AUDNZD","AUDCAD",
              "AUDCHF","NZDJPY","NZDCAD","NZDCHF","CADJPY","CADCHF","CHFJPY",
          ]

          def fetch(mode, symbol, timeout=40):
              url = f"{WORKER}/{mode}/{symbol}"
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "trading-api-grow55/3.0"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return json.loads(response.read().decode("utf-8")), None
              except Exception as exc:
                  return None, str(exc)

          def fetch_parallel(mode, symbols, workers, timeout=40):
              results = {}
              with concurrent.futures.ThreadPoolExecutor(max_workers=workers) as pool:
                  jobs = {
                      pool.submit(fetch, mode, symbol, timeout): symbol
                      for symbol in symbols
                  }
                  for future in concurrent.futures.as_completed(jobs):
                      symbol = jobs[future]
                      data, error = future.result()
                      results[symbol] = {"data": data, "error": error}
              return results

          def ok(data):
              return data is not None and data.get("status") in ("ok", "partial")

          # -------------------------------------------------
          # Stage A — broad 28-pair scan (~28 credits)
          # -------------------------------------------------
          broad_raw = fetch_parallel("scan", PAIRS, workers=12, timeout=30)
          failed = [
              symbol for symbol in PAIRS
              if not broad_raw[symbol]["data"]
              or broad_raw[symbol]["data"].get("status") != "ok"
          ]

          for symbol in PAIRS:
              row = broad_raw[symbol]
              state = "OK" if row["data"] and row["data"].get("status") == "ok" else f"FAIL {row['error']}"
              print("BROAD", symbol, state)

          # Normal path leaves ~9 credits. Retry inside reserve; only wait
          # for quota reset if exceptional failure count exceeds reserve.
          if failed:
              print("BROAD_INITIAL_FAILURES", failed)
              time.sleep(61 if len(failed) > 9 else 2)
              retried = fetch_parallel("scan", failed, workers=min(6, len(failed)), timeout=30)
              for symbol in failed:
                  broad_raw[symbol] = retried[symbol]
              failed = [
                  symbol for symbol in failed
                  if not broad_raw[symbol]["data"]
                  or broad_raw[symbol]["data"].get("status") != "ok"
              ]

          if failed:
              raise SystemExit(f"Broad scan failed after retry: {failed}")

          # -------------------------------------------------
          # Broad ranking — narrowing only, never an entry signal
          # -------------------------------------------------
          ranking = []
          for symbol in PAIRS:
              data = broad_raw[symbol]["data"]
              summary = data.get("summary") or {}

              close = summary.get("close")
              ema20 = summary.get("ema20")
              ema50 = summary.get("ema50")
              ema200 = summary.get("ema200")
              rsi = summary.get("rsi14")
              atr = summary.get("atr14")
              high50 = summary.get("recent50High")
              low50 = summary.get("recent50Low")

              if any(v is None for v in (close, ema20, ema50, rsi, atr)):
                  continue

              direction = "NEUTRAL"
              score = 0.0

              if close > ema20 > ema50:
                  direction = "BUY"
                  score += 3
              elif close < ema20 < ema50:
                  direction = "SELL"
                  score += 3

              if ema200 is not None:
                  if direction == "BUY" and close > ema200:
                      score += 2
                  elif direction == "SELL" and close < ema200:
                      score += 2

              if direction == "BUY":
                  if 52 <= rsi <= 68:
                      score += 2
                  elif 68 < rsi <= 72:
                      score += 1
              elif direction == "SELL":
                  if 32 <= rsi <= 48:
                      score += 2
                  elif 28 <= rsi < 32:
                      score += 1

              if rsi >= 75 or rsi <= 25:
                  score -= 3

              if direction == "BUY" and high50 not in (None, 0):
                  if abs(high50 - close) / abs(high50) < 0.001:
                      score -= 1
              if direction == "SELL" and low50 not in (None, 0):
                  if abs(close - low50) / abs(low50) < 0.001:
                      score -= 1

              target_rsi = 60 if direction == "BUY" else 40 if direction == "SELL" else 50
              momentum_quality = -abs(rsi - target_rsi)

              ranking.append({
                  "symbol": symbol,
                  "direction": direction,
                  "broadScore": round(score, 3),
                  "momentumQuality": round(momentum_quality, 3),
                  "close": close,
                  "ema20": ema20,
                  "ema50": ema50,
                  "ema200": ema200,
                  "rsi14": rsi,
                  "atr14": atr,
                  "recent50High": high50,
                  "recent50Low": low50,
                  "provider": data.get("provider"),
                  "broadFetchedAt": data.get("generatedAt"),
              })

          if len(ranking) != 28:
              raise SystemExit(f"Expected 28 ranked pairs, got {len(ranking)}")

          ranking.sort(
              key=lambda row: (row["broadScore"], row["momentumQuality"], row["atr14"]),
              reverse=True,
          )
          finalists = [row["symbol"] for row in ranking[:3]]
          print("BROAD_FINALISTS", finalists)

          # -------------------------------------------------
          # Stage B — Top 3 deep analysis (~15 credits)
          # -------------------------------------------------
          deep_raw = fetch_parallel("analysis", finalists, workers=3, timeout=45)
          deep = {}
          failures = []

          for symbol in finalists:
              data = deep_raw[symbol]["data"]
              valid = (
                  ok(data)
                  and data.get("analysisReady") is True
                  and data.get("successfulFrames") == 5
                  and data.get("failedFrames", 0) == 0
              )
              if valid:
                  deep[symbol] = data
                  print("DEEP", symbol, "OK 5/5")
              else:
                  failures.append({
                      "symbol": symbol,
                      "error": deep_raw[symbol]["error"],
                      "data": data,
                  })

          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit("Deep analysis failed")

          # -------------------------------------------------
          # Stage C — Top 3 latest aggregated price (~3 credits)
          # -------------------------------------------------
          price_raw = fetch_parallel("price", finalists, workers=3, timeout=30)
          prices = {}
          failures = []

          for symbol in finalists:
              data = price_raw[symbol]["data"]
              valid = (
                  ok(data)
                  and data.get("currentPrice") is not None
                  and data.get("priceType") == "latest_price"
              )
              if valid:
                  prices[symbol] = data
                  print(
                      "LATEST_AGGREGATED_PRICE",
                      symbol,
                      data.get("currentPrice"),
                      "FETCHED_AT",
                      data.get("generatedAt"),
                  )
              else:
                  failures.append({
                      "symbol": symbol,
                      "error": price_raw[symbol]["error"],
                      "data": data,
                  })

          if failures:
              print(json.dumps(failures, ensure_ascii=False, indent=2))
              raise SystemExit("Latest-price stage failed")

          def frame_direction(summary):
              close = summary.get("close")
              ema20 = summary.get("ema20")
              ema50 = summary.get("ema50")
              if None in (close, ema20, ema50):
                  return "NEUTRAL"
              if close > ema20 > ema50:
                  return "BUY"
              if close < ema20 < ema50:
                  return "SELL"
              return "NEUTRAL"

          def parse_time(value):
              if not value:
                  return None
              try:
                  return datetime.fromisoformat(value.replace("Z", "+00:00"))
              except Exception:
                  return None

          broad_map = {row["symbol"]: row for row in ranking}
          now = datetime.now(timezone.utc)
          candidates = []

          for symbol in finalists:
              analysis = deep[symbol]
              latest = prices[symbol]
              prior = broad_map[symbol]
              direction = prior["direction"]
              frames = analysis.get("timeframes") or {}

              score = float(prior["broadScore"])
              states = {}
              weights = {"D1": 1.0, "H4": 2.0, "H1": 2.0, "M15": 2.0, "M5": 2.0}

              for tf, weight in weights.items():
                  summary = (frames.get(tf) or {}).get("summary") or {}
                  state = frame_direction(summary)
                  states[tf] = state
                  if direction != "NEUTRAL":
                      if state == direction:
                          score += weight
                      elif state not in ("NEUTRAL", direction):
                          score -= weight

              m15_rsi = ((frames.get("M15") or {}).get("summary") or {}).get("rsi14")
              m5_rsi = ((frames.get("M5") or {}).get("summary") or {}).get("rsi14")
              if direction == "BUY":
                  score += 0.5 if m15_rsi is not None and 48 <= m15_rsi <= 68 else 0
                  score += 0.5 if m5_rsi is not None and 50 <= m5_rsi <= 70 else 0
              elif direction == "SELL":
                  score += 0.5 if m15_rsi is not None and 32 <= m15_rsi <= 52 else 0
                  score += 0.5 if m5_rsi is not None and 30 <= m5_rsi <= 50 else 0

              fetched_at = parse_time(latest.get("generatedAt"))
              fetch_age = (now - fetched_at).total_seconds() if fetched_at else None
              latest_price_fetched_now = (
                  latest.get("priceType") == "latest_price"
                  and fetch_age is not None
                  and 0 <= fetch_age <= 30
              )

              bid = latest.get("bid")
              ask = latest.get("ask")
              spread_verified = bid is not None and ask is not None

              candidates.append({
                  "symbol": symbol,
                  "directionPrior": direction,
                  "broadScore": prior["broadScore"],
                  "deepScore": round(score, 3),
                  "frameDirection": states,
                  "currentPrice": latest.get("currentPrice"),
                  "priceType": latest.get("priceType"),
                  "priceFetchedAt": latest.get("generatedAt"),
                  "priceFetchAgeSeconds": round(fetch_age, 3) if fetch_age is not None else None,
                  "latestPriceFetchedNow": latest_price_fetched_now,
                  "quoteTimestampVerified": False,
                  "quoteAgeSeconds": None,
                  "bid": bid,
                  "ask": ask,
                  "spreadVerified": spread_verified,
                  "marketEntryNeedsVenueConfirmation": True,
                  "provider": latest.get("provider") or analysis.get("provider"),
                  "marketSymbol": latest.get("marketSymbol") or analysis.get("marketSymbol"),
                  "marketType": latest.get("marketType") or analysis.get("marketType"),
                  "analysis": analysis,
                  "latestPrice": latest,
              })

          candidates.sort(key=lambda row: row["deepScore"], reverse=True)

          result = {
              "updatedAt": now.isoformat(),
              "dataPolicy": "TWELVE_DATA_GROW_55_V74",
              "creditBudget": {
                  "apiCreditsPerMinute": 55,
                  "broadScanEstimated": 28,
                  "deepTop3Estimated": 15,
                  "latestPriceTop3Estimated": 3,
                  "normalEstimatedTotal": 46,
                  "reserveEstimated": 9,
              },
              "scanComplete": True,
              "pairsScanned": 28,
              "broadTop10": ranking[:10],
              "deepCandidates": candidates,
              "bestCandidateForV74Review": candidates[0]["symbol"] if candidates else None,
              "priceIntegrity": {
                  "latestPriceMeaning": "Twelve Data aggregated latest price fetched now",
                  "workerGeneratedAtMeaning": "provider fetch time, not verified broker quote timestamp",
                  "quoteTimestampVerified": False,
                  "brokerSpreadVerifiedByPriceEndpoint": False,
              },
              "executionRule": (
                  "Candidate ranking only. Before MARKET, V74 still requires current news/context, "
                  "M15 location, M5 close-confirmed trigger and broker/venue execution confirmation "
                  "when exact quote timestamp or spread is required."
              ),
          }

          with open("data/forex-scan.json", "w", encoding="utf-8") as f:
              json.dump(result, f, ensure_ascii=False, separators=(",", ":"))

          print(json.dumps({
              "scanComplete": result["scanComplete"],
              "pairsScanned": result["pairsScanned"],
              "creditBudget": result["creditBudget"],
              "bestCandidateForV74Review": result["bestCandidateForV74Review"],
              "deepCandidates": [
                  {
                      "symbol": row["symbol"],
                      "direction": row["directionPrior"],
                      "score": row["deepScore"],
                      "frames": row["frameDirection"],
                      "price": row["currentPrice"],
                      "latestPriceFetchedNow": row["latestPriceFetchedNow"],
                      "quoteTimestampVerified": row["quoteTimestampVerified"],
                      "spreadVerified": row["spreadVerified"],
                  }
                  for row in candidates
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit Forex scan
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/forex-scan.json

          if git diff --cached --quiet; then
            echo "No Forex scan changes."
            exit 0
          fi

          git commit -m "Update Forex market scan"

      - name: Sync and push safely
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "^Update Forex market scan"; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing to push."
          fi
