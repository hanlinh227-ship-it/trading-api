name: V77.18.42 PR Signal Integrity R7
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/patch_signal_integrity_followup.mjs'
      - '.github/workflows/pr-signal-integrity-r7.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply follow-up patch
        run: node scripts/patch_signal_integrity_followup.mjs
      - name: Syntax check
        run: |
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hub-v77171.js
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/dual-ai-intervention.js
      - name: Commit runtime patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js
          if git diff --cached --quiet; then echo 'No runtime changes'; exit 0; fi
          git commit -m 'V77.18.42 complete Signal Integrity follow-up'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
