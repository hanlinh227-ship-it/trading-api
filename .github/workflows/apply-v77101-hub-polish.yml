name: Apply V77.10.1 Hub Polish

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77101_hub_polish.js'
      - '.github/workflows/apply-v77101-hub-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77101_DIAGNOSTIC.txt
          node --check scripts/apply_v77101_hub_polish.js >> V77101_DIAGNOSTIC.txt 2>&1
          echo "GENERATOR_EXIT=$?" >> V77101_DIAGNOSTIC.txt
          node scripts/apply_v77101_hub_polish.js >> V77101_DIAGNOSTIC.txt 2>&1
          echo "MIGRATION_EXIT=$?" >> V77101_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77101_DIAGNOSTIC.txt 2>&1
          echo "WORKER_SYNTAX_EXIT=$?" >> V77101_DIAGNOSTIC.txt
          for t in 'V77.10.1' singleAnalysisText '/coin BTC' 'Entry tham khảo' 'deepRequested:Math.min' adaptiveTriggerPolicy runSymbol; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77101_DIAGNOSTIC.txt; else echo "$t=NO" >> V77101_DIAGNOSTIC.txt; fi
          done
          exit 0
      - name: Commit canonical Worker on pass
        shell: bash
        run: |
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V77101_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77101_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77101_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77101_DIAGNOSTIC.txt && grep -q 'V77.10.1=YES' V77101_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.10.1 Hub polish' || exit 0
          git push origin main
