name: V78 US30 Yahoo Cash Debug
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  debug:
    if: github.event.issue.title == 'DEBUG-V78-US30-YAHOO-CASH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture Yahoo cash-index evidence
        run: bash scripts/v78_us30_yahoo_cash_debug.sh
