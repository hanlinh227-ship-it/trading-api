name: MT5 Distro Wine Gate Patch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-distro-gate-patch-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch canonical MT5 workflow
        shell: python
        run: |
          from pathlib import Path
          p=Path('.github/workflows/deploy-mt5-forex-vps.yml')
          s=p.read_text()
          old='''          test -n "$MAJOR" && [ "$MAJOR" -ge 10 ] || { echo "ERROR: supported Wine >=10 gate failed: $VERSION" >&2; exit 58; }
          echo "MT5_SUPPORTED_WINE_GATE=PASS version=$VERSION"'''
          new='''          test -n "$MAJOR" && [ "$MAJOR" -ge 9 ] || { echo "ERROR: validated Wine >=9 gate failed: $VERSION" >&2; exit 58; }
          test "${MT5_WINE_STACK:-}" = "UBUNTU_DISTRO_WINE" || { echo "ERROR: validated Ubuntu distro Wine stack required: ${MT5_WINE_STACK:-UNKNOWN}" >&2; exit 59; }
          echo "MT5_SUPPORTED_WINE_GATE=PASS stack=$MT5_WINE_STACK version=$VERSION"'''
          if old not in s:
              raise SystemExit('canonical Wine gate not found')
          s=s.replace(old,new,1)
          p.write_text(s)
      - name: Commit canonical gate and remove one-shot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mt5-distro-gate-patch-once.yml
          git add .github/workflows/deploy-mt5-forex-vps.yml
          git diff --cached --check
          git commit -m 'mt5: validate proven Ubuntu distro Wine runtime'
          git push origin HEAD:main
