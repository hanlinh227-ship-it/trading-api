name: Deploy Portable Runtimes

# The zero-cost PORTABLE runtimes - Deno secondary and Netlify tertiary.
# Capacity and failover only: neither holds routing, reasoning or
# model-selection authority, and the Cloudflare primary never waits on either.
#
# One lane rather than one per provider, deliberately. A lane per provider
# multiplies workflow budget for no added proof, and lets the providers' checks
# drift apart - which is exactly how a tertiary ends up admitting what the
# primary rejects.
#
# This workflow FAILS CLOSED when Deno credentials are absent. It does not
# print DENO_HEALTH=PASS, and it does not print DENO_DEPLOYED=true, unless a
# real deployment answered a real health probe. An unconfigured secondary is a
# truthful "not available", never a quiet pass -- claiming a failover path that
# does not exist is worse than having none, because it would be trusted the one
# time the primary is down.

on:
  push:
    branches: [main]
    paths:
      - 'deno-secondary/**'
      - 'netlify/**'
      - 'crypto-research-gateway/src/**'
      - '.github/workflows/deploy-portable-runtimes.yml'
  # Build and probe on the PR too. Without this the lane only ran AFTER merge,
  # which is exactly how a secondary that did not type-check reached main: the
  # PR that introduced it had no check to fail. Deploy stays main-only below.
  pull_request:
    paths:
      - 'deno-secondary/**'
      - 'netlify/**'
      - 'crypto-research-gateway/src/**'
      - '.github/workflows/deploy-portable-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-runtimes
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build secondary artifact and deploy if configured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the secondary adapter
        run: |
          set -euo pipefail
          # The artifact must be buildable whether or not it can be deployed.
          # A secondary that stopped compiling unnoticed would be discovered
          # during an outage, which is the worst possible time.
          #
          # --config is required: the shared research sources use Node NodeNext
          # '.js' specifiers and npm zod, which Deno resolves only via the
          # sloppy-imports and import-map settings in deno-secondary/deno.json.
          deno check --config deno-secondary/deno.json deno-secondary/main.ts
          echo "DENO_ARTIFACT_BUILD=PASS"

      - name: Boot the secondary and probe its contract
        shell: bash
        run: |
          set -euo pipefail
          # Type-checking is not running. The first version of this workflow
          # checked types only, and a compiling adapter still tells you nothing
          # about whether it serves the contract. This boots it for real.
          deno run --config deno-secondary/deno.json \
            --allow-net --allow-env deno-secondary/main.ts &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:8000/capabilities >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 10 http://127.0.0.1:8000/capabilities > /tmp/deno-caps.json
          curl -fsS --max-time 40 http://127.0.0.1:8000/health > /tmp/deno-local-health.json
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST http://127.0.0.1:8000/health)"
          test "$code" = "405" || { echo "REFUSED: /health must reject POST, got $code" >&2; exit 1; }
          python - <<'PY'
          import json, re
          from pathlib import Path
          caps = json.loads(Path('/tmp/deno-caps.json').read_text())
          health = json.loads(Path('/tmp/deno-local-health.json').read_text())
          if caps.get('runtimeRole') != 'secondary-capacity-only':
              raise SystemExit('secondary must declare itself capacity-only')
          if 'market_execution_quote' not in caps.get('tools', []):
              raise SystemExit('market_execution_quote missing')
          if re.search(r'place_order|cancel_order|withdraw|transfer|swap|bridge|wallet|payment',
                       json.dumps(caps.get('tools', [])), re.I):
              raise SystemExit('write/high-risk tool exposed by the secondary')
          for field in ('routingAuthority', 'reasoningAuthority', 'modelSelectionAuthority'):
              if health.get(field) is not False:
                  raise SystemExit(f'secondary claims {field}')
          if health.get('localInstallRequired') is not False:
              raise SystemExit('secondary requires local install')
          print('DENO_ARTIFACT_CONTRACT=PASS')
          PY

      - name: Secondary holds no authority
        run: |
          set -euo pipefail
          # Structural, not decorative: the secondary must never become a second
          # router, Brain or Model Mesh.
          for flag in 'ROUTING_AUTHORITY = false' 'REASONING_AUTHORITY = false' 'MODEL_SELECTION_AUTHORITY = false'; do
            grep -qF "const $flag" deno-secondary/main.ts || {
              echo "REFUSED: deno-secondary/main.ts must declare $flag" >&2; exit 1; }
          done
          echo "DENO_SECONDARY_AUTHORITY=NONE"

      - name: Netlify tertiary adapter wraps the shared contract
        shell: bash
        run: |
          set -euo pipefail
          # The tertiary must WRAP the shared handler, not reimplement it.
          # A forked implementation drifts, and a tertiary that admits what the
          # primary rejects is a hole shaped like a failover.
          grep -qF "from '../../deno-secondary/main.ts'" netlify/functions/research-gateway.mts || {
            echo "REFUSED: the Netlify adapter must import the shared handler" >&2; exit 1; }
          for forbidden in 'parseMarketInput' 'ALLOWED_KEYS' 'EXECUTION_VENUES'; do
            if grep -qF "const $forbidden" netlify/functions/research-gateway.mts; then
              echo "REFUSED: $forbidden is reimplemented in the Netlify adapter" >&2; exit 1
            fi
          done
          for flag in 'ROUTING_AUTHORITY = false' 'REASONING_AUTHORITY = false' 'MODEL_SELECTION_AUTHORITY = false'; do
            grep -qF "const $flag" netlify/functions/research-gateway.mts || {
              echo "REFUSED: netlify adapter must declare $flag" >&2; exit 1; }
          done
          echo "NETLIFY_STATE=ADAPTER_READY"
          echo "NETLIFY_DEPLOYED=false"
          echo "NETLIFY_HEALTH=NOT_PROBED"

      - name: Deploy to Deno Deploy, or refuse truthfully
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_PROJECT: ${{ secrets.DENO_PROJECT }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ] || [ -z "${DENO_PROJECT:-}" ]; then
            echo "DENO_DEPLOYED=false"
            echo "DENO_HEALTH=NOT_PROBED"
            echo "DENO_SECONDARY=NOT_CONFIGURED"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "The secondary runtime is prepared but not configured: DENO_DEPLOY_TOKEN and DENO_PROJECT are required. This is not a failure of the primary cutover, which never depends on the secondary."
            exit 0
          fi
          deno install -gArf jsr:@deno/deployctl
          # NOTE: deployctl's --config selects the DEPLOYCTL config, not the Deno
          # config, so it is deliberately not passed here; deno.json travels with
          # the uploaded files instead and supplies the import map at runtime.
          # This invocation is the one step in this workflow that has NOT been
          # executed, because no Deno Deploy account is configured. The
          # type-check and the contract probe above have both been run for real.
          deployctl deploy \
            --project="$DENO_PROJECT" \
            --prod \
            --token="$DENO_DEPLOY_TOKEN" \
            --include=deno-secondary \
            --include=crypto-research-gateway/src \
            --entrypoint=deno-secondary/main.ts
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "DENO_DEPLOYED=true"

      - name: Probe the deployed secondary
        if: steps.deploy.outputs.deployed == 'true'
        env:
          DENO_SECONDARY_URL: ${{ secrets.DENO_SECONDARY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DENO_SECONDARY_URL:-}" ]; then
            echo "DENO_HEALTH=NOT_PROBED"
            echo "REFUSED: deployed but DENO_SECONDARY_URL is unset, so health cannot be established. Not calling this live." >&2
            exit 1
          fi
          curl --fail --silent --max-time 20 "$DENO_SECONDARY_URL/health" > /tmp/deno-health.json
          cat /tmp/deno-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/deno-health.json').read_text())
          if data.get('ok') is not True:
              raise SystemExit('secondary /health did not report ok')
          if data.get('runtimeProvider') != 'deno-deploy':
              raise SystemExit('secondary did not identify as deno-deploy')
          if data.get('runtimeRole') != 'secondary-capacity-only':
              raise SystemExit('secondary must declare itself capacity-only')
          for field in ('routingAuthority', 'reasoningAuthority', 'modelSelectionAuthority'):
              if data.get(field) is not False:
                  raise SystemExit(f'secondary claims {field}; it holds no authority')
          if data.get('localInstallRequired') is not False:
              raise SystemExit('secondary unexpectedly requires local install')
          print('DENO_HEALTH=PASS')
          PY
