name: Deploy Portable Runtimes

# The zero-cost PORTABLE runtimes - Deno secondary and Netlify tertiary.
# Capacity and failover only: neither holds routing, reasoning or
# model-selection authority, and the Cloudflare primary never waits on either.
#
# One lane rather than one per provider, deliberately. A lane per provider
# multiplies workflow budget for no added proof, and lets the providers' checks
# drift apart - which is exactly how a tertiary ends up admitting what the
# primary rejects.
#
# This workflow FAILS CLOSED when Deno credentials are absent. It does not
# print DENO_HEALTH=PASS, and it does not print DENO_DEPLOYED=true, unless a
# real deployment answered a real health probe. An unconfigured secondary is a
# truthful "not available", never a quiet pass -- claiming a failover path that
# does not exist is worse than having none, because it would be trusted the one
# time the primary is down.

on:
  push:
    branches: [main]
    paths:
      - 'deno-secondary/**'
      - 'netlify/**'
      - 'crypto-research-gateway/src/**'
      - '.github/workflows/deploy-portable-runtimes.yml'
  # Build and probe on the PR too. Without this the lane only ran AFTER merge,
  # which is exactly how a secondary that did not type-check reached main: the
  # PR that introduced it had no check to fail. Deploy stays main-only below.
  pull_request:
    paths:
      - 'deno-secondary/**'
      - 'netlify/**'
      - 'crypto-research-gateway/src/**'
      - '.github/workflows/deploy-portable-runtimes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-runtimes
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build secondary artifact and deploy if configured
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the secondary adapter
        run: |
          set -euo pipefail
          # The artifact must be buildable whether or not it can be deployed.
          # A secondary that stopped compiling unnoticed would be discovered
          # during an outage, which is the worst possible time.
          #
          # --config is required: the shared research sources use Node NodeNext
          # '.js' specifiers and npm zod, which Deno resolves only via the
          # sloppy-imports and import-map settings in deno-secondary/deno.json.
          deno check --config deno-secondary/deno.json deno-secondary/main.ts
          echo "DENO_ARTIFACT_BUILD=PASS"

      - name: Boot the secondary and probe its contract
        shell: bash
        run: |
          set -euo pipefail
          # Type-checking is not running. The first version of this workflow
          # checked types only, and a compiling adapter still tells you nothing
          # about whether it serves the contract. This boots it for real.
          deno run --config deno-secondary/deno.json \
            --allow-net --allow-env deno-secondary/main.ts &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf --max-time 3 http://127.0.0.1:8000/capabilities >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS --max-time 10 http://127.0.0.1:8000/capabilities > /tmp/deno-caps.json
          curl -fsS --max-time 40 http://127.0.0.1:8000/health > /tmp/deno-local-health.json
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 -X POST http://127.0.0.1:8000/health)"
          test "$code" = "405" || { echo "REFUSED: /health must reject POST, got $code" >&2; exit 1; }
          python - <<'PY'
          import json, re
          from pathlib import Path
          caps = json.loads(Path('/tmp/deno-caps.json').read_text())
          health = json.loads(Path('/tmp/deno-local-health.json').read_text())
          if caps.get('runtimeRole') != 'secondary-capacity-only':
              raise SystemExit('secondary must declare itself capacity-only')
          if 'market_execution_quote' not in caps.get('tools', []):
              raise SystemExit('market_execution_quote missing')
          if re.search(r'place_order|cancel_order|withdraw|transfer|swap|bridge|wallet|payment',
                       json.dumps(caps.get('tools', [])), re.I):
              raise SystemExit('write/high-risk tool exposed by the secondary')
          for field in ('routingAuthority', 'reasoningAuthority', 'modelSelectionAuthority'):
              if health.get(field) is not False:
                  raise SystemExit(f'secondary claims {field}')
          if health.get('localInstallRequired') is not False:
              raise SystemExit('secondary requires local install')
          print('DENO_ARTIFACT_CONTRACT=PASS')
          PY

      - name: Secondary holds no authority
        run: |
          set -euo pipefail
          # Structural, not decorative: the secondary must never become a second
          # router, Brain or Model Mesh.
          for flag in 'ROUTING_AUTHORITY = false' 'REASONING_AUTHORITY = false' 'MODEL_SELECTION_AUTHORITY = false'; do
            grep -qF "const $flag" deno-secondary/main.ts || {
              echo "REFUSED: deno-secondary/main.ts must declare $flag" >&2; exit 1; }
          done
          echo "DENO_SECONDARY_AUTHORITY=NONE"

      - name: GitHub Actions ephemeral compute plane
        shell: bash
        run: |
          set -euo pipefail
          # This job IS the compute plane: ephemeral, zero-cost, exact-SHA by
          # construction. It runs the fabric's own acceptance matrix, which is
          # generated from the registry rather than written by hand, so a row
          # cannot read PASS because someone typed PASS.
          python -m pip install --disable-pip-version-check -q pyyaml
          # Run the files directly: AI_SKILL_LIBRARY/tests is not an importable
          # package, so `unittest discover` cannot load it. Verified locally.
          for suite in AI_SKILL_LIBRARY/tests/test_runtime_fabric_v2.py \
                       AI_SKILL_LIBRARY/tests/test_runtime_fabric_acceptance.py; do
            echo "--- $suite ---"
            PYTHONPATH="$PWD" python "$suite"
          done
          python - <<'PY'
          import importlib.util, sys
          from pathlib import Path
          d = Path('AI_SKILL_LIBRARY/v4/runtime_fabric')
          sys.path.insert(0, str(d))
          for name in ('fabric', 'acceptance'):
              spec = importlib.util.spec_from_file_location(name, d / (name + '.py'))
              module = importlib.util.module_from_spec(spec)
              sys.modules[name] = module
              spec.loader.exec_module(module)
          import acceptance
          matrix = acceptance.acceptance_matrix()
          print(acceptance.render_matrix(matrix))
          # The registry now carries evidence from a real Deno deployment,
          # exact-SHA health probe and live research smoke. The matrix must stay
          # consistent with that evidence; negative-path tests still prove an
          # unverified secondary can never be promoted.
          if not matrix['SECONDARY_DEPLOYED'] or not matrix['SECONDARY_HEALTH_VERIFIED']:
              raise SystemExit('verified Deno secondary unexpectedly missing from acceptance matrix')
          if not matrix['SECONDARY_SHA_MATCH']:
              raise SystemExit('verified Deno secondary lost exact-SHA status')
          if matrix['FAILOVER_PROOF'] != 'PASS':
              raise SystemExit('live verified secondary must be selectable when primary is circuit-open')
          PY
          echo "GITHUB_ACTIONS_COMPUTE_PLANE=READY"

      - name: Control Tower observes without commanding
        shell: bash
        run: |
          set -euo pipefail
          # The Tower READS this fabric; it must never re-derive it, and it must
          # never let an unobserved value render as a healthy one. These tests
          # damage each guard and require a refusal, and each one has been
          # mutation-checked: breaking the guard fails the suite.
          # Run the files directly: node --test on a directory resolves it as a
          # module here, which fails before any test runs.
          node --test control-center/test/control-tower.test.mjs \
                      control-center/test/renderer.test.mjs
          # Anti-regression: a second derivation of the acceptance matrix inside
          # the dashboard would make it a second evidence authority. The Tower
          # may mention the canonical tool; it may not import the fabric.
          if grep -rn "acceptance_matrix\|from .fabric import\|require(.*fabric.py" control-center/ --include=*.mjs --include=*.js; then
            echo "Control Tower must consume acceptance.py output, never re-derive it" >&2
            exit 1
          fi
          echo "CONTROL_TOWER=OBSERVABILITY_ONLY"

      - name: Netlify tertiary adapter wraps the shared contract
        shell: bash
        run: |
          set -euo pipefail
          # The tertiary must WRAP the shared handler, not reimplement it.
          # A forked implementation drifts, and a tertiary that admits what the
          # primary rejects is a hole shaped like a failover.
          grep -qF "from '../../deno-secondary/main.ts'" netlify/functions/research-gateway.mts || {
            echo "REFUSED: the Netlify adapter must import the shared handler" >&2; exit 1; }
          for forbidden in 'parseMarketInput' 'ALLOWED_KEYS' 'EXECUTION_VENUES'; do
            if grep -qF "const $forbidden" netlify/functions/research-gateway.mts; then
              echo "REFUSED: $forbidden is reimplemented in the Netlify adapter" >&2; exit 1
            fi
          done
          for flag in 'ROUTING_AUTHORITY = false' 'REASONING_AUTHORITY = false' 'MODEL_SELECTION_AUTHORITY = false'; do
            grep -qF "const $flag" netlify/functions/research-gateway.mts || {
              echo "REFUSED: netlify adapter must declare $flag" >&2; exit 1; }
          done
          echo "NETLIFY_STATE=ADAPTER_READY"
          echo "NETLIFY_DEPLOYED=false"
          echo "NETLIFY_HEALTH=NOT_PROBED"

      - name: Deploy to current Deno Deploy, or refuse truthfully
        id: deploy
        if: github.event_name != 'pull_request'
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          DENO_ORG: ${{ secrets.DENO_ORG }}
          DENO_APP: ${{ secrets.DENO_APP }}
          DENO_SECONDARY_URL: ${{ secrets.DENO_SECONDARY_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DENO_DEPLOY_TOKEN:-}" ] || [ -z "${DENO_ORG:-}" ] || [ -z "${DENO_APP:-}" ]; then
            echo "DENO_DEPLOYED=false"
            echo "DENO_HEALTH=NOT_PROBED"
            echo "DENO_SECONDARY=NOT_CONFIGURED"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "The secondary runtime is prepared but not configured: DENO_DEPLOY_TOKEN, DENO_ORG and DENO_APP are required."
            exit 0
          fi

          # Deno Deploy Classic / deployctl is retired. Use the current Deno CLI.
          # First try an idempotent deploy to an existing app. If the app does not
          # exist yet, create it non-interactively from this monorepo with the
          # explicit dynamic entrypoint.
          if ! deno deploy --org "$DENO_ORG" --app "$DENO_APP" --prod; then
            deno deploy create . \
              --org "$DENO_ORG" \
              --app "$DENO_APP" \
              --source local \
              --do-not-use-detected-build-config \
              --runtime-mode dynamic \
              --entrypoint deno-secondary/main.ts \
              --working-directory . \
              --build-timeout 5 \
              --build-memory-limit 1024 \
              --region global
          fi

          # Exact-SHA proof is a runtime fact, not a repository assumption.
          # Keep the app's production environment aligned to the commit we are
          # about to deploy, then redeploy so /health can prove that exact SHA.
          deno deploy env update-value DEPLOYMENT_SOURCE_SHA "$GITHUB_SHA" --org "$DENO_ORG" --app "$DENO_APP" \
            || deno deploy env add DEPLOYMENT_SOURCE_SHA "$GITHUB_SHA" --org "$DENO_ORG" --app "$DENO_APP"
          deno deploy --org "$DENO_ORG" --app "$DENO_APP" --prod

          URL="${DENO_SECONDARY_URL:-https://${DENO_APP}.${DENO_ORG}.deno.net}"
          echo "secondary_url=$URL" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "DENO_DEPLOYED=true"
          echo "DENO_SECONDARY_URL_RESOLVED=$URL"

      - name: Probe the deployed secondary
        if: steps.deploy.outputs.deployed == 'true'
        env:
          DENO_SECONDARY_URL: ${{ steps.deploy.outputs.secondary_url }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DENO_SECONDARY_URL:-}" ]; then
            echo "DENO_HEALTH=NOT_PROBED"
            echo "REFUSED: deployed but no secondary URL could be resolved." >&2
            exit 1
          fi

          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 20 "$DENO_SECONDARY_URL/health" > /tmp/deno-health.json; then break; fi
            sleep 4
          done
          cat /tmp/deno-health.json
          GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('/tmp/deno-health.json').read_text())
          if data.get('ok') is not True:
              raise SystemExit('secondary /health did not report ok')
          if data.get('runtimeProvider') != 'deno-deploy':
              raise SystemExit('secondary did not identify as deno-deploy')
          if data.get('runtimeRole') != 'secondary-capacity-only':
              raise SystemExit('secondary must declare itself capacity-only')
          for field in ('routingAuthority', 'reasoningAuthority', 'modelSelectionAuthority'):
              if data.get(field) is not False:
                  raise SystemExit(f'secondary claims {field}; it holds no authority')
          if data.get('localInstallRequired') is not False:
              raise SystemExit('secondary unexpectedly requires local install')
          if data.get('deploymentSourceSha') != os.environ['GITHUB_SHA']:
              raise SystemExit(f"secondary exact SHA mismatch: {data.get('deploymentSourceSha')}")
          print('DENO_HEALTH=PASS')
          print('DENO_SHA_MATCH=PASS')
          PY

          curl --fail --silent --max-time 20 "$DENO_SECONDARY_URL/capabilities" > /tmp/deno-caps-live.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          caps=json.loads(Path('/tmp/deno-caps-live.json').read_text())
          if caps.get('runtimeRole') != 'secondary-capacity-only':
              raise SystemExit('live secondary role mismatch')
          tools=caps.get('tools', [])
          if 'market_snapshot' not in tools:
              raise SystemExit('live secondary market_snapshot missing')
          if re.search(r'place_order|cancel_order|withdraw|transfer|swap|bridge|wallet|payment', json.dumps(tools), re.I):
              raise SystemExit('live secondary exposed write/high-risk tool')
          print('DENO_CAPABILITIES=PASS')
          PY

          curl --fail --silent --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"action":"snapshot","symbol":"BTCUSDT","instrument":"spot","preferredVenue":"okx"}' \
            "$DENO_SECONDARY_URL/research/market" > /tmp/deno-research-live.json
          GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/deno-research-live.json').read_text())
          if data.get('ok') is not True or data.get('degraded') is True:
              raise SystemExit(f'live Deno research smoke failed: {data}')
          if data.get('capability') != 'market_snapshot':
              raise SystemExit('live Deno research capability mismatch')
          if 'okx' not in set(data.get('providers') or []):
              raise SystemExit('live Deno research missing preferred provider')
          dc=data.get('dataContract') or {}
          if dc.get('source_sha') != os.environ['GITHUB_SHA']:
              raise SystemExit('live Deno data contract SHA mismatch')
          if dc.get('research_only') is not True or (dc.get('authority') or {}).get('execution') != 'none':
              raise SystemExit('live Deno research authority boundary violated')
          print('DENO_RESEARCH_SMOKE=PASS')
          PY

      - name: Prove Cloudflare circuit-open failover to live Deno
        if: steps.deploy.outputs.deployed == 'true'
        env:
          DENO_SECONDARY_URL: ${{ steps.deploy.outputs.secondary_url }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/runtime-failover-selection.txt
          import importlib.util, sys
          from pathlib import Path
          d=Path('AI_SKILL_LIBRARY/v4/runtime_fabric')
          sys.path.insert(0,str(d))
          for name in ('fabric','acceptance'):
              spec=importlib.util.spec_from_file_location(name,d/(name+'.py'))
              mod=importlib.util.module_from_spec(spec)
              sys.modules[name]=mod
              spec.loader.exec_module(mod)
          import acceptance
          result=acceptance.failover_proof(primary_state='CIRCUIT_OPEN')
          if result.get('status')!='PASS' or result.get('selected')!='deno_deploy':
              raise SystemExit(f'failover selection failed: {result}')
          print('RUNTIME_FAILOVER_SELECTION=PASS selected=deno_deploy primary=CIRCUIT_OPEN')
          PY
          cat /tmp/runtime-failover-selection.txt

          curl --fail --silent --max-time 30 \
            -H 'content-type: application/json' \
            -d '{"action":"snapshot","symbol":"BTCUSDT","instrument":"spot","preferredVenue":"okx"}' \
            "$DENO_SECONDARY_URL/research/market" > /tmp/runtime-failover-live.json
          GITHUB_SHA="$GITHUB_SHA" python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/runtime-failover-live.json').read_text())
          if data.get('ok') is not True or data.get('degraded') is True:
              raise SystemExit(f'failover runtime response invalid: {data}')
          if data.get('capability')!='market_snapshot':
              raise SystemExit('failover capability mismatch')
          dc=data.get('dataContract') or {}
          if dc.get('source_sha')!=os.environ['GITHUB_SHA']:
              raise SystemExit(f"failover SHA mismatch: {dc.get('source_sha')}")
          if (dc.get('provenance') or {}).get('runtime')!='deno-deploy':
              raise SystemExit(f"failover did not execute on Deno: {dc.get('provenance')}")
          if dc.get('research_only') is not True or (dc.get('authority') or {}).get('execution')!='none':
              raise SystemExit('failover authority boundary violated')
          print('FAILOVER_CLOUDFLARE_TO_DENO=PASS')
          print('FAILOVER_PROOF=PASS')
          PY
