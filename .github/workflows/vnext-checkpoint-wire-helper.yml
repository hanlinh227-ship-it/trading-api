name: vNext Checkpoint Wire Helper

on:
  push:
    branches:
      - github-brain-vnext-phases-b-h
    paths:
      - '.github/workflows/vnext-checkpoint-wire-helper.yml'

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-brain-vnext-phases-b-h
          fetch-depth: 0
      - name: Add canonical vNext checkpoint pointers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('AI_SKILL_LIBRARY/checkpoint.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          additions = {
              'vnext_integration_policy_path': 'AI_SKILL_LIBRARY/v4/integrations/policy.yaml',
              'agent_skill_compatibility_tool_path': 'AI_SKILL_LIBRARY/v4/tools/agent_skill_compat.py',
              'vnext_integration_adapter_tool_path': 'AI_SKILL_LIBRARY/v4/tools/integration_adapters.py',
              'adaptive_execution_tool_path': 'AI_SKILL_LIBRARY/v4/tools/adaptive_execution.py',
              'free_model_discovery_tool_path': 'AI_SKILL_LIBRARY/v4/tools/discover_free_models.py',
              'legion_runtime_tool_path': 'AI_SKILL_LIBRARY/v4/tools/legion.py',
          }
          for key, value in additions.items():
              current = data.get(key)
              if current not in (None, value):
                  raise SystemExit(f'checkpoint conflict for {key}: {current!r}')
              data[key] = value
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          PY
          git diff --check
      - name: Commit checkpoint wiring
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/checkpoint.json
          git diff --cached --check
          git commit -m "feat(vnext): resolve bounded integrations from checkpoint"
          git push origin HEAD:github-brain-vnext-phases-b-h
