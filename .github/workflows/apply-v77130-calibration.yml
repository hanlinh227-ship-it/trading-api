name: Apply V77.13 Calibration RR Quality
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77130_calibration_rr_quality.js'
      - '.github/workflows/apply-v77130-calibration.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77130_DIAGNOSTIC.txt
          node --check scripts/apply_v77130_calibration_rr_quality.js >> V77130_DIAGNOSTIC.txt 2>&1; echo GENERATOR_EXIT=$? >> V77130_DIAGNOSTIC.txt
          node scripts/apply_v77130_calibration_rr_quality.js >> V77130_DIAGNOSTIC.txt 2>&1; echo MIGRATION_EXIT=$? >> V77130_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77130_DIAGNOSTIC.txt 2>&1; echo WORKER_SYNTAX_EXIT=$? >> V77130_DIAGNOSTIC.txt
          for t in 'V77.13.0' 'SYMBOL_KNOWLEDGE' 'minimumQualityRR' 'RR_QUALITY_REQUIRED' 'recordShadowSetup' 'shadowSetups' '/knowledge' '/shadow' 'targetTier'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77130_DIAGNOSTIC.txt; else echo "$t=NO" >> V77130_DIAGNOSTIC.txt; fi; done
          exit 0
      - name: Commit on pass
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77130_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77130_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77130_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77130_DIAGNOSTIC.txt && grep -q 'V77.13.0=YES' V77130_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.13 calibrated RR quality layer' || exit 0
          git push origin main
