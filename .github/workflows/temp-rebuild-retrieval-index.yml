name: Temporary Retrieval Index Rebuild

on:
  push:
    branches:
      - feature/multi-coin-a-plus-scanner-tdd

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-coin-a-plus-scanner-tdd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Rebuild canonical retrieval index
        run: |
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --check --root .
      - name: Commit generated index when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml; then
            echo 'retrieval index already fresh'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git commit -m 'chore: rebuild retrieval index for scanner authority'
          git push origin HEAD:feature/multi-coin-a-plus-scanner-tdd
