name: Blind Crypto Backtest V8

on:
  push:
    paths:
      - "scripts/blind_backtest_crypto_v8.py"
      - ".github/workflows/blind-backtest-v8.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blind-crypto-backtest-v8
  cancel-in-progress: false

jobs:
  blind-backtest-v8:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run V8 blind backtest
        shell: bash
        run: |
          mkdir -p data
          python3 scripts/blind_backtest_crypto_v8.py
      - name: Commit V8 result
        shell: bash
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v8.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run V8 balanced blind crypto backtest"
          git pull --rebase origin main
          git push origin HEAD:main
