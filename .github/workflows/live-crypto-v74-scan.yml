name: Live Crypto V74 Scan

on:
  push:
    paths:
      - '.github/workflows/live-crypto-v74-scan.yml'
      - 'data/live_scan_request.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch fresh Binance market data and rank V74 candidates
        env:
          PYTHONUNBUFFERED: '1'
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          from datetime import datetime, timezone

          BASE='https://data-api.binance.vision'

          def get(path,params=None,timeout=10):
              q=('?'+urllib.parse.urlencode(params)) if params else ''
              req=urllib.request.Request(BASE+path+q,headers={'User-Agent':'trading-api-v74/1.1'})
              with urllib.request.urlopen(req,timeout=timeout) as r:
                  return json.loads(r.read().decode())

          def ema(vals,n):
              a=2/(n+1); x=vals[0]
              for v in vals[1:]: x=a*v+(1-a)*x
              return x

          def rsi(vals,n=14):
              ds=[vals[i]-vals[i-1] for i in range(1,len(vals))]
              up=[max(x,0) for x in ds[-n:]]; dn=[max(-x,0) for x in ds[-n:]]
              au=sum(up)/n; ad=sum(dn)/n
              return 100 if ad==0 else 100-(100/(1+au/ad))

          def atr(rows,n=14):
              tr=[]
              for i in range(1,len(rows)):
                  h,l,pc=rows[i][2],rows[i][3],rows[i-1][4]
                  tr.append(max(h-l,abs(h-pc),abs(l-pc)))
              return sum(tr[-n:])/n

          def bars(sym,interval,limit=220):
              raw=get('/api/v3/klines',{'symbol':sym+'USDT','interval':interval,'limit':limit})
              return [[int(x[0]),float(x[1]),float(x[2]),float(x[3]),float(x[4]),float(x[5])] for x in raw]

          def metrics(rows):
              c=[x[4] for x in rows]
              return {'close':c[-1],'ema20':ema(c[-80:],20),'ema50':ema(c[-150:],50),'ema200':ema(c,200),'rsi':rsi(c),'atr':atr(rows)}

          def recent_sweep(rows,side):
              rr=rows[:-1]
              for j in range(max(12,len(rr)-8),len(rr)):
                  if j<10: continue
                  prior=rr[j-10:j]
                  if side=='LONG':
                      lvl=min(x[3] for x in prior)
                      if rr[j][3] < lvl and rr[j][4] > lvl: return True,lvl,j
                  else:
                      lvl=max(x[2] for x in prior)
                      if rr[j][2] > lvl and rr[j][4] < lvl: return True,lvl,j
              return False,None,None

          def m5_trigger(rows,side):
              rr=rows[:-1]
              last=rr[-1]; prev=rr[-2]
              a=atr(rr); body=abs(last[4]-last[1])
              if side=='LONG':
                  prior_hi=max(x[2] for x in rr[-10:-2])
                  disp=(last[4]>prior_hi and last[4]>last[1] and body>=0.45*a)
                  reclaim=(prev[3]<min(x[3] for x in rr[-10:-2]) and prev[4]>prev[1] and last[4]>prev[4])
                  return bool(disp or reclaim), {'disp':disp,'reclaim':reclaim,'priorBreak':prior_hi}
              prior_lo=min(x[3] for x in rr[-10:-2])
              disp=(last[4]<prior_lo and last[4]<last[1] and body>=0.45*a)
              reclaim=(prev[2]>max(x[2] for x in rr[-10:-2]) and prev[4]<prev[1] and last[4]<prev[4])
              return bool(disp or reclaim), {'disp':disp,'reclaim':reclaim,'priorBreak':prior_lo}

          cfg=json.load(open('data/nocut_intraday_allpass_v73.json'))
          universe=list(cfg['crypto']['symbols'])
          ex=get('/api/v3/exchangeInfo')
          tradable={s['symbol'] for s in ex['symbols'] if s.get('status')=='TRADING'}
          ticks=get('/api/v3/ticker/24hr')
          tv={t['symbol']:t for t in ticks if t.get('symbol','').endswith('USDT')}
          candidates=[]
          for s in universe:
              pair=s+'USDT'
              if pair in tradable and pair in tv:
                  try:qv=float(tv[pair].get('quoteVolume') or 0)
                  except:qv=0
                  candidates.append((qv,s))
          candidates=sorted(candidates,reverse=True)[:10]

          out=[]
          for qv,s in candidates:
              try:
                  D=bars(s,'1d'); H4=bars(s,'4h'); H1=bars(s,'1h'); M15=bars(s,'15m'); M5=bars(s,'5m')
                  md,m4,m1,m15,m5=map(metrics,(D,H4,H1,M15,M5))
                  book=get('/api/v3/ticker/bookTicker',{'symbol':s+'USDT'})
                  bid=float(book['bidPrice']); ask=float(book['askPrice']); mid=(bid+ask)/2
                  spread=(ask-bid)/mid if mid else 0
                  scores={}; detail={}
                  for side in ('LONG','SHORT'):
                      sign=1 if side=='LONG' else -1
                      sc=0.0
                      sc += 1.0 if sign*(md['close']-md['ema20'])>0 else -0.5
                      sc += 1.2 if sign*(m4['close']-m4['ema20'])>0 else -0.7
                      sc += 1.0 if sign*(m4['ema20']-m4['ema50'])>0 else -0.6
                      sc += 1.4 if sign*(m1['close']-m1['ema20'])>0 else -0.8
                      sc += 1.2 if sign*(m1['ema20']-m1['ema50'])>0 else -0.7
                      sc += 0.7 if sign*(m15['close']-m15['ema20'])>0 else -0.3
                      sc += 0.5 if sign*(m5['close']-m5['ema20'])>0 else -0.2
                      healthy=(48<=m1['rsi']<=68) if side=='LONG' else (32<=m1['rsi']<=52)
                      sc += 0.8 if healthy else 0
                      dist=abs(m1['close']-m1['ema20'])/max(m1['atr'],1e-12)
                      if dist<=1.0: sc+=0.8
                      elif dist>1.6: sc-=1.3
                      sw,lvl,_=recent_sweep(M15,side)
                      if sw: sc+=1.8
                      trig,tg=m5_trigger(M5,side)
                      if trig: sc+=2.2
                      scores[side]=sc
                      detail[side]={'m15Sweep':sw,'sweepLevel':lvl,'m5Trigger':trig,**tg}
                  side=max(scores,key=scores.get); score=scores[side]
                  a15=m15['atr']
                  if side=='LONG':
                      swing=min(x[3] for x in M15[-10:-1]); sl=min(swing-0.12*a15,mid-0.65*a15); risk=mid-sl; tp1=mid+risk; tp2=mid+2*risk
                      h1target=max(x[2] for x in H1[-30:-1]); room=(h1target-mid)/risk if risk>0 else -99
                  else:
                      swing=max(x[2] for x in M15[-10:-1]); sl=max(swing+0.12*a15,mid+0.65*a15); risk=sl-mid; tp1=mid-risk; tp2=mid-2*risk
                      h1target=min(x[3] for x in H1[-30:-1]); room=(mid-h1target)/risk if risk>0 else -99
                  out.append({
                    'symbol':s,'side':side,'score':round(score,3),'marketReady':bool(score>=6.0 and (detail[side]['m5Trigger'] or detail[side]['m15Sweep'])),
                    'bid':bid,'ask':ask,'mid':mid,'spreadPct':round(spread*100,5),'quoteVolume24h':qv,
                    'D1':md,'H4':m4,'H1':m1,'M15':m15,'M5':m5,'trigger':detail[side],
                    'sl':sl,'risk':risk,'tp1':tp1,'tp2':tp2,'roomToH1LiquidityR':room,'rr2EligibleByRoom':bool(room>=2.2)
                  })
              except Exception as e:
                  out.append({'symbol':s,'error':repr(e)})

          good=[x for x in out if 'error' not in x]
          good.sort(key=lambda x:(x['marketReady'],x['score']),reverse=True)
          now=datetime.now(timezone.utc)
          result={'fetchedAtUTC':now.isoformat(),'epochMs':int(now.timestamp()*1000),'source':'Binance public REST fetched from GitHub-hosted runner','candidateCount':len(good),'top':good[:8]}
          print('LIVE_SCAN_JSON_START')
          print(json.dumps(result,separators=(',',':')))
          print('LIVE_SCAN_JSON_END')
          PY
