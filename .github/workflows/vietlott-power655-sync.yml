name: Vietlott Power 6/55 Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 2,4,6'
  push:
    paths:
      - '.github/workflows/vietlott-power655-sync.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate Power 6/55 full history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/vietlott/power655
          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/vietvudanh/vietlott-data/main/data/power655.jsonl' \
            -o /tmp/power655.source.jsonl
          python3 - <<'PY'
          import csv, json, pathlib, datetime
          src = pathlib.Path('/tmp/power655.source.jsonl')
          out_dir = pathlib.Path('data/vietlott/power655')
          rows, seen = [], set()
          for raw in src.read_text(encoding='utf-8').splitlines():
              if not raw.strip(): continue
              x = json.loads(raw)
              draw_id = str(x['id']).zfill(5)
              result = [int(v) for v in x['result']]
              if len(result) != 7: raise SystemExit(f'Invalid result length at {draw_id}: {result}')
              main, power = result[:6], result[6]
              if len(set(main)) != 6 or any(v < 1 or v > 55 for v in result): raise SystemExit(f'Invalid numbers at {draw_id}: {result}')
              if draw_id in seen: raise SystemExit(f'Duplicate draw id: {draw_id}')
              seen.add(draw_id)
              rows.append((x['date'], draw_id, *main, power))
          rows.sort(key=lambda r: int(r[1]))
          if not rows or rows[0][1] != '00001': raise SystemExit('History does not start at #00001')
          for i, row in enumerate(rows, 1):
              if int(row[1]) != i: raise SystemExit(f'Non-contiguous draw ids around #{i:05d}: got {row[1]}')
          with (out_dir/'power655_all_draws.csv').open('w', newline='', encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['date','draw_id','n1','n2','n3','n4','n5','n6','power_number']); w.writerows(rows)
          with (out_dir/'power655_all_draws.jsonl').open('w', encoding='utf-8') as f:
              for r in rows:
                  f.write(json.dumps({'date':r[0],'draw_id':r[1],'numbers':list(r[2:8]),'power_number':r[8]},ensure_ascii=False,separators=(',',':'))+'\n')
          meta={'product':'Vietlott Power 6/55','draw_count':len(rows),'first_draw':{'id':rows[0][1],'date':rows[0][0],'numbers':list(rows[0][2:8]),'power_number':rows[0][8]},'latest_draw':{'id':rows[-1][1],'date':rows[-1][0],'numbers':list(rows[-1][2:8]),'power_number':rows[-1][8]},'updated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'upstream':'vietvudanh/vietlott-data:data/power655.jsonl','note':'First six values are main numbers; seventh upstream value is Power/Jackpot-2 number.'}
          (out_dir/'metadata.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(meta,ensure_ascii=False,indent=2))
          PY

      - name: Commit refreshed dataset
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- data/vietlott/power655; then echo 'No dataset changes.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vietlott/power655
          git commit -m 'data(vietlott): sync Power 6/55 history'
          git push
