name: Vietlott Power 6/55 Data Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '30 12 * * 2,4,6'
  push:
    paths:
      - '.github/workflows/vietlott-power655-sync.yml'
      - 'scripts/vietlott/power655_math_transform_research.py'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: project
      - name: Checkout public Vietlott dataset
        uses: actions/checkout@v4
        with:
          repository: vietvudanh/vietlott-data
          ref: main
          path: upstream
      - name: Normalize dataset
        shell: bash
        run: |
          set -euo pipefail
          cd project
          mkdir -p data/vietlott/power655
          python3 - <<'PY'
          import csv,json,pathlib,datetime
          src=pathlib.Path('../upstream/data/power655.jsonl'); out=pathlib.Path('data/vietlott/power655'); repairs={'00944':[8,23,30,34,38,47,10]}; rows=[]
          for raw in src.read_text().splitlines():
            if not raw.strip(): continue
            x=json.loads(raw); did=str(x['id']).zfill(5); r=[int(v) for v in x['result']]
            if did in repairs:r=repairs[did]
            if len(r)!=7 or len(set(r[:6]))!=6: raise SystemExit(f'invalid {did}')
            rows.append((x['date'],did,*r))
          rows.sort(key=lambda x:int(x[1]))
          for i,r in enumerate(rows,1):
            if int(r[1])!=i:raise SystemExit(f'gap {i}')
          with (out/'power655_all_draws.csv').open('w',newline='') as f:
            w=csv.writer(f);w.writerow(['date','draw_id','n1','n2','n3','n4','n5','n6','power_number']);w.writerows(rows)
          print('draws',len(rows))
          PY
      - name: Mathematical transform cycle research
        shell: bash
        run: |
          set -euo pipefail
          cd project
          python3 scripts/vietlott/power655_math_transform_research.py
      - name: Commit research
        shell: bash
        run: |
          set -euo pipefail
          cd project
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/vietlott/power655
          if git diff --cached --quiet; then echo 'No changes.'; exit 0; fi
          git commit -m 'research(vietlott): mathematical transform cycle results'
          git push
