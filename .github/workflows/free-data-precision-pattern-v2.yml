name: Free Data Precision Pattern V2
on:
  push:
    paths:
      - 'scripts/free_data_precision_pattern_v2.py'
      - '.github/workflows/free-data-precision-pattern-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pattern:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run online all-symbol precision pattern model
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/free_data_precision_pattern_v2.py
