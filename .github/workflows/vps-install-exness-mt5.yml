name: VPS Install Exness MT5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-install-exness-mt5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exness-mt5-vps
  cancel-in-progress: false

jobs:
  install:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 25
    steps:
      - name: Install Exness MT5 in isolated Wine prefix
        shell: bash
        run: |
          set -euo pipefail
          BASE=/opt/trading/mt5-exness
          PREFIX="$BASE/wineprefix"
          EXNESS_INSTALLER="$BASE/exness5setup.exe"
          MQ_INSTALLER="$BASE/mt5setup.exe"
          LOG="$BASE/install.log"
          EXNESS_URL='https://download.terminal.free/cdn/web/exness.technologies.ltd/mt5/exness5setup.exe'
          MQ_URL='https://download.terminal.free/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe'
          WIN_PATH='C:\Program Files\Exness MT5'
          mkdir -p "$BASE"
          chmod 700 "$BASE"
          export HOME=/root
          export WINEPREFIX="$PREFIX"
          export WINEDEBUG=-all
          export DISPLAY=:99
          # Prevent the GitHub runner from classifying Wine installer children as job orphans.
          export RUNNER_TRACKING_ID=''

          echo '=== EXNESS_MT5_INSTALL_V2 ==='
          echo "WINE=$(wine --version)"
          echo "PREFIX=$PREFIX"

          if ! pgrep -f 'Xvfb :99' >/dev/null 2>&1; then
            nohup Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >"$BASE/xvfb.log" 2>&1 &
            sleep 2
          fi

          if [ ! -d "$PREFIX/drive_c" ]; then
            wineboot -u >"$BASE/wineboot.log" 2>&1 || true
            sleep 5
          fi
          winecfg -v win10 >/dev/null 2>&1 || true

          find_terminal() {
            find "$PREFIX/drive_c" -type f -iname terminal64.exe 2>/dev/null | head -1 || true
          }
          wait_terminal() {
            local n t
            for n in $(seq 1 90); do
              t="$(find_terminal)"
              if [ -n "$t" ]; then printf '%s' "$t"; return 0; fi
              sleep 2
            done
            return 1
          }

          TERMINAL="$(find_terminal)"
          if [ -z "$TERMINAL" ]; then
            curl -fL --retry 3 --connect-timeout 20 "$EXNESS_URL" -o "$EXNESS_INSTALLER"
            test -s "$EXNESS_INSTALLER"
            echo "EXNESS_INSTALLER_BYTES=$(stat -c %s "$EXNESS_INSTALLER")"
            file "$EXNESS_INSTALLER"

            set +e
            wine "$EXNESS_INSTALLER" /auto /path:"$WIN_PATH" >"$LOG" 2>&1 &
            INSTALL_PID=$!
            set -e
            echo "EXNESS_INSTALLER_PID=$INSTALL_PID"

            TERMINAL="$(wait_terminal || true)"
            if [ -z "$TERMINAL" ]; then
              echo 'EXNESS_WEB_INSTALLER_NO_TERMINAL=YES'
              echo '--- EXNESS INSTALL LOG TAIL ---'
              tail -100 "$LOG" 2>/dev/null || true
              # Reliable fallback: official MetaQuotes MT5 binary in the same isolated prefix.
              # Broker connection remains Exness-specific at account/server login time.
              curl -fL --retry 3 --connect-timeout 20 "$MQ_URL" -o "$MQ_INSTALLER"
              test -s "$MQ_INSTALLER"
              echo "MQ_INSTALLER_BYTES=$(stat -c %s "$MQ_INSTALLER")"
              set +e
              wine "$MQ_INSTALLER" /auto /path:"$WIN_PATH" >>"$LOG" 2>&1 &
              MQ_PID=$!
              set -e
              echo "MQ_INSTALLER_PID=$MQ_PID"
              TERMINAL="$(wait_terminal || true)"
            fi
          else
            echo 'MT5_ALREADY_PRESENT=YES'
          fi

          if [ -z "$TERMINAL" ]; then
            echo '--- PREFIX EXECUTABLE DIAGNOSTIC ---'
            find "$PREFIX/drive_c" -maxdepth 7 -type f \( -iname '*.exe' -o -iname '*.log' \) 2>/dev/null | head -200 || true
            exit 1
          fi

          METAEDITOR="$(find "$(dirname "$TERMINAL")" -maxdepth 2 -type f -iname metaeditor64.exe 2>/dev/null | head -1 || true)"
          echo "MT5_TERMINAL=$TERMINAL"
          echo "MT5_METAEDITOR=$METAEDITOR"
          test -x "$TERMINAL" -o -f "$TERMINAL"

          # Real boot test under the virtual display.
          wine "$TERMINAL" /portable >/dev/null 2>&1 &
          PID=$!
          sleep 15
          if kill -0 "$PID" 2>/dev/null; then
            echo "MT5_PROCESS_BOOT=PASS pid=$PID"
            kill "$PID" 2>/dev/null || true
          else
            echo 'MT5_PROCESS_BOOT=EXITED_EARLY'
            exit 1
          fi
          wineserver -w || true

          echo '--- CONFIG KEY NAMES ONLY ---'
          grep -RhoE '^[A-Za-z_][A-Za-z0-9_]*(?==)' /etc/trading 2>/dev/null | grep -Ei 'EXNESS|MT5|META.?TRADER' | sort -u | head -100 || true
          echo 'EXNESS_MT5_INSTALL=PASS'
