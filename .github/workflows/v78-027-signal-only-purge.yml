name: V78-027 Signal-Only Cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-027-signal-only-purge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate signal-only source
        run: |
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/hub-v77171.js
          node --check cloudflare-worker/providers/entry-intelligence.js
          ! grep -q 'runHyroAutoCycle' cloudflare-worker/index.js
          ! grep -q 'callback_data:"prop"' cloudflare-worker/hub-v77171.js
          ! grep -q 'getHyroDecisionEvidence' cloudflare-worker/hub-v77171.js
      - name: Purge Hyro-only KV records
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN','')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID','')
          ns=os.environ.get('TRADING_KV_NAMESPACE_ID','')
          if not token or not account or not ns:
              raise SystemExit('CLOUDFLARE_KV_SECRETS_MISSING')
          base=f'https://api.cloudflare.com/client/v4/accounts/{account}/storage/kv/namespaces/{ns}'
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def req(url, method='GET'):
              r=urllib.request.Request(url,headers=headers,method=method)
              with urllib.request.urlopen(r,timeout=30) as x:
                  raw=x.read()
              return json.loads(raw or b'{}')
          keys=[]; cursor=None
          while True:
              qs={'limit':1000}
              if cursor: qs['cursor']=cursor
              p=req(base+'/keys?'+urllib.parse.urlencode(qs))
              rows=p.get('result') or []
              keys.extend([str(x.get('name') or '') for x in rows])
              cursor=(p.get('result_info') or {}).get('cursor')
              if not cursor: break
          targets=[k for k in keys if 'hyro' in k.lower()]
          deleted=[]
          for k in targets:
              url=base+'/values/'+urllib.parse.quote(k,safe='')
              try:
                  req(url,'DELETE'); deleted.append(k)
              except Exception as e:
                  raise SystemExit(f'FAILED_DELETE:{k}:{e}')
          os.makedirs('docs/ai-coengineer',exist_ok=True)
          with open('docs/ai-coengineer/V78-027_VALIDATION.txt','w') as f:
              f.write('V78-027 SIGNAL-ONLY CLEANUP\n')
              f.write('SOURCE_CHECK=PASS\n')
              f.write(f'KV_KEYS_SCANNED={len(keys)}\n')
              f.write(f'HYRO_KEYS_MATCHED={len(targets)}\n')
              f.write(f'HYRO_KEYS_DELETED={len(deleted)}\n')
              f.write('FILTER=case-insensitive substring hyro\n')
              f.write('V775_BOOKS_PRESERVED=true\n')
              f.write('TRADING_STATE_RESET=false\n')
              f.write('ACTIVE_EXECUTION_AUTHORITY=SIGNAL_ONLY\n')
              for k in deleted:
                  f.write('DELETED_KEY='+k+'\n')
          print(json.dumps({'scanned':len(keys),'hyroMatched':len(targets),'hyroDeleted':len(deleted)}))
          PY
      - name: Persist validation
        run: |
          git config user.name 'V78-027 Cleanup'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ai-coengineer/V78-027_VALIDATION.txt
          git commit -m 'V78-027 record signal-only cleanup validation' || true
          git push origin HEAD:main
