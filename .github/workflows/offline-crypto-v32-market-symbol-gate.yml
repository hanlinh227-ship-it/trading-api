name: Offline Crypto V32 Market Symbol Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v32_market_symbol_gate.py'
      - '.github/workflows/offline-crypto-v32-market-symbol-gate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto V32 zero-credit market-symbol gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v32_market_symbol_gate.py
