name: Free FX Daily Precision V6
on:
  push:
    paths:
      - 'scripts/free_fx_daily_precision_v6.py'
      - '.github/workflows/free-fx-daily-precision-v6.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dailyfx:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run 28-pair daily Forex precision evolution
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/free_fx_daily_precision_v6.py
