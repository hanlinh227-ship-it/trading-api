name: V77.18.37 Price First No Global
on:
  push:
    branches: [v771837-price-first-no-global]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771837-price-first-no-global
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V77.18.37
        run: python3 scripts/patch_v771837_price_first.py
      - name: Validate source bundle
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771837-dist
      - name: Commit production source
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js cloudflare-worker/dual-ai-intervention.js cloudflare-worker/index.js
          git commit -m "V77.18.37 price-first no-global actions" || exit 0
          git pull --rebase origin v771837-price-first-no-global
          git push origin HEAD:v771837-price-first-no-global
# trigger
