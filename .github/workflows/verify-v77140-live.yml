name: Verify V77.14 Production Futures Entry Hub

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/index.js'
      - '.github/workflows/verify-v77140-live.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait for Cloudflare deploy
        run: sleep 35
      - name: Run production checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77140_LIVE_CHECK.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/status.json; echo "STATUS_CURL=$?" >> V77140_LIVE_CHECK.txt
          curl -fsS --max-time 55 "$BASE/run-now?group=future" -o /tmp/future.json; echo "FUTURE_CURL=$?" >> V77140_LIVE_CHECK.txt
          curl -fsS --max-time 15 "$BASE/knowledge?symbol=NQ" -o /tmp/nqk.json; echo "NQ_KNOWLEDGE_CURL=$?" >> V77140_LIVE_CHECK.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/orders1.json; echo "ORDERS1_CURL=$?" >> V77140_LIVE_CHECK.txt
          python - <<'PY' >> V77140_LIVE_CHECK.txt
          import json
          def load(p):
            try:
              with open(p) as f:return json.load(f)
            except:return {}
          s=load('/tmp/status.json'); f=load('/tmp/future.json'); k=load('/tmp/nqk.json'); o=load('/tmp/orders1.json')
          print('VERSION='+str(s.get('version')))
          print('STATUS_OK='+('YES' if s.get('ok') else 'NO'))
          print('MASSIVE='+str(s.get('massive')))
          print('HUB_ORDER='+','.join((s.get('hub') or {}).get('order') or []))
          print('FUTURE='+str(f.get('broadOk'))+'/'+str(f.get('requested'))+' deep='+str(f.get('deepOk'))+'/'+str(f.get('deepRequested')))
          print('FRONT='+str((f.get('diagnostics') or {}).get('frontContracts')))
          rows=[]
          plans=0
          for a in f.get('analyses') or []:
            p=a.get('planned') or {}
            if p: plans+=1
            rows.append(str(a.get('symbol'))+':'+str(a.get('status'))+':'+str(a.get('reason'))+':plan='+str(p.get('mode'))+':rr='+str(p.get('targetRR')))
          print('FUTURE_RESULTS='+'|'.join(rows))
          print('FUTURE_PLANS='+str(plans))
          print('NQ_KNOWLEDGE='+('YES' if k.get('knowledge') else 'NO'))
          print('FUTURE_BOOK_WATCH='+str(len(((o.get('future') or {}).get('watch') or []))))
          PY
          echo 'WAIT_MASSIVE_RATE_RESET=YES' >> V77140_LIVE_CHECK.txt
          sleep 65
          curl -fsS --max-time 35 "$BASE/analyze?symbol=MNQ" -o /tmp/mnq.json; echo "MNQ_CURL=$?" >> V77140_LIVE_CHECK.txt
          curl -fsS --max-time 45 "$BASE/run-now?group=crypto" -o /tmp/crypto.json; echo "CRYPTO_CURL=$?" >> V77140_LIVE_CHECK.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/orders2.json; echo "ORDERS2_CURL=$?" >> V77140_LIVE_CHECK.txt
          python - <<'PY' >> V77140_LIVE_CHECK.txt
          import json
          def load(p):
            try:
              with open(p) as f:return json.load(f)
            except:return {}
          m=load('/tmp/mnq.json'); c=load('/tmp/crypto.json'); o=load('/tmp/orders2.json')
          print('MNQ='+str(m.get('ok'))+':'+str(m.get('status'))+':'+str(m.get('reason'))+':source='+str(m.get('source'))+':plan='+str((m.get('planned') or {}).get('mode')))
          print('CRYPTO='+str(c.get('broadOk'))+'/'+str(c.get('requested'))+' deep='+str(c.get('deepOk'))+'/'+str(c.get('deepRequested')))
          print('CRYPTO_RESULTS='+'|'.join(str(a.get('symbol'))+':'+str(a.get('status'))+':'+str(a.get('reason'))+':plan='+str((a.get('planned') or {}).get('mode')) for a in c.get('analyses') or []))
          print('WATCH_DURABLE_ZERO='+('YES' if all(len(((o.get(g) or {}).get('watch') or []))==0 for g in ['forex','crypto','metal','future']) else 'NO'))
          ok=(m.get('ok') is not False and c.get('deepOk',0)>=3)
          print('VERDICT='+('PASS' if ok else 'FAIL'))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77140_LIVE_CHECK.txt
          git commit -m 'Report V77.14 production Futures entry verification' || exit 0
          git push origin main
