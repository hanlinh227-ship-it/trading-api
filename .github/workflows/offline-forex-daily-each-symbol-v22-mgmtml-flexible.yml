name: Offline Forex Daily Each Symbol V22 Flexible
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v22_mgmtml_flexible.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v22-mgmtml-flexible.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run flexible per-pair management classifier
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v22_mgmtml_flexible.py
