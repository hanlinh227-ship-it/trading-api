name: Offline Crossmarket Optimizer 80WR
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crossmarket_optimizer_80wr.py'
      - '.github/workflows/offline-crossmarket-optimizer-80wr.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-credit optimizer
        run: |
          python scripts/offline_crossmarket_optimizer_80wr.py
          echo '--- RESULT SUMMARY ---'
          python - <<'PY'
          import json
          x=json.load(open('data/offline_crossmarket_optimizer_80wr.json'))
          print(json.dumps({
            'providerCreditsUsed':x['providerCreditsUsed'],
            'promotion':x['promotion'],
            'FOREX':{
              'baselineAll':x['FOREX']['baselineAll'],
              'nestedHeldoutQualified':x['FOREX']['nestedHeldoutQualified'],
              'targetMet':x['FOREX']['targetMet']},
            'CRYPTO':{
              'all':x['CRYPTO']['all'],
              'walkForwardSelected':x['CRYPTO']['walkForwardSelected'],
              'inSampleCeiling':x['CRYPTO']['inSampleCeiling'],
              'targetMet':x['CRYPTO']['targetMet']}
          },indent=2))
          PY
