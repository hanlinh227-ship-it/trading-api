name: Diagnose V77.10 Fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-v77100-fast.yml'
      - 'scripts/apply_v77100_adaptive_entry_freedom.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run fast diagnostic
        shell: bash
        run: |
          set +e
          : > V77100_FAST_DIAGNOSTIC.txt
          echo "HEAD=$(git rev-parse HEAD)" >> V77100_FAST_DIAGNOSTIC.txt
          node --check scripts/apply_v77100_adaptive_entry_freedom.js >> V77100_FAST_DIAGNOSTIC.txt 2>&1
          echo "GENERATOR_EXIT=$?" >> V77100_FAST_DIAGNOSTIC.txt
          node scripts/apply_v77100_adaptive_entry_freedom.js >> V77100_FAST_DIAGNOSTIC.txt 2>&1
          echo "MIGRATION_EXIT=$?" >> V77100_FAST_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77100_FAST_DIAGNOSTIC.txt 2>&1
          echo "WORKER_SYNTAX_EXIT=$?" >> V77100_FAST_DIAGNOSTIC.txt
          grep -o 'V77\.[0-9]*\.[0-9]*' cloudflare-worker/index.js | head -1 >> V77100_FAST_DIAGNOSTIC.txt || true
          for t in profileMode adaptiveLocationPolicy adaptiveTriggerPolicy indicativePlan deepShortlist cryptoDeepTarget skippedUnavailable runSymbol; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77100_FAST_DIAGNOSTIC.txt; else echo "$t=NO" >> V77100_FAST_DIAGNOSTIC.txt; fi
          done
          exit 0
      - name: Commit diagnostic and canonical Worker on pass
        shell: bash
        run: |
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V77100_FAST_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77100_FAST_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77100_FAST_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77100_FAST_DIAGNOSTIC.txt && grep -q '^V77.10.0$' V77100_FAST_DIAGNOSTIC.txt; then
            git add cloudflare-worker/index.js
          fi
          git commit -m 'Promote V77.10 adaptive entry Worker' || exit 0
          git push origin main
# promote canonical on verified syntax pass
