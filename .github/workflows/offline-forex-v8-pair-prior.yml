name: Offline Forex V8 Pair Prior
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v8_pair_prior.py'
      - '.github/workflows/offline-forex-v8-pair-prior.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Forex V8 zero-credit pair-prior validation
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v8_pair_prior.py
