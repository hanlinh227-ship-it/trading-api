name: Verify MT5 Forex Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-mt5-forex-runtime.yml'

permissions:
  contents: read

concurrency:
  group: verify-mt5-forex-runtime
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 25
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}
    steps:
      - name: Assert authorized VPS and canonical runtime
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "trading-vps"
          FQDN="$(hostname -f 2>/dev/null || hostname)"
          HOST="$(hostname)"
          [[ "$FQDN" = "59670.vpsvinahost.vn" || "$HOST" = "59670" ]] || { echo 'ERROR: unauthorized verification host' >&2; exit 90; }
          test -n "${MT5_ACCOUNT_LOGIN:-}"
          test -n "${MT5_ACCOUNT_SERVER:-}"
          test -n "${MT5_BRIDGE_TOKEN:-}"
          test -x /opt/trading/trading-api-main/vps/mt5-forex/verify-live-readiness.sh
          echo 'VERIFY_RUNNER=PASS'

      - name: Verify layered MT5 broker readiness
        shell: bash
        run: |
          set -euo pipefail
          sudo -u mt5forex env \
            FOREX_RESEARCH_REPO=/opt/trading/trading-api-main \
            MT5_ACCOUNT_LOGIN="$MT5_ACCOUNT_LOGIN" \
            MT5_ACCOUNT_SERVER="$MT5_ACCOUNT_SERVER" \
            MT5_BRIDGE_TOKEN="$MT5_BRIDGE_TOKEN" \
            MT5_HUB_URL="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}" \
            MT5_ALLOW_LIVE="${MT5_ALLOW_LIVE:-false}" \
            MT5_LOCAL_READY_TIMEOUT_SECONDS=300 \
            MT5_SIDECAR_READY_TIMEOUT_SECONDS=120 \
            MT5_HUB_READY_TIMEOUT_SECONDS=180 \
            /opt/trading/trading-api-main/vps/mt5-forex/verify-live-readiness.sh

      - name: Verify requested execution mode matches Hub
        shell: bash
        run: |
          set -euo pipefail
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          BODY=$(mktemp); trap 'rm -f "$BODY"' EXIT
          curl -fsS --connect-timeout 5 --max-time 20 "$HUB/forex/health" > "$BODY"
          MT5_ALLOW_LIVE="$MT5_ALLOW_LIVE" python3 - "$BODY" <<'PY'
          import json, os, sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))
          requested=str(os.environ.get('MT5_ALLOW_LIVE') or 'false').lower() in {'true','1','yes'}
          if requested:
              assert d.get('liveEnabled') is True, 'MT5 LIVE requested but Hub liveEnabled=false'
              assert d.get('mode') == 'LIVE', f"MT5 LIVE requested but Hub mode={d.get('mode')}"
              print('FOREX_LIVE_MODE_MATCH=PASS')
          else:
              assert d.get('liveEnabled') is False, 'MT5 PAPER requested but Hub liveEnabled=true'
              assert d.get('mode') == 'PAPER', f"MT5 PAPER requested but Hub mode={d.get('mode')}"
              print('FOREX_PAPER_MODE_MATCH=PASS')
          print('FOREX_3AI_CONFIGURED='+str(bool(d.get('all3AiConfigured'))).lower())
          PY
