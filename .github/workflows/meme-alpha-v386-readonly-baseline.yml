name: Meme Alpha V386 Readonly Baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v386-readonly-baseline.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect current production execution path without mutation
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== WHO ==='; id
          echo '=== PATH PERMS ==='; ls -ld "$APP" "$APP/src" "$APP/runtime-status"; ls -l "$APP/src/micro-live-executor.js" "$APP/src/micro-live-gate.js" "$APP/run-paper.sh" /usr/local/sbin/meme-alpha-safe-deploy /etc/meme-alpha/micro-live-armed || true
          echo '=== WRITABLE ==='
          for p in "$APP/src" "$APP/src/micro-live-executor.js" "$APP/run-paper.sh" /usr/local/sbin/meme-alpha-safe-deploy /etc/meme-alpha/micro-live-armed; do if [ -w "$p" ]; then echo "$p writable=yes"; else echo "$p writable=no"; fi; done
          echo '=== MOUNTS ==='; findmnt -T /etc/meme-alpha/micro-live-armed || true; findmnt -T "$APP/src/micro-live-executor.js" || true
          echo '=== PAPER UNIT ==='; systemctl cat meme-alpha-paper.service || true
          echo '=== EXECUTOR UNIT ==='; systemctl cat meme-alpha-micro-live.service || true
          echo '=== RUN PAPER HEAD ==='; sed -n '1,120p' "$APP/run-paper.sh" || true
          echo '=== SWAP STAGE ==='; ls -la "$APP/runtime-status/v387-unified-final" || true; cat "$APP/runtime-status/v387-unified-final/SWAP_OK" 2>/dev/null || true
          echo '=== SERVICE STATUS ==='; systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service || true
          echo '=== PROCESSES ==='; pgrep -af 'micro-live-executor.js|scanner.js|run-paper.sh' || true
          echo '=== JOURNAL PAPER ==='; journalctl -u meme-alpha-paper.service -n 80 --no-pager || true
          echo '=== SUDO CAPABILITIES ==='; sudo -n -l || true
