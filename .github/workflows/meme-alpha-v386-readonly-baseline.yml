name: Meme Alpha V386 Readonly Baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v386-readonly-baseline.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Read exact current patch targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,re,json,hashlib
          root=pathlib.Path('/opt/meme-alpha/app/src')
          for name in ['safe-signal-export.js','micro-live-executor.js','micro-live-gate.js']:
              text=(root/name).read_text()
              print(json.dumps({'file':name,'sha256':hashlib.sha256(text.encode()).hexdigest()}))
              if name=='safe-signal-export.js':
                  for needle in ['function guardCandidate','hardReject','securityDecision','holderDecision','actionableSafe','const common={watchLike','securityBlockReasons','universeClass:c.universeClass']:
                      hits=[]
                      for i,line in enumerate(text.splitlines(),1):
                          if needle in line:
                              lo=max(1,i-2); hi=min(len(text.splitlines()),i+3)
                              lines=text.splitlines()
                              hits.append({'line':i,'context':'\n'.join(f'{j}: {lines[j-1]}' for j in range(lo,hi+1))})
                      print(json.dumps({'needle':needle,'hits':hits[:8]}))
              elif name=='micro-live-executor.js':
                  for i,line in enumerate(text.splitlines(),1):
                      if 'function coreSafe' in line or 'MICRO_LIVE_EXECUTOR_' in line:
                          print(json.dumps({'executorLine':i,'text':line}))
              else:
                  for i,line in enumerate(text.splitlines(),1):
                      if 'scaleAllowed' in line or "version:'" in line:
                          print(json.dumps({'gateLine':i,'text':line}))
          PY
