name: Meme Alpha V386 Readonly Baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v386-readonly-baseline.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect V387 post-handoff state without mutation
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v387-unified-final"
          echo '=== WHO ==='; id
          echo '=== LIVE HASHES ==='
          for f in safe-signal-export.js micro-live-gate.js micro-live-executor.js; do printf '%s ' "$f"; sha256sum "$APP/src/$f"; done
          echo '=== STAGED HASHES ==='
          for f in gate.original.js gate.v387.js executor.original.js executor.v387.js; do [ -f "$ST/$f" ] && sha256sum "$ST/$f" || true; done
          echo '=== MARKERS ==='
          grep -n 'V387_UNIFIED\|scaleAllowed' "$APP/src/micro-live-gate.js" "$APP/src/micro-live-executor.js" "$APP/src/safe-signal-export.js" | head -40 || true
          echo '=== STAGE ==='; ls -la "$ST" || true; for f in SWAP_OK ROLLBACK_OK; do echo "$f=$(cat "$ST/$f" 2>/dev/null || echo missing)"; done
          echo '=== RUN PAPER ==='; sed -n '1,80p' "$APP/run-paper.sh" || true
          echo '=== SERVICES ==='; systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service || true
          echo '=== PIDS ==='; pgrep -af '/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js' || true
          echo '=== GATE ==='; cat "$APP/runtime-status/micro-live-gate.json" || true
          echo '=== SIGNAL AGE/COUNTS ==='
          python3 - <<'PY'
          import json,os,time,pathlib
          p=pathlib.Path('/opt/meme-alpha/app/runtime-status/signal-snapshot.json')
          d=json.loads(p.read_text()); r=d.get('candidates') or []
          print({'ageSec':round(time.time()-os.path.getmtime(p),1),'count':len(r),'probe':sum(x.get('decision')=='PROBE_CANDIDATE' for x in r),'watch':sum(x.get('decision')=='WATCH' for x in r),'nonMemeProbe':sum(x.get('decision')=='PROBE_CANDIDATE' and x.get('universeClass')!='MEME_CONFIRMED' for x in r)})
          PY
          echo '=== PAPER LOG TAIL ==='; tail -80 /var/log/meme-alpha/paper-error.log 2>/dev/null || true; tail -80 /var/log/meme-alpha/paper.log 2>/dev/null || true
          echo '=== MICRO LOG TAIL ==='; tail -80 /var/log/meme-alpha/micro-live.log 2>/dev/null || true; tail -80 /var/log/meme-alpha/micro-live-error.log 2>/dev/null || true
