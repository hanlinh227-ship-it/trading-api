name: Meme Alpha V386 Readonly Baseline
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v386-readonly-baseline.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect executor deploy permissions without mutation
        shell: bash
        run: |
          set -euo pipefail
          echo '=== EXECUTOR FILE ==='
          ls -l /opt/meme-alpha/app/src/micro-live-executor.js
          test -w /opt/meme-alpha/app/src/micro-live-executor.js && echo RUNNER_EXECUTOR_WRITABLE=TRUE || echo RUNNER_EXECUTOR_WRITABLE=FALSE
          echo '=== SUDO RULES ==='
          sudo -n -l || true
          echo '=== LIVE STATE ==='
          python3 - <<'PY'
          import json,pathlib,hashlib,os,time
          root=pathlib.Path('/opt/meme-alpha/app');rs=root/'runtime-status';src=root/'src'
          for name in ['micro-live-executor.js','scanner.js','safe-signal-export.js','micro-live-gate.js']:
            t=(src/name).read_text();print(json.dumps({'source':name,'sha256':hashlib.sha256(t.encode()).hexdigest(),'v387':'V387_UNIFIED_LIVE' in t}))
          g=json.loads((rs/'micro-live-gate.json').read_text());s=json.loads((rs/'signal-snapshot.json').read_text());print(json.dumps({'gate':{k:g.get(k) for k in ['allowed','sourceHealthy','riskEntryAllowed','liveRiskReady','scaleAllowed','reasons']},'signalAgeSec':round(time.time()-os.path.getmtime(rs/'signal-snapshot.json'),1),'signalCount':len(s.get('candidates') or []),'intelSummary':s.get('intelSummary')}))
          PY
