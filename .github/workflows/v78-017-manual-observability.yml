name: V78-017 Manual Observability
on:
  push:
    paths:
      - '.github/workflows/v78-017-manual-observability.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard blobs and patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare-worker/engine-v77168.js)" = "d37117f6be642cf0250cfc53eeccb423a20d4986"
          test "$(git hash-object cloudflare-worker/hub-v77171.js)" = "4eb8c19518a7c95e063da8f9e592a9ab82919e8b"
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(path,oldText,newText){let s=fs.readFileSync(path,'utf8');const n=s.split(oldText).length-1;if(n!==1)throw new Error(`${path}: expected 1 match, got ${n}`);fs.writeFileSync(path,s.replace(oldText,newText));}
          const e='cloudflare-worker/engine-v77168.js';
          replaceOnce(e,
            'const a=await runSymbol(symbol,env),type=marketType(symbol);',
            'const a=await runSymbol(symbol,env),type=marketType(symbol);try{await recordSignalDecisionEvidence(env,buildSignalDecisionEvidence(a,{runtimeVersion:CONFIG.version,scanId:"MANUAL_TELEGRAM"}));await recordEntryIntelligenceShadow(env,buildEntryIntelligenceShadow(a,{runtimeVersion:CONFIG.version,scanId:"MANUAL_TELEGRAM"}));}catch{}');
          replaceOnce(e,
            'if(p==="/analyze"){const symbol=u.searchParams.get("symbol");return json(await runSymbol(symbol,env));}',
            'if(p==="/analyze"){const symbol=u.searchParams.get("symbol"),a=await runSymbol(symbol,env);try{await recordSignalDecisionEvidence(env,buildSignalDecisionEvidence(a,{runtimeVersion:CONFIG.version,scanId:"MANUAL_API"}));await recordEntryIntelligenceShadow(env,buildEntryIntelligenceShadow(a,{runtimeVersion:CONFIG.version,scanId:"MANUAL_API"}));}catch{}return json(a);}');
          const h='cloudflare-worker/hub-v77171.js';
          replaceOnce(h,
            'const VERSION="V77.18.42",UI_REV="HUB-R10-LIFECYCLE-GUARD",SERVICE="Trading V77.18.42 • Signal Lifecycle Guard";',
            'const VERSION="V77.18.42",UI_REV="HUB-R11-ENTRY-INTEL-SHADOW",SERVICE="Trading V77.18.42 • Signal Lifecycle Guard";');
          NODE
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hub-v77171.js
          test "$(grep -o 'MANUAL_TELEGRAM' cloudflare-worker/engine-v77168.js | wc -l)" -eq 2
          test "$(grep -o 'MANUAL_API' cloudflare-worker/engine-v77168.js | wc -l)" -eq 2
          test "$(grep -c 'HUB-R11-ENTRY-INTEL-SHADOW' cloudflare-worker/hub-v77171.js)" -eq 1
          test "$(grep -c 'function verifyTelegram' cloudflare-worker/hub-v77171.js)" -eq 1
          git diff --check
          cat > docs/ai-coengineer/V78-017_VALIDATION.txt <<'EOF'
          node --check engine-v77168.js = PASS
          node --check hub-v77171.js = PASS
          manual Telegram shadow evidence/intel instrumentation = PASS
          manual API /analyze shadow evidence/intel instrumentation = PASS
          returned decision object remains original `a` = PASS by exact route construction
          Hub visible revision = HUB-R11-ENTRY-INTEL-SHADOW
          verifyTelegram preserved = 1
          git diff --check = PASS
          V78-017_MANUAL_OBSERVABILITY_PASS
          EOF
      - name: Release and record state
        shell: bash
        run: |
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-19
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-017 manual Signal observability + Hub revision sync
          RESULT: IMPLEMENTED. Manual /analyze and Telegram single-symbol decisions now append isolated DecisionEvidence + Entry Intelligence shadow records after the existing decision is finalized. Returned decision objects and trade authority remain unchanged. Hub visible UI revision updated only.

          Protocol:
          - Acquire a new lock before the next source write.
          - Do not reset TRADING_STATE/v775:books.
          - Do not weaken risk/freshness/structural-SL/news safeguards.
          - Do not restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          - Claude production API remains paused; Claude.ai Web remains full co-engineer.
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<'EOF'

          V78-017 — IMPLEMENTED / VALIDATED
          - Manual `/analyze` and Telegram single-symbol analysis now populate both V78-002 DecisionEvidence and V78-016 Entry Intelligence shadow records.
          - Shadow writes are isolated in try/catch after `runSymbol()` returns and do not mutate the returned decision object.
          - Hub visible UI revision is now `HUB-R11-ENTRY-INTEL-SHADOW` so deployment progress is visible.
          - Claude production API remains paused; Claude.ai Web remains a full co-engineer.
          EOF
      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "V78 Co-Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js docs/ai-coengineer/V78-017_VALIDATION.txt docs/ai-coengineer/WRITE_LOCK.md docs/ai-coengineer/SHARED_STATE.md
          git commit -m "V78-017 instrument manual analysis shadow observability"
          git push
