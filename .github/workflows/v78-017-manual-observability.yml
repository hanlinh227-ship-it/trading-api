name: V78-020 Ranking Typo Hotfix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-017-manual-observability.yml'
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and hotfix actionableRank
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=cloudflare-worker/engine-v77168.js
          test "$(git hash-object "$ENGINE")" = "7d0d15084f21c479ace6a8b61a5aa66728dd8cd7" || { echo ENGINE_SHA_MISMATCH; exit 42; }
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          old='rx+=entryIntelligenceRankAdjustment(a);return x;'
          new='x+=entryIntelligenceRankAdjustment(a);return x;'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
      - name: Validate runtime-safe ranking wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/providers/entry-intelligence.js
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -o 'statusActionable' cloudflare-worker/providers/entry-intelligence.js | wc -l)" -eq 4
          test "$(grep -o 'entryIntelligenceRankAdjustment\|entryIntelligencePromotionAllowed' cloudflare-worker/engine-v77168.js | wc -l)" -eq 4
          test "$(grep -c 'rx+=entryIntelligenceRankAdjustment' cloudflare-worker/engine-v77168.js || true)" -eq 0
          test "$(grep -c 'x+=entryIntelligenceRankAdjustment(a);return x;' cloudflare-worker/engine-v77168.js)" -eq 1
          ! grep -q 'if(a.status==="MARKET"&&entryIntelligencePromotionAllowed' cloudflare-worker/engine-v77168.js
          ! grep -q 'if(a.status==="LIMIT"&&entryIntelligencePromotionAllowed' cloudflare-worker/engine-v77168.js
          git diff --check
          cat >> docs/ai-coengineer/V78-020_VALIDATION.txt <<'EOF'
          actionableRank runtime typo audit: caught rx+= typo after initial generated patch; corrected to x+= before final production acceptance
          no rx+= residue: PASS
          exact x+=entryIntelligenceRankAdjustment(a): PASS
          crypto MARKET/LIMIT admission still untouched: PASS
          FINAL V78-020 STATIC VALIDATION: PASS
          EOF
      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78 Co-Engineer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js docs/ai-coengineer/V78-020_VALIDATION.txt
          git commit -m 'V78-020 hotfix actionableRank adjustment typo before production acceptance'
          git push origin HEAD:main
