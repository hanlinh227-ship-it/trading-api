name: MT5 Existing Home Profile Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-home-existing-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - name: Inspect pre-existing /home/mt5 MT5 profile
        shell: bash
        run: |
          set +e
          ROOT=/home/mt5/.mt5/drive_c/Program\ Files/MetaTrader\ 5
          echo '=== PROFILE ==='
          sudo stat -c '%U:%G %a %n' /home/mt5 /home/mt5/.mt5 "$ROOT" 2>/dev/null || true
          sudo find "$ROOT/Config" -maxdepth 1 -type f -printf '%T@ %s %f\n' 2>/dev/null | sort -nr | head -n 40
          echo '=== COMMON INI NONSECRET ==='
          sudo awk -F= '/^(Login|Server|ProxyEnable|KeepPrivate|CertInstall)=/{if($1=="Login") $2="[REDACTED_LOGIN]"; print $1"="$2}' "$ROOT/Config/common.ini" 2>/dev/null || true
          echo '=== ACCOUNT CACHE ==='
          sudo stat -c 'accounts.dat size=%s mtime=%y' "$ROOT/Config/accounts.dat" 2>/dev/null || true
          sudo stat -c 'servers.dat size=%s mtime=%y' "$ROOT/Config/servers.dat" 2>/dev/null || true
          echo '=== TERMINAL LOG CONNECTION LINES ==='
          sudo find "$ROOT/logs" -type f -iname '*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            out=$(mktemp)
            sudo iconv -f UTF-16LE -t UTF-8 "$f" >"$out" 2>/dev/null || sudo cat "$f" >"$out" 2>/dev/null
            m=$(grep -Eai 'FivePercent|authorized on|connected|disconnected|network|invalid account|authorization failed|login|server' "$out" | tail -n 160)
            if [ -n "$m" ]; then
              echo "--- $f ---"
              printf '%s\n' "$m" | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g; s/(password|passwd|token|authorization)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
            fi
            rm -f "$out"
          done
          echo '=== MQL5 LOG CONNECTION/EA LINES ==='
          sudo find "$ROOT/MQL5/logs" -type f -iname '*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            out=$(mktemp)
            sudo iconv -f UTF-16LE -t UTF-8 "$f" >"$out" 2>/dev/null || sudo cat "$f" >"$out" 2>/dev/null
            grep -Eai 'ForexAutoThe5ers|connected|account|server' "$out" | tail -n 120 | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g' || true
            rm -f "$out"
          done
