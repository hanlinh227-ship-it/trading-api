name: Summarize Existing Per Symbol Runs
on:
  push:
    paths:
      - 'scripts/summarize_existing_run_finals.sh'
      - '.github/workflows/summarize-existing-run-finals.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Extract final result lines from completed research runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/summarize_existing_run_finals.sh
