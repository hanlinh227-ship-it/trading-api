name: Reward Solver - Kaggriculture Quick Submit

on:
  push:
    branches:
      - reward-solver-kaggriculture-quick-submit
    paths:
      - '.github/reward-kaggriculture-quick-submit-trigger'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reward-kaggriculture-quick-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reward-solver-kaggriculture-quick-submit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Guard secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN is not configured'; exit 20; }
      - name: Kaggle raw-exec compatibility gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          p='reward-hunter/kaggriculture/main.py'
          code=open(p, encoding='utf-8').read()
          env={}
          exec(compile(code, 'main.py', 'exec'), env)
          assert callable(env.get('agent')), 'agent callable missing'
          print('RAW_EXEC_GATE_OK')
          PY
      - name: Install Kaggle CLI
        run: python -m pip install -U pip kaggle
      - name: Submit self-contained main.py
        shell: bash
        run: |
          set -euo pipefail
          kaggle competitions submit \
            -c kaggriculture \
            -f reward-hunter/kaggriculture/main.py \
            -m 'Reward Solver V1 raw-exec fix'
      - name: Confirm submission appears
        shell: bash
        run: |
          set -euo pipefail
          sleep 5
          kaggle competitions submissions -c kaggriculture | head -n 12
