name: Bybit Demo 5x2m Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-demo-smoke-5x2m-trigger'
permissions: {contents: read}
concurrency:
  group: bybit-demo-smoke-5x2m
  cancel-in-progress: false
jobs:
  smoke:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Wait for exact runtime
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          for i in $(seq 1 50); do
            REV="$(curl -fsS --max-time 15 "$BASE/runtime/contract" | python3 -c 'import json,sys;print(json.load(sys.stdin).get("runtimeRevision",""))' 2>/dev/null || true)"
            [ "$REV" = "$GITHUB_SHA" ] && exit 0
            sleep 5
          done
          echo "runtime did not reach trigger revision $GITHUB_SHA" >&2
          exit 1
      - name: Open five Demo diagnostic positions
        id: open
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          set -a; source /etc/trading-v11-ai.env; set +a
          SECRET="${BYBIT_VPS_BRIDGE_SECRET:-${V11_AI_BRIDGE_SECRET:-}}"
          test -n "$SECRET"
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $SECRET" \
            -H 'content-type: application/json' \
            "$BASE/bybit/demo/smoke-5x2m/open" | tee "$RUNNER_TEMP/smoke-open.json"
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/smoke-open.json'
          x=json.load(open(p))
          assert x.get('ok') is True and x.get('demo') is True and len(x.get('positions') or [])==5, x
          print('DEMO_SMOKE_OPEN=PASS symbols='+','.join(p['symbol'] for p in x['positions']))
          PY
      - name: Hold exactly two minutes
        shell: bash
        run: sleep 120
      - name: Close five Demo diagnostic positions
        if: always() && steps.open.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          set -a; source /etc/trading-v11-ai.env; set +a
          SECRET="${BYBIT_VPS_BRIDGE_SECRET:-${V11_AI_BRIDGE_SECRET:-}}"
          test -n "$SECRET"
          curl -fsS --max-time 120 -X POST \
            -H "Authorization: Bearer $SECRET" \
            -H 'content-type: application/json' \
            "$BASE/bybit/demo/smoke-5x2m/close" | tee "$RUNNER_TEMP/smoke-close.json"
          python3 - <<'PY'
          import json,os
          p=os.environ['RUNNER_TEMP']+'/smoke-close.json'
          x=json.load(open(p)); s=x.get('state') or {}
          assert x.get('ok') is True and x.get('demo') is True, x
          assert not (x.get('positionsRemaining') or []), x
          assert int(s.get('heldMs') or 0)>=115000, s
          print('DEMO_SMOKE_CLOSE=PASS heldMs=%s equityDelta=%s walletDelta=%s'%(s.get('heldMs'),s.get('equityDelta'),s.get('walletDelta')))
          PY
      - name: Final Demo health
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          curl -fsS --max-time 45 https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health | tee "$RUNNER_TEMP/final-health.json"
          python3 - <<'PY'
          import json,os
          x=json.load(open(os.environ['RUNNER_TEMP']+'/final-health.json'))
          assert x.get('ok') is True and x.get('authenticated') is True
          assert (x.get('execution') or {}).get('ready') is True
          assert (x.get('positions') or {}).get('openCount') == 0
          print('DEMO_SMOKE_FINAL_HEALTH=PASS equity=%s wallet=%s'%((x.get('account') or {}).get('totalEquity'),(x.get('account') or {}).get('walletBalance')))
          PY
