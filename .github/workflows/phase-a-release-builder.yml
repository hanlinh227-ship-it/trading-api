name: Phase A Canonical Release Builder

on:
  push:
    branches:
      - github-brain-vnext-phase-a-capability-evidence
    paths:
      - '.github/workflows/phase-a-release-builder.yml'

permissions:
  contents: write

jobs:
  build-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-brain-vnext-phase-a-capability-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install release dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Compute next patch release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          NEXT_VERSION="$(python - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('AI_SKILL_LIBRARY/v4/releases/current.json').read_text())['version']
          major,minor,patch=map(int,v.split('.'))
          print(f'{major}.{minor}.{patch+1}')
          PY
          )"
          echo "next_version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"
          echo "NEXT_VERSION=$NEXT_VERSION"
      - name: Build canonical validated release
        shell: bash
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version "${{ steps.version.outputs.next_version }}" \
            --validated \
            --source phase_a_capability_evidence
          python AI_SKILL_LIBRARY/v4/tools/release.py verify
          python AI_SKILL_LIBRARY/v4/tools/release.py check
      - name: Commit canonical release outputs only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/releases
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No release metadata changes generated"
            exit 0
          fi
          git commit -m "release: prepare capability evidence phase A"
          git push origin HEAD:github-brain-vnext-phase-a-capability-evidence
