name: Audit V73 Symbol Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-v73-symbol-profiles.yml'
      - 'data/nocut_intraday_allpass_v73.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build profile audit
        run: |
          node - <<'NODE' > V73_PROFILE_AUDIT.txt
          const fs=require('fs');const v=JSON.parse(fs.readFileSync('data/nocut_intraday_allpass_v73.json','utf8'));
          function families(e){const m=e?.method||{},st=m.style||{},a=Array.isArray(m.actions)?m.actions:[];return [...new Set([st.family,m.profile,...a.map(x=>x.family)].filter(Boolean))];}
          function mode(fs){const x=fs.join('|').toUpperCase();if(/MEANREV|REVERT|CONTRA|FADE|SLOW|SESSION/.test(x))return 'MEAN_REVERSION';if(/BREADTH|RELATIVE|BTCALIGN|HYBRID|L2/.test(x))return 'RELATIVE';if(/TREND|MOM|MOMENTUM|FAST|H1|H4|D1/.test(x))return 'TREND';return 'GENERIC';}
          for(const market of ['forex','crypto']){
            const rows=Object.entries(v[market]?.symbols||{}).map(([symbol,e])=>({symbol,source:e.source,timeframe:e.timeframe,families:families(e),mode:mode(families(e)),riskATR:e.method?.style?.riskATR??(e.method?.actions||[]).map(x=>x.riskATR).find(Number.isFinite)??null,entryMode:e.method?.style?.entryMode??(e.method?.router?'ROUTER':null),news:e.newsProfile?.profile||null}));
            const counts={};for(const r of rows)counts[r.mode]=(counts[r.mode]||0)+1;
            console.log('=== '+market.toUpperCase()+' ===');console.log('COUNT='+rows.length);console.log('MODES='+JSON.stringify(counts));
            for(const r of rows)console.log([r.symbol,r.mode,'families='+r.families.join(','),'entry='+r.entryMode,'riskATR='+r.riskATR,'source='+r.source,'news='+r.news].join(' | '));
          }
          NODE
      - name: Commit audit
        run: |
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V73_PROFILE_AUDIT.txt
          git commit -m 'Report V73 adaptive symbol profile audit' || exit 0
          git push origin main
