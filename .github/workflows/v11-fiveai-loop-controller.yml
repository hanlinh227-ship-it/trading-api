name: V11 Legacy-Style 5AI Research Loop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: v11-direct-fiveai-backtest
  cancel-in-progress: true

jobs:
  loop:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[V11-LOOP]') || contains(github.event.head_commit.message, '[V11-RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      PYTHONUNBUFFERED: '1'
      V11_DATASET_START: '2026-05-07T00:00:00Z'
      V11_DATASET_END: '2026-08-23T23:00:00Z'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/cache@v4
        with:
          path: data/v11_mtf_cache
          key: v11-exact-r8-${{ hashFiles('scripts/v11_mtf_data_cache.py') }}-20260507-20260823

      - name: Preflight 94-symbol research contract
        run: |
          set -euo pipefail
          test -n "${TWELVEDATA_API_KEY:-}" || exit 2
          python -m py_compile scripts/v11_mtf_data_cache.py scripts/v11_backtest_geometry_r4.py scripts/v11_backtest_mtf.py scripts/v11_direct_backtest.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import v11_mtf_data_cache as d
          c=d.load_catalog(); n=sum(map(len,c.values()))
          assert n==94,n
          print('R8_PREFLIGHT_OK symbols=94')
          PY

      - name: Resolve 5AI gateway
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')"
          test -n "$SUBDOMAIN"
          echo "GATEWAY_URL=https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review" >> "$GITHUB_ENV"

      - name: Multi-round deterministic research plus 5AI learning
        run: |
          set -euo pipefail
          mkdir -p data/v11_r8_rounds logs
          COMPLETE=0
          for ROUND in 0 1 2 3 4; do
            echo "===== R8 RESEARCH ROUND $ROUND ====="
            export V11_RESEARCH_ROUND="$ROUND"
            rm -rf data/v11_mtf_out
            mkdir -p data/v11_mtf_out
            python -u scripts/v11_direct_backtest.py --mode fast --history-start "$V11_DATASET_START" --history-end "$V11_DATASET_END" --shard-index 0 --shard-count 1 2>&1 | tee "logs/r8-round-$ROUND.log"
            python -u scripts/v11_direct_backtest.py --merge
            cp data/v11_mtf_merged.json "data/v11_r8_rounds/round-$ROUND-merged.json"
            python - "$ROUND" <<'PY'
          import json,sys
          r=int(sys.argv[1]); d=json.load(open('data/v11_mtf_merged.json')); sy=d.get('symbols') or {}
          rows=[]
          for s,x in sorted(sy.items()):
              a=x.get('dev') or {}; b=x.get('validation') or {}; p=x.get('profile') or {}
              rows.append([s,x.get('market'),1 if x.get('pass') else 0,p.get('rr'),a.get('winRate'),a.get('meanR'),a.get('zeroExecutionDays'),b.get('winRate'),b.get('meanR'),b.get('zeroExecutionDays')])
          pc=sum(1 for x in sy.values() if x.get('pass'))
          out={'round':r,'catalogCount':94,'resultCount':len(sy),'passCount':pc,'allPass':len(sy)==94 and pc==94,'schema':['symbol','market','pass','rr','devWR','devR','devZero','valWR','valR','valZero'],'symbols':rows}
          json.dump(out,open(f'data/v11_r8_rounds/round-{r}-summary.json','w'),separators=(',',':'))
          print('R8_ROUND_SUMMARY',r,pc,'/94')
          PY

            # Five-AI reviews compact deterministic evidence in bounded 8-symbol batches.
            python - "$ROUND" <<'PY'
          import json,os,sys
          r=int(sys.argv[1]); s=json.load(open(f'data/v11_r8_rounds/round-{r}-summary.json')); rows=s['symbols']; size=8
          for n in range(0,len(rows),size):
              batch=rows[n:n+size]; k=n//size+1
              body={'task_id':f"v11-r8-{os.environ['GITHUB_RUN_ID']}-r{r}-b{k}",'instruction':f'R8 research round {r}, batch {k}. Claude, Codex, DeepSeek, Qwen and OpenRouter independently review DEV/VALIDATION evidence and propose bounded per-symbol/regime refinements. RR only 1 or 2; WR>=80; expectancy positive; exact data; 1-3 executions each eligible day; no pooling/deletion/fabrication/lookahead/FINAL tuning. Later controller rounds expand only predeclared deterministic search space. Keep response compact.','context':{'round':r,'schema':s['schema'],'symbols':batch,'final':'SEALED'}}
              json.dump(body,open(f'/tmp/r8-{r}-{k}.json','w'),separators=(',',':'))
          print((len(rows)+size-1)//size)
          PY
            BC=$(( (94 + 7) / 8 ))
            ALL5=1
            for B in $(seq 1 "$BC"); do
              OK=0
              for ATTEMPT in 1 2; do
                OIDC="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
                echo "::add-mask::$OIDC"
                set +e
                CODE="$(timeout 90s curl -sS --connect-timeout 10 --max-time 80 -o "/tmp/r8-out-$ROUND-$B.json" -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary "@/tmp/r8-$ROUND-$B.json")"
                RC=$?
                set -e
                if [ "$RC" = 0 ] && [ "$CODE" = 200 ] && python - "$ROUND" "$B" <<'PY'
          import json,sys
          r,b=sys.argv[1:]; e=['claude','codex','deepseek','qwen','openrouter']
          try:d=json.load(open(f'/tmp/r8-out-{r}-{b}.json'))
          except Exception:sys.exit(1)
          p=d.get('providers') or {};sys.exit(0 if all(str((p.get(x) or {}).get('status','')).upper()=='OK' for x in e) else 1)
          PY
                then OK=1; break; fi
                sleep 5
              done
              if [ "$OK" != 1 ]; then ALL5=0; echo "R8_5AI_BATCH_FAIL round=$ROUND batch=$B"; fi
            done
            echo "R8_5AI_COMPLETE round=$ROUND complete=$ALL5"

            if python - "$ROUND" <<'PY'
          import json,sys
          r=sys.argv[1];s=json.load(open(f'data/v11_r8_rounds/round-{r}-summary.json'))
          sys.exit(0 if s.get('allPass') else 1)
          PY
            then
              COMPLETE=1
              cp data/v11_mtf_profiles.json data/v11_r8_frozen_profiles.json
              echo "$ROUND" > data/v11_r8_winning_round.txt
              break
            fi
          done
          echo "R8_DEV_VALIDATION_COMPLETE=$COMPLETE" >> "$GITHUB_ENV"

      - name: Untouched FINAL only after 94/94 DEV+VALIDATION
        if: env.R8_DEV_VALIDATION_COMPLETE == '1'
        run: |
          set -euo pipefail
          cp data/v11_r8_frozen_profiles.json data/v11_mtf_profiles.json
          export V11_RESEARCH_ROUND="$(cat data/v11_r8_winning_round.txt)"
          rm -rf data/v11_mtf_out; mkdir -p data/v11_mtf_out
          python -u scripts/v11_direct_backtest.py --mode final --history-start "$V11_DATASET_START" --history-end "$V11_DATASET_END" --shard-index 0 --shard-count 1 2>&1 | tee logs/r8-final.log
          python -u scripts/v11_direct_backtest.py --merge
          cp data/v11_mtf_merged.json data/v11_r8_final.json

      - name: Publish R8 terminal-or-refinement status
        if: always()
        run: |
          set +e
          python - <<'PY'
          import glob,json,os
          fs=sorted(glob.glob('data/v11_r8_rounds/round-*-summary.json'))
          rounds=[json.load(open(x)) for x in fs]
          final={}
          try:
              d=json.load(open('data/v11_r8_final.json')); sy=d.get('symbols') or {}; pc=sum(1 for x in sy.values() if x.get('pass')); final={'resultCount':len(sy),'passCount':pc,'allFinalPass':len(sy)==94 and pc==94}
          except Exception: pass
          status='COMPLETE_ALL_94_PASS' if final.get('allFinalPass') else 'REFINEMENT_REQUIRED'
          out={'status':status,'runId':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'controller':'R8_LEGACY_STYLE_MULTIROUND_5AI','rounds':[{k:r.get(k) for k in ('round','resultCount','passCount','allPass')} for r in rounds],'final':final}
          json.dump(out,open('data/v11_r8_status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v11-research-status:v11-research-status 2>/dev/null || true
          git checkout v11-research-status 2>/dev/null || git checkout --orphan v11-research-status
          mkdir -p status
          cp data/v11_r8_status.json status/latest-r8.json
          git add status/latest-r8.json
          git commit -m "status: V11 R8 loop $GITHUB_RUN_ID" || true
          git push -f origin HEAD:v11-research-status || true
