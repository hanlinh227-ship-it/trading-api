name: Meme Alpha v2.3.1 Progress Diagnostic

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v231-progress-diagnostic.sh'
      - '.github/workflows/meme-alpha-v231-progress-diagnostic.yml'

jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose paper progress
        run: bash ops/meme-alpha/v231-progress-diagnostic.sh
