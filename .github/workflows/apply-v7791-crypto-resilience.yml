name: Apply V77.9.1 Crypto Resilience

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v7791_crypto_resilience.js'
      - '.github/workflows/apply-v7791-crypto-resilience.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          : > V7791_DIAGNOSTIC.txt
          echo "HEAD=$(git rev-parse HEAD)" >> V7791_DIAGNOSTIC.txt
          node --check scripts/apply_v7791_crypto_resilience.js >> V7791_DIAGNOSTIC.txt 2>&1
          echo "GENERATOR_EXIT=$?" >> V7791_DIAGNOSTIC.txt
          node scripts/apply_v7791_crypto_resilience.js >> V7791_DIAGNOSTIC.txt 2>&1
          echo "MIGRATION_EXIT=$?" >> V7791_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V7791_DIAGNOSTIC.txt 2>&1
          echo "WORKER_SYNTAX_EXIT=$?" >> V7791_DIAGNOSTIC.txt
          for t in V77.9.1 cryptoBroadMap quotePool methodAssessment setupScore STRUCTURE_LIQUIDITY validExecutablePosition; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V7791_DIAGNOSTIC.txt; else echo "$t=NO" >> V7791_DIAGNOSTIC.txt; fi
          done
          exit 0
      - name: Commit valid runtime and diagnostic
        run: |
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V7791_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V7791_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V7791_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V7791_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Apply V77.9.1 resilient crypto discovery' || exit 0
          git push origin main
