name: Reward Solver - Kaggriculture

on:
  push:
    branches:
      - reward-solver-kaggriculture-v1
    paths:
      - '.github/reward-kaggriculture-solve-trigger'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Parameter-search iterations'
        required: false
        default: '40'
      submit:
        description: 'Submit champion to Kaggle after optimization (requires joined competition and KAGGLE_API_TOKEN secret)'
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - 'reward-hunter/kaggriculture/**'
      - '.github/workflows/reward-kaggriculture-solver.yml'

permissions:
  contents: write

concurrency:
  group: reward-kaggriculture-solver
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official simulator
        run: |
          python -m pip install -U pip wheel
          python -m pip install 'kaggle-environments>=1.32.4,<1.33'
      - name: Compile solver
        run: |
          python -m py_compile \
            reward-hunter/kaggriculture/main.py \
            reward-hunter/kaggriculture/benchmark.py \
            reward-hunter/kaggriculture/tuner.py \
            reward-hunter/kaggriculture/package_submission.py
      - name: Short two-seat contract gate
        run: |
          python reward-hunter/kaggriculture/benchmark.py \
            --seeds 20260910 \
            --opponents starter \
            --steps 120 \
            --output /tmp/kaggriculture-smoke.json

  optimize:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reward-solver-kaggriculture-v1
          fetch-depth: 0
      - name: Prepare isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-reward-kaggriculture
          . .venv-reward-kaggriculture/bin/activate
          python -m pip install -U pip wheel
          python -m pip install 'kaggle-environments>=1.32.4,<1.33'
      - name: Baseline gate
        shell: bash
        run: |
          set -euo pipefail
          . .venv-reward-kaggriculture/bin/activate
          mkdir -p reward-hunter/kaggriculture/artifacts
          nice -n 10 python reward-hunter/kaggriculture/benchmark.py \
            --seeds 20260805,20260811,20260829 \
            --opponents starter \
            --steps 720 \
            --output reward-hunter/kaggriculture/artifacts/baseline.json
      - name: Search and holdout gate
        shell: bash
        run: |
          set -euo pipefail
          . .venv-reward-kaggriculture/bin/activate
          ITERS='${{ github.event.inputs.iterations }}'
          if [ -z "$ITERS" ]; then ITERS=40; fi
          nice -n 10 python reward-hunter/kaggriculture/tuner.py \
            --iterations "$ITERS" \
            --seeds 20260805,20260811,20260829 \
            --holdout-seeds 20260901,20260903,20260907 \
            --steps 720 \
            --champion reward-hunter/kaggriculture/champion.json \
            --report reward-hunter/kaggriculture/artifacts/tuning-report.json
      - name: Final holdout verification
        shell: bash
        run: |
          set -euo pipefail
          . .venv-reward-kaggriculture/bin/activate
          nice -n 10 python reward-hunter/kaggriculture/benchmark.py \
            --params reward-hunter/kaggriculture/champion.json \
            --seeds 20260902,20260905,20260909 \
            --opponents starter \
            --steps 720 \
            --output reward-hunter/kaggriculture/artifacts/final-holdout.json
      - name: Package champion
        shell: bash
        run: |
          set -euo pipefail
          . .venv-reward-kaggriculture/bin/activate
          python reward-hunter/kaggriculture/package_submission.py
      - name: Commit improved champion state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reward-hunter/kaggriculture/champion.json
          if ! git diff --cached --quiet; then
            git commit -m 'Promote validated Kaggriculture champion [skip solver]'
            git pull --rebase origin reward-solver-kaggriculture-v1
            git push origin HEAD:reward-solver-kaggriculture-v1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: kaggriculture-reward-solver
          path: |
            reward-hunter/kaggriculture/dist/submission.tar.gz
            reward-hunter/kaggriculture/dist/manifest.json
            reward-hunter/kaggriculture/artifacts/*.json
          retention-days: 14

  submit:
    if: github.event_name == 'workflow_dispatch' && inputs.submit == true
    needs: optimize
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 15
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reward-solver-kaggriculture-v1
      - name: Guarded Kaggle submission
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN is not configured'; exit 20; }
          python3 -m venv .venv-kaggle-submit
          . .venv-kaggle-submit/bin/activate
          python -m pip install -U pip kaggle
          python reward-hunter/kaggriculture/package_submission.py
          kaggle competitions submit kaggriculture \
            -f reward-hunter/kaggriculture/dist/submission.tar.gz \
            -m 'Reward Solver validated champion'
