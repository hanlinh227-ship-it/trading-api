name: Apply V77.16.5 Live Order Visibility
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77165_live_order_visibility.js'
      - '.github/workflows/apply-v77165-live-order-visibility.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply migration and diagnostics
        shell: bash
        run: |
          set +e
          : > V77165_DIAGNOSTIC.txt
          node scripts/apply_v77165_live_order_visibility.js >> V77165_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77165_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77165_DIAGNOSTIC.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77165_DIAGNOSTIC.txt
          grep -q 'version: "V77.16.5"' cloudflare-worker/index.js; echo "VERSION_V77165=$?" >> V77165_DIAGNOSTIC.txt
          grep -q 'LIMIT ĐÃ KHỚP / ĐANG CHẠY' cloudflare-worker/index.js; echo "LIMIT_ACTIVE_VISIBLE=$?" >> V77165_DIAGNOSTIC.txt
          grep -q 'autoScanCrypto' cloudflare-worker/index.js; echo "AUTO_SCAN_PRESENT=$?" >> V77165_DIAGNOSTIC.txt
          grep -q 'discoveredBy' cloudflare-worker/index.js; echo "ORDER_SOURCE_PRESENT=$?" >> V77165_DIAGNOSTIC.txt
          grep -q 'tp=Number.isFinite(Number(sig.tp2))?sig.tp2:sig.tp1' cloudflare-worker/index.js; echo "TP2_LIFECYCLE_PRESENT=$?" >> V77165_DIAGNOSTIC.txt
      - name: Commit promotion
        shell: bash
        run: |
          if ! grep -q 'MIGRATION_EXIT=0' V77165_DIAGNOSTIC.txt || ! grep -q 'SYNTAX_EXIT=0' V77165_DIAGNOSTIC.txt; then cat V77165_DIAGNOSTIC.txt; exit 1; fi
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js V77165_DIAGNOSTIC.txt
          git commit -m 'Promote V77.16.5 live-order reconciliation' || exit 0
          git push origin main
