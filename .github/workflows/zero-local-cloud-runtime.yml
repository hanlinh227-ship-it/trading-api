name: Zero Local Cloud Runtime

on:
  push:
    branches:
      - zero-local-cloud-runtime-20260912
      - live-price-execution-layer-20260912
      - main
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'crypto-research-gateway/**'
      # The lane that VERIFIES the Cloudflare Worker must run when the Worker
      # changes. It did not: c8a1dc8d rewrote prepare-wrangler.mjs and the
      # Worker's health output, deployed successfully, and this verification
      # never ran - so CLOUDFLARE_HEALTH and LIVE_RESEARCH_SMOKE went
      # unobserved on the very commit that fixed the deploy.
      - 'cloudflare-worker/**'
      - 'tests/test_private_bridge_optional.py'
      - 'tests/test_cloud_runtime_policy.py'
      - 'tests/test_live_price_policy.py'
      - 'tests/test_zero_local_manifest.py'
      - '.github/workflows/zero-local-cloud-runtime.yml'
      - 'AGENTS.md'
      - 'crypto-agent-skills/**'
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'crypto-research-gateway/**'
      # The lane that VERIFIES the Cloudflare Worker must run when the Worker
      # changes. It did not: c8a1dc8d rewrote prepare-wrangler.mjs and the
      # Worker's health output, deployed successfully, and this verification
      # never ran - so CLOUDFLARE_HEALTH and LIVE_RESEARCH_SMOKE went
      # unobserved on the very commit that fixed the deploy.
      - 'cloudflare-worker/**'
      - 'tests/test_private_bridge_optional.py'
      - 'tests/test_cloud_runtime_policy.py'
      - 'tests/test_live_price_policy.py'
      - 'tests/test_zero_local_manifest.py'
      - '.github/workflows/zero-local-cloud-runtime.yml'
      - 'AGENTS.md'
      - 'crypto-agent-skills/**'

permissions:
  contents: read

env:
  # Production is the Cloudflare Worker. Railway is no longer in the graph.
  PROD_GATEWAY_URL: https://trading-v77-scanner.hanlinh227.workers.dev

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema
      - name: Zero-local policy regression tests
        run: python -m unittest discover -s tests -p 'test_cloud_runtime_policy.py' -v
      - name: Live-price policy regression tests
        run: python -m unittest discover -s tests -p 'test_live_price_policy.py' -v
      - name: Zero-local deployment manifest tests
        run: python -m unittest discover -s tests -p 'test_zero_local_manifest.py' -v
      - name: Install gateway dependencies in CI
        working-directory: crypto-research-gateway
        run: npm install --no-audit --no-fund
      - name: Gateway behavior tests
        working-directory: crypto-research-gateway
        run: npm test
      - name: Gateway typecheck
        working-directory: crypto-research-gateway
        run: npm run typecheck
      - name: Gateway build
        working-directory: crypto-research-gateway
        run: npm run build
      - name: Brain validation via single entrypoint (validators, snapshot, release, index, consolidation)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA" --skip-tests
          echo "SKILL_GATEWAY_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      - name: Live public provider and execution quote smoke test
        working-directory: crypto-research-gateway
        shell: bash
        run: |
          set -euo pipefail
          PORT=3100 npm start >/tmp/zero-local-gateway.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3100/health > /tmp/zero-local-health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/zero-local-health.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zero-local-health.json').read_text())
          healthy = set(data.get('healthyProviders', []))
          research_sources = {'binance', 'okx', 'gate', 'kucoin'}
          healthy_research = research_sources & healthy
          if len(healthy_research) < 2:
              raise SystemExit(f'public research redundancy insufficient: healthy={sorted(healthy_research)} providers={data.get("providers", {})}')
          bybit = data.get('providers', {}).get('bybit', {})
          bybit_ok = 'bybit' in healthy
          bybit_region_restricted = bybit.get('error') == 'region_restricted_bybit_cloud_region'
          if not (bybit_ok or bybit_region_restricted):
              raise SystemExit(f'Bybit failed for an unexpected reason: {bybit}')
          if data.get('localInstallRequired') is not False:
              raise SystemExit('local install unexpectedly required')
          PY

          for SYMBOL in BTCUSDT SOLUSDT; do
            curl --silent \
              -o "/tmp/binance-${SYMBOL}.json" \
              -H 'content-type: application/json' \
              -d "{\"action\":\"execution_quote\",\"symbol\":\"${SYMBOL}\",\"instrument\":\"perpetual\",\"side\":\"LONG\",\"executionVenue\":\"binance\"}" \
              http://127.0.0.1:3100/research/market
            cat "/tmp/binance-${SYMBOL}.json"
            echo
          done

          python - <<'PY'
          import json, math
          from pathlib import Path
          modes = []
          for symbol in ('BTCUSDT', 'SOLUSDT'):
              data = json.loads(Path(f'/tmp/binance-{symbol}.json').read_text())
              quote = data.get('executionQuote', {})
              if data.get('ok') is True:
                  if quote.get('venue') != 'binance' or quote.get('instrumentType') != 'perpetual':
                      raise SystemExit(f'{symbol}: venue/instrument mismatch: {quote}')
                  if quote.get('executableSemantic') != 'ask':
                      raise SystemExit(f'{symbol}: LONG did not use ask: {quote}')
                  if quote.get('executionVerified') is not True or quote.get('status') != 'OK':
                      raise SystemExit(f'{symbol}: execution quote not verified: {quote}')
                  bid = float(quote.get('bid', 0))
                  ask = float(quote.get('ask', 0))
                  age = float(quote.get('quoteAgeMs', 1e18))
                  spread = float(quote.get('spreadBps', math.nan))
                  if not (bid > 0 and ask > 0 and bid <= ask):
                      raise SystemExit(f'{symbol}: invalid bid/ask: {quote}')
                  if not (0 <= age <= 5000):
                      raise SystemExit(f'{symbol}: quoteAgeMs outside hard freshness gate: {quote}')
                  if not (math.isfinite(spread) and spread >= 0):
                      raise SystemExit(f'{symbol}: invalid spreadBps: {quote}')
                  if int(quote.get('sourceTimestampMs', 0)) <= 0 or int(quote.get('receivedTimestampMs', 0)) <= 0:
                      raise SystemExit(f'{symbol}: invalid timestamps: {quote}')
                  modes.append('live')
                  continue
              failures = data.get('failures', [])
              restricted = any(item.get('error') == 'region_restricted_binance_futures_cloud_region' for item in failures)
              if not restricted:
                  raise SystemExit(f'{symbol}: Binance Futures failed unexpectedly: {data}')
              modes.append('region_restricted')
          if len(set(modes)) != 1:
              raise SystemExit(f'Binance Futures cloud-region classification inconsistent: {modes}')
          print(f'Binance Futures CI mode: {modes[0]}')
          PY

          python - <<'PY' > /tmp/bybit-smoke-mode
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/zero-local-health.json').read_text())
          healthy = set(data.get('healthyProviders', []))
          if 'bybit' in healthy:
              print('live')
          elif data.get('providers', {}).get('bybit', {}).get('error') == 'region_restricted_bybit_cloud_region':
              print('region_restricted')
          else:
              print('unexpected')
          PY

          BYBIT_MODE="$(cat /tmp/bybit-smoke-mode)"
          if [ "$BYBIT_MODE" = "live" ]; then
            curl --fail --silent \
              -H 'content-type: application/json' \
              -d '{"action":"execution_quote","symbol":"BTCUSDT","instrument":"perpetual","side":"SHORT","executionVenue":"bybit"}' \
              http://127.0.0.1:3100/research/market > /tmp/bybit-BTCUSDT.json
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/bybit-BTCUSDT.json').read_text())
          quote = data.get('executionQuote', {})
          if data.get('ok') is not True or quote.get('executionVerified') is not True:
              raise SystemExit(f'Bybit execution quote not verified: {data}')
          if quote.get('venue') != 'bybit' or quote.get('executableSemantic') != 'bid':
              raise SystemExit(f'Bybit SHORT did not use Bybit bid: {quote}')
          if not (0 <= float(quote.get('quoteAgeMs', 1e18)) <= 5000):
              raise SystemExit(f'Bybit quote stale: {quote}')
          PY
          elif [ "$BYBIT_MODE" = "region_restricted" ]; then
            echo 'Bybit live execution smoke skipped only because CI cloud region is explicitly restricted by Bybit.'
          else
            echo 'Unexpected Bybit health classification.' >&2
            exit 1
          fi

  # Production verification against the Cloudflare Worker.
  #
  # Railway is gone from this lane entirely: no deploy job, no deployment
  # mutation, no deployment-metadata requirement, no upstream-zone header
  # assertion, no railway.app URL. Cloudflare is deployed by
  # deploy-skill-mandatory-fast-gateway.yml, which is the single deployment
  # authority; this job VERIFIES what that authority put live and never mutates
  # production itself.
  #
  # Nothing here is weakened relative to the Railway gate it replaces. The
  # exact-SHA requirement is now stricter, not looser: Railway could not carry
  # the repository commit at all (its connector only redeployed when the service
  # source changed), so that gate compared gateway SOURCE TREES. The Worker is
  # deployed at an exact revision, so this compares the commit itself.
  production-smoke:
    name: Cloudflare production verification
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cloudflare health and exact source SHA
        shell: bash
        run: |
          set -euo pipefail
          # The deploy authority runs on its own trigger, so allow propagation
          # time rather than racing it. A wrong SHA is never accepted as "close
          # enough": the loop retries, it does not relax.
          ok=0
          for attempt in $(seq 1 30); do
            HEALTH="$(curl -sS --connect-timeout 5 --max-time 20 "$PROD_GATEWAY_URL/health" || true)"
            if printf '%s' "$HEALTH" > /tmp/cf-health.json && \
               GITHUB_SHA="$GITHUB_SHA" python - <<'PY'; then
          import json, os, sys
          from pathlib import Path
          try:
              data = json.loads(Path('/tmp/cf-health.json').read_text())
          except Exception:
              sys.exit(1)
          if data.get('ok') is not True:
              sys.exit(1)
          if data.get('runtimeProvider') != 'cloudflare-workers':
              sys.exit(1)
          if data.get('localInstallRequired') is not False:
              sys.exit(1)
          if (data.get('deploymentSourceSha') or '') != os.environ['GITHUB_SHA']:
              sys.exit(1)
          print('CLOUDFLARE_HEALTH=PASS')
          print('CLOUDFLARE_SHA_MATCH=PASS')
          PY
              ok=1
              break
            fi
            echo "AWAITING_CLOUDFLARE_DEPLOY attempt=$attempt expected=$GITHUB_SHA"
            sleep 20
          done
          if [ "$ok" != "1" ]; then
            echo "CLOUDFLARE_HEALTH=FAIL"
            echo "CLOUDFLARE_SHA_MATCH=FAIL"
            echo "REFUSED: the Cloudflare Worker did not report ok, runtimeProvider=cloudflare-workers, localInstallRequired=false and deploymentSourceSha=$GITHUB_SHA." >&2
            cat /tmp/cf-health.json 2>/dev/null || true
            exit 1
          fi
          echo "ZERO_LOCAL=PASS"
          echo "PERSONAL_PC_REQUIRED=false"
          echo "RAILWAY_REQUIRED=false"

      - name: Verify production read-only capabilities
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent "$PROD_GATEWAY_URL/capabilities" > /tmp/cf-capabilities.json
          cat /tmp/cf-capabilities.json
          python - <<'PY'
          import json, re
          from pathlib import Path
          data = json.loads(Path('/tmp/cf-capabilities.json').read_text())
          if data.get('runtimeProvider') != 'cloudflare-workers':
              raise SystemExit('capabilities did not come from the Cloudflare runtime')
          if data.get('localInstallRequired') is not False:
              raise SystemExit('production unexpectedly requires local install')
          tools = data.get('tools', [])
          if 'market_execution_quote' not in tools:
              raise SystemExit('market_execution_quote missing in production')
          if re.search(r'place_order|cancel_order|withdraw|transfer|swap|bridge|wallet|payment',
                       json.dumps(tools), re.I):
              raise SystemExit('write/high-risk tool exposed in production')
          print('CLOUDFLARE_READ_ONLY_CAPABILITIES=PASS')
          PY

      - name: Live research smoke - authoritative Bybit BTCUSDT execution quotes
        shell: bash
        run: |
          set -euo pipefail
          for SPEC in \
            'bybit LONG BTCUSDT ask' \
            'bybit SHORT BTCUSDT bid'; do
            set -- $SPEC
            VENUE="$1"; SIDE="$2"; SYMBOL="$3"; SEMANTIC="$4"
            FILE="/tmp/cf-${VENUE}-${SYMBOL}-${SIDE}.json"
            curl --fail --silent \
              -H 'content-type: application/json' \
              -d "{\"action\":\"execution_quote\",\"symbol\":\"${SYMBOL}\",\"instrument\":\"perpetual\",\"side\":\"${SIDE}\",\"executionVenue\":\"${VENUE}\"}" \
              "$PROD_GATEWAY_URL/research/market" > "$FILE"
            cat "$FILE"; echo
            python - "$FILE" "$VENUE" "$SIDE" "$SYMBOL" "$SEMANTIC" <<'PY'
          import json, math, sys
          from pathlib import Path
          path, venue, side, symbol, semantic = sys.argv[1:]
          data = json.loads(Path(path).read_text())
          quote = data.get('executionQuote', {})
          if data.get('ok') is not True:
              raise SystemExit(f'{venue} {symbol}: production execution quote failed: {data}')
          if quote.get('executionVerified') is not True or quote.get('status') != 'OK':
              raise SystemExit(f'{venue} {symbol}: execution quote not verified: {quote}')
          if quote.get('venue') != venue or quote.get('instrumentType') != 'perpetual':
              raise SystemExit(f'{venue} {symbol}: venue/instrument mismatch: {quote}')
          if quote.get('side') != side or quote.get('executableSemantic') != semantic:
              raise SystemExit(f'{venue} {symbol}: side/semantic mismatch: {quote}')
          bid = float(quote.get('bid', 0)); ask = float(quote.get('ask', 0))
          executable = float(quote.get('executablePrice', 0))
          age = float(quote.get('quoteAgeMs', 1e18))
          spread = float(quote.get('spreadBps', math.nan))
          expected = ask if semantic == 'ask' else bid
          if not (bid > 0 and ask > 0 and bid <= ask and executable == expected):
              raise SystemExit(f'{venue} {symbol}: invalid executable bid/ask: {quote}')
          if not (0 <= age <= 5000):
              raise SystemExit(f'{venue} {symbol}: stale production quote: {quote}')
          if not (math.isfinite(spread) and spread >= 0):
              raise SystemExit(f'{venue} {symbol}: invalid production spread: {quote}')
          if int(quote.get('sourceTimestampMs', 0)) <= 0 or int(quote.get('receivedTimestampMs', 0)) <= 0:
              raise SystemExit(f'{venue} {symbol}: invalid production timestamps: {quote}')
          PY
          done
          echo "LIVE_RESEARCH_SMOKE=PASS"
