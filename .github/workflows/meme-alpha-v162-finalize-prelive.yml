name: Meme Alpha v1.6.2 Finalize Pre-Live
on:
  push:
    paths:
      - 'ops/meme-alpha/v162-finalize-prelive.sh'
      - '.github/workflows/meme-alpha-v162-finalize-prelive.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  finalize:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Finalize pre-live
        run: bash ops/meme-alpha/v162-finalize-prelive.sh
