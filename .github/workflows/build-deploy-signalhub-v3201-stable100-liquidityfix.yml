name: Build Deploy SignalHub V3.20.1 Stable100 LiquidityFix

on:
  push:
    branches: [signalhub-v3201-stable100-liquidityfix]
    paths:
      - 'scripts/patch_signalhub_v3201_okx_liquidity.py'
      - '.github/workflows/build-deploy-signalhub-v3201-stable100-liquidityfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      BASE: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Apply V3.19 -> V3.19.1 -> V3.20 -> V3.20.1
        run: |
          set -euo pipefail
          python3 scripts/patch_signalhub_v319_15slot_liquidity_universe.py
          python3 scripts/patch_signalhub_v3191_reference_fallback.py
          python3 scripts/patch_signalhub_v320_stable100_continuous.py
          python3 scripts/patch_signalhub_v3201_okx_liquidity.py
          node --check signalhub-worker/gateway-v3.js

      - name: Verify source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text();a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text();g=Path('signalhub-android/app/build.gradle').read_text()
          for x in ['SIGNALHUB-V3-GATEWAY-3.20.1','STABLE100_SIZE=100','standbyPerStyle:20','stableUniverseSize:100','DYNAMIC_STABLE100_EVERY_SERVER_CYCLE_PLUS_ON_DEMAND','OKX_BASE_CCY_VOL_X_LAST','QUOTE_TURNOVER_THEN_OI_THEN_SPREAD_THEN_MOVE','CONTINUOUS_STABLE100_REFILL']:
              assert x in w,x
          assert "turnover24h:isFinitePositive(quoteVol)?quoteVol:" not in w
          assert 'APP_VERSION="3.20.1"' in a
          assert "versionCode 27" in g and "versionName '3.20.1'" in g
          print('V3.20.1 source contracts PASS')
          PY

      - name: Dry run and Android build
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v3201-worker
          cd signalhub-android && gradle :app:assembleDebug --stacktrace --no-daemon
          cd ..
          unzip -t signalhub-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Wait for V3.20.1
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 60); do
            curl -fsS --max-time 20 "$BASE/v3/status?v3201=$RANDOM-$n" >/tmp/status.json || true
            if python3 - <<'PY'
          import json
          try:s=json.load(open('/tmp/status.json'))
          except:raise SystemExit(1)
          assert s.get('version')=='SIGNALHUB-V3-GATEWAY-3.20.1',s.get('version')
          p=(s.get('decisionPolicy') or {}).get('portfolioPolicy') or {}
          assert p.get('stableUniverseSize')==100,p
          assert (p.get('targetActiveByStyle') or {})=={'SCALP':10,'SWING':5},p
          PY
            then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1

      - name: Prove normalized dynamic stable100
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$BASE/v3/crypto/stable100?v3201=$RANDOM" >/tmp/u.json
          python3 - <<'PY'
          import json,math
          u=json.load(open('/tmp/u.json'));rows=u.get('rows') or [];syms=u.get('symbols') or []
          print('STABLE100',u.get('provider'),u.get('count'),syms[:30])
          assert u.get('ok') is True,u
          assert u.get('target')==100 and u.get('count')==100,u
          assert len(rows)==100 and len(syms)==100 and len(set(syms))==100
          assert u.get('ranking')=='QUOTE_TURNOVER_THEN_OI_THEN_SPREAD_THEN_MOVE',u
          majors=set(syms[:50]) & {'BTCUSDT','ETHUSDT','SOLUSDT','XRPUSDT'}
          assert len(majors)>=3,('majors missing from normalized top50',majors,syms[:50])
          checked=0
          for r in rows:
              assert float(r.get('turnover24h') or 0)>=20_000_000,r.get('symbol')
              assert float(r.get('spreadBps') if r.get('spreadBps') is not None else 999)<=15,r.get('symbol')
              assert abs(float(r.get('change24hPct') or 0))<=35,r.get('symbol')
              if r.get('turnoverModel')=='OKX_BASE_CCY_VOL_X_LAST':
                  v=float(r.get('volume24h') or 0);px=float(r.get('lastPrice') or 0);turn=float(r.get('turnover24h') or 0)
                  if v>0 and px>0:
                      assert abs(turn-v*px) <= max(2.0,abs(turn)*1e-8),(r.get('symbol'),turn,v*px)
                      checked+=1
          if u.get('provider')=='OKX': assert checked>=80,checked
          print('normalized stable100 PASS; majors=',majors,'okx_checked=',checked)
          PY

      - name: Refill 10 scalp + 5 swing continuously
        run: |
          set -euo pipefail
          reached=0
          for n in $(seq 1 16); do
            curl -fsS --max-time 180 "$BASE/v3/scan?market=CRYPTO&style=SCALP&v3201=$RANDOM-$n" >/tmp/scalp.json || true
            curl -fsS --max-time 180 "$BASE/v3/scan?market=CRYPTO&style=SWING&v3201=$RANDOM-$n" >/tmp/swing.json || true
            curl -fsS --max-time 30 "$BASE/v3/portfolio?v3201=$RANDOM-$n" >/tmp/p.json
            python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/p.json')).get('portfolio') or {})
          print('PORTFOLIO',p.get('activeTotal'),p.get('styles'),p.get('uniqueSymbols'))
          for name,path in [('SCALP','/tmp/scalp.json'),('SWING','/tmp/swing.json')]:
              try:
                  q=json.load(open(path));print(name,{k:q.get(k) for k in ['stable100Count','liquidUniverse','deepAnalyzed','evaluated','actionable','created']})
              except:pass
          PY
            if python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/p.json')).get('portfolio') or {})
          assert p.get('activeTotal')==15,p
          assert (p.get('styles') or {})=={'SCALP':10,'SWING':5},p
          assert p.get('uniqueSymbols')==15,p
          PY
            then reached=1;break;fi
            sleep 2
          done
          test "$reached" = 1

      - name: Audit active book and reserve policy
        run: |
          set -euo pipefail
          curl -fsS --max-time 45 "$BASE/v3/signals?market=CRYPTO&style=SCALP&status=active&limit=100" >/tmp/as.json
          curl -fsS --max-time 45 "$BASE/v3/signals?market=CRYPTO&style=SWING&status=active&limit=100" >/tmp/aw.json
          curl -fsS --max-time 30 "$BASE/v3/portfolio?audit=$RANDOM" >/tmp/p.json
          python3 - <<'PY'
          import json
          ss=json.load(open('/tmp/as.json')).get('signals') or [];sw=json.load(open('/tmp/aw.json')).get('signals') or []
          assert len(ss)==10,len(ss);assert len(sw)==5,len(sw)
          rows=ss+sw;assert len({x.get('symbol') for x in rows})==15
          for x in rows:
              assert x.get('status') in ('OPEN','PENDING'),x
              assert x.get('orderType') in ('MARKET','LIMIT','STOP'),x
              if x.get('status')=='PENDING':
                  t=x.get('technicalAtIssue') or {};style=x.get('style')
                  turn=float(t.get('turnover24h') or 0);spread=float(t.get('spreadBps') if t.get('spreadBps') is not None else 999);move=abs(float(t.get('change24hPct') or 0))
                  if style=='SCALP': assert turn>=50_000_000 and spread<=6 and move<=22,(x.get('symbol'),turn,spread,move)
                  else: assert turn>=35_000_000 and spread<=12 and move<=30,(x.get('symbol'),turn,spread,move)
          p=(json.load(open('/tmp/p.json')).get('portfolio') or {});pol=p.get('policy') or {}
          assert pol.get('standbyPerStyle')==20 and pol.get('stableUniverseSize')==100,pol
          print('active book PASS',len(ss),len(sw),'reserve=20/style')
          PY

      - name: Stage checkpoint APK and checksum
        run: |
          set -euo pipefail
          cat > SIGNALHUB_V3_CHECKPOINT_12_STABLE100_LIQUIDITY_NORMALIZED.md <<'EOF'
          # SignalHub V3.20.1 — Stable100 Liquidity Normalized
          Dynamic top-100 USDT perpetual universe is refreshed every one-minute server maintenance cycle and every on-demand scan. OKX SWAP volCcy24h is treated as base-currency quantity and multiplied by last price to normalize approximate quote-USDT turnover before ranking. This prevents low-price high-token-count markets from falsely appearing deepest. Universe ranking uses quote turnover, then OI when available, then spread, then absolute 24h movement. All 100 receive ticker/liquidity review; deeper candle analysis retains a high-liquidity core and rotating coverage. Active reference target remains 10 SCALP + 5 SWING including OPEN and PENDING, one active idea per symbol. Hot-spare pool is 20 per style. Weak-liquidity candidates remain excluded by stricter style rules and conditional refill never forces a MARKET entry.
          EOF
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v3.20.1-Stable100-LiquidityFix.apk
          sha256sum dist/SignalHub-v3.20.1-Stable100-LiquidityFix.apk | tee dist/SignalHub-v3.20.1-Stable100-LiquidityFix-SHA256SUMS.txt
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java SIGNALHUB_V3_CHECKPOINT_12_STABLE100_LIQUIDITY_NORMALIZED.md
          git commit -m 'SignalHub v3.20.1 stable100 liquidity normalized' || true
          git push origin HEAD:signalhub-v3201-stable100-liquidityfix

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.20.1-Stable100-LiquidityFix
          path: dist/
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=signalhub-v3.20.1-stable100-liquidityfix
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --target signalhub-v3201-stable100-liquidityfix --prerelease --title 'SignalHub v3.20.1 — Stable100 LiquidityFix' --notes 'Corrected OKX swap turnover normalization, dynamic stable100 review, rotating deep analysis, 20 hot spares per style, and continuous 10 SCALP + 5 SWING refill.'
