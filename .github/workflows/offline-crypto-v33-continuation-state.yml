name: Offline Crypto V33 Continuation State
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v33_continuation_state.py'
      - '.github/workflows/offline-crypto-v33-continuation-state.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto V33 zero-credit continuation state
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v33_continuation_state.py
