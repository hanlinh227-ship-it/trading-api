# trigger: 2026-08-20 V78-025 guarded batch
name: V78-025 Safe Cleanup + Entry Intel UX

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-025-safe-cleanup-entry-ux.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^SCOPE: V78-025 safe workflow cleanup + Entry Intelligence/Hub UX audit$' docs/ai-coengineer/WRITE_LOCK.md
          test "$(git hash-object cloudflare-worker/providers/entry-intelligence.js)" = '27860df6730d81092e47a536e7d2db9092c2c099'
          test "$(git hash-object cloudflare-worker/hub-v77171.js)" = 'e4160944f299bbb5eade9b2a0d83a1e6f4ecdb4f'

      - name: Apply guarded V78-025 batch
        run: node scripts/v78-025-safe-cleanup-entry-ux.mjs

      - name: Static and invariant validation
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/providers/entry-intelligence.js
          node --check cloudflare-worker/hub-v77171.js
          grep -q 'HUB-R14-ENTRY-INTEL-CLARITY' cloudflare-worker/hub-v77171.js
          grep -q 'SIGNAL ADVISORY' cloudflare-worker/hub-v77171.js
          grep -q 'SIGNAL ONLY' cloudflare-worker/hub-v77171.js
          grep -q 'getEntryIntelligenceShadow(env,240)' cloudflare-worker/hub-v77171.js
          grep -q 'instrumentIdentity:first(c?.instrumentIdentity,a?.instrumentType)' cloudflare-worker/providers/entry-intelligence.js
          ! grep -q 'instrumentIdentity:first(c?.instrumentIdentity,a?.instrumentType,"CASH_INDEX")' cloudflare-worker/providers/entry-intelligence.js
          node --input-type=module <<'NODE'
          import {buildEntryIntelligenceShadow} from './cloudflare-worker/providers/entry-intelligence.js';
          const x=buildEntryIntelligenceShadow({symbol:'NAS100',market:'index',status:'WATCH',reason:'TECHNICAL_NOT_READY',analysisQuote:{fresh:true,source:'TEST',price:20000,quoteAgeSec:1}});
          if(x.marketSpecific.instrumentIdentity!==null) throw new Error('Index identity was fabricated');
          if(x.promotion.allowed!==true) throw new Error('Missing OPTIONAL index identity incorrectly blocked Signal advisory');
          if(x.authority.executionAuthority!=='NONE') throw new Error('Execution authority changed');
          console.log('optional-context invariant PASS');
          NODE
          for f in \
            .github/workflows/v78-020-entry-intelligence-batch.yml \
            .github/workflows/v78-020-production-verify.yml \
            .github/workflows/v78-021-apply.yml \
            .github/workflows/v78-021-apply-v2.yml \
            .github/workflows/v78-022-apply.yml \
            .github/workflows/v78-022-fast.yml \
            .github/workflows/v78-022-retry.yml \
            .github/workflows/v78-023-hub-intelligence.yml \
            .github/workflows/v78-024-doc-sync.yml \
            .github/workflows/v78-025-safe-cleanup-entry-ux.yml; do
              grep -q '^  workflow_dispatch:' "$f"
              ! grep -q '^  push:' "$f"
          done
          git diff --check
          changed="$(git diff --name-only | sort)"
          echo "$changed"
          echo "$changed" | grep -q 'cloudflare-worker/providers/entry-intelligence.js'
          echo "$changed" | grep -q 'cloudflare-worker/hub-v77171.js'
          ! echo "$changed" | grep -Eq 'hyro-execution|hyro-runtime|hyro-position|TRADING_STATE|v775'

      - name: Commit source and workflow cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78-025 Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/providers/entry-intelligence.js cloudflare-worker/hub-v77171.js .github/workflows/v78-020-entry-intelligence-batch.yml .github/workflows/v78-020-production-verify.yml .github/workflows/v78-021-apply.yml .github/workflows/v78-021-apply-v2.yml .github/workflows/v78-022-apply.yml .github/workflows/v78-022-fast.yml .github/workflows/v78-022-retry.yml .github/workflows/v78-023-hub-intelligence.yml .github/workflows/v78-024-doc-sync.yml .github/workflows/v78-025-safe-cleanup-entry-ux.yml
          git commit -m 'V78-025 clarify Signal advisory evidence and archive one-shot triggers'
          git rev-parse HEAD > /tmp/v78025-source-sha
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy Cloudflare production
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/v78025-deploy.log
          grep 'Current Version ID:' /tmp/v78025-deploy.log | tail -1 | sed 's/.*Current Version ID: //' > /tmp/v78025-version-id
          test -s /tmp/v78025-version-id

      - name: Production smoke check
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 60 'https://trading-v77-scanner.hanlinh227.workers.dev/status' | tee /tmp/v78025-status.json
          grep -q 'version' /tmp/v78025-status.json

      - name: Persist audit, validation, and release lock
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          source_sha="$(cat /tmp/v78025-source-sha)"
          version_id="$(cat /tmp/v78025-version-id)"
          cat > docs/ai-coengineer/V78-025_VALIDATION.txt <<EOF
          V78-025 SAFE WORKFLOW CLEANUP + ENTRY INTELLIGENCE / HUB UX AUDIT
          sourceCommit: ${source_sha}
          cloudflareVersionId: ${version_id}
          validatedAt: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          node --check entry-intelligence.js: PASS
          node --check hub-v77171.js: PASS
          OPTIONAL index instrumentIdentity fallback CASH_INDEX removed; missing optional identity remains non-blocking
          Hub revision: HUB-R14-ENTRY-INTEL-CLARITY
          Hub terminology: SIGNAL ADVISORY / SIGNAL OK / SIGNAL BLOCK / SIGNAL ONLY
          Coverage: reads up to 240 retained rows, caps display analysis at latest 60 per market to reduce global-window market starvation
          Archived one-shot workflows: V78-020 batch+production verify; V78-021 apply+v2; V78-022 apply+fast+retry; V78-023 hub-intelligence; V78-024 docs-sync
          Archive mode: workflow_dispatch only; files retained for audit trail
          H1-H6 Hyro source changes: NONE
          TRADING_STATE/v775:books: untouched
          Risk/freshness/structural-SL/news safeguards: unchanged
          Futures/TK2: not restored
          Binance20: remains quarantined
          Production Claude API: PAUSED
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<EOF

          V78-025 — RESOLVED / DEPLOYED
          - Source: ${source_sha}.
          - Cloudflare Version ID: ${version_id}.
          - Part A audit found one concrete quality-fidelity issue: Index marketSpecific.instrumentIdentity defaulted to CASH_INDEX even when no identity evidence was supplied. The fallback is removed; missing OPTIONAL identity lowers context completeness/rank only and never independently blocks.
          - Part C Hub UX now labels Entry Intelligence explicitly SIGNAL ADVISORY / SIGNAL OK / SIGNAL BLOCK / SIGNAL ONLY to avoid confusing advisory admission with execution authority.
          - Coverage now reads the retained 240-row evidence window and caps each market at its latest 60 rows, reducing starvation of Metal/Index by high-volume Forex/Crypto rows.
          - Part D archived completed V78-020..024 one-shot workflows to manual workflow_dispatch only, retaining files/history while stopping push-trigger noise.
          - No Hyro H1-H6 execution source change was made; dedicated H1 round remains future work.
          EOF
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-20
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-025 safe workflow cleanup + Entry Intelligence/Hub UX audit
          RESULT: RESOLVED / DEPLOYED. Validation in docs/ai-coengineer/V78-025_VALIDATION.txt.

          Protocol:
          - Acquire a new lock before the next source write.
          - Never reset TRADING_STATE or delete/reset v775:books.
          - Never weaken hard risk/freshness/structural-SL/news safeguards.
          - Never restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          - Hyro H1 idempotency implementation requires its own dedicated guarded round.
          - Production Claude API remains paused; Claude.ai Web remains full co-engineer.
          EOF
          git add docs/ai-coengineer/V78-025_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-025 validate cleanup and Hub clarity; release lock'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "final_commit=$(git rev-parse HEAD)"
