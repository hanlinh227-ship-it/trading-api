name: Offline Forex Daily Each Symbol V23 Hybrid
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v23_hybrid_entry.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v23-hybrid-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run hybrid limit-market per-pair system
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v23_hybrid_entry.py
