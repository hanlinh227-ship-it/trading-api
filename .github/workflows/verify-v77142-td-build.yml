name: Verify V77.14.2 TD Markets and Build
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/index.js'
      - '.github/workflows/verify-v77142-td-build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build validation
        shell: bash
        run: |
          set +e
          : > V77142_TD_BUILD.txt
          node --check cloudflare-worker/index.js >> V77142_TD_BUILD.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77142_TD_BUILD.txt
          cd cloudflare-worker
          npm install >> ../V77142_TD_BUILD.txt 2>&1; echo "NPM_EXIT=$?" >> ../V77142_TD_BUILD.txt
          npm run prepare:wrangler >> ../V77142_TD_BUILD.txt 2>&1; echo "PREPARE_EXIT=$?" >> ../V77142_TD_BUILD.txt
          npx wrangler deploy --dry-run >> ../V77142_TD_BUILD.txt 2>&1; echo "WRANGLER_EXIT=$?" >> ../V77142_TD_BUILD.txt
          cd ..
      - name: Wait deploy and clean minute
        run: sleep 65
      - name: Forex Metal live
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 55 "$BASE/run-now?group=forex" -o /tmp/fx.json; echo "FOREX_CURL=$?" >> V77142_TD_BUILD.txt
          curl -fsS --max-time 35 "$BASE/run-now?group=metal" -o /tmp/m.json; echo "METAL_CURL=$?" >> V77142_TD_BUILD.txt
          python - <<'PY' >> V77142_TD_BUILD.txt
          import json
          def l(p):
            try:
              with open(p) as f:return json.load(f)
            except:return {}
          for name,p in [('FOREX','/tmp/fx.json'),('METAL','/tmp/m.json')]:
            x=l(p); arr=[]; plans=0; mp=0; lp=0
            for a in x.get('analyses') or []:
              q=a.get('planned') or {}; mode=q.get('mode')
              if q:plans+=1
              if mode=='MARKET':mp+=1
              if mode in ('LIMIT','INDICATIVE_LIMIT'):lp+=1
              arr.append(str(a.get('symbol'))+':'+str(a.get('reason'))+':'+str(mode)+':RR='+str(q.get('targetRR')))
            print(name+'='+str(x.get('status'))+':'+str(x.get('broadOk'))+'/'+str(x.get('requested'))+':deep='+str(x.get('deepOk'))+'/'+str(x.get('deepRequested'))+':plans='+str(plans)+':marketPlan='+str(mp)+':limitPlan='+str(lp))
            print(name+'_RESULTS='+'|'.join(arr))
            print(name+'_ERRORS='+str(len((x.get('diagnostics') or {}).get('broadErrors') or [])))
          fx,m=l('/tmp/fx.json'),l('/tmp/m.json')
          ok=fx.get('broadOk')==28 and fx.get('deepOk')==3 and m.get('broadOk')==2 and m.get('deepOk')==2
          print('MARKET_VERDICT='+('PASS' if ok else 'FAIL'))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77142_TD_BUILD.txt
          git commit -m 'Report V77.14.2 Forex Metal and build verification' || exit 0
          git push origin main
