name: Meme Alpha V379 Source Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact source
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- MICRO LIVE GATE SOURCE ---'
          sed -n '1,180p' "$APP/src/micro-live-gate.js" 2>/dev/null || true
          echo '--- RISK SOURCE ---'
          sed -n '1,180p' "$APP/src/risk.js" 2>/dev/null || true
          echo '--- HEALTH FILE REFERENCES ---'
          grep -RniE 'scanner-source-health|source-health|allowNewEntries|successfulSources|usingCache' "$APP/src" 2>/dev/null | head -n 260 || true
          echo '--- EXISTING HEALTH FILES ---'
          find /opt/meme-alpha /var/lib/meme-alpha -maxdepth 5 -type f \( -iname '*source*health*.json' -o -iname '*scanner*health*.json' \) -print -exec sh -c 'echo FILE=$1; tail -c 5000 "$1" 2>/dev/null || true; echo' _ {} \; 2>/dev/null | head -n 500 || true
