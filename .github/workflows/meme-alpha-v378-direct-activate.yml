name: Meme Alpha V382 Diagnose Updater And Radar
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose root updater rollback and stale radar
        shell: bash
        run: |
          set +e
          APP=/opt/meme-alpha/app
          echo '=== NOW ==='; date -u +%FT%TZ
          echo '=== ROOT REPO ==='
          git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api status --short --branch 2>&1 || true
          git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api rev-parse HEAD 2>&1 || true
          git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api branch --show-current 2>&1 || true
          echo '=== UPDATE SERVICE ==='
          systemctl status auto-futures-update.service --no-pager -l 2>&1 || true
          systemctl status auto-futures-update.timer --no-pager -l 2>&1 || true
          echo '=== UPDATE JOURNAL ==='
          journalctl -u auto-futures-update.service --since '2026-09-06 08:20:00' --no-pager -n 240 2>&1 || true
          echo '=== UPDATE LOG TAIL ==='
          tail -n 240 /opt/trading/trading-api/auto-futures-v1/logs/auto_update.log 2>&1 || true
          echo '=== PAPER/RADAR PROCESS ==='
          pgrep -af 'new-listing-radar.js|scanner.js|run-paper.sh' || true
          echo '=== RUN PAPER RADAR REFERENCES ==='
          grep -nE 'new-listing-radar|radar|scanner.js|while true|LIVE_SCAN_ONLY' "$APP/run-paper.sh" 2>&1 || true
          echo '=== RADAR SOURCE HEAD/TAIL ==='
          head -80 "$APP/src/new-listing-radar.js" 2>&1 || true
          tail -80 "$APP/src/new-listing-radar.js" 2>&1 || true
          echo '=== RADAR FILE ==='
          stat "$APP/runtime-status/new-listing-radar.json" 2>&1 || true
          echo '=== PAPER JOURNAL ==='
          journalctl -u meme-alpha-paper.service --since '2026-09-06 08:15:00' --no-pager -n 220 2>&1 || true
          echo '=== GATE/RISK ==='
          cat "$APP/runtime-status/micro-live-gate.json" 2>&1 || true
          cat "$APP/runtime-status/risk.json" 2>&1 | tail -120 || true
          echo DIAGNOSE_COMPLETE=TRUE
