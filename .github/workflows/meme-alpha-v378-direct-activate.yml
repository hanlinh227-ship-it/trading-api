name: Meme Alpha V382 Live Activate Verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Wait root updater and verify v382 live
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          GATE="$APP/runtime-status/micro-live-gate.json"
          PASS=0
          for i in $(seq 1 220); do
            L=$(git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api rev-parse HEAD 2>/dev/null || true)
            R=$(git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api rev-parse origin/auto-futures-v1 2>/dev/null || true)
            MARK=$(grep -m1 -E 'MICRO_LIVE_EXECUTOR_V382_NO_SOFT_GATE_FAST_PIPELINE|MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION' "$APP/src/micro-live-executor.js" 2>/dev/null || true)
            echo "check=$i rootHead=$L remote=$R marker=${MARK:-NONE}"
            if [ -f "$GATE" ]; then
              python3 -c "import json,time,datetime,sys; d=json.load(open('$GATE')); ts=d.get('timestamp') or ''; age=time.time()-datetime.datetime.fromisoformat(ts.replace('Z','+00:00')).timestamp() if ts else 999; print({'allowed':d.get('allowed'),'armOk':d.get('armOk'),'armAttested':d.get('armAttested'),'mode':d.get('executionMode'),'sourceHealthy':d.get('sourceHealthy'),'riskEntryAllowed':d.get('riskEntryAllowed'),'liveRiskReady':d.get('liveRiskReady'),'reasons':d.get('reasons'),'age':round(age,1)}); ok=(d.get('allowed') is True and d.get('armOk') is True and d.get('armAttested') is True and d.get('executionMode')=='MICRO_LIVE' and d.get('sourceHealthy') is True and d.get('riskEntryAllowed') is True and d.get('liveRiskReady') is True and not (d.get('riskGlobalBlockReasons') or []) and not (d.get('riskLiveBlockReasons') or []) and not (d.get('reasons') or []) and age < 30); sys.exit(0 if ok else 1)" && [ -n "$MARK" ] && PASS=1 && break || true
            fi
            sleep 2
          done
          ALL=1
          for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do A=$(systemctl is-active "$s" || true); echo "$s=$A"; [ "$A" = active ] || ALL=0; done
          echo '=== FINAL EXECUTOR ==='; grep -m1 -E 'MICRO_LIVE_EXECUTOR_V382_NO_SOFT_GATE_FAST_PIPELINE|MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION' "$APP/src/micro-live-executor.js"
          echo '=== FINAL RADAR ==='; python3 -c "import json,os,time; p='$APP/runtime-status/new-listing-radar.json'; d=json.load(open(p)); print({'ageSec':round(time.time()-os.path.getmtime(p),1),'count':len(d.get('candidates') or []),'status':d.get('status')})" || true
          echo '=== FINAL GATE ==='; cat "$GATE"
          [ "$PASS" = 1 ] && [ "$ALL" = 1 ]
          echo V382_LIVE_ACTIVE=TRUE
