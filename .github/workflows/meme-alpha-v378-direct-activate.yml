name: Meme Alpha Arm State Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect arm attestation and maintenance state
        shell: bash
        run: |
          set +e
          echo '=== ARM ATTEST ==='
          cat /var/lib/meme-alpha/data/micro-live/arm-attestation.json 2>&1 || true
          echo '=== V377 MAINT ==='
          ls -l /var/lib/meme-alpha/deploy-v377-maintenance.json 2>&1 || true
          cat /var/lib/meme-alpha/deploy-v377-maintenance.json 2>&1 || true
          echo '=== EXECUTOR USER ACCESS ==='
          systemctl show meme-alpha-micro-live.service -p User -p Group -p SupplementaryGroups -p ProtectSystem -p ReadOnlyPaths -p InaccessiblePaths --no-pager 2>&1 || true
          echo '=== PATH PERMS ==='
          namei -l /etc/meme-alpha/micro-live-armed 2>&1 || true
          echo INSPECT_COMPLETE=TRUE
