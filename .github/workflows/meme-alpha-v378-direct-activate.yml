name: Meme Alpha Updater Failure Detail
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect updater stderr and bot size
        shell: bash
        run: |
          set +e
          ROOT=/opt/trading/trading-api
          BOT="$ROOT/auto-futures-v1"
          echo '=== BOT SIZE ==='; du -sh "$BOT" 2>&1 || true; du -h --max-depth=1 "$BOT" 2>&1 | sort -h | tail -30 || true
          echo '=== BACKUPS SIZE ==='; du -sh /opt/trading/auto-futures-backups 2>&1 || true; ls -ld /opt/trading/auto-futures-backups/release_20260906_08* 2>&1 || true
          echo '=== WATCH LOG ==='; tail -n 320 "$BOT/logs/github_watch.log" 2>&1 || true
          echo '=== ROOT FS ==='; df -h / /opt 2>&1 || true; df -i / /opt 2>&1 || true
          echo '=== FAILED 083243 META ==='; stat "$ROOT/auto-futures-v1.failed.20260906_083243" 2>&1 || true
          echo DETAIL_DONE=TRUE
