name: Meme Alpha V381 Restore Insider And Activate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Harden staged executor, activate, verify live
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          START_EPOCH=$(date +%s)

          python3 - "$ST/micro-live-executor.js" <<'PY'
          import re,sys
          p=sys.argv[1]; e=open(p).read()
          insider="function insiderSafe(c){if(!c||c.insiderRiskDecision!=='PASS')return false;const top=Number(c.topHoldersPct),cluster=Number(c.holderClusterMaxAccountsSameOwner);if(!Number.isFinite(top)||top>35||!Number.isFinite(cluster)||cluster>2)return false;const wt=c.whaleTop10Pct,wd=c.whaleDeltaTop10Pct;if(wt!==null&&wt!==undefined&&wt!==''&&Number.isFinite(Number(wt))&&Number(wt)>=70&&Number(wt)<100)return false;if(wd!==null&&wd!==undefined&&wd!==''&&Number.isFinite(Number(wd))&&Number(wd)>=8)return false;return true}\n"
          if 'function insiderSafe(c)' not in e:
              if 'function coreSafe(c)' not in e: raise SystemExit('CORE_SAFE_MISSING')
              e=e.replace('function coreSafe(c)',insider+'function coreSafe(c)',1)
          m=re.search(r'function coreSafe\(c\)\{(.+?)\}\nfunction ',e,re.S)
          if not m: raise SystemExit('CORE_SAFE_PARSE_FAIL')
          if 'insiderSafe(c)' not in m.group(1):
              old="c.holderClusterDecision==='PASS'&&"
              if old not in e: raise SystemExit('CORE_SAFE_HOLDER_PATTERN_MISSING')
              e=e.replace(old,old+'insiderSafe(c)&&',1)
          open(p,'w').write(e)
          print('V381_INSIDER_DEFENSE_RESTORED=TRUE')
          PY

          chmod 0644 "$ST/scanner.js" "$ST/safe-signal-export.js" "$ST/micro-live-executor.js"
          node --check "$ST/scanner.js"
          node --check "$ST/safe-signal-export.js"
          node --check "$ST/micro-live-executor.js"
          node "$ST/safe-signal-export.js" --self-test > "$ST/signal-active-final.txt" 2>&1
          node "$ST/micro-live-executor.js" --self-test > "$ST/executor-active-final.txt" 2>&1

          python3 - "$ST/scanner.js" "$ST/safe-signal-export.js" "$ST/micro-live-executor.js" "$ST/signal-active-final.txt" "$ST/executor-active-final.txt" <<'PY'
          import re,sys
          sp,gp,ep,stp,etp=sys.argv[1:]
          s=open(sp).read();g=open(gp).read();e=open(ep).read();st=open(stp).read();et=open(etp).read()
          must=[
            'V376_MULTI_STRATEGY_ROUTER_SELF_TEST=PASS' in st,
            'EXECUTOR_CORE_SAFETY_CONTRACT_PRESERVED=TRUE' in st,
            'SECURITY_PASS_REQUIRED=TRUE' in st,
            'HOLDER_PASS_REQUIRED=TRUE' in st,
            'SELL_ROUTE_REQUIRED=TRUE' in st,
            'TOKEN2022_HARD_BLOCK_PRESERVED=TRUE' in st,
            'HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT' in et,
            'EQUITY_GROWTH_SCALES_NEW_BUYS=TRUE' in et,
            'MULTI_POSITION_NO_HARD_COUNT_LIMIT=TRUE' in et,
            "function insiderSafe(c)" in e,
            "c.insiderRiskDecision!=='PASS'" in e,
            'top>35' in e,'cluster>2' in e,
            bool(re.search(r"function coreSafe\(c\)\{[^\n]*insiderSafe\(c\)",e)),
            "securityDecision==='PASS'" in e,"holderClusterDecision==='PASS'" in e,
            'sellRoute===true' in e,'50_000' in e,'impact(c)<=1.25' in e,
            bool(re.search(r'DISCOVERY_RADAR_ONLY_MAX\s*=\s*360',s)),
            bool(re.search(r'JUPITER_MIN_INTERVAL_MS\s*=\s*1900',s)),
            bool(re.search(r'MAX_SELLABILITY_CHECKS_V216\s*=\s*8',s)),
            'preliminary.slice(0, 36)' in s,
            bool(re.search(r'\.slice\(0,\s*12\)',s)),
            'effectiveScore>=50' in g,
            bool(re.search(r'slice\(0,\s*120\)',g)),
            bool(re.search(r'perPositionCap=Math\.min\(60,\s*p\.maxUtilizationPct\)',e)),
            "c.decision==='WATCH'" in e,
            'ageMin>=8' in e,
            'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' in e,
          ]
          if not all(must): raise SystemExit('V381_PREDEPLOY_SEMANTIC_FAIL:'+str([i for i,v in enumerate(must) if not v]))
          print('V381_PREDEPLOY_SEMANTIC=PASS')
          PY

          cp "$APP/run-paper.sh" "$ST/run-paper.pre-v381-live.sh"
          chmod 0755 "$ST/run-paper.pre-v381-live.sh"
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          install -m 0664 "$ST/scanner.js" "$APP/src/scanner.js"
          install -m 0664 "$ST/safe-signal-export.js" "$APP/src/safe-signal-export.js"
          install -m 0664 "$ST/micro-live-executor.js" "$APP/src/micro-live-executor.js"
          printf 'SCANNER_SWAP=TRUE\nSIGNAL_SWAP=TRUE\nEXECUTOR_SWAP=TRUE\n' > "$ST/result.txt"
          cp "$ST/run-paper.pre-v381-live.sh" "$APP/run-paper.sh"
          chmod +x "$APP/run-paper.sh"
          for p in $(pgrep -f 'node .*micro-live-executor.js' || true); do kill -9 "$p" 2>/dev/null || true; done
          exec "$APP/run-paper.sh"
          SH
          chmod +x "$APP/run-paper.sh"
          timeout 135s sudo -n /bin/systemctl restart meme-alpha-paper.service || true

          READY=0
          for i in $(seq 1 115); do
            G="$APP/runtime-status/micro-live-gate.json"; S="$APP/runtime-status/signal-snapshot.json"
            if grep -q 'SCANNER_SWAP=TRUE' "$ST/result.txt" 2>/dev/null \
              && grep -q 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' "$APP/src/micro-live-executor.js" 2>/dev/null \
              && systemctl is-active --quiet meme-alpha-paper.service \
              && systemctl is-active --quiet meme-alpha-micro-live.service \
              && systemctl is-active --quiet meme-alpha-signer.service \
              && grep -q '"allowed": true' "$G" 2>/dev/null \
              && grep -q '"sourceHealthy": true' "$G" 2>/dev/null \
              && grep -q '"riskEntryAllowed": true' "$G" 2>/dev/null; then
              MT=$(stat -c %Y "$S" 2>/dev/null || echo 0)
              if [ "$MT" -ge "$START_EPOCH" ]; then READY=1; break; fi
            fi
            sleep 2
          done
          [ "$READY" = 1 ]

          echo '=== HANDOFF ==='; cat "$ST/result.txt"
          echo '=== SERVICES ==='; systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service
          echo '=== GATE ==='; cat "$APP/runtime-status/micro-live-gate.json"
          echo '=== PIPELINE ==='
          python3 - <<'PY'
          import json,os,time
          for p in ['/opt/meme-alpha/app/runtime-status/new-listing-radar.json','/opt/meme-alpha/app/runtime-status/signal-snapshot.json']:
            d=json.load(open(p));r=d.get('candidates') or []
            print(p,{'timestamp':d.get('timestamp') or d.get('updatedAt'),'status':d.get('status'),'candidates':len(r),'probe':sum(x.get('decision')=='PROBE_CANDIDATE' for x in r),'watch':sum(x.get('decision')=='WATCH' for x in r),'routed':sum(bool(x.get('strategyRouter',{}).get('selectedLane')) for x in r),'ageSec':round(time.time()-os.path.getmtime(p),1)})
          try:
            d=json.load(open('/var/lib/meme-alpha/data/micro-live/state.json'));print('openPositions=',len(d.get('positions') or []))
          except Exception as e: print('stateRead=',e)
          PY
          echo '=== EXECUTOR ==='; pgrep -af 'micro-live-executor.js' || true

          python3 - <<'PY'
          import json,re
          app='/opt/meme-alpha/app';g=json.load(open(app+'/runtime-status/micro-live-gate.json'));e=open(app+'/src/micro-live-executor.js').read();s=open(app+'/src/scanner.js').read()
          ok=(g.get('allowed') is True and g.get('sourceHealthy') is True and g.get('riskEntryAllowed') is True and 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' in e and 'function insiderSafe(c)' in e and 'insiderSafe(c)' in re.search(r'function coreSafe\(c\)\{(.+?)\}\nfunction ',e,re.S).group(1) and bool(re.search(r'MAX_SELLABILITY_CHECKS_V216\s*=\s*8',s)))
          if not ok: raise SystemExit('V381_RUNTIME_VERIFY_FAIL')
          print('V381_RUNTIME_VERIFY=PASS')
          PY
          printf '{"version":"3.81.0","status":"DEPLOYED","profile":"FAST_CAPITAL_ROTATION","timestamp":"%s"}\n' "$(date -u +%FT%TZ)" > "$APP/runtime-status/v381-deployed.json"
          echo V381_ACTIVE=TRUE
