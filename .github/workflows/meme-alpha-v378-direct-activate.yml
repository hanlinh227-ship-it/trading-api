name: Meme Alpha V378 Direct Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify recovery and source permissions
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo "RUN=$(stat -c '%U:%G %a' "$APP/run-paper.sh" 2>/dev/null || echo missing)"
          echo "SRC=$(stat -c '%U:%G %a' "$APP/src" 2>/dev/null || echo missing)"
          echo "EXEC=$(stat -c '%U:%G %a' "$APP/src/micro-live-executor.js" 2>/dev/null || echo missing)"
          echo "PAPER_BEFORE=$(systemctl is-active meme-alpha-paper.service 2>/dev/null || true)"
          if ! systemctl is-active --quiet meme-alpha-paper.service; then sudo -n /bin/systemctl restart meme-alpha-paper.service || true; fi
          sleep 3
          echo "PAPER_AFTER=$(systemctl is-active meme-alpha-paper.service 2>/dev/null || true)"
          echo "MICRO=$(systemctl is-active meme-alpha-micro-live.service 2>/dev/null || true)"
          echo "SIGNER=$(systemctl is-active meme-alpha-signer.service 2>/dev/null || true)"
          echo "EXEC_MARKER=$([[ -f "$APP/src/micro-live-executor.js" ]] && grep -q 'MICRO_LIVE_EXECUTOR_V378_AGGRESSIVE_ROTATION' "$APP/src/micro-live-executor.js" && echo true || echo false)"
          ls -ld "$APP/runtime-status/v378-paper-handoff" 2>/dev/null || true
          ls -la "$APP/runtime-status/v378-paper-handoff" 2>/dev/null || true
