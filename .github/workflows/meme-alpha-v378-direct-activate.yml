name: Meme Alpha Locate Clean Run Paper
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect run-paper backups
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          for f in "$ST"/run-paper*.sh; do
            echo "=== $f ==="
            sed -n '1,80p' "$f" 2>/dev/null
          done
          exit 0
