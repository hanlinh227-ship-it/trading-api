name: Meme Alpha V381 Repaired Selftest Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect repaired staged v381
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          echo '=== SIGNAL ==='; node "$ST/safe-signal-export.js" --self-test; echo signal_rc=$?
          echo '=== EXECUTOR ==='; node "$ST/micro-live-executor.js" --self-test; echo executor_rc=$?
          echo '=== ENTRY ==='; grep -n 'function trendEntryEligible' "$ST/micro-live-executor.js" || true
          echo '=== GATE ==='; cat /opt/meme-alpha/app/runtime-status/micro-live-gate.json 2>/dev/null || true
          echo '=== MARKER ==='; grep -o "MICRO_LIVE_EXECUTOR_[^']*=STARTED" /opt/meme-alpha/app/src/micro-live-executor.js | tail -1 || true
          exit 0
