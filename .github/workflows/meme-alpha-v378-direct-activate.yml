name: Meme Alpha V379 Root Recovery Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect root recovery lane
        shell: bash
        run: |
          set -u
          echo '--- MAINT STATE ---'
          ls -l /var/lib/meme-alpha/deploy-v377-maintenance.json 2>&1 || true
          echo '--- ROOT UPDATER ---'
          systemctl status auto-futures-update.timer auto-futures-update.service --no-pager 2>&1 || true
          echo '--- UPDATER LOG TAIL ---'
          tail -n 120 /opt/trading/trading-api/auto-futures-v1/logs/auto_update.log 2>&1 || true
          echo '--- ARM ---'
          stat -c 'uid=%u gid=%g mode=%a owner=%U group=%G' /etc/meme-alpha/micro-live-armed 2>&1 || true
          cat /etc/meme-alpha/micro-live-armed 2>&1 || true
