name: Meme Alpha V380 Discovery Expansion Layer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Activate v380 discovery expansion
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v380-discovery"
          mkdir -p "$ST"
          chmod 0777 "$ST"
          cp "$APP/src/new-listing-radar.js" "$ST/radar.js"
          cp "$APP/src/scanner.js" "$ST/scanner.js"
          cp "$APP/run-paper.sh" "$ST/run-paper.backup.sh"
          python3 - "$ST/radar.js" "$ST/scanner.js" <<'PY'
          import re,sys
          rp,sp=sys.argv[1:3]
          r=open(rp).read(); s=open(sp).read()
          def sub1(txt,pat,repl,label):
              out,n=re.subn(pat,repl,txt,count=1)
              if n!=1: raise SystemExit(f'PATCH_MISMATCH_{label}_{n}')
              return out
          r=sub1(r,r'const MAX_CURRENT=\d+;', 'const MAX_CURRENT=720;', 'RADAR_MAX_CURRENT')
          r=sub1(r,r'const FAST_DISCOVERY_RESERVE=\d+;', 'const FAST_DISCOVERY_RESERVE=320;', 'RADAR_FAST_RESERVE')
          r=sub1(r,r'const MAX_OUTPUT=\d+;', 'const MAX_OUTPUT=900;', 'RADAR_MAX_OUTPUT')
          s=sub1(s,r'const DISCOVERY_RADAR_ONLY_MAX\s*=\s*\d+;', 'const DISCOVERY_RADAR_ONLY_MAX = 520;', 'SCANNER_RADAR_MAX')
          s=s.replace('keep the best 30, then add at most 10 high-signal meme/launchpad candidates','keep the best 80, then add at most 40 high-signal meme/launchpad candidates')
          s=s.replace('.slice(0, 30)', '.slice(0, 80)').replace('.slice(0,30)', '.slice(0,80)')
          s=s.replace('.slice(0, 10)', '.slice(0, 40)').replace('.slice(0,10)', '.slice(0,40)')
          open(rp,'w').write(r);open(sp,'w').write(s)
          print('V380_DISCOVERY_PATCH=PASS')
          PY
          node --check "$ST/radar.js"
          node --check "$ST/scanner.js"
          node "$ST/radar.js" --self-test > "$ST/radar-selftest.txt" 2>&1
          node "$ST/scanner.js" --self-test > "$ST/scanner-selftest.txt" 2>&1
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v380-discovery"
          install -m 0664 "$ST/radar.js" "$APP/src/new-listing-radar.js"
          install -m 0664 "$ST/scanner.js" "$APP/src/scanner.js"
          printf 'RADAR_SWAP=TRUE\nSCANNER_SWAP=TRUE\n' > "$ST/result.txt"
          cp "$ST/run-paper.backup.sh" "$APP/run-paper.sh"
          chmod +x "$APP/run-paper.sh"
          exec "$APP/run-paper.sh"
          SH
          chmod +x "$APP/run-paper.sh"
          sudo systemctl restart meme-alpha-paper.service
          sleep 10
          systemctl is-active --quiet meme-alpha-paper.service
          systemctl is-active --quiet meme-alpha-micro-live.service
          systemctl is-active --quiet meme-alpha-signer.service
          grep -q '"allowed": true' "$APP/runtime-status/micro-live-gate.json"
          grep -q 'const MAX_CURRENT=720;' "$APP/src/new-listing-radar.js"
          grep -q 'const FAST_DISCOVERY_RESERVE=320;' "$APP/src/new-listing-radar.js"
          grep -q 'const DISCOVERY_RADAR_ONLY_MAX = 520;' "$APP/src/scanner.js"
          printf '{"version":"3.80.0","status":"DEPLOYED","profile":"DISCOVERY_EXPANSION_LAYER","timestamp":"%s"}\n' "$(date -u +%FT%TZ)" > "$APP/runtime-status/v380-deployed.json"
          echo 'V380_ACTIVE=TRUE'
