name: Meme Alpha V381 Final Diagnose
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged v381 exact failure
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          echo '=== CHECKS ==='
          node --check "$ST/scanner.js"; echo scanner_check=$?
          node --check "$ST/safe-signal-export.js"; echo signal_check=$?
          node --check "$ST/micro-live-executor.js"; echo executor_check=$?
          echo '=== SIGNAL SELFTEST ==='
          node "$ST/safe-signal-export.js" --self-test; echo signal_rc=$?
          echo '=== EXECUTOR SELFTEST ==='
          node "$ST/micro-live-executor.js" --self-test; echo executor_rc=$?
          echo '=== KEY EXECUTOR LINES ==='
          grep -nE 'function insiderSafe|function coreSafe|MICRO_LIVE_EXECUTOR_V381|perPositionCap|ageMin>=8|decision.*WATCH' "$ST/micro-live-executor.js" | head -30
          echo '=== RUNTIME STATUS ==='
          grep -o "MICRO_LIVE_EXECUTOR_[^']*=STARTED" /opt/meme-alpha/app/src/micro-live-executor.js | tail -1
          cat /opt/meme-alpha/app/runtime-status/micro-live-gate.json 2>/dev/null || true
          exit 0
