name: Meme Alpha Writable Paths Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect writable paths and radar child state
        shell: bash
        run: |
          set +e
          BOT=/opt/trading/trading-api/auto-futures-v1
          APP=/opt/meme-alpha/app
          echo '=== LOG DIR ==='; ls -ld "$BOT/logs"; id; [ -w "$BOT/logs" ] && echo LOG_DIR_WRITABLE=YES || echo LOG_DIR_WRITABLE=NO
          echo '=== LOG FILES ==='; find "$BOT/logs" -maxdepth 1 -type f -size +2M -printf '%s %m %u:%g %p\n' | sort -nr | head -20
          echo '=== APP/RUNTIME DIR ==='; ls -ld "$APP" "$APP/runtime-status"; [ -w "$APP/run-paper.sh" ] && echo RUN_PAPER_WRITABLE=YES || echo RUN_PAPER_WRITABLE=NO; [ -w "$APP/runtime-status" ] && echo RUNTIME_DIR_WRITABLE=YES || echo RUNTIME_DIR_WRITABLE=NO
          echo '=== RADAR FILE PERMS ==='; ls -l "$APP/src/new-listing-radar.js" "$APP/runtime-status/new-listing-radar-runtime.log" "$APP/runtime-status/new-listing-radar.json" 2>&1 || true
          echo '=== PAPER PROCESSES ==='; ps -eo pid,ppid,user,stat,wchan:32,etime,cmd | grep -E 'run-paper.sh|new-listing-radar.js|scanner.js' | grep -v grep || true
          echo '=== CHILDREN ==='; P=$(systemctl show -p MainPID --value meme-alpha-paper.service); echo main=$P; ps --ppid "$P" -o pid,ppid,user,stat,wchan:32,etime,cmd 2>&1 || true
          echo '=== PAPER STATUS ==='; systemctl show meme-alpha-paper.service -p ActiveState -p SubState -p MainPID -p NRestarts -p ExecMainStatus --no-pager || true
          echo INSPECT_PATHS=PASS
