name: Meme Alpha V381 Fixture Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect selftest fixture
        shell: bash
        run: |
          set +e
          F=/opt/meme-alpha/app/runtime-status/v381-fast-capital/micro-live-executor.js
          nl -ba "$F" | sed -n '282,294p'
          grep -nE 'const c=|insiderRiskDecision|topHoldersPct|holderClusterMaxAccountsSameOwner' "$F" | tail -20
          exit 0
