name: Meme Alpha V379 Active Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Final verify
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          sleep 8
          G="$APP/runtime-status/micro-live-gate.json"
          echo '--- GATE ---'
          cat "$G"
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service
          systemctl is-active meme-alpha-micro-live.service
          systemctl is-active meme-alpha-signer.service
          echo '--- EXECUTOR ---'
          grep -n 'MICRO_LIVE_EXECUTOR_V379_HIGH_OPPORTUNITY' "$APP/src/micro-live-executor.js"
          echo '--- ROOT RECOVERY LOG ---'
          grep -E '2026-09-06T05:5|MEME_HOOK|MEME_V377_MAINTENANCE|ALREADY_SUPERSEDED' /opt/trading/trading-api/auto-futures-v1/logs/auto_update.log 2>/dev/null | tail -n 100 || true
          grep -q '"allowed": true' "$G"
          grep -q '"armOk": true' "$G"
          grep -q '"sourceHealthy": true' "$G"
          grep -q '"riskEntryAllowed": true' "$G"
          grep -q '"liveRiskReady": true' "$G"
          [[ "$(pgrep -fc '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true)" -eq 1 ]]
          OUT="$GITHUB_WORKSPACE/meme-alpha-runtime/V379-ACTIVE.md"
          {
            echo '# Meme Alpha V379 ACTIVE'
            echo
            echo '- profile: `HIGH_OPPORTUNITY_CAPTURE`'
            echo '- executor_marker: `true`'
            echo '- live_entry_allowed: `true`'
            echo '- arm_ok: `true`'
            echo '- source_healthy: `true`'
            echo '- risk_entry_allowed: `true`'
            echo '- live_risk_ready: `true`'
            echo '- micro_live_service: `active`'
            echo '- paper_service: `active`'
            echo '- signer_service: `active`'
            echo '- micro_live_processes: `1`'
            echo "- checked_at_utc: \`$(date -u +%FT%TZ)\`"
          } > "$OUT"
          git config user.name 'meme-alpha-vps-bot'
          git config user.email 'actions-bot@users.noreply.github.com'
          git add meme-alpha-runtime/V379-ACTIVE.md
          git commit -m 'chore(meme): confirm v379 live entry active' || true
          git push origin HEAD:main
