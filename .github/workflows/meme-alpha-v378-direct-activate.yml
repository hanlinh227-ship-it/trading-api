name: Meme Alpha Safe Deploy Script Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect safe deploy script
        shell: bash
        run: |
          set +e
          echo '=== SAFE DEPLOY SCRIPT ==='
          ls -l /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          sed -n '1,260p' /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          echo SCRIPT_INSPECT=PASS
