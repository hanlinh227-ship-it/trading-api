name: Meme Alpha V382 Paper Runner Trace
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Trace paper runner under service user
        shell: bash
        run: |
          set +e
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          rm -f "$APP/runtime-status/paper-v382-trace.log" 2>/dev/null || true
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          exec /bin/bash -x /opt/meme-alpha/app/runtime-status/v381-fast-capital/run-paper.original.sh >> /opt/meme-alpha/app/runtime-status/paper-v382-trace.log 2>&1
          SH
          chmod 0755 "$APP/run-paper.sh"
          timeout 30s sudo -n /bin/systemctl restart meme-alpha-paper.service || true
          sleep 8
          echo '=== SERVICE ==='
          systemctl status meme-alpha-paper.service --no-pager -l 2>/dev/null | tail -60 || true
          echo '=== TRACE ==='
          tail -n 180 "$APP/runtime-status/paper-v382-trace.log" 2>/dev/null || true
          echo '=== PROCESSES ==='
          ps -eo pid,ppid,etime,stat,cmd | grep -E 'new-listing-radar.js|scanner.js|safe-signal-export.js|run-paper.sh|micro-live-executor.js' | grep -v grep || true
          exit 0
