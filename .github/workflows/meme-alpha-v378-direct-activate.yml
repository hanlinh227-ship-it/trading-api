name: Meme Alpha V380 Radar Restore Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect restore path
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service 2>/dev/null || true
          echo '--- SRC RADAR ---'
          ls -la "$APP/src" | grep -E 'radar|scanner|executor' || true
          echo '--- STAGED RADAR ---'
          ls -l "$APP/runtime-status/v380-radar/radar.js" 2>/dev/null || true
          grep -E 'const (MAX_CURRENT|FAST_DISCOVERY_RESERVE|MAX_OUTPUT)=' "$APP/runtime-status/v380-radar/radar.js" 2>/dev/null || true
          echo '--- RUN PAPER ---'
          sed -n '1,220p' "$APP/run-paper.sh" 2>/dev/null || true
          echo '--- PAPER UNIT ---'
          systemctl cat meme-alpha-paper.service 2>/dev/null || true
          echo '--- RADAR UNITS ---'
          systemctl list-unit-files --type=service | grep -i 'meme-alpha.*radar' || true
          systemctl list-units --type=service --all | grep -i 'meme-alpha.*radar' || true
          echo '--- GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
