name: Meme Alpha Safe Deploy Interface Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect safe deploy interface
        shell: bash
        run: |
          set +e
          echo '=== SAFE DEPLOY SOURCE ==='
          sed -n '1,260p' /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          echo '=== APP CURRENT ==='
          grep -nE 'MICRO_LIVE_EXECUTOR_V382|ARM|attestation|micro-live-armed' /opt/meme-alpha/app/src/micro-live-executor.js /opt/meme-alpha/app/src/micro-live-gate.js 2>/dev/null | head -120 || true
          echo INSPECT_COMPLETE=TRUE
