name: Meme Alpha V381 Stage Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v381 staged executor
        shell: bash
        run: |
          set +e
          F=/opt/meme-alpha/app/runtime-status/v381-fast-capital/micro-live-executor.js
          echo '=== FILE ==='; ls -l "$F"; node --check "$F" 2>&1 || true
          echo '=== MARKERS ==='; grep -nE 'V381|FAST_CAPITAL|ROTATION|STARTED|insiderSafe|function coreSafe' "$F" 2>&1 | tail -80 || true
          echo '=== SELFTEST ==='; node "$F" --self-test 2>&1 | tail -120 || true
          echo '=== ACTIVE MARKERS ==='; grep -nE 'V37[789]|V38[0-9]|FAST_CAPITAL|ROTATION' /opt/meme-alpha/app/src/micro-live-executor.js 2>&1 | tail -80 || true
          echo STAGE_INSPECT=PASS
