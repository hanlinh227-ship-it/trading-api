name: Meme Alpha V378 Direct Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect root bridge handoff
        shell: bash
        run: |
          set -u
          echo '--- BRIDGE SERVICE ---'
          systemctl cat trading-vps-bridge.service 2>&1 || true
          systemctl show trading-vps-bridge.service -p User -p Group -p ExecStart -p FragmentPath -p MainPID 2>&1 || true
          echo '--- BRIDGE SCRIPT ---'
          for p in /usr/local/bin/trading-vps-bridge.sh /usr/local/sbin/trading-vps-bridge /usr/local/bin/trading-vps-bridge; do
            if [[ -f "$p" ]]; then echo "PATH=$p"; ls -l "$p"; sed -n '1,320p' "$p"; fi
          done
          echo '--- BRIDGE DIRS ---'
          find /var/lib /run /opt -maxdepth 3 \( -iname '*vps*bridge*' -o -iname '*meme*deploy*' -o -iname '*deploy*queue*' \) -printf '%p %u:%g %m\n' 2>/dev/null | head -n 120 || true
