name: Meme Alpha V381 Bottleneck Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact soft gates and throughput
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          echo '=== SCANNER ==='
          grep -nE 'DISCOVERY_RADAR_ONLY_MAX|JUPITER_MIN_INTERVAL_MS|MAX_SELLABILITY_CHECKS_V216|preliminary.slice|slice\(0, *12\)|sleep\(' "$ST/scanner.js" | head -80
          echo '=== SIGNAL ==='
          grep -nE 'effectiveScore|slice\(0, *120\)|PROBE_CANDIDATE|WATCH|entryAllowed|consecutiveEligible|stable|liquidityStable' "$ST/safe-signal-export.js" | head -120
          echo '=== EXECUTOR ==='
          grep -nE 'function trendEntryEligible|function opportunityLane|consecutiveEligible|liquidityStable|decisionOk|buyerFlow|pulseFlow|realtimeFlow|sleep\(1500\)' "$ST/micro-live-executor.js" | head -100
          exit 0
