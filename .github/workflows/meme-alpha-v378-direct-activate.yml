name: Meme Alpha V380 Runtime Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify v380 runtime
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '--- HANDOFF ---'
          cat "$APP/runtime-status/v380-radar/result.txt" 2>/dev/null || true
          echo '--- CONSTANTS ---'
          grep -E 'const (MAX_CURRENT|FAST_DISCOVERY_RESERVE|MAX_OUTPUT)=' "$APP/src/new-listing-radar.js"
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service
          echo '--- GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json"
          echo '--- RADAR LIVE ---'
          python3 - <<'PY'
          import json
          p='/opt/meme-alpha/app/runtime-status/new-listing-radar.json'
          d=json.load(open(p))
          print('status=',d.get('status'))
          print('candidateCount=',len(d.get('candidates') or []))
          print('updatedAt=',d.get('updatedAt'))
          print('providerCount=',d.get('providerCount'))
          print('fastProviderCount=',d.get('fastProviderCount'))
          PY
          grep -q 'RADAR_SWAP=TRUE' "$APP/runtime-status/v380-radar/result.txt"
          grep -q 'const MAX_CURRENT=720;' "$APP/src/new-listing-radar.js"
          grep -q 'const FAST_DISCOVERY_RESERVE=320;' "$APP/src/new-listing-radar.js"
          grep -q 'const MAX_OUTPUT=900;' "$APP/src/new-listing-radar.js"
          grep -q '"allowed": true' "$APP/runtime-status/micro-live-gate.json"
          echo 'V380_RUNTIME_ACTIVE=TRUE'
