name: Meme Alpha V381 Final Selftest Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Inspect final selftests
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          echo '=== SIGNAL ==='
          cat "$ST/signal-selftest-final.txt" 2>/dev/null || true
          echo '=== EXECUTOR ==='
          cat "$ST/executor-selftest-final.txt" 2>/dev/null || true
          echo '=== CAP ==='
          grep -o 'perPositionCap=Math.min([^;]*' "$ST/micro-live-executor.js" || true
          echo '=== RUNTIME UNCHANGED CHECK ==='
          grep -o "MICRO_LIVE_EXECUTOR_[^']*=STARTED" /opt/meme-alpha/app/src/micro-live-executor.js | tail -1 || true
          exit 0
