name: Meme Alpha V380 Handoff Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Repair handoff and verify
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v380-radar"
          chmod 0644 "$ST/radar.js"
          chmod 0755 "$ST/run-paper.backup.sh" || true
          sleep 12
          echo '--- HANDOFF ---'
          cat "$ST/result.txt" 2>/dev/null || true
          echo '--- RUN PAPER ---'
          head -n 8 "$APP/run-paper.sh" 2>/dev/null || true
          echo '--- RADAR FILE ---'
          ls -l "$APP/src/new-listing-radar.js" 2>/dev/null || true
          grep -E 'const (MAX_CURRENT|FAST_DISCOVERY_RESERVE|MAX_OUTPUT)=' "$APP/src/new-listing-radar.js" 2>/dev/null || true
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service
          echo '--- GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json"
          grep -q 'RADAR_SWAP=TRUE' "$ST/result.txt"
          grep -q 'const MAX_CURRENT=720;' "$APP/src/new-listing-radar.js"
          grep -q 'const FAST_DISCOVERY_RESERVE=320;' "$APP/src/new-listing-radar.js"
          grep -q 'const MAX_OUTPUT=900;' "$APP/src/new-listing-radar.js"
          grep -q '"allowed": true' "$APP/runtime-status/micro-live-gate.json"
          printf '{"version":"3.80.0","status":"DEPLOYED","profile":"RADAR_EXPANSION","timestamp":"%s"}\n' "$(date -u +%FT%TZ)" > "$APP/runtime-status/v380-deployed.json"
          echo 'V380_ACTIVE=TRUE'
