name: Meme Alpha V378 Direct Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Start root bridge if policy permits
        shell: bash
        run: |
          set -u
          echo "BEFORE=$(systemctl is-active trading-vps-bridge.service 2>/dev/null || true)"
          systemctl start trading-vps-bridge.service 2>&1 || true
          sleep 2
          echo "AFTER=$(systemctl is-active trading-vps-bridge.service 2>/dev/null || true)"
          systemctl show trading-vps-bridge.service -p MainPID -p Result -p ActiveState -p SubState 2>/dev/null || true
