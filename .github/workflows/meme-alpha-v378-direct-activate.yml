name: Meme Alpha V379 Arm Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect arm attestation
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SERVICES ---'
          systemctl show meme-alpha-micro-live.service -p User -p Group -p SupplementaryGroups -p MainPID -p ActiveState -p SubState 2>/dev/null || true
          echo '--- ATTESTATION ---'
          ls -l /var/lib/meme-alpha/data/micro-live/arm-attestation.json 2>&1 || true
          cat /var/lib/meme-alpha/data/micro-live/arm-attestation.json 2>&1 || true
          echo '--- GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
          echo '--- EXEC MARKER ---'
          grep -nE 'V379_HIGH_OPPORTUNITY|refreshArmAttestation|ARM_ATTEST' "$APP/src/micro-live-executor.js" 2>/dev/null || true
          echo '--- RECENT MICRO LIVE LOGS ---'
          journalctl -u meme-alpha-micro-live.service -n 80 --no-pager 2>&1 || true
