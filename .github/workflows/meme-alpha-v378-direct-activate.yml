name: Meme Alpha V382 Post Swap Diagnose
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v382 post swap state
        shell: bash
        run: |
          set +e
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          echo '=== NOW ==='; date -u +%FT%TZ
          echo '=== RESULT ==='; cat "$ST/v382-result.txt" 2>/dev/null || true
          echo '=== MARKER ==='; grep -o "MICRO_LIVE_EXECUTOR_[^']*=STARTED" "$APP/src/micro-live-executor.js" | tail -1 || true
          echo '=== PROCESS ==='; pgrep -af 'micro-live-executor.js' || true
          echo '=== SERVICES ==='; systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service 2>/dev/null || true
          echo '=== GATE ==='; cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
          echo '=== AGES ==='
          python3 - <<'PY'
          import os,json,time
          base='/opt/meme-alpha/app/runtime-status/'
          for f in ['new-listing-radar.json','signal-snapshot.json','realtime-pool-pulse.json','trend-pulse.json','whale-flow-intel.json']:
            p=base+f
            try:
              d=json.load(open(p)); r=d.get('candidates') or d.get('rows') or []
              print(f, {'ageSec':round(time.time()-os.path.getmtime(p),1),'ts':d.get('timestamp') or d.get('updatedAt'),'count':len(r) if isinstance(r,list) else None,'status':d.get('status')})
            except Exception as e: print(f,'ERR',e)
          PY
          echo '=== CONSTANTS ==='
          grep -nE 'DISCOVERY_RADAR_ONLY_MAX|JUPITER_MIN_INTERVAL_MS|MAX_SELLABILITY_CHECKS_V216|preliminary.slice\(0, 72\)|slice\(0,300\)|await sleep\(900\)' "$APP/src/scanner.js" "$APP/src/safe-signal-export.js" "$APP/src/micro-live-executor.js" 2>/dev/null || true
          exit 0
