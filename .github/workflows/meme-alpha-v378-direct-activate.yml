name: Meme Alpha Root Arm Helper Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect root arm helper and gate
        shell: bash
        run: |
          set +e
          echo '=== SUDO ==='
          sudo -n -l 2>&1 || true
          echo '=== SAFE DEPLOY FILE ==='
          ls -l /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          file /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          echo '=== SAFE DEPLOY HELP ==='
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy --help 2>&1 || true
          echo '=== ARM FILE ==='
          ls -l /etc/meme-alpha/micro-live-armed 2>&1 || true
          stat /etc/meme-alpha/micro-live-armed 2>&1 || true
          echo '=== GATE ==='
          cat /opt/meme-alpha/app/runtime-status/micro-live-gate.json 2>&1 || true
          echo INSPECT_COMPLETE=TRUE
