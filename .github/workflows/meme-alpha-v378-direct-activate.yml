name: Meme Alpha V382 Clean Runner Diagnose
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect restored runner and live pipeline
        shell: bash
        run: |
          set +e
          APP=/opt/meme-alpha/app
          echo '=== NOW ==='; date -u +%FT%TZ
          echo '=== SERVICE ==='; systemctl status meme-alpha-paper.service --no-pager -l 2>/dev/null | tail -100
          echo '=== PROCESSES ==='; ps -eo pid,ppid,etime,stat,cmd | grep -E 'new-listing-radar.js|scanner.js|safe-signal-export.js|run-paper.sh|micro-live-executor.js' | grep -v grep || true
          echo '=== RUNNER ==='; head -30 "$APP/run-paper.sh" 2>/dev/null
          echo '=== PAPER LOG FILES ==='; tail -n 100 "$APP/runtime-status/new-listing-radar-runtime.log" 2>/dev/null || true
          echo '=== JOURNAL ==='; journalctl -u meme-alpha-paper.service -n 140 --no-pager 2>/dev/null || true
          echo '=== STATE ==='
          python3 - <<'PY'
          import os,time,json
          base='/opt/meme-alpha/app/runtime-status/'
          for f in ['new-listing-radar.json','signal-snapshot.json','micro-live-gate.json','realtime-pool-pulse.json','trend-pulse.json','whale-flow-intel.json']:
            p=base+f
            try:
              d=json.load(open(p)); r=d.get('candidates') or d.get('rows') or []
              print(f,{'age':round(time.time()-os.path.getmtime(p),1),'ts':d.get('timestamp') or d.get('updatedAt'),'count':len(r) if isinstance(r,list) else None,'status':d.get('status'),'allowed':d.get('allowed'),'sourceHealthy':d.get('sourceHealthy'),'riskEntryAllowed':d.get('riskEntryAllowed')})
            except Exception as e: print(f,e)
          PY
          echo '=== MARKER ==='; grep -o "MICRO_LIVE_EXECUTOR_[^']*=STARTED" "$APP/src/micro-live-executor.js" | tail -1 || true
          exit 0
