name: Meme Alpha Arm Interface Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect safe deploy arming interface
        shell: bash
        run: |
          set +e
          echo '=== NOW ==='; date -u +%FT%TZ
          echo '=== SUDO ==='; sudo -n -l 2>&1 || true
          echo '=== SAFE DEPLOY HELP ==='
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy --help 2>&1 || true
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy help 2>&1 || true
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy status 2>&1 || true
          echo '=== GATE ==='; cat /opt/meme-alpha/app/runtime-status/micro-live-gate.json 2>&1 || true
          echo ARM_INTERFACE_INSPECT=PASS
