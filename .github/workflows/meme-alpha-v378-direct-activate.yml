name: Meme Alpha V381 Direct Safety Activate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Validate and activate v381
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          START_EPOCH=$(date +%s)

          chmod 0644 "$ST/scanner.js" "$ST/safe-signal-export.js" "$ST/micro-live-executor.js"
          node --check "$ST/scanner.js"
          node --check "$ST/safe-signal-export.js"
          node --check "$ST/micro-live-executor.js"
          node "$ST/safe-signal-export.js" --self-test > "$ST/signal-selftest-active.txt" 2>&1
          node "$ST/micro-live-executor.js" --self-test > "$ST/executor-selftest-active.txt" 2>&1

          # Direct hard-safety validation: these are the barriers that must NEVER be removed.
          grep -q 'EXECUTOR_CORE_SAFETY_CONTRACT_PRESERVED=TRUE' "$ST/signal-selftest-active.txt"
          grep -q 'SECURITY_PASS_REQUIRED=TRUE' "$ST/signal-selftest-active.txt"
          grep -q 'HOLDER_PASS_REQUIRED=TRUE' "$ST/signal-selftest-active.txt"
          grep -q 'SELL_ROUTE_REQUIRED=TRUE' "$ST/signal-selftest-active.txt"
          grep -q 'TOKEN2022_HARD_BLOCK_PRESERVED=TRUE' "$ST/signal-selftest-active.txt"
          grep -q 'HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT' "$ST/executor-selftest-active.txt"
          grep -q 'EQUITY_GROWTH_SCALES_NEW_BUYS=TRUE' "$ST/executor-selftest-active.txt"
          grep -q "function insiderSafe(c)" "$ST/micro-live-executor.js"
          grep -q "c.insiderRiskDecision!=='PASS'" "$ST/micro-live-executor.js"
          grep -q 'top>35' "$ST/micro-live-executor.js"
          grep -q 'cluster>2' "$ST/micro-live-executor.js"
          grep -q "sellRoute===true" "$ST/micro-live-executor.js"
          grep -q 'n(c.liquidityUsd)>=50_000' "$ST/micro-live-executor.js"
          grep -q 'impact(c)<=1.25' "$ST/micro-live-executor.js"

          # Aggressive profile validation.
          grep -q 'const DISCOVERY_RADAR_ONLY_MAX = 360;' "$ST/scanner.js"
          grep -q 'const JUPITER_MIN_INTERVAL_MS = 1900;' "$ST/scanner.js"
          grep -q 'const MAX_SELLABILITY_CHECKS_V216=8;' "$ST/scanner.js"
          grep -q 'preliminary.slice(0, 36)' "$ST/scanner.js"
          grep -q '.slice(0, 12)' "$ST/scanner.js"
          grep -q "effectiveScore>=50" "$ST/safe-signal-export.js"
          grep -q 'slice(0,120)' "$ST/safe-signal-export.js"
          grep -q 'perPositionCap=Math.min(60,p.maxUtilizationPct)' "$ST/micro-live-executor.js"
          grep -q 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' "$ST/micro-live-executor.js"
          echo V381_PREDEPLOY_VALIDATION=PASS

          cp "$APP/run-paper.sh" "$ST/run-paper.pre-v381-active.sh"
          chmod 0755 "$ST/run-paper.pre-v381-active.sh"
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          install -m 0664 "$ST/scanner.js" "$APP/src/scanner.js"
          install -m 0664 "$ST/safe-signal-export.js" "$APP/src/safe-signal-export.js"
          install -m 0664 "$ST/micro-live-executor.js" "$APP/src/micro-live-executor.js"
          printf 'SCANNER_SWAP=TRUE\nSIGNAL_SWAP=TRUE\nEXECUTOR_SWAP=TRUE\n' > "$ST/result.txt"
          cp "$ST/run-paper.pre-v381-active.sh" "$APP/run-paper.sh"
          chmod +x "$APP/run-paper.sh"
          for p in $(pgrep -f 'node .*micro-live-executor.js' || true); do kill -9 "$p" 2>/dev/null || true; done
          exec "$APP/run-paper.sh"
          SH
          chmod +x "$APP/run-paper.sh"

          timeout 135s sudo -n /bin/systemctl restart meme-alpha-paper.service || true

          READY=0
          for i in $(seq 1 115); do
            GATE="$APP/runtime-status/micro-live-gate.json"
            if grep -q 'SCANNER_SWAP=TRUE' "$ST/result.txt" 2>/dev/null \
              && grep -q 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' "$APP/src/micro-live-executor.js" 2>/dev/null \
              && systemctl is-active --quiet meme-alpha-paper.service \
              && systemctl is-active --quiet meme-alpha-micro-live.service \
              && systemctl is-active --quiet meme-alpha-signer.service \
              && grep -q '"allowed": true' "$GATE" 2>/dev/null \
              && grep -q '"sourceHealthy": true' "$GATE" 2>/dev/null \
              && grep -q '"riskEntryAllowed": true' "$GATE" 2>/dev/null; then
              SIG_MTIME=$(stat -c %Y "$APP/runtime-status/signal-snapshot.json" 2>/dev/null || echo 0)
              if [ "$SIG_MTIME" -ge "$START_EPOCH" ]; then READY=1; break; fi
            fi
            sleep 2
          done
          [ "$READY" = 1 ]

          echo '=== HANDOFF ==='
          cat "$ST/result.txt"
          echo '=== SERVICES ==='
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service
          echo '=== GATE ==='
          cat "$APP/runtime-status/micro-live-gate.json"
          echo '=== PIPELINE ==='
          python3 - <<'PY'
          import json,os,time
          for p in ['/opt/meme-alpha/app/runtime-status/new-listing-radar.json','/opt/meme-alpha/app/runtime-status/signal-snapshot.json']:
            d=json.load(open(p));r=d.get('candidates') or []
            print(p, {'timestamp':d.get('timestamp') or d.get('updatedAt'),'status':d.get('status'),'candidates':len(r),'probe':sum(x.get('decision')=='PROBE_CANDIDATE' for x in r),'watch':sum(x.get('decision')=='WATCH' for x in r),'routed':sum(bool(x.get('strategyRouter',{}).get('selectedLane')) for x in r),'ageSec':round(time.time()-os.path.getmtime(p),1)})
          try:
            d=json.load(open('/var/lib/meme-alpha/data/micro-live/state.json'));print('openPositions=',len(d.get('positions') or []))
          except Exception as e: print('stateRead=',e)
          PY
          echo '=== EXECUTOR ==='
          pgrep -af 'micro-live-executor.js' || true

          grep -q 'SCANNER_SWAP=TRUE' "$ST/result.txt"
          grep -q 'SIGNAL_SWAP=TRUE' "$ST/result.txt"
          grep -q 'EXECUTOR_SWAP=TRUE' "$ST/result.txt"
          grep -q 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' "$APP/src/micro-live-executor.js"
          grep -q 'const MAX_SELLABILITY_CHECKS_V216=8;' "$APP/src/scanner.js"
          grep -q '"allowed": true' "$APP/runtime-status/micro-live-gate.json"
          grep -q '"sourceHealthy": true' "$APP/runtime-status/micro-live-gate.json"
          grep -q '"riskEntryAllowed": true' "$APP/runtime-status/micro-live-gate.json"
          printf '{"version":"3.81.0","status":"DEPLOYED","profile":"FAST_CAPITAL_ROTATION","timestamp":"%s"}\n' "$(date -u +%FT%TZ)" > "$APP/runtime-status/v381-deployed.json"
          echo V381_ACTIVE=TRUE
