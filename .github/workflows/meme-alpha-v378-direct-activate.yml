name: Meme Alpha V381 Logic Selftest Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Print staged v381 selftests
        shell: bash
        run: |
          set +e
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          for f in scanner-selftest-v2.txt signal-selftest-v2.txt executor-selftest-v2.txt; do
            echo "===== $f ====="
            cat "$ST/$f" 2>/dev/null || echo MISSING
          done
          echo '===== DIRECT ====='
          node "$ST/scanner.js" --self-test; echo scanner_rc=$?
          node "$ST/safe-signal-export.js" --self-test; echo signal_rc=$?
          node "$ST/micro-live-executor.js" --self-test; echo executor_rc=$?
          exit 0
