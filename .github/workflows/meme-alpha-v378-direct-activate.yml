name: Meme Alpha V380 Scanner Health Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose scanner health
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SOURCE HEALTH ---'
          cat /var/lib/meme-alpha/data/paper/scanner-source-health.json 2>/dev/null || true
          echo '--- SCANNER LATEST META ---'
          python3 - <<'PY'
          import json,os,time
          for p in ['/var/lib/meme-alpha/data/paper/scanner-latest.json','/var/lib/meme-alpha/data/paper/risk-state.json','/opt/meme-alpha/app/runtime-status/signal-snapshot.json','/opt/meme-alpha/app/runtime-status/new-listing-radar.json']:
            print('###',p)
            try:
              d=json.load(open(p)); print('timestamp',d.get('timestamp') or d.get('updatedAt')); print('candidates',len(d.get('candidates') or [])); print('status',d.get('status')); print('ageSec',round(time.time()-os.path.getmtime(p),1))
            except Exception as e: print('ERR',e)
          PY
          echo '--- PAPER LOG ---'
          tail -n 160 /var/log/meme-alpha/paper.log 2>/dev/null || true
          echo '--- PAPER ERROR ---'
          tail -n 160 /var/log/meme-alpha/paper-error.log 2>/dev/null || true
          echo '--- PROCESS ---'
          ps -eo pid,etimes,cmd | grep -E 'scanner.js|run-paper.sh|safe-signal-export|risk.js' | grep -v grep || true
          echo '--- GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
