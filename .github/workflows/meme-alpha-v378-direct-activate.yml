name: Meme Alpha V379 Executor Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect executor header
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          stat -c '%n %U:%G %a' "$APP/src/micro-live-executor.js" "$APP/src/micro-live-gate.js" "$APP/src/risk.js" "$APP/src" 2>/dev/null || true
          echo '--- EXECUTOR HEAD ---'
          sed -n '1,120p' "$APP/src/micro-live-executor.js" 2>/dev/null || true
          echo '--- EXECUTOR LOOP REFERENCES ---'
          grep -nE 'while|setInterval|main\(|tick\(|MICRO_LIVE_EXECUTOR_V378|allocationProfile|coreSafe' "$APP/src/micro-live-executor.js" 2>/dev/null | head -n 180 || true
