name: Meme Alpha V378 Direct Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect authorized safe deploy interface
        shell: bash
        run: |
          set -u
          echo '--- SAFE DEPLOY SCRIPT ---'
          ls -l /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          sed -n '1,260p' /usr/local/sbin/meme-alpha-safe-deploy 2>&1 || true
          echo '--- HELP ---'
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy --help 2>&1 || true
