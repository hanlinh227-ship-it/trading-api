name: Meme Alpha V381 Selftest Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose v381 staged selftests
        shell: bash
        run: |
          set -u
          ST=/opt/meme-alpha/app/runtime-status/v381-fast-capital
          echo '--- FILES ---'
          ls -la "$ST" || true
          for f in scanner-selftest.txt signal-selftest.txt executor-selftest.txt; do
            echo "--- $f ---"
            cat "$ST/$f" 2>/dev/null || echo MISSING
          done
          echo '--- DIRECT RC ---'
          node "$ST/scanner.js" --self-test >/tmp/v381-scanner.out 2>&1; echo scanner_rc=$?; cat /tmp/v381-scanner.out
          node "$ST/safe-signal-export.js" --self-test >/tmp/v381-signal.out 2>&1; echo signal_rc=$?; cat /tmp/v381-signal.out
          node "$ST/micro-live-executor.js" --self-test >/tmp/v381-executor.out 2>&1; echo executor_rc=$?; cat /tmp/v381-executor.out
