name: Meme Alpha V381 Activate Verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Wait for root updater and verify live activation
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          GATE="$APP/runtime-status/micro-live-gate.json"
          PASS=0
          for i in $(seq 1 150); do
            echo "check=$i time=$(date -u +%FT%TZ)"
            L=$(git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api rev-parse HEAD 2>/dev/null || true)
            R=$(git -c safe.directory=/opt/trading/trading-api -C /opt/trading/trading-api rev-parse origin/auto-futures-v1 2>/dev/null || true)
            echo "rootHead=$L remote=$R"
            if [ -f "$GATE" ]; then
              python3 -c "import json,time,datetime,sys; d=json.load(open('$GATE')); ts=d.get('timestamp') or ''; age=time.time()-datetime.datetime.fromisoformat(ts.replace('Z','+00:00')).timestamp() if ts else 999; print({'allowed':d.get('allowed'),'armOk':d.get('armOk'),'armAttested':d.get('armAttested'),'mode':d.get('executionMode'),'sourceHealthy':d.get('sourceHealthy'),'riskEntryAllowed':d.get('riskEntryAllowed'),'liveRiskReady':d.get('liveRiskReady'),'reasons':d.get('reasons'),'age':round(age,1)}); ok=(d.get('allowed') is True and d.get('armOk') is True and d.get('armAttested') is True and d.get('executionMode')=='MICRO_LIVE' and d.get('sourceHealthy') is True and d.get('riskEntryAllowed') is True and d.get('liveRiskReady') is True and not (d.get('reasons') or []) and age < 30); sys.exit(0 if ok else 1)" && PASS=1 && break || true
            fi
            sleep 2
          done
          echo '=== SERVICES ==='
          for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$s"; systemctl is-active "$s" || true; done
          echo '=== MARKER ==='; grep -m1 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION' "$APP/src/micro-live-executor.js" || true
          echo '=== GATE ==='; cat "$GATE" || true
          [ "$PASS" = 1 ]
          echo V381_LIVE_ACTIVE=TRUE
