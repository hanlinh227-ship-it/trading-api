name: Meme Alpha VPS Load And Conflict Audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Audit VPS load, duplicate processes and stale meme runtime artifacts
        shell: bash
        run: |
          set +e
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status"
          echo '=== NOW ==='; date -u +%FT%TZ
          echo '=== UPTIME/LOAD ==='; uptime; cat /proc/loadavg
          echo '=== CPU ==='; nproc; lscpu | grep -E 'Model name|CPU\(s\)|Thread|Core|Socket|MHz' | head -20
          echo '=== MEMORY ==='; free -h; vmstat 1 3
          echo '=== DISK ==='; df -hT / /opt /var 2>/dev/null; df -ih / /opt /var 2>/dev/null
          echo '=== TOP CPU ==='; ps -eo pid,ppid,user,%cpu,%mem,etime,stat,cmd --sort=-%cpu | head -35
          echo '=== TOP MEM ==='; ps -eo pid,ppid,user,%cpu,%mem,rss,etime,stat,cmd --sort=-rss | head -35
          echo '=== MEME PROCESSES ==='; ps -eo pid,ppid,user,%cpu,%mem,etime,stat,cmd | grep -E 'meme-alpha|new-listing-radar|scanner.js|safe-signal-export|micro-live-executor|realtime-pool-pulse|trend-pulse|whale-flow|ready_signer' | grep -v grep || true
          echo '=== SERVICE STATES ==='; for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do echo -n "$s "; systemctl is-active "$s"; systemctl show "$s" -p MainPID -p MemoryCurrent -p CPUUsageNSec -p NRestarts -p ActiveState -p SubState --no-pager; done
          echo '=== FAILED UNITS ==='; systemctl --failed --no-pager || true
          echo '=== MEME UNITS ==='; systemctl list-unit-files --type=service --no-pager | grep -i meme || true
          echo '=== TIMERS ==='; systemctl list-timers --all --no-pager | grep -E 'meme|auto-futures|trading' || true
          echo '=== RUNTIME STATUS SIZE ==='; du -ah "$ST" 2>/dev/null | sort -h | tail -40
          echo '=== APP SIZE ==='; du -sh "$APP" /opt/meme-alpha-signer /opt/trading 2>/dev/null
          echo '=== RUN-PAPER ARTIFACTS ==='; find "$ST" -maxdepth 3 -type f \( -name 'run-paper*.sh' -o -name '*v37*.json' -o -name '*v38*.json' -o -name '*trace*' -o -name '*result*' \) -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %p\n' 2>/dev/null | sort | tail -120
          echo '=== SOURCE MARKERS ==='; grep -Rho "MICRO_LIVE_EXECUTOR_V[0-9A-Z_=. -]*STARTED" "$APP/src" "$ST" 2>/dev/null | sort -u | tail -40
          echo '=== PIPELINE AGES ==='; python3 -c "import os,time,json; base='/opt/meme-alpha/app/runtime-status/'; files=['new-listing-radar.json','signal-snapshot.json','micro-live-gate.json','realtime-pool-pulse.json','trend-pulse.json','whale-flow-intel.json']; [(lambda p,d,r: print(f,{'ageSec':round(time.time()-os.path.getmtime(p),1),'ts':d.get('timestamp') or d.get('updatedAt'),'count':len(r) if isinstance(r,list) else None,'status':d.get('status'),'allowed':d.get('allowed'),'sourceHealthy':d.get('sourceHealthy'),'riskEntryAllowed':d.get('riskEntryAllowed')}))(base+f, json.load(open(base+f)), (lambda d:(d.get('candidates') or d.get('rows') or []))(json.load(open(base+f)))) for f in files]" || true
          echo '=== PAPER RUNNER HEAD/TAIL ==='; head -40 "$APP/run-paper.sh" 2>/dev/null; tail -60 "$APP/run-paper.sh" 2>/dev/null
          echo '=== RECENT PAPER JOURNAL ==='; journalctl -u meme-alpha-paper.service -n 120 --no-pager 2>/dev/null || true
          echo AUDIT_COMPLETE=TRUE
