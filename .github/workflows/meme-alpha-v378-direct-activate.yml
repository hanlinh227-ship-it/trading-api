name: Meme Alpha V380 Patch Target Inspect

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect v380 patch targets
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SCANNER TARGETS ---'
          grep -n -A80 -B20 -E 'keep the best 30|const final|slice\(0, ?30|high-signal meme|MAX_SELLABILITY_CHECKS' "$APP/src/scanner.js" 2>/dev/null || true
          echo '--- EXECUTOR ALLOCATION / ROTATION ---'
          grep -n -A100 -B20 -E 'function allocationProfile|function targetPlan|function rotationSource|function opportunityLane|function trendEntryEligible|reserve|utilization|freeRatio|basePct|cashBoost' "$APP/src/micro-live-executor.js" 2>/dev/null | head -n 900 || true
          echo '--- PERMISSIONS ---'
          stat -c '%U %G %a %n' "$APP/src/scanner.js" "$APP/src/micro-live-executor.js" "$APP/run-paper.sh" 2>/dev/null || true
          echo '--- LIVE GATE ---'
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
