name: Meme Alpha V378 Direct Activate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect paper restart handoff
        shell: bash
        run: |
          set -u
          systemctl cat meme-alpha-paper.service 2>/dev/null || true
          systemctl show meme-alpha-paper.service -p User -p Group -p ExecStart -p ExecStartPre -p ExecStartPost -p FragmentPath -p MainPID 2>/dev/null || true
          for p in /opt/meme-alpha/app/run-paper.sh /opt/meme-alpha/app/src/paper.js /opt/meme-alpha/app/src/scanner.js /opt/meme-alpha/app/ops/meme-alpha; do
            if [[ -e "$p" ]]; then stat -c '%n %U:%G %a %F' "$p" 2>/dev/null || true; fi
          done
          find /opt/meme-alpha/app/runtime-status -maxdepth 2 -type f -printf '%p %u:%g %m\n' 2>/dev/null | grep -Ei 'deploy|apply|request|command|candidate' | head -n 120 || true
