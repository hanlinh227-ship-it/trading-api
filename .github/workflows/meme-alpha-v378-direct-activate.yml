name: Meme Alpha V379 Root Recovery Result

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect 0545 recovery
        shell: bash
        run: |
          set -u
          echo '--- WATCH SCRIPT ---'
          sed -n '1,220p' /opt/trading/trading-api/auto-futures-v1/runtime/watch_github.sh 2>/dev/null || true
          echo '--- LOG RECENT ---'
          grep -E '2026-09-06T05:4|MEME_|DEPLOY_|GITHUB SOURCE SYNC|PRODUCTION UPDATE' /opt/trading/trading-api/auto-futures-v1/logs/auto_update.log 2>/dev/null | tail -n 160 || true
          echo '--- LOCAL BRANCH/REMOTE ---'
          git -C /opt/trading/trading-api status --short --branch 2>&1 || true
          git -C /opt/trading/trading-api rev-parse HEAD 2>&1 || true
          git -C /opt/trading/trading-api rev-parse refs/remotes/origin/auto-futures-v1 2>&1 || true
          echo '--- TIMER ---'
          systemctl status auto-futures-update.service --no-pager 2>&1 || true
