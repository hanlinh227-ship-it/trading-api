name: Meme Alpha V381 Final Repair Activate
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v378-direct-activate.yml']

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Repair staged executor, activate and verify
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          START_EPOCH=$(date +%s)

          # Resolve the v381 self-test conflict: never chase a raw 5m move >22%,
          # even when a fresh pulse row exists. This keeps the anti-chase guard
          # while retaining the wider WATCH/flow entry profile.
          python3 - "$ST/micro-live-executor.js" <<'PY'
          import re,sys
          p=sys.argv[1]
          e=open(p).read()
          old="const p=pulseFor(c),rt=realtimeFor(c),chg=p?n(p.price5m,-999):n(c.priceChange5m,-999),net=n(c.netBuyers5m,-999)"
          new="const rawChg=n(c.priceChange5m,-999);if(rawChg>22)return false;const p=pulseFor(c),rt=realtimeFor(c),chg=p?n(p.price5m,-999):rawChg,net=n(c.netBuyers5m,-999)"
          if old in e:
              e=e.replace(old,new,1)
          elif 'const rawChg=n(c.priceChange5m,-999);if(rawChg>22)return false;' not in e:
              raise SystemExit('V381_RAW_CHASE_GUARD_PATCH_MISMATCH')
          # Reassert insider defense if any previous staging operation omitted it.
          insider="function insiderSafe(c){if(!c||c.insiderRiskDecision!=='PASS')return false;const top=Number(c.topHoldersPct),cluster=Number(c.holderClusterMaxAccountsSameOwner);if(!Number.isFinite(top)||top>35||!Number.isFinite(cluster)||cluster>2)return false;const wt=c.whaleTop10Pct,wd=c.whaleDeltaTop10Pct;if(wt!==null&&wt!==undefined&&wt!==''&&Number.isFinite(Number(wt))&&Number(wt)>=70&&Number(wt)<100)return false;if(wd!==null&&wd!==undefined&&wd!==''&&Number.isFinite(Number(wd))&&Number(wd)>=8)return false;return true}\n"
          if 'function insiderSafe(c)' not in e:
              if 'function coreSafe(c)' not in e: raise SystemExit('CORE_SAFE_MISSING')
              e=e.replace('function coreSafe(c)',insider+'function coreSafe(c)',1)
          m=re.search(r'function coreSafe\(c\)\{(.+?)\}\nfunction ',e,re.S)
          if not m: raise SystemExit('CORE_SAFE_PARSE_FAIL')
          if 'insiderSafe(c)' not in m.group(1):
              old2="c.holderClusterDecision==='PASS'&&"
              if old2 not in e: raise SystemExit('CORE_SAFE_HOLDER_PATTERN_MISSING')
              e=e.replace(old2,old2+'insiderSafe(c)&&',1)
          open(p,'w').write(e)
          print('V381_RAW_CHASE_GUARD_REPAIRED=TRUE')
          print('V381_INSIDER_DEFENSE_PRESENT=TRUE')
          PY

          chmod 0644 "$ST/scanner.js" "$ST/safe-signal-export.js" "$ST/micro-live-executor.js"
          node --check "$ST/scanner.js"
          node --check "$ST/safe-signal-export.js"
          node --check "$ST/micro-live-executor.js"
          node "$ST/safe-signal-export.js" --self-test > "$ST/signal-final-pass.txt" 2>&1
          node "$ST/micro-live-executor.js" --self-test > "$ST/executor-final-pass.txt" 2>&1
          grep -q 'V376_MULTI_STRATEGY_ROUTER_SELF_TEST=PASS' "$ST/signal-final-pass.txt"
          grep -q 'HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT' "$ST/executor-final-pass.txt"

          python3 - "$ST/scanner.js" "$ST/safe-signal-export.js" "$ST/micro-live-executor.js" <<'PY'
          import re,sys
          s,g,e=[open(x).read() for x in sys.argv[1:]]
          checks={
            'radar_intake':bool(re.search(r'DISCOVERY_RADAR_ONLY_MAX\s*=\s*360',s)),
            'jupiter_pace':bool(re.search(r'JUPITER_MIN_INTERVAL_MS\s*=\s*1900',s)),
            'sell_checks':bool(re.search(r'MAX_SELLABILITY_CHECKS_V216\s*=\s*8',s)),
            'deep36':'preliminary.slice(0, 36)' in s,
            'extra12':bool(re.search(r'\.slice\(0,\s*12\)',s)),
            'signal_threshold':'effectiveScore>=50' in g,
            'signal_capacity':bool(re.search(r'slice\(0,\s*120\)',g)),
            'watch_entry':"c.decision==='WATCH'" in e,
            'fast_rotation':'ageMin>=8' in e,
            'allocation_cap':bool(re.search(r'perPositionCap=Math\.min\(60,\s*p\.maxUtilizationPct\)',e)),
            'marker':'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' in e,
            'security':"securityDecision==='PASS'" in e,
            'holder':"holderClusterDecision==='PASS'" in e,
            'insider':'function insiderSafe(c)' in e and 'insiderSafe(c)' in re.search(r'function coreSafe\(c\)\{(.+?)\}\nfunction ',e,re.S).group(1),
            'sell_route':'sellRoute===true' in e,
            'token2022':'!c.token2022' in e,
            'liq_floor':'50_000' in e,
            'impact_ceiling':'impact(c)<=1.25' in e,
            'raw_chase_guard':'rawChg>22' in e,
          }
          bad=[k for k,v in checks.items() if not v]
          print('V381_PREDEPLOY_CHECKS=',checks)
          if bad: raise SystemExit('V381_PREDEPLOY_FAIL:'+','.join(bad))
          PY

          cp "$APP/run-paper.sh" "$ST/run-paper.pre-final-v381.sh"
          chmod 0755 "$ST/run-paper.pre-final-v381.sh"
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ST="$APP/runtime-status/v381-fast-capital"
          install -m 0664 "$ST/scanner.js" "$APP/src/scanner.js"
          install -m 0664 "$ST/safe-signal-export.js" "$APP/src/safe-signal-export.js"
          install -m 0664 "$ST/micro-live-executor.js" "$APP/src/micro-live-executor.js"
          printf 'SCANNER_SWAP=TRUE\nSIGNAL_SWAP=TRUE\nEXECUTOR_SWAP=TRUE\n' > "$ST/result.txt"
          cp "$ST/run-paper.pre-final-v381.sh" "$APP/run-paper.sh"
          chmod +x "$APP/run-paper.sh"
          for p in $(pgrep -f 'node .*micro-live-executor.js' || true); do kill -9 "$p" 2>/dev/null || true; done
          exec "$APP/run-paper.sh"
          SH
          chmod +x "$APP/run-paper.sh"
          timeout 140s sudo -n /bin/systemctl restart meme-alpha-paper.service || true

          READY=0
          for i in $(seq 1 130); do
            G="$APP/runtime-status/micro-live-gate.json"
            S="$APP/runtime-status/signal-snapshot.json"
            if grep -q 'SCANNER_SWAP=TRUE' "$ST/result.txt" 2>/dev/null \
              && grep -q 'MICRO_LIVE_EXECUTOR_V381_FAST_CAPITAL_ROTATION=STARTED' "$APP/src/micro-live-executor.js" 2>/dev/null \
              && systemctl is-active --quiet meme-alpha-paper.service \
              && systemctl is-active --quiet meme-alpha-micro-live.service \
              && systemctl is-active --quiet meme-alpha-signer.service \
              && grep -q '"allowed": true' "$G" 2>/dev/null \
              && grep -q '"sourceHealthy": true' "$G" 2>/dev/null \
              && grep -q '"riskEntryAllowed": true' "$G" 2>/dev/null; then
              MT=$(stat -c %Y "$S" 2>/dev/null || echo 0)
              if [ "$MT" -ge "$START_EPOCH" ]; then READY=1; break; fi
            fi
            sleep 2
          done
          [ "$READY" = 1 ]

          echo '=== V381 HANDOFF ==='; cat "$ST/result.txt"
          echo '=== SERVICES ==='; systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service
          echo '=== GATE ==='; cat "$APP/runtime-status/micro-live-gate.json"
          echo '=== PIPELINE ==='
          python3 - <<'PY'
          import json,os,time
          for p in ['/opt/meme-alpha/app/runtime-status/new-listing-radar.json','/opt/meme-alpha/app/runtime-status/signal-snapshot.json']:
            d=json.load(open(p));r=d.get('candidates') or []
            print(p,{'timestamp':d.get('timestamp') or d.get('updatedAt'),'status':d.get('status'),'candidates':len(r),'probe':sum(x.get('decision')=='PROBE_CANDIDATE' for x in r),'watch':sum(x.get('decision')=='WATCH' for x in r),'routed':sum(bool(x.get('strategyRouter',{}).get('selectedLane')) for x in r),'ageSec':round(time.time()-os.path.getmtime(p),1)})
          PY
          echo '=== EXECUTOR ==='; pgrep -af 'micro-live-executor.js' || true
          echo '=== RECENT EVENTS ==='; tail -n 20 /var/lib/meme-alpha/data/micro-live/events.jsonl 2>/dev/null || true
          printf '{"version":"3.81.0","status":"DEPLOYED","profile":"FAST_CAPITAL_ROTATION","timestamp":"%s"}\n' "$(date -u +%FT%TZ)" > "$APP/runtime-status/v381-deployed.json"
          echo 'V381_ACTIVE=TRUE'
