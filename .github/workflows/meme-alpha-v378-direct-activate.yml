name: Meme Alpha V379 Candidate Turnover Diagnose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Inspect candidate turnover
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service 2>/dev/null || true
          for round in 1 2; do
            echo "=== ROUND $round ==="
            date -u +%FT%TZ
            for f in "$APP/runtime-status/new-listing-radar.json" "$APP/runtime-status/realtime-pool-pulse.json" "$APP/runtime-status/trend-pulse.json" "$APP/runtime-status/whale-flow-intel.json" "$APP/runtime-status/signal-snapshot.json" "$APP/runtime-status/universe.json" "$APP/runtime-status/micro-live-gate.json"; do
              echo "### $f"
              if [ -f "$f" ]; then head -c 32000 "$f"; echo; fi
            done
            [ "$round" -eq 1 ] && sleep 18
          done
