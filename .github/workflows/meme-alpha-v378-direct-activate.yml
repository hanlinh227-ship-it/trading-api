name: Meme Alpha V380 Post Cycle Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-direct-activate.yml'

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify after scanner cycle
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          echo '--- SERVICES ---'
          systemctl is-active meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service 2>/dev/null || true
          echo '--- RADAR ---'
          grep -E 'const (MAX_CURRENT|FAST_DISCOVERY_RESERVE|MAX_OUTPUT)=' "$APP/src/new-listing-radar.js" 2>/dev/null || true
          python3 - <<'PY'
          import json,os,time
          for p in ['/opt/meme-alpha/app/runtime-status/new-listing-radar.json','/opt/meme-alpha/app/runtime-status/signal-snapshot.json','/opt/meme-alpha/app/runtime-status/micro-live-gate.json']:
            print('###',p)
            try:
              d=json.load(open(p));print(json.dumps(d if 'gate' in p else {'timestamp':d.get('timestamp') or d.get('updatedAt'),'status':d.get('status'),'candidates':len(d.get('candidates') or [])},ensure_ascii=False))
            except Exception as e: print('ERR',e)
          PY
          echo '--- PROCESS ---'
          ps -eo pid,etimes,cmd | grep -E 'scanner.js|run-paper.sh' | grep -v grep || true
