name: V13 Dev Search
on:
  push:
    paths:
      - 'scripts/v13_dev_search.py'
      - '.github/workflows/v13-dev-search.yml'
  workflow_dispatch:
jobs:
  search:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/v13_dev_search.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v13_dev_search.json
          git commit -m "Run V13 development search" || exit 0
          git pull --rebase origin main
          git push
