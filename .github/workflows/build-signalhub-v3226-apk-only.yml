name: Build SignalHub V3.22.6 APK Only

on:
  push:
    branches: [signalhub-v3226-balanced-realtime-book]
    paths:
      - '.github/workflows/build-signalhub-v3226-apk-only.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Apply V3.22.6 source chain
        run: |
          set -euo pipefail
          python3 scripts/patch_signalhub_v3225_realtime_unique_book.py
          python3 scripts/patch_signalhub_v3225_build_compat.py
          python3 scripts/patch_signalhub_v3226_balanced_realtime_book.py
          grep -q 'APP_VERSION="3.22.6"' signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java
          grep -q "versionName '3.22.6'" signalhub-android/app/build.gradle
      - name: Build APK
        run: |
          set -euo pipefail
          cd signalhub-android
          gradle :app:assembleDebug --stacktrace --no-daemon
          cd ..
          unzip -t signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v3.22.6-Balanced-Realtime-Book.apk
          sha256sum dist/SignalHub-v3.22.6-Balanced-Realtime-Book.apk > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-v3.22.6-Balanced-Realtime-Book-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
