name: Deploy SignalHub V3.2 Rebuild Worker

on:
  push:
    branches: [signalhub-v3-rebuild-20260909]
    paths:
      - 'signalhub-worker/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate Worker source
        working-directory: signalhub-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/signalhub-dryrun
      - name: Deploy Worker
        working-directory: signalhub-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Smoke V3.2 contract
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/status.json -w '%{http_code}' "$SIGNALHUB_URL/v3/status" || true)
            if [ "$code" = 200 ]; then
              python3 - <<'PY' && ready=1 && break || true
          import json
          p=json.load(open('/tmp/status.json'))
          assert p.get('ok') is True
          assert p.get('checkpoint')=='SIGNALHUB_V3_CHECKPOINT_05'
          PY
            fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 30 "$SIGNALHUB_URL/v3/app-version" >/tmp/app.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/app.json'))
          assert p.get('app',{}).get('versionName')=='3.2.0',p
          PY
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              curl -fsS --max-time 35 "$SIGNALHUB_URL/v3/signals?market=$m&style=$s&status=active&limit=50" >/tmp/s.json
              python3 - <<'PY'
          import json
          p=json.load(open('/tmp/s.json'))
          assert p.get('ok') is True and isinstance(p.get('signals'),list),p
          for x in p.get('signals',[]):
            assert x.get('market')==p.get('market'),(p.get('market'),x)
            assert x.get('style')==p.get('style'),(p.get('style'),x)
            assert 'signalId' in x and 'lifecycle' in x,x
            if x.get('entry') and x.get('sl') and x.get('tp'):
              assert x.get('tp1') is not None and x.get('tp2') is not None and x.get('tp3') is not None,x
          PY
            done
          done
