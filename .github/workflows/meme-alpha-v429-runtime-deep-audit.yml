name: Meme Alpha V429 Runtime Deep Audit
on:
  push:
    paths:
      - '.github/workflows/meme-alpha-v429-runtime-deep-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    steps:
      - name: Deep audit runtime paths and service mapping
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          E="$APP/src/micro-live-executor.js"
          RT="$APP/runtime-status"
          DATA=/var/lib/meme-alpha/data/micro-live
          echo '=== TOP SOURCE ==='
          sed -n '1,45p' "$E"
          echo '=== OUTPUT PATHS ==='
          grep -nE "atomic\(|statePath|runtime-status|capital-observability|allocator-status|micro-live-gate|portfolio-observability|realtime-pool-pulse" "$E" | head -220 || true
          echo '=== SERVICE DEFINITIONS ==='
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do
            echo ---$svc---
            systemctl show "$svc" -p MainPID -p ExecStart -p ExecMainStartTimestamp -p ActiveEnterTimestamp -p FragmentPath --no-pager || true
          done
          echo '=== PROCESS ==='
          pgrep -af '/opt/meme-alpha/app/src/micro-live-executor.js' || true
          PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js' | head -1 || true)
          [ -n "$PID" ] && ps -p "$PID" -o pid=,ppid=,user=,lstart=,etime=,args= || true
          echo '=== SOURCE ==='
          stat -c 'mtime=%y epoch=%Y size=%s inode=%i' "$E"
          sha256sum "$E"
          echo '=== STATUS FILES ==='
          for d in "$RT" "$DATA"; do
            echo DIR=$d
            if [ -d "$d" ]; then
              find "$d" -maxdepth 1 -type f \( -name '*observability*.json' -o -name '*gate*.json' -o -name '*allocator*.json' -o -name '*pulse*.json' -o -name 'state.json' \) -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' | sort || true
            fi
          done
          echo '=== SERVICE JOURNAL ==='
          journalctl --since '90 minutes ago' -u meme-alpha-paper.service -u meme-alpha-micro-live.service --no-pager 2>/dev/null | tail -260 || true
          echo V429_RUNTIME_DEEP_AUDIT=PASS
