name: SignalHub Backend Diagnostic

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - '.github/workflows/signalhub-backend-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-public-forex:
    runs-on: ubuntu-latest
    steps:
      - name: Probe current public Forex routes
        shell: bash
        run: |
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          for path in \
            /status \
            /forex/health \
            /forex/status \
            /forex/signals \
            /forex/signal \
            /forex/latest \
            /forex/decision \
            /forex/snapshot \
            '/forex/scan' \
            '/forex/run-now' \
            '/latest-scan?group=forex' \
            '/run-now?group=forex'; do
            body=$(mktemp)
            code=$(curl -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' "$BASE$path" || true)
            echo "ROUTE=$path HTTP=$code"
            if [ -s "$body" ]; then
              python3 - "$body" <<'PY'
          import json,sys
          raw=open(sys.argv[1],encoding='utf-8',errors='replace').read()
          try:
              d=json.loads(raw)
              if isinstance(d,dict):
                  safe={k:d.get(k) for k in ('ok','version','service','status','mode','error','decision','requiredSide','scanEverySec') if k in d}
                  if 'signals' in d: safe['signals_type']=type(d.get('signals')).__name__
                  if 'latest' in d: safe['latest_type']=type(d.get('latest')).__name__
                  print('BODY='+json.dumps(safe,ensure_ascii=False))
              else: print('BODY_TYPE='+type(d).__name__)
          except Exception:
              print('BODY_TEXT='+raw[:180].replace('\n',' '))
          PY
            fi
            rm -f "$body"
          done

  diagnose-secrets:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deployment secret presence only
        id: secrets
        shell: bash
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TD_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          KV_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
        run: |
          present(){ if [ -n "$2" ]; then echo "$1=PRESENT"; else echo "$1=MISSING"; fi; }
          present CLOUDFLARE_API_TOKEN "$CF_TOKEN"
          present CLOUDFLARE_ACCOUNT_ID "$CF_ACCOUNT"
          present TWELVE_DATA_API_KEY "$TD_KEY"
          present TRADING_KV_NAMESPACE_ID "$KV_ID"
