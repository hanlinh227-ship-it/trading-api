name: VPS MT5 Exness Preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-mt5-exness-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Inspect Linux VPS for MT5 Exness
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MT5_EXNESS_VPS_PREFLIGHT ==='
          echo "USER=$(id -un)"
          echo "UID=$(id -u)"
          echo "HOST=$(hostname)"
          echo "ARCH=$(uname -m)"
          echo "KERNEL=$(uname -sr)"
          echo '--- OS ---'
          cat /etc/os-release || true
          echo '--- SUDO ---'
          if sudo -n true 2>/dev/null; then echo 'SUDO_NOPASS=YES'; else echo 'SUDO_NOPASS=NO'; fi
          echo '--- GUI ---'
          echo "DISPLAY=${DISPLAY:-}"
          echo "XDG_SESSION_TYPE=${XDG_SESSION_TYPE:-}"
          command -v Xvfb || true
          command -v x11vnc || true
          command -v xfce4-session || true
          command -v gnome-session || true
          echo '--- WINE ---'
          command -v wine || true
          command -v wine64 || true
          wine --version 2>/dev/null || true
          echo '--- EXISTING MT5 ---'
          find "$HOME" /opt /root -maxdepth 5 \( -iname 'terminal64.exe' -o -iname 'metaeditor64.exe' -o -iname '*metatrader*' \) 2>/dev/null | head -100 || true
          echo '--- PACKAGES ---'
          if command -v dpkg >/dev/null; then dpkg -l | grep -Ei 'wine|xvfb|xfce|vnc' | head -100 || true; fi
          echo '--- DISK ---'
          df -h / /opt "$HOME" 2>/dev/null || true
          echo 'MT5_EXNESS_VPS_PREFLIGHT=PASS'
