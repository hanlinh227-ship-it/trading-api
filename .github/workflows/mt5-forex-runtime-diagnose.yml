name: Diagnose MT5 Forex Runtime
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/mt5-forex-runtime-diagnose.yml']
permissions:
  contents: read
concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true
jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Capture runtime state
        shell: bash
        run: |
          set -u
          echo '===== SERVICES ====='
          sudo systemctl status mt5-forex.service mt5-forex-bridge.service --no-pager -l || true
          echo '===== JOURNAL ====='
          sudo journalctl -u mt5-forex.service -u mt5-forex-bridge.service -n 260 --no-pager || true
          echo '===== PROCESSES ====='
          ps -eo user,pid,ppid,stat,cmd | grep -E 'terminal64|metaeditor|wine(server)?|Xvfb' | grep -v grep || true
          echo '===== MT5 LOGS ====='
          find /var/lib/trading/mt5-forex/wine/drive_c -type f -path '*/logs/*.log' -mmin -30 -print -exec tail -n 120 {} \; 2>/dev/null || true
          echo '===== CONFIG CONTRACT ====='
          source /var/lib/trading/mt5-forex/runtime.env 2>/dev/null || true
          printf 'TERMINAL_EXISTS=%s\n' "$([ -f "${MT5_TERMINAL:-}" ] && echo YES || echo NO)"
          printf 'INSTALL_DIR_EXISTS=%s\n' "$([ -d "${MT5_INSTALL_DIR:-}" ] && echo YES || echo NO)"
          printf 'EX5_EXISTS=%s\n' "$([ -f "${MT5_INSTALL_DIR:-/nonexistent}/MQL5/Experts/ForexAutoThe5ers.ex5" ] && echo YES || echo NO)"
          echo 'DIAG_DONE=PASS'
