name: Offline Forex Daily Each Symbol V21 MgmtML
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v21_mgmtml.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v21-mgmtml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run per-pair entry and management ML
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v21_mgmtml.py
