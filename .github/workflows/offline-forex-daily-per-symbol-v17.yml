name: Offline Forex Daily Per Symbol V17
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_per_symbol_v17.py'
      - '.github/workflows/offline-forex-daily-per-symbol-v17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run forced-daily 28-pair research
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_per_symbol_v17.py
