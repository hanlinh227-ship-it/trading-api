name: STACKHUB V2 TaskBounty Diagnostic

on:
  push:
    branches: ['stackhub-v2-autonomous-bounty']
    paths:
      - '.github/workflows/stackhub-v2-taskbounty-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_ENABLED: ${{ secrets.STACKHUB_DEPLOY_ENABLED }}
      VPS_HOST: ${{ secrets.STACKHUB_VPS_HOST }}
      VPS_USER: ${{ secrets.STACKHUB_VPS_USER }}
      VPS_PORT: ${{ secrets.STACKHUB_VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.STACKHUB_VPS_SSH_KEY }}
      VPS_SSH_KEY_B64: ${{ secrets.STACKHUB_VPS_SSH_KEY_B64 }}
    steps:
      - name: Prepare SSH
        if: env.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_stackhub
          else
            python - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['VPS_SSH_KEY'].replace('\r','').strip()
          if '\\n' in key and '\n' not in key: key=key.replace('\\n','\n')
          Path.home().joinpath('.ssh/id_stackhub').write_text(key+'\n',encoding='utf-8')
          PY
          fi
          chmod 600 ~/.ssh/id_stackhub
          ssh-keygen -y -f ~/.ssh/id_stackhub >/dev/null
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect TaskBounty task schema
        if: env.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_stackhub "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set -a; . /etc/stackhub/stackhub.env; set +a
          /opt/stackhub/.venv/bin/python - <<'PY'
          import json, os, httpx
          key=os.environ.get('TASKBOUNTY_API_KEY','').strip()
          headers={'Accept':'application/json'}
          if key: headers['Authorization']=f'Bearer {key}'
          with httpx.Client(timeout=20,follow_redirects=True) as c:
              r=c.get('https://www.task-bounty.com/api/v1/tasks',headers=headers,params={'state':'open','limit':100})
          print('status='+str(r.status_code))
          print('content_type='+r.headers.get('content-type',''))
          try:
              data=r.json()
          except Exception:
              print('non_json_body_prefix='+r.text[:300].replace('\n',' '))
              raise SystemExit(0)
          if isinstance(data,dict):
              print('top_level_keys='+json.dumps(sorted(data.keys())))
              rows=data.get('tasks')
          elif isinstance(data,list):
              print('top_level_type=list')
              rows=data
          else:
              print('top_level_type='+type(data).__name__)
              raise SystemExit(0)
          if not isinstance(rows,list):
              print('tasks_type='+type(rows).__name__)
              safe={k:v for k,v in data.items() if k.lower() not in {'token','secret','api_key','apikey','private_key','privatekey'} and not isinstance(v,(dict,list))}
              print('safe_scalars='+json.dumps(safe,sort_keys=True,default=str))
              raise SystemExit(0)
          print('task_count='+str(len(rows)))
          allowed={'id','task_id','slug','title','bounty_cents','bounty_amount','github_repo_url','github_issue_url','created_at','complexity_tag','language','state','status','platform','category','deadline','submission_deadline'}
          for row in rows[:100]:
              if not isinstance(row,dict):
                  print('task_type='+type(row).__name__)
                  continue
              print('task_keys='+json.dumps(sorted(row.keys())))
              safe={k:row.get(k) for k in allowed if k in row}
              print('task='+json.dumps(safe,sort_keys=True,default=str))
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_stackhub
