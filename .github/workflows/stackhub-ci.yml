name: STACKHUB CI

on:
  push:
    branches:
      - stackhub-mvp
    paths:
      - 'stackhub/**'
      - '.github/workflows/stackhub-ci.yml'
  pull_request:
    paths:
      - 'stackhub/**'
      - '.github/workflows/stackhub-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unit tests
        run: python -m unittest discover -s stackhub/tests -v
