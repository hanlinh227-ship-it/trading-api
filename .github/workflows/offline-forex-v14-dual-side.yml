name: Offline Forex V14 Dual Side
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v14_dual_side.py'
      - '.github/workflows/offline-forex-v14-dual-side.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Forex V14 zero-credit BUY SELL branches
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v14_dual_side.py
