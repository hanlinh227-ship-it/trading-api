name: Blind Crypto Backtest V20
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v20.py'
      - '.github/workflows/blind-backtest-v20.yml'
  workflow_dispatch:
jobs:
  v20:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v20.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v20.json
          git commit -m "Run V20 walk-forward blind" || exit 0
          git pull --rebase origin main || true
          git push || true
