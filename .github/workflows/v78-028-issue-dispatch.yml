name: V78-028 One-Shot Dispatcher

on:
  issues:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.issue.title == 'RUN-V78-028-030'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v78-028-signal-index.yml --repo "${{ github.repository }}" --ref main
