name: AI Brain V4 Candidate Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'cloudflare-worker/**'
      - '.github/workflows/ai-brain-v4-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-and-promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.ref == 'brain/plain-language-output'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Generate release 4.5.0 with canonical tools
        shell: bash
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/release.py build --version 4.5.0 --source plain_language_output --class feature --validated --root .
          python AI_SKILL_LIBRARY/v4/tools/evergreen.py mark-known-good --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
      - name: Restore canonical release workflow for protected tests
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:.github/workflows/ai-brain-v4-release.yml > .github/workflows/ai-brain-v4-release.yml
          grep -q 'validate_v4.py' .github/workflows/ai-brain-v4-release.yml
          grep -qi 'promotion' .github/workflows/ai-brain-v4-release.yml
          grep -q 'Class D' .github/workflows/ai-brain-v4-release.yml
      - name: Run complete Brain canary before persisting metadata
        shell: bash
        run: |
          set -euo pipefail
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$HEAD_SHA"
          cd cloudflare-worker
          npm install --no-audit --no-fund
          export GITHUB_SHA="$HEAD_SHA"
          npm run prepare:skill-gateway
          npm run test:skill-gateway
          node benchmark-skill-gateway.mjs
      - name: Persist generated release metadata only after green canary
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/releases AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          if git diff --cached --quiet; then
            echo "No generated release changes required"
            exit 0
          fi
          git commit -m "release(brain): generate V4 4.5.0"
          git push origin "HEAD:${HEAD_REF}"
