name: Migrate V77.18.15 Multi Account Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771815-multi-account-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire multi-account hub and cron
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/index.js')
          s=p.read_text()
          imp='import {runHyroDemoExecutionTest,runHyroDemoFullCycleTest,getHyroDemoTestState} from "./hyro-demo-test.js";'
          add=imp+'\nimport {handleHyroMultiTelegram,runHyroMultiCron,hyroMultiStatus} from "./hyro-multi-ui.js";'
          if './hyro-multi-ui.js' not in s:
              if imp not in s: raise SystemExit('import marker missing')
              s=s.replace(imp,add,1)
          s=s.replace('const VERSION="V77.18.14",SERVICE="Trading V77.18.14 Per-Symbol Portfolio Runtime";','const VERSION="V77.18.15",SERVICE="Trading V77.18.15 Dual Hyro Account Runtime";',1)
          old='if(path==="/telegram/webhook"&&req.method==="POST"){const handled=await handlePropTelegram(req,env);if(handled)return handled;}'
          new='if(path==="/telegram/webhook"&&req.method==="POST"){const multi=await handleHyroMultiTelegram(req,env);if(multi)return multi;const handled=await handlePropTelegram(req,env);if(handled)return handled;}'
          if old in s:s=s.replace(old,new,1)
          elif new not in s:raise SystemExit('webhook marker missing')
          old_sched='async scheduled(event,env,ctx){ctx.waitUntil((async()=>{const pe=await propEnv(env);await getHyroTelemetry(pe).catch(()=>null);const cycle=await runHyroAutoCycle(pe);await notifyPropEntry(pe,cycle).catch(()=>{});await notifyPropClosures(pe).catch(()=>{});})().catch(()=>{}));return signalHub.scheduled?.(event,env,ctx);}'
          new_sched='async scheduled(event,env,ctx){ctx.waitUntil(runHyroMultiCron(env).catch(()=>{}));return signalHub.scheduled?.(event,env,ctx);}'
          if old_sched in s:s=s.replace(old_sched,new_sched,1)
          elif new_sched not in s:raise SystemExit('scheduled marker missing')
          old_status='if(path==="/status")return patchedStatus(req,env);'
          new_status='if(path==="/prop/hyro/accounts")return json({ok:true,version:VERSION,...await hyroMultiStatus(env)});if(path==="/status"){const r=await patchedStatus(req,env);let x;try{x=await r.clone().json();}catch{return r;}return json({...x,version:VERSION,service:SERVICE,hyroMulti:await hyroMultiStatus(env)},r.status);}'
          if old_status in s:s=s.replace(old_status,new_status,1)
          elif new_status not in s:raise SystemExit('status marker missing')
          if 'V77.18.15' not in s or 'runHyroMultiCron' not in s or 'handleHyroMultiTelegram' not in s:raise SystemExit('V77.18.15 markers missing')
          p.write_text(s)
          PY
      - name: Syntax gate
        run: |
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/hyro-multi-account.js
          node --check cloudflare-worker/hyro-multi-ui.js
          node --check cloudflare-worker/hyro-runtime.js
      - name: Commit migration
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.15 wire dual Hyro account hub and cron"
          git push
# trigger: v771815
