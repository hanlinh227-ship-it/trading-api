name: Apply V77.7 batch and news gate

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v777_batch_news.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: node scripts/apply_v777_batch_news.js
      - name: Syntax check
        run: node --check cloudflare-worker/index.js
      - name: Verify migration tokens
        run: |
          grep -q 'tdBatchCandles' cloudflare-worker/index.js
          grep -q 'NEWS_CONTEXT_REQUIRED' cloudflare-worker/index.js
          grep -q 'newsClearanceTtlSec: 1800' cloudflare-worker/index.js
      - name: Commit canonical Worker
        run: |
          if git diff --quiet -- cloudflare-worker/index.js; then
            echo 'No migration changes required.'
            exit 0
          fi
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add cloudflare-worker/index.js
          git commit -m 'Optimize V77.7 Twelve Data batch and strict news gate'
          git push origin main
