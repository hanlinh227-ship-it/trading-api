name: Compact Current Run Status
on:
  push:
    paths:
      - 'scripts/compact_status_from_run.sh'
      - '.github/workflows/compact-current-run-status.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        run_id: [32025195558,32024676960,32025078599,32025444113]
    steps:
      - uses: actions/checkout@v4
      - name: Compact final statuses
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ matrix.run_id }}
        run: bash scripts/compact_status_from_run.sh
