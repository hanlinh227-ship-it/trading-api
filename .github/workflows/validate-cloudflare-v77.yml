name: Validate Cloudflare V77 Canonical

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all Worker modules
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
      - name: Verify canonical locks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const read=p=>fs.readFileSync(p,'utf8');
          const index=read('cloudflare-worker/index.js');
          const engine=read('cloudflare-worker/engine-v77168.js');
          const scanner=read('cloudflare-worker/hyro-scanner.js');
          const runtime=read('cloudflare-worker/hyro-runtime.js');
          const exec=read('cloudflare-worker/hyro-execution.js');
          const micro=read('cloudflare-worker/hyro-market-context.js');
          const portfolio=read('cloudflare-worker/hyro-portfolio-guard.js');
          const manager=read('cloudflare-worker/hyro-position-manager.js');
          const review=read('cloudflare-worker/hyro-position-review.js');
          const release=read('cloudflare-worker/release-notifier.js');
          const health=read('cloudflare-worker/system-health.js');
          const wrangler=read('cloudflare-worker/prepare-wrangler.mjs');
          const v73=JSON.parse(read('data/nocut_intraday_allpass_v73.json'));
          for(const x of ['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED','V77.16.9','v771816:signal:auto_notify:','autoScanSignalGroup'])if(!engine.includes(x))throw new Error('Signal lock missing: '+x);
          for(const x of ['V77.18.19','Single PROP Recovery','propEnv(env)','prop:review','runSystemHealthAudit','announceReleaseOnce','/release'])if(!index.includes(x))throw new Error('Single PROP index lock missing: '+x);
          if(index.includes('hyro-multi-ui.js')||index.includes('runHyroMultiCron')||index.includes('handleHyroMultiTelegram'))throw new Error('Multi-account runtime must be removed');
          for(const x of ['PER_SYMBOL_STRATEGY_REGISTRY','NEAR_MARKET_PLAN','fundingRate'])if(!scanner.includes(x))throw new Error('Scanner lock missing: '+x);
          for(const x of ['enrichHyroPlans','evaluateHyroPortfolio','recordHyroEntry','microScore(x)>=.54'])if(!runtime.includes(x))throw new Error('Runtime lock missing: '+x);
          for(const x of ['/v5/market/open-interest','/v5/market/account-ratio','/v5/market/orderbook'])if(!micro.includes(x))throw new Error('Micro context missing: '+x);
          for(const x of ['MAX_SLOTS=3','MAX_SAME_DIRECTION=2','CLUSTER_DUPLICATION','ENTRY_SPACING_MS=180000'])if(!portfolio.includes(x))throw new Error('Portfolio guard missing: '+x);
          for(const x of ['v771818:hyro:review:','INTERVAL_MS=5*60*1000','minimumCutHoldMinutes:8','reduceOnly:true','HYRO_POSITION_REEVAL_AUTO_CUT','strategy:prof.family'])if(!review.includes(x))throw new Error('Position review lock missing: '+x);
          for(const x of ['v771818:release:last_announced','🆕 CẬP NHẬT BOT','Phiên bản:','Tên:'])if(!release.includes(x))throw new Error('Release notifier lock missing: '+x);
          if(!exec.includes('hyroDynamicRiskView')||!exec.includes('activeSymbols.size>=3'))throw new Error('Dynamic risk / 3-slot lock missing');
          if(!exec.includes('Math.max(0,...[num(a.totalEquity)'))throw new Error('Robust positive equity fallback missing');
          if(!manager.includes('v771811:hyro:manage:'))throw new Error('Position manager state lock missing');
          for(const x of ['v771817:health:last','v775:books','v7712:scan:','getHyroTelemetry','TELEGRAM_API_FAIL','shouldRunFullHealth'])if(!health.includes(x))throw new Error('Single-account Health Guardian lock missing: '+x);
          if(health.includes('TK2')||health.includes('HYRO_B_BYBIT_API_KEY')||health.includes('hyroHubSnapshot'))throw new Error('TK2 health remnants present');
          if(!wrangler.includes('keep_vars: true')||!wrangler.includes("binding: 'TRADING_STATE'"))throw new Error('KV/vars deployment lock missing');
          if(v73.version!=='NO_CUT_INTRADAY_ALLPASS_V73'||v73.forex?.universeCount!==28||v73.crypto?.universeCount!==61)throw new Error('V73 changed');
          console.log('Canonical V77.18.19 single PROP recovery validation PASS');
          NODE
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate build-time Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
