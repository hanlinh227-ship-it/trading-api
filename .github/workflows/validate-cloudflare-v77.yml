name: Validate Cloudflare V77 Canonical

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Worker preflight
        working-directory: cloudflare-worker
        run: node validate-worker.mjs
      - name: Verify canonical locks
        run: |
          node - <<'NODE'
          const fs=require('fs'); const read=p=>fs.readFileSync(p,'utf8');
          const index=read('cloudflare-worker/index.js');
          const hub=read('cloudflare-worker/hub-v77171.js');
          const engine=read('cloudflare-worker/engine-v77168.js');
          const dual=read('cloudflare-worker/dual-ai-intervention.js');
          const claude=read('cloudflare-worker/claude-reviewer.js');
          const exec=read('cloudflare-worker/hyro-execution.js');
          const scanner=read('cloudflare-worker/hyro-scanner.js');
          const runtime=read('cloudflare-worker/hyro-runtime.js');
          const manager=read('cloudflare-worker/hyro-position-manager.js');
          const portfolio=read('cloudflare-worker/hyro-portfolio-guard.js');
          const review=read('cloudflare-worker/hyro-position-review.js');
          const adaptive=read('cloudflare-worker/adaptive-tuning.js');
          const arbiter=read('cloudflare-worker/ai-arbiter.js');
          const release=read('cloudflare-worker/release-notifier.js');
          const wrangler=read('cloudflare-worker/prepare-wrangler.mjs');
          const pkg=JSON.parse(read('cloudflare-worker/package.json'));
          const v73=JSON.parse(read('data/nocut_intraday_allpass_v73.json'));
          const locks=(src,list,label)=>{for(const x of list)if(!src.includes(x))throw new Error(label+' missing: '+x)};
          locks(engine,['V77.16.20','Signal Integrity R7','INDEX_CASH','NAS100','US30','US500','DEX','JP225','MASSIVE_INDEX_PROVIDER','I:NDX','I:DJI','I:SPX','I:DAX','I:N225','Twelve Data Native Index','fresh:age!==null&&age<=900','MARKET_SIGNAL','v775:books','signalActive','SIGNAL_ONLY','toSignalPos','sig.planned?.tp1','sig.planned?.tp2','lifecycleSignalGroups','SIGNAL_EXPIRED','SIGNAL_TP','SIGNAL_SL','q?.fresh===false','liveStale','persistedSignals','run?.newItems','let sent=false','massive:!!env.MASSIVE_API_KEY','a?.status==="MARKET_SIGNAL")x+=800','getBooksLive(env,group)','SIGNAL TP • THEORETICAL','SIGNAL SL • THEORETICAL','callback_data:"live:"+group','callback_data:"signal:scan:"+group','callback_data:"symbol:"+group+":"+symbol'],'Signal');
          locks(index,['V77.18.42','Signal Integrity + Claude Audit','HYRO • VỊ THẾ LIVE','ensureDualAiIntervention','dailyObjective:{challengePct:2,fundedStretchPct:5}'],'Index');
          locks(hub,['V77.18.42','HUB-R10-SIGNAL-INTEGRITY','marketKeyboard','symbolPageKeyboard','symbolResultText','market:forex','market:crypto','market:metal','market:index','/books?group=','signalActive','MARKET SIGNAL','SIGNAL-ONLY','Quote stale','⚪ UNKNOWN'],'Hub');
          locks(dual,['SIGNAL_LIVE_INTEGRITY_R1','lifecycleSignalGroups','toSignalPos','signalActive','MARKET_SIGNAL','max_tokens:1400','fresh explicit analysis quote','MARKET-ISOLATED HUB'],'Dual AI');
          locks(claude,['focusText','signalActive','toSignalPos','lifecycleSignalGroups','notifySignalPlans','SIGNAL LIVE INTEGRITY','Index Cash','A notified MARKET_SIGNAL must remain in matching Live'],'Claude Reviewer');
          locks(exec,['RISK_V771822_ACTIVATES_AT','singlePct:.0055','aPct:.0045','combinedPct:.009','hardPct:.016'],'Risk');
          locks(scanner,['tp1Pct:.45','runnerPct:.20','fundingRate'],'Scanner');
          locks(runtime,['ensureDualAiIntervention','MAX_ACTIVE_SLOTS_REACHED'],'Runtime');
          locks(manager,['TP_POLICY_V771822_AT','1.60','2.45'],'TP');
          locks(portfolio,['MAX_SLOTS=3','MAX_SAME_DIRECTION=2','ENTRY_SPACING_MS=180000'],'Portfolio');
          locks(review,['minimumCutHoldMinutes:8','reduceOnly:true'],'Review');
          locks(adaptive,['V77.18.38','marketEntryBalanced:true','hardNews:true','freshness:true','executionAuthority:true','structuralSL:true','tradeAuthority:false','deployAuthority:false'],'Adaptive');
          locks(arbiter,['CO_ENGINEER_ARBITRATED_FULL_ENGINEERING','directTrade:false','directDeploy:false','secrets:false'],'Arbiter');
          if(/FUTURE_SYMBOLS|FUTURE_SCAN|Massive Futures|signal:scan:future|symmarket:future|futureMinRR|runFutureGroup|runFutureSymbol|futureSizing/.test(engine+hub+index))throw new Error('Legacy Futures conflict remains');
          if(/callback_data:"live"|callback_data:"books"|callback_data:"signal:top"|callback_data:"symbols"/.test(hub))throw new Error('Global market action remains');
          if(/liveMarketKeyboard|symbolMarketKeyboard/.test(hub))throw new Error('Legacy shared market selector remains');
          if(!release.includes('BOT ĐÃ CẬP NHẬT'))throw new Error('Release visibility missing');
          if(!/keep_vars\s*:\s*true/.test(wrangler)||!wrangler.includes('TRADING_STATE')||!wrangler.includes('TRADING_V77_STATE'))throw new Error('KV deployment lock missing');
          if(pkg.devDependencies?.wrangler!=='4.124.0')throw new Error('Wrangler must be pinned');
          if(v73.version!=='NO_CUT_INTRADAY_ALLPASS_V73'||v73.forex?.universeCount!==28||v73.crypto?.universeCount!==61)throw new Error('V73 changed');
          console.log('V77.18.42 Signal Integrity R7 + Claude visibility validation PASS');
          NODE
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Generate build-time Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run

  deploy-cloudflare:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect Cloudflare deployment capability
        id: cf
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
        run: |
          ready=true
          missing=""
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then ready=false; missing="$missing CLOUDFLARE_API_TOKEN"; fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then ready=false; missing="$missing CLOUDFLARE_ACCOUNT_ID"; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          if [ "$ready" = true ]; then echo "Cloudflare credentials detected. Direct Wrangler deploy enabled."; else echo "::warning title=Cloudflare direct deploy skipped::Missing GitHub secret(s): ${missing# }. Validation remains PASS; configure these secrets once to enable automatic Wrangler deploy."; fi
          if [ -z "$TRADING_KV_NAMESPACE_ID" ]; then echo "TRADING_KV_NAMESPACE_ID not set; prepare-wrangler will attempt safe discovery of existing TRADING_V77_STATE when Cloudflare credentials are available."; fi
      - name: Install pinned Wrangler
        if: steps.cf.outputs.ready == 'true'
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Prepare production Wrangler config
        if: steps.cf.outputs.ready == 'true'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
        run: node prepare-wrangler.mjs
      - name: Deploy Worker to Cloudflare
        if: steps.cf.outputs.ready == 'true'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
      - name: Confirm Cloudflare deployment
        if: steps.cf.outputs.ready == 'true'
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deployments list | head -n 30
      - name: Deployment summary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.cf.outputs.ready }}" = "true" ]; then
            echo "### Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "Wrangler deploy path was enabled and executed after validation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Cloudflare deployment" >> "$GITHUB_STEP_SUMMARY"
            echo "Direct Wrangler deploy was skipped because GitHub secrets are not configured." >> "$GITHUB_STEP_SUMMARY"
            echo "Missing: ${{ steps.cf.outputs.missing }}" >> "$GITHUB_STEP_SUMMARY"
            echo "Validation/build remains healthy. Add the missing repository/environment secrets once to enable direct deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
