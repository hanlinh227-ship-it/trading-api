name: Validate Cloudflare V77 Canonical

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all Worker modules
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
      - name: Verify canonical locks
        run: |
          node - <<'NODE'
          const fs=require('fs'); const read=p=>fs.readFileSync(p,'utf8');
          const index=read('cloudflare-worker/index.js');
          const hub=read('cloudflare-worker/hub-v77171.js');
          const engine=read('cloudflare-worker/engine-v77168.js');
          const runtime=read('cloudflare-worker/hyro-runtime.js');
          const exec=read('cloudflare-worker/hyro-execution.js');
          const micro=read('cloudflare-worker/hyro-market-context.js');
          const portfolio=read('cloudflare-worker/hyro-portfolio-guard.js');
          const manager=read('cloudflare-worker/hyro-position-manager.js');
          const review=read('cloudflare-worker/hyro-position-review.js');
          const health=read('cloudflare-worker/system-health.js');
          const adaptive=read('cloudflare-worker/adaptive-tuning.js');
          const dual=read('cloudflare-worker/dual-ai-intervention.js');
          const wrangler=read('cloudflare-worker/prepare-wrangler.mjs');
          const v73=JSON.parse(read('data/nocut_intraday_allpass_v73.json'));
          for(const x of ['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED','V77.16.10','v771816:signal:auto_notify:','autoScanSignalGroup'])if(!engine.includes(x))throw new Error('Signal lock missing: '+x);
          for(const x of ['V77.18.22','propEnv(env)','prop:review','runSystemHealthAudit','announceReleaseOnce','runClaudeAutoReview'])if(!index.includes(x))throw new Error('Index lock missing: '+x);
          if(index.includes('hyroMultiStatus')||index.includes('runHyroMultiCron')||index.includes('handleHyroMultiTelegram'))throw new Error('Multi-account runtime present');
          for(const x of ['ensureDualAiIntervention','loadAdaptiveTuning','adaptive?.hyro?.maxDeep','adaptive?.hyro?.minTurnover','bMicroMin','MAX_ACTIVE_SLOTS_REACHED'])if(!runtime.includes(x))throw new Error('Dual-AI runtime lock missing: '+x);
          for(const x of ['v771823:adaptive:tuning','locationTrendFit','bMicroMin','hardNews:true','freshness:true','executionAuthority:true','structuralSL:true','hyroRiskUntouched:true','tradeAuthority:false'])if(!adaptive.includes(x))throw new Error('Adaptive guardrail missing: '+x);
          for(const x of ['claude-sonnet-5','ONE_TIME','applyAdaptiveTuning','SOFT_TUNING_ONLY','trade:false','close:false','deploy:false','hardRiskImmutable:true','max_tokens:1800'])if(!dual.includes(x))throw new Error('Dual AI lock missing: '+x);
          for(const x of ['RISK_V771822_ACTIVATES_AT','V771822_SAFE_DAILY','singlePct:.0055','aPct:.0045','combinedPct:.009','hardPct:.016','targetPct:.012'])if(!exec.includes(x))throw new Error('Risk lock missing: '+x);
          for(const x of ['TP_POLICY_V771822_AT','1.60','2.45'])if(!manager.includes(x))throw new Error('TP lock missing: '+x);
          for(const x of ['/v5/market/open-interest','/v5/market/account-ratio','/v5/market/orderbook'])if(!micro.includes(x))throw new Error('Micro lock missing: '+x);
          for(const x of ['MAX_SLOTS=3','MAX_SAME_DIRECTION=2','CLUSTER_DUPLICATION','ENTRY_SPACING_MS=180000'])if(!portfolio.includes(x))throw new Error('Portfolio lock missing: '+x);
          for(const x of ['minimumCutHoldMinutes:8','reduceOnly:true','HYRO_POSITION_REEVAL_AUTO_CUT'])if(!review.includes(x))throw new Error('Position review lock missing: '+x);
          for(const x of ['ANTHROPIC_API_KEY','CLAUDE_CONFIGURED'])if(!health.includes(x))throw new Error('Health Claude lock missing: '+x);
          if(!hub.includes('🧠 AI Review')||!hub.includes('V77.18.22'))throw new Error('Hub lock missing');
          if(!wrangler.includes('keep_vars: true')||!wrangler.includes("binding: 'TRADING_STATE'"))throw new Error('KV deployment lock missing');
          if(v73.version!=='NO_CUT_INTRADAY_ALLPASS_V73'||v73.forex?.universeCount!==28||v73.crypto?.universeCount!==61)throw new Error('V73 changed');
          console.log('Canonical V77.18.22 + bounded dual-AI intervention validation PASS');
          NODE
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate build-time Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
