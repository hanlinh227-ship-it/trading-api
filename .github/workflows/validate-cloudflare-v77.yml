name: Validate Cloudflare V77 Canonical

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Worker preflight
        working-directory: cloudflare-worker
        run: node validate-worker.mjs
      - name: Verify canonical locks
        run: |
          node - <<'NODE'
          const fs=require('fs'); const read=p=>fs.readFileSync(p,'utf8');
          const index=read('cloudflare-worker/index.js');
          const hub=read('cloudflare-worker/hub-v77171.js');
          const hubUx=read('cloudflare-worker/hub-ux-tuning.js');
          const engine=read('cloudflare-worker/engine-v77168.js');
          const scanner=read('cloudflare-worker/hyro-scanner.js');
          const runtime=read('cloudflare-worker/hyro-runtime.js');
          const exec=read('cloudflare-worker/hyro-execution.js');
          const micro=read('cloudflare-worker/hyro-market-context.js');
          const portfolio=read('cloudflare-worker/hyro-portfolio-guard.js');
          const manager=read('cloudflare-worker/hyro-position-manager.js');
          const review=read('cloudflare-worker/hyro-position-review.js');
          const health=read('cloudflare-worker/system-health.js');
          const adaptive=read('cloudflare-worker/adaptive-tuning.js');
          const dual=read('cloudflare-worker/dual-ai-intervention.js');
          const arbiter=read('cloudflare-worker/ai-arbiter.js');
          const claudeTg=read('cloudflare-worker/claude-telegram.js');
          const release=read('cloudflare-worker/release-notifier.js');
          const wrangler=read('cloudflare-worker/prepare-wrangler.mjs');
          const pkg=JSON.parse(read('cloudflare-worker/package.json'));
          const v73=JSON.parse(read('data/nocut_intraday_allpass_v73.json'));
          for(const x of ['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED','V77.16.10','v771816:signal:auto_notify:','autoScanSignalGroup'])if(!engine.includes(x))throw new Error('Signal lock missing: '+x);
          for(const x of ['V77.18.25','Hyro Method + Hub UX','propEnv(env)','prop:review','runSystemHealthAudit','announceReleaseOnce','ensureDualAiIntervention','/dual-ai/status','/ai/status','AI_ADMIN_REQUIRED','dailyObjective:{challengePct:2,fundedStretchPct:5}'])if(!index.includes(x))throw new Error('Index lock missing: '+x);
          if(index.includes('hyroMultiStatus')||index.includes('runHyroMultiCron')||index.includes('handleHyroMultiTelegram'))throw new Error('Multi-account runtime present');
          for(const x of ['HUB-R3-SIGNAL','signal:top','signal:scan:forex','🔥 TOP SETUPS','loadHubUxTuning','/hub/ux','V771822_SAFE_DAILY'])if(!hub.includes(x))throw new Error('Signal UX R3 lock missing: '+x);
          for(const x of ['v771826:hub:ux','COMPACT','ACTION_FIRST','STATUS_FIRST','MINIMAL','notificationButtons'])if(!hubUx.includes(x))throw new Error('Hub tuning guardrail missing: '+x);
          for(const x of ['NEAR_MARKET_PLAN','bDistMult','bMinRR','fundingRate','tp1Pct:.45','runnerPct:.20','tune={}'])if(!scanner.includes(x))throw new Error('Scanner lock missing: '+x);
          for(const x of ['ensureDualAiIntervention','V77.18.25','loadAdaptiveTuning','adaptive?.hyro?.maxDeep','adaptive?.hyro?.minTurnover','tune:adaptive?.hyro','bMicroMin','MAX_ACTIVE_SLOTS_REACHED'])if(!runtime.includes(x))throw new Error('Adaptive runtime lock missing: '+x);
          for(const x of ['v771824:adaptive:tuning','LEGACY_KEY','locationTrendFit','bMicroMin','hardNews:true','freshness:true','executionAuthority:true','structuralSL:true','hyroRiskUntouched:true','tradeAuthority:false','deployAuthority:false'])if(!adaptive.includes(x))throw new Error('Adaptive guardrail missing: '+x);
          for(const x of ['HUB_UX_R2','hub_tuning','applyHubUxTuning','FULL_ENGINEERING_PLUS_HUB_UX','HUB UX IS THE FIRST PRIORITY','max_tokens:2400'])if(!dual.includes(x))throw new Error('Claude Hub UX lock missing: '+x);
          for(const x of ['CO_ENGINEER_ARBITRATED_FULL_ENGINEERING','sourceAuthority:true','hubAuthority:true','strategyAuthority:true','CLAUDE','directTrade:false','directDeploy:false','secrets:false'])if(!arbiter.includes(x))throw new Error('AI arbiter lock missing: '+x);
          if(!claudeTg.includes('DUAL AI • CO-ENGINEER')||!claudeTg.includes('Arbiter: 1 writer'))throw new Error('Claude Telegram governance missing');
          for(const x of ['RISK_V771822_ACTIVATES_AT','singlePct:.0055','aPct:.0045','combinedPct:.009','hardPct:.016','profile?.phase==="FUNDED"?.05:.02','V771825_PHASE_OBJECTIVE_SAFE_RISK'])if(!exec.includes(x))throw new Error('Risk/objective lock missing: '+x);
          for(const x of ['TP_POLICY_V771822_AT','1.60','2.45'])if(!manager.includes(x))throw new Error('TP lock missing: '+x);
          for(const x of ['/v5/market/open-interest','/v5/market/account-ratio','/v5/market/orderbook'])if(!micro.includes(x))throw new Error('Micro lock missing: '+x);
          for(const x of ['MAX_SLOTS=3','MAX_SAME_DIRECTION=2','CLUSTER_DUPLICATION','ENTRY_SPACING_MS=180000'])if(!portfolio.includes(x))throw new Error('Portfolio lock missing: '+x);
          for(const x of ['minimumCutHoldMinutes:8','reduceOnly:true','HYRO_POSITION_REEVAL_AUTO_CUT'])if(!review.includes(x))throw new Error('Position review lock missing: '+x);
          for(const x of ['ANTHROPIC_API_KEY','CLAUDE_CONFIGURED'])if(!health.includes(x))throw new Error('Health Claude lock missing: '+x);
          if(!release.includes('🏠 Mở Hub mới')||!release.includes('BOT ĐÃ CẬP NHẬT'))throw new Error('Release visibility lock missing');
          if(!/keep_vars\s*:\s*true/.test(wrangler)||!/binding\s*:\s*['"]TRADING_STATE['"]/.test(wrangler)||!wrangler.includes('TRADING_V77_STATE'))throw new Error('KV deployment lock missing');
          if(pkg.devDependencies?.wrangler!=='4.124.0')throw new Error('Wrangler must be pinned');
          if(v73.version!=='NO_CUT_INTRADAY_ALLPASS_V73'||v73.forex?.universeCount!==28||v73.crypto?.universeCount!==61)throw new Error('V73 changed');
          console.log('V77.18.27 Signal UX R3 validation PASS');
          NODE
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate build-time Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
