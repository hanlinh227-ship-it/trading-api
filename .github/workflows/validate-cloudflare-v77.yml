name: Validate Cloudflare V77 Canonical

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'
      - '.github/workflows/validate-cloudflare-v77.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
      - 'data/symbol_knowledge_registry.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check all Worker modules
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do
            echo "checking $f"
            node --check "$f"
          done
      - name: Verify canonical locks
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const index=fs.readFileSync('cloudflare-worker/index.js','utf8');
          const engine=fs.readFileSync('cloudflare-worker/engine-v77168.js','utf8');
          const scanner=fs.readFileSync('cloudflare-worker/hyro-scanner.js','utf8');
          const runtime=fs.readFileSync('cloudflare-worker/hyro-runtime.js','utf8');
          const exec=fs.readFileSync('cloudflare-worker/hyro-execution.js','utf8');
          const micro=fs.readFileSync('cloudflare-worker/hyro-market-context.js','utf8');
          const manager=fs.readFileSync('cloudflare-worker/hyro-position-manager.js','utf8');
          const wrangler=fs.readFileSync('cloudflare-worker/prepare-wrangler.mjs','utf8');
          const v73=JSON.parse(fs.readFileSync('data/nocut_intraday_allpass_v73.json','utf8'));
          const signalLocks=['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED'];
          for(const x of signalLocks)if(!engine.includes(x))throw new Error('Signal lock missing: '+x);
          const propLocks=['V77.18.13','dynamicEquitySizing','ABC_MICRO'];
          for(const x of propLocks)if(!index.includes(x))throw new Error('PROP index lock missing: '+x);
          for(const x of ['PER_SYMBOL_STRATEGY_REGISTRY','NEAR_MARKET_PLAN','fundingRate'])if(!scanner.includes(x))throw new Error('Scanner lock missing: '+x);
          for(const x of ['enrichHyroPlans','selectedMicroScore'])if(!runtime.includes(x))throw new Error('Runtime micro lock missing: '+x);
          for(const x of ['/v5/market/open-interest','/v5/market/account-ratio','/v5/market/orderbook'])if(!micro.includes(x))throw new Error('Micro context missing: '+x);
          if(!exec.includes('hyroDynamicRiskView'))throw new Error('Dynamic equity risk missing');
          if(!manager.includes('v771811:hyro:manage:'))throw new Error('Position manager state lock missing');
          if(!wrangler.includes('keep_vars: true')||!wrangler.includes("binding: 'TRADING_STATE'"))throw new Error('KV/vars deployment lock missing');
          if(v73.version!=='NO_CUT_INTRADAY_ALLPASS_V73')throw new Error('V73 version changed');
          if(v73.forex?.universeCount!==28||v73.crypto?.universeCount!==61)throw new Error('V73 universe changed');
          console.log('Canonical modular V77 validation PASS');
          NODE
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate build-time Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
