name: Apply V77.15.5 Action First
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77155_action_first.js'
      - '.github/workflows/apply-v77155-action-first.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply migration
        shell: bash
        run: |
          set +e
          : > V77155_DIAGNOSTIC.txt
          node --check scripts/apply_v77155_action_first.js >> V77155_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77155_DIAGNOSTIC.txt
          node scripts/apply_v77155_action_first.js >> V77155_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77155_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77155_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77155_DIAGNOSTIC.txt
          for t in 'V77.15.5' 'structuralFallbackLimit' 'routeRescueSide' 'rescuePlan' 'Action-First Entry Hub'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77155_DIAGNOSTIC.txt; else echo "$t=NO" >> V77155_DIAGNOSTIC.txt; fi; done
      - name: Promote
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77155_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77155_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77155_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77155_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.15.5 action-first entry routing' || exit 0
          git push origin main
