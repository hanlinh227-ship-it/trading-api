name: Cleanup V77.18.28 Once
on:
  push:
    branches: [v771828-notify-cleanup]
    paths:
      - '.github/workflows/cleanup-v771828-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771828-notify-cleanup
          fetch-depth: 0
      - name: Upgrade Signal notifications and clean obsolete files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          marker='function hubKeyboard(h){'
          if 'function signalNotifyKeyboard(' not in s:
              insert='''function signalNotifyKeyboard(group,symbol=null){const rows=[];if(symbol)rows.push([{text:"🔎 "+symbol,callback_data:"sym:"+group+":"+symbol},{text:"📡 "+groupTitle(group).replace(/^[^ ]+ /,""),callback_data:"scan:"+group}]);else rows.push([{text:"📡 Quét lại",callback_data:"scan:"+group},{text:"🔥 Top Setups",callback_data:"hub"}]);rows.push([{text:"📚 Live Orders",callback_data:"books"},{text:"🏠 Hub",callback_data:"menu"}]);return {inline_keyboard:rows};}\nfunction signalEventText(kind,p,extra={}){const group=extra.group||"crypto",side=sideText(p?.side),entry=fmtPx(p?.entry),sl=fmtPx(p?.sl),tp1=fmtPx(p?.tp1),tp2=fmtPx(p?.tp2||p?.tp),rr=Number(p?.targetRR);const head=kind==="LIMIT_FILLED"?"🔵 LIMIT KHỚP • ACTIVE":kind==="TP"?"✅ TP DONE":kind==="SL"?"🛑 SL HIT":kind==="LIMIT_NEW"?"🟡 LIMIT MỚI • ĐANG CHỜ":"🟢 MARKET MỚI • ACTIVE";const L=[head,groupTitle(group)+" • "+(p?.symbol||"—")+" • "+side,"━━━━━━━━━━━━━━"];if(kind==="TP"||kind==="SL"){L.push("📍 Entry "+entry,"🏁 Close "+fmtPx(extra.closePrice));}else{L.push("🎯 Entry "+entry,"🛡 SL "+sl,"💰 TP1 "+tp1+" • TP2 "+tp2+(Number.isFinite(rr)?" • RR "+rr.toFixed(2):""));}if(p?.discoveredBy)L.push("⚙️ "+orderSourceText(p.discoveredBy));return L.join("\\n");}\n'''
              s=s.replace(marker,insert+marker)
          replacements=[
          ('''async function notifyNewCryptoOrders(run,env){for(const p of run?.newItems||[]){const pending=p.status==="PENDING",title=pending?"🟡 AUTO SCAN • LIMIT MỚI ĐANG CHỜ":"🟢 AUTO SCAN • MARKET MỚI ĐANG CHẠY";await sendText(env,title+"\\n"+p.symbol+" "+sideText(p.side)+"\\nEntry: "+p.entry+" • SL: "+p.sl+" • TP: "+p.tp+"\\nNguồn: "+orderSourceText(p.discoveredBy)+"\\nLệnh đã lưu vào LIVE ORDERS.").catch(()=>{});}}''','''async function notifyNewCryptoOrders(run,env){for(const p of run?.newItems||[]){const pending=p.status==="PENDING";await sendText(env,signalEventText(pending?"LIMIT_NEW":"MARKET_NEW",p,{group:"crypto"}),undefined,signalNotifyKeyboard("crypto",p.symbol)).catch(()=>{});}}'''),
          ('''await sendText(env,"🔵 LIMIT ĐÃ KHỚP — ĐANG CHẠY\\n"+p.symbol+" "+sideText(p.side)+"\\nEntry: "+p.entry+" • SL: "+p.sl+" • TP: "+p.tp+"\\nNguồn lệnh: "+orderSourceText(p.discoveredBy)+"\\nLệnh đã chuyển LIMIT CHỜ → LIMIT ACTIVE và sẽ tiếp tục xuất hiện trong HUB/Crypto.").catch(()=>{});''','''await sendText(env,signalEventText("LIMIT_FILLED",p,{group:"crypto"}),undefined,signalNotifyKeyboard("crypto",p.symbol)).catch(()=>{});'''),
          ('''await sendText(env,(hitTP?"✅ TAKE PROFIT":"❌ STOP LOSS")+"\\n"+p.symbol+" "+sideText(p.side)+"\\n"+(hitTP?"TP":"SL")+": "+px+"\\nNguồn lệnh: "+orderSourceText(p.discoveredBy)).catch(()=>{});''','''await sendText(env,signalEventText(hitTP?"TP":"SL",p,{group:"crypto",closePrice:px}),undefined,signalNotifyKeyboard("crypto",p.symbol)).catch(()=>{});'''),
          ('''const rr=Number(a.planned?.targetRR||0).toFixed(2),txt=["📡 SIGNAL • "+group.toUpperCase(),a.symbol+" "+sideText(a.side)+" • "+mode,"E "+fmtPx(a.planned.entry)+" | SL "+fmtPx(a.planned.sl)+" | TP "+fmtPx(a.planned.tp2||a.planned.tp1)+" | RR "+rr,a.method?.profile?"Method: "+a.method.profile:null].filter(Boolean).join("\\n");\n    await sendText(env,txt).catch(()=>{});''','''const rr=Number(a.planned?.targetRR||0).toFixed(2),txt=["📡 SIGNAL PLAN • "+groupTitle(group),"━━━━━━━━━━━━━━",(mode==="MARKET"?"🟢":"🟡")+" "+a.symbol+" • "+sideText(a.side)+" • "+mode,"🎯 Entry "+fmtPx(a.planned.entry),"🛡 SL "+fmtPx(a.planned.sl),"💰 TP1 "+fmtPx(a.planned.tp1)+" • TP2 "+fmtPx(a.planned.tp2||a.planned.tp1)+" • RR "+rr,"⭐ Score "+(Number(a.score)||0)+"/100"+(a.method?.profile?" • "+a.method.profile:""),"ℹ️ Plan kỹ thuật • chờ execution authority thật"].join("\\n");\n    await sendText(env,txt,undefined,signalNotifyKeyboard(group,a.symbol)).catch(()=>{});''')]
          for old,new in replacements:
              if old not in s: raise SystemExit('notification marker missing')
              s=s.replace(old,new)
          p.write_text(s)
          PY
          obsolete=(
            .github/workflows/check-v77151-core-live.yml .github/workflows/check-v77151-crypto-fast.yml .github/workflows/check-v77151-forex-metal.yml .github/workflows/check-v77151-future-fast.yml .github/workflows/check-v77154-forex-fast.yml .github/workflows/check-v77155-action-live.yml .github/workflows/check-v77160-production.yml .github/workflows/check-v77162-stability.yml .github/workflows/check-v77164-fast-core.yml .github/workflows/check-v77164-final-stability.yml .github/workflows/check-v77166-live-order-reconciliation.yml .github/workflows/check-v77167-durable-live-orders.yml .github/workflows/compact-signal-notifications-once.yml .github/workflows/migrate-v771821-prompt-driven-once.yml .github/workflows/research-v76-entry.yml .github/workflows/summarize-v76.yml .github/workflows/validate-entry-v76.yml .github/workflows/validate-live-v74.yml .github/workflows/validate-v77130.yml .github/workflows/validate-v77151-build.yml .github/workflows/verify-fast-v77110-router.yml .github/workflows/verify-isolated-v77130.yml .github/workflows/verify-live-v77100.yml .github/workflows/verify-live-v77120.yml .github/workflows/verify-live-v77130.yml .github/workflows/verify-live-v779.yml .github/workflows/verify-now-v77110.yml .github/workflows/verify-now-v77120.yml .github/workflows/verify-now-v77130.yml .github/workflows/verify-now-v77131.yml .github/workflows/verify-v77140-live.yml .github/workflows/verify-v77142-core.yml .github/workflows/verify-v77142-td-build.yml .github/workflows/verify-v77152-final.yml .github/workflows/verify-v7792-markets.yml .github/workflows/verify-v7794-crypto.yml cloudflare-worker/hyro-demo-test.js scripts/fix_v77140_boundary_markers.js scripts/migrate_v771822.py
          )
          for f in "${obsolete[@]}"; do [ -e "$f" ] && git rm -f "$f"; done
          find . -maxdepth 1 -type f \( -name 'V77*_DIAGNOSTIC.txt' -o -name 'V77*_LIVE_CHECK.txt' -o -name 'V77*_NOW_LIVE.txt' -o -name 'V77*_BUILD.txt' -o -name 'V77*_FAST*.txt' -o -name 'V77*_PRODUCTION.txt' -o -name 'V77*_STABILITY.txt' -o -name 'V77*_ACTION_LIVE.txt' -o -name 'V77*_FINAL_CHECK.txt' -o -name 'V77*_MARKETS_CHECK.txt' -o -name 'V77*_LIVE_ORDER_CHECK.txt' \) -print -delete
          rm -f ACTIONABLE_HUB_BUILD.txt
          git rm --cached -f .github/workflows/cleanup-v771828-once.yml || true
          rm -f .github/workflows/cleanup-v771828-once.yml
          node --check cloudflare-worker/engine-v77168.js
          cd cloudflare-worker && node validate-worker.mjs && npm install && TRADING_KV_NAMESPACE_ID='00000000000000000000000000000000' npm run prepare:wrangler && npx wrangler deploy --dry-run
          cd ..
      - name: Commit cleanup
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add -A
          git commit -m 'V77.18.28 Signal notification R4 and repository cleanup' || exit 0
          git push origin HEAD:v771828-notify-cleanup
