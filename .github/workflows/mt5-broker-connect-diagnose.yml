name: MT5 Broker Connection Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-broker-connect-diagnose.yml'

permissions:
  contents: read

concurrency:
  group: mt5-broker-connect-diagnose
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Diagnose MT5 broker login and terminal state
        shell: bash
        run: |
          set +e
          source /var/lib/trading/mt5-forex/runtime.env
          echo '=== RUNTIME ==='
          echo "wine=$($MT5_WINE_BIN --version 2>/dev/null)"
          echo "stack=${MT5_WINE_STACK:-UNKNOWN}"
          echo "install=$MT5_INSTALL_DIR"
          echo '=== SERVICES ==='
          systemctl is-active mt5-forex.service mt5-forex-bridge.service || true
          echo '=== REAL MT5 PROCESS ==='
          ps -u mt5forex -o pid=,comm=,etimes=,args= | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g' | grep -E 'terminal64|^ *[0-9]+ +main ' || true
          echo '=== CONFIG NONSECRET ==='
          awk -F= '/^(Login|Server|ProxyEnable|KeepPrivate|CertInstall|Enabled|AllowLiveTrading|Expert|Symbol|Period)=/{if($1=="Login") $2="[REDACTED_LOGIN]"; print $1"="$2}' "$MT5_INSTALL_DIR/mt5-forex-bootstrap.ini" 2>/dev/null || true
          echo '=== LOCAL PULSE SUMMARY ==='
          python3 - "$MT5_INSTALL_DIR/MQL5/Files/FOREX_BRIDGE/pulse.json" <<'PY'
          import json, pathlib, sys
          p=pathlib.Path(sys.argv[1])
          if not p.is_file():
              print('pulse=missing'); raise SystemExit
          try: d=json.loads(p.read_text())
          except Exception as e: print('pulse_json_error='+repr(e)); raise SystemExit
          # Pulse canonical schema nests metrics: mt5.connected, account.balance
          mt5=d.get('mt5') if isinstance(d.get('mt5'),dict) else {}
          acct=d.get('account') if isinstance(d.get('account'),dict) else {}
          print('terminalId=' + ('[REDACTED_ACCOUNT]' if d.get('terminalId') else 'missing'))
          print(f"connected={mt5.get('connected')}")
          print(f"tradeAllowed={mt5.get('tradeAllowed')}")
          print(f"eaVersion={mt5.get('eaVersion')}")
          for k in ('balance','equity','margin','freeMargin'):
              v=acct.get(k)
              try: v='positive' if float(v or 0)>0 else 'zero_or_negative'
              except Exception: v='invalid'
              print(f'{k}={v}')
          PY
          echo '=== BRIDGE HEALTH ==='
          cat /var/lib/trading/mt5-forex/bridge-health.json 2>/dev/null | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g' || true
          echo
          echo '=== CURRENT SERVER/CACHE INVENTORY ==='
          find "$MT5_INSTALL_DIR" -maxdepth 5 -type f \( -iname 'servers.dat' -o -iname '*.srv' -o -iname 'accounts.dat' -o -iname 'origin.txt' -o -iname 'common.ini' -o -iname '*.ini' \) -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -n 100 | cut -d' ' -f2-
          echo '=== CURRENT SERVERS.DAT STRINGS ==='
          for f in "$MT5_INSTALL_DIR/Config/servers.dat"; do
            [ -f "$f" ] || continue
            echo "file=$f sha=$(sha256sum "$f" | awk '{print $1}')"
            strings -el "$f" 2>/dev/null | grep -Eai 'FivePercent|Five Percent|Online|Real|LDN|server' | head -n 100 || true
            strings "$f" 2>/dev/null | grep -Eai 'FivePercent|Five Percent|Online|Real|LDN|server' | head -n 100 || true
          done
          echo '=== BACKUP SERVER CACHE CANDIDATES ==='
          find /var/lib/trading/mt5-forex -type f -path '*/Config/servers.dat' -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -n 40 | cut -d' ' -f2-
          echo '=== BACKUP SERVERS.DAT FIVEPERCENT STRINGS ==='
          find /var/lib/trading/mt5-forex -type f -path '*/Config/servers.dat' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            m="$( { strings -el "$f" 2>/dev/null; strings "$f" 2>/dev/null; } | grep -Eai 'FivePercent|Five Percent|Online-Real|FivePercentOnline' | head -n 20 )"
            if [ -n "$m" ]; then echo "--- $f sha=$(sha256sum "$f" | awk '{print $1}') ---"; printf '%s\n' "$m"; fi
          done
          echo '=== PRIOR FIVEPERCENT AUTHORIZATION LINES FROM ALL PREFIX BACKUPS ==='
          find /var/lib/trading/mt5-forex -type f -path '*/logs/*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            out=$(mktemp)
            iconv -f UTF-16LE -t UTF-8 "$f" >"$out" 2>/dev/null || cp "$f" "$out" 2>/dev/null
            m=$(grep -Eai 'FivePercentOnline-Real|Five Percent Online|authorized on|authorization failed|invalid account|no connection|network' "$out" | tail -n 80)
            if [ -n "$m" ]; then
              echo "--- $f ---"
              printf '%s\n' "$m" | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g; s/(password|passwd|token|authorization)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
            fi
            rm -f "$out"
          done
          echo '=== FIVEPERCENT PATH MATCHES ==='
          find /var/lib/trading/mt5-forex -maxdepth 14 \( -type f -o -type d \) -iname '*FivePercent*' -print 2>/dev/null | head -n 200
          echo '=== ROAMING METAQUOTES ==='
          find "$MT5_WINEPREFIX/drive_c/users/mt5forex/AppData/Roaming/MetaQuotes" -maxdepth 5 -type f -printf '%T@ %s %p\n' 2>/dev/null | sort -nr | head -n 100 | cut -d' ' -f2-
          echo '=== TERMINAL LOG TAIL DECODED ==='
          latest=$(find "$MT5_INSTALL_DIR/logs" -maxdepth 1 -type f -iname '*.log' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2-)
          if [ -n "$latest" ]; then
            out=$(mktemp); iconv -f UTF-16LE -t UTF-8 "$latest" >"$out" 2>/dev/null || cp "$latest" "$out"
            tail -n 300 "$out" | sed -E 's/[0-9]{6,}/[REDACTED_NUMBER]/g; s/(password|passwd|token|authorization)[=: ]+[^ ]+/\1=[REDACTED]/Ig'
            rm -f "$out"
          fi
          echo '=== NETWORK ==='
          getent hosts www.mql5.com || true
          curl -I -sS --connect-timeout 5 --max-time 10 https://www.mql5.com/ | head -n 3 || true
