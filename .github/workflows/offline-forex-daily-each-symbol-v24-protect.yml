name: Offline Forex Daily Each Symbol V24 Protect
on:
  push:
    paths:
      - 'scripts/offline_forex-daily-each-symbol-v24-protect.py'
      - 'scripts/offline_forex_daily_each_symbol_v24_protect.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v24-protect.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run protective hourly per-pair management
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v24_protect.py
