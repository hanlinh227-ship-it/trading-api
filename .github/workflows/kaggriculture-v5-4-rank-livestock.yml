name: Kaggriculture V6.2 - Canonical Live Champion

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Compatibility input only; canonical lane is Kaggle live-only
        required: false
        default: '24'
  push:
    branches:
      - main
    paths:
      - .github/reward-kaggriculture-v5-4-rank-trigger
  pull_request:
    paths:
      - 'reward-hunter/kaggriculture-v3/**'
      - '.github/workflows/kaggriculture-v5-4-rank-livestock.yml'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Live-only activation retires older canonical runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow kaggriculture-v5-4-rank-livestock.yml \
            --branch main --limit 50 \
            --json databaseId,status | \
          python -c 'import json,os,sys; cur=int(os.environ["GITHUB_RUN_ID"]); [print(int(r.get("databaseId",0))) for r in json.load(sys.stdin) if r.get("status") in ("queued","in_progress","pending") and int(r.get("databaseId",0)) != cur]' > /tmp/older-canonical-runs.txt
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "RETIRE_PRE_LIVE_CANONICAL_RUN run=$run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done < /tmp/older-canonical-runs.txt

      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Static live-only contracts
        run: |
          set -euo pipefail
          python -m compileall -q reward-hunter/kaggriculture-v3
          python reward-hunter/kaggriculture-v3/live_score_ledger.py --help >/dev/null
          python reward-hunter/kaggriculture-v3/live_kaggle_guard.py --help >/dev/null
          python - <<'PY'
          import sys
          sys.path.insert(0,'reward-hunter/kaggriculture-v3')
          import policy_v57
          policy_v57.validate_live_runtime_contracts()
          print('V62_PRODUCTION_FIRST_RUNTIME_CONTRACT_PASS')
          PY
          echo 'LIVE_ONLY_SOURCE_STATIC_PASS'
          echo 'NO_KAGGLE_ENVIRONMENTS NO_LOCAL_MATCH NO_SIMULATOR_EXECUTION'

      - name: Package bot - static validation only
        run: |
          set -euo pipefail
          mkdir -p /tmp/v62-live
          python reward-hunter/kaggriculture-v3/package_submission_v57.py \
            --output /tmp/v62-live/main.py | tee /tmp/v62-live/package.json
          test -s /tmp/v62-live/main.py
          python -m py_compile /tmp/v62-live/main.py
          sha256sum /tmp/v62-live/main.py | tee /tmp/v62-live/sha256.txt
          echo 'LIVE_ONLY_PACKAGE_STATIC_PASS'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v6-2-live-validation-${{ github.run_id }}
          path: /tmp/v62-live/
          if-no-files-found: warn
          retention-days: 30

  research:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    concurrency:
      group: kaggriculture-v57-main-canonical-single-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical live-only lineage guard
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          echo "CANONICAL_MAIN_WRITER_LIVE_ONLY sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
          echo 'NO_LOCAL_SEARCH NO_BENCHMARK_MATCHES NO_SIMULATOR_MATCHES'

      - name: Restore canonical live ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/kaggriculture-v57-main-learning/learning_state.json
            /tmp/kaggriculture-v57-main-learning/kaggle_live.json
          key: kaggriculture-v57-main-learning-${{ github.run_id }}
          restore-keys: |
            kaggriculture-v57-main-learning-

      - name: Bootstrap and migrate live champion ledger
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaggriculture-v57-main-learning
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/kaggriculture-v57-main-learning/kaggle_live.json')
          if not p.exists() or not p.stat().st_size:
              data={
                  'sha256':'b113a5da49a597baaacae7de76041b9702f99881d1e35db02beda4408192996f',
                  'submitted_at':'2026-09-10T16:19:13Z',
                  'description':'V5.4 live-shadow continuity seed',
                  'status':'continuity_seed'
              }
              print('LIVE_LEDGER_BOOTSTRAPPED')
          else:
              data=json.loads(p.read_text())
          if not isinstance(data,dict):
              raise SystemExit('LIVE_LEDGER_CORRUPT not an object')
          for key in ('sha256','submitted_at','description'):
              if key not in data or not isinstance(data[key],str):
                  raise SystemExit('LIVE_LEDGER_CORRUPT missing '+key)
          if data.get('best_ever_public_score') is None and data.get('high_water_public_score') is not None:
              data['best_ever_public_score']=data.get('high_water_public_score')
          data['ledger_schema']=3
          tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(data,indent=2,sort_keys=True)+'\n'); tmp.replace(p)
          print('LIVE_LEDGER_VALID',json.dumps({
              'latest_sha':str(data.get('latest_sha256') or data.get('sha256',''))[:12],
              'latest_score':data.get('latest_public_score'),
              'current_best_score':data.get('current_best_public_score'),
              'best_ever_score':data.get('best_ever_public_score'),
              'candidate_result':data.get('candidate_result'),
              'pending_submit_sha':str(data.get('pending_submit_sha',''))[:12],
              'submit_failure_sha':str(data.get('last_submit_failure_sha',''))[:12]
          },sort_keys=True))
          PY

      - name: Package canonical V6.2 bot for Kaggle live
        run: |
          set -euo pipefail
          OUT="/tmp/kaggriculture-v57-main-${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python reward-hunter/kaggriculture-v3/package_submission_v57.py \
            --output "$OUT/main.py" | tee "$OUT/package.json"
          test -s "$OUT/main.py"
          python -m py_compile "$OUT/main.py"
          sha256sum "$OUT/main.py" | tee "$OUT/sha256.txt"
          echo 'CANONICAL_V62_LIVE_PACKAGE_READY'
          echo 'NO_SIMULATOR_EXECUTION'

      - name: Kaggle guarded live submission and champion status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          OUT="/tmp/kaggriculture-v57-main-${GITHUB_RUN_ID}"
          python -m pip install -q -U kaggle
          python reward-hunter/kaggriculture-v3/live_kaggle_guard.py \
            --ledger /tmp/kaggriculture-v57-main-learning/kaggle_live.json \
            --main "$OUT/main.py" \
            --output-dir "$OUT" \
            --label-prefix 'V6.2 live-production-first' \
            --failure-backoff-seconds 3600 \
            --visibility-wait-seconds 10

      - name: Print canonical live scoreboard
        if: always()
        run: |
          set -euo pipefail
          LEDGER=/tmp/kaggriculture-v57-main-learning/kaggle_live.json
          if [ -s "$LEDGER" ]; then
            python - <<'PY'
          import json
          d=json.load(open('/tmp/kaggriculture-v57-main-learning/kaggle_live.json'))
          print('CANONICAL_LIVE_SCOREBOARD',json.dumps({
              'latest_score':d.get('latest_public_score'),
              'latest_ref':d.get('latest_submission_ref'),
              'latest_status':d.get('latest_status'),
              'current_best_score':d.get('current_best_public_score'),
              'current_best_ref':d.get('current_best_submission_ref'),
              'best_ever_score':d.get('best_ever_public_score'),
              'best_ever_ref':d.get('best_ever_submission_ref'),
              'candidate_result':d.get('candidate_result'),
              'latest_vs_current_best_delta':d.get('latest_vs_current_best_delta'),
              'latest_vs_best_ever_delta':d.get('latest_vs_best_ever_delta'),
              'submit_failure_sha':str(d.get('last_submit_failure_sha',''))[:12],
              'submit_failure_at':d.get('last_submit_failure_at'),
              'submit_failure_count':d.get('last_submit_failure_count')
          },sort_keys=True))
          PY
          fi

      - name: Save canonical live ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/kaggriculture-v57-main-learning/learning_state.json
            /tmp/kaggriculture-v57-main-learning/kaggle_live.json
          key: kaggriculture-v57-main-learning-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v6-2-main-live-${{ github.run_id }}
          path: /tmp/kaggriculture-v57-main-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Queue exactly one next canonical live round
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OTHER="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow kaggriculture-v5-4-rank-livestock.yml \
            --branch main --limit 30 \
            --json databaseId,status | python -c 'import json,os,sys; cur=int(os.environ["GITHUB_RUN_ID"]); print(sum(1 for r in json.load(sys.stdin) if r.get("status") in ("queued","in_progress","pending") and int(r.get("databaseId",0)) != cur))')"
          OTHER="${OTHER:-0}"
          echo "Canonical live round complete; other active canonical runs=$OTHER"
          if [ "$OTHER" -gt 0 ]; then
            echo 'NEXT_ROUND_DEDUPED existing canonical run already queued/in progress'
            exit 0
          fi
          gh workflow run kaggriculture-v5-4-rank-livestock.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidates=24
          echo 'NEXT_V62_CANONICAL_MAIN_LIVE_ROUND_QUEUED'
