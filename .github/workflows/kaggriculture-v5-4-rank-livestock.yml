name: Kaggriculture V5.7 - Legacy Research Branch Archived

on:
  workflow_dispatch:
  push:
    branches:
      - research/kaggriculture-v5-4-rank-livestock
    paths:
      - .github/reward-kaggriculture-v5-4-rank-trigger
      - .github/workflows/kaggriculture-v5-4-rank-livestock.yml

permissions:
  contents: read

jobs:
  archived:
    runs-on: ubuntu-latest
    steps:
      - name: Legacy branch is read-only
        run: |
          echo 'LEGACY_V57_BRANCH_ARCHIVED'
          echo 'Canonical continuous learning, state writes, promotion and next-round dispatch now run only from main.'
          echo 'This branch intentionally performs no research, no cache writes, no Kaggle submit, and no recursive dispatch.'
