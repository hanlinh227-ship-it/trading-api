name: Kaggriculture V5.7 - Canonical Conflict-Free Challenger

on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Compatibility input only; canonical lane is live-only and does not run local challenger search
        required: false
        default: '24'
  push:
    branches:
      - main
    paths:
      - .github/reward-kaggriculture-v5-4-rank-trigger
  pull_request:
    paths:
      - 'reward-hunter/kaggriculture-v3/**'
      - '.github/workflows/kaggriculture-v5-4-rank-livestock.yml'

permissions:
  contents: read

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Live-only activation retires older canonical runs
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run list \
            --workflow kaggriculture-v5-4-rank-livestock.yml \
            --branch main --limit 50 \
            --json databaseId,status | \
          python -c 'import json,os,sys; cur=int(os.environ["GITHUB_RUN_ID"]); [print(int(r.get("databaseId",0))) for r in json.load(sys.stdin) if r.get("status") in ("queued","in_progress","pending") and int(r.get("databaseId",0)) != cur]' > /tmp/older-canonical-runs.txt
          while read -r run_id; do
            [ -z "$run_id" ] && continue
            echo "RETIRE_PRE_LIVE_CANONICAL_RUN run=$run_id"
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
          done < /tmp/older-canonical-runs.txt
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static compile only - no practice matches
        run: |
          set -euo pipefail
          python -m compileall -q reward-hunter/kaggriculture-v3
          echo 'LIVE_ONLY_STATIC_COMPILE_PASS'
      - name: Package current V5.7 bot for live lane
        run: |
          set -euo pipefail
          mkdir -p /tmp/v57-live
          python reward-hunter/kaggriculture-v3/package_submission_v57.py --output /tmp/v57-live/main.py | tee /tmp/v57-live/package.json
          python reward-hunter/kaggriculture-v3/raw_exec_test.py /tmp/v57-live/main.py | tee /tmp/v57-live/raw.json
          echo 'LIVE_ONLY_PACKAGE_PASS'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v5-7-live-validation-${{ github.run_id }}
          path: /tmp/v57-live/
          if-no-files-found: warn
          retention-days: 30

  research:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: write
    concurrency:
      group: kaggriculture-v57-main-canonical-single-writer
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Canonical live-only lineage guard
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          echo "CANONICAL_MAIN_WRITER_LIVE_ONLY sha=$GITHUB_SHA run=$GITHUB_RUN_ID"
          echo 'NO_LOCAL_SEARCH NO_BENCHMARK_MATCHES NO_SIMULATOR_MATCHES'

      - name: Restore canonical live ledger
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/kaggriculture-v57-main-learning/learning_state.json
            /tmp/kaggriculture-v57-main-learning/kaggle_live.json
          key: kaggriculture-v57-main-learning-${{ github.run_id }}
          restore-keys: |
            kaggriculture-v57-main-learning-

      - name: Bootstrap and validate live ledger
        run: |
          set -euo pipefail
          mkdir -p /tmp/kaggriculture-v57-main-learning
          python - <<'PY'
          import json
          from pathlib import Path

          p=Path('/tmp/kaggriculture-v57-main-learning/kaggle_live.json')
          if not p.exists() or not p.stat().st_size:
              p.write_text(json.dumps({
                  'sha256':'b113a5da49a597baaacae7de76041b9702f99881d1e35db02beda4408192996f',
                  'submitted_at':'2026-09-10T16:19:13Z',
                  'description':'V5.4 live-shadow continuity seed',
                  'status':'continuity_seed'
              },indent=2,sort_keys=True)+'\n')
              print('LIVE_LEDGER_BOOTSTRAPPED')
          data=json.loads(p.read_text())
          if not isinstance(data,dict):
              raise SystemExit('LIVE_LEDGER_CORRUPT not an object')
          for key in ('sha256','submitted_at','description'):
              if key not in data or not isinstance(data[key],str):
                  raise SystemExit('LIVE_LEDGER_CORRUPT missing '+key)
          print('LIVE_LEDGER_VALID',json.dumps({
              'sha256':data.get('sha256','')[:12],
              'submitted_at':data.get('submitted_at'),
              'description':data.get('description'),
              'status':data.get('status'),
              'pending_submit_sha':str(data.get('pending_submit_sha',''))[:12],
              'pending_submit_at':data.get('pending_submit_at')
          },sort_keys=True))
          PY

      - name: Package canonical bot for Kaggle live
        run: |
          set -euo pipefail
          OUT="/tmp/kaggriculture-v57-main-${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python reward-hunter/kaggriculture-v3/package_submission_v57.py --output "$OUT/main.py" | tee "$OUT/package.json"
          python reward-hunter/kaggriculture-v3/raw_exec_test.py "$OUT/main.py" | tee "$OUT/raw.json"
          sha256sum "$OUT/main.py" | tee "$OUT/sha256.txt"
          echo 'CANONICAL_LIVE_PACKAGE_READY'

      - name: Kaggle live-only submission and status
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/kaggriculture-v57-main-${GITHUB_RUN_ID}"
          LEDGER=/tmp/kaggriculture-v57-main-learning/kaggle_live.json
          DECISION="$OUT/live-decision.json"
          export OUT LEDGER DECISION

          python - <<'PY'
          import datetime,hashlib,json,os,pathlib
          root=pathlib.Path(os.environ['OUT'])
          ledger=pathlib.Path(os.environ['LEDGER'])
          code=root/'main.py'
          sha=hashlib.sha256(code.read_bytes()).hexdigest()
          live=json.loads(ledger.read_text()) if ledger.exists() else {}
          now=datetime.datetime.now(datetime.timezone.utc)
          last_at=live.get('submitted_at','2026-09-10T16:19:13Z')
          try:
              then=datetime.datetime.fromisoformat(last_at.replace('Z','+00:00'))
              age=max(0,(now-then).total_seconds())
          except Exception:
              age=0
          pending_at=live.get('pending_submit_at')
          pending_age=None
          if pending_at:
              try:
                  pthen=datetime.datetime.fromisoformat(str(pending_at).replace('Z','+00:00'))
                  pending_age=max(0,(now-pthen).total_seconds())
              except Exception:
                  pending_age=0
          desc='V5.7 live-only '+sha[:12]
          decision={
              'sha256':sha,
              'description':desc,
              'confirmed_sha256':live.get('sha256',''),
              'confirmed_age_seconds':int(age),
              'pending_submit_sha':live.get('pending_submit_sha',''),
              'pending_age_seconds':None if pending_age is None else int(pending_age),
              'cooldown_seconds':21600
          }
          pathlib.Path(os.environ['DECISION']).write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          print('LIVE_ONLY_DECISION',json.dumps(decision,sort_keys=True))
          PY

          if [ -z "${KAGGLE_API_TOKEN:-}" ]; then
            echo 'KAGGLE_LIVE_DEFERRED missing credential; no simulator fallback'
            exit 0
          fi

          python -m pip install -q -U kaggle
          kaggle competitions submissions -c kaggriculture | tee "$OUT/kaggle-before.txt"

          SHA256="$(python -c 'import json,os; print(json.load(open(os.environ["DECISION"]))["sha256"])')"
          DESC="$(python -c 'import json,os; print(json.load(open(os.environ["DECISION"]))["description"])')"
          CONFIRMED_SHA="$(python -c 'import json,os; print(json.load(open(os.environ["DECISION"]))["confirmed_sha256"])')"
          AGE="$(python -c 'import json,os; print(json.load(open(os.environ["DECISION"]))["confirmed_age_seconds"])')"
          PENDING_SHA="$(python -c 'import json,os; print(json.load(open(os.environ["DECISION"]))["pending_submit_sha"])')"
          PENDING_AGE="$(python -c 'import json,os; v=json.load(open(os.environ["DECISION"]))["pending_age_seconds"]; print(-1 if v is None else v)')"
          export SHA256 DESC CONFIRMED_SHA AGE PENDING_SHA PENDING_AGE

          if grep -Fq "$DESC" "$OUT/kaggle-before.txt"; then
            python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ['LEDGER'])
          d=json.loads(p.read_text())
          d.update({
              'sha256':os.environ['SHA256'],
              'submitted_at':d.get('pending_submit_at') or datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'description':os.environ['DESC'],
              'source_run':os.environ.get('GITHUB_RUN_ID'),
              'status':'visible'
          })
          d.pop('pending_submit_sha',None); d.pop('pending_submit_at',None); d.pop('pending_description',None)
          tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); tmp.replace(p)
          PY
            echo 'KAGGLE_LIVE_ALREADY_VISIBLE'
            exit 0
          fi

          if [ "$PENDING_SHA" = "$SHA256" ] && [ "$PENDING_AGE" -ge 0 ] && [ "$PENDING_AGE" -lt 1800 ]; then
            echo 'KAGGLE_LIVE_PENDING_VISIBILITY_WAIT no duplicate submission'
            exit 0
          fi

          if [ "$CONFIRMED_SHA" = "$SHA256" ]; then
            echo 'KAGGLE_LIVE_CURRENT_SHA_CONFIRMED no duplicate submission'
            exit 0
          fi

          if [ "$AGE" -lt 21600 ]; then
            echo "KAGGLE_LIVE_COOLDOWN remaining_seconds=$((21600-AGE)); no simulator fallback"
            exit 0
          fi

          echo 'KAGGLE_LIVE_SUBMISSION_READY'
          if kaggle competitions submit -c kaggriculture -f "$OUT/main.py" -m "$DESC"; then
            python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ['LEDGER'])
          d=json.loads(p.read_text())
          d['pending_submit_sha']=os.environ['SHA256']
          d['pending_submit_at']=datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          d['pending_description']=os.environ['DESC']
          tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); tmp.replace(p)
          PY
            sleep 10
            kaggle competitions submissions -c kaggriculture | tee "$OUT/kaggle-after.txt"
            if grep -Fq "$DESC" "$OUT/kaggle-after.txt"; then
              python - <<'PY'
          import datetime,json,os,pathlib
          p=pathlib.Path(os.environ['LEDGER'])
          d=json.loads(p.read_text())
          d.update({
              'sha256':os.environ['SHA256'],
              'submitted_at':d.get('pending_submit_at') or datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'description':os.environ['DESC'],
              'source_run':os.environ.get('GITHUB_RUN_ID'),
              'status':'visible'
          })
          d.pop('pending_submit_sha',None); d.pop('pending_submit_at',None); d.pop('pending_description',None)
          tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(d,indent=2,sort_keys=True)+'\n'); tmp.replace(p)
          PY
              echo 'KAGGLE_LIVE_SUBMISSION_VISIBLE'
            else
              echo 'KAGGLE_LIVE_SUBMISSION_SENT_NOT_VISIBLE_YET pending only'
            fi
          else
            echo 'KAGGLE_LIVE_SUBMISSION_COMMAND_FAILED; no simulator fallback'
          fi

      - name: Save canonical live ledger
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/kaggriculture-v57-main-learning/learning_state.json
            /tmp/kaggriculture-v57-main-learning/kaggle_live.json
          key: kaggriculture-v57-main-learning-${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v5-7-main-live-${{ github.run_id }}
          path: /tmp/kaggriculture-v57-main-${{ github.run_id }}/
          if-no-files-found: warn
          retention-days: 30

      - name: Queue exactly one next canonical live round
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OTHER="$(gh run list \
            --workflow kaggriculture-v5-4-rank-livestock.yml \
            --branch main --limit 30 \
            --json databaseId,status | python -c 'import json,os,sys; cur=int(os.environ["GITHUB_RUN_ID"]); print(sum(1 for r in json.load(sys.stdin) if r.get("status") in ("queued","in_progress","pending") and int(r.get("databaseId",0)) != cur))')"
          OTHER="${OTHER:-0}"
          echo "Canonical live round complete; other active canonical runs=$OTHER"
          if [ "$OTHER" -gt 0 ]; then
            echo 'NEXT_ROUND_DEDUPED existing canonical run already queued/in progress'
            exit 0
          fi
          gh workflow run kaggriculture-v5-4-rank-livestock.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f candidates=24
          echo 'NEXT_V57_CANONICAL_MAIN_LIVE_ROUND_QUEUED'
