name: Apply V77.13.1 Live Skip Metal Knowledge
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77131_live_order_skip_metal_knowledge.js'
      - '.github/workflows/apply-v77131.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77131_DIAGNOSTIC.txt
          node --check scripts/apply_v77131_live_order_skip_metal_knowledge.js >> V77131_DIAGNOSTIC.txt 2>&1; echo GENERATOR_EXIT=$? >> V77131_DIAGNOSTIC.txt
          node scripts/apply_v77131_live_order_skip_metal_knowledge.js >> V77131_DIAGNOSTIC.txt 2>&1; echo MIGRATION_EXIT=$? >> V77131_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77131_DIAGNOSTIC.txt 2>&1; echo WORKER_SYNTAX_EXIT=$? >> V77131_DIAGNOSTIC.txt
          node - <<'NODE' >> V77131_DIAGNOSTIC.txt 2>&1
          const fs=require('fs'),k=JSON.parse(fs.readFileSync('data/symbol_knowledge_registry.json','utf8')),s=fs.readFileSync('cloudflare-worker/index.js','utf8');
          console.log('KNOWLEDGE_COUNT='+Object.keys(k.symbols||{}).length);
          console.log('XAU_KNOWLEDGE='+(k.symbols?.XAUUSD?'YES':'NO'));console.log('XAG_KNOWLEDGE='+(k.symbols?.XAGUSD?'YES':'NO'));
          console.log('LIVE_SKIP='+(s.includes('liveSymbolsSkipped')&&s.includes('entryRows=broad.rows.filter')?'YES':'NO'));
          console.log('FRESH_SCAN='+(s.includes('freshWatchFromRun')&&s.includes('scanPrefix')?'YES':'NO'));
          console.log('PERSISTENT_ORDERS='+(s.includes('orderHistory')&&s.includes('validExecutablePosition')?'YES':'NO'));
          NODE
          exit 0
      - name: Commit on pass
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77131_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77131_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77131_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77131_DIAGNOSTIC.txt && grep -q 'KNOWLEDGE_COUNT=91' V77131_DIAGNOSTIC.txt && grep -q 'LIVE_SKIP=YES' V77131_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js data/symbol_knowledge_registry.json; fi
          git commit -m 'Promote V77.13.1 live-order skip and metal knowledge' || exit 0
          git push origin main
