name: V78-026 H1 Self-reporting Validation V2
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v78-026-h1-diagnose-v2.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
  TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
  HYRO_BYBIT_API_KEY: ${{ secrets.HYRO_BYBIT_API_KEY }}
  HYRO_BYBIT_API_SECRET: ${{ secrets.HYRO_BYBIT_API_SECRET }}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v78-026-h1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run guarded H1 validation and always report
        shell: bash
        run: |
          set +e
          mkdir -p docs/ai-coengineer; STATUS=PASS; FAIL_STAGE=; : > /tmp/v78026.log
          run_stage(){ name="$1"; shift; echo "=== $name ===" | tee -a /tmp/v78026.log; "$@" >> /tmp/v78026.log 2>&1; rc=$?; echo "rc=$rc" | tee -a /tmp/v78026.log; if [ $rc -ne 0 ] && [ "$STATUS" = PASS ]; then STATUS=FAIL; FAIL_STAGE="$name"; fi; return $rc; }
          run_stage guard bash -c "grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md && grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md && grep -q '^SCOPE: V78-026 H1 deterministic order identity + intent state machine ONLY$' docs/ai-coengineer/WRITE_LOCK.md && test \"\$(git hash-object cloudflare-worker/hyro-execution.js)\" = b97695c3f96939290e4a80d24d9fc702d154b29a"
          if [ "$STATUS" = PASS ]; then cp cloudflare-worker/hyro-execution.js /tmp/hyro-pre.js; run_stage patch python3 scripts/v78-026-h1-apply.py; fi
          if [ "$STATUS" = PASS ]; then run_stage static bash -c "node --check cloudflare-worker/hyro-execution.js && test \"\$(grep -c 'async function sha256Hex' cloudflare-worker/hyro-execution.js)\" = 1 && test \"\$(grep -c 'RETRYABLE_REJECTION_CODES' cloudflare-worker/hyro-execution.js)\" = 2 && test \"\$(grep -c 'crypto.randomUUID' cloudflare-worker/hyro-execution.js || true)\" = 0 && test \"\$(grep -c '/v5/order/cancel-all' cloudflare-worker/hyro-execution.js)\" = 1 && for st in PREPARED SUBMITTING ACKNOWLEDGED FAILED_RETRYABLE RECONCILE_REQUIRED; do grep -q \"state:\\\"$st\\\"\" cloudflare-worker/hyro-execution.js || exit 1; done"; fi
          if [ "$STATUS" = PASS ]; then
            run_stage untouched python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          a=Path('/tmp/hyro-pre.js').read_text();b=Path('cloudflare-worker/hyro-execution.js').read_text()
          def ext(s,n):
            m=re.search(r'(?:export\s+)?(?:async\s+)?function\s+'+re.escape(n)+r'\s*\(',s);assert m
            i=s.find('{',m.start());d=0;q=None;esc=False;line=False;block=False;j=i
            while j<len(s):
              c=s[j];nn=s[j+1] if j+1<len(s) else ''
              if line:
                if c=='\n':line=False
              elif block:
                if c=='*' and nn=='/':block=False;j+=1
              elif q:
                if esc:esc=False
                elif c=='\\':esc=True
                elif c==q:q=None
              elif c=='/' and nn=='/':line=True;j+=1
              elif c=='/' and nn=='*':block=True;j+=1
              elif c in "'\"`":q=c
              elif c=='{':d+=1
              elif c=='}':
                d-=1
                if d==0:return s[m.start():j+1]
              j+=1
            raise Exception(n)
          for n in ['evaluateHyroGate','normalizedOrder','hyroDynamicRiskView','cancelHyroPending','reconcileHyro','getHyroTelemetry','collectTelemetry']:
            x,y=ext(a,n),ext(b,n);assert x==y,n;print('BYTE_IDENTICAL',n,'sha256='+hashlib.sha256(x.encode()).hexdigest())
          PY
          fi
          if [ "$STATUS" = PASS ]; then
            run_stage legacy python3 - <<'PY'
          import os,json,urllib.parse,urllib.request
          acct=os.environ.get('CLOUDFLARE_ACCOUNT_ID','');ns=os.environ.get('TRADING_KV_NAMESPACE_ID','');tok=os.environ.get('CLOUDFLARE_API_TOKEN','');prefix='v7718:hyro:intent:'
          if not acct or not ns or not tok:raise SystemExit('CLOUDFLARE_KV_SECRETS_MISSING')
          base=f'https://api.cloudflare.com/client/v4/accounts/{acct}/storage/kv/namespaces/{ns}'
          def req(u):return urllib.request.urlopen(urllib.request.Request(u,headers={'Authorization':'Bearer '+tok}),timeout=30).read()
          keys=json.loads(req(base+'/keys?'+urllib.parse.urlencode({'prefix':prefix,'limit':100})))
          for row in keys.get('result') or []:
            k=row.get('name')
            try:v=json.loads(req(base+'/values/'+urllib.parse.quote(k,safe='')))
            except Exception:continue
            if isinstance(v,dict) and 'state' not in v and v.get('status')=='SUBMITTED':print(json.dumps({'legacyKeySuffix':k[len(prefix):],'status':v.get('status'),'orderIdPresent':bool(v.get('orderId')),'orderLinkIdPresent':bool(v.get('orderLinkId'))}));break
          else:raise SystemExit('NO_LEGACY_PREPATCH_INTENT_RECORD_FOUND')
          PY
          fi
          if [ "$STATUS" = PASS ]; then run_stage demo-secrets bash -c 'test -n "$HYRO_BYBIT_API_KEY" && test -n "$HYRO_BYBIT_API_SECRET"'; fi
          if [ "$STATUS" = PASS ]; then run_stage demo node scripts/v78-026-h1-demo-test.mjs; fi
          if [ "$STATUS" = PASS ]; then echo 'V78-026 H1 PRE-DEPLOY VALIDATION PASS' > docs/ai-coengineer/V78-026_VALIDATION.txt; cat /tmp/v78026.log >> docs/ai-coengineer/V78-026_VALIDATION.txt; fi
          { echo "STATUS=$STATUS"; echo "FAIL_STAGE=${FAIL_STAGE:-NONE}"; echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; echo "BRANCH_BASE=$(git rev-parse HEAD)"; echo '--- LOG ---'; cat /tmp/v78026.log; } > docs/ai-coengineer/V78-026_RUN_STATUS.txt
          git config user.name 'V78-026 H1 Validator'; git config user.email 'actions@users.noreply.github.com'
          if [ "$STATUS" = PASS ]; then git add cloudflare-worker/hyro-execution.js docs/ai-coengineer/V78-026_VALIDATION.txt docs/ai-coengineer/V78-026_RUN_STATUS.txt; else git add docs/ai-coengineer/V78-026_RUN_STATUS.txt; fi
          git commit -m "V78-026 H1 validation $STATUS at ${FAIL_STAGE:-all-stages}" || true
          git push origin HEAD:v78-026-h1
          test "$STATUS" = PASS
