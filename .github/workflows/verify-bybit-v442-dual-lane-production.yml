name: Verify Bybit V4.4.2 Dual Lane Production
on:
  push:
    branches: [main]
    paths: ['.github/bybit-v442-dual-lane-verify-trigger']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: bybit-v442-dual-lane-production-verify, cancel-in-progress: true}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify source safety markers and deployed runtime
        shell: bash
        env:
          BASE: https://trading-v77-scanner.hanlinh227.workers.dev
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/bybit-v442-final"; mkdir -p "$T"
          node --check cloudflare-worker/bybit-dynamic-universe.js
          node --check cloudflare-worker/bybit-multi-asset-controller.js
          grep -q "BYBIT-MULTI-STATEFLOW-4.4.2" cloudflare-worker/bybit-runtime-contract.js
          grep -q "BYBIT_MULTI_ASSET_RUNTIME_V22_DUAL_LANE_DISCOVERY_PROMOTION" cloudflare-worker/bybit-runtime-contract.js
          grep -q "promotionWatchLane:true" cloudflare-worker/bybit-runtime-contract.js
          grep -q "promotionRequiresRepeatedFreshEvidence:true" cloudflare-worker/bybit-runtime-contract.js
          grep -q "if(rank&&row?.eligible)scanRows.push" cloudflare-worker/bybit-multi-asset-controller.js
          grep -q "promotionObservations.push" cloudflare-worker/bybit-multi-asset-controller.js
          grep -q "TRADE_PROMOTED" cloudflare-worker/bybit-dynamic-universe.js
          for i in $(seq 1 30); do
            curl -fsS --max-time 30 "$BASE/bybit/health" > "$T/health.json" || true
            curl -fsS --max-time 30 "$BASE/runtime/contract" > "$T/contract.json" || true
            OK=$(T="$T" node -e "const fs=require('fs'),p=process.env.T;try{const h=JSON.parse(fs.readFileSync(p+'/health.json')),c=JSON.parse(fs.readFileSync(p+'/contract.json'));process.stdout.write(h.version==='BYBIT-MULTI-STATEFLOW-4.4.2'&&c.version==='BYBIT_MULTI_ASSET_RUNTIME_V22_DUAL_LANE_DISCOVERY_PROMOTION'?'1':'0')}catch{process.stdout.write('0')}")
            [ "$OK" = 1 ] && break
            sleep 10
          done
          curl -fsS --max-time 45 "$BASE/bybit/entry-health" > "$T/entry.json" || echo '{}' > "$T/entry.json"
          curl -fsS --max-time 60 "$BASE/bybit/universe" > "$T/universe.json" || echo '{}' > "$T/universe.json"
          T="$T" node <<'NODE'
          const fs=require('fs'),p=process.env.T;
          const read=f=>{try{return JSON.parse(fs.readFileSync(`${p}/${f}`,'utf8'))}catch{return {}}};
          const h=read('health.json'),c=read('contract.json'),e=read('entry.json'),u=read('universe.json'),s=u.summary||{};
          const checks={
            version:h.version==='BYBIT-MULTI-STATEFLOW-4.4.2',
            mode:h.mode==='LIVE',
            authenticated:h.authenticated===true,
            ready:h.execution?.ready===true,
            contract:c.version==='BYBIT_MULTI_ASSET_RUNTIME_V22_DUAL_LANE_DISCOVERY_PROMOTION',
            dualLane:c.dualLaneMarketDiscovery===true&&c.confirmedTradeLane===true&&c.promotionWatchLane===true,
            repeatedEvidence:c.persistentPromotionEvidence===true&&c.promotionRequiresRepeatedFreshEvidence===true,
            universe:u.authority==='BYBIT_DYNAMIC_CRYPTO_SCALP_UNIVERSE_V3_DUAL_LANE_PROMOTION'||s.authority==='BYBIT_DYNAMIC_CRYPTO_SCALP_UNIVERSE_V3_DUAL_LANE_PROMOTION',
            promotionQueue:Array.isArray(u.promotionCandidates)||Array.isArray(s.promotionQueue),
            noBlockers:Array.isArray(e.blockers)&&e.blockers.length===0,
            noGuarantee:c.realizedProfitGuarantee===false,
            noMartingale:c.recoveryMartingale===false,
            noAddLoser:c.recoveryAddToLoser===false
          };
          const pass=Object.values(checks).every(Boolean);
          const out={pass,checkedAt:new Date().toISOString(),runtime:{version:h.version,revision:h.runtimeRevision,mode:h.mode,authenticated:h.authenticated,ready:h.execution?.ready,equity:h.account?.totalEquity,wallet:h.account?.walletBalance,available:h.account?.availableBalance,positions:h.positions?.items||[]},contract:{version:c.version,dualLaneMarketDiscovery:c.dualLaneMarketDiscovery,confirmedTradeLane:c.confirmedTradeLane,promotionWatchLane:c.promotionWatchLane,persistentPromotionEvidence:c.persistentPromotionEvidence,promotionRequiresRepeatedFreshEvidence:c.promotionRequiresRepeatedFreshEvidence},entry:{status:e.status,blockers:e.blockers||[]},universe:{authority:u.authority||s.authority,totalLinearUsdt:s.totalLinearUsdt,tradeableNow:s.tradeableNow,promotedNow:s.promotedNow,promotionCandidates:s.promotionCandidates,watchNew:s.watchNew,watchOnly:s.watchOnly,doNotTrade:s.doNotTrade,promotionQueue:s.promotionQueue||[]},checks};
          console.log(JSON.stringify(out,null,2));
          fs.writeFileSync(`${p}/audit.json`,JSON.stringify(out,null,2)+'\n');
          if(!pass)process.exit(9);
          NODE
      - name: Upload V4.4.2 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-v442-dual-lane-production-verification
          path: ${{ runner.temp }}/bybit-v442-final
          retention-days: 7
