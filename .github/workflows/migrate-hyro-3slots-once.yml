name: Migrate Hyro 3 Slots Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-hyro-3slots-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Align execution slot cap
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/hyro-execution.js')
          s=p.read_text()
          old='if(activeSymbols.size>=2)return {ok:false,reason:"MAX_ACTIVE_SLOTS_REACHED"};'
          new='if(activeSymbols.size>=3)return {ok:false,reason:"MAX_ACTIVE_SLOTS_REACHED"};'
          if old in s:
              s=s.replace(old,new,1)
              p.write_text(s)
          elif new not in s:
              raise SystemExit('slot marker not found')
          PY
      - name: Syntax gate
        run: node --check cloudflare-worker/hyro-execution.js
      - name: Commit migration
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/hyro-execution.js
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.14 align Hyro execution to guarded 3-slot cap"
          git push
