name: Offline Crypto Daily Per Symbol V37
on:
  push:
    paths:
      - 'scripts/offline_crypto_daily_per_symbol_v37.py'
      - '.github/workflows/offline-crypto-daily-per-symbol-v37.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run forced-daily 61-coin research
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_daily_per_symbol_v37.py
      - name: Print full per-symbol JSON
        run: cat data/offline_crypto_daily_per_symbol_v37.json
