name: Multi-AI Task Fanout

on:
  workflow_dispatch:
    inputs:
      task:
        description: Engineering task to fan out to all five AI providers
        required: false
        type: string
      context:
        description: Optional task context
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'docs/ai-coengineer/AUTO_TASK.json'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  id-token: write

concurrency:
  group: multi-ai-task-main
  cancel-in-progress: false

jobs:
  fanout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve queued task and skip completed work
        shell: bash
        env:
          DISPATCH_TASK: ${{ inputs.task }}
          DISPATCH_CONTEXT: ${{ inputs.context }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re
          event=os.environ.get('GITHUB_EVENT_NAME','')
          if event=='workflow_dispatch' and str(os.environ.get('DISPATCH_TASK') or '').strip():
              task=str(os.environ['DISPATCH_TASK']).strip()
              context=str(os.environ.get('DISPATCH_CONTEXT') or '')
              task_id='manual-'+os.environ.get('GITHUB_RUN_ID','unknown')
          else:
              p='docs/ai-coengineer/AUTO_TASK.json'
              d=json.load(open(p,encoding='utf-8'))
              if not d.get('enabled',True):
                  open('/tmp/skip','w').write('disabled'); raise SystemExit(0)
              task=str(d.get('task') or '').strip()
              context=d.get('context')
              if not isinstance(context,str): context=json.dumps(context or {},ensure_ascii=False)
              task_id=str(d.get('task_id') or '').strip()
              if not task or not task_id: raise SystemExit('AUTO_TASK requires task and task_id')
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',task_id)[:120]
              result=f'docs/ai-coengineer/AUTO_RESULTS/{safe}.json'
              if os.path.exists(result):
                  print('TASK_ALREADY_COMPLETED '+task_id)
                  open('/tmp/skip','w').write('completed'); raise SystemExit(0)
          with open('/tmp/task-env','w',encoding='utf-8') as f:
              f.write('TASK_ID<<EOF\n'+task_id+'\nEOF\nTASK<<EOF\n'+task+'\nEOF\nCONTEXT<<EOF\n'+context+'\nEOF\n')
          PY
          if [ -f /tmp/skip ]; then echo 'SKIP_TASK=true' >> "$GITHUB_ENV"; exit 0; fi
          cat /tmp/task-env >> "$GITHUB_ENV"

      - name: Resolve gateway and OIDC
        if: env.SKIP_TASK != 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo CLOUDFLARE_ACCOUNT_ID_MISSING; exit 2; }
          SUBDOMAIN="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json; print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')"
          test -n "$SUBDOMAIN" || { echo CLOUDFLARE_WORKERS_SUBDOMAIN_MISSING; exit 2; }
          echo "GATEWAY_URL=https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review" >> "$GITHUB_ENV"
          OIDC="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          echo "GATEWAY_OIDC=$OIDC" >> "$GITHUB_ENV"

      - name: Fan out to five AI providers
        if: env.SKIP_TASK != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          json.dump({'task_id':os.environ['TASK_ID'],'instruction':os.environ['TASK'],'context':{'text':os.environ.get('CONTEXT','')}},open('/tmp/request.json','w'),ensure_ascii=False)
          PY
          code="$(curl -sS --max-time 600 -o /tmp/result.json -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $GATEWAY_OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/request.json)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then echo "MULTI_AI_GATEWAY_HTTP_$code"; head -c 2000 /tmp/result.json || true; exit 3; fi

      - name: Validate five providers and persist result
        if: env.SKIP_TASK != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/ai-coengineer/AUTO_RESULTS
          python3 - <<'PY'
          import json,os,re,datetime
          d=json.load(open('/tmp/result.json',encoding='utf-8')); raw=d.get('providers') or {}
          p={str(k).lower():v for k,v in raw.items()}; expected=['claude','codex','deepseek','qwen','openrouter']
          missing=[x for x in expected if x not in p]
          failed=[x for x in expected if x in p and str((p[x] or {}).get('status') or '').upper()!='OK']
          if missing or failed: raise SystemExit('5AI_NOT_READY missing='+','.join(missing)+' failed='+','.join(failed))
          out={'task_id':os.environ['TASK_ID'],'source_sha':os.environ.get('GITHUB_SHA'),'created_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'all_providers_ok':True,'providers':{}}
          for name in expected:
              item=p[name] or {}; out['providers'][name]={'status':'OK','review':item.get('review') or {},'latency':item.get('latency')}
          safe=re.sub(r'[^A-Za-z0-9_.-]+','_',os.environ['TASK_ID'])[:120]
          path=f'docs/ai-coengineer/AUTO_RESULTS/{safe}.json'; json.dump(out,open(path,'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          open('/tmp/result-path','w').write(path)
          print('MULTI_AI_FANOUT_OK '+','.join(expected))
          PY
          RESULT_PATH="$(cat /tmp/result-path)"
          git config user.name trading-5ai-bot
          git config user.email trading-5ai-bot@users.noreply.github.com
          git add "$RESULT_PATH"
          git diff --cached --quiet && exit 0
          git commit -m "ai: persist 5-AI result ${TASK_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload evidence
        if: env.SKIP_TASK != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: multi-ai-fanout-${{ github.run_id }}
          path: /tmp/result.json
          if-no-files-found: error
          retention-days: 7

      - name: Cleanup
        if: always()
        run: rm -f /tmp/request.json /tmp/result.json /tmp/task-env /tmp/result-path /tmp/skip
