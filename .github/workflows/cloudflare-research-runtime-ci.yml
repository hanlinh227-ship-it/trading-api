name: Cloudflare Research Runtime CI

on:
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'crypto-research-gateway/**'
      - 'bybit-live-bridge/**'
      - 'AI_SKILL_LIBRARY/v4/**'
      - 'AI_SKILL_LIBRARY/skills/**'
      - '.github/workflows/cloudflare-research-runtime-ci.yml'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'crypto-research-gateway/**'
      - 'bybit-live-bridge/**'
      - 'AI_SKILL_LIBRARY/v4/**'
      - 'AI_SKILL_LIBRARY/skills/**'
      - '.github/workflows/cloudflare-research-runtime-ci.yml'
      - '.github/workflows/deploy-cloudflare-worker.yml'

permissions:
  contents: read

jobs:
  validate-cloudflare-research-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Public Bybit bridge safety tests
        run: python3 bybit-live-bridge/test_public_proxy.py

      - name: Install Brain validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt

      - name: Compile exact-SHA Skill Gateway snapshot
        run: |
          python AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py --source-sha "$GITHUB_SHA" --output AI_SKILL_LIBRARY/v4/runtime/generated/skill_gateway_snapshot.json
          python AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py AI_SKILL_LIBRARY/v4/runtime/generated/skill_gateway_snapshot.json

      - name: Install gateway dependencies
        working-directory: crypto-research-gateway
        run: npm install --no-audit --no-fund

      - name: Gateway behavior tests with diagnostic log
        working-directory: crypto-research-gateway
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose 2>&1 | tee gateway-test.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload gateway test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-gateway-test-log
          path: crypto-research-gateway/gateway-test.log
          if-no-files-found: error
          retention-days: 3

      - name: Gateway typecheck
        working-directory: crypto-research-gateway
        run: npm run typecheck

      - name: Gateway build
        working-directory: crypto-research-gateway
        run: npm run build

      - name: Install Cloudflare Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Worker source preflight and real Wrangler bundle dry-run
        working-directory: cloudflare-worker
        shell: bash
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
          AI_BRIDGE_SERVICE_ID: '00000000-0000-4000-8000-000000000000'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set +e
          {
            npm run prepare:wrangler &&
            npm run check &&
            node benchmark-skill-gateway.mjs &&
            npx wrangler deploy --dry-run --outdir .wrangler-ci-dry-run
          } 2>&1 | tee wrangler-check.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload Wrangler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-wrangler-check-log
          path: cloudflare-worker/wrangler-check.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Confirm CI and deployment authority split
        run: |
          echo 'PR CI validates bridge safety, gateway behavior, exact-SHA Skill Gateway snapshot and real Wrangler bundle.'
          echo 'No runtime variables or trading LIVE switches are changed by this validation job.'
