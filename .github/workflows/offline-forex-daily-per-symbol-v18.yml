name: Offline Forex Daily Per Symbol V18
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_per_symbol_v18.py'
      - '.github/workflows/offline-forex-daily-per-symbol-v18.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Optimize all Forex pairs independently
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_per_symbol_v18.py
