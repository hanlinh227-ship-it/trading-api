name: Skill-Mandatory Fast Gateway CI

on:
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'cloudflare-worker/**'
      - '.github/workflows/skill-mandatory-fast-gateway-ci.yml'
      - '.github/workflows/deploy-skill-mandatory-fast-gateway.yml'
  push:
    branches: [main]
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'cloudflare-worker/**'
      - '.github/workflows/skill-mandatory-fast-gateway-ci.yml'
      - '.github/workflows/deploy-skill-mandatory-fast-gateway.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  sync-generated-retrieval-index:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Brain dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Regenerate canonical retrieval index and commit only the derived artifact
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --root . --write
          if git diff --quiet -- AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml; then
            echo "RETRIEVAL_INDEX_SYNC=NO_CHANGE"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git commit -m "chore: refresh V4 retrieval index for release 4.11.0"
          git push origin "HEAD:${HEAD_REF}"
          echo "RETRIEVAL_INDEX_SYNC=COMMITTED"

  validate-skill-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Brain dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt

      - name: Brain validation via single entrypoint (validators, snapshot, release, index, consolidation)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA" --skip-tests
          echo "SKILL_GATEWAY_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"

      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Build exact-SHA Worker snapshot module
        working-directory: cloudflare-worker
        run: |
          export GITHUB_SHA="$SKILL_GATEWAY_SOURCE_SHA"
          npm run prepare:skill-gateway
          npm run prepare:model-mesh

      - name: Run Skill Gateway routing and HTTP contracts
        working-directory: cloudflare-worker
        run: npm run test:skill-gateway

      - name: Benchmark warm FAST routing
        working-directory: cloudflare-worker
        run: node benchmark-skill-gateway.mjs

      - name: Real Wrangler bundle dry-run
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
          AI_BRIDGE_SERVICE_ID: '00000000-0000-4000-8000-000000000000'
        run: |
          export GITHUB_SHA="$SKILL_GATEWAY_SOURCE_SHA"
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy --dry-run --outdir .wrangler-skill-gateway-ci

      - name: Contract summary
        run: |
          echo "SKILL_GATEWAY_CI=PASS"
          echo "PRIMARY_SKILL_REQUIRED=true"
          echo "FAST_EXTERNAL_ROUTING_CALLS=0"
          echo "SNAPSHOT_SOURCE_SHA=$SKILL_GATEWAY_SOURCE_SHA"
