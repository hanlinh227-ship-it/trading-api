name: Dual XAU BTC V20 3Phase Holdout

on:
  push:
    paths:
      - 'research/dual_xau_btc_v20_3phase_holdout.py'
      - '.github/workflows/dual-xau-btc-v20-3phase-holdout.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} V20 3-phase holdout backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          python3 research/dual_xau_btc_v20_3phase_holdout.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_v20_3phase_holdout.txt
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v20-3phase-holdout-result
          path: research/results/${{ matrix.symbol }}_v20_3phase_holdout.txt
          retention-days: 30
