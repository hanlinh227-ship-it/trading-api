name: G2 Research CI

on:
  push:
    branches:
      - research/cloud-10coin-g2-20260913
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: Focused G2 guard tests
        run: PYTHONPATH=. pytest tests/test_g2_global_candidate_guard.py -q
      - name: Full research regression suite
        run: PYTHONPATH=. pytest tests -q

  backtest:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: Full corrected G2 10-coin backtest
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python run.py --generation g2 --start 2024-01-01 --end 2026-08-31 | tee g2-full.log
      - name: Upload G2 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-corrected-results
          path: |
            research/cloud_10coin_backtest/results
            research/cloud_10coin_backtest/g2-full.log
          if-no-files-found: warn
          retention-days: 14
