name: Offline Forex Daily Each Symbol V18 Fast
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v18_fast.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v18-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run strict daily per-pair fast test
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v18_fast.py
