name: Apply SignalHub V3.1 bundle

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - '.github/workflows/apply-signalhub-v31-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-android-v1
          fetch-depth: 0
      - name: Apply prepared V3.1 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/bundle.b64 <<'PAYLOAD'



