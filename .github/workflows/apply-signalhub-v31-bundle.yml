name: Apply SignalHub V3.1 bundle

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - '.github/workflows/apply-signalhub-v31-bundle.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-android-v1
          fetch-depth: 0
      - name: Verify and apply prepared V3.1 bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .signalhub-v31/chunk1.b64 .signalhub-v31/chunk2.b64 .signalhub-v31/chunk3.b64 .signalhub-v31/chunk4.b64 .signalhub-v31/chunk5.b64 .signalhub-v31/chunk6.b64 > /tmp/bundle.b64
          test "$(wc -c < /tmp/bundle.b64)" = "33992"
          base64 -d /tmp/bundle.b64 > /tmp/bundle.txz
          echo '34220b5c1850bde7c06a9403a121c8418aba328155a544be64ab5b5bbad1df9b  /tmp/bundle.txz' | sha256sum -c -
          tar -xJf /tmp/bundle.txz -C .
          node --check signalhub-worker/gateway-v3.js
          grep -Fq "SIGNALHUB-V3-GATEWAY-3.1.0" signalhub-worker/gateway-v3.js
          grep -Fq "SIGNALHUB_V3_CHECKPOINT_05" SIGNALHUB_V3_CHECKPOINT_05.md
          grep -Fq "versionName '3.1.0'" signalhub-android/app/build.gradle
          git config user.name 'signalhub-bot'
          git config user.email 'signalhub-bot@users.noreply.github.com'
          git add signalhub-worker/gateway-v3.js signalhub-android .github/workflows/build-signalhub-android.yml .github/workflows/deploy-signalhub-worker.yml SIGNALHUB_V3_CHECKPOINT_05.md
          if git diff --cached --quiet; then
            echo 'Bundle already applied.'
            exit 0
          fi
          git commit -m 'feat(signalhub): ship V3.1 unified signal app'
          git push origin HEAD:signalhub-android-v1
