name: Apply Bybit V4.3.2 UI Ready

on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-ui-ready-v432-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-ui-ready-v432
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply V4.3.2 protected-risk-slot and UI-ready patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/apply-bybit-ui-ready-v432.py
          cd cloudflare-worker
          node --check bybit-auto-config.js
          node --check bybit-coin-profiles.js
          node --check bybit-symbol-engine.js
          node --check bybit-multi-asset-controller.js
          node --check bybit-control-plane.js
          node --check bybit-runtime-contract.js
          node --check bybit-ui-contract.js
          node --check index.js
          node validate-btc-hyperscale.mjs

      - name: Commit validated V4.3.2 runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker BYBIT_UI_HANDOFF_V432.md
          git diff --cached --stat
          git commit -m 'Upgrade Bybit protected risk slots and UI contract V4.3.2'
          git pull --rebase origin main
          git push origin HEAD:main
