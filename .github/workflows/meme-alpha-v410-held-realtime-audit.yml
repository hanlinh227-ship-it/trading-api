name: Meme Alpha V410B Held Pair Source Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v410-held-realtime-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect executor position schema and trusted pair mapping
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; EXE="$APP/src/micro-live-executor.js"
          echo '=== EXECUTOR POSITION SCHEMA ==='
          grep -nE 'statePath|positions\.push|pairAddress|pair:|entryPair|mint-pair-cache|MICRO_BUY|MICRO_SCALE_IN|positionMints' "$EXE" | head -260 || true
          echo '=== PORTFOLIO OBS WRITER ==='
          grep -RniE 'portfolio-observability|positionMints|stateReadable' "$APP/src" "$APP/run-paper.sh" 2>/dev/null | head -180 || true
          echo '=== HELD PAIR SOURCES ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          obs=json.loads((rt/'portfolio-observability.json').read_text()); held=obs.get('positionMints') or []
          cache=json.loads((rt/'mint-pair-cache.json').read_text()); entries=cache.get('entries') or []
          by={x.get('mint'):x for x in entries if isinstance(x,dict)}
          radar=json.loads((rt/'new-listing-radar.json').read_text()); sig=json.loads((rt/'signal-snapshot.json').read_text()); real=json.loads((rt/'realtime-pool-pulse.json').read_text())
          rr={x.get('mint'):x for x in radar.get('candidates',[]) if isinstance(x,dict)}; ss={x.get('mint'):x for x in sig.get('candidates',[]) if isinstance(x,dict)}; rtrows={x.get('mint'):x for x in real.get('rows',[]) if isinstance(x,dict)}
          print('HELD_TOTAL',len(held))
          for m in held:
            c=by.get(m); r=rr.get(m) or {}; s=ss.get(m) or {}; q=rtrows.get(m) or {}
            print({'mint':m,'cachePair':(c or {}).get('pair'),'cacheSource':(c or {}).get('source'),'cacheSymbol':(c or {}).get('symbol'),'radarPair':r.get('pairAddress') or r.get('pair'),'radarSymbol':r.get('symbol'),'signalPair':s.get('pairAddress') or s.get('pair'),'signalSymbol':s.get('symbol'),'realtimePair':q.get('pair'),'realtimeHeld':q.get('held')})
          le=rt/'last-execution.json'
          if le.exists(): print('LAST_EXECUTION',json.loads(le.read_text()))
          cap=rt/'capital-observability.json'
          if cap.exists(): print('CAPITAL',json.loads(cap.read_text()))
          PY
          echo '=== RECENT BUY EVENTS / PAIR FIELDS ==='
          grep -RhsE 'MICRO_BUY|MICRO_SCALE_IN' /opt/meme-alpha/app/runtime-status /var/lib/meme-alpha/data/micro-live 2>/dev/null | tail -40 || true
          echo V410B_HELD_PAIR_SOURCE_AUDIT=COMPLETE
