name: Phase A Gated Deploy Trigger Parity Fix

on:
  push:
    branches:
      - fix/phase-a-zero-local-active-index
    paths:
      - '.github/workflows/phase-a-trigger-parity-fix.yml'

permissions:
  contents: write

jobs:
  patch-trigger-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-a-zero-local-active-index
          fetch-depth: 0
      - name: Align sole gated deploy triggers with Zero-Local exact-main checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-skill-mandatory-fast-gateway.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - 'cloudflare-worker/**'\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected exactly one cloudflare-worker trigger anchor, found {text.count(anchor)}')
          additions = [
              "      - 'crypto-research-gateway/**'",
              "      - 'bybit-live-bridge/**'",
              "      - 'tests/test_cloud_runtime_policy.py'",
              "      - '.github/workflows/zero-local-cloud-runtime.yml'",
              "      - '.github/workflows/deploy-cloudflare-worker.yml'",
          ]
          missing = [line for line in additions if line not in text]
          if missing:
              text = text.replace(anchor, anchor + '\n'.join(missing) + '\n', 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/phase-a-trigger-parity-fix.yml
          git diff --check
      - name: Commit bounded trigger parity fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-skill-mandatory-fast-gateway.yml .github/workflows/phase-a-trigger-parity-fix.yml
          git diff --cached --check
          git commit -m "fix(runtime): align zero-local and gated deploy triggers"
          git push origin HEAD:fix/phase-a-zero-local-active-index
