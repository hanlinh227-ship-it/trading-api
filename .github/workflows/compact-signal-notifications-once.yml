name: Compact Signal Notifications Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compact-signal-notifications-once.yml'

permissions:
  contents: write

jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compact presentation only
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          start=s.index('function summary(group,books,run=null){')
          end=s.index('\nasync function sendGroup(', start)
          compact='''function summary(group,books,run=null){
  const b=books[group],marketPlans=freshPlanFromRun(run,"market").slice(0,2),limitPlans=freshPlanFromRun(run,"limit").slice(0,2),watch=(run?.analyses||[]).filter(a=>a?.status==="WATCH"&&!a.planned).sort((a,b)=>(Number(b.score)||0)-(Number(a.score)||0)).slice(0,2),L=[groupTitle(group)];
  const live=[...b.marketActive.map(x=>"M "+livePositionLine(x)),...b.limitActive.map(x=>"L "+livePositionLine(x)),...b.limitPending.map(x=>"P "+livePositionLine(x))];
  L.push(`📌 Live ${b.marketActive.length+b.limitActive.length} | Pending ${b.limitPending.length}`);live.slice(0,4).forEach(x=>L.push("• "+x));
  if(marketPlans.length){L.push(`🎯 Market ${marketPlans.length}`);marketPlans.forEach((a,i)=>L.push((i+1)+". "+watchLine(a)));}
  if(limitPlans.length){L.push(`📐 Limit ${limitPlans.length}`);limitPlans.forEach((a,i)=>L.push((i+1)+". "+watchLine(a)));}
  if(!marketPlans.length&&!limitPlans.length&&watch.length){L.push("👀 Gần nhất");watch.forEach((a,i)=>L.push((i+1)+". "+watchLine(a)));}
  if(run?.status==="RATE_BUDGET_WAIT")L.push(`⏱ Quota ~${run.retryAfterSec??60}s`);else if(run?.status==="BUSY")L.push("⏳ Đang có lượt quét khác");else if(run)L.push(`🔍 ${run.broadOk}/${run.requested} | Deep ${run.deepOk}/${run.deepRequested} | Mới ${run.newCount}`);
  return L.join("\\n");
}'''
          s=s[:start]+compact+s[end:]
          start=s.index('function hubSummary(h){')
          end=s.index('\nasync function sendHub(', start)
          hub='''function hubSummary(h){const live=allLivePositions(h.books),L=[`🧭 HUB • Live ${live.length}`];h.top.slice(0,5).forEach((a,i)=>{let x=`${i+1}. ${a.symbol} ${sideText(a.side)} • ${stageText(a)}`;if(a.planned)x+=` | E~${fmtPx(a.planned.entry)} SL~${fmtPx(a.planned.sl)} TP~${fmtPx(a.planned.tp2||a.planned.tp1)} RR${Number(a.planned.targetRR||0).toFixed(2)}`;L.push(x);});if(!h.top.length)L.push("Chưa có setup mới.");return L.join("\\n");}'''
          s=s[:start]+hub+s[end:]
          s=s.replace('''await sendText(env,"🔵 LIMIT ĐÃ KHỚP — ĐANG CHẠY\\n"+p.symbol+" "+sideText(p.side)+"\\nEntry: "+p.entry+" • SL: "+p.sl+" • TP: "+p.tp+"\\nNguồn lệnh: "+orderSourceText(p.discoveredBy)+"\\nLệnh đã chuyển LIMIT CHỜ → LIMIT ACTIVE và sẽ tiếp tục xuất hiện trong HUB/Crypto.").catch(()=>{});''','''await sendText(env,"SIGNAL • LIMIT FILLED\\n"+p.symbol+" "+sideText(p.side)+" | E "+p.entry+" | SL "+p.sl+" | TP "+p.tp).catch(()=>{});''')
          s=s.replace('''await sendText(env,(hitTP?"✅ TAKE PROFIT":"❌ STOP LOSS")+"\\n"+p.symbol+" "+sideText(p.side)+"\\n"+(hitTP?"TP":"SL")+": "+px+"\\nNguồn lệnh: "+orderSourceText(p.discoveredBy)).catch(()=>{});''','''await sendText(env,(hitTP?"SIGNAL • ✅ TP":"SIGNAL • ❌ SL")+"\\n"+p.symbol+" "+sideText(p.side)+" | "+px).catch(()=>{});''')
          old='''const pending=p.status==="PENDING",title=pending?"🟡 AUTO SCAN • LIMIT MỚI ĐANG CHỜ":"🟢 AUTO SCAN • MARKET MỚI ĐANG CHẠY";await sendText(env,title+"\\n"+p.symbol+" "+sideText(p.side)+"\\nEntry: "+p.entry+" • SL: "+p.sl+" • TP: "+p.tp+"\\nNguồn: "+orderSourceText(p.discoveredBy)+"\\nLệnh đã lưu vào LIVE ORDERS.").catch(()=>{});'''
          new='''const pending=p.status==="PENDING",title=pending?"SIGNAL • LIMIT":"SIGNAL • MARKET";await sendText(env,title+"\\n"+p.symbol+" "+sideText(p.side)+" | E "+p.entry+" | SL "+p.sl+" | TP "+p.tp).catch(()=>{});'''
          if old not in s: raise SystemExit('notifyNewCryptoOrders marker not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Syntax gate
        run: node --check cloudflare-worker/engine-v77168.js
      - name: Commit compact formatter only
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.13 compact Signal Telegram notifications"
          git push
