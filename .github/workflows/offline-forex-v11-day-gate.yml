name: Offline Forex V11 Day Gate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v11_day_gate.py'
      - '.github/workflows/offline-forex-v11-day-gate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Forex V11 zero-credit day gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v11_day_gate.py
