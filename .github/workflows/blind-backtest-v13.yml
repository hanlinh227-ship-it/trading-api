name: Blind Crypto Backtest V13
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v13.py'
      - '.github/workflows/blind-backtest-v13.yml'
  workflow_dispatch:
jobs:
  v13:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v13.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v13.json
          git commit -m "Run V13 fresh blind" || exit 0
          git pull --rebase origin main || true
          git push || true
