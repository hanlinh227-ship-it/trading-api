name: Blind Crypto Backtest V20B
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v20b.py'
      - '.github/workflows/blind-backtest-v20b.yml'
  workflow_dispatch:
jobs:
  v20b:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v20b.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v20b.json
          git commit -m "Run locked V20 extension" || exit 0
          git pull --rebase origin main || true
          git push || true
