name: Probe OKX Crypto Universe
on:
  push:
    paths:
      - '.github/workflows/probe-okx-crypto-universe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check 61 USDT instruments
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.parse, time
          S='BTC ETH SOL HYPE SHIB TRX XRP AAVE ADA ALGO APT ARB ATOM AVAX BCH BONK CRV DOGE DOT ETC FIL FLOKI HBAR INJ JTO JUP KAITO LDO LINK LTC MOODENG NEAR ONDO OP ORDI PENGU PEPE PNUT POL POPCAT RENDER S STX SUI TAO TIA TON TRUMP UNI WIF WLD AIXBT ASTER FARTCOIN GRASS IP LIT PUMP VIRTUAL XPL ZEC'.split()
          ok=[];miss=[]
          for s in S:
              inst=f'{s}-USDT'
              url='https://www.okx.com/api/v5/market/ticker?'+urllib.parse.urlencode({'instId':inst})
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'trading-api-okx-probe/1.0'})
                  with urllib.request.urlopen(req,timeout=8) as r:d=json.loads(r.read().decode())
                  rows=d.get('data') or []
                  if d.get('code')=='0' and rows: ok.append(s)
                  else: miss.append([s,d.get('code'),d.get('msg')])
              except Exception as e: miss.append([s,'ERR',str(e)])
              time.sleep(.03)
          print(json.dumps({'requested':len(S),'okCount':len(ok),'ok':ok,'missingCount':len(miss),'missing':miss},indent=2))
          PY
