name: Personal AI Artifact Delivery

on:
  workflow_dispatch:
    inputs:
      model_id:
        description: Optional canonical Open Model Universe model_id; blank requires exactly one deliverable candidate
        required: false
        type: string

permissions:
  contents: read

jobs:
  stage-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install control-plane dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Resolve canonical artifact dynamically
        id: prepare
        env:
          REQUESTED_MODEL_ID: ${{ inputs.model_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/personal-ai-artifact"
          args=(prepare --root "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/personal-ai-artifact/candidate.json")
          if [ -n "${REQUESTED_MODEL_ID:-}" ]; then
            args+=(--model-id "$REQUESTED_MODEL_ID")
          fi
          python -m AI_SKILL_LIBRARY.v4.control_plane.artifact_delivery "${args[@]}"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          candidate = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("personal-ai-artifact/candidate.json").read_text())
          for key in ("model_id", "artifact_filename", "weights_source", "sha256", "size_bytes", "immutable_revision"):
              print(f"{key}={candidate[key]}")
          fingerprint = f"{candidate['model_id']}@{candidate['immutable_revision'][:12]}-{candidate['sha256'][:12]}"
          print("artifact_name=" + fingerprint.replace("/", "_"))
          PY

      - name: Download exact immutable artifact
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/personal-ai-artifact/${{ steps.prepare.outputs.artifact_filename }}"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 30 --max-time 1800 \
            --output "$target" \
            "${{ steps.prepare.outputs.weights_source }}"

      - name: Pre-scan size and digest gate
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/personal-ai-artifact/${{ steps.prepare.outputs.artifact_filename }}"
          actual_size="$(stat -c %s "$target")"
          test "$actual_size" = "${{ steps.prepare.outputs.size_bytes }}"
          echo "${{ steps.prepare.outputs.sha256 }}  $target" | sha256sum --check --strict
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "personal-ai-artifact" / "${{ steps.prepare.outputs.artifact_filename }}"
          if path.suffix.lower() == ".gguf" and path.read_bytes()[:4] != b"GGUF":
              raise SystemExit("GGUF magic validation failed")
          PY

      - name: Install and refresh ClamAV
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clamav
          sudo systemctl stop clamav-freshclam.service 2>/dev/null || true
          sudo freshclam --stdout

      - name: Malware scan exact artifact
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/personal-ai-artifact/${{ steps.prepare.outputs.artifact_filename }}"
          clamscan --no-summary "$target"

      - name: Emit bounded verified handoff manifest
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/personal-ai-artifact"
          python -m AI_SKILL_LIBRARY.v4.control_plane.artifact_delivery verify \
            --candidate "$dir/candidate.json" \
            --artifact "$dir/${{ steps.prepare.outputs.artifact_filename }}" \
            --retrieval-method github_actions_immutable_download \
            --malware-scan-status pass \
            --malware-scan-engine clamav \
            --output "$dir/manifest.json"

      - name: Assert manifest does not grant activation
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          manifest = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("personal-ai-artifact/manifest.json").read_text())
          assert manifest["runtime_handoff"]["permitted"] is True
          assert manifest["runtime_handoff"]["purpose"] == "isolated_security_first_load_only"
          assert manifest["activation"]["permitted"] is False
          assert manifest["routing"]["authority"] == "task_router"
          assert manifest["model_mesh"]["selection_authority"] == "model_mesh"
          PY

      - name: Publish bounded artifact and evidence
        uses: actions/upload-artifact@v4
        with:
          name: personal-ai-${{ steps.prepare.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/personal-ai-artifact/${{ steps.prepare.outputs.artifact_filename }}
            ${{ runner.temp }}/personal-ai-artifact/candidate.json
            ${{ runner.temp }}/personal-ai-artifact/manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
