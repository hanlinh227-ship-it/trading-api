name: V16 Horizon Dev
on:
  push:
    paths:
      - 'scripts/v16_horizon_dev.py'
      - '.github/workflows/v16-horizon-dev.yml'
  workflow_dispatch:
jobs:
  v16:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/v16_horizon_dev.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v16_horizon_dev.json
          git commit -m "Run V16 horizon development" || exit 0
          git pull --rebase origin main || true
          git push || true
