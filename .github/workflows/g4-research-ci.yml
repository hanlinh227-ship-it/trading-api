name: G4 Research CI

on:
  push:
    branches:
      - research/cloud-10coin-g4-meta-20260913
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G4 causal meta-model tests
        run: PYTHONPATH=. pytest tests/test_g4_meta_model.py -q
      - name: Full regression suite
        run: PYTHONPATH=. pytest tests -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G4 BTC real-data smoke
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python run.py --generation g4 --symbols BTCUSDT --start 2025-01-01 --end 2026-08-31 --smoke | tee g4-btc-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g4-btc-smoke
          path: |
            research/cloud_10coin_backtest/g4-btc-smoke.log
            research/cloud_10coin_backtest/results
          if-no-files-found: warn
          retention-days: 14
