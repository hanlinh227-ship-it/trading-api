name: V10 Barrier Grid

on:
  push:
    paths:
      - "scripts/v10_barrier_grid.py"
      - ".github/workflows/v10-barrier-grid.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run grid
        run: |
          mkdir -p data
          python3 scripts/v10_barrier_grid.py
      - name: Commit result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v10_barrier_grid.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run V10 barrier grid"
          git pull --rebase origin main
          git push origin HEAD:main
