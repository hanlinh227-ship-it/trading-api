name: V25 Crypto Development
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v25.py'
      - '.github/workflows/v25-development.yml'
  workflow_dispatch:
jobs:
  v25-development:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v25.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v25_development.json
          git commit -m "Run V25 June development" || exit 0
          git pull --rebase origin main || true
          git push || true
