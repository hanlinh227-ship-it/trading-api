name: Verify Now V77.13.1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-now-v77131.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait deploy briefly
        run: sleep 25
      - name: Production checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77131_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/status" -o /tmp/s.json; echo STATUS_CURL=$? >> V77131_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/o1.json; echo ORDERS1_CURL=$? >> V77131_LIVE_CHECK.txt
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo CRYPTO_CURL=$? >> V77131_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/knowledge?symbol=XAUUSD" -o /tmp/kx.json; echo XAU_KNOWLEDGE_CURL=$? >> V77131_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/knowledge?symbol=KAITOUSDT" -o /tmp/kk.json; echo KAITO_KNOWLEDGE_CURL=$? >> V77131_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/o2.json; echo ORDERS2_CURL=$? >> V77131_LIVE_CHECK.txt
          node - <<'NODE' >> V77131_LIVE_CHECK.txt 2>&1
          const fs=require('fs');const r=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json'))}catch(e){return {e:e.message}}};const s=r('s'),c=r('c'),kx=r('kx'),kk=r('kk'),o1=r('o1'),o2=r('o2');
          const cnt=o=>['forex','crypto','metal'].map(g=>{const x=o[g]||{};return g+':'+(x.marketActive||[]).length+'/'+(x.limitActive||[]).length+'/'+(x.limitPending||[]).length+'/w'+(x.watch||[]).length}).join('|');
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));
          console.log('CRYPTO='+(c.broadOk??'-')+'/'+(c.requested??'-')+' deep='+(c.deepOk??'-')+'/'+(c.deepRequested??'-')+' scan='+(c.scanId||'-'));
          console.log('LIVE_SKIP_COUNT='+((c.diagnostics?.liveSymbolsSkipped||[]).length));
          console.log('XAU_KNOWLEDGE='+(kx.ok===true?'YES':'NO')+':'+(kx.knowledge?.assetClass||'-')+':'+(kx.knowledge?.calibration?.status||'-'));
          console.log('KAITO_KNOWLEDGE='+(kk.ok===true?'YES':'NO')+':'+((kk.knowledge?.allowedModes||[]).join('/'))+':'+(kk.knowledge?.calibration?.status||'-'));
          console.log('ORDERS1='+cnt(o1));console.log('ORDERS2='+cnt(o2));console.log('PRESERVED='+(cnt(o1)===cnt(o2)?'YES':'NO'));console.log('WATCH_ZERO='+(['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0)?'YES':'NO'));
          const pass=s.version==='V77.13.1'&&s.ok===true&&c.deepOk===3&&kx.ok===true&&kx.knowledge?.assetClass==='metal'&&kk.ok===true&&cnt(o1)===cnt(o2)&&['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0);
          console.log('VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77131_LIVE_CHECK.txt
          git commit -m 'Report immediate V77.13.1 verification' || exit 0
          git push origin main
