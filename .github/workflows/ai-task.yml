name: AI Task - Legacy Manual Redirect

on:
  workflow_dispatch:
    inputs:
      task_file:
        description: "Legacy task file (diagnostic only)"
        required: true
        type: string

permissions:
  contents: read

# This legacy source-writing entry point is intentionally retired. All writes must
# enter through the canonical AI Closed Loop / AI Closed Loop Wake paths so the
# normalized per-task lock is shared and unrelated tasks never queue globally.

jobs:
  redirect:
    name: Legacy manual writer disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain canonical entry point
        shell: bash
        run: |
          echo "ai-task.yml is retired as a writer."
          echo "Use the canonical [AI-TASK] issue dispatch or AI Closed Loop Wake."
          echo "Requested legacy task_file: ${{ inputs.task_file }}"
