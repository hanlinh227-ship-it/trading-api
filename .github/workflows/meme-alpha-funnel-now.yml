name: Meme Alpha Funnel Now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-funnel-now.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Verify v383 scanner breadth deployment
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ROOT=/opt/trading/trading-api
          echo "ROOT_HEAD=$(git -c safe.directory=$ROOT -C $ROOT rev-parse HEAD 2>/dev/null || true)"
          echo "ROOT_REMOTE=$(git -c safe.directory=$ROOT -C $ROOT rev-parse origin/auto-futures-v1 2>/dev/null || true)"
          echo '=== SCANNER BREADTH ==='
          grep -nE 'V383_SAFE_BREADTH_EXPANSION|MAX_SELLABILITY_CHECKS_V216|baseDeep = preliminary|extraMeme = preliminary|slice\(0, 12\)' "$APP/src/scanner.js" || true
          echo '=== SIGNAL ==='
          python3 -c "import json,os,time; p='$APP/runtime-status/signal-snapshot.json'; d=json.load(open(p)); print({'ageSec':round(time.time()-os.path.getmtime(p),1),'timestamp':d.get('timestamp'),'count':len(d.get('candidates') or []),'probe':(d.get('intelSummary') or {}).get('probeCandidates'),'routed':(d.get('intelSummary') or {}).get('routedCandidates'),'summary':d.get('intelSummary')}); [print({k:x.get(k) for k in ['symbol','score','decision','universeClass','securityDecision','holderClusterDecision','hardReject','token2022','liquidityUsd','priceChange5m','netBuyers5m','sellRoute']}) for x in (d.get('candidates') or [])[:12]]"
          echo '=== GATE ==='
          python3 -c "import json; d=json.load(open('$APP/runtime-status/micro-live-gate.json')); print({k:d.get(k) for k in ['allowed','armOk','armAttested','executionMode','sourceHealthy','riskEntryAllowed','liveRiskReady','reasons']})"
