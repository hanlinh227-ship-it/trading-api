name: Meme Alpha Funnel Now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-funnel-now.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect live candidate funnel
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== FILES ==='
          find "$APP/runtime-status" -maxdepth 2 -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 80 || true
          echo '=== GATE ==='
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
          echo '=== SIGNAL SNAPSHOTS ==='
          for p in "$APP/runtime-status/signal-snapshot.json" "$APP/runtime-status/safe-signal.json" "$APP/runtime-status/signals.json"; do
            if [ -f "$p" ]; then
              echo "--- $p"
              python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d,ensure_ascii=False)[:30000])" "$p" || true
            fi
          done
          echo '=== MICRO LIVE STATE ==='
          find "$APP/runtime-status" -maxdepth 2 -type f -iname '*micro*live*.json' -print 2>/dev/null | while read -r p; do
            echo "--- $p"
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); print(json.dumps(d,ensure_ascii=False)[:20000])" "$p" || true
          done
          echo '=== DATA RECENT FILES ==='
          find /var/lib/meme-alpha/data -maxdepth 3 -type f -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n 100 || true
          echo '=== RECENT FUNNEL TEXT ==='
          grep -RniE 'BUY|SELL|EXECUT|PROBE_CANDIDATE|candidate|reject|block|eligible' /var/lib/meme-alpha/data "$APP/runtime-status" 2>/dev/null | tail -n 250 || true
