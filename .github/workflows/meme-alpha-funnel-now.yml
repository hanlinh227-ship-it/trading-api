name: Meme Alpha Funnel Now
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-funnel-now.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect active scanner funnel caps
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== SCANNER MATCHES ==='
          grep -nE 'MAX_SELLABILITY|slice\(|TOP CANDIDATES|best 30|high-signal|final|PROBE_CANDIDATE|candidateCount|MAX_' "$APP/src/scanner.js" | tail -n 160 || true
          echo '=== SCANNER WINDOW ==='
          nl -ba "$APP/src/scanner.js" | sed -n '900,1120p' || true
          echo '=== SAFE SIGNAL MATCHES ==='
          grep -nE 'slice\(|candidate|PROBE_CANDIDATE|routed|blocked|intel|MEME_CONFIRMED|hardReject' "$APP/src/safe-signal-export.js" | tail -n 180 || true
          echo '=== SAFE SIGNAL WINDOW ==='
          nl -ba "$APP/src/safe-signal-export.js" | sed -n '1,320p' || true
          echo '=== LATEST SIGNAL SUMMARY ==='
          python3 -c "import json; d=json.load(open('$APP/runtime-status/signal-snapshot.json')); print({'timestamp':d.get('timestamp'),'count':len(d.get('candidates') or []),'intelSummary':d.get('intelSummary'),'marketRegime':d.get('marketRegime')}); [print({k:x.get(k) for k in ['symbol','score','decision','universeClass','securityDecision','holderClusterDecision','hardReject','token2022','liquidityUsd','priceChange5m','netBuyers5m','sellRoute']}) for x in (d.get('candidates') or [])[:20]]"
