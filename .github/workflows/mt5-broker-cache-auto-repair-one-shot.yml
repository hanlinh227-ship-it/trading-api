name: MT5 Broker Cache Auto Repair One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-broker-cache-auto-repair-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 25
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_ACCOUNT_ENDPOINT: ${{ secrets.MT5_ACCOUNT_ENDPOINT }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}
    steps:
      - name: Auto repair broker cache and verify
        shell: bash
        run: |
          set -euo pipefail
          script=/opt/trading/trading-api-main/.github/scripts/mt5-broker-cache-auto-repair.sh
          sudo git -C /opt/trading/trading-api-main fetch --prune origin main
          sudo git -C /opt/trading/trading-api-main reset --hard origin/main
          sudo chmod +x "$script"
          "$script"
