name: MT5 Broker Cache Auto Repair One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-broker-cache-auto-repair-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  repair:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 25
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_ACCOUNT_ENDPOINT: ${{ secrets.MT5_ACCOUNT_ENDPOINT }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}
    steps:
      - name: Discover verified FivePercent broker cache
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          app=/var/lib/trading/mt5-forex
          canon="$app/wine/drive_c/MT5Forex"
          broker_token=FivePercent
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          echo 'MT5_AUTO_REPAIR_PHASE=DISCOVERY'
          echo "MT5_AUTO_REPAIR_SERVER_NAME=${MT5_ACCOUNT_SERVER:-UNSET}"
          [[ -n "${MT5_ACCOUNT_ENDPOINT:-}" ]] && echo 'MT5_AUTO_REPAIR_ENDPOINT_SECRET=SET' || echo 'MT5_AUTO_REPAIR_ENDPOINT_SECRET=EMPTY'

          has_broker() {
            local f="$1"
            [[ -s "$f" ]] || return 1
            { strings -el "$f" 2>/dev/null || true; strings "$f" 2>/dev/null || true; } | grep -qiF "$broker_token"
          }

          found=''
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            if has_broker "$f"; then found="$f"; echo "MT5_AUTO_REPAIR_LOCAL_CACHE_FOUND=${f%/*}"; break; fi
          done < <(sudo find "$app" -type f -path '*/Config/servers.dat' -printf '%T@ %p\n' 2>/dev/null | sort -nr | cut -d' ' -f2-)

          # Parse The5ers official downloads page for broker-branded MT5 links.
          curl -fsSL --max-time 30 https://lp.the5ers.com/hub-downloads/ -o "$work/the5ers-downloads.html" || true
          grep -Eoi 'https?://[^"<> ]+' "$work/the5ers-downloads.html" 2>/dev/null \
            | sed 's/&amp;/\&/g' \
            | grep -Ei '(mt5|metatrader|fivepercent|\.exe($|\?)|linux)' \
            | sort -u > "$work/official-links.txt" || true
          echo 'MT5_AUTO_REPAIR_OFFICIAL_LINKS_BEGIN'
          sed -E 's#([?&](token|key|sig|signature|auth)=[^& ]+)#\1=REDACTED#gI' "$work/official-links.txt" | head -40 || true
          echo 'MT5_AUTO_REPAIR_OFFICIAL_LINKS_END'

          # Known MetaQuotes broker-package URL patterns. They are only accepted
          # after HTTP success + PE header + a broker cache containing FivePercent.
          cat >> "$work/candidates.txt" <<'EOF'
https://download.mql5.com/cdn/web/five.percent.online.ltd/mt5/fivepercentonline5setup.exe
https://download.terminal.free/cdn/web/five.percent.online.ltd/mt5/fivepercentonline5setup.exe
https://download.terminal.free/cdn/web/five.percent.online.ltd/mt5/mt5setup.exe
https://download.terminal.free/cdn/web/fivepercentonline/mt5/fivepercentonline5setup.exe
EOF
          cat "$work/official-links.txt" >> "$work/candidates.txt" || true
          sort -u "$work/candidates.txt" -o "$work/candidates.txt"

          installer=''
          while IFS= read -r url; do
            [[ -n "$url" ]] || continue
            case "$url" in
              https://lp.the5ers.com/*|https://the5ers.com/*|https://www.the5ers.com/*|https://download.mql5.com/*|https://download.terminal.free/*) ;;
              *) continue ;;
            esac
            out="$work/candidate.exe"
            if curl -fL --connect-timeout 10 --max-time 90 --retry 1 -o "$out" "$url" >/dev/null 2>&1; then
              if [[ $(stat -c%s "$out" 2>/dev/null || echo 0) -gt 100000 ]] && [[ $(xxd -p -l 2 "$out" 2>/dev/null) == 4d5a ]]; then
                installer="$out"
                echo "MT5_AUTO_REPAIR_INSTALLER_SOURCE=$url"
                break
              fi
            fi
          done < "$work/candidates.txt"

          if [[ -z "$found" && -n "$installer" ]]; then
            echo 'MT5_AUTO_REPAIR_ISOLATED_INSTALL=START'
            tp="$work/wine-the5ers"
            mkdir -p "$tp"
            HOME="$work" WINEPREFIX="$tp" WINEDEBUG=-all timeout 180 xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/wineboot -i >/dev/null 2>&1 || true
            HOME="$work" WINEPREFIX="$tp" WINEDEBUG=-all timeout 300 xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/wine "$installer" /auto >/tmp/mt5-the5ers-installer.log 2>&1 || true
            HOME="$work" WINEPREFIX="$tp" /usr/bin/wineserver -k >/dev/null 2>&1 || true
            while IFS= read -r f; do
              if has_broker "$f"; then found="$f"; echo "MT5_AUTO_REPAIR_ISOLATED_CACHE_FOUND=${f%/*}"; break; fi
            done < <(find "$tp" -type f -path '*/Config/servers.dat' -print 2>/dev/null)
          fi

          if [[ -z "$found" ]]; then
            echo 'MT5_AUTO_REPAIR_RESULT=NO_VERIFIED_BROKER_CACHE'
            echo 'MT5_AUTO_REPAIR_ACTION=NO_CANONICAL_CHANGE'
            exit 42
          fi

          echo 'MT5_AUTO_REPAIR_RESULT=VERIFIED_BROKER_CACHE_FOUND'
          sudo systemctl stop mt5-forex-bridge.service || true
          sudo systemctl stop mt5-forex.service || true
          ts=$(date +%Y%m%d%H%M%S)
          sudo install -d -o mt5forex -g mt5forex -m 0750 "$canon/Config"
          if [[ -f "$canon/Config/servers.dat" ]]; then
            sudo cp -a "$canon/Config/servers.dat" "$canon/Config/servers.dat.pre-auto-repair-$ts"
          fi
          sudo install -o mt5forex -g mt5forex -m 0640 "$found" "$canon/Config/servers.dat"

          srcdir=${found%/*}
          while IFS= read -r srv; do
            [[ -n "$srv" ]] || continue
            base=$(basename "$srv")
            sudo install -o mt5forex -g mt5forex -m 0640 "$srv" "$canon/Config/$base"
            echo "MT5_AUTO_REPAIR_SRV_INSTALLED=$base"
          done < <(find "$srcdir" -maxdepth 1 -type f -iname '*FivePercent*.srv' -print 2>/dev/null)

          sudo rm -f "$app/broker-authenticated.marker"
          sudo systemctl reset-failed mt5-forex.service mt5-forex-bridge.service || true
          sudo systemctl restart mt5-forex.service
          sleep 15
          sudo systemctl restart mt5-forex-bridge.service
          sudo systemctl is-active --quiet mt5-forex.service
          sudo systemctl is-active --quiet mt5-forex-bridge.service
          echo 'MT5_AUTO_REPAIR_RUNTIME_RESTART=PASS'

      - name: Verify broker connection after repair
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo -u mt5forex env \
            FOREX_RESEARCH_REPO="$repo" \
            MT5_ACCOUNT_LOGIN="$MT5_ACCOUNT_LOGIN" \
            MT5_ACCOUNT_SERVER="$MT5_ACCOUNT_SERVER" \
            MT5_ACCOUNT_ENDPOINT="${MT5_ACCOUNT_ENDPOINT:-}" \
            MT5_BRIDGE_TOKEN="$MT5_BRIDGE_TOKEN" \
            MT5_HUB_URL="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}" \
            MT5_ALLOW_LIVE="${MT5_ALLOW_LIVE:-false}" \
            MT5_LOCAL_READY_TIMEOUT_SECONDS=420 \
            MT5_SIDECAR_READY_TIMEOUT_SECONDS=120 \
            MT5_HUB_READY_TIMEOUT_SECONDS=180 \
            "$repo/vps/mt5-forex/verify-live-readiness.sh"
          echo 'MT5_AUTO_REPAIR_CONNECTED=PASS'
