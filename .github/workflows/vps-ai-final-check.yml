name: VPS 3AI Final Check

# Manual diagnostic only. Canonical production verification happens in Deploy Bybit Auto Hub.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    env:
      REPORT: /tmp/vps-3ai-final.txt
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Initialize and canonical runtime health
        shell: bash
        run: |
          set -euo pipefail
          : > "$REPORT"
          echo "RUN_ID=$GITHUB_RUN_ID" >> "$REPORT"
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          systemctl is-active --quiet v11-manual-ai-bridge.service
          curl -fsS --max-time 5 http://127.0.0.1:8789/health | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; print("HEALTH mode=%s claude=%s codex=%s deepseek=%s"%(d.get("mode"),(p.get("claude") or {}).get("state"),(p.get("codex") or {}).get("state"),(p.get("deepseek") or {}).get("state")))' >> "$REPORT"
          curl -fsS --max-time 12 'https://trading-v77-scanner.hanlinh227.workers.dev/runtime/contract' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("autoVersion")=="BYBIT-AUTO-1.8.0",d; print("CONTRACT version=%s contract=%s private=%s market=%s"%(d.get("autoVersion"),d.get("version"),d.get("privateTransport"),d.get("marketTransport")))' >> "$REPORT"
          curl -fsS --max-time 12 'https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health' | python3 -c 'import json,sys; d=json.load(sys.stdin); e=d.get("execution") or {}; print("WORKER mode=%s liveAck=%s scheduled=%s ready=%s private=%s market=%s"%(d.get("mode"),e.get("liveAck"),e.get("scheduled"),e.get("ready"),d.get("privateTransport"),d.get("marketTransport")))' >> "$REPORT"

      - name: Test each core AI independently
        shell: bash
        run: |
          set -u
          set -a; source /etc/trading-v11-ai.env; set +a
          for P in claude codex deepseek; do
            BODY="{\"evidence\":{\"mode\":\"BYBIT_SCALP_DECISION\",\"task_id\":\"final-$P\",\"requestedProviders\":[\"$P\"],\"instruction\":\"FINAL_ENTRY_REVIEW_ONLY diagnostic. Do not trade.\",\"context\":{\"reviewPolicy\":\"FINAL_ENTRY_REVIEW_ONLY\",\"setup\":{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"strategy\":\"DIAGNOSTIC_ONLY\",\"score\":95,\"entry\":100000,\"sl\":99500,\"tp\":101000,\"rr\":2,\"spreadBps\":1,\"quoteAgeMs\":100}}}}"
            MAX=18; [ "$P" = claude ] && MAX=35
            OUT="$(curl -sS --max-time "$MAX" -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BODY" || true)"
            printf '%s' "$OUT" | PROVIDER="$P" python3 -c 'import json,sys,os; p=os.environ["PROVIDER"]; raw=sys.stdin.read();
try:
 d=json.loads(raw); x=(d.get("providers") or {}).get(p) or {}; print("SINGLE %s status=%s latency=%s error=%s verdict=%s"%(p,x.get("status"),x.get("latencySeconds"),x.get("error"),(x.get("review") or {}).get("verdict")))
except Exception as e: print("SINGLE %s status=INVALID_RESPONSE error=%s"%(p,e))' >> "$REPORT"
          done

      - name: Test three-AI final review
        shell: bash
        run: |
          set -a; source /etc/trading-v11-ai.env; set +a
          BODY='{"evidence":{"mode":"BYBIT_SCALP_DECISION","task_id":"final-3ai","requestedProviders":["claude","codex","deepseek"],"instruction":"FINAL_ENTRY_REVIEW_ONLY synthetic diagnostic. Do not search symbols. Do not trade.","context":{"reviewPolicy":"FINAL_ENTRY_REVIEW_ONLY","setup":{"symbol":"BTCUSDT","side":"Buy","strategy":"DIAGNOSTIC_ONLY","score":95,"entry":100000,"sl":99500,"tp":101000,"rr":2,"spreadBps":1,"quoteAgeMs":100}}}}'
          OUT="$(curl -sS --max-time 20 -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BODY" || true)"
          printf '%s' "$OUT" | python3 -c 'import json,sys; raw=sys.stdin.read();
try:
 d=json.loads(raw); p=d.get("providers") or {}; print("THREE_AI usable=%s returnedEarly=%s decisionMs=%s claude=%s codex=%s deepseek=%s"%(d.get("usableProviderCount"),d.get("returnedEarly"),d.get("decisionLatencyMs"),(p.get("claude") or {}).get("status"),(p.get("codex") or {}).get("status"),(p.get("deepseek") or {}).get("status")))
except Exception as e: print("THREE_AI INVALID_RESPONSE error=%s"%e)' >> "$REPORT"

      - name: Final safety markers
        shell: bash
        run: |
          echo 'REVIEW_ONLY=PASS' >> "$REPORT"
          echo 'AUTO_RUN_CALLED=NO' >> "$REPORT"
          echo 'ORDER_CREATE_CALLED=NO' >> "$REPORT"
          echo 'ORDER_CANCEL_CALLED=NO' >> "$REPORT"
          echo 'LEVERAGE_CHANGE_CALLED=NO' >> "$REPORT"
          echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$REPORT"
          cat "$REPORT"
