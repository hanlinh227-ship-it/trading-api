name: Fetch Crypto Context H1 Jan-Mar 2026
on:
  push:
    paths:
      - 'scripts/fetch_crypto_context_h1_jan_mar_2026.py'
      - '.github/workflows/fetch-crypto-context-h1-jan-mar-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch context
        run: python scripts/fetch_crypto_context_h1_jan_mar_2026.py
      - name: Freeze context snapshot
        run: |
          git config user.name 'crypto-context-bot'
          git config user.email 'crypto-context-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_context_h1_jan_mar_2026.json
          git commit -m 'Freeze BTC ETH SOL H1 Jan-Mar 2026 context' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
