name: VPS Auto Trade E2E Review

# Manual diagnostic only. Production authority is the canonical Cloudflare deploy workflow
# plus /runtime/contract and /bybit/health. This prevents stale self-hosted runner state
# from creating false red checks on normal main deployments.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    env:
      REPORT: /tmp/vps-auto-e2e-report.txt
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Initialize report
        shell: bash
        run: |
          : > "$REPORT"
          echo "VPS_AUTO_E2E_RUN_ID=$GITHUB_RUN_ID" | tee -a "$REPORT"
          echo "STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a "$REPORT"
          echo "SOURCE_SHA=$GITHUB_SHA" | tee -a "$REPORT"

      - name: VPS and canonical Worker health
        shell: bash
        run: |
          set -euo pipefail
          systemctl is-active --quiet v11-manual-ai-bridge.service
          echo 'VPS_AI_BRIDGE_SERVICE=ACTIVE' | tee -a "$REPORT"
          curl -fsS --max-time 10 'https://api.bybit.com/v5/market/time' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("retCode")==0,d; print("BYBIT_PUBLIC_NETWORK=PASS")' | tee -a "$REPORT"
          curl -fsS --max-time 15 'https://trading-v77-scanner.hanlinh227.workers.dev/runtime/contract' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("autoVersion")=="BYBIT-AUTO-1.8.0",d; assert d.get("executionAuthority")=="BYBIT_AUTO_TRADE_ONLY",d; print("RUNTIME_CONTRACT=PASS version=%s contract=%s"%(d.get("autoVersion"),d.get("version")))' | tee -a "$REPORT"
          curl -fsS --max-time 15 'https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health' | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("exchange")=="BYBIT",d; ex=d.get("execution") or {}; print("WORKER_HEALTH=PASS mode=%s liveAck=%s scheduled=%s ready=%s private=%s market=%s"%(d.get("mode"),ex.get("liveAck"),ex.get("scheduled"),ex.get("ready"),d.get("privateTransport"),d.get("marketTransport")))' | tee -a "$REPORT"
          curl -fsS --max-time 5 http://127.0.0.1:8789/health | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; print("AI_HEALTH mode=%s claude=%s codex=%s deepseek=%s"%(d.get("mode"),(p.get("claude") or {}).get("state"),(p.get("codex") or {}).get("state"),(p.get("deepseek") or {}).get("state")))' | tee -a "$REPORT"

      - name: Test each core AI independently
        shell: bash
        run: |
          set -u
          set -a; source /etc/trading-v11-ai.env; set +a
          for P in claude codex deepseek; do
            BODY="{\"evidence\":{\"mode\":\"BYBIT_SCALP_DECISION\",\"task_id\":\"e2e-$P\",\"requestedProviders\":[\"$P\"],\"instruction\":\"FINAL_ENTRY_REVIEW_ONLY diagnostic. Do not trade.\",\"context\":{\"reviewPolicy\":\"FINAL_ENTRY_REVIEW_ONLY\",\"setup\":{\"symbol\":\"BTCUSDT\",\"side\":\"Buy\",\"strategy\":\"DIAGNOSTIC_ONLY\",\"score\":95,\"entry\":100000,\"sl\":99500,\"tp\":101000,\"rr\":2,\"spreadBps\":1,\"quoteAgeMs\":100}}}}"
            MAX=18; [ "$P" = claude ] && MAX=35
            OUT="$(curl -sS --max-time "$MAX" -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BODY" || true)"
            printf '%s' "$OUT" | PROVIDER="$P" python3 -c 'import json,sys,os; p=os.environ["PROVIDER"]; raw=sys.stdin.read();
try:
 d=json.loads(raw); x=(d.get("providers") or {}).get(p) or {}; print("SINGLE %s status=%s latency=%s error=%s verdict=%s"%(p,x.get("status"),x.get("latencySeconds"),x.get("error"),(x.get("review") or {}).get("verdict")))
except Exception as e: print("SINGLE %s status=INVALID_RESPONSE error=%s"%(p,e))' | tee -a "$REPORT"
          done

      - name: Three-AI final-entry review test
        shell: bash
        run: |
          set -u
          set -a; source /etc/trading-v11-ai.env; set +a
          BODY='{"evidence":{"mode":"BYBIT_SCALP_DECISION","task_id":"e2e-3ai","requestedProviders":["claude","codex","deepseek"],"instruction":"FINAL_ENTRY_REVIEW_ONLY synthetic diagnostic. Do not search symbols. Do not trade.","context":{"reviewPolicy":"FINAL_ENTRY_REVIEW_ONLY","setup":{"symbol":"BTCUSDT","side":"Buy","strategy":"DIAGNOSTIC_ONLY","score":95,"entry":100000,"sl":99500,"tp":101000,"rr":2,"spreadBps":1,"quoteAgeMs":100}}}}'
          OUT="$(curl -sS --max-time 20 -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BODY" || true)"
          printf '%s' "$OUT" | python3 -c 'import json,sys; raw=sys.stdin.read();
try:
 d=json.loads(raw); p=d.get("providers") or {}; print("THREE_AI usable=%s returnedEarly=%s decisionMs=%s claude=%s codex=%s deepseek=%s"%(d.get("usableProviderCount"),d.get("returnedEarly"),d.get("decisionLatencyMs"),(p.get("claude") or {}).get("status"),(p.get("codex") or {}).get("status"),(p.get("deepseek") or {}).get("status")))
except Exception as e: print("THREE_AI status=INVALID_RESPONSE error=%s"%e)' | tee -a "$REPORT"

      - name: Safety markers
        shell: bash
        run: |
          {
            echo 'REVIEW_ONLY=PASS'
            echo 'AUTO_RUN_CALLED=NO'
            echo 'ORDER_CREATE_CALLED=NO'
            echo 'ORDER_CANCEL_CALLED=NO'
            echo 'LEVERAGE_CHANGE_CALLED=NO'
            echo "FINISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee -a "$REPORT"
