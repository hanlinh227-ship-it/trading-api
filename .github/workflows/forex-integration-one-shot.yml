name: Forex Integration One Shot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/forex-integration-one-shot.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/forex-runtime-vps-repair-20260827
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Import owned files only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin chatgpt/forex-runtime-hardening-20260827 claude/mt5-vps-bootstrap-repair-20260827
          git checkout origin/chatgpt/forex-runtime-hardening-20260827 -- \
            cloudflare-worker/forex-autonomous-mt5-bridge.js \
            cloudflare-worker/validate-forex-auto.mjs \
            cloudflare-worker/validate-forex-runtime.mjs
          git checkout origin/claude/mt5-vps-bootstrap-repair-20260827 -- \
            vps/mt5-forex/run-mt5-forex.sh \
            vps/mt5-forex/verify-live-readiness.sh \
            vps/mt5-forex/forex-mt5-sidecar.py \
            vps/mt5-forex/install-mt5-forex.sh \
            vps/mt5-forex/mt5-forex.service
      - name: Align final stale worker validator
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/validate-worker.mjs')
          s=p.read_text()
          old="need(fxcfg,['FOREX-AUTO-0.6.3-USER-CAMPAIGN-510-3D','AUTONOMOUS_2AI_PAPER','MT5_WINDOWS','PURE_AI_DISCRETIONARY_INTRADAY_ULTRA_LOW_LATENCY','aiProviders:[\"chatgpt\",\"claude\"]','scanEverySec:2','mt5SnapshotEverySec:1','positionManagementEverySec:2','hardMaxRiskPct:1.00','maxTotalOpenRiskPct:3.75','minRR:1.5','maxQuoteAgeSec:5','decisionTtlSec:6','maxEntryDriftAtr:.10','ruleBasedSignalAuthority:false','precomputedScoreAuthority:false','confidenceGateAuthority:false','rawMt5CandlesArePrimaryEvidence:true','alternateTradeSide:true','dailyObjective:{','minProfitPct:1.00','USER_SET_RUNTIME_TARGET_ONLY','management:{','authority:\"AI_ONLY\"','quotaCooldownHours:5','openAiMaxOutputTokens:12000','claudeMaxOutputTokens:12000','liveEnabled:false'],'FOREX_CONFIG');"
          new="need(fxcfg,['FOREX-AUTO-0.7.0-FREE-SIDE-2AI','AUTONOMOUS_2AI','MT5_WINDOWS','PURE_AI_DISCRETIONARY_INTRADAY_FREER_ENTRY','aiProviders:[\"chatgpt\",\"claude\"]','scanEverySec:2','mt5SnapshotEverySec:1','positionManagementEverySec:2','hardMaxRiskPct:1.00','maxTotalOpenRiskPct:3.75','minRR:1.5','maxQuoteAgeSec:5','decisionTtlSec:8','maxEntryDriftAtr:.10','ruleBasedSignalAuthority:false','precomputedScoreAuthority:false','confidenceGateAuthority:false','rawMt5CandlesArePrimaryEvidence:true','alternateTradeSide:false','sidePolicy:\"FREE_WITH_ANTI_BIAS_STREAK_CAP\"','maxConsecutiveSameSide:3','dailyObjective:{','minProfitPct:1.00','USER_SET_RUNTIME_TARGET_ONLY','management:{','authority:\"AI_ONLY\"','quotaCooldownHours:5','openAiMaxOutputTokens:16000','claudeMaxOutputTokens:16000','liveEnabled:false'],'FOREX_CONFIG');"
          if old not in s: raise SystemExit('STALE_FXCFG_ASSERTION_NOT_FOUND')
          s=s.replace(old,new)
          s=s.replace("'BUY->SELL->BUY->SELL','expectedNextSide'","'FREE_SIDE_WITH_ANTI_BIAS','expectedNextSide'")
          s=s.replace("'ALTERNATION_HARD_LOCK','PRICE_DRIFT_RETHINK'","'SIDE_STREAK_CAP_3','PRICE_DRIFT_RETHINK'")
          s=s.replace('Forex 0.6.3 user campaign','Forex 0.7.0 free-side 2AI')
          p.write_text(s)
          PY
          git add cloudflare-worker/validate-worker.mjs
          ACTUAL="$(git diff --name-only --cached | sort)"
          EXPECTED="$(printf '%s\n' \
            cloudflare-worker/forex-autonomous-mt5-bridge.js \
            cloudflare-worker/validate-forex-auto.mjs \
            cloudflare-worker/validate-forex-runtime.mjs \
            cloudflare-worker/validate-worker.mjs \
            vps/mt5-forex/forex-mt5-sidecar.py \
            vps/mt5-forex/install-mt5-forex.sh \
            vps/mt5-forex/mt5-forex.service \
            vps/mt5-forex/run-mt5-forex.sh \
            vps/mt5-forex/verify-live-readiness.sh | sort)"
          printf '%s\n' "$ACTUAL"
          [[ "$ACTUAL" == "$EXPECTED" ]] || { echo 'OWNERSHIP_FILESET_MISMATCH'; exit 90; }
      - name: Validate JS and Forex runtime
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/forex-autonomous-mt5-bridge.js
          node --check cloudflare-worker/validate-forex-auto.mjs
          node --check cloudflare-worker/validate-forex-runtime.mjs
          node --check cloudflare-worker/validate-worker.mjs
          node cloudflare-worker/validate-forex-auto.mjs
          node cloudflare-worker/validate-forex-runtime.mjs
          (cd cloudflare-worker && node validate-worker.mjs)
      - name: Validate VPS scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n vps/mt5-forex/run-mt5-forex.sh
          bash -n vps/mt5-forex/verify-live-readiness.sh
          bash -n vps/mt5-forex/install-mt5-forex.sh
          python3 -m py_compile vps/mt5-forex/forex-mt5-sidecar.py
      - name: Commit integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/forex-autonomous-mt5-bridge.js \
                  cloudflare-worker/validate-forex-auto.mjs \
                  cloudflare-worker/validate-forex-runtime.mjs \
                  cloudflare-worker/validate-worker.mjs \
                  vps/mt5-forex/run-mt5-forex.sh \
                  vps/mt5-forex/verify-live-readiness.sh \
                  vps/mt5-forex/forex-mt5-sidecar.py \
                  vps/mt5-forex/install-mt5-forex.sh \
                  vps/mt5-forex/mt5-forex.service
          git commit -m 'fix(forex): integrate Cloudflare hardening and MT5 VPS bootstrap repair'
          git push origin HEAD:integration/forex-runtime-vps-repair-20260827
