name: Fetch Crypto H1 Apr-Jul 2026
on:
  push:
    paths:
      - 'scripts/fetch_crypto_h1_apr_jul_2026.py'
      - '.github/workflows/fetch-crypto-h1-apr-jul-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch public H1 data for 61 coins
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_crypto_h1_apr_jul_2026.py
      - name: Freeze snapshot
        run: |
          git config user.name 'crypto-h1-snapshot-bot'
          git config user.email 'crypto-h1-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_h1_apr_jul_2026.json
          git commit -m 'Freeze 61-symbol crypto H1 Apr-Jul 2026 snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
