name: V77.18.33 Split Market Live
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.head_ref == 'v771833-split-live'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771833-split-live
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply split live patch
        run: python3 scripts/patch_v771833_split_live.py
      - name: Validate source bundle
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771833-dist
      - name: Commit production source only
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/hub-v77171.js cloudflare-worker/engine-v77168.js cloudflare-worker/index.js
          git commit -m "V77.18.33 Split market live UX" || exit 0
          git push origin HEAD:v771833-split-live
