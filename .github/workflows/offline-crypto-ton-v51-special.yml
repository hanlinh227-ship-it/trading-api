name: Offline Crypto TON V51 Special
on:
  push:
    paths:
      - 'scripts/offline_crypto_ton_v51_special.py'
      - '.github/workflows/offline-crypto-ton-v51-special.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run TON-only daily walk-forward
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_ton_v51_special.py
