name: Fetch Market Data

on:
  push:
    paths:
      - "request.json"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read requested symbol
        id: symbol
        shell: bash
        run: |
          SYMBOL=$(python3 -c "import json; print(json.load(open('request.json'))['symbol'].upper())")
          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"
          echo "Requested symbol: $SYMBOL"

      - name: Fetch market data
        shell: bash
        run: |
          mkdir -p data

          SYMBOL="${{ steps.symbol.outputs.symbol }}"
          URL="https://forex-chart-api.hanlinh227.workers.dev/analysis/$SYMBOL"

          echo "Fetching market data for $SYMBOL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --output data/latest.tmp.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Worker returned HTTP $HTTP_CODE"
            cat data/latest.tmp.json
            exit 1
          fi

      - name: Validate and create compact files
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          source = "data/latest.tmp.json"

          try:
              with open(source, "r", encoding="utf-8") as f:
                  market = json.load(f)
          except Exception as e:
              print("Invalid JSON:", e)
              sys.exit(1)

          if market.get("status") not in ("ok", "partial"):
              print("Worker status:", market.get("status"))
              print(market)
              sys.exit(1)

          if not market.get("symbol"):
              print("Missing symbol")
              sys.exit(1)

          with open("request.json", "r", encoding="utf-8") as f:
              request = json.load(f)

          # Keep full raw payload for audit/reprocessing.
          with open("data/latest.json", "w", encoding="utf-8") as f:
              json.dump(market, f, ensure_ascii=False, separators=(",", ":"))

          frames = {}
          for key in ["D1", "H4", "H1", "M15", "M5"]:
              frame = (market.get("timeframes") or {}).get(key) or {}
              candles = frame.get("candles") or []
              frames[key] = {
                  "status": frame.get("status"),
                  "interval": frame.get("interval"),
                  "latestCandle": frame.get("latestCandle"),
                  "summary": frame.get("summary"),
                  "recentCandles": candles[-12:]
              }

          status = {
              "requestedSymbol": request["symbol"].upper(),
              "returnedSymbol": market.get("symbol"),
              "marketSymbol": market.get("marketSymbol"),
              "marketType": market.get("marketType"),
              "currentPrice": market.get("currentPrice"),
              "currentPriceTime": market.get("currentPriceTime"),
              "dataAgeSeconds": market.get("dataAgeSeconds"),
              "stale": market.get("stale"),
              "analysisReady": market.get("analysisReady"),
              "successfulFrames": market.get("successfulFrames"),
              "failedFrames": market.get("failedFrames"),
              "frames": frames,
              "updatedAt": datetime.now(timezone.utc).isoformat()
          }

          with open("data/status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)

          print("Symbol:", market.get("symbol"))
          print("Current price:", market.get("currentPrice"))
          print("Analysis ready:", market.get("analysisReady"))
          PY

      - name: Commit market data
        shell: bash
        run: |
          rm -f data/latest.tmp.json

          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"

          git add data/latest.json data/status.json

          if git diff --cached --quiet; then
            echo "No market data changes."
            exit 0
          fi

          git commit -m "Update market data for ${{ steps.symbol.outputs.symbol }}"
          git push
