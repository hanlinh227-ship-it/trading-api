name: Fetch Market Data — V74

on:
  push:
    paths:
      - "request.json"
  workflow_dispatch:

permissions:
  contents: write

# One canonical single-symbol live-data path.
# The shared Twelve Data lock prevents this workflow from colliding with
# the 28-pair Grow 55 Forex scan. Crypto is exchange-native but remains
# serialized here so data/latest.json and data/status.json cannot race.
concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  fetch-market:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and classify requested symbol
        id: symbol
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json

          FOREX = {
              "USD","EUR","GBP","JPY","CHF","CAD","AUD","NZD",
              "SGD","HKD","NOK","SEK","DKK","PLN","CZK","HUF",
              "MXN","ZAR","TRY","CNH","CNY"
          }
          CRYPTO_QUOTES = ["FDUSD","USDT","USDC","USD","BTC","ETH","BNB","EUR"]
          EXPLICIT_NON_CRYPTO = {
              "XAUUSD","GOLD","XAGUSD","SILVER","XPTUSD","XPDUSD",
              "SPX","SP500","US500","SPX500","NDX","NAS100","NASDAQ100","USTEC",
              "IXIC","NASDAQ","DJI","US30","DOW","N225","JP225","NIKKEI","NIKKEI225",
              "DAX","DEX","DE40","GER40","FTSE","UK100","CAC","FR40","HSI","VIX","RUT",
              "NQ","MNQ","ES","MES","GC","SI","CL"
          }

          with open("request.json", "r", encoding="utf-8") as f:
              request = json.load(f)

          symbol = str(request["symbol"]).upper()
          for ch in "/-_ :":
              symbol = symbol.replace(ch, "")

          is_crypto = False
          if symbol not in EXPLICIT_NON_CRYPTO:
              is_forex = False
              if len(symbol) == 6 and symbol.isalpha():
                  base, quote = symbol[:3], symbol[3:]
                  is_forex = base in FOREX and quote in FOREX and base != quote

              if not is_forex:
                  for quote in CRYPTO_QUOTES:
                      if symbol.endswith(quote):
                          base = symbol[:-len(quote)]
                          if 2 <= len(base) <= 20 and base.isalnum() and base != quote:
                              is_crypto = True
                              break

          print(f"symbol={symbol}")
          print(f"is_crypto={'true' if is_crypto else 'false'}")
          PY

          echo "Requested: ${{ steps.symbol.outputs.symbol }}"
          echo "Crypto: ${{ steps.symbol.outputs.is_crypto }}"

      - name: Fetch crypto from exchange-native APIs
        if: steps.symbol.outputs.is_crypto == 'true'
        shell: bash
        run: |
          mkdir -p data
          python3 scripts/fetch_crypto.py "${{ steps.symbol.outputs.symbol }}" data

      - name: Fetch non-crypto analysis + latest price + M1 reference
        if: steps.symbol.outputs.is_crypto != 'true'
        shell: bash
        env:
          SYMBOL: ${{ steps.symbol.outputs.symbol }}
        run: |
          mkdir -p data
          python3 <<'PY'
          import concurrent.futures
          import json
          import os
          import urllib.request

          symbol = os.environ["SYMBOL"]
          base = "https://forex-chart-api.hanlinh227.workers.dev"
          targets = {
              "analysis": f"{base}/analysis/{symbol}",
              "price": f"{base}/price/{symbol}",
              "refresh": f"{base}/refresh/{symbol}",
          }

          def fetch(item):
              name, url = item
              req = urllib.request.Request(url, headers={"User-Agent": "trading-api-v74/1.0"})
              with urllib.request.urlopen(req, timeout=45) as response:
                  return name, json.loads(response.read().decode("utf-8"))

          results = {}
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
              futures = [pool.submit(fetch, item) for item in targets.items()]
              for future in concurrent.futures.as_completed(futures):
                  name, data = future.result()
                  results[name] = data

          required = set(targets)
          if set(results) != required:
              raise SystemExit(f"Missing provider result: {required - set(results)}")

          with open("data/analysis.tmp.json", "w", encoding="utf-8") as f:
              json.dump(results["analysis"], f, ensure_ascii=False)
          with open("data/price.tmp.json", "w", encoding="utf-8") as f:
              json.dump(results["price"], f, ensure_ascii=False)
          with open("data/refresh.tmp.json", "w", encoding="utf-8") as f:
              json.dump(results["refresh"], f, ensure_ascii=False)
          PY

      - name: Validate and normalize live market output
        shell: bash
        env:
          SYMBOL: ${{ steps.symbol.outputs.symbol }}
          IS_CRYPTO: ${{ steps.symbol.outputs.is_crypto }}
        run: |
          python3 <<'PY'
          import json
          import os
          import sys
          from datetime import datetime, timezone

          symbol = os.environ["SYMBOL"]
          is_crypto = os.environ["IS_CRYPTO"] == "true"
          now = datetime.now(timezone.utc)

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          analysis = load("data/analysis.tmp.json")
          refresh = load("data/refresh.tmp.json")
          price = refresh if is_crypto else load("data/price.tmp.json")

          if analysis.get("symbol") != symbol:
              raise SystemExit(f"Analysis symbol mismatch: {analysis.get('symbol')} != {symbol}")
          if analysis.get("status") not in ("ok", "partial"):
              raise SystemExit("Analysis provider returned error")
          if analysis.get("analysisReady") is not True:
              raise SystemExit("analysisReady=false")
          if analysis.get("successfulFrames") != 5 or analysis.get("failedFrames", 0) != 0:
              raise SystemExit("Full analysis is not 5/5")

          if price.get("symbol") != symbol:
              raise SystemExit(f"Price symbol mismatch: {price.get('symbol')} != {symbol}")
          if price.get("status") not in ("ok", "partial"):
              raise SystemExit("Price provider returned error")
          if price.get("currentPrice") is None:
              raise SystemExit("Missing currentPrice")

          frames = {}
          for key in ["D1", "H4", "H1", "M15", "M5"]:
              frame = (analysis.get("timeframes") or {}).get(key) or {}
              candles = frame.get("candles") or []
              frames[key] = {
                  "status": frame.get("status"),
                  "interval": frame.get("interval"),
                  "latestCandle": frame.get("latestCandle"),
                  "summary": frame.get("summary"),
                  "recentCandles": candles[-15:],
              }

          m1_frame = (refresh.get("timeframes") or {}).get("M1") or {}
          m1_candles = m1_frame.get("candles") or []

          if is_crypto:
              quote_age_ms = refresh.get("quoteAgeMs")
              bid = refresh.get("bid")
              ask = refresh.get("ask")
              spread_verified = bid is not None and ask is not None
              quote_timestamp_verified = refresh.get("currentPriceTime") is not None
              strict_price_fresh = (
                  quote_timestamp_verified
                  and quote_age_ms is not None
                  and quote_age_ms <= 10_000
                  and refresh.get("stale") is not True
              )
              execution_ready = bool(strict_price_fresh and spread_verified and refresh.get("symbolVerified") is True)
              price_time = refresh.get("currentPriceTime")
              freshness_type = "EXCHANGE_QUOTE_TIMESTAMP"
          else:
              # Twelve Data /price is the latest aggregated price but this
              # integration does not receive an executable broker bid/ask or
              # a quote tick timestamp from /price. Keep those facts explicit.
              bid = price.get("bid")
              ask = price.get("ask")
              spread_verified = bid is not None and ask is not None
              quote_timestamp_verified = False
              strict_price_fresh = False
              execution_ready = False
              price_time = None
              quote_age_ms = None
              freshness_type = "FETCH_TIME_ONLY"

          status = {
              "requestedSymbol": symbol,
              "returnedSymbol": analysis.get("symbol"),
              "marketSymbol": price.get("marketSymbol") or analysis.get("marketSymbol"),
              "marketType": price.get("marketType") or analysis.get("marketType"),
              "provider": price.get("provider") or analysis.get("provider"),
              "sourceExchange": price.get("sourceExchange") or analysis.get("sourceExchange"),
              "sourceType": price.get("sourceType") or analysis.get("sourceType"),
              "analysisGeneratedAt": analysis.get("generatedAt"),
              "priceFetchedAt": price.get("generatedAt"),
              "currentPrice": price.get("currentPrice"),
              "currentPriceTime": price_time,
              "priceType": price.get("priceType"),
              "bid": bid,
              "ask": ask,
              "spread": (ask - bid) if bid is not None and ask is not None else None,
              "quoteAgeMs": quote_age_ms,
              "quoteTimestampVerified": quote_timestamp_verified,
              "priceFreshnessType": freshness_type,
              "strictV74PriceFresh": strict_price_fresh,
              "executionSpreadVerified": spread_verified,
              "executionReady": execution_ready,
              "marketClosedPossible": refresh.get("marketClosedPossible"),
              "symbolVerified": refresh.get("symbolVerified", analysis.get("symbol") == symbol),
              "analysisReady": True,
              "successfulFrames": 5,
              "failedFrames": 0,
              "frames": frames,
              "M1Reference": {
                  "latestCandle": m1_frame.get("latestCandle"),
                  "summary": m1_frame.get("summary"),
                  "recentCandles": m1_candles[-15:],
                  "dataAgeSeconds": refresh.get("dataAgeSeconds"),
                  "note": "M1 candle is context/reference only; do not substitute its close for the final live price."
              },
              "dataIntegrity": {
                  "latestPriceFetched": True,
                  "exactQuoteTimestampVerified": quote_timestamp_verified,
                  "spreadVerified": spread_verified,
                  "marketEntryNeedsVenueConfirmation": not execution_ready,
              },
              "updatedAt": now.isoformat(),
          }

          with open("data/status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)

          combined = {
              "analysis": analysis,
              "latestPrice": price,
              "m1Reference": refresh,
          }
          with open("data/latest.json", "w", encoding="utf-8") as f:
              json.dump(combined, f, ensure_ascii=False, separators=(",", ":"))

          print(json.dumps({
              "symbol": symbol,
              "marketType": status["marketType"],
              "provider": status["provider"],
              "currentPrice": status["currentPrice"],
              "quoteTimestampVerified": status["quoteTimestampVerified"],
              "executionSpreadVerified": status["executionSpreadVerified"],
              "strictV74PriceFresh": status["strictV74PriceFresh"],
              "executionReady": status["executionReady"],
              "frames": "5/5",
          }, ensure_ascii=False, indent=2))
          PY

      - name: Clean temporary files
        shell: bash
        run: rm -f data/analysis.tmp.json data/price.tmp.json data/refresh.tmp.json

      - name: Commit fresh market data
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/latest.json data/status.json

          if git diff --cached --quiet; then
            echo "No market-data changes."
            exit 0
          fi

          git commit -m "Refresh live market data for ${{ steps.symbol.outputs.symbol }}"

      - name: Sync and push safely
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "^Refresh live market data for"; then
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Nothing to push."
          fi
