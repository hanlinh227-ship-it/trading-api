name: Fetch Market Data — Canonical

on:
  push:
    paths:
      - "request.json"
  workflow_dispatch:

permissions:
  contents: write

# Twelve Data calls share one quota lock with the Forex universe scanner.
concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read request and classify crypto route
        id: request
        shell: bash
        run: |
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("request.json", "r", encoding="utf-8") as f:
              raw = str(json.load(f)["symbol"]).upper()
          symbol = "".join(ch for ch in raw if ch.isalnum())
          crypto_quotes = ("FDUSD","USDT","USDC","USD","BTC","ETH","BNB","EUR")
          noncrypto_reserved = {
              "XAUUSD","XAGUSD","XPTUSD","XPDUSD","WTIUSD","BRENTUSD",
              "NAS100","NASDAQ100","USTEC","NDX","SPX","SP500","US500","SPX500",
              "DJI","US30","DOW","N225","JP225","NIKKEI","NIKKEI225",
              "DAX","GDAXI","DE40","GER40","FTSE","UK100","CAC","FR40","HSI","VIX","RUT",
              "NQ","MNQ","ES","MES","GC","SI","CL","GOLD","SILVER","WTI","BRENT",
          }
          is_crypto = False
          if symbol not in noncrypto_reserved:
              for q in crypto_quotes:
                  if symbol.endswith(q) and len(symbol) > len(q) + 1:
                      is_crypto = True
                      break
          print(f"symbol={symbol}")
          print(f"is_crypto={'true' if is_crypto else 'false'}")
          PY
          echo "Requested: ${{ steps.request.outputs.symbol }}"
          echo "Crypto route: ${{ steps.request.outputs.is_crypto }}"

      - name: Fetch crypto from exchange-native APIs
        if: steps.request.outputs.is_crypto == 'true'
        shell: bash
        run: |
          mkdir -p data
          python3 scripts/fetch_crypto.py "${{ steps.request.outputs.symbol }}" data
          python3 <<'PY'
          import json
          from datetime import datetime, timezone

          def load(path):
              with open(path, "r", encoding="utf-8") as f:
                  return json.load(f)

          analysis = load("data/analysis.tmp.json")
          refresh = load("data/refresh.tmp.json")
          now = datetime.now(timezone.utc).isoformat()
          age = refresh.get("quoteAgeMs")
          bid, ask = refresh.get("bid"), refresh.get("ask")
          spread_ok = bid is not None and ask is not None
          quote_ok = refresh.get("currentPriceTime") is not None and age is not None
          strict = bool(quote_ok and age <= 10000 and refresh.get("stale") is not True)
          ready = bool(strict and spread_ok and refresh.get("symbolVerified") is True and analysis.get("analysisReady") is True)

          status = {
              "status": "ok" if analysis.get("analysisReady") is True else "partial",
              "requestedSymbol": analysis.get("symbol"),
              "returnedSymbol": analysis.get("symbol"),
              "marketSymbol": analysis.get("marketSymbol"),
              "marketType": "crypto",
              "provider": refresh.get("provider"),
              "sourceExchange": refresh.get("sourceExchange"),
              "sourceType": refresh.get("sourceType"),
              "currentPrice": refresh.get("currentPrice"),
              "currentPriceTime": refresh.get("currentPriceTime"),
              "priceFetchedAt": refresh.get("generatedAt"),
              "priceType": refresh.get("priceType"),
              "bid": bid,
              "ask": ask,
              "spread": (ask-bid) if spread_ok else None,
              "quoteAgeMs": age,
              "quoteTimestampVerified": quote_ok,
              "priceFreshnessType": "EXCHANGE_QUOTE_TIMESTAMP",
              "strictV74PriceFresh": strict,
              "executionSpreadVerified": spread_ok,
              "executionReady": ready,
              "symbolVerified": refresh.get("symbolVerified") is True,
              "analysisReady": analysis.get("analysisReady") is True,
              "successfulFrames": analysis.get("successfulFrames"),
              "failedFrames": analysis.get("failedFrames"),
              "frames": analysis.get("timeframes"),
              "M1Reference": (refresh.get("timeframes") or {}).get("M1"),
              "dataIntegrity": {
                  "canonicalMappingVerified": True,
                  "exactQuoteTimestampVerified": quote_ok,
                  "spreadVerified": spread_ok,
                  "marketEntryNeedsVenueConfirmation": not ready,
              },
              "updatedAt": now,
          }
          latest = {"analysis": analysis, "refresh": refresh, "updatedAt": now}
          with open("data/status.json", "w", encoding="utf-8") as f:
              json.dump(status, f, ensure_ascii=False, indent=2)
          with open("data/latest.json", "w", encoding="utf-8") as f:
              json.dump(latest, f, ensure_ascii=False, separators=(",", ":"))
          print(json.dumps({k:status.get(k) for k in ("requestedSymbol","marketSymbol","provider","currentPrice","currentPriceTime","quoteAgeMs","executionReady")}, ensure_ascii=False, indent=2))
          PY

      - name: Fetch supported non-crypto directly from Twelve Data
        if: steps.request.outputs.is_crypto != 'true'
        shell: bash
        run: |
          mkdir -p data
          python3 scripts/twelvedata_market.py "${{ steps.request.outputs.symbol }}" data

      - name: Clean temporary files
        shell: bash
        run: rm -f data/analysis.tmp.json data/refresh.tmp.json data/quote.tmp.json data/*.tmp.json

      - name: Commit canonical market state
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/status.json data/latest.json
          if git diff --cached --quiet; then
            echo "No market-data changes."
            exit 0
          fi
          git commit -m "Refresh canonical market data for ${{ steps.request.outputs.symbol }}"
          git pull --rebase origin main
          git push origin HEAD:main
