name: Fetch Market Data

on:
  push:
    paths:
      - "request.json"

  workflow_dispatch:

permissions:
  contents: write

# =========================================================
# KHÔNG CHO WORKFLOW NÀY CHẠY SONG SONG VỚI FOREX SCAN
# Cả 2 cùng dùng Twelve Data nên phải xếp hàng.
# =========================================================

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  fetch-market:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # READ SYMBOL
      # =====================================================

      - name: Read requested symbol
        id: symbol
        shell: bash
        run: |
          SYMBOL=$(python3 - <<'PY'
          import json

          with open("request.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          print(data["symbol"].upper())
          PY
          )

          echo "symbol=$SYMBOL" >> "$GITHUB_OUTPUT"

          echo "Requested symbol: $SYMBOL"

      # =====================================================
      # FULL ANALYSIS
      # D1 + H4 + H1 + M15 + M5
      # =====================================================

      - name: Fetch full analysis
        shell: bash
        run: |
          mkdir -p data

          SYMBOL="${{ steps.symbol.outputs.symbol }}"

          URL="https://forex-chart-api.hanlinh227.workers.dev/analysis/$SYMBOL"

          echo "Fetching full analysis for $SYMBOL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 3 \
            --output data/analysis.tmp.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Analysis HTTP request failed"
            cat data/analysis.tmp.json
            exit 1
          fi

      # =====================================================
      # VALIDATE ANALYSIS JSON
      # =====================================================

      - name: Validate full analysis
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys

          try:
              with open(
                  "data/analysis.tmp.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  data = json.load(f)

          except Exception as e:
              print("Invalid analysis JSON:", e)
              sys.exit(1)

          if data.get("status") not in ("ok", "partial"):
              print("Analysis API returned error:")
              print(json.dumps(data, indent=2))
              sys.exit(1)

          if data.get("successfulFrames") != 5:
              print("Analysis did not return 5/5 frames.")
              print(json.dumps(data.get("frameStatus"), indent=2))
              sys.exit(1)

          if not data.get("analysisReady"):
              print("analysisReady is false.")
              sys.exit(1)

          print("Full analysis validated: 5/5")
          PY

      # =====================================================
      # M1 REFRESH
      # =====================================================

      - name: Fetch latest M1 price
        shell: bash
        run: |
          SYMBOL="${{ steps.symbol.outputs.symbol }}"

          URL="https://forex-chart-api.hanlinh227.workers.dev/refresh/$SYMBOL"

          echo "Refreshing M1 for $SYMBOL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --location \
            --retry 2 \
            --retry-delay 3 \
            --output data/refresh.tmp.json \
            --write-out "%{http_code}" \
            "$URL")

          echo "HTTP: $HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Refresh HTTP request failed"
            cat data/refresh.tmp.json
            exit 1
          fi

      # =====================================================
      # VALIDATE + CREATE OUTPUT
      # =====================================================

      - name: Validate and merge market data
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys
          from datetime import datetime, timezone

          with open(
              "request.json",
              "r",
              encoding="utf-8"
          ) as f:
              request = json.load(f)

          requested_symbol = request["symbol"].upper()

          try:

              with open(
                  "data/analysis.tmp.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  analysis = json.load(f)

              with open(
                  "data/refresh.tmp.json",
                  "r",
                  encoding="utf-8"
              ) as f:
                  refresh = json.load(f)

          except Exception as e:

              print("Invalid JSON:", e)
              sys.exit(1)

          # ==================================================
          # SYMBOL CHECK
          # ==================================================

          if analysis.get("symbol") != requested_symbol:
              print(
                  "Wrong analysis symbol:",
                  analysis.get("symbol"),
                  "expected:",
                  requested_symbol
              )
              sys.exit(1)

          if refresh.get("symbol") != requested_symbol:
              print(
                  "Wrong refresh symbol:",
                  refresh.get("symbol"),
                  "expected:",
                  requested_symbol
              )
              sys.exit(1)

          # ==================================================
          # ANALYSIS CHECK
          # ==================================================

          if analysis.get("status") not in ("ok", "partial"):
              print("Analysis error:")
              print(json.dumps(analysis, indent=2))
              sys.exit(1)

          if not analysis.get("analysisReady"):
              print("Analysis is not ready")
              sys.exit(1)

          if analysis.get("successfulFrames") != 5:
              print("Not all analysis frames succeeded")
              sys.exit(1)

          if analysis.get("failedFrames") != 0:
              print("Analysis has failed frames")
              sys.exit(1)

          # ==================================================
          # REFRESH CHECK
          # ==================================================

          if refresh.get("status") not in ("ok", "partial"):
              print("Refresh returned API error:")
              print(json.dumps(refresh, indent=2))
              sys.exit(1)

          live_price = refresh.get("currentPrice")
          live_time = refresh.get("currentPriceTime")
          live_age = refresh.get("dataAgeSeconds")
          live_stale = refresh.get("stale")

          if live_price is None:
              print("Missing currentPrice")
              sys.exit(1)

          if live_time is None:
              print("Missing currentPriceTime")
              sys.exit(1)

          # ==================================================
          # COMPACT ANALYSIS
          # ==================================================

          frames = {}

          for key in [
              "D1",
              "H4",
              "H1",
              "M15",
              "M5"
          ]:

              frame = (
                  analysis.get("timeframes")
                  or {}
              ).get(key) or {}

              candles = (
                  frame.get("candles")
                  or []
              )

              frames[key] = {

                  "status":
                      frame.get("status"),

                  "interval":
                      frame.get("interval"),

                  "latestCandle":
                      frame.get("latestCandle"),

                  "summary":
                      frame.get("summary"),

                  "recentCandles":
                      candles[-15:]
              }

          # ==================================================
          # M1
          # ==================================================

          m1_frame = (
              refresh.get("timeframes")
              or {}
          ).get("M1") or {}

          m1_candles = (
              m1_frame.get("candles")
              or []
          )

          # ==================================================
          # STATUS.JSON
          # ==================================================

          status = {

              "requestedSymbol":
                  requested_symbol,

              "returnedSymbol":
                  analysis.get("symbol"),

              "marketSymbol":
                  analysis.get("marketSymbol"),

              "marketType":
                  analysis.get("marketType"),

              "analysisGeneratedAt":
                  analysis.get("generatedAt"),

              "liveRefreshGeneratedAt":
                  refresh.get("generatedAt"),

              "currentPrice":
                  live_price,

              "currentPriceTime":
                  live_time,

              "priceSource":
                  "M1 refresh",

              "dataAgeSeconds":
                  live_age,

              "stale":
                  live_stale,

              "marketClosedPossible":
                  refresh.get(
                      "marketClosedPossible"
                  ),

              "analysisReady":
                  True,

              "successfulFrames":
                  analysis.get(
                      "successfulFrames"
                  ),

              "failedFrames":
                  analysis.get(
                      "failedFrames"
                  ),

              "frames":
                  frames,

              "M1": {

                  "latestCandle":
                      m1_frame.get(
                          "latestCandle"
                      ),

                  "summary":
                      m1_frame.get(
                          "summary"
                      ),

                  "recentCandles":
                      m1_candles[-15:]
              },

              "updatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }

          with open(
              "data/status.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  status,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          # ==================================================
          # FULL RAW BACKUP
          # ==================================================

          combined = {

              "analysis":
                  analysis,

              "refresh":
                  refresh
          }

          with open(
              "data/latest.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  combined,
                  f,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

          print("================================")
          print("SYMBOL:", requested_symbol)
          print("PRICE:", live_price)
          print("PRICE TIME:", live_time)
          print("AGE:", live_age)
          print("STALE:", live_stale)
          print("FRAMES: 5/5")
          print("================================")
          PY

      # =====================================================
      # CLEAN TEMP FILES
      # =====================================================

      - name: Clean temporary files
        shell: bash
        run: |
          rm -f data/analysis.tmp.json
          rm -f data/refresh.tmp.json

      # =====================================================
      # COMMIT LOCALLY
      # =====================================================

      - name: Commit fresh market data
        shell: bash
        run: |
          git config user.name "market-data-bot"

          git config user.email \
            "market-data-bot@users.noreply.github.com"

          git add \
            data/latest.json \
            data/status.json

          if git diff --cached --quiet; then

            echo "No market data changes."

            exit 0
          fi

          git commit \
            -m "Refresh live market data for ${{ steps.symbol.outputs.symbol }}"

      # =====================================================
      # SAFE PUSH
      #
      # Nếu main đã thay đổi trong lúc workflow chạy:
      # pull --rebase trước rồi mới push.
      # =====================================================

      - name: Sync and push safely
        shell: bash
        run: |
          if git log -1 --pretty=%B | grep -q "^Refresh live market data for"; then

            echo "Synchronizing latest main..."

            git pull \
              --rebase \
              origin \
              main

            echo "Pushing result..."

            git push \
              origin \
              HEAD:main

          else

            echo "Nothing to push."

          fi
