name: Offline Crypto Daily Per Symbol V38 Fast
on:
  push:
    paths:
      - 'scripts/offline_crypto_daily_per_symbol_v38_fast.py'
      - '.github/workflows/offline-crypto-daily-per-symbol-v38-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run focused remaining-coin optimizer
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_daily_per_symbol_v38_fast.py
      - name: Print full per-coin method JSON
        run: cat data/offline_crypto_daily_per_symbol_v38_fast.json
