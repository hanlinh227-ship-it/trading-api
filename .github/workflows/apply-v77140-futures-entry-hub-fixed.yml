name: Apply V77.14 Futures Actionable Entry Hub Fixed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_v77140_boundary_markers.js'
      - '.github/workflows/apply-v77140-futures-entry-hub-fixed.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply migration then boundary fix
        shell: bash
        run: |
          set +e
          : > V77140_FIXED_DIAGNOSTIC.txt
          node --check scripts/apply_v77140_futures_entry_hub.js >> V77140_FIXED_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77140_FIXED_DIAGNOSTIC.txt
          node scripts/apply_v77140_futures_entry_hub.js >> V77140_FIXED_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77140_FIXED_DIAGNOSTIC.txt
          node scripts/fix_v77140_boundary_markers.js >> V77140_FIXED_DIAGNOSTIC.txt 2>&1; echo "FIX_EXIT=$?" >> V77140_FIXED_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77140_FIXED_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77140_FIXED_DIAGNOSTIC.txt
          for t in 'V77.14.0' 'runFutureGroup' 'futureContractSuffix' 'MARKET PLAN' 'LIMIT PLAN' 'symbolPageKeyboard' 'FUTURE_SYMBOLS' 'SOFT_NO_EXTERNAL_NEWS_FEED'; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77140_FIXED_DIAGNOSTIC.txt; else echo "$t=NO" >> V77140_FIXED_DIAGNOSTIC.txt; fi
          done
          if grep -q 'function groupKeyboard(function' cloudflare-worker/index.js || grep -q 'setNewsClearance(symbol,env){async function' cloudflare-worker/index.js || grep -q 'sendGroup(group,env,chatId)async function' cloudflare-worker/index.js; then echo 'MARKER_DUPLICATION=YES' >> V77140_FIXED_DIAGNOSTIC.txt; else echo 'MARKER_DUPLICATION=NO' >> V77140_FIXED_DIAGNOSTIC.txt; fi
          exit 0
      - name: Commit canonical Worker on pass
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77140_FIXED_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77140_FIXED_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77140_FIXED_DIAGNOSTIC.txt && grep -q 'FIX_EXIT=0' V77140_FIXED_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77140_FIXED_DIAGNOSTIC.txt && grep -q 'MARKER_DUPLICATION=NO' V77140_FIXED_DIAGNOSTIC.txt; then
            git add cloudflare-worker/index.js data/futures_knowledge.json
          fi
          git commit -m 'Promote corrected V77.14 Futures actionable entry Hub' || exit 0
          git push origin main
