name: Apply V77.12 Fresh Scan Persistent Orders

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77120_fresh_scan_persistent_orders.js'
      - '.github/workflows/apply-v77120-fresh-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77120_DIAGNOSTIC.txt
          node --check scripts/apply_v77120_fresh_scan_persistent_orders.js >> V77120_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77120_DIAGNOSTIC.txt
          node scripts/apply_v77120_fresh_scan_persistent_orders.js >> V77120_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77120_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77120_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77120_DIAGNOSTIC.txt
          for t in 'V77.12.0' 'scanPrefix' 'orderHistory' 'freshWatchFromRun' 'saveScanSnapshot' 'TOP SETUPS CỦA LẦN QUÉT NÀY' 'LIVE ORDERS — LƯU BỀN QUA UPDATE BOT' '/latest-scan' 'appendOrderHistory'; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77120_DIAGNOSTIC.txt; else echo "$t=NO" >> V77120_DIAGNOSTIC.txt; fi
          done
          exit 0
      - name: Commit canonical Worker on pass
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77120_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77120_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77120_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77120_DIAGNOSTIC.txt && grep -q 'V77.12.0=YES' V77120_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.12 fresh scan persistent order architecture' || exit 0
          git push origin main
# retrigger after generator quoting fix
