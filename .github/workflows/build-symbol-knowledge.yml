name: Build Symbol Knowledge Registry
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_symbol_knowledge_registry.js'
      - 'data/nocut_intraday_allpass_v73.json'
      - '.github/workflows/build-symbol-knowledge.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build registry
        run: |
          node --check scripts/build_symbol_knowledge_registry.js
          node scripts/build_symbol_knowledge_registry.js
          node - <<'NODE'
          const r=require('./data/symbol_knowledge_registry.json');
          const vals=Object.values(r.symbols);
          const fx=vals.filter(x=>x.assetClass==='forex').length;
          const cr=vals.filter(x=>x.assetClass==='crypto').length;
          const mt=vals.filter(x=>x.assetClass==='metal').length;
          if(fx!==28||cr!==61||mt!==2)throw new Error(`bad counts fx=${fx} crypto=${cr} metal=${mt}`);
          if(!r.symbols.GRAMUSDT||r.symbols.TONUSDT)throw new Error('GRAM canonical registry failed');
          if(vals.some(x=>x.calibration?.status==='CALIBRATED'))throw new Error('registry must not fabricate calibration');
          console.log({fx,cr,mt,total:vals.length});
          NODE
      - name: Commit registry
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add data/symbol_knowledge_registry.json
          git commit -m 'Build canonical symbol knowledge registry' || exit 0
          git push origin main
