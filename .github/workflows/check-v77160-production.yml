name: Check V77.16 Production Quality
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77160-production.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build validation
        shell: bash
        run: |
          set +e
          : > V77160_PRODUCTION.txt
          node --check cloudflare-worker/index.js >> V77160_PRODUCTION.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77160_PRODUCTION.txt
          cd cloudflare-worker
          npm install >> ../V77160_PRODUCTION.txt 2>&1; echo "NPM_EXIT=$?" >> ../V77160_PRODUCTION.txt
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler >> ../V77160_PRODUCTION.txt 2>&1; echo "PREPARE_EXIT=$?" >> ../V77160_PRODUCTION.txt
          npx wrangler deploy --dry-run >> ../V77160_PRODUCTION.txt 2>&1; echo "WRANGLER_EXIT=$?" >> ../V77160_PRODUCTION.txt
          cd ..
      - name: Wait deployment
        run: sleep 40
      - name: Crypto Futures Status
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77160_PRODUCTION.txt
          curl -fsS --max-time 90 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo "CRYPTO_CURL=$?" >> V77160_PRODUCTION.txt
          curl -fsS --max-time 65 "$BASE/run-now?group=future" -o /tmp/u.json; echo "FUTURE_CURL=$?" >> V77160_PRODUCTION.txt
      - name: Fresh TD minute
        shell: bash
        run: |
          S=$(date -u +%S); WAIT=$((65-10#$S)); if [ "$WAIT" -lt 5 ]; then WAIT=$((WAIT+60)); fi; sleep "$WAIT"
      - name: Forex Metal Hub Orders Menu
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 60 "$BASE/run-now?group=forex" -o /tmp/f.json; echo "FOREX_CURL=$?" >> V77160_PRODUCTION.txt
          sleep 2
          curl -fsS --max-time 50 "$BASE/run-now?group=metal" -o /tmp/m.json; echo "METAL_CURL=$?" >> V77160_PRODUCTION.txt
          curl -fsS --max-time 150 "$BASE/hub" -o /tmp/h.json; echo "HUB_CURL=$?" >> V77160_PRODUCTION.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/o.json; echo "ORDERS_CURL=$?" >> V77160_PRODUCTION.txt
          curl -fsS --max-time 15 "$BASE/telegram/menu" -o /tmp/t.json; echo "MENU_CURL=$?" >> V77160_PRODUCTION.txt
          node <<'NODE' >> V77160_PRODUCTION.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const s=j('/tmp/s.json'),runs={CRYPTO:j('/tmp/c.json'),FUTURE:j('/tmp/u.json'),FOREX:j('/tmp/f.json'),METAL:j('/tmp/m.json')},h=j('/tmp/h.json'),o=j('/tmp/o.json'),t=j('/tmp/t.json');
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('MASSIVE='+(s.massive===true?'YES':'NO'));
          let actionable=0,execs=0,watch=0,badRR=[],badFuture=[],microOnly=true;
          for(const [name,r] of Object.entries(runs)){const arr=r.analyses||[],n=x=>arr.filter(a=>a.status===x).length;actionable+=n('MARKET')+n('LIMIT')+n('MARKET_PLAN')+n('LIMIT_PLAN');execs+=n('MARKET')+n('LIMIT');watch+=n('WATCH');if(name==='FUTURE'&&arr.some(a=>['NQ','ES'].includes(a.symbol)))microOnly=false;console.log(name+'='+(r.broadOk??'-')+'/'+(r.requested??'-')+' deep='+(r.deepOk??'-')+'/'+(r.deepRequested??'-')+' attempts='+(r.diagnostics?.deepAttempted??'-')+' M='+n('MARKET')+' L='+n('LIMIT')+' MP='+n('MARKET_PLAN')+' LP='+n('LIMIT_PLAN')+' W='+n('WATCH'));console.log(name+'_RESULTS='+arr.map(a=>{const p=a.planned||a,rr=Number(p.targetRR),fs=a.microSizing;if(['MARKET','LIMIT','MARKET_PLAN','LIMIT_PLAN'].includes(a.status)&&Number.isFinite(rr)){const floor=name==='FUTURE'?1.45:name==='METAL'?1.4:name==='CRYPTO'?1.3:1.25;if(rr<floor)badRR.push(a.symbol+':'+rr);}if(name==='FUTURE'&&fs&&fs.tradable===false)badFuture.push(a.symbol+':risk');return a.symbol+':'+a.status+':'+(a.reason||'-')+':RR='+(p.targetRR??'-')+':style='+(p.entryStyle||'-')+':riskOK='+(fs?fs.tradable:'-')}).join('|'));}
          console.log('ACTIONABLE='+actionable+' EXEC='+execs+' WATCH='+watch);console.log('BAD_RR='+badRR.join('|'));console.log('BAD_FUTURE='+badFuture.join('|'));console.log('FUTURE_MICRO_ONLY='+(microOnly?'YES':'NO'));console.log('HUB_TOP='+(h.top||[]).map(a=>a.symbol+':'+a.status+':'+((a.planned||a).targetRR??'-')).join('|'));console.log('DURABLE_WATCH_ZERO='+(Object.keys(o).every(k=>!Array.isArray(o[k]?.watch)||o[k].watch.length===0)?'YES':'NO'));console.log('TELEGRAM_MENU_OK='+(t.ok===true?'YES':'NO'));
          const coverage=(runs.CRYPTO.broadOk||0)>=55&&(runs.FOREX.broadOk||0)===28&&(runs.METAL.broadOk||0)===2&&(runs.FUTURE.broadOk||0)>=4;
          const deep=(runs.CRYPTO.deepOk||0)>=3&&(runs.FOREX.deepOk||0)===3&&(runs.METAL.deepOk||0)===2&&(runs.FUTURE.deepOk||0)>=2;
          const pass=s.version==='V77.16.0'&&s.ok===true&&s.massive===true&&coverage&&deep&&actionable>=3&&badRR.length===0&&microOnly&&t.ok===true;
          console.log('LIVE_VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        shell: bash
        run: |
          if grep -q 'SYNTAX_EXIT=0' V77160_PRODUCTION.txt && grep -q 'WRANGLER_EXIT=0' V77160_PRODUCTION.txt && grep -q 'LIVE_VERDICT=PASS' V77160_PRODUCTION.txt; then echo 'FINAL_VERDICT=PASS' >> V77160_PRODUCTION.txt; else echo 'FINAL_VERDICT=FAIL' >> V77160_PRODUCTION.txt; fi
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77160_PRODUCTION.txt; git commit -m 'Report V77.16 production quality verification' || exit 0; git push origin main
