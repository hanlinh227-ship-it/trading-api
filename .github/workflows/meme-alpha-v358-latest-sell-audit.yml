name: Meme Alpha v3.58 Latest Sell Forensic Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v358-latest-sell-audit.sh'
      - '.github/workflows/meme-alpha-v358-latest-sell-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Audit latest sell
        run: bash ops/meme-alpha/v358-latest-sell-audit.sh
