name: Apply Bybit V4.4.1 Direction Freeze
on:
  push:
    branches: [main]
    paths: ['.github/bybit-v441-direction-freeze-trigger']
  workflow_dispatch:
permissions: {contents: write}
concurrency: {group: bybit-v441-direction-freeze, cancel-in-progress: false}
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Apply direction coherence long-run freeze
        run: python3 .github/scripts/apply-bybit-v441-direction-freeze.py
      - name: Validate strategy controller runtime
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-worker
          node --check bybit-symbol-strategy.js
          node --check bybit-multi-asset-controller.js
          node --check bybit-runtime-contract.js
          node --check bybit-symbol-engine.js
          node --check bybit-btc-risk-engine.js
          node --check bybit-coin-profiles.js
          sed -i "s/'continuousTimeScale'/'lastContinuousCapitalUsd'/" validate-btc-hyperscale.mjs
          node validate-btc-hyperscale.mjs
      - name: Assert V4.4.1 freeze markers
        shell: bash
        run: |
          set -euo pipefail
          grep -q "PROFILE_COUNTERTREND_UNCONFIRMED" cloudflare-worker/bybit-symbol-strategy.js
          grep -q "CROSS_MARKET_DIRECTION_CONFLICT" cloudflare-worker/bybit-multi-asset-controller.js
          grep -q "BYBIT-MULTI-STATEFLOW-4.4.1" cloudflare-worker/bybit-runtime-contract.js
          grep -q "longRunCoreFreeze:true" cloudflare-worker/bybit-runtime-contract.js
      - name: Commit V4.4.1 long-run freeze
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/bybit-symbol-strategy.js cloudflare-worker/bybit-multi-asset-controller.js cloudflare-worker/bybit-runtime-contract.js
          if git diff --cached --quiet; then echo NO_CHANGES; exit 0; fi
          git commit -m 'Freeze Bybit direction coherence for long-run V4.4.1'
          git push origin HEAD:main
