name: Fast Futures Massive Production Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77151-future-fast.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check Futures production after structural limit rescue
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'; : > V77151_FUTURE_FAST.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77151_FUTURE_FAST.txt
          curl -fsS --max-time 55 "$BASE/run-now?group=future" -o /tmp/f.json; echo "FUTURE_CURL=$?" >> V77151_FUTURE_FAST.txt
          node <<'NODE' >> V77151_FUTURE_FAST.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};const s=j('/tmp/s.json'),f=j('/tmp/f.json');const n=x=>(f.analyses||[]).filter(a=>a.status===x).length;
          console.log('VERSION='+(s.version||'-'));console.log('MASSIVE='+(s.massive===true?'YES':'NO'));console.log('FUTURE_STATUS='+(f.status||'-'));console.log('FUTURE='+(f.broadOk??'-')+'/'+(f.requested??'-')+' deep='+(f.deepOk??'-')+'/'+(f.deepRequested??'-'));
          console.log('ACTIONS=MARKET:'+n('MARKET')+',LIMIT:'+n('LIMIT')+',MARKET_PLAN:'+n('MARKET_PLAN')+',LIMIT_PLAN:'+n('LIMIT_PLAN')+',WATCH:'+n('WATCH'));
          console.log('RESULTS='+(f.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':E='+(a.entry??a.planned?.entry??'-')+':SL='+(a.sl??a.planned?.sl??'-')+':TP='+(a.tp2??a.planned?.tp2??a.tp1??a.planned?.tp1??'-')+':RR='+(a.targetRR??a.planned?.targetRR??'-')+':DIST='+(a.planned?.geometry?.distanceATR??'-')).join('|'));
          console.log('CONTRACTS='+JSON.stringify(f.diagnostics?.frontContracts||{}));console.log('ERRORS='+JSON.stringify(f.diagnostics?.errors||[]));
          console.log('VERDICT='+((/^V77\.15\./.test(s.version||''))&&s.massive===true&&f.ok===true&&(f.deepOk||0)>=1?'PASS':'FAIL'));
          NODE
      - name: Commit
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77151_FUTURE_FAST.txt; git commit -m 'Report fast Futures Massive production check' || exit 0; git push origin main
