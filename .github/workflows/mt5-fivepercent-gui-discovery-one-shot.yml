name: MT5 FivePercent GUI Discovery One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-fivepercent-gui-discovery-one-shot.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: false

jobs:
  discover:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 30
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_ACCOUNT_ENDPOINT: ${{ secrets.MT5_ACCOUNT_ENDPOINT }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}
    steps:
      - name: Discover FivePercent broker metadata in isolated MT5 GUI
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          app=/var/lib/trading/mt5-forex
          canon="$app/wine/drive_c/MT5Forex"
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          test -f "$canon/terminal64.exe"

          need=""
          command -v xdotool >/dev/null 2>&1 || need="$need xdotool"
          command -v openbox >/dev/null 2>&1 || need="$need openbox"
          command -v import  >/dev/null 2>&1 || need="$need imagemagick"
          command -v xwd     >/dev/null 2>&1 || need="$need x11-apps"
          if [[ -n "$need" ]]; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq $need
          fi

          sudo rm -rf /tmp/mt5-gui-shots
          mkdir -p /tmp/mt5-gui-shots
          work=$(mktemp -d /tmp/mt5-fivepercent-discovery.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          prefix="$work/wine"
          home="$work/home"
          mkdir -p "$prefix" "$home"
          HOME="$home" WINEPREFIX="$prefix" WINEDEBUG=-all timeout 120 xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/wineboot -i >/dev/null 2>&1 || true
          HOME="$home" WINEPREFIX="$prefix" /usr/bin/wineserver -k >/dev/null 2>&1 || true
          mkdir -p "$prefix/drive_c"
          cp -a "$canon" "$prefix/drive_c/MT5Discovery"
          rm -f "$prefix/drive_c/MT5Discovery/Config/servers.dat" "$prefix/drive_c/MT5Discovery/Config/accounts.dat" || true

          # GUI controller script is base64-embedded (YAML-indent safe) and
          # byte-for-byte identical to the bash -n validated source.
          # <<- strips leading TABs; tr removes any residual whitespace.
          tr -d ' \t' <<-'B64' | base64 -d > "$work/gui.sh"
          	IyEvdXNyL2Jpbi9lbnYgYmFzaAojIE1UNSBHVUkgYnJva2VyIGRpc2NvdmVyeSBjb250cm9sbGVyIOKAlCBydW5zIGluc2lkZSB4
