name: V12 Diagnostics
on:
  push:
    paths:
      - 'scripts/analyze_v12_failures.py'
      - '.github/workflows/v12-diagnostics.yml'
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/analyze_v12_failures.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v12_diagnostics.json
          git commit -m "Run V12 diagnostics" || exit 0
          git pull --rebase origin main
          git push
