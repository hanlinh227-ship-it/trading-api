name: Meme Alpha V406F Postcheck
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v406f-postcheck.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Verify V406 post-warmup
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; EXE="$APP/src/micro-live-executor.js"
          sleep 20
          date -u +%FT%TZ
          echo PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1 || true)
          echo COUNT=$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js' || true)
          echo SHA=$(sha256sum "$EXE"|awk '{print $1}')
          for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$s"; systemctl is-active "$s" || true; done
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          for name in ['micro-live-gate.json','signal-snapshot.json','portfolio-observability.json','capital-observability.json','allocator-status.json','last-execution.json']:
            p=rt/name
            if not p.exists(): print(name,'MISSING'); continue
            d=json.loads(p.read_text()); print(name,'ageSec=',round(time.time()-p.stat().st_mtime,1),d)
          PY
          echo V406_POSTCHECK=COMPLETE
