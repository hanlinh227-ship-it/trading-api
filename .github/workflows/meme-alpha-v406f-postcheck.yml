name: Meme Alpha V406G Resilience Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v406f-postcheck.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Audit signer and storage resilience
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SIGNER UNIT ==='
          systemctl cat meme-alpha-signer.service --no-pager || true
          systemctl show meme-alpha-signer.service -p ActiveState -p SubState -p MainPID -p Restart -p RestartUSec -p NRestarts -p StartLimitIntervalUSec -p StartLimitBurst -p Result -p ExecMainStatus -p ExecMainStartTimestamp --no-pager || true
          echo '=== SIGNER SOURCE CONTROL FLOW ==='
          grep -nE 'while |serve|socket|signal|SIG|sys.exit|exit\(|except|try:|finally|main\(' /opt/meme-alpha-signer/ready_signer.py | tail -180 || true
          tail -80 /opt/meme-alpha-signer/ready_signer.py 2>/dev/null || true
          echo '=== STORAGE / LOGS ==='
          df -h / /opt /var/lib /var/log 2>/dev/null || true
          du -sh /var/log/meme-alpha /opt/meme-alpha/app/runtime-status /var/lib/meme-alpha 2>/dev/null || true
          find /var/log/meme-alpha /opt/meme-alpha/app/runtime-status /var/lib/meme-alpha -xdev -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -30 || true
          echo '=== LOGROTATE ==='
          grep -RniE 'meme-alpha|/var/log/meme-alpha' /etc/logrotate.conf /etc/logrotate.d 2>/dev/null || true
          echo '=== LIVE V406 ==='
          echo PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1 || true)
          echo SHA=$(sha256sum /opt/meme-alpha/app/src/micro-live-executor.js|awk '{print $1}')
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          for name in ['micro-live-gate.json','portfolio-observability.json','capital-observability.json','allocator-status.json']:
            p=rt/name
            if p.exists(): print(name,'ageSec=',round(time.time()-p.stat().st_mtime,1),json.loads(p.read_text()))
          PY
          echo V406G_RESILIENCE_AUDIT=COMPLETE
