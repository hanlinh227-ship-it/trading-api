name: Meme Alpha V406H Held Safety Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v406f-postcheck.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Audit held position exit safety
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; EXE="$APP/src/micro-live-executor.js"
          echo '=== HARD HELPERS ==='
          sed -n '65,100p' "$EXE"
          echo '=== HELD CANDIDATE SAFETY ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          p=json.loads((rt/'portfolio-observability.json').read_text()); held=set(p.get('positionMints') or [])
          s=json.loads((rt/'signal-snapshot.json').read_text()); rows=s.get('candidates') or []
          by={x.get('mint'):x for x in rows if isinstance(x,dict) and x.get('mint')}
          print('heldCount',len(held),'signalCount',len(rows))
          for m in held:
            x=by.get(m)
            if not x: print({'mint':m,'signalRow':'MISSING'}); continue
            print({k:x.get(k) for k in ['mint','symbol','decision','universeClass','securityDecision','holderClusterDecision','insiderRiskDecision','token2022','sellRoute','liquidityUsd','sellPriceImpactPct','hardReject','securityReviewReasons','securityBlockReasons','holderBlockReasons','realtimeRowFresh','whaleRowFresh']})
          PY
          echo '=== EXIT EVENTS RECENT ==='
          grep -RhsE 'MICRO_SELL|MICRO_PARTIAL_SELL|HARD_SAFETY_BREAK|SEVERE_TREND_BREAK|PROFIT_AWARE|RUNNER_PROTECT|ROTATE' /var/lib/meme-alpha/data/micro-live /opt/meme-alpha/app/runtime-status 2>/dev/null | tail -80 || true
          echo V406H_HELD_SAFETY_AUDIT=COMPLETE
