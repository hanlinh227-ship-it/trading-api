name: Offline Forex NoCut Geometry V64
on:
  push:
    paths:
      - 'scripts/offline_forex_nocut_geometry_v64.py'
      - 'scripts/offline_nocut_geometry_core.py'
      - '.github/workflows/offline-forex-nocut-geometry-v64.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run offline V64
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_nocut_geometry_v64.py
