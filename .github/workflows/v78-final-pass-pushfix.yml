name: V78 Final Pass Push Race Fix
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  run:
    if: github.event.issue.title == 'RUN-V78-FINAL-PASS-PUSHFIX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Make every final-pass push rebase-safe
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/v78_final_pass.sh')
          s=p.read_text()
          old='git push origin HEAD:main'
          new='git pull --rebase origin main\ngit push origin HEAD:main'
          n=s.count(old)
          assert n>=4, n
          s=s.replace(old,new)
          p.write_text(s)
          print('patched pushes', n)
          PY
          bash -n scripts/v78_final_pass.sh
          git diff --check
          git config user.name 'V78 Signal Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/v78_final_pass.sh
          git commit -m 'Make V78 final pass rebase-safe against concurrent diagnostics'
          git push origin HEAD:main
