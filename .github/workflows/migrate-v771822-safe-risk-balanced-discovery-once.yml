name: Migrate V77.18.22 Safe Risk Balanced Discovery Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771822-safe-risk-balanced-discovery-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply migration
        run: python scripts/migrate_v771822.py
      - name: Syntax and canonical validation
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
          grep -q 'V77.18.22' cloudflare-worker/index.js
          grep -q 'RISK_V771822_ACTIVATES_AT' cloudflare-worker/hyro-execution.js
          grep -q 'TP_POLICY_V771822_AT' cloudflare-worker/hyro-position-manager.js
          grep -q 'V77.16.10' cloudflare-worker/engine-v77168.js
          grep -q 'OVERNIGHT_30M_SYSTEM_REVIEW' cloudflare-worker/claude-reviewer.js
          ! grep -q 'hyroMultiStatus' cloudflare-worker/index.js
      - name: Install and Wrangler dry-run
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: |
          npm install
          npm run prepare:wrangler
          npx wrangler deploy --dry-run
      - name: Commit migration
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/hyro-execution.js cloudflare-worker/hyro-position-manager.js cloudflare-worker/engine-v77168.js cloudflare-worker/claude-reviewer.js cloudflare-worker/hub-v77171.js cloudflare-worker/index.js .github/workflows/validate-cloudflare-v77.yml docs/checkpoints/V771822_SAFE_RISK_BALANCED_DISCOVERY.md
          git commit -m "V77.18.22 safe daily risk and balanced discovery" || true
          git push
