name: Meme Alpha v1.0 Jupiter Deploy

on:
  push:
    paths:
      - 'ops/meme-alpha/v100-deploy-jupiter.sh'
      - '.github/workflows/meme-alpha-v100-jupiter-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-alpha-v100-jupiter-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Deploy and verify Jupiter size-specific PAPER execution
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v100-deploy-jupiter.sh
          nice -n 15 bash ops/meme-alpha/v100-deploy-jupiter.sh
