name: V78-026 H1 Cloudflare DEMO Preview Acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v78-026-h1-preview-demo.yml']
  workflow_dispatch:
permissions:
  contents: write
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  preview-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: v78-026-h1, fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply exact guarded H1 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare-worker/hyro-execution.js)" = b97695c3f96939290e4a80d24d9fc702d154b29a
          python3 scripts/v78-026-h1-apply.py
          node --check cloudflare-worker/hyro-execution.js
      - name: Build test-only fault-injection copy
        shell: bash
        run: |
          set -euo pipefail
          cp cloudflare-worker/hyro-execution.js cloudflare-worker/hyro-execution-v78026-test.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/hyro-execution-v78026-test.js');s=p.read_text()
          marker='const RECV_WINDOW="5000";'
          assert s.count(marker)==1
          s=s.replace(marker,marker+'\nlet V78026_DROPPED_ACK=false;',1)
          old='if(!r.ok||Number(p?.retCode)!==0)throw bybitError(path,r.status,p);return p;}'
          new='if(!r.ok||Number(p?.retCode)!==0)throw bybitError(path,r.status,p);if(String(env.V78026_SIMULATE_LOST_ACK||"false")==="true"&&!V78026_DROPPED_ACK&&upper==="POST"&&path==="/v5/order/create"&&p?.result?.orderId){V78026_DROPPED_ACK=true;throw new Error("V78-026_SIMULATED_RESPONSE_LOSS_AFTER_VENUE_ACCEPT");}return p;}'
          assert s.count(old)==1
          s=s.replace(old,new,1);p.write_text(s)
          PY
          node --check cloudflare-worker/hyro-execution-v78026-test.js
          node --check cloudflare-worker/v78-026-preview-test.js
      - name: Upload non-production preview version with inherited secrets
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          npm install --no-audit --no-fund
          TOKEN="$(node -e 'console.log(require("crypto").randomBytes(24).toString("hex"))')"
          printf '%s' "$TOKEN" > /tmp/v78026-token
          node - <<'NODE'
          const fs=require('fs');
          const token=fs.readFileSync('/tmp/v78026-token','utf8');
          fs.writeFileSync('wrangler-v78026-preview.jsonc',JSON.stringify({$schema:'./node_modules/wrangler/config-schema.json',name:'trading-v77-scanner',main:'v78-026-preview-test.js',compatibility_date:'2026-08-20',keep_vars:true,vars:{V78026_TEST_TOKEN:token},secrets:{required:['HYRO_BYBIT_API_KEY','HYRO_BYBIT_API_SECRET']}},null,2));
          NODE
          npx wrangler versions upload v78-026-preview-test.js --config wrangler-v78026-preview.jsonc --keep-vars --preview-alias v78026h1 --message 'V78-026 H1 DEMO-only isolated acceptance' 2>&1 | tee /tmp/v78026-upload.log
          grep -Eo '[0-9a-f]{8}-[0-9a-f-]{27,}' /tmp/v78026-upload.log | tail -1 > /tmp/v78026-preview-version || true
      - name: Run real DEMO H1 acceptance on preview
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="$(cat /tmp/v78026-token)"
          URL='https://v78026h1-trading-v77-scanner.hanlinh227.workers.dev/'
          for i in 1 2 3 4 5; do
            code=$(curl -sS --max-time 120 -o /tmp/v78026-demo.json -w '%{http_code}' -H "x-v78026-token: $TOKEN" "$URL" || true)
            [ "$code" = 200 ] && break
            sleep 4
          done
          cat /tmp/v78026-demo.json
          node - <<'NODE'
          const fs=require('fs'),j=JSON.parse(fs.readFileSync('/tmp/v78026-demo.json','utf8'));
          if(j.ok!==true)throw new Error(JSON.stringify(j));
          if(j.mode!=='DEMO_ONLY_PREVIEW')throw new Error('wrong mode');
          if(j.ack?.state!=='ACKNOWLEDGED'||!j.ack?.orderId||j.ack?.venueOrderCount!==1)throw new Error('ACK acceptance failed');
          if(j.ambiguous?.firstReason!=='RECONCILE_REQUIRED'||j.ambiguous?.persistedState!=='RECONCILE_REQUIRED'||j.ambiguous?.retryState!=='ACKNOWLEDGED'||!j.ambiguous?.orderId||j.ambiguous?.venueOrderCount!==1)throw new Error('ambiguous reconciliation failed');
          if(j.legacy?.idempotent!==true||j.legacy?.orderId!=='legacy-order-id')throw new Error('legacy compatibility failed');
          if(j.productionKvWrites!==0)throw new Error('production KV write detected');
          console.log('V78-026 PREVIEW DEMO ACCEPTANCE PASS');
          NODE
      - name: Persist exact preview evidence on H1 branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin v78-026-h1
          git reset --hard origin/v78-026-h1
          STATUS=FAIL
          if [ -s /tmp/v78026-demo.json ] && node -e 'const j=require("/tmp/v78026-demo.json");process.exit(j.ok===true?0:1)' 2>/dev/null; then STATUS=PASS; fi
          {
            echo "STATUS=$STATUS"
            echo "RUN_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "PREVIEW_ALIAS=v78026h1"
            echo "PREVIEW_VERSION=$(cat /tmp/v78026-preview-version 2>/dev/null || true)"
            echo 'UPLOAD_SUMMARY:'
            grep -E 'Version|Preview|Uploaded|Worker' /tmp/v78026-upload.log 2>/dev/null || true
            echo 'DEMO_RESULT:'
            cat /tmp/v78026-demo.json 2>/dev/null || true
          } > docs/ai-coengineer/V78-026_PREVIEW_DEMO.txt
          git config user.name 'V78-026 Preview Validator';git config user.email 'actions@users.noreply.github.com'
          git add docs/ai-coengineer/V78-026_PREVIEW_DEMO.txt
          git commit -m "V78-026 H1 preview DEMO acceptance $STATUS" || true
          git push origin HEAD:v78-026-h1
