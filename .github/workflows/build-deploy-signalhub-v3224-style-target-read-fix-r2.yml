name: Build Deploy SignalHub V3.22.4 Responsive Style Target Read R2

on:
  push:
    branches: [signalhub-v3224-style-target-read-fix]
    paths:
      - '.github/workflows/build-deploy-signalhub-v3224-style-target-read-fix-r2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy-audit:
    runs-on: ubuntu-latest
    env:
      BASE: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Apply complete V3.22.4 repair chain
        run: |
          set -euo pipefail
          python3 scripts/patch_signalhub_v3222_scan_refill_fix.py
          python3 scripts/patch_signalhub_v3223_active_refill_recovery.py
          python3 scripts/patch_signalhub_v3224_style_target_read_fix.py
          node --check signalhub-worker/gateway-v3.js

      - name: Verify V3.22.4 source contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text()
          g=Path('signalhub-android/app/build.gradle').read_text()
          assert 'SIGNALHUB-V3-GATEWAY-3.22.4' in w
          assert 'async function analyzeCryptoBatch(' in w
          assert 'if(!setup)setup=buildStableReferenceSetup(t,style,stats)' in w
          assert 'const targetActive=styleTarget(style);' in w
          assert 'ACTIVE_READ_BACKGROUND_REFILL' in w
          assert 'APP_VERSION="3.22.4"' in a
          assert '10 SCALP + 5 SWING' in a
          assert 'versionCode 33' in g and "versionName '3.22.4'" in g
          print('SOURCE CONTRACTS PASS')
          PY

      - name: Worker dry-run and Android build
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v3224-worker
          cd signalhub-android
          gradle :app:assembleDebug --stacktrace --no-daemon
          cd ..
          unzip -t signalhub-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy V3.22.4 production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Production identity and universe audit
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 40); do
            curl -fsS --max-time 20 "$BASE/v3/status?v3224r2=$RANDOM-$n" >/tmp/status.json || true
            if python3 - <<'PY'
          import json
          try:s=json.load(open('/tmp/status.json'))
          except:raise SystemExit(1)
          assert s.get('version')=='SIGNALHUB-V3-GATEWAY-3.22.4',s
          p=(s.get('decisionPolicy') or {}).get('portfolioPolicy') or {}
          assert (p.get('targetActiveByStyle') or {})=={'SCALP':10,'SWING':5},p
          assert p.get('stableUniverseSize')==100 and p.get('dataSchema')=='CRYPTO_MARKET_ROW_V3',p
          assert s.get('forexDisabled') is True,s
          PY
            then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1
          curl -fsS --max-time 120 "$BASE/v3/crypto/stable100?v3224r2=$RANDOM" >/tmp/u.json
          python3 - <<'PY'
          import json
          u=json.load(open('/tmp/u.json'));rows=u.get('rows') or []
          assert u.get('ok') is True,u
          assert len(rows)==100 and len({r.get('symbol') for r in rows})==100
          assert all(r.get('assetClass')=='CRYPTO' for r in rows)
          print('STABLE100 PASS')
          PY

      - name: Hard audit scan and style book
        run: |
          set -euo pipefail
          success=0
          for round in $(seq 1 8); do
            for style in SCALP SWING; do
              code=$(curl -sS --max-time 240 -o "/tmp/scan-$style.json" -w '%{http_code}' "$BASE/v3/scan?market=CRYPTO&style=$style&v3224r2=$RANDOM-$round" || true)
              echo "$style HTTP=$code"
              test "$code" = 200
              python3 - "$style" <<'PY'
          import json,sys
          st=sys.argv[1];x=json.load(open('/tmp/scan-'+st+'.json'))
          assert x.get('ok') is True,x
          assert x.get('market')=='CRYPTO' and x.get('style')==st,x
          assert x.get('live') is True,x
          assert int(x.get('stable100Count') or 0)==100,x
          assert int(x.get('deepAnalyzed') or 0)>0,x
          assert int(x.get('evaluated') or 0)>0,x
          assert 'error' not in x,x
          print('SCAN PASS',st,'evaluated',x.get('evaluated'),'actionable',x.get('actionable'),'created',x.get('created'))
          PY
            done
            curl -fsS --max-time 30 "$BASE/v3/portfolio?v3224r2=$RANDOM-$round" >/tmp/p.json
            if python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/p.json')).get('portfolio') or {});st=p.get('styles') or {}
          print('PORTFOLIO',p.get('activeTotal'),st)
          assert 0<int(st.get('SCALP') or 0)<=10,p
          assert 0<int(st.get('SWING') or 0)<=5,p
          assert int(p.get('activeTotal') or 0)>=2,p
          PY
            then success=1; break; fi
            sleep 4
          done
          test "$success" = 1

      - name: App-facing signal rows latency and schema audit
        run: |
          set -euo pipefail
          for style in SCALP SWING; do
            expected=10; test "$style" = SWING && expected=5
            curl -fsS --max-time 15 -o "/tmp/signals-$style.json" -w '%{time_total}' "$BASE/v3/signals?market=CRYPTO&style=$style&status=active&limit=120&v3224r2=$RANDOM" >"/tmp/time-$style.txt"
            python3 - "$style" "$expected" <<'PY'
          import json,sys
          st=sys.argv[1];expected=int(sys.argv[2])
          x=json.load(open('/tmp/signals-'+st+'.json'));elapsed=float(open('/tmp/time-'+st+'.txt').read().strip())
          rows=x.get('signals') or []
          active=[r for r in rows if str(r.get('status','')).upper() in ('OPEN','PENDING')]
          assert x.get('ok') is True,x
          assert x.get('version')=='SIGNALHUB-V3-GATEWAY-3.22.4',x
          assert x.get('style')==st,x
          assert int(x.get('targetActive') or 0)==expected,x
          assert 0<len(active)<=expected,(st,len(active),x)
          assert elapsed < 15,(st,elapsed)
          for r in active:
              assert r.get('symbol') and float(r.get('entry') or 0)>0 and float(r.get('sl') or 0)>0 and float(r.get('tp3') or r.get('tp') or 0)>0,r
              assert str(r.get('executionPriceAuthority') or r.get('provider') or r.get('exchange') or '').upper() in ('BYBIT','OKX','BINANCE'),r
              assert str(r.get('style') or '').upper()==st,r
          print('APP SIGNALS PASS',st,'count',len(active),'target',expected,'latency',elapsed,'symbols',[r.get('symbol') for r in active[:6]])
          PY
          done

      - name: Integrity and Watch contract audit
        run: |
          set -euo pipefail
          integrity_ok=0
          for n in 1 2 3; do
            curl -fsS --max-time 30 "$BASE/v3/data-integrity?v3224r2=$RANDOM-$n" >/tmp/i.json || true
            if python3 - <<'PY'
          import json
          try:i=json.load(open('/tmp/i.json'))
          except:raise SystemExit(1)
          assert i.get('ok') is True,i
          assert not (i.get('problems') or []),i
          print('INTEGRITY PASS',i.get('stable100'))
          PY
            then integrity_ok=1; break; fi
            sleep 2
          done
          test "$integrity_ok" = 1
          curl -fsS --max-time 180 "$BASE/v3/watch/analyze?symbol=BTCUSDT&v3224r2=$RANDOM" >/tmp/w.json
          python3 - <<'PY'
          import json
          w=json.load(open('/tmp/w.json'))
          assert w.get('ok') is True,w
          assert w.get('analysisOnly') is True,w
          assert w.get('portfolioImpact')=='NONE_READ_ONLY',w
          assert w.get('symbol')=='BTCUSDT',w
          allowed={'ACTIVE_SIGNAL','TRADEABLE_NOW','CONDITIONAL_WAIT','IDEAL_REFERENCE','DATA_UNAVAILABLE'}
          styles=w.get('styles') or {}
          for st in ('SCALP','SWING'):
              s=styles.get(st) or {};state=s.get('state')
              assert state in allowed,(st,s)
              if state=='DATA_UNAVAILABLE':
                  assert s.get('activeSignal') is False,(st,s)
              else:
                  assert float(s.get('entry') or 0)>0 and float(s.get('sl') or 0)>0 and float(s.get('tp3') or 0)>0,(st,s)
          print('WATCH CONTRACT PASS', {k:(styles.get(k) or {}).get('state') for k in ('SCALP','SWING')}, 'dataHealth',w.get('dataHealth'))
          PY

      - name: Stage verified APK
        run: |
          set -euo pipefail
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v3.22.4-Responsive-Style-Target-Read.apk
          sha256sum dist/SignalHub-v3.22.4-Responsive-Style-Target-Read.apk | tee dist/SignalHub-v3.22.4-Responsive-Style-Target-Read-SHA256SUMS.txt
          cat > SIGNALHUB_V3_CHECKPOINT_17_V3224_RESPONSIVE_STYLE_READ.md <<'EOF'
          # SignalHub V3.22.4 — Responsive Style Target Read
          V3.22.4 fixes the V3.22.3 production app-facing timeout. Active reads use canonical 10 SCALP / 5 SWING targets and never force SWING toward the obsolete generic target of 10. Interactive signal reads do at most a bounded standby promotion; deep scan/refill is background maintenance. Release validation requires live SCALP/SWING scans HTTP 200, non-empty active rows within 10/5 caps, valid app Entry/SL/TP/provider fields, app-facing responses below 15 seconds, Stable100 integrity, and a truthful read-only Watch contract where temporary DATA_UNAVAILABLE is accepted only as a non-active state rather than converted into a fabricated trade setup.
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java SIGNALHUB_V3_CHECKPOINT_17_V3224_RESPONSIVE_STYLE_READ.md
          git commit -m 'SignalHub v3.22.4 verified responsive style read' || true
          git push origin HEAD:signalhub-v3224-style-target-read-fix

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.22.4-Responsive-Style-Target-Read
          path: dist/
          retention-days: 30

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=signalhub-v3.22.4-responsive-style-target-read
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --target signalhub-v3224-style-target-read-fix --prerelease --title 'SignalHub v3.22.4 — Responsive Style Target Read' --notes 'Fixes V3.22.3 app-facing timeout with exact 10 SCALP / 5 SWING targets and asynchronous deep refill. Verified against production scan, style book, app-facing latency/schema, Stable100 integrity and truthful read-only Watch states.'
