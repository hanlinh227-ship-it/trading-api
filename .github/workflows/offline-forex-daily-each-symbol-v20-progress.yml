name: Offline Forex Daily Each Symbol V20 Progress
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v20_progress.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v20-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run progress-managed daily per-pair test
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v20_progress.py
