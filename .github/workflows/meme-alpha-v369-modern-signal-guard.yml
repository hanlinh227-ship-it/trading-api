name: Meme Alpha v3.69 Modern Signal Guard
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v369-safe-signal-modern-guard.js'
      - 'ops/meme-alpha/v369-stage-modern-signal-guard.sh'
      - '.github/workflows/meme-alpha-v369-modern-signal-guard.yml'
jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Stage and self-test
        run: bash ops/meme-alpha/v369-stage-modern-signal-guard.sh
      - name: Safe deploy signal guard
        shell: bash
        run: |
          set -euo pipefail
          STAGE=/opt/meme-alpha/app/runtime-status/v369-signal-stage
          NAME=$(cat "$STAGE/deploy-name.txt")
          SHA=$(cat "$STAGE/signal.sha256")
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal "$NAME" "$SHA"
          sleep 18
      - name: Production audit
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          STAGE="$APP/runtime-status/v369-signal-stage"
          EXPECT=$(cat "$STAGE/signal.sha256")
          ACT=$(sha256sum "$APP/src/safe-signal-export.js" | awk '{print $1}')
          echo EXPECTED_SIGNAL_SHA="$EXPECT"
          echo ACTIVE_SIGNAL_SHA="$ACT"
          [ "$ACT" = "$EXPECT" ]
          systemctl is-active --quiet meme-alpha-paper.service
          systemctl is-active --quiet meme-alpha-micro-live.service
          test -s "$APP/runtime-status/signal-snapshot.json"
          /usr/bin/node - "$APP/runtime-status/signal-snapshot.json" <<'NODE'
          const fs=require('fs');const x=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(x.version!=='3.69.0-modern-signal-guard')throw new Error('SIGNAL_VERSION_NOT_V369');
          if(!x.intelSummary||!Array.isArray(x.candidates))throw new Error('SIGNAL_SCHEMA_INVALID');
          const bad=x.candidates.filter(c=>c.intelMode==='BOTH_FEEDS_DOWN'&&c.decision==='PROBE_CANDIDATE');
          if(bad.length)throw new Error('FAIL_CLOSED_ENTRY_LEAK');
          console.log('SIGNAL_CANDIDATES='+x.candidates.length);
          console.log('INTEL_SUMMARY='+JSON.stringify(x.intelSummary));
          console.log('MODERN_GUARD_BLOCKED='+x.intelSummary.blockedByModernGuard);
          console.log('V369_SIGNAL_FAIL_CLOSED=PASS');
          NODE
          grep -q "3.60.0-profit-aware-exits" "$APP/src/micro-live-executor.js"
          echo V369_MODERN_SIGNAL_GUARD=ACTIVE
          echo V360_PROFIT_AWARE_EXECUTOR=PRESERVED
          echo V369_UPSTREAM_RUG_SHIELD=ACTIVE
          echo V369_DEGRADED_INTEL_HAIRCUT=ACTIVE
          echo V369_PRODUCTION_GUARD_ACTIVE=TRUE
