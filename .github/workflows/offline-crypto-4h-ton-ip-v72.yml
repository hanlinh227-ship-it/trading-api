name: Offline Crypto 4H TON IP V72
on:
  push:
    paths:
      - '.github/workflows/offline-crypto-4h-ton-ip-v72.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run V72
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_4h_ton_ip_v72.py
