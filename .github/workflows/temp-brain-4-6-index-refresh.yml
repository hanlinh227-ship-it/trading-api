name: TEMP Brain 4.6 Index Refresh

on:
  push:
    branches:
      - brain/4-6-open-source-fusion
    paths:
      - '.github/workflows/temp-brain-4-6-index-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/4-6-open-source-fusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Refresh retrieval index with canonical builder
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          python AI_SKILL_LIBRARY/v4/tools/release.py verify
          python AI_SKILL_LIBRARY/validate_v4.py
          python AI_SKILL_LIBRARY/validate_skill_gateway.py
          python -m unittest AI_SKILL_LIBRARY.tests.test_brain_4_6_open_source_fusion AI_SKILL_LIBRARY.tests.test_v4_consolidation
      - name: Persist generated retrieval index only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git diff --cached --quiet && { echo 'No index change'; exit 1; }
          git commit -m "chore(brain): refresh 4.6 retrieval index"
          git push origin HEAD:brain/4-6-open-source-fusion
