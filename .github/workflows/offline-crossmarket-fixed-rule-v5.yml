name: Offline Crossmarket Fixed Rule V5
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crossmarket_fixed_rule_v5.py'
      - '.github/workflows/offline-crossmarket-fixed-rule-v5.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-credit fixed-rule optimizer
        run: python scripts/offline_crossmarket_fixed_rule_v5.py
