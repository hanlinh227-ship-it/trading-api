name: V77.18.32 Index Provider Fix
on:
  push:
    branches: [v771832-index-provider-fix]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771832-index-provider-fix
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch provider and validator
        run: |
          python3 scripts/patch_v771832_index_provider.py
          python3 scripts/patch_v771832_validator.py
      - name: Validate
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771832-dist
      - name: Commit production source
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js .github/workflows/validate-cloudflare-v77.yml
          git commit -m "V77.16.13 Index provider R2" || exit 0
          git push origin HEAD:v771832-index-provider-fix
