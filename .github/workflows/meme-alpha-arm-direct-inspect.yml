name: Meme Alpha ARM Direct Inspect
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-arm-direct-inspect.yml']
jobs:
  inspect:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Inspect root ARM repair path
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SAFE DEPLOY FILE ==='
          ls -l /usr/local/sbin/meme-alpha-safe-deploy || true
          sed -n '1,240p' /usr/local/sbin/meme-alpha-safe-deploy 2>/dev/null || true
          echo '=== ROOT REPO SYNC ==='
          ROOT=/opt/trading/trading-api
          git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD 2>/dev/null || true
          git -c safe.directory="$ROOT" -C "$ROOT" rev-parse origin/auto-futures-v1 2>/dev/null || true
          echo '=== ARM VISIBILITY ==='
          ls -ld /etc/meme-alpha 2>/dev/null || true
          ls -l /etc/meme-alpha/micro-live-armed 2>/dev/null || true
          cat /etc/meme-alpha/micro-live-armed 2>/dev/null || true
          echo '=== GATE ==='
          cat /opt/meme-alpha/app/runtime-status/micro-live-gate.json 2>/dev/null || true
