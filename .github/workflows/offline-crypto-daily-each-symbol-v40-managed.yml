name: Offline Crypto Daily Each Symbol V40 Managed
on:
  push:
    paths:
      - 'scripts/offline_crypto_daily_each_symbol_v40_managed.py'
      - '.github/workflows/offline-crypto-daily-each-symbol-v40-managed.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run managed daily per-coin test
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_daily_each_symbol_v40_managed.py
