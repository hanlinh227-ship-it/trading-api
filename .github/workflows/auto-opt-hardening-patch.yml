name: Auto Opt Hardening Patch

on:
  push:
    branches: [auto-opt-20260825]
    paths:
      - '.github/workflows/auto-opt-hardening-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-opt-20260825
          fetch-depth: 0
      - name: Apply bounded hardening patches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/bybit-auto-v1.js');s=p.read_text()
          old='''    const [wallet,pos]=await Promise.all([api.wallet(),api.positions()]),acct=wallet?.result?.list?.[0]||{},coin=(acct.coin||[]).find(x=>x.coin==="USDT")||{};\n    equity=Number(acct.totalEquity||coin.equity||coin.walletBalance||0);\n    if(!(equity>0))return {ok:true,executed:false,mode,reason:"LIVE_EQUITY_INVALID",equity,state};\n    positions=(pos?.result?.list||[]).filter(x=>Number(x.size||0)>0);\n    try{await reconcileLivePnl(api,state,cfg);}catch(e){return {ok:true,executed:false,mode,reason:"DAILY_PNL_RECONCILIATION_FAILED",error:String(e?.message||e),state};}\n    lifecycles=await manageLivePositions(env,api,state,positions,cfg);await put(env,state);'''
          new='''    const [walletResult,posResult]=await Promise.allSettled([api.wallet(),api.positions()]);\n    if(posResult.status!=="fulfilled")return {ok:true,executed:false,mode,reason:"LIVE_POSITION_FETCH_FAILED",managementOnly:true,error:String(posResult.reason?.message||posResult.reason||"POSITION_FETCH_FAILED"),state};\n    positions=(posResult.value?.result?.list||[]).filter(x=>Number(x.size||0)>0);\n    lifecycles=await manageLivePositions(env,api,state,positions,cfg);await put(env,state);\n    const wallet=walletResult.status==="fulfilled"?walletResult.value:null,acct=wallet?.result?.list?.[0]||{},coin=(acct.coin||[]).find(x=>x.coin==="USDT")||{};\n    equity=Number(acct.totalEquity||coin.equity||coin.walletBalance||0);'''
          if old not in s: raise SystemExit('auto-v1 wallet/manager patch anchor not found')
          s=s.replace(old,new,1)
          old='''    const managerFailure=lifecycles.find(x=>x.reason==="MANAGER_FAILED"||x.reason==="POSITION_DATA_INVALID");\n    if(managerFailure)return {ok:true,executed:false,mode,reason:"POSITION_MANAGEMENT_DEGRADED",managerFailure,lifecycles,state};\n    if(entryBlockReason)return {ok:true,executed:false,mode,reason:entryBlockReason,managementOnly:true,lifecycles,equity,state};'''
          new='''    const managerFailure=lifecycles.find(x=>x.reason==="MANAGER_FAILED"||x.reason==="POSITION_DATA_INVALID");\n    if(managerFailure)return {ok:true,executed:false,mode,reason:"POSITION_MANAGEMENT_DEGRADED",managerFailure,lifecycles,state};\n    if(walletResult.status!=="fulfilled"||!(equity>0))return {ok:true,executed:false,mode,reason:"LIVE_EQUITY_INVALID",managementOnly:true,equity,lifecycles,error:walletResult.status==="rejected"?String(walletResult.reason?.message||walletResult.reason):null,state};\n    let pnlReconcileError=null;try{await reconcileLivePnl(api,state,cfg);}catch(e){pnlReconcileError=String(e?.message||e);}\n    await put(env,state);\n    if(pnlReconcileError)return {ok:true,executed:false,mode,reason:"DAILY_PNL_RECONCILIATION_FAILED",managementOnly:true,error:pnlReconcileError,lifecycles,equity,state};\n    if(entryBlockReason)return {ok:true,executed:false,mode,reason:entryBlockReason,managementOnly:true,lifecycles,equity,state};'''
          if old not in s: raise SystemExit('auto-v1 pnl patch anchor not found')
          s=s.replace(old,new,1)
          old='''  const tick=Number(setup.filters?.tickSize||0),sl=roundTick(setup.sl,tick),tp=roundTick(tpForReward(setup.side,f.avgPrice,f.executedQty,sizing.rewardUsd),tick),actualRiskPerUnit=Math.abs(f.avgPrice-sl),actualRisk=actualRiskPerUnit*f.executedQty,actualReward=Math.abs(tp-f.avgPrice)*f.executedQty,actualRR=actualRisk>0?actualReward/actualRisk:null;'''
          new='''  const tick=Number(setup.filters?.tickSize||0),sl=roundTick(setup.sl,tick),rewardTp=tpForReward(setup.side,f.avgPrice,f.executedQty,sizing.rewardUsd),structureTp=Number(setup.tp||0),boundedTp=setup.side==="Buy"?Math.min(Number(rewardTp||Infinity),structureTp):Math.max(Number(rewardTp||-Infinity),structureTp),tp=roundTick(boundedTp,tick),actualRiskPerUnit=Math.abs(f.avgPrice-sl),actualRisk=actualRiskPerUnit*f.executedQty,actualReward=Math.abs(tp-f.avgPrice)*f.executedQty,actualRR=actualRisk>0?actualReward/actualRisk:null;'''
          if old not in s: raise SystemExit('auto-v1 tp patch anchor not found')
          s=s.replace(old,new,1);p.write_text(s)

          p=Path('cloudflare-worker/bybit-auto-hub.js');s=p.read_text()
          old='''async function statsText(env,s){let l={};try{l=await getBybitLearningState(env)||{};}catch{}return ["📈 PNL / LEARNING",`Realized ${money(s.state?.realizedUsd||0)} • Trades ${Number(s.state?.trades||0)}`,`Closed ${Number(s.state?.lastPnlReconcile?.closedTrades||0)}`,`Learning ${Number(l.sampleCount??l.samples?.length??0)}`,`Last trade ${s.state?.lastTradeAt?new Date(Number(s.state.lastTradeAt)).toISOString():"—"}`].join("\\n");}'''
          new='''async function statsText(env,s){let l={};try{l=await getBybitLearningState(env)||{};}catch{}return ["📈 PNL / LEARNING",`Realized ${money(s.state?.realizedUsd||0)} • Trades ${Number(s.state?.trades||0)}`,`Closed ${Number(s.state?.lastPnlReconcile?.closedTrades||0)}`,`Learning ${Number(l.summary?.sampleSize||0)} • ${l.providerSet||"AUTO_CORE_3"}`,`Last trade ${s.state?.lastTradeAt?new Date(Number(s.state.lastTradeAt)).toISOString():"—"}`].join("\\n");}'''
          if old not in s: raise SystemExit('hub stats anchor not found')
          s=s.replace(old,new,1)
          old='''function runtimeText(s){return ["⚙️ AUTO RUNTIME",`Execution ${s.mode} / ${s.state?.executionMode||"UNKNOWN"}`,`Positions ${s.positions.length} • orders ${s.openOrders.length}`,`AI ${s.ai?.ok?"OK":"DEGRADED"}`,`Last AI ${s.state?.lastAiReview?.at||"—"}`,`Last quote ${s.state?.lastPostAiQuote?.at||"—"}`,`Last manager ${s.state?.lastPositionManagement?.at||"—"}`,`Telegram entry ${s.state?.lastTelegramEntryAt||"—"}`,`Checked ${s.checkedAt}`].join("\\n");}'''
          new='''function runtimeText(s){const pm=s.state?.lastPositionManagement?.results||[],last=pm.at?.(-1)||{};return ["⚙️ AUTO RUNTIME",`Execution ${s.mode} / ${s.state?.executionMode||"UNKNOWN"}`,`Positions ${s.positions.length} • orders ${s.openOrders.length}`,`AI ${s.ai?.ok?"OK":"DEGRADED"}`,`Leverage ${s.state?.lastLeverageSet?.requested?`${s.state.lastLeverageSet.requested}x`:"AUTO 1-5x"}`,`Last AI ${s.state?.lastAiReview?.at||"—"}`,`Last quote ${s.state?.lastPostAiQuote?.at||"—"}`,`Last manager ${s.state?.lastPositionManagement?.at||"—"}${last.verdict?` • ${last.verdict}`:""}`,`Telegram entry ${s.state?.lastTelegramEntryAt||"—"}`,`Checked ${s.checkedAt}`].join("\\n");}'''
          if old not in s: raise SystemExit('hub runtime anchor not found')
          s=s.replace(old,new,1);p.write_text(s)
          PY
      - name: Static invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'managementAlwaysOn:true' cloudflare-worker/bybit-auto-controller.js
          grep -q 'entryBlockReason' cloudflare-worker/bybit-auto-v1.js
          grep -q 'openPlans:s.openPlans||{}' cloudflare-worker/bybit-auto-v1.js
          grep -q 'LEVERAGE_SET_FAILED' cloudflare-worker/bybit-auto-v1.js
          grep -q 'MARGIN_CAP_EXCEEDED' cloudflare-worker/bybit-scalp-engine.js
          grep -q 'NATIVE_TRAILING_MISSING_AFTER_SET' cloudflare-worker/bybit-auto-v1.js
          grep -q 'TRAIL_ALREADY_TIGHT' cloudflare-worker/bybit-position-manager.js
          grep -q 'AUTO_CORE_3_V1' cloudflare-worker/bybit-learning-engine.js
          grep -q 'Promise.allSettled' cloudflare-worker/bybit-auto-v1.js
          ! grep -q 'try{await api.setLeverage(setup.symbol,cfg.leverage);}catch{}' cloudflare-worker/bybit-auto-v1.js
      - name: Worker validation
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund && npm run check
      - name: Commit validated patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/bybit-auto-v1.js cloudflare-worker/bybit-auto-hub.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Finish validated AUTO reliability hardening'
          git push origin HEAD:auto-opt-20260825
