          new_geometry=r'''function geometry(side,s={},setup='',entryTier='CONFIRM',strength='NORMAL'){const e=num(s.price),floor=distFloor(s),st=s.structure15||{},sw=s.sweep5||{};let sl=0;if(side==='Buy')sl=Math.min(num(sw.priorLow)||e-floor,num(st.recentLow)||e-floor,e-floor);else sl=Math.max(num(sw.priorHigh)||e+floor,num(st.recentHigh)||e+floor,e+floor);let risk=Math.abs(e-sl);if(risk<floor)risk=floor;const fastScalp=/(MOMENTUM|SQUEEZE|TRANSITION|RANGE_MICRO|PROBE)/.test(String(setup));if(fastScalp){const r5=Math.max(0,num(s.range5?.width)),cap=Math.max(floor*1.65,Math.min(e*.00220,Math.max(floor,r5*.25)));risk=clamp(risk,floor,cap);}sl=side==='Buy'?e-risk:e+risk;const tier=String(entryTier||'CONFIRM'),idx=tier==='PROBE'?0:tier==='FULL'?2:1,regime=String(s.regime||'TRANSITION'),profiles={RANGE:[1.65,1.85,2.05],SQUEEZE:[1.85,2.20,2.55],TREND_UP:[2.05,2.55,2.95],TREND_DOWN:[2.05,2.55,2.95],BREAKOUT_UP:[2.20,2.85,3.30],BREAKOUT_DOWN:[2.20,2.85,3.30],REVERSAL:[1.85,2.15,2.45],TRANSITION:[1.90,2.25,2.60],HIGH_VOL_SHOCK:[1.55,1.75,1.95]},row=profiles[regime]||profiles.TRANSITION;let runner=row[idx];if(/BREAKOUT/.test(String(setup)))runner+=.10;if(/MOMENTUM|SQUEEZE/.test(String(setup)))runner+=.05;if(/PULLBACK/.test(String(setup)))runner=Math.max(runner,tier==='FULL'?2.85:2.40);if(/LIQUIDATION/.test(String(setup)))runner=Math.min(runner,2.55);if(String(strength)==='STRONG')runner+=tier==='PROBE'?.06:.12;if(String(strength)==='A_PLUS')runner+=tier==='PROBE'?.10:.25;runner=clamp(runner,1.55,3.75);const tp=side==='Buy'?e+risk*runner:e-risk*runner;return {entry:e,sl,tp,rr:runner,stopDistance:risk,profitRegime:regime,profitProfile:'REGIME_AWARE_INITIAL_TARGET_V1'};}
