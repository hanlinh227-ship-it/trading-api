          new_head=r'''  const baseSl=num(latest.sl)||currentStop,d=Math.max(filters.tickSize*4,Math.abs(num(latest.entry)-baseSl)),favour=side==="Buy"?mark-num(latest.entry):num(latest.entry)-mark,r=favour/d,stability=positionStability(side,market,cfg),tier=String(latest.entryTier||'CONFIRM'),profitProfile=regimeProfitProfile(cfg,market,tier),baseLock=Math.max(.35,num(cfg?.scalp?.profitLockR)||.40),baseTrail=Math.max(baseLock+.28,num(cfg?.scalp?.trailStartR)||.98),rawLock=tier==='PROBE'?Math.max(.36,baseLock*.92):tier==='CONFIRM'?Math.max(.40,baseLock):baseLock,rawTrail=tier==='PROBE'?Math.max(rawLock+.25,baseTrail*.92):tier==='CONFIRM'?Math.max(rawLock+.22,baseTrail):baseTrail,lockR=clamp(rawLock*profitProfile.lockMult,.34,1.25),trailR=clamp(Math.max(lockR+.20,rawTrail*profitProfile.trailMult),lockR+.20,2.10),costBps=Math.max(11,num(latest.costBps),num(latest.costReserveUsd)>0&&num(latest.entry)*Math.abs(num(latest.qty))>0?num(latest.costReserveUsd)/(num(latest.entry)*Math.abs(num(latest.qty)))*10000:0),bufferMult=Math.max(1,num(cfg?.scalp?.netProfitLockBufferMult)||1.06),feeBuffer=Math.max(filters.tickSize*2,num(latest.entry)*costBps/10000*bufferMult),be=side==="Buy"?num(latest.entry)+feeBuffer:num(latest.entry)-feeBuffer,canNetLock=side==="Buy"?mark>be+filters.tickSize:mark<be-filters.tickSize,peakNow=Math.max(num(state.positionPeakR),r),decelerating=cfg?.positionControl?.profitLockOnDeceleration!==false&&stability.soft&&r>=Math.max(.35,num(cfg?.positionControl?.decelerationLockMinR)||.48,lockR*.85)&&peakNow>=Math.max(.45,num(cfg?.positionControl?.decelerationPeakMinR)||.65,lockR+.18);'''
          text=text[:mstart]+new_head+text[mend:]

          pstart=text.index('  state.positionPeakR=',text.index('async function manageCluster'))
