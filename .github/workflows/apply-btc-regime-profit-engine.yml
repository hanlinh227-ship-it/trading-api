          text=text.replace('export const BTC_HYPERSCALE_ENGINE_VERSION="BYBIT-BTC-HYPERSCALE-2.9-ULTRAFAST-TIERED";','export const BTC_HYPERSCALE_ENGINE_VERSION="BYBIT-BTC-HYPERSCALE-3.0-REGIME-PROFIT";',1)
