  const entry=Math.max(0,num(setup?.entry)),stop=Math.abs(entry-num(setup?.sl)),target=Math.max(0,num(riskUsd));if(!(entry>0&&stop>0&&target>0))return {ok:false,reason:'STOP_OR_RISK_INVALID'};
  const step=Math.max(1e-12,num(filters.qtyStep)||.001),minQty=Math.max(step,num(filters.minQty)||step),maxQty=Math.max(minQty,num(filters.maxQty)||1e9),minNotional=Math.max(0,num(filters.minNotional)||5),capital=Math.max(0,num(capitalBaseUsd)||num(equityUsd)),lev=Math.max(1,num(leverage)),marginCapUsd=capital*clamp(num(marginCapPct)||78,30,84)/100,hardRiskCap=Math.max(target,num(maxRiskUsd)||target*1.20),strength=String(setup?.strength||'NORMAL'),tier=String(setup?.entryTier||'CONFIRM'),softMult=tier==='PROBE'?1.16:tier==='CONFIRM'?1.28:strength==='A_PLUS'?1.45:strength==='STRONG'?1.35:1.30,softRiskCap=Math.min(hardRiskCap,target*softMult),costBps=Math.max(0,num(setup?.cost?.totalCostBps||setup?.cost?.baseRoundTripCostBps)),unitCost=entry*costBps/10000,raw=target/stop;
  const minByNotional=ceilStep(minNotional/entry,step),minimum=Math.min(maxQty,Math.max(minQty,minByNotional)),maxByMargin=floorStep(marginCapUsd*lev/entry,step),maxByHardEffective=floorStep(hardRiskCap/Math.max(1e-12,stop+unitCost),step),upper=Math.min(maxQty,maxByMargin,maxByHardEffective),qs=new Set();
  const add=q=>{q=Math.min(maxQty,Math.max(minimum,Math.round(q/step)*step));if(q>=minimum-1e-12)qs.add(Number(q.toFixed(12)));};add(minimum);if(upper>=minimum-1e-12){const count=Math.floor((upper-minimum)/step+1e-9)+1;if(count<=300){for(let i=0;i<count;i++)add(minimum+i*step);}else{add(upper);const center=clamp(raw,minimum,upper);for(let k=-6;k<=6;k++)add(center+k*step);}}
  const candidates=[...qs].sort((a,b)=>a-b).map(q=>{const notional=q*entry,priceRisk=q*stop,initialMargin=notional/lev,costReserve=notional*costBps/10000;return {qty:q,notionalUsd:notional,actualRiskUsd:priceRisk,priceRiskUsd:priceRisk,costReserveUsd:costReserve,effectiveLossEstimateUsd:priceRisk+costReserve,initialMarginUsd:initialMargin,leverage:lev,capitalBaseUsd:capital,marginCapPct};});
  const riskFeasible=candidates.filter(x=>x.actualRiskUsd<=softRiskCap+1e-9&&x.effectiveLossEstimateUsd<=hardRiskCap+1e-9&&x.initialMarginUsd<=marginCapUsd+1e-9);
  if(!riskFeasible.length){const min=candidates[0];if(min&&min.effectiveLossEstimateUsd>hardRiskCap+1e-9)return {ok:false,reason:'MIN_QTY_EXCEEDS_HARD_EFFECTIVE_RISK_CAP',qty:min.qty,actualRiskUsd:min.actualRiskUsd,effectiveLossEstimateUsd:min.effectiveLossEstimateUsd,targetRiskUsd:target,softRiskCapUsd:softRiskCap,hardRiskCapUsd:hardRiskCap};if(min&&min.initialMarginUsd>marginCapUsd+1e-9)return {ok:false,reason:'POSITION_MARGIN_TOO_LARGE',qty:min.qty,initialMarginUsd:min.initialMarginUsd,marginCapUsd,marginCapPct,capitalBaseUsd:capital};return {ok:false,reason:'QUANTIZED_SIZE_OUTSIDE_ADAPTIVE_RISK_BAND',targetRiskUsd:target,softRiskCapUsd:softRiskCap,hardRiskCapUsd:hardRiskCap,candidates};}
  let chosen=[...riskFeasible].sort((a,b)=>Math.abs(a.actualRiskUsd-target)-Math.abs(b.actualRiskUsd-target))[0];if(tier!=='PROBE'&&strength!=='NORMAL'){const balanced=riskFeasible.filter(x=>x.actualRiskUsd>=target*.78).sort((a,b)=>Math.abs(a.actualRiskUsd-target)-Math.abs(b.actualRiskUsd-target));if(balanced.length)chosen=balanced[0];}
  return {ok:true,...chosen,targetRiskUsd:target,softRiskCapUsd:softRiskCap,hardRiskCapUsd:hardRiskCap,quantized:true,qtyStep:step,minQty,entryTier:tier,selectionPolicy:'FEE_AWARE_CONTINUOUS_QUANTIZED_NEAREST_TARGET_WITH_HARD_EFFECTIVE_RISK_AND_MARGIN_CAP'};
}

'''
