function adaptiveTargetPlan(side,latest,mark,market,stability,cfg,d,tick,r){const ap=cfg?.scalp?.adaptiveProtection||{},tier=String(latest?.entryTier||"CONFIRM"),profile=regimeProfitProfile(cfg,market,tier),base=profile.baseR,minR=Math.max(.8,num(ap.minTargetR)||1.25),maxR=profile.maxR,support=positionSupport(side,market),strong=Math.max(0,support),weak=Math.max(0,-support),extend=Math.max(0,num(ap.strongExtensionR)||.45),compress=Math.max(0,num(ap.weakCompressionR)||.20),pulseConf=num(market.marketPulse?.confidence),runnerMinSupport=num(ap.runnerExtensionMinSupport)||.16;let targetR=clamp(base+strong*extend-weak*compress,minR,maxR);if(support>=runnerMinSupport&&pulseConf>.42&&/(TREND|BREAKOUT|SQUEEZE|TRANSITION)/.test(profile.regime))targetR=Math.min(maxR,targetR+.20*clamp(pulseConf,0,1));const po=ap.profitObjective||{},capital=Math.max(0,num(latest?.capitalBaseUsd||latest?.equityUsd)),qty=Math.abs(num(latest?.qty)),strength=String(latest?.strength||'NORMAL'),pct=tier==='PROBE'?num(po.probePct)||.35:tier==='FULL'?num(po.fullPct)||1.10:num(po.confirmPct)||.75,boost=strength==='A_PLUS'?num(po.aPlusBoost)||1.30:strength==='STRONG'?num(po.strongBoost)||1.15:1,preferredNetProfitUsd=capital*pct/100*boost,minSupport=num(po.minSupport)||.12;if(po.enabled!==false&&qty>0&&d>0&&support>=minSupport){const requiredR=(preferredNetProfitUsd+Math.max(0,num(latest?.costReserveUsd)))/(qty*d);if(Number.isFinite(requiredR)&&requiredR>0)targetR=Math.max(targetR,Math.min(maxR,requiredR));}if(stability.soft&&support<-.22&&r>.75)targetR=Math.min(targetR,clamp(r+.55,minR,maxR));if(stability.hard&&support<-.35&&r>.50)targetR=Math.min(targetR,clamp(r+.38,minR,maxR));const entry=num(latest?.entry),gap=Math.max(tick*8,d*Math.max(.06,num(ap.minLiveGapR)||.12));let target=side==="Buy"?entry+d*targetR:entry-d*targetR;if(side==="Buy")target=Math.max(target,mark+gap);else target=Math.min(target,mark-gap);return {target:roundTick(target,tick),targetR,support,supportPct:Math.round(clamp(50+support*50,0,100)),baseTargetR:base,minR,maxR,preferredNetProfitUsd,profitEngineVersion:'REGIME_ADAPTIVE_PROFIT_ENGINE_V1',profile};}
'''
