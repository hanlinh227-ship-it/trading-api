          new_protect=r'''  state.positionPeakR=Math.max(num(state.positionPeakR),r);state.profitEngineVersion="REGIME_ADAPTIVE_PROFIT_ENGINE_V1";let desired=currentStop,phase=null;if((r>=lockR||decelerating||(stability.hard&&r>=Math.max(.30,lockR*.70)))&&canNetLock){desired=tighten(side,desired,be);phase=stability.hard&&r<lockR?"HARD_REVERSAL_PROTECT":decelerating&&r<lockR?"SCALP_DECELERATION_LOCK":"SCALP_PROFIT_LOCK";}if(r>=trailR){const trailDist=Math.max(filters.tickSize*6,num(market.range5?.width)*Math.max(.05,num(cfg?.scalp?.trailRange5Pct)||.08)*profitProfile.trailWidthMult,mark*Math.max(.0005,num(cfg?.scalp?.trailPricePct)||.00070)*profitProfile.trailWidthMult),trail=side==="Buy"?mark-trailDist:mark+trailDist;desired=tighten(side,desired,trail);phase="SCALP_TRAIL";}const givebackActivation=Math.max(.75,num(cfg?.scalp?.adaptiveProtection?.peakGivebackActivationR)||1.10),liveSupport=positionSupport(side,market),dynamicGiveback=profitProfile.givebackR*(liveSupport>.35?1.25:liveSupport<-.20?.82:1);if(state.positionPeakR>=givebackActivation&&canNetLock){const lockedPeakR=Math.max(0,state.positionPeakR-dynamicGiveback);if(lockedPeakR>.05){const liveGap=Math.max(filters.tickSize*5,d*.10),rawGiveback=side==="Buy"?num(latest.entry)+d*lockedPeakR:num(latest.entry)-d*lockedPeakR,givebackStop=side==="Buy"?Math.min(rawGiveback,mark-liveGap):Math.max(rawGiveback,mark+liveGap);desired=tighten(side,desired,givebackStop);phase=phase||"PEAK_GIVEBACK_LOCK";state.lastPeakGiveback={at:iso(),side,peakR:state.positionPeakR,currentR:r,lockedPeakR,givebackR:dynamicGiveback,support:liveSupport,regime:profitProfile.regime};}}'''
          text=text[:pstart]+new_protect+text[pend:]

          old="singleWriter:true,timeGate:false}"
          new="singleWriter:true,timeGate:false,profitEngineVersion:adaptive?.profitEngineVersion||state.profitEngineVersion||null,preferredNetProfitUsd:adaptive?.preferredNetProfitUsd??null,profitProfile:adaptive?.profile||profitProfile}"
          if old not in text: raise SystemExit('ENGINE_ADAPTIVE_STATE_NOT_FOUND')
          text=text.replace(old,new,1)
