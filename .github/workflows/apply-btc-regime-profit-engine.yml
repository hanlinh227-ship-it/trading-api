          new="assert.equal(cfg.features.ultraFastFlow1s3s,true);assert.equal(cfg.features.marketPulseConsensus,true);assert.equal(cfg.features.tieredEntryRisk,true);assert.equal(cfg.features.regimeAwareProfitEngine,true);assert.equal(cfg.features.preferredNetProfitObjective,true);assert.equal(cfg.features.peakGivebackProtection,true);assert.equal(cfg.features.feeAwareContinuousSizing,true);assert.equal(cfg.entries.probeConfirmFull,true);assert.ok(cfg.risk.tierUpgradeMinR>0&&cfg.risk.tierUpgradeMinR<.5);assert.ok(cfg.scalp.adaptiveProtection.maxTargetR>=5);assert.equal(cfg.scalp.adaptiveProtection.profitObjective.neverForceEntry,true);"
