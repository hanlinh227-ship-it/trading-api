name: Apply Bybit Multi-Asset V3

on:
  push:
    paths:
      - '.github/btc-regime-profit-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-multi-asset-v3-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply deterministic multi-asset patch
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/apply-bybit-multi-asset-v3.py
          python3 -m py_compile bybit-live-bridge/bybit_live_bridge.py
          cd cloudflare-worker
          node validate-btc-hyperscale.mjs
      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker bybit-live-bridge .github/workflows/deploy-bybit-btc-bridge.yml
          git commit -m 'Upgrade Bybit runtime to profiled major-cap multi-asset StateFlow'
          git pull --rebase origin main
          git push origin HEAD:main
