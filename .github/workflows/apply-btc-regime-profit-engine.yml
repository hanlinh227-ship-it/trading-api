          text=text.replace("'SCALP_PROFIT_LOCK','nativeTpAlways','entryTier','BYBIT-BTC-HYPERSCALE-2.9-ULTRAFAST-TIERED'","'SCALP_PROFIT_LOCK','PEAK_GIVEBACK_LOCK','REGIME_ADAPTIVE_PROFIT_ENGINE_V1','preferredNetProfitUsd','nativeTpAlways','entryTier','BYBIT-BTC-HYPERSCALE-3.0-REGIME-PROFIT'",1)
          text=text.replace("'BTC_RISK_RECYCLE_V7_TIERED_SMART_QUANTIZED_SIZING'","'BTC_RISK_RECYCLE_V8_FEE_AWARE_CONTINUOUS_QUANTIZED_SIZING'",1)
          text=text.replace("'TIER_AWARE_NEAREST_TARGET_WITH_HARD_RISK_AND_MARGIN_CAP'","'FEE_AWARE_CONTINUOUS_QUANTIZED_NEAREST_TARGET_WITH_HARD_EFFECTIVE_RISK_AND_MARGIN_CAP'",1)
          text=text.replace("'BTC_STATE_FIRST_MICROSTRUCTURE_V8_PROBE_CONFIRM_FULL'","'BTC_STATE_FIRST_MICROSTRUCTURE_V9_REGIME_PROFIT_PROBE_CONFIRM_FULL'",1)
          text=text.replace("version:'BYBIT-BTC-STATEFLOW-2.5'","version:'BYBIT-BTC-STATEFLOW-2.6'",1)
