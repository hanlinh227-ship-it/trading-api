name: Meme Alpha ARM Repair Diagnostics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-arm-repair-now.yml']
jobs:
  diagnose:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose root ARM reconcile failure
        shell: bash
        run: |
          set +e
          ROOT=/opt/trading/trading-api
          APP=/opt/meme-alpha/app
          echo '=== ROOT / REMOTE ==='
          git -c safe.directory="$ROOT" -C "$ROOT" fetch origin auto-futures-v1 >/dev/null 2>&1
          echo "rootHead=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse HEAD 2>/dev/null)"
          echo "remote=$(git -c safe.directory="$ROOT" -C "$ROOT" rev-parse origin/auto-futures-v1 2>/dev/null)"
          echo '=== RECON FILE MODE ==='
          ls -l "$ROOT/auto-futures-v1/runtime/deploy_meme_alpha_v382_reconcile.sh" || true
          stat -c 'mode=%a uid=%u gid=%g' "$ROOT/auto-futures-v1/runtime/deploy_meme_alpha_v382_reconcile.sh" || true
          echo '=== EXECUTOR MARKER ==='
          grep -oE 'MICRO_LIVE_EXECUTOR_[A-Z0-9_]+=STARTED' "$APP/src/micro-live-executor.js" | tail -n 5 || true
          echo '=== ARM PATH ==='
          ls -ld /etc/meme-alpha || true
          ls -l /etc/meme-alpha/micro-live-armed || true
          stat -c 'arm_mode=%a uid=%u gid=%g size=%s' /etc/meme-alpha/micro-live-armed || true
          cat /etc/meme-alpha/micro-live-armed 2>&1 || true
          echo '=== DONE MARKER ==='
          ls -l /var/lib/meme-alpha/v382-root-reconciled.json || true
          cat /var/lib/meme-alpha/v382-root-reconciled.json 2>&1 || true
          echo '=== AUTO UPDATE TAIL ==='
          tail -n 180 "$ROOT/auto-futures-v1/logs/auto_update.log" 2>/dev/null || true
          echo '=== WATCH TAIL ==='
          tail -n 180 "$ROOT/auto-futures-v1/logs/github_watch.log" 2>/dev/null || true
          echo '=== UPDATE TIMER/SERVICE ==='
          systemctl is-active auto-futures-update.timer || true
          systemctl is-active auto-futures-update.service || true
          systemctl status auto-futures-update.service --no-pager -n 40 || true
          echo '=== GATE ==='
          cat "$APP/runtime-status/micro-live-gate.json" || true
