name: Meme Alpha v3.07 Sell-Route Budget Autotune
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v307-sellroute-budget-autotune.sh'
      - '.github/workflows/meme-alpha-v307-sellroute-budget-autotune.yml'
  workflow_dispatch:

jobs:
  autotune:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Reduce serial sell-route budget and verify two fresh cycles
        run: bash ops/meme-alpha/v307-sellroute-budget-autotune.sh
