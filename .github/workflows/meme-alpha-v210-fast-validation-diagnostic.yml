name: Meme Alpha v2.1.0 Fast Validation Diagnostic
on:
  push:
    paths:
      - 'ops/meme-alpha/v210-fast-validation-diagnostic.sh'
      - '.github/workflows/meme-alpha-v210-fast-validation-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose PAPER readiness bottleneck
        run: bash ops/meme-alpha/v210-fast-validation-diagnostic.sh
