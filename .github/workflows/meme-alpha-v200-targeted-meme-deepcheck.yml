name: Meme Alpha v2.0 Targeted Meme Deepcheck
on:
  push:
    paths:
      - 'ops/meme-alpha/v200-targeted-meme-deepcheck.sh'
      - '.github/workflows/meme-alpha-v200-targeted-meme-deepcheck.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-alpha-v200-deepcheck
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Deploy and soak targeted deep-check
        run: bash ops/meme-alpha/v200-targeted-meme-deepcheck.sh
