name: MT5 Progressive XAU BTC Backtest

on:
  push:
    branches: [main]
    paths:
      - 'research/mt5_progressive_tp_backtest_v3.py'
      - 'research/mt5_progressive_tp_backtest_v4.py'
      - 'research/mt5_progressive_tp_backtest_v5.py'
      - '.github/workflows/mt5-progressive-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run BTC six-month no-SL refinement V5
        run: |
          mkdir -p research/results
          python3 research/mt5_progressive_tp_backtest_v5.py | tee research/results/mt5_progressive_v5.txt

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: mt5-progressive-v5-result
          path: research/results/mt5_progressive_v5.txt
          if-no-files-found: error
          retention-days: 30
