name: Meme Alpha v2.9 Embedded Health Audit
on:
  push:
    paths:
      - 'ops/meme-alpha/v294-embedded-health-audit.sh'
      - '.github/workflows/meme-alpha-v294-embedded-health-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v294-embedded-health-audit.sh
