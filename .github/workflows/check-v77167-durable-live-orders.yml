name: Check V77.16.7 Durable Live Orders
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-v77167-durable-live-orders.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait deploy
        run: sleep 45
      - name: Verify production state preservation
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'; : > V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/b0.json; echo "BEFORE_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/order-history" -o /tmp/h0.json; echo "HISTORY0_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo "CRYPTO_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/b1.json; echo "AFTER_CRYPTO_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 180 "$BASE/hub" -o /tmp/hub.json; echo "HUB_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/b2.json; echo "AFTER_HUB_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          curl -fsS --max-time 15 "$BASE/order-history" -o /tmp/h1.json; echo "HISTORY1_CURL=$?" >> V77167_LIVE_ORDER_CHECK.txt
          node <<'NODE' >> V77167_LIVE_ORDER_CHECK.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const s=j('/tmp/s.json'),b0=j('/tmp/b0.json'),b1=j('/tmp/b1.json'),b2=j('/tmp/b2.json'),c=j('/tmp/c.json'),hub=j('/tmp/hub.json'),h0=j('/tmp/h0.json'),h1=j('/tmp/h1.json');
          const rows=b=>Object.entries(b||{}).flatMap(([g,x])=>x&&typeof x==='object'?[...(x.marketActive||[]).map(p=>({g,k:'MARKET',...p})),...(x.limitActive||[]).map(p=>({g,k:'LIMIT_ACTIVE',...p})),...(x.limitPending||[]).map(p=>({g,k:'LIMIT_PENDING',...p}))]:[]);
          const ids=b=>rows(b).map(x=>x.id).filter(Boolean),r0=rows(b0),r1=rows(b1),r2=rows(b2),i0=ids(b0),i1=ids(b1),i2=ids(b2);
          const missing01=i0.filter(id=>!i1.includes(id)),missing12=i1.filter(id=>!i2.includes(id));
          const sourceOK=r2.every(x=>!!x.discoveredBy),hubLive=Object.entries(hub.books||{}).flatMap(([g,x])=>x&&typeof x==='object'?[...(x.marketActive||[]),...(x.limitActive||[])]:[]).length;
          console.log('VERSION='+s.version);console.log('BEFORE_ROWS='+r0.map(x=>x.g+':'+x.k+':'+x.symbol+':'+x.id+':'+x.discoveredBy).join('|'));console.log('AFTER_CRYPTO_ROWS='+r1.map(x=>x.g+':'+x.k+':'+x.symbol+':'+x.id+':'+x.discoveredBy).join('|'));console.log('AFTER_HUB_ROWS='+r2.map(x=>x.g+':'+x.k+':'+x.symbol+':'+x.id+':'+x.discoveredBy).join('|'));console.log('MISSING_AFTER_CRYPTO='+missing01.join('|'));console.log('MISSING_AFTER_HUB='+missing12.join('|'));console.log('CRYPTO_SCAN_TRIGGER='+c.scanTrigger);console.log('HUB_BOOKS='+(hub.books?'YES':'NO')+' LIVE='+hubLive);console.log('SOURCES_OK='+(sourceOK?'YES':'NO'));console.log('HISTORY_BEFORE='+(h0.rows||[]).length);console.log('HISTORY_AFTER='+(h1.rows||[]).length);console.log('PRESERVED_EVENTS='+(h1.rows||[]).filter(x=>x.event==='LIVE_STATE_PRESERVED').length);
          const pass=s.version==='V77.16.7'&&c.scanTrigger==='API_RUN_NOW'&&!!hub.books&&sourceOK&&missing01.length===0&&missing12.length===0&&Array.isArray(h1.rows);
          console.log('VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77167_LIVE_ORDER_CHECK.txt; git commit -m 'Report V77.16.7 durable live order verification' || exit 0; git push origin main
# retrigger production verification
