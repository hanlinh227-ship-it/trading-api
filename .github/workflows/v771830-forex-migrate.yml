name: V77.18.30 Forex Opportunity Migration
on:
  push:
    branches: [v771830-forex-opportunity-r3]
    paths:
      - 'scripts/patch_v771830_forex.py'
      - '.github/workflows/v771830-forex-migrate.yml'
permissions:
  contents: write
jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771830-forex-opportunity-r3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Forex Opportunity R3
        run: python3 scripts/patch_v771830_forex.py
      - name: Validate source and bundle
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771830-dist
      - name: Commit only source
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/dual-ai-intervention.js cloudflare-worker/index.js .github/workflows/validate-cloudflare-v77.yml
          git commit -m "V77.18.30 Forex Opportunity Routing R3" || exit 0
          git push origin HEAD:v771830-forex-opportunity-r3
