name: Fix Bybit V4.8 Capital Mirror Monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-v480-capital-mirror-fix-trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bybit-v480-capital-mirror-fix
  cancel-in-progress: false
jobs:
  repair:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Apply capital mirror and Android account freshness repair
        run: python3 .github/scripts/fix-bybit-v480-capital-mirror-monitor.py
      - name: Validate source invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q "BYBIT_CAPITAL_STATE_MIRROR_V1_READONLY_EXECUTION" cloudflare-worker/bybit-capital-state.js
          grep -q "CAPITAL_SYNC_ONLY_RECONCILES_ACCOUNT_AND_KV_METADATA" cloudflare-worker/bybit-control-plane.js
          grep -q "CAPITAL_INTELLIGENCE_PLUS_VPS_WS_MARK_TO_MARKET" cloudflare-worker/bybit-android-monitor.js
          grep -q "BYBIT-MULTI-STATEFLOW-4.8.0" cloudflare-worker/bybit-runtime-contract.js
          grep -q "BYBIT_MULTI_ASSET_RUNTIME_V26_CAPITAL_INTELLIGENCE_FAST_SCALE" cloudflare-worker/bybit-runtime-contract.js
          grep -q "martingale:false" cloudflare-worker/bybit-auto-config.js
          grep -q "addToLoser:false" cloudflare-worker/bybit-auto-config.js
          grep -q "requireFreshBook:true" cloudflare-worker/bybit-auto-config.js
          grep -q "requireFreshTrades:true" cloudflare-worker/bybit-auto-config.js
          grep -q "reduceOnlyExits:true" cloudflare-worker/bybit-auto-config.js
          cd cloudflare-worker
          npm install --no-audit --no-fund
          npm run check
      - name: Commit repair source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/bybit-control-plane.js cloudflare-worker/bybit-android-monitor.js cloudflare-worker/bybit-capital-state.js
          if ! git diff --cached --quiet; then
            git commit -m 'Mirror fresh account capital into controller and monitor V4.8'
            git push origin HEAD:main
          fi
      - name: Capture pre-sync trading state
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          set -a; source /etc/trading-v11-ai.env; set +a
          SECRET="${BYBIT_VPS_BRIDGE_SECRET:-${V11_AI_BRIDGE_SECRET:-}}"
          test -n "$SECRET"
          curl -fsS --max-time 45 -H "Authorization: Bearer $SECRET" "$BASE/bybit/runtime/preflight" > "$RUNNER_TEMP/pre.json"
      - name: Deploy Worker preserving LIVE variables
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          GITHUB_SHA="$(git rev-parse HEAD)" npm run deploy
      - name: Synchronize capital metadata without trading
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          set -a; source /etc/trading-v11-ai.env; set +a
          SECRET="${BYBIT_VPS_BRIDGE_SECRET:-${V11_AI_BRIDGE_SECRET:-}}"
          for i in $(seq 1 15); do
            CODE=$(curl -sS -o "$RUNNER_TEMP/sync.json" -w '%{http_code}' --max-time 60 -H "Authorization: Bearer $SECRET" "$BASE/bybit/capital/sync" || true)
            [ "$CODE" = 200 ] && break
            sleep 4
          done
          test "$CODE" = 200
          cat "$RUNNER_TEMP/sync.json"
      - name: Verify production capital, trading isolation and Android
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          set -a; source /etc/trading-v11-ai.env; set +a
          SECRET="${BYBIT_VPS_BRIDGE_SECRET:-${V11_AI_BRIDGE_SECRET:-}}"
          curl -fsS --max-time 45 -H "Authorization: Bearer $SECRET" "$BASE/bybit/runtime/preflight" > "$RUNNER_TEMP/post.json"
          curl -fsS --max-time 45 -H "Authorization: Bearer $SECRET" "$BASE/bybit/auto/state?symbol=BTCUSDT" > "$RUNNER_TEMP/state.json"
          curl -fsS --max-time 30 "$BASE/runtime/contract" > "$RUNNER_TEMP/contract.json"
          curl -fsS --max-time 30 "$BASE/bybit/monitor/bootstrap" > "$RUNNER_TEMP/monitor.json"
          PRE="$RUNNER_TEMP/pre.json" POST="$RUNNER_TEMP/post.json" SYNC="$RUNNER_TEMP/sync.json" STATE="$RUNNER_TEMP/state.json" CONTRACT="$RUNNER_TEMP/contract.json" MON="$RUNNER_TEMP/monitor.json" node <<'NODE'
          const fs=require('fs'),r=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const pre=r(process.env.PRE),post=r(process.env.POST),sync=r(process.env.SYNC),s=r(process.env.STATE),c=r(process.env.CONTRACT),m=r(process.env.MON),ctl=s.controller||{},st=s.state||{},a=post.account||{},cap=sync.capital||{},mir=sync.mirror||{};
          const keyPos=x=>(x.positions||[]).map(p=>({symbol:p.symbol,side:p.side,size:p.size,avgPrice:p.avgPrice,sl:p.stopLoss,tp:p.takeProfit})).sort((x,y)=>x.symbol.localeCompare(y.symbol));
          const hard=Math.min(Number(a.totalEquity||0),Number(a.walletBalance||0)),capacity=Number(ctl.continuousCapacityCapitalUsd||0),ratio=hard>0?capacity/hard:0,high=Number(ctl.capitalIntelligence?.highWaterUsd||cap.highWaterUsd||0),btcHigh=Number(st.highWaterUsd||0);
          const checks={version:post.version==='BYBIT-MULTI-STATEFLOW-4.8.0',live:post.mode==='LIVE',ready:post.ok===true,authenticated:!post.blockers?.includes('BYBIT_CREDENTIALS_MISSING'),contract:c.version==='BYBIT_MULTI_ASSET_RUNTIME_V26_CAPITAL_INTELLIGENCE_FAST_SCALE',syncOk:sync.ok===true&&sync.tradingExecuted===false,mirrorOk:mir.ok===true&&mir.controllerMirrored===true&&mir.tradingExecuted===false,capitalRecognized:ratio>=.98&&ratio<=1.001,highWaterSane:high>=Number(a.totalEquity)*.95&&high<=Number(a.totalEquity)*1.08,btcHighWaterSane:btcHigh>=Number(a.totalEquity)*.95&&btcHigh<=Number(a.totalEquity)*1.08,positionsUnchanged:JSON.stringify(keyPos(pre))===JSON.stringify(keyPos(post)),openOrdersUnchanged:Number(pre.openOrders)===Number(post.openOrders),monitor:m.schemaVersion==='BYBIT_ANDROID_MONITOR_V1'&&m.capabilities?.tradingControls===false,monitorRealtime:m.websocketProtocol?.minIntervalMs===500,noMartingale:c.recoveryMartingale===false&&c.recoveryAddToLoser===false};
          const pass=Object.values(checks).every(Boolean),out={pass,checkedAt:new Date().toISOString(),checks,account:a,capital:{hard,capacity,ratio,highWater:high,btcHighWater:btcHigh,authority:ctl.capitalIntelligence?.authority,recognition:ctl.capitalIntelligence?.recognition},mirror:mir,positions:keyPos(post),openOrders:post.openOrders,monitor:{defaultMs:m.websocketProtocol?.defaultIntervalMs,minMs:m.websocketProtocol?.minIntervalMs}};
          console.log(JSON.stringify(out,null,2));fs.writeFileSync(process.env.RUNNER_TEMP+'/bybit-v480-capital-mirror-audit.json',JSON.stringify(out,null,2)+'\n');if(!pass)process.exit(41);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bybit-v480-capital-mirror-audit
          path: ${{ runner.temp }}/bybit-v480-capital-mirror-audit.json
