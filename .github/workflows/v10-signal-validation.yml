name: V10 Signal Static Validation

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'signal-only-v10/**'
      - 'docs/checkpoints/V10_SIGNAL_ONLY_MASTER.md'
      - '.github/workflows/v10-signal-validation.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'signal-only-v10/**'
      - 'docs/checkpoints/V10_SIGNAL_ONLY_MASTER.md'
      - '.github/workflows/v10-signal-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Cloudflare V10 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in cloudflare-worker/index.js cloudflare-worker/hub-v10.js cloudflare-worker/hub-v10-unified-v2.js cloudflare-worker/hub-v10-unified-entry.js cloudflare-worker/signal-v10-scheduled-v2.js cloudflare-worker/signal-v10-council.js cloudflare-worker/signal-v10-learning.js cloudflare-worker/binance-control-plane.js cloudflare-worker/ai-arbiter.js cloudflare-worker/adaptive-tuning.js; do
            test -f "$f"
            node --check "$f"
          done
      - name: Validate isolated VPS V10 worker
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile signal-only-v10/ai_council_worker.py
          bash -n signal-only-v10/runtime/install_signal_v10.sh signal-only-v10/runtime/update_signal_v10.sh
      - name: Assert V10 single authority and AI conflict policy
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'telegramRootOwner:"SIGNAL_V10"' cloudflare-worker/index.js
          grep -q 'hub-v10-unified-entry.js' cloudflare-worker/index.js
          grep -q 'hub-v10-unified-v2.js' cloudflare-worker/hub-v10-unified-entry.js
          grep -q 'signal-v10-scheduled-v2.js' cloudflare-worker/hub-v10-unified-entry.js
          grep -q 'Scheduling is intentionally owned only by signal-v10-scheduled-v2.js' cloudflare-worker/hub-v10-unified-v2.js
          ! grep -q 'v10Core.scheduled' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'handleSignalV10Api' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'cb==="v10:council"' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'cb==="v10:stats"' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'AUTO_CRON_V10_CRYPTO_SCALP' cloudflare-worker/signal-v10-scheduled-v2.js
          grep -q 'crypto:1\*60e3' cloudflare-worker/signal-v10-scheduled-v2.js
          grep -q 'q?.fresh!==true' cloudflare-worker/signal-v10-scheduled-v2.js
          grep -q 'crypto:1.10' cloudflare-worker/signal-v10-council.js
          grep -q 'crypto:64' cloudflare-worker/signal-v10-council.js
          grep -q 'crypto:60' cloudflare-worker/signal-v10-council.js
          grep -q 'crypto:2\*3600e3' cloudflare-worker/signal-v10-council.js
          grep -q 'QUOTE_NOT_VERIFIED_FRESH' cloudflare-worker/signal-v10-council.js
          grep -q 'if(opp>0)' cloudflare-worker/signal-v10-council.js
          grep -q 'else if(same<2)' cloudflare-worker/signal-v10-council.js
          grep -q 'allPresent' cloudflare-worker/signal-v10-council.js
          grep -q "for name in ('deepseek','claude','codex')" signal-only-v10/ai_council_worker.py
          grep -q "all(x\['status'\]=='OK'" signal-only-v10/ai_council_worker.py
          ! grep -q 'auto-futures-v1' signal-only-v10/ai_council_worker.py
          grep -q 'binanceAutoProjectSeparate:true' cloudflare-worker/index.js
      - name: Validate Worker build manifest
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
