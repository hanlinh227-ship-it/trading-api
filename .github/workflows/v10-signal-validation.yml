name: V10 Signal Static Validation

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - 'signal-only-v10/**'
      - 'docs/checkpoints/V10_SIGNAL_ONLY_MASTER.md'
      - '.github/workflows/v10-signal-validation.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - 'signal-only-v10/**'
      - 'docs/checkpoints/V10_SIGNAL_ONLY_MASTER.md'
      - '.github/workflows/v10-signal-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Cloudflare V10 JavaScript
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            cloudflare-worker/index.js \
            cloudflare-worker/hub-v10.js \
            cloudflare-worker/hub-v10-unified-v2.js \
            cloudflare-worker/hub-v10-unified-entry.js \
            cloudflare-worker/signal-v10-scheduled-v2.js \
            cloudflare-worker/signal-v10-council.js \
            cloudflare-worker/signal-v10-learning.js \
            cloudflare-worker/binance-control-plane.js \
            cloudflare-worker/ai-arbiter.js \
            cloudflare-worker/adaptive-tuning.js; do
            test -f "$f"
            node --check "$f"
          done
      - name: Validate isolated VPS V10 worker
        shell: bash
        run: |
          set -euo pipefail
          test -f signal-only-v10/ai_council_worker.py
          test -f signal-only-v10/runtime/install_signal_v10.sh
          test -f signal-only-v10/runtime/update_signal_v10.sh
          python -m py_compile signal-only-v10/ai_council_worker.py
          bash -n signal-only-v10/runtime/install_signal_v10.sh signal-only-v10/runtime/update_signal_v10.sh
      - name: Assert V10 separation and complete review path
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'telegramRootOwner:"SIGNAL_V10"' cloudflare-worker/index.js
          grep -q 'telegramUx:"V10_UNIFIED_LIVE_HISTORY_V2"' cloudflare-worker/index.js
          grep -q 'legacyLiveOrdersVisible:true' cloudflare-worker/index.js
          grep -q 'candidateQuoteRefresh:true' cloudflare-worker/index.js
          grep -q 'autoCandidateQuoteRefresh:true' cloudflare-worker/index.js
          grep -q 'hub-v10-unified-entry.js' cloudflare-worker/index.js
          grep -q 'binanceAutoProjectSeparate:true' cloudflare-worker/index.js
          grep -q '/signal-v10/candidates' cloudflare-worker/signal-v10-council.js
          grep -q '/signal-v10/review' cloudflare-worker/signal-v10-council.js
          grep -q '/signal-v10/worker-health' cloudflare-worker/signal-v10-council.js
          grep -q 'V10_ONLY_HISTORY' cloudflare-worker/signal-v10-learning.js
          grep -q 'refreshCandidateQuotes' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'AUTO_CRON_V10_QUOTE_REFRESH' cloudflare-worker/signal-v10-scheduled-v2.js
          grep -q 'LỆNH ĐANG CHẠY' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'KHÔNG PHẢI LỆNH' cloudflare-worker/hub-v10-unified-v2.js
          grep -q 'SIGNAL_V10_ORIGIN' signal-only-v10/ai_council_worker.py
          ! grep -q 'auto-futures-v1' signal-only-v10/ai_council_worker.py
      - name: Validate Worker build manifest
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          npm run check
