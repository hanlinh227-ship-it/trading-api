name: Apply Bybit Profit Retention V4.2

on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-profit-retention-v42-trigger'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bybit-profit-retention-v42
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply V4.2 profit retention and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          python3 .github/scripts/apply-bybit-profit-retention-v42.py
          cd cloudflare-worker
          node --check bybit-auto-config.js
          node --check bybit-runtime-contract.js
          node --check bybit-symbol-engine.js
          node validate-btc-hyperscale.mjs
      - name: Commit validated runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/bybit-auto-config.js cloudflare-worker/bybit-runtime-contract.js cloudflare-worker/bybit-symbol-engine.js cloudflare-worker/validate-btc-hyperscale.mjs
          git commit -m 'Upgrade Bybit multi-asset profit retention to V4.2'
          git pull --rebase origin main
          git push origin HEAD:main
