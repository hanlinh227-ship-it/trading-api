name: VPS Sudo Diagnostic

on:
  push:
    branches: [fix/vps-noninteractive-bridge-install]
    paths:
      - '.github/workflows/vps-sudo-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Inspect bridge permissions and existing sudo contract
        shell: bash
        run: |
          set +e
          echo "RUNNER_USER=$(id -un)"
          id
          echo '--- sudo contract ---'
          sudo -n -l
          echo '--- bridge paths ---'
          ls -ld /opt /opt/bybit-btc-bridge /etc/systemd/system/bybit-btc-bridge.service /etc/bybit-btc-bridge.env 2>&1 || true
          find /opt/bybit-btc-bridge -maxdepth 1 -type f -printf '%M %u:%g %p\n' 2>&1 | sort || true
          echo '--- write probes without mutation ---'
          test -w /opt/bybit-btc-bridge; echo "APP_DIR_WRITABLE=$?"
          test -w /opt/bybit-btc-bridge/bybit_live_bridge.py; echo "BRIDGE_FILE_WRITABLE=$?"
          test -w /etc/systemd/system/bybit-btc-bridge.service; echo "UNIT_WRITABLE=$?"
          echo '--- process/service ---'
          systemctl is-active bybit-btc-bridge.service 2>&1 || true
          systemctl show bybit-btc-bridge.service -p MainPID -p User -p Group -p ExecStart -p FragmentPath --no-pager 2>&1 || true
          ps -eo user:20,pid,ppid,cmd | grep -E '[b]ybit_(live|public)_bridge|[a]ctions-runner' || true
          exit 0
