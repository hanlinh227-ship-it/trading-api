name: V11 Backtest Report Only

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v11_backtest_report_only.py'
      - '.github/workflows/v11-backtest-report-only.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-backtest-report-only
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      V11_REQUIRED_WR: '80'
      V11_MIN_TOTAL_TRADES: '40'
      V11_MIN_DEV_TRADES: '20'
      V11_MIN_VAL_TRADES: '8'
      V11_MIN_OOS_TRADES: '8'
      V11_TD_PAUSE_SEC: '62'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate report runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_backtest_report_only.py scripts/v11_symbol_backtest_4m.py

      - name: Run latest 122-day full catalog backtest
        run: |
          set -euo pipefail
          test -n "${TWELVE_DATA_API_KEY:-}" || { echo TWELVE_DATA_API_KEY_MISSING; exit 2; }
          python scripts/v11_backtest_report_only.py --days 122

      - name: Enforce report integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          p='data/v11_symbol_backtest_report_only.json'
          g='data/v11_backtest_report_only_gate.json'
          r=json.load(open(p,encoding='utf-8'))
          gate=json.load(open(g,encoding='utf-8'))
          meta=r['meta']; symbols=r['symbols']
          assert meta['requiredWinRate']==80
          assert meta['requiredWinRateInclusive']==80
          assert meta['allowedRR']==[1,2]
          assert meta['maxEntriesPerEligibleDay']==3
          assert meta['reportOnly'] is True and meta['aiTaskCreation'] is False
          assert len(symbols)==meta['totalSymbols']
          for s,x in symbols.items():
              for part in ('dev','validation','oos','full4m'):
                  m=x.get(part) or {}
                  if m:
                      assert int(m.get('maxTradesInDay',0)) <= 3, (s,part,m)
              prof=x.get('profile') or {}
              if prof:
                  assert prof.get('rr') in (1.0,2.0), (s,prof)
              if x.get('pass'):
                  assert x['full4m']['winRate'] >= 80.0, s
                  assert x['validation']['winRate'] >= 80.0, s
                  assert x['oos']['winRate'] >= 80.0, s
                  assert x['full4m']['trades'] >= 40, s
          assert gate['allPassed']==all(bool(x.get('pass')) for x in symbols.values())
          print({'allPassed':gate['allPassed'],'passCount':gate['passCount'],'totalSymbols':gate['totalSymbols'],'failing':len(gate['failingSymbols'])})
          PY

      - name: Commit report only
        run: |
          set -euo pipefail
          git config user.name trading-backtest-bot
          git config user.email trading-backtest-bot@users.noreply.github.com
          git add data/v11_symbol_backtest_report_only.json data/v11_backtest_report_only_gate.json data/v11_backtest_report_only_profiles.js
          git diff --cached --quiet && exit 0
          git commit -m 'backtest: report V11 latest 122-day per-symbol results'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload report evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-backtest-report-only-${{ github.run_id }}
          path: |
            data/v11_symbol_backtest_report_only.json
            data/v11_backtest_report_only_gate.json
          retention-days: 14
