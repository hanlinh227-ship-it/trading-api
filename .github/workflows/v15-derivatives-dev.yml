name: V15 Derivatives Dev
on:
  push:
    paths:
      - 'scripts/v15_derivatives_dev.py'
      - '.github/workflows/v15-derivatives-dev.yml'
  workflow_dispatch:
jobs:
  v15:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/v15_derivatives_dev.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v15_derivatives_dev.json
          git commit -m "Run V15 derivatives development" || exit 0
          git pull --rebase origin main || true
          git push || true
