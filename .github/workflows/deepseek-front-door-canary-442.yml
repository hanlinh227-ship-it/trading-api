name: DeepSeek Lane — Front Door Canary Hardening

on:
  push:
    branches: [work/deepseek-front-door-canary-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-front-door-canary-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-front-door-canary-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "brain_authority=false"
          echo "model_selection_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "evidence_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Verify bounded parser
        run: |
          set -euo pipefail
          python3 -m py_compile .github/scripts/deepseek_front_door_apply.py
          python3 - <<'PY'
          import json,tempfile
          from pathlib import Path
          files={
            "cloudflare-worker/validate-universal-canary.mjs":"export const a=1;\n",
            "cloudflare-worker/test-universal-canary.mjs":"console.log('ok');\n",
          }
          payload=json.dumps({"files":files})
          doc={"choices":[{"finish_reason":"stop","message":{"content":payload}}],"usage":{"prompt_tokens":1,"completion_tokens":1}}
          root=Path(tempfile.mkdtemp())
          response=root/"r.json"
          response.write_text(json.dumps(doc),encoding="utf-8")
          import subprocess,sys
          p=subprocess.run([sys.executable,".github/scripts/deepseek_front_door_apply.py",str(response),str(root)])
          assert p.returncode==0
          assert (root/"cloudflare-worker/validate-universal-canary.mjs").read_text()=="export const a=1;\n"
          assert (root/"cloudflare-worker/test-universal-canary.mjs").read_text()=="console.log('ok');\n"
          print("DEEPSEEK_FRONT_DOOR_PARSER_TEST=PASS")
          PY

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          current_validate=Path("cloudflare-worker/validate-universal-canary.mjs").read_text(encoding="utf-8")
          current_test=Path("cloudflare-worker/test-universal-canary.mjs").read_text(encoding="utf-8")
          prompt = """Fix the single load-bearing review finding in the current Task 5 implementation.
          
          Return one JSON object with exactly one key named files. files must map exactly:
          cloudflare-worker/validate-universal-canary.mjs
          cloudflare-worker/test-universal-canary.mjs
          
          REVIEW FINDING:
          The current generic runUniversalCanary() reports frontDoor.liveCanaryPass=true and frontDoorEvidence.live_canary_pass=true even when the caller injects a fake fetchImpl in a unit test. Its proof text says a deployed-worker canary ran. This violates the higher-level closure rule: repository-only/mock tests must never manufacture live production proof.
          
          REQUIRED FIX:
          1. Preserve all anti-cache behavior already implemented:
             - per-run __canary_nonce on every request,
             - cache-control=no-store,
             - pragma=no-cache,
             - x-canary-nonce,
             - exact sourceSha validation,
             - no token leakage.
          2. The reusable runUniversalCanary() function MUST NOT claim live-production proof merely because its request logic succeeded. It may report deterministic canary/backend logic results, but:
             - do not set liveCanaryPass=true from the generic/mockable function;
             - do not return evidence claiming a deployed/live canary ran.
          3. Live production proof may be created only in main(), after main invokes runUniversalCanary with the real default global fetch against WORKER_BASE_URL and real environment-provided client service tokens.
          4. In main(), after that real call succeeds:
             - log LIVE_PRODUCTION_CANARY=PASS;
             - log CACHE_BYPASS_PROVEN=PASS;
             - keep ACCOUNT_INTEGRATION_PROVEN=FALSE;
             - keep FRONT_DOOR_READY=FALSE.
          5. Add an internal, non-exported live evidence builder used by main only. Its output shape:
             source_sha: exact sourceSha
             gate: FRONT_DOOR_READY
             ready: false
             proofs: non-empty non-blank strings for live service-principal canary, cache bypass, project-state round trip, fresh Claude bootstrap/resume, stale-version 409, project isolation
             live_canary_pass: true
             cache_bypass_proven: true
             account_integration_proven: false
             blocking_reason: native_account_authorization_not_proven
             The builder must not include tokens, endpoint URL, raw responses, or nonce.
          6. If FRONT_DOOR_EVIDENCE_OUTPUT is a non-empty environment path, main may atomically write that live evidence JSON after the real canary succeeds. Use only Node built-ins. If unset, do not write a file.
          7. Unit tests must verify:
             - injected fake fetch path still validates anti-cache headers/query on every request;
             - generic runUniversalCanary result does NOT claim live production canary success and does not contain proof text claiming deployed/live execution;
             - accountIntegrationProven remains false and ready remains false;
             - malformed nonce is rejected before fetch;
             - existing project-state/bootstrap/409/isolation/high-risk behavior remains;
             - tokens never appear in returned generic result.
          8. Do not create another canary, endpoint, workflow, dependency, or readiness authority.
          9. Do not weaken existing tests or source SHA checks.
          
          Run:
          node cloudflare-worker/test-universal-canary.mjs
          
          Current validate file:
          ---BEGIN VALIDATE---
          """ + current_validate + """
          ---END VALIDATE---
          
          Current test file:
          ---BEGIN TEST---
          """ + current_test + """
          ---END TEST---
          
          Return no prose outside the JSON object."""
          request={
            "model": "deepseek-chat",
            "max_tokens": 8000,
            "temperature": 0,
            "response_format": {"type": "json_object"},
            "messages":[
              {"role":"system","content":"You are a bounded coding worker. Reply with exactly one JSON object whose only key is files mapping exactly the two allowed paths. No prose."},
              {"role":"user","content":prompt},
            ],
          }
          Path("/tmp/deepseek-request.json").write_text(json.dumps(request),encoding="utf-8")
          PY

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 300 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_front_door_apply.py /tmp/deepseek-response.json .

      - name: Enforce exact file ownership
        run: |
          set -euo pipefail
          allowed='^(cloudflare-worker/validate-universal-canary\.mjs|cloudflare-worker/test-universal-canary\.mjs)$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused Front Door canary test
        run: |
          set -euo pipefail
          node cloudflare-worker/test-universal-canary.mjs
          echo "DEEPSEEK_FRONT_DOOR_TESTS=PASS"

      - name: Commit bounded Front Door hardening
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add cloudflare-worker/validate-universal-canary.mjs cloudflare-worker/test-universal-canary.mjs
          git commit -m 'feat(front-door): harden live canary against cached proof'
          git push origin HEAD:work/deepseek-front-door-canary-442
          echo "DEEPSEEK_FRONT_DOOR_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
