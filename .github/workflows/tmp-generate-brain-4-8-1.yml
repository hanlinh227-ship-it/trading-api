name: TEMP Generate Brain 4.8.1

on:
  push:
    branches:
      - brain-v4-8-hourly-intelligence
    paths:
      - '.github/workflows/tmp-generate-brain-4-8-1.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-v4-8-hourly-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Brain dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Remove temporary workflow before generated indexing
        run: rm .github/workflows/tmp-generate-brain-4-8-1.yml
      - name: Generate immutable Brain 4.8.1 release
        run: |
          python AI_SKILL_LIBRARY/v4/tools/release.py build --version 4.8.1 --source hourly_continuous_intelligence --class feature --validated --known-good --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --root . --write
          python AI_SKILL_LIBRARY/v4/tools/release.py check --root .
          python -m unittest AI_SKILL_LIBRARY.tests.test_brain_4_8_continuous_intelligence AI_SKILL_LIBRARY.tests.test_brain_4_8_source_refresh -v
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"
      - name: Commit generated artifacts and self-delete workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A AI_SKILL_LIBRARY/v4/releases AI_SKILL_LIBRARY/v4/index .github/workflows/tmp-generate-brain-4-8-1.yml
          git commit -m "release: generate Brain 4.8.1 hourly intelligence"
          git push origin HEAD:brain-v4-8-hourly-intelligence
