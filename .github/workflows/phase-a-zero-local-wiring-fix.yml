name: Phase A Zero-Local Wiring Fix

on:
  push:
    branches:
      - fix/phase-a-zero-local-active-index
    paths:
      - '.github/workflows/phase-a-zero-local-wiring-fix.yml'

permissions:
  contents: write

jobs:
  patch-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-a-zero-local-active-index
          fetch-depth: 0
      - name: Patch exact-main artifact wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-cloudflare-worker.yml')
          text = path.read_text(encoding='utf-8')
          old = '''          python AI_SKILL_LIBRARY/v4/tools/validate_model_mesh_snapshot.py \\
            AI_SKILL_LIBRARY/v4/runtime/generated/model-mesh-snapshot.json \\
            --source-sha "$SOURCE_SHA"\n'''
          new = old + '''          python AI_SKILL_LIBRARY/v4/tools/compile_model_mesh_active_index.py \\
            --source-sha "$SOURCE_SHA"\n          python AI_SKILL_LIBRARY/v4/tools/validate_model_mesh_active_index.py \\
            AI_SKILL_LIBRARY/v4/runtime/generated/model-mesh-active-candidate-index.json \\
            --source-sha "$SOURCE_SHA"\n'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one Model Mesh snapshot validation block, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/phase-a-zero-local-wiring-fix.yml
          git diff --check
      - name: Commit minimal workflow fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-cloudflare-worker.yml .github/workflows/phase-a-zero-local-wiring-fix.yml
          git diff --cached --check
          git commit -m "fix(runtime): compile active candidate index in zero-local deploy"
          git push origin HEAD:fix/phase-a-zero-local-active-index
