name: Phase A Zero-Local Wiring Fix

on:
  push:
    branches:
      - fix/phase-a-zero-local-active-index
    paths:
      - '.github/workflows/phase-a-zero-local-wiring-fix.yml'

permissions:
  contents: write

jobs:
  patch-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase-a-zero-local-active-index
          fetch-depth: 0
      - name: Patch exact-main artifact wiring
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/deploy-cloudflare-worker.yml')
          lines = path.read_text(encoding='utf-8').splitlines()
          starts = [i for i, line in enumerate(lines) if 'python AI_SKILL_LIBRARY/v4/tools/validate_model_mesh_snapshot.py' in line]
          if len(starts) != 1:
              raise SystemExit(f'expected one snapshot validator command, found {len(starts)}')
          start = starts[0]
          end = next((i for i in range(start + 1, min(len(lines), start + 8)) if '--source-sha "$SOURCE_SHA"' in lines[i]), None)
          if end is None:
              raise SystemExit('snapshot validator source-sha terminator not found')
          indent = lines[start][:len(lines[start]) - len(lines[start].lstrip())]
          insertion = [
              indent + 'python AI_SKILL_LIBRARY/v4/tools/compile_model_mesh_active_index.py \\',
              indent + '  --source-sha "$SOURCE_SHA"',
              indent + 'python AI_SKILL_LIBRARY/v4/tools/validate_model_mesh_active_index.py \\',
              indent + '  AI_SKILL_LIBRARY/v4/runtime/generated/model-mesh-active-candidate-index.json \\',
              indent + '  --source-sha "$SOURCE_SHA"',
          ]
          if any('compile_model_mesh_active_index.py' in line for line in lines):
              raise SystemExit('active index compiler already wired')
          lines[end + 1:end + 1] = insertion
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/phase-a-zero-local-wiring-fix.yml
          git diff --check
      - name: Commit minimal workflow fix and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-cloudflare-worker.yml .github/workflows/phase-a-zero-local-wiring-fix.yml
          git diff --cached --check
          git commit -m "fix(runtime): compile active candidate index in zero-local deploy"
          git push origin HEAD:fix/phase-a-zero-local-active-index
