name: Meme Alpha V387 Unified Production
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v387-unified-production.yml']
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Final single-path V387 activation and live verification
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          SRC="$APP/src"
          RT="$APP/runtime-status"
          ST="$RT/v387-unified-final"
          BASE="$RT/deploy-candidates"
          ORIGINAL="$ST/run-paper.original.sh"
          [ -f "$ORIGINAL" ] || { echo V387_FAIL=ORIGINAL_RUNNER_MISSING; exit 2; }
          chmod 0755 "$ORIGINAL"

          # Production files are already V387 on disk. Validate the exact live files first.
          for f in safe-signal-export.js micro-live-gate.js micro-live-executor.js scanner.js; do node --check "$SRC/$f"; done
          grep -q 'V387_UNIFIED_LIVE' "$SRC/safe-signal-export.js"
          grep -q 'classificationOverride' "$SRC/safe-signal-export.js"
          grep -q 'V387_UNIFIED_PRODUCTION' "$SRC/micro-live-executor.js"
          grep -q 'MICRO_LIVE_EXECUTOR_V387_UNIFIED_PRODUCTION=STARTED' "$SRC/micro-live-executor.js"
          grep -q 'scaleAllowed:true' "$SRC/micro-live-gate.js"
          sigtest="$(node "$SRC/safe-signal-export.js" --self-test)"
          extest="$(node "$SRC/micro-live-executor.js" --self-test)"
          printf '%s\n' "$sigtest" "$extest"
          for k in V376_MULTI_STRATEGY_ROUTER_SELF_TEST=PASS TOKEN2022_HARD_BLOCK_PRESERVED=TRUE BOTH_FEEDS_DOWN_FAIL_CLOSED=TRUE; do grep -q "$k" <<<"$sigtest"; done
          for k in MICRO_EXECUTOR_V360_PROFIT_AWARE_SELF_TEST=PASS HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT EQUITY_GROWTH_SCALES_NEW_BUYS=TRUE MULTI_POSITION_NO_HARD_COUNT_LIMIT=TRUE ROTATION_TO_STRONGER_OPPORTUNITY=TRUE ONLINE_EXPECTANCY_LEARNING=TRUE; do grep -q "$k" <<<"$extest"; done

          OLD_PID="$(pgrep -fo '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true)"
          echo OLD_EXECUTOR_PID="${OLD_PID:-none}"

          # One controlled handoff. It runs as meme-alpha, so it can terminate the old
          # executor UID. It immediately execs the known-good original paper engine.
          cat > "$APP/run-paper.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          APP=/opt/meme-alpha/app
          ORIGINAL="$APP/runtime-status/v387-unified-final/run-paper.original.sh"
          for p in $(pgrep -f '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true); do kill -9 "$p" 2>/dev/null || true; done
          exec "$ORIGINAL"
          SH
          chmod 0755 "$APP/run-paper.sh"
          timeout 90s sudo -n /bin/systemctl restart meme-alpha-paper.service || true

          # Wait until systemd has relaunched the executor from the V387 file on disk.
          NEW_PID=''
          for i in $(seq 1 60); do
            NEW_PID="$(pgrep -fo '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true)"
            if [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$OLD_PID" ] && systemctl is-active --quiet meme-alpha-micro-live.service; then break; fi
            sleep 2
          done
          [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$OLD_PID" ] || { echo V387_FAIL=EXECUTOR_NOT_RELOADED; exit 3; }
          echo NEW_EXECUTOR_PID="$NEW_PID"

          # Remove the temporary hook permanently; there is only one normal paper entrypoint again.
          cp "$ORIGINAL" "$APP/run-paper.sh"
          chmod 0755 "$APP/run-paper.sh"
          timeout 90s sudo -n /bin/systemctl restart meme-alpha-paper.service || true

          # Refresh the three intelligence feeds through the already-authorized safe-deploy
          # path using byte-identical current production sources. This is a restart, not a code change.
          mkdir -p "$BASE"
          for spec in 'realtime:realtime-pool-pulse.js' 'trend:trend-pulse.js' 'whale:whale-flow-intel.js'; do
            comp="${spec%%:*}"; file="${spec##*:}"; name="v387-refresh-$file"
            cp -a "$SRC/$file" "$BASE/$name"
            sha="$(sha256sum "$BASE/$name" | awk '{print $1}')"
            sudo -n /usr/local/sbin/meme-alpha-safe-deploy "$comp" "$name" "$sha"
          done

          # Final live verification: fresh pipeline, real live gate, always-on scale flag,
          # one executor only, and no unsafe probe escapes the hard security contract.
          LIVE=0
          for i in $(seq 1 90); do
            sleep 2
            if python3 - <<'PY'
          import json,os,time,pathlib
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          gp=rt/'micro-live-gate.json'; sp=rt/'signal-snapshot.json'
          g=json.loads(gp.read_text()); s=json.loads(sp.read_text()); rows=s.get('candidates') or []
          age=time.time()-os.path.getmtime(sp)
          probes=[c for c in rows if c.get('decision')=='PROBE_CANDIDATE']
          unsafe=[c.get('symbol') for c in probes if c.get('securityDecision')!='PASS' or c.get('holderClusterDecision')!='PASS' or c.get('sellRoute') is not True or c.get('token2022') is True or (c.get('hardReject') or [])]
          summary={'gateVersion':g.get('version'),'allowed':g.get('allowed'),'armOk':g.get('armOk'),'armAttested':g.get('armAttested'),'executionMode':g.get('executionMode'),'sourceHealthy':g.get('sourceHealthy'),'riskEntryAllowed':g.get('riskEntryAllowed'),'liveRiskReady':g.get('liveRiskReady'),'scaleAllowed':g.get('scaleAllowed'),'reasons':g.get('reasons'),'signalAgeSec':round(age,1),'signalCount':len(rows),'probeCount':len(probes),'watchCount':sum(c.get('decision')=='WATCH' for c in rows),'routedCount':sum(bool((c.get('strategyRouter') or {}).get('selectedLane')) for c in rows),'unsafeProbes':unsafe}
          print(summary)
          assert g.get('version')=='2.7.0-v387-unified-production'
          assert g.get('allowed') is True
          assert g.get('armOk') is True and g.get('armAttested') is True
          assert g.get('executionMode')=='MICRO_LIVE'
          assert g.get('sourceHealthy') is True and g.get('riskEntryAllowed') is True and g.get('liveRiskReady') is True
          assert g.get('scaleAllowed') is True
          assert age < 45
          assert not unsafe
          PY
            then LIVE=1; break; fi
          done
          [ "$LIVE" = 1 ] || { echo V387_FAIL=LIVE_PIPELINE_NOT_READY; exit 4; }

          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do
            systemctl is-active --quiet "$svc" || { echo V387_FAIL_SERVICE="$svc"; exit 5; }
            echo "$svc=active"
          done
          [ "$(pgrep -fc '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true)" -eq 1 ] || { echo V387_FAIL=EXECUTOR_PROCESS_COUNT; exit 6; }
          grep -q 'V387_UNIFIED_PRODUCTION' "$SRC/micro-live-executor.js"
          grep -q 'scaleAllowed:true' "$SRC/micro-live-gate.js"
          ! grep -q 'v387-unified-final' "$APP/run-paper.sh"

          python3 - <<'PY'
          import json,pathlib,datetime,hashlib,os,time
          root=pathlib.Path('/opt/meme-alpha/app'); rt=root/'runtime-status'
          g=json.loads((rt/'micro-live-gate.json').read_text()); s=json.loads((rt/'signal-snapshot.json').read_text())
          state_path=pathlib.Path('/var/lib/meme-alpha/data/micro-live/state.json')
          try:
              state=json.loads(state_path.read_text()); open_positions=len(state.get('positions') or [])
          except Exception: open_positions=None
          out={'version':'V387_UNIFIED_PRODUCTION','activatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'executionMode':g.get('executionMode'),'allowed':g.get('allowed'),'sourceHealthy':g.get('sourceHealthy'),'liveRiskReady':g.get('liveRiskReady'),'scaleAllowed':g.get('scaleAllowed'),'signalCount':len(s.get('candidates') or []),'openPositions':open_positions,'universe':'ALL_SAFE_SCANNED_SOLANA_OPPORTUNITIES','features':['adaptive scanner','multi-strategy router','buy','hold','scale-in','rotation','profit-aware exits','online expectancy learning','realtime pulse','whale flow','Jito fallback'],'components':{}}
          for n in ['scanner.js','safe-signal-export.js','micro-live-gate.js','micro-live-executor.js','realtime-pool-pulse.js','trend-pulse.js','whale-flow-intel.js']:
              out['components'][n]=hashlib.sha256((root/'src'/n).read_bytes()).hexdigest()
          p=rt/'v387-unified-production.json'; tmp=p.with_suffix('.tmp'); tmp.write_text(json.dumps(out,indent=2)); tmp.replace(p)
          print(json.dumps(out))
          PY
          echo V387_UNIFIED_PRODUCTION=ACTIVE
          echo SCALE_ALLOWED=TRUE
          echo SINGLE_PRODUCTION_ENTRYPOINT=TRUE
          echo BUY_HOLD_SCALE_ROTATE_PROFIT_MANAGEMENT=UNIFIED
          echo HARD_SECURITY_HOLDER_INSIDER_SELLABILITY=ENFORCED
