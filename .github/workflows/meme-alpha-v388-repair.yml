name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect scanner loop and holder RPC client
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"
          echo '=== SCANNER ANALYZE ==='
          sed -n '580,910p' "$SRC/scanner.js"
          echo '=== SCANNER MAIN ==='
          sed -n '1080,1215p' "$SRC/scanner.js"
          echo '=== HOLDER RPC CLIENT ==='
          sed -n '1,450p' "$SRC/holder-cluster.js"
          echo '=== RUNTIME CONFIG SAFE KEYS ==='
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/opt/meme-alpha/app/config/runtime.json'); d=json.loads(p.read_text())
          for k,v in d.items():
            if any(x in k.lower() for x in ['key','secret','token','private','seed']): continue
            if isinstance(v,(str,int,float,bool)) or v is None: print(k,repr(v))
          PY
          echo V388_LOOP_RPC_INSPECT=COMPLETE
