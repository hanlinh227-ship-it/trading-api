name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect radar eligibility and scanner analysis
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"; RT="$APP/runtime-status"
          echo '=== ANALYZE FUNCTION ==='
          sed -n '560,860p' "$SRC/scanner.js"
          echo '=== PUBLIC HEALTH ==='
          python3 - <<'PY'
          import json,pathlib,time,collections
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          sig=json.loads((rt/'signal-snapshot.json').read_text())
          print('sourceHealth=',sig.get('sourceHealth'))
          print('risk=',sig.get('risk'))
          print('intelSummary=',sig.get('intelSummary'))
          r=json.loads((rt/'new-listing-radar.json').read_text())
          rows=r.get('candidates') or []
          print('radar status/provider/rows',r.get('status'),r.get('providerCount'),len(rows))
          for key in ['currentFeed','entryEligible','fastDiscoveryLane']:
            c=collections.Counter(str(x.get(key)) for x in rows); print(key,c)
          print('currentCandidates=',r.get('currentCandidates'),'fastDiscoveryCandidates=',r.get('fastDiscoveryCandidates'),'currentFeedMints=',len(r.get('currentFeedMints') or []))
          eligible=[x for x in rows if x.get('currentFeed') is True]
          print('currentFeed_rows',len(eligible))
          for x in eligible[:15]: print({k:x.get(k) for k in ['mint','symbol','currentFeed','entryEligible','fastDiscoveryLane','preScore','discoveryConfidence','liquidityUsd','volume5m','buys5m','sells5m','buySellTxnRatio','priceChange5m','pairAgeSec']})
          PY
          echo '=== PAPER STATUS ==='
          sudo -n /bin/systemctl status meme-alpha-paper.service --no-pager -l || true
          echo V388_RADAR_ANALYSIS=COMPLETE
