name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Diagnose post-scanner blockers
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"; RT="$APP/runtime-status"
          grep -q 'V388_RADAR_FLOW_MAPPING' "$SRC/scanner.js"
          python3 - <<'PY'
          import json,pathlib,collections,time,os
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          s=json.loads((rt/'signal-snapshot.json').read_text()); g=json.loads((rt/'micro-live-gate.json').read_text()); rows=s.get('candidates') or []
          print('SUMMARY',{'age':round(time.time()-os.path.getmtime(rt/'signal-snapshot.json'),1),'rows':len(rows),'allowed':g.get('allowed'),'sourceHealthy':g.get('sourceHealthy'),'riskReady':g.get('liveRiskReady'),'scaleAllowed':g.get('scaleAllowed'),'reasons':g.get('reasons')})
          for k in ['decision','securityDecision','holderClusterDecision','insiderRiskDecision','sellRoute','token2022']:
            print(k,dict(collections.Counter(str(c.get(k)) for c in rows)))
          hard=collections.Counter(); guards=collections.Counter(); sec=collections.Counter(); hold=collections.Counter()
          for c in rows:
            for x in c.get('hardReject') or []: hard[str(x)]+=1
            for x in c.get('entryGuardReasons') or []: guards[str(x)]+=1
            for x in c.get('securityBlockReasons') or []: sec[str(x)]+=1
            for x in c.get('holderBlockReasons') or []: hold[str(x)]+=1
          print('HARD',hard.most_common(30)); print('GUARDS',guards.most_common(30)); print('SEC_BLOCK',sec.most_common(30)); print('HOLDER_BLOCK',hold.most_common(30))
          for c in sorted(rows,key=lambda x:float(x.get('score') or 0),reverse=True)[:30]:
            print('ROW',{k:c.get(k) for k in ['symbol','mint','score','originalScore','decision','securityDecision','holderClusterDecision','insiderRiskDecision','sellRoute','liquidityUsd','sellPriceImpactPct','token2022','hardReject','securityReviewReasons','securityBlockReasons','holderReviewReasons','holderBlockReasons','topHoldersPct','holderClusterMaxAccountsSameOwner','intelMode','entryGuardReasons']})
          PY
          echo '=== SECURITY/HOLDER SOURCE MARKERS ==='
          grep -nE 'decision|PASS|REVIEW|BLOCK|holder|mintAuthority|freezeAuthority|topHolders|unknown|missing|scanner-latest|universe' "$SRC/security.js" | head -180 || true
          grep -nE 'decision|PASS|REVIEW|BLOCK|holder|cluster|unknown|missing|scanner-latest|security' "$SRC/holder-cluster.js" | head -220 || true
          echo V388_BLOCKER_DIAG=COMPLETE
