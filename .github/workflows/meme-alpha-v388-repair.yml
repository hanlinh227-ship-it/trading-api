name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Patch radar discovery authority and capture live blockers
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"; RT="$APP/runtime-status"; BASE="$RT/deploy-candidates"
          mkdir -p "$BASE"
          CAND="$BASE/v388-scanner-radar-authority.js"
          cp "$SRC/scanner.js" "$CAND"
          python3 - "$CAND" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          old="  const providerRedundancy =\n    successfulSources >= DISCOVERY_MIN_SOURCES ||\n    (successfulSources >= 1 && radarHealthy && radarProviderCount >= 2 && radarMatches >= DISCOVERY_RADAR_MIN_MATCHES);"
          new="  // V388_RADAR_AUTHORITY: fresh HEALTHY radar already aggregates independent providers.\n  // It may maintain discovery continuity; downstream security/holder/sellability remain mandatory.\n  const providerRedundancy =\n    successfulSources >= DISCOVERY_MIN_SOURCES ||\n    (radarHealthy && radarProviderCount >= 2 && radarMatches >= DISCOVERY_RADAR_MIN_MATCHES);"
          if old not in s: raise SystemExit('V388_FAIL=PROVIDER_REDUNDANCY_PATTERN_NOT_FOUND')
          s=s.replace(old,new,1); p.write_text(s); print('V388_RADAR_AUTHORITY_PATCH=APPLIED')
          PY
          node --check "$CAND"
          sha="$(sha256sum "$CAND" | awk '{print $1}')"; echo V388_RADAR_AUTHORITY_SHA="$sha"
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy scanner "$(basename "$CAND")" "$sha"
          grep -q 'V388_RADAR_AUTHORITY' "$SRC/scanner.js"
          sudo -n /bin/systemctl restart meme-alpha-paper.service
          python3 - <<'PY'
          import json,pathlib,time,os,collections,sys
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status'); deadline=time.time()+150
          while time.time()<deadline:
            time.sleep(3)
            try:
              s=json.loads((rt/'signal-snapshot.json').read_text()); g=json.loads((rt/'micro-live-gate.json').read_text()); rows=s.get('candidates') or []
              state={'age':round(time.time()-os.path.getmtime(rt/'signal-snapshot.json'),1),'rows':len(rows),'allowed':g.get('allowed'),'sourceHealthy':g.get('sourceHealthy'),'riskReady':g.get('liveRiskReady'),'scaleAllowed':g.get('scaleAllowed'),'reasons':g.get('reasons')}; print('STATE',state,flush=True)
              if rows:
                for k in ['decision','securityDecision','holderClusterDecision','insiderRiskDecision','sellRoute','token2022']: print(k,dict(collections.Counter(str(c.get(k)) for c in rows)),flush=True)
                hard=collections.Counter(); sec=collections.Counter(); hold=collections.Counter(); guards=collections.Counter()
                for c in rows:
                  for x in c.get('hardReject') or []: hard[str(x)]+=1
                  for x in c.get('securityBlockReasons') or []: sec[str(x)]+=1
                  for x in c.get('holderBlockReasons') or []: hold[str(x)]+=1
                  for x in c.get('entryGuardReasons') or []: guards[str(x)]+=1
                print('HARD',hard.most_common(30)); print('SEC',sec.most_common(30)); print('HOLDER',hold.most_common(30)); print('GUARDS',guards.most_common(30))
                for c in sorted(rows,key=lambda x:float(x.get('score') or 0),reverse=True)[:25]: print('ROW',{k:c.get(k) for k in ['symbol','mint','score','originalScore','decision','securityDecision','holderClusterDecision','insiderRiskDecision','sellRoute','liquidityUsd','sellPriceImpactPct','token2022','hardReject','securityReviewReasons','securityBlockReasons','holderReviewReasons','holderBlockReasons','topHoldersPct','holderClusterMaxAccountsSameOwner','intelMode','entryGuardReasons']},flush=True)
                if g.get('allowed') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True: print('V388_NONZERO_CAPTURED=TRUE'); sys.exit(0)
            except Exception as e: print('RETRY',repr(e),flush=True)
          print('V388_NONZERO_CAPTURED=FALSE'); sys.exit(6)
          PY
