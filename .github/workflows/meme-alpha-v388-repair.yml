name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect holder and flow mapping
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"; RT="$APP/runtime-status"
          echo '=== SCANNER RETURN/SECURITY ==='
          sed -n '800,1010p' "$SRC/scanner.js"
          echo '=== SIGNAL HOLDER LOGIC ==='
          sed -n '105,170p' "$SRC/safe-signal-export.js"
          echo '=== PAPER PIPELINE ==='
          grep -nE 'scanner|holder|security|universe|safe-signal|micro-live-gate|risk' "$APP/run-paper.sh" || true
          echo '=== RADAR FIELD COVERAGE ==='
          python3 - <<'PY'
          import json,pathlib,collections
          r=json.loads(pathlib.Path('/opt/meme-alpha/app/runtime-status/new-listing-radar.json').read_text())
          rows=[x for x in (r.get('candidates') or []) if x.get('currentFeed') is True]
          print('currentFeed',len(rows))
          for key in ['holderCount','liquidityUsd','buys5m','sells5m','buySellTxnRatio','priceChange5m','volume5m','organicScore','entryEligible','fastDiscoveryLane']:
            vals=[x.get(key) for x in rows]
            nonzero=sum(1 for v in vals if isinstance(v,(int,float)) and v!=0)
            present=sum(1 for v in vals if v is not None)
            print(key,'present',present,'nonzero',nonzero,'sample',vals[:8])
          for x in rows[:12]:
            print({k:x.get(k) for k in ['mint','symbol','holderCount','liquidityUsd','buys5m','sells5m','buySellTxnRatio','priceChange5m','volume5m','organicScore','preScore','discoveryConfidence','fastDiscoveryLane']})
          PY
          echo V388_MAPPING_INSPECT=COMPLETE
