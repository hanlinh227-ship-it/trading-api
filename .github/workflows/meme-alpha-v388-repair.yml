name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect production signal insertion points
        shell: bash
        run: |
          set -euo pipefail
          SRC=/opt/meme-alpha/app/src
          echo '=== SIGNAL MARKERS ==='
          grep -nE 'guardCandidate|candidates|map\(|for \(|writeFile|signal-snapshot|holderCluster|securityDecision|sellRoute|PROBE_CANDIDATE|routeCandidate|main|async' "$SRC/safe-signal-export.js" | head -260 || true
          echo '=== SIGNAL GUARD AREA ==='
          n=$(grep -n 'function guardCandidate' "$SRC/safe-signal-export.js" | head -1 | cut -d: -f1 || true)
          if [ -n "$n" ]; then a=$((n-80)); [ "$a" -lt 1 ] && a=1; b=$((n+260)); sed -n "${a},${b}p" "$SRC/safe-signal-export.js"; fi
          echo '=== SIGNAL TAIL ==='
          tail -260 "$SRC/safe-signal-export.js"
          echo V388_SIGNAL_INSERTION_INSPECT=COMPLETE
