name: Meme Alpha V388 Repair
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v388-repair.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Inspect RPC enrichment and holder audit path
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; SRC="$APP/src"
          echo '=== SCANNER RPC/AUDIT MARKERS ==='
          grep -nE 'rpc|RPC|mintAuthority|freezeAuthority|tokenProgram|getAccountInfo|getTokenSupply|getProgramAccounts|audit|holderCount|token2022|TOKEN2022' "$SRC/scanner.js" | head -260 || true
          echo '=== SCANNER TOP/DISCOVERY ==='
          sed -n '1,220p' "$SRC/scanner.js"
          sed -n '220,560p' "$SRC/scanner.js"
          echo '=== SECURITY CORE ==='
          sed -n '70,315p' "$SRC/security.js"
          echo '=== HOLDER AUDIT CORE ==='
          sed -n '450,645p' "$SRC/holder-cluster.js"
          echo V388_RPC_PATH_INSPECT=COMPLETE
