name: Diagnose Cloudflare Build Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-cloudflare-build-once.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose build and persist report
        shell: bash
        run: |
          set +e
          REPORT="docs/checkpoints/BUILD_DIAGNOSTIC_LATEST.txt"
          : > "$REPORT"
          echo "Cloudflare build diagnostic $(date -u +%FT%TZ)" >> "$REPORT"
          echo "HEAD $(git rev-parse HEAD)" >> "$REPORT"
          echo >> "$REPORT"
          echo "== NODE CHECK ==" >> "$REPORT"
          NODE_RC=0
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do echo "-- $f" >> "$REPORT"; node --check "$f" >> "$REPORT" 2>&1 || NODE_RC=$?; done
          echo "NODE_RC=$NODE_RC" >> "$REPORT"
          echo >> "$REPORT"
          echo "== NPM INSTALL ==" >> "$REPORT"
          (cd cloudflare-worker && npm install) >> "$REPORT" 2>&1; NPM_RC=$?; echo "NPM_RC=$NPM_RC" >> "$REPORT"
          echo >> "$REPORT"
          echo "== PREPARE WRANGLER ==" >> "$REPORT"
          (cd cloudflare-worker && TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler) >> "$REPORT" 2>&1; PREP_RC=$?; echo "PREP_RC=$PREP_RC" >> "$REPORT"
          echo >> "$REPORT"
          echo "== WRANGLER DRY RUN ==" >> "$REPORT"
          (cd cloudflare-worker && npx wrangler deploy --dry-run) >> "$REPORT" 2>&1; WRANGLER_RC=$?; echo "WRANGLER_RC=$WRANGLER_RC" >> "$REPORT"
          echo >> "$REPORT"
          echo "RESULT node=$NODE_RC npm=$NPM_RC prepare=$PREP_RC wrangler=$WRANGLER_RC" >> "$REPORT"
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add "$REPORT"
          git commit -m "Report latest Cloudflare build diagnostic" || true
          git push || true
          exit 0
      # trigger: 2026-08-18T16:05Z
