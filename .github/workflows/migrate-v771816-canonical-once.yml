name: Migrate V77.18.16 Canonical Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771816-canonical-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Promote canonical markers
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          s=s.replace('const VERSION="V77.18.15",SERVICE="Trading V77.18.15 Dual Hyro Account Runtime";','const VERSION="V77.18.16",SERVICE="Trading V77.18.16 Balanced Entry Dual Hyro Runtime";',1)
          if 'V77.18.16' not in s: raise SystemExit('index version migration failed')
          p.write_text(s)

          p=Path('.github/workflows/validate-cloudflare-v77.yml'); s=p.read_text()
          s=s.replace("['V77.18.15','handleHyroMultiTelegram','runHyroMultiCron']","['V77.18.16','handleHyroMultiTelegram','runHyroMultiCron']",1)
          s=s.replace("const signalLocks=['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED'];","const signalLocks=['allowedProfileModes','regimeRouteScores','adaptiveLocationPolicy','adaptiveTriggerPolicy','v775:books','NEWS_CONTEXT_REQUIRED','EXECUTION_QUOTE_REQUIRED','V77.16.9','v771816:signal:auto_notify:','autoScanSignalGroup'];",1)
          s=s.replace("console.log('Canonical modular V77.18.15 dual-account validation PASS');","console.log('Canonical modular V77.18.16 balanced-entry validation PASS');",1)
          if 'V77.18.16' not in s or 'autoScanSignalGroup' not in s: raise SystemExit('validator migration failed')
          p.write_text(s)
          PY
      - name: Syntax gate
        run: |
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hyro-scanner.js
          node --check cloudflare-worker/hyro-runtime.js
      - name: Commit migration
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js .github/workflows/validate-cloudflare-v77.yml
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.16 promote balanced-entry canonical"
          git push
