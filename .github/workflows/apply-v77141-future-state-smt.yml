name: Apply V77.14.1 Futures State SMT
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77141_future_state_smt_fix.js'
      - '.github/workflows/apply-v77141-future-state-smt.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and check
        shell: bash
        run: |
          set +e
          : > V77141_DIAGNOSTIC.txt
          node --check scripts/apply_v77141_future_state_smt_fix.js >> V77141_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77141_DIAGNOSTIC.txt
          node scripts/apply_v77141_future_state_smt_fix.js >> V77141_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77141_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77141_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77141_DIAGNOSTIC.txt
          for t in 'V77.14.1' 'future:emptyGroup' 'futureSwingState' 'smtSignal' 'H1 SMT'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77141_DIAGNOSTIC.txt; else echo "$t=NO" >> V77141_DIAGNOSTIC.txt; fi; done
          exit 0
      - name: Promote if pass
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77141_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77141_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77141_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77141_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.14.1 Futures state and SMT refinement' || exit 0
          git push origin main
