name: Blind Crypto Backtest V26
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v26.py'
      - '.github/workflows/blind-backtest-v26.yml'
  workflow_dispatch:
jobs:
  v26-blind:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v26.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v26.json
          git commit -m "Run locked V26 May blind validation" || exit 0
          git pull --rebase origin main || true
          git push || true
