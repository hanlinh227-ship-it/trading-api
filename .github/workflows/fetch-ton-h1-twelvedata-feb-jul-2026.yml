name: Fetch TON H1 TwelveData Feb-Jul 2026
on:
  push:
    paths:
      - 'scripts/fetch_ton_h1_twelvedata_feb_jul_2026.py'
      - '.github/workflows/fetch-ton-h1-twelvedata-feb-jul-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch TON hourly history
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_ton_h1_twelvedata_feb_jul_2026.py
      - name: Freeze TON snapshot
        run: |
          git config user.name 'provider-snapshot-bot'
          git config user.email 'provider-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/ton_h1_feb_jul_2026_twelvedata.json
          git commit -m 'Freeze TON H1 Feb-Jul 2026 Twelve Data snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
