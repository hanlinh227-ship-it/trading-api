name: Offline Forex V7 Separate
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v7_separate.py'
      - '.github/workflows/offline-forex-v7-separate.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Forex V7 zero-credit optimizer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v7_separate.py
