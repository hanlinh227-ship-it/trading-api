name: Meme Alpha v3.42 Capital Utilization Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v342-capital-utilization-audit.sh'
      - '.github/workflows/meme-alpha-v342-capital-utilization-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v342-capital-utilization-audit.sh
