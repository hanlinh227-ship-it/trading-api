name: Fetch TAO TON IP H1 Binance
on:
  push:
    paths:
      - 'scripts/fetch_ton_ip_h1_binance_2026.py'
      - '.github/workflows/fetch-ton-ip-h1-binance.yml'
  workflow_dispatch:
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch public H1 history
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_ton_ip_h1_binance_2026.py
      - name: Commit snapshot if available
        run: |
          git config user.name "history-data-bot"
          git config user.email "history-data-bot@users.noreply.github.com"
          git add data/provider_snapshots/tao_ton_ip_h1_jan_jul_2026_binance.json
          git diff --cached --quiet || git commit -m "Save TAO TON IP public H1 history"
          git push
