name: AI Closed Loop Wake

# Manual fallback only. The canonical automatic entry point is ai-loop.yml on
# [AI-TASK] issue creation. Keeping this fallback off push events prevents
# metadata-only commits from moving main/base_sha and racing the canonical run.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Open [AI-TASK] issue number to dispatch'
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: trading-ai-closed-loop
  cancel-in-progress: false

env:
  CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]

jobs:
  wake-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate task issue
        shell: bash
        run: |
          set -euo pipefail
          ISSUE="$ISSUE_NUMBER"
          test -n "$ISSUE" || { echo 'issue_number is required'; exit 10; }
          BODY="$(gh issue view "$ISSUE" --json body --jq .body)"
          TITLE="$(gh issue view "$ISSUE" --json title --jq .title)"
          STATE="$(gh issue view "$ISSUE" --json state --jq .state)"
          [[ "$TITLE" == '[AI-TASK]'* ]] || { echo "Issue #$ISSUE is not an [AI-TASK]"; exit 11; }
          [ "$STATE" = 'OPEN' ] || { echo "Issue #$ISSUE is not open"; exit 11; }
          {
            echo 'ISSUE_BODY<<AI_BODY_EOF'
            printf '%s\n' "$BODY"
            echo 'AI_BODY_EOF'
          } >> "$GITHUB_ENV"

      - name: Parse contract and reject duplicate implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          body=os.environ.get('ISSUE_BODY','')
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(?:```(?:json)?\s*)?(\{.*?\})(?:\s*```)?\s*AI_TASK_JSON_END',body,re.S|re.I)
          if m:
              task=json.loads(m.group(1))
          else:
              try:
                  task=json.loads(body.strip())
              except Exception:
                  def field(name, default=''):
                      mm=re.search(rf'(?mi)^\s*{re.escape(name)}\s*:\s*(.+?)\s*$', body)
                      return mm.group(1).strip() if mm else default
                  base_sha=field('base_sha')
                  if not base_sha:
                      raise SystemExit('Missing AI_TASK_JSON_BEGIN/END contract')
                  task_id=field('task_id') or f'ISSUE-{os.environ.get("ISSUE_NUMBER","manual")}'
                  task={
                      'task_id': task_id,
                      'base_sha': base_sha,
                      'owner': field('owner','DEEPSEEK'),
                      'requires_claude': field('requires_claude','true').lower() == 'true',
                      'requires_codex': field('requires_codex','true').lower() == 'true',
                      'instructions': [body],
                      'validation_commands': ['git diff --check']
                  }
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base=str(task.get('base_sha') or '')
          if not base:
              raise SystemExit('Task base_sha missing')
          if base != head:
              ok=subprocess.run(['git','merge-base','--is-ancestor',base,head]).returncode == 0
              if not ok:
                  raise SystemExit(f"Stale/diverged task base_sha={base} current={head}")
              print(f"Task base {base} is behind current main {head}; using fresh current main")
              task['base_sha']=head
          pathlib.Path('.ai-runtime-task.json').write_text(json.dumps(task,ensure_ascii=False,indent=2))
          print('TASK_ID='+str(task.get('task_id')))
          PY
          TASK_ID="$(python3 -c 'import json; print(json.load(open(".ai-runtime-task.json"))["task_id"])')"
          EXISTING="$(gh pr list --state open --search "${TASK_ID} in:title" --json number --jq '.[0].number // empty')"
          test -z "$EXISTING" || { echo "Open implementation PR already exists for $TASK_ID: #$EXISTING"; exit 14; }

      - name: Enforce writer lock and secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY missing'; exit 12; }
          grep -Eq '^LOCKED:[[:space:]]*true[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md
          grep -Eq '^OWNER:[[:space:]]*DEEPSEEK[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md

      - name: DeepSeek implement and validate
        run: python3 scripts/ai/deepseek_implementer.py .ai-runtime-task.json

      - name: Require scoped implementation diff
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(git status --porcelain --untracked-files=all -- . ':!.ai-runtime-task.json')"
          test -n "$STATUS" || { echo 'No implementation changes'; exit 13; }
          git diff --check -- . ':!.ai-runtime-task.json'
          printf '%s\n' "$STATUS"
          git diff --stat -- . ':!.ai-runtime-task.json'

      - name: Push implementation branch
        id: push
        shell: bash
        run: |
          set -euo pipefail
          TASK_ID="$(python3 -c 'import json; print(json.load(open(".ai-runtime-task.json"))["task_id"])')"
          BRANCH="ai/deepseek-$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-')-${GITHUB_RUN_ID}"
          rm -f .ai-runtime-task.json
          git config user.name 'DeepSeek Cloud Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "${TASK_ID}: DeepSeek validated implementation"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR and wake independent reviewers
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          TASK_ID: ${{ steps.push.outputs.task_id }}
          IMPLEMENTATION_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TASK_ID - AI closed-loop implementation" --body "AI_LOOP_TASK_ISSUE: #$ISSUE_NUMBER
          AI_LOOP_ROUND: 1
          IMPLEMENTATION_SHA: $IMPLEMENTATION_SHA
          IMPLEMENTER: DEEPSEEK
          REQUIRES_CLAUDE: true
          STATUS: PARALLEL_DUAL_REVIEW_REQUIRED

          Manual fallback dispatch. DeepSeek implemented; Codex and Claude must review this exact SHA independently.")"
          PR_NUMBER="${PR_URL##*/}"
          gh pr comment "$PR_NUMBER" --body "@codex review

          Review exact head $IMPLEMENTATION_SHA. Advisory/review only; do not modify source."
          gh pr comment "$PR_NUMBER" --body "CLAUDE_REVIEW_REQUEST
          CLAUDE_REVIEW_HEAD: $IMPLEMENTATION_SHA
          Review this exact head independently and post a SHA-bound ACCEPT/REJECT/BLOCKED verdict. Advisory/review only; do not modify source."
          gh issue comment "$ISSUE_NUMBER" --body "Manual AI wake dispatch succeeded. PR: $PR_URL
          Implementation SHA: $IMPLEMENTATION_SHA
          Required reviewers: CODEX + CLAUDE"

      - name: Report dispatch failure
        if: failure()
        shell: bash
        run: |
          gh issue comment "$ISSUE_NUMBER" --body "Manual AI wake dispatch FAILED. Inspect Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." || true

      - name: Cleanup
        if: always()
        run: rm -f .ai-runtime-task.json
