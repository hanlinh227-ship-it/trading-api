name: Build Deploy SignalHub V3.23.1 Entry Precision Cut Rate

on:
  push:
    branches: [signalhub-v3231-entry-precision-cutrate]
    paths:
      - '.github/workflows/build-deploy-signalhub-v3231-entry-precision-cutrate.yml'
      - 'scripts/patch_signalhub_v3231_entry_precision_cutrate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://signalhub-forex.hanlinh227.workers.dev
      WS: wss://signalhub-forex.hanlinh227.workers.dev/v3/crypto/stream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Materialize V3.23.1 precision entry and cut-rate release
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_signalhub_v3227_market_only_health_seven.py');s=p.read_text()
          old="a=block(a,'    private void renderSignals(boolean animate){','    private String performanceSummary(){',render,'renderSignals')"
          new="a=block(a,'    private void renderSignals(boolean animate){','    private void addCryptoSignalGroup(',render,'renderSignals')"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 scripts/fix_patch_signalhub_v3230_markers.py
          python3 -m py_compile scripts/patch_signalhub_v3230_resilient_ledger_clean.py scripts/patch_signalhub_v3230_postfix.py scripts/patch_signalhub_v3230_provider_failover.py scripts/patch_signalhub_v3230_integrity_refresh.py scripts/patch_signalhub_v3231_entry_precision_cutrate.py
          python3 scripts/patch_signalhub_v3225_realtime_unique_book.py
          python3 scripts/patch_signalhub_v3225_build_compat.py
          python3 scripts/patch_signalhub_v3226_balanced_realtime_book.py
          python3 scripts/patch_signalhub_v3227_market_only_health_seven.py
          python3 scripts/patch_signalhub_v3227_runtime_fix.py
          python3 scripts/patch_signalhub_v3230_resilient_ledger_clean.py
          python3 scripts/patch_signalhub_v3230_postfix.py
          python3 scripts/patch_signalhub_v3230_provider_failover.py
          python3 scripts/patch_signalhub_v3230_integrity_refresh.py
          python3 scripts/patch_signalhub_v3231_entry_precision_cutrate.py
          node --check signalhub-worker/gateway-v3.js
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text();a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text();c=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java').read_text();g=Path('signalhub-android/app/build.gradle').read_text()
          assert 'SIGNALHUB-V3-GATEWAY-3.23.1' in w and 'SIGNALHUB_V3_CHECKPOINT_31_ENTRY_PRECISION_CUT_RATE' in w
          assert 'primary-v3231-entry-precision-cutrate' in w
          assert w.count('const PORTFOLIO_POLICY=Object.freeze(')==1 and "targetActiveByStyle:{SCALP:5,SWING:2}" in w
          assert 'V3231_PRECISION_MULTI_CONFIRMATION_ANTI_CHASE_NO_WIN_PROBABILITY' in w
          assert "watchR:-0.38" in w and "persistentCutR:-0.86" in w and "emergencyCutR:-0.96" in w
          assert 'autoCutRateDefinition' in w and 'currentVersionAutoCutRate' in w
          assert "selfHealing:'REFRESH_STALE_OR_MISSING_STABLE100_THEN_REAUDIT'" in w
          assert 'PERMANENT_NO_TTL' in w and 'FRESH_FAILOVER_DISPLAY_ONLY' in w
          assert 'APP_VERSION="3.23.1"' in a and 'TỈ LỆ CUT' in a
          assert 'SignalHub-Android/3.23.1' in c and 'versionCode 39' in g and "versionName '3.23.1'" in g
          print('V3.23.1 SOURCE AUDIT PASS')
          PY

      - name: Build APK and deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v3231-worker
          cd signalhub-android
          gradle :app:assembleDebug --stacktrace --no-daemon
          cd ..
          unzip -t signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Fill and verify exact precision MARKET book
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 45);do
            curl -fsS --max-time 20 "$BASE/v3/status?v3231=$RANDOM-$n" >/tmp/status.json || true
            if python3 - <<'PY'
          import json
          try:s=json.load(open('/tmp/status.json'))
          except:raise SystemExit(1)
          assert s.get('ok') is True and s.get('version')=='SIGNALHUB-V3-GATEWAY-3.23.1',s
          hp=s.get('healthPolicy') or {};assert hp.get('persistentCutR')==-0.86 and hp.get('emergencyCutR')==-0.96,hp
          pol=((s.get('decisionPolicy') or {}).get('portfolioPolicy') or {});assert pol.get('maxActiveTotal')==7 and (pol.get('targetActiveByStyle') or {})=={'SCALP':5,'SWING':2},pol
          PY
            then ready=1;break;fi
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 300 -X POST "$BASE/v3/history/migrate?v3231=$RANDOM" >/tmp/migrate.json
          python3 - <<'PY'
          import json
          x=json.load(open('/tmp/migrate.json'));assert x.get('ok') is True and x.get('schema')=='V323_RESILIENT_LEDGER_1',x
          PY
          stable=0
          for n in $(seq 1 8);do
            curl -fsS --max-time 180 "$BASE/v3/crypto/stable100?v3231=$RANDOM-$n" >/tmp/stable.json || true
            if python3 - <<'PY'
          import json
          try:x=json.load(open('/tmp/stable.json'))
          except:raise SystemExit(1)
          r=x.get('rows') or [];assert x.get('ok') is True and len(r)==100 and len({z.get('symbol') for z in r})==100,x
          PY
            then stable=1;break;fi
            sleep 2
          done
          test "$stable" = 1
          exact=0
          for round in $(seq 1 32);do
            for style in SWING SCALP;do
              curl -sS --max-time 330 "$BASE/v3/scan?market=CRYPTO&style=$style&v3231=$round-$RANDOM" >"/tmp/scan-$style.json" || true
            done
            curl -fsS --max-time 20 "$BASE/v3/portfolio?v3231book=$round-$RANDOM" >/tmp/book.json || true
            if python3 - <<'PY'
          import json
          try:p=(json.load(open('/tmp/book.json')).get('portfolio') or {})
          except:raise SystemExit(1)
          st=p.get('styles') or {};ot=p.get('orderTypes') or {}
          assert st.get('SCALP')==5 and st.get('SWING')==2 and p.get('activeTotal')==7,p
          assert p.get('uniqueSymbols')==7 and not (p.get('duplicateSymbols') or []),p
          assert p.get('marketOnly') is True and p.get('exactTarget') is True,p
          assert (ot.get('SCALP') or {}).get('MARKET')==5 and (ot.get('SWING') or {}).get('MARKET')==2,ot
          assert all((ot.get(s) or {}).get(k,0)==0 for s in ('SCALP','SWING') for k in ('LIMIT','STOP')),ot
          PY
            then exact=1;break;fi
            curl -fsS --max-time 20 "$BASE/v3/status?refill=$round-$RANDOM" >/dev/null || true
            sleep 2
          done
          test "$exact" = 1
          for style in SCALP SWING;do curl -fsS --max-time 60 "$BASE/v3/signals?market=CRYPTO&style=$style&status=active&limit=10&v3231=$RANDOM" >"/tmp/active-$style.json";done
          python3 - <<'PY'
          import json
          allrows=[]
          for style,target in [('SCALP',5),('SWING',2)]:
              x=json.load(open('/tmp/active-'+style+'.json'));r=x.get('signals') or [];assert x.get('ok') is True and len(r)==target,x
              for s in r:
                  assert s.get('status')=='OPEN' and str(s.get('orderType','')).upper()=='MARKET',s
                  assert float(s.get('entry') or 0)>0 and float(s.get('sl') or 0)>0 and float(s.get('tp3') or 0)>0,s
                  assert s.get('marketOnlyQuality') in ('PRECISION_CONFIRMED','PRECISION_ALIGNED'),s
                  ea=s.get('entryAssessment') or {};assert ea.get('method')=='V3231_PRECISION_MULTI_CONFIRMATION_ANTI_CHASE_NO_WIN_PROBABILITY',ea
              allrows+=r
          assert len({s.get('symbol') for s in allrows})==7,allrows
          print('PRECISION BOOK PASS')
          PY

      - name: Verify live continuity reconnect and cut-rate metrics
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/v3/crypto/monitor?kick=1&v3231=$RANDOM" >/dev/null
          python3 - <<'PY'
          import json,subprocess,time,datetime,os
          base=os.environ['BASE'];seq=[];fresh=0
          for i in range(10):
              x=json.loads(subprocess.check_output(['curl','-fsS','--max-time','15',f'{base}/v3/crypto/live-active?v3231={i}-{time.time_ns()}'],text=True));q=x.get('quotes') or []
              assert x.get('version')=='SIGNALHUB-V3-GATEWAY-3.23.1' and len(q)==7,x
              assert len({z.get('signalId') for z in q})==7 and len({z.get('symbol') for z in q})==7,q
              s=int(x.get('seq') or 0);assert s>0;seq.append(s);f=0
              for z in q:
                  assert float(z.get('lastPrice') or 0)>0 and float(z.get('bid') or 0)>0 and float(z.get('ask') or 0)>0,z
                  assert z.get('provider') in ('BYBIT','OKX','BINANCE'),z
                  at=z.get('receivedAt');age=(datetime.datetime.now(datetime.timezone.utc)-datetime.datetime.fromisoformat(at.replace('Z','+00:00'))).total_seconds()
                  if z.get('stale') is not True and -1<=age<8:f+=1
              if f==7:fresh+=1
              time.sleep(1)
          assert len(set(seq))>=3 and fresh>=5,(seq,fresh)
          PY
          node - <<'JS'
          const url=process.env.WS;
          function collect(n,timeout=25000){return new Promise((resolve,reject)=>{let a=[];const ws=new WebSocket(url),t=setTimeout(()=>{try{ws.close()}catch{};reject(Error('timeout '+a))},timeout);ws.onmessage=e=>{try{const x=JSON.parse(String(e.data));if(x.type!=='crypto_quotes'||!Array.isArray(x.quotes)||x.quotes.length!==7)return;const s=Number(x.seq||0);if(!(s>0))return;a.push(s);if(a.length>=n){clearTimeout(t);ws.close();resolve(a)}}catch{}};ws.onerror=()=>{}})}
          (async()=>{const a=await collect(3);await new Promise(r=>setTimeout(r,1200));const b=await collect(3);if(b[0]<a.at(-1))throw Error('reconnect '+a+' => '+b);console.log('WS PASS',a,b)})().catch(e=>{console.error(e);process.exit(1)})
          JS
          for st in SCALP SWING;do curl -fsS --max-time 120 "$BASE/v3/performance?market=CRYPTO&style=$st&v3231=$RANDOM" >"/tmp/perf-$st.json";done
          curl -fsS --max-time 120 "$BASE/v3/stability?v3231=$RANDOM" >/tmp/stability.json
          curl -fsS --max-time 180 "$BASE/v3/data-integrity?v3231=$RANDOM" >/tmp/integrity.json
          curl -fsS --max-time 300 "$BASE/v3/watch/analyze?symbol=BTCUSDT&v3231=$RANDOM" >/tmp/watch.json
          python3 - <<'PY'
          import json
          for st in ('SCALP','SWING'):
              x=json.load(open('/tmp/perf-'+st+'.json'));p=x.get('performance') or {};assert x.get('ok') is True,x
              for k in ('winRateResolved','autoCut','autoCutRate','autoCutRateLabel','autoCutLossRate','autoCutRateDefinition','currentVersionClosed','currentVersionAutoCut','currentVersionAutoCutRate','currentVersionAutoCutRateLabel'):assert k in p,(st,k,p)
              assert p.get('autoCutRateDefinition')=='AUTO_CUT/(TP+SL+AUTO_CUT)',p
              for k in ('autoCutRate','autoCutLossRate','currentVersionAutoCutRate'):
                  v=p.get(k);assert v is None or 0<=float(v)<=100,(k,v)
          s=json.load(open('/tmp/stability.json'));t=s.get('tradingEvidence') or {};assert s.get('ok') is True and 'autoCutRate' in t and 'currentVersionAutoCutRate' in t,t
          i=json.load(open('/tmp/integrity.json'));assert i.get('ok') is True and not i.get('problems'),i
          w=json.load(open('/tmp/watch.json'));assert w.get('ok') is True,w;ab=w.get('activeBook') or {};assert ab.get('targetScalp')==5 and ab.get('targetSwing')==2,ab
          print('CUT RATE + HISTORY + WATCH PASS')
          PY

      - name: Final book gate and stage verified APK
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 "$BASE/v3/portfolio?v3231final=$RANDOM" >/tmp/final.json
          python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/final.json')).get('portfolio') or {});st=p.get('styles') or {};ot=p.get('orderTypes') or {}
          assert st.get('SCALP')==5 and st.get('SWING')==2 and p.get('activeTotal')==7 and p.get('uniqueSymbols')==7 and not (p.get('duplicateSymbols') or []),p
          assert p.get('exactTarget') is True and p.get('marketOnly') is True,p
          assert (ot.get('SCALP') or {}).get('MARKET')==5 and (ot.get('SWING') or {}).get('MARKET')==2,ot
          PY
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v3.23.1-Entry-Precision-Cut-Rate.apk
          sha256sum dist/SignalHub-v3.23.1-Entry-Precision-Cut-Rate.apk | tee dist/SignalHub-v3.23.1-Entry-Precision-Cut-Rate-SHA256SUMS.txt
          printf '%s\n' '# SignalHub V3.23.1 Entry Precision + Cut Rate' 'Production gates: precision MARKET entry confirmation; less aggressive confirmed-deterioration AUTO_CUT; visible overall/current-version cut rate; exact 5 SCALP + 2 SWING; seven unique symbols; provider failover; WS/REST continuity; permanent history.' > dist/SIGNALHUB_V3_CHECKPOINT_31_ENTRY_PRECISION_CUT_RATE.md

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.23.1-Entry-Precision-Cut-Rate
          path: dist/
          retention-days: 30

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=signalhub-v3.23.1-entry-precision-cut-rate
          gh release view "$TAG" >/dev/null 2>&1 && gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --target signalhub-v3231-entry-precision-cutrate --prerelease --title 'SignalHub v3.23.1 — Entry Precision + Cut Rate' --notes 'Production-audited: stricter multi-confirmation MARKET entries, wider health hysteresis and confirmed-deterioration cuts to reduce unnecessary AUTO_CUT churn, visible overall and current-version cut rates, exact 5 SCALP + 2 SWING MARKET book, live provider failover/reconnect and permanent history. No win rate is guaranteed.'
