name: V77.18.35 Verified Index Pricing
on:
  push:
    branches: [v771835-index-sanity]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771835-index-sanity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified index pricing patch
        run: |
          python3 scripts/patch_v771835_index_sanity.py
          python3 scripts/patch_v771835_validator.py
      - name: Validate source bundle
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771835-dist
      - name: Commit production source only
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/index.js cloudflare-worker/hub-v77171.js .github/workflows/validate-cloudflare-v77.yml
          git commit -m "V77.18.35 Verified native index pricing" || exit 0
          git push origin HEAD:v771835-index-sanity
