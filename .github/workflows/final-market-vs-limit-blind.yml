name: Final Crypto MARKET vs LIMIT Blind
on:
  push:
    paths:
      - 'scripts/final_market_vs_limit_blind.py'
      - '.github/workflows/final-market-vs-limit-blind.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run-final-comparison:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run final MARKET vs LIMIT blind comparison
        run: python scripts/final_market_vs_limit_blind.py
      - name: Commit result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/final_market_vs_limit_blind.json
          git commit -m "Run final MARKET vs LIMIT blind comparison" || exit 0
          git pull --rebase origin main || true
          git push || true
