name: Blind Crypto Backtest V14
on:
  push:
    paths:
      - "scripts/blind_backtest_crypto_v14.py"
      - ".github/workflows/blind-backtest-v14.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p data
          python3 scripts/blind_backtest_crypto_v14.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v14.json
          git commit -m "Run V14 crypto backtest" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
