name: Free Data Precision Evolver V1 Fast
on:
  push:
    paths:
      - 'scripts/free_data_precision_evolver_v1_fast.py'
      - '.github/workflows/free-data-precision-evolver-v1-fast.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused all-symbol free-data evolver
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/free_data_precision_evolver_v1_fast.py
