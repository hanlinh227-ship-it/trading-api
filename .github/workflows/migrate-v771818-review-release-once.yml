name: Migrate V77.18.18 Review Release Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771818-review-release-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Wire release banner and PROP position review
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/hyro-multi-ui.js'); s=p.read_text()
          imp='import {reconcileHyro} from "./hyro-execution.js";'
          add=imp+'\nimport {reviewHyroPositions,getHyroPositionReviews} from "./hyro-position-review.js";'
          if 'hyro-position-review.js' not in s:s=s.replace(imp,add,1)
          s=s.replace('[{text:"🔎 Quét",callback_data:`prop:${p}:scan`},{text:paused?"▶ Auto":"⛔ Auto",callback_data:`prop:${p}:${paused?"resume":"pause"}`}],','[{text:"🔎 Quét",callback_data:`prop:${p}:scan`},{text:"🧭 Đánh giá",callback_data:`prop:${p}:review`}],[{text:paused?"▶ Auto":"⛔ Auto",callback_data:`prop:${p}:${paused?"resume":"pause"}`},{text:"↔ 2 tài khoản",callback_data:"prop:multi"}],',1)
          s=s.replace('[{text:"↔ 2 tài khoản",callback_data:"prop:multi"},{text:"⬅️ Menu",callback_data:"menu"}]]};','[{text:"⬅️ Menu",callback_data:"menu"}]]};',1)
          s=s.replace('(dash|pos|risk|conn|scan|pause|resume)', '(dash|pos|risk|conn|scan|review|pause|resume)',1)
          marker='  if(action==="scan"){const r=await runHyroAccountCycle(env,id,{marketOnly:true});await notifyEntry(env,id,r).catch(()=>{});await notifyClose(env,id).catch(()=>{});s=await hyroAccountSnapshot(env,id);text=scanText(id,r);}'
          review='  if(action==="scan"){const r=await runHyroAccountCycle(env,id,{marketOnly:true});await notifyEntry(env,id,r).catch(()=>{});await notifyClose(env,id).catch(()=>{});s=await hyroAccountSnapshot(env,id);text=scanText(id,r);}\n  else if(action==="review"){const e=hyroAccountEnv(env,id),r=await reviewHyroPositions(e,{force:true});text=[`🧭 TK${id==="A"?1:2} • ĐÁNH GIÁ VỊ THẾ`,r.count?`HOLD ${r.hold} | TIGHTEN ${r.tighten} | CUT ${r.cut}`:"Không có vị thế.",...(r.results||[]).map(x=>`${x.action==="HOLD"?"✅":x.action==="TIGHTEN"?"⚠️":"✂️"} ${x.symbol} ${x.action}${x.pnlR!=null?` | ${x.pnlR}R`:""}${x.micro!=null?` | M${x.micro}`:""}`).slice(0,5)].join("\\n");}'
          if 'action==="review"' not in s:
              if marker not in s: raise SystemExit('review action marker missing')
              s=s.replace(marker,review,1)
          old='const r=await runHyroAccountCycle(env,id);out[id]=r;await notifyEntry(env,id,r).catch(()=>{});await notifyClose(env,id).catch(()=>{});'
          new='const r=await runHyroAccountCycle(env,id);out[id]=r;await notifyEntry(env,id,r).catch(()=>{});await notifyClose(env,id).catch(()=>{});const e=hyroAccountEnv(env,id),rv=await reviewHyroPositions(e).catch(()=>null);out[id].review=rv;if(rv&&!rv.skipped&&(rv.cut||rv.tighten)){const important=(rv.results||[]).filter(x=>x.action!=="HOLD");if(important.length)await send(env,env.TELEGRAM_CHAT_ID,[`🧭 PROP • TK${id==="A"?1:2}`,`HOLD ${rv.hold} | TIGHTEN ${rv.tighten} | CUT ${rv.cut}`,...important.slice(0,3).map(x=>`${x.action==="CUT"?"✂️":"⚠️"} ${x.symbol} ${x.action} | ${x.pnlR??"—"}R | M${x.micro??"—"}`)].join("\\n")).catch(()=>{});}'
          if 'out[id].review=rv' not in s:
              if old not in s: raise SystemExit('cron marker missing')
              s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          imp='import {runSystemHealthAudit,shouldRunFullHealth,getSystemHealth} from "./system-health.js";'
          add=imp+'\nimport {announceReleaseOnce,getReleaseState} from "./release-notifier.js";'
          if 'release-notifier.js' not in s:s=s.replace(imp,add,1)
          s=s.replace('const VERSION="V77.18.17",SERVICE="Trading V77.18.17 Autonomous Health Guardian";','const VERSION="V77.18.18",SERVICE="Trading V77.18.18 Adaptive Position Review";\nconst RELEASE_NAME="Adaptive Position Review";',1)
          old='if(path==="/health/run")return json(await runSystemHealthAudit(env,{version:VERSION,full:true,notify:false}));'
          new=old+'if(path==="/release")return json({ok:true,version:VERSION,name:RELEASE_NAME,state:await getReleaseState(env)});'
          if '/release")' not in s:s=s.replace(old,new,1)
          old_sched='ctx.waitUntil((async()=>{const full=await shouldRunFullHealth(env);await runSystemHealthAudit(env,{version:VERSION,full,notify:true});})().catch(()=>{}));'
          new_sched=old_sched+'ctx.waitUntil(announceReleaseOnce(env,{version:VERSION,name:RELEASE_NAME,details:["PROP đánh giá HOLD/TIGHTEN/CUT mỗi 5 phút","CUT chỉ khi nhiều tín hiệu xấu cùng xác nhận","Telegram tự hiện version + tên bản mới"]}).catch(()=>{}));'
          if 'announceReleaseOnce(env' not in s.split('async scheduled',1)[-1]:
              if old_sched not in s: raise SystemExit('scheduled health marker missing')
              s=s.replace(old_sched,new_sched,1)
          p.write_text(s)
          PY
      - name: Syntax and bundle gate
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
          cd cloudflare-worker
          npm install
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler
          npx wrangler deploy --dry-run
      - name: Commit
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js cloudflare-worker/hyro-multi-ui.js
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.18 wire release banner and PROP position review"
          git push
