name: V78-028 Yahoo All Cash Index Fallback
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  run:
    if: github.event.issue.title == 'RUN-V78-028-YAHOO-ALL-INDEX'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded all-index cash visibility fallback
        run: |
          set -euo pipefail
          python3 scripts/v78_028_yahoo_all_index_patch.py
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -c 'function yahooIndexCashVisibilityQuote' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'function yahooUs30CashVisibilityQuote' cloudflare-worker/engine-v77168.js)" = 1
          grep -Fq 'NAS100:"^NDX"' cloudflare-worker/engine-v77168.js
          grep -Fq 'US30:"^DJI"' cloudflare-worker/engine-v77168.js
          grep -Fq 'US500:"^GSPC"' cloudflare-worker/engine-v77168.js
          grep -Fq 'DEX:"^GDAXI"' cloudflare-worker/engine-v77168.js
          grep -Fq 'JP225:"^N225"' cloudflare-worker/engine-v77168.js
          grep -Fq 'fresh:false' cloudflare-worker/engine-v77168.js
          grep -Fq 'executionVerified:false' cloudflare-worker/engine-v77168.js
          grep -Fq 'analysisOnly:true' cloudflare-worker/engine-v77168.js
          grep -Fq 'instrumentIdentity:"CASH_INDEX"' cloudflare-worker/engine-v77168.js
          git diff --check
          git config user.name 'V78 Signal Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-028 generalize verified Yahoo CASH INDEX visibility fallback'
          git push origin HEAD:main
