name: Fetch Forex H1 Jul-Dec 2025
on:
  push:
    paths:
      - 'scripts/fetch_forex_h1_jul_dec_2025.py'
      - '.github/workflows/fetch-forex-h1-jul-dec-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cool down quota
        run: sleep 70
      - name: Fetch independent 2025 snapshot
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_forex_h1_jul_dec_2025.py
      - name: Freeze snapshot
        run: |
          git config user.name 'provider-snapshot-bot'
          git config user.email 'provider-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/forex_h1_jul_dec_2025.json
          git commit -m 'Freeze independent 28-pair Forex H1 Jul-Dec 2025 snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
