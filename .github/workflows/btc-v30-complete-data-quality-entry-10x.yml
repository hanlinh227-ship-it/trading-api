name: BTC V30 Complete Data Quality Entry 10X

on:
  push:
    paths:
      - 'research/btc_v30_complete_data_quality_entry_10x.py'
      - 'research/btc_binance_m5_full_loader.py'
      - '.github/workflows/btc-v30-complete-data-quality-entry-10x.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run BTC V30 complete-data backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          python3 research/btc_v30_complete_data_quality_entry_10x.py 2>&1 | tee research/results/BTC_v30_complete_data_quality_entry_10x.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: BTC-v30-complete-data-quality-entry-10x-result
          path: research/results/BTC_v30_complete_data_quality_entry_10x.txt
          retention-days: 30
