name: Meme Alpha v3.76 Router Contract Diagnostic
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v376-router-contract-diagnostic.yml']
jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Inspect live executor and scanner contract
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          F="$APP/src/micro-live-executor.js"
          echo '=== BEST CANDIDATE CONTRACT ==='
          grep -nE -A28 -B8 'function bestCandidate|const bestCandidate|PROBE_CANDIDATE|consecutiveEligible|fastTrackReady|score[^A-Za-z]' "$F" | head -n 220 || true
          echo '=== SCANNER SAMPLE KEYS ==='
          /usr/bin/node - <<'NODE'
          const fs=require('fs');
          const p='/var/lib/meme-alpha/data/paper/scanner-latest.json';
          const x=JSON.parse(fs.readFileSync(p,'utf8'));const rows=x.candidates||[];
          console.log('SCANNER_VERSION='+String(x.version||''));
          console.log('CANDIDATE_COUNT='+rows.length);
          for(const r of rows.slice(0,5)) console.log(JSON.stringify({symbol:r.symbol,decision:r.decision,score:r.score,securityDecision:r.securityDecision,sellRoute:r.sellRoute,liquidityUsd:r.liquidityUsd,priceChange5m:r.priceChange5m,netBuyers5m:r.netBuyers5m,buyVolume5m:r.buyVolume5m,sellVolume5m:r.sellVolume5m,pairAgeSec:r.pairAgeSec,fastDiscoveryLane:r.fastDiscoveryLane,newListingRadar:r.newListingRadar,sources:r.sources},null,0));
          NODE
          echo V376_ROUTER_CONTRACT_DIAGNOSTIC=END
