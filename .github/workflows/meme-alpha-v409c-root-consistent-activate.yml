name: Meme Alpha V409C Root-Consistent Activate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v409c-root-consistent-activate.yml
permissions:
  contents: read
jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 12
    steps:
      - name: Deploy all V409 modules consistently and verify
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; DC="$RT/deploy-candidates"; RUN="$APP/run-paper.sh"
          CRAD="$DC/v409-radar-prebreakout.js"; CSCN="$DC/v409-scanner-prebreakout.js"; CSIG="$DC/v409-signal-priority-audit.js"; CRTP="$DC/v409-realtime-prebreakout.js"; CEXE="$DC/v409-executor-prebreakout.js"
          RAD="$APP/src/new-listing-radar.js"; SCN="$APP/src/scanner.js"; SIG="$APP/src/safe-signal-export.js"; RTP="$APP/src/realtime-pool-pulse.js"; EXE="$APP/src/micro-live-executor.js"
          for f in "$CRAD" "$CSCN" "$CSIG" "$CRTP" "$CEXE"; do test -f "$f"; node --check "$f"; done
          SHRAD=$(sha256sum "$CRAD"|awk '{print $1}'); SHSCN=$(sha256sum "$CSCN"|awk '{print $1}'); SHSIG=$(sha256sum "$CSIG"|awk '{print $1}'); SHRTP=$(sha256sum "$CRTP"|awk '{print $1}'); SHEXE=$(sha256sum "$CEXE"|awk '{print $1}')
          echo V409_RADAR_SHA=$SHRAD; echo V409_SCANNER_SHA=$SHSCN; echo V409_SIGNAL_SHA=$SHSIG; echo V409_REALTIME_SHA=$SHRTP; echo V409_EXECUTOR_SHA=$SHEXE
          grep -q 'V409_PREBREAKOUT_RESERVE' "$CSCN"; grep -q 'PARABOLIC_FOMO_RISK' "$CSCN"; grep -q 'count)>=4' "$CSIG"; grep -q 'HOTSET_LIMIT=72' "$CRTP"; grep -q 'rawChg>15' "$CEXE"
          node "$CRAD" --self-test | grep -q 'V372_FAST_DISCOVERY_SELF_TEST=PASS'
          node "$CRTP" --self-test | grep -q 'V374_HELD_CONTINUITY_SELF_TEST=PASS'
          node "$CSIG" --self-test | grep -q 'V376_MULTI_STRATEGY_ROUTER_SELF_TEST=PASS'
          node "$CEXE" --self-test | grep -q 'MICRO_EXECUTOR_V360_PROFIT_AWARE_SELF_TEST=PASS'

          # Preserve the last fully coherent production set for rollback.
          OLD=$(ls -dt "$RT"/v409b-prod-backup-* 2>/dev/null | head -1 || true)
          if [ -z "$OLD" ]; then OLD="$RT/v409c-predeploy-$(date -u +%Y%m%dT%H%M%SZ)"; mkdir -p "$OLD"; cp -a "$RAD" "$OLD/radar.js"; cp -a "$SCN" "$OLD/scanner.js"; cp -a "$SIG" "$OLD/signal.js"; cp -a "$RTP" "$OLD/realtime.js"; cp -a "$EXE" "$OLD/executor.js"; fi
          for x in radar scanner signal realtime; do cp "$OLD/$x.js" "$DC/v409c-rollback-$x.js"; done
          ORAD=$(sha256sum "$DC/v409c-rollback-radar.js"|awk '{print $1}'); OSCN=$(sha256sum "$DC/v409c-rollback-scanner.js"|awk '{print $1}'); OSIG=$(sha256sum "$DC/v409c-rollback-signal.js"|awk '{print $1}'); ORTP=$(sha256sum "$DC/v409c-rollback-realtime.js"|awk '{print $1}')

          rollback_modules(){
            echo V409C_ROLLBACK_MODULES=BEGIN
            sudo -n /usr/local/sbin/meme-alpha-safe-deploy radar v409c-rollback-radar.js "$ORAD" || true
            sudo -n /usr/local/sbin/meme-alpha-safe-deploy scanner v409c-rollback-scanner.js "$OSCN" || true
            sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal v409c-rollback-signal.js "$OSIG" || true
            sudo -n /usr/local/sbin/meme-alpha-safe-deploy realtime v409c-rollback-realtime.js "$ORTP" || true
            cp -a "$OLD/executor.js" "$EXE" 2>/dev/null || true
            echo V409C_ROLLBACK_MODULES=END
          }

          set +e
          O1=$(sudo -n /usr/local/sbin/meme-alpha-safe-deploy radar "$(basename "$CRAD")" "$SHRAD" 2>&1); R1=$?; echo "$O1"
          O2=$(sudo -n /usr/local/sbin/meme-alpha-safe-deploy scanner "$(basename "$CSCN")" "$SHSCN" 2>&1); R2=$?; echo "$O2"
          O3=$(sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal "$(basename "$CSIG")" "$SHSIG" 2>&1); R3=$?; echo "$O3"
          O4=$(sudo -n /usr/local/sbin/meme-alpha-safe-deploy realtime "$(basename "$CRTP")" "$SHRTP" 2>&1); R4=$?; echo "$O4"
          set -e
          echo SAFE_DEPLOY_RCS=$R1,$R2,$R3,$R4
          if [ "$R1" -ne 0 ] || [ "$R2" -ne 0 ] || [ "$R3" -ne 0 ] || [ "$R4" -ne 0 ]; then rollback_modules; exit 20; fi
          test "$(sha256sum "$RAD"|awk '{print $1}')" = "$SHRAD"; test "$(sha256sum "$SCN"|awk '{print $1}')" = "$SHSCN"; test "$(sha256sum "$SIG"|awk '{print $1}')" = "$SHSIG"; test "$(sha256sum "$RTP"|awk '{print $1}')" = "$SHRTP"

          test -w "$EXE" || { echo EXECUTOR_NOT_WRITABLE; rollback_modules; exit 21; }
          cp "$CEXE" "$EXE"; chmod 664 "$EXE" || true; test "$(sha256sum "$EXE"|awk '{print $1}')" = "$SHEXE"
          OLDPID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1 || true); test -n "$OLDPID"; echo OLD_EXECUTOR_PID=$OLDPID
          ORIG="$RT/v409c-run-paper-original.sh"; REQ="$RT/v409c-executor-recycle.request"; cp -a "$RUN" "$ORIG"; chmod 755 "$ORIG"; printf '%s\n' "$OLDPID" > "$REQ"; chmod 664 "$REQ"
          cleanup(){ cp -a "$ORIG" "$RUN" 2>/dev/null || true; chmod 755 "$RUN" 2>/dev/null || true; rm -f "$REQ" 2>/dev/null || true; }
          trap cleanup EXIT
          cat > "$RUN" <<'SH'
          #!/bin/bash
          set -u
          REQ=/opt/meme-alpha/app/runtime-status/v409c-executor-recycle.request
          ORIG=/opt/meme-alpha/app/runtime-status/v409c-run-paper-original.sh
          if [ -r "$REQ" ]; then PID=$(cat "$REQ" 2>/dev/null || true); rm -f "$REQ" 2>/dev/null || true; if [ -n "$PID" ] && [ -r "/proc/$PID/cmdline" ]; then CMD=$(tr '\0' ' ' < "/proc/$PID/cmdline" 2>/dev/null || true); case "$CMD" in *'/opt/meme-alpha/app/src/micro-live-executor.js'*) kill -KILL "$PID" 2>/dev/null || true;; esac; fi; fi
          exec "$ORIG"
          SH
          chmod 755 "$RUN"
          sudo -n /bin/systemctl restart meme-alpha-paper.service
          for i in $(seq 1 45); do sleep 2; NEWPID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1 || true); if [ -n "$NEWPID" ] && [ "$NEWPID" != "$OLDPID" ] && systemctl is-active --quiet meme-alpha-micro-live.service; then break; fi; [ "$i" -lt 45 ] || { rollback_modules; exit 22; }; done
          NEWPID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1 || true); echo NEW_EXECUTOR_PID=$NEWPID
          cp -a "$ORIG" "$RUN"; chmod 755 "$RUN"; rm -f "$REQ"; trap - EXIT

          for i in $(seq 1 50); do
            sleep 3
            OK=$(python3 - <<'PY'
          import json
          try:
            g=json.load(open('/opt/meme-alpha/app/runtime-status/micro-live-gate.json'))
            print('1' if all([g.get('allowed') is True,g.get('armOk') is True,g.get('armAttested') is True,g.get('sourceHealthy') is True,g.get('riskEntryAllowed') is True,g.get('liveRiskReady') is True,g.get('scaleAllowed') is True]) else '0')
          except: print('0')
          PY
          )
            [ "$OK" = 1 ] && break
            [ "$i" -lt 50 ] || exit 23
          done
          sleep 10

          echo '=== V409C FINAL VERIFY ==='
          test "$(sha256sum "$RAD"|awk '{print $1}')" = "$SHRAD"; test "$(sha256sum "$SCN"|awk '{print $1}')" = "$SHSCN"; test "$(sha256sum "$SIG"|awk '{print $1}')" = "$SHSIG"; test "$(sha256sum "$RTP"|awk '{print $1}')" = "$SHRTP"; test "$(sha256sum "$EXE"|awk '{print $1}')" = "$SHEXE"
          [ "$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js' || true)" -eq 1 ]
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$svc"; systemctl is-active "$svc"; done
          systemctl show meme-alpha-micro-live.service -p MainPID -p NRestarts -p ActiveState -p SubState -p Result -p ExecMainStartTimestamp --no-pager
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          for n in ['micro-live-gate.json','new-listing-radar.json','realtime-pool-pulse.json','signal-snapshot.json','portfolio-observability.json','capital-observability.json','allocator-status.json','last-execution.json']:
            p=rt/n
            if p.exists(): print(n,'ageSec=',round(time.time()-p.stat().st_mtime,2),json.loads(p.read_text()))
          PY
          echo V409_PREBREAKOUT_ANTIFOMO=ACTIVE
          echo PREBREAKOUT_DEEP_RESERVE=6
          echo REALTIME_HOTSET_LIMIT=72
          echo SAFETY_AUDIT_MAX_PER_MIN=4
          echo SAFETY_AUDIT_MIN_SPACING_SEC=12
          echo NEW_ENTRY_FOMO_CEILING_5M_PCT=15
          echo SCALE_ALLOWED_REQUIRED=TRUE
          echo HARD_SAFETY_BYPASS=FALSE
