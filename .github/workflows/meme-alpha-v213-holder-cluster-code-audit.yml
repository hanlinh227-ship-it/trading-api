name: Meme Alpha v2.13 Holder Cluster Code Audit
on:
  push:
    paths:
      - 'ops/meme-alpha/v213-holder-cluster-code-audit.sh'
      - '.github/workflows/meme-alpha-v213-holder-cluster-code-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - run: bash ops/meme-alpha/v213-holder-cluster-code-audit.sh
