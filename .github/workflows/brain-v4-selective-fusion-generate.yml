name: Brain V4 Selective Fusion Generator

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - '.github/workflows/brain-v4-selective-fusion-generate.yml'
      - 'docs/superpowers/**'

permissions:
  contents: write

concurrency:
  group: brain-v4-selective-fusion-generator-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.event.pull_request.head.ref == 'brain-v4-selective-fusion-20260914'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Generate canonical Brain 4.7 artifacts
        shell: bash
        run: |
          set -euo pipefail
          current="$(python - <<'PY'
          import json
          print(json.load(open('AI_SKILL_LIBRARY/v4/releases/current.json', encoding='utf-8'))['version'])
          PY
          )"
          if [ "$current" = "4.7.0" ]; then
            echo "Brain 4.7 artifacts already generated"
            exit 0
          fi
          if [ "$current" != "4.6.0" ]; then
            echo "Unexpected release pointer: $current" >&2
            exit 1
          fi
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.7.0 \
            --source brain_4_7_selective_open_source_fusion \
            --class feature \
            --validated \
            --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --check --root .
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py \
            --source-sha "$SOURCE_SHA" \
            --output /tmp/skill-gateway-snapshot.json
          python AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py /tmp/skill-gateway-snapshot.json
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"
      - name: Commit generated artifacts to isolated branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          git add \
            AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml \
            AI_SKILL_LIBRARY/v4/releases/4.7.0/manifest.yaml \
            AI_SKILL_LIBRARY/v4/releases/current.json \
            AI_SKILL_LIBRARY/v4/releases/history.yaml
          if git diff --cached --quiet; then
            echo "No generated artifact changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: build Brain 4.7 selective fusion candidate"
          git push origin "HEAD:${HEAD_REF}"
