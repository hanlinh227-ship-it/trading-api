name: V78-024 Canonical Docs Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-024-doc-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard V78-024 scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^SCOPE: V78-024 canonical docs sync + Hyro hardening blueprint$' docs/ai-coengineer/WRITE_LOCK.md
      - name: Apply canonical doc sync idempotently
        run: node scripts/v78-024-doc-sync.mjs
      - name: Validate scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'V78 CURRENT PRODUCTION OVERLAY — 2026-08-20' docs/checkpoints/CURRENT_HANDOFF.md
          grep -q '2026-08-20 V78 PRODUCTION OVERLAY' docs/checkpoints/MASTER_TRADING_STATE.md
          grep -q 'Status: RESOLVED — V78-024 CANONICAL DOC SYNC' docs/ai-coengineer/OPEN_ISSUES.md
          grep -q '^LOCKED: false$' docs/ai-coengineer/WRITE_LOCK.md
          test -f docs/ai-coengineer/V78-024_VALIDATION.txt
          test -f docs/ai-coengineer/V78_HYRO_HARDENING_BLUEPRINT.md
          git diff --check
      - name: Commit synchronized canonical state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78-024 Docs Sync'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/checkpoints/CURRENT_HANDOFF.md docs/checkpoints/MASTER_TRADING_STATE.md docs/ai-coengineer/OPEN_ISSUES.md docs/ai-coengineer/V78-024_VALIDATION.txt docs/ai-coengineer/WRITE_LOCK.md
          if git diff --cached --quiet; then
            echo 'No doc changes required'
            exit 0
          fi
          git commit -m 'V78-024 sync canonical state through Hub R13 and resolve AI-002'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "final_commit=$(git rev-parse HEAD)"
