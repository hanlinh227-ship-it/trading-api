name: V78-026 H1 Dispatch Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-026-h1-dispatch-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V78-026 H1 validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/v78-026-h1-diagnose-v3.yml/dispatches \
            -f ref=main
