name: Offline Crossmarket Rolling Blind V4
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crossmarket_rolling_blind_v4.py'
      - '.github/workflows/offline-crossmarket-rolling-blind-v4.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-credit rolling blind optimizer
        run: python scripts/offline_crossmarket_rolling_blind_v4.py
