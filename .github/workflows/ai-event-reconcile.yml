name: AI Event Reconcile

on:
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: AI-loop PR number to reconcile
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

env:
  CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]
  CLAUDE_REVIEW_LOGIN: hanlinh227-ship-it

# Different PRs run immediately in parallel. Events for the same PR serialize so only
# one repair writer can act on one exact head at a time. This removes the repository-wide
# queue without allowing overlapping writers on the same source head.
concurrency:
  group: ai-event-reconcile-${{ inputs.pr_number || github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: false

jobs:
  reconcile:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      MANUAL_PR: ${{ inputs.pr_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preserve trusted implementer from main
        run: cp scripts/ai/deepseek_implementer.py /tmp/trusted-deepseek-implementer.py

      - name: Resolve target AI-loop PR
        id: target
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            workflow_dispatch) PR="${MANUAL_PR}" ;;
            pull_request_review|pull_request_review_comment) PR="$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")" ;;
            issue_comment) PR="$(jq -r '.issue.number' "$GITHUB_EVENT_PATH")" ;;
            *) echo 'UNSUPPORTED_EVENT'; exit 0 ;;
          esac
          test -n "$PR" && test "$PR" != null || { echo 'NO_TARGET_PR'; exit 0; }
          PR_JSON="$(gh pr view "$PR" --json number,headRefName,headRefOid,body,state,url)"
          STATE="$(printf '%s' "$PR_JSON" | jq -r '.state')"
          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.headRefName')"
          BODY="$(printf '%s' "$PR_JSON" | jq -r '.body // ""')"
          if [ "$STATE" != OPEN ] || [[ "$BRANCH" != ai/deepseek-* ]] || [[ "$BODY" != *AI_LOOP_TASK_ISSUE:* ]]; then
            echo "SKIP_NON_AI_LOOP_PR=$PR"
            exit 0
          fi
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "head=$(printf '%s' "$PR_JSON" | jq -r '.headRefOid')" >> "$GITHUB_OUTPUT"

      - name: Build exact-head review state
        if: steps.target.outputs.pr != ''
        id: state
        shell: bash
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; pr=os.environ['PR']; head=os.environ['HEAD_SHA']
          codex=os.environ.get('CODEX_BOT_LOGIN','chatgpt-codex-connector[bot]')
          claude_login=os.environ.get('CLAUDE_REVIEW_LOGIN','').strip()
          def gh(*args, check=True):
              p=subprocess.run(['gh',*args],text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stderr or p.stdout)
              return p.stdout
          prj=json.loads(gh('pr','view',pr,'--json','body,headRefOid'))
          if prj['headRefOid'] != head: raise SystemExit('TARGET_HEAD_MOVED_BEFORE_REVIEW_READ')
          body=prj.get('body') or ''
          im=re.search(r'AI_LOOP_TASK_ISSUE:\s*#(\d+)',body); rm=re.search(r'AI_LOOP_ROUND:\s*(\d+)',body)
          if not im: raise SystemExit('AI_LOOP_TASK_ISSUE missing')
          issue=im.group(1); round_no=int(rm.group(1)) if rm else 1
          issue_body=gh('issue','view',issue,'--json','body','--jq','.body')
          tm=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',issue_body,re.S)
          if not tm: raise SystemExit('task contract missing')
          task=json.loads(tm.group(1)); max_rounds=max(1,min(int(task.get('max_rounds',2)),4))

          inline=json.loads(gh('api',f'repos/{repo}/pulls/{pr}/comments','--paginate') or '[]')
          issue_comments=json.loads(gh('api',f'repos/{repo}/issues/{pr}/comments','--paginate') or '[]')
          reviews=json.loads(gh('api',f'repos/{repo}/pulls/{pr}/reviews','--paginate') or '[]')

          codex_blockers=[c.get('body','') for c in inline if (c.get('user') or {}).get('login')==codex and c.get('commit_id')==head and (c.get('body') or '').strip()]
          codex_head_reviews=[r for r in reviews if (r.get('user') or {}).get('login')==codex and r.get('commit_id')==head]
          codex_verdict='REJECT' if codex_blockers else ('ACCEPT' if codex_head_reviews else 'PENDING')

          claude_verdict='PENDING'; claude_findings=''
          for c in reversed(issue_comments):
              if claude_login and (c.get('user') or {}).get('login') != claude_login: continue
              txt=c.get('body') or ''
              if 'CLAUDE_REVIEW_BEGIN' not in txt or f'CLAUDE_REVIEW_HEAD: {head}' not in txt: continue
              vm=re.search(r'CLAUDE_VERDICT:\s*(ACCEPT|REJECT|BLOCKED)',txt)
              if not vm: continue
              claude_verdict=vm.group(1)
              fm=re.search(r'CLAUDE_FINDINGS:\s*(.*?)\s*CLAUDE_REVIEW_END',txt,re.S)
              claude_findings=(fm.group(1).strip() if fm else '')[-24000:]
              break

          feedback=[]
          if codex_verdict=='REJECT': feedback.append('CODEX FINDINGS:\n'+'\n\n'.join(codex_blockers)[-24000:])
          if claude_verdict=='REJECT': feedback.append('CLAUDE FINDINGS:\n'+(claude_findings or 'Claude returned REJECT without detailed findings.'))

          mode='WAIT'
          if claude_verdict=='BLOCKED': mode='BLOCKED'
          elif codex_verdict in ('ACCEPT','REJECT') and claude_verdict in ('ACCEPT','REJECT'):
              if codex_verdict=='ACCEPT' and claude_verdict=='ACCEPT': mode='ACCEPT'
              else: mode='REPAIR'
          if mode=='REPAIR' and round_no>=max_rounds: mode='MAX_ROUNDS'

          state={'pr':int(pr),'head':head,'issue':int(issue),'round':round_no,'max_rounds':max_rounds,'codex':codex_verdict,'claude':claude_verdict,'mode':mode,'feedback':'\n\n'.join(feedback)[-40000:],'issue_body':issue_body}
          pathlib.Path('/tmp/ai-event-state.json').write_text(json.dumps(state,ensure_ascii=False))
          print(json.dumps({k:v for k,v in state.items() if k not in ('feedback','issue_body')},indent=2))
          PY
          MODE="$(jq -r '.mode' /tmp/ai-event-state.json)"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Verify required checks before readiness
        if: steps.state.outputs.mode == 'ACCEPT'
        id: checks
        shell: bash
        env:
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          DATA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs" -H 'Accept: application/vnd.github+json')"
          BAD="$(printf '%s' "$DATA" | jq '[.check_runs[] | select(.status != "completed" or (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length')"
          if [ "$BAD" != 0 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo "CHECKS_NOT_READY=$BAD"
          else
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Report exact-head acceptance
        if: steps.state.outputs.mode == 'ACCEPT' && steps.checks.outputs.ready == 'true'
        shell: bash
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: gh pr comment "$PR" --body "EVENT_RECONCILE: exact-head CODEX + CLAUDE consensus ACCEPT and required checks ready at $HEAD_SHA. Status: READY_FOR_FINAL_ACCEPT. Merge/deploy remains a separate safety gate."

      - name: Report acceptance waiting on checks
        if: steps.state.outputs.mode == 'ACCEPT' && steps.checks.outputs.ready != 'true'
        shell: bash
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: gh pr comment "$PR" --body "EVENT_RECONCILE: reviewers ACCEPT exact head $HEAD_SHA, but required checks are not ready. Status: WAITING_FOR_CHECKS."

      - name: Report blocking terminal state
        if: steps.state.outputs.mode == 'BLOCKED' || steps.state.outputs.mode == 'MAX_ROUNDS'
        shell: bash
        env:
          PR: ${{ steps.target.outputs.pr }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
          MODE: ${{ steps.state.outputs.mode }}
        run: gh pr comment "$PR" --body "EVENT_RECONCILE: $MODE at exact head $HEAD_SHA. Automatic repair is fail-closed; diagnosis/final decision required."

      - name: Repair after both exact-head reviewers complete
        if: steps.state.outputs.mode == 'REPAIR'
        shell: bash
        env:
          PR: ${{ steps.target.outputs.pr }}
          BRANCH: ${{ steps.target.outputs.branch }}
          HEAD_SHA: ${{ steps.target.outputs.head }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo MISSING_DEEPSEEK_SECRET; exit 2; }
          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$HEAD_SHA" || { echo STALE_BEFORE_REPAIR; exit 0; }
          git checkout -B "$BRANCH" "$HEAD_SHA"

          python3 - <<'PY'
          import json,pathlib,re
          s=json.loads(pathlib.Path('/tmp/ai-event-state.json').read_text())
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',s['issue_body'],re.S)
          task=json.loads(m.group(1)); task['base_sha']=s['head']; task['review_feedback']=s['feedback']; task['max_rounds']=1; task['requires_claude']=True
          pathlib.Path('/tmp/ai-runtime-task.json').write_text(json.dumps(task,ensure_ascii=False,indent=2))
          PY

          python3 /tmp/trusted-deepseek-implementer.py /tmp/ai-runtime-task.json
          rm -f /tmp/ai-runtime-task.json
          git diff --quiet && { echo NO_REPAIR_DIFF; exit 0; } || true
          git diff --check

          git fetch origin "$BRANCH"
          CURRENT_REMOTE="$(git rev-parse "origin/$BRANCH")"
          test "$CURRENT_REMOTE" = "$HEAD_SHA" || { echo "STALE_REPAIR remote=$CURRENT_REMOTE expected=$HEAD_SHA"; exit 0; }

          ROUND="$(jq -r '.round' /tmp/ai-event-state.json)"
          git config user.name 'DeepSeek Event Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add -u
          git diff --cached --quiet && { echo NO_TRACKED_REPAIR_DIFF; exit 0; } || true
          git commit -m "AI event repair: dual-review round $((ROUND+1))"
          git push origin "$BRANCH"
          NEW_SHA="$(git rev-parse HEAD)"

          BODY="$(gh pr view "$PR" --json body --jq '.body')"
          NEW_BODY="$(printf '%s' "$BODY" | sed "s/AI_LOOP_ROUND:[[:space:]]*$ROUND/AI_LOOP_ROUND: $((ROUND+1))/" | sed "s/IMPLEMENTATION_SHA:[[:space:]]*[0-9a-f]*/IMPLEMENTATION_SHA: $NEW_SHA/")"
          gh pr edit "$PR" --body "$NEW_BODY"
          gh pr comment "$PR" --body "@codex review

          EVENT_RECONCILE pushed dual-review repair. Re-review exact current head $NEW_SHA immediately. Previous-SHA evidence is advisory only."
          gh pr comment "$PR" --body "CLAUDE_REVIEW_REQUEST
          CLAUDE_REVIEW_HEAD: $NEW_SHA
          EVENT_RECONCILE pushed dual-review repair. Independently review this exact head immediately and post a fresh SHA-bound verdict."

      - name: Cleanup
        if: always()
        run: rm -f /tmp/ai-event-state.json /tmp/ai-runtime-task.json /tmp/trusted-deepseek-implementer.py
