name: Offline Forex NoCut Refine V66
on:
  push:
    paths:
      - 'scripts/offline_forex_nocut_refine_v66.py'
      - '.github/workflows/offline-forex-nocut-refine-v66.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run offline V66
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_nocut_refine_v66.py
