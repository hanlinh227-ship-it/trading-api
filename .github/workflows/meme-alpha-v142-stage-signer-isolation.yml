name: Meme Alpha v1.4.2 Signer Isolation Stage
on:
  push:
    paths:
      - 'ops/meme-alpha/signer/locked_signer.py'
      - 'ops/meme-alpha/v142-root-install-signer-isolation.sh'
      - 'ops/meme-alpha/v142-stage-signer-isolation.sh'
      - '.github/workflows/meme-alpha-v142-stage-signer-isolation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-alpha-v142-stage
  cancel-in-progress: false
jobs:
  stage:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Stage locked signer isolation installer
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v142-stage-signer-isolation.sh
          nice -n 15 bash ops/meme-alpha/v142-stage-signer-isolation.sh
