name: Live Crypto V75 Fast Scan

on:
  push:
    paths:
      - 'data/live_scan_request.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Scan V74 crypto universe with V75 staged engine
        run: python3 scripts/scan_crypto_v75.py data
      - name: Commit compact crypto snapshot
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/crypto-fast.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update V75 fast crypto scan"
          git pull --rebase origin main
          git push origin HEAD:main
