name: Fetch Forex H1 Snapshot Feb-Jul 2026
on:
  push:
    paths:
      - 'scripts/fetch_forex_h1_snapshot_feb_jul_2026.py'
      - '.github/workflows/fetch-forex-h1-snapshot-feb-jul-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cool down Twelve Data quota
        run: sleep 70
      - name: Fetch all 28 Forex pairs once
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          test -n "$TWELVEDATA_API_KEY" || (echo 'TWELVEDATA_API_KEY missing' && exit 1)
          python scripts/fetch_forex_h1_snapshot_feb_jul_2026.py
      - name: Freeze snapshot in repository
        run: |
          git config user.name 'provider-snapshot-bot'
          git config user.email 'provider-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/forex_h1_feb_jul_2026.json
          git commit -m 'Freeze 28-pair Forex H1 Feb-Jul 2026 snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
