name: Apply V77.16.1 Plan Invariants
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77161_plan_invariants.js'
      - '.github/workflows/apply-v77161-plan-invariants.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          : > V77161_DIAGNOSTIC.txt
          node --check scripts/apply_v77161_plan_invariants.js >> V77161_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77161_DIAGNOSTIC.txt
          node scripts/apply_v77161_plan_invariants.js >> V77161_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77161_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77161_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77161_DIAGNOSTIC.txt
          for t in 'V77.16.1' 'rejectedPlan' 'Plan-Invariant Quality Hub' 'indicativePlan(side,M5,M15,H1,H4,D1,locPolicy,prior,intel'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77161_DIAGNOSTIC.txt; else echo "$t=NO" >> V77161_DIAGNOSTIC.txt; fi; done
      - name: Promote
        shell: bash
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77161_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77161_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77161_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77161_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.16.1 plan invariants' || exit 0; git push origin main
