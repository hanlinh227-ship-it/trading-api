name: Meme Alpha V410 Durable Held Realtime Resolver (Legacy Disabled)

# V410 mutating deployment is intentionally retired.
# Current production replacement: V412B held resolver + V413C flow-slope stack.
# Kept manual-only as an audit tombstone so future pushes cannot deploy obsolete realtime code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: self-hosted
    timeout-minutes: 1
    steps:
      - name: Legacy deployment disabled
        shell: bash
        run: |
          set -euo pipefail
          echo LEGACY_DEPLOY_DISABLED=TRUE
          echo OBSOLETE_RELEASE=V410
          echo CURRENT_REALTIME_REPLACEMENT=V412B
          echo CURRENT_PREBREAKOUT_STACK=V413C
          echo PRODUCTION_MUTATION=FALSE
          exit 0
