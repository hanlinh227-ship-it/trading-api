name: BTC V32 Dynamic Compound SL 10X

on:
  push:
    paths:
      - 'research/btc_v32_dynamic_compound_sl_10x.py'
      - '.github/workflows/btc-v32-dynamic-compound-sl-10x.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run BTC V32 dynamic compound SL backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          python3 research/btc_v32_dynamic_compound_sl_10x.py 2>&1 | tee research/results/BTC_v32_dynamic_compound_sl_10x.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: BTC-v32-dynamic-compound-sl-10x-result
          path: research/results/BTC_v32_dynamic_compound_sl_10x.txt
          retention-days: 30
