name: Cancel stale V11 run 40

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-cancel-stale-run-40.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale V11 run 40
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          STALE_RUN_ID: '32712850435'
        run: |
          set -euo pipefail
          echo "Cancelling stale run ${STALE_RUN_ID} in ${REPO}"
          code=$(curl -sS -o /tmp/cancel.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/runs/${STALE_RUN_ID}/cancel")
          cat /tmp/cancel.json || true
          echo "HTTP=${code}"
          if [ "${code}" != "202" ] && [ "${code}" != "409" ]; then
            exit 1
          fi
          echo "Cancel request accepted or run already terminal."
