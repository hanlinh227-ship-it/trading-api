name: Migrate V77.18.21 Prompt Driven Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771821-prompt-driven-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch canonical version and docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          s=s.replace('const VERSION="V77.18.20",SERVICE="Trading V77.18.20 ChatGPT Primary + Claude Reviewer";','const VERSION="V77.18.21",SERVICE="Trading V77.18.21 Prompt-Driven Autonomous Orchestration";',1)
          s=s.replace('const RELEASE_NAME="Claude Reviewer Integration";','const RELEASE_NAME="Prompt-Driven Autonomous Orchestration";',1)
          s=s.replace('["ChatGPT là PRIMARY; Claude chỉ REVIEW","Claude tự review mỗi release và incident mới","Usage cap + cooldown; không có quyền trade/deploy"]','["Bạn chỉ cần nêu mục tiêu; ChatGPT xử lý GitHub/build/checkpoint","Claude final-review release + incident + audit định kỳ","Claude chỉ advisory; không trade/deploy; state/risk giữ nguyên"]',1)
          p.write_text(s)
          p=Path('cloudflare-worker/hub-v77171.js'); s=p.read_text()
          s=s.replace('const VERSION="V77.18.20";','const VERSION="V77.18.21";',1).replace('const SERVICE="Trading V77.18.20 ChatGPT Primary + Claude Reviewer Hub";','const SERVICE="Trading V77.18.21 Prompt-Driven Autonomous Hub";',1)
          p.write_text(s)
          p=Path('.github/workflows/validate-cloudflare-v77.yml'); s=p.read_text()
          s=s.replace("['V77.18.20','Claude Reviewer Integration'","['V77.18.21','Prompt-Driven Autonomous Orchestration'",1)
          s=s.replace("throw new Error('V77.18.20 index lock missing: '+x)","throw new Error('V77.18.21 index lock missing: '+x)",1)
          s=s.replace("hub.includes('V77.18.20')","hub.includes('V77.18.21')",1)
          s=s.replace("'v771820:claude:last']","'v771821:claude:last','DAILY_SYSTEM_TUNING_REVIEW','DAILY_AUDIT_KEY','engine-v77168.js','hyro-scanner.js']",1)
          s=s.replace("Canonical V77.18.20 Claude reviewer validation PASS","Canonical V77.18.21 prompt-driven autonomous validation PASS",1)
          p.write_text(s)
          p=Path('docs/checkpoints/CURRENT_HANDOFF.md'); s=p.read_text()
          s=s.replace('3. `V771820_CLAUDE_REVIEWER.md`','3. `V771821_PROMPT_DRIVEN_AUTONOMY.md`\n4. `V771820_CLAUDE_REVIEWER.md`',1)
          s=s.replace('**Canonical source is V77.18.20 — ChatGPT Primary + Claude Reviewer.**','**Canonical source is V77.18.21 — Prompt-Driven Autonomous Orchestration.**',1)
          s=s.replace('3. No new trigger: no Anthropic API call.\n4. Telegram','3. Every ~24h: one `DAILY_SYSTEM_TUNING_REVIEW` for conflicts, HUB and market-specific entry discovery.\n4. No new trigger: no Anthropic API call.\n5. Telegram',1)
          s=s.replace('Claude receives only public GitHub commit/diff + truncated critical public source + sanitized System Health.','Claude receives only public GitHub commit/diff + truncated engine/scanner/HUB/PROP/risk/management source + sanitized System Health/runtime summary.',1)
          s=s.replace('V77.18.20 deployment.','V77.18.21 deployment.',1).replace('V77.18.20 production-active','V77.18.21 production-active',1).replace('V77.18.20 — Claude Reviewer Integration','V77.18.21 — Prompt-Driven Autonomous Orchestration',1).replace('Canonical V77.18.20 ChatGPT Primary + Claude Reviewer.','Canonical V77.18.21 Prompt-Driven Autonomous Orchestration.',1)
          p.write_text(s)
          Path('docs/checkpoints/V771821_PROMPT_DRIVEN_AUTONOMY.md').write_text('''# V77.18.21 — PROMPT-DRIVEN AUTONOMOUS ORCHESTRATION\n\nUser only needs to state the goal/prompt. ChatGPT is PRIMARY and handles connected-tool audit, implementation, validation, Wrangler dry-run, version/checkpoint updates and reporting. Do not ask the user for technical steps that available connected tools can perform.\n\nClaude is FINAL REVIEWER only. It reviews release changes, new health incidents, and a roughly daily system-tuning snapshot. Review context includes Signal engine, HUB, Hyro scanner/runtime/execution, microstructure, portfolio guard, position manager and HOLD/TIGHTEN/CUT. It searches for code/config conflicts, unreachable entry paths, over-filtering and market-specific entry improvements.\n\nClaude advice never mutates production automatically. ChatGPT remains the only engineering decision maker. Claude has no trade, close, deploy, secret or risk-override authority. Never reset TRADING_STATE or LIVE ORDERS. Hard risk/news/freshness/execution-authority gates cannot be weakened merely to create more trades.\n''')
          PY
      - name: Syntax and canonical checks
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
          grep -q 'V77.18.21' cloudflare-worker/index.js
          grep -q 'DAILY_SYSTEM_TUNING_REVIEW' cloudflare-worker/claude-reviewer.js
          grep -q 'engine-v77168.js' cloudflare-worker/claude-reviewer.js
          grep -q 'hyro-scanner.js' cloudflare-worker/claude-reviewer.js
          ! grep -q 'hyroMultiStatus' cloudflare-worker/index.js
      - name: Install and dry-run Worker
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: |
          npm install
          npm run prepare:wrangler
          npx wrangler deploy --dry-run
      - name: Commit migration
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js cloudflare-worker/hub-v77171.js .github/workflows/validate-cloudflare-v77.yml docs/checkpoints/CURRENT_HANDOFF.md docs/checkpoints/V771821_PROMPT_DRIVEN_AUTONOMY.md
          git commit -m "V77.18.21 prompt-driven autonomous orchestration" || true
          git push
