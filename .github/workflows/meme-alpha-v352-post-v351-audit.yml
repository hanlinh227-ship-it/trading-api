name: Meme Alpha v3.52 Post v3.51 Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v352-post-v351-audit.sh'
      - '.github/workflows/meme-alpha-v352-post-v351-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
