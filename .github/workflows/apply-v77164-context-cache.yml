name: Apply V77.16.4 Context Cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77164_context_cache.js'
      - '.github/workflows/apply-v77164-context-cache.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          : > V77164_DIAGNOSTIC.txt
          node --check scripts/apply_v77164_context_cache.js >> V77164_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77164_DIAGNOSTIC.txt
          node scripts/apply_v77164_context_cache.js >> V77164_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77164_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77164_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77164_DIAGNOSTIC.txt
          for t in 'V77.16.4' 'contextPrefix' 'saveMarketContext' 'loadMarketContext' 'cached 28-pair strength' 'FUTURE_RISK_LIMIT_REQUIRED' 'Context-Cached Stable Quality Hub'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77164_DIAGNOSTIC.txt; else echo "$t=NO" >> V77164_DIAGNOSTIC.txt; fi; done
      - name: Promote
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77164_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77164_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77164_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77164_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.16.4 context cache and safeguards' || exit 0
          git push origin main
