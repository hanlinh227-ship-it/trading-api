name: Meme Alpha v2.2.1 Inspect Scoring Sellability

on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v221-inspect-scoring-sellability.sh'
      - '.github/workflows/meme-alpha-v221-inspect-scoring-sellability.yml'

jobs:
  inspect:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect scoring and sellability
        run: bash ops/meme-alpha/v221-inspect-scoring-sellability.sh
