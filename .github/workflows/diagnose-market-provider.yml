name: Diagnose Market Provider

on:
  push:
    paths:
      - "data/provider_diag_request.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TD_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe canonical DAX forms
        shell: bash
        run: |
          mkdir -p data
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone
          key=os.environ["TD_KEY"]
          headers={"Authorization":f"apikey {key}","User-Agent":"trading-api-diagnostic/4.0"}
          def get(endpoint,params):
              url="https://api.twelvedata.com/"+endpoint+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:return {"ok":True,"httpStatus":r.status,"body":json.loads(r.read().decode())}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors="replace")
                  try: body=json.loads(raw)
                  except Exception: body={"raw":raw[:1500]}
                  return {"ok":False,"httpStatus":e.code,"body":body}
          forms={
              "plain":{"symbol":"GDAXI"},
              "exchange":{"symbol":"GDAXI","exchange":"XETR"},
              "mic":{"symbol":"GDAXI","mic_code":"XETR"},
              "both":{"symbol":"GDAXI","exchange":"XETR","mic_code":"XETR"},
              "colon":{"symbol":"GDAXI:XETR"},
          }
          out={"generatedAt":datetime.now(timezone.utc).isoformat(),"tests":{}}
          for name,p in forms.items():
              out["tests"]["ts:"+name]=get("time_series",{**p,"interval":"1min","outputsize":3,"timezone":"UTC"})
              out["tests"]["quote:"+name]=get("quote",{**p,"timezone":"UTC"})
          with open("data/market-provider-diagnostics.json","w",encoding="utf-8") as f:json.dump(out,f,ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market-provider-diagnostics.json
          git commit -m "Record canonical DAX request diagnostics" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
