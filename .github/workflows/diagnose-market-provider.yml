name: Diagnose Market Provider

on:
  push:
    paths:
      - "data/provider_diag_request.txt"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TD_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Probe Twelve Data catalogs and exact instrument filters
        shell: bash
        run: |
          mkdir -p data
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          from datetime import datetime, timezone

          key = os.environ.get("TD_KEY") or ""
          if not key:
              raise SystemExit("TWELVEDATA_API_KEY secret is missing")

          HEADERS = {"Authorization": f"apikey {key}", "User-Agent": "trading-api-diagnostic/2.0"}

          def fetch_json(url, timeout=40):
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode("utf-8", errors="replace")
                      try:
                          body = json.loads(raw)
                      except Exception:
                          body = {"raw": raw[:4000]}
                      return {"httpStatus": r.status, "ok": True, "body": body}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", errors="replace")
                  try:
                      body = json.loads(raw)
                  except Exception:
                      body = {"raw": raw[:4000]}
                  return {"httpStatus": e.code, "ok": False, "body": body}
              except Exception as e:
                  return {"httpStatus": None, "ok": False, "error": str(e)}

          def contains_any(text, needles):
              low = (text or "").lower()
              return any(n.lower() in low for n in needles)

          indices = fetch_json("https://api.twelvedata.com/indices?outputsize=5000&show_plan=true")
          commodities = fetch_json("https://api.twelvedata.com/commodities?outputsize=5000")
          instrument_types = fetch_json("https://api.twelvedata.com/instrument_type")

          index_rows = ((indices.get("body") or {}).get("data") or []) if indices.get("ok") else []
          commodity_rows = ((commodities.get("body") or {}).get("data") or []) if commodities.get("ok") else []

          index_matches = [r for r in index_rows if contains_any(
              f"{r.get('symbol','')} {r.get('name','')} {r.get('instrument_name','')}",
              ["nasdaq 100", "nasdaq-100", "s&p 500", "sp 500", "nikkei 225", "dax"]
          )]
          commodity_matches = [r for r in commodity_rows if contains_any(
              f"{r.get('symbol','')} {r.get('name','')} {r.get('description','')}",
              ["nasdaq", "s&p 500", "e-mini", "gold futures", "silver futures", "crude oil futures", "wti"]
          )]

          explicit = {}
          tests = [
              ("NDX_plain", "NDX", {}),
              ("NDX_type_index", "NDX", {"type": "Index"}),
              ("NDX_nasdaq_index", "NDX", {"exchange": "NASDAQ", "type": "Index"}),
              ("NDX_colon_nasdaq", "NDX:NASDAQ", {}),
              ("SPX_plain", "SPX", {}),
              ("SPX_type_index", "SPX", {"type": "Index"}),
              ("N225_type_index", "N225", {"type": "Index"}),
              ("DAX_type_index", "DAX", {"type": "Index"}),
          ]

          for name, symbol, extra in tests:
              params = {"symbol": symbol, "interval": "1min", "outputsize": 3, "timezone": "UTC", **extra}
              qs = urllib.parse.urlencode(params)
              explicit[f"time_series:{name}"] = fetch_json(f"https://api.twelvedata.com/time_series?{qs}")
              pqs = urllib.parse.urlencode({"symbol": symbol, **extra})
              explicit[f"price:{name}"] = fetch_json(f"https://api.twelvedata.com/price?{pqs}")

          # Automatically probe catalog matches that look like the canonical targets.
          discovered = {}
          for row in index_matches[:20]:
              sym = row.get("symbol")
              if not sym:
                  continue
              params = {"symbol": sym, "interval": "1min", "outputsize": 3, "timezone": "UTC"}
              if row.get("exchange"):
                  params["exchange"] = row["exchange"]
              if row.get("mic_code"):
                  params["mic_code"] = row["mic_code"]
              params["type"] = "Index"
              label = f"{sym}|{row.get('exchange')}|{row.get('mic_code')}"
              discovered[label] = {
                  "catalog": row,
                  "timeSeries": fetch_json("https://api.twelvedata.com/time_series?" + urllib.parse.urlencode(params)),
                  "price": fetch_json("https://api.twelvedata.com/price?" + urllib.parse.urlencode({k:v for k,v in params.items() if k not in ('interval','outputsize','timezone')})),
              }

          out = {
              "generatedAt": datetime.now(timezone.utc).isoformat(),
              "indicesEndpoint": {"httpStatus": indices.get("httpStatus"), "ok": indices.get("ok"), "count": len(index_rows)},
              "commoditiesEndpoint": {"httpStatus": commodities.get("httpStatus"), "ok": commodities.get("ok"), "count": len(commodity_rows)},
              "instrumentTypes": instrument_types,
              "indexMatches": index_matches[:100],
              "commodityMatches": commodity_matches[:100],
              "explicitTests": explicit,
              "discoveredIndexTests": discovered,
          }
          with open("data/market-provider-diagnostics.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False, indent=2)
          print(json.dumps({
              "indices": out["indicesEndpoint"],
              "commodities": out["commoditiesEndpoint"],
              "indexMatches": index_matches[:20],
              "commodityMatches": commodity_matches[:20],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "market-data-bot"
          git config user.email "market-data-bot@users.noreply.github.com"
          git add data/market-provider-diagnostics.json
          if git diff --cached --quiet; then
            echo "No diagnostic changes."
            exit 0
          fi
          git commit -m "Record exact Twelve Data instrument diagnostics"
          git pull --rebase origin main
          git push origin HEAD:main
