name: Offline Forex V12 Legacy Path
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v12_legacy_path_gate.py'
      - '.github/workflows/offline-forex-v12-legacy-path.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Forex V12 zero-credit path gate
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v12_legacy_path_gate.py
