name: RETIRED - VPS Production Runtime Confirm

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Retired workflow notice
        run: |
          echo 'RETIRED=true'
          echo 'This workflow no longer asserts a hard-coded production revision.'
          echo 'Canonical production deployment and runtime-revision verification are performed by .github/workflows/deploy-cloudflare-worker.yml.'
