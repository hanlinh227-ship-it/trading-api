name: VPS Production Runtime Confirm

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-production-runtime-confirm.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  confirm:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Wait for adaptive production revision
        shell: bash
        env:
          EXPECTED_REVISION: c14839f34ea66e6a419d828acfb2d7c2dad4ed8d
          REPORT: /tmp/production-runtime-confirm.json
        run: |
          set -euo pipefail
          URL='https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health'
          LAST=''
          MATCH=false
          ACTIVE=''
          for i in $(seq 1 20); do
            LAST="$(curl -fsS --max-time 15 "$URL" || true)"
            if [ -n "$LAST" ]; then
              ACTIVE="$(printf '%s' "$LAST" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("runtimeRevision", ""))' 2>/dev/null || true)"
              if [ "$ACTIVE" = "$EXPECTED_REVISION" ]; then MATCH=true; break; fi
            fi
            sleep 12
          done
          export MATCH ACTIVE
          if [ -n "$LAST" ]; then
            printf '%s' "$LAST" | python3 -c 'import json,sys,os; d=json.load(sys.stdin); out={"ok":os.environ.get("MATCH")=="true","expectedRevision":os.environ["EXPECTED_REVISION"],"runtimeRevision":d.get("runtimeRevision"),"exchange":d.get("exchange"),"mode":d.get("mode"),"execution":d.get("execution"),"privateTransport":d.get("privateTransport")}; print(json.dumps(out,indent=2))' > "$REPORT"
          else
            python3 -c 'import json,os; print(json.dumps({"ok":False,"expectedRevision":os.environ["EXPECTED_REVISION"],"runtimeRevision":None,"reason":"HEALTH_UNAVAILABLE"},indent=2))' > "$REPORT"
          fi
          test "$MATCH" = true
      - name: Persist runtime confirmation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/diagnostics
          cp /tmp/production-runtime-confirm.json docs/diagnostics/LATEST_PRODUCTION_RUNTIME_CONFIRM.json || echo '{"ok":false,"reason":"REPORT_MISSING"}' > docs/diagnostics/LATEST_PRODUCTION_RUNTIME_CONFIRM.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/LATEST_PRODUCTION_RUNTIME_CONFIRM.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record production runtime confirmation'
          git push origin HEAD:main
