name: Check V77.16.4 Final Stability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77164-final-stability.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build
        shell: bash
        run: |
          set +e
          : > V77164_FINAL.txt
          node --check cloudflare-worker/index.js >> V77164_FINAL.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77164_FINAL.txt
          cd cloudflare-worker
          npm install >> ../V77164_FINAL.txt 2>&1; echo "NPM_EXIT=$?" >> ../V77164_FINAL.txt
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler >> ../V77164_FINAL.txt 2>&1; echo "PREPARE_EXIT=$?" >> ../V77164_FINAL.txt
          npx wrangler deploy --dry-run >> ../V77164_FINAL.txt 2>&1; echo "WRANGLER_EXIT=$?" >> ../V77164_FINAL.txt
          cd ..
      - name: Wait deploy
        run: sleep 45
      - name: Initial status crypto and future
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77164_FINAL.txt
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c1.json; echo "CRYPTO1_CURL=$?" >> V77164_FINAL.txt
          curl -fsS --max-time 70 "$BASE/run-now?group=future" -o /tmp/u1.json; echo "FUTURE1_CURL=$?" >> V77164_FINAL.txt
          sleep 4
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c2.json; echo "CRYPTO2_CURL=$?" >> V77164_FINAL.txt
      - name: Align fresh Twelve Data minute
        shell: bash
        run: |
          S=$(date -u +%S); WAIT=$((65-10#$S)); if [ "$WAIT" -lt 5 ]; then WAIT=$((WAIT+60)); fi; sleep "$WAIT"
      - name: Hub then direct-symbol reuse checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 180 "$BASE/hub" -o /tmp/h.json; echo "HUB_CURL=$?" >> V77164_FINAL.txt
          curl -fsS --max-time 25 "$BASE/analyze?symbol=MNQ" -o /tmp/mnq.json; echo "MNQ_CURL=$?" >> V77164_FINAL.txt
          curl -fsS --max-time 75 "$BASE/analyze?symbol=BTCUSDT" -o /tmp/btc.json; echo "BTC_CURL=$?" >> V77164_FINAL.txt
      - name: Align fresh TD minute for direct Forex Metal
        shell: bash
        run: |
          S=$(date -u +%S); WAIT=$((65-10#$S)); if [ "$WAIT" -lt 5 ]; then WAIT=$((WAIT+60)); fi; sleep "$WAIT"
      - name: Direct Forex Metal and state
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          T0=$(date +%s%3N); curl -fsS --max-time 35 "$BASE/analyze?symbol=EURUSD" -o /tmp/eur.json; EC=$?; T1=$(date +%s%3N); echo "EUR_CURL=$EC EUR_MS=$((T1-T0))" >> V77164_FINAL.txt
          T0=$(date +%s%3N); curl -fsS --max-time 35 "$BASE/analyze?symbol=XAUUSD" -o /tmp/xau.json; XC=$?; T1=$(date +%s%3N); echo "XAU_CURL=$XC XAU_MS=$((T1-T0))" >> V77164_FINAL.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/o.json; echo "ORDERS_CURL=$?" >> V77164_FINAL.txt
          curl -fsS --max-time 15 "$BASE/telegram/menu" -o /tmp/t.json; echo "MENU_CURL=$?" >> V77164_FINAL.txt
          node <<'NODE' >> V77164_FINAL.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const s=j('/tmp/s.json'),c1=j('/tmp/c1.json'),c2=j('/tmp/c2.json'),u1=j('/tmp/u1.json'),h=j('/tmp/h.json'),mnq=j('/tmp/mnq.json'),btc=j('/tmp/btc.json'),eur=j('/tmp/eur.json'),xau=j('/tmp/xau.json'),o=j('/tmp/o.json'),t=j('/tmp/t.json');
          const actionable=a=>['MARKET','LIMIT','MARKET_PLAN','LIMIT_PLAN'].includes(a?.status);
          const floor=g=>g==='future'?1.50:g==='metal'?1.40:g==='crypto'?1.30:1.25;
          let badRR=[],badRisk=[],hubActions=0,actionGroups=new Set();
          function audit(name,r,g){const arr=r?.analyses||[],n=x=>arr.filter(a=>a.status===x).length;console.log(name+'='+(r?.broadOk??'-')+'/'+(r?.requested??'-')+' deep='+(r?.deepOk??'-')+'/'+(r?.deepRequested??'-')+' attempts='+(r?.diagnostics?.deepAttempted??'-')+' M='+n('MARKET')+' L='+n('LIMIT')+' MP='+n('MARKET_PLAN')+' LP='+n('LIMIT_PLAN')+' W='+n('WATCH'));for(const a of arr){const p=a.planned||a;if(actionable(a)){const rr=Number(p.targetRR);if(!Number.isFinite(rr)||rr+1e-9<floor(g))badRR.push(name+':'+a.symbol+':'+rr);if(g==='future'&&a.microSizing&&a.microSizing.tradable===false)badRisk.push(a.symbol);}}console.log(name+'_RESULTS='+arr.map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':RR='+((a.planned||a).targetRR??'-')+':risk='+(a.microSizing?.tradable??'-')).join('|'));}
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('MASSIVE='+(s.massive===true?'YES':'NO'));
          audit('CRYPTO1',c1,'crypto');audit('CRYPTO2',c2,'crypto');audit('FUTURE1',u1,'future');
          const runs=h.runs||{};for(const g of ['crypto','forex','metal','future']){audit('HUB_'+g.toUpperCase(),runs[g]||{},g);for(const a of runs[g]?.analyses||[])if(actionable(a)){hubActions++;actionGroups.add(g);}}
          const futureMicroOnly=(runs.future?.analyses||[]).every(a=>['MNQ','MES'].includes(a.symbol));
          console.log('HUB_ACTIONS='+hubActions);console.log('ACTION_GROUPS='+[...actionGroups].join(','));console.log('BAD_RR='+badRR.join('|'));console.log('BAD_RISK='+badRisk.join('|'));console.log('FUTURE_MICRO_ONLY='+(futureMicroOnly?'YES':'NO'));
          console.log('CRYPTO_REFRESHED='+(c1.scanId&&c2.scanId&&c1.scanId!==c2.scanId?'YES':'NO'));
          console.log('MNQ_DIRECT='+String(mnq.ok)+':'+String(mnq.status)+':reuse='+String(mnq.freshScanReuse)+':age='+String(mnq.scanAgeSec)+':RR='+String((mnq.planned||mnq).targetRR??'-'));
          console.log('BTC_DIRECT='+String(btc.ok)+':'+String(btc.status)+':RR='+String((btc.planned||btc).targetRR??'-'));
          console.log('EUR_DIRECT='+String(eur.ok)+':'+String(eur.status)+':cached='+String(eur.context?.contextCached)+':RR='+String((eur.planned||eur).targetRR??'-'));
          console.log('XAU_DIRECT='+String(xau.ok)+':'+String(xau.status)+':cached='+String(xau.context?.contextCached)+':RR='+String((xau.planned||xau).targetRR??'-'));
          console.log('DURABLE_WATCH_ZERO='+(Object.values(o).every(b=>!Array.isArray(b?.watch)||b.watch.length===0)?'YES':'NO'));console.log('TELEGRAM_MENU_OK='+(t.ok===true?'YES':'NO'));
          const coverage=(c1.broadOk||0)>=55&&(c2.broadOk||0)>=55&&(u1.broadOk||0)>=4&&(runs.crypto?.broadOk||0)>=55&&(runs.forex?.broadOk||0)===28&&(runs.metal?.broadOk||0)===2&&(runs.future?.broadOk||0)>=4;
          const deep=(c1.deepOk||0)>=3&&(c2.deepOk||0)>=3&&(u1.deepOk||0)>=2&&(runs.crypto?.deepOk||0)>=3&&(runs.forex?.deepOk||0)===3&&(runs.metal?.deepOk||0)===2&&(runs.future?.deepOk||0)>=2;
          const directOK=mnq.ok!==false&&mnq.freshScanReuse===true&&btc.ok!==false&&eur.ok!==false&&xau.ok!==false&&eur.context?.contextCached===true&&xau.context?.contextCached===true;
          const pass=s.version==='V77.16.4'&&s.ok===true&&s.massive===true&&coverage&&deep&&badRR.length===0&&badRisk.length===0&&futureMicroOnly&&hubActions>0&&actionGroups.size>=2&&c1.scanId!==c2.scanId&&directOK&&t.ok===true;
          console.log('STABILITY_VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Final report
        shell: bash
        run: |
          if grep -q 'SYNTAX_EXIT=0' V77164_FINAL.txt && grep -q 'WRANGLER_EXIT=0' V77164_FINAL.txt && grep -q 'STABILITY_VERDICT=PASS' V77164_FINAL.txt; then echo 'FINAL_VERDICT=PASS' >> V77164_FINAL.txt; else echo 'FINAL_VERDICT=FAIL' >> V77164_FINAL.txt; fi
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77164_FINAL.txt; git commit -m 'Report V77.16.4 final stability verification' || exit 0; git push origin main
# retrigger
