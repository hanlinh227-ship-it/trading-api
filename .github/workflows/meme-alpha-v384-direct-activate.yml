name: Meme Alpha V385 Recovery
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v384-direct-activate.yml']
jobs:
  recover:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Restart scanner pipeline and verify recovery
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== BEFORE ==='
          grep -nE 'V385_SEQUENTIAL_CLUSTER_SCAN|V385_PRIORITY_RESERVE|V385_CLUSTER_SIZE|MAX_SELLABILITY_CHECKS_V216' "$APP/src/scanner.js" || true
          python3 -c "import json; d=json.load(open('$APP/runtime-status/micro-live-gate.json')); print({k:d.get(k) for k in ['allowed','armOk','armAttested','executionMode','sourceHealthy','riskEntryAllowed','liveRiskReady','reasons']})" || true
          echo '=== RESTART PAPER/SCANNER ==='
          sudo -n /bin/systemctl restart meme-alpha-paper.service
          sleep 4
          sudo -n /bin/systemctl is-active meme-alpha-paper.service
          echo '=== SERVICES ==='
          for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$s"; systemctl is-active "$s" || true; done
          echo '=== WAIT LIVE HEALTH ==='
          ok=0
          for i in $(seq 1 30); do
            sleep 3
            python3 - <<'PY' && { ok=1; break; } || true
import json, os, time
app='/opt/meme-alpha/app/runtime-status'
g=json.load(open(app+'/micro-live-gate.json'))
s=json.load(open(app+'/signal-snapshot.json'))
print({'gate':{k:g.get(k) for k in ['allowed','armOk','armAttested','executionMode','sourceHealthy','riskEntryAllowed','liveRiskReady','reasons']},'signalAgeSec':round(time.time()-os.path.getmtime(app+'/signal-snapshot.json'),1),'signalCount':len(s.get('candidates') or []),'intelSummary':s.get('intelSummary')})
assert g.get('armOk') is True
assert g.get('armAttested') is True
assert g.get('executionMode') == 'MICRO_LIVE'
assert g.get('sourceHealthy') is True
assert g.get('riskEntryAllowed') is True
assert g.get('liveRiskReady') is True
assert g.get('allowed') is True
assert time.time()-os.path.getmtime(app+'/signal-snapshot.json') < 45
PY
          done
          [ "$ok" -eq 1 ] || { echo LIVE_RECOVERY=FALSE; exit 1; }
          echo LIVE_RECOVERY=TRUE
