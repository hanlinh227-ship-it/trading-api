name: Research MT5 Progressive Backtest

on:
  push:
    branches: [ main ]
    paths:
      - 'research/mt5_progressive_tp_backtest.py'
      - '.github/workflows/research-mt5-progressive-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run research backtest
        run: python research/mt5_progressive_tp_backtest.py | tee progressive-backtest-result.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: progressive-backtest-result
          path: progressive-backtest-result.txt
          retention-days: 30
