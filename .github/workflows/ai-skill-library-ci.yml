name: AI Skill Library CI

on:
  push:
    branches: [main, github-brain-v2, 'github-brain-v2-*', 'github-brain-v3-*', 'github-brain-v4-*']
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - '.github/workflows/ai-skill-library-ci.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - '.github/workflows/ai-skill-library-ci.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Compile Python
        run: >-
          python -m py_compile
          AI_SKILL_LIBRARY/ingest_sources.py
          AI_SKILL_LIBRARY/validate_registry.py
          AI_SKILL_LIBRARY/validate_brain.py
          AI_SKILL_LIBRARY/validate_router.py
          AI_SKILL_LIBRARY/validate_authority.py
          AI_SKILL_LIBRARY/validate_runtime.py
          AI_SKILL_LIBRARY/validate_v3.py
      - name: Run integration tests
        run: python -m unittest discover -s AI_SKILL_LIBRARY/tests -v
      - name: Validate source registry
        run: python AI_SKILL_LIBRARY/validate_registry.py
      - name: Validate routed brain compatibility
        run: python AI_SKILL_LIBRARY/validate_brain.py
      - name: Validate router and skill schemas
        run: python AI_SKILL_LIBRARY/validate_router.py
      - name: Validate project authority
        run: python AI_SKILL_LIBRARY/validate_authority.py
      - name: Validate adaptive agent runtime
        run: python AI_SKILL_LIBRARY/validate_runtime.py
      - name: Validate V3 unified kernel
        run: python AI_SKILL_LIBRARY/validate_v3.py
      - name: Validate ingest selection without cloning
        run: python AI_SKILL_LIBRARY/ingest_sources.py --all --dry-run --output /tmp/ai-skill-library.jsonl
      - name: Audit upstream repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python AI_SKILL_LIBRARY/validate_registry.py --check-remote
