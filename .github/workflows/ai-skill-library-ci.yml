name: AI Skill Library CI

on:
  push:
    branches: [main, github-brain-v2, 'github-brain-v2-*', 'github-brain-v3-*', 'github-brain-v4-*']
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - '.github/workflows/ai-skill-library-ci.yml'
      - '.github/workflows/ai-brain-evergreen-*.yml'
      - '.github/workflows/ai-brain-v4-release.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - '.github/workflows/ai-skill-library-ci.yml'
      - '.github/workflows/ai-brain-evergreen-*.yml'
      - '.github/workflows/ai-brain-v4-release.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  # Periodic revalidation for the Brain Expansion activation sweep: eligibility is
  # cached against a TTL, and an upstream that recovers should be picked up
  # without waiting for the next push.
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Compile Python
        run: |
          python -m py_compile \
            AI_SKILL_LIBRARY/ingest_sources.py \
            AI_SKILL_LIBRARY/validate_registry.py \
            AI_SKILL_LIBRARY/validate_brain.py \
            AI_SKILL_LIBRARY/validate_router.py \
            AI_SKILL_LIBRARY/validate_authority.py \
            AI_SKILL_LIBRARY/validate_runtime.py \
            AI_SKILL_LIBRARY/validate_v3.py \
            AI_SKILL_LIBRARY/validate_v4.py \
            AI_SKILL_LIBRARY/validate_skill_gateway.py \
            AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py \
            AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py
          python -m compileall -q AI_SKILL_LIBRARY/v4
      - name: Brain validation via single entrypoint (validators, snapshot, release, index, consolidation, tests)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"
          echo "SKILL_GATEWAY_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
      # Closure Task 0: the unittest path above collects only TestCase
      # subclasses, so 98 module-level `def test_*` functions in five merged
      # files pass under pytest and are silently never executed by CI. They are
      # not failing; they are not running, which is worse, because a green
      # board was being read as coverage they never had.
      #
      # ci_validate is deliberately left alone: it is the canonical gate and
      # rewriting it to collect two styles would risk the 2600 tests it already
      # runs. pytest is installed only for this step.
      - name: Install pytest for module-level test collection
        run: python -m pip install pytest
      - name: Run the merged tests unittest cannot collect
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            AI_SKILL_LIBRARY/tests/test_survival_plane_proof.py \
            AI_SKILL_LIBRARY/tests/test_survival_recovery.py \
            AI_SKILL_LIBRARY/tests/test_always_on_retry.py \
            AI_SKILL_LIBRARY/tests/test_always_on_reconciler.py \
            AI_SKILL_LIBRARY/tests/test_federation_status_scopes.py
      - name: Prove every module-level test actually executed
        shell: bash
        run: |
          set -euo pipefail
          # A green pytest run over a file that collected nothing is the exact
          # failure this step exists to catch, so assert the count rather than
          # trusting the exit code.
          declare -A expected=(
            [test_survival_plane_proof.py]=12
            [test_survival_recovery.py]=13
            [test_always_on_retry.py]=9
            [test_always_on_reconciler.py]=7
            [test_federation_status_scopes.py]=58
          )
          total=0
          for file in "${!expected[@]}"; do
            count="$(python -m pytest --collect-only -q \
              "AI_SKILL_LIBRARY/tests/${file}" 2>/dev/null \
              | grep -c '::' || true)"
            echo "COLLECTED_${file}=${count} (expected ${expected[$file]})"
            if [ "${count}" -lt "${expected[$file]}" ]; then
              echo "PYTEST_COLLECTION=FAIL ${file} collected ${count}, expected at least ${expected[$file]}"
              exit 1
            fi
            total=$((total + count))
          done
          echo "PYTEST_MODULE_LEVEL_TESTS_EXECUTED=${total}"
          if [ "${total}" -lt 41 ]; then
            echo "PYTEST_COLLECTION=FAIL total ${total} below the 41 this step exists to run"
            exit 1
          fi
          echo "PYTEST_COLLECTION=PASS"
      - name: Validate ingest selection without cloning
        run: python AI_SKILL_LIBRARY/ingest_sources.py --all --dry-run --output /tmp/ai-skill-library.jsonl
      - name: Audit upstream repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python AI_SKILL_LIBRARY/validate_registry.py --check-remote

  # Brain Expansion activation runtime.
  #
  # This is where AUTO_ACTIVATE_WHEN_VERIFIED runs against a real environment:
  # optional dependencies are installed into the job image, credentials come from
  # repository secrets (never from the repository), the egress probe opens a real
  # socket, and each adapter runs its own sandbox test. An adapter turns on only
  # when every condition it requires is proven here.
  #
  # Why here and not in the Worker: the production request path is a Cloudflare
  # Worker (V8 isolate, JavaScript only). It cannot host a Python package or a
  # browser engine, and the evaluation and typed-contract lanes carry
  # `production_dependency: false` by contract - a CI runner is their canonical
  # runtime, not the request path.
  #
  # Only runs on a schedule or manual dispatch, so the heavy optional
  # dependencies never slow down ordinary push/PR validation. Adapters being off
  # is a normal outcome, not a build failure.
  brain-expansion-activation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: brain-expansion-activation
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install brain validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Prove the stable path with all adapters off
        run: |
          python AI_SKILL_LIBRARY/v4/tools/validate_brain_expansion.py
          python AI_SKILL_LIBRARY/v4/tools/activate_brain_expansion.py \
            --root . --no-env --output /tmp/activation-baseline.json
          python - <<'PY'
          import json
          report = json.load(open('/tmp/activation-baseline.json'))
          assert report['stable_path_ok'], 'stable path broken before activation'
          assert report['enabled'] == [], f"adapters enabled with no dependencies: {report['enabled']}"
          print('BASELINE_ALL_OFF=PASS')
          PY
      - name: Install optional adapter dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements-brain-expansion.txt
      # An unset secret is an empty string, which the runtime reports as
      # credential_present=FAIL and the adapter stays off. That is the design.
      - name: Activation sweep with real probes
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          python AI_SKILL_LIBRARY/v4/tools/activate_brain_expansion.py \
            --root . --runtime validator \
            --output AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-activation.json
      - name: Confirm the report carries no credential material
        run: |
          python - <<'PY'
          import json, re, sys
          path = 'AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-activation.json'
          text = open(path, encoding='utf-8').read()
          patterns = (r'sk-[A-Za-z0-9_-]{8,}', r'pk-[A-Za-z0-9_-]{8,}',
                      r'bearer\s+\S+', r'-----BEGIN [A-Z ]*PRIVATE KEY-----')
          hits = [p for p in patterns if re.search(p, text, re.IGNORECASE)]
          if hits:
              print(f'[ERROR] activation report matched credential pattern(s): {hits}')
              sys.exit(1)
          report = json.loads(text)
          assert report['router_authority'] == 'task_router'
          assert report['memory_authority'] == 'memory_continuity'
          for name, row in report['adapters'].items():
              for claim in ('routing_authority', 'reasoning_authority',
                            'memory_authority', 'model_selection_authority'):
                  assert row[claim] is False, f'{name} claimed {claim}'
              if row['enabled']:
                  assert row['evidence'], f'{name} enabled without evidence'
          print('ACTIVATION_REPORT_CLEAN=PASS')
          for name in sorted(report['adapters']):
              row = report['adapters'][name]
              print(f"  {name}: state={row['state']} enabled={row['enabled']}")
          print(f"BRAIN_EXPANSION_LIVE={report['enabled'] or 'none'}")
          assert report['stable_path_ok'], 'stable path broken after activation'
          PY
      - name: Upload activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-expansion-activation
          path: AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-activation.json
          if-no-files-found: warn
          retention-days: 30

  # Browser Use isolated runtime.
  #
  # `browser_use` was the last adapter stuck at `dependency_available=FAIL`, and
  # the cause was the install, never the contract: `browser-use` brings
  # Playwright and a downloaded Chromium build, and resolving that beside a
  # distribution-managed interpreter has to replace packages the system package
  # manager owns. Forcing it (`--ignore-installed`) would trade an honest FAIL
  # for a broken image.
  #
  # So this job gives the adapter an interpreter of its own: a clean `venv` that
  # owns its whole dependency tree, with the runner's system Python untouched.
  # Nothing else installs from `requirements-brain-expansion-browser.txt`, and
  # the stable brain keeps working with none of it present - the baseline step
  # below proves exactly that inside this same venv before anything is enabled.
  #
  # The sandbox is loopback-only. The health probe renders a `data:` URL and the
  # sandbox probe loads a static page served on 127.0.0.1, so a real browser is
  # proven without one external request. That is why `network_allowed` is not
  # one of this adapter's gates.
  brain-expansion-browser-runtime:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: brain-expansion-browser-runtime
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the dedicated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .browser-runtime
          .browser-runtime/bin/python -m pip install --upgrade pip
          .browser-runtime/bin/python -m pip install \
            -r AI_SKILL_LIBRARY/requirements.txt \
            -r AI_SKILL_LIBRARY/requirements-brain-expansion-browser.txt
      - name: Confirm the system interpreter was left alone
        shell: bash
        run: |
          set -euo pipefail
          if python -c 'import importlib.util,sys; sys.exit(0 if importlib.util.find_spec("browser_use") else 1)'; then
            echo '[ERROR] browser-use leaked into the system interpreter'
            exit 1
          fi
          echo 'SYSTEM_INTERPRETER_UNTOUCHED=PASS'
      - name: Install the Chromium engine into the runtime
        run: .browser-runtime/bin/python -m playwright install --with-deps chromium
      - name: Prove the stable path with all adapters off
        shell: bash
        run: |
          set -euo pipefail
          .browser-runtime/bin/python AI_SKILL_LIBRARY/v4/tools/validate_brain_expansion.py
          .browser-runtime/bin/python AI_SKILL_LIBRARY/v4/tools/activate_brain_expansion.py \
            --root . --no-env --no-probe --output /tmp/browser-baseline.json
          .browser-runtime/bin/python - <<'PY'
          import json
          report = json.load(open('/tmp/browser-baseline.json'))
          assert report['stable_path_ok'], 'stable path broken before activation'
          assert report['enabled'] == [], f"adapters enabled with no probes: {report['enabled']}"
          print('BROWSER_BASELINE_ALL_OFF=PASS')
          PY
      - name: Browser Use targeted tests
        run: |
          .browser-runtime/bin/python -m unittest \
            AI_SKILL_LIBRARY.tests.test_brain_expansion_browser_runtime \
            AI_SKILL_LIBRARY.tests.test_brain_expansion_activation_runtime \
            AI_SKILL_LIBRARY.tests.test_brain_expansion_auto_activation
      - name: Activation sweep in the browser runtime
        run: |
          .browser-runtime/bin/python AI_SKILL_LIBRARY/v4/tools/activate_brain_expansion.py \
            --root . --runtime browser --require browser_use \
            --output AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-browser-activation.json
      - name: Confirm the evidence carries no credential material
        run: |
          .browser-runtime/bin/python - <<'PY'
          import json, re, sys
          path = 'AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-browser-activation.json'
          text = open(path, encoding='utf-8').read()
          patterns = (r'sk-[A-Za-z0-9_-]{8,}', r'pk-[A-Za-z0-9_-]{8,}',
                      r'bearer\s+\S+', r'-----BEGIN [A-Z ]*PRIVATE KEY-----')
          hits = [p for p in patterns if re.search(p, text, re.IGNORECASE)]
          if hits:
              print(f'[ERROR] activation report matched credential pattern(s): {hits}')
              sys.exit(1)
          report = json.loads(text)
          row = report['adapters']['browser_use']
          for claim in ('routing_authority', 'reasoning_authority',
                        'memory_authority', 'model_selection_authority'):
              assert row[claim] is False, f'browser_use claimed {claim}'
          assert row['enabled'] and row['state'] == 'enabled', row['reason']
          assert row['evidence'], 'browser_use enabled without evidence'
          assert report['stable_path_ok'], 'stable path broken after activation'
          print('BROWSER_ACTIVATION_CLEAN=PASS')
          for name in row['required']:
              print(f"  {name}={row['conditions'][name]}")
          PY
      - name: Upload browser activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-expansion-browser-activation
          path: AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-browser-activation.json
          if-no-files-found: warn
          retention-days: 30

  # One activation record for two interpreters.
  #
  # The evaluation and typed-contract lanes prove themselves in the validator
  # runtime; Browser Use can only prove itself where Chromium lives. Merging is
  # not a rubber stamp: a row may only carry `enabled: true` across if it proved
  # every gate it declared and carries evidence, and a broken stable path in
  # either runtime breaks the merge.
  brain-expansion-evidence:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [brain-expansion-activation, brain-expansion-browser-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: brain-expansion-activation
          path: evidence/validator
      - uses: actions/download-artifact@v4
        with:
          name: brain-expansion-browser-activation
          path: evidence/browser
      - name: Merge activation evidence and require every runtime adapter
        run: |
          python AI_SKILL_LIBRARY/v4/tools/merge_activation_reports.py \
            evidence/validator/brain-expansion-activation.json \
            evidence/browser/brain-expansion-browser-activation.json \
            --require langfuse ragas deepeval baml browser_use \
            --output AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-activation-merged.json
      - name: Upload merged activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brain-expansion-activation-merged
          path: AI_SKILL_LIBRARY/v4/runtime/generated/brain-expansion-activation-merged.json
          if-no-files-found: warn
          retention-days: 30
