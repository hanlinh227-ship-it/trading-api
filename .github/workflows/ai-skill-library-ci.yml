name: AI Skill Library CI

on:
  push:
    branches: [main, github-brain-v2, 'github-brain-v2-*', 'github-brain-v3-*', 'github-brain-v4-*', 'feature/skill-mandatory-fast-gateway']
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'cloudflare-worker/skill-gateway*.js'
      - 'cloudflare-worker/benchmark-skill-gateway.mjs'
      - 'cloudflare-worker/index.js'
      - 'cloudflare-worker/prepare-wrangler.mjs'
      - 'cloudflare-worker/package.json'
      - '.github/workflows/ai-skill-library-ci.yml'
      - '.github/workflows/skill-mandatory-fast-gateway-ci.yml'
      - '.github/workflows/skill-gateway-production.yml'
      - '.github/workflows/ai-brain-evergreen-*.yml'
      - '.github/workflows/ai-brain-v4-release.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'cloudflare-worker/skill-gateway*.js'
      - 'cloudflare-worker/benchmark-skill-gateway.mjs'
      - 'cloudflare-worker/index.js'
      - 'cloudflare-worker/prepare-wrangler.mjs'
      - 'cloudflare-worker/package.json'
      - '.github/workflows/ai-skill-library-ci.yml'
      - '.github/workflows/skill-mandatory-fast-gateway-ci.yml'
      - '.github/workflows/skill-gateway-production.yml'
      - '.github/workflows/ai-brain-evergreen-*.yml'
      - '.github/workflows/ai-brain-v4-release.yml'
      - 'AGENTS.md'
      - 'docs/checkpoints/**'
      - 'docs/superpowers/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Compile Python
        run: |
          python -m py_compile \
            AI_SKILL_LIBRARY/ingest_sources.py \
            AI_SKILL_LIBRARY/validate_registry.py \
            AI_SKILL_LIBRARY/validate_brain.py \
            AI_SKILL_LIBRARY/validate_router.py \
            AI_SKILL_LIBRARY/validate_authority.py \
            AI_SKILL_LIBRARY/validate_runtime.py \
            AI_SKILL_LIBRARY/validate_v3.py \
            AI_SKILL_LIBRARY/validate_v4.py \
            AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py \
            AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py
          python -m compileall -q AI_SKILL_LIBRARY/v4
      - name: Run integration tests
        run: python -m unittest discover -s AI_SKILL_LIBRARY/tests -v
      - name: Compile and validate exact-SHA hot skill snapshot
        run: |
          python AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py --source-sha "$GITHUB_SHA" --output AI_SKILL_LIBRARY/v4/runtime/generated/skill_gateway_snapshot.json
          python AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py AI_SKILL_LIBRARY/v4/runtime/generated/skill_gateway_snapshot.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          x=json.loads(Path('AI_SKILL_LIBRARY/v4/runtime/generated/skill_gateway_snapshot.json').read_text())
          assert x['source_sha']==os.environ['GITHUB_SHA'].lower()
          assert x['fallback_primary_skill']=='core_reasoning'
          assert x['profiles']['FAST']['max_supporting_skills']==0
          print('SKILL_GATEWAY_EXACT_SHA=PASS',x['source_sha'])
          PY
      - name: Validate source registry
        run: python AI_SKILL_LIBRARY/validate_registry.py
      - name: Validate routed brain compatibility
        run: python AI_SKILL_LIBRARY/validate_brain.py
      - name: Validate router and skill schemas
        run: python AI_SKILL_LIBRARY/validate_router.py
      - name: Validate project authority
        run: python AI_SKILL_LIBRARY/validate_authority.py
      - name: Validate legacy adaptive runtime compatibility
        run: python AI_SKILL_LIBRARY/validate_runtime.py
      - name: Validate legacy V3 compatibility
        run: python AI_SKILL_LIBRARY/validate_v3.py
      - name: Validate V4 LTS dual-plane
        run: python AI_SKILL_LIBRARY/validate_v4.py
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Verify no-network Worker routing, benchmark and real Wrangler bundle
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
          AI_BRIDGE_SERVICE_ID: '00000000-0000-4000-8000-000000000000'
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm run prepare:wrangler
          npm run check
          node benchmark-skill-gateway.mjs
          npx wrangler deploy --dry-run --outdir .wrangler-skill-gateway-ci
      - name: Validate ingest selection without cloning
        run: python AI_SKILL_LIBRARY/ingest_sources.py --all --dry-run --output /tmp/ai-skill-library.jsonl
      - name: Audit upstream repositories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python AI_SKILL_LIBRARY/validate_registry.py --check-remote
