name: Meme Alpha v3.02 Adaptive Cadence Autotune
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v302-adaptive-cadence-autotune.sh'
      - '.github/workflows/meme-alpha-v302-adaptive-cadence-autotune.yml'
  workflow_dispatch:

jobs:
  autotune:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Accelerate adaptive cadence with rollback
        run: bash ops/meme-alpha/v302-adaptive-cadence-autotune.sh
