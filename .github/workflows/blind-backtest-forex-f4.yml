name: Blind Backtest Forex F4

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/blind_backtest_forex_f4.py"
      - ".github/workflows/blind-backtest-forex-f4.yml"

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Forex F4 blind test
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          test -n "$TWELVEDATA_API_KEY" || (echo "TWELVEDATA_API_KEY missing" && exit 1)
          python scripts/blind_backtest_forex_f4.py

      - name: Commit result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_forex_f4.json
          git commit -m "Run Forex F4 forced blind validation" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
