name: Bybit Entry Diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect public Bybit scan and health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          echo '=== HEALTH ==='
          curl -fsS --max-time 30 "$BASE/bybit/health" | tee /tmp/health.json
          echo
          echo '=== SCAN ==='
          curl -fsS --max-time 120 "$BASE/bybit/scan" | tee /tmp/scan.json
          echo
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json'));
          const s=JSON.parse(fs.readFileSync('/tmp/scan.json'));
          console.log('DIAG='+JSON.stringify({revision:h.runtimeRevision,mode:h.mode,positions:h.positions?.openCount??h.live?.positions?.length??null,orders:h.openOrdersCount??h.live?.openOrdersCount??null,equity:h.account?.totalEquity??null,scanReason:s.reason??null,universe:s.universe?.count??null,rawCandidates:s.rawCandidates??null,qualified:s.qualified??null,best:s.best?{symbol:s.best.symbol,side:s.best.side,score:s.best.score,threshold:s.best.adaptiveThreshold,rr:s.best.rr,regime:s.best.regime,spread:s.best.spreadBps}:null,correlationRejected:(s.correlationRejected||[]).slice(0,5),errors:(s.errors||[]).slice(0,5)}));
          NODE
