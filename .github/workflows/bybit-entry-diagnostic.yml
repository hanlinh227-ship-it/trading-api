# Canonical Bybit entry + scale-band diagnostic. Version follows /runtime/contract.
name: Bybit Entry Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bybit-entry-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify effective-risk sizing and operational bands locally
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-worker
          node --input-type=module <<'NODE'
          import {sizeBybitAuto} from './bybit-scalp-engine.js';
          import {bybitAutoConfig} from './bybit-auto-config.js';
          const cfg=bybitAutoConfig({});
          const setup={entry:.4947,sl:.4901,tp:.5021,filters:{maxLeverage:100,minLeverage:1,maxQty:1e9,minQty:1,qtyStep:1,minNotional:5}};
          const x=sizeBybitAuto(setup,cfg,56.77);
          console.log('SCALE_RISK_TEST='+JSON.stringify(x));
          if(x.ok && Number(x.riskUsd)+1e-9<Number(x.ladderMinEffectiveRiskUsd)) throw Error('UNDER_SIZED_TRADE_ALLOWED');
          if(!x.ok && x.reason!=='EFFECTIVE_RISK_TOO_SMALL' && x.reason!=='STRUCTURE_REWARD_BELOW_LADDER_MIN' && x.reason!=='SIZED_RR_BELOW_MIN') throw Error('UNEXPECTED_RISK_REJECT_'+x.reason);
          const stepOf=e=>Number(sizeBybitAuto(setup,cfg,e).riskLadderStep);
          if(stepOf(50)!==0||stepOf(49.99)!==0||stepOf(40)!==-1||stepOf(39.99)!==-1||stepOf(60)!==1||stepOf(69.99)!==1||stepOf(70)!==2) throw Error('ASYMMETRIC_SCALE_STEP');
          if(Number(cfg.risk.maxMarginPerPositionPct)!==35||Number(cfg.risk.minFreeReservePct)!==22||Number(cfg.risk.maxPortfolioMarginPct)!==75||Number(cfg.risk.maxRiskPctOfEquity)!==6||Number(cfg.risk.maxTotalOpenRiskPct)!==15) throw Error('RISK_CONFIG_MISMATCH');
          if(Number(cfg.execution.cooldownSec)!==120||Number(cfg.execution.recvWindow)!==10000) throw Error('EXECUTION_CONFIG_MISMATCH');
          console.log('SCALE_STEP_SYMMETRY=PASS');
          console.log('EFFECTIVE_RISK_BAND=PASS');
          console.log('BYBIT_1_8_3_RISK_PROFILE=PASS');
          NODE
      - name: Inspect public Bybit contract, entry health, scan and health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 30 "$BASE/bybit/health" > /tmp/health.json
          curl -fsS --max-time 30 "$BASE/runtime/contract" > /tmp/contract.json
          curl -fsS --max-time 45 "$BASE/bybit/entry-health" > /tmp/entry.json
          CODE="$(curl -sS --max-time 300 -o /tmp/scan.json -w '%{http_code}' "$BASE/bybit/scan" || true)"
          [ "$CODE" = 200 ]
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json')),c=JSON.parse(fs.readFileSync('/tmp/contract.json')),e=JSON.parse(fs.readFileSync('/tmp/entry.json'));let s={};try{s=JSON.parse(fs.readFileSync('/tmp/scan.json'))}catch{}
          console.log('DIAG='+JSON.stringify({revision:h.runtimeRevision,version:c.autoVersion,entryStatus:e.status,entryReady:e.entryReady,lastCycleReason:e.lastCycleReason,operationalBlockers:e.operationalBlockers,mode:h.mode,executionReady:h.execution?.ready??null,privateTransport:h.privateTransport??null,marketTransport:h.marketTransport??null,equity:h.account?.totalEquity??null,scanOk:s.ok??null,scanVersion:s.version??null,universe:s.universe?.count??null,analyzed:s.analyzed??null,rawCandidates:s.rawCandidates??null,qualified:s.qualified??null,best:s.best?{symbol:s.best.symbol,side:s.best.side,score:s.best.score,threshold:s.best.adaptiveThreshold,rr:s.best.rr,regime:s.best.regime,spread:s.best.spreadBps}:null,errors:(s.errors||[]).slice(0,5)}));
          if(h.mode!=="LIVE"||h.execution?.ready!==true||h.privateTransport!=="VPS_BYBIT_PRIVATE_PROXY"||h.marketTransport!=="VPS_BYBIT_MARKET_PROXY")process.exit(7);
          if(!c.autoVersion||s.ok!==true||s.version!==c.autoVersion||!(Number(s.scannedAt)>0)||!Array.isArray(s.errors))process.exit(8);
          if(!e.ok||!['ENTRY_READY','ENTRY_BLOCKED','WAITING_FOR_QUALITY_SETUP'].includes(String(e.status)))process.exit(9);
          NODE
