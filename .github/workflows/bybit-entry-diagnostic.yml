# BYBIT-AUTO-1.6.3 post-deploy scanner + risk-band diagnostic
name: Bybit Entry Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/bybit-entry-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify effective-risk sizing locally
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-worker
          node --input-type=module <<'NODE'
          import {sizeBybitAuto} from './bybit-scalp-engine.js';
          import {bybitAutoConfig} from './bybit-auto-config.js';
          const cfg=bybitAutoConfig({});
          const setup={entry:.4947,sl:.4901,tp:.5021,filters:{maxLeverage:100,minLeverage:1,maxQty:1e9,minQty:1,qtyStep:1,minNotional:5}};
          const x=sizeBybitAuto(setup,cfg,56.77);
          console.log('SPX_STYLE_RISK_TEST='+JSON.stringify(x));
          if(x.ok && Number(x.riskUsd)+1e-9<Number(x.ladderMinEffectiveRiskUsd)) throw Error('UNDER_SIZED_TRADE_ALLOWED');
          if(!x.ok && x.reason!=='EFFECTIVE_RISK_TOO_SMALL' && x.reason!=='STRUCTURE_REWARD_BELOW_LADDER_MIN' && x.reason!=='SIZED_RR_BELOW_MIN') throw Error('UNEXPECTED_RISK_REJECT_'+x.reason);
          if(Number(cfg.risk.maxMarginPerPositionPct)!==40||Number(cfg.risk.minFreeReservePct)!==20||Number(cfg.risk.maxPortfolioMarginPct)!==80) throw Error('RISK_CONFIG_MISMATCH');
          console.log('EFFECTIVE_RISK_BAND=PASS');
          NODE
      - name: Inspect public Bybit scan and health
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          echo '=== HEALTH ==='
          curl -fsS --max-time 30 "$BASE/bybit/health" | tee /tmp/health.json
          echo
          echo '=== SCAN ==='
          CODE="$(curl -sS --max-time 300 -o /tmp/scan.json -w '%{http_code}' "$BASE/bybit/scan" || true)"
          echo "SCAN_HTTP=$CODE"
          [ "$CODE" = 200 ]
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json'));
          let s={};try{s=JSON.parse(fs.readFileSync('/tmp/scan.json'))}catch{}
          console.log('DIAG='+JSON.stringify({revision:h.runtimeRevision,mode:h.mode,executionReady:h.execution?.ready??null,privateTransport:h.privateTransport??null,marketTransport:h.marketTransport??null,positions:h.positions?.openCount??h.live?.positions?.length??null,positionItems:h.positions?.items??[],orders:h.openOrdersCount??h.live?.openOrdersCount??null,equity:h.account?.totalEquity??null,scanOk:s.ok??null,scanVersion:s.version??null,universe:s.universe?.count??null,analyzed:s.analyzed??null,rawCandidates:s.rawCandidates??null,qualified:s.qualified??null,best:s.best?{symbol:s.best.symbol,side:s.best.side,score:s.best.score,threshold:s.best.adaptiveThreshold,rr:s.best.rr,regime:s.best.regime,spread:s.best.spreadBps}:null,errors:(s.errors||[]).slice(0,5)}));
          if(h.mode!=="LIVE"||h.execution?.ready!==true||h.privateTransport!=="VPS_BYBIT_PRIVATE_PROXY"||h.marketTransport!=="VPS_BYBIT_MARKET_PROXY")process.exit(7);
          if(s.ok!==true||s.version!=="BYBIT-AUTO-1.6.3"||!(Number(s.scannedAt)>0)||!Array.isArray(s.errors)||s.errors.length>0)process.exit(8);
          NODE
