name: Offline Forex Daily Each Symbol V25 Rule Families
on:
  push:
    paths:
      - 'scripts/offline_forex_daily_each_symbol_v25_rulefamilies.py'
      - '.github/workflows/offline-forex-daily-each-symbol-v25-rulefamilies.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run independent deterministic rule families
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_daily_each_symbol_v25_rulefamilies.py
