name: Apply V77.8.0 Unified Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v7780_unified_hub.js'
      - '.github/workflows/apply-v7780-unified-hub.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply V77.8 migration
        run: node scripts/apply_v7780_unified_hub.js
      - name: Syntax check Worker
        run: node --check cloudflare-worker/index.js
      - name: Verify V77.8 Hub tokens
        run: |
          grep -q 'V77.8.0' cloudflare-worker/index.js
          grep -q 'cryptoDeepBundle' cloudflare-worker/index.js
          grep -q 'HUB TOP SETUPS' cloudflare-worker/index.js
          grep -q 'Exact exchange-native 5TF' cloudflare-worker/index.js
          grep -q 'EXECUTION_QUOTE_REQUIRED' cloudflare-worker/index.js
          grep -q 'NEWS_CONTEXT_REQUIRED' cloudflare-worker/index.js
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate test Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
      - name: Commit canonical Worker
        run: |
          if git diff --quiet -- cloudflare-worker/index.js; then
            echo 'No V77.8 migration changes required.'
            exit 0
          fi
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add cloudflare-worker/index.js
          git commit -m 'Upgrade production runtime to V77.8.0 Unified Hub'
          git push origin main
