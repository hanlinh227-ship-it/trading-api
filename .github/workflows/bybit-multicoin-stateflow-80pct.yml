name: MultiCoin Scalp ML RR 80pct OOS

on:
  push:
    branches:
      - research/bybit-multicoin-oos80-20260905
    paths:
      - 'research/bybit_multicoin_scalp_rr_v4.py'
      - 'research/bybit_multicoin_scalp_rr_v5.py'
      - 'research/bybit_multicoin_scalp_ml_v6.py'
      - 'research/bybit_multicoin_scalp_ml_v6_fast.py'
      - '.github/workflows/bybit-multicoin-stateflow-80pct.yml'
  workflow_dispatch:

concurrency:
  group: bybit-multicoin-scalp-rr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 18
      matrix:
        symbol:
          - BTCUSDT
          - ETHUSDT
          - BNBUSDT
          - XRPUSDT
          - SOLUSDT
          - TRXUSDT
          - DOGEUSDT
          - ADAUSDT
          - LINKUSDT
          - AVAXUSDT
          - LTCUSDT
          - BCHUSDT
          - XLMUSDT
          - DOTUSDT
          - NEARUSDT
          - UNIUSDT
          - AAVEUSDT
          - HBARUSDT
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install ML dependencies
        run: python3 -m pip install --disable-pip-version-check --quiet numpy scikit-learn
      - name: Run vectorized 5m scalp ML fixed-RR V6 calibration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          SYMBOL='${{ matrix.symbol }}'
          python3 research/bybit_multicoin_scalp_ml_v6_fast.py \
            --symbols "$SYMBOL" \
            --out "research/results/${SYMBOL}-v6.json" \
            2>&1 | tee "research/results/${SYMBOL}-v6.txt"
      - name: Upload V6 symbol report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bybit-${{ matrix.symbol }}-scalp-ml-v6
          path: |
            research/results/${{ matrix.symbol }}-v6.json
            research/results/${{ matrix.symbol }}-v6.txt
          retention-days: 30
