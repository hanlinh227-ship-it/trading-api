name: V14 Direction Grid
on:
  push:
    paths:
      - "scripts/v14_direction_grid.py"
      - ".github/workflows/v14-direction-grid.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/v14_direction_grid.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v14_direction_grid.json
          git commit -m "Run V14 direction grid" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
