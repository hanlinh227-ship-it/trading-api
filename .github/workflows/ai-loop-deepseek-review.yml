name: AI Loop DeepSeek Legacy Review

# Legacy diagnostic only.
# DeepSeek is the sole implementation writer in the active V2 orchestration.
# Therefore this workflow must never auto-review implementation PRs or contribute
# an acceptance signal for code DeepSeek authored. Codex + Claude are the two
# independent reviewers for the active loop.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to inspect manually'
        required: true
        type: string
      dry_run:
        description: 'Gather context only; do not call DeepSeek API'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ai-loop-deepseek-legacy-${{ inputs.pr_number }}
  cancel-in-progress: false

jobs:
  legacy-diagnostic:
    name: Legacy DeepSeek diagnostic (non-gating)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Explain non-gating status
        run: |
          echo 'DeepSeek is the active source implementer and cannot independently approve its own implementation.'
          echo 'This legacy workflow is manual, read-only and NON-GATING.'
          echo 'Canonical acceptance requires Codex + Claude on the exact implementation SHA.'
          echo 'PR requested: #${{ inputs.pr_number }}'
          echo 'dry_run: ${{ inputs.dry_run }}'
