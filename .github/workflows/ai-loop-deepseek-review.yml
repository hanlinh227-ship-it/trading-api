name: AI Loop DeepSeek Review

# ADVERSARIAL_REVIEWER stage of the bounded multi-AI engineering loop.
# See docs/ai-coengineer/AI_LOOP_CONTRACT.md.
#
# This workflow reviews only. It never merges, never deploys, and never modifies source.
# It deliberately does NOT trigger on pushes to main.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to review'
        required: true
        type: string
      dry_run:
        description: 'Gather context and validate wiring without calling the DeepSeek API'
        required: false
        default: false
        type: boolean

# Least privilege: read the code, write only PR conversation comments.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-loop-deepseek-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek adversarial review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Resolve target PR
        id: target
        env:
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr="${EVENT_PR:-$INPUT_PR}"
          if [ -z "$pr" ]; then
            echo "::error title=No PR::Could not resolve a pull request number."
            exit 1
          fi
          sha="$EVENT_SHA"
          # workflow_dispatch carries no pull_request payload, so EVENT_SHA is empty and
          # --expect-sha would be omitted, silently dropping the stale-head guard. Resolve
          # the head from the API instead so the guard is always armed.
          if [ -z "$sha" ]; then
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --jq .head.sha)"
          fi
          if [ -z "$sha" ]; then
            echo "::error title=No head SHA::Could not resolve the head SHA for PR #$pr; refusing to review without the stale-head guard."
            exit 1
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Reviewing PR #$pr at $sha"

      # Check out the BASE revision, never the PR head.
      #
      # The reviewer script is itself editable under the active lock, so running the PR
      # head's copy would let the change under review rewrite its own reviewer and post a
      # forged current-SHA ACCEPT carrying the expected marker under the Actions identity -
      # which the controller's bot-and-marker authentication would then admit.
      #
      # The reviewer does not need the PR worktree: it fetches the diff through `gh pr
      # diff`. So the trusted base copy reviews the untrusted head, and a change to the
      # reviewer only takes effect once a human has merged it.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify DeepSeek secret is present
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          # Existence check only. The value is never printed.
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "::error title=Missing secret::DEEPSEEK_API_KEY is not available to this job. Classification: MISSING_SECRET"
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is present (value not printed)."

      - name: Syntax check reviewer
        run: python -m py_compile scripts/ai/deepseek_reviewer.py

      - name: Run DeepSeek adversarial review
        id: review
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DEEPSEEK_TIMEOUT_SEC: '120'
        run: |
          set -o pipefail
          args="--pr ${{ steps.target.outputs.pr }} --repo ${{ github.repository }}"
          if [ -n "${{ steps.target.outputs.sha }}" ]; then
            args="$args --expect-sha ${{ steps.target.outputs.sha }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          python scripts/ai/deepseek_reviewer.py $args

      - name: Summarise verdict
        if: always()
        run: |
          verdict="${{ steps.review.outputs.verdict }}"
          sha="${{ steps.review.outputs.head_sha }}"
          {
            echo "### DeepSeek adversarial review"
            echo ""
            echo "- Verdict: \`${verdict:-UNKNOWN}\`"
            echo "- Reviewed SHA: \`${sha:-unknown}\`"
            echo "- Blockers: \`${{ steps.review.outputs.blocker_count || 'n/a' }}\`"
            echo ""
            echo "DeepSeek is a reviewer only. It cannot merge or deploy."
          } >> "$GITHUB_STEP_SUMMARY"
