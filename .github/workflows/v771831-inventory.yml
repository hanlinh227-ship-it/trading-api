name: V77.18.31 Index Cash Inventory
on:
  push:
    branches: [v771831-index-cash-migration]
    paths: ['.github/workflows/v771831-inventory.yml']
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find futures references
        run: |
          echo '=== FUTURES REFERENCES ==='
          grep -RniE 'future|FUTURE|MNQ|MES|MASSIVE|NQ|\bES\b' cloudflare-worker --exclude-dir=node_modules || true
# synchronize
