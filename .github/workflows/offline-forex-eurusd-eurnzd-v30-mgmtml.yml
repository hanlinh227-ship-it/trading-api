name: Offline Forex EURUSD EURNZD V30 MgmtML
on:
  push:
    paths:
      - 'scripts/offline_forex_eurusd_eurnzd_v30_mgmtml.py'
      - '.github/workflows/offline-forex-eurusd-eurnzd-v30-mgmtml.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pair: [EURUSD,EURNZD]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run price-only entry and H1 management ML
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_PAIR: ${{ matrix.pair }}
        run: python scripts/offline_forex_eurusd_eurnzd_v30_mgmtml.py
