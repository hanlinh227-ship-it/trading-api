name: Meme Alpha v3.39 Run Paper Controlflow Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v339-run-paper-controlflow-audit.sh'
      - '.github/workflows/meme-alpha-v339-run-paper-controlflow-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect live scan loop
        run: bash ops/meme-alpha/v339-run-paper-controlflow-audit.sh
