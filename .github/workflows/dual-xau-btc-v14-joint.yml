name: Dual XAU BTC V14 Joint

on:
  push:
    paths:
      - 'research/dual_xau_btc_v14_joint.py'
      - 'research/xau_random10_v13_precision_entry.py'
      - '.github/workflows/dual-xau-btc-v14-joint.yml'
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} V14 joint random10
        run: |
          mkdir -p research/results
          python3 research/dual_xau_btc_v14_joint.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_random10_v14_joint.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-random10-v14-joint-result
          path: research/results/${{ matrix.symbol }}_random10_v14_joint.txt
          retention-days: 30
