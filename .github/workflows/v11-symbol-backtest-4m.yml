name: V11 Four-Month Per-Symbol Backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v11_symbol_backtest_4m.py'
      - 'cloudflare-worker/v11/symbol-catalog.js'
      - 'cloudflare-worker/v11/generated-backtest-profiles.js'
      - '.github/workflows/v11-symbol-backtest-4m.yml'
  schedule:
    - cron: '37 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-symbol-backtest-4m
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      V11_REQUIRED_WR: '80'
      V11_MIN_TOTAL_TRADES: '40'
      V11_MIN_DEV_TRADES: '20'
      V11_MIN_VAL_TRADES: '8'
      V11_MIN_OOS_TRADES: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate backtest source
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_symbol_backtest_4m.py
          grep -q "ALLOWED_RR = (1.0, 2.0)" scripts/v11_symbol_backtest_4m.py
          grep -q "REQUIRED_WR" scripts/v11_symbol_backtest_4m.py
          grep -q "same-bar TP+SL is counted as SL" scripts/v11_symbol_backtest_4m.py

      - name: Skip once every symbol has independently passed
        id: gate
        run: |
          python - <<'PY'
          import json, os
          p='data/v11_backtest_gate.json'
          done=False
          if os.path.exists(p):
              try: done=bool(json.load(open(p,encoding='utf-8')).get('allPassed'))
              except Exception: pass
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('done='+('true' if done else 'false')+'\n')
          print('BACKTEST_ALREADY_ALL_PASS=',done)
          PY

      - name: Run full recent four-month backtest
        if: steps.gate.outputs.done != 'true'
        run: |
          set -euo pipefail
          test -n "${TWELVE_DATA_API_KEY:-}" || { echo TWELVE_DATA_API_KEY_MISSING; exit 2; }
          python scripts/v11_symbol_backtest_4m.py --days 122

      - name: Enforce result integrity
        if: steps.gate.outputs.done != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          r=json.load(open('data/v11_symbol_backtest_4m.json',encoding='utf-8'))
          g=json.load(open('data/v11_backtest_gate.json',encoding='utf-8'))
          meta=r['meta']; symbols=r['symbols']
          assert meta['requiredWinRate']==80
          assert meta['allowedRR']==[1,2]
          assert len(symbols)==meta['totalSymbols']
          for s,x in symbols.items():
              p=x.get('profile') or {}
              if p: assert p.get('rr') in (1.0,2.0), (s,p)
              if x.get('pass'):
                  assert x['full4m']['winRate']>=80, s
                  assert x['validation']['winRate']>=80, s
                  assert x['oos']['winRate']>=80, s
                  assert x['full4m']['trades']>=40, s
          assert g['allPassed']==all(bool(x.get('pass')) for x in symbols.values())
          js=open('cloudflare-worker/v11/generated-backtest-profiles.js',encoding='utf-8').read()
          assert 'V11_BACKTEST_META' in js and 'V11_BACKTEST_PROFILES' in js
          print({'allPassed':g['allPassed'],'passCount':g['passCount'],'totalSymbols':g['totalSymbols'],'failing':len(g['failingSymbols'])})
          PY

      - name: Queue 5-AI research for remaining failed symbols
        if: steps.gate.outputs.done != 'true'
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,datetime
          g=json.load(open('data/v11_backtest_gate.json',encoding='utf-8'))
          if g.get('allPassed'):
              raise SystemExit(0)
          fails=g.get('failingSymbols') or []
          task={
            'enabled':True,
            'task_id':'v11-backtest-improvement-'+datetime.datetime.now(datetime.timezone.utc).strftime('%Y%m%d-%H%M'),
            'task':'Fresh-read data/v11_symbol_backtest_4m.json and current V11 entry/runtime code. Research concrete per-symbol method improvements for every failing symbol. Each symbol must remain independently calibrated; do not pool performance across symbols. Allowed target RR is exactly 1:1 or 1:2. Optimize using DEV and VALIDATION evidence only; do not use OOS outcomes to tune parameters. Preserve no-lookahead, next-bar entry, same-bar SL-conservative rule and minimum sample sizes. Return implementation-ready changes grouped by symbol/family, prioritizing the largest failures. Do not unlock Telegram or claim success until every symbol independently has >=80% full-window, validation and untouched OOS win rate.',
            'context':{
              'result_file':'data/v11_symbol_backtest_4m.json',
              'failed_count':len(fails),
              'failed_symbols':fails,
              'required_wr':80,
              'rr_allowed':[1,2],
              'maintenance_lock':True
            }
          }
          json.dump(task,open('docs/ai-coengineer/AUTO_TASK.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          PY

      - name: Commit research state and calibrated profiles
        if: steps.gate.outputs.done != 'true'
        run: |
          set -euo pipefail
          git config user.name trading-backtest-bot
          git config user.email trading-backtest-bot@users.noreply.github.com
          git add data/v11_symbol_backtest_4m.json data/v11_backtest_gate.json cloudflare-worker/v11/generated-backtest-profiles.js docs/ai-coengineer/AUTO_TASK.json
          git diff --cached --quiet && exit 0
          git commit -m 'backtest: update V11 four-month per-symbol calibration'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload complete per-symbol evidence
        if: steps.gate.outputs.done != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: v11-symbol-backtest-4m-${{ github.run_id }}
          path: |
            data/v11_symbol_backtest_4m.json
            data/v11_backtest_gate.json
            cloudflare-worker/v11/generated-backtest-profiles.js
          retention-days: 14
