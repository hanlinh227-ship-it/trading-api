name: Offline Forex LeaveOneBlock V1

on:
  push:
    paths:
      - 'scripts/offline_forex_leaveoneblock_v1.py'
      - '.github/workflows/offline-forex-leaveoneblock-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-credit Forex leave-one-block CV
        run: python scripts/offline_forex_leaveoneblock_v1.py
