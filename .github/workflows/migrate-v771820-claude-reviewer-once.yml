name: Migrate V77.18.20 Claude Reviewer Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771820-claude-reviewer-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch canonical runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('cloudflare-worker/index.js')
          s=p.read_text()
          old='import {reviewHyroPositions} from "./hyro-position-review.js";'
          new=old+'\nimport {runClaudeReview,runClaudeAutoReview,getClaudeReviewerStatus,getClaudeReviewState} from "./claude-reviewer.js";\nimport {handleClaudeTelegram} from "./claude-telegram.js";'
          assert old in s and 'claude-reviewer.js' not in s
          s=s.replace(old,new,1)
          s=s.replace('const VERSION="V77.18.19",SERVICE="Trading V77.18.19 Single PROP Recovery";','const VERSION="V77.18.20",SERVICE="Trading V77.18.20 ChatGPT Primary + Claude Reviewer";',1)
          s=s.replace('const RELEASE_NAME="Single PROP Recovery";','const RELEASE_NAME="Claude Reviewer Integration";',1)
          oldhook='if(path==="/telegram/webhook"&&req.method==="POST"){const handled=await handlePropTelegram(req,env);if(handled)return handled;}'
          newhook='if(path==="/telegram/webhook"&&req.method==="POST"){const claudeHandled=await handleClaudeTelegram(req,env,{version:VERSION});if(claudeHandled)return claudeHandled;const handled=await handlePropTelegram(req,env);if(handled)return handled;}'
          assert oldhook in s
          s=s.replace(oldhook,newhook,1)
          s=s.replace('if(path==="/prop/hyro/accounts")return json({ok:true,version:VERSION,...await hyroMultiStatus(env)});','',1)
          health='if(path==="/health")return json({ok:true,version:VERSION,health:await getSystemHealth(env)});'
          add=health+'if(path==="/claude/status")return json({ok:true,version:VERSION,status:await getClaudeReviewerStatus(env)});if(path==="/claude/review/latest")return json({ok:true,version:VERSION,review:await getClaudeReviewState(env)});if(path==="/claude/review/run"){const r=await runClaudeReview(env,{version:VERSION,kind:"API_MANUAL_REVIEW",force:true,notify:false});return json(r,r.ok?200:503);}'
          assert health in s
          s=s.replace(health,add,1)
          s=s.replace('return json({...x,version:VERSION,service:SERVICE,hyroMulti:await hyroMultiStatus(env)},r.status);','return json({...x,version:VERSION,service:SERVICE,claudeReviewer:await getClaudeReviewerStatus(env)},r.status);',1)
          anchor='ctx.waitUntil(announceReleaseOnce(env,{version:VERSION,name:RELEASE_NAME,details:["PROP trở lại 1 tài khoản canonical","Sửa equity 0 và nhận diện vị thế Challenge","HOLD/TIGHTEN/CUT mỗi 5 phút"]}).catch(()=>{}));'
          repl='ctx.waitUntil(announceReleaseOnce(env,{version:VERSION,name:RELEASE_NAME,details:["ChatGPT là PRIMARY; Claude chỉ REVIEW","Claude tự review mỗi release và incident mới","Usage cap + cooldown; không có quyền trade/deploy"]}).catch(()=>{}));ctx.waitUntil(runClaudeAutoReview(env,{version:VERSION}).catch(()=>{}));'
          assert anchor in s
          s=s.replace(anchor,repl,1)
          assert 'hyroMultiStatus' not in s
          p.write_text(s)

          p=Path('cloudflare-worker/hub-v77171.js')
          s=p.read_text()
          old='[{text:"📊 Status",callback_data:"status"},{text:"📚 Orders",callback_data:"books"}]]};}'
          new='[{text:"📊 Status",callback_data:"status"},{text:"📚 Orders",callback_data:"books"}],[{text:"🧠 Claude Reviewer",callback_data:"claude:status"}]]};}'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('cloudflare-worker/system-health.js')
          s=p.read_text()
          anchor='if(!env.MASSIVE_API_KEY)add(issues,"WARN","MASSIVE_MISSING","Massive Futures key missing");'
          repl=anchor+'\n  if(!env.ANTHROPIC_API_KEY)add(issues,"WARN","CLAUDE_KEY_MISSING","Claude Reviewer API key missing");\n  else add(issues,"OK","CLAUDE_CONFIGURED","Claude Reviewer configured");'
          assert anchor in s
          s=s.replace(anchor,repl,1)
          p.write_text(s)
          PY
      - name: Update validator locks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/validate-cloudflare-v77.yml')
          s=p.read_text()
          s=s.replace("const health=read('cloudflare-worker/system-health.js');","const health=read('cloudflare-worker/system-health.js');\n          const claude=read('cloudflare-worker/claude-reviewer.js');\n          const claudeTg=read('cloudflare-worker/claude-telegram.js');")
          s=s.replace("for(const x of ['V77.18.19','Single PROP Recovery','propEnv(env)','prop:review','runSystemHealthAudit','announceReleaseOnce','/release'])if(!index.includes(x))throw new Error('Single PROP index lock missing: '+x);","for(const x of ['V77.18.20','Claude Reviewer Integration','propEnv(env)','prop:review','runSystemHealthAudit','announceReleaseOnce','runClaudeAutoReview','/claude/status','/claude/review/run'])if(!index.includes(x))throw new Error('V77.18.20 index lock missing: '+x);")
          s=s.replace("if(index.includes('hyro-multi-ui.js')||index.includes('runHyroMultiCron')||index.includes('handleHyroMultiTelegram'))throw new Error('Multi-account runtime must be removed');","if(index.includes('hyro-multi-ui.js')||index.includes('runHyroMultiCron')||index.includes('handleHyroMultiTelegram')||index.includes('hyroMultiStatus'))throw new Error('Multi-account runtime must be removed');")
          marker="if(health.includes('TK2')||health.includes('HYRO_B_BYBIT_API_KEY')||health.includes('hyroHubSnapshot'))throw new Error('TK2 health remnants present');"
          add=marker+"\n          for(const x of ['ANTHROPIC_API_KEY','CLAUDE_CONFIGURED'])if(!health.includes(x))throw new Error('Claude health lock missing: '+x);\n          for(const x of ['REVIEW-ONLY','runClaudeReview','runClaudeAutoReview','DAILY_LIMIT','COOLDOWN','claude-sonnet-4-20250514','trade:false','deploy:false'])if(!claude.includes(x))throw new Error('Claude reviewer lock missing: '+x);\n          for(const x of ['claude:status','claude:review','ChatGPT PRIMARY'])if(!claudeTg.includes(x))throw new Error('Claude Telegram lock missing: '+x);"
          assert marker in s
          s=s.replace(marker,add,1)
          s=s.replace("console.log('Canonical V77.18.19 single PROP recovery validation PASS');","console.log('Canonical V77.18.20 Claude reviewer validation PASS');")
          p.write_text(s)
          PY
      - name: Syntax check
        run: |
          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
      - name: Install dependencies and dry-run Worker
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: |
          npm install
          npm run prepare:wrangler
          npx wrangler deploy --dry-run
      - name: Commit migration
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js cloudflare-worker/hub-v77171.js cloudflare-worker/system-health.js .github/workflows/validate-cloudflare-v77.yml
          git commit -m "V77.18.20 integrate bounded Claude reviewer into runtime" || true
          git push
