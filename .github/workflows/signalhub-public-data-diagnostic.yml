name: SignalHub Public Data Diagnostic

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - '.github/workflows/signalhub-public-data-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe TradingView Forex scanner
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/tv.json <<'JSON'
          {"symbols":{"tickers":["OANDA:EURUSD","OANDA:USDJPY","OANDA:GBPUSD"],"query":{"types":[]}},"columns":["name","close","change","Recommend.All","Recommend.All|5","Recommend.All|15","Recommend.All|60","Recommend.All|240","RSI|15","MACD.macd|15","MACD.signal|15","EMA20|15","EMA50|15","EMA200|15","ATR|15"]}
          JSON
          curl --fail --silent --show-error --max-time 20 -o /tmp/tv.out -H 'content-type: application/json' --data-binary @/tmp/tv.json https://scanner.tradingview.com/forex/scan
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/tv.out',encoding='utf-8')); rows=p.get('data',[])
          print('TV_FOREX_ROWS',len(rows))
          for r in rows: print('TV_FOREX',r.get('s'),r.get('d'))
          assert len(rows)>=3
          PY

      - name: Probe TradingView metal and energy tickers
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/cfd.json <<'JSON'
          {"symbols":{"tickers":["OANDA:XAUUSD","OANDA:XAGUSD","TVC:GOLD","TVC:SILVER","FX:USOILSPOT","FXCM:USOIL","TVC:USOIL","CXM:USOIL","BLACKBULL:WTI","EASYMARKETS:OILUSD","FX:UKOIL","FXCM:UKOIL","TVC:UKOIL"],"query":{"types":[]}},"columns":["name","close","change","Recommend.All","Recommend.All|5","Recommend.All|15","Recommend.All|60","Recommend.All|240","RSI|15","MACD.macd|15","MACD.signal|15","EMA20|15","EMA50|15","EMA200|15","ATR|15"]}
          JSON
          curl --fail --silent --show-error --max-time 20 -o /tmp/cfd.out -H 'content-type: application/json' --data-binary @/tmp/cfd.json https://scanner.tradingview.com/cfd/scan
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/cfd.out',encoding='utf-8')); rows=p.get('data',[])
          print('TV_CFD_ROWS',len(rows))
          for r in rows: print('TV_CFD',r.get('s'),r.get('d'))
          assert any((r.get('s') or '').endswith('XAUUSD') for r in rows)
          PY
