name: Deploy Bybit BTC Live Bridge

on:
  push:
    branches: [main]
    paths:
      - 'bybit-live-bridge/**'
      - '.github/workflows/deploy-bybit-btc-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-btc-live-bridge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout current BTC-only main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Validate BTC-only bridge source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bybit-live-bridge/bybit_live_bridge.py bybit-live-bridge/bybit_event_driver.py
          test -f /etc/trading-v11-ai.env
          test -n "$(grep '^V11_AI_BRIDGE_SECRET=' /etc/trading-v11-ai.env | cut -d= -f2-)"
          ! grep -qi 'claude\|codex\|deepseek\|FOREX_CONNECTIVITY\|PROJECT_LANES' bybit-live-bridge/bybit_live_bridge.py bybit-live-bridge/bybit_event_driver.py
          grep -q '/bybit/private' bybit-live-bridge/bybit_live_bridge.py
          grep -q '/bybit/microstructure' bybit-live-bridge/bybit_live_bridge.py
          grep -q '/bybit/auto/run' bybit-live-bridge/bybit_event_driver.py
          grep -q 'EVENT_DRIVEN' bybit-live-bridge/bybit_event_driver.py
          grep -q 'BTCUSDT' bybit-live-bridge/bybit_event_driver.py
      - name: Ensure WebSocket dependency
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import websocket' 2>/dev/null; then
            python3 -c 'import websocket; print("WEBSOCKET_CLIENT_READY", getattr(websocket,"__version__","unknown"))'
            exit 0
          fi
          python3 -m pip install --disable-pip-version-check --break-system-packages websocket-client
          python3 -c 'import websocket; print("WEBSOCKET_CLIENT_INSTALLED", getattr(websocket,"__version__","unknown"))'
      - name: Install BTC private bridge and autonomous event driver
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 bybit-live-bridge/bybit_live_bridge.py /usr/local/bin/v11-manual-ai-bridge
          install -m 0755 bybit-live-bridge/bybit_event_driver.py /usr/local/bin/bybit-btc-event-driver
          cat >/etc/systemd/system/bybit-btc-event-driver.service <<'UNIT'
          [Unit]
          Description=Bybit BTCUSDT autonomous event-driven decision driver
          After=network-online.target v11-manual-ai-bridge.service
          Wants=network-online.target

          [Service]
          Type=simple
          EnvironmentFile=/etc/trading-v11-ai.env
          Environment=BYBIT_EVENT_DRIVER_ENABLED=true
          ExecStart=/usr/bin/python3 /usr/local/bin/bybit-btc-event-driver
          Restart=always
          RestartSec=1
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl restart v11-manual-ai-bridge.service
          systemctl enable --now bybit-btc-event-driver.service
          systemctl is-active --quiet v11-manual-ai-bridge.service
          systemctl is-active --quiet bybit-btc-event-driver.service
      - name: Verify private bridge microstructure and event driver
        shell: bash
        run: |
          set -euo pipefail
          set -a; source /etc/trading-v11-ai.env; set +a
          READY=0
          for i in $(seq 1 30); do
            HEALTH="$(curl -fsS --max-time 8 -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" http://127.0.0.1:8789/health || true)"
            curl -sS --max-time 8 -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" 'http://127.0.0.1:8789/bybit/microstructure?symbol=BTCUSDT' >/tmp/btc-micro.json || true
            if printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); m=d.get("microstructure") or {}; assert d.get("ok") is True; assert d.get("service")=="BYBIT_BTC_LIVE_BRIDGE"; assert d.get("privateProxy") is True; assert m.get("ready") is True; assert m.get("connected") is True' 2>/dev/null && python3 -c 'import json; d=json.load(open("/tmp/btc-micro.json")); x=d.get("data") or {}; assert d.get("ok") is True; assert x.get("symbol")=="BTCUSDT"; assert x.get("source")=="VPS_BYBIT_WS"; assert (x.get("book") or {}).get("bestBid",0)>0; assert (x.get("trades") or {}).get("updateTime",0)>0' 2>/dev/null; then
              READY=1
              break
            fi
            sleep 1
          done
          test "$READY" = 1
          python3 -c 'import json; d=json.load(open("/tmp/btc-micro.json")); x=d.get("data") or {}; t=x.get("trades") or {}; print("BTC_MICROSTRUCTURE_WS=PASS", "book", (x.get("book") or {}).get("updateTime"), "trades", t.get("updateTime"), "trades60", (t.get("window60s") or {}).get("trades"))'
          systemctl is-active --quiet bybit-btc-event-driver.service
          echo 'BTC_EVENT_DRIVER=ACTIVE'
      - name: Deployment summary
        run: |
          echo "BYBIT_BTC_BRIDGE_SOURCE_SHA=${GITHUB_SHA}"
          echo 'BYBIT_PRIVATE_API_PROXY=PRESERVED'
          echo 'BTC_MARKET_DATA=VPS_BYBIT_WS'
          echo 'BTC_DECISION_AUTHORITY=EVENT_DRIVEN_MARKET_STATE_CHANGE'
          echo 'STRATEGY_TIME_GATES=NONE'
          echo 'LEGACY_AI_FOREX_MEME=REMOVED'
