name: Deploy Bybit Multi-Asset Live Bridge
on:
  push:
    branches: [main]
    paths: ['bybit-live-bridge/**','.github/workflows/deploy-bybit-btc-bridge.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: bybit-multi-asset-live-bridge-production, cancel-in-progress: true}
jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Validate multi-asset VPS authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bybit-live-bridge/bybit_live_bridge.py
          test -f bybit-live-bridge/bybit_live_bridge.py
          ! grep -qi 'claude\|codex\|deepseek\|FOREX_CONNECTIVITY' bybit-live-bridge/bybit_live_bridge.py
          grep -q 'BYBIT_MULTI_SYMBOLS' bybit-live-bridge/bybit_live_bridge.py
          grep -q 'WORKER_WAKE_SEMAPHORE' bybit-live-bridge/bybit_live_bridge.py
          grep -q 'x-bybit-symbol' bybit-live-bridge/bybit_live_bridge.py
      - name: Ensure WebSocket dependency
        run: |
          python3 -c 'import websocket' 2>/dev/null || python3 -m pip install --disable-pip-version-check --break-system-packages websocket-client
      - name: Install bridge
        shell: bash
        run: |
          set -euo pipefail
          if sudo -n true 2>/dev/null; then
            sudo install -m 0755 bybit-live-bridge/bybit_live_bridge.py /usr/local/bin/v11-manual-ai-bridge
            sudo systemctl disable --now bybit-btc-event-driver.service 2>/dev/null || true
            sudo systemctl daemon-reload
            sudo systemctl restart v11-manual-ai-bridge.service
            sudo systemctl is-active --quiet v11-manual-ai-bridge.service
            echo "BYBIT_BRIDGE_LAUNCH=SYSTEMD"
          else
            mkdir -p "$HOME/.local/bin" "$HOME/.local/state/trading-api"
            install -m 0755 bybit-live-bridge/bybit_live_bridge.py "$HOME/.local/bin/v11-manual-ai-bridge"
            if [ -f "$HOME/.local/state/trading-api/bybit-bridge.pid" ]; then
              old_pid="$(cat "$HOME/.local/state/trading-api/bybit-bridge.pid" 2>/dev/null || true)"
              if [ -n "$old_pid" ] && kill -0 "$old_pid" 2>/dev/null; then kill "$old_pid" 2>/dev/null || true; fi
            fi
            export BYBIT_PRIVATE_PROXY_ONLY=true
            export BYBIT_VPS_BRIDGE_HOST="127.0.0.1"
            export BYBIT_VPS_BRIDGE_PORT="8789"
            RUNNER_TRACKING_ID="" nohup "$HOME/.local/bin/v11-manual-ai-bridge" >"$HOME/.local/state/trading-api/bybit-bridge.log" 2>&1 </dev/null &
            pid=$!
            echo "$pid" > "$HOME/.local/state/trading-api/bybit-bridge.pid"
            for i in $(seq 1 30); do
              if curl -fsS --max-time 3 "http://127.0.0.1:${BYBIT_VPS_BRIDGE_PORT}/health" >/tmp/bybit-bridge-health.json; then
                echo "BYBIT_BRIDGE_LAUNCH=USERSPACE pid=$pid"
                exit 0
              fi
              sleep 1
            done
            cat "$HOME/.local/state/trading-api/bybit-bridge.log" || true
            exit 1
          fi
      - name: Verify private proxy and Worker Demo health
        shell: bash
        run: |
          set -euo pipefail
          local_health="$(curl -fsS --max-time 8 http://127.0.0.1:8789/health)"
          printf '%s\n' "$local_health" | python3 -c "import json,sys;x=json.load(sys.stdin);assert x.get('ok') is True and x.get('privateProxyOnly') is True"
          for i in $(seq 1 45); do
            code="$(curl -sS --max-time 20 -o /tmp/bybit-health.json -w '%{http_code}' https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health || true)"
            if [ "$code" = "200" ] && python3 - <<'PY'
import json
x=json.load(open('/tmp/bybit-health.json'))
assert x.get('authenticated') is True
assert (x.get('execution') or {}).get('ready') is True
PY
            then
              echo BYBIT_DEMO_PRIVATE_PROXY_HEALTH=PASS
              exit 0
            fi
            sleep 2
          done
          cat /tmp/bybit-health.json || true
          cat "$HOME/.local/state/trading-api/bybit-bridge.log" || true
          exit 1
