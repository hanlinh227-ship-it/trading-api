name: V14 Dev Search
on:
  push:
    paths:
      - 'scripts/v14_dev_search.py'
      - '.github/workflows/v14-dev-search.yml'
  workflow_dispatch:
jobs:
  v14:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/v14_dev_search.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v14_dev_search.json
          git commit -m "Run V14 development search" || exit 0
          git pull --rebase origin main || true
          git push || true
