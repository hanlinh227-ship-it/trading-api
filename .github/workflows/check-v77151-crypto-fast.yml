name: Fast V77.15.1 Crypto Check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77151-crypto-fast.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Check production
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'; : > V77151_CRYPTO_FAST.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77151_CRYPTO_FAST.txt
          curl -fsS --max-time 45 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo "CRYPTO_CURL=$?" >> V77151_CRYPTO_FAST.txt
          node <<'NODE' >> V77151_CRYPTO_FAST.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};const s=j('/tmp/s.json'),c=j('/tmp/c.json');const n=x=>(c.analyses||[]).filter(a=>a.status===x).length;
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('CRYPTO='+(c.broadOk??'-')+'/'+(c.requested??'-')+' deep='+(c.deepOk??'-')+'/'+(c.deepRequested??'-'));
          console.log('ACTIONS=MARKET:'+n('MARKET')+',LIMIT:'+n('LIMIT')+',MARKET_PLAN:'+n('MARKET_PLAN')+',LIMIT_PLAN:'+n('LIMIT_PLAN')+',WATCH:'+n('WATCH'));
          console.log('RESULTS='+(c.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':E='+(a.entry??a.planned?.entry??'-')+':RR='+(a.targetRR??a.planned?.targetRR??'-')).join('|'));
          console.log('VERDICT='+((/^V77\.15\./.test(s.version||''))&&s.ok===true&&(c.broadOk||0)>=55&&(c.deepOk||0)>=3?'PASS':'FAIL'));
          NODE
      - name: Commit
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77151_CRYPTO_FAST.txt; git commit -m 'Report fast actionable Crypto production check' || exit 0; git push origin main
