name: Check Twelve Data Secret
on:
  push:
    paths:
      - "data/check_td_secret.txt"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check secret presence without exposing value
        env:
          TD_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        shell: bash
        run: |
          if [ -n "$TD_API_KEY" ]; then
            echo "TWELVE_DATA_API_KEY_PRESENT=true"
          else
            echo "TWELVE_DATA_API_KEY_PRESENT=false"
          fi
