name: V77.18.38 Repair Sync

on:
  push:
    branches: [v771838-repair-deploy-sync]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771838-repair-deploy-sync
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply repair patch
        run: python3 scripts/repair_v771838.py
      - name: Worker preflight
        working-directory: cloudflare-worker
        run: node validate-worker.mjs
      - name: Install pinned dependencies
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Generate safe Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: '0123456789abcdef0123456789abcdef'
        run: node prepare-wrangler.mjs
      - name: Wrangler bundle dry-run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run --outdir /tmp/v771838-dist
      - name: Canonical lock self-check
        run: |
          grep -q 'V77.16.18' cloudflare-worker/engine-v77168.js
          grep -q 'V77.18.38' cloudflare-worker/index.js
          grep -q 'HUB-R8-BALANCED' cloudflare-worker/hub-v77171.js
          grep -q 'MARKET_BALANCE_R5_BUDGET' cloudflare-worker/dual-ai-intervention.js
          grep -q 'max_tokens:1400' cloudflare-worker/dual-ai-intervention.js
          grep -q 'marketEntryBalanced:true' cloudflare-worker/adaptive-tuning.js
          grep -q 'V77.18.38 Repair + Deploy Sync validation PASS' .github/workflows/validate-cloudflare-v77.yml
      - name: Commit repaired production source
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/adaptive-tuning.js cloudflare-worker/engine-v77168.js cloudflare-worker/index.js cloudflare-worker/hub-v77171.js cloudflare-worker/dual-ai-intervention.js .github/workflows/validate-cloudflare-v77.yml
          if git diff --cached --quiet; then
            echo 'No production source changes to commit.'
            exit 0
          fi
          git commit -m 'V77.18.38 repair runtime, market balance and Claude budget'
          git push origin HEAD:v771838-repair-deploy-sync
