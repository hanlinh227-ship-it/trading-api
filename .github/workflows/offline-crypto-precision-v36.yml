name: Offline Crypto Precision V36
on:
  push:
    paths:
      - 'data/provider_snapshots/crypto_4h_feb_jul_2026.json'
      - 'scripts/offline_crypto_precision_evolver_v36.py'
      - '.github/workflows/offline-crypto-precision-v36.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependency
        run: pip install -q numpy scikit-learn
      - name: Run offline V36 across all 61 crypto symbols
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/offline_crypto_precision_evolver_v36.py
