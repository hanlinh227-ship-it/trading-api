name: Fetch Crypto 4H Snapshot Feb-Jul 2026
on:
  push:
    paths:
      - 'scripts/fetch_crypto_4h_snapshot_feb_jul_2026.py'
      - '.github/workflows/fetch-crypto-4h-snapshot-feb-jul-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch full 61-symbol 4H public snapshot
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_crypto_4h_snapshot_feb_jul_2026.py
      - name: Freeze snapshot in repository
        run: |
          git config user.name 'crypto-snapshot-bot'
          git config user.email 'crypto-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_4h_feb_jul_2026.json
          git commit -m 'Freeze 61-symbol crypto 4H Feb-Jul 2026 snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
