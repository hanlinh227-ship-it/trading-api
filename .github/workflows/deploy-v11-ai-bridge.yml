name: Deploy Unified 2AI Bridge

on:
  push:
    branches: [main]
    paths:
      - 'signal-v11-vps/manual_ai_bridge.py'
      - '.github/workflows/deploy-v11-ai-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unified-2ai-bridge-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Checkout exact main revision
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Validate canonical 2AI bridge source
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile signal-v11-vps/manual_ai_bridge.py
          test -f /etc/trading-v11-ai.env
          test -n "$(grep '^V11_AI_BRIDGE_SECRET=' /etc/trading-v11-ai.env | cut -d= -f2-)"
          command -v claude >/dev/null
          test -x /usr/bin/codex
          ! grep -qi 'api.deepseek.com\|DEEPSEEK_API_KEY' signal-v11-vps/manual_ai_bridge.py
          grep -q 'PROJECT_LANES_V1' signal-v11-vps/manual_ai_bridge.py
          grep -q 'PROVIDER_PROJECT_LANE_BUSY' signal-v11-vps/manual_ai_bridge.py
      - name: Install exact checked-out bridge
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 signal-v11-vps/manual_ai_bridge.py /usr/local/bin/v11-manual-ai-bridge
          systemctl daemon-reload
          systemctl restart v11-manual-ai-bridge.service
          systemctl is-active --quiet v11-manual-ai-bridge.service
      - name: Require configured Claude and Codex
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          set -a; source /etc/trading-v11-ai.env; set +a
          HEALTH="$(curl -fsS --max-time 8 -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" http://127.0.0.1:8789/health)"
          printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; print("BRIDGE_HEALTH="+str(d.get("healthState"))); print("PROVIDERS="+json.dumps({n:{"configured":(p.get(n) or {}).get("configured"),"state":(p.get(n) or {}).get("state"),"lastError":str((p.get(n) or {}).get("lastError") or "")[:300]} for n in ("claude","codex")})); assert d.get("deepseekDisabled") is True; assert d.get("service")=="UNIFIED_2AI_BRIDGE"; assert d.get("isolationMode")=="PROJECT_LANES_V1"; assert all(bool((p.get(n) or {}).get("configured")) for n in ("claude","codex")); assert d.get("healthState") in ("WARMING","READY")'
      - name: Real read-only 2AI council smoke with diagnostics
        shell: bash
        run: |
          set -euo pipefail
          set -a; source /etc/trading-v11-ai.env; set +a
          BODY='{"evidence":{"mode":"UNIFIED_2AI_CONNECTIVITY","task_id":"deploy-2ai-smoke","requestedProviders":["claude","codex"],"instruction":"Connectivity validation only. Acknowledge receipt. Do not trade and do not change configuration.","context":{"scope":"READ_ONLY"}}}'
          OUT="$(curl -sS --max-time 125 -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BODY")"
          printf '%s\n' "$OUT" >/tmp/unified-2ai-smoke.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/unified-2ai-smoke.json')); p=d.get('providers') or {}
          diag={n:{'status':str((p.get(n) or {}).get('status','MISSING')).upper(),'error':str((p.get(n) or {}).get('error') or '')[:500],'latencySeconds':(p.get(n) or {}).get('latencySeconds'),'project':(p.get(n) or {}).get('project')} for n in ('claude','codex')}
          print('UNIFIED_2AI_DIAGNOSTICS='+json.dumps(diag,ensure_ascii=False))
          assert all(diag[n]['status']=='OK' for n in diag),diag
          assert d.get('deepseekDisabled') is True
          assert d.get('isolationMode')=='PROJECT_LANES_V1'
          print('UNIFIED_2AI_QUORUM_PASS=2/2')
          PY
      - name: Concurrent Bybit Forex isolation smoke
        shell: bash
        run: |
          set -euo pipefail
          set -a; source /etc/trading-v11-ai.env; set +a
          BYBIT='{"evidence":{"mode":"BYBIT_CONNECTIVITY","task_id":"deploy-bybit-isolation","requestedProviders":["claude","codex"],"instruction":"Connectivity only. Return the required JSON. Do not trade.","context":{"scope":"READ_ONLY"}}}'
          FOREX='{"evidence":{"mode":"FOREX_CONNECTIVITY","task_id":"deploy-forex-isolation","requestedProviders":["claude","codex"],"instruction":"Connectivity only. Return the required JSON. Do not trade.","context":{"scope":"READ_ONLY"}}}'
          curl -sS --max-time 125 -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$BYBIT" >/tmp/bybit-lane.json & B=$!
          curl -sS --max-time 125 -X POST http://127.0.0.1:8789/review -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" -H 'Content-Type: application/json' --data "$FOREX" >/tmp/forex-lane.json & F=$!
          wait "$B"; wait "$F"
          python3 - <<'PY'
          import json
          for path,project in [('/tmp/bybit-lane.json','BYBIT'),('/tmp/forex-lane.json','FOREX')]:
              d=json.load(open(path)); p=d.get('providers') or {}
              diag={n:{'status':str((p.get(n) or {}).get('status','MISSING')).upper(),'error':str((p.get(n) or {}).get('error') or '')[:500],'latencySeconds':(p.get(n) or {}).get('latencySeconds')} for n in ('claude','codex')}
              print(project+'_LANE_DIAGNOSTICS='+json.dumps(diag,ensure_ascii=False))
              assert d.get('ok') is True,(project,diag)
              assert d.get('project')==project,(project,d.get('project'))
              assert d.get('isolationMode')=='PROJECT_LANES_V1'
              assert all(diag[n]['status']=='OK' for n in diag),(project,diag)
          print('BYBIT_FOREX_AI_LANE_ISOLATION=PASS')
          PY
      - name: Require post-smoke READY health
        shell: bash
        run: |
          set -euo pipefail
          set -a; source /etc/trading-v11-ai.env; set +a
          HEALTH="$(curl -fsS --max-time 8 -H "Authorization: Bearer $V11_AI_BRIDGE_SECRET" http://127.0.0.1:8789/health)"
          printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; print("FINAL_HEALTH="+json.dumps({"healthState":d.get("healthState"),"ready":d.get("ready"),"providers":{n:{"state":(p.get(n) or {}).get("state"),"fresh":(p.get(n) or {}).get("fresh"),"lastError":str((p.get(n) or {}).get("lastError") or "")[:300]} for n in ("claude","codex")}})); assert d.get("ready") is True,d; assert d.get("healthState")=="READY",d; assert d.get("onlineRecentCount")==2,d; assert all((p.get(n) or {}).get("state")=="ONLINE" and (p.get(n) or {}).get("fresh") is True for n in ("claude","codex")),p; print("UNIFIED_2AI_READY=PASS")'
      - name: Deployment summary
        run: |
          echo "UNIFIED_2AI_BRIDGE_SOURCE_SHA=${GITHUB_SHA}"
          echo 'UNIFIED_AI_CORE=claude,codex'
          echo 'UNIFIED_AI_REQUIRED_QUORUM=2/2'
          echo 'UNIFIED_AI_ISOLATION=PROJECT_LANES_V1'
          echo 'DEEPSEEK_DISABLED=true'
