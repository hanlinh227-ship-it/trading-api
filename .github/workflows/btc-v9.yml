name: BTC V9 High-Lot Regime Backtest
on:
  push:
    branches: [main]
    paths: ['research/mt5_progressive_tp_backtest_v9.py','.github/workflows/btc-v9.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 research/mt5_progressive_tp_backtest_v9.py
