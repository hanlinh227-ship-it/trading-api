name: Meme Alpha v3.38 Fast Signal Topology Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v338-fast-signal-topology-audit.sh'
      - '.github/workflows/meme-alpha-v338-fast-signal-topology-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect fast-signal refresh path
        run: bash ops/meme-alpha/v338-fast-signal-topology-audit.sh
