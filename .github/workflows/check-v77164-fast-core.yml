name: Fast V77.16.4 Core
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77164-fast-core.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Fast production core
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'; : > V77164_FAST_CORE.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77164_FAST_CORE.txt
          curl -fsS --max-time 70 "$BASE/run-now?group=future" -o /tmp/f.json; echo "FUTURE_CURL=$?" >> V77164_FAST_CORE.txt
          curl -fsS --max-time 15 "$BASE/analyze?symbol=MNQ" -o /tmp/m.json; echo "MNQ_CURL=$?" >> V77164_FAST_CORE.txt
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo "CRYPTO_CURL=$?" >> V77164_FAST_CORE.txt
          node <<'NODE' >> V77164_FAST_CORE.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};const s=j('/tmp/s.json'),f=j('/tmp/f.json'),m=j('/tmp/m.json'),c=j('/tmp/c.json'),act=a=>['MARKET','LIMIT','MARKET_PLAN','LIMIT_PLAN'].includes(a.status);let bad=[];for(const [g,r,floor] of [['future',f,1.5],['crypto',c,1.3]])for(const a of r.analyses||[])if(act(a)){const rr=Number((a.planned||a).targetRR);if(!Number.isFinite(rr)||rr<floor)bad.push(g+':'+a.symbol+':'+rr);if(g==='future'&&a.microSizing?.tradable===false)bad.push(g+':risk:'+a.symbol);}console.log('VERSION='+s.version);console.log('FUTURE='+(f.broadOk||0)+'/'+(f.requested||0)+' deep='+(f.deepOk||0)+'/'+(f.deepRequested||0)+' '+(f.analyses||[]).map(a=>a.symbol+':'+a.status+':'+((a.planned||a).targetRR??'-')).join('|'));console.log('MNQ='+m.ok+':'+m.status+':reuse='+m.freshScanReuse+':age='+m.scanAgeSec);console.log('CRYPTO='+(c.broadOk||0)+'/'+(c.requested||0)+' deep='+(c.deepOk||0)+'/'+(c.deepRequested||0)+' attempts='+(c.diagnostics?.deepAttempted||0)+' '+(c.analyses||[]).map(a=>a.symbol+':'+a.status+':'+((a.planned||a).targetRR??'-')).join('|'));console.log('BAD='+bad.join('|'));console.log('VERDICT='+(s.version==='V77.16.4'&&f.deepOk>=2&&c.deepOk>=3&&m.ok!==false&&m.freshScanReuse===true&&bad.length===0?'PASS':'FAIL'));
          NODE
      - name: Commit
        run: |
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77164_FAST_CORE.txt; git commit -m 'Report V77.16.4 fast core' || exit 0; git push origin main
