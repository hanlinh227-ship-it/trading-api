name: Temporary Scanner Policy Index Update

on:
  push:
    branches:
      - feature/multi-coin-a-plus-scanner-tdd

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/multi-coin-a-plus-scanner-tdd
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install generator dependency
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Register scanner policy in retrieval builder
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py')
          text = path.read_text(encoding='utf-8')
          target = '    ("AI_SKILL_LIBRARY/skills/registry/multi_coin_scanner_policy.yaml", "scanner_policy", "supporting", ["scanner", "trading", "multi_coin"]),\n'
          if target not in text:
              needle = '    ("AI_SKILL_LIBRARY/skills/registry/live_price_policy.yaml", "live_price_policy", "supporting", ["live_price", "trading"]),\n'
              if needle not in text:
                  raise SystemExit('live-price policy retrieval row not found')
              text = text.replace(needle, needle + target, 1)
              path.write_text(text, encoding='utf-8')
          PY
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --check --root .
          python -m unittest discover -s tests -p 'test_multi_coin_scanner_policy.py' -v
      - name: Commit source and generated metadata
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml; then
            echo 'scanner retrieval metadata already fresh'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git commit -m 'feat: index multi-coin scanner policy'
          git push origin HEAD:feature/multi-coin-a-plus-scanner-tdd
