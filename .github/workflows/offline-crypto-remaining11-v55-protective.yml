name: Offline Crypto Remaining11 V55 Protective
on:
  push:
    paths:
      - 'scripts/offline_crypto_remaining11_v55_protective_grid.py'
      - '.github/workflows/offline-crypto-remaining11-v55-protective.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        symbol: [DOT,FLOKI,INJ,LDO,LIT,ONDO,POL,S,TAO,WLD,XPL]
    steps:
      - uses: actions/checkout@v4
      - name: Run broader protective H1 grid
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_SYMBOL: ${{ matrix.symbol }}
        run: python scripts/offline_crypto_remaining11_v55_protective_grid.py
