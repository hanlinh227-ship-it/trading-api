name: Verify Fast V77.10.2 Markets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-fast-v77102-markets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify markets and Telegram plumbing
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77102_MARKETS_LIVE.txt
          curl -fsS --max-time 30 "$BASE/status" -o /tmp/status.json; echo "STATUS_CURL=$?" >> V77102_MARKETS_LIVE.txt
          curl -fsS --max-time 90 "$BASE/run-now?group=forex" -o /tmp/forex.json; echo "FOREX_CURL=$?" >> V77102_MARKETS_LIVE.txt
          sleep 4
          curl -fsS --max-time 60 "$BASE/run-now?group=metal" -o /tmp/metal.json; echo "METAL_CURL=$?" >> V77102_MARKETS_LIVE.txt
          curl -fsS --max-time 30 "$BASE/telegram/webhook-info" -o /tmp/webhook.json; echo "WEBHOOK_CURL=$?" >> V77102_MARKETS_LIVE.txt
          curl -fsS --max-time 30 "$BASE/books" -o /tmp/books.json; echo "BOOKS_CURL=$?" >> V77102_MARKETS_LIVE.txt
          node - <<'NODE' >> V77102_MARKETS_LIVE.txt 2>&1
          const fs=require('fs');const R=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json','utf8'))}catch(e){return {parseError:e.message}}};
          const s=R('status'),f=R('forex'),m=R('metal'),w=R('webhook'),b=R('books');
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('KV_OK='+(s.kv===true?'YES':'NO'));console.log('TG_OK='+(s.telegram===true?'YES':'NO'));
          console.log('FOREX_OK='+(f.ok===true?'YES':'NO'));console.log('FOREX_STATUS='+(f.status||'-'));console.log('FOREX='+(f.broadOk??'-')+'/'+(f.requested??'-')+' deep='+(f.deepOk??'-')+'/'+(f.deepRequested??'-'));console.log('FOREX_ERRORS='+(f.diagnostics?.broadErrors?.length??0));console.log('FOREX_ANALYSES='+(f.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.reason??'-')+':planned='+(a.planned?1:0)).join('|'));
          console.log('METAL_OK='+(m.ok===true?'YES':'NO'));console.log('METAL_STATUS='+(m.status||'-'));console.log('METAL='+(m.broadOk??'-')+'/'+(m.requested??'-')+' deep='+(m.deepOk??'-')+'/'+(m.deepRequested??'-'));console.log('METAL_ERRORS='+(m.diagnostics?.broadErrors?.length??0));console.log('METAL_ANALYSES='+(m.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.reason??'-')+':planned='+(a.planned?1:0)).join('|'));
          console.log('WEBHOOK_OK='+(w.ok===true?'YES':'NO'));console.log('WEBHOOK_URL='+(w.result?.url||'-'));console.log('WEBHOOK_PENDING='+(w.result?.pending_update_count??'-'));
          for(const g of ['forex','metal','crypto']){const x=b[g]||{};console.log('BOOK_'+g.toUpperCase()+'_EXEC='+((x.marketActive||[]).length)+'/'+((x.limitActive||[]).length)+'/'+((x.limitPending||[]).length)+':WATCH='+((x.watch||[]).length));}
          NODE
          if grep -q '^VERSION=V77.10.2$' V77102_MARKETS_LIVE.txt && grep -q 'STATUS_OK=YES' V77102_MARKETS_LIVE.txt && grep -q 'FOREX=28/28 deep=3/3' V77102_MARKETS_LIVE.txt && grep -q 'METAL=2/2 deep=2/2' V77102_MARKETS_LIVE.txt && grep -q 'WEBHOOK_OK=YES' V77102_MARKETS_LIVE.txt && grep -q 'BOOK_FOREX_EXEC=0/0/0' V77102_MARKETS_LIVE.txt && grep -q 'BOOK_METAL_EXEC=0/0/0' V77102_MARKETS_LIVE.txt; then echo 'VERDICT=PASS' >> V77102_MARKETS_LIVE.txt; else echo 'VERDICT=FAIL' >> V77102_MARKETS_LIVE.txt; fi
      - name: Commit report
        run: |
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V77102_MARKETS_LIVE.txt
          git commit -m 'Report fast V77.10.2 markets verification' || exit 0
          git push origin main
