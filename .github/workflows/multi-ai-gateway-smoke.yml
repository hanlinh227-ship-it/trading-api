name: Multi-AI Gateway Smoke (Legacy Disabled)

# Legacy workflow intentionally disabled.
# Canonical 3AI validation now lives in:
#   .github/workflows/deploy-v11-ai-bridge.yml
# and runs directly on the online self-hosted trading-vps runner.
# Keeping this file as workflow_dispatch-only avoids automatic workflow_run
# queue buildup while preserving an explicit diagnostic escape hatch.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: legacy-multi-ai-gateway-smoke-manual
  cancel-in-progress: true

jobs:
  legacy-notice:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 2
    steps:
      - name: Canonical path notice
        run: |
          echo 'LEGACY_MULTI_AI_GATEWAY_SMOKE=DISABLED'
          echo 'CANONICAL_3AI_DEPLOY=.github/workflows/deploy-v11-ai-bridge.yml'
          echo 'CANONICAL_RUNNER=trading-vps'
