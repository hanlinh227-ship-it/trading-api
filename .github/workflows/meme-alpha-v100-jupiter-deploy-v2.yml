name: Meme Alpha v1.0 Jupiter Deploy v2

on:
  push:
    paths:
      - 'ops/meme-alpha/v100-deploy-jupiter-v2.sh'
      - '.github/workflows/meme-alpha-v100-jupiter-deploy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-alpha-v100-jupiter-deploy-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Deploy fixed Jupiter size-specific PAPER execution
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v100-deploy-jupiter-v2.sh
          bash ops/meme-alpha/v100-deploy-jupiter-v2.sh
