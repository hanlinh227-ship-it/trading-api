name: Apply V77.14.3 Direct Context Parity
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77143_direct_context_parity.js'
      - '.github/workflows/apply-v77143-direct-context.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77143_DIAGNOSTIC.txt
          node --check scripts/apply_v77143_direct_context_parity.js >> V77143_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77143_DIAGNOSTIC.txt
          node scripts/apply_v77143_direct_context_parity.js >> V77143_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77143_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77143_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77143_DIAGNOSTIC.txt
          for t in 'V77.14.3' 'Twelve Data direct + 28-pair strength' 'Twelve Data direct + metal relative' 'futurePairContext(n,e,s)' 'analysisQuote' 'SMT '; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77143_DIAGNOSTIC.txt; else echo "$t=NO" >> V77143_DIAGNOSTIC.txt; fi; done
          exit 0
      - name: Promote
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77143_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77143_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77143_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77143_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.14.3 direct-symbol context parity' || exit 0
          git push origin main
