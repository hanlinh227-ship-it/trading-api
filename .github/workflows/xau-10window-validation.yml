name: XAU 10-Start Validation
on:
  push:
    branches: [main]
    paths:
      - 'research/xau_10window_validation.py'
      - '.github/workflows/xau-10window-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run XAU 10 starts
        run: |
          mkdir -p research/results
          python3 research/xau_10window_validation.py | tee research/results/xau_10window.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xau-10window-result
          path: research/results/xau_10window.txt
          retention-days: 30
