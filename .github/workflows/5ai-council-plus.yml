name: 5AI Council Plus

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task for Claude, Codex, DeepSeek, Qwen and OpenRouter"
        required: true
        type: string
      mode:
        description: "general | research | coding | writing | review | trading"
        required: false
        default: "general"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: 5ai-council-plus
  cancel-in-progress: false

jobs:
  five-ai:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolve Gateway and GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "CLOUDFLARE_API_TOKEN_MISSING"
            exit 2
          }

          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || {
            echo "CLOUDFLARE_ACCOUNT_ID_MISSING"
            exit 2
          }

          SUBDOMAIN="$(
            curl -fsS \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            | python3 -c '
          import sys,json
          d=json.load(sys.stdin)
          print((d.get("result") or {}).get("subdomain") or "")
          '
          )"

          test -n "$SUBDOMAIN" || {
            echo "CLOUDFLARE_WORKERS_SUBDOMAIN_MISSING"
            exit 2
          }

          GATEWAY_URL="https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review"

          echo "GATEWAY_URL=$GATEWAY_URL" >> "$GITHUB_ENV"

          OIDC="$(
            curl -fsS \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" \
            | python3 -c '
          import sys,json
          print(json.load(sys.stdin)["value"])
          '
          )"

          test -n "$OIDC" || {
            echo "GITHUB_OIDC_TOKEN_MISSING"
            exit 2
          }

          echo "::add-mask::$OIDC"
          echo "GATEWAY_OIDC=$OIDC" >> "$GITHUB_ENV"

          echo "GATEWAY_RESOLVED"
          echo "GITHUB_OIDC_READY"

      - name: Build 5AI request
        shell: bash
        env:
          TASK: ${{ inputs.task }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import time

          payload = {
              "task_id": f"plus-5ai-{int(time.time())}",
              "instruction": os.environ["TASK"],
              "context": {
                  "mode": os.environ.get("MODE", "general"),
                  "source": "chatgpt-plus-github-bridge",
                  "required_providers": [
                      "claude",
                      "codex",
                      "deepseek",
                      "qwen",
                      "openrouter"
                  ]
              }
          }

          with open(
              "/tmp/5ai-request.json",
              "w",
              encoding="utf-8"
          ) as f:
              json.dump(
                  payload,
                  f,
                  ensure_ascii=False,
                  indent=2
              )

          print("5AI_REQUEST_READY")
          print("MODE=" + os.environ.get("MODE", "general"))
          PY

      - name: Call all five AI
        shell: bash
        run: |
          set -euo pipefail

          test -n "${GATEWAY_URL:-}" || {
            echo "GATEWAY_URL_MISSING"
            exit 2
          }

          test -n "${GATEWAY_OIDC:-}" || {
            echo "GATEWAY_OIDC_MISSING"
            exit 2
          }

          HTTP_CODE="$(
            curl \
              -sS \
              --max-time 600 \
              -o /tmp/5ai-result.json \
              -w '%{http_code}' \
              -X POST "$GATEWAY_URL" \
              -H "Authorization: Bearer $GATEWAY_OIDC" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/5ai-request.json
          )"

          echo "HTTP=$HTTP_CODE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "GATEWAY_REQUEST_FAILED"

            python3 - <<'PY'
          import json

          try:
              with open(
                  "/tmp/5ai-result.json",
                  encoding="utf-8"
              ) as f:
                  d = json.load(f)

              print(
                  json.dumps(
                      {
                          "ok": d.get("ok"),
                          "error": d.get("error"),
                          "providers": {
                              k: (v or {}).get("status")
                              for k, v in
                              (d.get("providers") or {}).items()
                          }
                      },
                      ensure_ascii=False,
                      indent=2
                  )
              )

          except Exception as exc:
              print("FAILED_TO_PARSE_GATEWAY_RESPONSE")
              print(str(exc))
          PY

            exit 3
          fi

          echo "GATEWAY_REQUEST_OK"

      - name: Validate and print 5AI results
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys

          with open(
              "/tmp/5ai-result.json",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          providers = data.get("providers") or {}

          expected = [
              "claude",
              "codex",
              "deepseek",
              "qwen",
              "openrouter"
          ]

          print("")
          print("========================================")
          print("              5AI COUNCIL")
          print("========================================")

          bad = []

          for provider in expected:
              result = providers.get(provider) or {}

              status = str(
                  result.get("status", "MISSING")
              ).upper()

              print("")
              print("----- " + provider.upper() + " -----")
              print("STATUS=" + status)

              print(
                  json.dumps(
                      result,
                      ensure_ascii=False,
                      indent=2
                  )
              )

              if status != "OK":
                  bad.append(provider)

          print("")
          print("========================================")

          if bad:
              print(
                  "5AI_COUNCIL_FAIL="
                  + ",".join(bad)
              )
              sys.exit(1)

          print("CLAUDE=OK")
          print("CODEX=OK")
          print("DEEPSEEK=OK")
          print("QWEN=OK")
          print("OPENROUTER=OK")

          print("")
          print("5AI_COUNCIL_PASS=5/5")
          PY

      - name: Save result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 5ai-council-result
          path: |
            /tmp/5ai-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f \
            /tmp/5ai-request.json \
            /tmp/5ai-result.json
