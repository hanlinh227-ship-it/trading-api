name: Meme Alpha v3.06 Scanner Hotpath Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v306-scanner-hotpath-audit.sh'
      - '.github/workflows/meme-alpha-v306-scanner-hotpath-audit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - name: Inspect scanner hot path and live gate logic
        run: bash ops/meme-alpha/v306-scanner-hotpath-audit.sh
