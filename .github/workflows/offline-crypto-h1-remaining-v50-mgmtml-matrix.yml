name: Offline Crypto H1 Remaining V50 MgmtML Matrix
on:
  push:
    paths:
      - 'scripts/offline_crypto_h1_remaining_v50_mgmtml_matrix.py'
      - '.github/workflows/offline-crypto-h1-remaining-v50-mgmtml-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        symbol: [AAVE,ARB,AVAX,DOT,FLOKI,GRASS,INJ,LDO,LINK,LIT,ONDO,POL,S,SUI,TAO,WIF,WLD,XPL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Train own entry plus H1 management model
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_SYMBOL: ${{ matrix.symbol }}
        run: python scripts/offline_crypto_h1_remaining_v50_mgmtml_matrix.py
