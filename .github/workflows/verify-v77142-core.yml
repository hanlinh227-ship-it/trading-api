name: Verify V77.14.2 Core Production
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/index.js'
      - '.github/workflows/verify-v77142-core.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait deploy
        run: sleep 35
      - name: Core live checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77142_CORE_LIVE.txt
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77142_CORE_LIVE.txt
          curl -fsS --max-time 55 "$BASE/run-now?group=future" -o /tmp/f.json; echo "FUTURE_CURL=$?" >> V77142_CORE_LIVE.txt
          curl -fsS --max-time 75 "$BASE/run-now?group=crypto" -o /tmp/c.json; echo "CRYPTO_CURL=$?" >> V77142_CORE_LIVE.txt
          curl -fsS --max-time 20 "$BASE/orders" -o /tmp/o.json; echo "ORDERS_CURL=$?" >> V77142_CORE_LIVE.txt
          curl -fsS --max-time 20 "$BASE/telegram/menu" -o /tmp/t.json; echo "TELEGRAM_MENU_CURL=$?" >> V77142_CORE_LIVE.txt
          python - <<'PY' >> V77142_CORE_LIVE.txt
          import json
          def l(p):
            try:
              with open(p) as f:return json.load(f)
            except:return {}
          s,f,c,o,t=map(l,['/tmp/s.json','/tmp/f.json','/tmp/c.json','/tmp/o.json','/tmp/t.json'])
          print('VERSION='+str(s.get('version')))
          print('MASSIVE='+str(s.get('massive')))
          print('HUB_ORDER='+','.join((s.get('hub') or {}).get('order') or []))
          for name,x in [('FUTURE',f),('CRYPTO',c)]:
            print(name+'='+str(x.get('broadOk'))+'/'+str(x.get('requested'))+' deep='+str(x.get('deepOk'))+'/'+str(x.get('deepRequested')))
            arr=[]; plans=0; marketPlans=0; limitPlans=0; execs=0
            for a in x.get('analyses') or []:
              p=a.get('planned') or {}; mode=p.get('mode')
              if p: plans+=1
              if mode=='MARKET': marketPlans+=1
              if mode in ('LIMIT','INDICATIVE_LIMIT'): limitPlans+=1
              if a.get('status') in ('MARKET','LIMIT'): execs+=1
              g=p.get('geometry') or p.get('marketGeometry') or {}
              arr.append(str(a.get('symbol'))+':'+str(a.get('status'))+':'+str(a.get('reason'))+':'+str(mode)+':RR='+str(p.get('targetRR'))+':distATR='+str(g.get('distanceATR'))+':chaseATR='+str(g.get('chaseATR')))
            print(name+'_PLANS='+str(plans)+' marketPlan='+str(marketPlans)+' limitPlan='+str(limitPlans)+' exec='+str(execs))
            print(name+'_RESULTS='+'|'.join(arr))
          print('FUTURE_FRONT='+str((f.get('diagnostics') or {}).get('frontContracts')))
          print('TELEGRAM_MENU_OK='+str(t.get('ok')))
          print('DURABLE_WATCH_ZERO='+('YES' if all(len(((o.get(g) or {}).get('watch') or []))==0 for g in ['forex','crypto','metal','future']) else 'NO'))
          ok=(s.get('version')=='V77.14.2' and s.get('massive') is True and f.get('deepOk',0)>=4 and c.get('deepOk',0)>=3 and t.get('ok') is True)
          print('VERDICT='+('PASS' if ok else 'FAIL'))
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77142_CORE_LIVE.txt
          git commit -m 'Report V77.14.2 core production verification' || exit 0
          git push origin main
