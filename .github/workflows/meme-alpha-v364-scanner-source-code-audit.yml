name: Meme Alpha v3.64 Scanner Source Code Audit
on:
  workflow_dispatch:
  push:
    paths:
      - 'ops/meme-alpha/v364-scanner-source-code-audit.sh'
      - '.github/workflows/meme-alpha-v364-scanner-source-code-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Inspect live scanner source-health code
        run: bash ops/meme-alpha/v364-scanner-source-code-audit.sh
