name: V78-014 DecisionEvidence Shadow Migration

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78014-decision-evidence-shadow.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify stale-write guards and apply exact V78-014 fragments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare-worker/engine-v77168.js)" = "d3bac7f7efbec38c8514392f19f30caee4c12c6a"
          test "$(git hash-object cloudflare-worker/hyro-runtime.js)" = "c6160a5d30e64a0e6f892b51cae9be812e282549"
          python - <<'PY'
          from pathlib import Path
          def replace_once(path, old, new):
              p=Path(path); s=p.read_text()
              c=s.count(old)
              if c != 1: raise SystemExit(f'{path}: expected 1 occurrence, got {c}')
              p.write_text(s.replace(old,new,1))

          replace_once('cloudflare-worker/engine-v77168.js',
          'import {atrFromHLC} from "./providers/indicators.js";\n',
          'import {atrFromHLC} from "./providers/indicators.js";\nimport {buildSignalDecisionEvidence,recordSignalDecisionEvidence,getSignalDecisionEvidence} from "./providers/decision-evidence.js";\n')

          replace_once('cloudflare-worker/engine-v77168.js',
          '    const books=existingBooks,newItems=fillBooks(group,books,analyses,trigger);await saveBooks(env,books);for(const a of analyses)await recordShadowSetup(group,a,scanId,env);\n',
          '    const books=existingBooks,newItems=fillBooks(group,books,analyses,trigger);await saveBooks(env,books);for(const a of analyses)await recordShadowSetup(group,a,scanId,env);for(const a of analyses){try{await recordSignalDecisionEvidence(env,buildSignalDecisionEvidence(a,{runtimeVersion:CONFIG.version,scanId}));}catch{}}\n')

          replace_once('cloudflare-worker/engine-v77168.js',
          '      if(p==="/shadow"){const symbol=u.searchParams.get("symbol");return json({ok:true,rows:await getShadowSetups(env,symbol)});}\n',
          '      if(p==="/shadow"){const symbol=u.searchParams.get("symbol");return json({ok:true,rows:await getShadowSetups(env,symbol)});}\n      if(p==="/evidence/signal")return json({ok:true,schemaVersion:"V78-002",rows:await getSignalDecisionEvidence(env,Number(u.searchParams.get("limit")||20))});\n')

          replace_once('cloudflare-worker/hyro-runtime.js',
          'import {ensureDualAiIntervention} from "./dual-ai-intervention.js";\n\nconst RUNTIME_KEY="v7718:hyro:runtime";\nasync function put(env,v){if(env.TRADING_STATE)await env.TRADING_STATE.put(RUNTIME_KEY,JSON.stringify(v));}\nasync function done(env,base,extra={}){const out={...base,...extra,finishedAt:Date.now()};out.elapsedMs=out.finishedAt-base.startedAt;await put(env,out);return out;}\n',
          'import {ensureDualAiIntervention} from "./dual-ai-intervention.js";\nimport {buildHyroDecisionEvidence,recordHyroDecisionEvidence} from "./providers/decision-evidence.js";\n\nconst RUNTIME_KEY="v7718:hyro:runtime";\nasync function put(env,v){if(env.TRADING_STATE)await env.TRADING_STATE.put(RUNTIME_KEY,JSON.stringify(v));}\nasync function done(env,base,extra={}){const out={...base,...extra,finishedAt:Date.now()};out.elapsedMs=out.finishedAt-base.startedAt;await put(env,out);try{await recordHyroDecisionEvidence(env,buildHyroDecisionEvidence(out,{runtimeVersion:null}));}catch{}return out;}\n')
          PY
      - name: Validate V78-014 and persist actual output
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '$ node --check cloudflare-worker/providers/decision-evidence.js'
            node --check cloudflare-worker/providers/decision-evidence.js; echo 'exit=0'
            echo '$ node --check cloudflare-worker/engine-v77168.js'
            node --check cloudflare-worker/engine-v77168.js; echo 'exit=0'
            echo '$ node --check cloudflare-worker/hyro-runtime.js'
            node --check cloudflare-worker/hyro-runtime.js; echo 'exit=0'
            echo '$ grep signal evidence symbol references in engine'
            grep -c 'buildSignalDecisionEvidence\|recordSignalDecisionEvidence\|getSignalDecisionEvidence' cloudflare-worker/engine-v77168.js
            echo '$ grep Hyro evidence symbol references in runtime'
            grep -c 'buildHyroDecisionEvidence\|recordHyroDecisionEvidence' cloudflare-worker/hyro-runtime.js
            echo '$ grep evidence key literals in provider'
            grep -c 'v78014:evidence:signal\|v78014:evidence:hyro' cloudflare-worker/providers/decision-evidence.js
            echo '$ negative evidence-key check outside provider'
            if grep -rn 'v78014:evidence' cloudflare-worker/*.js cloudflare-worker/providers/*.js | grep -v 'providers/decision-evidence.js'; then echo 'UNEXPECTED_MATCH'; exit 1; else echo 'ZERO_MATCHES'; fi
            echo '$ existing Signal book/shadow token counts'
            grep -c 'recordShadowSetup\|fillBooks\|saveBooks' cloudflare-worker/engine-v77168.js
            echo '$ existing Hyro gate/execution token counts'
            grep -c 'acquireAiLease\|releaseAiLease\|executeHyroPlan\|evaluateHyroPortfolio\|rankHyroCandidates' cloudflare-worker/hyro-runtime.js
            echo '$ git diff --check'
            git diff --check; echo 'exit=0'
            echo 'V78-014_VALIDATION_PASS'
          } | tee docs/ai-coengineer/V78-014_VALIDATION.txt
      - name: Release lock in repository state
        shell: bash
        run: |
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-19
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-014 DecisionEvidence shadow-populate
          RESULT: IMPLEMENTED via guarded migration. Signal runGroup() and Hyro done() now append isolated V78-002 DecisionEvidence shadow records; /evidence/signal is additive read-only. No thresholds, gates, execution authority, risk, state continuity or existing response shapes intentionally changed.

          Protocol:
          - Acquire a new lock before the next source write.
          - Do not reset TRADING_STATE/v775:books.
          - Do not weaken risk/freshness/structural-SL/news safeguards.
          - Do not restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          EOF
      - name: Commit migration and evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hyro-runtime.js cloudflare-worker/providers/decision-evidence.js docs/ai-coengineer/V78-014_VALIDATION.txt docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-014 shadow-populate DecisionEvidence; zero behavior change'
          git push
