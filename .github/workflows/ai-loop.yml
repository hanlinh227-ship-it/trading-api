name: AI Closed Loop

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

env:
  CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]

concurrency:
  group: trading-ai-closed-loop
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[AI-TASK]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: AUTO-INTAKE boundary (validate + durable claim)
        id: intake
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The ONLY entry point into the implementation pipeline. Issue JSON is
          # never parsed inline here: AUTO-INTAKE performs scope, context_files,
          # validation-command, secret, numeric and authoritative-HEAD checks,
          # then durably claims the task before anything is written.
          python3 scripts/ai/auto_intake.py --issue "$ISSUE_NUMBER" | tee .ai-intake-result.json
          TASK_FILE="$(python3 - <<'PY'
          import json, sys
          summary = json.load(open('.ai-intake-result.json'))
          ready = [r for r in summary.get('results', []) if r.get('status') == 'READY']
          if summary.get('failed'):
              sys.exit('AUTO_INTAKE_REJECTED: ' + json.dumps(summary.get('failures')))
          if not ready:
              sys.exit('AUTO_INTAKE_NO_READY_TASK: ' + json.dumps(summary.get('results')))
          print(ready[0]['task_file'])
          PY
          )"
          test -f "$TASK_FILE" || { echo "AUTO_INTAKE_TASK_FILE_MISSING: $TASK_FILE"; exit 2; }
          echo "task_file=$TASK_FILE" >> "$GITHUB_OUTPUT"
          # argv, not env: TASK_FILE is shell-local here and would not be
          # visible to the child process via os.environ.
          TASK_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["task_id"])' "$TASK_FILE")"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Reject duplicate implementation PR
        shell: bash
        env:
          TASK_FILE: ${{ steps.intake.outputs.task_file }}
        run: |
          set -euo pipefail
          # argv, not env: TASK_FILE is shell-local here and would not be
          # visible to the child process via os.environ.
          TASK_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["task_id"])' "$TASK_FILE")"
          EXISTING="$(gh pr list --state open --search "${TASK_ID} in:title" --json number --jq '.[0].number // empty')"
          test -z "$EXISTING" || { echo "DUPLICATE_IMPLEMENTATION_PR: task $TASK_ID already has PR #$EXISTING"; exit 4; }

      - name: Enforce DeepSeek lock and secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'MISSING_DEEPSEEK_SECRET'; exit 2; }
          grep -Eq '^LOCKED:[[:space:]]*true[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md || { echo 'WRITE_LOCK_MISMATCH'; exit 2; }
          grep -Eq '^OWNER:[[:space:]]*DEEPSEEK[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md || { echo 'WRITE_LOCK_MISMATCH'; exit 2; }

      - name: DeepSeek implement + bounded repair + validation
        env:
          TASK_FILE: ${{ steps.intake.outputs.task_file }}
        run: python3 scripts/ai/deepseek_implementer.py "$TASK_FILE"

      - name: Require scoped implementation diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ai-intake-result.json
          git diff --quiet && { echo 'No implementation diff'; exit 3; } || true
          git diff --check
          git diff --stat

      - name: Push implementation branch
        id: push
        shell: bash
        env:
          TASK_ID_FROM_INTAKE: ${{ steps.intake.outputs.task_id }}
        run: |
          set -euo pipefail
          # task_id comes from the AUTO-INTAKE-validated task, never from a
          # second inline parse of untrusted issue text.
          TASK_ID="$TASK_ID_FROM_INTAKE"
          BRANCH="ai/deepseek-$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-')-${GITHUB_RUN_ID}"
          git config user.name 'DeepSeek Cloud Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "${TASK_ID}: DeepSeek validated implementation"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR and request independent reviews
        shell: bash
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          TASK_ID: ${{ steps.push.outputs.task_id }}
          IMPLEMENTATION_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TASK_ID - AI closed-loop implementation" --body "AI_LOOP_TASK_ISSUE: #$ISSUE_NUMBER
          AI_LOOP_ROUND: 1
          IMPLEMENTATION_SHA: $IMPLEMENTATION_SHA
          IMPLEMENTER: DEEPSEEK
          REQUIRES_CLAUDE: true
          STATUS: PARALLEL_DUAL_REVIEW_REQUIRED

          DeepSeek completed bounded implementation/validation. Codex and Claude must independently review the SAME implementation SHA. DeepSeek cannot approve its own implementation.")"
          PR_NUMBER="${PR_URL##*/}"
          gh pr comment "$PR_NUMBER" --body "@codex review

          Review current head $IMPLEMENTATION_SHA against the linked task acceptance criteria and repository safety invariants. Do not implement changes. Blocking findings must be concrete and tied to this head."
          gh pr comment "$PR_NUMBER" --body "CLAUDE_REVIEW_REQUEST
          CLAUDE_REVIEW_HEAD: $IMPLEMENTATION_SHA
          Claude watcher/Claude Code must independently review this exact head and post:

          CLAUDE_REVIEW_BEGIN
          CLAUDE_REVIEW_HEAD: $IMPLEMENTATION_SHA
          CLAUDE_VERDICT: ACCEPT|REJECT|BLOCKED
          CLAUDE_FINDINGS:
          <concise findings or NONE>
          CLAUDE_REVIEW_END

          Do not modify source while DeepSeek owns WRITE_LOCK."
          gh issue comment "$ISSUE_NUMBER" --body "DeepSeek PR opened: $PR_URL
          Status: PARALLEL_DUAL_REVIEW_REQUIRED
          Implementation SHA: $IMPLEMENTATION_SHA
          Required reviewers: CODEX + CLAUDE"

      - name: Report dispatch failure
        if: failure()
        shell: bash
        run: |
          if [ -n "${ISSUE_NUMBER:-}" ]; then
            gh issue comment "$ISSUE_NUMBER" --body "AI dispatch FAILED before implementation PR creation. Inspect Actions run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Failure classes include STALE_BASE_SHA, WRITE_LOCK_MISMATCH, MISSING_DEEPSEEK_SECRET, DUPLICATE_IMPLEMENTATION_PR, or IMPLEMENTER_VALIDATION_FAILED." || true
          fi

      - name: Cleanup dispatch temp files
        if: always()
        run: rm -f .ai-intake-result.json

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect AI-loop PRs and build consensus state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess
          repo=os.environ['GITHUB_REPOSITORY']; codex=os.environ.get('CODEX_BOT_LOGIN','chatgpt-codex-connector[bot]')
          def gh(*args, check=True):
              p=subprocess.run(['gh',*args],text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stderr or p.stdout)
              return p
          prs=json.loads(gh('pr','list','--state','open','--limit','50','--json','number,headRefName,headRefOid,body,url').stdout or '[]')
          rows=[p for p in prs if p.get('headRefName','').startswith('ai/deepseek-') and 'AI_LOOP_TASK_ISSUE:' in (p.get('body') or '')]
          pathlib.Path('.ai-loop-prs.json').write_text(json.dumps(rows))
          for pr in rows:
              n=str(pr['number']); head=pr['headRefOid']; body=pr.get('body') or ''
              im=re.search(r'AI_LOOP_TASK_ISSUE:\s*#(\d+)',body); rm=re.search(r'AI_LOOP_ROUND:\s*(\d+)',body)
              if not im: continue
              issue=im.group(1); round_no=int(rm.group(1)) if rm else 1
              issue_body=gh('issue','view',issue,'--json','body','--jq','.body').stdout
              tm=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',issue_body,re.S)
              if not tm: continue
              task=json.loads(tm.group(1)); task['requires_claude']=True

              inline=json.loads(gh('api',f'repos/{repo}/pulls/{n}/comments','--paginate').stdout or '[]')
              issue_comments=json.loads(gh('api',f'repos/{repo}/issues/{n}/comments','--paginate').stdout or '[]')
              reviews=json.loads(gh('api',f'repos/{repo}/pulls/{n}/reviews','--paginate').stdout or '[]')
              reactions=json.loads(gh('api',f'repos/{repo}/issues/{n}/reactions','-H','Accept: application/vnd.github+json').stdout or '[]')

              codex_blockers=[c.get('body','') for c in inline if (c.get('user') or {}).get('login')==codex and c.get('commit_id')==head and (c.get('body') or '').strip()]
              codex_plus=any((x.get('user') or {}).get('login')==codex and x.get('content')=='+1' for x in reactions)
              codex_reviewed=any((x.get('user') or {}).get('login')==codex and (x.get('commit_id') in (None,head)) for x in reviews)
              codex_verdict='REJECT' if codex_blockers else ('ACCEPT' if codex_plus else ('REVIEWED_PENDING_SIGNAL' if codex_reviewed else 'PENDING'))

              claude_verdict='PENDING'; claude_findings=''
              for c in reversed(issue_comments):
                  txt=c.get('body') or ''
                  if 'CLAUDE_REVIEW_BEGIN' not in txt or f'CLAUDE_REVIEW_HEAD: {head}' not in txt: continue
                  vm=re.search(r'CLAUDE_VERDICT:\s*(ACCEPT|REJECT|BLOCKED)',txt)
                  if not vm: continue
                  claude_verdict=vm.group(1)
                  fm=re.search(r'CLAUDE_FINDINGS:\s*(.*?)\s*CLAUDE_REVIEW_END',txt,re.S)
                  claude_findings=(fm.group(1).strip() if fm else '')[-24000:]
                  break

              print(f'PR {n} head={head} round={round_no} CODEX={codex_verdict} CLAUDE={claude_verdict}')
              if claude_verdict=='BLOCKED':
                  gh('issue','comment',issue,'--body',f'PR #{n}: Claude verdict BLOCKED at {head}. AI loop stops for diagnosis.',check=False)
                  continue

              required_ready=(codex_verdict in ('ACCEPT','REJECT')) and claude_verdict in ('ACCEPT','REJECT')
              if not required_ready: continue

              if codex_verdict=='ACCEPT' and claude_verdict=='ACCEPT':
                  gh('issue','comment',issue,'--body',f'PR #{n}: mandatory CODEX + CLAUDE consensus ACCEPT at {head}. Status: READY_FOR_FINAL_ACCEPT. No automatic merge/deploy.',check=False)
                  continue

              feedback=[]
              if codex_blockers:
                  feedback.append('CODEX FINDINGS:\n'+'\n\n'.join(codex_blockers)[-24000:])
              if claude_verdict=='REJECT':
                  feedback.append('CLAUDE FINDINGS:\n'+(claude_findings or 'Claude returned REJECT without detailed findings.'))
              pathlib.Path(f'.ai-feedback-{n}.txt').write_text('\n\n'.join(feedback)[-40000:])
          PY

      - name: Pin immutable control plane from origin/main
        id: control_plane
        shell: bash
        run: |
          set -euo pipefail
          # The repair loop checks out an untrusted PR worktree. The orchestration
          # and security-boundary executables must NOT come from that worktree,
          # or a PR could replace them and run its own code with GH_TOKEN and
          # DEEPSEEK_API_KEY present. Pin them from origin/main instead.
          CONTROL_PLANE="${RUNNER_TEMP:-/tmp}/ai-control-plane"
          rm -rf "$CONTROL_PLANE"
          mkdir -p "$CONTROL_PLANE"
          git fetch --no-tags --quiet origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          git archive "$MAIN_SHA" scripts/ai | tar -x -C "$CONTROL_PLANE"
          test -f "$CONTROL_PLANE/scripts/ai/auto_intake.py"
          test -f "$CONTROL_PLANE/scripts/ai/deepseek_implementer.py"
          chmod -R a-w "$CONTROL_PLANE/scripts"
          # The repair loop writes source and pushes, so it is a writer path and
          # must honour the exclusive-writer lock like every other writer.
          # Read the lock from origin/main: the loop later checks out a PR
          # branch, which must never be able to grant itself the lock.
          LOCK="$(git show "$MAIN_SHA:docs/ai-coengineer/WRITE_LOCK.md")"
          printf '%s' "$LOCK" | grep -Eq '^LOCKED:[[:space:]]*true[[:space:]]*$' \
            || { echo 'WRITE_LOCK_MISMATCH: not locked on main'; exit 2; }
          printf '%s' "$LOCK" | grep -Eq '^OWNER:[[:space:]]*DEEPSEEK[[:space:]]*$' \
            || { echo 'WRITE_LOCK_MISMATCH: owner is not DEEPSEEK on main'; exit 2; }
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'MISSING_DEEPSEEK_SECRET'; exit 2; }
          echo "WRITE_LOCK verified from origin/main."
          echo "dir=$CONTROL_PLANE" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "Control plane pinned at origin/main $MAIN_SHA"

      - name: Repair only after both required reviews are available
        shell: bash
        env:
          CONTROL_PLANE: ${{ steps.control_plane.outputs.dir }}
          CONTROL_PLANE_SHA: ${{ steps.control_plane.outputs.main_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          test -n "${CONTROL_PLANE:-}" || { echo 'CONTROL_PLANE_UNRESOLVED'; exit 2; }
          test -f "$CONTROL_PLANE/scripts/ai/auto_intake.py" || { echo 'CONTROL_PLANE_MISSING'; exit 2; }
          for FEEDBACK in .ai-feedback-*.txt; do
            PR="${FEEDBACK#.ai-feedback-}"; PR="${PR%.txt}"
            PR_JSON="$(gh pr view "$PR" --json headRefName,headRefOid,body)"
            BRANCH="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headRefName"])')"
            HEAD_SHA="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headRefOid"])')"
            BODY="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["body"])')"
            ISSUE="$(printf '%s' "$BODY" | sed -n 's/.*AI_LOOP_TASK_ISSUE:[[:space:]]*#\([0-9][0-9]*\).*/\1/p' | head -1)"
            ROUND="$(printf '%s' "$BODY" | sed -n 's/.*AI_LOOP_ROUND:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1)"
            ISSUE_BODY="$(gh issue view "$ISSUE" --json body --jq .body)"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            export ISSUE_BODY HEAD_SHA FEEDBACK ROUND
            python3 - <<'PY'
          import json,os,pathlib,re
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',os.environ['ISSUE_BODY'],re.S)
          if not m: raise SystemExit('task contract missing in linked issue')
          task=json.loads(m.group(1)); task['base_sha']=os.environ['HEAD_SHA']
          maxr=max(1,min(int(task.get('max_rounds',2)),4)); current=int(os.environ.get('ROUND','1'))
          if current>=maxr: raise SystemExit(f'MAX_ROUNDS_EXHAUSTED current={current} max={maxr}')
          task['review_feedback']=pathlib.Path(os.environ['FEEDBACK']).read_text()[-40000:]
          task['max_rounds']=1
          task['requires_claude']=True
          pathlib.Path('.ai-runtime-task.json').write_text(json.dumps(task,ensure_ascii=False,indent=2))
          PY
            # Same AUTO-INTAKE boundary on the repair path: the rebuilt task is
            # re-validated (scope, context_files, validators, secrets, numerics,
            # head binding) before DeepSeek is allowed to run again.
            # Executable comes from the main-pinned control plane; only the
            # repository it OPERATES ON is the untrusted PR worktree.
            AI_REPO_ROOT="$GITHUB_WORKSPACE" python3 \
              "$CONTROL_PLANE/scripts/ai/auto_intake.py" \
              --validate-task-file .ai-runtime-task.json --expect-head "$HEAD_SHA"
            AI_REPO_ROOT="$GITHUB_WORKSPACE" python3 \
              "$CONTROL_PLANE/scripts/ai/deepseek_implementer.py" .ai-runtime-task.json
            rm -f .ai-runtime-task.json "$FEEDBACK"
            git add -A
            git commit -m "AI loop: DeepSeek address dual review round $((ROUND+1))"
            git push origin "$BRANCH"
            NEW_SHA="$(git rev-parse HEAD)"
            NEW_BODY="$(printf '%s' "$BODY" | sed "s/AI_LOOP_ROUND:[[:space:]]*$ROUND/AI_LOOP_ROUND: $((ROUND+1))/" | sed "s/IMPLEMENTATION_SHA:[[:space:]]*[0-9a-f]*/IMPLEMENTATION_SHA: $NEW_SHA/")"
            gh pr edit "$PR" --body "$NEW_BODY"
            gh pr comment "$PR" --body "@codex review

          Re-review exact current head $NEW_SHA after DeepSeek addressed the aggregated Codex + Claude findings."
            gh pr comment "$PR" --body "CLAUDE_REVIEW_REQUEST
          CLAUDE_REVIEW_HEAD: $NEW_SHA
          Independently re-review this exact head and post a fresh CLAUDE_REVIEW_BEGIN/END verdict tied to $NEW_SHA."
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f .ai-loop-prs.json .ai-feedback-*.txt .ai-runtime-task.json
          chmod -R u+w "${RUNNER_TEMP:-/tmp}/ai-control-plane" 2>/dev/null || true
          rm -rf "${RUNNER_TEMP:-/tmp}/ai-control-plane" || true
