name: AI Closed Loop

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

env:
  CODEX_BOT_LOGIN: chatgpt-codex-connector[bot]

concurrency:
  group: trading-ai-closed-loop
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[AI-TASK]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Parse task contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, re, subprocess, sys
          body=os.environ.get('ISSUE_BODY','')
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',body,re.S)
          if not m: raise SystemExit('Missing AI_TASK_JSON_BEGIN/END contract')
          task=json.loads(m.group(1))
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          if task.get('base_sha')!=head:
              raise SystemExit(f"Stale task base_sha={task.get('base_sha')} current={head}")
          task.setdefault('max_rounds',2)
          task.setdefault('max_output_tokens',5000)
          task.setdefault('auto_merge',False)
          task.setdefault('requires_claude',False)
          pathlib.Path('.ai-runtime-task.json').write_text(json.dumps(task,ensure_ascii=False,indent=2))
          print('TASK_ID='+str(task.get('task_id')))
          PY

      - name: Enforce DeepSeek lock and secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY missing'; exit 2; }
          grep -Eq '^LOCKED:[[:space:]]*true[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md
          grep -Eq '^OWNER:[[:space:]]*DEEPSEEK[[:space:]]*$' docs/ai-coengineer/WRITE_LOCK.md

      - name: DeepSeek implement + bounded repair + validation
        run: python3 scripts/ai/deepseek_implementer.py .ai-runtime-task.json

      - name: Require scoped implementation diff
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ai-runtime-task.json
          git diff --quiet && { echo 'No implementation diff'; exit 3; } || true
          git diff --stat

      - name: Push implementation branch
        id: push
        shell: bash
        run: |
          set -euo pipefail
          TASK_ID="$(python3 - <<'PY'
          import json,re,os
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',os.environ['ISSUE_BODY'],re.S)
          print(json.loads(m.group(1))['task_id'])
          PY
          )"
          SAFE_TASK="$(printf '%s' "$TASK_ID" | tr -cs 'A-Za-z0-9._-' '-')"
          BRANCH="ai/deepseek-${SAFE_TASK}-${GITHUB_RUN_ID}"
          git config user.name 'DeepSeek Cloud Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "${TASK_ID}: DeepSeek validated implementation"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open PR and request Codex review
        id: pr
        shell: bash
        env:
          BRANCH: ${{ steps.push.outputs.branch }}
          TASK_ID: ${{ steps.push.outputs.task_id }}
          IMPLEMENTATION_SHA: ${{ steps.push.outputs.sha }}
        run: |
          set -euo pipefail
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$TASK_ID - AI closed-loop implementation" --body "AI_LOOP_TASK_ISSUE: #$ISSUE_NUMBER
          AI_LOOP_ROUND: 1
          IMPLEMENTATION_SHA: $IMPLEMENTATION_SHA
          IMPLEMENTER: DEEPSEEK
          STATUS: CODEX_REVIEW_REQUIRED

          DeepSeek completed bounded implementation/validation. Codex is the final automated reviewer. Claude Max remains an optional deep-optimizer gate because the Max web subscription is not a headless GitHub API worker.")"
          PR_NUMBER="${PR_URL##*/}"
          gh pr comment "$PR_NUMBER" --body "@codex review

          Review this PR against the linked AI task acceptance criteria and repository safety invariants. Focus on correctness, stale/current-price logic, protected risk/freshness/news/execution authority, scope violations, and regression risk. Do not implement changes yourself.

          If you find blocking issues, leave concrete review findings. If there are no blocking findings, use the normal Codex no-issues/👍 behavior."
          gh issue comment "$ISSUE_NUMBER" --body "DeepSeek implementation PR opened: $PR_URL
          Status: CODEX_REVIEW_REQUIRED
          Implementation SHA: $IMPLEMENTATION_SHA"
          echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

  monitor:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Inspect and advance AI-loop PRs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess, sys
          def gh(*args):
              p=subprocess.run(['gh',*args],text=True,capture_output=True)
              if p.returncode: raise RuntimeError(p.stderr or p.stdout)
              return p.stdout
          prs=json.loads(gh('pr','list','--state','open','--limit','50','--json','number,headRefName,headRefOid,body,url'))
          rows=[p for p in prs if p.get('headRefName','').startswith('ai/deepseek-') and 'AI_LOOP_TASK_ISSUE:' in (p.get('body') or '')]
          pathlib=''
          open('.ai-loop-prs.json','w').write(json.dumps(rows))
          print(f'AI loop open PRs: {len(rows)}')
          PY

      - name: Process Codex review state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess, pathlib, tempfile
          repo=os.environ['GITHUB_REPOSITORY']
          codex='chatgpt-codex-connector[bot]'
          prs=json.loads(pathlib.Path('.ai-loop-prs.json').read_text())
          def gh(*args, check=True):
              p=subprocess.run(['gh',*args],text=True,capture_output=True)
              if check and p.returncode: raise RuntimeError(p.stderr or p.stdout)
              return p
          for pr in prs:
              n=str(pr['number']); head=pr['headRefOid']; body=pr.get('body') or ''
              m=re.search(r'AI_LOOP_TASK_ISSUE:\s*#(\d+)',body)
              r=re.search(r'AI_LOOP_ROUND:\s*(\d+)',body)
              if not m: continue
              issue=m.group(1); round_no=int(r.group(1)) if r else 1
              reviews=json.loads(gh('api',f'repos/{repo}/pulls/{n}/reviews','--paginate').stdout or '[]')
              comments=json.loads(gh('api',f'repos/{repo}/pulls/{n}/comments','--paginate').stdout or '[]')
              codex_comments=[c for c in comments if (c.get('user') or {}).get('login')==codex and c.get('commit_id')==head]
              codex_reviews=[x for x in reviews if (x.get('user') or {}).get('login')==codex and (x.get('commit_id') in (None,head))]
              reactions=json.loads(gh('api',f'repos/{repo}/issues/{n}/reactions','-H','Accept: application/vnd.github+json').stdout or '[]')
              codex_plus=any((x.get('user') or {}).get('login')==codex and x.get('content')=='+1' for x in reactions)
              if codex_comments:
                  feedback='\n\n'.join((c.get('body') or '') for c in codex_comments)[-24000:]
                  pathlib.Path(f'.ai-feedback-{n}.txt').write_text(feedback)
                  print(f'PR {n}: CODEX_BLOCKERS comments={len(codex_comments)} round={round_no}')
              elif codex_plus:
                  print(f'PR {n}: CODEX_NO_BLOCKERS reaction=+1')
                  gh('issue','comment',issue,'--body',f'Codex review reports no blocking findings on PR #{n} at {head}. Status: READY_FOR_FINAL_ACCEPT_OR_AUTO_MERGE.',check=False)
              elif codex_reviews:
                  print(f'PR {n}: Codex review submitted; waiting for finding/no-issue signal')
              else:
                  print(f'PR {n}: waiting for Codex review')
          PY

      - name: Repair Codex-blocked PRs with DeepSeek
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for FEEDBACK in .ai-feedback-*.txt; do
            PR="${FEEDBACK#.ai-feedback-}"; PR="${PR%.txt}"
            PR_JSON="$(gh pr view "$PR" --json headRefName,headRefOid,body)"
            BRANCH="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headRefName"])')"
            HEAD_SHA="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headRefOid"])')"
            BODY="$(printf '%s' "$PR_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)["body"])')"
            ISSUE="$(printf '%s' "$BODY" | sed -n 's/.*AI_LOOP_TASK_ISSUE:[[:space:]]*#\([0-9][0-9]*\).*/\1/p' | head -1)"
            ROUND="$(printf '%s' "$BODY" | sed -n 's/.*AI_LOOP_ROUND:[[:space:]]*\([0-9][0-9]*\).*/\1/p' | head -1)"
            ISSUE_BODY="$(gh issue view "$ISSUE" --json body --jq .body)"
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            export ISSUE_BODY HEAD_SHA FEEDBACK ROUND
            python3 - <<'PY'
          import json,os,pathlib,re
          m=re.search(r'AI_TASK_JSON_BEGIN\s*(\{.*?\})\s*AI_TASK_JSON_END',os.environ['ISSUE_BODY'],re.S)
          if not m: raise SystemExit('task contract missing in linked issue')
          task=json.loads(m.group(1)); task['base_sha']=os.environ['HEAD_SHA']
          maxr=max(1,min(int(task.get('max_rounds',2)),4)); current=int(os.environ.get('ROUND','1'))
          if current>=maxr: raise SystemExit(f'MAX_ROUNDS_EXHAUSTED current={current} max={maxr}')
          task['review_feedback']=pathlib.Path(os.environ['FEEDBACK']).read_text()[-24000:]
          task['max_rounds']=1
          pathlib.Path('.ai-runtime-task.json').write_text(json.dumps(task,ensure_ascii=False,indent=2))
          PY
            python3 scripts/ai/deepseek_implementer.py .ai-runtime-task.json
            rm -f .ai-runtime-task.json "$FEEDBACK"
            git add -A
            git commit -m "AI loop: DeepSeek address Codex review round $((ROUND+1))"
            git push origin "$BRANCH"
            NEW_SHA="$(git rev-parse HEAD)"
            NEW_BODY="$(printf '%s' "$BODY" | sed "s/AI_LOOP_ROUND:[[:space:]]*$ROUND/AI_LOOP_ROUND: $((ROUND+1))/" | sed "s/IMPLEMENTATION_SHA:[[:space:]]*[0-9a-f]*/IMPLEMENTATION_SHA: $NEW_SHA/")"
            gh pr edit "$PR" --body "$NEW_BODY"
            gh pr comment "$PR" --body "@codex review

          Re-review current head $NEW_SHA after DeepSeek addressed the previous Codex findings. Apply the same safety and acceptance criteria."
          done

      - name: Cleanup
        if: always()
        run: rm -f .ai-loop-prs.json .ai-feedback-*.txt .ai-runtime-task.json
