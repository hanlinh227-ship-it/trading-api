name: Recover MT5 Forex The5ers Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-forex-recover-runtime.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 20
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: 'false'

    steps:
      - name: Lock to authorized VPS and PAPER
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "trading-vps"
          HOST="$(hostname)"
          FQDN="$(hostname -f 2>/dev/null || hostname)"
          [[ "$HOST" = "59670" || "$FQDN" = "59670.vpsvinahost.vn" ]]
          test -n "${MT5_ACCOUNT_LOGIN:-}"
          test -n "${MT5_ACCOUNT_PASSWORD:-}"
          test -n "${MT5_ACCOUNT_SERVER:-}"
          test -n "${MT5_BRIDGE_TOKEN:-}"
          sudo install -d -o root -g root -m 0755 /etc/trading
          printf '%s\n' 'VPS_ONLY=1' | sudo tee /etc/trading/mt5-forex-vps-only >/dev/null
          echo 'MT5_RECOVERY_SCOPE=VPS_ONLY'
          echo 'MT5_RECOVERY_MODE=PAPER'

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync canonical repository
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo mkdir -p /opt/trading
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main
          echo 'MT5_CANONICAL_SYNC=PASS'

      - name: Recover compiled EA into canonical MT5 directory
        shell: bash
        run: |
          set -euo pipefail
          APP_HOME=/var/lib/trading/mt5-forex
          PREFIX="$APP_HOME/wine"
          WINE=/opt/wine-stable/bin/wine
          WINEPATH=/opt/wine-stable/bin/winepath
          WINESERVER=/opt/wine-stable/bin/wineserver
          test -x "$WINE"
          VERSION="$($WINE --version)"
          MAJOR="$(printf '%s' "$VERSION" | sed -nE 's/.*wine-([0-9]+).*/\1/p' | head -n1)"
          test -n "$MAJOR" && [ "$MAJOR" -ge 10 ]

          TERMINAL="$(find "$PREFIX/drive_c" -maxdepth 8 -type f -iname terminal64.exe -print -quit)"
          test -n "$TERMINAL"
          MT5_DIR="$(dirname "$TERMINAL")"
          METAEDITOR="$(find "$MT5_DIR" -maxdepth 1 -type f -iname metaeditor64.exe -print -quit)"
          test -n "$METAEDITOR"

          sudo systemctl stop mt5-forex-bridge.service mt5-forex.service 2>/dev/null || true
          sudo pkill -u mt5forex -f 'terminal64.exe|MetaTrader|metaeditor|wineserver' 2>/dev/null || true
          sleep 2

          sudo install -d -o mt5forex -g mt5forex -m 0750 "$MT5_DIR/MQL5/Experts" "$MT5_DIR/MQL5/Presets" "$MT5_DIR/MQL5/Files/FOREX_BRIDGE" "$MT5_DIR/Config"
          sudo install -o mt5forex -g mt5forex -m 0640 /opt/trading/trading-api-main/mt5/ForexAutoThe5ers.mq5 "$MT5_DIR/MQL5/Experts/ForexAutoThe5ers.mq5"

          EA_DST="$MT5_DIR/MQL5/Experts/ForexAutoThe5ers.mq5"
          EA_EX5="$MT5_DIR/MQL5/Experts/ForexAutoThe5ers.ex5"
          LOG="$MT5_DIR/metaeditor-recovery.log"
          sudo rm -f "$EA_EX5" "$LOG"

          EA_WIN="$(sudo -u mt5forex env HOME="$APP_HOME" WINEPREFIX="$PREFIX" WINEARCH=win64 WINEDEBUG=-all "$WINEPATH" -w "$EA_DST")"
          LOG_WIN="$(sudo -u mt5forex env HOME="$APP_HOME" WINEPREFIX="$PREFIX" WINEARCH=win64 WINEDEBUG=-all "$WINEPATH" -w "$LOG")"

          set +e
          sudo -u mt5forex env HOME="$APP_HOME" WINEPREFIX="$PREFIX" WINEARCH=win64 WINEDEBUG=-all \
            timeout 240 xvfb-run -a -s '-screen 0 1280x1024x24' "$WINE" "$METAEDITOR" "/compile:$EA_WIN" "/log:$LOG_WIN" >/tmp/mt5-recovery-compile.log 2>&1
          RC=$?
          set -e
          sudo -u mt5forex env HOME="$APP_HOME" WINEPREFIX="$PREFIX" "$WINESERVER" -k >/dev/null 2>&1 || true
          echo "MT5_RECOVERY_METAEDITOR_EXIT=$RC"

          if [ ! -f "$EA_EX5" ]; then
            FOUND="$(find "$PREFIX/drive_c" -type f -iname ForexAutoThe5ers.ex5 -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -n1 | cut -d' ' -f2- || true)"
            if [ -n "$FOUND" ] && [ -f "$FOUND" ]; then
              sudo install -o mt5forex -g mt5forex -m 0640 "$FOUND" "$EA_EX5"
              echo "MT5_RECOVERY_EX5_SOURCE=$FOUND"
            fi
          fi

          if [ ! -f "$EA_EX5" ]; then
            echo 'ERROR: compiled EX5 still not found' >&2
            iconv -f UTF-16LE -t UTF-8 "$LOG" 2>/dev/null | tail -120 >&2 || tail -120 "$LOG" >&2 || true
            find "$PREFIX/drive_c" -type f -iname '*ForexAutoThe5ers*' -print >&2 || true
            exit 41
          fi

          sudo tee "$APP_HOME/runtime.env" >/dev/null <<EOF
          MT5_WINEPREFIX=$PREFIX
          MT5_TERMINAL=$TERMINAL
          MT5_INSTALL_DIR=$MT5_DIR
          MT5_WINE_BIN=$WINE
          MT5_WINESERVER_BIN=$WINESERVER
          MT5_WINEPATH_BIN=$WINEPATH
          MT5_WINE_STACK=WINEHQ_STABLE_RECOVERED
          MT5_WINE_VERSION=$VERSION
          EOF
          sudo chown mt5forex:mt5forex "$APP_HOME/runtime.env"
          sudo chmod 0640 "$APP_HOME/runtime.env"
          sudo ln -sfn "$MT5_DIR" /opt/trading/mt5-forex-terminal
          echo 'MT5_RECOVERY_EA_COMPILE=PASS'
          echo "MT5_RECOVERY_WINE=$VERSION"
          echo "MT5_RECOVERY_TERMINAL=$TERMINAL"

      - name: Install protected The5ers PAPER configuration
        shell: bash
        run: |
          set -euo pipefail
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          umask 077
          {
            printf 'MT5_ACCOUNT_LOGIN=%q\n' "$MT5_ACCOUNT_LOGIN"
            printf 'MT5_ACCOUNT_PASSWORD=%q\n' "$MT5_ACCOUNT_PASSWORD"
            printf 'MT5_ACCOUNT_SERVER=%q\n' "$MT5_ACCOUNT_SERVER"
            printf 'MT5_HUB_URL=%q\n' "$HUB"
            printf 'MT5_BRIDGE_TOKEN=%q\n' "$MT5_BRIDGE_TOKEN"
            printf 'MT5_ALLOW_LIVE=false\n'
          } > "$tmp"
          sudo install -o root -g mt5forex -m 0640 "$tmp" /etc/trading/mt5-forex.env
          echo 'MT5_THE5ERS_CONFIG=PASS'
          echo 'MT5_LIVE=OFF_SAFE'

      - name: Start MT5 and local bridge
        shell: bash
        run: |
          set -euo pipefail
          sudo chmod +x /opt/trading/trading-api-main/vps/mt5-forex/run-mt5-forex.sh
          sudo chmod +x /opt/trading/trading-api-main/vps/mt5-forex/forex-mt5-sidecar.py
          sudo chmod +x /opt/trading/trading-api-main/vps/mt5-forex/verify-hub-pulse.py
          sudo install -m 0644 /opt/trading/trading-api-main/vps/mt5-forex/mt5-forex.service /etc/systemd/system/mt5-forex.service
          sudo install -m 0644 /opt/trading/trading-api-main/vps/mt5-forex/mt5-forex-bridge.service /etc/systemd/system/mt5-forex-bridge.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mt5-forex.service mt5-forex-bridge.service || true
          sudo systemctl enable mt5-forex.service mt5-forex-bridge.service
          sudo systemctl restart mt5-forex.service
          for i in $(seq 1 30); do sudo systemctl is-active --quiet mt5-forex.service && break; sleep 2; done
          sudo systemctl is-active --quiet mt5-forex.service || { sudo journalctl -u mt5-forex.service -n 180 --no-pager; exit 42; }
          sudo systemctl restart mt5-forex-bridge.service
          for i in $(seq 1 20); do sudo systemctl is-active --quiet mt5-forex-bridge.service && break; sleep 1; done
          sudo systemctl is-active --quiet mt5-forex-bridge.service || { sudo journalctl -u mt5-forex-bridge.service -n 180 --no-pager; exit 43; }
          sleep 10
          pgrep -a -u mt5forex -f 'terminal64.exe|MetaTrader' >/dev/null
          ! pgrep -a -u root -f 'terminal64.exe|MetaTrader' >/dev/null
          echo 'MT5_THE5ERS_TERMINAL_PROCESS=PASS'
          echo 'MT5_LOCAL_BRIDGE=PASS'

      - name: Verify fresh The5ers account pulse
        shell: bash
        run: |
          set -euo pipefail
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          BODY="$(mktemp)"
          trap 'rm -f "$BODY"' EXIT
          PASS=false
          for i in $(seq 1 40); do
            CODE="$(curl -sS --connect-timeout 5 --max-time 20 -o "$BODY" -w '%{http_code}' "$HUB/forex/health" || true)"
            if [ "$CODE" = 200 ] && MT5_ACCOUNT_LOGIN="$MT5_ACCOUNT_LOGIN" python3 /opt/trading/trading-api-main/vps/mt5-forex/verify-hub-pulse.py "$BODY"; then
              PASS=true
              break
            fi
            echo "Waiting for The5ers MT5 pulse attempt=$i http=$CODE"
            sleep 5
          done
          if [ "$PASS" != true ]; then
            echo 'ERROR: no fresh connected The5ers broker pulse' >&2
            sudo systemctl status mt5-forex.service mt5-forex-bridge.service --no-pager -l || true
            sudo journalctl -u mt5-forex.service -u mt5-forex-bridge.service -n 260 --no-pager || true
            sudo cat /var/lib/trading/mt5-forex/bridge-health.json 2>/dev/null || true
            exit 44
          fi
          echo 'MT5_THE5ERS_CONNECTED=PASS'
          echo 'MT5_ACCOUNT_LOGIN_MATCH=PASS'
          echo 'MT5_BALANCE_EQUITY=PASS'
          echo 'MT5_PULSE_FRESH=PASS'
          echo 'MT5_AUTO_TRADE_PREP=PAPER_READY'
          echo 'MT5_LIVE=OFF_SAFE'
