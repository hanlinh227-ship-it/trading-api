name: Fetch Crypto Missing5 4H 2025
on:
  push:
    paths:
      - 'scripts/fetch_crypto_missing5_4h_2025.py'
      - '.github/workflows/fetch-crypto-missing5-4h-2025.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch missing 2025 histories
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_crypto_missing5_4h_2025.py
      - name: Freeze snapshot
        run: |
          git config user.name 'crypto-missing5-bot'
          git config user.email 'crypto-missing5-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_missing5_4h_2025.json
          git commit -m 'Freeze missing crypto 2025 history snapshot' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
