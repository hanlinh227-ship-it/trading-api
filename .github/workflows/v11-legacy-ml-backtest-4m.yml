name: V11 Legacy-Learned ML Four-Month Backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v11_backtest_legacy_ml_4m.py'
      - '.github/workflows/v11-legacy-ml-backtest-4m.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-legacy-ml-backtest-4m
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      V11_BT_DAYS: '122'
      V11_HISTORY_DAYS: '330'
      V11_REQUIRED_WR: '80'
      V11_MIN_TOTAL_TRADES: '60'
      V11_MIN_TUNE_DAYS: '18'
      V11_OPT_WORKERS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q numpy scikit-learn

      - name: Validate legacy-learned runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_backtest_legacy_ml_4m.py
          grep -q 'ALLOWED_RR = (1.0, 2.0)' scripts/v11_backtest_legacy_ml_4m.py
          grep -q 'MAXTRADES = (1, 2, 3)' scripts/v11_backtest_legacy_ml_4m.py
          grep -q 'HistGradientBoostingClassifier' scripts/v11_backtest_legacy_ml_4m.py
          grep -q 'ExtraTreesClassifier' scripts/v11_backtest_legacy_ml_4m.py

      - name: Run 122-day per-symbol walk-forward backtest
        run: |
          set -euo pipefail
          python scripts/v11_backtest_legacy_ml_4m.py

      - name: Verify evidence integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('data/v11_legacy_ml_backtest_4m.json',encoding='utf-8'))
          g=json.load(open('data/v11_legacy_ml_backtest_gate.json',encoding='utf-8'))
          assert r['meta']['allowedRR']==[1,2]
          assert r['meta']['maxEntriesPerEligibleDay']==3
          assert len(r['symbols'])==r['meta']['totalSymbols']==95
          for s,x in r['symbols'].items():
              p=x.get('profile') or {}
              if p:
                  assert p['maxTradesPerDay'] in (1,2,3),(s,p)
                  assert p['execution']['rr'] in (1.0,2.0),(s,p)
              f=x.get('full4m') or {}
              if f:
                  assert f.get('maxTradesInDay',0)<=3,(s,f)
              if x.get('pass'):
                  assert f['winRate']>=80.0,s
                  assert f['trades']>=60,s
                  assert f['meanR']>0,s
                  assert x.get('sourceExactInstrument') is True,s
          assert g['passCount']==sum(bool(x.get('pass')) for x in r['symbols'].values())
          assert g['allPassed']==(g['passCount']==g['totalSymbols'])
          print({'passCount':g['passCount'],'totalSymbols':g['totalSymbols'],'allPassed':g['allPassed'],'failedCount':len(g['failingSymbols'])})
          PY

      - name: Commit final evidence
        run: |
          set -euo pipefail
          git config user.name trading-backtest-bot
          git config user.email trading-backtest-bot@users.noreply.github.com
          git add data/v11_legacy_ml_backtest_4m.json data/v11_legacy_ml_backtest_gate.json
          git diff --cached --quiet && exit 0
          git commit -m 'backtest: update V11 legacy-learned 4m evidence'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-legacy-ml-backtest-4m-${{ github.run_id }}
          path: |
            data/v11_legacy_ml_backtest_4m.json
            data/v11_legacy_ml_backtest_gate.json
          retention-days: 14
