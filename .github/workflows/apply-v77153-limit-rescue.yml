name: Apply V77.15.3 Structural Limit Rescue
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77153_limit_rescue.js'
      - '.github/workflows/apply-v77153-limit-rescue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77153_DIAGNOSTIC.txt
          node --check scripts/apply_v77153_limit_rescue.js >> V77153_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77153_DIAGNOSTIC.txt
          node scripts/apply_v77153_limit_rescue.js >> V77153_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77153_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77153_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77153_DIAGNOSTIC.txt
          for t in 'V77.15.3' 'refinedLimitPlan(side,M15.close' 'refinedLimitPlan(side,M5.close' 'RR_QUALITY_REQUIRED' 'Structural Limit Rescue'; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77153_DIAGNOSTIC.txt; else echo "$t=NO" >> V77153_DIAGNOSTIC.txt; fi; done
          exit 0
      - name: Promote
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77153_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77153_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77153_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77153_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.15.3 structural limit rescue' || exit 0
          git push origin main
