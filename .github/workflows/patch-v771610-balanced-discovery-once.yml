name: Patch V77.16.10 Balanced Discovery Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-v771610-balanced-discovery-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch soft discovery gates only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          pairs=[
            ('version: "V77.16.9"','version: "V77.16.10"'),
            ('service: "Trading V77.16.9 Balanced Entry Signal Engine"','service: "Trading V77.16.10 Balanced Discovery Signal Engine"'),
            ('if(mode==="TREND"&&intel.methodFit>=50&&nearEma&&continuation)','if(mode==="TREND"&&intel.methodFit>=48&&nearEma&&continuation)'),
            ('if(mode==="RELATIVE"&&intel.methodFit>=49&&Number(context.score||0)>=6&&nearEma&&continuation)','if(mode==="RELATIVE"&&intel.methodFit>=48&&Number(context.score||0)>=6&&nearEma&&continuation)'),
            ('if(mode==="TREND"&&intel.methodFit>=52&&impulse','if(mode==="TREND"&&intel.methodFit>=50&&impulse'),
            ('if(mode==="RELATIVE"&&intel.methodFit>=52&&Number(context.score||0)>=6&&impulse','if(mode==="RELATIVE"&&intel.methodFit>=50&&Number(context.score||0)>=6&&impulse'),
            ('if(side==="NEUTRAL"||Number(intel?.methodFit||0)<55)return null;','if(side==="NEUTRAL"||Number(intel?.methodFit||0)<52)return null;'),
            ('if(Number(intel?.methodFit||0)<44)return null;','if(Number(intel?.methodFit||0)<42)return null;'),
            ('if(type==="future")x=Math.max(x,1.50);else if(type==="metal")x=Math.max(x,mode==="MEAN_REVERSION"?1.20:1.32);','if(type==="future")x=Math.max(x,1.45);else if(type==="metal")x=Math.max(x,mode==="MEAN_REVERSION"?1.18:1.28);'),
            ('else if(type==="forex")x=Math.max(x,mode==="MEAN_REVERSION"?1.12:1.22);','else if(type==="forex")x=Math.max(x,mode==="MEAN_REVERSION"?1.10:1.20);'),
            ('return {pass:chase<=.65&&notExtreme','return {pass:chase<=.70&&notExtreme')
          ]
          for old,new in pairs:
              if old not in s: raise SystemExit('missing anchor: '+old[:100])
              s=s.replace(old,new,1)
          if 'deepNonCryptoCandidates: 6' not in s: raise SystemExit('deep candidate budget changed unexpectedly')
          for lock in ['NEWS_CONTEXT_REQUIRED','FINAL_QUOTE_STALE','EXECUTION_QUOTE_REQUIRED','FUTURE_RISK_LIMIT_REQUIRED','STRUCTURAL_SL_REQUIRED']:
              if lock not in s: raise SystemExit('hard gate missing: '+lock)
          p.write_text(s)
          PY
      - name: Update validator and checkpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/validate-cloudflare-v77.yml');s=p.read_text();s=s.replace("'V77.16.9'","'V77.16.10'",1);p.write_text(s)
          p=Path('docs/checkpoints/V771822_SAFE_RISK_BALANCED_DISCOVERY.md');s=p.read_text();s=s.replace('At this checkpoint the existing Signal core remains V77.16.9 until its large engine file receives a separately validated soft-gate patch. Do not falsely label the Signal core V77.16.10 before that patch lands. The intended tuning is limited to soft discovery gates; hard news, freshness, structural, execution-authority and futures-risk gates must remain.','Signal core is V77.16.10 Balanced Discovery. Only soft discovery thresholds were modestly relaxed. Forex deep breadth intentionally remains 6 to preserve Twelve Data budget assumptions. Hard news, freshness, structural, execution-authority and futures-risk gates remain mandatory.');p.write_text(s)
          p=Path('docs/checkpoints/CURRENT_HANDOFF.md');s=p.read_text();s=s.replace('Signal core remains `engine-v77168.js` / V77.16.9 until its large-file soft-gate patch is separately validated.','Signal core is `engine-v77168.js` / V77.16.10 Balanced Discovery.').replace('Signal V77.16.9 continues to auto-scan','Signal V77.16.10 continues to auto-scan').replace('A planned soft-gate tuning exists for better Forex/Metal/Futures discovery, but DO NOT claim V77.16.10 until the large engine file patch lands and validates. Do not increase Twelve Data deep-scan breadth without validating quota accounting.','V77.16.10 modestly relaxes soft trend/relative location and trigger fit, conditional/fallback eligibility, per-market minimum RR and market chase geometry. Forex deep breadth remains 6 to avoid changing Twelve Data budget assumptions. Hard gates are unchanged.').replace('Signal core vẫn V77.16.9 cho tới khi soft-gate patch riêng được validate.','Signal core V77.16.10 Balanced Discovery; hard gates giữ nguyên và Forex deep vẫn 6 để bảo toàn quota.');p.write_text(s)
          PY
      - name: Syntax and hard-lock verification
        run: |
          node --check cloudflare-worker/engine-v77168.js
          grep -q 'V77.16.10' cloudflare-worker/engine-v77168.js
          grep -q 'deepNonCryptoCandidates: 6' cloudflare-worker/engine-v77168.js
          grep -q 'NEWS_CONTEXT_REQUIRED' cloudflare-worker/engine-v77168.js
          grep -q 'EXECUTION_QUOTE_REQUIRED' cloudflare-worker/engine-v77168.js
          grep -q 'FUTURE_RISK_LIMIT_REQUIRED' cloudflare-worker/engine-v77168.js
      - name: Full Worker dry-run
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: |
          npm install
          npm run prepare:wrangler
          npx wrangler deploy --dry-run
      - name: Commit patch
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js .github/workflows/validate-cloudflare-v77.yml docs/checkpoints/V771822_SAFE_RISK_BALANCED_DISCOVERY.md docs/checkpoints/CURRENT_HANDOFF.md
          git commit -m "V77.16.10 balanced discovery soft-gate tuning" || true
          git push
