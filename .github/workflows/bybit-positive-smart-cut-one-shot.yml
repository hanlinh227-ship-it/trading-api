name: Bybit Positive Smart Cut One Shot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-positive-smart-cut-one-shot.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/bybit-positive-smart-cut-patch.py
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/bybit-position-manager.js
          node --check cloudflare-worker/bybit-auto-config.js
          grep -q 'SMART_CUT_POSITIVE_THESIS_INVALIDATION' cloudflare-worker/bybit-position-manager.js
          grep -q 'smartCutPositiveEnabled:true' cloudflare-worker/bybit-auto-config.js
          git diff --check
          cd cloudflare-worker
          node validate-worker.mjs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/bybit-position-manager.js cloudflare-worker/bybit-auto-config.js
          git commit -m 'fix(bybit): re-evaluate profitable positions with smart cut'
          git push origin HEAD:main
