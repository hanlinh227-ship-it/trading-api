name: Free Data ML Precision V5
on:
  push:
    paths:
      - 'scripts/free_data_ml_precision_v5.py'
      - '.github/workflows/free-data-ml-precision-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ML dependency
        run: pip install -q scikit-learn
      - name: Run all-symbol meta-label precision research
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/free_data_ml_precision_v5.py
