name: Blind Crypto Backtest V23
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v23.py'
      - '.github/workflows/blind-backtest-v23.yml'
  workflow_dispatch:
jobs:
  v23:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v23.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v23.json
          git commit -m "Run V23 RR-gated true blind" || exit 0
          git pull --rebase origin main || true
          git push || true
