name: Deploy SignalHub Worker

on:
  push:
    branches: [signalhub-v3-final]
    paths:
      - 'signalhub-worker/**'
      - '.github/workflows/deploy-signalhub-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Validate Worker source
        working-directory: signalhub-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/signalhub-dryrun
      - name: Deploy Worker
        working-directory: signalhub-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc
      - name: Smoke test V3.1 and EA compatibility
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code=$(curl --silent --show-error --max-time 20 -o /tmp/v3.json -w '%{http_code}' "$SIGNALHUB_URL/v3/status" || true)
            if [ "$code" = "200" ]; then
              ver=$(python3 - <<'PY'
          import json
          try: print(json.load(open('/tmp/v3.json')).get('version',''))
          except: print('')
          PY
          )
              echo "attempt=$n version=$ver"
              if [ "$ver" = "SIGNALHUB-V3-GATEWAY-3.1.0" ]; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1
          curl --fail --silent --show-error --max-time 25 "$SIGNALHUB_URL/signals?status=active&limit=20" -o /tmp/legacy-signals.json
          curl --fail --silent --show-error --max-time 35 "$SIGNALHUB_URL/v3/crypto/tickers?limit=3" -o /tmp/tick.json
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/v3/app-version" -o /tmp/app.json
          python3 - <<'PY'
          import json
          v=json.load(open('/tmp/v3.json')); l=json.load(open('/tmp/legacy-signals.json')); t=json.load(open('/tmp/tick.json')); a=json.load(open('/tmp/app.json'))
          assert v.get('ok') is True and v.get('checkpoint')=='SIGNALHUB_V3_CHECKPOINT_05',v
          assert l.get('ok') is True and isinstance(l.get('signals'),list),l
          assert t.get('ok') is True and t.get('count',0)>=1,t
          assert a.get('app',{}).get('versionName')=='3.1.0',a
          print('DEPLOY_OK',v.get('version'),t.get('provider'),t.get('count'),'legacy-active',l.get('count'))
          PY
