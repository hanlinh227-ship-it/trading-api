name: V78-028 PR Dispatcher

on:
  pull_request:
    types: [opened]

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: github.event.pull_request.title == 'RUN-V78-028-030-PR'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch guarded rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v78-028-signal-index.yml --repo "${{ github.repository }}" --ref main
