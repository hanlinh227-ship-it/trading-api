name: Meme Alpha V377 Activate Approved Hook

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v377-activate.yml'

permissions:
  contents: write

jobs:
  activate:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Execute only the approved Meme Alpha v3.77 hook
        shell: bash
        run: |
          set -u
          OUT="$GITHUB_WORKSPACE/meme-alpha-runtime/V377-ACTIVATE.md"
          HOOK=/opt/trading/trading-api/auto-futures-v1/runtime/deploy_meme_alpha_v377.sh
          PATCHER=/opt/trading/trading-api/auto-futures-v1/runtime/meme_alpha_patch_v377.py
          APP=/opt/meme-alpha/app
          SIGNER=/opt/meme-alpha-signer/ready_signer.py
          EXPECT_HOOK=42ad0b62da99bddb1857af70c0a52247c074841c
          EXPECT_PATCHER=52c4b0d266d9b832a446c6d6d9604459f463e34f

          HOOK_BLOB="$(git hash-object "$HOOK" 2>/dev/null || echo UNREADABLE)"
          PATCHER_BLOB="$(git hash-object "$PATCHER" 2>/dev/null || echo UNREADABLE)"
          VERDICT=NOT_ATTEMPTED
          HOOK_RC=NA
          HOOK_LAST_LINE=NA

          if [[ "$HOOK_BLOB" != "$EXPECT_HOOK" || "$PATCHER_BLOB" != "$EXPECT_PATCHER" ]]; then
            VERDICT=ARTIFACT_MISMATCH_FAIL_CLOSED
          elif [[ ! -x "$HOOK" ]]; then
            VERDICT=HOOK_NOT_EXECUTABLE_FAIL_CLOSED
          else
            LOG="$(mktemp)"
            set +e
            sudo -n "$HOOK" >"$LOG" 2>&1
            HOOK_RC=$?
            set -e
            HOOK_LAST_LINE="$(tail -n 1 "$LOG" 2>/dev/null | tr -cd '[:alnum:]_ =:.-' | cut -c1-240)"
            if grep -q 'MEME_V377_DEPLOY=SUCCESS' "$LOG"; then
              VERDICT=SUCCESS
            elif grep -q 'MEME_V377_DEPLOY=ALREADY_APPLIED' "$LOG"; then
              VERDICT=ALREADY_APPLIED
            elif grep -q 'MEME_V377_DEPLOY=DEFER_' "$LOG"; then
              VERDICT=SAFE_DEFER
            elif grep -qiE 'sudo:|not allowed|password is required|policy' "$LOG"; then
              VERDICT=SUDO_POLICY_DENIED
            elif [[ "$HOOK_RC" -ne 0 ]]; then
              VERDICT=HOOK_FAILED
            else
              VERDICT=UNKNOWN_RESULT
            fi
            rm -f "$LOG"
          fi

          if grep -q '3.77.0-objective-insider-risk' "$APP/src/safe-signal-export.js" 2>/dev/null \
             && grep -q 'function insiderSafe(c)' "$APP/src/micro-live-executor.js" 2>/dev/null \
             && grep -q 'def objective_insider_ok(c):' "$SIGNER" 2>/dev/null \
             && grep -q "'version':'8.0'" "$SIGNER" 2>/dev/null; then HARDENING=true; else HARDENING=false; fi

          MARKER=false; [[ -f "$APP/runtime-status/v377-deployed.json" ]] && MARKER=true
          MAINT=false; [[ -f /var/lib/meme-alpha/deploy-v377-maintenance.json ]] && MAINT=true
          PAPER="$(systemctl is-active meme-alpha-paper.service 2>/dev/null || echo unknown)"
          MICRO="$(systemctl is-active meme-alpha-micro-live.service 2>/dev/null || echo unknown)"
          SIGNER_STATE="$(systemctl is-active meme-alpha-signer.service 2>/dev/null || echo unknown)"

          cat > "$OUT" <<EOF
          # Meme Alpha V377 Activation Result

          - approved_hook_blob_match: \`$([[ "$HOOK_BLOB" == "$EXPECT_HOOK" ]] && echo true || echo false)\`
          - approved_patcher_blob_match: \`$([[ "$PATCHER_BLOB" == "$EXPECT_PATCHER" ]] && echo true || echo false)\`
          - activation_verdict: \`$VERDICT\`
          - hook_exit_code: \`$HOOK_RC\`
          - hook_last_status: \`$HOOK_LAST_LINE\`
          - objective_insider_hardening_live: \`$HARDENING\`
          - deployment_marker_present: \`$MARKER\`
          - maintenance_drain_active: \`$MAINT\`
          - paper_service: \`$PAPER\`
          - micro_live_service: \`$MICRO\`
          - signer_service: \`$SIGNER_STATE\`
          - bybit_touched: \`false\`
          - checked_at_utc: \`$(date -u +%FT%TZ)\`
          EOF

      - name: Commit activation evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "meme-alpha-vps-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add meme-alpha-runtime/V377-ACTIVATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(meme): record v377 activation result"
          git push origin HEAD:main
