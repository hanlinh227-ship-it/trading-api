name: Render Max With Free Image Agent

on:
  push:
    branches: [smoke/max-free-image-agent-20260916]
    paths:
      - '.github/workflows/render-max-free-agent.yml'

permissions:
  contents: read

jobs:
  render-max:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smoke/max-free-image-agent-20260916
      - name: Render Max through production free image agent
        env:
          TOKEN: ${{ secrets.MODEL_MESH_EXECUTION_TOKEN }}
          BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          mkdir -p artifacts
          curl -fsS "$BASE_URL/brain/image/health" -o artifacts/health.json
          python - <<'PY'
          import json
          h=json.load(open('artifacts/health.json'))
          assert h.get('ok') is True, h
          assert h.get('executionEnabled') is True, h
          assert h.get('mode') == 'FREE_ONLY', h
          PY
          cat > /tmp/render.json <<'JSON'
          {
            "dataClass":"PUBLIC",
            "prompt":"SOLO CHARACTER ONLY. One single cute preschool cartoon monkey named Max, full body, centered, standing alone. Bright red-orange soft fur. Cream rounded face. Cream inner ears. Very large glossy black eyes. Two small red hair tufts. Large childlike head, small toddler body, short arms and legs, one slim red tail. Outfit locked: sky-blue short sleeve T-shirt, golden-yellow short overalls, blue-and-white sneakers. Friendly gentle smile, one hand raised in a small wave. Simple clean pastel studio background with soft pale yellow floor and pale sky-blue backdrop. No scenery characters. No people. No animals. No props. Modern polished 3D preschool CGI, soft rounded shapes, clean fabric, soft daylight, highly readable silhouette, exactly one character, exactly two arms, exactly two legs, exactly two ears, exactly one tail.",
            "negativePrompt":"more than one character, second character, extra character, person, human, child, baby, other monkey, animal, crowd, duplicate, twins, cropped body, extra arms, extra legs, extra ears, extra tail, missing tail, deformed hands, malformed face, brown fur, black fur, red shirt, blue overalls, bare feet, hat, backpack, bow, toy, cup, prop, text, watermark, logo, photorealistic, anime, blurry, low quality",
            "width":512,
            "height":768,
            "steps":24,
            "n":1
          }
          JSON
          curl -fsS -X POST "$BASE_URL/brain/image/render" \
            -H "content-type: application/json" \
            -H "x-model-mesh-token: $TOKEN" \
            --data-binary @/tmp/render.json -o artifacts/submit.json
          JOB_ID="$(python - <<'PY'
          import json
          x=json.load(open('artifacts/submit.json'))
          assert x.get('ok') is True, x
          print(x['jobId'])
          PY
          )"
          echo "JOB_ID=$JOB_ID"
          done_flag=0
          for i in $(seq 1 72); do
            curl -fsS "$BASE_URL/brain/image/check?id=$JOB_ID" \
              -H "x-model-mesh-token: $TOKEN" -o artifacts/check.json
            python - <<'PY'
          import json
          x=json.load(open('artifacts/check.json'))
          print('queue=',x.get('queuePosition'),'wait=',x.get('waitTime'),'done=',x.get('done'),'faulted=',x.get('faulted'))
          assert x.get('faulted') is not True, x
          PY
            if python - <<'PY'
          import json,sys
          x=json.load(open('artifacts/check.json'))
          sys.exit(0 if x.get('done') else 1)
          PY
            then done_flag=1; break; fi
            sleep 10
          done
          test "$done_flag" = 1
          curl -fsS "$BASE_URL/brain/image/status?id=$JOB_ID" \
            -H "x-model-mesh-token: $TOKEN" -o artifacts/status.json
          IMAGE_URL="$(python - <<'PY'
          import json
          x=json.load(open('artifacts/status.json'))
          assert x.get('ok') is True and x.get('done') is True, x
          g=x.get('generations') or []
          assert g and g[0].get('imageUrl'), x
          print(g[0]['imageUrl'])
          PY
          )"
          curl -fL --retry 3 --retry-delay 2 "$IMAGE_URL" -o artifacts/max-free-agent-v2.webp
          file artifacts/max-free-agent-v2.webp
          test -s artifacts/max-free-agent-v2.webp
      - uses: actions/upload-artifact@v4
        with:
          name: max-free-agent-render-v2
          path: artifacts/max-free-agent-v2.webp
          retention-days: 7
