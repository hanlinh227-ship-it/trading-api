name: Render Max With Free Image Agent

on:
  push:
    branches: [smoke/max-free-image-agent-20260916]
    paths:
      - '.github/workflows/render-max-free-agent.yml'

permissions:
  contents: read

jobs:
  render-max:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: smoke/max-free-image-agent-20260916
      - name: Render Max through production free image agent
        env:
          TOKEN: ${{ secrets.MODEL_MESH_EXECUTION_TOKEN }}
          BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TOKEN"
          mkdir -p artifacts
          curl -fsS "$BASE_URL/brain/image/health" -o artifacts/health.json
          python - <<'PY'
          import json
          h=json.load(open('artifacts/health.json'))
          assert h.get('ok') is True, h
          assert h.get('executionEnabled') is True, h
          assert h.get('mode') == 'FREE_ONLY', h
          PY
          cat > /tmp/render.json <<'JSON'
          {
            "dataClass":"PUBLIC",
            "prompt":"ONE SINGLE CHARACTER ONLY, portrait of Max, an adorable preschool 3D CGI baby monkey. Medium close-up from chest upward, centered. Bright red-orange soft fur, rounded cream face, cream inner ears, very large glossy black eyes, short rounded muzzle, two tiny red hair tufts, gentle friendly smile. Childlike proportions, large head and small shoulders. Outfit identity lock: sky-blue short-sleeve T-shirt visible at the shoulders and chest, warm golden-yellow overall bib and straps visible over the blue shirt. No hands in frame, no lower body in frame. Soft blurred pastel playground background, warm daylight, polished modern preschool animation, soft rounded forms, clean materials, expressive but natural face, high character readability, appealing 3D cartoon render, exactly one monkey, no other subjects.",
            "negativePrompt":"second character, extra character, duplicate, twins, person, human, baby human, child, other monkey, animal, crowd, multiple faces, extra face, extra eyes, extra ears, extra arms, hands, malformed face, deformed anatomy, brown fur, black fur, white shirt, red shirt, blue overalls, hat, backpack, bow, prop, toy, text, watermark, logo, photorealistic human skin, anime, blurry, low quality, horror, creepy",
            "width":768,
            "height":768,
            "steps":26,
            "n":1,
            "models":["AlbedoBase XL (SDXL)"]
          }
          JSON
          curl -fsS -X POST "$BASE_URL/brain/image/render" \
            -H "content-type: application/json" \
            -H "x-model-mesh-token: $TOKEN" \
            --data-binary @/tmp/render.json -o artifacts/submit.json
          JOB_ID="$(python - <<'PY'
          import json
          x=json.load(open('artifacts/submit.json'))
          assert x.get('ok') is True, x
          print(x['jobId'])
          PY
          )"
          echo "JOB_ID=$JOB_ID"
          done_flag=0
          for i in $(seq 1 120); do
            curl -fsS "$BASE_URL/brain/image/check?id=$JOB_ID" \
              -H "x-model-mesh-token: $TOKEN" -o artifacts/check.json
            python - <<'PY'
          import json
          x=json.load(open('artifacts/check.json'))
          print('queue=',x.get('queuePosition'),'wait=',x.get('waitTime'),'done=',x.get('done'),'faulted=',x.get('faulted'))
          assert x.get('faulted') is not True, x
          PY
            if python - <<'PY'
          import json,sys
          x=json.load(open('artifacts/check.json'))
          sys.exit(0 if x.get('done') else 1)
          PY
            then done_flag=1; break; fi
            sleep 10
          done
          test "$done_flag" = 1
          curl -fsS "$BASE_URL/brain/image/status?id=$JOB_ID" \
            -H "x-model-mesh-token: $TOKEN" -o artifacts/status.json
          python - <<'PY'
          import json
          x=json.load(open('artifacts/status.json'))
          assert x.get('ok') is True and x.get('done') is True, x
          g=x.get('generations') or []
          assert g and g[0].get('imageUrl'), x
          print('MODEL_USED=',g[0].get('model'))
          PY
          IMAGE_URL="$(python - <<'PY'
          import json
          x=json.load(open('artifacts/status.json'))
          print(x['generations'][0]['imageUrl'])
          PY
          )"
          curl -fL --retry 3 --retry-delay 2 "$IMAGE_URL" -o artifacts/max-free-agent-v3.webp
          file artifacts/max-free-agent-v3.webp
          test -s artifacts/max-free-agent-v3.webp
      - uses: actions/upload-artifact@v4
        with:
          name: max-free-agent-render-v3
          path: artifacts/max-free-agent-v3.webp
          retention-days: 7
