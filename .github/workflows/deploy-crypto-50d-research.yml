name: Deploy Crypto 50D Research
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: crypto-50d-research-vps
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Validate V3
        run: python3 -m py_compile scripts/continuous_crypto_50d.py scripts/crypto_3ai_learner.py scripts/continuous_crypto_50d_v3.py
      - name: Sync canonical main
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main
      - name: Stop prior epoch and install V3
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo systemctl stop crypto-50d.service || true
          sudo systemctl disable --now crypto-50d-status.timer || true
          sudo install -d -m 700 /etc/trading /var/lib/trading/crypto-50d-v3
          tmp=$(mktemp)
          cat > "$tmp" <<'EOF'
          CRYPTO_RESEARCH_STATE_DIR=/var/lib/trading/crypto-50d
          CRYPTO_V3_STATE_DIR=/var/lib/trading/crypto-50d-v3
          BINANCE_FUTURES_BASE_URL=https://fapi.binance.com
          CRYPTO_TARGET_WR=80
          CRYPTO_WINDOW_DAYS=50
          CRYPTO_V3_MIN_TRADES_WINDOW=50
          CRYPTO_V3_VALIDATION_WINDOWS=3
          CRYPTO_V3_WORST_WR=70
          CRYPTO_FEE_BPS_RT=10
          CRYPTO_SLIPPAGE_BPS_RT=4
          CRYPTO_ROUND_PAUSE_SECONDS=2
          CRYPTO_AI_TIMEOUT_SECONDS=60
          EOF
          sudo install -m 600 "$tmp" /etc/trading/crypto-50d.env
          rm -f "$tmp"
          sudo install -m 644 "$repo/vps/crypto-research/crypto-50d.service" /etc/systemd/system/crypto-50d.service
          sudo systemctl daemon-reload
          sudo systemctl enable crypto-50d.service
          sudo systemctl restart crypto-50d.service
      - name: Verify fresh V3 epoch
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 300); do
            sudo systemctl is-active --quiet crypto-50d.service || { sudo journalctl -u crypto-50d.service -n 120 --no-pager; exit 1; }
            if [ -s /var/lib/trading/crypto-50d-v3/state.json ]; then
              if sudo python3 - <<'PY'
          import json, sys
          d=json.load(open('/var/lib/trading/crypto-50d-v3/state.json'))
          ok=(d.get('version')=='CRYPTO-50D-V3' and int(d.get('round') or 0)>=1 and int(d.get('minTradesPer50d') or 0)>=50 and int(d.get('validationWindows') or 0)>=3 and d.get('aiLearning',{}).get('rule')=='DEV_ONLY')
          if not ok:
              print('V3 state exists but first completed round is not ready yet:', {k:d.get(k) for k in ('version','round','status','currentSymbol','minTradesPer50d','validationWindows')})
              sys.exit(2)
          print('CRYPTO_50D_V3=ACTIVE round='+str(d['round'])+' symbol='+str(d.get('currentSymbol')))
          PY
              then
                sudo cat /var/lib/trading/crypto-50d-v3/universe.json
                exit 0
              fi
            fi
            sleep 2
          done
          echo 'V3 did not complete a verifiable first round in time'
          sudo cat /var/lib/trading/crypto-50d-v3/state.json 2>/dev/null || true
          sudo journalctl -u crypto-50d.service -n 150 --no-pager
          exit 1
