name: Write Latest V58 Summary
on:
  push:
    paths:
      - 'scripts/write_latest_v58_summary.py'
      - '.github/workflows/write-latest-v58-summary.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Wait for V58 and summarize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/write_latest_v58_summary.py
      - name: Commit V58 summary
        run: |
          git config user.name 'research-summary-bot'
          git config user.email 'research-summary-bot@users.noreply.github.com'
          git add data/v58_compact_summary.json
          git commit -m 'Save compact V58 per-coin results' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
