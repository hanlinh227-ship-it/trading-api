name: V78-021 Apply Hub R12 Quality Visibility V2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-021-apply-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v78-021-apply
  cancel-in-progress: false

jobs:
  apply-validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      WORKER_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard state, source blob, and secrets
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md
          actual="$(git hash-object cloudflare-worker/engine-v77168.js)"
          echo "engine_blob=$actual"
          test "$actual" = 'd612d081bb6550839f946e7ceef307badb92cda8'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"

      - name: Capture pre-deploy latest-scan snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,pathlib
          b='https://trading-v77-scanner.hanlinh227.workers.dev'; gs=['forex','crypto','metal','index']
          def get(p):
              q=urllib.request.Request(b+p,headers={'User-Agent':'V78-021-v2-pre/1.0'})
              with urllib.request.urlopen(q,timeout=90) as r:return json.loads(r.read().decode())
          x={g:get('/latest-scan?group='+g) for g in gs};pathlib.Path('/tmp/pre.json').write_text(json.dumps(x,indent=2,ensure_ascii=False));print(json.dumps({g:{'scanId':((x[g] or {}).get('snapshot') or {}).get('scanId'),'count':len((((x[g] or {}).get('snapshot') or {}).get('analyses') or []))} for g in gs},indent=2))
          PY

      - name: Apply exact additive watchLine patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js');s=p.read_text()
          old='''function watchLine(w){let x=`${w.symbol} ${sideText(w.side)} • ${reasonText(w.reason)}`;if(Number.isFinite(w.score))x+=` • ${w.score}/100`;if(w.planned){const tag=w.planned.indicative?"Tham khảo":"Kế hoạch";x+=`\n   ↳ ${tag}: E~${fmtPx(w.planned.entry)} • SL~${fmtPx(w.planned.sl)} • TP~${fmtPx(w.planned.tp2||w.planned.tp1)} • RR~${Number(w.planned.targetRR||0).toFixed(2)}`;if(w.planned.entryStyle)x+=`\n   ↳ Entry style: ${w.planned.entryStyle}`;const mt=planMetricText(w.symbol,w.planned);if(mt)x+=`\n   ↳ Geometry: ${mt}`}if(w.method?.profile)x+=`\n   ↳ Method: ${w.method.profile}`;return x;}'''
          new='''function watchLine(w){let x=`${w.symbol} ${sideText(w.side)} • ${reasonText(w.reason)}`;if(Number.isFinite(w.score))x+=` • ${w.score}/100`;if(w.planned){const tag=w.planned.indicative?"Tham khảo":"Kế hoạch";x+=`\n   ↳ ${tag}: E~${fmtPx(w.planned.entry)} • SL~${fmtPx(w.planned.sl)} • TP~${fmtPx(w.planned.tp2||w.planned.tp1)} • RR~${Number(w.planned.targetRR||0).toFixed(2)}`;if(w.planned.entryStyle)x+=`\n   ↳ Entry style: ${w.planned.entryStyle}`;const mt=planMetricText(w.symbol,w.planned);if(mt)x+=`\n   ↳ Geometry: ${mt}`}if(w.method?.profile)x+=`\n   ↳ Method: ${w.method.profile}`;const ei=buildEntryIntelligenceShadow(w);if(ei)x+=`\n   ↳ Quality: ${ei.quality.grade} (${ei.quality.score}/100)${ei.promotion.allowed===false?" • ⚠️ "+ei.promotion.reasons.join(","):""} • Fresh: ${ei.quote.freshness}`;return x;}'''
          print('old_block_count=',s.count(old));assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY

      - name: Static validation and exact-scope proof
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/engine-v77168.js
          echo "watchLine=$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)"
          echo "watchLine_EI=$(grep -c 'const ei=buildEntryIntelligenceShadow(w)' cloudflare-worker/engine-v77168.js)"
          echo "single_EI=$(grep -c 'const eiShadow=buildEntryIntelligenceShadow(a)' cloudflare-worker/engine-v77168.js)"
          echo "protected=$(grep -Ec 'function summary\(|function hubSummary\(|function freshWatchFromRun\(|function freshPlanFromRun\(' cloudflare-worker/engine-v77168.js)"
          test "$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)" -eq 1
          test "$(grep -c 'const ei=buildEntryIntelligenceShadow(w)' cloudflare-worker/engine-v77168.js)" -eq 1
          test "$(grep -c 'const eiShadow=buildEntryIntelligenceShadow(a)' cloudflare-worker/engine-v77168.js)" -eq 1
          test "$(grep -Ec 'function summary\(|function hubSummary\(|function freshWatchFromRun\(|function freshPlanFromRun\(' cloudflare-worker/engine-v77168.js)" -eq 4
          grep -q '↳ Quality: ${ei.quality.grade} (${ei.quality.score}/100)' cloudflare-worker/engine-v77168.js
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'cloudflare-worker/engine-v77168.js'
          git diff -- cloudflare-worker/engine-v77168.js | tee /tmp/engine.diff

      - name: Commit source locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78-021 Implementer';git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-021 surface Entry Intelligence quality in group scan views'
          git rev-parse HEAD | tee /tmp/source.sha

      - name: Deploy to Cloudflare production
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/deploy.log
          grep -F "$WORKER_URL" /tmp/deploy.log

      - name: Compare persisted analyses before new scans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,pathlib
          b='https://trading-v77-scanner.hanlinh227.workers.dev';gs=['forex','crypto','metal','index'];pre=json.loads(pathlib.Path('/tmp/pre.json').read_text())
          def get(p):
              q=urllib.request.Request(b+p,headers={'User-Agent':'V78-021-v2-postdeploy/1.0'})
              with urllib.request.urlopen(q,timeout=90) as r:return json.loads(r.read().decode())
          post={g:get('/latest-scan?group='+g) for g in gs};out={};ok=True
          for g in gs:
              a=(((pre[g] or {}).get('snapshot') or {}).get('analyses') or []);c=(((post[g] or {}).get('snapshot') or {}).get('analyses') or []);same=a==c;ok=ok and same
              out[g]={'sameAnalysesFieldForField':same,'preCount':len(a),'postCount':len(c),'preScanId':((pre[g] or {}).get('snapshot') or {}).get('scanId'),'postDeployPreRunScanId':((post[g] or {}).get('snapshot') or {}).get('scanId')}
          pathlib.Path('/tmp/diff.json').write_text(json.dumps(out,indent=2,ensure_ascii=False));print(json.dumps(out,indent=2,ensure_ascii=False));assert ok
          PY

      - name: One live run-now per market no retries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request,pathlib,datetime
          b='https://trading-v77-scanner.hanlinh227.workers.dev';gs=['forex','crypto','metal','index'];out={}
          for g in gs:
              try:
                  q=urllib.request.Request(b+'/run-now?group='+g,headers={'User-Agent':'V78-021-v2-live/1.0'})
                  with urllib.request.urlopen(q,timeout=90) as r:j=json.loads(r.read().decode())
                  out[g]={'status':j.get('status'),'scanId':j.get('scanId'),'scannedAt':j.get('scannedAt'),'analyses':[{'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason'),'score':a.get('score')} for a in (j.get('analyses') or [])]}
              except Exception as e:out[g]={'httpError':repr(e)}
          x={'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'groups':out};pathlib.Path('/tmp/live.json').write_text(json.dumps(x,indent=2,ensure_ascii=False));print(json.dumps(x,indent=2,ensure_ascii=False))
          PY

      - name: Persist validation and release WRITE_LOCK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,pathlib,re
          source=pathlib.Path('/tmp/source.sha').read_text().strip();deploy=pathlib.Path('/tmp/deploy.log').read_text();m=re.findall(r'Current Version ID:\s*([^\s]+)',deploy);vid=m[-1] if m else 'UNKNOWN'
          diff=pathlib.Path('/tmp/diff.json').read_text();live=pathlib.Path('/tmp/live.json').read_text()
          text=f'''V78-021 HUB R12 QUALITY VISIBILITY\nsourceCommit: {source}\ncloudflareVersionId: {vid}\nengine pre-patch blob guard: d612d081bb6550839f946e7ceef307badb92cda8 PASS\nnode --check cloudflare-worker/engine-v77168.js: PASS\nwatchLine definitions: 1 PASS\nwatchLine Entry Intelligence render call: 1 PASS\nsingleAnalysisText existing Entry Intelligence render call: 1 PASS\nprotected summary/hubSummary/freshWatchFromRun/freshPlanFromRun definitions: 4 PASS\nsource scope: exact additive watchLine rendering only; no decision/ranking/admission/KV/endpoint change\nREQUIRED/QUALITY/OPTIONAL taxonomy: unchanged\n\n=== PERSISTED ANALYSES FIELD-FOR-FIELD ACROSS DEPLOY BEFORE NEW SCANS ===\n{diff}\n\n=== ONE LIVE /run-now PER MARKET AFTER DEPLOY (NO RETRIES) ===\n{live}\n\nInterpretation:\n- Persisted analyses arrays were field-for-field identical immediately before vs immediately after deployment, before any new scan mutated KV.\n- The four post-deploy /run-now calls are live smoke evidence; RATE_BUDGET_WAIT/BUSY/errors are recorded exactly and never retry-hidden.\n- This patch changes rendered group-scan text only and does not alter analysis objects, ranking, admission, Hyro authority, hard risk, freshness, structural SL, news safeguards, TRADING_STATE, or v775:books.\n'''
          pathlib.Path('docs/ai-coengineer/V78-021_VALIDATION.txt').write_text(text)
          s=pathlib.Path('docs/ai-coengineer/SHARED_STATE.md');s.write_text(s.read_text()+f'''\n\nV78-021 — RESOLVED / DEPLOYED\n- Source commit: {source}.\n- Group-scan candidate rendering now adds Entry Intelligence quality grade/score, blocked-promotion reasons, and quote freshness through buildEntryIntelligenceShadow().\n- REQUIRED/QUALITY/OPTIONAL classification remains unchanged; visibility only.\n- Exact validation: docs/ai-coengineer/V78-021_VALIDATION.txt.\n- hubSummary() separate inline top-7 builder remains deferred as a separate follow-up.\n''')
          pathlib.Path('docs/ai-coengineer/WRITE_LOCK.md').write_text('''# AI WRITE LOCK\n\nLOCKED: false\nOWNER: NONE\nSCOPE: NONE\nRELEASED: 2026-08-20\nLAST_OWNER: CHATGPT\nLAST_SCOPE: V78-021 Hub R12 quality visibility\nRESULT: RESOLVED / DEPLOYED. Validation in docs/ai-coengineer/V78-021_VALIDATION.txt.\n\nProtocol:\n- Acquire a new lock before the next source write.\n- Never reset TRADING_STATE or delete/reset v775:books.\n- Never weaken hard risk/freshness/structural-SL/news safeguards.\n- Never restore Futures/TK2.\n- Binance20 remains NON_PRODUCTION / QUARANTINED.\n- Production Claude API remains paused; Claude.ai Web remains full co-engineer.\n''')
          PY
          git add docs/ai-coengineer/V78-021_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-021 validate production visibility and release lock'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
