name: G8 Development CI

on:
  push:
    branches:
      - research/cloud-10coin-g8-brainloop-20260913
  workflow_dispatch:

# Development-only CI: test the latest commit immediately. The final G8 BrainLoop
# research scheduler uses a separate serialized concurrency group with
# cancel-in-progress: false so a valid research generation is never interrupted.
concurrency:
  group: g8-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G8 targeted tests when present
        shell: bash
        run: |
          shopt -s nullglob
          files=(tests/test_g8_*.py)
          if (( ${#files[@]} )); then
            PYTHONPATH=. pytest "${files[@]}" -q
          else
            echo "No G8 tests yet"
          fi
      - name: Research regression
        run: PYTHONPATH=. pytest tests -q
      - name: G8 Brain snapshot contract
        shell: bash
        run: |
          cd ../..
          PYTHONPATH=. pytest AI_SKILL_LIBRARY/tests/test_g8_champion_snapshot.py -q
