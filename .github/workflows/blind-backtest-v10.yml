name: Blind Crypto Backtest V10

on:
  push:
    paths:
      - "scripts/blind_backtest_crypto_v10.py"
      - ".github/workflows/blind-backtest-v10.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: blind-crypto-backtest-v10
  cancel-in-progress: false

jobs:
  blind-backtest-v10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run V10 regression
        run: |
          mkdir -p data
          python3 scripts/blind_backtest_crypto_v10.py
      - name: Commit V10 result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v10.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run V10 crypto blind backtest"
          git pull --rebase origin main
          git push origin HEAD:main
