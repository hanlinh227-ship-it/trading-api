name: Offline Crypto Daily Each Symbol V38
on:
  push:
    paths:
      - 'scripts/offline_crypto_daily_each_symbol_v38.py'
      - '.github/workflows/offline-crypto-daily-each-symbol-v38.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Test every crypto symbol every calendar day
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_daily_each_symbol_v38.py
