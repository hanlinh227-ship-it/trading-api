name: Prepare Free Image Render Release

on:
  push:
    branches: [feature/free-image-render-agent]
    paths:
      - 'AI_SKILL_LIBRARY/checkpoint.json'
      - 'AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md'
      - 'AI_SKILL_LIBRARY/v4/legion/agents.yaml'
      - 'AI_SKILL_LIBRARY/v4/legion/image_render_policy.yaml'
      - 'CHECKPOINTS/FREE_IMAGE_RENDER_AGENT_4_12_0_CANDIDATE_2026-09-16.md'
      - 'cloudflare-worker/**'
      - 'tests/test_image_render_agent.py'
      - '.github/workflows/prepare-free-image-render-release.yml'

permissions:
  contents: write
  actions: write

jobs:
  validate-build-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/free-image-render-agent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Brain dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt

      - name: Align global handoff with candidate closure
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md')
          text = path.read_text(encoding='utf-8')
          old = 'Latest closure record: `CHECKPOINTS/FINAL_HARDENING_4_11_1_2026-09-16.md`'
          new = 'Latest closure record: `CHECKPOINTS/FREE_IMAGE_RENDER_AGENT_4_12_0_CANDIDATE_2026-09-16.md`'
          if old not in text and new not in text:
              raise SystemExit('expected latest closure marker not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Build candidate release metadata and fresh retrieval index
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.12.0 \
            --source free_image_render_agent_pr385 \
            --class feature
          # This is a one-shot bootstrap workflow. Remove it from the validation
          # workspace so the repository stays below the active-workflow ceiling;
          # the deletion is committed only after every test below is green.
          rm .github/workflows/prepare-free-image-render-release.yml
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write

      - name: Validate full Brain and repository tests
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"

      - name: Install and validate Worker runtime
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          export GITHUB_SHA="$(git -C .. rev-parse HEAD)"
          npm run prepare:skill-gateway
          npm run prepare:model-mesh
          npm run check

      - name: Rebuild exact candidate release and run final validation
        run: |
          set -euo pipefail
          # Do not mark known-good on a feature branch. Production known-good
          # requires merge, exact-main deployment and FINAL_EXACT_SHA_GATE=PASS.
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.12.0 \
            --source free_image_render_agent_pr385 \
            --class feature
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"

      - name: Commit exact candidate release metadata and remove bootstrap workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md \
                  AI_SKILL_LIBRARY/v4/releases/current.json \
                  AI_SKILL_LIBRARY/v4/releases/history.yaml \
                  AI_SKILL_LIBRARY/v4/releases/4.12.0/manifest.yaml \
                  AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git add -u .github/workflows/prepare-free-image-render-release.yml
          git diff --cached --quiet && { echo 'No release metadata changes'; exit 0; }
          git commit -m 'chore(release): record free image render agent 4.12.0 candidate'
          git push origin HEAD:feature/free-image-render-agent
