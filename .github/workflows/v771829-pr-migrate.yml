name: V77.18.29 PR Migration
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771829-live-pnl
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic migration
        run: python3 scripts/patch_v771829.py
      - name: Validate Worker and Wrangler
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm ci
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771829-dist
      - name: Commit validated source and cleanup migration files
        run: |
          rm -f .github/workflows/patch-live-pnl.yml .github/workflows/live-pnl-migration.yml .github/workflows/v771829-pr-migrate.yml
          rm -f data/v771829_trigger.txt scripts/patch_v771829.py
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add -A
          git commit -m "V77.18.29 comprehensive live PnL and unified UX" || exit 0
          git push origin HEAD:v771829-live-pnl
