name: Brain 4.13 Global Checkpoint Maintenance

on:
  push:
    branches:
      - feature/image-agent-v2-multimarket-integration
    paths:
      - '.github/workflows/brain-v413-global-checkpoint-maintenance.yml'

permissions:
  contents: write

jobs:
  update-global-closure-reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/image-agent-v2-multimarket-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replace exactly one latest closure reference
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md')
          text = path.read_text(encoding='utf-8')
          old = 'CHECKPOINTS/FREE_IMAGE_RENDER_AGENT_4_12_0_CANDIDATE_2026-09-16.md'
          new = 'CHECKPOINTS/FREE_IMAGE_RENDER_AGENT_V2_4_13_0_CANDIDATE_2026-09-16.md'
          assert text.count(old) == 1, f'expected exactly one old closure reference, got {text.count(old)}'
          text = text.replace(old, new, 1)
          assert text.count(new) == 1
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify global and discovery checkpoints agree
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          checkpoint = json.loads(Path('AI_SKILL_LIBRARY/checkpoint.json').read_text(encoding='utf-8'))
          global_text = Path('AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md').read_text(encoding='utf-8')
          latest = checkpoint['latest_closure_path']
          assert latest in global_text
          assert 'Target release: `4.13.0`' in Path(latest).read_text(encoding='utf-8')
          PY
      - name: Commit global checkpoint only
        shell: bash
        run: |
          set -euo pipefail
          TARGET='AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md'
          if git diff --quiet -- "$TARGET"; then
            echo 'GLOBAL_CHECKPOINT_ALREADY_CURRENT=1'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$TARGET"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "$TARGET"
          git commit -m 'chore: point global Brain checkpoint at 4.13 closure'
          git push origin HEAD:feature/image-agent-v2-multimarket-integration
