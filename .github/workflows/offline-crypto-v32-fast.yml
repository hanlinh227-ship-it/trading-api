name: Offline Crypto V32 Fast
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v32_fast.py'
      - '.github/workflows/offline-crypto-v32-fast.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run focused Crypto V32 zero-credit search
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v32_fast.py
