name: Meme Alpha v1.6 Pre-Live Hardening
on:
  push:
    paths:
      - 'ops/meme-alpha/v160-prelive-hardening.sh'
      - '.github/workflows/meme-alpha-v160-prelive-hardening.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: meme-alpha-v160
  cancel-in-progress: false
jobs:
  harden:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Deploy pre-live hardening
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v160-prelive-hardening.sh
          nice -n 15 bash ops/meme-alpha/v160-prelive-hardening.sh
