name: Sync Free Image Render With Main

on:
  push:
    branches: [feature/free-image-render-agent]
    paths:
      - '.github/workflows/sync-free-image-render-main.yml'

permissions:
  contents: write

jobs:
  sync-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/free-image-render-agent
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: AI_SKILL_LIBRARY/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge latest main and preserve both capabilities
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_rc=$?
          set -e

          # These three files are the only overlap with PR #386. Start from the
          # newer main version, then deterministically reapply image-render hooks.
          git checkout origin/main -- cloudflare-worker/index.js cloudflare-worker/package.json cloudflare-worker/prepare-wrangler.mjs

          python - <<'PY'
          from pathlib import Path

          p = Path('cloudflare-worker/index.js')
          text = p.read_text(encoding='utf-8')
          mesh_import = "import {handleModelMesh,handleScheduledHealthRefresh} from './model-mesh-active.js';"
          image_import = "import {handleImageRender} from './image-render-handler.js';"
          if image_import not in text:
              if mesh_import not in text:
                  raise SystemExit('model mesh import anchor missing')
              text = text.replace(mesh_import, mesh_import + '\n' + image_import)
          route_anchor = "const mesh=await handleModelMesh(req,env,ctx);if(mesh)return mesh;const research=await handleResearchGateway(req,env);"
          route_image = "const mesh=await handleModelMesh(req,env,ctx);if(mesh)return mesh;const image=await handleImageRender(req,env,ctx);if(image)return image;const research=await handleResearchGateway(req,env);"
          if route_image not in text:
              if route_anchor not in text:
                  raise SystemExit('model mesh route anchor missing')
              text = text.replace(route_anchor, route_image)
          if "export {ModelMeshHealthState} from './model-mesh/health-state.js';" not in text:
              raise SystemExit('strong health export from main was lost')
          p.write_text(text, encoding='utf-8')

          p = Path('cloudflare-worker/prepare-wrangler.mjs')
          text = p.read_text(encoding='utf-8')
          old_vars = "const vars={RUNTIME_REVISION:revision,MODEL_MESH_EXECUTION_ENABLED:'1'};"
          new_vars = "const vars={RUNTIME_REVISION:revision,MODEL_MESH_EXECUTION_ENABLED:'1',IMAGE_RENDER_EXECUTION_ENABLED:'1'};"
          if old_vars in text:
              text = text.replace(old_vars, new_vars)
          elif new_vars not in text:
              raise SystemExit('wrangler vars anchor missing')
          old_note = '// Model Mesh execution is explicitly source-authorized by the user, but remains protected by MODEL_MESH_EXECUTION_TOKEN.'
          new_note = '// Model Mesh and public-data image rendering are explicitly source-authorized; both remain protected by authenticated execution tokens.'
          text = text.replace(old_note, new_note)
          marker = 'MODEL_MESH_EXECUTION=ENABLED_AUTHENTICATED, FINANCIAL_RUNTIME_SWITCHES='
          image_marker = 'MODEL_MESH_EXECUTION=ENABLED_AUTHENTICATED, IMAGE_RENDER_EXECUTION=ENABLED_AUTHENTICATED_PUBLIC_ONLY, FINANCIAL_RUNTIME_SWITCHES='
          if marker in text:
              text = text.replace(marker, image_marker)
          elif image_marker not in text:
              raise SystemExit('wrangler log marker missing')
          if "MODEL_MESH_HEALTH=DURABLE_OBJECT_STRONG" not in text:
              raise SystemExit('strong health durable object config from main was lost')
          p.write_text(text, encoding='utf-8')
          PY

          node - <<'NODE'
          const fs=require('fs');
          const path='cloudflare-worker/package.json';
          const pkg=JSON.parse(fs.readFileSync(path,'utf8'));
          pkg.scripts['test:image-render']='node test-image-render-agent.mjs';
          if(!pkg.scripts.check.includes('npm run test:image-render')){
            const anchor='node test-model-mesh-resilience.mjs && node test-secret-scan.mjs';
            if(!pkg.scripts.check.includes(anchor))throw new Error('worker check anchor missing');
            pkg.scripts.check=pkg.scripts.check.replace(anchor,'node test-model-mesh-resilience.mjs && npm run test:image-render && node test-secret-scan.mjs');
          }
          if(!pkg.scripts.check.includes('test-model-mesh-strong-health.mjs'))throw new Error('main strong-health test was lost');
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+'\n');
          NODE

          rm .github/workflows/sync-free-image-render-main.yml
          git add -A
          unresolved="$(git diff --name-only --diff-filter=U)"
          if [ -n "$unresolved" ]; then
            echo "UNRESOLVED_MERGE_FILES=$unresolved"
            exit 1
          fi
          echo "MAIN_MERGE_PREPARED merge_rc=$merge_rc"

      - name: Rebuild candidate release metadata after main sync
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.12.0 \
            --source free_image_render_agent_pr385_synced_main \
            --class feature
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          git add -A
          git commit -m 'merge: sync latest main into free image render agent'
          echo "SYNCED_HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Validate exact synced Brain SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$SYNCED_HEAD_SHA" = "$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SYNCED_HEAD_SHA"

      - name: Validate exact synced Worker runtime
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          export GITHUB_SHA="$SYNCED_HEAD_SHA"
          npm run prepare:skill-gateway
          npm run prepare:model-mesh
          npm run check

      - name: Push only the exact validated merge commit
        shell: bash
        run: |
          set -euo pipefail
          test "$SYNCED_HEAD_SHA" = "$(git rev-parse HEAD)"
          git push origin HEAD:feature/free-image-render-agent
          echo "SYNCED_MAIN_EXACT_SHA_VALIDATED=$SYNCED_HEAD_SHA"
