name: Run SignalHub V3.12 Always-On Dual Market

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-signalhub-v312-always-on-dual-market.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy-audit:
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-v312-always-on-dual-market
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate V3.12 source
        run: python3 scripts/patch_signalhub_v312_always_on_dual_market.py

      - name: Verify V3.12 source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text()
          api=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java').read_text()
          mon=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java').read_text()
          g=Path('signalhub-android/app/build.gradle').read_text()
          for x in [
            'SIGNALHUB-V3-GATEWAY-3.12.0','DURABLE_OBJECT_ALARM_1S','ALWAYS_ON_DUAL_MARKET',
            'minActivePerMarket:1','ensureCryptoMonitor','cryptoMonitorCycle','async alarm()',
            'cryptoSnapshotForProvider','executionPriceAuthority:t.exchange','coverageClaims',
            'claimCoverage','refillMarketCoverage','ctx?.waitUntil','V312-${market}-${style}',
            "'/v3/crypto/monitor'","'/v3/portfolio'",'HARD_STRUCTURE_CHECKS_NO_NUMERIC_SCORE'
          ]: assert x in w,x
          assert 'scoreGate:false' in w and 'timeGate:false' in w and 'rrGate:false' in w
          assert 'APP_VERSION="3.12.0"' in a
          assert 'return "OPEN".equalsIgnoreCase' in a
          assert '3.12.0-always-on-dual-market' in api
          assert 'LOOP_MS=1000L' in mon
          assert "versionName '3.12.0'" in g and 'versionCode 18' in g
          print('V312_SOURCE_CONTRACT_OK')
          PY

      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config signalhub-worker/wrangler.jsonc --outdir /tmp/v312-worker

      - name: Deploy V3.12 production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config signalhub-worker/wrangler.jsonc

      - name: Wait for V3.12 production contract
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 45); do
            if curl -A 'SignalHub-CI/3.12' -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" >/tmp/status.json; then
              if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json')); q=p.get('decisionPolicy') or {}; pp=q.get('portfolioPolicy') or {}
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0'
          assert q.get('scoreGate') is False and q.get('timeGate') is False and q.get('rrGate') is False
          assert q.get('entryAssessment')=='HARD_STRUCTURE_CHECKS_NO_NUMERIC_SCORE'
          assert pp.get('maxActiveTotal')==6 and pp.get('minActivePerMarket')==1
          assert pp.get('coverageMode')=='ALWAYS_ON_DUAL_MARKET'
          assert pp.get('cryptoPendingMonitor')=='DURABLE_OBJECT_ALARM_1S'
          PY
              then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1

      - name: Migrate feed and qualify both markets
        run: |
          set -euo pipefail
          : >/tmp/engine-summary.txt
          for passno in 1 2; do
            for m in FOREX CRYPTO; do
              for s in SCALP SWING; do
                ok=0
                for n in $(seq 1 8); do
                  if curl -A 'SignalHub-CI/3.12' -fsS --max-time 120 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/scan?market=$m&style=$s&probe=$RANDOM-$passno-$n" >/tmp/scan.json; then
                    if M="$m" S="$s" PASSNO="$passno" python3 - <<'PY'
          import json,os
          p=json.load(open('/tmp/scan.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0',p.get('version')
          pp=p.get('portfolioPolicy') or {}; assert pp.get('reservation')=='DURABLE_OBJECT_ATOMIC' and pp.get('minActivePerMarket')==1
          assert int(p.get('created') or 0)<=2,p
          for x in p.get('topAnalyses',[]):
              ea=x.get('entryAssessment') or {}; checks=ea.get('checks') or {}
              assert ea.get('verdict')=='PASS' and ea.get('method')=='HARD_STRUCTURE_CHECKS_NO_NUMERIC_SCORE',ea
              assert checks and all(checks.values()),checks
          print('PASS',os.environ['PASSNO'],os.environ['M'],os.environ['S'],'evaluated',p.get('evaluated'),'qualified',p.get('actionable'),'created',p.get('created'),'blocked',p.get('portfolioBlocked'))
          PY
                    then ok=1; break; fi
                  fi
                  sleep 2
                done
                test "$ok" = 1
                M="$m" S="$s" PASSNO="$passno" python3 - <<'PY' >>/tmp/engine-summary.txt
          import json,os
          p=json.load(open('/tmp/scan.json'))
          print('pass',os.environ['PASSNO'],os.environ['M'],os.environ['S'],'evaluated',p.get('evaluated'),'qualified',p.get('actionable'),'created',p.get('created'),'blocked',p.get('portfolioBlocked'))
          PY
              done
            done
          done
          cat /tmp/engine-summary.txt

      - name: Ensure FOREX and CRYPTO coverage
        run: |
          set -euo pipefail
          covered=0
          for round in $(seq 1 8); do
            curl -A 'SignalHub-CI/3.12-coverage' -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/portfolio?probe=$RANDOM-$round" >/tmp/portfolio.json
            if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/portfolio.json')); b=p.get('portfolio') or {}; c=b.get('counts') or {}
          print('PORTFOLIO',b)
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0'
          assert int(c.get('FOREX') or 0)>=1 and int(c.get('CRYPTO') or 0)>=1
          assert int(b.get('activeTotal') or 0)<=6
          PY
            then covered=1; break; fi
            curl -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=FOREX&style=SCALP&probe=coverage-fx-$RANDOM" >/dev/null || true
            curl -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=FOREX&style=SWING&probe=coverage-fxsw-$RANDOM" >/dev/null || true
            curl -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=CRYPTO&style=SCALP&probe=coverage-cr-$RANDOM" >/dev/null || true
            curl -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=CRYPTO&style=SWING&probe=coverage-crsw-$RANDOM" >/dev/null || true
            sleep 2
          done
          test "$covered" = 1

      - name: Verify app-independent crypto alarm monitor
        run: |
          set -euo pipefail
          curl -A 'SignalHub-CI/3.12-monitor' -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/crypto/monitor?kick=1&probe=$RANDOM" >/tmp/mon1.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/mon1.json')); s=p.get('status') or {}; k=p.get('kick') or {}; b=p.get('portfolio') or {}; c=b.get('counts') or {}
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0'
          assert int(c.get('CRYPTO') or 0)>=1,b
          assert k.get('running') is True,k
          print('MONITOR_START',s)
          open('/tmp/cycle1','w').write(str(int(s.get('cycle') or 0)))
          PY
          sleep 5
          # No /crypto/tickers request here: cycle must advance from Durable Object alarms alone.
          curl -A 'SignalHub-CI/3.12-monitor' -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/crypto/monitor?probe=$RANDOM" >/tmp/mon2.json
          python3 - <<'PY'
          import json
          c1=int(open('/tmp/cycle1').read()); p=json.load(open('/tmp/mon2.json')); s=p.get('status') or {}
          print('MONITOR_AFTER_5S',s)
          assert s.get('running') is True,s
          assert int(s.get('cycle') or 0)>c1,(c1,s)
          assert int(s.get('activeCrypto') or 0)>=1,s
          PY

      - name: Concurrent scan stress test
        run: |
          set -u
          pids=''
          for round in 1 2; do
            for spec in 'FOREX SCALP' 'FOREX SWING' 'CRYPTO SCALP' 'CRYPTO SWING'; do
              set -- $spec; m=$1; s=$2
              curl -A 'SignalHub-CI/3.12-stress' -fsS --max-time 120 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/scan?market=$m&style=$s&probe=stress-$round-$m-$s-$RANDOM" >"/tmp/stress-$round-$m-$s.json" &
              pids="$pids $!"
            done
          done
          for p in $pids; do wait "$p" || true; done
          echo 'Concurrent stress requests completed'

      - name: Audit active book and provider pinning
        run: |
          set -euo pipefail
          i=0
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              i=$((i+1))
              curl -A 'SignalHub-CI/3.12-audit' -fsS --retry 3 --retry-delay 1 --max-time 40 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/signals?market=$m&style=$s&status=active&limit=200&probe=audit-$RANDOM-$i" >"/tmp/book-$i.json"
            done
          done
          python3 - <<'PY'
          import json,glob
          sig=[]
          for f in sorted(glob.glob('/tmp/book-*.json')):
              p=json.load(open(f)); assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0',p.get('version')
              sig += [x for x in p.get('signals',[]) if x.get('status') in ('OPEN','PENDING')]
          rows=[(x.get('market'),x.get('style'),x.get('symbol'),x.get('orderType'),x.get('status'),x.get('executionPriceAuthority')) for x in sig]
          print('ACTIVE_TOTAL',len(sig));print('ACTIVE_ROWS',rows)
          assert 2<=len(sig)<=6,rows
          assert sum(x.get('market')=='FOREX' for x in sig)>=1,rows
          assert sum(x.get('market')=='CRYPTO' for x in sig)>=1,rows
          assert sum(x.get('market')=='FOREX' for x in sig)<=4,rows
          assert sum(x.get('market')=='CRYPTO' for x in sig)<=4,rows
          assert sum(x.get('style')=='SCALP' for x in sig)<=3,rows
          assert sum(x.get('style')=='SWING' for x in sig)<=3,rows
          keys=[(x.get('market'),x.get('symbol')) for x in sig];assert len(keys)==len(set(keys)),keys
          for x in sig:
              assert x.get('engineVersion')=='SIGNALHUB-V3-GATEWAY-3.12.0',x
              ea=x.get('entryAssessment') or {}; assert ea.get('verdict')=='PASS',x
              pr=x.get('portfolioReservation') or {}; assert pr.get('mode')=='DURABLE_OBJECT_ATOMIC',x
              if x.get('market')=='CRYPTO': assert x.get('executionPriceAuthority') in ('BYBIT','OKX','BINANCE'),x
          fx=[x for x in sig if x.get('market')=='FOREX']
          for ccy in ['USD','EUR','GBP','JPY','AUD','NZD','CAD','CHF']:
              n=0
              for x in fx:
                  z=''.join(ch for ch in str(x.get('symbol','')).upper() if ch.isalnum())
                  if len(z)==6 and (z[:3]==ccy or z[3:]==ccy): n+=1
              assert n<=2,(ccy,n,rows)
          json.dump(sig,open('/tmp/ACTIVE-BOOK-AUDIT.json','w'),indent=2)
          open('/tmp/ACTIVE-BOOK-SUMMARY.txt','w').write(f'ACTIVE_TOTAL={len(sig)}\nFOREX={sum(x.get("market")=="FOREX" for x in sig)}\nCRYPTO={sum(x.get("market")=="CRYPTO" for x in sig)}\nUNIQUE_MARKET_SYMBOLS={len(set(keys))}\nROWS={rows}\n')
          PY
          cat /tmp/ACTIVE-BOOK-SUMMARY.txt

      - name: Verify realtime Forex bus and V3.12 status
        run: |
          set -euo pipefail
          curl -A 'SignalHub-CI/3.12-live' -fsS --retry 3 --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/forex/live?probe=$RANDOM" >/tmp/live.json
          curl -A 'SignalHub-CI/3.12-status' -fsS --retry 3 --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM" >/tmp/status-final.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/live.json'));s=json.load(open('/tmp/status-final.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.12.0'
          assert p.get('transport')=='DURABLE_OBJECT_REALTIME'
          assert p.get('count',0)>=28,p
          pf=s.get('portfolio') or {}; c=pf.get('counts') or {}; mon=s.get('cryptoMonitor') or {}
          assert int(c.get('FOREX') or 0)>=1 and int(c.get('CRYPTO') or 0)>=1,(pf,mon)
          print('FOREX_LIVE_STATE',p.get('state'),'QUOTE_AGE_MS',p.get('quoteAgeMs'),'COUNT',p.get('count'))
          print('FINAL_PORTFOLIO',pf);print('FINAL_CRYPTO_MONITOR',mon)
          PY

      - name: Build Android APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage V3.12 APK
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
          mkdir -p dist
          cp "$APK" dist/SignalHub-v3.12.0-Always-On-Dual-Market.apk
          sha256sum dist/SignalHub-v3.12.0-Always-On-Dual-Market.apk > dist/SHA256SUMS.txt
          cp /tmp/engine-summary.txt dist/ENGINE-SUMMARY.txt
          cp /tmp/ACTIVE-BOOK-AUDIT.json dist/ACTIVE-BOOK-AUDIT.json
          cp /tmp/ACTIVE-BOOK-SUMMARY.txt dist/ACTIVE-BOOK-SUMMARY.txt
          cp /tmp/mon2.json dist/CRYPTO-MONITOR-AUDIT.json

      - name: Commit generated V3.12 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java
          git commit -m 'SignalHub v3.12 always-on dual-market lifecycle' || true
          git push origin HEAD:signalhub-v312-always-on-dual-market

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.12.0-Always-On-Dual-Market
          path: dist/
          retention-days: 30

      - name: Publish V3.12 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='signalhub-v3.12.0-always-on-dual-market'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target signalhub-v312-always-on-dual-market --prerelease --title 'SignalHub v3.12.0 Always-On Dual Market' --notes 'Fixes crypto LIMIT/STOP missed-touch behavior by running provider-pinned lifecycle evaluation on a server-side Durable Object alarm independent of app polling. MT5 realtime packets also maintain at least one structure-qualified active idea in both FOREX and CRYPTO when possible, while preserving the 6-position atomic portfolio cap and hard structure assessment with no numeric score/time/RR entry gate.'
          fi
