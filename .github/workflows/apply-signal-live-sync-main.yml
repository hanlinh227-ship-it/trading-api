name: V77.18.41 Apply Signal Live Sync
on:
  push:
    branches: [main]
    paths:
      - 'scripts/migrate_signal_live_sync.mjs'
      - '.github/workflows/apply-signal-live-sync-main.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply Signal Live migration
        run: node scripts/migrate_signal_live_sync.mjs
      - name: Verify syntax
        run: |
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hub-v77171.js
      - name: Commit repaired runtime
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js .github/workflows/validate-cloudflare-v77.yml
          if git diff --cached --quiet; then echo 'No changes'; exit 0; fi
          git commit -m 'V77.18.41 persist MARKET_SIGNAL into scoped Live books'
          git push origin HEAD:main
