name: Kaggriculture V4 - Full Farm Expansion

on:
  push:
    branches:
      - codex/kaggriculture-v4-full-farm-expansion
    paths:
      - '.github/reward-kaggriculture-v4-trigger'
  workflow_dispatch:
    inputs:
      candidates:
        description: 'Expansion/search candidates (2-64)'
        default: '16'
        type: string

permissions:
  contents: write

concurrency:
  group: kaggriculture-v4-full-farm
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official simulator
        run: |
          python -m pip install 'jsonschema==4.25.1' 'requests==2.32.5'
          python -m pip install --no-deps 'kaggle-environments==1.32.4'
      - name: Compile and run contracts
        run: |
          python -m compileall -q reward-hunter/kaggriculture-v3
          python -m unittest discover -s reward-hunter/kaggriculture-v3/tests -v
      - name: Generated candidate raw-exec gate
        run: |
          python reward-hunter/kaggriculture-v3/package_submission.py --output /tmp/v4-default.py
          python reward-hunter/kaggriculture-v3/raw_exec_test.py /tmp/v4-default.py
      - name: Expansion smoke - both seats
        run: |
          mkdir -p /tmp/v4-smoke
          python reward-hunter/kaggriculture-v3/benchmark.py \
            --seeds 811,821 \
            --families starter,incumbent,expansion,early_sell \
            --steps 240 \
            --workers 4 \
            --output /tmp/v4-smoke/smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v4-smoke-${{ github.run_id }}
          path: /tmp/v4-smoke/
          retention-days: 30

  research:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 210
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/kaggriculture-v4-full-farm-expansion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned official simulator
        run: |
          python -m pip install 'jsonschema==4.25.1' 'requests==2.32.5'
          python -m pip install --no-deps 'kaggle-environments==1.32.4'
      - name: Full-farm staged search and unseen promotion gate
        run: |
          CANDIDATES='${{ github.event.inputs.candidates }}'
          if [ -z "$CANDIDATES" ]; then CANDIDATES=16; fi
          mkdir -p /tmp/v4-study
          python reward-hunter/kaggriculture-v3/search.py \
            --candidates "$CANDIDATES" \
            --study-seed '${{ github.run_id }}' \
            --workers 4 \
            --output /tmp/v4-study
      - name: Commit candidate only when every promotion gate passes
        run: |
          set -euo pipefail
          if [ -f /tmp/v4-study/champion.json ]; then
            cp /tmp/v4-study/champion.json reward-hunter/kaggriculture-v3/champion.json
            cp /tmp/v4-study/candidate-main.py reward-hunter/kaggriculture-v3/main.py
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add reward-hunter/kaggriculture-v3/champion.json reward-hunter/kaggriculture-v3/main.py
            if ! git diff --cached --quiet; then
              git commit -m 'Promote V4 full-farm gate-validated champion'
              git pull --rebase origin codex/kaggriculture-v4-full-farm-expansion
              git push origin HEAD:codex/kaggriculture-v4-full-farm-expansion
            fi
          else
            echo 'Promotion gate did not pass; incumbent remains untouched.'
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kaggriculture-v4-full-farm-${{ github.run_id }}
          path: /tmp/v4-study/
          retention-days: 30
