name: Meme Alpha V430 Post AutoRestart 100 Live Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v430-post-autorestart-100live-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Verify V430 loaded process and run 100 live assertions
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; E="$APP/src/micro-live-executor.js"
          EXPECTED_SHA=e8b2d900cc798d2341dc74f56b1de519d67e1aef8ae6d5a1cdded30ba6c05cd4
          ACTUAL_SHA=$(sha256sum "$E"|awk '{print $1}')
          echo "V430_FILE_SHA=$ACTUAL_SHA"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"
          node --check "$E"
          OUT=$(node "$E" --self-test)
          for M in V429_CAPITAL_VELOCITY=TRUE V430_EXPECTANCY_STABILIZER=TRUE V430_WINNER_BIASED_SCALE=TRUE V430_NONBLOCKING_EXIT_PREVIEW=TRUE V430_RESETTABLE_429_BACKOFF=TRUE V430_REALTIME_DEAD_CAPITAL_PRIORITY=TRUE V430_SEGMENTED_LEARNING=TRUE V430_HARD_SAFETY_UNCHANGED=TRUE HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT; do grep -q "$M" <<<"$OUT"; done
          python3 - "$E" <<'PY'
          import pathlib,sys
          s=pathlib.Path(sys.argv[1]).read_text()
          assert "c.securityDecision==='PASS'" in s and "c.holderClusterDecision==='PASS'" in s and "c.sellRoute===true" in s
          assert "COLD_EXPECTANCY_QUALITY_NOT_PROVEN" in s
          assert "return (winner||flight)&&pumpScaleEligible" in s
          assert "recovery=ret>=-.5" not in s
          assert "if(gap>0)await sleep(gap)" not in s
          assert "exitPreviewRateLimitStreak++" in s
          assert "activityPenalty=x.rtInactive&&ret<=2&&peak<5?4:0" in s
          assert "function learningLaneKey" in s and "L.lanes[lk]" in s
          assert 'scaleAllowed:true' in s
          PY

          echo '=== WAIT FOR V430 RUNTIME TELEMETRY ==='
          READY=0
          for i in $(seq 1 60); do
            if python3 - <<'PY'
          import json,pathlib,time,subprocess,sys
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          try:
            cp=rt/'capital-observability.json'; c=json.loads(cp.read_text()); ca=time.time()-cp.stat().st_mtime
            gp=rt/'micro-live-gate.json'; g=json.loads(gp.read_text()); ga=time.time()-gp.stat().st_mtime
            r=json.loads((rt/'realtime-pool-pulse.json').read_text()); p=json.loads((rt/'portfolio-observability.json').read_text())
            pid=int(subprocess.check_output(['systemctl','show','meme-alpha-micro-live.service','-p','MainPID','--value'],text=True).strip() or 0)
            cnt=int(subprocess.check_output(['pgrep','-fc','^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$'],text=True).strip() or 0)
          except Exception: sys.exit(1)
          ok=ca<180 and c.get('capitalVelocityVersion')=='V430' and c.get('expectancyStabilizerVersion')=='V430' and c.get('scaleAllowed') is True and ga<180 and g.get('allowed') is True and g.get('armOk') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True and not g.get('reasons') and r.get('status')=='HEALTHY' and int(r.get('heldUnresolved') or 0)==0 and int(r.get('heldCoveragePct') or 0)==100 and p.get('stateReadable') is True and pid>0 and cnt==1
          sys.exit(0 if ok else 1)
          PY
            then READY=1; break; fi
            sleep 3
          done
          test "$READY" -eq 1

          PID0=$(systemctl show meme-alpha-micro-live.service -p MainPID --value)
          echo "V430_MAINPID=$PID0"
          ps -o user=,uid=,pid=,lstart=,etimes=,cmd= -p "$PID0"

          echo '=== V430 100 LIVE PASS ==='
          for i in $(seq 1 100); do
            test "$(sha256sum "$E"|awk '{print $1}')" = "$EXPECTED_SHA"
            node --check "$E"
            test "$(pgrep -fc '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$'||true)" -eq 1
            for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do test "$(systemctl is-active "$svc")" = active; done
            python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          gp=rt/'micro-live-gate.json'; g=json.loads(gp.read_text()); ga=time.time()-gp.stat().st_mtime
          cp=rt/'capital-observability.json'; c=json.loads(cp.read_text()); ca=time.time()-cp.stat().st_mtime
          r=json.loads((rt/'realtime-pool-pulse.json').read_text()); p=json.loads((rt/'portfolio-observability.json').read_text())
          assert ga<180 and g.get('allowed') is True and g.get('armOk') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True and not g.get('reasons')
          assert ca<180 and c.get('capitalVelocityVersion')=='V430' and c.get('expectancyStabilizerVersion')=='V430' and c.get('scaleAllowed') is True
          assert r.get('status')=='HEALTHY' and int(r.get('heldUnresolved') or 0)==0 and int(r.get('heldCoveragePct') or 0)==100
          assert p.get('stateReadable') is True
          PY
            echo V430_LIVE_PASS=$i
            sleep 1
          done

          PID1=$(systemctl show meme-alpha-micro-live.service -p MainPID --value)
          test "$PID1" = "$PID0"
          echo '=== V430 FINAL SNAPSHOT ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          for name in ['capital-observability.json','allocator-status.json','micro-live-gate.json','portfolio-observability.json','realtime-pool-pulse.json','last-execution.json']:
            p=rt/name
            if not p.exists(): continue
            x=json.loads(p.read_text())
            if name=='realtime-pool-pulse.json': x={k:x.get(k) for k in ['updatedAt','status','heldTotal','heldResolved','heldUnresolved','heldCoveragePct','heartbeatAgeMs','reconnectFailures']}
            print(name,json.dumps(x,ensure_ascii=False)[:12000])
          PY
          echo V430_PREDEPLOY_100_PASS=CLEAN_FROM_RUN_34084189884
          echo V430_LIVE_100_PASS=CLEAN
          echo V430_RUNTIME_TELEMETRY=CONFIRMED
          echo V430_ACTIVE=TRUE
          echo SCALE_ALLOWED=TRUE
          echo HARD_SAFETY_BYPASS=FALSE
