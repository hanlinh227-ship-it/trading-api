name: V78-028 Hotfix + V78-030 Final

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  run:
    if: github.event.issue.title == 'RUN-V78-028-HOTFIX-030'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard current V78-028 source and protections
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          test "$(git hash-object cloudflare-worker/engine-v77168.js)" = "d760b7ecb771872edea491d3f0e1bff5ae7c5690"
          test "$(grep -c 'function whyNowVi' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'propKeyboard\|personalKeyboard' cloudflare-worker/engine-v77168.js)" = 0
          grep -Fq 'fresh:age!==null&&age<=CONFIG.maxQuoteAgeSec' cloudflare-worker/engine-v77168.js
          grep -Fq 'instrumentIdentity:"CASH_INDEX"' cloudflare-worker/engine-v77168.js
      - name: Apply Index Cash price visibility hotfix
        run: |
          set -euo pipefail
          python3 scripts/v78_028_index_price_hotfix.py
          node --check cloudflare-worker/engine-v77168.js
          grep -Fq 'let q=null;try{q=await tdQuote(s,env);}catch{}const maps=await Promise.all' cloudflare-worker/engine-v77168.js
          grep -Fq 'fallbackInterval:pickedInterval' cloudflare-worker/engine-v77168.js
          grep -Fq 'fresh:false' cloudflare-worker/engine-v77168.js
          grep -Fq 'executionVerified:false' cloudflare-worker/engine-v77168.js
          grep -Fq 'analysisOnly:true' cloudflare-worker/engine-v77168.js
          grep -Fq 'fallback:true' cloudflare-worker/engine-v77168.js
          git diff --check
      - name: Commit V78-028 Index Cash hotfix
        run: |
          set -euo pipefail
          git config user.name 'V78 Signal Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-028 hotfix Index Cash native-first quote and safe timeframe fallback'
          echo "SHA028=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
      - name: Deploy V78-028 hotfix
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/d028
          V=$(grep -Eo 'Version ID: [0-9a-f-]+' /tmp/d028 | tail -1 | sed 's/Version ID: //')
          test -n "$V"
          echo "CF028=$V" >> "$GITHUB_ENV"
      - name: Live all-five Index Cash validation
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          sleep 8
          mkdir -p /tmp/i
          for S in NAS100 US30 US500 DEX JP225; do curl -fsS "$BASE/analyze?symbol=$S" -o "/tmp/i/$S.json"; done
          node <<'NODE'
          const fs=require('fs'),out=[];
          for(const s of ['NAS100','US30','US500','DEX','JP225']){
            const x=JSON.parse(fs.readFileSync('/tmp/i/'+s+'.json','utf8')),q=x.analysisQuote||x.quote||{};
            if(!(Number(q.price)>0)) throw Error(s+' price missing');
            if(q.fallback===true){
              if(q.fresh!==false||q.executionVerified!==false||q.analysisOnly!==true) throw Error(s+' unsafe fallback flags');
              if(['MARKET','MARKET_SIGNAL'].includes(x.status)) throw Error(s+' fallback admitted as market');
            }
            out.push(`${s} status=${x.status||'UNKNOWN'} price=${q.price} source=${q.source||'—'} fresh=${String(q.fresh)} fallback=${String(q.fallback===true)} interval=${q.fallbackInterval||'native'} age=${q.quoteAgeSec??'null'}`);
          }
          fs.writeFileSync('/tmp/i/live.txt',out.join('\n')+'\n'); console.log(out.join('\n'));
          NODE
      - name: Apply V78-030 WHY NOW propagation
        run: |
          set -euo pipefail
          test "$(grep -c 'function whyNowVi' cloudflare-worker/engine-v77168.js)" = 1
          cp cloudflare-worker/engine-v77168.js /tmp/pre030.js
          python3 scripts/v78_028_030_patch.py 030
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -c 'Why now:' cloudflare-worker/engine-v77168.js)" = 2
          test "$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'function hubSummary' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'function runHub' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'function actionableRank' cloudflare-worker/engine-v77168.js)" = 1
          git diff --check
      - name: Commit V78-030
        run: |
          set -euo pipefail
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-030 propagate WHY NOW to group scan and Hub top setups'
          echo "SHA030=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main
      - name: Deploy V78-030
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/d030
          V=$(grep -Eo 'Version ID: [0-9a-f-]+' /tmp/d030 | tail -1 | sed 's/Version ID: //')
          test -n "$V"
          echo "CF030=$V" >> "$GITHUB_ENV"
      - name: Live group and Hub validation
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          sleep 8
          curl -fsS "$BASE/run-now?group=forex" -o /tmp/forex.json
          curl -fsS "$BASE/hub" -o /tmp/hub.json
          node -e "JSON.parse(require('fs').readFileSync('/tmp/forex.json','utf8')); JSON.parse(require('fs').readFileSync('/tmp/hub.json','utf8')); console.log('live JSON PASS')"
      - name: Persist validation release lock and cleanup one-shots
        run: |
          set -euo pipefail
          git pull --rebase origin main
          cat > docs/ai-coengineer/V78-028_VALIDATION.txt <<EOF
          V78-028 SIGNAL HUB CLEANUP + INDEX CASH RELIABILITY
          ORIGINAL_SOURCE_SHA=72e363e14d7094ddb3b9a459d737360061f5250a
          HOTFIX_SOURCE_SHA=${SHA028}
          CLOUDFLARE_VERSION_ID=${CF028}
          NODE_CHECK=PASS
          WHY_NOW_FUNCTION_COUNT=1
          DEAD_PROP_PERSONAL_FUNCTIONS=0
          DEAD_HYRO_RENDER_REFERENCES=0
          INDEX_NATIVE_QUOTE_ATTEMPT=NATIVE_FIRST
          INDEX_NATIVE_TD_FRESHNESS=AGE_BASED
          INDEX_COMPLETED_TIMEFRAME_FALLBACK=ANALYSIS_ONLY_FRESH_FALSE
          INDEX_FALLBACK_MARKET_ADMISSION=BLOCKED
          INDEX_IDENTITY=CASH_INDEX
          V775_BOOKS_PRESERVED=true
          TRADING_STATE_RESET=false
          EXECUTION_AUTHORITY=NONE
          CLAUDE_PRODUCTION_API=PAUSED
          --- LIVE INDEX CASH ---
          $(cat /tmp/i/live.txt)
          EOF
          cat > docs/ai-coengineer/V78-030_VALIDATION.txt <<EOF
          V78-030 WHY NOW PROPAGATION
          SOURCE_SHA=${SHA030}
          CLOUDFLARE_VERSION_ID=${CF030}
          NODE_CHECK=PASS
          WHY_NOW_FUNCTION_COUNT=1
          WHY_NOW_WATCHLINE_HUBSUMMARY_COUNT=2
          WATCHLINE_DEFINITION_COUNT=1
          HUBSUMMARY_DEFINITION_COUNT=1
          RUNHUB_DEFINITION_COUNT=1
          ACTIONABLERANK_DEFINITION_COUNT=1
          RENDERING_ONLY=true
          LIVE_GROUP_JSON=PASS
          LIVE_HUB_JSON=PASS
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<EOF

          V78-028 — RESOLVED / DEPLOYED
          - Original source: 72e363e14d7094ddb3b9a459d737360061f5250a.
          - Index Cash hotfix source: ${SHA028}.
          - Cloudflare Version ID: ${CF028}.
          - Dead pre-Signal-only prop/personal fallback removed; single-analysis WHY NOW active.
          - Index Cash native quote is attempted before candle fallback; fallback is completed-timeframe visibility only and always fresh=false / analysisOnly=true / executionVerified=false.
          - All five Index Cash symbols passed live price validation.

          V78-030 — RESOLVED / DEPLOYED
          - Source: ${SHA030}.
          - Cloudflare Version ID: ${CF030}.
          - WHY NOW propagated to watchLine() and hubSummary(); rendering-only, no execution authority change.
          EOF
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-20
          LAST_RESULT: V78-028 and V78-030 RESOLVED / DEPLOYED.
          EOF
          for f in .github/workflows/v78-028-hotfix-030-final.yml .github/workflows/v78-028-final-runner.yml .github/workflows/v78-028-pr-dispatch.yml .github/workflows/v78-028-issue-dispatch.yml .github/workflows/v78-final-inspect.yml .github/workflows/v78-028-signal-index.yml; do git rm -f "$f" 2>/dev/null || true; done
          git rm -f cloudflare-worker/.v78-028-trigger 2>/dev/null || true
          git add docs/ai-coengineer/V78-028_VALIDATION.txt docs/ai-coengineer/V78-030_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-028 V78-030 persist production evidence and release lock'
          git push origin HEAD:main
