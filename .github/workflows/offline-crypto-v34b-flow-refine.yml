name: Offline Crypto V34B Flow Refine
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v34b_flow_refine.py'
      - '.github/workflows/offline-crypto-v34b-flow-refine.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto V34B zero-credit flow refinement
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v34b_flow_refine.py
