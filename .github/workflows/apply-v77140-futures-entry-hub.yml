name: Apply V77.14 Futures Actionable Entry Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77140_futures_entry_hub.js'
      - 'data/futures_knowledge.json'
      - '.github/workflows/apply-v77140-futures-entry-hub.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77140_DIAGNOSTIC.txt
          node --check scripts/apply_v77140_futures_entry_hub.js >> V77140_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77140_DIAGNOSTIC.txt
          node scripts/apply_v77140_futures_entry_hub.js >> V77140_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77140_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77140_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77140_DIAGNOSTIC.txt
          for t in 'V77.14.0' 'MASSIVE_API_KEY' 'runFutureGroup' 'futureContractSuffix' 'MARKET PLAN' 'LIMIT PLAN' 'LIMIT_GEOMETRY_REQUIRED' 'MARKET_GEOMETRY_REQUIRED' 'symbolPageKeyboard' 'symmarket:' 'FUTURE_SYMBOLS' 'SOFT_NO_EXTERNAL_NEWS_FEED'; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77140_DIAGNOSTIC.txt; else echo "$t=NO" >> V77140_DIAGNOSTIC.txt; fi
          done
          if grep -q 'function acquireLock(async function' cloudflare-worker/index.js || grep -q 'function groupKeyboard(function' cloudflare-worker/index.js; then echo 'MARKER_DUPLICATION=YES' >> V77140_DIAGNOSTIC.txt; else echo 'MARKER_DUPLICATION=NO' >> V77140_DIAGNOSTIC.txt; fi
          exit 0
      - name: Commit canonical Worker on pass
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77140_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77140_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77140_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77140_DIAGNOSTIC.txt && grep -q 'V77.14.0=YES' V77140_DIAGNOSTIC.txt && grep -q 'MARKER_DUPLICATION=NO' V77140_DIAGNOSTIC.txt; then
            git add cloudflare-worker/index.js data/futures_knowledge.json
          fi
          git commit -m 'Promote V77.14 Futures actionable entry Hub' || exit 0
          git push origin main
