name: Crypto Skill Registry Validate

on:
  push:
    branches:
      - main
      - crypto-agent-registry-v4
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'crypto-agent-skills/**'
      - 'tests/test_skill_registry.py'
      - '.github/workflows/crypto-skill-registry-validate.yml'
  pull_request:
    paths:
      - 'AI_SKILL_LIBRARY/**'
      - 'crypto-agent-skills/**'
      - 'tests/test_skill_registry.py'
      - '.github/workflows/crypto-skill-registry-validate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema

      - name: Registry regression tests
        run: python -m unittest discover -s tests -p 'test_skill_registry.py' -v

      - name: Brain validation via single entrypoint (validators, snapshot, release, index, consolidation)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA" --skip-tests
          echo "SKILL_GATEWAY_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
