name: Trigger V78-028 Signal Index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/v78-028-dispatch.yml']
permissions:
  actions: write
  contents: read
jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch V78-028
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run v78-028-signal-index.yml --repo "$GITHUB_REPOSITORY" --ref main
