name: Offline Forex EURUSD V31 Online Experts
on:
  push:
    paths:
      - 'scripts/offline_forex_eurusd_v31_online_experts.py'
      - '.github/workflows/offline-forex-eurusd-v31-online-experts.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run EURUSD online adaptive experts
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_eurusd_v31_online_experts.py
