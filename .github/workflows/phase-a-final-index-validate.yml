name: Phase A Final Canonical Index Validate

on:
  push:
    branches:
      - github-brain-vnext-phase-a-capability-evidence
    paths:
      - '.github/workflows/phase-a-final-index-validate.yml'

permissions:
  contents: write

jobs:
  rebuild-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: github-brain-vnext-phase-a-capability-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Rebuild index and run full canonical validation
        shell: bash
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$(git rev-parse HEAD)"
      - name: Commit canonical retrieval index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No retrieval index changes generated"
            exit 0
          fi
          git commit -m "build(brain): refresh final phase A retrieval index"
          git push origin HEAD:github-brain-vnext-phase-a-capability-evidence
