name: Verify V77.9.2 Markets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-v7792-markets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Test live markets
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V7792_MARKETS_CHECK.txt
          echo "CHECKED_AT=$(date -u +%FT%TZ)" >> V7792_MARKETS_CHECK.txt
          for spec in 'status:/status:30' 'crypto:/run-now?group=crypto:120' 'forex:/run-now?group=forex:90' 'metal:/run-now?group=metal:90' 'books:/books:30'; do
            name=${spec%%:*}; rest=${spec#*:}; path=${rest%:*}; timeout=${rest##*:}
            curl -sS --max-time "$timeout" "$BASE$path" -o "/tmp/$name.json"
            echo "$name CURL_EXIT=$?" >> V7792_MARKETS_CHECK.txt
            sleep 2
          done
          node - <<'NODE' >> V7792_MARKETS_CHECK.txt 2>&1
          const fs=require('fs');const read=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json','utf8'))}catch(e){return {parseError:e.message}}};
          const s=read('status');console.log('STATUS_VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('KV_OK='+(s.kv===true?'YES':'NO'));console.log('TD_OK='+(s.twelveData===true?'YES':'NO'));console.log('TG_OK='+(s.telegram===true?'YES':'NO'));
          for(const n of ['crypto','forex','metal']){const p=read(n),N=n.toUpperCase();console.log(N+'_OK='+(p.ok===true?'YES':'NO'));console.log(N+'_STATUS='+(p.status||'-'));console.log(N+'_VERSION='+(p.version||'-'));console.log(N+'_REQUESTED='+(p.requested??'-'));console.log(N+'_BROAD='+(p.broadOk??'-'));console.log(N+'_DEEP='+(p.deepOk??'-')+'/'+(p.deepRequested??'-'));console.log(N+'_ERRORS='+(p.diagnostics?.broadErrors||[]).length);console.log(N+'_ANALYSES='+(p.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.reason??'-')).join('|'));}
          const b=read('books');for(const g of ['forex','metal','crypto'])console.log('BOOK_'+g.toUpperCase()+'_EXEC='+(b[g]?.marketActive?.length||0)+'/'+(b[g]?.limitActive?.length||0)+'/'+(b[g]?.limitPending?.length||0)+':WATCH='+(b[g]?.watch?.length||0));
          NODE
          if grep -q 'STATUS_VERSION=V77.9.2' V7792_MARKETS_CHECK.txt && grep -q 'STATUS_OK=YES' V7792_MARKETS_CHECK.txt && grep -Eq 'CRYPTO_BROAD=([4-6][0-9])' V7792_MARKETS_CHECK.txt && grep -q 'CRYPTO_DEEP=3/3' V7792_MARKETS_CHECK.txt && grep -q 'FOREX_REQUESTED=28' V7792_MARKETS_CHECK.txt && grep -q 'METAL_REQUESTED=2' V7792_MARKETS_CHECK.txt && grep -q 'BOOK_FOREX_EXEC=0/0/0' V7792_MARKETS_CHECK.txt && grep -q 'BOOK_METAL_EXEC=0/0/0' V7792_MARKETS_CHECK.txt; then echo 'MARKETS_VERDICT=PASS'; else echo 'MARKETS_VERDICT=FAIL'; fi >> V7792_MARKETS_CHECK.txt
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V7792_MARKETS_CHECK.txt
          git commit -m 'Report V77.9.2 market verification' || exit 0
          git push origin main
