name: Apply V77.16.8 Role Navigation Hub
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77168_hub_navigation.js'
      - '.github/workflows/apply-v77168-hub-navigation.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          : > V77168_DIAGNOSTIC.txt
          node scripts/apply_v77168_hub_navigation.js >> V77168_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77168_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77168_DIAGNOSTIC.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77168_DIAGNOSTIC.txt
          grep -q 'version: "V77.16.8"' cloudflare-worker/index.js; echo "VERSION_OK=$?" >> V77168_DIAGNOSTIC.txt
          grep -q 'callback_data:"signal"' cloudflare-worker/index.js; echo "SIGNAL_OK=$?" >> V77168_DIAGNOSTIC.txt
          grep -q 'callback_data:"prop"' cloudflare-worker/index.js; echo "PROP_OK=$?" >> V77168_DIAGNOSTIC.txt
          grep -q 'callback_data:"personal"' cloudflare-worker/index.js; echo "PERSONAL_OK=$?" >> V77168_DIAGNOSTIC.txt
          grep -q 'callback_data:"symbols"' cloudflare-worker/index.js; echo "SYMBOL_OK=$?" >> V77168_DIAGNOSTIC.txt
      - name: Commit
        shell: bash
        run: |
          if ! grep -q 'MIGRATION_EXIT=0' V77168_DIAGNOSTIC.txt || ! grep -q 'SYNTAX_EXIT=0' V77168_DIAGNOSTIC.txt; then cat V77168_DIAGNOSTIC.txt; exit 1; fi
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js V77168_DIAGNOSTIC.txt
          git commit -m 'Promote V77.16.8 role navigation hub' || exit 0
          git push origin main
