name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-v78-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]

      - name: Install pinned Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Validate immutable Worker source
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check binance-control-plane.js
          grep -q 'binanceApprovalHub:true' index.js
          grep -q 'callback_data:"binance"' binance-control-plane.js
          grep -q '/binance/control/report' binance-control-plane.js
          grep -q '/binance/control/feed' binance-control-plane.js
          git diff --exit-code

      - name: Prepare Wrangler using existing KV
        working-directory: cloudflare-worker
        run: npm run prepare:wrangler

      - name: Deploy current main to Cloudflare
        working-directory: cloudflare-worker
        run: npx wrangler deploy

      - name: Deployment summary
        shell: bash
        run: |
          echo 'CLOUDFLARE_DEPLOY=PASS'
          echo 'HUB=EXISTING_TELEGRAM_HUB'
          echo 'BINANCE_BUTTON=ENABLED'
          echo 'EXECUTION_AUTHORITY=VPS_ONLY'
