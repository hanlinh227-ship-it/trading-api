name: Validate BTCUSDT Bybit Hyperscale
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: btcusdt-bybit-hyperscale-validation
  cancel-in-progress: true
jobs:
  validate-only:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Validate BTC-only source and runtime contracts
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          ! grep -q 'BYBIT_BTC_LIVE_ACK.*false' ../.github/workflows/deploy-cloudflare-worker.yml
          ! grep -q 'npx wrangler deploy' ../.github/workflows/deploy-cloudflare-worker.yml
          ! grep -q 'scheduled(event' index.js
          grep -q 'NONE_EVENT_DRIVER_ONLY' bybit-runtime-contract.js
          grep -q 'VPS_BRIDGE_SECRET_ONLY' bybit-control-plane.js
          echo 'BTC_GITHUB_CI_VALIDATION_ONLY=PASS'
      - name: Explain deployment authority
        shell: bash
        run: |
          echo 'Cloudflare Builds is the sole Worker deployment authority.'
          echo 'GitHub Actions validates source only and never changes Worker runtime variables.'
          echo 'BYBIT_BTC_LIVE_ACK is never forced by this workflow.'
