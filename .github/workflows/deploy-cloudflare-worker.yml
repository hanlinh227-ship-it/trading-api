name: Deploy Cloudflare Worker

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trading-v77-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard required deployment secrets
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "${TRADING_KV_NAMESPACE_ID:-}" || { echo 'Missing TRADING_KV_NAMESPACE_ID'; exit 1; }
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]] || { echo 'TRADING_KV_NAMESPACE_ID must be 32 hex chars'; exit 1; }

      - name: Install pinned Wrangler
        id: install
        run: npm install --no-audit --no-fund

      - name: Worker preflight
        id: preflight
        run: npm run check

      - name: Prepare Wrangler using existing KV only
        id: prepare
        run: npm run prepare:wrangler

      - name: Deploy production worker
        id: deploy
        run: npx wrangler deploy

      - name: Record deployment status
        if: always()
        working-directory: .
        shell: bash
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
        run: |
          set -euo pipefail
          mkdir -p docs/ai-coengineer
          cat > docs/ai-coengineer/CLOUDFLARE_DEPLOYMENT_STATUS.md <<EOF
          # CLOUDFLARE DEPLOYMENT STATUS

          Commit: \`${GITHUB_SHA}\`
          Run: \`${GITHUB_RUN_ID}\`
          Guard: \`${GUARD_OUTCOME}\`
          Preflight: \`${PREFLIGHT_OUTCOME}\`
          Prepare: \`${PREPARE_OUTCOME}\`
          Deploy: \`${DEPLOY_OUTCOME}\`
          Worker: \`trading-v77-scanner\`
          Expected Hub revision: \`HUB-R11-ENTRY-INTEL-SHADOW\`
          Updated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF
          git config user.name "V78 Deploy Bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/ai-coengineer/CLOUDFLARE_DEPLOYMENT_STATUS.md
          if ! git diff --cached --quiet; then
            git commit -m "Record Cloudflare deployment status for ${GITHUB_SHA}"
            git push
          fi
