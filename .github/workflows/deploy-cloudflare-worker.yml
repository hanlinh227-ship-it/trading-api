name: Deploy Cloudflare Signal Only V10

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-signal-v10-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]

      - name: Install pinned Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund

      - name: Validate Unified V10 V2 Worker source
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          node --check index.js
          node --check hub-v10-unified-entry.js
          node --check hub-v10-unified-v2.js
          node --check signal-v10-scheduled-v2.js
          node --check signal-v10-council.js
          node --check signal-v10-learning.js
          node --check binance-control-plane.js
          grep -q 'const VERSION="V10"' index.js
          grep -q 'hub-v10-unified-entry.js' index.js
          grep -q 'hub-v10-unified-v2.js' hub-v10-unified-entry.js
          grep -q 'signal-v10-scheduled-v2.js' hub-v10-unified-entry.js
          grep -q 'signalOnlySourceOfTruth:"V10"' index.js
          grep -q 'telegramUx:"V10_UNIFIED_LIVE_HISTORY_V2"' index.js
          grep -q 'candidateQuoteRefresh:true' index.js
          grep -q 'autoCandidateQuoteRefresh:true' index.js
          grep -q 'crypto:3\*60e3' signal-v10-scheduled-v2.js
          grep -q 'q?.fresh!==true' signal-v10-scheduled-v2.js
          grep -q 'binanceApprovalHub:true' index.js
          grep -q 'binanceAutoProjectSeparate:true' index.js
          grep -q 'callback_data:"binance"' binance-control-plane.js
          git diff --exit-code

      - name: Prepare Wrangler using existing KV
        working-directory: cloudflare-worker
        run: npm run prepare:wrangler

      - name: Deploy current main to Cloudflare
        working-directory: cloudflare-worker
        run: npx wrangler deploy

      - name: Deployment summary
        shell: bash
        run: |
          echo 'CLOUDFLARE_DEPLOY=PASS'
          echo 'SIGNAL_ONLY_VERSION=V10'
          echo 'UNIFIED_ENTRY=V2'
          echo 'CRYPTO_SCAN_CADENCE=3_MINUTES'
          echo 'VERIFIED_FRESH_QUOTES=REQUIRED'
          echo 'THREE_AI_COUNCIL=VPS_BATCH_WORKER'
          echo 'LIFECYCLE_LEARNING=ENABLED'
          echo 'OBSERVED_WIN_RATE=ENABLED'
          echo 'BINANCE_AUTO=SEPARATE_VPS_PROJECT'
