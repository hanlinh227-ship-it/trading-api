name: Deploy Unified Trading Hub
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-trading-hub-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      AI_BRIDGE_SERVICE_ID: ${{ secrets.AI_BRIDGE_SERVICE_ID }}
      V11_AI_BRIDGE_SERVICE_ID: ${{ secrets.V11_AI_BRIDGE_SERVICE_ID }}
      BYBIT_AUTO_ENABLED: 'false'
      BYBIT_AUTO_LIVE: 'false'
      FOREX_AUTO_LIVE: 'true'
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify VPS runtime path
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER=$(hostname)"
          curl -fsS --max-time 8 http://127.0.0.1:8789/health >/tmp/3ai-health.json
          python3 -c "import json; d=json.load(open('/tmp/3ai-health.json')); assert d.get('service')=='UNIFIED_3AI_BRIDGE'; assert int(d.get('providerCount',0))>=2; print('VPS_3AI_BRIDGE=PASS')"
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]
      - name: Install validate resolve and deploy
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          node --version
          npm --version
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy
      - name: Verify deployed revision
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            H="$(curl -fsS --connect-timeout 5 --max-time 15 "$WORKER_BASE_URL/bybit/health" || true)"
            if printf '%s' "$H" | grep -q "$GITHUB_SHA"; then echo 'UNIFIED_HUB_DEPLOY=PASS'; exit 0; fi
            sleep $((i*2))
          done
          exit 1
