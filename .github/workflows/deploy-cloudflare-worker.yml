name: Deploy Bybit Auto Hub
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bybit-auto-hub-cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      V11_AI_BRIDGE_SERVICE_ID: ${{ secrets.V11_AI_BRIDGE_SERVICE_ID }}
      BINANCE_BRIDGE_SECRET: ${{ secrets.BINANCE_BRIDGE_SECRET }}
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Setup Node
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Guard core deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"; test -n "${CLOUDFLARE_ACCOUNT_ID:-}"; test -n "${TRADING_KV_NAMESPACE_ID:-}"; test -n "${BINANCE_BRIDGE_SECRET:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]
      - name: Install pinned Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Validate Unified Auto Hub source of truth
        working-directory: cloudflare-worker
        run: npm run check
      - name: Prepare Wrangler with existing KV and VPC Service
        working-directory: cloudflare-worker
        run: npm run prepare:wrangler
      - name: Apply Binance bridge secret before final deploy
        working-directory: cloudflare-worker
        shell: bash
        run: printf '%s' "$BINANCE_BRIDGE_SECRET" | npx wrangler secret put BINANCE_BRIDGE_SECRET
      - name: Deploy Unified Bybit + MEME Paper production Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy
      - name: Verify active runtime revision and Bybit mode visibility
        shell: bash
        run: |
          set -euo pipefail
          H=""; C=""
          for i in 1 2 3 4 5 6; do F="$(mktemp)"; C="$(curl -sS --connect-timeout 5 --max-time 15 -o "$F" -w '%{http_code}' "$WORKER_BASE_URL/bybit/health" || true)"; H="$(cat "$F")"; rm -f "$F"; [ "$C" = 200 ] && break; sleep $((i*3)); done
          [ "$C" = 200 ] || { echo "$H" >&2; exit 22; }
          printf '%s' "$H" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s),w=process.env.GITHUB_SHA;if(j.runtimeRevision!==w)throw Error(`REVISION ${j.runtimeRevision} != ${w}`);if(j.exchange!=="BYBIT"||!j.execution)throw Error("BYBIT_VISIBILITY");console.log(`RUNTIME_REVISION=PASS ${w}`)})'
      - name: Verify MEME paper production runtime E2E
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -fsS --max-time 20 "$WORKER_BASE_URL/status")"
          DESIGN="$(curl -fsS --max-time 20 "$WORKER_BASE_URL/meme-auto/design")"
          BEFORE="$(curl -fsS --max-time 20 "$WORKER_BASE_URL/meme-auto/paper/state")"
          QUOTE="$(curl -fsS --max-time 60 "$WORKER_BASE_URL/meme-auto/quote-health")"
          RUN="$(curl -fsS --max-time 150 "$WORKER_BASE_URL/meme-auto/paper/run")"
          AFTER="$(curl -fsS --max-time 20 "$WORKER_BASE_URL/meme-auto/paper/state")"
          STATUS="$STATUS" DESIGN="$DESIGN" BEFORE="$BEFORE" QUOTE="$QUOTE" RUN="$RUN" AFTER="$AFTER" node <<'NODE'
          const S=JSON.parse(process.env.STATUS),D=JSON.parse(process.env.DESIGN),Q=JSON.parse(process.env.QUOTE),R=JSON.parse(process.env.RUN),A=JSON.parse(process.env.AFTER),x=R.state?.lastScan||{};const must=(v,m)=>{if(!v)throw Error(m)};
          console.log('MEME_QUOTE_DIAGNOSTICS='+JSON.stringify({ok:Q.ok,solToUsdc:Q.solToUsdc,usdcToSol:Q.usdcToSol}));
          console.log('MEME_SCAN_DIAGNOSTICS='+JSON.stringify({discovered:x.discovered,evaluated:x.evaluated,eligible:x.eligible,onchain:x.onchainProbes,routes:x.jupiterRouteProbes,sources:x.discoverySources,sourceErrors:x.sourceErrors,evaluationErrors:x.evaluationErrors}));
          must(S.hub==='BYBIT_AUTO_TRADE_ONLY','BYBIT_AUTHORITY'); must(S.signalV11Enabled===false,'V11');
          must(S.meme?.version==='MEME-AUTO-0.3.3-PAPER'&&S.meme?.mode==='PAPER_ONLY','MEME_STATUS');
          must(S.meme.executionEnabled===false&&S.meme.walletConnected===false&&S.meme.signingEnabled===false,'MEME_AUTH');
          must(S.meme.quoteHealth==='/meme-auto/quote-health','QUOTE_HEALTH_ROUTE_MISSING');
          must(D.version==='MEME-AUTO-0.3.3-PAPER'&&D.paperReady===true,'DESIGN');
          must(Q.ok===true&&Q.readOnly===true&&Q.noSigning===true&&Q.noExecution===true,'JUPITER_QUOTE_HEALTH');
          must(Q.solToUsdc?.ok===true&&Q.usdcToSol?.ok===true,'JUPITER_TWO_WAY_QUOTE');
          must(Number(Q.solToUsdc.routePlanCount)>0&&Number(Q.usdcToSol.routePlanCount)>0,'JUPITER_ROUTE_PLAN_EMPTY');
          must(R.ok&&R.version==='MEME-AUTO-0.3.3-PAPER'&&R.mode==='PAPER'&&R.noWallet&&R.noSigning&&R.noRealExecution,'PAPER_FLAGS');
          must(x.data==='JUPITER_TOKENS_FREE+DEXSCREENER_FREE+GECKOTERMINAL_FREE+SOLANA_RPC_FREE'&&x.quote==='JUPITER_FREE_QUOTE','DATA_ROUTES');
          must(Number(x.discovered)>0&&Array.isArray(x.discoverySources)&&x.discoverySources.length>0,'REAL_DISCOVERY');
          must(Number(x.evaluated)>0,'REAL_EVALUATION'); must(Number(x.onchainProbes)>0,'ONCHAIN_NOT_PROBED');
          must(A.lastScan?.at===x.at&&A.equityUsd===R.state.equityUsd&&A.cashUsd===R.state.cashUsd,'KV_PERSIST'); must(A.version==='MEME-AUTO-0.3.3-PAPER','STATE_VERSION');
          console.log(`MEME_PAPER_E2E=PASS quotes=2/2 discovered=${x.discovered} evaluated=${x.evaluated} eligible=${x.eligible} onchain=${x.onchainProbes} candidateRoutes=${x.jupiterRouteProbes} positions=${Object.keys(A.positions||{}).length} equity=${A.equityUsd}`);
          NODE
      - name: Deployment summary
        run: |
          echo 'CLOUDFLARE_DEPLOY=PASS'
          echo "RUNTIME_REVISION=$GITHUB_SHA"
          echo 'HUB=BYBIT_AUTO_TRADE_ONLY'
          echo 'BYBIT_AUTO=PRIMARY_EXECUTION_AUTHORITY'
          echo 'MEME_AUTO=PAPER_ONLY'
          echo 'MEME_JUPITER_TWO_WAY_QUOTE=PASS'
          echo 'MEME_PAPER_E2E=PASS'
          echo 'MEME_WALLET=OFF'
          echo 'MEME_SIGNING=OFF'
          echo 'MEME_REAL_EXECUTION=OFF'
