name: Deploy Cloudflare Signal V11

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trading-signal-v11-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      V11_AI_BRIDGE_SERVICE_ID: ${{ secrets.V11_AI_BRIDGE_SERVICE_ID }}
      BINANCE_BRIDGE_SECRET: ${{ secrets.BINANCE_BRIDGE_SECRET }}
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard core deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          test -n "${BINANCE_BRIDGE_SECRET:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]
      - name: Install pinned Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Validate V11 source of truth
        working-directory: cloudflare-worker
        run: npm run check
      - name: Prepare Wrangler with existing KV and VPC Service
        working-directory: cloudflare-worker
        run: npm run prepare:wrangler
      - name: Deploy V11 production Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy
      - name: Apply Binance bridge secret to active Worker
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BINANCE_BRIDGE_SECRET" | npx wrangler secret put BINANCE_BRIDGE_SECRET
      - name: Verify active runtime revision and Bybit mode visibility
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=""
          HTTP=""
          for attempt in 1 2 3 4 5 6; do
            BODY_FILE="$(mktemp)"
            HTTP="$(curl -sS --connect-timeout 5 --max-time 15 -o "$BODY_FILE" -w '%{http_code}' "$WORKER_BASE_URL/bybit/health" || true)"
            HEALTH="$(cat "$BODY_FILE")"
            rm -f "$BODY_FILE"
            echo "health attempt=$attempt http=$HTTP"
            if [ "$HTTP" = "200" ]; then
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep $((attempt * 3)); fi
          done
          if [ "$HTTP" != "200" ]; then
            echo "Cloudflare health did not stabilize after retries. Last HTTP=$HTTP" >&2
            printf '%s\n' "$HEALTH" >&2
            exit 22
          fi
          printf '%s\n' "$HEALTH"
          printf '%s' "$HEALTH" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s),want=process.env.GITHUB_SHA;
              if(j.runtimeRevision!==want) throw new Error(`RUNTIME_REVISION_MISMATCH active=${j.runtimeRevision} expected=${want}`);
              if(j.exchange!=="BYBIT") throw new Error("BYBIT_HEALTH_ROUTE_MISSING");
              if(!j.execution||typeof j.execution.liveAck!=="boolean"||typeof j.execution.scheduled!=="boolean") throw new Error("BYBIT_EXECUTION_VISIBILITY_MISSING");
              console.log(`RUNTIME_REVISION=PASS ${want}`);
              console.log(`BYBIT_MODE=${j.mode} LIVE_ACK=${j.execution.liveAck} SCHEDULED=${j.execution.scheduled}`);
            });'
      - name: Deployment summary
        run: |
          echo 'CLOUDFLARE_DEPLOY=PASS'
          echo "RUNTIME_REVISION=$GITHUB_SHA"
          echo 'SIGNAL_ONLY_VERSION=V11'
          echo 'RUNTIME=CLOUDFLARE_NATIVE'
          echo 'VPC_AI_BRIDGE=AI_BRIDGE'
          echo 'BINANCE_HEALTH=VPS_BRIDGE'
          echo 'BINANCE_BRIDGE_SECRET=APPLIED_AFTER_DEPLOY'
          echo 'BYBIT_RUNTIME_PREFLIGHT=/bybit/runtime/preflight'
          echo 'BYBIT_AUTO=SEPARATE_EXECUTION_AUTHORITY'
