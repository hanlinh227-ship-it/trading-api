name: Deploy Bybit Auto Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-auto-hub-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      V11_AI_BRIDGE_SERVICE_ID: ${{ secrets.V11_AI_BRIDGE_SERVICE_ID }}
      BINANCE_BRIDGE_SECRET: ${{ secrets.BINANCE_BRIDGE_SECRET }}
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard core deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          test -n "${BINANCE_BRIDGE_SECRET:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]
      - name: Install pinned Wrangler
        working-directory: cloudflare-worker
        run: npm install --no-audit --no-fund
      - name: Validate Unified Auto Hub source of truth
        working-directory: cloudflare-worker
        run: npm run check
      - name: Prepare Wrangler with existing KV and VPC Service
        working-directory: cloudflare-worker
        run: npm run prepare:wrangler
      - name: Deploy Unified Bybit + MEME Paper production Worker
        working-directory: cloudflare-worker
        run: npx wrangler deploy
      - name: Apply Binance bridge secret to active Worker
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$BINANCE_BRIDGE_SECRET" | npx wrangler secret put BINANCE_BRIDGE_SECRET
      - name: Verify active runtime revision and Bybit mode visibility
        shell: bash
        run: |
          set -euo pipefail
          HEALTH=""; HTTP=""
          for attempt in 1 2 3 4 5 6; do
            BODY_FILE="$(mktemp)"
            HTTP="$(curl -sS --connect-timeout 5 --max-time 15 -o "$BODY_FILE" -w '%{http_code}' "$WORKER_BASE_URL/bybit/health" || true)"
            HEALTH="$(cat "$BODY_FILE")"; rm -f "$BODY_FILE"
            echo "health attempt=$attempt http=$HTTP"
            if [ "$HTTP" = "200" ]; then break; fi
            if [ "$attempt" -lt 6 ]; then sleep $((attempt * 3)); fi
          done
          if [ "$HTTP" != "200" ]; then printf '%s\n' "$HEALTH" >&2; exit 22; fi
          printf '%s' "$HEALTH" | node -e '
            let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
              const j=JSON.parse(s),want=process.env.GITHUB_SHA;
              if(j.runtimeRevision!==want) throw new Error(`RUNTIME_REVISION_MISMATCH active=${j.runtimeRevision} expected=${want}`);
              if(j.exchange!=="BYBIT") throw new Error("BYBIT_HEALTH_ROUTE_MISSING");
              if(!j.execution||typeof j.execution.liveAck!=="boolean"||typeof j.execution.scheduled!=="boolean") throw new Error("BYBIT_EXECUTION_VISIBILITY_MISSING");
              console.log(`RUNTIME_REVISION=PASS ${want}`);
            });'
      - name: Verify MEME paper production runtime E2E
        shell: bash
        run: |
          set -euo pipefail
          STATUS="$(curl -fsS --connect-timeout 5 --max-time 20 "$WORKER_BASE_URL/status")"
          DESIGN="$(curl -fsS --connect-timeout 5 --max-time 20 "$WORKER_BASE_URL/meme-auto/design")"
          BEFORE="$(curl -fsS --connect-timeout 5 --max-time 20 "$WORKER_BASE_URL/meme-auto/paper/state")"
          RUN="$(curl -fsS --connect-timeout 5 --max-time 120 "$WORKER_BASE_URL/meme-auto/paper/run")"
          AFTER="$(curl -fsS --connect-timeout 5 --max-time 20 "$WORKER_BASE_URL/meme-auto/paper/state")"
          STATUS="$STATUS" DESIGN="$DESIGN" BEFORE="$BEFORE" RUN="$RUN" AFTER="$AFTER" node <<'NODE'
          const status=JSON.parse(process.env.STATUS),design=JSON.parse(process.env.DESIGN),before=JSON.parse(process.env.BEFORE),run=JSON.parse(process.env.RUN),after=JSON.parse(process.env.AFTER);
          const scan=run.state?.lastScan||{};
          console.log('MEME_SCAN_DIAGNOSTICS='+JSON.stringify({discovered:scan.discovered,evaluated:scan.evaluated,eligible:scan.eligible,sources:scan.discoverySources,sourceErrors:scan.sourceErrors,evaluationErrors:scan.evaluationErrors}));
          const must=(x,m)=>{if(!x)throw new Error(m)};
          must(status.hub==='BYBIT_AUTO_TRADE_ONLY','BYBIT_EXECUTION_AUTHORITY_CHANGED');
          must(status.signalV11Enabled===false,'SIGNAL_V11_NOT_OFF');
          must(status.meme?.version==='MEME-AUTO-0.3.2-PAPER','MEME_STATUS_VERSION');
          must(status.meme?.mode==='PAPER_ONLY','MEME_STATUS_MODE');
          must(status.meme?.executionEnabled===false&&status.meme?.walletConnected===false&&status.meme?.signingEnabled===false,'MEME_AUTHORITY_LOCK_FAILED');
          must(design.version==='MEME-AUTO-0.3.2-PAPER'&&design.mode==='PAPER_ONLY'&&design.paperReady===true,'MEME_DESIGN_NOT_READY');
          must(run.ok===true&&run.version==='MEME-AUTO-0.3.2-PAPER'&&run.mode==='PAPER','MEME_PAPER_RUN_FAILED');
          must(run.noWallet===true&&run.noSigning===true&&run.noRealExecution===true,'MEME_PAPER_SAFETY_FLAGS_FAILED');
          must(scan.data==='DEXSCREENER_FREE+GECKOTERMINAL_FREE+SOLANA_RPC_FREE','MEME_DATA_ROUTE_FAILED');
          must(scan.quote==='JUPITER_LITE_FREE','MEME_QUOTE_ROUTE_FAILED');
          must(Number(scan.discovered)>0,'MEME_REAL_DISCOVERY_EMPTY');
          must(Array.isArray(scan.discoverySources)&&scan.discoverySources.length>0,'MEME_DISCOVERY_SOURCE_NOT_CONFIRMED');
          must(typeof scan.evaluated==='number'&&Array.isArray(run.state?.watch),'MEME_SCAN_TELEMETRY_FAILED');
          must(after.lastScan?.at===scan.at,'MEME_KV_PERSIST_FAILED');
          must(after.equityUsd===run.state.equityUsd&&after.cashUsd===run.state.cashUsd,'MEME_KV_BALANCE_PERSIST_FAILED');
          must(after.version==='MEME-AUTO-0.3.2-PAPER','MEME_STATE_VERSION_FAILED');
          console.log(`MEME_PAPER_E2E=PASS discovered=${after.lastScan.discovered} evaluated=${after.lastScan.evaluated} eligible=${after.lastScan.eligible} positions=${Object.keys(after.positions||{}).length} equity=${after.equityUsd}`);
          NODE
      - name: Deployment summary
        run: |
          echo 'CLOUDFLARE_DEPLOY=PASS'
          echo "RUNTIME_REVISION=$GITHUB_SHA"
          echo 'HUB=BYBIT_AUTO_TRADE_ONLY'
          echo 'SIGNAL_V11_RUNTIME=OFF'
          echo 'BYBIT_AUTO=PRIMARY_EXECUTION_AUTHORITY'
          echo 'MEME_AUTO=PAPER_ONLY'
          echo 'MEME_PAPER_E2E=PASS'
          echo 'MEME_WALLET=OFF'
          echo 'MEME_SIGNING=OFF'
          echo 'MEME_REAL_EXECUTION=OFF'
