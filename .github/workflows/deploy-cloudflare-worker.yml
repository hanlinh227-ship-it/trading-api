name: Deploy Unified Trading Hub
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/deploy-cloudflare-worker.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unified-trading-hub-cloudflare-production
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      AI_BRIDGE_SERVICE_ID: ${{ secrets.AI_BRIDGE_SERVICE_ID }}
      V11_AI_BRIDGE_SERVICE_ID: ${{ secrets.V11_AI_BRIDGE_SERVICE_ID }}
      BYBIT_AUTO_ENABLED: 'true'
      BYBIT_AUTO_LIVE: 'true'
      FOREX_AUTO_LIVE: 'true'
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify VPS runtime path
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER=$(hostname)"
          curl -fsS --max-time 8 http://127.0.0.1:8789/health >/tmp/3ai-health.json
          python3 -c "import json; d=json.load(open('/tmp/3ai-health.json')); assert d.get('service')=='UNIFIED_3AI_BRIDGE'; assert int(d.get('providerCount',0))>=2; print('VPS_3AI_BRIDGE=PASS')"
      - name: Validate Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          [[ "$TRADING_KV_NAMESPACE_ID" =~ ^[A-Fa-f0-9]{32}$ ]]
      - name: Install validate resolve and deploy
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          grep -q '"BYBIT_AUTO_ENABLED": "true"' wrangler.jsonc
          grep -q '"BYBIT_AUTO_LIVE": "true"' wrangler.jsonc
          npx wrangler deploy
      - name: Fast verify deployed LIVE runtime
        shell: bash
        run: |
          set -euo pipefail
          sleep 4
          CONTRACT="$(curl -fsS --connect-timeout 5 --max-time 15 "$WORKER_BASE_URL/runtime/contract")"
          printf '%s\n' "$CONTRACT" | GITHUB_SHA="$GITHUB_SHA" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.ok||x.runtimeRevision!==process.env.GITHUB_SHA)process.exit(2);console.log('RUNTIME_REVISION='+x.runtimeRevision)})"
          HEALTH="$(curl -sS --connect-timeout 5 --max-time 20 "$WORKER_BASE_URL/bybit/health")"
          printf '%s\n' "$HEALTH" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);console.log(JSON.stringify({ok:x.ok,mode:x.mode,authenticated:x.authenticated,privateTransport:x.privateTransport,marketTransport:x.marketTransport,execution:x.execution,account:x.account}));if(x.mode!=='LIVE')process.exit(3);if(x.privateTransport!=='VPS_BYBIT_PRIVATE_PROXY')process.exit(4);if(!x.execution?.scheduled)process.exit(5);if(!x.execution?.ready)process.exit(6);})"
          echo 'BYBIT_LIVE_RUNTIME=PASS'
