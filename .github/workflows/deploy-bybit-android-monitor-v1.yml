name: Deploy Bybit Android Monitor V1
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-android-monitor-v1-trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bybit-android-monitor-v1
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - name: Finalize credentialless monitor telemetry
        run: python3 .github/scripts/finalize-bybit-android-monitor-v1-readonly.py
      - name: Validate monitor and unchanged trading core
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile bybit-live-bridge/bybit_live_bridge.py
          grep -q "wsTelemetry" bybit-live-bridge/bybit_live_bridge.py
          ! grep -q "'/bybit/telemetry'" bybit-live-bridge/bybit_live_bridge.py
          cd cloudflare-worker
          npm install --no-audit --no-fund
          npm run check
          node -e "import('./bybit-android-monitor.js').then(m=>{if(typeof m.handleBybitAndroidMonitor!=='function'||typeof m.buildBybitAndroidSnapshot!=='function')process.exit(7);console.log('ANDROID_MONITOR_MODULE=PASS')})"
          grep -q "BYBIT_ANDROID_MONITOR_V1" bybit-android-monitor-contract.js
          grep -q "monitorUsesPrivateBybitCredentials:false" bybit-android-monitor-contract.js
          grep -q "bybitApiSecretAccessedByMonitor:false" bybit-android-monitor.js
          grep -q "handleBybitAndroidMonitor" index.js
          grep -q "BYBIT-MULTI-STATEFLOW-4.6.0" bybit-runtime-contract.js
          grep -q "BYBIT_MULTI_ASSET_RUNTIME_V24_BROAD_SCALP_OPPORTUNITY_NETWORK" bybit-runtime-contract.js
      - name: Commit telemetry-only source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bybit-live-bridge/bybit_live_bridge.py cloudflare-worker/bybit-android-monitor.js
          if ! git diff --cached --quiet; then
            git commit -m 'Finalize credentialless Android Monitor V1 telemetry'
            git push origin HEAD:main
          fi
      - name: Upgrade actual V11 bridge with rollback guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(sudo systemctl show v11-manual-ai-bridge.service -p ActiveState --value)" = active
          test "$(sudo systemctl show v11-manual-ai-bridge.service -p EnvironmentFiles --value | awk '{print $1}')" = /etc/trading-v11-ai.env
          sudo cp /usr/local/bin/v11-manual-ai-bridge "$RUNNER_TEMP/v11-manual-ai-bridge.pre-android-monitor"
          rollback() {
            echo 'Bridge WS telemetry activation failed; restoring previous bridge binary'
            sudo cp "$RUNNER_TEMP/v11-manual-ai-bridge.pre-android-monitor" /usr/local/bin/v11-manual-ai-bridge || true
            sudo chmod 0755 /usr/local/bin/v11-manual-ai-bridge || true
            sudo systemctl restart v11-manual-ai-bridge.service || true
          }
          trap rollback ERR
          sudo cp bybit-live-bridge/bybit_live_bridge.py /usr/local/bin/v11-manual-ai-bridge
          sudo chmod 0755 /usr/local/bin/v11-manual-ai-bridge
          sudo systemctl restart v11-manual-ai-bridge.service
          sleep 12
          sudo systemctl is-active --quiet v11-manual-ai-bridge.service
          BRIDGE=$(curl -fsS --max-time 30 http://127.0.0.1:8789/health)
          BRIDGE="$BRIDGE" node <<'NODE'
          const x=JSON.parse(process.env.BRIDGE),w=x.wsTelemetry||{};
          const pass=x.ok===true&&x.service==='BYBIT_MULTI_ASSET_LIVE_BRIDGE'&&x.maxWsSymbols===48&&Number(w.connectedCount)>0&&Number(w.readyCount)>0&&w.p50DataAgeMs!==undefined&&Array.isArray(w.staleSymbols);
          console.log(JSON.stringify({pass,service:x.service,maxWsSymbols:x.maxWsSymbols,wsTelemetry:{healthy:w.healthy,connectedCount:w.connectedCount,readyCount:w.readyCount,freshCount:w.freshCount,totalCount:w.totalCount,p50DataAgeMs:w.p50DataAgeMs,p95DataAgeMs:w.p95DataAgeMs,maxDataAgeMs:w.maxDataAgeMs,staleCount:(w.staleSymbols||[]).length}},null,2));
          if(!pass)process.exit(9);
          NODE
          trap - ERR
      - name: Deploy Worker telemetry routes preserving runtime variables
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          REV=$(git rev-parse HEAD)
          GITHUB_SHA="$REV" npm run deploy
      - name: Verify production monitor contract and trading isolation
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://trading-v77-scanner.hanlinh227.workers.dev
          T="$RUNNER_TEMP/android-monitor-v1"; mkdir -p "$T"
          for i in $(seq 1 20); do
            curl -fsS --max-time 30 "$BASE/bybit/monitor/bootstrap" > "$T/bootstrap.json" || true
            OK=$(T="$T" node -e "const fs=require('fs'),p=process.env.T;try{const x=JSON.parse(fs.readFileSync(p+'/bootstrap.json'));process.stdout.write(x.schemaVersion==='BYBIT_ANDROID_MONITOR_V1'?'1':'0')}catch{process.stdout.write('0')}")
            [ "$OK" = 1 ] && break
            sleep 4
          done
          curl -fsS --max-time 30 "$BASE/bybit/monitor/auth/health" > "$T/auth.json"
          curl -fsS --max-time 45 "$BASE/bybit/health" > "$T/health.json"
          curl -fsS --max-time 30 "$BASE/runtime/contract" > "$T/contract.json"
          CODE=$(curl -sS -o "$T/unauth.json" -w '%{http_code}' --max-time 30 "$BASE/bybit/monitor/snapshot")
          test "$CODE" = 401
          T="$T" node <<'NODE'
          const fs=require('fs'),p=process.env.T,read=f=>JSON.parse(fs.readFileSync(`${p}/${f}`,'utf8'));
          const b=read('bootstrap.json'),a=read('auth.json'),h=read('health.json'),c=read('contract.json'),u=read('unauth.json');
          const checks={schema:b.schemaVersion==='BYBIT_ANDROID_MONITOR_V1',readOnly:b.readOnly===true,snapshotRoute:b.routes?.snapshot==='/bybit/monitor/snapshot',wsRoute:b.routes?.websocket==='/bybit/monitor/ws',monitorNoTrading:b.capabilities?.tradingControls===false,monitorTokenSeparate:b.capabilities?.monitorTokenSeparate===true,noPrivateCredentials:b.capabilities?.monitorUsesPrivateBybitCredentials===false,authHealth:a.ok===true,tradeVersion:h.version==='BYBIT-MULTI-STATEFLOW-4.6.0',tradeLive:h.mode==='LIVE',tradeReady:h.execution?.ready===true,contract:c.version==='BYBIT_MULTI_ASSET_RUNTIME_V24_BROAD_SCALP_OPPORTUNITY_NETWORK',unauthorizedFailsClosed:u.ok===false};
          const pass=Object.values(checks).every(Boolean),out={pass,checkedAt:new Date().toISOString(),monitor:{schemaVersion:b.schemaVersion,routes:b.routes,capabilities:b.capabilities,authConfigured:a.configured,paired:a.paired},trading:{version:h.version,mode:h.mode,ready:h.execution?.ready,runtimeRevision:h.runtimeRevision,contract:c.version},checks};
          console.log(JSON.stringify(out,null,2));fs.writeFileSync(`${p}/audit.json`,JSON.stringify(out,null,2)+'\n');if(!pass)process.exit(11);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: bybit-android-monitor-v1-audit
          path: ${{ runner.temp }}/android-monitor-v1/audit.json
