name: Build Deploy SignalHub V3.23.1 Final APK

on:
  push:
    branches: [signalhub-v3231-entry-precision-cutrate]
    paths:
      - '.github/workflows/build-deploy-signalhub-v3231-final-apk.yml'
      - 'scripts/patch_signalhub_v3231_final_runtime.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASE: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}

      - name: Materialize final V3.23.1 runtime
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/patch_signalhub_v3227_market_only_health_seven.py');s=p.read_text()
          old="a=block(a,'    private void renderSignals(boolean animate){','    private String performanceSummary(){',render,'renderSignals')"
          new="a=block(a,'    private void renderSignals(boolean animate){','    private void addCryptoSignalGroup(',render,'renderSignals')"
          if old in s:s=s.replace(old,new,1)
          p.write_text(s)
          PY
          python3 scripts/fix_patch_signalhub_v3230_markers.py
          python3 scripts/patch_signalhub_v3225_realtime_unique_book.py
          python3 scripts/patch_signalhub_v3225_build_compat.py
          python3 scripts/patch_signalhub_v3226_balanced_realtime_book.py
          python3 scripts/patch_signalhub_v3227_market_only_health_seven.py
          python3 scripts/patch_signalhub_v3227_runtime_fix.py
          python3 scripts/patch_signalhub_v3230_resilient_ledger_clean.py
          python3 scripts/patch_signalhub_v3230_postfix.py
          python3 scripts/patch_signalhub_v3230_provider_failover.py
          python3 scripts/patch_signalhub_v3230_integrity_refresh.py
          python3 scripts/patch_signalhub_v3231_entry_precision_cutrate.py
          python3 scripts/patch_signalhub_v3231_admission_balance.py
          python3 scripts/patch_signalhub_v3231_scan_runtime_fix.py
          python3 scripts/patch_signalhub_v3231_final_runtime.py
          node --check signalhub-worker/gateway-v3.js
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text();a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text();c=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java').read_text();g=Path('signalhub-android/app/build.gradle').read_text()
          assert 'SIGNALHUB-V3-GATEWAY-3.23.1' in w
          assert 'async function retireAllLegacyActiveSignals' in w
          assert 'async function getActiveBook(env)' in w
          assert "healthModel:'V3231_PRECISION_HEALTH_HYSTERESIS_1S'" in w
          assert "watchR:-0.38" in w and "persistentCutR:-0.86" in w and "emergencyCutR:-0.96" in w
          assert 'autoCutRateDefinition' in w and 'currentVersionAutoCutRate' in w
          assert 'APP_VERSION="3.23.1"' in a and 'TỈ LỆ CUT' in a
          assert 'SignalHub-Android/3.23.1' in c and 'versionCode 39' in g and "versionName '3.23.1'" in g
          print('SOURCE AUDIT PASS')
          PY

      - name: Build APK
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v3231-worker
          cd signalhub-android
          gradle :app:assembleDebug --stacktrace --no-daemon
          cd ..
          unzip -t signalhub-android/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Verify production runtime and metrics
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 60); do
            curl -fsS --max-time 20 "$BASE/v3/status?final=$RANDOM-$n" >/tmp/status.json || true
            if python3 - <<'PY'
          import json
          try:x=json.load(open('/tmp/status.json'))
          except:raise SystemExit(1)
          assert x.get('ok') is True and x.get('version')=='SIGNALHUB-V3-GATEWAY-3.23.1',x
          assert ((x.get('decisionPolicy') or {}).get('healthModel'))=='V3231_PRECISION_HEALTH_HYSTERESIS_1S',x.get('decisionPolicy')
          hp=x.get('healthPolicy') or {};assert hp.get('persistentCutR')==-0.86 and hp.get('emergencyCutR')==-0.96,hp
          PY
            then ready=1;break;fi
            sleep 2
          done
          test "$ready" = 1
          for style in SWING SCALP; do
            code=$(curl -sS --max-time 330 -o "/tmp/$style.json" -w '%{http_code}' "$BASE/v3/scan?market=CRYPTO&style=$style&final=$RANDOM" || true)
            echo "$style HTTP=$code"
            python3 - "$style" <<'PY'
          import json,sys
          x=json.load(open('/tmp/'+sys.argv[1]+'.json'))
          print(sys.argv[1],{k:x.get(k) for k in ['ok','status','evaluated','actionable','strictConfirmed','safeFill','created','activeAfter','error','detail']})
          assert x.get('error')!='SCAN_RUNTIME_ERROR',x
          assert x.get('ok') is True,x
          PY
          done
          for st in SCALP SWING; do curl -fsS --max-time 120 "$BASE/v3/performance?market=CRYPTO&style=$st&final=$RANDOM" >"/tmp/perf-$st.json"; done
          python3 - <<'PY'
          import json
          for st in ('SCALP','SWING'):
              x=json.load(open('/tmp/perf-'+st+'.json'));p=x.get('performance') or {}
              assert x.get('ok') is True,x
              for k in ('winRateResolved','autoCut','autoCutRate','autoCutRateLabel','autoCutRateDefinition','currentVersionAutoCutRate','currentVersionAutoCutRateLabel'): assert k in p,(st,k,p)
              assert p.get('autoCutRateDefinition')=='AUTO_CUT/(TP+SL+AUTO_CUT)',p
          print('PRODUCTION RUNTIME + CUT RATE PASS')
          PY

      - name: Stage final APK
        run: |
          set -euo pipefail
          mkdir -p out
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk out/SignalHub-v3.23.1-Entry-Precision-Cut-Rate-Final.apk
          unzip -t out/SignalHub-v3.23.1-Entry-Precision-Cut-Rate-Final.apk
          sha256sum out/SignalHub-v3.23.1-Entry-Precision-Cut-Rate-Final.apk | tee out/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-v3.23.1-Entry-Precision-Cut-Rate-Final
          path: |
            out/SignalHub-v3.23.1-Entry-Precision-Cut-Rate-Final.apk
            out/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
