name: Brain V4 Selective Fusion Reindex

on:
  push:
    branches: [brain-v4-selective-fusion-20260914]
    paths:
      - 'AI_SKILL_LIBRARY/AI_GLOBAL_CHECKPOINT.md'
      - '.github/workflows/brain-v4-selective-fusion-reindex.yml'

permissions:
  contents: write

jobs:
  reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain-v4-selective-fusion-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Rebuild retrieval index and validate mergeable state
        shell: bash
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --check --root .
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/compile_skill_gateway.py --source-sha "$SOURCE_SHA" --output /tmp/skill-gateway-snapshot.json
          python AI_SKILL_LIBRARY/v4/tools/validate_skill_gateway_snapshot.py /tmp/skill-gateway-snapshot.json
          git rm .github/workflows/brain-v4-selective-fusion-reindex.yml
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"
      - name: Commit fresh index and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Brain 4.7 retrieval index"
          git push origin "HEAD:brain-v4-selective-fusion-20260914"
