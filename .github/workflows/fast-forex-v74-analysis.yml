name: Fast Forex V74 Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - "data/forex_fast_analysis_request.txt"

permissions:
  contents: read

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Analyze requested Forex symbol
        shell: bash
        run: |
          SYMBOL=$(head -n 1 data/forex_fast_analysis_request.txt | tr -d '[:space:]')
          echo "SYMBOL=$SYMBOL"
          curl --silent --show-error --location --fail \
            "https://forex-chart-api.hanlinh227.workers.dev/analysis/$SYMBOL" \
            -o analysis.json
          echo "FAST_FOREX_ANALYSIS_JSON_START"
          cat analysis.json
          echo
          echo "FAST_FOREX_ANALYSIS_JSON_END"
