name: V78-012 Apply Shared ATR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-012-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard and apply V78-012
        shell: bash
        run: |
          set -euo pipefail
          ENGINE=cloudflare-worker/engine-v77168.js
          SCANNER=cloudflare-worker/hyro-scanner.js
          [ "$(git hash-object "$ENGINE")" = "26fba0ee017fc7d821a8685af88fc0a56a3327d5" ] || { echo 'ENGINE_SHA_MISMATCH'; exit 41; }
          [ "$(git hash-object "$SCANNER")" = "c8f96fd9130d249f9a155559813b20c0e8711f5a" ] || { echo 'SCANNER_SHA_MISMATCH'; exit 42; }
          python - <<'PY'
          from pathlib import Path

          provider = Path('cloudflare-worker/providers/indicators.js')
          provider.parent.mkdir(parents=True, exist_ok=True)
          provider.write_text('''// V78-012 — shared ATR primitive only.\n// EMA and RSI intentionally remain local: their current implementations are not semantically equivalent.\nexport function atrFromHLC(c,n=14){if(c.length<n+1)return null;const tr=[];for(let i=1;i<c.length;i++){const hi=c[i].high??c[i].h,lo=c[i].low??c[i].l,pc=c[i-1].close??c[i-1].c;tr.push(Math.max(hi-lo,Math.abs(hi-pc),Math.abs(lo-pc)));}return tr.slice(-n).reduce((a,b)=>a+b,0)/n;}\n''')

          engine = Path('cloudflare-worker/engine-v77168.js')
          s = engine.read_text()
          old = 'import SYMBOL_KNOWLEDGE from "../data/symbol_knowledge_registry.json" with { type: "json" };\n'
          new = old + 'import {atrFromHLC} from "./providers/indicators.js";\n'
          assert s.count(old) == 1 and 'import {atrFromHLC} from "./providers/indicators.js";' not in s
          s = s.replace(old,new,1)
          old_atr = 'function atr(c,n=14){if(c.length<n+1)return null;const tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(c[i].high-c[i].low,Math.abs(c[i].high-c[i-1].close),Math.abs(c[i].low-c[i-1].close)));return tr.slice(-n).reduce((a,b)=>a+b,0)/n;}'
          new_atr = 'const atr=(c,n=14)=>atrFromHLC(c,n);'
          assert s.count(old_atr) == 1
          s = s.replace(old_atr,new_atr,1)
          engine.write_text(s)

          scanner = Path('cloudflare-worker/hyro-scanner.js')
          s = scanner.read_text()
          old = 'const n=v=>{const x=Number(v);return Number.isFinite(x)?x:null;};\n'
          new = 'import {atrFromHLC} from "./providers/indicators.js";\n\n' + old
          assert s.count(old) == 1 and 'import {atrFromHLC} from "./providers/indicators.js";' not in s
          s = s.replace(old,new,1)
          old_atr = 'function atr(c,len=14){if(c.length<len+1)return null;const tr=[];for(let i=1;i<c.length;i++)tr.push(Math.max(c[i].h-c[i].l,Math.abs(c[i].h-c[i-1].c),Math.abs(c[i].l-c[i-1].c)));return tr.slice(-len).reduce((a,b)=>a+b,0)/len;}'
          new_atr = 'const atr=(c,len=14)=>atrFromHLC(c,len);'
          assert s.count(old_atr) == 1
          s = s.replace(old_atr,new_atr,1)
          scanner.write_text(s)
          PY
      - name: Validate V78-012
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/providers/indicators.js
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hyro-scanner.js
          test "$(grep -c 'import {atrFromHLC} from "./providers/indicators.js";' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c 'import {atrFromHLC} from "./providers/indicators.js";' cloudflare-worker/hyro-scanner.js)" = 1
          test "$(grep -c '^function atr(' cloudflare-worker/engine-v77168.js || true)" = 0
          test "$(grep -c '^function atr(' cloudflare-worker/hyro-scanner.js || true)" = 0
          test "$(grep -c '^function ema(' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c '^function rsi(' cloudflare-worker/engine-v77168.js)" = 1
          test "$(grep -c '^function ema(' cloudflare-worker/hyro-scanner.js)" = 1
          test "$(grep -c '^function rsi(' cloudflare-worker/hyro-scanner.js)" = 1
          echo 'V78-012_SYNTAX_AND_GREP_PASS'
          git diff --check
          git diff -- cloudflare-worker/providers/indicators.js cloudflare-worker/engine-v77168.js cloudflare-worker/hyro-scanner.js
      - name: Commit V78-012
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78 Co-engineering Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/providers/indicators.js cloudflare-worker/engine-v77168.js cloudflare-worker/hyro-scanner.js
          git commit -m 'V78-012 share ATR primitive; keep divergent EMA/RSI local'
          git push origin HEAD:main
