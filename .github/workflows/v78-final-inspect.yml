name: V78 Final Run Inspector

on:
  issues:
    types: [opened]

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    if: github.event.issue.title == 'INSPECT-V78-FINAL'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture latest final-runner status and failed logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --workflow v78-028-final-runner.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url --jq '.[0].databaseId')
          gh run list --workflow v78-028-final-runner.yml --limit 1 --json databaseId,status,conclusion,headSha,createdAt,url > /tmp/meta.json
          { echo '=== META ==='; cat /tmp/meta.json; echo; echo '=== FAILED LOGS ==='; gh run view "$RUN" --log-failed || true; } > docs/ai-coengineer/V78_FINAL_RUN_DIAGNOSTIC.txt
          git config user.name 'V78 Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ai-coengineer/V78_FINAL_RUN_DIAGNOSTIC.txt
          git commit -m 'Record V78 final runner diagnostic'
          git push origin HEAD:main
