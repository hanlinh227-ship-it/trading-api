name: Free Data Cached Precision V3
on:
  push:
    paths:
      - 'scripts/free_data_cached_precision_v3.py'
      - '.github/workflows/free-data-cached-precision-v3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cached:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run cached all-symbol precision evolution
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/free_data_cached_precision_v3.py
