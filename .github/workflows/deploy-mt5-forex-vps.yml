name: Deploy MT5 Forex VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mt5/ForexAutoThe5ers.mq5'
      - 'vps/mt5-forex/**'
      - '.github/workflows/deploy-mt5-forex-vps.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 30
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_ACCOUNT_ENDPOINT: ${{ secrets.MT5_ACCOUNT_ENDPOINT }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}

    steps:
      - name: Assert authorized VPS and protected inputs
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "trading-vps"
          FQDN="$(hostname -f 2>/dev/null || hostname)"; HOST="$(hostname)"
          [[ "$FQDN" = "59670.vpsvinahost.vn" || "$HOST" = "59670" ]] || { echo 'ERROR: unauthorized MT5 host' >&2; exit 90; }
          test -n "${MT5_ACCOUNT_LOGIN:-}" || exit 11
          test -n "${MT5_ACCOUNT_PASSWORD:-}" || exit 12
          test -n "${MT5_ACCOUNT_SERVER:-}" || exit 13
          test -n "${MT5_BRIDGE_TOKEN:-}" || exit 14
          sudo install -d -o root -g root -m 0755 /etc/trading
          printf '%s\n' 'VPS_ONLY=1' | sudo tee /etc/trading/mt5-forex-vps-only >/dev/null
          sudo chmod 0444 /etc/trading/mt5-forex-vps-only
          echo 'MT5_FOREX_RUNNER=AUTHORIZED_VPS'
          echo 'MT5_FOREX_ARCHITECTURE=PERSISTENT_APPLIANCE'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync canonical repository on VPS
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo mkdir -p /opt/trading
          if sudo git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            sudo git -C "$repo" fetch --prune origin main
          else
            [ ! -e "$repo" ] || sudo mv "$repo" "${repo}.pre-mt5.$(date +%Y%m%d%H%M%S)"
            sudo git clone https://github.com/hanlinh227-ship-it/trading-api.git "$repo"
          fi
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main
          test "$(sudo git -C "$repo" rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'MT5_FOREX_CANONICAL_SYNC=PASS'

      - name: Verify Forex Hub bridge authentication
        shell: bash
        run: |
          set -euo pipefail
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          body=$(mktemp); trap 'rm -f "$body"' EXIT
          code=$(curl -sS --connect-timeout 5 --max-time 20 -o "$body" -w '%{http_code}' -X POST "$HUB/forex/mt5/pulse" -H "Authorization: Bearer $MT5_BRIDGE_TOKEN" -H 'Content-Type: application/json' --data '{}' || true)
          [[ "$code" = 400 ]] && grep -q 'TERMINAL_ID_REQUIRED' "$body" || { echo 'ERROR: Forex Hub bridge authentication failed' >&2; exit 15; }
          echo 'MT5_FOREX_BRIDGE_AUTH=PASS'

      - name: Stop runtime without deleting broker state
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl stop mt5-forex-bridge.service 2>/dev/null || true
          sudo systemctl stop mt5-forex.service 2>/dev/null || true
          sudo pkill -u mt5forex -f 'terminal64.exe|metaeditor64.exe' 2>/dev/null || true
          echo 'MT5_PERSISTENT_BROKER_STATE=PRESERVED'

      - name: Ensure persistent Wine MT5 and sync EA
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo chmod +x "$repo/vps/mt5-forex/install-mt5-forex.sh"
          sudo FOREX_RESEARCH_REPO="$repo" MT5_FORCE_PREFIX_REBUILD=false "$repo/vps/mt5-forex/install-mt5-forex.sh"
          source /var/lib/trading/mt5-forex/runtime.env
          version="$($MT5_WINE_BIN --version)"
          major=$(printf '%s' "$version" | sed -nE 's/.*wine-([0-9]+).*/\1/p' | head -n1)
          [[ -n "$major" && "$major" -ge 11 ]]
          test -f "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.ex5"
          echo "MT5_SUPPORTED_WINE_GATE=PASS version=$version"
          echo 'MT5_PERSISTENT_INSTALL_GATE=PASS'

      - name: Install protected runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          LIVE="${MT5_ALLOW_LIVE:-false}"; case "${LIVE,,}" in true|1|yes) LIVE=true ;; *) LIVE=false ;; esac
          umask 077
          {
            printf 'MT5_ACCOUNT_LOGIN=%q\n' "$MT5_ACCOUNT_LOGIN"
            printf 'MT5_ACCOUNT_PASSWORD=%q\n' "$MT5_ACCOUNT_PASSWORD"
            printf 'MT5_ACCOUNT_SERVER=%q\n' "$MT5_ACCOUNT_SERVER"
            printf 'MT5_ACCOUNT_ENDPOINT=%q\n' "${MT5_ACCOUNT_ENDPOINT:-}"
            printf 'MT5_HUB_URL=%q\n' "$HUB"
            printf 'MT5_BRIDGE_TOKEN=%q\n' "$MT5_BRIDGE_TOKEN"
            printf 'MT5_ALLOW_LIVE=%q\n' "$LIVE"
          } > "$tmp"
          sudo install -o root -g mt5forex -m 0640 "$tmp" /etc/trading/mt5-forex.env
          echo "MT5_FOREX_LIVE_REQUESTED=$LIVE"
          echo "MT5_BOOTSTRAP_ENDPOINT=$([[ -n "${MT5_ACCOUNT_ENDPOINT:-}" ]] && echo CONFIGURED || echo OPTIONAL_NOT_SET)"

      - name: Install services and start persistent appliance
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo chmod +x "$repo/vps/mt5-forex/run-mt5-forex.sh" "$repo/vps/mt5-forex/forex-mt5-sidecar.py" "$repo/vps/mt5-forex/verify-hub-pulse.py" "$repo/vps/mt5-forex/verify-local-pulse.py" "$repo/vps/mt5-forex/verify-live-readiness.sh"
          sudo install -m 0644 "$repo/vps/mt5-forex/mt5-forex.service" /etc/systemd/system/mt5-forex.service
          sudo install -m 0644 "$repo/vps/mt5-forex/mt5-forex-bridge.service" /etc/systemd/system/mt5-forex-bridge.service
          sudo systemctl daemon-reload
          sudo systemctl enable mt5-forex.service mt5-forex-bridge.service
          sudo systemctl restart mt5-forex.service
          sleep 8
          sudo systemctl restart mt5-forex-bridge.service
          sudo systemctl is-active --quiet mt5-forex.service
          sudo systemctl is-active --quiet mt5-forex-bridge.service
          echo 'MT5_PERSISTENT_APPLIANCE_START=PASS'

      - name: Verify broker readiness
        shell: bash
        run: |
          set -euo pipefail
          sudo -u mt5forex env \
            FOREX_RESEARCH_REPO=/opt/trading/trading-api-main \
            MT5_ACCOUNT_LOGIN="$MT5_ACCOUNT_LOGIN" \
            MT5_ACCOUNT_SERVER="$MT5_ACCOUNT_SERVER" \
            MT5_BRIDGE_TOKEN="$MT5_BRIDGE_TOKEN" \
            MT5_HUB_URL="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}" \
            MT5_ALLOW_LIVE="${MT5_ALLOW_LIVE:-false}" \
            MT5_LOCAL_READY_TIMEOUT_SECONDS=240 \
            MT5_SIDECAR_READY_TIMEOUT_SECONDS=90 \
            MT5_HUB_READY_TIMEOUT_SECONDS=120 \
            /opt/trading/trading-api-main/vps/mt5-forex/verify-live-readiness.sh

      - name: Runtime readiness summary
        shell: bash
        run: |
          set -euo pipefail
          sudo systemctl is-active --quiet mt5-forex.service
          sudo systemctl is-active --quiet mt5-forex-bridge.service
          sudo test -f /var/lib/trading/mt5-forex/broker-authenticated.marker
          echo 'MT5_FOREX_ARCHITECTURE=PERSISTENT_APPLIANCE'
          echo 'MT5_BROKER_SESSION=PERSISTED'
          echo 'MT5_PULSE_FRESH=PASS'
          echo 'MT5_CONNECTED=PASS'
          echo 'MT5_BALANCE_EQUITY=PASS'
          echo 'MT5_FOREX_RUNTIME_READINESS=PASS'
