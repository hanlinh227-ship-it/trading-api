name: Deploy MT5 Forex VPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mt5/ForexAutoThe5ers.mq5'
      - 'vps/mt5-forex/**'
      - '.github/workflows/deploy-mt5-forex-vps.yml'

permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 35
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_FOREX_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_FOREX_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_FOREX_SERVER }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_FOREX_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_FOREX_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ secrets.MT5_FOREX_ALLOW_LIVE }}
    steps:
      - name: Assert authorized VPS-only runner
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "trading-vps"
          FQDN="$(hostname -f 2>/dev/null || hostname)"
          HOST="$(hostname)"
          if [[ "$FQDN" != "59670.vpsvinahost.vn" && "$HOST" != "59670" ]]; then
            echo "ERROR: refusing MT5 deployment on unauthorized host" >&2
            exit 90
          fi
          sudo install -d -o root -g root -m 0755 /etc/trading
          printf '%s\n' 'VPS_ONLY=1' | sudo tee /etc/trading/mt5-forex-vps-only >/dev/null
          sudo chown root:root /etc/trading/mt5-forex-vps-only
          sudo chmod 0444 /etc/trading/mt5-forex-vps-only
          echo 'MT5_FOREX_RUNNER=AUTHORIZED_VPS'
          echo 'MT5_FOREX_SCOPE=VPS_ONLY'

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Sync canonical repository on VPS
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo mkdir -p /opt/trading
          if sudo git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            if [ -n "$(sudo git -C "$repo" status --porcelain --untracked-files=all)" ]; then
              stamp="$(date +%Y%m%d%H%M%S)"
              sudo git -C "$repo" stash push --include-untracked -m "pre-mt5-forex-sync-${stamp}"
            fi
          else
            if [ -e "$repo" ]; then sudo mv "$repo" "${repo}.pre-mt5.$(date +%Y%m%d%H%M%S)"; fi
            sudo git clone https://github.com/hanlinh227-ship-it/trading-api.git "$repo"
          fi
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main
          test "$(sudo git -C "$repo" rev-parse HEAD)" = "${GITHUB_SHA}"
          echo 'MT5_FOREX_CANONICAL_SYNC=PASS'

      - name: Inspect trading VPS platform
        shell: bash
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "MT5_VPS_OS=${ID}-${VERSION_ID}"
          echo "MT5_VPS_ARCH=$(dpkg --print-architecture 2>/dev/null || uname -m)"
          echo 'MT5_VPS_IDENTITY=AUTHORIZED'

      - name: Install or repair MetaTrader 5
        shell: bash
        run: |
          set -euo pipefail
          test -r /etc/trading/mt5-forex-vps-only
          sudo chmod +x /opt/trading/trading-api-main/vps/mt5-forex/install-mt5-forex.sh
          sudo FOREX_RESEARCH_REPO=/opt/trading/trading-api-main \
            /opt/trading/trading-api-main/vps/mt5-forex/install-mt5-forex.sh

      - name: Install protected MT5 runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = "trading-vps"
          test -r /etc/trading/mt5-forex-vps-only
          sudo install -d -o root -g root -m 0700 /etc/trading
          tmp="$(mktemp)"
          trap 'rm -f "$tmp"' EXIT
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          LIVE="${MT5_ALLOW_LIVE:-false}"
          if [[ "${LIVE,,}" =~ ^(true|1|yes)$ ]]; then
            test -n "${MT5_ACCOUNT_LOGIN:-}" || { echo 'ERROR: LIVE blocked: broker login secret missing' >&2; exit 21; }
            test -n "${MT5_ACCOUNT_PASSWORD:-}" || { echo 'ERROR: LIVE blocked: broker password secret missing' >&2; exit 22; }
            test -n "${MT5_ACCOUNT_SERVER:-}" || { echo 'ERROR: LIVE blocked: broker server secret missing' >&2; exit 23; }
            test -n "${MT5_BRIDGE_TOKEN:-}" || { echo 'ERROR: LIVE blocked: bridge token secret missing' >&2; exit 24; }
          else
            LIVE=false
          fi
          umask 077
          {
            printf 'MT5_ACCOUNT_LOGIN=%q\n' "${MT5_ACCOUNT_LOGIN:-}"
            printf 'MT5_ACCOUNT_PASSWORD=%q\n' "${MT5_ACCOUNT_PASSWORD:-}"
            printf 'MT5_ACCOUNT_SERVER=%q\n' "${MT5_ACCOUNT_SERVER:-}"
            printf 'MT5_HUB_URL=%q\n' "$HUB"
            printf 'MT5_BRIDGE_TOKEN=%q\n' "${MT5_BRIDGE_TOKEN:-}"
            printf 'MT5_ALLOW_LIVE=%q\n' "$LIVE"
          } > "$tmp"
          sudo install -o root -g mt5forex -m 0640 "$tmp" /etc/trading/mt5-forex.env
          echo 'MT5_FOREX_PRIVATE_ENV=PASS'
          echo "MT5_FOREX_CREDENTIALS=$([[ -n "${MT5_ACCOUNT_LOGIN:-}" && -n "${MT5_ACCOUNT_PASSWORD:-}" && -n "${MT5_ACCOUNT_SERVER:-}" ]] && echo CONFIGURED || echo INCOMPLETE)"
          echo "MT5_FOREX_BRIDGE=$([[ -n "${MT5_BRIDGE_TOKEN:-}" ]] && echo CONFIGURED || echo INCOMPLETE)"
          echo "MT5_FOREX_LIVE_REQUESTED=$LIVE"

      - name: Install and start MT5 systemd service
        shell: bash
        run: |
          set -euo pipefail
          test -r /etc/trading/mt5-forex-vps-only
          sudo chmod +x /opt/trading/trading-api-main/vps/mt5-forex/run-mt5-forex.sh
          sudo install -m 0644 /opt/trading/trading-api-main/vps/mt5-forex/mt5-forex.service /etc/systemd/system/mt5-forex.service
          sudo systemctl daemon-reload
          sudo systemctl enable mt5-forex.service
          sudo systemctl restart mt5-forex.service
          for i in $(seq 1 30); do
            sudo systemctl is-active --quiet mt5-forex.service && break
            sleep 2
          done
          sudo systemctl is-active --quiet mt5-forex.service || {
            sudo systemctl status mt5-forex.service --no-pager -l || true
            sudo journalctl -u mt5-forex.service -n 160 --no-pager || true
            exit 30
          }
          echo 'MT5_SYSTEMD_START=PASS'

      - name: Verify MT5 terminal and EA runtime
        shell: bash
        run: |
          set -euo pipefail
          test -r /etc/trading/mt5-forex-vps-only
          source /var/lib/trading/mt5-forex/runtime.env
          test -f "$MT5_TERMINAL"
          test -f "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.mq5"
          test -f "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.ex5"
          echo 'MT5_TERMINAL_FILE=PASS'
          echo 'MT5_EA_COMPILED=PASS'
          MAINPID="$(sudo systemctl show -p MainPID --value mt5-forex.service)"
          test "${MAINPID:-0}" -gt 1
          sleep 8
          if ! sudo systemctl is-active --quiet mt5-forex.service; then
            echo 'ERROR: MT5 service did not remain active after startup' >&2
            sudo systemctl status mt5-forex.service --no-pager -l || true
            sudo journalctl -u mt5-forex.service -n 200 --no-pager || true
            exit 31
          fi
          if ! pgrep -a -u mt5forex -f 'terminal64.exe|MetaTrader' >/dev/null; then
            echo 'ERROR: terminal64 process is not alive under mt5forex' >&2
            sudo systemctl status mt5-forex.service --no-pager -l || true
            sudo journalctl -u mt5-forex.service -n 200 --no-pager || true
            exit 32
          fi
          if pgrep -a -u root -f 'terminal64.exe|MetaTrader' >/dev/null; then
            echo 'ERROR: MT5 process must never run as root' >&2
            exit 33
          fi
          echo 'MT5_TERMINAL_PROCESS=PASS'
          echo 'MT5_TERMINAL_USER=mt5forex'
          echo 'MT5_SYSTEMD_SERVICE=PASS'
          echo 'MT5_RUNTIME_SCOPE=VPS_ONLY'

      - name: Runtime readiness summary
        shell: bash
        run: |
          set -euo pipefail
          . /etc/trading/mt5-forex.env
          echo 'MT5_FOREX_VPS_INSTALL=PASS'
          echo 'MT5_FOREX_SERVICE=active'
          echo 'MT5_FOREX_EA=ForexAutoThe5ers'
          echo 'MT5_FOREX_RUNTIME_SCOPE=VPS_ONLY'
          echo 'MT5_FOREX_LOGIN_LOCATION=TRADING_VPS_ONLY'
          echo "MT5_FOREX_CREDENTIALS=$([[ -n "${MT5_ACCOUNT_LOGIN:-}" && -n "${MT5_ACCOUNT_PASSWORD:-}" && -n "${MT5_ACCOUNT_SERVER:-}" ]] && echo CONFIGURED || echo NEEDS_SECRET)"
          echo "MT5_FOREX_BRIDGE_TOKEN=$([[ -n "${MT5_BRIDGE_TOKEN:-}" ]] && echo CONFIGURED || echo NEEDS_SECRET)"
          echo "MT5_FOREX_LIVE=$([[ "${MT5_ALLOW_LIVE:-false}" =~ ^(true|1|yes)$ ]] && echo REQUESTED || echo OFF_SAFE)"
          echo 'MT5_FOREX_NOTE=No MT5 hosted-runner fallback exists; runtime is host-locked to trading-vps.'
