name: Meme Alpha v2.2.7 Jupiter Keyless Pacing

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v227-jupiter-keyless-pacing.sh'
      - '.github/workflows/meme-alpha-v227-jupiter-keyless-pacing.yml'

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Jupiter keyless pacing
        run: bash ops/meme-alpha/v227-jupiter-keyless-pacing.sh
