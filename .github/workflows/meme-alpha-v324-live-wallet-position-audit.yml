name: Meme Alpha v3.24 Live Wallet Position Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v324-live-wallet-position-audit.sh'
      - '.github/workflows/meme-alpha-v324-live-wallet-position-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Read-only live wallet and position audit
        run: bash ops/meme-alpha/v324-live-wallet-position-audit.sh
