name: Apply BTC Multi-Stage Hold Logic

on:
  push:
    paths:
      - '.github/btc-hold-logic-trigger'

permissions:
  contents: write

concurrency:
  group: btc-multi-stage-hold-logic
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch multi-stage momentum hold and exit logic
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          CURRENT_ENGINE_SHA="$(git hash-object cloudflare-worker/bybit-btc-engine.js)"
          test "$CURRENT_ENGINE_SHA" = "093831426273aeef07ac284213690dfbfc4bd6b3"
          python3 - <<'PY'
          from pathlib import Path

          p=Path('cloudflare-worker/bybit-btc-engine.js')
          text=p.read_text()

          start=text.index('function positionStability(side,market={},cfg={})')
          end=text.index('function positionSupport(side,market={})',start)
          new_stability=r'''function positionStability(side,market={},cfg={}){const adverse=side==="Buy"?-1:1,f1=num(market.trades?.window1s?.imbalance??market.ultraFast?.flow1),f3=num(market.trades?.window3s?.imbalance??market.ultraFast?.flow3),f5=num(market.trades?.window5s?.imbalance),f15=num(market.trades?.window15s?.imbalance??market.trades?.aggressorImbalance),f60=num(market.trades?.window60s?.imbalance),acc=num(market.ultraFast?.flowAcceleration),pressure=num(market.ultraFast?.pressureScore),impulse=num(market.ultraFast?.impulseScore),book2=num(market.book?.imbalance2),micro=clamp(num(market.book?.micropriceEdgeBps)/.25,-1,1),d5=num(market.direction5),pulse=num(market.marketPulse?.score),pulseConf=num(market.marketPulse?.confidence);const score=clamp(.03*adverse*f1+.06*adverse*f3+.10*adverse*f5+.24*adverse*f15+.15*adverse*f60+.10*adverse*acc+.08*adverse*pressure+.08*adverse*impulse+.07*adverse*book2+.04*adverse*micro+.02*adverse*d5+.03*adverse*pulse,0,1),structureAgainst=side==="Buy"?(market.regime==="TREND_DOWN"||market.regime==="BREAKOUT_DOWN"||!!market.structure5?.breakDown&&num(market.structure15?.bias)<=0):(market.regime==="TREND_UP"||market.regime==="BREAKOUT_UP"||!!market.structure5?.breakUp&&num(market.structure15?.bias)>=0),mediumAgainst=adverse*f15>.12&&(adverse*f60>.06||adverse*f5>.18),flowAgainst=mediumAgainst,bookAgainst=adverse*book2>.12&&adverse*micro>.05,microAgainst=bookAgainst,fastAgainst=adverse*f3>.22&&adverse*f5>.18&&(adverse*impulse>.10||adverse*acc>.08),pulseAgainst=adverse*pulse>.14&&pulseConf>.45,shockAgainst=market.regime==="HIGH_VOL_SHOCK"&&adverse*f15>.10,evidenceCount=[structureAgainst,mediumAgainst,bookAgainst,fastAgainst,pulseAgainst,shockAgainst].filter(Boolean).length,hardThreshold=num(cfg?.positionControl?.hardInvalidationScore)||.50,softThreshold=num(cfg?.positionControl?.softInvalidationScore)||.24,hard=score>=hardThreshold&&evidenceCount>=3&&((structureAgainst&&mediumAgainst&&(bookAgainst||pulseAgainst||fastAgainst))||(shockAgainst&&mediumAgainst&&(fastAgainst||pulseAgainst))||(mediumAgainst&&fastAgainst&&(bookAgainst||pulseAgainst))),soft=score>=softThreshold&&evidenceCount>=2&&(mediumAgainst||structureAgainst);return {score,hard,soft,evidenceCount,structureAgainst,mediumAgainst,flowAgainst,bookAgainst,microAgainst,fastAgainst,pulseAgainst,shockAgainst,flow1:f1,flow3:f3,flow5:f5,flow15:f15,flow60:f60,pressure,impulse,book2,micropriceNorm:micro,pulse,pulseConfidence:pulseConf};}
'''
          text=text[:start]+new_stability+text[end:]

          old="baseLock=Math.max(.28,num(cfg?.scalp?.profitLockR)||.35),baseTrail=Math.max(baseLock+.15,num(cfg?.scalp?.trailStartR)||.78),lockR=tier==='PROBE'?Math.max(.25,baseLock*.78):tier==='CONFIRM'?Math.max(.30,baseLock*.90):baseLock,trailR=tier==='PROBE'?Math.max(lockR+.12,baseTrail*.82):tier==='CONFIRM'?Math.max(lockR+.14,baseTrail*.92):baseTrail"
          new="baseLock=Math.max(.35,num(cfg?.scalp?.profitLockR)||.40),baseTrail=Math.max(baseLock+.28,num(cfg?.scalp?.trailStartR)||.98),lockR=tier==='PROBE'?Math.max(.36,baseLock*.92):tier==='CONFIRM'?Math.max(.40,baseLock):baseLock,trailR=tier==='PROBE'?Math.max(lockR+.25,baseTrail*.92):tier==='CONFIRM'?Math.max(lockR+.22,baseTrail):baseTrail"
          if old not in text: raise SystemExit('LOCK_TRAIL_SNIPPET_NOT_FOUND')
          text=text.replace(old,new,1)

          old="decelerating=cfg?.positionControl?.profitLockOnDeceleration!==false&&stability.soft&&r>=.25;"
          new="peakNow=Math.max(num(state.positionPeakR),r),decelerating=cfg?.positionControl?.profitLockOnDeceleration!==false&&stability.soft&&r>=Math.max(.35,num(cfg?.positionControl?.decelerationLockMinR)||.48)&&peakNow>=Math.max(.45,num(cfg?.positionControl?.decelerationPeakMinR)||.65);"
          if old not in text: raise SystemExit('DECELERATION_SNIPPET_NOT_FOUND')
          text=text.replace(old,new,1)

          old="if((r>=lockR||decelerating)&&canNetLock){desired=tighten(side,desired,be);phase=decelerating&&r<lockR?\"SCALP_DECELERATION_LOCK\":\"SCALP_PROFIT_LOCK\";}"
          new="if((r>=lockR||decelerating||(stability.hard&&r>=.30))&&canNetLock){desired=tighten(side,desired,be);phase=stability.hard&&r<lockR?\"HARD_REVERSAL_PROTECT\":decelerating&&r<lockR?\"SCALP_DECELERATION_LOCK\":\"SCALP_PROFIT_LOCK\";}"
          if old not in text: raise SystemExit('PROFIT_LOCK_SNIPPET_NOT_FOUND')
          text=text.replace(old,new,1)

          mstart=text.index('  const confirm=',text.index('async function manageCluster'))
          mend=text.index('\n\nexport async function runBtcHyperscale',mstart)
          new_tail=r'''  const softConfirm=Math.max(2,Math.round(num(cfg?.positionControl?.softConfirmEvents)||4)),hardConfirm=Math.max(2,Math.round(num(cfg?.positionControl?.hardConfirmEvents)||2)),minEvidence=Math.max(2,Math.round(num(cfg?.positionControl?.minExitEvidence)||3)),supportNow=positionSupport(side,market),recovering=supportNow>.08&&!stability.structureAgainst&&!stability.mediumAgainst,hardAdverse=Math.max(.10,num(cfg?.positionControl?.hardAdverseRForCut)||.18),softAdverse=Math.max(hardAdverse+.05,num(cfg?.positionControl?.softAdverseRForCut)||.35),adverseDamage=Math.max(0,-r);state.invalidationCount=stability.soft?num(state.invalidationCount)+1:Math.max(0,num(state.invalidationCount)-(recovering?2:1));state.hardInvalidationCount=stability.hard?num(state.hardInvalidationCount)+1:Math.max(0,num(state.hardInvalidationCount)-1);const hardReady=stability.hard&&stability.evidenceCount>=minEvidence&&state.hardInvalidationCount>=hardConfirm&&adverseDamage>=hardAdverse,softReady=stability.soft&&stability.evidenceCount>=Math.max(2,minEvidence-1)&&state.invalidationCount>=softConfirm&&adverseDamage>=softAdverse,profitable=r>0,allowProfitableExit=cfg?.positionControl?.profitableMarketExit===true;state.holdLogicVersion="MOMENTUM_MULTI_STAGE_HOLD_V1";state.lastPositionStability={at:iso(),side,...stability,supportNow,confirmCount:state.invalidationCount,hardConfirmCount:state.hardInvalidationCount,requiredConfirmEvents:softConfirm,requiredHardConfirmEvents:hardConfirm,minExitEvidence:minEvidence,hardReady,softReady,adverseDamageR:adverseDamage,hardAdverseRForCut:hardAdverse,softAdverseRForCut:softAdverse,entryTier:tier,peakR:state.positionPeakR,decision:(hardReady||softReady)&&(allowProfitableExit||!profitable)?"CUT":"HOLD"};const exitNow=cfg?.positionControl?.instabilityExit!==false&&(allowProfitableExit||!profitable)&&(hardReady||softReady);if(exitNow&&liveMode(env)==="LIVE"){const reason=hardReady?"MARKET_INSTABILITY_HARD_EXIT":"STRUCTURE_FLOW_INSTABILITY_EXIT",out=await api.order({symbol:SYMBOL,side:side==="Buy"?"Sell":"Buy",orderType:"Market",qty:String(position.size),reduceOnly:true,positionIdx:0});state=closeAllTranches(state,{closeReason:reason});state.invalidationCount=0;state.hardInvalidationCount=0;state.positionPeakR=0;state.aggregateStop=0;state.currentPositionMarginUsd=0;state.currentPositionLeverage=0;state.lastCutAt=iso();state.lastExitThesis={at:state.lastCutAt,reason,side,markPrice:mark,stability,reentryPolicy:"FRESH_THESIS_ONLY",recoveryMartingale:false,holdLogicVersion:state.holdLogicVersion};events.push({symbol:SYMBOL,cutExecuted:true,verdict:"CUT",reason,orderId:out?.result?.orderId,markPrice:mark,r,stabilityScore:stability.score,evidenceCount:stability.evidenceCount,hardConfirmCount:state.hardInvalidationCount,softConfirmCount:state.invalidationCount,reentryPolicy:"FRESH_THESIS_ONLY"});return {state,events,position:null,cut:true};}return {state,events,position,cut:false};}'''
          text=text[:mstart]+new_tail+text[mend:]
          p.write_text(text)
          PY

          git diff --check
          cd cloudflare-worker
          node validate-btc-hyperscale.mjs

      - name: Commit hold logic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-worker/bybit-btc-engine.js
          git commit -m 'Use persistent multi-factor momentum logic before BTC smart cut'
          git pull --rebase origin main
          git push origin HEAD:main
