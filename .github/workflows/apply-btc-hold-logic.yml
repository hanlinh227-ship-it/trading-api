name: Apply BTC Multi-Stage Hold Logic

on:
  push:
    paths:
      - .github/btc-hold-logic-trigger

permissions:
  contents: write

concurrency:
  group: btc-multi-stage-hold-logic
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify source and patch engine
        shell: bash
        run: |
          set -euo pipefail
          git pull --ff-only origin main
          test "$(git hash-object cloudflare-worker/bybit-btc-engine.js)" = "093831426273aeef07ac284213690dfbfc4bd6b3"
          python3 .github/scripts/patch_btc_hold_logic.py
          git diff --check
          cd cloudflare-worker
          node validate-btc-hyperscale.mjs

      - name: Commit patched engine
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/bybit-btc-engine.js
          git commit -m "Use persistent multi-factor momentum logic before BTC smart cut"
          git pull --rebase origin main
          git push origin HEAD:main
