name: Meme Alpha V406C Handoff Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v406c-handoff-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Inspect safe deploy executor path
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SAFE DEPLOY SOURCE ==='
          sed -n '1,320p' /usr/local/sbin/meme-alpha-safe-deploy
          echo '=== MICRO LIVE UNIT ==='
          systemctl cat meme-alpha-micro-live.service --no-pager || true
          echo '=== CURRENT PID/SHA ==='
          pgrep -af '/opt/meme-alpha/app/src/micro-live-executor.js' || true
          sha256sum /opt/meme-alpha/app/src/micro-live-executor.js || true
          echo V406C_DISPATCHER_AUDIT=COMPLETE
