name: Android Brain Agent CI

on:
  workflow_dispatch:
  push:
    branches: [main, android-brain-agent-v1-impl]
    paths:
      - 'android-brain-agent/**'
      - 'android-agent-gateway/**'
      - 'AI_SKILL_LIBRARY/runtime/android_agent.yaml'
      - 'AI_SKILL_LIBRARY/tests/test_android_agent_provider.py'
      - '.github/workflows/android-brain-agent-ci.yml'
  pull_request:
    paths:
      - 'android-brain-agent/**'
      - 'android-agent-gateway/**'
      - 'AI_SKILL_LIBRARY/runtime/android_agent.yaml'
      - 'AI_SKILL_LIBRARY/tests/test_android_agent_provider.py'
      - '.github/workflows/android-brain-agent-ci.yml'
  issues:
    types: [opened]

permissions:
  contents: read
  id-token: write

jobs:
  android:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build debug + release APKs
        working-directory: android-brain-agent
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-brain-agent-debug-apk
          path: android-brain-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-brain-agent-release-unsigned-apk
          path: android-brain-agent/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  gateway:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install gateway dependencies
        working-directory: android-agent-gateway
        run: npm install --no-package-lock --ignore-scripts
      - name: Gateway tests
        working-directory: android-agent-gateway
        run: npm test
      - name: Wrangler dry-run
        working-directory: android-agent-gateway
        run: npx wrangler deploy --dry-run

  deploy-gateway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install gateway dependencies
        working-directory: android-agent-gateway
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
      - name: Deploy exact main revision
        working-directory: android-agent-gateway
        run: npx wrangler deploy --var DEPLOYMENT_SOURCE_SHA:$GITHUB_SHA
      - name: Verify production gateway
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_SHA
          const url = 'https://android-brain-agent-gateway.hanlinh227.workers.dev/health'
          let last = null
          for (let i = 0; i < 15; i += 1) {
            try {
              const response = await fetch(url)
              const body = await response.json()
              last = body
              if (
                response.ok &&
                body.ok === true &&
                body.sourceSha === expected &&
                body.taskSchema === 2 &&
                body.capabilities?.taskFirstBridge === true
              ) {
                console.log(JSON.stringify(body, null, 2))
                process.exit(0)
              }
            } catch (error) {
              last = { error: String(error) }
            }
            await new Promise(resolve => setTimeout(resolve, 4000))
          }
          console.error('Production gateway did not converge to exact main revision:', JSON.stringify(last))
          process.exit(1)
          NODE

  github-command:
    if: github.event_name == 'issues' && startsWith(github.event.issue.title, '[ANDROID_AGENT]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      id-token: write
      issues: read
    steps:
      - name: Validate command payload
        id: command
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          node <<'NODE'
          const body = process.env.ISSUE_BODY ?? ''
          let parsed
          try { parsed = JSON.parse(body) } catch { throw new Error('Issue body must be JSON') }
          if (!parsed.goal || typeof parsed.goal !== 'string' || parsed.goal.length > 2000) throw new Error('goal required')
          if (parsed.rawShell || parsed.shell || parsed.command) throw new Error('raw shell is forbidden')
          const output = process.env.GITHUB_OUTPUT
          require('fs').appendFileSync(output, `goal=${JSON.stringify(parsed.goal)}\n`)
          require('fs').appendFileSync(output, `confirmed=${parsed.confirmedRiskClassC === true ? 'true' : 'false'}\n`)
          require('fs').appendFileSync(output, `device_id=${typeof parsed.deviceId === 'string' ? parsed.deviceId : ''}\n`)
          NODE
      - name: Request GitHub OIDC token
        id: oidc
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('android-agent-gateway')
            core.setSecret(token)
            core.setOutput('token', token)
      - name: Resolve active Android device
        id: device
        env:
          GATEWAY: https://android-brain-agent-gateway.hanlinh227.workers.dev
          REQUESTED_DEVICE_ID: ${{ steps.command.outputs.device_id }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const gateway = process.env.GATEWAY
          const requested = (process.env.REQUESTED_DEVICE_ID || '').trim()
          async function getJson(path) {
            const response = await fetch(gateway + path)
            if (!response.ok) throw new Error(`${path} -> ${response.status}`)
            return response.json()
          }
          let deviceId = requested
          if (!deviceId) {
            const latest = await getJson('/v1/devices/latest')
            deviceId = latest.deviceId || ''
          }
          if (!deviceId) throw new Error('No Android device has registered yet')
          const status = await getJson(`/v1/device/${encodeURIComponent(deviceId)}/status`)
          if (status.deviceId !== deviceId || status.paired !== true || status.online !== true) {
            throw new Error(`Android device ${deviceId} is not paired and online`)
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `device_id=${deviceId}\n`)
          NODE
      - name: Dispatch Android goal
        id: dispatch
        env:
          GATEWAY: https://android-brain-agent-gateway.hanlinh227.workers.dev
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          DEVICE_ID: ${{ steps.device.outputs.device_id }}
          GOAL_JSON: ${{ steps.command.outputs.goal }}
          CONFIRMED: ${{ steps.command.outputs.confirmed }}
        run: |
          node <<'NODE'
          const fs = require('fs')
          const goal = JSON.parse(process.env.GOAL_JSON)
          const response = await fetch(`${process.env.GATEWAY}/v1/device/${encodeURIComponent(process.env.DEVICE_ID)}/run`, {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.OIDC_TOKEN}`,
              'content-type': 'application/json',
            },
            body: JSON.stringify({
              goal,
              confirmedRiskClassC: process.env.CONFIRMED === 'true',
              source: 'github-oidc',
            }),
          })
          const body = await response.json().catch(() => ({}))
          if (!response.ok) throw new Error(`Gateway rejected goal: ${response.status} ${JSON.stringify(body)}`)
          if (!['command', 'task'].includes(body.dispatch)) throw new Error(`Unknown dispatch mode: ${JSON.stringify(body)}`)
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dispatch=${body.dispatch}\n`)
          if (body.commandId) fs.appendFileSync(process.env.GITHUB_OUTPUT, `command_id=${body.commandId}\n`)
          if (body.taskId) fs.appendFileSync(process.env.GITHUB_OUTPUT, `task_id=${body.taskId}\n`)
          NODE
      - name: Wait for exact device result
        env:
          GATEWAY: https://android-brain-agent-gateway.hanlinh227.workers.dev
          DEVICE_ID: ${{ steps.device.outputs.device_id }}
          DISPATCH: ${{ steps.dispatch.outputs.dispatch }}
          COMMAND_ID: ${{ steps.dispatch.outputs.command_id }}
          TASK_ID: ${{ steps.dispatch.outputs.task_id }}
        run: |
          node <<'NODE'
          const gateway = process.env.GATEWAY
          const device = encodeURIComponent(process.env.DEVICE_ID)
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))
          async function get(path) {
            const response = await fetch(gateway + path)
            const body = await response.json().catch(() => ({}))
            return { response, body }
          }
          if (process.env.DISPATCH === 'command') {
            const id = encodeURIComponent(process.env.COMMAND_ID || '')
            if (!id) throw new Error('Missing command id')
            for (let i = 0; i < 60; i += 1) {
              const { response, body } = await get(`/v1/device/${device}/command-result/${id}`)
              if (response.ok) {
                if (body.commandId !== process.env.COMMAND_ID) throw new Error('Command receipt mismatch')
                if (body.status === 'COMPLETED') { console.log(JSON.stringify(body)); process.exit(0) }
                if (body.status === 'FAILED' || body.status === 'NEEDS_CONFIRMATION') throw new Error(JSON.stringify(body))
              }
              await sleep(3000)
            }
            throw new Error('Timed out waiting for exact command receipt')
          }
          const taskId = encodeURIComponent(process.env.TASK_ID || '')
          if (!taskId) throw new Error('Missing task id')
          for (let i = 0; i < 100; i += 1) {
            const { response, body } = await get(`/v1/device/${device}/task/${taskId}`)
            if (response.ok) {
              if (body.taskId !== process.env.TASK_ID) throw new Error('Task id mismatch')
              if (body.status === 'COMPLETED') { console.log(JSON.stringify(body)); process.exit(0) }
              if (body.status === 'FAILED' || body.status === 'CANCELLED') throw new Error(JSON.stringify(body))
            }
            await sleep(3000)
          }
          throw new Error('Timed out waiting for task terminal state')
          NODE
