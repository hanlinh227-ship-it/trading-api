name: Android Brain Agent CI

on:
  workflow_dispatch:
  push:
    branches: [main, android-brain-agent-v1-impl]
    paths:
      - 'android-brain-agent/**'
      - 'android-agent-gateway/**'
      - 'AI_SKILL_LIBRARY/runtime/android_agent.yaml'
      - 'AI_SKILL_LIBRARY/tests/test_android_agent_provider.py'
      - '.github/workflows/android-brain-agent-ci.yml'
      - '.github/workflows/android-brain-agent-command-v4.yml'
  pull_request:
    paths:
      - 'android-brain-agent/**'
      - 'android-agent-gateway/**'
      - 'AI_SKILL_LIBRARY/runtime/android_agent.yaml'
      - 'AI_SKILL_LIBRARY/tests/test_android_agent_provider.py'
      - '.github/workflows/android-brain-agent-ci.yml'
      - '.github/workflows/android-brain-agent-command-v4.yml'

permissions:
  contents: read
  id-token: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Test and build debug + release APKs
        working-directory: android-brain-agent
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-brain-agent-debug-apk
          path: android-brain-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload unsigned release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-brain-agent-release-unsigned-apk
          path: android-brain-agent/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install gateway dependencies
        working-directory: android-agent-gateway
        run: npm install --no-package-lock --ignore-scripts
      - name: Gateway tests
        working-directory: android-agent-gateway
        run: npm test
      - name: Wrangler dry-run
        working-directory: android-agent-gateway
        run: npx wrangler deploy --dry-run

  deploy-gateway:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: gateway
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install gateway dependencies
        working-directory: android-agent-gateway
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify deploy credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
      - name: Deploy exact main revision
        working-directory: android-agent-gateway
        run: npx wrangler deploy --var DEPLOYMENT_SOURCE_SHA:$GITHUB_SHA
      - name: Verify production gateway
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const expected = process.env.EXPECTED_SHA
          const url = 'https://android-brain-agent-gateway.hanlinh227.workers.dev/health'
          let last = null
          for (let i = 0; i < 15; i += 1) {
            try {
              const response = await fetch(url)
              const body = await response.json()
              last = body
              if (
                response.ok &&
                body.ok === true &&
                body.sourceSha === expected &&
                body.taskSchema === 2 &&
                body.capabilities?.taskFirstBridge === true
              ) {
                console.log(JSON.stringify(body, null, 2))
                process.exit(0)
              }
            } catch (error) {
              last = { error: String(error) }
            }
            await new Promise(resolve => setTimeout(resolve, 4000))
          }
          console.error('Production gateway did not converge to exact main revision:', JSON.stringify(last))
          process.exit(1)
          NODE
