name: Meme Alpha V427 Live Pump Lifecycle Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v427-pump-lifecycle-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - name: Verify V427 live runtime
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; E="$APP/src/micro-live-executor.js"
          node --check "$E"
          OUT=$(node "$E" --self-test); printf '%s\n' "$OUT"
          for M in V426_CONFLICT_CLEANUP=PASS V427_PUMP_LIFECYCLE=TRUE V427_FLIGHT_SCALE_TO_35PCT=TRUE V427_ADAPTIVE_PROFIT_HARVEST=TRUE V427_PARABOLIC_EXHAUSTION_HARVEST=TRUE V418_WINNER_ONLY_SCALE=TRUE HARD_SECURITY_AND_SELLABILITY_FAILSAFE=KEPT; do grep -q "$M" <<<"$OUT"; done
          grep -q "function pumpLifecycle(c)" "$E"
          grep -q "phase:'CONFIRMED_FLIGHT'" "$E"
          grep -q "ret>=1&&ret<=35" "$E"
          grep -q "adaptiveHarvestPlan(c,pos)" "$E"
          grep -q "AUTO_PARABOLIC_HARVEST" "$E"
          grep -q "AUTO_PUMP_EXHAUSTION_HARVEST" "$E"
          test "$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js'||true)" -eq 1
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$svc"; systemctl is-active "$svc"; done
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          def load(n):
            p=rt/n; return json.loads(p.read_text()),time.time()-p.stat().st_mtime
          g,ga=load('micro-live-gate.json'); r,ra=load('realtime-pool-pulse.json'); p,pa=load('portfolio-observability.json')
          print('GATE',ga,{k:g.get(k) for k in ['allowed','armOk','sourceHealthy','liveRiskReady','scaleAllowed','reasons']})
          print('REALTIME',ra,{k:r.get(k) for k in ['status','heldTotal','heldResolved','heldUnresolved','heldCoveragePct']})
          print('PORTFOLIO',pa,{k:p.get(k) for k in ['stateReadable','openPositions']})
          assert ga<180 and g.get('allowed') is True and g.get('armOk') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True and not g.get('reasons')
          assert r.get('status')=='HEALTHY' and int(r.get('heldUnresolved') or 0)==0 and int(r.get('heldCoveragePct') or 0)==100 and p.get('stateReadable') is True
          PY
          echo V427_LIVE_AUDIT=CLEAN
          echo SCALE_ALLOWED=TRUE
          echo HARD_SAFETY_BYPASS=FALSE
