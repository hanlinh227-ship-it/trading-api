name: V11 Public Four-Month Backtest

on:
  push:
    branches: [main]
    paths:
      - 'scripts/v11_backtest_public_4m.py'
      - '.github/workflows/v11-public-backtest-4m.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-public-backtest-4m
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      V11_BT_DAYS: '122'
      V11_REQUIRED_WR: '80'
      V11_MIN_TOTAL_TRADES: '40'
      V11_MIN_DEV_TRADES: '20'
      V11_MIN_VAL_TRADES: '8'
      V11_MIN_OOS_TRADES: '8'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_backtest_public_4m.py
          grep -q "ALLOWED_RR=(1.0,2.0)" scripts/v11_backtest_public_4m.py
          grep -q "max 3 executed entries" scripts/v11_backtest_public_4m.py
      - name: Run current 122-day backtest
        run: |
          set -euo pipefail
          python scripts/v11_backtest_public_4m.py
      - name: Verify evidence
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('data/v11_public_backtest_4m.json',encoding='utf-8'))
          g=json.load(open('data/v11_public_backtest_gate.json',encoding='utf-8'))
          assert r['meta']['allowedRR']==[1,2]
          assert r['meta']['maxEntriesPerEligibleDay']==3
          assert len(r['symbols'])==r['meta']['totalSymbols']
          for s,x in r['symbols'].items():
              p=x.get('profile') or {}
              if p: assert p.get('rr') in (1.0,2.0), (s,p)
              if x.get('pass'):
                  assert x['full4m']['winRate']>=80.0,s
                  assert x['validation']['winRate']>=80.0,s
                  assert x['oos']['winRate']>=80.0,s
                  assert x['full4m']['trades']>=40,s
                  assert x['validation']['trades']>=8,s
                  assert x['oos']['trades']>=8,s
          assert g['allPassed']==all(bool(x.get('pass')) for x in r['symbols'].values())
          print({'passCount':g['passCount'],'totalSymbols':g['totalSymbols'],'allPassed':g['allPassed'],'failing':len(g['failingSymbols'])})
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name trading-backtest-bot
          git config user.email trading-backtest-bot@users.noreply.github.com
          git add data/v11_public_backtest_4m.json data/v11_public_backtest_gate.json
          git diff --cached --quiet && exit 0
          git commit -m 'backtest: update V11 public 4m per-symbol evidence'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-public-backtest-4m-${{ github.run_id }}
          path: |
            data/v11_public_backtest_4m.json
            data/v11_public_backtest_gate.json
          retention-days: 14
