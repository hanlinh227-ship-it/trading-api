name: BTC V22 Best Unbounded 10X Validation

on:
  push:
    branches: [main]
    paths:
      - 'research/btc_v22_best_unbounded_10x_validation.py'
      - '.github/workflows/btc-v22-best-unbounded-10x-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run frozen best BTC V22 on 10 fresh unbounded starts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          python3 research/btc_v22_best_unbounded_10x_validation.py 2>&1 | tee research/results/BTC_v22_best_unbounded_10x_validation.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: BTC-v22-best-unbounded-10x-validation-result
          path: research/results/BTC_v22_best_unbounded_10x_validation.txt
          retention-days: 30
