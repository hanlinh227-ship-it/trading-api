name: Offline Crypto V30 Nested Symbol
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v30_nested_symbol.py'
      - '.github/workflows/offline-crypto-v30-nested-symbol.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto V30 zero-credit nested walk-forward
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v30_nested_symbol.py
