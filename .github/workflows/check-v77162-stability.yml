name: Check V77.16.2 Multi-Cycle Stability
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-v77162-stability.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build
        shell: bash
        run: |
          set +e
          : > V77162_STABILITY.txt
          node --check cloudflare-worker/index.js >> V77162_STABILITY.txt 2>&1; echo "SYNTAX_EXIT=$?" >> V77162_STABILITY.txt
          cd cloudflare-worker
          npm install >> ../V77162_STABILITY.txt 2>&1; echo "NPM_EXIT=$?" >> ../V77162_STABILITY.txt
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler >> ../V77162_STABILITY.txt 2>&1; echo "PREPARE_EXIT=$?" >> ../V77162_STABILITY.txt
          npx wrangler deploy --dry-run >> ../V77162_STABILITY.txt 2>&1; echo "WRANGLER_EXIT=$?" >> ../V77162_STABILITY.txt
          cd ..
      - name: Wait deploy
        run: sleep 40
      - name: Crypto cycle one and Futures
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 15 "$BASE/status" -o /tmp/s.json; echo "STATUS_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c1.json; echo "CRYPTO1_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 70 "$BASE/run-now?group=future" -o /tmp/u1.json; echo "FUTURE_CURL=$?" >> V77162_STABILITY.txt
          sleep 5
          curl -fsS --max-time 100 "$BASE/run-now?group=crypto" -o /tmp/c2.json; echo "CRYPTO2_CURL=$?" >> V77162_STABILITY.txt
      - name: Align fresh Twelve Data minute
        shell: bash
        run: |
          S=$(date -u +%S); WAIT=$((65-10#$S)); if [ "$WAIT" -lt 5 ]; then WAIT=$((WAIT+60)); fi; sleep "$WAIT"
      - name: Integrated Hub and state
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 180 "$BASE/hub" -o /tmp/h.json; echo "HUB_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 15 "$BASE/orders" -o /tmp/o.json; echo "ORDERS_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 15 "$BASE/telegram/menu" -o /tmp/t.json; echo "MENU_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 70 "$BASE/analyze?symbol=BTCUSDT" -o /tmp/btc.json; echo "BTC_DIRECT_CURL=$?" >> V77162_STABILITY.txt
          curl -fsS --max-time 70 "$BASE/analyze?symbol=MNQ" -o /tmp/mnq.json; echo "MNQ_DIRECT_CURL=$?" >> V77162_STABILITY.txt
          node <<'NODE' >> V77162_STABILITY.txt
          const fs=require('fs'),j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const s=j('/tmp/s.json'),c1=j('/tmp/c1.json'),c2=j('/tmp/c2.json'),u1=j('/tmp/u1.json'),h=j('/tmp/h.json'),o=j('/tmp/o.json'),t=j('/tmp/t.json'),btc=j('/tmp/btc.json'),mnq=j('/tmp/mnq.json');
          const actionable=a=>['MARKET','LIMIT','MARKET_PLAN','LIMIT_PLAN'].includes(a?.status),floor=(g,a)=>g==='future'?1.45:g==='metal'?1.4:g==='crypto'?1.3:1.25;
          let bad=[],futureBad=[],hubActions=0,groupsWithAction=new Set();
          function audit(name,r){const arr=r?.analyses||[],n=x=>arr.filter(a=>a.status===x).length;console.log(name+'='+(r?.broadOk??'-')+'/'+(r?.requested??'-')+' deep='+(r?.deepOk??'-')+'/'+(r?.deepRequested??'-')+' attempts='+(r?.diagnostics?.deepAttempted??'-')+' M='+n('MARKET')+' L='+n('LIMIT')+' MP='+n('MARKET_PLAN')+' LP='+n('LIMIT_PLAN')+' W='+n('WATCH'));for(const a of arr){const p=a.planned||a;if(actionable(a)){const rr=Number(p.targetRR);if(!Number.isFinite(rr)||rr<floor(name.toLowerCase().replace(/[12]$/,''),a))bad.push(name+':'+a.symbol+':'+rr);if(name.startsWith('FUTURE')&&a.microSizing&&a.microSizing.tradable===false)futureBad.push(a.symbol);} }console.log(name+'_RESULTS='+arr.map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':RR='+((a.planned||a).targetRR??'-')+':riskOK='+(a.microSizing?.tradable??'-')).join('|'));}
          audit('CRYPTO1',c1);audit('CRYPTO2',c2);audit('FUTURE1',u1);
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));console.log('MASSIVE='+(s.massive===true?'YES':'NO'));
          const runs=h.runs||{};for(const g of ['crypto','forex','metal','future']){audit(g.toUpperCase(),runs[g]||{});for(const a of runs[g]?.analyses||[])if(actionable(a)){hubActions++;groupsWithAction.add(g);}}
          const farr=runs.future?.analyses||[];const microOnly=farr.every(a=>['MNQ','MES'].includes(a.symbol));
          console.log('HUB_ACTIONS='+hubActions);console.log('HUB_ACTION_GROUPS='+[...groupsWithAction].join(','));console.log('BAD_RR='+bad.join('|'));console.log('FUTURE_BAD_RISK='+futureBad.join('|'));console.log('FUTURE_MICRO_ONLY='+(microOnly?'YES':'NO'));
          console.log('CRYPTO_SCAN_IDS='+String(c1.scanId)+'|'+String(c2.scanId));console.log('CRYPTO_REFRESHED='+(c1.scanId&&c2.scanId&&c1.scanId!==c2.scanId?'YES':'NO'));
          console.log('DURABLE_WATCH_ZERO='+(Object.values(o).every(b=>!Array.isArray(b?.watch)||b.watch.length===0)?'YES':'NO'));console.log('TELEGRAM_MENU_OK='+(t.ok===true?'YES':'NO'));
          console.log('BTC_DIRECT='+String(btc.ok)+':'+String(btc.status)+':RR='+String((btc.planned||btc).targetRR??'-'));console.log('MNQ_DIRECT='+String(mnq.ok)+':'+String(mnq.status)+':RR='+String((mnq.planned||mnq).targetRR??'-')+':risk='+String(mnq.microSizing?.tradable??'-'));
          const coverage=(c1.broadOk||0)>=55&&(c2.broadOk||0)>=55&&(u1.broadOk||0)>=4&&(runs.crypto?.broadOk||0)>=55&&(runs.forex?.broadOk||0)===28&&(runs.metal?.broadOk||0)===2&&(runs.future?.broadOk||0)>=4;
          const deep=(c1.deepOk||0)>=3&&(c2.deepOk||0)>=3&&(u1.deepOk||0)>=2&&(runs.crypto?.deepOk||0)>=3&&(runs.forex?.deepOk||0)===3&&(runs.metal?.deepOk||0)===2&&(runs.future?.deepOk||0)>=2;
          const pass=s.version==='V77.16.2'&&s.ok===true&&s.massive===true&&coverage&&deep&&bad.length===0&&futureBad.length===0&&microOnly&&hubActions>0&&groupsWithAction.size>=2&&c1.scanId!==c2.scanId&&t.ok===true;
          console.log('STABILITY_VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Final and commit
        shell: bash
        run: |
          if grep -q 'SYNTAX_EXIT=0' V77162_STABILITY.txt && grep -q 'WRANGLER_EXIT=0' V77162_STABILITY.txt && grep -q 'STABILITY_VERDICT=PASS' V77162_STABILITY.txt; then echo 'FINAL_VERDICT=PASS' >> V77162_STABILITY.txt; else echo 'FINAL_VERDICT=FAIL' >> V77162_STABILITY.txt; fi
          git config user.name trading-runtime-bot; git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77162_STABILITY.txt; git commit -m 'Report V77.16.2 multi-cycle stability verification' || exit 0; git push origin main
