name: Migrate V77.18.23 Dual AI Intervention Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771823-dual-ai-once.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Patch dual AI adaptive tuning
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old in s: s=s.replace(old,new,count)
              elif new not in s: raise SystemExit(f'Missing pattern {path}: {old[:100]}')
              p.write_text(s)

          # Signal runtime tuning - only soft gates.
          p=Path('cloudflare-worker/engine-v77168.js'); s=p.read_text()
          if 'adaptive-tuning.js' not in s:
              s='import {loadAdaptiveTuning} from "./adaptive-tuning.js";\n'+s
          s=s.replace('const memory = { tdCreditsLeft: null, cryptoBulk: null, cryptoBulkAt: 0 };','const memory = { tdCreditsLeft: null, cryptoBulk: null, cryptoBulkAt: 0, adaptive:null };\nconst ST=()=>memory.adaptive?.signal||{};')
          pairs=[
           ('intel.methodFit>=48&&nearEma&&continuation','intel.methodFit>=Number(ST().locationTrendFit??47)&&nearEma&&continuation'),
           ('intel.methodFit>=48&&Number(context.score||0)>=6&&nearEma&&continuation','intel.methodFit>=Number(ST().locationRelativeFit??47)&&Number(context.score||0)>=6&&nearEma&&continuation'),
           ('intel.methodFit>=50&&impulse','intel.methodFit>=Number(ST().triggerTrendFit??49)&&impulse'),
           ('intel.methodFit>=50&&Number(context.score||0)>=6&&impulse','intel.methodFit>=Number(ST().triggerRelativeFit??49)&&Number(context.score||0)>=6&&impulse'),
           ('Number(intel?.methodFit||0)<52','Number(intel?.methodFit||0)<Number(ST().conditionalFit??51)'),
           ('Number(intel?.methodFit||0)<42','Number(intel?.methodFit||0)<Number(ST().fallbackFit??41)'),
           ('if(type==="future")x=Math.max(x,1.45);else if(type==="metal")x=Math.max(x,mode==="MEAN_REVERSION"?1.18:1.28);','if(type==="future")x=Math.max(x,Number(ST().futureMinRR??1.43));else if(type==="metal")x=Math.max(x,mode==="MEAN_REVERSION"?1.18:Number(ST().metalMinRR??1.26));'),
           ('else if(type==="forex")x=Math.max(x,mode==="MEAN_REVERSION"?1.10:1.20);','else if(type==="forex")x=Math.max(x,mode==="MEAN_REVERSION"?1.10:Number(ST().forexMinRR??1.18));'),
           ('return {pass:chase<=.70&&notExtreme','return {pass:chase<=Number(ST().marketChaseAtr??.72)&&notExtreme')]
          for old,new in pairs:
              if old in s:s=s.replace(old,new,1)
              elif new not in s:raise SystemExit('signal missing '+old)
          s=s.replace('async function runGroup(group,env,trigger="API_RUN_NOW"){\n  if(group==="future")return runFutureGroup(env);','async function runGroup(group,env,trigger="API_RUN_NOW"){\n  memory.adaptive=await loadAdaptiveTuning(env);\n  if(group==="future")return runFutureGroup(env);',1)
          s=s.replace('async function runSymbol(symbol,env){\n  const s=canonicalUserSymbol(symbol)','async function runSymbol(symbol,env){\n  memory.adaptive=await loadAdaptiveTuning(env);\n  const s=canonicalUserSymbol(symbol)',1)
          p.write_text(s)

          # Hyro scanner/runtime bounded tuning.
          p=Path('cloudflare-worker/hyro-scanner.js'); s=p.read_text()
          s=s.replace('function basePlan(symbol,ticker,h1,m15,m5,btcCtx){','function basePlan(symbol,ticker,h1,m15,m5,btcCtx,tune={}){',1)
          s=s.replace('const nearRR=Math.max(1.4,p.minRR-.35);if(!fund.block&&nearTrigger&&dist<=p.dist*1.35&&btcAgree&&effectiveRR>=nearRR)','const nearRR=Math.max(Number(tune.bMinRR??1.38),p.minRR-.35);if(!fund.block&&nearTrigger&&dist<=p.dist*Number(tune.bDistMult??1.40)&&btcAgree&&effectiveRR>=nearRR)',1)
          s=s.replace('export async function hyroDynamicScan({maxBroad=80,maxDeep=8,minTurnover=10000000}={})','export async function hyroDynamicScan({maxBroad=80,maxDeep=8,minTurnover=10000000,tune={}}={})',1)
          s=s.replace('basePlan(t.symbol,t,h1,m15,m5,ctx)','basePlan(t.symbol,t,h1,m15,m5,ctx,tune)')
          p.write_text(s)

          p=Path('cloudflare-worker/hyro-runtime.js'); s=p.read_text()
          if 'adaptive-tuning.js' not in s:s=s.replace('import {evaluateHyroPortfolio,rankHyroCandidates,recordHyroEntry} from "./hyro-portfolio-guard.js";','import {evaluateHyroPortfolio,rankHyroCandidates,recordHyroEntry} from "./hyro-portfolio-guard.js";\nimport {loadAdaptiveTuning} from "./adaptive-tuning.js";')
          s=s.replace('const dynamicRisk=hyroDynamicRiskView(profile,telemetry),management=await manageHyroPositions(env,telemetry)','const adaptive=await loadAdaptiveTuning(env),dynamicRisk=hyroDynamicRiskView(profile,telemetry),management=await manageHyroPositions(env,telemetry)',1)
          s=s.replace('hyroDynamicScan({maxBroad:100,maxDeep:12,minTurnover:8000000})','hyroDynamicScan({maxBroad:100,maxDeep:Number(adaptive.hyro.maxDeep||14),minTurnover:Number(adaptive.hyro.minTurnover||6000000),tune:adaptive.hyro})',1)
          s=s.replace('microScore(x)>=.54','microScore(x)>=Number(adaptive.hyro.bMicroMin||.52)',1)
          p.write_text(s)

          # Claude gets one-time bounded intervention authority over soft tuning only.
          p=Path('cloudflare-worker/claude-reviewer.js'); s=p.read_text()
          if 'adaptive-tuning.js' not in s:s='import {applyAdaptiveTuning,getAdaptiveTuningState} from "./adaptive-tuning.js";\n'+s
          s=s.replace('const OVERNIGHT_KEY="v771822:claude:overnight";','const OVERNIGHT_KEY="v771822:claude:overnight";\nconst INTERVENTION_KEY="v771823:claude:intervention";')
          old='return {verdict,confidence:Math.max(0,Math.min(100,num(x?.confidence))),summary:clampText(x?.summary||"",900),findings,tuning,must_fix:Array.isArray(x?.must_fix)?x.must_fix.slice(0,8).map(v=>clampText(typeof v==="string"?v:JSON.stringify(v),520)):[]};'
          new='return {verdict,confidence:Math.max(0,Math.min(100,num(x?.confidence))),summary:clampText(x?.summary||"",900),findings,tuning,must_fix:Array.isArray(x?.must_fix)?x.must_fix.slice(0,8).map(v=>clampText(typeof v==="string"?v:JSON.stringify(v),520)):[],runtime_tuning:(x?.runtime_tuning&&typeof x.runtime_tuning==="object")?x.runtime_tuning:null};'
          s=s.replace(old,new,1)
          s=s.replace('Output ONLY valid compact JSON with keys: verdict (PASS|WARN|FAIL), confidence (0-100), summary, findings (array severity,area,issue,evidence,recommendation), tuning (array of objects priority,area,current_problem,proposed_change,expected_effect,risk), must_fix (array).','Output ONLY valid compact JSON with keys: verdict (PASS|WARN|FAIL), confidence (0-100), summary, findings, tuning, must_fix, runtime_tuning. For ONE_TIME_INTERVENTION only, runtime_tuning may contain signal {locationTrendFit,locationRelativeFit,triggerTrendFit,triggerRelativeFit,conditionalFit,fallbackFit,forexMinRR,metalMinRR,futureMinRR,marketChaseAtr} and hyro {maxDeep,minTurnover,bMicroMin,bDistMult,bMinRR}. Stay within conservative ranges; never alter hard news/freshness/execution/structural-SL or PROP risk limits. For other review kinds runtime_tuning must be null.')
          s=s.replace('const overnight=kind==="OVERNIGHT_30M_SYSTEM_REVIEW",defaultTokens=overnight?950:1400','const overnight=kind==="OVERNIGHT_30M_SYSTEM_REVIEW",intervention=kind==="ONE_TIME_INTERVENTION",defaultTokens=intervention?2200:(overnight?950:1400)')
          marker='export async function runClaudeAutoReview(env,{version="UNKNOWN",health=null}={})'
          fn='export async function runClaudeOneTimeIntervention(env,{version="UNKNOWN"}={}){if(!env.ANTHROPIC_API_KEY)return {ok:false,skipped:true,reason:"ANTHROPIC_API_KEY_MISSING"};const old=await kvGet(env,INTERVENTION_KEY,null);if(old?.version===version&&old?.completed)return old;const r=await runClaudeReview(env,{version,kind:"ONE_TIME_INTERVENTION",force:true,notify:false});let applied=null;if(r?.ok&&!r?.skipped&&r?.review?.runtime_tuning){applied=await applyAdaptiveTuning(env,r.review.runtime_tuning,{source:"CLAUDE_ONE_TIME_BOUNDED",reviewId:r.messageId||null});}const out={ok:!!r?.ok,version,completed:true,at:now(),verdict:r?.review?.verdict||null,usage:r?.usage||null,estimatedCostUsd:Number(((num(r?.usage?.input_tokens)*2+num(r?.usage?.output_tokens)*10)/1000000).toFixed(4)),applied:applied?.values||null,guardrail:"SOFT_TUNING_ONLY",trade:false,deploy:false};await kvPut(env,INTERVENTION_KEY,out,2592000);return out;}\nexport async function getClaudeInterventionState(env){return kvGet(env,INTERVENTION_KEY,null);}\n'
          if 'runClaudeOneTimeIntervention' not in s:s=s.replace(marker,fn+marker)
          s=s.replace('return {configured:!!env.ANTHROPIC_API_KEY,model:','const intervention=await kvGet(env,INTERVENTION_KEY,null),adaptive=await getAdaptiveTuningState(env);return {configured:!!env.ANTHROPIC_API_KEY,model:',1)
          s=s.replace('permissions:{trade:false,closePosition:false,deploy:false,kvMutationExceptOwnReviewState:true,reviewOnly:true}};','intervention,adaptiveTuning:adaptive,permissions:{trade:false,closePosition:false,deploy:false,kvMutationExceptOwnReviewState:true,boundedSoftTuning:true,reviewOnly:true}};',1)
          p.write_text(s)

          # Index/version + routes + first-cron intervention.
          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          s=s.replace('runClaudeReview,runClaudeAutoReview,getClaudeReviewerStatus,getClaudeReviewState','runClaudeReview,runClaudeAutoReview,runClaudeOneTimeIntervention,getClaudeInterventionState,getClaudeReviewerStatus,getClaudeReviewState')
          if 'adaptive-tuning.js' not in s:s=s.replace('import {handleClaudeTelegram} from "./claude-telegram.js";','import {handleClaudeTelegram} from "./claude-telegram.js";\nimport {getAdaptiveTuningState} from "./adaptive-tuning.js";')
          s=s.replace('const VERSION="V77.18.22",SERVICE="Trading V77.18.22 Safe Daily Risk + Balanced Discovery";\nconst RELEASE_NAME="Safe Daily Risk + Balanced Discovery";','const VERSION="V77.18.23",SERVICE="Trading V77.18.23 Dual AI Adaptive Tuning";\nconst RELEASE_NAME="Dual AI Adaptive Tuning";')
          s=s.replace('if(path==="/claude/review/latest")return json({ok:true,version:VERSION,review:await getClaudeReviewState(env)});','if(path==="/claude/review/latest")return json({ok:true,version:VERSION,review:await getClaudeReviewState(env)});if(path==="/claude/intervention")return json({ok:true,version:VERSION,state:await getClaudeInterventionState(env),tuning:await getAdaptiveTuningState(env)});if(path==="/tuning")return json({ok:true,version:VERSION,tuning:await getAdaptiveTuningState(env)});')
          s=s.replace('ctx.waitUntil(runClaudeAutoReview(env,{version:VERSION}).catch(()=>{}));','ctx.waitUntil(runClaudeOneTimeIntervention(env,{version:VERSION}).catch(()=>{}));ctx.waitUntil(runClaudeAutoReview(env,{version:VERSION}).catch(()=>{}));')
          s=s.replace('details:["Risk mới kích hoạt sau reset 00:00 UTC / 07:00 VN","SL cấu trúc giữ nguyên; giảm risk bằng size + daily defense","Claude audit 30m tới reset; Signal soft discovery cân bằng hơn"]','details:["ChatGPT PRIMARY + Claude one-time bounded intervention","Adaptive soft tuning cho Signal + PROP discovery; hard gates/risk giữ nguyên","Claude usage được giới hạn; routine review vẫn im lặng"]')
          p.write_text(s)

          p=Path('cloudflare-worker/hub-v77171.js'); s=p.read_text().replace('V77.18.22','V77.18.23').replace('Safe Risk + Balanced Discovery Hub','Dual AI Adaptive Tuning Hub')
          s=s.replace('🧠 AI Review','🧠 AI Tối ưu')
          p.write_text(s)

          # Canonical validator.
          p=Path('.github/workflows/validate-cloudflare-v77.yml'); s=p.read_text()
          s=s.replace("'V77.16.9'","'V77.16.10'")
          s=s.replace("['V77.18.22','Safe Daily Risk + Balanced Discovery'","['V77.18.23','Dual AI Adaptive Tuning'")
          s=s.replace("if(!hub.includes('🧠 AI Review')||!hub.includes('V77.18.22'))","if(!hub.includes('🧠 AI Tối ưu')||!hub.includes('V77.18.23'))")
          s=s.replace("'microScore(x)>=.54'","'adaptive.hyro.bMicroMin'")
          s=s.replace("console.log('Canonical V77.18.22 safe-risk validation PASS');","const adaptive=read('cloudflare-worker/adaptive-tuning.js');for(const x of ['v771823:adaptive:tuning','locationTrendFit','bMicroMin','hardNews:true','hyroRiskUntouched:true'])if(!adaptive.includes(x))throw new Error('Adaptive tuning lock missing: '+x);for(const x of ['runClaudeOneTimeIntervention','ONE_TIME_INTERVENTION','boundedSoftTuning','INTERVENTION_KEY'])if(!claude.includes(x))throw new Error('Claude intervention lock missing: '+x);console.log('Canonical V77.18.23 dual-AI adaptive validation PASS');")
          p.write_text(s)
          PY

          for f in cloudflare-worker/*.js cloudflare-worker/*.mjs; do node --check "$f"; done
          cd cloudflare-worker
          npm install
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler
          npx wrangler deploy --dry-run
          cd ..
          cat > docs/checkpoints/V771823_DUAL_AI_ADAPTIVE.md <<'EOF'
          # V77.18.23 — Dual AI Adaptive Tuning
          ChatGPT remains PRIMARY. Claude receives one-time bounded intervention authority after this release: it may change only whitelisted soft discovery knobs stored in v771823:adaptive:tuning. It cannot trade, close positions, deploy, alter secrets, hard news/freshness/execution/structural-SL gates, or Hyro risk caps.
          Defaults deliberately improve discovery without loosening hard safety: Signal loc 47/47, trigger 49/49, conditional 51, fallback 41, Forex RR 1.18, Metal 1.26, Futures 1.43, chase .72 ATR. Hyro deep 14, turnover floor $6m, B micro .52, B distance 1.40, B RR floor 1.38. A-tier and V77.18.22 safe daily risk remain unchanged.
          Claude ONE_TIME_INTERVENTION is silent, expected to cost only a small fraction of the ~$19 remaining credit; measured token usage and estimated cost are stored in intervention state. Routine 30m/daily reviews remain silent.
          EOF
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker .github/workflows/validate-cloudflare-v77.yml docs/checkpoints/V771823_DUAL_AI_ADAPTIVE.md
          git commit -m 'V77.18.23 dual AI adaptive tuning' || true
          git push
