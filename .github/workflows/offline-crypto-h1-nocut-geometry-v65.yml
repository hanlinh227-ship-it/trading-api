name: Offline Crypto H1 NoCut Geometry V65
on:
  push:
    paths:
      - 'scripts/offline_crypto_h1_nocut_geometry_v65.py'
      - 'scripts/offline_nocut_geometry_core.py'
      - '.github/workflows/offline-crypto-h1-nocut-geometry-v65.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run offline V65
        env:
          PYTHONPATH: .
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_h1_nocut_geometry_v65.py
