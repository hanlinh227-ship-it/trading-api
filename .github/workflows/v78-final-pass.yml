name: V78 Final Pass
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  run:
    if: github.event.issue.title == 'RUN-V78-FINAL-PASS'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run closed-loop final pass
        run: bash scripts/v78_final_pass.sh
