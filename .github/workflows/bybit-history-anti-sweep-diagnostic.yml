name: Bybit History Anti-Sweep Diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-history-anti-sweep-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Read live Bybit closed history and canonical learning
        shell: bash
        run: |
          set -euo pipefail
          set -a
          [ -f /etc/trading-v11-ai.env ] && source /etc/trading-v11-ai.env || true
          set +a
          export REPORT=/tmp/bybit-history-anti-sweep.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {bybitV5} from './cloudflare-worker/bybit-v5-client.js';

          const now=Date.now();
          const start=now-7*24*60*60*1000;
          const env={
            BYBIT_AUTO_API_KEY:process.env.BYBIT_AUTO_API_KEY,
            BYBIT_AUTO_API_SECRET:process.env.BYBIT_AUTO_API_SECRET,
            HYRO_BYBIT_LIVE_API_KEY:process.env.HYRO_BYBIT_LIVE_API_KEY,
            HYRO_BYBIT_LIVE_API_SECRET:process.env.HYRO_BYBIT_LIVE_API_SECRET,
            BYBIT_AUTO_DEMO:'false',
            BYBIT_PRIVATE_PROXY_URL:process.env.BYBIT_PRIVATE_PROXY_URL,
            BYBIT_PRIVATE_PROXY_KEY:process.env.BYBIT_PRIVATE_PROXY_KEY,
            BYBIT_PRIVATE_PROXY_SECRET:process.env.BYBIT_PRIVATE_PROXY_SECRET
          };
          const api=bybitV5(env);
          const rows=[]; let cursor=''; let pages=0;
          for(let i=0;i<20;i++){
            const r=await api.closedPnl(start,now,cursor); pages++;
            const list=r?.result?.list||[]; rows.push(...list);
            const next=String(r?.result?.nextPageCursor||'');
            if(!next||next===cursor)break; cursor=next;
          }
          const clean=rows.map(x=>({
            symbol:String(x.symbol||''),
            side:String(x.side||''),
            pnl:Number(x.closedPnl||0),
            created:Number(x.createdTime||0),
            updated:Number(x.updatedTime||0),
            holdSec:Math.max(0,Math.round((Number(x.updatedTime||0)-Number(x.createdTime||0))/1000))
          })).filter(x=>x.symbol&&Number.isFinite(x.pnl));
          const bucketOf=s=>s<300?'<5m':s<900?'5-15m':s<1800?'15-30m':s<3600?'30-60m':'60m+';
          const buckets={}; const symbols={};
          const add=(m,k,r)=>{m[k]??={trades:0,wins:0,losses:0,sumPnl:0,sumHoldSec:0};const b=m[k];b.trades++;if(r.pnl>0)b.wins++;else if(r.pnl<0)b.losses++;b.sumPnl+=r.pnl;b.sumHoldSec+=r.holdSec;};
          for(const r of clean){add(buckets,bucketOf(r.holdSec),r);add(symbols,r.symbol,r);}
          const finish=m=>Object.fromEntries(Object.entries(m).map(([k,b])=>[k,{...b,winRate:b.trades?b.wins/b.trades:null,avgPnl:b.trades?b.sumPnl/b.trades:null,avgHoldSec:b.trades?b.sumHoldSec/b.trades:null}]));
          let learning=null;
          const actionKey=process.env.GPT_5AI_ACTION_KEY||'';
          if(actionKey){
            try{
              const r=await fetch('https://trading-v77-scanner.hanlinh227.workers.dev/bybit/learning/state',{headers:{'x-action-key':actionKey}});
              if(r.ok){const j=await r.json(); learning=j?.learning?.summary||j?.learning||null;}
            }catch{}
          }
          const early=clean.filter(x=>x.holdSec<900),earlyLoss=early.filter(x=>x.pnl<0);
          const report={
            ok:true,readOnly:true,source:'BYBIT_CLOSED_PNL',windowDays:7,pages,closedTrades:clean.length,
            pnlTotal:clean.reduce((s,x)=>s+x.pnl,0),
            earlyUnder15m:{trades:early.length,losses:earlyLoss.length,lossRate:early.length?earlyLoss.length/early.length:null,pnl:early.reduce((s,x)=>s+x.pnl,0)},
            holdBuckets:finish(buckets),symbols:finish(symbols),
            canonicalLearning:learning?{sampleSize:learning.sampleSize??null,wins:learning.wins??null,losses:learning.losses??null,avgNetR:learning.avgNetR??null,avgMfeR:learning.avgMfeR??null,avgMaeR:learning.avgMaeR??null,avgHoldSec:learning.avgHoldSec??null,postMortemCounts:learning.postMortemCounts??null,postMortemRates:learning.postMortemRates??null,byStrategy:learning.byStrategy??null,bySymbol:learning.bySymbol??null}:null,
            privacy:'AGGREGATED_NO_ORDER_IDS_NO_EXACT_PRICES',generatedAt:new Date().toISOString()
          };
          fs.writeFileSync(process.env.REPORT,JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Persist aggregated diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/diagnostics
          cp /tmp/bybit-history-anti-sweep.json docs/diagnostics/LATEST_BYBIT_HISTORY_ANTI_SWEEP.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/LATEST_BYBIT_HISTORY_ANTI_SWEEP.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record latest Bybit anti-sweep history diagnostic'
          git push origin HEAD:main
