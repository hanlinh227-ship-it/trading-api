name: Write V56 Failed Stats
on:
  push:
    paths:
      - 'scripts/write_v56_failed_stats.py'
      - '.github/workflows/write-v56-failed-stats.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Parse V56 failed stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/write_v56_failed_stats.py
      - name: Commit stats
        run: |
          git config user.name 'research-summary-bot'
          git config user.email 'research-summary-bot@users.noreply.github.com'
          git add data/v56_failed_stats.json
          git commit -m 'Save V56 failed coin stats' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
