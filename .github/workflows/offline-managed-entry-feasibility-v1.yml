name: Offline Managed Entry Feasibility V1

on:
  push:
    paths:
      - 'scripts/offline_managed_entry_feasibility_v1.py'
      - '.github/workflows/offline-managed-entry-feasibility-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/offline_managed_entry_feasibility_v1.py
