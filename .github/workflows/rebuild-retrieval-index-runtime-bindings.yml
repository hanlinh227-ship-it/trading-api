name: Rebuild Retrieval Index Runtime Bindings

on:
  push:
    branches: [feat/model-mesh-runtime-bindings]
    paths:
      - '.github/workflows/rebuild-retrieval-index-runtime-bindings.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-mesh-runtime-bindings
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Rebuild canonical retrieval index
        run: python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write --root .
      - name: Commit retrieval index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          if git diff --cached --quiet; then
            echo RETRIEVAL_INDEX_ALREADY_CURRENT
            exit 0
          fi
          git commit -m 'chore: rebuild retrieval index for 4.9.1'
          git push origin HEAD:feat/model-mesh-runtime-bindings
