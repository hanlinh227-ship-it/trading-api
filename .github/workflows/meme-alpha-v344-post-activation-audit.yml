name: Meme Alpha v3.44 Post Activation Audit
on:
  push:
    paths:
      - 'ops/meme-alpha/v344-post-activation-audit.sh'
      - '.github/workflows/meme-alpha-v344-post-activation-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - name: Audit v3.41 + v3.42 production activation
        run: bash ops/meme-alpha/v344-post-activation-audit.sh
