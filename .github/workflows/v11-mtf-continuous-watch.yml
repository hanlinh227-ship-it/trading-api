name: V11 MTF Continuous Watch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-mtf-continuous-watch.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: v11-mtf-continuous-watch
  cancel-in-progress: true

jobs:
  live-watch:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      PYTHONUNBUFFERED: '1'
      V11_BT_DAYS: '122'
      V11_HISTORY_DAYS: '330'
      V11_REQUIRED_WR: '80'
      V11_MIN_ENTRIES_PER_ELIGIBLE_DAY: '1'
      V11_MAX_ENTRIES_PER_ELIGIBLE_DAY: '3'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn

      - name: Continuous V11 MTF watch and backtest
        shell: bash
        run: |
          set -u
          LAST_ENGINE_HASH=''
          LAST_WAIT_SHA=''
          START_TS=$(date +%s)
          STOP_AFTER=$((5*60*60+35*60))

          echo '============================================================'
          echo ' V11 MTF CONTINUOUS WATCH'
          echo ' This job stays open, watches latest main, and automatically'
          echo ' starts the MTF backtest whenever a new engine version lands.'
          echo '============================================================'

          while true; do
            NOW_TS=$(date +%s)
            if [ $((NOW_TS-START_TS)) -ge "$STOP_AFTER" ]; then
              echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') MONITOR_ROTATE next scheduled run will continue"
              break
            fi

            git fetch origin main --quiet || true
            git reset --hard origin/main --quiet || true
            SHA=$(git rev-parse HEAD)

            if [ ! -f scripts/v11_backtest_mtf.py ] || [ ! -f scripts/v11_backtest_mtf_run.py ]; then
              if [ "$SHA" != "$LAST_WAIT_SHA" ]; then
                echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') WAITING_ENGINE main=${SHA:0:12} issue=#146"
                echo 'Waiting for scripts/v11_backtest_mtf.py + scripts/v11_backtest_mtf_run.py on main.'
                LAST_WAIT_SHA="$SHA"
              else
                echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') HEARTBEAT WAITING_ENGINE main=${SHA:0:12}"
              fi
              sleep 20
              continue
            fi

            ENGINE_HASH=$(sha256sum scripts/v11_backtest_mtf.py scripts/v11_backtest_mtf_run.py | sha256sum | awk '{print $1}')
            if [ "$ENGINE_HASH" = "$LAST_ENGINE_HASH" ]; then
              echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') HEARTBEAT ENGINE_TESTED main=${SHA:0:12} engine=${ENGINE_HASH:0:12}"
              sleep 20
              continue
            fi

            echo '============================================================'
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') ENGINE_DETECTED main=$SHA engine=$ENGINE_HASH"
            echo 'STAGE VALIDATE_ENGINE'
            if ! python -m py_compile scripts/v11_backtest_mtf.py scripts/v11_backtest_mtf_run.py; then
              echo 'ENGINE_COMPILE_FAIL; waiting for repaired engine revision.'
              LAST_ENGINE_HASH="$ENGINE_HASH"
              sleep 20
              continue
            fi

            echo 'STAGE BACKTEST_RUNNING'
            echo 'Expected live stages: FETCH -> TF_BUILD -> FEATURES -> TRAIN -> VALIDATE -> OOS_TEST -> RESULT'
            set +e
            python -u scripts/v11_backtest_mtf_run.py
            RC=$?
            set -e
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') BACKTEST_EXIT code=$RC main=${SHA:0:12} engine=${ENGINE_HASH:0:12}"
            LAST_ENGINE_HASH="$ENGINE_HASH"
            echo 'Waiting for next engine revision; this page remains live.'
            set +e
            sleep 20
            set -e
          done
