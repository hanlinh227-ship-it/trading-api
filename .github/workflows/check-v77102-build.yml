name: Check V77.10.2 Canonical Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-v77102-build.yml'
      - 'cloudflare-worker/**'
      - 'data/nocut_intraday_allpass_v73.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical static checks
        shell: bash
        run: |
          set +e
          : > V77102_BUILD_CHECK.txt
          node --check cloudflare-worker/index.js >> V77102_BUILD_CHECK.txt 2>&1
          echo "WORKER_SYNTAX_EXIT=$?" >> V77102_BUILD_CHECK.txt
          node - <<'NODE' >> V77102_BUILD_CHECK.txt 2>&1
          const fs=require('fs');
          const src=fs.readFileSync('cloudflare-worker/index.js','utf8');
          const v73=JSON.parse(fs.readFileSync('data/nocut_intraday_allpass_v73.json','utf8'));
          const must=['V77.10.2','profileMode','adaptiveLocationPolicy','adaptiveTriggerPolicy','indicativePlan','cryptoAnalysisFallbackBundle','reference.analysisOnly','runSymbol','singleAnalysisText','STRUCTURE_LIQUIDITY','validExecutablePosition'];
          const missing=must.filter(x=>!src.includes(x));
          console.log('STATIC_MISSING='+missing.join(','));
          console.log('V73_VERSION='+v73.version);
          console.log('V73_FOREX='+(v73.forex?.universeCount??'-'));
          console.log('V73_CRYPTO='+(v73.crypto?.universeCount??'-'));
          console.log('LEGACY_SCORE='+(src.includes('Score 10.0')||src.includes('Score 8.0')?'YES':'NO'));
          console.log('LEGACY_TP_Q='+(src.includes('TP ?')?'YES':'NO'));
          NODE
          exit 0
      - name: Install dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Prepare Wrangler
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler dry run
        shell: bash
        working-directory: cloudflare-worker
        run: |
          set +e
          npx wrangler deploy --dry-run >> ../V77102_BUILD_CHECK.txt 2>&1
          echo "WRANGLER_DRY_EXIT=$?" >> ../V77102_BUILD_CHECK.txt
          exit 0
      - name: Verdict and commit report
        shell: bash
        run: |
          if grep -q 'WORKER_SYNTAX_EXIT=0' V77102_BUILD_CHECK.txt && grep -q '^STATIC_MISSING=$' V77102_BUILD_CHECK.txt && grep -q 'V73_VERSION=NO_CUT_INTRADAY_ALLPASS_V73' V77102_BUILD_CHECK.txt && grep -q 'V73_FOREX=28' V77102_BUILD_CHECK.txt && grep -q 'V73_CRYPTO=61' V77102_BUILD_CHECK.txt && grep -q 'LEGACY_SCORE=NO' V77102_BUILD_CHECK.txt && grep -q 'LEGACY_TP_Q=NO' V77102_BUILD_CHECK.txt && grep -q 'WRANGLER_DRY_EXIT=0' V77102_BUILD_CHECK.txt; then echo 'VERDICT=PASS' >> V77102_BUILD_CHECK.txt; else echo 'VERDICT=FAIL' >> V77102_BUILD_CHECK.txt; fi
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add V77102_BUILD_CHECK.txt
          git commit -m 'Report V77.10.2 canonical build verification' || exit 0
          git push origin main
