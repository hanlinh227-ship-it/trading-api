name: Fetch Crypto Remaining13 H1 Jan-Mar 2026
on:
  push:
    paths:
      - 'scripts/fetch_crypto_remaining13_h1_jan_mar_2026.py'
      - '.github/workflows/fetch-crypto-remaining13-h1-jan-mar-2026.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch fresh H1 Jan-Mar block
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/fetch_crypto_remaining13_h1_jan_mar_2026.py
      - name: Freeze snapshot
        run: |
          git config user.name 'crypto-fresh-block-bot'
          git config user.email 'crypto-fresh-block-bot@users.noreply.github.com'
          git add data/provider_snapshots/crypto_remaining13_h1_jan_mar_2026.json
          git commit -m 'Freeze remaining crypto H1 Jan-Mar 2026 block' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
