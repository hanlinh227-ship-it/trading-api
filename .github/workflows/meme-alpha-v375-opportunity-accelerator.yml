name: Meme Alpha v3.75 Opportunity Accelerator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v375-safe-signal-opportunity-accelerator.js'
      - 'ops/meme-alpha/v375-stage-opportunity-accelerator.sh'
      - '.github/workflows/meme-alpha-v375-opportunity-accelerator.yml'
concurrency:
  group: meme-alpha-production-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: [self-hosted, linux]
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v5
      - name: Stage and self-test
        run: bash ops/meme-alpha/v375-stage-opportunity-accelerator.sh
      - name: Safe deploy signal accelerator
        shell: bash
        run: |
          set -euo pipefail
          STAGE=/opt/meme-alpha/app/runtime-status/v375-opportunity-stage
          NAME=$(cat "$STAGE/deploy-name.txt")
          SHA=$(cat "$STAGE/signal.sha256")
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal "$NAME" "$SHA"
          sleep 20
      - name: Production audit
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          STAGE="$APP/runtime-status/v375-opportunity-stage"
          EXPECT=$(cat "$STAGE/signal.sha256")
          ACT=$(sha256sum "$APP/src/safe-signal-export.js" | awk '{print $1}')
          echo EXPECTED_SIGNAL_SHA="$EXPECT"
          echo ACTIVE_SIGNAL_SHA="$ACT"
          [ "$ACT" = "$EXPECT" ]
          for svc in meme-alpha-paper meme-alpha-micro-live meme-alpha-realtime-pulse meme-alpha-signer meme-alpha-trend-pulse meme-alpha-whale-flow; do systemctl is-active --quiet "$svc.service"; done
          /usr/bin/node - "$APP/runtime-status/signal-snapshot.json" "$APP/runtime-status/micro-live-gate.json" <<'NODE'
          const fs=require('fs');const s=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));const g=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          if(s.version!=='3.75.0-opportunity-accelerator')throw new Error('SIGNAL_VERSION_NOT_V375');
          if(!Array.isArray(s.candidates)||!s.intelSummary)throw new Error('SIGNAL_SCHEMA_INVALID');
          if(g.allowed!==true)throw new Error('MICRO_LIVE_GATE_NOT_ALLOWED');
          const unsafe=s.candidates.filter(c=>c.decision==='PROBE_CANDIDATE'&&((c.hardReject||[]).length||c.securityDecision==='BLOCK'||c.sellRoute!==true));
          if(unsafe.length)throw new Error('UNSAFE_PROMOTION_LEAK');
          const down=s.candidates.filter(c=>c.intelMode==='BOTH_FEEDS_DOWN'&&c.decision==='PROBE_CANDIDATE');if(down.length)throw new Error('BOTH_FEEDS_DOWN_ENTRY_LEAK');
          console.log('SIGNAL_CANDIDATES='+s.candidates.length);
          console.log('PROBE_CANDIDATES='+s.candidates.filter(c=>c.decision==='PROBE_CANDIDATE').length);
          console.log('PROMOTED_REALTIME_BURST='+Number(s.intelSummary.promotedRealtimeBurst||0));
          console.log('PROMOTED_FAST_TRACK='+Number(s.intelSummary.promotedFastTrack||0));
          console.log('PROMOTED_PERSISTENCE='+Number(s.intelSummary.promotedPersistence||0));
          console.log('MICRO_LIVE_GATE_ALLOWED='+g.allowed);
          NODE
          grep -q '3.60.0-profit-aware-exits' "$APP/src/micro-live-executor.js"
          grep -q '3.74.0-held-continuity' "$APP/src/realtime-pulse.js"
          echo V375_HARD_SAFETY_GUARDS=PRESERVED
          echo V375_REALTIME_BURST_CONFIRMATION=ACTIVE
          echo V375_FAST_DISCOVERY=PRESERVED
          echo V374_HELD_CONTINUITY=PRESERVED
          echo V360_PROFIT_AWARE_EXECUTOR=PRESERVED
          echo V375_OPPORTUNITY_ACCELERATOR_PRODUCTION_ACTIVE=TRUE
