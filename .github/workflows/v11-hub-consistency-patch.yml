name: V11 Hub Consistency Patch

on:
  push:
    branches: [main]
    paths:
      - 'scripts/patch_v11_hub_consistency.py'
      - '.github/workflows/v11-hub-consistency-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v11-hub-consistency-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply consistency patch
        run: |
          set -euo pipefail
          python -m py_compile scripts/patch_v11_hub_consistency.py
          python scripts/patch_v11_hub_consistency.py
          node --check cloudflare-worker/v11/native-runtime.js
          node --check cloudflare-worker/hub-v11.js
          grep -q 'analyzeSingleSymbolV11' cloudflare-worker/v11/native-runtime.js
          grep -q 'analyzeSingleSymbolV11' cloudflare-worker/hub-v11.js
          ! grep -q ' • RR ' cloudflare-worker/hub-v11.js
          grep -q 'REFRESH LIVE = đánh giá lại bằng cùng engine phát lệnh' cloudflare-worker/hub-v11.js
      - name: Full worker preflight
        working-directory: cloudflare-worker
        run: npm run check
      - name: Commit patched runtime and Hub
        run: |
          set -euo pipefail
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/v11/native-runtime.js cloudflare-worker/hub-v11.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: unify Hub symbol evaluation with native V11 runtime'
          git pull --rebase origin main
          git push origin HEAD:main
