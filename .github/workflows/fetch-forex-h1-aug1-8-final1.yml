name: Fetch Forex H1 Aug1-8 Final1
on:
  push:
    paths:
      - 'scripts/fetch_forex_h1_aug1_8_2026.py'
      - '.github/workflows/fetch-forex-h1-aug1-8-final1.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  final1:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cool down Twelve Data quota
        run: sleep 70
      - name: Fetch untouched Aug week one for all 28 pairs
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          test -n "$TWELVEDATA_API_KEY" || (echo 'TWELVEDATA_API_KEY missing' && exit 1)
          python scripts/fetch_forex_h1_aug1_8_2026.py
      - name: Freeze final holdout snapshot
        run: |
          git config user.name 'provider-final-holdout-bot'
          git config user.email 'provider-final-holdout-bot@users.noreply.github.com'
          git add data/provider_snapshots/forex_h1_aug1_8_2026_final1.json
          git commit -m 'Freeze untouched Forex Aug week-one holdout' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
