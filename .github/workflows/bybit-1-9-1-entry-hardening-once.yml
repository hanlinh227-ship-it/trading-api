name: Bybit 1.9.1 Entry Hardening Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-1-9-1-entry-hardening-once.yml'
      - 'scripts/bybit_191_patch_once.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch branch and validate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bybit_191_patch_once.py /tmp/bybit_191_patch_once.py
          BR='claude/bybit-1-9-1-entry-hardening-20260827'
          git fetch origin "$BR:$BR"
          git checkout "$BR"
          python3 /tmp/bybit_191_patch_once.py
          node --check cloudflare-worker/bybit-auto-v1.js
          node --check cloudflare-worker/bybit-scalp-engine.js
          cd cloudflare-worker
          npm install --no-audit --no-fund
          npm run check
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bybit): 1.9.1 candidate fallback and runtime conflict cleanup'
          git push origin HEAD:"$BR"
