name: Bybit 1.9.1 Entry Hardening Once
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-1-9-1-entry-hardening-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch branch and validate
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/bybit_191_patch_once.py /tmp/bybit_191_patch_once.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/bybit_191_patch_once.py'); s=p.read_text()
          a=s.index("old=Path('.github/workflows/bybit-runtime-3ai-diagnostic.yml')")
          b=s.index("Path('docs/checkpoints/BYBIT_AUTO_1_9_1_STATE.md')",a)
          s=s[:a]+s[b:]
          s=s.replace(",'.github/workflows/deploy-cloudflare-worker.yml'","")
          p.write_text(s)
          PY
          BR='claude/bybit-1-9-1-entry-hardening-20260827'
          git fetch origin "$BR:$BR"
          git checkout "$BR"
          python3 /tmp/bybit_191_patch_once.py
          node --check cloudflare-worker/bybit-auto-v1.js
          node --check cloudflare-worker/bybit-scalp-engine.js
          cd cloudflare-worker
          npm install --no-audit --no-fund
          npm run check
          cd ..
          rm -f cloudflare-worker/package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(bybit): 1.9.1 candidate fallback and runtime conflict cleanup'
          git push origin HEAD:"$BR"
