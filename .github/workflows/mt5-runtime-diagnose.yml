name: MT5 Runtime Diagnose

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-runtime-diagnose.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Inspect MT5 EA startup
        shell: bash
        run: |
          set +e
          source /var/lib/trading/mt5-forex/runtime.env
          echo '=== BRIDGE ==='
          find "$MT5_INSTALL_DIR/MQL5/Files/FOREX_BRIDGE" -maxdepth 1 -type f -printf '%TY-%Tm-%Td %TH:%TM:%TS %s %f\n' 2>/dev/null | sort || true
          cat /var/lib/trading/mt5-forex/bridge-health.json 2>/dev/null || true
          echo
          echo '=== STARTUP ==='
          sed -E 's/^(Password=).*/\1[REDACTED]/' "$MT5_INSTALL_DIR/mt5-forex-start.ini" 2>/dev/null || true
          echo '=== TERMINAL LOG MATCHES ==='
          find "$MT5_INSTALL_DIR/Logs" -maxdepth 1 -type f 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null | grep -Ei 'expert|ForexAuto|algo|trade|login|connect|server|startup|config' | tail -n 160 || true
          done
          echo '=== MQL5 LOG MATCHES ==='
          find "$MT5_INSTALL_DIR/MQL5/Logs" -maxdepth 1 -type f 2>/dev/null | while read -r f; do
            echo "--- $f ---"
            iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null | grep -Ei 'ForexAuto|expert|init|timer|failed|error|removed|trade' | tail -n 200 || true
          done
          echo '=== FILES ==='
          ls -l "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.mq5" "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.ex5" "$MT5_INSTALL_DIR/MQL5/Presets/ForexAutoThe5ers.set" 2>/dev/null || true
          echo '=== SERVICES ==='
          systemctl is-active mt5-forex.service mt5-forex-bridge.service || true
