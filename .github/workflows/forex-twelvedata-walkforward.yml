name: FOREX TwelveData WalkForward
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/forex_twelvedata_walkforward_v4.py'
      - '.github/workflows/forex-twelvedata-walkforward.yml'
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      BACKTEST_WINDOWS: '6'
      BACKTEST_WINDOW_DAYS: '24'
      BACKTEST_MIN_TEST_DAYS: '18'
      BACKTEST_TARGET_WR: '80'
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run strict selective random walk-forward validation
        run: python3 scripts/forex_twelvedata_walkforward_v4.py
      - name: Assert evidence exists
        run: test -s data/forex-twelvedata-walkforward-latest.json
      - name: Commit all evidence including failures without rebase conflicts
        if: always()
        run: |
          test -s data/forex-twelvedata-walkforward-latest.json || exit 1
          cp data/forex-twelvedata-walkforward-latest.json /tmp/forex-evidence.json
          git config user.name 'forex-backtest-bot'
          git config user.email 'forex-backtest-bot@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p data/forex-walkforward-runs
          cp /tmp/forex-evidence.json data/forex-twelvedata-walkforward-latest.json
          cp /tmp/forex-evidence.json "data/forex-walkforward-runs/run-${GITHUB_RUN_ID}.json"
          git add data/forex-twelvedata-walkforward-latest.json data/forex-walkforward-runs/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: persist Forex walk-forward evidence run ${GITHUB_RUN_ID}"
          git push origin HEAD:main
