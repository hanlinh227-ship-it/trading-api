name: Finalize V77.15.1 Actionable Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77151_finalize.js'
      - '.github/workflows/apply-v77151-finalize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and validate
        shell: bash
        run: |
          set +e
          : > V77151_DIAGNOSTIC.txt
          node --check scripts/apply_v77151_finalize.js >> V77151_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77151_DIAGNOSTIC.txt
          node scripts/apply_v77151_finalize.js >> V77151_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77151_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77151_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77151_DIAGNOSTIC.txt
          for t in 'V77.15.1' 'function planSignal' 'function refinedLimitPlan' 'function conditionalPlanFromRoute' 'deepNonCryptoCandidates: 5' 'future:emptyGroup()' 'symmarket:' 'MASSIVE_API_KEY'; do
            if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77151_DIAGNOSTIC.txt; else echo "$t=NO" >> V77151_DIAGNOSTIC.txt; fi
          done
          exit 0
      - name: Commit canonical Worker
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77151_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77151_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77151_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77151_DIAGNOSTIC.txt && grep -q 'V77.15.1=YES' V77151_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Finalize V77.15.1 actionable multi-market hub' || exit 0
          git push origin main
