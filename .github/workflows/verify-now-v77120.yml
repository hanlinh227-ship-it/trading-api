name: Verify Now V77.12 Fresh State
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-now-v77120.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Run immediate production checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77120_NOW_LIVE.txt
          curl -fsS --max-time 30 "$BASE/status" -o /tmp/s.json; echo STATUS_CURL=$? >> V77120_NOW_LIVE.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/b1.json; echo BEFORE_CURL=$? >> V77120_NOW_LIVE.txt
          curl -fsS --max-time 90 "$BASE/run-now?group=crypto" -o /tmp/c1.json; echo C1_CURL=$? >> V77120_NOW_LIVE.txt
          sleep 2
          curl -fsS --max-time 90 "$BASE/run-now?group=crypto" -o /tmp/c2.json; echo C2_CURL=$? >> V77120_NOW_LIVE.txt
          curl -fsS --max-time 30 "$BASE/latest-scan?group=crypto" -o /tmp/l.json; echo LATEST_CURL=$? >> V77120_NOW_LIVE.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/b2.json; echo AFTER_CURL=$? >> V77120_NOW_LIVE.txt
          node - <<'NODE' >> V77120_NOW_LIVE.txt 2>&1
          const fs=require('fs'); const r=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json'))}catch(e){return {e:e.message}}};
          const s=r('s'),a=r('c1'),b=r('c2'),l=r('l'),o1=r('b1'),o2=r('b2');
          const cnt=o=>['forex','crypto','metal'].map(g=>{const x=o[g]||{};return g+':'+(x.marketActive||[]).length+'/'+(x.limitActive||[]).length+'/'+(x.limitPending||[]).length+'/w'+(x.watch||[]).length}).join('|');
          console.log('VERSION='+(s.version||'-')); console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));
          console.log('C1_SCAN='+(a.scanId||'-')); console.log('C2_SCAN='+(b.scanId||'-')); console.log('DIFFER='+(a.scanId&&b.scanId&&a.scanId!==b.scanId?'YES':'NO'));
          console.log('C1='+(a.broadOk??'-')+'/'+(a.requested??'-')+' deep='+(a.deepOk??'-')+'/'+(a.deepRequested??'-'));
          console.log('C2='+(b.broadOk??'-')+'/'+(b.requested??'-')+' deep='+(b.deepOk??'-')+'/'+(b.deepRequested??'-'));
          console.log('LATEST='+(l.snapshot?.scanId||'-')); console.log('LATEST_MATCH='+(l.snapshot?.scanId===b.scanId?'YES':'NO'));
          console.log('BEFORE='+cnt(o1)); console.log('AFTER='+cnt(o2)); console.log('ORDER_STATE_SAME='+(cnt(o1)===cnt(o2)?'YES':'NO'));
          console.log('WATCH_NOT_DURABLE='+(['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0)?'YES':'NO'));
          console.log('VERDICT='+(s.version==='V77.12.0'&&s.ok===true&&a.scanId&&b.scanId&&a.scanId!==b.scanId&&l.snapshot?.scanId===b.scanId&&cnt(o1)===cnt(o2)&&['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0)?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77120_NOW_LIVE.txt
          git commit -m 'Report immediate V77.12 fresh-state verification' || exit 0
          git push origin main
