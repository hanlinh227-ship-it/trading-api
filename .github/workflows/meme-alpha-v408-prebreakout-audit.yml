name: Meme Alpha V408B Prebreakout Scheduling Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v408-prebreakout-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect hot-candidate scheduling bottlenecks
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"
          echo '=== RADAR TOP ==='; sed -n '1,95p' "$APP/src/new-listing-radar.js"
          echo '=== REALTIME TOP / DESIRED ==='; sed -n '1,125p' "$APP/src/realtime-pool-pulse.js"
          echo '=== WHALE TOP / PICK ==='; sed -n '1,155p' "$APP/src/whale-flow-intel.js"
          echo '=== SIGNAL AUDIT / ROUTER / MAIN ==='; sed -n '20,135p' "$APP/src/safe-signal-export.js"; sed -n '180,335p' "$APP/src/safe-signal-export.js"
          echo '=== SCANNER ORDER ==='; grep -nE 'candidates|sort\(|slice\(|radar|new-listing|fastDiscovery|score|netBuyers|liquidity' "$APP/src/scanner.js" | tail -180 || true
          echo '=== HOT SNAPSHOT CROSSCHECK ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          def r(n):
            try:return json.loads((rt/n).read_text())
            except:return {}
          sig=r('signal-snapshot.json'); radar=r('new-listing-radar.json'); realtime=r('realtime-pool-pulse.json'); whale=r('whale-flow-intel.json'); trend=r('trend-pulse.json')
          hot=sorted((radar.get('candidates') or []),key=lambda x:(x.get('discoveryPriority') or x.get('preScore') or 0),reverse=True)[:12]
          sm={x.get('mint'):x for x in sig.get('candidates',[]) if isinstance(x,dict)}; rm={x.get('mint'):x for x in realtime.get('rows',[]) if isinstance(x,dict)}; wm={x.get('mint'):x for x in whale.get('rows',[]) if isinstance(x,dict)}; tm={x.get('mint'):x for x in trend.get('rows',[]) if isinstance(x,dict)}
          for x in hot:
            m=x.get('mint'); s=sm.get(m,{}) or {}; q=rm.get(m,{}) or {}; w=wm.get(m,{}) or {}; t=tm.get(m,{}) or {}
            print({'symbol':x.get('symbol'),'mint':m,'fast':x.get('fastDiscoveryLane'),'priority':x.get('discoveryPriority'),'age':x.get('pairAgeSec'),'preScore':x.get('preScore'),'radarBuys5m':x.get('buys5m'),'radarVol5m':x.get('volume5m'),'radarChg5m':x.get('priceChange5m'),'signalDecision':s.get('decision'),'score':s.get('score'),'security':s.get('securityDecision'),'holder':s.get('holderClusterDecision'),'insider':s.get('insiderRiskDecision'),'hardReject':s.get('hardReject'),'sellRoute':s.get('sellRoute'),'rtSubscribed':q.get('subscribed'),'rtEvents5s':q.get('events5s'),'rtMom':q.get('eventMomentum'),'rtAge':q.get('lastEventAgeMs'),'whaleSource':w.get('sourceMode'),'whaleAgeMs':(time.time()*1000-(time.mktime(time.strptime(w.get('observedAt')[:19],'%Y-%m-%dT%H:%M:%S'))*1000) if w.get('observedAt') else None),'pulse':t.get('pulseScore'),'status':t.get('status'),'volAccel':t.get('volumeAcceleration'),'txnAccel':t.get('txnAcceleration')})
          print('REALTIME_META',{k:realtime.get(k) for k in ['status','hotsetLimit','desiredRefreshMs','reconcileMs','snapshotMs','desiredSetSize','activeSetSize','fastSubscriptions','heldSubscriptions','lastError','reconnectFailures']})
          print('WHALE_META',{k:whale.get(k) for k in ['status','cycleMs','rpcSpacingMs','oneMintPerCycle','inspectedMint','inspectedKind','heldQueueSize','otherQueueSize','error']})
          PY
          echo V408B_SCHEDULING_AUDIT=COMPLETE
