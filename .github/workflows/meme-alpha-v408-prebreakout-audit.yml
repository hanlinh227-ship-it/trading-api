name: Meme Alpha V408C Scanner Priority Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v408-prebreakout-audit.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Inspect exact scanner priority block
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== SCANNER RADAR MERGE ==='; sed -n '325,425p' "$APP/src/scanner.js"
          echo '=== SCANNER SCORE / PRELIM ==='; sed -n '590,875p' "$APP/src/scanner.js"
          echo '=== SCANNER DEEP SELECTION ==='; sed -n '1015,1085p' "$APP/src/scanner.js"
          echo '=== EXECUTOR ENTRY SCORE ==='; sed -n '83,92p' "$APP/src/micro-live-executor.js"; sed -n '139,155p' "$APP/src/micro-live-executor.js"
          echo V408C_SCANNER_PRIORITY_AUDIT=COMPLETE
