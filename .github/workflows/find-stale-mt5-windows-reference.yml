name: Find Stale MT5 Windows Reference
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/find-stale-mt5-windows-reference.yml'
permissions:
  contents: read
jobs:
  find:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Find exact legacy runtime references
        shell: bash
        run: |
          set -euo pipefail
          grep -RFn --exclude='validate-forex-runtime.mjs' --exclude='validate-worker.mjs' 'executionTerminal:"MT5_WINDOWS"' cloudflare-worker || true
          echo 'DONE'
