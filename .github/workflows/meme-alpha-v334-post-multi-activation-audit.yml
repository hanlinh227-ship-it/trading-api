name: Meme Alpha v3.34 Post Multi Activation Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v334-post-multi-activation-audit.sh'
      - '.github/workflows/meme-alpha-v334-post-multi-activation-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
      - name: Verify multi-position runtime after root activation
        run: bash ops/meme-alpha/v334-post-multi-activation-audit.sh
