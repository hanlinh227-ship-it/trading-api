name: V13 Opposite Findings
on:
  push:
    paths:
      - "scripts/v13_opposite_findings.py"
      - ".github/workflows/v13-opposite-findings.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/v13_opposite_findings.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v13_opposite_findings.txt
          git commit -m "Extract V13 opposite findings" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
