name: Dual Random10 Refine V12 Survival

on:
  push:
    branches: [main]
    paths:
      - 'research/dual_random10_refine_v12_survival.py'
      - '.github/workflows/dual-random10-refine-v12-survival.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    name: backtest (${{ matrix.symbol }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} V12 survival random10
        run: |
          mkdir -p research/results
          python3 research/dual_random10_refine_v12_survival.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_random10_v12.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-random10-v12-result
          path: research/results/${{ matrix.symbol }}_random10_v12.txt
          retention-days: 30
          if-no-files-found: error
