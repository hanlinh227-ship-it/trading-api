name: Apply V77.7.1 quota guard

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v7771_quota_guard.js'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply quota guard
        run: node scripts/apply_v7771_quota_guard.js
      - name: Syntax check
        run: node --check cloudflare-worker/index.js
      - name: Verify quota guard tokens
        run: |
          grep -q 'V77.7.1' cloudflare-worker/index.js
          grep -q 'tdQuotaStatus' cloudflare-worker/index.js
          grep -q 'RATE_BUDGET_WAIT' cloudflare-worker/index.js
          grep -q 'tdCreditsPlanned' cloudflare-worker/index.js
      - name: Commit canonical Worker
        run: |
          if git diff --quiet -- cloudflare-worker/index.js; then
            echo 'No quota-guard changes required.'
            exit 0
          fi
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add cloudflare-worker/index.js
          git commit -m 'Guard Twelve Data minute quota in V77.7.1'
          git push origin main
