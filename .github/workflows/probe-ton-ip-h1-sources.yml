name: Probe TON IP H1 Sources
on:
  push:
    paths:
      - 'scripts/probe_ton_ip_h1_sources.py'
      - '.github/workflows/probe-ton-ip-h1-sources.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe_ton_ip_h1_sources.py
