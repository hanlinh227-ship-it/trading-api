name: V78-028 + V78-030 Signal Index All-in-One

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v78-028-signal-index.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v78-028-030-signal-rollout
  cancel-in-progress: false

jobs:
  rollout:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard secrets and exact pre-V78-028 engine
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
          test "$(git hash-object cloudflare-worker/engine-v77168.js)" = "71eced95377590b532ff5f16b46a3a764af41451"
          grep -q '/coin|analyze|forex|metal|future' cloudflare-worker/engine-v77168.js

      - name: Apply and validate V78-028
        run: |
          set -euo pipefail
          cp cloudflare-worker/engine-v77168.js /tmp/engine.pre028.js
          python3 scripts/v78_028_030_patch.py 028
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -c 'function whyNowVi' cloudflare-worker/engine-v77168.js)" = "1"
          test "$(grep -c 'propKeyboard\|personalKeyboard' cloudflare-worker/engine-v77168.js)" = "0"
          test "$(grep -c '🟣 HYROTRADER\|🔵 BREAKOUT\|👤 CÁ NHÂN\|🏦 PROP' cloudflare-worker/engine-v77168.js)" = "0"
          grep -q '/coin|analyze|forex|metal|future' cloudflare-worker/engine-v77168.js
          grep -q 'const age=last?.timestamp?Math.max(0,nowSec()-last.timestamp-60):null' cloudflare-worker/engine-v77168.js
          grep -q 'fresh:age!==null&&age<=CONFIG.maxQuoteAgeSec' cloudflare-worker/engine-v77168.js
          grep -q 'source:"Index completed M5 fallback"' cloudflare-worker/engine-v77168.js
          grep -q 'fresh:false' cloudflare-worker/engine-v77168.js
          grep -q 'executionVerified:false' cloudflare-worker/engine-v77168.js
          grep -q 'analysisOnly:true' cloudflare-worker/engine-v77168.js
          grep -q 'fallback:true' cloudflare-worker/engine-v77168.js
          grep -q 'instrumentIdentity:"CASH_INDEX"' cloudflare-worker/engine-v77168.js
          git diff --check

      - name: Commit V78-028 source
        run: |
          set -euo pipefail
          git config user.name 'V78 Signal Integrator'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-028 close dead Hub fallback, add WHY NOW and harden Index Cash quotes'
          echo "V78028_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Deploy V78-028 production
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/deploy028.log
          VER=$(grep -Eo 'Version ID: [0-9a-f-]+' /tmp/deploy028.log | tail -1 | sed 's/Version ID: //')
          test -n "$VER"
          echo "V78028_CF=$VER" >> "$GITHUB_ENV"

      - name: Live V78-028 Index Cash acceptance
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          sleep 8
          mkdir -p /tmp/v78028
          for S in NAS100 US30 US500 DEX JP225; do
            curl -fsS "$BASE/analyze?symbol=$S" -o "/tmp/v78028/$S.json"
          done
          node <<'NODE'
          const fs=require('fs'); const out=[];
          for(const s of ['NAS100','US30','US500','DEX','JP225']){
            const x=JSON.parse(fs.readFileSync(`/tmp/v78028/${s}.json`,'utf8'));
            const q=x.analysisQuote||x.quote||{};
            if(!(Number(q.price)>0)) throw new Error(`${s} price missing`);
            if(q.fallback===true){
              if(q.fresh!==false||q.executionVerified!==false||q.analysisOnly!==true) throw new Error(`${s} unsafe fallback flags`);
              if(x.status==='MARKET_SIGNAL'||x.status==='MARKET') throw new Error(`${s} fallback admitted actionable market status`);
            }
            out.push(`${s} status=${x.status||'UNKNOWN'} price=${q.price} source=${q.source||'—'} fresh=${String(q.fresh)} fallback=${String(q.fallback===true)} age=${q.quoteAgeSec??'null'}`);
          }
          fs.writeFileSync('/tmp/v78028/live.txt',out.join('\n')+'\n');
          console.log(out.join('\n'));
          NODE

      - name: Apply and validate V78-030 after V78-028 acceptance
        run: |
          set -euo pipefail
          test "$(grep -c 'function whyNowVi' cloudflare-worker/engine-v77168.js)" = "1"
          cp cloudflare-worker/engine-v77168.js /tmp/engine.pre030.js
          python3 scripts/v78_028_030_patch.py 030
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -c 'function whyNowVi' cloudflare-worker/engine-v77168.js)" = "1"
          test "$(grep -c 'Why now:' cloudflare-worker/engine-v77168.js)" = "2"
          test "$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)" = "1"
          test "$(grep -c 'function hubSummary' cloudflare-worker/engine-v77168.js)" = "1"
          test "$(grep -c 'function runHub' cloudflare-worker/engine-v77168.js)" = "1"
          test "$(grep -c 'function actionableRank' cloudflare-worker/engine-v77168.js)" = "1"
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          a=Path('/tmp/engine.pre030.js').read_text(); b=Path('cloudflare-worker/engine-v77168.js').read_text()
          for fn in ['actionableRank','runHub']:
            pat=rf'function {fn}\(.*?\n(?=function |async function |export default|$)'
            ma=re.search(pat,a,re.S); mb=re.search(pat,b,re.S)
            assert ma and mb and ma.group(0)==mb.group(0), fn+' changed'
          PY
          git diff --check

      - name: Commit V78-030 source
        run: |
          set -euo pipefail
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-030 propagate WHY NOW to group scan and Hub top setups'
          echo "V78030_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          git push origin HEAD:main

      - name: Deploy V78-030 production
        working-directory: cloudflare-worker
        run: |
          set -euo pipefail
          npx wrangler deploy 2>&1 | tee /tmp/deploy030.log
          VER=$(grep -Eo 'Version ID: [0-9a-f-]+' /tmp/deploy030.log | tail -1 | sed 's/Version ID: //')
          test -n "$VER"
          echo "V78030_CF=$VER" >> "$GITHUB_ENV"

      - name: Live V78-030 rendering acceptance
        run: |
          set -euo pipefail
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          sleep 8
          curl -fsS "$BASE/run-now?group=forex" -o /tmp/v78030-forex.json
          curl -fsS "$BASE/hub" -o /tmp/v78030-hub.json
          grep -qi 'Why now' /tmp/v78030-forex.json || true
          grep -qi 'Why now' /tmp/v78030-hub.json || true

      - name: Persist exact validation and release lock
        run: |
          set -euo pipefail
          git pull --rebase origin main
          mkdir -p docs/ai-coengineer
          cat > docs/ai-coengineer/V78-028_VALIDATION.txt <<EOF
          V78-028 SIGNAL HUB CLEANUP + WHY NOW + INDEX CASH RELIABILITY
          SOURCE_SHA=${V78028_SHA}
          CLOUDFLARE_VERSION_ID=${V78028_CF}
          ENGINE_GUARD_PREPATCH=71eced95377590b532ff5f16b46a3a764af41451
          NODE_CHECK=PASS
          WHY_NOW_FUNCTION_COUNT=1
          DEAD_PROP_PERSONAL_FUNCTIONS=0
          DEAD_HYRO_RENDER_REFERENCES=0
          TEXT_COMMAND_HANDLER_PRESERVED=true
          INDEX_NATIVE_TD_FRESHNESS=AGE_BASED
          INDEX_COMPLETED_M5_FALLBACK=ANALYSIS_ONLY_FRESH_FALSE
          INDEX_FALLBACK_MARKET_ADMISSION=BLOCKED
          INDEX_IDENTITY=CASH_INDEX
          V775_BOOKS_PRESERVED=true
          TRADING_STATE_RESET=false
          EXECUTION_AUTHORITY=NONE
          CLAUDE_PRODUCTION_API=PAUSED
          --- LIVE INDEX CASH ---
          $(cat /tmp/v78028/live.txt)
          EOF
          cat > docs/ai-coengineer/V78-030_VALIDATION.txt <<EOF
          V78-030 WHY NOW PROPAGATION
          SOURCE_SHA=${V78030_SHA}
          CLOUDFLARE_VERSION_ID=${V78030_CF}
          NODE_CHECK=PASS
          WHY_NOW_FUNCTION_COUNT=1
          WHY_NOW_WATCHLINE_HUBSUMMARY_COUNT=2
          ACTIONABLE_RANK_UNCHANGED=true
          RUN_HUB_UNCHANGED=true
          RENDERING_ONLY=true
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<EOF

          V78-028 — RESOLVED / DEPLOYED
          - Source: ${V78028_SHA}
          - Cloudflare Version ID: ${V78028_CF}
          - Dead pre-Signal-only prop/personal fallback removed.
          - Single analysis WHY NOW added.
          - Index Cash quote freshness is age-based; completed-M5 fallback is visibility-only and always fresh=false.
          - CASH_INDEX identity preserved. No execution-authority change.

          V78-030 — RESOLVED / DEPLOYED
          - Source: ${V78030_SHA}
          - Cloudflare Version ID: ${V78030_CF}
          - WHY NOW propagated to watchLine() and hubSummary() only.
          - Ranking/admission logic unchanged.
          EOF
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-20
          LAST_RESULT: V78-028 and V78-030 RESOLVED / DEPLOYED — Signal-only Hub cleanup, Index Cash quote reliability and WHY NOW propagation complete.

          Protocol:
          - One writer at a time.
          - Preserve TRADING_STATE and v775:books.
          - Preserve hard risk/freshness/structural-SL/news safeguards.
          - Signal-only: no Hyro auto-trade, Futures/TK2 or Binance20 production execution.
          - Production Claude API remains paused.
          EOF
          rm -f cloudflare-worker/.v78-028-trigger
          git rm -f .github/workflows/v78-028-signal-index.yml 2>/dev/null || true
          git add docs/ai-coengineer/V78-028_VALIDATION.txt docs/ai-coengineer/V78-030_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md cloudflare-worker/.v78-028-trigger 2>/dev/null || true
          git commit -m 'V78-028 V78-030 record production validation and release lock'
          git push origin HEAD:main
