name: Forex ChatGPT Runtime Hardening
on:
  push:
    branches: [main]
    paths: ['.github/workflows/forex-chatgpt-runtime-hardening.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/forex-runtime-hardening-20260827
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch Forex bridge and stale validator locks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/forex-autonomous-mt5-bridge.js')
          s=p.read_text()
          replacements={
            'b) cooldown elapsed (default 30s, env-overridable)':'b) cooldown elapsed (default 10s, env-overridable)',
            '`🔁 Required side: ${decision.requiredSide||"—"}`':'`↔️ Side policy: FREE BUY/SELL • max streak 3`',
            '`🔁 Next allowed entry: ${expectedNextSide(side)}`':'`↔️ Side policy: FREE BUY/SELL • max streak 3`',
            'if(!council.ok)decision={action:"NO_TRADE",reason:"PURE_AI_2AI_NOT_HEALTHY",requiredSide};':'if(!council){/* preserve AI_ENTRY_COOLDOWN decision when council call is not due */}\n   else if(!council.ok)decision={action:"NO_TRADE",reason:"PURE_AI_2AI_NOT_HEALTHY",requiredSide};',
            'alternation:{lastFilledSide:account.lastFilledSide||null,requiredSide,sequence:"BUY->SELL->BUY->SELL",noForceEntry:true}':'sidePolicy:{mode:"FREE_WITH_ANTI_BIAS_STREAK_CAP",lastFilledSide:account.lastFilledSide||null,maxConsecutiveSameSide:3,noForceEntry:true}',
            'alternation:{lastFilledSide:s.account?.lastFilledSide||null,requiredSide:s.account?.expectedNextSide||"BUY",sequence:"BUY->SELL->BUY->SELL"}':'sidePolicy:{mode:"FREE_WITH_ANTI_BIAS_STREAK_CAP",lastFilledSide:s.account?.lastFilledSide||null,maxConsecutiveSameSide:3}'
          }
          for a,b in replacements.items():
              if a not in s: raise SystemExit(f'MISSING BRIDGE TEXT: {a}')
              s=s.replace(a,b)
          p.write_text(s)

          v=Path('cloudflare-worker/validate-forex-auto.mjs')
          s=v.read_text()
          reps={
            'FOREX-AUTO-0.6.3-USER-CAMPAIGN-510-3D':'FOREX-AUTO-0.7.0-FREE-SIDE-2AI',
            'AUTONOMOUS_2AI_PAPER':'AUTONOMOUS_2AI',
            'PURE_AI_DISCRETIONARY_INTRADAY_ULTRA_LOW_LATENCY':'PURE_AI_DISCRETIONARY_INTRADAY_FREER_ENTRY',
            'assert.equal(cfg.execution.decisionTtlSec,6)':'assert.equal(cfg.execution.decisionTtlSec,8)',
            'assert.equal(cfg.ai.openAiMaxOutputTokens,12000);assert.equal(cfg.ai.claudeMaxOutputTokens,12000)':'assert.equal(cfg.ai.openAiMaxOutputTokens,16000);assert.equal(cfg.ai.claudeMaxOutputTokens,16000)',
            'assert.equal(cfg.rules.alternateTradeSide,true);assert.equal(cfg.rules.alternationScope,"ACCOUNT_FILLED_ENTRY_SEQUENCE");assert.equal(cfg.rules.alternationNoForceEntry,true);':'assert.equal(cfg.rules.alternateTradeSide,false);assert.equal(cfg.rules.sidePolicy,"FREE_WITH_ANTI_BIAS_STREAK_CAP");assert.equal(cfg.rules.maxConsecutiveSameSide,3);',
            '"UP_TO_3_AI_CANDIDATES_COMMON_SYMBOL_SIDE_ORDER_TYPE"':'"entryCandidates may contain up to 5"',
            '"BUY->SELL->BUY->SELL",':'"FREE_SIDE_WITH_ANTI_BIAS",',
            '"ALTERNATION_HARD_LOCK",':'"SIDE_STREAK_CAP_3",',
            'buySellAlternation:true':'freeSideAntiBias:true'
          }
          for a,b in reps.items():
              if a not in s: raise SystemExit(f'MISSING VALIDATOR TEXT: {a}')
              s=s.replace(a,b)
          v.write_text(s)
          PY
      - name: Validate
        shell: bash
        run: |
          node --check cloudflare-worker/forex-autonomous-mt5-bridge.js
          node --check cloudflare-worker/validate-forex-auto.mjs
          node cloudflare-worker/validate-forex-auto.mjs
          node cloudflare-worker/validate-forex-runtime.mjs
      - name: Commit branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/forex-autonomous-mt5-bridge.js cloudflare-worker/validate-forex-auto.mjs
          git commit -m 'forex: harden free-side runtime and align validator'
          git push origin HEAD:chatgpt/forex-runtime-hardening-20260827
# retrigger v3
