name: Offline Crypto V58 Online Protect 2Month
on:
  push:
    paths:
      - 'scripts/offline_crypto_v58_online_protect_2month.py'
      - '.github/workflows/offline-crypto-v58-online-protect-2month.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        symbol: [DOT,FLOKI,INJ,LDO,ONDO,POL,TAO,WLD]
    steps:
      - uses: actions/checkout@v4
      - name: Run Jan-locked Feb-Mar online policy
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_SYMBOL: ${{ matrix.symbol }}
        run: python scripts/offline_crypto_v58_online_protect_2month.py
