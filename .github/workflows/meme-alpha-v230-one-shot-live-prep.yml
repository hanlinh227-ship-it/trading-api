name: Meme Alpha v2.3.0 One-Shot Live Prep

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v230-one-shot-live-prep.sh'
      - 'ops/meme-alpha/v229-final-assistant-audit.sh'
      - '.github/workflows/meme-alpha-v230-one-shot-live-prep.yml'

jobs:
  prepare:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: One-shot technical live preparation and final audit
        run: bash ops/meme-alpha/v230-one-shot-live-prep.sh
