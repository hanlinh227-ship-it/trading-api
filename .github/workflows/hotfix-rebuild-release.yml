name: Hotfix Rebuild Brain 4.9 Release

on:
  push:
    branches: [hotfix/brain-4-9-production-verification-v2]
    paths:
      - '.github/workflows/hotfix-rebuild-release.yml'

permissions:
  contents: write

jobs:
  rebuild-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/brain-4-9-production-verification-v2
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Rebuild release with canonical tool
        run: |
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.9.0 \
            --source human_authorized_adaptive_free_model_mesh_and_legion \
            --class C \
            --validated \
            --root .
      - name: Commit generated release state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_SKILL_LIBRARY/v4/releases
          if git diff --cached --quiet; then
            echo 'RELEASE_REBUILD=NO_CHANGE'
            exit 0
          fi
          git commit -m 'chore: rebuild Brain 4.9 release manifest'
          git push origin HEAD:hotfix/brain-4-9-production-verification-v2
