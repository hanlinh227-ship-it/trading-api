name: Offline Crypto TON V53 Progress
on:
  push:
    paths:
      - 'scripts/offline_crypto_ton_v53_progress.py'
      - '.github/workflows/offline-crypto-ton-v53-progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run TON progress management
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_ton_v53_progress.py
