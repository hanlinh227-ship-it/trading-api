name: V78-022 Retry Hub Top7 Quality Visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-022-retry.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v78-022-retry
  cancel-in-progress: false

jobs:
  apply-validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      WORKER_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard lock and engine blob
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^SCOPE: V78-022 Hub top-7 quality visibility$' docs/ai-coengineer/WRITE_LOCK.md
          actual="$(git hash-object cloudflare-worker/engine-v77168.js)"
          echo "engine_blob=$actual"
          test "$actual" = '58741958b9b8a646b54fe6b7b4045cacef8d843f'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"

      - name: Capture one pre-patch hub call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          req=urllib.request.Request(base+'/hub',headers={'User-Agent':'V78-022-prepatch/2.0'})
          with urllib.request.urlopen(req,timeout=240) as r:
              j=json.loads(r.read().decode())
          pre=[{'symbol':x.get('symbol'),'status':x.get('status'),'score':x.get('score'),'side':x.get('side')} for x in (j.get('top') or [])]
          pathlib.Path('/tmp/v78022-pre.json').write_text(json.dumps({'hubScanId':j.get('hubScanId'),'scannedAt':j.get('scannedAt'),'top':pre},indent=2,ensure_ascii=False))
          print(pathlib.Path('/tmp/v78022-pre.json').read_text())
          PY

      - name: Apply exact additive hubSummary suffix patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          anchor='reasonText(a.reason));L.push(line);});L.push('
          replacement='reasonText(a.reason));const ei=buildEntryIntelligenceShadow(a);if(ei)line+="\\n   ↳ Quality: "+ei.quality.grade+" ("+ei.quality.score+"/100)"+(ei.promotion.allowed===false?" • ⚠️ "+ei.promotion.reasons.join(","):"")+" • Fresh: "+ei.quote.freshness;L.push(line);});L.push('
          count=s.count(anchor)
          print('hubSummary_suffix_count=',count)
          if count != 1:
              raise SystemExit('STALE_WRITE_GUARD: hubSummary suffix count != 1')
          p.write_text(s.replace(anchor,replacement,1))
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/engine-v77168.js
          test "$(grep -c 'function hubSummary' cloudflare-worker/engine-v77168.js)" -eq 1
          test "$(grep -c 'const ei=buildEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js)" -eq 2
          test "$(grep -c 'const eiShadow=buildEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js)" -eq 1
          test "$(grep -Ec 'function hubKeyboard\(|async function runHub\(|async function sendHub\(' cloudflare-worker/engine-v77168.js)" -eq 3
          grep -q 'Fresh: "+ei.quote.freshness' cloudflare-worker/engine-v77168.js
          git diff --check
          git diff -- cloudflare-worker/engine-v77168.js | tee /tmp/v78022.diff
          ! grep -E '^[+-].*(function hubRank|async function runHub|\.sort\(\(a,b\)=>hubRank|\.slice\(0,7\))' /tmp/v78022.diff

      - name: Commit source locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78-022 Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-022 surface Entry Intelligence quality in Hub top setups'
          git rev-parse HEAD > /tmp/v78022-source-sha
          cat /tmp/v78022-source-sha

      - name: Deploy production
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/v78022-deploy.log
          grep -F "$WORKER_URL" /tmp/v78022-deploy.log

      - name: Capture one post-patch hub call
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          req=urllib.request.Request(base+'/hub',headers={'User-Agent':'V78-022-postpatch/2.0'})
          with urllib.request.urlopen(req,timeout=240) as r:
              j=json.loads(r.read().decode())
          post=[{'symbol':x.get('symbol'),'status':x.get('status'),'score':x.get('score'),'side':x.get('side')} for x in (j.get('top') or [])]
          pre=json.loads(pathlib.Path('/tmp/v78022-pre.json').read_text())
          report={'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'preHubScanId':pre.get('hubScanId'),'preScannedAt':pre.get('scannedAt'),'postHubScanId':j.get('hubScanId'),'postScannedAt':j.get('scannedAt'),'preTop':pre.get('top'),'postTop':post,'sameTopProjection':pre.get('top')==post,'note':'/hub performs fresh scans; any top rotation across calls is market/provider-state variation. Source diff proves hubRank/runHub selection code is unchanged.'}
          pathlib.Path('/tmp/v78022-live.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(pathlib.Path('/tmp/v78022-live.json').read_text())
          PY

      - name: Persist validation and release lock
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(cat /tmp/v78022-source-sha)"
          version_id="$(grep 'Current Version ID:' /tmp/v78022-deploy.log | tail -1 | sed 's/.*Current Version ID: //')"
          python3 - "$source_sha" "$version_id" <<'PY'
          from pathlib import Path
          import sys
          source_sha, version_id=sys.argv[1],sys.argv[2]
          live=Path('/tmp/v78022-live.json').read_text()
          Path('docs/ai-coengineer/V78-022_VALIDATION.txt').write_text(f'''V78-022 HUB TOP-7 QUALITY VISIBILITY
sourceCommit: {source_sha}
cloudflareVersionId: {version_id}
engine pre-patch blob guard: 58741958b9b8a646b54fe6b7b4045cacef8d843f PASS
node --check cloudflare-worker/engine-v77168.js: PASS
hubSummary definitions: 1 PASS
Entry Intelligence render surfaces: singleAnalysisText + watchLine + hubSummary PASS
hubKeyboard/runHub/sendHub definitions: 3 PASS
hubRank/runHub top selection source: unchanged PASS
scope: additive text rendering only; no decision/ranking/admission/KV/endpoint change
REQUIRED/QUALITY/OPTIONAL taxonomy: unchanged

=== LIVE /hub PRE/POST (ONE CALL EACH, NO RETRIES) ===
{live}

Interpretation:
- A live /hub call performs fresh scans, so pre/post top candidates may legitimately rotate between moments.
- Zero ranking behavior change is established by the guarded source diff: hubRank(), runHub(), sort/slice top selection are untouched; only hubSummary() rendering is additive.
- No Hyro authority, risk, freshness, structural SL, news, TRADING_STATE, v775:books, Binance20, or production Claude API pause change.
''')
          shared=Path('docs/ai-coengineer/SHARED_STATE.md')
          shared.write_text(shared.read_text()+f'''\n\nV78-022 — RESOLVED / DEPLOYED\n- Source commit: {source_sha}.\n- Hub cross-market top-setups rendering now shows Entry Intelligence Quality grade/score, blocked-promotion reasons, and Freshness.\n- hubRank/runHub top selection unchanged; rendering-only change.\n- Validation: docs/ai-coengineer/V78-022_VALIDATION.txt.\n- All three Signal candidate-rendering surfaces now expose the same quality/admission/freshness signal.\n''')
          Path('docs/ai-coengineer/WRITE_LOCK.md').write_text('''# AI WRITE LOCK

LOCKED: false
OWNER: NONE
SCOPE: NONE
RELEASED: 2026-08-20
LAST_OWNER: CHATGPT
LAST_SCOPE: V78-022 Hub top-7 quality visibility
RESULT: RESOLVED / DEPLOYED. Validation in docs/ai-coengineer/V78-022_VALIDATION.txt.

Protocol:
- Acquire a new lock before the next source write.
- Never reset TRADING_STATE or delete/reset v775:books.
- Never weaken hard risk/freshness/structural-SL/news safeguards.
- Never restore Futures/TK2.
- Binance20 remains NON_PRODUCTION / QUARANTINED.
- Production Claude API remains paused; Claude.ai Web remains full co-engineer.
''')
          PY
          git add docs/ai-coengineer/V78-022_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-022 validate production Hub top visibility and release lock'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "final_commit=$(git rev-parse HEAD)"
