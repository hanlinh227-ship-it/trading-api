name: Apply V77.11.1 GRAM Ticker
on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v77111_gram_ticker_migration.js'
      - '.github/workflows/apply-v77111-gram.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Apply and diagnose
        shell: bash
        run: |
          set +e
          : > V77111_DIAGNOSTIC.txt
          node --check scripts/apply_v77111_gram_ticker_migration.js >> V77111_DIAGNOSTIC.txt 2>&1; echo "GENERATOR_EXIT=$?" >> V77111_DIAGNOSTIC.txt
          node scripts/apply_v77111_gram_ticker_migration.js >> V77111_DIAGNOSTIC.txt 2>&1; echo "MIGRATION_EXIT=$?" >> V77111_DIAGNOSTIC.txt
          node --check cloudflare-worker/index.js >> V77111_DIAGNOSTIC.txt 2>&1; echo "WORKER_SYNTAX_EXIT=$?" >> V77111_DIAGNOSTIC.txt
          for t in 'V77.11.1' '"GRAM"' v73CryptoPriorKey canonicalUserSymbol 'TON→GRAM canonical' regimeRouteScores cryptoAnalysisFallbackBundle; do if grep -q "$t" cloudflare-worker/index.js; then echo "$t=YES" >> V77111_DIAGNOSTIC.txt; else echo "$t=NO" >> V77111_DIAGNOSTIC.txt; fi; done
          if grep -q '"TON"' cloudflare-worker/index.js; then echo 'TON_TOKEN_REMAINS=YES' >> V77111_DIAGNOSTIC.txt; else echo 'TON_TOKEN_REMAINS=NO' >> V77111_DIAGNOSTIC.txt; fi
          exit 0
      - name: Commit on pass
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77111_DIAGNOSTIC.txt
          if grep -q 'GENERATOR_EXIT=0' V77111_DIAGNOSTIC.txt && grep -q 'MIGRATION_EXIT=0' V77111_DIAGNOSTIC.txt && grep -q 'WORKER_SYNTAX_EXIT=0' V77111_DIAGNOSTIC.txt && grep -q 'V77.11.1=YES' V77111_DIAGNOSTIC.txt; then git add cloudflare-worker/index.js; fi
          git commit -m 'Promote V77.11.1 GRAM canonical ticker' || exit 0
          git push origin main
