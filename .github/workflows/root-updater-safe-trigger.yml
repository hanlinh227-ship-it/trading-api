name: Root Updater Safe Trigger

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/root-updater-safe-trigger.yml'

permissions:
  contents: write

jobs:
  trigger:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ask systemd to run the existing updater now
        shell: bash
        run: |
          set +e
          OUT="$GITHUB_WORKSPACE/meme-alpha-runtime/ROOT-UPDATER-TRIGGER.md"
          MSG="$(systemctl start auto-futures-update.service 2>&1)"
          RC=$?
          if [[ "$RC" -eq 0 ]]; then RESULT=AUTHORIZED_AND_STARTED; else RESULT=NOT_AUTHORIZED_OR_FAILED; fi
          CLASS=NONE
          if grep -qi 'authentication\|interactive authentication\|access denied\|permission denied' <<<"$MSG"; then CLASS=POLICY_DENIED;
          elif grep -qi 'failed' <<<"$MSG"; then CLASS=SYSTEMD_START_FAILED;
          fi
          sleep 2
          cat > "$OUT" <<EOF
          # Root Updater Safe Trigger

          - request_result: \`$RESULT\`
          - request_exit_code: \`$RC\`
          - failure_class: \`$CLASS\`
          - service_state_after_request: \`$(systemctl is-active auto-futures-update.service 2>/dev/null || true)\`
          - timer_state: \`$(systemctl is-active auto-futures-update.timer 2>/dev/null || echo unknown)\`
          - checked_at_utc: \`$(date -u +%FT%TZ)\`
          EOF
          exit 0
      - name: Commit trigger result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "meme-alpha-vps-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add meme-alpha-runtime/ROOT-UPDATER-TRIGGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: record safe root updater trigger result"
          git push origin HEAD:main
