name: Meme Alpha v3.75 Gate Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/meme-alpha-v375-gate-diagnostic.yml']
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
      - name: Inspect executor gates
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          F="$APP/src/micro-live-executor.js"
          echo '=== SERVICES ==='
          for svc in meme-alpha-paper meme-alpha-micro-live meme-alpha-realtime-pulse meme-alpha-signer meme-alpha-trend-pulse meme-alpha-whale-flow; do printf '%s=' "$svc"; systemctl is-active "$svc" || true; done
          echo '=== LIVE GATE ==='
          cat "$APP/runtime-status/micro-live-gate.json" 2>/dev/null || true
          echo '=== SIGNAL ==='
          /usr/bin/node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')),c=x.candidates||[];console.log(JSON.stringify({version:x.version,updatedAt:x.updatedAt,intelSummary:x.intelSummary,probe:c.filter(z=>z.decision==='PROBE_CANDIDATE').length,watch:c.filter(z=>z.decision==='WATCH').length,ignore:c.filter(z=>z.decision==='IGNORE').length,unsafeProbe:c.filter(z=>z.decision==='PROBE_CANDIDATE'&&((z.hardReject||[]).length||z.securityDecision==='BLOCK'||z.sellRoute!==true)).length},null,2))" "$APP/runtime-status/signal-snapshot.json"
          echo '=== REALTIME ==='
          /usr/bin/node -e "const fs=require('fs'),x=JSON.parse(fs.readFileSync(process.argv[1],'utf8'));console.log(JSON.stringify({version:x.version,status:x.status,subscriptions:x.subscriptions,fastSubscriptions:x.fastSubscriptions,heldTotal:x.heldTotal,heldResolved:x.heldResolved,heldUnresolved:x.heldUnresolved,reconnectCount:x.reconnectCount,lastError:x.lastError},null,2))" "$APP/runtime-status/realtime-pool-pulse.json"
          echo '=== PORTFOLIO ==='
          cat "$APP/runtime-status/portfolio-observability.json" 2>/dev/null || true
          echo V375_GATE_DIAGNOSTIC=END
