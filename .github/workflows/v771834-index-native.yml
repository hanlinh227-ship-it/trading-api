name: V77.18.34 Native Index Failover
on:
  push:
    branches: [v771834-index-native-failover]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771834-index-native-failover
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply native index patch
        run: python3 scripts/patch_v771834_index_native.py
      - name: Validate source bundle
        run: |
          cd cloudflare-worker
          node validate-worker.mjs
          npm install --no-audit --no-fund
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771834-dist
      - name: Commit production source only
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/index.js cloudflare-worker/hub-v77171.js
          git commit -m "V77.18.34 Native index failover" || exit 0
          git push origin HEAD:v771834-index-native-failover
# trigger
