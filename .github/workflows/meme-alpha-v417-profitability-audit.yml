name: Meme Alpha V417 Profitability Audit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/meme-alpha-v417-profitability-audit.yml'
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    steps:
      - name: Inspect profitability runtime and telemetry
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; E="$APP/src/micro-live-executor.js"
          date -u +%FT%TZ
          echo '=== SERVICES ==='
          for s in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$s"; systemctl is-active "$s"; done
          echo '=== RUNTIME FILES ==='
          find "$RT" -maxdepth 1 -type f -printf '%TY-%Tm-%TdT%TH:%TM:%TSZ %10s %f\n' | sort | tail -120
          echo '=== PROFIT/TRADE RELATED FILES ==='
          find "$RT" -maxdepth 1 -type f \( -iname '*profit*' -o -iname '*pnl*' -o -iname '*trade*' -o -iname '*execution*' -o -iname '*portfolio*' -o -iname '*capital*' -o -iname '*state*' -o -iname '*event*' -o -iname '*history*' -o -iname '*ledger*' \) -printf '%f\n' | sort
          echo '=== CORE SNAPSHOTS ==='
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          names=['capital-observability.json','portfolio-observability.json','allocator-status.json','last-execution.json','micro-live-gate.json','signal-snapshot.json','trend-pulse.json','realtime-pool-pulse.json']
          for n in names:
            p=rt/n
            if not p.exists():
              print(n,'MISSING'); continue
            try:j=json.loads(p.read_text())
            except Exception as e: print(n,'ERR',e); continue
            print('\nFILE',n,'AGE_SEC',round(time.time()-p.stat().st_mtime,2))
            if n=='signal-snapshot.json':
              print({'count':len(j.get('candidates') or []),'intelSummary':j.get('intelSummary')})
            elif n=='trend-pulse.json':
              rows=j.get('rows') or []; print({'version':j.get('version'),'rows':len(rows),'statusCounts':{k:sum(1 for x in rows if x.get('status')==k) for k in ['PREBREAKOUT','BREAKOUT','WARMING','NEUTRAL','EXHAUSTED']}})
            else: print(j)
          PY
          echo '=== EXECUTOR TELEMETRY ANCHORS ==='
          grep -nE "event\(|last-execution|realizedTradingPnl|lifetimeCost|ONLINE_LEARNING|MICRO_BUY|MICRO_SELL|MICRO_PARTIAL_SELL|portfolio-observability|capital-observability|statePath|EVENT" "$E" | head -260 || true
          echo V417_PROFITABILITY_AUDIT=PASS