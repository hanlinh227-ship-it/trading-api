name: Meme Alpha v1.1 Hardening

on:
  push:
    paths:
      - 'ops/meme-alpha/v110-hardening.sh'
      - '.github/workflows/meme-alpha-v110-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: meme-alpha-v110-hardening
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Deploy Meme Alpha v1.1 hardening
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v110-hardening.sh
          nice -n 15 bash ops/meme-alpha/v110-hardening.sh
