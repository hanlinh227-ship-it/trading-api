name: Blind Crypto Backtest V9

on:
  push:
    paths:
      - "scripts/blind_backtest_crypto_v9.py"
      - ".github/workflows/blind-backtest-v9.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  blind-backtest-v9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run V9 blind backtest
        run: |
          mkdir -p data
          python3 scripts/blind_backtest_crypto_v9.py
      - name: Commit V9 result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v9.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run V9 crypto blind backtest"
          git pull --rebase origin main
          git push origin HEAD:main
