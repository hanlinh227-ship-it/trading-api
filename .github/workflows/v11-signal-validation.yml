name: Bybit Auto Hub Validation

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/v11-signal-validation.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/v11-signal-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-auto-hub-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Canonical Unified Auto Hub preflight
        working-directory: cloudflare-worker
        run: npm run check
      - name: Validation summary
        run: |
          echo 'UNIFIED_AUTO_HUB_VALIDATION=PASS'
          echo 'CANONICAL_VALIDATOR=cloudflare-worker/validate-worker.mjs'
          echo 'BYBIT_LIVE_AUTHORITY=ON'
          echo 'BYBIT_DAILY_TARGET=OFF'
          echo 'MEME_DESIGN_ONLY=ON'
          echo 'MEME_BALANCE_AWARE_ALLOCATOR=ON'
          echo 'MEME_WALLET_SIGNING_EXECUTION=OFF'
          echo 'TELEGRAM_ENTRY_ALERTS=ON'
          echo 'BYBIT_HEALTH_PRIVATE_VPS_ONLY=ON'