name: V11 Signal Validation
on:
  push:
    branches: [signal-v11]
    paths: ['cloudflare-worker/**','docs/checkpoints/V11_SIGNAL_MASTER.md','.github/workflows/v11-signal-validation.yml']
  pull_request:
    paths: ['cloudflare-worker/**','docs/checkpoints/V11_SIGNAL_MASTER.md','.github/workflows/v11-signal-validation.yml']
permissions: {contents: read}
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Syntax
        run: |
          set -euo pipefail
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/hub-v11.js
          for f in cloudflare-worker/v11/*.js; do node --check "$f"; done
      - name: V11 invariants
        run: |
          set -euo pipefail
          grep -q 'hub-v11.js' cloudflare-worker/index.js
          grep -q 'signalOnlySourceOfTruth:"V11"' cloudflare-worker/index.js
          grep -q 'creditsPerMinute:55' cloudflare-worker/v11/config.js
          grep -q 'CLOUDFLARE_SINGLE_SCHEDULER' cloudflare-worker/v11/orchestrator.js
          grep -q 'V11_QUOTE_NOT_VERIFIED_FRESH' cloudflare-worker/v11/data-hub.js
          grep -q 'STRUCTURE_LIQUIDITY_INVALIDATION_WITH_VOLATILITY_FLOOR' cloudflare-worker/v11/instrument-profiles.js
          grep -q 'FORWARD_STRUCTURE_LIQUIDITY' cloudflare-worker/v11/instrument-profiles.js
          grep -q "status:'WATCH'" cloudflare-worker/v11/entry-plan.js
          grep -q 'TRADING_STATE_REQUIRED' cloudflare-worker/v11/store.js
          grep -q 'HUMAN_ASSISTED_NOT_API' cloudflare-worker/v11/ai-gateway.js
          grep -q 'DeepSeek API: runtime-native' cloudflare-worker/hub-v11.js
          ! grep -R 'v10Core.scheduled\|V77.*authority\|V78.*authority' cloudflare-worker/v11
