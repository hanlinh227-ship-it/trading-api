name: Bybit Auto Hub Validation

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/v11-signal-validation.yml'
  pull_request:
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/v11-signal-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bybit-auto-hub-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full Auto Hub preflight
        working-directory: cloudflare-worker
        run: npm run check
      - name: Bybit Auto Hub invariants
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'bybit-auto-hub.js' cloudflare-worker/index.js
          grep -q 'BYBIT_AUTO_TRADE_ONLY' cloudflare-worker/index.js
          grep -q 'signalV11Enabled:false' cloudflare-worker/index.js
          ! grep -q 'signalHub.scheduled' cloudflare-worker/index.js
          grep -q 'runBybitAutoControlled' cloudflare-worker/index.js
          grep -q 'POSITION_CUT_BY_MANAGER' cloudflare-worker/bybit-auto-v1.js
          grep -q 'reduceOnly:true' cloudflare-worker/bybit-position-manager.js
          grep -q 'verdict:"CUT"' cloudflare-worker/bybit-position-manager.js
          grep -q 'HEALTH_USES_AUTHENTICATED_VPS_PRIVATE_TRANSPORT_ONLY' cloudflare-worker/bybit-readonly-health.js
          grep -q 'notifyLiveEntry' cloudflare-worker/bybit-auto-controller.js
          grep -q 'telegramApiRequest' cloudflare-worker/bybit-auto-controller.js
          grep -q 'telegramEntryAlerts:true' cloudflare-worker/bybit-auto-hub.js
          grep -q 'compactPrices:true' cloudflare-worker/bybit-auto-hub.js
          grep -q 'auto:positions' cloudflare-worker/bybit-auto-hub.js
          grep -q 'auto:target' cloudflare-worker/bybit-auto-hub.js
          grep -q 'auto:ai' cloudflare-worker/bybit-auto-hub.js
          grep -q 'auto:risk' cloudflare-worker/bybit-auto-hub.js
          ! grep -q 'SIGNAL_V11_MAINTENANCE' cloudflare-worker/index.js
      - name: Validation summary
        run: |
          echo 'BYBIT_AUTO_HUB_VALIDATION=PASS'
          echo 'SIGNAL_V11_RUNTIME=OFF'
          echo 'TELEGRAM_ENTRY_ALERTS=ON'
          echo 'COMPACT_PRICE_FORMAT=ON'
          echo 'USD_RISK_REWARD_IN_ALERT=ON'
          echo 'POSITION_REVIEW=HOLD_TIGHTEN_CUT'
          echo 'BYBIT_HEALTH_PRIVATE_VPS_ONLY=ON'