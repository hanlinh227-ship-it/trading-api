name: Meme Alpha Insider Risk Hardening v3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-hardening-v3.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patcher
        run: python3 meme-alpha-runtime/tools/apply-insider-hardening.py
      - name: Syntax checks
        run: |
          set -euo pipefail
          node --check meme-alpha-runtime/source/src/safe-signal-export.js
          node --check meme-alpha-runtime/source/src/micro-live-executor.js
          python3 -m py_compile meme-alpha-runtime/source/external/signer/ready_signer.py
      - name: Offline self tests
        run: |
          set -euo pipefail
          node meme-alpha-runtime/source/src/safe-signal-export.js --self-test
          node meme-alpha-runtime/source/src/micro-live-executor.js --self-test
          python3 meme-alpha-runtime/source/external/signer/ready_signer.py --self-test
      - name: Verify hardening markers
        run: |
          set -euo pipefail
          grep -q "insiderRiskDecision" meme-alpha-runtime/source/src/safe-signal-export.js
          grep -q "function insiderSafe" meme-alpha-runtime/source/src/micro-live-executor.js
          grep -q "def objective_insider_ok" meme-alpha-runtime/source/external/signer/ready_signer.py
      - name: Commit tested hardening
        run: |
          set -euo pipefail
          git config user.name "meme-alpha-hardening-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add meme-alpha-runtime/source/src/safe-signal-export.js \
                  meme-alpha-runtime/source/src/micro-live-executor.js \
                  meme-alpha-runtime/source/external/signer/ready_signer.py
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "feat(meme): enforce objective insider risk end to end"
          git push origin HEAD:main
