name: Offline Forex EURUSD EURNZD V28 Special
on:
  push:
    paths:
      - 'scripts/offline_forex_eurusd_eurnzd_v28_special.py'
      - '.github/workflows/offline-forex-eurusd-eurnzd-v28-special.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Run specialized two-pair walk-forward
        env:
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_forex_eurusd_eurnzd_v28_special.py
