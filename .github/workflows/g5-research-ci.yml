name: G5 Research CI

on:
  push:
    branches:
      - research/cloud-10coin-g5-nonlinear-20260913
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G5 nonlinear tests
        run: PYTHONPATH=. pytest tests/test_g5_nonlinear.py -q
      - name: Full regression suite
        run: PYTHONPATH=. pytest tests -q

  smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G5 BTC nonlinear real-data smoke
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python run.py --generation g5 --symbols BTCUSDT --start 2025-01-01 --end 2026-08-31 --smoke | tee g5-btc-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: g5-btc-smoke
          path: |
            research/cloud_10coin_backtest/g5-btc-smoke.log
            research/cloud_10coin_backtest/results
          if-no-files-found: warn
          retention-days: 14
