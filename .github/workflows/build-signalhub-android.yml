name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v1.0.0.apk
          sha256sum dist/SignalHub-v1.0.0.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
