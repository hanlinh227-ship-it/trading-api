name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
  EXPECTED_VERSION: SIGNALHUB-FOREX-2.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure and 2.1 code
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 15000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          : > /tmp/all-dex-strings.txt
          while IFS= read -r dex; do
            echo "Inspecting $dex"
            unzip -p "$APK" "$dex" | strings >> /tmp/all-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          grep -Fq 'SIGNALHUB FX' /tmp/all-dex-strings.txt
          grep -Fq '/live-quotes?group=all' /tmp/all-dex-strings.txt
          grep -Fq '/app-version' /tmp/all-dex-strings.txt
          grep -Fq '/signals?status=active' /tmp/all-dex-strings.txt
          grep -Fq 'ACTIVE SETUPS' /tmp/all-dex-strings.txt
          grep -Fq 'PENDING' /tmp/all-dex-strings.txt
          grep -Fq 'MARKET' /tmp/all-dex-strings.txt
          grep -Fq 'LIMIT' /tmp/all-dex-strings.txt
          grep -Fq 'STOP' /tmp/all-dex-strings.txt

      - name: Smoke test live 2.1 backend
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 20); do
            code=$(curl --silent --show-error --max-time 20 -o /tmp/status.json -w '%{http_code}' "$SIGNALHUB_URL/status" || true)
            if [ "$code" = "200" ]; then
              version=$(python3 - <<'PY'
          import json
          try:
              p=json.load(open('/tmp/status.json',encoding='utf-8'))
              print(p.get('version',''))
          except Exception:
              print('')
          PY
          )
              echo "backend attempt=$n version=$version"
              if [ "$version" = "$EXPECTED_VERSION" ]; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = "1"

          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('version') == 'SIGNALHUB-FOREX-2.1.0', p
          assert p.get('gatewayVersion') == 'SIGNALHUB-GATEWAY-2.1.2', p
          assert p.get('trackerStorage') is True, p
          assert p.get('oneActiveSetupPerSymbol') is True, p
          assert p.get('supportedOrderTypes') == ['MARKET','LIMIT','STOP'], p
          policy=p.get('signalCadencePolicy') or {}
          assert policy.get('mode') == 'MODERATE_QUALITY_FIRST', policy
          assert policy.get('minGlobalSpacingMinutes') == 20, policy
          assert policy.get('maxNewPerScan') == 1, policy
          assert policy.get('maxActiveTotal') == 12, policy
          print('STATUS_OK',p['version'],p.get('gatewayVersion'),p.get('trackerSummary'),policy)
          PY

          curl --fail --silent --show-error --max-time 30 "$SIGNALHUB_URL/live-quotes?group=all" -o /tmp/live.json
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/app-version" -o /tmp/app.json
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/signals?status=active&limit=100" -o /tmp/active.json
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/performance" -o /tmp/perf.json
          python3 - <<'PY'
          import json
          live=json.load(open('/tmp/live.json',encoding='utf-8'))
          app=json.load(open('/tmp/app.json',encoding='utf-8'))
          active=json.load(open('/tmp/active.json',encoding='utf-8'))
          perf=json.load(open('/tmp/perf.json',encoding='utf-8')).get('performance') or {}
          assert live.get('ok') is True and len(live.get('quotes') or []) >= 1, live
          assert live.get('suggestedRefreshMs') == 5000, live
          assert app.get('gatewayVersion') == 'SIGNALHUB-GATEWAY-2.1.2', app
          assert app.get('app',{}).get('versionCode') == 5, app
          assert app.get('app',{}).get('versionName') == '2.1.0', app
          symbols=[s.get('symbol') for s in active.get('signals',[])]
          assert len(symbols)==len(set(symbols)), symbols
          for k in ['active','pending','open','closed','tp','sl','winRateResolved','netRResolved','byOrderType']:
              assert k in perf, (k,perf)
          print('BACKEND_2_1_OK','quotes',live.get('count'),'active',active.get('count'),'perf',perf)
          PY

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-FX-Tracker-v2.1.0.apk
          sha256sum dist/SignalHub-FX-Tracker-v2.1.0.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-FX-Tracker-Android-v2.1.0
          path: dist/
          if-no-files-found: error
          retention-days: 30
