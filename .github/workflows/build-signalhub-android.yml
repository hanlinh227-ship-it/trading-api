name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure
        run: |
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Smoke test live SignalHub backend
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/status" -o /tmp/status.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json',encoding='utf-8'))
          assert p.get('ok') is True, p
          assert p.get('version') == 'SIGNALHUB-FOREX-1.1.0', p
          assert p.get('independentFromBybit') is True, p
          assert set(p.get('groups') or []) == {'forex','metal','energy'}, p
          print('STATUS_OK',p['version'])
          PY

          for group in forex metal energy; do
            curl --fail --silent --show-error --max-time 30 "$SIGNALHUB_URL/latest-scan?group=$group" -o "/tmp/$group.json"
            python3 - "$group" <<'PY'
          import json,sys
          g=sys.argv[1]
          p=json.load(open('/tmp/'+g+'.json',encoding='utf-8'))
          s=p.get('snapshot') or {}
          assert p.get('ok') is True, p
          assert p.get('group') == g, p
          assert s.get('group') == g, s
          assert s.get('status') in ('OK','MARKET_CLOSED_OR_NO_DATA'), s
          assert isinstance(s.get('analyses'),list), s
          if g in ('forex','metal'):
              assert (s.get('sourceRows') or 0) > 0, s
          print(g.upper()+'_OK','rows',s.get('sourceRows'),'shown',len(s.get('analyses',[])),'actionable',s.get('actionableCount'))
          PY
          done

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-FX-v1.0.2.apk
          sha256sum dist/SignalHub-FX-v1.0.2.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-FX-Android-v1.0.2
          path: dist/
          if-no-files-found: error
          retention-days: 30
