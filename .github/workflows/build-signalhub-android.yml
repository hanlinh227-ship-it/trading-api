name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-v3-final]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
  APP_VERSION: 3.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 20000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
      - name: Verify production backend
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code=$(curl -sS --max-time 20 -o /tmp/v3.json -w '%{http_code}' "$SIGNALHUB_URL/v3/status" || true)
            if [ "$code" = 200 ] && python3 - <<'PY'
          import json
          p=json.load(open('/tmp/v3.json'))
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.1.0'
          PY
            then ready=1; break; fi
            sleep 2
          done
          test "$ready" = 1
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              curl -fsS --max-time 40 "$SIGNALHUB_URL/v3/signals?market=$m&style=$s&status=active&limit=50" >/tmp/s.json
              curl -fsS --max-time 40 "$SIGNALHUB_URL/v3/performance?market=$m&style=$s" >/tmp/p.json
              python3 - <<'PY'
          import json
          a=json.load(open('/tmp/s.json'));p=json.load(open('/tmp/p.json'))
          assert a.get('ok') is True and isinstance(a.get('signals'),list)
          assert p.get('ok') is True and isinstance(p.get('performance'),dict)
          PY
            done
          done
          curl -fsS --max-time 60 "$SIGNALHUB_URL/v3/crypto/tickers?limit=5" >/tmp/c.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/c.json'));assert p.get('ok') is True and p.get('count',0)>0
          PY
      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist handoff
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk "dist/SignalHub-v${APP_VERSION}.apk"
          sha256sum "dist/SignalHub-v${APP_VERSION}.apk" > dist/SHA256SUMS.txt
          cp dist/SHA256SUMS.txt handoff/SHA256SUMS.txt
          base64 -w 0 "dist/SignalHub-v${APP_VERSION}.apk" > "handoff/SignalHub-v${APP_VERSION}.apk.b64"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f handoff/
          git commit -m "SignalHub v${APP_VERSION} APK handoff" || true
          git push origin HEAD:${GITHUB_REF_NAME}
      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.1.0
          path: dist/
          retention-days: 30
      - name: Publish downloadable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="signalhub-v${APP_VERSION}"
          APK="dist/SignalHub-v${APP_VERSION}.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" dist/SHA256SUMS.txt --target "$GITHUB_SHA" --title "SignalHub v${APP_VERSION}" --notes "SignalHub 3.1.0 — FOREX/CRYPTO, SCALP/SWING, Exness live execution truth, crypto live provider labeling, signal detail, history/performance and Vietnamese UX/UI. Win rate is historical resolved TP/SL only, not a guaranteed probability."
          fi
