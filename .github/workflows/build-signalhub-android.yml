name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure
        run: |
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 10000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'

      - name: Smoke test live SignalHub backend
        run: |
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl --fail --silent --show-error --max-time 20 "$BASE/status" -o /tmp/status.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/status.json',encoding='utf-8'))
          assert isinstance(p,dict), p
          assert p.get('version') or p.get('service') or p.get('ok') is not None, p
          print('status ok:', p.get('version') or p.get('service') or p.get('ok'))
          PY
          curl --fail --silent --show-error --max-time 20 "$BASE/latest-scan?group=forex" -o /tmp/forex.json
          python - <<'PY'
          import json
          p=json.load(open('/tmp/forex.json',encoding='utf-8'))
          assert isinstance(p,dict), p
          assert p.get('group') == 'forex', p
          assert 'snapshot' in p, p
          print('forex latest-scan ok; snapshot type:', type(p.get('snapshot')).__name__)
          PY

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-v1.0.1.apk
          sha256sum dist/SignalHub-v1.0.1.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-APK-v1.0.1
          path: dist/
          if-no-files-found: error
          retention-days: 30
