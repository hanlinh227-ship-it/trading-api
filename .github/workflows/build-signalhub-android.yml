name: Build SignalHub Android APK

on:
  push:
    branches: [signalhub-android-v1]
    paths:
      - 'signalhub-android/**'
      - '.github/workflows/build-signalhub-android.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
  EXPECTED_VERSION: SIGNALHUB-FOREX-2.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK structure and V3 UX code
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 15000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          : > /tmp/all-dex-strings.txt
          while IFS= read -r dex; do
            echo "Inspecting $dex"
            unzip -p "$APK" "$dex" | strings >> /tmp/all-dex-strings.txt
          done < <(unzip -Z1 "$APK" | grep -E '^classes([0-9]+)?\.dex$')
          grep -Fq 'SIGNALHUB' /tmp/all-dex-strings.txt
          grep -Fq '/v3/forex/live' /tmp/all-dex-strings.txt
          grep -Fq '/v3/crypto/tickers' /tmp/all-dex-strings.txt
          grep -Fq '/v3/crypto/discovery' /tmp/all-dex-strings.txt
          grep -Fq 'EXNESS' /tmp/all-dex-strings.txt
          grep -Fq 'BYBIT' /tmp/all-dex-strings.txt
          grep -Fq 'SCALP' /tmp/all-dex-strings.txt
          grep -Fq 'SWING' /tmp/all-dex-strings.txt
          grep -Fq 'MARKET' /tmp/all-dex-strings.txt
          grep -Fq 'LIMIT' /tmp/all-dex-strings.txt
          grep -Fq 'STOP' /tmp/all-dex-strings.txt

      - name: Smoke test legacy compatibility and V3 data routes
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 20); do
            code=$(curl --silent --show-error --max-time 20 -o /tmp/status.json -w '%{http_code}' "$SIGNALHUB_URL/status" || true)
            if [ "$code" = "200" ]; then
              version=$(python3 - <<'PY'
          import json
          try:
              p=json.load(open('/tmp/status.json',encoding='utf-8'))
              print(p.get('version',''))
          except Exception:
              print('')
          PY
          )
              echo "backend attempt=$n version=$version"
              if [ "$version" = "$EXPECTED_VERSION" ]; then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = "1"

          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/v3/status" -o /tmp/v3-status.json
          curl --fail --silent --show-error --max-time 30 "$SIGNALHUB_URL/v3/crypto/discovery?style=scalp&limit=3" -o /tmp/crypto.json
          curl --fail --silent --show-error --max-time 20 "$SIGNALHUB_URL/signals?status=active&limit=100" -o /tmp/active.json
          python3 - <<'PY'
          import json
          legacy=json.load(open('/tmp/status.json',encoding='utf-8'))
          v3=json.load(open('/tmp/v3-status.json',encoding='utf-8'))
          crypto=json.load(open('/tmp/crypto.json',encoding='utf-8'))
          active=json.load(open('/tmp/active.json',encoding='utf-8'))
          assert legacy.get('ok') is True, legacy
          assert legacy.get('version') == 'SIGNALHUB-FOREX-2.1.0', legacy
          assert v3.get('ok') is True and v3.get('version') == 'SIGNALHUB-V3-GATEWAY-3.0.0', v3
          assert v3.get('checkpoint') == 'SIGNALHUB_V3_CHECKPOINT_04', v3
          assert crypto.get('ok') is True and crypto.get('market') == 'CRYPTO', crypto
          assert crypto.get('classification') == 'DISCOVERY_ONLY_NOT_TRADE_SIGNAL', crypto
          assert crypto.get('scanned',0) >= crypto.get('eligible',0) >= 0, crypto
          assert isinstance(crypto.get('candidates'),list), crypto
          symbols=[s.get('symbol') for s in active.get('signals',[])]
          assert len(symbols)==len(set(symbols)), symbols
          print('SIGNALHUB_V3_OK','scanned',crypto.get('scanned'),'eligible',crypto.get('eligible'),'active',active.get('count'))
          PY

      - name: Prepare artifact
        run: |
          set -euo pipefail
          mkdir -p dist
          cp signalhub-android/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-V3-v3.0.0.apk
          sha256sum dist/SignalHub-V3-v3.0.0.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-V3-Android-v3.0.0
          path: dist/
          if-no-files-found: error
          retention-days: 30
