name: Probe TON IP History Fallback
on:
  push:
    paths:
      - '.github/workflows/probe-ton-ip-history-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe public history sources
        run: |
          set +e
          for s in TON IP; do
            echo "=== $s ==="
            for u in \
              "https://min-api.cryptocompare.com/data/v2/histohour?fsym=${s}&tsym=USD&limit=5" \
              "https://api.coinex.com/v2/spot/kline?market=${s}USDT&period=4hour&limit=5" \
              "https://api.kraken.com/0/public/OHLC?pair=${s}USD&interval=240" \
              "https://api.exchange.coinbase.com/products/${s}-USD/candles?granularity=14400"
            do
              echo "$u"
              curl -L -sS --max-time 8 -o /tmp/y -w 'HTTP=%{http_code} SIZE=%{size_download}\n' "$u"
              head -c 240 /tmp/y; echo
            done
          done
