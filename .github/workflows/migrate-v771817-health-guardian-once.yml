name: Migrate V77.18.17 Health Guardian Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-v771817-health-guardian-once.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Wire autonomous health guardian
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          imp='import {handleHyroMultiTelegram,runHyroMultiCron,hyroMultiStatus} from "./hyro-multi-ui.js";'
          add=imp+'\nimport {runSystemHealthAudit,shouldRunFullHealth,getSystemHealth} from "./system-health.js";'
          if './system-health.js' not in s:
              if imp not in s: raise SystemExit('multi import marker missing')
              s=s.replace(imp,add,1)
          s=s.replace('const VERSION="V77.18.16",SERVICE="Trading V77.18.16 Balanced Entry Dual Hyro Runtime";','const VERSION="V77.18.17",SERVICE="Trading V77.18.17 Autonomous Health Guardian";',1)
          old='if(path==="/prop/hyro/accounts")return json({ok:true,version:VERSION,...await hyroMultiStatus(env)});'
          new='if(path==="/prop/hyro/accounts")return json({ok:true,version:VERSION,...await hyroMultiStatus(env)});if(path==="/health")return json({ok:true,version:VERSION,health:await getSystemHealth(env)});if(path==="/health/run")return json(await runSystemHealthAudit(env,{version:VERSION,full:true,notify:false}));'
          if old in s:s=s.replace(old,new,1)
          elif '/health/run' not in s:raise SystemExit('route marker missing')
          old_sched='async scheduled(event,env,ctx){ctx.waitUntil(runHyroMultiCron(env).catch(()=>{}));return signalHub.scheduled?.(event,env,ctx);}'
          new_sched='async scheduled(event,env,ctx){ctx.waitUntil(runHyroMultiCron(env).catch(()=>{}));ctx.waitUntil((async()=>{const full=await shouldRunFullHealth(env);await runSystemHealthAudit(env,{version:VERSION,full,notify:true});})().catch(()=>{}));return signalHub.scheduled?.(event,env,ctx);}'
          if old_sched in s:s=s.replace(old_sched,new_sched,1)
          elif 'shouldRunFullHealth(env)' not in s:raise SystemExit('scheduled marker missing')
          if 'V77.18.17' not in s or 'runSystemHealthAudit' not in s:raise SystemExit('health guardian markers missing')
          p.write_text(s)
          PY
      - name: Syntax gate
        run: |
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/system-health.js
          node --check cloudflare-worker/hyro-multi-account.js
          node --check cloudflare-worker/hyro-runtime.js
          node --check cloudflare-worker/engine-v77168.js
      - name: Commit migration
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add cloudflare-worker/index.js
          git diff --cached --quiet && exit 0
          git commit -m "V77.18.17 wire autonomous system health guardian"
          git push
