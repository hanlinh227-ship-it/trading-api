name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect isolated signer gate logic
        shell: bash
        run: |
          set -euo pipefail
          echo '=== SIGNER_DIR ==='
          ls -ld /opt/meme-alpha-signer 2>&1 || true
          ls -la /opt/meme-alpha-signer 2>&1 || true
          echo '=== READY_SIGNER ==='
          sed -n '1,420p' /opt/meme-alpha-signer/ready_signer.py 2>&1 || true
          echo '=== GATE_REFS ==='
          grep -RniE 'GATE_CLOSED|micro-live|armed|ARMED|attest|gate' /opt/meme-alpha-signer 2>/dev/null | head -400 || true
          echo SIGNER_SOURCE_AUDIT=COMPLETE
