name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 2
    steps:
      - name: Inspect holder safety contract
        shell: bash
        run: |
          set -euo pipefail
          SRC=/opt/meme-alpha/app/src/micro-live-executor.js
          sha256sum "$SRC"
          sed -n '55,90p' "$SRC"
