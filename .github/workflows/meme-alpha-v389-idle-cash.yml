name: Meme Alpha V399 RPC and Fill Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect executor RPC and verify fills
        shell: bash
        run: |
          set -euo pipefail
          EXE=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== EXECUTOR TOP / RPC ==='
          sed -n '1,75p' "$EXE"
          grep -nE '^async function rpc|function rpc|RPC_|getBalance|getTokenAccountBalance|getRecentPrioritizationFees' "$EXE" | head -180 || true
          echo '=== VERIFY STONK TRANSACTIONS ON TATUM ==='
          node - <<'NODE'
          const ep='https://solana-mainnet.gateway.tatum.io';
          const sigs=['pGJN2d8gwJX9jXaySvTLKmcBydwgaVQpbRJqHHATpXigagApHUoD2KRMma5CwSPem4VCd47x6xWwGRhPV9SvtP6','4A9F297Soafj1DxKU9gniT52YuUpE51vVyqZKpgJTmD3FfXp2HExBhQNrxKxxdRkBnG3MZ2ADq7ag9uwS22EY8qV'];
          async function rpc(method,params){const r=await fetch(ep,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({jsonrpc:'2.0',id:1,method,params})});const j=await r.json();console.log(method,JSON.stringify(j));}
          await rpc('getSignatureStatuses',[sigs,{searchTransactionHistory:true}]);
          NODE
          echo '=== CURRENT CAPITAL / POSITION ==='
          for f in /opt/meme-alpha/app/runtime-status/portfolio-observability.json /opt/meme-alpha/app/runtime-status/capital-observability.json /opt/meme-alpha/app/runtime-status/last-execution.json /opt/meme-alpha/app/runtime-status/allocator-status.json; do [ -f "$f" ] && { echo ---$f---; cat "$f"; echo; } || true; done
          echo V399_RPC_FILL_AUDIT=COMPLETE
