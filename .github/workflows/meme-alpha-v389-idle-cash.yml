name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect signer gate handshake
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== SIGNER_FILES ==='
          find "$APP/src" -maxdepth 1 -type f -printf '%f\n' | sort | grep -Ei 'sign|micro|gate' || true
          echo '=== GATE_CLOSED_REFERENCES ==='
          grep -RniE 'SIGNER_MICRO_LIVE_GATE_CLOSED|MICRO_LIVE_GATE|armAttested|micro-live-armed|armed' "$APP/src" "$APP"/*.sh 2>/dev/null | head -300 || true
          echo '=== SIGNER_UNIT ==='
          systemctl cat meme-alpha-signer.service || true
          systemctl status meme-alpha-signer.service --no-pager -l || true
          echo '=== SIGNER_SOURCE ==='
          for f in "$APP"/src/*sign*.js; do [ -f "$f" ] || continue; echo ---$f---; sed -n '1,320p' "$f"; done
          echo '=== ARM_META ==='
          ls -l /etc/meme-alpha /run/meme-alpha-signer 2>&1 || true
          for f in /etc/meme-alpha/*arm* /etc/meme-alpha/*live* /run/meme-alpha-signer/*; do [ -f "$f" ] || continue; echo ---$f---; cat "$f" 2>&1 || true; done
          echo SIGNER_GATE_HANDSHAKE_AUDIT=COMPLETE
