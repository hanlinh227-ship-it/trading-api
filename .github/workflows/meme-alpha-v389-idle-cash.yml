name: Meme Alpha V398 Resilient Buy Pipeline
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 8
    steps:
      - name: Deploy V398 and verify a fresh buy
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; BASE="$RT/deploy-candidates"
          mkdir -p "$BASE"
          START_EPOCH=$(date +%s)
          START_ISO=$(date -u +%FT%TZ)
          echo V398_START="$START_ISO"

          # -------- Signal: make RPC safety evidence reliable instead of flapping under RPC bursts.
          SIG="$APP/src/safe-signal-export.js"; SIGC="$BASE/v398-signal-resilient-rpc.js"
          cp -a "$SIG" "$SIGC"
          python3 - "$SIGC" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          reps=[
            ("const V388_TTL_MS=5*60*1000;","const V388_TTL_MS=10*60*1000;",'TTL'),
            ("const V388_MAX_AUDITS=12;","const V388_MAX_AUDITS=6;",'AUDITS'),
            ("const V388_RPCS=[V388_CFG.rpc,'https://solana-mainnet.gateway.tatum.io','https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'].filter(Boolean);","const V388_RPCS=['https://solana-mainnet.gateway.tatum.io',V388_CFG.rpc,'https://api.mainnet-beta.solana.com','https://solana-rpc.publicnode.com'].filter(Boolean);",'RPC_ORDER'),
            ("const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),2600);","const ac=new AbortController();const timer=setTimeout(()=>ac.abort(),4500);",'RPC_TIMEOUT'),
            ("async function v388Rpc(method,params){\n  try{return await Promise.any(V388_UNIQUE_RPCS.map(ep=>v388RpcOne(ep,method,params)))}catch(e){throw new Error(`V388_ALL_RPC_FAILED_${method}`)}\n}","async function v388Rpc(method,params){\n  let last=null;\n  for(const ep of V388_UNIQUE_RPCS){\n    const tries=String(ep).includes('gateway.tatum.io')?2:1;\n    for(let i=0;i<tries;i++){\n      try{return await v388RpcOne(ep,method,params)}catch(e){last=e;if(i+1<tries)await new Promise(r=>setTimeout(r,120))}\n    }\n  }\n  throw new Error(`V388_ALL_RPC_FAILED_${method}_${String(last?.message||last||'UNKNOWN').slice(0,80)}`)\n}",'RPC_IMPL')
          ]
          for old,new,label in reps:
            n=s.count(old)
            if n!=1: raise SystemExit(f'V398_SIGNAL_{label}_PATCH_COUNT={n}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check "$SIGC"
          SIGTEST="$(node "$SIGC" --self-test)"; printf '%s\n' "$SIGTEST"
          grep -q 'V376_MULTI_STRATEGY_ROUTER_SELF_TEST=PASS' <<<"$SIGTEST"
          grep -q 'SECURITY_PASS_REQUIRED=TRUE' <<<"$SIGTEST"
          grep -q 'HOLDER_PASS_REQUIRED=TRUE' <<<"$SIGTEST"
          grep -q 'SELL_ROUTE_REQUIRED=TRUE' <<<"$SIGTEST"
          SIGSHA=$(sha256sum "$SIGC" | awk '{print $1}'); echo V398_SIGNAL_SHA="$SIGSHA"
          sudo -n /usr/local/sbin/meme-alpha-safe-deploy signal "$(basename "$SIGC")" "$SIGSHA"

          # -------- Executor: try every safe candidate; one bad quote/trend response must not stall capital.
          EXE="$APP/src/micro-live-executor.js"; EXEC="$BASE/v398-executor-nonblocking-buy.js"
          cp -a "$EXE" "$EXEC"
          python3 - "$EXEC" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          old="function bestCandidate(p,held,st){return candidates().filter(c=>!held.has(c.mint)&&coreSafe(c)).sort((a,b)=>(Number(trendEntryEligible(b))-Number(trendEntryEligible(a)))||(expectedEdge(st,b)-expectedEdge(st,a))||rank(b)-rank(a))[0]||null}"
          new="function rankedCandidates(p,held,st){return candidates().filter(c=>!held.has(c.mint)&&coreSafe(c)).sort((a,b)=>(Number(trendEntryEligible(b))-Number(trendEntryEligible(a)))||(expectedEdge(st,b)-expectedEdge(st,a))||rank(b)-rank(a))}\nfunction bestCandidate(p,held,st){return rankedCandidates(p,held,st)[0]||null}\nfunction globalBuyError(msg){return ['SIGNER_NOT_ARMED','SIGNER_MICRO_LIVE_GATE_CLOSED','SIGNER_HOURLY_BUY_LIMIT','SIGNER_DYNAMIC_DAILY_TURNOVER_LIMIT'].some(x=>String(msg||'').includes(x))}"
          if s.count(old)!=1: raise SystemExit(f'V398_RANK_PATCH_COUNT={s.count(old)}')
          s=s.replace(old,new,1)
          old2="async function maybeScaleIn(st,p){\n  if(!st.positions.length)return null;const ranked=st.positions.map((pos,index)=>({pos,index,c:candidate(pos.mint)})).filter(x=>x.c&&coreSafe(x.c)&&!x.pos.scaleInLockedAfterProfit&&x.pos.weakExitCount===0).sort((a,b)=>rank(b.c)-rank(a.c));\n  for(const x of ranked){const r=await placeBuy(st,x.c,x.index);if(r.placed)return{action:'ADD',reason:'IDLE_CAPITAL_SCALE',symbol:x.c.symbol};if(!['CAPITAL_HEADROOM_LOW','TARGET_ALREADY_SATISFIED','ALLOCATION_BELOW_MIN_ORDER'].includes(r.reason))return{action:'WAIT',reason:r.reason,symbol:x.c.symbol}}return null;\n}"
          new2="async function maybeScaleIn(st,p){\n  if(!st.positions.length)return null;const ranked=st.positions.map((pos,index)=>({pos,index,c:candidate(pos.mint)})).filter(x=>x.c&&coreSafe(x.c)&&!x.pos.scaleInLockedAfterProfit&&x.pos.weakExitCount===0).sort((a,b)=>rank(b.c)-rank(a.c));\n  for(const x of ranked){try{const r=await placeBuy(st,x.c,x.index);if(r.placed)return{action:'ADD',reason:'IDLE_CAPITAL_SCALE',symbol:x.c.symbol};if(['CAPITAL_HEADROOM_LOW','TARGET_ALREADY_SATISFIED','ALLOCATION_BELOW_MIN_ORDER','SIGNER_ORDER_CAP_BELOW_MIN'].includes(r.reason))continue;event({type:'SCALE_CANDIDATE_SKIP',mint:x.c.mint,symbol:x.c.symbol,reason:r.reason||'UNKNOWN'});}catch(e){const msg=String(e?.message||e);if(globalBuyError(msg))throw e;event({type:'SCALE_CANDIDATE_SKIP',mint:x.c.mint,symbol:x.c.symbol,reason:msg.slice(0,180)})}}return null;\n}"
          if s.count(old2)!=1: raise SystemExit(f'V398_SCALE_PATCH_COUNT={s.count(old2)}')
          s=s.replace(old2,new2,1)
          old3="if(gate.allowed){const held=new Set(st.positions.map(x=>x.mint)),c=bestCandidate(p,held,st);if(c){const r=await placeBuy(st,c,-1);if(r.placed)return{action:'BUY',reason:'AUTO_ALLOC',symbol:c.symbol};if(r.reason==='CAPITAL_HEADROOM_LOW'){const rotate=await maybeRotate(st,c);if(rotate)return rotate}else if(!['ALLOCATION_BELOW_MIN_ORDER','TARGET_ALREADY_SATISFIED'].includes(r.reason))return{action:'WAIT',reason:r.reason}}\n    const add=await maybeScaleIn(st,p);if(add)return add;\n  }"
          new3="if(gate.allowed){const held=new Set(st.positions.map(x=>x.mint)),ranked=rankedCandidates(p,held,st);for(const c of ranked){try{const r=await placeBuy(st,c,-1);if(r.placed)return{action:'BUY',reason:'AUTO_ALLOC',symbol:c.symbol};if(r.reason==='CAPITAL_HEADROOM_LOW'){const rotate=await maybeRotate(st,c);if(rotate)return rotate;continue}if(['ALLOCATION_BELOW_MIN_ORDER','TARGET_ALREADY_SATISFIED','SIGNER_ORDER_CAP_BELOW_MIN'].includes(r.reason))continue;event({type:'BUY_CANDIDATE_SKIP',mint:c.mint,symbol:c.symbol,reason:r.reason||'UNKNOWN'});}catch(e){const msg=String(e?.message||e);if(globalBuyError(msg))throw e;event({type:'BUY_CANDIDATE_SKIP',mint:c.mint,symbol:c.symbol,reason:msg.slice(0,180)});continue}}\n    const add=await maybeScaleIn(st,p);if(add)return add;\n  }"
          if s.count(old3)!=1: raise SystemExit(f'V398_TICK_PATCH_COUNT={s.count(old3)}')
          s=s.replace(old3,new3,1)
          old4="console.error('EXECUTOR_ERROR',e.message);await sleep(15000)}await sleep(900)}}"
          new4="console.error('EXECUTOR_ERROR',e.message);await sleep(3000)}await sleep(900)}}"
          if s.count(old4)!=1: raise SystemExit(f'V398_BACKOFF_PATCH_COUNT={s.count(old4)}')
          s=s.replace(old4,new4,1)
          p.write_text(s)
          PY
          node --check "$EXEC"
          EXETEST="$(node "$EXEC" --self-test)"; printf '%s\n' "$EXETEST"
          grep -q 'MICRO_EXECUTOR_V360_PROFIT_AWARE_SELF_TEST=PASS' <<<"$EXETEST"
          grep -q 'NETWORK_EXECUTION=NOT_CALLED' <<<"$EXETEST"
          EXESHA=$(sha256sum "$EXEC" | awk '{print $1}'); echo V398_EXECUTOR_SHA="$EXESHA"

          # Executor safe-deploy has a known read-only ARM bug. Use the already-proven atomic paper handoff directly.
          BACK="$RT/v398-executor-backup-$(date +%Y%m%dT%H%M%SZ).js"
          cp -a "$EXE" "$BACK"
          cp "$EXEC" "$EXE"
          chmod 664 "$EXE" || true
          sudo -n /usr/bin/systemctl restart meme-alpha-paper.service

          echo '=== VERIFY SERVICES / SOURCE ==='
          for i in $(seq 1 45); do sleep 2; [ "$(sha256sum "$EXE" | awk '{print $1}')" = "$EXESHA" ] && systemctl is-active --quiet meme-alpha-paper.service && systemctl is-active --quiet meme-alpha-micro-live.service && systemctl is-active --quiet meme-alpha-signer.service && break; [ "$i" -lt 45 ] || exit 9; done
          echo V398_ACTIVE_EXECUTOR_SHA=$(sha256sum "$EXE" | awk '{print $1}')
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$svc"; systemctl is-active "$svc" || true; done

          echo '=== WAIT FOR FRESH VERIFIED BUY ==='
          python3 - "$START_EPOCH" <<'PY'
          import json,pathlib,time,sys,datetime
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status'); start=float(sys.argv[1]); deadline=time.time()+180
          def n(v,d=0):
            try:return float(v)
            except:return d
          def core(c):
            imp=abs(n(c.get('sellPriceImpactPct',c.get('sellImpactPct',c.get('priceImpactPct'))),99))
            return c.get('securityDecision')=='PASS' and c.get('holderClusterDecision')=='PASS' and c.get('insiderRiskDecision')=='PASS' and c.get('sellRoute') is True and c.get('token2022') is not True and not(c.get('hardReject') or []) and n(c.get('liquidityUsd'))>=50000 and imp<=1.25
          def signer_ok(c):
            score=n(c.get('score')); liq=n(c.get('liquidityUsd')); net=n(c.get('netBuyers5m')); avg=n(c.get('avgNetBuyersLast2')); chg=n(c.get('priceChange5m'),-999); imp=abs(n(c.get('sellPriceImpactPct'),99))
            return core(c) and c.get('decision')=='PROBE_CANDIDATE' and c.get('universeClass')=='MEME_CONFIRMED' and ((score>=72) or (score>=66 and liq>=500000 and net>=1 and imp<=.8) or (score>=62 and liq>=100000 and net>=5 and avg>=3 and chg>=.20 and imp<=.8))
          seen_safe=False; seen_signer=False
          while time.time()<deadline:
            try:sig=json.loads((rt/'signal-snapshot.json').read_text()); rows=sig.get('candidates') or []
            except:rows=[]
            safe=[c for c in rows if core(c)]; eligible=[c for c in rows if signer_ok(c)]
            seen_safe=seen_safe or bool(safe); seen_signer=seen_signer or bool(eligible)
            try:g=json.loads((rt/'micro-live-gate.json').read_text())
            except:g={}
            try:a=json.loads((rt/'allocator-status.json').read_text())
            except:a={}
            try:cap=json.loads((rt/'capital-observability.json').read_text())
            except:cap={}
            try:le=json.loads((rt/'last-execution.json').read_text())
            except:le={}
            print('CHECK',datetime.datetime.now(datetime.timezone.utc).isoformat(),'safe',[c.get('symbol') for c in safe[:8]],'signerEligible',[c.get('symbol') for c in eligible[:8]],'allocator',{k:a.get(k) for k in ['action','reason','symbol']},'deployable',cap.get('deployableSol'),'lastExec',{k:le.get(k) for k in ['updatedAt','type','symbol','spentSol','signature']},flush=True)
            ts=time.mktime(time.strptime(str(le.get('updatedAt',''))[:19],'%Y-%m-%dT%H:%M:%S')) if le.get('updatedAt') else 0
            if le.get('type')=='MICRO_BUY' and ts>=start-5 and le.get('signature'):
              print('V398_VERIFIED_NEW_BUY=TRUE',json.dumps(le,separators=(',',':')),flush=True);sys.exit(0)
            time.sleep(3)
          print('V398_VERIFIED_NEW_BUY=FALSE','SEEN_CORE_SAFE='+str(seen_safe),'SEEN_SIGNER_ELIGIBLE='+str(seen_signer),flush=True)
          sys.exit(0)
          PY
          echo V398_RESILIENT_BUY_PIPELINE=ACTIVE
          echo SCALE_ALLOWED=TRUE
          echo HARD_SAFETY_BYPASS=FALSE
