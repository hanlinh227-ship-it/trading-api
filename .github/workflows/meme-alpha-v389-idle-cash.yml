name: Meme Alpha Buy Sizing Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect executor buy sizing
        shell: bash
        run: |
          set -euo pipefail
          SRC=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== BUY_SIZING ==='
          sed -n '150,225p' "$SRC"
          echo '=== POLICY_TARGET ==='
          grep -nE 'function rootPolicy|function targetPlan|function allocationProfile|maxUtilizationPct|minOrderLamports|placeBuy|DYNAMIC_BUY' "$SRC" | head -200 || true
          echo BUY_SIZING_AUDIT=COMPLETE
