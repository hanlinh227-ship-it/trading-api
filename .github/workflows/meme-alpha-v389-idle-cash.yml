name: Meme Alpha V402 Allocation Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect live allocation concentration
        shell: bash
        run: |
          set -euo pipefail
          EXE=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== ALLOCATION FUNCTIONS ==='
          grep -nE 'function allocationProfile|function targetPlan|function requiredReserveLamports|function expectedEdge|function rank|async function placeBuy|async function maybeScaleIn|rankedCandidates|CAPITAL_HEADROOM_LOW|TARGET_ALREADY_SATISFIED' "$EXE" | head -260 || true
          L=$(grep -n 'function allocationProfile' "$EXE"|head -1|cut -d: -f1 || true); if [ -n "$L" ]; then S=$((L-8)); [ $S -lt 1 ] && S=1; E=$((L+90)); sed -n "${S},${E}p" "$EXE"; fi
          echo '=== POLICY / CAPITAL ==='
          cat /etc/meme-alpha/micro-live-policy.json || true
          cat /opt/meme-alpha/app/runtime-status/capital-observability.json || true
          cat /opt/meme-alpha/app/runtime-status/portfolio-observability.json || true
          echo V402_ALLOCATION_AUDIT=COMPLETE
