name: Meme Alpha V397 Source Contract Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect live signal and executor contracts
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          SIG="$APP/src/safe-signal-export.js"
          EXE="$APP/src/micro-live-executor.js"
          echo '=== V388 RPC IMPLEMENTATION ==='
          grep -nE 'V388_RPCS|V388_MAX_AUDITS|v388Rpc|V388_CACHE|rpcAudit|auditCandidate|v388RpcAudit|sellRoute|holderClusterDecision' "$SIG" | head -320 || true
          L=$(grep -n 'V388_RPCS' "$SIG" | head -1 | cut -d: -f1 || true); if [ -n "$L" ]; then S=$((L-15)); [ "$S" -lt 1 ] && S=1; E=$((L+180)); sed -n "${S},${E}p" "$SIG"; fi
          echo '=== SIGNAL OUTPUT / PROMOTION ==='
          grep -nE 'PROBE_CANDIDATE|executionUniverseNormalized|MEME_CONFIRMED|actionableSafe|promotionEligible|strategyRouter' "$SIG" | head -320 || true
          echo '=== EXECUTOR SELECT / LOOP ==='
          grep -nE 'function bestCandidate|async function maybeScaleIn|async function tick|while\(true\)|SIGNER_|AUTO_ALLOC|IDLE_CAPITAL_SCALE' "$EXE" | head -320 || true
          sed -n '240,330p' "$EXE" || true
          echo V397_SOURCE_CONTRACT_AUDIT=COMPLETE
