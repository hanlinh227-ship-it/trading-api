name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Run V389 idle cash deployment
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/hanlinh227-ship-it/trading-api/e75ec5a7fd0c4398ac5053dcc3b516968695dab4/ops/meme-alpha-v389-idle-cash.sh -o /tmp/meme-alpha-v389-idle-cash.sh
          chmod 0755 /tmp/meme-alpha-v389-idle-cash.sh
          /tmp/meme-alpha-v389-idle-cash.sh
