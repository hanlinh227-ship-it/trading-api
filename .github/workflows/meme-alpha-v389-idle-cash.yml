name: Meme Alpha RPC Fallback Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect holder RPC fallback pool
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          echo '=== HOLDER_CLUSTER_RPC_SOURCE ==='
          grep -nEi 'rpc|endpoint|publicnode|ankr|mainnet|helius|solana' "$APP/src/holder-cluster.js" | head -260 || true
          sed -n '1,220p' "$APP/src/holder-cluster.js" || true
          echo '=== RUNTIME_CONFIG_RPC_KEYS ==='
          python3 - <<'PY'
          import json,pathlib
          p=pathlib.Path('/opt/meme-alpha/app/config/runtime.json')
          if p.exists():
            d=json.loads(p.read_text())
            print({k:v for k,v in d.items() if 'rpc' in k.lower() or 'solana' in k.lower()})
          PY
          echo RPC_FALLBACK_AUDIT=COMPLETE
