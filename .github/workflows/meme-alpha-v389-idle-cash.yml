name: Meme Alpha V392 Evidence Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect V392 candidate evidence gaps
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; P=/var/lib/meme-alpha/data/paper
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          sig=json.loads((rt/'signal-snapshot.json').read_text())
          print('SIGNAL_AGE',round(time.time()-(rt/'signal-snapshot.json').stat().st_mtime,2),'COUNT',len(sig.get('candidates') or []))
          keys=['symbol','mint','score','decision','securityDecision','securityReviewReasons','securityBlockReasons','securityEvidence','holderClusterDecision','holderReviewReasons','holderBlockReasons','holderEvidence','insiderRiskDecision','sellRoute','sellQuoteHttp','sellQuoteError','sellPriceImpactPct','liquidityUsd','topHoldersPct','holderClusterMaxAccountsSameOwner','mintAuthorityDisabled','freezeAuthorityDisabled','v388RpcAudit','whaleTop10Pct','whaleDeltaTop10Pct']
          for c in (sig.get('candidates') or [])[:20]: print('SIGROW',{k:c.get(k) for k in keys})
          for name in ['v388-rpc-audit-cache.json','micro-live-gate.json','capital-observability.json','allocator-status.json']:
            p=rt/name
            print('\nFILE',name,'exists',p.exists(),'age',round(time.time()-p.stat().st_mtime,2) if p.exists() else None)
            if p.exists():
              try:
                d=json.loads(p.read_text())
                if name=='v388-rpc-audit-cache.json':
                  print('AUDIT_CACHE_KEYS',len(d));
                  for k,v in list(d.items())[-15:]: print('AUDIT',k,v)
                else: print(d)
              except Exception as e: print('ERR',repr(e))
          PY
          echo '=== SCANNER RELEVANT SOURCE ==='
          grep -nE 'sellRoute|sellQuote|priceImpact|JUP|quote|holderCount|holderCluster|securityDecision' "$APP/src/scanner.js" | head -260 || true
          echo '=== SIGNAL AUDIT LOGIC ==='
          grep -nE 'v388AuditCandidate|eligible=|sellOk|holderUnknown|authorityUnknown|V388_MAX_AUDITS|v388ApplyAudit' "$APP/src/safe-signal-export.js" | head -220 || true
          echo V392_EVIDENCE_AUDIT=COMPLETE
