name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Inspect exact live allocator source
        shell: bash
        run: |
          set -euo pipefail
          SRC=/opt/meme-alpha/app/src/micro-live-executor.js
          echo '=== ALLOCATION ==='
          grep -n -A18 -B3 'function allocationProfile' "$SRC" || true
          echo '=== BEST ==='
          grep -n -A12 -B3 'function bestCandidate' "$SRC" || true
          echo '=== PLACE BUY ==='
          grep -n -A18 -B3 'async function placeBuy' "$SRC" || true
          echo '=== TICK ==='
          grep -n -A28 -B3 'async function tick' "$SRC" || true
          echo V389_EXACT_SOURCE_INSPECT=COMPLETE
