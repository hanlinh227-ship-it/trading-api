name: Meme Alpha V389 Idle Cash Deployment
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 3
    steps:
      - name: Trace V390 executor runtime
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; DATA=/var/lib/meme-alpha/data/micro-live
          PID="$(pgrep -fo '^/usr/bin/node /opt/meme-alpha/app/src/micro-live-executor.js$' || true)"
          echo PID="$PID"
          [ -n "$PID" ] && ps -o pid,ppid,user,group,lstart,etime,cmd -p "$PID" || true
          [ -n "$PID" ] && { PPID2="$(ps -o ppid= -p "$PID" | tr -d ' ')"; [ -n "$PPID2" ] && ps -o pid,ppid,user,group,lstart,etime,cmd -p "$PPID2" || true; } || true
          echo '=== UNIT ==='
          systemctl cat meme-alpha-micro-live.service || true
          systemctl status meme-alpha-micro-live.service --no-pager -l || true
          echo '=== DIR_PERMS ==='
          ls -ld "$APP" "$APP/src" "$RT" /var/lib/meme-alpha /var/lib/meme-alpha/data "$DATA" 2>&1 || true
          ls -la "$RT" | tail -80 || true
          ls -la "$DATA" 2>&1 | tail -100 || true
          echo '=== STATE_META ==='
          stat "$DATA/state.json" 2>&1 || true
          head -c 2000 "$DATA/state.json" 2>&1 || true
          echo
          echo '=== ENV_RELEVANT ==='
          [ -n "$PID" ] && tr '\0' '\n' < "/proc/$PID/environ" 2>/dev/null | grep -Ei 'MEME|MICRO|DATA|STATE|NODE|HOME|USER' || true
          echo '=== FD ==='
          [ -n "$PID" ] && ls -l "/proc/$PID/fd" 2>/dev/null | tail -80 || true
          echo '=== JOURNAL_ALL ==='
          journalctl _PID="$PID" --since '2026-09-06 14:57:00 UTC' --no-pager -n 500 2>/dev/null || true
          echo '=== RUNNER ==='
          sed -n '1,240p' "$APP/run-paper.sh" || true
          echo V390_RUNTIME_TRACE=COMPLETE
