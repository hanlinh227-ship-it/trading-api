name: Meme Alpha V395 Signer-Compatible Buy Sizing
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/meme-alpha-v389-idle-cash.yml
permissions:
  contents: read
jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 7
    steps:
      - name: Deploy and activate V395
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; BASE="$RT/deploy-candidates"
          SRC="$APP/src/micro-live-executor.js"; CAND="$BASE/v395-executor-signer-cap.js"
          mkdir -p "$BASE"; cp -a "$SRC" "$CAND"
          python3 - "$CAND" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]); s=p.read_text()
          old="if(plan.targetInvestedLamports<p.minOrderLamports)return{placed:false,reason:'ALLOCATION_BELOW_MIN_ORDER',plan,profile};if(plan.availableLamports<p.minOrderLamports)return{placed:false,reason:'CAPITAL_HEADROOM_LOW',plan,profile};if(plan.amountLamports<p.minOrderLamports)return{placed:false,reason:'TARGET_ALREADY_SATISFIED',plan,profile};\n  const beforeTok=await tokenBalance(h.publicKey,c.mint),o=await signer({op:'order',inputMint:WSOL,outputMint:c.mint,amount:String(plan.amountLamports),maxPriceImpactPct:p.maxBuyPriceImpactPct});if(!o.ok)throw new Error(`SIGNER_${o.error}`);if(Math.abs(n(o.priceImpactPct,99))>p.maxBuyPriceImpactPct)throw new Error('ORDER_IMPACT_GUARD');"
          new="if(plan.targetInvestedLamports<p.minOrderLamports)return{placed:false,reason:'ALLOCATION_BELOW_MIN_ORDER',plan,profile};if(plan.availableLamports<p.minOrderLamports)return{placed:false,reason:'CAPITAL_HEADROOM_LOW',plan,profile};if(plan.amountLamports<p.minOrderLamports)return{placed:false,reason:'TARGET_ALREADY_SATISFIED',plan,profile};\n  const signerOrderCapLamports=Math.max(0,Math.floor(beforeSol*0.88)),orderAmountLamports=Math.min(plan.amountLamports,signerOrderCapLamports);if(orderAmountLamports<p.minOrderLamports)return{placed:false,reason:'SIGNER_ORDER_CAP_BELOW_MIN',plan,profile,signerOrderCapLamports};\n  const beforeTok=await tokenBalance(h.publicKey,c.mint),o=await signer({op:'order',inputMint:WSOL,outputMint:c.mint,amount:String(orderAmountLamports),maxPriceImpactPct:p.maxBuyPriceImpactPct});if(!o.ok)throw new Error(`SIGNER_${o.error}`);if(Math.abs(n(o.priceImpactPct,99))>p.maxBuyPriceImpactPct)throw new Error('ORDER_IMPACT_GUARD');"
          if s.count(old)!=1: raise SystemExit(f'V395_BUY_PATCH_COUNT={s.count(old)}')
          s=s.replace(old,new,1)
          old2="if(spent>plan.amountLamports+Math.max(ENTRY_OVERHEAD_LAMPORTS,exitHeadroomLamports))event({type:'POST_FILL_SPEND_OVER_PLAN',mint:c.mint,spentLamports:spent,plannedLamports:plan.amountLamports});"
          new2="if(spent>orderAmountLamports+Math.max(ENTRY_OVERHEAD_LAMPORTS,exitHeadroomLamports))event({type:'POST_FILL_SPEND_OVER_PLAN',mint:c.mint,spentLamports:spent,plannedLamports:orderAmountLamports});"
          if s.count(old2)!=1: raise SystemExit(f'V395_SPEND_GUARD_PATCH_COUNT={s.count(old2)}')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
          node --check "$CAND"
          OUT="$(node "$CAND" --self-test)"; printf '%s\n' "$OUT"
          grep -q 'NETWORK_EXECUTION=NOT_CALLED' <<<"$OUT"
          grep -q 'signerOrderCapLamports' "$CAND"
          grep -q 'amount:String(orderAmountLamports)' "$CAND"
          SHA="$(sha256sum "$CAND" | awk '{print $1}')"; echo V395_EXECUTOR_SHA="$SHA"

          echo '=== DEPLOY EXECUTOR ==='
          if sudo -n /usr/local/sbin/meme-alpha-safe-deploy executor "$(basename "$CAND")" "$SHA"; then
            echo V395_SAFE_DEPLOY=TRUE
          else
            echo V395_SAFE_DEPLOY=FALLBACK_HANDOFF
            BACK="$RT/v395-executor-backup-$(date +%Y%m%dT%H%M%SZ).js"
            cp -a "$SRC" "$BACK"
            cp "$CAND" "$SRC"
            chmod 664 "$SRC" || true
            sudo -n /usr/bin/systemctl restart meme-alpha-paper.service
          fi

          echo '=== VERIFY ACTIVE SOURCE ==='
          for i in $(seq 1 45); do
            sleep 2
            ACTUAL="$(sha256sum "$SRC" | awk '{print $1}')"
            [ "$ACTUAL" = "$SHA" ] && break
            [ "$i" -lt 45 ] || { echo V395_FAIL=SOURCE_SHA_MISMATCH; exit 9; }
          done
          echo V395_ACTIVE_SHA="$(sha256sum "$SRC" | awk '{print $1}')"
          systemctl is-active meme-alpha-paper.service
          systemctl is-active meme-alpha-micro-live.service
          systemctl is-active meme-alpha-signer.service

          echo '=== LIVE PROOF ==='
          for i in $(seq 1 45); do
            sleep 2
            python3 - <<'PY' && break || true
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          g=json.loads((rt/'micro-live-gate.json').read_text())
          assert g.get('allowed') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True
          cap=json.loads((rt/'capital-observability.json').read_text()) if (rt/'capital-observability.json').exists() else {}
          alloc=json.loads((rt/'allocator-status.json').read_text()) if (rt/'allocator-status.json').exists() else {}
          print('GATE',{k:g.get(k) for k in ['version','allowed','sourceHealthy','liveRiskReady','scaleAllowed','reasons']})
          print('CAPITAL',cap)
          print('ALLOCATOR',alloc)
          reason=str(alloc.get('reason') or '')
          assert reason!='SIGNER_DYNAMIC_BUY_SIZE_LIMIT'
          PY
          done
          for f in "$RT/last-execution.json" "$RT/allocator-status.json" "$RT/capital-observability.json"; do [ -f "$f" ] && { echo ---$f---; cat "$f"; echo; } || true; done
          echo V395_SIGNER_COMPATIBLE_BUY_SIZING=ACTIVE
          echo SCALE_ALLOWED=TRUE
