name: Deploy SignalHub V3.15.1 Hot Spare 2x2

on:
  push:
    branches: [signalhub-v315-fixed-2x2]
    paths:
      - 'scripts/patch_signalhub_v3151_hot_spare.py'
      - '.github/workflows/deploy-signalhub-v3151-hot-spare.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply V3.15 base and V3.15.1 hot-spare patches
        run: |
          set -euo pipefail
          python3 scripts/patch_signalhub_v315_fixed_2x2.py
          python3 scripts/patch_signalhub_v3151_hot_spare.py

      - name: Verify V3.15.1 source contracts
        run: |
          set -euo pipefail
          node --check signalhub-worker/gateway-v3.js
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          for x in [
              "SIGNALHUB-V3-GATEWAY-3.15.1",
              "targetActivePerStyle:2",
              "standbyPerStyle:3",
              "DURABLE_OBJECT_HOT_SPARE_ATOMIC",
              "async setStandbys(payload)",
              "async promoteStandby(style",
              "HOT_SPARE_PROMOTED",
              "/v3/standbys",
              "ACTIVE_READ_REFILL_AFTER_SCAN",
          ]: assert x in w,x
          assert Path('SIGNALHUB_V3_CHECKPOINT_07_FIXED_2X2.md').is_file()
          print('V3.15.1 source contract OK')
          PY

      - name: Validate Worker dry-run
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v3151-worker

      - name: Deploy V3.15.1 worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Wait for production V3.15.1
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 40); do
            if curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" >/tmp/status.json; then
              if python3 - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          assert s.get('version')=='SIGNALHUB-V3-GATEWAY-3.15.1',s.get('version')
          p=(s.get('decisionPolicy') or {}).get('portfolioPolicy') or {}
          assert p.get('targetActivePerStyle')==2,p
          assert p.get('standbyPerStyle')==3,p
          assert p.get('replacementMode')=='DURABLE_OBJECT_HOT_SPARE_ATOMIC',p
          PY
              then ready=1; break; fi
            fi
            sleep 2
          done
          test "$ready" = 1

      - name: Fill and prepare hot spares
        run: |
          set -euo pipefail
          ok=0
          for attempt in $(seq 1 10); do
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=CRYPTO&style=SCALP&probe=$RANDOM-$attempt" >/tmp/scalp.json || true
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 120 "$SIGNALHUB_URL/v3/scan?market=CRYPTO&style=SWING&probe=$RANDOM-$attempt" >/tmp/swing.json || true
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 30 "$SIGNALHUB_URL/v3/portfolio?probe=$RANDOM-$attempt" >/tmp/portfolio.json
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 30 "$SIGNALHUB_URL/v3/standbys?probe=$RANDOM-$attempt" >/tmp/standbys.json
            if python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/portfolio.json')).get('portfolio') or {})
          s=(json.load(open('/tmp/standbys.json')).get('standbys') or {})
          st=p.get('styles') or {}
          print('portfolio',p)
          print('standbys',s)
          assert p.get('activeTotal')==4,p
          assert st.get('SCALP')==2 and st.get('SWING')==2,st
          assert (s.get('SCALP') or {}).get('count',0)>=1,s
          assert (s.get('SWING') or {}).get('count',0)>=1,s
          PY
            then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1

      - name: Verify 2x2 remains stable for 20 seconds
        run: |
          set -euo pipefail
          for n in $(seq 1 10); do
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 30 "$SIGNALHUB_URL/v3/portfolio?probe=$RANDOM-$n" >/tmp/p.json
            python3 - <<'PY'
          import json
          p=(json.load(open('/tmp/p.json')).get('portfolio') or {})
          st=p.get('styles') or {}
          print('sample',p)
          assert p.get('activeTotal')==4,p
          assert st.get('SCALP')==2 and st.get('SWING')==2,st
          PY
            sleep 2
          done

      - name: Verify active signal and standby contracts
        run: |
          set -euo pipefail
          for st in SCALP SWING; do
            curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 120 "$SIGNALHUB_URL/v3/signals?market=CRYPTO&style=$st&status=active&limit=20&probe=$RANDOM" > "/tmp/active-$st.json"
          done
          curl -A 'SignalHub-CI/3.15.1' -fsS --max-time 30 "$SIGNALHUB_URL/v3/standbys?probe=$RANDOM" >/tmp/standbys.json
          python3 - <<'PY'
          import json
          rows=[]
          for st in ('SCALP','SWING'):
              p=json.load(open('/tmp/active-'+st+'.json'))
              a=p.get('signals') or []
              assert len(a)==2,(st,len(a),a)
              for s in a:
                  assert s.get('engineVersion')=='SIGNALHUB-V3-GATEWAY-3.15.1',s
                  assert s.get('status') in ('PENDING','OPEN'),s
                  assert (s.get('entryAssessment') or {}).get('verdict')=='PASS',s
                  rows.append(s)
          syms=[x.get('symbol') for x in rows]
          assert len(set(syms))==4,syms
          assert len([x for x in rows if x.get('riskCluster')=='MEME'])<=1,rows
          sb=(json.load(open('/tmp/standbys.json')).get('standbys') or {})
          assert set(sb.keys())=={'SCALP','SWING'},sb
          print('active',[(x.get('style'),x.get('symbol'),x.get('orderType'),x.get('coverageTier'),x.get('coverageReplacement')) for x in rows])
          print('standbys',sb)
          PY

      - name: Verify Forex remains disabled
        run: |
          set -euo pipefail
          code=$(curl -A 'SignalHub-CI/3.15.1' -sS -o /tmp/fx.json -w '%{http_code}' --max-time 20 "$SIGNALHUB_URL/v3/signals?market=FOREX&style=SCALP")
          test "$code" = 410

      - name: Commit generated V3.15.1 source and checkpoint
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signalhub-worker/gateway-v3.js SIGNALHUB_V3_CHECKPOINT_07_FIXED_2X2.md
          git commit -m "SignalHub v3.15.1 hot-spare fixed 2x2 checkpoint" || true
          git push origin HEAD:signalhub-v315-fixed-2x2
