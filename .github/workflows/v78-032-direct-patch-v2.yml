name: V78-032 Direct Forex Metal Patch V2

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: v78-032-direct-patch-v2
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.issue.title == '[V78-032-APPLY-V2]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: chatgpt/v78-032-forex-metal-entry
      ISSUE: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mark start
        run: gh issue comment "$ISSUE" --body 'V78-032 V2 STARTED'

      - name: Create clean implementation branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B "$BRANCH" origin/main
          gh issue comment "$ISSUE" --body 'V78-032 V2 CHECKOUT PASS'

      - name: Apply exact anchored source edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          def rep(old,new,label):
              global s
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: count={n}, expected=1')
              s=s.replace(old,new,1)

          group_anchor='const GROUPS = { forex: FOREX, crypto: CRYPTO, metal: METALS, index: INDEX_CASH };'
          metal='''// Runtime routing priors only: no fabricated backtest statistics or directional bias.\nconst METAL_PRIORS = {\n  XAUUSD:{profile:"METAL_GOLD_ADAPTIVE",families:["TREND","MEANREV"],allowedModes:["TREND","MEAN_REVERSION"],newsProfile:{profileDrivers:["London/New York liquidity","XAU/XAG relative context"]}},\n  XAGUSD:{profile:"METAL_SILVER_ADAPTIVE",families:["TREND","MEANREV"],allowedModes:["TREND","MEAN_REVERSION"],newsProfile:{profileDrivers:["London/New York liquidity","XAG/XAU relative context"]}}\n};\n'''
          rep(group_anchor,metal+group_anchor,'metal-priors')

          v73_anchor='  const e=v73Entry(symbol,type);let key=null;if(type==="forex")key=norm(symbol);if(type==="crypto")key=v73CryptoPriorKey(symbol);'
          metal_v73='  if(type==="metal"){const k=METAL_PRIORS[norm(symbol)];if(!k)return {applicable:true,available:false,key:norm(symbol)};return {applicable:true,available:true,key:norm(symbol),source:"METAL_RUNTIME_PRIORS_R1",timeframe:"MULTI",status:"RUNTIME_METHOD_PRIOR",family:k.profile,families:k.families||[],profile:k.profile,entryMode:"DYNAMIC",rr:null,signalHourUTC:null,riskATR:null,newsProfile:k.newsProfile||{profileDrivers:[]},classification:"METAL_SIGNAL_RUNTIME_PRIOR"};}\n'
          rep(v73_anchor,metal_v73+v73_anchor,'metal-v73')

          rep('function regimeRouteScores(prior,T,context={}){','function regimeRouteScores(prior,T,context={},type="unknown"){','route-signature')

          rel_anchor='  const rel=Number(context.strengthNormalizedSigned??context.relativeStrength??context.strengthDiff),ctxMag=Number.isFinite(rel)?Math.min(1,Math.abs(rel)/2):0,ctxSide=Number.isFinite(rel)&&Math.abs(rel)>.05?(rel>0?"LONG":"SHORT"):"NEUTRAL";'
          override='  // V73 remains a prior, not a permanent regime prison: Forex MR-only may admit TREND only on strong live HTF agreement.\n  if(type==="forex"&&allowed.length===1&&allowed[0]==="MEAN_REVERSION"&&trendSide!=="NEUTRAL"&&trendStrength>=.67&&hAlign&&momOK)allowed.push("TREND");\n'
          rep(rel_anchor,override+rel_anchor,'forex-live-trend-override')

          old_return='  return {allowed,activeMode,scores,side,htfPass,votes:v,trendSide,ctxSide,ctxMag:Number(ctxMag.toFixed(3)),extension:Number(ext.toFixed(3)),emaDistATR:Number(emaDist.toFixed(3))};'
          new_return='  return {allowed,activeMode,scores,side,htfPass,votes:v,trendSide,ctxSide,ctxMag:Number(ctxMag.toFixed(3)),extension:Number(ext.toFixed(3)),emaDistATR:Number(emaDist.toFixed(3)),longRev:!!longRev,shortRev:!!shortRev,mrSide};'
          rep(old_return,new_return,'route-evidence')
          rep('route=regimeRouteScores(prior,T,context),mode=route.activeMode','route=regimeRouteScores(prior,T,context,type),mode=route.activeMode','method-call')

          loc_old='  if(mode==="MEAN_REVERSION")return {pass:false,mode,soft:false};'
          loc_new='''  if(mode==="MEAN_REVERSION"){\n    const route=intel?.route||{},aligned=side==="LONG"?(route.mrSide==="LONG"&&route.longRev===true&&M15.bullishReclaim===true):(route.mrSide==="SHORT"&&route.shortRev===true&&M15.bearishReclaim===true),extended=Number(route.extension||0)>=.35,dist=Number(route.emaDistATR||0),r=Number(M15.rsi14??50),extreme=side==="LONG"?r<=48:r>=52,contextOK=Number(context.score||0)>=4.8;\n    if(aligned&&extended&&(dist>=.45||extreme)&&contextOK&&Number(intel.methodFit||0)>=50)return {pass:true,mode:"MEAN_REVERSION_RECLAIM_ZONE",soft:true,level:M15.close,reversalConfirmed:true};\n    return {pass:false,mode,soft:false,level:Number.isFinite(M15.ema20)?M15.ema20:null};\n  }'''
          rep(loc_old,loc_new,'mr-location')

          trig_old='  if(mode==="MEAN_REVERSION")return {pass:false,pending:false,mode};'
          trig_new='''  if(mode==="MEAN_REVERSION"){\n    const route=intel?.route||{},aligned=side==="LONG"?(route.mrSide==="LONG"&&route.longRev===true):(route.mrSide==="SHORT"&&route.shortRev===true),reclaim=side==="LONG"?M5.bullishReclaim===true:M5.bearishReclaim===true,rejection=side==="LONG"?(M5.close>M5.open&&M5.close>=M5.ema20):(M5.close<M5.open&&M5.close<=M5.ema20),contextOK=Number(context.score||0)>=4.8;\n    if(aligned&&reclaim&&rejection&&contextOK&&Number(intel.methodFit||0)>=52)return {pass:true,pending:false,mode:"M5_MEAN_REVERSION_RECLAIM",level:M5.close,soft:true,reversalConfirmed:true};\n    return {pass:false,pending:false,mode,level:trig?.level??null};\n  }'''
          rep(trig_old,trig_new,'mr-trigger')

          sk_old='function symbolKnowledge(symbol){const s=canonicalUserSymbol(symbol),k=s.endsWith("USDT")?s.slice(0,-4):s;return INDEX_PRIORS[s]||SYMBOL_KNOWLEDGE?.symbols?.[s]||SYMBOL_KNOWLEDGE?.symbols?.[k]||null;}'
          sk_new='function symbolKnowledge(symbol){const s=canonicalUserSymbol(symbol),k=s.endsWith("USDT")?s.slice(0,-4):s;return INDEX_PRIORS[s]||METAL_PRIORS[s]||SYMBOL_KNOWLEDGE?.symbols?.[s]||SYMBOL_KNOWLEDGE?.symbols?.[k]||null;}'
          rep(sk_old,sk_new,'symbol-knowledge')
          p.write_text(s)
          PY
          gh issue comment "$ISSUE" --body 'V78-032 V2 SOURCE PATCH PASS'

      - name: Add and run deterministic validation
        shell: bash
        run: |
          set -euo pipefail
          cat > scripts/ai/forex-metal-index-validation.js <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const e=fs.readFileSync('cloudflare-worker/engine-v77168.js','utf8');
          const C={
            metalPriors:e.includes('const METAL_PRIORS = {')&&e.includes('METAL_GOLD_ADAPTIVE')&&e.includes('METAL_SILVER_ADAPTIVE'),
            metalRouter:e.includes('METAL_RUNTIME_PRIORS_R1')&&e.includes('METAL_SIGNAL_RUNTIME_PRIOR'),
            forexOverride:e.includes('type==="forex"&&allowed.length===1&&allowed[0]==="MEAN_REVERSION"&&trendSide!=="NEUTRAL"&&trendStrength>=.67&&hAlign&&momOK'),
            routeEvidence:e.includes('longRev:!!longRev,shortRev:!!shortRev,mrSide'),
            mrLocation:e.includes('MEAN_REVERSION_RECLAIM_ZONE')&&e.includes('M15.bullishReclaim===true')&&e.includes('M15.bearishReclaim===true'),
            mrTrigger:e.includes('M5_MEAN_REVERSION_RECLAIM')&&e.includes('M5.bullishReclaim===true')&&e.includes('M5.bearishReclaim===true'),
            yahooSafe:e.includes('source:"Yahoo Finance Cash Index Fallback"')&&e.includes('instrumentIdentity:"CASH_INDEX"'),
            tdFallback:e.includes('source:"Twelve Data Index Quote Fallback"'),
            antiChase:e.includes('pass:chase<=.70&&notExtreme'),
            signalOnly:e.includes('executionAuthority:"SIGNAL_ONLY"')&&e.includes('signalOnly:true'),
            rr:e.includes('function minimumQualityRR')&&e.includes('function rrQuality'),
            structuralSL:e.includes('function buildTradePlan')&&e.includes('STRUCTURE_LIQUIDITY')
          };
          for(const [k,v] of Object.entries(C)){assert.equal(v,true,k);console.log('PASS',k)}
          console.log(`V78-032 PASS ${Object.keys(C).length}/${Object.keys(C).length}`)
          JS
          node --check cloudflare-worker/engine-v77168.js
          node scripts/ai/forex-metal-index-validation.js
          git diff --exit-code origin/main -- data/nocut_intraday_allpass_v73.json data/symbol_knowledge_registry.json
          git diff --check
          gh issue comment "$ISSUE" --body 'V78-032 V2 VALIDATION PASS'

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ChatGPT Trading Coengineer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js scripts/ai/forex-metal-index-validation.js
          git commit -m 'V78-032: repair Forex MR and Metal regime admission'
          git push --force-with-lease origin "$BRANCH"
          echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          gh issue comment "$ISSUE" --body "V78-032 V2 PUSH PASS • HEAD $(git rev-parse HEAD)"

      - name: Open PR and request Codex review
        shell: bash
        run: |
          set -euo pipefail
          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -z "$PR" ]; then
            URL="$(gh pr create --base main --head "$BRANCH" --title 'V78-032 Forex + Metal regime admission repair' --body 'SIGNAL-ONLY bounded repair: safe MR adaptive reversal path, live HTF override for MR-only Forex priors, neutral XAU/XAG runtime routing priors. Index fallback freshness unchanged. No deploy/merge.')"
            PR="${URL##*/}"
          fi
          gh pr comment "$PR" --body "@codex review\n\nReview current head $HEAD_SHA for Forex MR safety, Metal runtime priors, unchanged RR/SL/anti-chase/news and Cash Index fallback protections. Do not implement changes."
          gh issue comment "$ISSUE" --body "V78-032 V2 PR PASS • PR #$PR • HEAD $HEAD_SHA"
