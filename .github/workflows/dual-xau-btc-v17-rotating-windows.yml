name: Dual XAU BTC V17 Rotating Windows

on:
  push:
    paths:
      - 'research/dual_xau_btc_v17_rotating_windows.py'
      - '.github/workflows/dual-xau-btc-v17-rotating-windows.yml'
  workflow_dispatch:

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} V17 rotating-window backtest
        run: |
          mkdir -p research/results
          python3 research/dual_xau_btc_v17_rotating_windows.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_v17_rotating_windows.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-v17-rotating-windows-result
          path: research/results/${{ matrix.symbol }}_v17_rotating_windows.txt
          retention-days: 30
