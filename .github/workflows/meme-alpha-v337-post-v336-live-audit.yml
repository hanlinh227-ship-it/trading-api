name: Meme Alpha v3.37 Post v3.36 Live Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v337-post-v336-live-audit.sh'
      - '.github/workflows/meme-alpha-v337-post-v336-live-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify v3.36 autonomous runtime and live wallet
        run: bash ops/meme-alpha/v337-post-v336-live-audit.sh
