name: Mark Brain 4.9 Known Good

on:
  push:
    branches: [release/brain-4-9-known-good]
    paths:
      - '.github/workflows/mark-brain-4-9-known-good.yml'

permissions:
  contents: write

jobs:
  mark-known-good:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/brain-4-9-known-good
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Mark verified 4.9.0 known-good with canonical release tool
        run: |
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.9.0 \
            --source post_deploy_verified_adaptive_free_model_mesh \
            --class C \
            --validated \
            --known-good \
            --root .
      - name: Verify release state
        run: |
          python AI_SKILL_LIBRARY/v4/tools/release.py check --root .
          python AI_SKILL_LIBRARY/validate_v4.py
      - name: Commit canonical release metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AI_SKILL_LIBRARY/v4/releases
          git commit -m 'release: mark Brain 4.9 model mesh known good'
          git push origin HEAD:release/brain-4-9-known-good
