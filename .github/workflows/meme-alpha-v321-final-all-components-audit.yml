name: Meme Alpha v3.21 Final All Components Audit
on:
  push:
    branches: [main]
    paths:
      - 'ops/meme-alpha/v321-final-all-components-audit.sh'
      - '.github/workflows/meme-alpha-v321-final-all-components-audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: [self-hosted, linux]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Verify every Meme Alpha runtime component
        run: bash ops/meme-alpha/v321-final-all-components-audit.sh
