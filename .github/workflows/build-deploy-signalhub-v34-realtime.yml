name: Build Deploy SignalHub V3.4 Realtime

on:
  push:
    branches: [signalhub-v34-realtime]
    paths:
      - '.github/workflows/build-deploy-signalhub-v34-realtime.yml'
      - 'scripts/patch_signalhub_v34_realtime.py'
      - 'scripts/patch_signalhub_v34_guard.py'
  workflow_dispatch:

permissions:
  contents: write

env:
  SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
  APP_VERSION: 3.4.0

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply V3.4 realtime patch
        run: |
          set -euo pipefail
          python3 scripts/patch_signalhub_v34_realtime.py
          python3 scripts/patch_signalhub_v34_guard.py

      - name: Verify source contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'export class MT5LiveState' signalhub-worker/gateway-v3.js
          grep -q 'DURABLE_OBJECT_REALTIME' signalhub-worker/gateway-v3.js
          grep -q '/v3/forex/stream' signalhub-worker/gateway-v3.js
          grep -q 'MT5_LIVE' signalhub-worker/wrangler.jsonc
          grep -q 'LỆNH LIVE' signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java
          grep -q 'LỆNH CHỜ • LIMIT / STOP' signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java
          grep -q 'pendingTriggered' signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java
          grep -q 'WebSocket realtime' signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java
          grep -q "versionName '3.4.0'" signalhub-android/app/build.gradle

      - name: Validate Worker
        working-directory: signalhub-worker
        run: npx --yes wrangler@latest deploy --dry-run --config wrangler.jsonc --outdir /tmp/v34-worker

      - name: Deploy realtime Worker
        working-directory: signalhub-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config wrangler.jsonc

      - name: Smoke realtime production
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for n in $(seq 1 30); do
            code=$(curl -sS --max-time 15 -H 'Cache-Control: no-cache' -o /tmp/status.json -w '%{http_code}' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" || true)
            if [ "$code" = 200 ]; then
              if python3 - <<'PY'
          import json
          s=json.load(open('/tmp/status.json'))
          assert s.get('ok') is True, s
          assert s.get('version') == 'SIGNALHUB-V3-GATEWAY-3.4.0', s.get('version')
          assert 'DURABLE_OBJECT' in s.get('forex',{}).get('transport',''), s.get('forex')
          PY
              then
                ready=1
                break
              fi
            fi
            echo "Waiting for V3.4 propagation attempt $n..."
            sleep 2
          done
          test "$ready" = 1
          curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/forex/live?probe=$RANDOM" >/tmp/live.json || true
          python3 - <<'PY'
          import json, pathlib
          p=pathlib.Path('/tmp/live.json')
          if p.exists() and p.stat().st_size:
              x=json.load(open(p))
              assert x.get('transport') in ('DURABLE_OBJECT_REALTIME','KV_FALLBACK'), x
              print('live state=',x.get('state'),'age=',x.get('quoteAgeMs'),'count=',x.get('count'),'transport=',x.get('transport'))
          PY

      - name: Build APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          test "$(stat -c%s "$APK")" -gt 50000
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
          mkdir -p dist
          cp "$APK" "dist/SignalHub-v3.4.0-Realtime.apk"
          sha256sum "dist/SignalHub-v3.4.0-Realtime.apk" > dist/SHA256SUMS.txt

      - name: Smoke signal contracts
        shell: bash
        run: |
          set -euo pipefail
          for m in FOREX CRYPTO; do
            for s in SCALP SWING; do
              curl -fsS --max-time 30 "$SIGNALHUB_URL/v3/signals?market=$m&style=$s&status=active&limit=50" >/tmp/s.json
              M="$m" S="$s" python3 - <<'PY'
          import json,os
          p=json.load(open('/tmp/s.json'))
          assert p.get('ok') is True
          assert p.get('market')==os.environ['M'] and p.get('style')==os.environ['S']
          for x in p.get('signals',[]):
              assert x.get('status') in ('PENDING','OPEN')
              assert x.get('orderType') in ('MARKET','LIMIT','STOP')
              assert x.get('signalId')
          PY
            done
          done

      - name: Commit V3.4 source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add signalhub-worker/gateway-v3.js signalhub-worker/wrangler.jsonc \
                  signalhub-android/app/build.gradle \
                  signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java \
                  signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java \
                  signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java
          git commit -m "SignalHub v3.4 realtime WebSocket + LIVE LIMIT STOP UI" || true
          git push origin HEAD:signalhub-v34-realtime

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.4.0-Realtime
          path: dist/
          retention-days: 30

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='signalhub-v3.4.0-realtime'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SignalHub-v3.4.0-Realtime.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/SignalHub-v3.4.0-Realtime.apk dist/SHA256SUMS.txt \
              --target signalhub-v34-realtime --prerelease \
              --title 'SignalHub v3.4.0 Realtime' \
              --notes 'Realtime Exness transport via Durable Object + WebSocket, REST fallback, separate LIVE and LIMIT/STOP sections, instant pending-to-live display transition on trigger, P/L SL↔TP gauge, SCALP/SWING isolation.'
          fi
