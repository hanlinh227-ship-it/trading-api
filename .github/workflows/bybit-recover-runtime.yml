name: Bybit Recover Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-recover-runtime.yml'

permissions:
  contents: read

jobs:
  recover:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Recover existing Bybit private runtime
        shell: bash
        run: |
          set -euo pipefail
          echo '=== BYBIT RUNTIME RECOVERY V2 ==='
          if systemctl list-unit-files --type=service --no-legend | awk '{print $1}' | grep -qx 'v11-manual-ai-bridge.service'; then
            sudo systemctl restart v11-manual-ai-bridge.service
            systemctl is-active --quiet v11-manual-ai-bridge.service
            echo 'v11-manual-ai-bridge=active'
          fi
          PID="$(ss -ltnp 2>/dev/null | sed -n 's/.*127\.0\.0\.1:8790.*pid=\([0-9][0-9]*\).*/\1/p' | head -1 || true)"
          if [ -n "$PID" ]; then echo "private_proxy_port_8790=LISTENING pid=$PID"; else echo 'private_proxy_port_8790=NOT_LISTENING'; fi
          mapfile -t UNITS < <(systemctl list-unit-files --type=service --no-legend 2>/dev/null | awk '{print $1}' | grep -Ei 'bybit|private.*proxy|trading.*proxy' || true)
          for unit in "${UNITS[@]:-}"; do [ -n "$unit" ] || continue; echo "restarting=$unit"; sudo systemctl restart "$unit"; done
          if [ -n "${PID:-}" ]; then
            UNIT_NAME="$(systemctl status "$PID" 2>/dev/null | head -1 | sed -n 's/.*(\([^)]*\.service\)).*/\1/p' || true)"
            if [ -n "$UNIT_NAME" ] && [ "$UNIT_NAME" != 'v11-manual-ai-bridge.service' ]; then echo "restarting_port_owner=$UNIT_NAME"; sudo systemctl restart "$UNIT_NAME" || true; fi
          fi
          sleep 3
          ss -ltnp 2>/dev/null | grep -E '127\.0\.0\.1:(8789|8790)' || true
          HEALTH="$(curl -fsS --connect-timeout 5 --max-time 25 https://trading-v77-scanner.hanlinh227.workers.dev/bybit/health)"
          printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; j=json.load(sys.stdin); out={k:j.get(k) for k in ("ok","mode","authenticated","privateTransport","marketTransport","execution","account","runtimeRevision")}; print(json.dumps(out,separators=(",",":"))); assert j.get("mode")=="LIVE", "MODE_NOT_LIVE"; assert j.get("authenticated") is True, "BYBIT_NOT_AUTHENTICATED"; e=j.get("execution") or {}; assert e.get("ready") is True, "EXECUTION_NOT_READY"; a=j.get("account") or {}; assert a.get("totalEquity") is not None, "BALANCE_UNAVAILABLE"'
          echo 'BYBIT_RUNTIME_RECOVERY_PASS'
