name: V15 Training Diagnostic
on:
  push:
    paths:
      - "scripts/v15_training_diagnostic.py"
      - ".github/workflows/v15-training-diagnostic.yml"
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          mkdir -p data
          python3 scripts/v15_training_diagnostic.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v15_training_diagnostic.json
          git commit -m "Run V15 training diagnostic" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
