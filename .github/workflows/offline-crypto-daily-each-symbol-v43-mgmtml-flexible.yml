name: Offline Crypto Daily Each Symbol V43 Flexible
on:
  push:
    paths:
      - 'scripts/offline_crypto_daily_each_symbol_v43_mgmtml_flexible.py'
      - '.github/workflows/offline-crypto-daily-each-symbol-v43-mgmtml-flexible.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Run flexible per-coin management classifier
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
        run: python scripts/offline_crypto_daily_each_symbol_v43_mgmtml_flexible.py
