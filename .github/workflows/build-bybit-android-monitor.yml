name: Build Bybit Android Monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-android-app-trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bybit-android-app-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate committed Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android-monitor/settings.gradle.kts
          test -f android-monitor/app/build.gradle.kts
          test -f android-monitor/app/src/main/java/com/hanlinh/bybitmonitor/MainActivity.kt
          grep -R -q 'FontFamily.Monospace' android-monitor/app/src/main/java
          grep -R -q 'darkColorScheme' android-monitor/app/src/main/java
      - name: Security assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'BYBIT_AUTO_API_SECRET|HYRO_BYBIT_LIVE_API_SECRET|V11_AI_BRIDGE_SECRET|GPT_5AI_ACTION_KEY|x-action-key' android-monitor/app/src/main || exit 9
          grep -R -q 'AndroidKeyStore' android-monitor/app/src/main
          grep -R -q 'tradingControls' cloudflare-worker/bybit-android-monitor-contract.js
      - name: Build installable APK
        working-directory: android-monitor
        run: gradle --no-daemon :app:assembleDebug
      - name: Normalize APK name and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-monitor/app/build/outputs/apk/debug/app-debug.apk dist/BybitAndroidMonitor-v1.1.apk
          test -s dist/BybitAndroidMonitor-v1.1.apk
          sha256sum dist/BybitAndroidMonitor-v1.1.apk | tee dist/SHA256SUMS.txt
          unzip -l dist/BybitAndroidMonitor-v1.1.apk | grep -q 'AndroidManifest.xml'
      - uses: actions/upload-artifact@v4
        with:
          name: BybitAndroidMonitor-v1.1
          path: |
            dist/BybitAndroidMonitor-v1.1.apk
            dist/SHA256SUMS.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=bybit-android-monitor-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BybitAndroidMonitor-v1.1.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/BybitAndroidMonitor-v1.1.apk dist/SHA256SUMS.txt --title 'Bybit Android Monitor V1' --notes 'Read-only Android monitor. Dark cyber-finance monospace UI, realtime WebSocket telemetry, Android Keystore token storage, notifications and home-screen widget.'
          fi
