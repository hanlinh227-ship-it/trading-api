name: Build Bybit Android Monitor
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-android-app-trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bybit-android-app-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Android project
        run: python3 .github/scripts/create-bybit-android-monitor-app.py
      - name: Security assertions
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'BYBIT_AUTO_API_SECRET|HYRO_BYBIT_LIVE_API_SECRET|V11_AI_BRIDGE_SECRET|GPT_5AI_ACTION_KEY|x-action-key' android-monitor/app/src/main || exit 9
          grep -R -q 'AndroidKeyStore' android-monitor/app/src/main
          grep -R -q 'tradingControls' cloudflare-worker/bybit-android-monitor-contract.js
      - name: Build installable APK
        working-directory: android-monitor
        run: gradle --no-daemon :app:assembleDebug
      - name: Normalize APK name and inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp android-monitor/app/build/outputs/apk/debug/app-debug.apk dist/BybitAndroidMonitor-v1.apk
          test -s dist/BybitAndroidMonitor-v1.apk
          sha256sum dist/BybitAndroidMonitor-v1.apk | tee dist/SHA256SUMS.txt
          unzip -l dist/BybitAndroidMonitor-v1.apk | grep -q 'AndroidManifest.xml'
      - name: Commit generated Android source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-monitor
          if ! git diff --cached --quiet; then
            git commit -m 'Add complete Bybit Android Monitor V1 app'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: BybitAndroidMonitor-v1
          path: |
            dist/BybitAndroidMonitor-v1.apk
            dist/SHA256SUMS.txt
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG=bybit-android-monitor-v1
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/BybitAndroidMonitor-v1.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/BybitAndroidMonitor-v1.apk dist/SHA256SUMS.txt --title 'Bybit Android Monitor V1' --notes 'Read-only Android monitor for BYBIT_ANDROID_MONITOR_V1. No Bybit API credentials are embedded. Includes Dashboard, Positions, Scanner, realtime WebSocket, Android Keystore token storage, notifications and home-screen widget.'
          fi
