name: DeepSeek Lane — Front Door Project Resolution

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0
      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "brain_authority=false"
          echo "project_state_authority=false"
          echo "merge_authority=false"
          echo "trading_authority=false"
      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"
      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prompt = '''Implement only Task 1 of the approved Front Door Closure plan: default project resolution.
          Return one JSON object with exactly one key, "files". "files" must map exactly these two repository paths to complete UTF-8 file contents:
          cloudflare-worker/project-resolution.js
          cloudflare-worker/test-project-resolution.mjs

          Required interface:
          resolveProjectId(request, clientConfig, storedDefault) -> string|null

          Invariants:
          - explicit project_id supplied by the authenticated request wins when valid;
          - otherwise an explicitly approved client default may be used;
          - otherwise an explicitly stored approved default may be used;
          - never guess across projects;
          - conflicting ambiguous project identifiers fail closed;
          - malformed, empty, non-string, or unapproved defaults return null rather than guessing;
          - no secret material, transcript content, or connector token is persisted/logged;
          - IMPORTANT: cloudflare-worker is ESM. Use native ES module syntax only: export function / export { ... }. Do NOT use module.exports, exports.*, require(), __dirname, or CommonJS;
          - ChatGPT/Claude/Gemini are clients, never Brain authorities;
          - project continuity remains bounded/versioned and this resolver has no routing/reasoning/scheduling/trading authority.
          Tests must cover explicit wins, approved default, stored default, ambiguity, malformed inputs, and no-guess behavior.
          Do not modify existing Cloudflare files, adapters registry, checkpoint, shared state, Storage Mesh, Survival Plane, or release pointers.
          No new dependencies. Node tests only. Return no prose outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 6000,
              "temperature": 0,
                          "response_format": {"type": "json_object"},
                          "messages": [
              {"role": "system", "content":"You are a bounded coding worker. Reply with exactly one JSON object whose only key is \"files\" mapping exactly the two allowed paths. Keep the resolver deterministic, small, fail-closed, and non-authoritative."},
              {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request),encoding='utf-8')
          PY
      - name: Prove output contract offline
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}'             --connect-timeout 15 --max-time 240             -H "Authorization: Bearer ${DEEPSEEK_API_KEY}"             -H 'Content-Type: application/json'             --data-binary @/tmp/deepseek-request.json             https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .
      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(cloudflare-worker/project-resolution\.js|cloudflare-worker/test-project-resolution\.mjs)$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"
      - name: Run focused tests
        run: |
          set -euo pipefail
          node cloudflare-worker/test-project-resolution.mjs
          echo "DEEPSEEK_TESTS=PASS"
      - name: Commit DeepSeek project resolver
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add cloudflare-worker/project-resolution.js cloudflare-worker/test-project-resolution.mjs
          git commit -m 'feat(front-door): add deterministic project resolver'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_FRONT_DOOR_RESOLVER_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
