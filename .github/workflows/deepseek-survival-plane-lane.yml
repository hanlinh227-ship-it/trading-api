name: DeepSeek Lane — Always-On Durable Job Contract

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "reasoning_authority=false"
          echo "scheduling_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prompt = '''Implement only Task 1 of the approved Always-On Execution Closure plan: durable job contract.
          Return one JSON object with exactly one key, "files". "files" must map exactly these three repository paths to complete UTF-8 file contents:
          AI_SKILL_LIBRARY/v4/always_on/job.schema.json
          AI_SKILL_LIBRARY/v4/always_on/policy.yaml
          AI_SKILL_LIBRARY/tests/test_always_on_job_contract.py

          Required job fields:
          job_id, request_id, project_id, role_id, capability, privacy_class, priority,
          idempotency_key, attempt, max_attempts, created_at, available_at, deadline_at,
          lease_owner, lease_expires_at, source_revision, evidence_refs, authority.

          Requirements:
          - JSON Schema must require the exact durable fields needed by the approved plan and validate basic types/bounds.
          - authority MUST be constrained to false, never merely default false.
          - attempts/max_attempts must be bounded non-negative/positive integers with sensible fail-closed validation.
          - privacy_class must use the existing canonical privacy vocabulary: PUBLIC, INTERNAL, CONFIDENTIAL, LOCAL_ONLY.
          - policy.yaml must explicitly set routing_authority=false, scheduling_authority=false, trading_authority=false, model_selection_authority=false, merge_authority=false, deployment_authority=false.
          - paid execution fallback remains disabled.
          - background processing remains bounded/event-driven; no busy polling.
          - duplicate delivery must be side-effect safe via idempotency_key contract.
          - GITHUB_BRAIN_V4 remains sole Brain, task_router sole routing authority, Model Mesh remains model/provider selector.
          - Tests must fail closed on missing authority, authority=true, missing required durable fields, invalid privacy class, invalid attempt bounds, and malformed evidence_refs.
          - Do not touch Cloudflare worker files, Storage Mesh, Survival Plane, checkpoint.json, shared_state.yaml, universal_fabric.yaml, release pointers, or existing Always-On retry/reconciler files.
          - No new dependencies. Tests offline only.
          - Return no prose outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 7000,
              "temperature": 0,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "You are a bounded coding worker. Reply with exactly one JSON object whose only key is \"files\" mapping exactly the three allowed paths to complete file contents. Keep the contract minimal, strict, non-authoritative, and fail-closed."},
                  {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY

      - name: Prove output contract offline
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
          echo "DEEPSEEK_APPLY_TESTS=PASS"

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .

      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(AI_SKILL_LIBRARY/v4/always_on/(job\.schema\.json|policy\.yaml)|AI_SKILL_LIBRARY/tests/test_always_on_job_contract\.py)$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q AI_SKILL_LIBRARY/tests/test_always_on_job_contract.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit DeepSeek durable job contract
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/always_on/job.schema.json \
            AI_SKILL_LIBRARY/v4/always_on/policy.yaml \
            AI_SKILL_LIBRARY/tests/test_always_on_job_contract.py
          git commit -m 'feat(always-on): define durable job contract'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_DURABLE_JOB_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
