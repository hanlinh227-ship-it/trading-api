name: DeepSeek Lane — Always-On Retry and Reconciler

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "reasoning_authority=false"
          echo "scheduling_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prompt = '''Implement only Tasks 4 and 5 of the approved Always-On Execution Closure plan.
          Return one JSON object with exactly one key, "files". "files" must map exactly these four repository paths to complete UTF-8 file contents:
          AI_SKILL_LIBRARY/v4/always_on/retry.py
          AI_SKILL_LIBRARY/tests/test_always_on_retry.py
          AI_SKILL_LIBRARY/v4/always_on/reconciler.py
          AI_SKILL_LIBRARY/tests/test_always_on_reconciler.py

          Task 4 interfaces:
          - classify_failure(kind)->"retryable"|"terminal"
          - next_retry_delay(attempt, base_seconds=5, cap_seconds=900)->int
          - should_dead_letter(attempt, max_attempts)->bool
          Requirements: bounded exponential backoff, cap enforced, deterministic jitter injection available for tests, fail closed on invalid values, no unbounded retry.

          Task 5 interface:
          - reconcile(desired, observed)->list[Action]
          Allowed actions include REQUEUE_EXPIRED_LEASE, QUARANTINE_PROVIDER, REQUEST_REPLICA_REPAIR, EXCLUDE_STALE_WORKER.
          Requirements: pure deterministic desired-vs-observed reconciliation; no I/O, no network, no busy polling, no model selection, no routing, no scheduling authority, no trade authority. Inputs must not be mutated. Duplicate inputs must not produce duplicate unsafe actions.

          Global constraints:
          - GITHUB_BRAIN_V4 remains sole Brain.
          - task_router remains sole routing authority.
          - Model Mesh remains model/provider selection layer.
          - paid execution fallback remains disabled.
          - background work is bounded/event-driven.
          - DeepSeek has no authority flags.
          - Do not modify Storage Mesh, Survival Plane, checkpoint.json, shared_state.yaml, universal_fabric.yaml, Cloudflare worker files, or release pointers.
          - No new dependencies. Tests must be offline.
          - Return no prose outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 9000,
              "temperature": 0,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "You are a bounded coding worker. Reply with one JSON object only. The object has exactly one key, \"files\", mapping exactly the four allowed paths to complete file contents. Keep implementations compact, deterministic, fail-closed, and non-authoritative."},
                  {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY

      - name: Prove output contract offline
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
          echo "DEEPSEEK_APPLY_TESTS=PASS"

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .

      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(AI_SKILL_LIBRARY/v4/always_on/(retry\.py|reconciler\.py)|AI_SKILL_LIBRARY/tests/(test_always_on_retry\.py|test_always_on_reconciler\.py))$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q \
            AI_SKILL_LIBRARY/tests/test_always_on_retry.py \
            AI_SKILL_LIBRARY/tests/test_always_on_reconciler.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit DeepSeek Always-On tasks
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/always_on/retry.py \
            AI_SKILL_LIBRARY/v4/always_on/reconciler.py \
            AI_SKILL_LIBRARY/tests/test_always_on_retry.py \
            AI_SKILL_LIBRARY/tests/test_always_on_reconciler.py
          git commit -m 'feat(always-on): add bounded retry and pure reconciler'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_ALWAYS_ON_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
