name: DeepSeek Lane — Survival Closure Proof

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "reasoning_authority=false"
          echo "scheduling_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prompt = '''Implement the non-shared-file portion of Task 6 of the approved Survival Plane plan.
          Return one JSON object with exactly one key, "files". "files" must map exactly these two repository paths to complete UTF-8 file contents:
          AI_SKILL_LIBRARY/v4/tools/survival_plane_proof.py
          AI_SKILL_LIBRARY/tests/test_survival_plane_proof.py

          Required output contract from the proof tool:
          SURVIVAL_PLANE_READY=PASS|FAIL
          DISASTER_RECOVERY_READY=PASS|FAIL
          POLICY_ENFORCEMENT=PASS|FAIL
          SECRET_REFERENCE_ONLY=PASS|FAIL
          ARTIFACT_TRUST=PASS|FAIL
          RESTORE_DRILL=PASS|FAIL

          Requirements:
          - Use the existing Survival Plane modules created by Tasks 1-5; do not create a parallel authority or duplicate policy engine.
          - Proof must be deterministic, offline, and fail closed.
          - POLICY_ENFORCEMENT may pass only when the canonical policy adapter contract is present and its fail-closed behavior can be evidenced.
          - SECRET_REFERENCE_ONLY may pass only when SecretRef/reference-only behavior is evidenced without exposing secret values.
          - ARTIFACT_TRUST may pass only when artifact scan + provenance contracts exist and reject missing/mismatched/unverified trust evidence.
          - RESTORE_DRILL and DISASTER_RECOVERY_READY MUST remain FAIL unless explicit faithful isolated restore-drill evidence is supplied and validated. Never synthesize or assume such evidence.
          - SURVIVAL_PLANE_READY may reflect the non-DR survival controls, but must not imply disaster recovery is ready.
          - Tests must pin all fail-closed behavior and must prove missing restore-drill evidence stays FAIL.
          - Do NOT modify AI_SKILL_LIBRARY/checkpoint.json, shared_state.yaml, universal_fabric.yaml, release pointers, Storage Mesh files, or any existing Survival Plane module.
          - routing/reasoning/scheduling/merge/deployment/trading authority all remain false.
          - No new dependencies and no network access in tests.
          - Return no prose outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 9000,
              "temperature": 0,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "You are a bounded coding worker. Reply with one JSON object only, first character { and final character }. The object has exactly one key, \"files\", mapping exactly the two allowed paths to complete file contents. Be fail-closed and never invent restore evidence. Keep the implementation compact; avoid explanatory comments, duplicate helpers, and large fixtures so the complete two-file JSON fits within the output limit."},
                  {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY

      - name: Prove output contract offline
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
          echo "DEEPSEEK_APPLY_TESTS=PASS"

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .

      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(AI_SKILL_LIBRARY/v4/tools/survival_plane_proof\.py|AI_SKILL_LIBRARY/tests/test_survival_plane_proof\.py)$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q AI_SKILL_LIBRARY/tests/test_survival_plane_proof.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit DeepSeek survival proof
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/tools/survival_plane_proof.py \
            AI_SKILL_LIBRARY/tests/test_survival_plane_proof.py
          git commit -m 'feat(survival): add fail-closed closure proof'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_SURVIVAL_PROOF_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
