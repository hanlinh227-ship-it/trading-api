name: DeepSeek Lane — Survival Artifact Trust

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "reasoning_authority=false"
          echo "scheduling_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEEPSEEK_API_KEY:-}" ]; then
            echo "DEEPSEEK_SECRET_PRESENT=MISSING"
            exit 1
          fi
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          prompt = '''Implement only Tasks 3 and 4 of the approved Survival Plane plan.
          Return one JSON object with exactly one key, "files". "files" must map exactly these four repository paths to complete UTF-8 file contents:
          AI_SKILL_LIBRARY/v4/survival/artifact_scan.py
          AI_SKILL_LIBRARY/tests/test_artifact_scan.py
          AI_SKILL_LIBRARY/v4/survival/provenance.py
          AI_SKILL_LIBRARY/tests/test_survival_provenance.py

          Requirements:
          - Python 3 and pytest/unittest-compatible tests.
          - Task 3: implement ScanEvidence(scanner, artifact_sha256, vulnerabilities, secrets_found, passed), an evidence parser, and a fail-closed admission/trust gate. A Trivy command adapter may be invoked only when installed; tests must use fixtures and must not require Trivy.
          - Task 4: implement ArtifactProvenance(sha256, source_revision, signer_ref, sbom_ref, verified) and validation requiring artifact hash, signer/provenance, source revision, and SBOM reference consistency. Cosign/CycloneDX/SPDX are evidence only; tests use fixtures and require no external binaries.
          - Protected artifact admission fails closed when scan/provenance evidence is missing, mismatched, unverified, reports secrets, or otherwise fails.
          - routing/reasoning/scheduling/merge/deployment/trading authority are all false.
          - Do not modify Storage Mesh files, checkpoint.json, shared_state.yaml, universal_fabric.yaml, release pointers, or Tasks 1-2 files.
          - Do not add dependencies and do not include Markdown fences or commentary outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 9000,
              "temperature": 0,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "You are a bounded coding worker. Obey the exact file allowlist and return complete files only. Your entire reply must be one JSON object: the first character you emit is { and the final character you emit is }. No prose, no explanation, no Markdown fences, nothing before or after the object. The object has exactly one key, \"files\", mapping exactly the four allowed repository paths to complete UTF-8 file contents. The complete JSON object with all four files must fit in this response. Keep implementations minimal and focused; do not add commentary, examples, or extra helpers beyond the stated requirements."},
                  {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY

      # Order item 7: local proof before a paid call. Four runs were spent
      # discovering an output-contract bug that costs nothing to find offline.
      # If the parser or the ownership guard is broken, the call never happens.
      - name: Prove the output contract offline before spending anything
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
          echo "DEEPSEEK_OWNERSHIP_TESTS=PASS"
          echo "DEEPSEEK_APPLY_TESTS=PASS"

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          if [ "${code}" != "200" ]; then
            echo "DEEPSEEK_API_HEALTH=FAIL"
            echo "DEEPSEEK_API_HTTP=${code}"
            exit 1
          fi
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .

      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(AI_SKILL_LIBRARY/v4/survival/(artifact_scan.py|provenance.py)|AI_SKILL_LIBRARY/tests/(test_artifact_scan.py|test_survival_provenance.py))
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q \
            AI_SKILL_LIBRARY/tests/test_artifact_scan.py \
            AI_SKILL_LIBRARY/tests/test_survival_provenance.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit DeepSeek artifact-trust tasks
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/survival/artifact_scan.py \
            AI_SKILL_LIBRARY/v4/survival/provenance.py \
            AI_SKILL_LIBRARY/tests/test_artifact_scan.py \
            AI_SKILL_LIBRARY/tests/test_survival_provenance.py
          git commit -m 'feat(survival): add artifact scan and provenance contracts'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_ARTIFACT_TRUST_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"

          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q \
            AI_SKILL_LIBRARY/tests/test_survival_policy.py \
            AI_SKILL_LIBRARY/tests/test_survival_secrets.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit first DeepSeek task
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/survival/policy.yaml \
            AI_SKILL_LIBRARY/v4/survival/policy_adapter.py \
            AI_SKILL_LIBRARY/v4/survival/secrets.py \
            AI_SKILL_LIBRARY/tests/test_survival_policy.py \
            AI_SKILL_LIBRARY/tests/test_survival_secrets.py
          git commit -m 'feat(survival): add policy and secret-reference contracts'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_FIRST_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
