name: DeepSeek Lane — Survival Recovery Contract

on:
  push:
    branches: [work/deepseek-survival-plane-442]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deepseek-survival-plane-442
  cancel-in-progress: false

jobs:
  implement:
    if: github.repository == 'hanlinh227-ship-it/trading-api' && github.actor == 'hanlinh227-ship-it'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/deepseek-survival-plane-442
          fetch-depth: 0

      - name: Declare bounded authority
        run: |
          echo "routing_authority=false"
          echo "reasoning_authority=false"
          echo "scheduling_authority=false"
          echo "merge_authority=false"
          echo "deployment_authority=false"
          echo "trading_authority=false"

      - name: Verify secret presence by name only
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          test -n "${DEEPSEEK_API_KEY:-}"
          echo "DEEPSEEK_SECRET_PRESENT=PRESENT"

      - name: Build narrow coding request
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          prompt = '''Implement only Task 5 of the approved Survival Plane plan: backup/restore contract.
          Return one JSON object with exactly one key, "files". "files" must map exactly these three repository paths to complete UTF-8 file contents:
          AI_SKILL_LIBRARY/v4/survival/recovery.py
          AI_SKILL_LIBRARY/v4/survival/recovery_policy.yaml
          AI_SKILL_LIBRARY/tests/test_survival_recovery.py

          Requirements:
          - Implement create_recovery_manifest(...)->dict and verify_restore(restored, expected)->RecoveryReport.
          - The recovery manifest must be bounded, deterministic where inputs are the same, reference hashes rather than plaintext secrets, and carry enough metadata to verify a faithful restore.
          - verify_restore must fail closed on missing objects, unexpected objects where policy forbids them, hash mismatch, malformed manifest, or incomplete required metadata. Missing fields such as sha256 must NEVER raise KeyError/TypeError; return a RecoveryReport with success=false and explicit reasons instead.
          - Backup is never considered healthy merely because creation succeeded; restore verification is authoritative for recovery readiness.
          - restic/OpenTofu/Ansible are external mechanics behind the contract; tests must not require those tools or network access.
          - recovery_policy.yaml must define conservative restore verification requirements and no authority flags.
          - routing/reasoning/scheduling/merge/deployment/trading authority are all false.
          - Do not modify Storage Mesh files, checkpoint.json, shared_state.yaml, universal_fabric.yaml, release pointers, or Tasks 1-4 files.
          - Tests must explicitly cover missing sha256 and other required fields and assert a fail-closed RecoveryReport rather than an exception. No new dependencies. Return no Markdown or prose outside the JSON object.
          '''
          request = {
              "model": "deepseek-chat",
              "max_tokens": 9000,
              "temperature": 0,
              "response_format": {"type": "json_object"},
              "messages": [
                  {"role": "system", "content": "You are a bounded coding worker. Reply with one JSON object only, first character { and final character }. The object has exactly one key, \"files\", mapping exactly the three allowed paths to complete file contents. Keep code minimal, testable, fail-closed, and within scope."},
                  {"role": "user", "content": prompt},
              ],
          }
          Path('/tmp/deepseek-request.json').write_text(json.dumps(request), encoding='utf-8')
          PY

      - name: Prove output contract offline
        run: |
          set -euo pipefail
          python3 -m unittest AI_SKILL_LIBRARY.tests.test_deepseek_lane_apply
          echo "DEEPSEEK_PARSER_TESTS=PASS"
          echo "DEEPSEEK_APPLY_TESTS=PASS"

      - name: Run one bounded DeepSeek coding call
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/deepseek-response.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer ${DEEPSEEK_API_KEY}" \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/deepseek-request.json \
            https://api.deepseek.com/v1/chat/completions || echo 000)"
          test "${code}" = "200"
          echo "DEEPSEEK_API_HEALTH=PASS"
          python3 .github/scripts/deepseek_lane_apply.py /tmp/deepseek-response.json .

      - name: Enforce file ownership
        run: |
          set -euo pipefail
          allowed='^(AI_SKILL_LIBRARY/v4/survival/(recovery\.py|recovery_policy\.yaml)|AI_SKILL_LIBRARY/tests/test_survival_recovery\.py)$'
          unexpected="$(git status --short --untracked-files=all | awk '{print $2}' | grep -Ev "${allowed}" || true)"
          if [ -n "${unexpected}" ]; then
            echo "DEEPSEEK_FILE_OWNERSHIP=FAIL"
            printf '%s\n' "${unexpected}"
            exit 1
          fi
          echo "DEEPSEEK_FILE_OWNERSHIP=PASS"

      - name: Run focused tests
        run: |
          python3 -m pip install -r AI_SKILL_LIBRARY/requirements.txt pytest
          python3 -m pytest -q AI_SKILL_LIBRARY/tests/test_survival_recovery.py
          echo "DEEPSEEK_TESTS=PASS"

      - name: Commit DeepSeek recovery contract
        run: |
          set -euo pipefail
          git config user.name 'DeepSeek Coding Lane'
          git config user.email 'deepseek-lane@users.noreply.github.com'
          git add \
            AI_SKILL_LIBRARY/v4/survival/recovery.py \
            AI_SKILL_LIBRARY/v4/survival/recovery_policy.yaml \
            AI_SKILL_LIBRARY/tests/test_survival_recovery.py
          git commit -m 'feat(survival): add backup and restore verification contract'
          git push origin HEAD:work/deepseek-survival-plane-442
          echo "DEEPSEEK_RECOVERY_COMMIT=$(git rev-parse HEAD)"
          echo "DEEPSEEK_CODING_LANE_READY=PASS"
