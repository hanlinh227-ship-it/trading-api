name: Meme Alpha V419 Exit Preview Budget Active
on:
  push:
    paths:
      - '.github/workflows/meme-alpha-v419-exit-preview-budget-active.yml'
  workflow_dispatch:
jobs:
  activate:
    runs-on: [self-hosted, trading-vps]
    steps:
      - name: Build validate activate V419
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app; RT="$APP/runtime-status"; E="$APP/src/micro-live-executor.js"; C="$RT/deploy-candidates/v419-exit-preview-budget.js"; RUN="$APP/run-paper.sh"
          cp "$E" "$C"
          python3 - "$C" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1]);s=p.read_text()
          old="const now=Date.now(),last=Date.parse(pos.lastMarkAt||0),cached=Number(pos.lastReturnPct);if(Number.isFinite(last)&&now-last<30_000&&Number.isFinite(cached)){exitPreviewCacheHits++;return cached}if(now<exitPreviewBackoffUntil){if(Number.isFinite(last)&&now-last<120_000&&Number.isFinite(cached)){exitPreviewCacheHits++;return cached}return null}const gap=1400-(now-lastExitPreviewRequestAt);if(gap>0)await sleep(gap);lastExitPreviewRequestAt=Date.now();"
          new="const now=Date.now(),last=Date.parse(pos.lastMarkAt||0),cached=Number(pos.lastReturnPct),cacheMs=Number.isFinite(cached)&&(cached>=5||cached<=-5)?20_000:60_000;if(Number.isFinite(last)&&now-last<cacheMs&&Number.isFinite(cached)){exitPreviewCacheHits++;return cached}if(now<exitPreviewBackoffUntil){if(Number.isFinite(last)&&now-last<180_000&&Number.isFinite(cached)){exitPreviewCacheHits++;return cached}return null}const gap=6000-(now-lastExitPreviewRequestAt);if(gap>0)await sleep(gap);lastExitPreviewRequestAt=Date.now();"
          assert s.count(old)==1,('PREVIEW_BUDGET_ANCHOR',s.count(old));s=s.replace(old,new,1)
          old="exitPreviewRateLimits++;exitPreviewBackoffUntil=Date.now()+15_000;throw new Error('EXIT_PREVIEW_RATE_LIMIT')"
          new="exitPreviewRateLimits++;exitPreviewBackoffUntil=Date.now()+60_000;throw new Error('EXIT_PREVIEW_RATE_LIMIT')"
          assert s.count(old)==1,('BACKOFF_ANCHOR',s.count(old));s=s.replace(old,new,1)
          marker="console.log('V418_CONFIRMED_LOSS_CONTROL=TRUE');"
          assert s.count(marker)==1;s=s.replace(marker,marker+"console.log('V419_EXIT_PREVIEW_GLOBAL_BUDGET=TRUE');console.log('V419_RATE_LIMIT_BACKOFF_60S=TRUE');",1)
          p.write_text(s)
          PY
          node --check "$C"; OUT=$(node "$C" --self-test); printf '%s\n' "$OUT"; grep -q 'V419_EXIT_PREVIEW_GLOBAL_BUDGET=TRUE' <<<"$OUT"; grep -q 'V418_WINNER_ONLY_SCALE=TRUE' <<<"$OUT"
          SHA=$(sha256sum "$C"|awk '{print $1}'); echo V419_SHA=$SHA
          OLD_PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1); cp "$E" "$RT/v419-pre-active-executor.js"; cp "$C" "$E"; chmod 664 "$E"; test "$(sha256sum "$E"|awk '{print $1}')" = "$SHA"
          ORIG="$RT/v419-run-paper-original.sh"; REQ="$RT/v419-recycle.request"; cp -a "$RUN" "$ORIG"; chmod 755 "$ORIG"; printf '%s\n' "$OLD_PID" > "$REQ"; chmod 664 "$REQ"
          cleanup(){ cp -a "$ORIG" "$RUN" 2>/dev/null || true; chmod 755 "$RUN" 2>/dev/null || true; rm -f "$REQ" 2>/dev/null || true; }; trap cleanup EXIT
          cat > "$RUN" <<'SH'
          #!/bin/bash
          set -u
          REQ=/opt/meme-alpha/app/runtime-status/v419-recycle.request
          ORIG=/opt/meme-alpha/app/runtime-status/v419-run-paper-original.sh
          if [ -r "$REQ" ]; then PID=$(cat "$REQ" 2>/dev/null||true); rm -f "$REQ" 2>/dev/null||true; if [ -n "$PID" ] && [ -r "/proc/$PID/cmdline" ]; then CMD=$(tr '\0' ' ' < "/proc/$PID/cmdline" 2>/dev/null||true); case "$CMD" in *'/opt/meme-alpha/app/src/micro-live-executor.js'*) kill -USR2 "$PID" 2>/dev/null||true;; esac; fi; fi
          exec "$ORIG"
          SH
          chmod 755 "$RUN"; sudo -n /bin/systemctl restart meme-alpha-paper.service
          NEW_PID=''; for i in $(seq 1 65); do sleep 2; NEW_PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js'|head -1||true); if [ -n "$NEW_PID" ] && [ "$NEW_PID" != "$OLD_PID" ] && systemctl is-active --quiet meme-alpha-micro-live.service; then break; fi; [ "$i" -lt 65 ] || exit 9; done
          cp -a "$ORIG" "$RUN"; chmod 755 "$RUN"; rm -f "$REQ"; trap - EXIT
          echo OLD_PID=$OLD_PID; echo NEW_PID=$NEW_PID; echo ACTIVE_SHA=$(sha256sum "$E"|awk '{print $1}'); [ "$NEW_PID" != "$OLD_PID" ]; [ "$(pgrep -fc '/opt/meme-alpha/app/src/micro-live-executor.js'||true)" -eq 1 ]; test "$(sha256sum "$E"|awk '{print $1}')" = "$SHA"
          sleep 80
          for svc in meme-alpha-paper.service meme-alpha-micro-live.service meme-alpha-signer.service meme-alpha-realtime-pulse.service meme-alpha-trend-pulse.service meme-alpha-whale-flow.service; do printf '%s=' "$svc"; systemctl is-active "$svc"; done
          python3 - <<'PY'
          import json,pathlib,time
          rt=pathlib.Path('/opt/meme-alpha/app/runtime-status')
          def load(n): p=rt/n;return json.loads(p.read_text()),round(time.time()-p.stat().st_mtime,2)
          g,ga=load('micro-live-gate.json');co,ca=load('capital-observability.json');rp,ra=load('realtime-pool-pulse.json');po,pa=load('portfolio-observability.json');al,aa=load('allocator-status.json')
          print('GATE',ga,{k:g.get(k) for k in ['allowed','armOk','sourceHealthy','riskEntryAllowed','liveRiskReady','scaleAllowed','reasons']});print('CAPITAL',ca,co);print('ALLOC',aa,al);print('REALTIME',ra,{k:rp.get(k) for k in ['status','heldTotal','heldResolved','heldUnresolved','heldCoveragePct','heldSubscriptions','lastError']});print('PORTFOLIO',pa,{k:po.get(k) for k in ['openPositions','stateReadable']})
          assert g.get('allowed') is True and g.get('armOk') is True and g.get('sourceHealthy') is True and g.get('liveRiskReady') is True and g.get('scaleAllowed') is True
          assert co.get('version')=='V418_EQUITY_EXPECTANCY' and int(co.get('exitPreviewRateLimits') or 0)<=1 and int(co.get('exitPreviewRequests') or 0)<=15
          assert rp.get('status')=='HEALTHY' and int(rp.get('heldUnresolved') or 0)==0 and int(rp.get('heldSubscriptions') or 0)>=int(rp.get('heldTotal') or 0) and po.get('stateReadable') is True
          PY
          echo V419_EXIT_PREVIEW_BUDGET=ACTIVE
          echo V418_EQUITY_EXPECTANCY=ACTIVE
          echo SCALE_ALLOWED=TRUE
          echo HARD_SAFETY_BYPASS=FALSE