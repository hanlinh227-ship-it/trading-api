name: Calibration Reveal Now

on:
  push:
    paths:
      - "reveal-now.json"

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: true

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify lock
        run: |
          python3 <<'PY'
          import json, os
          req=json.load(open('calibration-request.json'))
          d=json.load(open('data/calibration-decisions.json'))
          if d.get('cutoff')!=req.get('cutoff'): raise SystemExit('cutoff mismatch')
          if not d.get('lockedBeforeReveal'): raise SystemExit('decision lock missing')
          print('decision lock PASS')
          PY
      - name: Fetch group 1 future M5
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.parse
          from datetime import datetime,timedelta
          req=json.load(open('calibration-request.json'))
          cutoff=req['cutoff']; end=(datetime.fromisoformat(cutoff)+timedelta(hours=24)).isoformat(timespec='seconds'); tz=req['timezone']; api=os.environ['TD_API_KEY']
          for s in req['symbols'][:7]:
            q=urllib.parse.urlencode({'symbol':s['td'],'interval':'5min','order':'asc','outputsize':'1000','start_date':cutoff,'end_date':end,'timezone':tz,'apikey':api})
            subprocess.run(['curl','--silent','--show-error','--location','https://api.twelvedata.com/time_series?'+q,'-o',f"{s['name']}-future.json"],check=False)
          PY
      - name: Wait quota
        run: sleep 65
      - name: Fetch group 2 future M5
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,subprocess,urllib.parse
          from datetime import datetime,timedelta
          req=json.load(open('calibration-request.json'))
          cutoff=req['cutoff']; end=(datetime.fromisoformat(cutoff)+timedelta(hours=24)).isoformat(timespec='seconds'); tz=req['timezone']; api=os.environ['TD_API_KEY']
          for s in req['symbols'][7:]:
            q=urllib.parse.urlencode({'symbol':s['td'],'interval':'5min','order':'asc','outputsize':'1000','start_date':cutoff,'end_date':end,'timezone':tz,'apikey':api})
            subprocess.run(['curl','--silent','--show-error','--location','https://api.twelvedata.com/time_series?'+q,'-o',f"{s['name']}-future.json"],check=False)
          PY
      - name: Build compact reveal
        run: |
          python3 <<'PY'
          import json, os
          req=json.load(open('calibration-request.json'))
          dec=json.load(open('data/calibration-decisions.json'))['decisions']
          out={'cutoff':req['cutoff'],'timezone':req['timezone'],'lockedBeforeReveal':True,'symbols':{}}
          for s in req['symbols']:
            name=s['name']; p=f'{name}-future.json'; item={'class':s['class'],'decision':dec.get(name,{})}
            try: raw=json.load(open(p))
            except Exception as e:
              item.update({'status':'unavailable','error':str(e)}); out['symbols'][name]=item; continue
            if raw.get('status')=='error' or not raw.get('values'):
              item.update({'status':'unavailable','error':raw.get('message','no values')}); out['symbols'][name]=item; continue
            rows=[]
            for x in raw['values']:
              try: rows.append({'dt':x['datetime'],'o':float(x['open']),'h':float(x['high']),'l':float(x['low']),'c':float(x['close'])})
              except: pass
            if not rows:
              item.update({'status':'unavailable','error':'no valid rows'}); out['symbols'][name]=item; continue
            hi=max(rows,key=lambda x:x['h']); lo=min(rows,key=lambda x:x['l'])
            start=rows[0]['o']; end=rows[-1]['c']
            direction='UP' if end>start else 'DOWN' if end<start else 'FLAT'
            bias=dec.get(name,{}).get('directionalBias')
            if bias=='BUY': result='PASS' if end>start else 'FAIL'
            elif bias=='SELL': result='PASS' if end<start else 'FAIL'
            elif bias=='NEUTRAL': result='PASS' if abs(end-start) <= 0.35*(hi['h']-lo['l']) else 'MIXED'
            else: result='N/A'
            item.update({'status':'ok','start':start,'end':end,'high':hi['h'],'highTime':hi['dt'],'low':lo['l'],'lowTime':lo['dt'],'net':end-start,'direction24h':direction,'biasResult':result,'candleCount':len(rows)})
            out['symbols'][name]=item
          json.dump(out,open('data/calibration-reveal-now.json','w'),ensure_ascii=False,indent=2)
          PY
      - name: Commit output
        run: |
          git config user.name market-data-bot
          git config user.email market-data-bot@users.noreply.github.com
          git add data/calibration-reveal-now.json
          git diff --cached --quiet && exit 0
          git commit -m "Add immediate cross-market reveal results"
          git pull --rebase origin main
          git push origin HEAD:main
