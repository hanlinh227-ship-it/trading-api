name: Model Mesh Runtime Release Branch

on:
  push:
    branches: [feat/model-mesh-runtime-bindings]
    paths:
      - '.github/workflows/model-mesh-runtime-release-branch.yml'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/model-mesh-runtime-bindings
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Build 4.9.1 with canonical release tool
        run: python AI_SKILL_LIBRARY/v4/tools/release.py build --version 4.9.1 --source model_mesh_runtime_bindings --class C --validated --root .
      - name: Commit generated release metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add AI_SKILL_LIBRARY/v4/releases/4.9.1/manifest.yaml AI_SKILL_LIBRARY/v4/releases/current.json AI_SKILL_LIBRARY/v4/releases/history.yaml
          if git diff --cached --quiet; then
            echo RELEASE_METADATA_ALREADY_CURRENT
            exit 0
          fi
          git commit -m 'chore: build 4.9.1 model mesh runtime release'
          git push origin HEAD:feat/model-mesh-runtime-bindings
