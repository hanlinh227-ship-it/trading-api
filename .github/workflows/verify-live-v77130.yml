name: Verify Live V77.13 Calibration
on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/index.js'
      - '.github/workflows/verify-live-v77130.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait deploy
        run: sleep 45
      - name: Live verify
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77130_LIVE_CHECK.txt
          for spec in 'status:/status' 'orders1:/orders' 'crypto:/run-now?group=crypto' 'forex:/run-now?group=forex' 'metal:/run-now?group=metal' 'knowledge:/knowledge?symbol=KAITOUSDT' 'shadow:/shadow?symbol=KAITOUSDT' 'orders2:/orders' 'hub:/hub'; do name="${spec%%:*}"; path="${spec#*:}"; curl -fsS --max-time 120 "$BASE$path" -o "/tmp/$name.json"; echo "$name CURL=$?" >> V77130_LIVE_CHECK.txt; sleep 2; done
          node - <<'NODE' >> V77130_LIVE_CHECK.txt 2>&1
          const fs=require('fs');const r=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json'))}catch(e){return {e:e.message}}};
          const s=r('status'),o1=r('orders1'),c=r('crypto'),f=r('forex'),m=r('metal'),k=r('knowledge'),sh=r('shadow'),o2=r('orders2'),h=r('hub');
          const cnt=o=>['forex','crypto','metal'].map(g=>{const x=o[g]||{};return g+':'+(x.marketActive||[]).length+'/'+(x.limitActive||[]).length+'/'+(x.limitPending||[]).length+'/w'+(x.watch||[]).length}).join('|');
          console.log('VERSION='+(s.version||'-'));console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));
          console.log('CRYPTO='+(c.broadOk??'-')+'/'+(c.requested??'-')+' deep='+(c.deepOk??'-')+'/'+(c.deepRequested??'-')+' scan='+(c.scanId||'-'));
          console.log('CRYPTO_RESULTS='+(c.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.reason||'-')+':rr='+(a.planned?.targetRR??a.targetRR??'-')+':min='+(a.planned?.minQualityRR??'-')).join('|'));
          console.log('FOREX='+(f.broadOk??'-')+'/'+(f.requested??'-')+' deep='+(f.deepOk??'-')+'/'+(f.deepRequested??'-'));
          console.log('METAL='+(m.broadOk??'-')+'/'+(m.requested??'-')+' deep='+(m.deepOk??'-')+'/'+(m.deepRequested??'-'));
          console.log('KNOWLEDGE_OK='+(k.ok===true?'YES':'NO'));console.log('KNOWLEDGE_CAL='+(k.knowledge?.calibration?.status||'-'));console.log('KNOWLEDGE_MODES='+((k.knowledge?.allowedModes||[]).join('/')));
          console.log('SHADOW_OK='+(sh.ok===true?'YES':'NO'));console.log('SHADOW_COUNT='+((sh.rows||[]).length));
          console.log('ORDERS_BEFORE='+cnt(o1));console.log('ORDERS_AFTER='+cnt(o2));console.log('ORDER_STATE_PRESERVED='+(cnt(o1)===cnt(o2)?'YES':'NO'));console.log('WATCH_DURABLE_ZERO='+(['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0)?'YES':'NO'));
          console.log('HUB_OK='+(h.ok===true?'YES':'NO'));console.log('HUB_SCAN='+(h.hubScanId||'-'));console.log('HUB_TOP='+((h.top||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.reason||'-')).join('|')));
          const pass=s.version==='V77.13.0'&&s.ok===true&&c.deepOk===3&&f.broadOk===28&&f.deepOk===3&&m.broadOk===2&&m.deepOk===2&&k.ok===true&&k.knowledge?.calibration?.status&&cnt(o1)===cnt(o2)&&['forex','crypto','metal'].every(g=>(o2[g]?.watch||[]).length===0)&&h.ok===true;
          console.log('VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77130_LIVE_CHECK.txt
          git commit -m 'Report V77.13 live calibration verification' || exit 0
          git push origin main
