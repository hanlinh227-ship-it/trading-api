name: TEMP Brain 4.6 Release Generator

on:
  push:
    branches:
      - brain/4-6-open-source-fusion
    paths:
      - '.github/workflows/brain-4-6-release-generator.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brain/4-6-open-source-fusion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Generate immutable Brain 4.6 release with canonical tools
        run: |
          set -euo pipefail
          python AI_SKILL_LIBRARY/v4/tools/release.py build \
            --version 4.6.0 \
            --source brain_4_6_open_source_fusion \
            --validated \
            --known-good
          python AI_SKILL_LIBRARY/v4/tools/build_retrieval_index.py --write
          python AI_SKILL_LIBRARY/v4/tools/release.py verify
          python AI_SKILL_LIBRARY/validate_v4.py
          python AI_SKILL_LIBRARY/validate_skill_gateway.py
          python -m unittest AI_SKILL_LIBRARY.tests.test_brain_4_6_open_source_fusion AI_SKILL_LIBRARY.tests.test_v4_release
      - name: Persist generated release and retrieval metadata only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            AI_SKILL_LIBRARY/v4/releases/4.6.0/manifest.yaml \
            AI_SKILL_LIBRARY/v4/releases/current.json \
            AI_SKILL_LIBRARY/v4/releases/history.yaml \
            AI_SKILL_LIBRARY/v4/index/retrieval_index.yaml
          git diff --cached --quiet && { echo 'No generated metadata changed'; exit 1; }
          git commit -m "release(brain): generate 4.6.0 metadata"
          git push origin HEAD:brain/4-6-open-source-fusion
