name: Fetch EURUSD H1 Oct2024 Final
on:
  push:
    paths:
      - 'scripts/fetch_eurusd_h1_oct2024_final.py'
      - '.github/workflows/fetch-eurusd-h1-oct2024-final.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: twelvedata-api
  cancel-in-progress: false
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch untouched EURUSD final month
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python scripts/fetch_eurusd_h1_oct2024_final.py
      - name: Freeze final snapshot
        run: |
          git config user.name 'provider-snapshot-bot'
          git config user.email 'provider-snapshot-bot@users.noreply.github.com'
          git add data/provider_snapshots/eurusd_h1_oct2024_final.json
          git commit -m 'Freeze untouched EURUSD Oct 2024 final month' || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
