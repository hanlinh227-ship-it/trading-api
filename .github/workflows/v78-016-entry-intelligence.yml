name: V78-016 Entry Intelligence Shadow
on:
  push:
    paths:
      - '.github/workflows/v78-016-entry-intelligence.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard blobs and apply exact shadow patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object cloudflare-worker/engine-v77168.js)" = "8cf6f9cb2036149bd3fa16b417f601ce43a62769"
          test "$(git hash-object cloudflare-worker/hub-v77171.js)" = "97116e56c466505cd22b287ac193b16db55a675b"
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(path,oldText,newText){
            let s=fs.readFileSync(path,'utf8');
            const n=s.split(oldText).length-1;
            if(n!==1)throw new Error(`${path}: expected exactly 1 match, got ${n}`);
            s=s.replace(oldText,newText);fs.writeFileSync(path,s);
          }
          const engine='cloudflare-worker/engine-v77168.js';
          replaceOnce(engine,
            'import {buildSignalDecisionEvidence,recordSignalDecisionEvidence,getSignalDecisionEvidence} from "./providers/decision-evidence.js";\n',
            'import {buildSignalDecisionEvidence,recordSignalDecisionEvidence,getSignalDecisionEvidence} from "./providers/decision-evidence.js";\nimport {buildEntryIntelligenceShadow,recordEntryIntelligenceShadow,getEntryIntelligenceShadow} from "./providers/entry-intelligence.js";\n');
          replaceOnce(engine,
            'const books=existingBooks,newItems=fillBooks(group,books,analyses,trigger);await saveBooks(env,books);for(const a of analyses)await recordShadowSetup(group,a,scanId,env);for(const a of analyses){try{await recordSignalDecisionEvidence(env,buildSignalDecisionEvidence(a,{runtimeVersion:CONFIG.version,scanId}));}catch{}}',
            'const books=existingBooks,newItems=fillBooks(group,books,analyses,trigger);await saveBooks(env,books);for(const a of analyses)await recordShadowSetup(group,a,scanId,env);for(const a of analyses){try{await recordSignalDecisionEvidence(env,buildSignalDecisionEvidence(a,{runtimeVersion:CONFIG.version,scanId}));}catch{}}for(const a of analyses){try{await recordEntryIntelligenceShadow(env,buildEntryIntelligenceShadow(a,{runtimeVersion:CONFIG.version,scanId}));}catch{}}');
          replaceOnce(engine,
            'if(p==="/evidence/signal")return json({ok:true,schemaVersion:"V78-002",rows:await getSignalDecisionEvidence(env,Number(u.searchParams.get("limit")||20))});',
            'if(p==="/evidence/signal")return json({ok:true,schemaVersion:"V78-002",rows:await getSignalDecisionEvidence(env,Number(u.searchParams.get("limit")||20))});\n      if(p==="/evidence/entry-intelligence")return json({ok:true,revision:"V78-016",shadowOnly:true,rows:await getEntryIntelligenceShadow(env,Number(u.searchParams.get("limit")||20))});');

          const hub='cloudflare-worker/hub-v77171.js';
          replaceOnce(hub,
            'import {getSignalDecisionEvidence,getHyroDecisionEvidence} from "./providers/decision-evidence.js";\n',
            'import {getSignalDecisionEvidence,getHyroDecisionEvidence} from "./providers/decision-evidence.js";\nimport {getEntryIntelligenceShadow} from "./providers/entry-intelligence.js";\n');
          replaceOnce(hub,
            'const moreKeyboard=()=>({inline_keyboard:[[{text:"🩺 Hệ thống",callback_data:"status"},{text:"📋 Evidence V78",callback_data:"evidence"}],[{text:"🧠 AI Co-engineer",callback_data:"claude:status"}],[{text:"⬅️ Hub",callback_data:"menu"}]]});',
            'const moreKeyboard=()=>({inline_keyboard:[[{text:"🩺 Hệ thống",callback_data:"status"},{text:"📋 Evidence V78",callback_data:"evidence"}],[{text:"🧭 Entry Intel",callback_data:"intel"},{text:"🧠 AI Co-engineer",callback_data:"claude:status"}],[{text:"⬅️ Hub",callback_data:"menu"}]]});');
          replaceOnce(hub,
            'async function engineJson(path,req,env){',
            'async function entryIntelText(env){const rows=await getEntryIntelligenceShadow(env,12),x=rows[0]||null;if(!x)return "🧭 ENTRY INTELLIGENCE • V78-016\\n━━━━━━━━━━━━\\n⚪ Chưa có shadow reasoning. Quét một thị trường để tạo dữ liệu.";const c=x.integrity?.core||{},m=x.integrity?.marketSpecific||{},blocks=x.integrity?.hardBlocks||[],r=x.reasoning||{};return ["🧭 ENTRY INTELLIGENCE • SHADOW","━━━━━━━━━━━━",`${x.symbol||"—"} • ${String(x.market||"unknown").toUpperCase()} • ${x.existingDecision?.status||"UNKNOWN"}`,`📡 Freshness: ${x.quote?.freshness||"UNKNOWN"} • ${x.quote?.source||"—"}`,`🧩 Core evidence: ${c.known||0}/${c.total||0} • Market context: ${m.known||0}/${m.total||0}`,`⏱ WHY NOW: ${r.whyNow||"UNKNOWN"}`,`📍 WHY PRICE: ${r.whyPrice||"UNKNOWN"}`,`🛑 WHY SL: ${r.whySl||"UNKNOWN"}`,`🏁 WHY TP/RR: ${r.whyTp||"UNKNOWN"}`,`❌ Invalidates: ${r.invalidates||"UNKNOWN"}`,blocks.length?`🚧 Blocks: ${blocks.join(", ")}`:"✅ No shadow hard-block flag detected","","Shadow only • không thay ranking/lệnh • Claude API không được gọi."].join("\\n");}\nasync function engineJson(path,req,env){');
          replaceOnce(hub,
            '"menu","hub:more","signal","status","evidence"',
            '"menu","hub:more","signal","status","evidence","intel"');
          replaceOnce(hub,
            'if(cb==="evidence"){await sendText(env,await evidenceText(env),chatId,{inline_keyboard:[[{text:"🔄 Refresh Evidence",callback_data:"evidence"},{text:"🩺 Hệ thống",callback_data:"status"}],[{text:"🏠 Hub",callback_data:"menu"}]]});return json({ok:true,view:"evidence",schemaVersion:"V78-002"});}if(cb==="status")',
            'if(cb==="evidence"){await sendText(env,await evidenceText(env),chatId,{inline_keyboard:[[{text:"🔄 Refresh Evidence",callback_data:"evidence"},{text:"🧭 Entry Intel",callback_data:"intel"}],[{text:"🩺 Hệ thống",callback_data:"status"},{text:"🏠 Hub",callback_data:"menu"}]]});return json({ok:true,view:"evidence",schemaVersion:"V78-002"});}if(cb==="intel"){await sendText(env,await entryIntelText(env),chatId,{inline_keyboard:[[{text:"🔄 Refresh Intel",callback_data:"intel"},{text:"📋 Evidence",callback_data:"evidence"}],[{text:"🏠 Hub",callback_data:"menu"}]]});return json({ok:true,view:"entry-intelligence",revision:"V78-016",shadowOnly:true});}if(cb==="status")');
          NODE
      - name: Validate V78-016
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/providers/entry-intelligence.js
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hub-v77171.js
          test "$(grep -c 'buildEntryIntelligenceShadow\|recordEntryIntelligenceShadow\|getEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js)" -eq 3
          test "$(grep -c 'getEntryIntelligenceShadow' cloudflare-worker/hub-v77171.js)" -ge 2
          test "$(grep -R 'v78016:entry_intelligence:signal' cloudflare-worker --include='*.js' | grep -v 'providers/entry-intelligence.js' | wc -l)" -eq 0
          test "$(grep -c 'function verifyTelegram' cloudflare-worker/hub-v77171.js)" -eq 1
          git diff --check
          cat > docs/ai-coengineer/V78-016_VALIDATION.txt <<'EOF'
          node --check providers/entry-intelligence.js = PASS
          node --check engine-v77168.js = PASS
          node --check hub-v77171.js = PASS
          engine entry-intelligence symbols = 3
          hub getter/callback integration = PASS
          v78016 key outside provider = ZERO_MATCHES
          verifyTelegram preserved = 1
          git diff --check = PASS
          V78-016_ENTRY_INTELLIGENCE_SHADOW_PASS
          EOF
      - name: Update state and release lock
        shell: bash
        run: |
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-19
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-016 Entry Intelligence Foundation shadow
          RESULT: IMPLEMENTED. Market-specific entry reasoning shadow is recorded from finalized Signal decisions and exposed read-only in Telegram Hub. No ranking, threshold, gate, execution authority, risk, freshness, SL/news or state-continuity behavior intentionally changed.

          Protocol:
          - Acquire a new lock before the next source write.
          - Do not reset TRADING_STATE/v775:books.
          - Do not weaken risk/freshness/structural-SL/news safeguards.
          - Do not restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          - Claude production API remains paused unless CLAUDE_API_ENABLED=true; Claude.ai Web remains a full co-engineer.
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<'EOF'

          V78-016 — IMPLEMENTED / VALIDATED
          - New `providers/entry-intelligence.js` shadow-only evaluator.
          - Signal finalized decisions now append market-specific reasoning to isolated `v78016:entry_intelligence:signal` after existing authoritative persistence.
          - Read-only `/evidence/entry-intelligence` endpoint.
          - Telegram Hub adds `🧭 Entry Intel` showing WHY NOW / PRICE / SL / TP-RR / INVALIDATION / freshness / completeness / existing block reason.
          - No authority change: current status/ranking/gates/orders remain authoritative; V78-016 is comparison/observability only.
          - Claude production API remains paused; Claude.ai Web retains full co-engineer authority when available.
          EOF
      - name: Commit source, validation, and state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "V78 Co-Engineer"
          git config user.email "actions@users.noreply.github.com"
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js docs/ai-coengineer/V78-016_VALIDATION.txt docs/ai-coengineer/WRITE_LOCK.md docs/ai-coengineer/SHARED_STATE.md
          git commit -m "V78-016 add entry intelligence shadow and Hub reasoning view"
          git push
