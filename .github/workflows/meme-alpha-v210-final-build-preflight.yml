name: Meme Alpha v2.1 Final Build Preflight
on:
  push:
    paths:
      - 'ops/meme-alpha/v210-final-build-preflight.sh'
      - '.github/workflows/meme-alpha-v210-final-build-preflight.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify completed build and fail-closed state
        run: bash ops/meme-alpha/v210-final-build-preflight.sh
