name: Check V77.15.1 Core Live

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-v77151-core-live.yml'

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait for Cloudflare deploy
        run: sleep 25
      - name: Live checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS "$BASE/status" -o /tmp/status.json; echo "STATUS_CURL=$?" > V77151_CORE_LIVE.txt
          curl -fsS "$BASE/orders" -o /tmp/orders1.json; echo "ORDERS1_CURL=$?" >> V77151_CORE_LIVE.txt
          curl -fsS --max-time 50 "$BASE/run-now?group=crypto" -o /tmp/crypto.json; echo "CRYPTO_CURL=$?" >> V77151_CORE_LIVE.txt
          sleep 3
          curl -fsS --max-time 50 "$BASE/run-now?group=future" -o /tmp/future.json; echo "FUTURE_CURL=$?" >> V77151_CORE_LIVE.txt
          curl -fsS "$BASE/orders" -o /tmp/orders2.json; echo "ORDERS2_CURL=$?" >> V77151_CORE_LIVE.txt
          curl -fsS "$BASE/telegram/menu" -o /tmp/tg.json; echo "TG_MENU_CURL=$?" >> V77151_CORE_LIVE.txt
          node <<'NODE' >> V77151_CORE_LIVE.txt
          const fs=require('fs');const j=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const s=j('/tmp/status.json'),c=j('/tmp/crypto.json'),f=j('/tmp/future.json'),o1=j('/tmp/orders1.json'),o2=j('/tmp/orders2.json'),tg=j('/tmp/tg.json');
          const count=(r,st)=>(r.analyses||[]).filter(x=>x.status===st).length;
          const orderSig=o=>['forex','crypto','metal','future'].map(g=>{const b=o[g]||{};return g+':'+(b.marketActive||[]).length+'/'+(b.limitActive||[]).length+'/'+(b.limitPending||[]).length+'/w'+(b.watch||[]).length}).join('|');
          console.log('VERSION='+(s.version||'-'));
          console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));
          console.log('MASSIVE='+(s.massive===true?'YES':'NO'));
          console.log('CRYPTO='+(c.broadOk??'-')+'/'+(c.requested??'-')+' deep='+(c.deepOk??'-')+'/'+(c.deepRequested??'-'));
          console.log('CRYPTO_ACTIONS=execM'+count(c,'MARKET')+',execL'+count(c,'LIMIT')+',planM'+count(c,'MARKET_PLAN')+',planL'+count(c,'LIMIT_PLAN')+',watch'+count(c,'WATCH'));
          console.log('CRYPTO_RESULTS='+(c.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':rr='+(a.planned?.targetRR??a.targetRR??'-')).join('|'));
          console.log('FUTURE='+(f.broadOk??'-')+'/'+(f.requested??'-')+' deep='+(f.deepOk??'-')+'/'+(f.deepRequested??'-'));
          console.log('FUTURE_ACTIONS=execM'+count(f,'MARKET')+',execL'+count(f,'LIMIT')+',planM'+count(f,'MARKET_PLAN')+',planL'+count(f,'LIMIT_PLAN')+',watch'+count(f,'WATCH'));
          console.log('FUTURE_RESULTS='+(f.analyses||[]).map(a=>a.symbol+':'+a.status+':'+(a.reason||'-')+':rr='+(a.planned?.targetRR??a.targetRR??'-')).join('|'));
          console.log('FUTURE_CONTRACTS='+JSON.stringify(f.diagnostics?.frontContracts||{}));
          console.log('FUTURE_ERRORS='+JSON.stringify(f.diagnostics?.errors||[]));
          console.log('ORDERS1='+orderSig(o1));console.log('ORDERS2='+orderSig(o2));console.log('ORDERS_PRESERVED='+(orderSig(o1)===orderSig(o2)?'YES':'NO'));
          console.log('DURABLE_WATCH_ZERO='+(['forex','crypto','metal','future'].every(g=>(o2[g]?.watch||[]).length===0)?'YES':'NO'));
          console.log('TG_MENU_OK='+(tg.ok===true?'YES':'NO'));
          const pass=s.version==='V77.15.1'&&s.ok===true&&s.massive===true&&(c.broadOk||0)>=55&&(c.deepOk||0)>=3&&f.ok===true&&orderSig(o1)===orderSig(o2)&&tg.ok===true;
          console.log('VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77151_CORE_LIVE.txt
          git commit -m 'Report V77.15.1 core live verification' || exit 0
          git push origin main
