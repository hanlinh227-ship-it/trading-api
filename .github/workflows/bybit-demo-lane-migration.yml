name: Bybit Demo Lane Migration
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-demo-lane-migration.yml'
permissions:
  contents: write
jobs:
  migrate:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 2}
      - name: Patch isolated Hyro demo execution lane
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('cloudflare-worker/bybit-auto-config.js')
          s=p.read_text()
          old='export function bybitCredentials(env={}){return {apiKey:env.BYBIT_AUTO_API_KEY||env.HYRO_BYBIT_LIVE_API_KEY||"",apiSecret:env.BYBIT_AUTO_API_SECRET||env.HYRO_BYBIT_LIVE_API_SECRET||"",source:env.BYBIT_AUTO_API_KEY&&env.BYBIT_AUTO_API_SECRET?"BYBIT_AUTO":"HYRO_BYBIT_LIVE_FALLBACK"};}'
          new='export function bybitCredentials(env={}){const demo=String(env.BYBIT_AUTO_DEMO||"").toLowerCase()==="true";if(demo)return {apiKey:env.HYRO_BYBIT_API_KEY||"",apiSecret:env.HYRO_BYBIT_API_SECRET||"",source:"HYRO_BYBIT_DEMO"};return {apiKey:env.BYBIT_AUTO_API_KEY||env.HYRO_BYBIT_LIVE_API_KEY||"",apiSecret:env.BYBIT_AUTO_API_SECRET||env.HYRO_BYBIT_LIVE_API_SECRET||"",source:env.BYBIT_AUTO_API_KEY&&env.BYBIT_AUTO_API_SECRET?"BYBIT_AUTO":"HYRO_BYBIT_LIVE_FALLBACK"};}'
          assert old in s, 'bybitCredentials anchor missing'
          p.write_text(s.replace(old,new))

          p=Path('cloudflare-worker/bybit-v5-client.js')
          s=p.read_text()
          old='function bases(env={}){\n  const preferred=String(env.BYBIT_API_BASE_URL||"").trim().replace(/\\/$/,"");\n  return [...new Set([preferred,...DEFAULT_BASES].filter(Boolean))];\n}'
          new='function bases(env={}){\n  const demo=String(env.BYBIT_AUTO_DEMO||"").toLowerCase()==="true";\n  if(demo)return ["https://api-demo.bybit.com"];\n  const preferred=String(env.BYBIT_API_BASE_URL||"").trim().replace(/\\/$/,"");\n  return [...new Set([preferred,...DEFAULT_BASES].filter(Boolean))];\n}'
          assert old in s, 'bases anchor missing'
          s=s.replace(old,new)
          old='export function bybitV5(env={}){\n  const c=bybitCredentials(env),cfg=bybitAutoConfig(env),baseList=bases(env),recvWindow=String(Math.max(5000,Math.min(20000,Number(cfg.execution?.recvWindow||10000))));'
          new='export function bybitV5(env={}){\n  const demo=String(env.BYBIT_AUTO_DEMO||"").toLowerCase()==="true";\n  const c=bybitCredentials(env),cfg=bybitAutoConfig(env),baseList=bases(env),recvWindow=String(Math.max(5000,Math.min(20000,Number(cfg.execution?.recvWindow||10000))));'
          assert old in s, 'bybitV5 anchor missing'
          s=s.replace(old,new)
          old='  async function market(path,params={}){\n    try{return await signedViaVps("GET",path,params);}'
          new='  async function market(path,params={}){\n    if(demo)return pub(path,params);\n    try{return await signedViaVps("GET",path,params);}'
          assert old in s, 'market anchor missing'
          s=s.replace(old,new)
          old='  async function signed(method,path,paramsOrBody={}){\n    try{return await signedViaVps(method,path,paramsOrBody);}'
          new='  async function signed(method,path,paramsOrBody={}){\n    if(demo)return signedDirect(method,path,paramsOrBody);\n    try{return await signedViaVps(method,path,paramsOrBody);}'
          assert old in s, 'signed anchor missing'
          s=s.replace(old,new)
          old='    credentialSource:c.source,credentialsPresent:!!(c.apiKey&&c.apiSecret),bases:baseList,privateTransport:BYBIT_PRIVATE_TRANSPORT,marketTransport:BYBIT_MARKET_TRANSPORT,runtimeContract:BYBIT_RUNTIME_CONTRACT_VERSION,recvWindowMs:Number(recvWindow),'
          new='    credentialSource:c.source,credentialsPresent:!!(c.apiKey&&c.apiSecret),bases:baseList,privateTransport:demo?"CLOUDFLARE_BYBIT_DEMO_DIRECT":BYBIT_PRIVATE_TRANSPORT,marketTransport:demo?"CLOUDFLARE_BYBIT_DEMO_PUBLIC":BYBIT_MARKET_TRANSPORT,runtimeContract:BYBIT_RUNTIME_CONTRACT_VERSION,recvWindowMs:Number(recvWindow),'
          assert old in s, 'transport anchor missing'
          p.write_text(s.replace(old,new))

          p=Path('cloudflare-worker/prepare-wrangler.mjs')
          s=p.read_text()
          old="const bybitLiveAck=/^(true|1|yes)$/i.test(String(process.env.BYBIT_AUTO_LIVE_ACK||'false'))?'true':'false';"
          new=old+"\nconst bybitDemo=/^(true|1|yes)$/i.test(String(process.env.BYBIT_AUTO_DEMO||'false'))?'true':'false';"
          assert old in s, 'prepare demo anchor missing'
          s=s.replace(old,new)
          old="BYBIT_AUTO_LIVE_ACK:bybitLiveAck,BYBIT_MIN_UNIVERSE_COUNT"
          new="BYBIT_AUTO_LIVE_ACK:bybitLiveAck,BYBIT_AUTO_DEMO:bybitDemo,BYBIT_MIN_UNIVERSE_COUNT"
          assert old in s, 'prepare vars anchor missing'
          s=s.replace(old,new)
          old='BYBIT_AUTO_LIVE_ACK=${bybitLiveAck}, BYBIT_MIN_UNIVERSE_COUNT='
          new='BYBIT_AUTO_LIVE_ACK=${bybitLiveAck}, BYBIT_AUTO_DEMO=${bybitDemo}, BYBIT_MIN_UNIVERSE_COUNT='
          assert old in s, 'prepare log anchor missing'
          p.write_text(s.replace(old,new))
          PY
          node --check cloudflare-worker/bybit-auto-config.js
          node --check cloudflare-worker/bybit-v5-client.js
          node --check cloudflare-worker/prepare-wrangler.mjs
          cd cloudflare-worker
          npm install --no-audit --no-fund
          npm run check
      - name: Commit validated demo lane
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hanlinh227-ship-it'
          git config user.email 'hanlinh227@gmail.com'
          git add cloudflare-worker/bybit-auto-config.js cloudflare-worker/bybit-v5-client.js cloudflare-worker/prepare-wrangler.mjs
          if git diff --cached --quiet; then echo 'NO_CHANGES'; exit 0; fi
          git commit -m 'feat(bybit): restore isolated Hyro demo execution lane'
          git push origin HEAD:main
