name: VPS Adaptive Entry Review

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-adaptive-entry-review.yml'
      - 'cloudflare-worker/bybit-ai-scalp-gate.js'
      - 'cloudflare-worker/bybit-auto-v1.js'
      - 'cloudflare-worker/bybit-scalp-engine.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  review:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Run actual adaptive pipeline modules without execution
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /etc/trading-v11-ai.env
          set +a
          export REPORT=/tmp/adaptive-entry-review.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {scanBybitAuto,sizeBybitAuto} from './cloudflare-worker/bybit-scalp-engine.js';
          import {prepareBybitScalpForReview,reviewBybitScalp,revalidateBybitScalpAfterAi} from './cloudflare-worker/bybit-ai-scalp-gate.js';
          import {bybitAutoConfig} from './cloudflare-worker/bybit-auto-config.js';
          import {bybitV5} from './cloudflare-worker/bybit-v5-client.js';

          const env={
            V11_AI_BRIDGE_SECRET:process.env.V11_AI_BRIDGE_SECRET,
            AI_BRIDGE:{fetch:(req)=>fetch(req)},
            BYBIT_AI_ENABLED:'true',
            BYBIT_AI_TIMEOUT_MS:'16000',
            BYBIT_AI_NORMAL_PRE_DRIFT_BPS:'12',
            BYBIT_AI_REANCHOR_SOFT_BPS:'20',
            BYBIT_AI_REANCHOR_HARD_BPS:'30',
            BYBIT_AI_FAVORABLE_DRIFT_BPS:'35',
            BYBIT_AI_MAX_POST_REVIEW_DRIFT_BPS:'12',
            BYBIT_MAX_UNIVERSE_SPREAD_BPS:'12'
          };
          const cfg=bybitAutoConfig(env),scan=await scanBybitAuto(env),original=scan.best;
          const out={ok:true,reviewOnly:true,orderCalled:false,scannedAt:scan.scannedAt,analyzed:scan.analyzed,qualified:scan.qualified,original:original?{symbol:original.symbol,side:original.side,score:original.score,entry:original.entry,sl:original.sl,tp:original.tp,rr:original.rr,atr1:original.atr1,spreadBps:original.spreadBps,volumeRatio:original.context?.volumeRatio,vwapAligned:original.context?.vwapAligned,confluence:original.context?.confluence}:null};
          if(!original){out.result='NO_SETUP';fs.writeFileSync(process.env.REPORT,JSON.stringify(out,null,2));process.exit(0);}
          const api=bybitV5(env),prep=await prepareBybitScalpForReview(env,original,api);out.preparation=prep;
          if(!prep.ok){out.result='NO_MARKET_ENTRY';out.reason=prep.reason;fs.writeFileSync(process.env.REPORT,JSON.stringify(out,null,2));process.exit(0);}
          const setup=prep.setup,sizing=sizeBybitAuto(setup,cfg,50.64917926);out.sizing=sizing;
          if(!sizing.ok){out.result='NO_MARKET_ENTRY';out.reason=sizing.reason;fs.writeFileSync(process.env.REPORT,JSON.stringify(out,null,2));process.exit(0);}
          const ai=await reviewBybitScalp(env,setup,prep.quote);out.ai=ai;
          if(!ai.allow){out.result='NO_MARKET_ENTRY';out.reason=ai.reason;fs.writeFileSync(process.env.REPORT,JSON.stringify(out,null,2));process.exit(0);}
          const postAi=await revalidateBybitScalpAfterAi(env,api,setup);out.postAi=postAi;
          out.result=postAi.ok?'MARKET_READY_REVIEW_ONLY':'NO_MARKET_ENTRY';out.reason=postAi.ok?'ALL_REVIEW_GATES_PASS':postAi.reason;
          out.finalSetup={symbol:setup.symbol,side:setup.side,entry:setup.entry,originalEntry:setup.originalEntry,entryState:setup.entryState,reanchorCount:setup.reanchorCount,sl:setup.sl,tp:setup.tp,rr:setup.rr,score:setup.score};
          fs.writeFileSync(process.env.REPORT,JSON.stringify(out,null,2));
          NODE
      - name: Persist review result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          mkdir -p docs/diagnostics
          cp /tmp/adaptive-entry-review.json docs/diagnostics/LATEST_ADAPTIVE_ENTRY_REVIEW.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/diagnostics/LATEST_ADAPTIVE_ENTRY_REVIEW.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record latest adaptive entry review'
          git push origin HEAD:main
