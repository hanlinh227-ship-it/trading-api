name: STACKHUB V2 MoltJobs Diagnostic

on:
  push:
    branches: ['stackhub-v2-autonomous-bounty']
    paths:
      - '.github/workflows/stackhub-v2-moltjobs-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_ENABLED: ${{ secrets.STACKHUB_DEPLOY_ENABLED }}
      VPS_HOST: ${{ secrets.STACKHUB_VPS_HOST }}
      VPS_USER: ${{ secrets.STACKHUB_VPS_USER }}
      VPS_PORT: ${{ secrets.STACKHUB_VPS_PORT }}
      VPS_SSH_KEY: ${{ secrets.STACKHUB_VPS_SSH_KEY }}
      VPS_SSH_KEY_B64: ${{ secrets.STACKHUB_VPS_SSH_KEY_B64 }}
    steps:
      - name: Prepare SSH
        if: env.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh; chmod 700 ~/.ssh
          if [ -n "${VPS_SSH_KEY_B64:-}" ]; then
            printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > ~/.ssh/id_stackhub
          else
            python - <<'PY'
          import os
          from pathlib import Path
          key=os.environ['VPS_SSH_KEY'].replace('\r','').strip()
          if '\\n' in key and '\n' not in key: key=key.replace('\\n','\n')
          Path.home().joinpath('.ssh/id_stackhub').write_text(key+'\n',encoding='utf-8')
          PY
          fi
          chmod 600 ~/.ssh/id_stackhub
          ssh-keygen -y -f ~/.ssh/id_stackhub >/dev/null
          PORT="${VPS_PORT:-22}"
          ssh-keyscan -p "$PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Read MoltJobs account and inventory
        if: env.DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" -i ~/.ssh/id_stackhub "$VPS_USER@$VPS_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          set -a; . /etc/stackhub/stackhub.env; set +a
          /opt/stackhub/.venv/bin/python - <<'PY'
          import json, os, httpx
          key=os.environ.get('MOLTJOBS_API_KEY','').strip()
          if not key:
              print('moltjobs_key_missing')
              raise SystemExit(0)
          base='https://api.moltjobs.io/v1'
          headers={'Accept':'application/json','Authorization':f'Bearer {key}','X-Api-Key':key}
          secret_keys={'apikey','api_key','token','secret','privatekey','private_key','accessToken','access_token'}
          def safe(value):
              if isinstance(value,dict):
                  return {k:safe(v) for k,v in value.items() if k not in secret_keys and k.lower() not in {x.lower() for x in secret_keys}}
              if isinstance(value,list):
                  return [safe(v) for v in value]
              return value
          with httpx.Client(timeout=20,follow_redirects=True) as c:
              me=c.get(base+'/agents/me',headers=headers)
              print('agents_me_status='+str(me.status_code))
              try: me_data=me.json()
              except Exception: me_data={}
              print('agents_me='+json.dumps(safe(me_data),sort_keys=True,default=str))
              agent_id=''
              if isinstance(me_data,dict):
                  candidate=me_data.get('data',me_data)
                  if isinstance(candidate,dict): agent_id=str(candidate.get('id') or candidate.get('agentId') or '')
              if agent_id:
                  allowance=c.get(base+f'/bids/allowance/{agent_id}',headers=headers)
                  print('allowance_status='+str(allowance.status_code))
                  try: allowance_data=allowance.json()
                  except Exception: allowance_data={}
                  print('allowance='+json.dumps(safe(allowance_data),sort_keys=True,default=str))
                  mine=c.get(base+f'/agents/{agent_id}/jobs',headers=headers)
                  print('mine_status='+str(mine.status_code))
                  try: mine_data=mine.json()
                  except Exception: mine_data={}
                  print('mine='+json.dumps(safe(mine_data),sort_keys=True,default=str))
              cursor=None; total=0; page=0
              while page < 10:
                  page += 1
                  params={'status':'OPEN','limit':100}
                  if cursor: params['cursor']=cursor
                  r=c.get(base+'/jobs',headers=headers,params=params)
                  print(f'jobs_page_{page}_status='+str(r.status_code))
                  try: data=r.json()
                  except Exception: data={}
                  rows=[]
                  meta={}
                  if isinstance(data,list): rows=data
                  elif isinstance(data,dict):
                      raw=data.get('data',data.get('jobs',[]))
                      if isinstance(raw,list): rows=raw
                      elif isinstance(raw,dict): rows=raw.get('jobs',raw.get('items',raw.get('results',[]))) if isinstance(raw,dict) else []
                      meta=data.get('meta',{}) if isinstance(data.get('meta',{}),dict) else {}
                  total += len(rows) if isinstance(rows,list) else 0
                  for job in rows if isinstance(rows,list) else []:
                      if not isinstance(job,dict): continue
                      keep={k:job.get(k) for k in ['id','title','vertical','category','budgetUsdc','budget','reward','status','deadline','deadlineAt','requirements','description','certificationRequired','templateId'] if k in job}
                      print('open_job='+json.dumps(safe(keep),sort_keys=True,default=str))
                  cursor=meta.get('nextCursor')
                  if not cursor: break
              print('open_jobs_total_seen='+str(total))
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/id_stackhub
