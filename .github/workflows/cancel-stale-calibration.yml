name: Cancel Stale Calibration Runs
on:
  push:
    paths: ["cancel-calibration.json"]
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stale runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for RUN in 31934126960 31934133031; do
            echo "Cancelling $RUN"
            curl --silent --show-error -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN}/cancel" || true
          done
