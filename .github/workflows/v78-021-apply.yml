name: V78-021 Apply Hub R12 Quality Visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-021-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v78-021-apply
  cancel-in-progress: false

jobs:
  apply-validate-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      WORKER_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Guard WRITE_LOCK and exact engine blob
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^LOCKED: true$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^OWNER: CHATGPT$' docs/ai-coengineer/WRITE_LOCK.md
          grep -q '^SCOPE: V78-021 Hub R12 quality visibility$' docs/ai-coengineer/WRITE_LOCK.md
          actual="$(git hash-object cloudflare-worker/engine-v77168.js)"
          expected='d612d081bb6550839f946e7ceef307badb92cda8'
          echo "engine_blob=$actual"
          test "$actual" = "$expected"
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"

      - name: Capture exact pre-patch persisted scan snapshots
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          groups=['forex','crypto','metal','index']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'V78-021-prepatch/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())
          out={g:get('/latest-scan?group='+g) for g in groups}
          pathlib.Path('/tmp/v78021-pre.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps({g:{'status':(out[g] or {}).get('status'),'scanId':((out[g] or {}).get('snapshot') or {}).get('scanId'),'scannedAt':((out[g] or {}).get('snapshot') or {}).get('scannedAt'),'analysesCount':len((((out[g] or {}).get('snapshot') or {}).get('analyses') or []))} for g in groups},indent=2))
          PY

      - name: Apply Claude V78-021 exact watchLine patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-worker/engine-v77168.js')
          s=p.read_text()
          old='''function watchLine(w){let x=`${w.symbol} ${sideText(w.side)} • ${reasonText(w.reason)}`;if(Number.isFinite(w.score))x+=` • ${w.score}/100`;if(w.planned){const tag=w.planned.indicative?"Tham khảo":"Kế hoạch";x+=`\n   ↳ ${tag}: E~${fmtPx(w.planned.entry)} • SL~${fmtPx(w.planned.sl)} • TP~${fmtPx(w.planned.tp2||w.planned.tp1)} • RR~${Number(w.planned.targetRR||0).toFixed(2)}`;if(w.planned.entryStyle)x+=`\n   ↳ Entry style: ${w.planned.entryStyle}`;const mt=planMetricText(w.symbol,w.planned);if(mt)x+=`\n   ↳ Geometry: ${mt}`}if(w.method?.profile)x+=`\n   ↳ Method: ${w.method.profile}`;return x;}'''
          new='''function watchLine(w){let x=`${w.symbol} ${sideText(w.side)} • ${reasonText(w.reason)}`;if(Number.isFinite(w.score))x+=` • ${w.score}/100`;if(w.planned){const tag=w.planned.indicative?"Tham khảo":"Kế hoạch";x+=`\n   ↳ ${tag}: E~${fmtPx(w.planned.entry)} • SL~${fmtPx(w.planned.sl)} • TP~${fmtPx(w.planned.tp2||w.planned.tp1)} • RR~${Number(w.planned.targetRR||0).toFixed(2)}`;if(w.planned.entryStyle)x+=`\n   ↳ Entry style: ${w.planned.entryStyle}`;const mt=planMetricText(w.symbol,w.planned);if(mt)x+=`\n   ↳ Geometry: ${mt}`}if(w.method?.profile)x+=`\n   ↳ Method: ${w.method.profile}`;const ei=buildEntryIntelligenceShadow(w);if(ei)x+=`\n   ↳ Quality: ${ei.quality.grade} (${ei.quality.score}/100)${ei.promotion.allowed===false?" • ⚠️ "+ei.promotion.reasons.join(","):""} • Fresh: ${ei.quote.freshness}`;return x;}'''
          count=s.count(old)
          print('old_block_count=',count)
          if count != 1:
              raise SystemExit('STALE_WRITE_GUARD: exact watchLine OLD block count != 1')
          p.write_text(s.replace(old,new,1))
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check cloudflare-worker/engine-v77168.js
          echo "watchLine_definitions=$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)"
          test "$(grep -c 'function watchLine' cloudflare-worker/engine-v77168.js)" -eq 1
          echo 'buildEntryIntelligenceShadow occurrences:'
          grep -n 'buildEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js
          echo 'call-site check:'
          grep -n 'const ei=buildEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js
          test "$(grep -c 'const ei=buildEntryIntelligenceShadow' cloudflare-worker/engine-v77168.js)" -eq 2
          echo "protected_function_count=$(grep -Ec 'function summary\(|function hubSummary\(|function freshWatchFromRun\(|function freshPlanFromRun\(' cloudflare-worker/engine-v77168.js)"
          test "$(grep -Ec 'function summary\(|function hubSummary\(|function freshWatchFromRun\(|function freshPlanFromRun\(' cloudflare-worker/engine-v77168.js)" -eq 4
          grep -q '↳ Quality: ${ei.quality.grade} (${ei.quality.score}/100)' cloudflare-worker/engine-v77168.js
          git diff --check
          echo '--- engine diff ---'
          git diff -- cloudflare-worker/engine-v77168.js

      - name: Commit V78-021 source patch locally
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V78-021 Implementer'
          git config user.email 'actions@users.noreply.github.com'
          git add cloudflare-worker/engine-v77168.js
          git commit -m 'V78-021 surface Entry Intelligence quality in group scan views'
          echo "source_commit=$(git rev-parse HEAD)" | tee /tmp/v78021-source-commit.txt

      - name: Deploy patched source to Cloudflare production
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/v78021-deploy.log
          grep -F "$WORKER_URL" /tmp/v78021-deploy.log

      - name: Verify persisted analyses byte-equivalent across deployment before new scans
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          groups=['forex','crypto','metal','index']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'V78-021-postdeploy-prescan/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())
          pre=json.loads(pathlib.Path('/tmp/v78021-pre.json').read_text())
          post={g:get('/latest-scan?group='+g) for g in groups}
          report={}
          ok=True
          for g in groups:
              a=(((pre.get(g) or {}).get('snapshot') or {}).get('analyses') or [])
              b=(((post.get(g) or {}).get('snapshot') or {}).get('analyses') or [])
              same=(a==b)
              report[g]={'sameAnalysesFieldForField':same,'preCount':len(a),'postCount':len(b),'scanIdBefore':((pre.get(g) or {}).get('snapshot') or {}).get('scanId'),'scanIdAfterDeployBeforeRun':((post.get(g) or {}).get('snapshot') or {}).get('scanId')}
              ok=ok and same
          pathlib.Path('/tmp/v78021-persisted-diff.json').write_text(json.dumps(report,indent=2,ensure_ascii=False))
          print(json.dumps(report,indent=2,ensure_ascii=False))
          if not ok: raise SystemExit('Persisted analyses changed across rendering-only deploy before new scans')
          PY

      - name: Run exactly one live scan per market after deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, pathlib, datetime
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          groups=['forex','crypto','metal','index']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'V78-021-live-smoke/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())
          out={}
          for g in groups:
              try:
                  j=get('/run-now?group='+g)
                  analyses=j.get('analyses') or []
                  def has_quality(v):
                      if isinstance(v,str): return '↳ Quality:' in v
                      if isinstance(v,dict): return any(has_quality(x) for x in v.values())
                      if isinstance(v,list): return any(has_quality(x) for x in v)
                      return False
                  out[g]={'status':j.get('status'),'scanId':j.get('scanId'),'scannedAt':j.get('scannedAt'),'analyses':[{'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason'),'score':a.get('score')} for a in analyses],'qualityMarkerPresentInPayload':has_quality(j)}
              except Exception as e:
                  out[g]={'httpError':repr(e)}
          result={'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'workerUrl':base,'groups':out}
          pathlib.Path('/tmp/v78021-live.json').write_text(json.dumps(result,indent=2,ensure_ascii=False))
          print(json.dumps(result,indent=2,ensure_ascii=False))
          PY

      - name: Persist V78-021 validation, state, and release lock
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(cut -d= -f2 /tmp/v78021-source-commit.txt)"
          deploy_version="$(grep 'Current Version ID:' /tmp/v78021-deploy.log | tail -1 | sed 's/.*Current Version ID: //')"
          cat > docs/ai-coengineer/V78-021_VALIDATION.txt <<EOF
          V78-021 HUB R12 QUALITY VISIBILITY
          sourceCommit: ${source_commit}
          cloudflareVersionId: ${deploy_version}
          engine pre-patch blob guard: d612d081bb6550839f946e7ceef307badb92cda8 PASS
          node --check cloudflare-worker/engine-v77168.js: PASS
          watchLine definitions: 1 PASS
          buildEntryIntelligenceShadow call sites: exactly 2 (singleAnalysisText + watchLine) PASS
          protected summary/hubSummary/freshWatchFromRun/freshPlanFromRun definitions: 4 PASS
          source scope: additive watchLine rendering only; no decision/ranking/admission/KV/endpoint change
          REQUIRED/QUALITY/OPTIONAL taxonomy: unchanged

          === PERSISTED ANALYSES FIELD-FOR-FIELD ACROSS DEPLOY BEFORE NEW SCANS ===
          EOF
          cat /tmp/v78021-persisted-diff.json >> docs/ai-coengineer/V78-021_VALIDATION.txt
          cat >> docs/ai-coengineer/V78-021_VALIDATION.txt <<'EOF'

          === ONE LIVE /run-now PER MARKET AFTER DEPLOY (NO RETRIES) ===
          EOF
          cat /tmp/v78021-live.json >> docs/ai-coengineer/V78-021_VALIDATION.txt
          cat >> docs/ai-coengineer/V78-021_VALIDATION.txt <<'EOF'

          Interpretation:
          - Existing persisted analyses arrays were field-for-field identical immediately before vs immediately after deployment, before any new scan mutated KV.
          - The four post-deploy /run-now calls are live smoke evidence and may legitimately rotate candidates or return RATE_BUDGET_WAIT/BUSY due market/provider state; those outcomes are recorded exactly and are not retry-hidden.
          - This patch changes rendered group-scan text only. It does not alter analysis objects, ranking, admission, Hyro authority, hard risk, freshness, structural SL, news safeguards, TRADING_STATE, or v775:books.
          EOF
          cat >> docs/ai-coengineer/SHARED_STATE.md <<EOF

          V78-021 — RESOLVED / DEPLOYED
          - Source commit: ${source_commit}.
          - Hub/group-scan candidate rendering now adds Entry Intelligence quality grade/score, promotion warning reasons when blocked, and quote freshness via the already-audited buildEntryIntelligenceShadow().
          - REQUIRED/QUALITY/OPTIONAL evidence classification is unchanged; this is visibility only.
          - Exact persisted-snapshot and one-pass live smoke evidence: docs/ai-coengineer/V78-021_VALIDATION.txt.
          - hubSummary() separate inline top-7 builder remains explicitly deferred as a separate follow-up.
          EOF
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK

          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-20
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-021 Hub R12 quality visibility
          RESULT: RESOLVED / DEPLOYED. Validation in docs/ai-coengineer/V78-021_VALIDATION.txt.

          Protocol:
          - Acquire a new lock before the next source write.
          - Never reset TRADING_STATE or delete/reset v775:books.
          - Never weaken hard risk/freshness/structural-SL/news safeguards.
          - Never restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          - Production Claude API remains paused; Claude.ai Web remains full co-engineer.
          EOF
          git add docs/ai-coengineer/V78-021_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-021 validate production visibility and release lock'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "final_head=$(git rev-parse HEAD)"
