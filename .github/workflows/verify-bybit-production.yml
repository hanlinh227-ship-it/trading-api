name: Verify Bybit Top100 Production
on:
  push:
    branches: [main]
    paths:
      - '.github/bybit-production-verify-trigger'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-bybit-top100-production
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WORKER_BASE_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: Verify canonical Top100 runtime end-to-end readiness
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$GITHUB_SHA"
          CONTRACT="$(mktemp)"; HEALTH="$(mktemp)"; ENTRY="$(mktemp)"; UNIVERSE="$(mktemp)"; SCAN="$(mktemp)"
          CC=0
          for i in $(seq 1 40); do
            CC="$(curl -sS --connect-timeout 5 --max-time 20 -o "$CONTRACT" -w '%{http_code}' "$WORKER_BASE_URL/runtime/contract" || true)"
            REV="$(node -e 'const fs=require("fs");try{const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(String(j.runtimeRevision||""))}catch{}' "$CONTRACT")"
            if [ "$CC" = 200 ] && [ "$REV" = "$EXPECTED" ]; then break; fi
            sleep 10
          done
          HC="$(curl -sS --connect-timeout 5 --max-time 35 -o "$HEALTH" -w '%{http_code}' "$WORKER_BASE_URL/bybit/health" || true)"
          EC="$(curl -sS --connect-timeout 5 --max-time 45 -o "$ENTRY" -w '%{http_code}' "$WORKER_BASE_URL/bybit/entry-health" || true)"
          UC="$(curl -sS --connect-timeout 5 --max-time 45 -o "$UNIVERSE" -w '%{http_code}' "$WORKER_BASE_URL/bybit/universe" || true)"
          SC="$(curl -sS --connect-timeout 5 --max-time 60 -o "$SCAN" -w '%{http_code}' "$WORKER_BASE_URL/bybit/scan?symbol=BTCUSDT" || true)"
          EXPECTED="$EXPECTED" CC="$CC" HC="$HC" EC="$EC" UC="$UC" SC="$SC" CONTRACT="$CONTRACT" HEALTH="$HEALTH" ENTRY="$ENTRY" UNIVERSE="$UNIVERSE" SCAN="$SCAN" node <<'NODE'
          const fs=require('fs');
          const read=p=>{try{return JSON.parse(fs.readFileSync(p,'utf8'))}catch{return {}}};
          const c=read(process.env.CONTRACT),h=read(process.env.HEALTH),e=read(process.env.ENTRY),u=read(process.env.UNIVERSE),s=read(process.env.SCAN),expected=process.env.EXPECTED;
          const contractOk=process.env.CC==='200'&&c.ok===true&&c.runtimeRevision===expected&&c.version==='BYBIT_TOP100_RUNTIME_3_0'&&c.executionAuthority==='BYBIT-TOP100-STATEFLOW-3.0'&&c.multiAsset===true&&c.decisionAuthority==='CLOUD_BYBIT_WS_STATE_CHANGE'&&c.aiSoleExecutorRole==='order_risk_architect_agent'&&c.aiOtherAgentsResearchOnly===true;
          const healthOk=process.env.HC==='200'&&h.ok===true&&h.runtimeRevision===expected&&h.authenticated===true&&h.execution?.enabled===true&&h.execution?.ready===true&&h.runtimeContract?.cloudMarketStream?.connected===true;
          const universeOk=process.env.UC==='200'&&u.ok===true&&u.executionSafe===true&&Array.isArray(u.tradeSymbols)&&u.tradeSymbols.length>0;
          const entryOk=process.env.EC==='200'&&e.ok===true&&e.status==='BYBIT_TOP100_ENTRY_INFRA_READY'&&Array.isArray(e.blockers)&&e.blockers.length===0&&e.universeExecutionSafe===true;
          const scanOk=process.env.SC==='200'&&s.ok===true&&s.symbol==='BTCUSDT'&&s.infraReady===true&&Number(s.market?.price)>0&&s.market?.quality?.freshBook===true&&s.market?.quality?.freshTrades===true;
          const out={verifiedAt:new Date().toISOString(),expectedRevision:expected,pass:contractOk&&healthOk&&universeOk&&entryOk&&scanOk,http:{contract:Number(process.env.CC)||0,health:Number(process.env.HC)||0,entry:Number(process.env.EC)||0,universe:Number(process.env.UC)||0,scan:Number(process.env.SC)||0},checks:{contractOk,healthOk,universeOk,entryOk,scanOk},runtime:{revision:c.runtimeRevision||null,authority:c.executionAuthority||null,decisionAuthority:c.decisionAuthority||null,aiExecutor:c.aiSoleExecutorRole||null},health:{mode:h.mode||null,authenticated:h.authenticated??null,ready:h.execution?.ready??null,wsConnected:h.runtimeContract?.cloudMarketStream?.connected??null,blockers:h.blockers||[]},entry:{status:e.status||null,blockers:e.blockers||[],universeCount:Array.isArray(e.universe)?e.universe.length:0},universe:{executionSafe:u.executionSafe??null,stale:u.stale??null,tradeableNow:u.summary?.tradeableNow??null,error:u.error||null},scan:{ok:s.ok??null,infraReady:s.infraReady??null,price:Number(s.market?.price)||null,source:s.market?.microstructureSource||null,publicRestDegraded:s.market?.quality?.publicRestDegraded??null,selectedReason:s.selected?.reason||null}};
          console.log(JSON.stringify(out));
          if(!out.pass)process.exit(7);
          NODE
