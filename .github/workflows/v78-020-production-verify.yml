# trigger: 2026-08-20 production verification
name: V78-020 Production Live Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v78-020-production-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v78-020-production-live-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TRADING_KV_NAMESPACE_ID: ${{ secrets.TRADING_KV_NAMESPACE_ID }}
      WORKER_URL: https://trading-v77-scanner.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard current V78-020 source
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 47800df837101611db8b61e0a25b8fcbd8888f55 HEAD
          grep -q 'function statusActionable' cloudflare-worker/providers/entry-intelligence.js
          test "$(grep -o 'statusActionable' cloudflare-worker/providers/entry-intelligence.js | wc -l)" -eq 4
          grep -q 'x+=entryIntelligenceRankAdjustment(a)' cloudflare-worker/engine-v77168.js
          ! grep -q 'rx+=entryIntelligenceRankAdjustment(a)' cloudflare-worker/engine-v77168.js
          grep -q 'a.status==="MARKET_SIGNAL"&&entryIntelligencePromotionAllowed(a)' cloudflare-worker/engine-v77168.js
          grep -q 'if(a.status==="MARKET"&&!duplicate' cloudflare-worker/engine-v77168.js
          grep -q 'if(a.status==="LIMIT"&&!duplicate' cloudflare-worker/engine-v77168.js
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -n "${TRADING_KV_NAMESPACE_ID:-}"
      - name: Install and deploy current main to production
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          npm run prepare:wrangler
          npx wrangler deploy 2>&1 | tee /tmp/v78-deploy.log
          grep -F "$WORKER_URL" /tmp/v78-deploy.log
      - name: Run exact one-pass live verification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request, datetime, pathlib, sys, subprocess
          base='https://trading-v77-scanner.hanlinh227.workers.dev'
          groups=['forex','crypto','metal','index']
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'V78-020-production-verifier/1.0'})
              with urllib.request.urlopen(req,timeout=90) as r:
                  return json.loads(r.read().decode())
          status=get('/status')
          prior={g:get('/latest-scan?group='+g) for g in groups}
          runs={g:get('/run-now?group='+g) for g in groups}
          evidence=get('/evidence/entry-intelligence?limit=240')
          erows=evidence.get('rows') or []
          report={'verifiedAt':datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'),'workerUrl':base,'deployedGitHead':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'requiredAncestor':'47800df837101611db8b61e0a25b8fcbd8888f55','statusEndpoint':status,'groups':{},'productionVerified':True,'failures':[]}
          actionable_plan={'MARKET_PLAN','LIMIT_PLAN'}; rescue_reasons={'M15_LOCATION_REQUIRED','M5_MSS_DISPLACEMENT_RETEST_REQUIRED','RR_QUALITY_REQUIRED'}
          for g in groups:
              old=(prior[g] or {}).get('snapshot') or {}; new=runs[g] or {}; oldA=old.get('analyses') or []; newA=new.get('analyses') or []
              oldplans=[{'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason')} for a in oldA if a.get('status') in actionable_plan]
              newrows=[{'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason')} for a in newA]; new_syms={a.get('symbol') for a in newA}; absent=[x for x in oldplans if x['symbol'] not in new_syms]; legit_wait=new.get('status') in {'RATE_BUDGET_WAIT','BUSY'}; rescue_checks=[]
              for a in newA:
                  if a.get('status') not in actionable_plan or a.get('reason') not in rescue_reasons: continue
                  p=a.get('planned') or a; q=a.get('analysisQuote') or a.get('quote') or {}; valid=bool(q.get('price')) and q.get('fresh') is not False and all(p.get(k) is not None for k in ['entry','sl']) and (p.get('tp2') is not None or p.get('tp1') is not None or p.get('targetRR') is not None)
                  matched=next((e for e in erows if e.get('symbol')==a.get('symbol') and (e.get('existingDecision') or {}).get('status')==a.get('status') and (e.get('existingDecision') or {}).get('reason')==a.get('reason')),None); allowed=(matched or {}).get('promotion',{}).get('allowed'); rescue_checks.append({'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason'),'validEvidence':valid,'promotionAllowed':allowed,'evidenceCreatedAt':(matched or {}).get('createdAt')})
                  if valid and allowed is not True: report['productionVerified']=False; report['failures'].append(f'{g}:{a.get("symbol")}:rescue promotion not allowed')
              if absent and not legit_wait: report['productionVerified']=False; report['failures'].append(f'{g}:prior actionable plans absent from new analyses: {absent}')
              report['groups'][g]={'prior':{'status':old.get('status'),'scanId':old.get('scanId'),'scannedAt':old.get('scannedAt'),'analyses':[{'symbol':a.get('symbol'),'status':a.get('status'),'reason':a.get('reason')} for a in oldA]},'new':{'status':new.get('status'),'scanId':new.get('scanId'),'scannedAt':new.get('scannedAt'),'analyses':newrows},'priorActionablePlans':oldplans,'absentPriorActionablePlans':absent,'legitimateWaitOrBusy':legit_wait,'rescuePromotionChecks':rescue_checks}
          pathlib.Path('/tmp/v78-live.json').write_text(json.dumps(report,indent=2,ensure_ascii=False)); print(json.dumps(report,indent=2,ensure_ascii=False))
          if not report['productionVerified']: sys.exit(2)
          PY
      - name: Persist exact live evidence and mark production verified
        shell: bash
        run: |
          set -euo pipefail
          { echo; echo '=== V78-020 PRODUCTION LIVE VERIFICATION ==='; cat /tmp/v78-live.json; } >> docs/ai-coengineer/V78-020_VALIDATION.txt
          cat >> docs/ai-coengineer/SHARED_STATE.md <<'EOF'
          
          V78-020 — PRODUCTION-VERIFIED
          - Current production deployment contains commit 47800df837101611db8b61e0a25b8fcbd8888f55 or a descendant.
          - One real /run-now request was executed for each forex/crypto/metal/index without retry-hiding BUSY/RATE_BUDGET_WAIT.
          - Immediately-prior /latest-scan snapshots were compared to the new results.
          - Rescue MARKET_PLAN/LIMIT_PLAN evidence checks use /evidence/entry-intelligence and require promotion.allowed=true when quote/entry/SL/target evidence is valid.
          - Exact live statuses, symbols, scanIds and timestamps are appended to V78-020_VALIDATION.txt.
          EOF
          cat > docs/ai-coengineer/WRITE_LOCK.md <<'EOF'
          # AI WRITE LOCK
          
          LOCKED: false
          OWNER: NONE
          SCOPE: NONE
          RELEASED: 2026-08-20
          LAST_OWNER: CHATGPT
          LAST_SCOPE: V78-020 production live verification
          RESULT: PRODUCTION-VERIFIED. Exact live evidence persisted in docs/ai-coengineer/V78-020_VALIDATION.txt.
          
          Protocol:
          - Acquire a new lock before the next source write.
          - Never reset TRADING_STATE or delete/reset v775:books.
          - Never weaken hard risk/freshness/structural-SL/news safeguards.
          - Never restore Futures/TK2.
          - Binance20 remains NON_PRODUCTION / QUARANTINED.
          - Production Claude API remains paused; Claude.ai Web remains full co-engineer.
          EOF
          git config user.name 'V78 Production Verifier'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ai-coengineer/V78-020_VALIDATION.txt docs/ai-coengineer/SHARED_STATE.md docs/ai-coengineer/WRITE_LOCK.md
          git commit -m 'V78-020 production verify four-market live scans'
          git pull --rebase origin main
          git push origin HEAD:main
