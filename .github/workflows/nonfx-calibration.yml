name: NonFX Calibration Extract
on:
  push:
    paths: ["nonfx-request.json"]
permissions:
  contents: write
jobs:
  nonfx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          python3 <<'PY'
          import json
          with open('data/calibration-blind.json',encoding='utf-8') as f:d=json.load(f)
          names=['SPX','NAS100','JP225','DAX','BTCUSD','ETHUSD','XAUUSD','XAGUSD']
          o={'cutoff':d['cutoff'],'symbols':{}}
          for s in names:
            v=d['symbols'].get(s,{})
            if v.get('status')!='ok':
              o['symbols'][s]={'class':v.get('class'),'status':v.get('status'),'error':v.get('error')};continue
            z={'class':v.get('class'),'status':'ok'}
            for tf in ['D1','H4','H1','M15','M5','M1']:
              x=v['frames'][tf]
              z[tf]={k:x.get(k) for k in ['close','ema20','ema50','ema200','rsi14','atr14','recent50High','recent50Low','trend']}
            o['symbols'][s]=z
          with open('data/calibration-nonfx.json','w',encoding='utf-8') as f:json.dump(o,f,ensure_ascii=False,indent=2)
          PY
      - run: |
          git config user.name market-data-bot
          git config user.email market-data-bot@users.noreply.github.com
          git add data/calibration-nonfx.json
          git diff --cached --quiet && exit 0
          git commit -m "Update non-FX calibration extract"
          git pull --rebase origin main
          git push origin HEAD:main
