name: Free Data Execution Precision V4
on:
  push:
    paths:
      - 'scripts/free_data_execution_precision_v4.py'
      - '.github/workflows/free-data-execution-precision-v4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run MARKET LIMIT all-symbol precision evolution
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONPATH: '.'
        run: python scripts/free_data_execution_precision_v4.py
