name: Offline Forex Remaining7 V27 Matrix
on:
  push:
    paths:
      - 'scripts/offline_forex_remaining7_v27_matrix.py'
      - '.github/workflows/offline-forex-remaining7-v27-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pair: [EURUSD,EURNZD,GBPJPY,GBPCAD,AUDNZD,AUDCHF,CADJPY]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Optimize and validate pair
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_PAIR: ${{ matrix.pair }}
        run: python scripts/offline_forex_remaining7_v27_matrix.py
