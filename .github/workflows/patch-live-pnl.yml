name: V77.18.29 Comprehensive Live PnL Migration
on:
  push:
    branches: [v771829-live-pnl]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v771829-live-pnl
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch Signal + Hyro live PnL UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # ---- Hyro/PROP index ----
          p=Path('cloudflare-worker/index.js'); s=p.read_text()
          s=s.replace('const VERSION="V77.18.25",SERVICE="Trading V77.18.25 Hyro Method + Hub UX";','const VERSION="V77.18.29",SERVICE="Trading V77.18.29 Live PnL + Unified UX";')
          s=s.replace('const RELEASE_NAME="Hyro Method + Hub UX";','const RELEASE_NAME="Live PnL + Unified UX";')
          s=re.sub(r'function posLine\(p,i\)\{.*?\}\nconst usd2=', '''function posPnlMovePct(p){const e=Number(p?.avgPrice||0),m=Number(p?.markPrice||0);if(!(e>0&&m>0))return 0;const raw=(m-e)/e*100;return p?.side==="Sell"?-raw:raw;}\nfunction posLine(p,i,equity=0){const side=p.side==="Buy"?"BUY":"SELL",pnl=Number(p.unrealisedPnl||0),move=posPnlMovePct(p),eqPct=Number(equity)>0?pnl/Number(equity)*100:0,icon=pnl>0?"🟢":pnl<0?"🔴":"⚪",eqSign=eqPct>0?"+":"",mvSign=move>0?"+":"";return `${i+1}. ${icon} ${p.symbol} ${side}\\n💵 P/L ${money(pnl)} • ${eqSign}${eqPct.toFixed(2)}% vốn\\n📍 Entry ${p.avgPrice} → Mark ${p.markPrice||"—"} • Move ${mvSign}${move.toFixed(2)}%\\n🛑 SL ${p.stopLoss||"—"} • 🏁 TP ${p.takeProfit||"—"}`;}\nconst usd2=''', s, count=1, flags=re.S)
          s=re.sub(r'async function positionsText\(env\)\{.*?\}\nasync function riskText', '''async function positionsText(env){env=await propEnv(env);const c=await getHyroControl(env),cfg=hyroExecutionConfig(env),t=await getHyroTelemetry(env),kb=propKeyboard(c.manualPaused,cfg.mode);if(!t.connected)return {text:`📈 HYRO • TELEMETRY ${t.reason||"OFF"}`,kb};const total=Number(t.totalUnrealised||0),equity=Number(t.equity||0),totalPct=equity>0?total/equity*100:0,sign=totalPct>0?"+":"",icon=total>0?"🟢":total<0?"🔴":"⚪";return {text:["📈 HYRO • VỊ THẾ LIVE","━━━━━━━━━━━━",`${icon} Tổng P/L mở ${money(total)} • ${sign}${totalPct.toFixed(2)}% vốn`,`💰 Equity ${cash(equity)} • Vị thế ${t.positions.length}`,"",t.positions.length?t.positions.map((p,i)=>posLine(p,i,equity)).join("\\n\\n"):"⚪ Không có vị thế đang chạy.","","🔄 Bấm Vị thế để refresh P/L mới nhất."].join("\\n"),kb};}\nasync function riskText''', s, count=1, flags=re.S)
          # Enrich entry notification with immediate live P/L if telemetry already sees the fill.
          s=re.sub(r'async function notifyPropEntry\(env,cycle\)\{.*?\}\nfunction positionSnapshot', '''async function notifyPropEntry(env,cycle){if(!cycle?.executed||cycle?.reason!=="ORDER_SUBMITTED"||!cycle?.execution)return;const o=cycle.execution,id=String(o.orderId||o.orderLinkId||o.id||`${o.symbol}:${o.createdAt}`),key=`${PROP_NOTIFY_PREFIX}entry:${id}`;if(await kvGet(env,key,null))return;const u=orderUsdLevels(o),side=String(o.side||"").toUpperCase(),tier=cycle.selectedTier||"A",micro=cycle.selectedMicroScore!=null?` • Micro ${Number(cycle.selectedMicroScore).toFixed(2)}`:"";let liveLine="⏳ P/L đang đồng bộ";try{const t=await getHyroTelemetry(env),p=(t.positions||[]).find(x=>x.symbol===o.symbol);if(p){const eq=Number(t.equity||0),pnl=Number(p.unrealisedPnl||0),pct=eq>0?pnl/eq*100:0;liveLine=`${pnl>=0?"🟢":"🔴"} P/L ${money(pnl)} • ${pct>=0?"+":""}${pct.toFixed(2)}% vốn`;}}catch{}await send(env,env.TELEGRAM_CHAT_ID,["🏦 HYRO • LỆNH ĐÃ MỞ","━━━━━━━━━━━━",`${o.symbol} ${side} • Tier ${tier}${micro}`,liveLine,`🛑 SL ${o.sl} (~${usd2(u.slUsd)})`,`🏁 TP ${o.tp} (~${usd2(u.tpUsd)})`,`🎯 Target ngày ${cycle.dynamicRisk?.objective?.dailyTargetPct||"—"}%`].join("\\n"),propKeyboard(false,String(env.HYRO_BYBIT_MODE||"DEMO")));await kvPut(env,key,{sentAt:Date.now(),orderId:o.orderId||null,symbol:o.symbol},604800);}\nfunction positionSnapshot''', s, count=1, flags=re.S)
          # Closed card includes % of current equity for context.
          s=s.replace('`P/L ${money(delta)}`].join("\\n")','`P/L ${money(delta)}`].join("\\n")')
          p.write_text(s)

          # ---- Signal engine: durable state + live enrichment ----
          p=Path('cloudflare-worker/engine-v77168.js'); s=p.read_text()
          old='function toPos(sig,discoveredBy="SCAN"){const tp=Number.isFinite(Number(sig.tp2))?sig.tp2:sig.tp1;return {id:sig.symbol+"-"+Date.now(),symbol:sig.symbol,side:sig.side,entry:sig.entry,sl:sig.sl,tp,tp1:sig.tp1,tp2:sig.tp2,targetRR:sig.targetRR,origin:sig.action,discoveredBy,status:"ACTIVE",openedAt:Date.now(),createdAt:Date.now(),engineOpened:sig.engine,engine:sig.engine,source:sig.quote?.source,executionVerified:true,executionAuthority:sig.quote?.source||"CANONICAL_CRYPTO"};}'
          new='function toPos(sig,discoveredBy="SCAN"){const tp=Number.isFinite(Number(sig.tp2))?sig.tp2:sig.tp1;return {id:sig.symbol+"-"+Date.now(),symbol:sig.symbol,side:sig.side,entry:sig.entry,sl:sig.sl,tp,tp1:sig.tp1,tp2:sig.tp2,targetRR:sig.targetRR,origin:sig.action,discoveredBy,status:"ACTIVE",openedAt:Date.now(),createdAt:Date.now(),engineOpened:sig.engine,engine:sig.engine,source:sig.quote?.source,executionVerified:true,executionAuthority:sig.quote?.source||"CANONICAL_CRYPTO",quantity:Number(sig.risk?.quantity)||null,riskUsd:Number(sig.risk?.riskUsd)||CONFIG.defaultRiskUsd};}'
          if old not in s: raise SystemExit('toPos target missing')
          s=s.replace(old,new)
          marker='async function saveBooks(env,b){b.updatedAt=Date.now();for(const g of Object.keys(GROUPS))b[g].watch=[];await env.TRADING_STATE.put(CONFIG.keys.books,JSON.stringify(b));}'
          helper=r'''async function saveBooks(env,b){b.updatedAt=Date.now();for(const g of Object.keys(GROUPS))b[g].watch=[];await env.TRADING_STATE.put(CONFIG.keys.books,JSON.stringify(b));}
function bookQty(p){const q=Number(p?.quantity??p?.qty);if(Number.isFinite(q)&&q>0)return {qty:q,estimated:false};const e=Number(p?.entry),sl=Number(p?.sl),risk=Number(p?.riskUsd??CONFIG.defaultRiskUsd);const d=Math.abs(e-sl);return e>0&&sl>0&&risk>0&&d>0?{qty:risk/d,estimated:true}:{qty:null,estimated:true};}
async function liveBookQuote(group,p,env){try{if(group==="crypto")return await cryptoExecutionQuote(p.symbol);if(group==="forex"||group==="metal")return await tdQuote(p.symbol,env);if(group==="future"){const a=await recentFutureScanAnalysis(p.symbol,env),q=a?.quote||a?.analysisQuote,price=Number(a?.currentPrice??q?.price);return price>0?{price,source:q?.source||a?.source||"Massive recent"}:null;}}catch{}return null;}
function enrichBookPosition(group,p,q){const out={...p};if(!(Number(q?.price)>0))return out;const e=Number(p.entry),px=Number(q.price),dir=p.side==="SHORT"?-1:1;out.currentPrice=px;out.liveSource=q.source||q.providerSymbol||null;out.liveAt=Date.now();if(e>0){out.pnlPct=(px-e)/e*100*dir;if(p.status!=="PENDING"){const qq=bookQty(p);if(qq.qty){out.pnlUsd=(px-e)*dir*qq.qty;out.pnlUsdEstimated=qq.estimated||group!=="crypto";}}}return out;}
async function getBooksLive(env){const b=await getBooks(env),out=JSON.parse(JSON.stringify(b)),tasks=[];for(const g of Object.keys(GROUPS)){for(const key of ["marketActive","limitActive","limitPending"]){for(let i=0;i<(out[g]?.[key]||[]).length;i++){const p=out[g][key][i];tasks.push((async()=>{const q=await liveBookQuote(g,p,env);out[g][key][i]=enrichBookPosition(g,p,q);})());}}}await Promise.all(tasks);out.liveRefreshedAt=Date.now();return out;}'''
          if marker not in s: raise SystemExit('saveBooks marker missing')
          s=s.replace(marker,helper)
          old='function livePositionLine(p){const kind=p.status==="PENDING"?"LIMIT CHỜ":p.origin==="LIMIT"?"LIMIT KHỚP":"MARKET";return kind+" • "+posLine(p)+" • nguồn "+orderSourceText(p.discoveredBy);}'
          new='function livePositionLine(p){const kind=p.status==="PENDING"?"LIMIT CHỜ":p.origin==="LIMIT"?"LIMIT KHỚP":"MARKET",live=Number.isFinite(Number(p.pnlPct))?`${Number(p.pnlPct)>=0?"🟢":"🔴"} ${(Number(p.pnlPct)>=0?"+":"")+Number(p.pnlPct).toFixed(2)}%${Number.isFinite(Number(p.pnlUsd))?` • ${p.pnlUsdEstimated?"~":""}${Number(p.pnlUsd)>=0?"+":""}$${Number(p.pnlUsd).toFixed(2)}`:""}`:p.status==="PENDING"?"🟡 chưa khớp":"⚪ P/L chờ refresh";return `${kind} • ${p.symbol} ${sideText(p.side)} • ${live} • E ${fmtPx(p.entry)}${p.currentPrice?` → ${fmtPx(p.currentPrice)}`:""} • SL ${fmtPx(p.sl)} • TP ${fmtPx(p.tp)} • ${orderSourceText(p.discoveredBy)}`;}'
          if old not in s: raise SystemExit('livePositionLine target missing')
          s=s.replace(old,new)
          s=s.replace('const h=await runHub(env,"HUB_MANUAL");return sendText(env,hubSummary(h),chatId,hubKeyboard(h));','const h=await runHub(env,"HUB_MANUAL");h.books=await getBooksLive(env);return sendText(env,hubSummary(h),chatId,hubKeyboard(h));')
          s=s.replace('const run=await runGroup(group,env,"GROUP_MANUAL"),books=await getBooks(env);return sendText(env,summary(group,books,run),chatId,groupKeyboard(group,run));','const run=await runGroup(group,env,"GROUP_MANUAL"),books=await getBooksLive(env);return sendText(env,summary(group,books,run),chatId,groupKeyboard(group,run));')
          s=s.replace('else if(cb==="books")await sendText(env,booksSummary(await getBooks(env)),chatId,baseKeyboard());','else if(cb==="books")await sendText(env,booksSummary(await getBooksLive(env)),chatId,{inline_keyboard:[[{text:"🔄 Refresh P/L",callback_data:"books"},{text:"📡 Signal",callback_data:"signal"}],[{text:"🏦 Hyro",callback_data:"prop"},{text:"🏠 Hub",callback_data:"menu"}]]});')
          s=s.replace('if(p==="/books"||p==="/orders")return json(await getBooks(env));','if(p==="/books"||p==="/orders")return json(await getBooksLive(env));')
          # Event card: show live P/L fields when available; pending LIMIT stays non-PnL.
          old='function signalEventText(kind,p,extra={}){const group=extra.group||"crypto",side=sideText(p?.side),entry=fmtPx(p?.entry),sl=fmtPx(p?.sl),tp1=fmtPx(p?.tp1),tp2=fmtPx(p?.tp2||p?.tp),rr=Number(p?.targetRR);const head=kind==="LIMIT_FILLED"?"🔵 LIMIT KHỚP • ACTIVE":kind==="TP"?"✅ TP DONE":kind==="SL"?"🛑 SL HIT":kind==="LIMIT_NEW"?"🟡 LIMIT MỚI • ĐANG CHỜ":"🟢 MARKET MỚI • ACTIVE";const L=[head,groupTitle(group)+" • "+(p?.symbol||"—")+" • "+side,"━━━━━━━━━━━━━━"];if(kind==="TP"||kind==="SL"){L.push("📍 Entry "+entry,"🏁 Close "+fmtPx(extra.closePrice));}else{L.push("🎯 Entry "+entry,"🛡 SL "+sl,"💰 TP1 "+tp1+" • TP2 "+tp2+(Number.isFinite(rr)?" • RR "+rr.toFixed(2):""));}if(p?.discoveredBy)L.push("⚙️ "+orderSourceText(p.discoveredBy));return L.join("\\n");}'
          new='function signalEventText(kind,p,extra={}){const group=extra.group||"crypto",side=sideText(p?.side),entry=fmtPx(p?.entry),sl=fmtPx(p?.sl),tp1=fmtPx(p?.tp1),tp2=fmtPx(p?.tp2||p?.tp),rr=Number(p?.targetRR);const head=kind==="LIMIT_FILLED"?"🔵 LIMIT KHỚP • LIVE":kind==="TP"?"✅ TP DONE":kind==="SL"?"🛑 SL HIT":kind==="LIMIT_NEW"?"🟡 LIMIT MỚI • ĐANG CHỜ":"🟢 MARKET • LIVE";const L=[head,groupTitle(group)+" • "+(p?.symbol||"—")+" • "+side,"━━━━━━━━━━━━━━"];if(kind==="TP"||kind==="SL"){const move=Number(extra.closePrice)>0&&Number(p?.entry)>0?(Number(extra.closePrice)-Number(p.entry))/Number(p.entry)*100*(p.side==="SHORT"?-1:1):null;L.push("📍 Entry "+entry,"🏁 Close "+fmtPx(extra.closePrice)+(Number.isFinite(move)?` • ${move>=0?"+":""}${move.toFixed(2)}%`:""));}else{L.push("🎯 Entry "+entry,"🛡 SL "+sl,"💰 TP1 "+tp1+" • TP2 "+tp2+(Number.isFinite(rr)?" • RR "+rr.toFixed(2):""));if(kind!=="LIMIT_NEW")L.push("🔄 P/L: mở 📚 Live Orders để refresh giá + % + USD");}if(p?.discoveredBy)L.push("⚙️ "+orderSourceText(p.discoveredBy));return L.join("\\n");}'
          if old not in s: raise SystemExit('signalEventText target missing')
          s=s.replace(old,new)
          p.write_text(s)

          # ---- Hub live-order presentation ----
          p=Path('cloudflare-worker/hub-v77171.js'); s=p.read_text()
          s=s.replace('const VERSION="V77.18.27",UI_REV="HUB-R3-SIGNAL",SERVICE="Trading V77.18.27 • Signal UX R3";','const VERSION="V77.18.29",UI_REV="HUB-R4-LIVE-PNL",SERVICE="Trading V77.18.29 • Unified Live PnL UX";')
          old='function booksText(b){const L=["📚 LIVE ORDERS","━━━━━━━━━━━━"];let n=0;for(const g of ["crypto","forex","metal","future"]){const x=b?.[g]||{},rows=[...(x.marketActive||[]),...(x.limitActive||[]),...(x.limitPending||[])];if(!rows.length)continue;L.push("",groupName(g));for(const p of rows){n++;L.push(`${p.status==="PENDING"?"🟡":"🟢"} ${p.symbol} • ${side(p.side)}`,`   E ${fmt(p.entry)} • SL ${fmt(p.sl)} • TP ${fmt(p.tp)}`);}}if(!n)L.push("","⚪ Hiện chưa có lệnh live.");L.push("","━━━━━━━━━━━━",`Tổng: ${n} lệnh`);return L.join("\\n");}'
          new='function orderLivePnl(p){const pct=Number(p?.pnlPct),usd=Number(p?.pnlUsd),price=Number(p?.currentPrice);return {pct:Number.isFinite(pct)?pct:null,usd:Number.isFinite(usd)?usd:null,price:Number.isFinite(price)?price:null,estimated:!!p?.pnlUsdEstimated};}\nfunction booksText(b){const L=["📚 LIVE ORDERS • REALTIME P/L","━━━━━━━━━━━━"];let n=0,active=0,pendingN=0;for(const g of ["crypto","forex","metal","future"]){const x=b?.[g]||{},rows=[...(x.marketActive||[]),...(x.limitActive||[]),...(x.limitPending||[])];if(!rows.length)continue;L.push("",groupName(g));for(const p of rows){n++;const pending=p.status==="PENDING",live=orderLivePnl(p),icon=pending?"🟡":live.pct>0?"🟢":live.pct<0?"🔴":"⚪",kind=pending?"LIMIT CHỜ":p.origin==="LIMIT"?"LIMIT KHỚP":"MARKET";pending?pendingN++:active++;L.push(`${icon} ${p.symbol} • ${side(p.side)} • ${kind}`,`   📍 ${fmt(p.entry)}${live.price?` → ${fmt(live.price)}`:""}`,pending?`   ⏳ Chưa khớp • chưa tính P/L`:`   💵 P/L ${live.pct!=null?(live.pct>=0?"+":"")+live.pct.toFixed(2)+"%":"—"}${live.usd!=null?` • ${live.estimated?"~":""}${live.usd>=0?"+":""}$${live.usd.toFixed(2)}`:""}`,`   🛑 SL ${fmt(p.sl)} • 🏁 TP ${fmt(p.tp)}`);}}if(!n)L.push("","⚪ Hiện chưa có lệnh live.");L.push("","━━━━━━━━━━━━",`Active ${active} • Pending ${pendingN} • Tổng ${n}`,`🕒 ${b?.liveRefreshedAt?new Date(b.liveRefreshedAt).toISOString():"chưa refresh"}`,"ℹ️ Dấu ~ = USD ước tính từ risk/SL khi broker size không có.");return L.join("\\n");}'
          if old not in s: raise SystemExit('hub booksText target missing')
          s=s.replace(old,new)
          # Add dedicated live books keyboard and use it for books callback where possible.
          anchor='const symbolMarketKeyboard=()=>({inline_keyboard:'
          if 'const liveBooksKeyboard=' not in s and anchor in s:
              s=s.replace(anchor,'const liveBooksKeyboard=()=>({inline_keyboard:[[{text:"🔄 Refresh P/L",callback_data:"books"},{text:"🔥 Top Setup",callback_data:"signal:top"}],[{text:"📡 Signal",callback_data:"signal"},{text:"🏦 Hyro",callback_data:"prop"}],[{text:"🏠 Hub",callback_data:"menu"}]]});\\n'+anchor)
          s=s.replace('booksText(await engineJson("/books",req,env))','booksText(await engineJson("/books",req,env))')
          p.write_text(s)
          PY

          cd cloudflare-worker
          node validate-worker.mjs
          npm ci
          TRADING_KV_NAMESPACE_ID=0123456789abcdef0123456789abcdef node prepare-wrangler.mjs
          npx wrangler deploy --dry-run --outdir /tmp/v771829-dist
      - name: Commit validated migration and remove temporary workflows
        run: |
          rm -f .github/workflows/patch-live-pnl.yml .github/workflows/live-pnl-migration.yml
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add -A
          git commit -m "V77.18.29 comprehensive live PnL and unified UX" || exit 0
          git push origin HEAD:v771829-live-pnl
