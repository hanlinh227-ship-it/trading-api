name: Dual Random10 Refine V11 Fast

on:
  push:
    branches: [main]
    paths:
      - 'research/dual_random10_refine_v11_fast.py'
      - '.github/workflows/dual-random10-refine-v11-fast.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    strategy:
      fail-fast: false
      matrix:
        symbol: [XAU, BTC]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run ${{ matrix.symbol }} random10 refinement
        continue-on-error: true
        run: |
          mkdir -p research/results
          python3 research/dual_random10_refine_v11_fast.py --symbol ${{ matrix.symbol }} 2>&1 | tee research/results/${{ matrix.symbol }}_random10_v11.txt
          test ${PIPESTATUS[0]} -eq 0 || echo "NO_10_OF_10_YET" >> research/results/${{ matrix.symbol }}_random10_v11.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.symbol }}-random10-v11-result
          path: research/results/${{ matrix.symbol }}_random10_v11.txt
          retention-days: 30
          if-no-files-found: error
