name: Run SignalHub V3.13 Crypto Only Quality

on:
  push:
    branches: [main]
    paths: ['.github/workflows/run-signalhub-v313-crypto-only-quality.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy-audit:
    runs-on: ubuntu-latest
    env:
      SIGNALHUB_URL: https://signalhub-forex.hanlinh227.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          ref: signalhub-v313-crypto-only-quality
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate V3.13 crypto-only source
        run: python3 scripts/patch_signalhub_v313_crypto_only_quality.py

      - name: Verify V3.13 source contract
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          w=Path('signalhub-worker/gateway-v3.js').read_text()
          a=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java').read_text()
          m=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java').read_text()
          api=Path('signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java').read_text()
          g=Path('signalhub-android/app/build.gradle').read_text()
          for x in ['SIGNALHUB-V3-GATEWAY-3.13.0','CRYPTO_ONLY_QUALITY','FOREX_DISABLED_CRYPTO_ONLY','CRYPTO_ONLY_STYLE_COVERAGE','minActivePerStyle:1','CRYPTO_HARD_QUALITY_CHECKS_NO_PREDICTED_SCORE','cryptoOnlyMaintenance','crossProviderConfirmation','DURABLE_OBJECT_ALARM_1S']:
              assert x in w,x
          assert 'maxActiveTotal:4' in w and 'maxActivePerStyle:2' in w and 'maxNewPerScan:1' in w
          assert 'return legacy.fetch' not in w and 'legacy.scheduled' not in w
          assert 'APP_VERSION="3.13.0"' in a and 'filter="CRYPTO"' in a
          assert 'CRYPTO ONLY • SCALP ≠ SWING' in a and 'FOREX + CRYPTO luôn được refill' not in a
          assert 'for(String style:new String[]{"SCALP","SWING"})' in m and 'for(String market:new String[]{"FOREX","CRYPTO"})' not in m
          assert '3.13.0-crypto-only-quality' in api
          assert "versionName '3.13.0'" in g and 'versionCode 19' in g
          print('V313_SOURCE_CONTRACT_OK')
          PY

      - name: Validate Worker bundle
        run: npx --yes wrangler@latest deploy --dry-run --config signalhub-worker/wrangler.jsonc --outdir /tmp/v313-worker

      - name: Deploy V3.13 production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@latest deploy --config signalhub-worker/wrangler.jsonc

      - name: Wait for crypto-only production contract
        run: |
          set -euo pipefail
          ok=0
          for n in $(seq 1 40); do
            if curl -A 'SignalHub-CI/3.13' -fsS --max-time 30 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/status?probe=$RANDOM-$n" >/tmp/status.json; then
              if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/status.json')); q=p.get('decisionPolicy') or {}; pp=q.get('portfolioPolicy') or {}
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.13.0'
          assert p.get('mode')=='CRYPTO_ONLY_QUALITY' and p.get('forexDisabled') is True
          assert set((p.get('engines') or {}).keys())=={'cryptoScalp','cryptoSwing'}
          assert pp.get('maxActiveTotal')==4 and pp.get('maxActivePerStyle')==2 and pp.get('minActivePerStyle')==1
          assert pp.get('coverageMode')=='CRYPTO_ONLY_STYLE_COVERAGE'
          PY
              then ok=1; break; fi
            fi
            sleep 2
          done
          test "$ok" = 1

      - name: Verify Forex is disabled
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/fx-disabled.json -w '%{http_code}' --max-time 30 "$SIGNALHUB_URL/v3/scan?market=FOREX&style=SCALP")
          test "$code" = 410
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/fx-disabled.json')); assert p.get('error')=='FOREX_DISABLED_CRYPTO_ONLY'
          PY

      - name: Scan and maintain both Crypto styles
        run: |
          set -euo pipefail
          : >/tmp/engine-summary.txt
          for round in $(seq 1 8); do
            for st in SCALP SWING; do
              curl -A 'SignalHub-CI/3.13-scan' -fsS --retry 2 --retry-delay 1 --max-time 150 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/scan?market=CRYPTO&style=$st&probe=$RANDOM-$round" >"/tmp/scan-$st.json" || true
              ST="$st" ROUND="$round" python3 - <<'PY' >>/tmp/engine-summary.txt
          import json,os
          try:p=json.load(open('/tmp/scan-'+os.environ['ST']+'.json'))
          except Exception as e: print('scan error',os.environ['ST'],e); raise SystemExit
          print('round',os.environ['ROUND'],os.environ['ST'],'provider',p.get('provider'),'scanned',p.get('scanned'),'liquid',p.get('liquidUniverse'),'evaluated',p.get('evaluated'),'actionable',p.get('actionable'),'created',p.get('created'))
          for x in p.get('topAnalyses',[]):
              ea=x.get('entryAssessment') or {}; checks=ea.get('checks') or {}
              assert ea.get('verdict')=='PASS' and ea.get('method')=='CRYPTO_HARD_QUALITY_CHECKS_NO_PREDICTED_SCORE',ea
              assert checks and all(checks.values()),checks
              assert x.get('market')=='CRYPTO'
              assert x.get('executionPriceAuthority') in ('BYBIT','OKX','BINANCE')
          PY
            done
            curl -fsS --max-time 30 "$SIGNALHUB_URL/v3/portfolio?probe=$RANDOM-$round" >/tmp/portfolio.json
            if python3 - <<'PY'
          import json
          p=json.load(open('/tmp/portfolio.json')); b=p.get('portfolio') or {}; st=b.get('styles') or {}
          print('PORTFOLIO',b)
          assert int(st.get('SCALP') or 0)>=1 and int(st.get('SWING') or 0)>=1
          assert int(b.get('activeTotal') or 0)<=4
          PY
            then break; fi
            sleep 3
          done
          cat /tmp/engine-summary.txt
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/portfolio.json')); st=(p.get('portfolio') or {}).get('styles') or {}
          assert int(st.get('SCALP') or 0)>=1 and int(st.get('SWING') or 0)>=1,(p.get('portfolio') or {})
          PY

      - name: Audit Crypto active book and provider pinning
        run: |
          set -euo pipefail
          for st in SCALP SWING; do
            curl -A 'SignalHub-CI/3.13-audit' -fsS --retry 3 --max-time 40 -H 'Cache-Control: no-cache' "$SIGNALHUB_URL/v3/signals?market=CRYPTO&style=$st&status=active&limit=100&probe=$RANDOM" >"/tmp/book-$st.json"
          done
          python3 - <<'PY'
          import json
          sig=[]
          for st in ['SCALP','SWING']:
              p=json.load(open('/tmp/book-'+st+'.json')); assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.13.0'; sig+=p.get('signals',[])
          rows=[(x.get('style'),x.get('symbol'),x.get('orderType'),x.get('status'),x.get('executionPriceAuthority')) for x in sig]
          print('ACTIVE_ROWS',rows)
          assert 2<=len(sig)<=4,rows
          assert sum(x.get('style')=='SCALP' for x in sig)>=1 and sum(x.get('style')=='SWING' for x in sig)>=1
          assert sum(x.get('style')=='SCALP' for x in sig)<=2 and sum(x.get('style')=='SWING' for x in sig)<=2
          syms=[x.get('symbol') for x in sig]; assert len(syms)==len(set(syms)),syms
          for x in sig:
              assert x.get('market')=='CRYPTO' and x.get('engineVersion')=='SIGNALHUB-V3-GATEWAY-3.13.0'
              assert x.get('executionPriceAuthority') in ('BYBIT','OKX','BINANCE')
              ea=x.get('entryAssessment') or {}; assert ea.get('verdict')=='PASS',ea
              pr=x.get('portfolioReservation') or {}; assert pr.get('mode')=='DURABLE_OBJECT_ATOMIC',pr
          json.dump(sig,open('/tmp/ACTIVE-BOOK-AUDIT.json','w'),indent=2)
          open('/tmp/ACTIVE-BOOK-SUMMARY.txt','w').write('ACTIVE_TOTAL=%d\nSCALP=%d\nSWING=%d\nROWS=%s\n'%(len(sig),sum(x.get('style')=='SCALP' for x in sig),sum(x.get('style')=='SWING' for x in sig),rows))
          PY
          cat /tmp/ACTIVE-BOOK-SUMMARY.txt

      - name: Verify app-independent Crypto lifecycle monitor
        run: |
          set -euo pipefail
          curl -A 'SignalHub-CI/3.13-monitor' -fsS --max-time 30 "$SIGNALHUB_URL/v3/crypto/monitor?kick=1&probe=$RANDOM" >/tmp/mon1.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/mon1.json')); s=p.get('status') or {}; k=p.get('kick') or {}
          assert p.get('version')=='SIGNALHUB-V3-GATEWAY-3.13.0' and k.get('running') is True,(p,k)
          open('/tmp/cycle','w').write(str(int(s.get('cycle') or 0))); print('MONITOR_START',s)
          PY
          sleep 4
          curl -A 'SignalHub-CI/3.13-monitor' -fsS --max-time 30 "$SIGNALHUB_URL/v3/crypto/monitor?probe=$RANDOM" >/tmp/mon2.json
          python3 - <<'PY'
          import json
          c=int(open('/tmp/cycle').read()); p=json.load(open('/tmp/mon2.json')); s=p.get('status') or {}; print('MONITOR_AFTER',s)
          assert s.get('running') is True and int(s.get('cycle') or 0)>c and int(s.get('activeCrypto') or 0)>=2,s
          PY

      - name: Build Android APK
        working-directory: signalhub-android
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify and stage V3.13 APK
        run: |
          set -euo pipefail
          APK=signalhub-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -q classes.dex
          mkdir -p dist
          cp "$APK" dist/SignalHub-v3.13.0-Crypto-Only-Quality.apk
          sha256sum dist/SignalHub-v3.13.0-Crypto-Only-Quality.apk > dist/SHA256SUMS.txt
          cp /tmp/engine-summary.txt dist/ENGINE-SUMMARY.txt
          cp /tmp/ACTIVE-BOOK-AUDIT.json dist/ACTIVE-BOOK-AUDIT.json
          cp /tmp/ACTIVE-BOOK-SUMMARY.txt dist/ACTIVE-BOOK-SUMMARY.txt
          cp /tmp/mon2.json dist/CRYPTO-MONITOR-AUDIT.json

      - name: Commit generated V3.13 source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add signalhub-worker/gateway-v3.js signalhub-android/app/build.gradle signalhub-android/app/src/main/java/com/hanlinh/signalhub/SignalHubActivity.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/MonitorService.java signalhub-android/app/src/main/java/com/hanlinh/signalhub/ApiClient.java
          git commit -m 'SignalHub v3.13 crypto-only quality engine' || true
          git push origin HEAD:signalhub-v313-crypto-only-quality

      - uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-v3.13.0-Crypto-Only-Quality
          path: dist/
          retention-days: 30

      - name: Publish V3.13 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='signalhub-v3.13.0-crypto-only-quality'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target signalhub-v313-crypto-only-quality --prerelease --title 'SignalHub v3.13.0 Crypto Only Quality' --notes 'Crypto-only release. Forex signal generation is disabled. SCALP uses 5m/15m/1h and SWING uses 1h/4h/1d with separate hard structure, context, spread, liquidity, RR and provider-pinning checks. LIMIT/STOP lifecycle remains server-side and app-independent.'
          fi
