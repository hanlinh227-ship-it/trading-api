name: Dual Random10 Refine V10

on:
  push:
    branches: [main]
    paths:
      - 'research/dual_random10_refine_v10.py'
      - '.github/workflows/dual-random10-refine-v10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run dual random10 refinement
        run: |
          mkdir -p research/results
          python3 research/dual_random10_refine_v10.py | tee research/results/dual_random10_v10.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: dual-random10-v10-result
          path: research/results/dual_random10_v10.txt
          retention-days: 30
          if-no-files-found: error
