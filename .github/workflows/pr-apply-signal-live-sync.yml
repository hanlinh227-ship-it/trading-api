name: V77.18.41 PR Signal Live Repair
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/migrate_signal_live_sync.mjs'
      - '.github/workflows/pr-apply-signal-live-sync.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply migration
        run: node scripts/migrate_signal_live_sync.mjs
      - name: Syntax check
        run: |
          node --check cloudflare-worker/engine-v77168.js
          node --check cloudflare-worker/hub-v77171.js
      - name: Commit repaired runtime to PR branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/engine-v77168.js cloudflare-worker/hub-v77171.js
          if git diff --cached --quiet; then echo 'No runtime changes'; exit 0; fi
          git commit -m 'V77.18.41 persist MARKET_SIGNAL into scoped Live books'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
