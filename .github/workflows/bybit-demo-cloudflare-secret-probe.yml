name: Bybit Demo Cloudflare Secret Probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-demo-cloudflare-secret-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: [self-hosted, Linux, X64, trading-vps]
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - name: List Worker secret names only
        working-directory: cloudflare-worker
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund >/dev/null 2>&1
          npm run prepare:wrangler >/dev/null 2>&1
          OUT="$(npx wrangler secret list 2>/dev/null || true)"
          printf '%s\n' "$OUT" | grep -Eo 'HYRO_BYBIT_(API_KEY|API_SECRET|LIVE_API_KEY|LIVE_API_SECRET)|BYBIT_AUTO_(API_KEY|API_SECRET)' | sort -u
          if printf '%s\n' "$OUT" | grep -q 'HYRO_BYBIT_API_KEY' && printf '%s\n' "$OUT" | grep -q 'HYRO_BYBIT_API_SECRET'; then
            echo 'CLOUDFLARE_HYRO_DEMO_SECRET_PAIR=READY'
          else
            echo 'CLOUDFLARE_HYRO_DEMO_SECRET_PAIR=MISSING'
            exit 2
          fi
