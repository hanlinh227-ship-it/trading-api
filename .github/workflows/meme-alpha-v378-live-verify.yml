name: Meme Alpha V378 Live Verify

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v378-live-verify.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify Meme Alpha v378 runtime read-only
        shell: bash
        run: |
          set -u
          APP=/opt/meme-alpha/app
          ROOT=/opt/trading/trading-api
          OUT="$GITHUB_WORKSPACE/meme-alpha-runtime/V378-LIVE.md"
          REMOTE="$(git ls-remote https://github.com/hanlinh227-ship-it/trading-api.git refs/heads/auto-futures-v1 2>/dev/null | awk '{print $1}' || true)"
          LOCAL="$(git -C "$ROOT" rev-parse HEAD 2>/dev/null || echo UNKNOWN)"
          EXEC="$APP/src/micro-live-executor.js"
          MARKER=false
          [[ -f "$EXEC" ]] && grep -q 'MICRO_LIVE_EXECUTOR_V378_AGGRESSIVE_ROTATION' "$EXEC" && MARKER=true
          cat > "$OUT" <<EOF
          # Meme Alpha V378 Runtime Verify

          - remote_updater_head: \`$REMOTE\`
          - root_repo_head: \`$LOCAL\`
          - v378_executor_marker: \`$MARKER\`
          - v378_deployment_marker: \`$([[ -f "$APP/runtime-status/v378-deployed.json" ]] && echo true || echo false)\`
          - paper_service: \`$(systemctl is-active meme-alpha-paper.service 2>/dev/null || echo unknown)\`
          - micro_live_service: \`$(systemctl is-active meme-alpha-micro-live.service 2>/dev/null || echo unknown)\`
          - signer_service: \`$(systemctl is-active meme-alpha-signer.service 2>/dev/null || echo unknown)\`
          - updater_timer: \`$(systemctl is-active auto-futures-update.timer 2>/dev/null || echo unknown)\`
          - updater_last_result: \`$(systemctl show auto-futures-update.service -p Result --value 2>/dev/null || echo unknown)\`
          - updater_last_exit: \`$(systemctl show auto-futures-update.service -p ExecMainStatus --value 2>/dev/null || echo unknown)\`
          - checked_at_utc: \`$(date -u +%FT%TZ)\`
          EOF
      - name: Commit runtime verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "meme-alpha-vps-bot"
          git config user.email "actions-bot@users.noreply.github.com"
          git add meme-alpha-runtime/V378-LIVE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(meme): record v378 runtime verification"
          git push origin HEAD:main
