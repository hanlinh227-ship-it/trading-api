name: Validate Actionable Hub Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-v77151-build.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate Worker and Wrangler bundle
        shell: bash
        env:
          TRADING_KV_NAMESPACE_ID: '00000000000000000000000000000000'
        run: |
          set +e
          : > ACTIONABLE_HUB_BUILD.txt
          node --check cloudflare-worker/index.js >> ACTIONABLE_HUB_BUILD.txt 2>&1; echo "SYNTAX_EXIT=$?" >> ACTIONABLE_HUB_BUILD.txt
          cd cloudflare-worker
          npm install >> ../ACTIONABLE_HUB_BUILD.txt 2>&1; echo "NPM_EXIT=$?" >> ../ACTIONABLE_HUB_BUILD.txt
          npm run prepare:wrangler >> ../ACTIONABLE_HUB_BUILD.txt 2>&1; echo "PREPARE_EXIT=$?" >> ../ACTIONABLE_HUB_BUILD.txt
          npx wrangler deploy --dry-run >> ../ACTIONABLE_HUB_BUILD.txt 2>&1; echo "WRANGLER_EXIT=$?" >> ../ACTIONABLE_HUB_BUILD.txt
          cd ..
          grep -Eq 'version: "V77\.15\.[0-9]+"' cloudflare-worker/index.js && echo 'VERSION=YES' >> ACTIONABLE_HUB_BUILD.txt || echo 'VERSION=NO' >> ACTIONABLE_HUB_BUILD.txt
          grep -q 'function planSignal' cloudflare-worker/index.js && echo 'PLAN_SIGNAL=YES' >> ACTIONABLE_HUB_BUILD.txt || echo 'PLAN_SIGNAL=NO' >> ACTIONABLE_HUB_BUILD.txt
          grep -q 'function refinedLimitPlan' cloudflare-worker/index.js && echo 'REFINED_LIMIT=YES' >> ACTIONABLE_HUB_BUILD.txt || echo 'REFINED_LIMIT=NO' >> ACTIONABLE_HUB_BUILD.txt
          grep -q 'runFutureGroup' cloudflare-worker/index.js && echo 'FUTURES=YES' >> ACTIONABLE_HUB_BUILD.txt || echo 'FUTURES=NO' >> ACTIONABLE_HUB_BUILD.txt
          grep -q 'symbolPageKeyboard' cloudflare-worker/index.js && echo 'SYMBOL_MENU=YES' >> ACTIONABLE_HUB_BUILD.txt || echo 'SYMBOL_MENU=NO' >> ACTIONABLE_HUB_BUILD.txt
      - name: Commit report
        shell: bash
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add ACTIONABLE_HUB_BUILD.txt
          git commit -m 'Report actionable Hub build validation' || exit 0
          git push origin main
