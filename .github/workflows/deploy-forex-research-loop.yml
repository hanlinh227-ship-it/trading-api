name: Deploy Forex Continuous Research Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/forex_research_loop.py'
      - 'scripts/forex_research_loop_v4.py'
      - 'scripts/forex_research_loop_v5.py'
      - 'scripts/forex_research_guard.py'
      - 'scripts/forex_twelvedata_walkforward_v4.py'
      - 'scripts/forex_twelvedata_walkforward_v5.py'
      - 'scripts/forex_twelvedata_walkforward_v6.py'
      - 'scripts/forex_twelvedata_walkforward_v7.py'
      - 'scripts/forex_twelvedata_walkforward_v7_runtime.py'
      - 'vps/forex-research/**'
      - '.github/workflows/deploy-forex-research-loop.yml'

permissions:
  contents: read

concurrency:
  group: forex-research-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 90
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate VPS and 3AI bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/forex_research_loop.py scripts/forex_research_loop_v4.py scripts/forex_research_loop_v5.py scripts/forex_research_guard.py scripts/forex_twelvedata_walkforward_v4.py scripts/forex_twelvedata_walkforward_v5.py scripts/forex_twelvedata_walkforward_v6.py scripts/forex_twelvedata_walkforward_v7.py scripts/forex_twelvedata_walkforward_v7_runtime.py
          test -n "${TWELVEDATA_API_KEY:-}"
          test -f /etc/trading-v11-ai.env
          systemctl is-active --quiet v11-manual-ai-bridge.service
          PID="$(pgrep -f '/usr/local/bin/v11-manual-ai-bridge' | head -1)"
          test -n "$PID"
          SECRET="$(tr '\0' '\n' < /proc/$PID/environ | sed -n 's/^V11_AI_BRIDGE_SECRET=//p')"
          test -n "$SECRET"
          HEALTH="$(curl -fsS --max-time 5 http://127.0.0.1:8789/health)"
          printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; req={"claude","codex","deepseek"}; assert req<=set(p); assert all(bool((p[n] or {}).get("configured")) for n in req); print("FOREX_3AI_BRIDGE=PASS")'

      - name: Smoke canonical Forex V7 before VPS restart
        shell: bash
        run: |
          set -euo pipefail
          rm -f data/forex-twelvedata-walkforward-latest.json
          BACKTEST_SYMBOLS='EUR/USD' \
          BACKTEST_RANDOM_BLOCKS=1 \
          BACKTEST_BLOCK_DAYS=35 \
          BACKTEST_TEST_DAYS_PER_BLOCK=1 \
          BACKTEST_TRAIN_DAYS_PER_BLOCK=1 \
          BACKTEST_MIN_TEST_DAYS=1 \
          BACKTEST_START=2026-01-05 \
          BACKTEST_END=2026-07-31 \
          TWELVEDATA_INTER_REQUEST_SLEEP=0 \
          FOREX_RESEARCH_MODE=SMOKE \
          timeout 300 python3 scripts/forex_twelvedata_walkforward_v7_runtime.py
          python3 - <<'PY'
          import json
          p='data/forex-twelvedata-walkforward-latest.json'
          d=json.load(open(p))
          assert d.get('mode')=='SMOKE', d.get('mode')
          assert set(d.get('symbols') or {})=={'EURUSD'}
          x=d['symbols']['EURUSD']
          assert not x.get('dataError'), x.get('dataError')
          assert int(x.get('requiredOOSDays') or 0)==1
          assert int(x.get('actualOOSDays') or 0)==1
          assert int(x.get('daysWithEntry') or 0)==1
          print('FOREX_V7_CANONICAL_SMOKE=PASS seed='+str(d.get('seed')))
          PY
          rm -f data/forex-twelvedata-walkforward-latest.json

      - name: Sync canonical repo on VPS
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo mkdir -p /opt/trading
          if sudo git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            if [ -n "$(sudo git -C "$repo" status --porcelain --untracked-files=all)" ]; then
              stamp="$(date +%Y%m%d%H%M%S)"
              sudo git -C "$repo" stash push --include-untracked -m "pre-forex-research-sync-${stamp}"
            fi
          else
            if [ -e "$repo" ]; then sudo mv "$repo" "${repo}.pre-forex-research.$(date +%Y%m%d%H%M%S)"; fi
            sudo git clone https://github.com/hanlinh227-ship-it/trading-api.git "$repo"
          fi
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main

      - name: Restore protected Forex environment
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 700 /etc/trading /var/lib/trading/forex-research
          tmp="$(mktemp)"
          printf '%s\n' \
            "TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}" \
            'FOREX_RESEARCH_REPO=/opt/trading/trading-api-main' \
            'FOREX_RESEARCH_STATE_DIR=/var/lib/trading/forex-research' \
            'FOREX_AI_BRIDGE_URL=http://127.0.0.1:8789/review' \
            'BACKTEST_RANDOM_BLOCKS=10' \
            'BACKTEST_BLOCK_DAYS=35' \
            'BACKTEST_TEST_DAYS_PER_BLOCK=10' \
            'BACKTEST_TRAIN_DAYS_PER_BLOCK=6' \
            'BACKTEST_REQUIRED_RANDOM_DAYS=100' \
            'BACKTEST_MIN_TEST_DAYS=18' \
            'BACKTEST_TARGET_WR=80' \
            'FOREX_RESEARCH_ROUND_PAUSE_SECONDS=3' \
            'FOREX_RESEARCH_AI_RETRIES=5' \
            'FOREX_RESEARCH_BACKOFF_MAX_SECONDS=120' \
            'FOREX_DEV_START=2025-01-06' \
            'FOREX_DEV_END=2025-12-31' \
            'FOREX_ACCEPT_START=2025-01-06' \
            'FOREX_ACCEPT_END=2026-07-31' \
            'FOREX_BACKTEST_TIMEOUT_SECONDS=10800' > "$tmp"
          sudo install -m 600 "$tmp" /etc/trading/forex-research.env
          rm -f "$tmp"
          sudo test -s /etc/trading/forex-research.env

      - name: Install and self-heal Forex service
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 /opt/trading/trading-api-main/vps/forex-research/forex-research-loop.service /etc/systemd/system/forex-research-loop.service
          sudo systemctl daemon-reload
          sudo systemctl stop forex-research-loop.service 2>/dev/null || true
          sudo rm -f /var/lib/trading/forex-research/running.lock
          sudo systemctl reset-failed forex-research-loop.service || true
          sudo systemctl enable forex-research-loop.service
          sudo systemctl start forex-research-loop.service
          for i in $(seq 1 20); do
            if sudo systemctl is-active --quiet forex-research-loop.service; then break; fi
            sleep 1
          done
          sudo systemctl is-active --quiet forex-research-loop.service
          MAINPID="$(sudo systemctl show -p MainPID --value forex-research-loop.service)"
          test "${MAINPID:-0}" -gt 1
          tr '\0' ' ' < "/proc/${MAINPID}/cmdline" | grep -q 'forex_research_guard.py'

      - name: Verify genuinely active 100 day open-strategy loop
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            sudo systemctl is-active --quiet forex-research-loop.service || break
            if [ -s /var/lib/trading/forex-research/state.json ]; then
              if python3 -c 'import json; d=json.load(open("/var/lib/trading/forex-research/state.json")); active={"ACCEPTANCE_RUNNING","3AI_OPEN_STRATEGY_RESEARCH","DEV_MULTI_CANDIDATE_VALIDATION","DEV_REJECTED_RESEARCH_AGAIN","NEXT_FRESH_100_DAY_OOS","TARGET_ACHIEVED_ALL_SYMBOLS"}; assert d.get("mode")=="PAPER_ONLY"; assert d.get("version")=="FOREX-RESEARCH-LOOP-5-OPEN-DSL"; assert d.get("engine")=="V7_DSL_100_RANDOM_DAYS"; assert int(d.get("requiredRandomDays") or 0)==100; assert d.get("status") in active; assert not d.get("lastError"); print("FOREX_100_DAY_LOOP=ACTIVE", "status="+str(d.get("status")), "round="+str(d.get("round")), "engine="+str(d.get("engine")))'; then break; fi
            fi
            sleep 1
          done
          sudo systemctl is-active --quiet forex-research-loop.service

      - name: Validate one fresh strict 100 day evidence
        shell: bash
        run: |
          set -euo pipefail
          STATE=/var/lib/trading/forex-research/state.json
          BASE_COUNT="$(python3 -c 'import json; print(len((json.load(open("/var/lib/trading/forex-research/state.json")).get("history") or [])))')"
          echo "FOREX_FRESH_VALIDATION_BASE_HISTORY=${BASE_COUNT}"
          for i in $(seq 1 210); do
            sudo systemctl is-active --quiet forex-research-loop.service || break
            if python3 - "$BASE_COUNT" <<'PY'
          import json,sys
          from pathlib import Path
          base=int(sys.argv[1])
          state=json.load(open('/var/lib/trading/forex-research/state.json'))
          hist=state.get('history') or []
          if len(hist)<=base:
              raise SystemExit(1)
          h=hist[-1]
          p=Path(str(h.get('evidence') or ''))
          if not p.is_file():
              raise SystemExit(1)
          rep=json.loads(p.read_text())
          assert str(rep.get('mode') or '').upper()=='ACCEPTANCE'
          assert int(rep.get('seed') or -1)==int(h.get('seed') or -2)
          syms=rep.get('symbols') or {}
          expected={'EURUSD','GBPUSD','USDJPY','USDCHF','AUDUSD','NZDUSD','USDCAD','EURJPY','GBPJPY','EURGBP','XAUUSD'}
          assert set(syms)==expected
          for sym,x in syms.items():
              assert not x.get('dataError'), (sym,x.get('dataError'))
              assert int(x.get('requiredOOSDays') or 0)==100, (sym,x.get('requiredOOSDays'))
              assert int(x.get('actualOOSDays') or 0)==100, (sym,x.get('actualOOSDays'))
              assert int(x.get('daysWithEntry') or 0)==100, (sym,x.get('daysWithEntry'))
              assert float(x.get('dailyEntryCoveragePct') or 0)==100.0, (sym,x.get('dailyEntryCoveragePct'))
          print('FOREX_FRESH_100_DAY_ENGINE=PASS round='+str(h.get('round'))+' seed='+str(h.get('seed'))+' strategyPass='+str(h.get('pass')))
          raise SystemExit(0)
          PY
            then
              exit 0
            fi
            sleep 10
          done
          echo 'FOREX_FRESH_100_DAY_ENGINE=FAIL'
          sudo systemctl --no-pager --full status forex-research-loop.service || true
          sudo journalctl -u forex-research-loop.service -n 200 --no-pager || true
          python3 - <<'PY'
          import json
          d=json.load(open('/var/lib/trading/forex-research/state.json'))
          print(json.dumps({'status':d.get('status'),'round':d.get('round'),'lastError':d.get('lastError'),'activeSeed':d.get('activeSeed'),'historyCount':len(d.get('history') or [])},sort_keys=True))
          PY
          exit 1

      - name: Runtime integrity diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('/var/lib/trading/forex-research/state.json')
          d=json.loads(p.read_text())
          assert d.get('status')!='BLOCKED', d.get('lastError')
          assert not d.get('lastError'), d.get('lastError')
          h=d.get('history') or []
          print('FOREX_RUNTIME_STATUS='+str(d.get('status')))
          print('FOREX_RUNTIME_ROUND='+str(d.get('round')))
          print('FOREX_RUNTIME_UPDATED_AT='+str(d.get('updatedAt')))
          print('FOREX_RUNTIME_ACTIVE_SEED='+str(d.get('activeSeed')))
          print('FOREX_RUNTIME_HISTORY_COUNT='+str(len(h)))
          if h:
              x=h[-1]
              print('FOREX_LAST_COMPLETED_ROUND='+str(x.get('round')))
              print('FOREX_LAST_COMPLETED_PASS='+str(x.get('pass')))
              print('FOREX_LAST_COMPLETED_SCORE='+json.dumps(x.get('score') or {},sort_keys=True,separators=(',',':')))
              print('FOREX_LAST_COMPLETED_EVIDENCE='+str(x.get('evidence')))
          print('FOREX_PENDING_FAILED_EVIDENCE='+str(d.get('pendingFailedEvidence')))
          print('FOREX_RESEARCH_CYCLE='+str(d.get('researchCycle')))
          PY
          sudo systemctl is-active forex-research-loop.service
          sudo journalctl -u forex-research-loop.service -n 100 --no-pager | tail -100

      - name: Deployment summary
        shell: bash
        run: |
          echo 'FOREX_RESEARCH_RUNNER=self-hosted,trading-vps'
          echo 'FOREX_RESEARCH_SERVICE=active'
          echo 'FOREX_RESEARCH_ENGINE=V7_DSL_100_RANDOM_DAYS+CANONICAL_ONLY'
          echo 'FOREX_RESEARCH_CONTROLLER=LOOP_V5_OPEN_DSL+INTEGRITY_GUARD'
          echo 'FOREX_RESEARCH_AI=claude,codex,deepseek'
          echo 'FOREX_RESEARCH_MODE=PAPER_ONLY'
