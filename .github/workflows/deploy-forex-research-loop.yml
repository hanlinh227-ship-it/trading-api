name: Deploy Forex Continuous Research Loop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/forex_research_loop.py'
      - 'scripts/forex_research_loop_v4.py'
      - 'scripts/forex_twelvedata_walkforward_v4.py'
      - 'scripts/forex_twelvedata_walkforward_v5.py'
      - 'scripts/forex_twelvedata_walkforward_v6.py'
      - 'vps/forex-research/**'
      - '.github/workflows/deploy-forex-research-loop.yml'

permissions:
  contents: read

concurrency:
  group: forex-research-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    env:
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Validate VPS and 3AI bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/forex_research_loop.py scripts/forex_research_loop_v4.py scripts/forex_twelvedata_walkforward_v4.py scripts/forex_twelvedata_walkforward_v5.py scripts/forex_twelvedata_walkforward_v6.py
          test -n "${TWELVEDATA_API_KEY:-}"
          test -f /etc/trading-v11-ai.env
          systemctl is-active --quiet v11-manual-ai-bridge.service
          PID="$(pgrep -f '/usr/local/bin/v11-manual-ai-bridge' | head -1)"
          test -n "$PID"
          SECRET="$(tr '\0' '\n' < /proc/$PID/environ | sed -n 's/^V11_AI_BRIDGE_SECRET=//p')"
          test -n "$SECRET"
          HEALTH="$(curl -fsS --max-time 5 http://127.0.0.1:8789/health)"
          printf '%s\n' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); p=d.get("providers") or {}; req={"claude","codex","deepseek"}; assert req<=set(p); assert all(bool((p[n] or {}).get("configured")) for n in req); print("FOREX_3AI_BRIDGE=PASS")'

      - name: Sync canonical repo on VPS
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo mkdir -p /opt/trading
          if sudo git -C "$repo" rev-parse --is-inside-work-tree >/dev/null 2>&1; then
            if [ -n "$(sudo git -C "$repo" status --porcelain --untracked-files=all)" ]; then
              stamp="$(date +%Y%m%d%H%M%S)"
              sudo git -C "$repo" stash push --include-untracked -m "pre-forex-research-sync-${stamp}"
            fi
          else
            if [ -e "$repo" ]; then sudo mv "$repo" "${repo}.pre-forex-research.$(date +%Y%m%d%H%M%S)"; fi
            sudo git clone https://github.com/hanlinh227-ship-it/trading-api.git "$repo"
          fi
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo git -C "$repo" checkout -B main origin/main

      - name: Restore protected Forex environment
        shell: bash
        run: |
          set -euo pipefail
          sudo install -d -m 700 /etc/trading /var/lib/trading/forex-research
          tmp="$(mktemp)"
          printf '%s\n' \
            "TWELVEDATA_API_KEY=${TWELVEDATA_API_KEY}" \
            'FOREX_RESEARCH_REPO=/opt/trading/trading-api-main' \
            'FOREX_RESEARCH_STATE_DIR=/var/lib/trading/forex-research' \
            'FOREX_AI_BRIDGE_URL=http://127.0.0.1:8789/review' \
            'BACKTEST_RANDOM_BLOCKS=10' \
            'BACKTEST_BLOCK_DAYS=24' \
            'BACKTEST_TEST_DAYS_PER_BLOCK=10' \
            'BACKTEST_TRAIN_DAYS_PER_BLOCK=6' \
            'BACKTEST_REQUIRED_RANDOM_DAYS=100' \
            'BACKTEST_MIN_TEST_DAYS=18' \
            'BACKTEST_TARGET_WR=80' \
            'FOREX_RESEARCH_ROUND_PAUSE_SECONDS=3' \
            'FOREX_RESEARCH_AI_RETRIES=5' \
            'FOREX_MAX_DEV_RESEARCH_ATTEMPTS=8' \
            'FOREX_DEV_START=2025-01-06' \
            'FOREX_DEV_END=2025-12-31' \
            'FOREX_ACCEPT_START=2025-01-06' \
            'FOREX_ACCEPT_END=2026-07-31' \
            'FOREX_BACKTEST_TIMEOUT_SECONDS=10800' > "$tmp"
          sudo install -m 600 "$tmp" /etc/trading/forex-research.env
          rm -f "$tmp"
          sudo test -s /etc/trading/forex-research.env

      - name: Install and self-heal Forex service
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0644 /opt/trading/trading-api-main/vps/forex-research/forex-research-loop.service /etc/systemd/system/forex-research-loop.service
          sudo systemctl stop forex-research-loop.service 2>/dev/null || true
          sudo rm -f /var/lib/trading/forex-research/running.lock
          sudo systemctl daemon-reload
          sudo systemctl reset-failed forex-research-loop.service || true
          sudo systemctl enable forex-research-loop.service
          sudo systemctl start forex-research-loop.service
          for i in $(seq 1 20); do
            if sudo systemctl is-active --quiet forex-research-loop.service; then break; fi
            sleep 1
          done
          sudo systemctl is-active --quiet forex-research-loop.service

      - name: Verify 100 day research loop is alive
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if [ -s /var/lib/trading/forex-research/state.json ]; then
              if python3 -c 'import json; d=json.load(open("/var/lib/trading/forex-research/state.json")); assert d.get("mode")=="PAPER_ONLY"; assert d.get("version")=="FOREX-RESEARCH-LOOP-4-100-DAYS"; assert int(d.get("requiredRandomDays") or 0)==100; assert d.get("status") in {"INIT","ACCEPTANCE_RUNNING","3AI_RESEARCH","DEV_VALIDATION","DEV_REJECTED_RESEARCH_AGAIN","NEXT_FRESH_100_DAY_OOS","TARGET_ACHIEVED_ALL_SYMBOLS"}; print("FOREX_100_DAY_LOOP=ACTIVE", "status="+str(d.get("status")), "round="+str(d.get("round")))'; then exit 0; fi
            fi
            sleep 1
          done
          sudo systemctl --no-pager --full status forex-research-loop.service || true
          sudo journalctl -u forex-research-loop.service -n 80 --no-pager || true
          exit 1

      - name: Deployment summary
        shell: bash
        run: |
          echo 'FOREX_RESEARCH_RUNNER=self-hosted,trading-vps'
          echo 'FOREX_RESEARCH_SERVICE=active'
          echo 'FOREX_RESEARCH_ENGINE=V6_100_RANDOM_DAYS'
          echo 'FOREX_RESEARCH_CONTROLLER=LOOP_V4_100_DAYS'
          echo 'FOREX_RESEARCH_AI=claude,codex,deepseek'
          echo 'FOREX_RESEARCH_MODE=PAPER_ONLY'
