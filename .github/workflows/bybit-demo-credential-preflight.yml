name: Bybit Demo Credential Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-demo-credential-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    env:
      BYBIT_DEMO_API_KEY: ${{ secrets.BYBIT_DEMO_API_KEY }}
      BYBIT_DEMO_API_SECRET: ${{ secrets.BYBIT_DEMO_API_SECRET }}
      BYBIT_TESTNET_API_KEY: ${{ secrets.BYBIT_TESTNET_API_KEY }}
      BYBIT_TESTNET_API_SECRET: ${{ secrets.BYBIT_TESTNET_API_SECRET }}
      HYRO_BYBIT_DEMO_API_KEY: ${{ secrets.HYRO_BYBIT_DEMO_API_KEY }}
      HYRO_BYBIT_DEMO_API_SECRET: ${{ secrets.HYRO_BYBIT_DEMO_API_SECRET }}
    steps:
      - name: Check demo aliases and VPS env names without exposing values
        shell: bash
        run: |
          set -euo pipefail
          flag(){ if [ -n "${!1:-}" ]; then echo "$1=SET"; else echo "$1=EMPTY"; fi; }
          for k in BYBIT_DEMO_API_KEY BYBIT_DEMO_API_SECRET BYBIT_TESTNET_API_KEY BYBIT_TESTNET_API_SECRET HYRO_BYBIT_DEMO_API_KEY HYRO_BYBIT_DEMO_API_SECRET; do flag "$k"; done
          echo 'VPS_BYBIT_ENV_NAMES_BEGIN'
          for f in /etc/trading/*.env /etc/default/* /etc/environment; do
            [ -f "$f" ] || continue
            sudo awk -F= '/^[A-Za-z_][A-Za-z0-9_]*=/ {print $1}' "$f" 2>/dev/null | grep -Ei 'BYBIT.*(DEMO|TESTNET)|(?:DEMO|TESTNET).*BYBIT' || true
          done | sort -u
          echo 'VPS_BYBIT_ENV_NAMES_END'
          echo 'BYBIT_DEMO_PREFLIGHT_DONE'
