name: Bybit Demo Credential Preflight
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bybit-demo-credential-preflight.yml'
permissions:
  contents: read
jobs:
  preflight:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    env:
      HYRO_BYBIT_API_KEY: ${{ secrets.HYRO_BYBIT_API_KEY }}
      HYRO_BYBIT_API_SECRET: ${{ secrets.HYRO_BYBIT_API_SECRET }}
      HYRO_BYBIT_LIVE_API_KEY: ${{ secrets.HYRO_BYBIT_LIVE_API_KEY }}
      HYRO_BYBIT_LIVE_API_SECRET: ${{ secrets.HYRO_BYBIT_LIVE_API_SECRET }}
    steps:
      - name: Check canonical Hyro demo aliases without exposing values
        shell: bash
        run: |
          set -euo pipefail
          flag(){ if [ -n "${!1:-}" ]; then echo "$1=SET"; else echo "$1=EMPTY"; fi; }
          for k in HYRO_BYBIT_API_KEY HYRO_BYBIT_API_SECRET HYRO_BYBIT_LIVE_API_KEY HYRO_BYBIT_LIVE_API_SECRET; do flag "$k"; done
          echo 'HYRO_DEMO_ENDPOINT=https://api-demo.bybit.com'
          if [ -n "${HYRO_BYBIT_API_KEY:-}" ] && [ -n "${HYRO_BYBIT_API_SECRET:-}" ]; then
            echo 'HYRO_BYBIT_DEMO_CREDENTIAL_PAIR=READY'
          else
            echo 'HYRO_BYBIT_DEMO_CREDENTIAL_PAIR=MISSING'
            exit 2
          fi
