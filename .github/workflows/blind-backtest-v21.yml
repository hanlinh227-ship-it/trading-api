name: Blind Crypto Backtest V21
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v21.py'
      - '.github/workflows/blind-backtest-v21.yml'
  workflow_dispatch:
jobs:
  v21:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v21.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v21.json
          git commit -m "Run V21 per-coin blind" || exit 0
          git pull --rebase origin main || true
          git push || true
