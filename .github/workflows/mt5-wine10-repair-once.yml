# trigger: apply Wine10 compatibility repair now
name: MT5 Wine10 Repair Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-wine10-repair-once.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-wine10-repair-once
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Pin WineHQ 10 for MetaEditor compiler compatibility
        shell: python
        run: |
          from pathlib import Path
          p=Path('vps/mt5-forex/install-mt5-forex.sh')
          s=p.read_text()
          old='''WINEHQ_VERSION="${MT5_WINE_COMPAT_VERSION:-$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | head -n1 || true)}"
[[ -n "$WINEHQ_VERSION" ]] || { echo "ERROR: WineHQ stable unavailable" >&2; exit 56; }'''
          new='''PINNED_WINEHQ_VERSION="${MT5_WINE_COMPAT_VERSION:-10.0.0.0~${CODENAME}-1}"
if apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | grep -Fxq "$PINNED_WINEHQ_VERSION"; then
  WINEHQ_VERSION="$PINNED_WINEHQ_VERSION"
  echo "MT5_WINE_COMPAT_PIN=ACTIVE version=$WINEHQ_VERSION"
else
  WINEHQ_VERSION="$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | awk '$0 ~ /^10\\./ {print; exit}' || true)"
  if [[ -z "$WINEHQ_VERSION" ]]; then
    WINEHQ_VERSION="$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | head -n1 || true)"
  fi
  echo "MT5_WINE_COMPAT_PIN=FALLBACK version=${WINEHQ_VERSION:-MISSING}"
fi
[[ -n "$WINEHQ_VERSION" ]] || { echo "ERROR: WineHQ stable unavailable" >&2; exit 56; }'''
          if old not in s:
              raise SystemExit('canonical Wine selector not found')
          p.write_text(s.replace(old,new,1))
      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mt5-wine10-repair-once.yml
          git add vps/mt5-forex/install-mt5-forex.sh
          git diff --cached --check
          git commit -m 'mt5: pin MetaEditor runtime to WineHQ 10'
          git push origin HEAD:main
