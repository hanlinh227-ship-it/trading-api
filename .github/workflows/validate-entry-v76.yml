name: Validate Entry V76

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/research_v76_entry_forex.py'
      - 'scripts/evaluate_v76_entry_forex.py'
      - 'scripts/fetch_v76_history.py'
      - 'scripts/run_v76_entry_research.py'
      - 'scripts/entry_v76.py'
      - 'data/v76_entry_methods.json'
      - '.github/workflows/validate-entry-v76.yml'

permissions:
  contents: read

concurrency:
  group: validate-entry-v76
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile V76 modules
        run: |
          python -m py_compile \
            scripts/research_v76_entry_forex.py \
            scripts/evaluate_v76_entry_forex.py \
            scripts/fetch_v76_history.py \
            scripts/run_v76_entry_research.py \
            scripts/entry_v76.py
      - name: Validate frozen research definitions
        run: python scripts/research_v76_entry_forex.py --self-test
      - name: Validate grouped history geometry
        run: python scripts/fetch_v76_history.py
      - name: Validate evaluator protocol
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import evaluate_v76_entry_forex as ev
          p=ev.protocol_summary()
          assert p['split']=='chronological 60/20/20'
          assert p['oosMinN'] >= 20
          assert 'conservative' in p['limitFillBar']
          print(p)
          PY
      - name: Validate locked methods when present
        run: |
          if [ -f data/v76_entry_methods.json ]; then
            python scripts/entry_v76.py --validate --methods data/v76_entry_methods.json
          else
            echo 'No methods file yet; code validation only.'
          fi
      - name: Verify V73 remains frozen
        run: |
          test -f data/nocut_intraday_allpass_v73.json
          test ! -f scripts/build_nocut_allpass_v73.py
          test ! -f .github/workflows/build-nocut-allpass-v73.yml
