name: Offline Crypto Remaining20 V49 Matrix
on:
  push:
    paths:
      - 'scripts/offline_crypto_remaining20_v49_matrix.py'
      - '.github/workflows/offline-crypto-remaining20-v49-matrix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  symbol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        symbol: [AAVE,ALGO,ARB,AVAX,DOT,FIL,FLOKI,INJ,JUP,LDO,LINK,MOODENG,NEAR,ONDO,POL,S,SUI,WIF,WLD,XPL]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q numpy scikit-learn
      - name: Optimize and validate coin
        env:
          PYTHONPATH: '.'
          PYTHONUNBUFFERED: '1'
          TARGET_SYMBOL: ${{ matrix.symbol }}
        run: python scripts/offline_crypto_remaining20_v49_matrix.py
