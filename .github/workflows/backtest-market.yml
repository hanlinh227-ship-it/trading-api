name: Blind Market Backtest

on:
  push:
    paths:
      - "backtest-request.json"

  workflow_dispatch:

permissions:
  contents: write

# ============================================================
# BACKTEST V2 — STRICT ANTI-LOOKAHEAD
#
# Dùng chung khóa quota với LIVE và Forex Scan.
# ============================================================

concurrency:
  group: twelvedata-api
  cancel-in-progress: false


jobs:

  backtest:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. CHECKOUT
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ======================================================
      # 2. INITIALIZE
      # ======================================================

      - name: Initialize
        shell: bash
        run: |
          mkdir -p data
          mkdir -p data/backtest-temp


      # ======================================================
      # 3. READ REQUEST
      # ======================================================

      - name: Read backtest request
        id: request
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys
          from datetime import datetime
          from zoneinfo import ZoneInfo

          with open(
              "backtest-request.json",
              "r",
              encoding="utf-8"
          ) as f:
              req = json.load(f)

          symbol = str(
              req.get("symbol", "")
          ).upper().strip()

          cutoff = str(
              req.get("cutoff", "")
          ).strip()

          timezone_name = str(
              req.get(
                  "timezone",
                  "Asia/Ho_Chi_Minh"
              )
          ).strip()

          phase = str(
              req.get(
                  "phase",
                  "blind"
              )
          ).lower().strip()

          request_id = req.get(
              "id",
              0
          )

          if not symbol:
              print("ERROR: missing symbol")
              sys.exit(1)

          if phase not in (
              "blind",
              "reveal"
          ):
              print(
                  "ERROR: phase must be "
                  "blind or reveal"
              )
              sys.exit(1)

          try:
              ZoneInfo(
                  timezone_name
              )
          except Exception:
              print(
                  "ERROR: invalid timezone:",
                  timezone_name
              )
              sys.exit(1)

          try:
              parsed_cutoff = (
                  datetime.fromisoformat(
                      cutoff
                  )
              )
          except Exception:
              print(
                  "ERROR: cutoff format must be "
                  "YYYY-MM-DDTHH:MM:SS"
              )
              sys.exit(1)

          if (
              parsed_cutoff.second != 0
              or parsed_cutoff.microsecond != 0
          ):
              print(
                  "ERROR: cutoff must be aligned "
                  "to a whole minute."
              )
              sys.exit(1)

          print("==============================")
          print("BACKTEST REQUEST")
          print("Symbol:", symbol)
          print("Cutoff:", cutoff)
          print("Timezone:", timezone_name)
          print("Phase:", phase)
          print("ID:", request_id)
          print("==============================")
          PY

          SYMBOL=$(python3 - <<'PY'
          import json

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          print(
              d["symbol"].upper()
          )
          PY
          )

          CUTOFF=$(python3 - <<'PY'
          import json

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          print(
              d["cutoff"]
          )
          PY
          )

          TIMEZONE=$(python3 - <<'PY'
          import json

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          print(
              d.get(
                  "timezone",
                  "Asia/Ho_Chi_Minh"
              )
          )
          PY
          )

          PHASE=$(python3 - <<'PY'
          import json

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          print(
              d.get(
                  "phase",
                  "blind"
              ).lower()
          )
          PY
          )

          REQUEST_ID=$(python3 - <<'PY'
          import json

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:
              d = json.load(f)

          print(
              d.get(
                  "id",
                  0
              )
          )
          PY
          )

          echo \
            "symbol=$SYMBOL" \
            >> "$GITHUB_OUTPUT"

          echo \
            "cutoff=$CUTOFF" \
            >> "$GITHUB_OUTPUT"

          echo \
            "timezone=$TIMEZONE" \
            >> "$GITHUB_OUTPUT"

          echo \
            "phase=$PHASE" \
            >> "$GITHUB_OUTPUT"

          echo \
            "request_id=$REQUEST_ID" \
            >> "$GITHUB_OUTPUT"


      # ======================================================
      # 4. MAP SYMBOL
      # ======================================================

      - name: Map Twelve Data symbol
        id: map
        shell: bash
        run: |
          SYMBOL="${{ steps.request.outputs.symbol }}"

          TD_SYMBOL=$(python3 - "$SYMBOL" <<'PY'
          import sys

          s = sys.argv[1].upper()

          aliases = {
              "XAUUSD": "XAU/USD",
              "XAGUSD": "XAG/USD",
              "XPTUSD": "XPT/USD",
              "XPDUSD": "XPD/USD"
          }

          if s in aliases:

              print(
                  aliases[s]
              )

              raise SystemExit

          quotes = [
              "USDT",
              "USDC",
              "USD",
              "EUR",
              "GBP",
              "JPY",
              "CHF",
              "CAD",
              "AUD",
              "NZD",
              "BTC",
              "ETH"
          ]

          for quote in quotes:

              if (
                  s.endswith(
                      quote
                  )
                  and
                  len(s) > len(quote)
              ):

                  base = s[
                      :-len(quote)
                  ]

                  print(
                      f"{base}/{quote}"
                  )

                  raise SystemExit

          print(s)
          PY
          )

          echo \
            "td_symbol=$TD_SYMBOL" \
            >> "$GITHUB_OUTPUT"

          echo \
            "Twelve Data symbol: $TD_SYMBOL"


      # ======================================================
      # 5. CHECK SECRET
      # ======================================================

      - name: Check Twelve Data secret
        shell: bash
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          if [ -z "$TD_API_KEY" ]; then

            echo \
              "ERROR: TWELVEDATA_API_KEY missing."

            exit 1

          fi

          echo "API key configured."


      # ======================================================
      # ================= BLIND PHASE =========================
      # ======================================================


      # ======================================================
      # 6. FETCH D1
      #
      # D1 vẫn được fetch tới cutoff nhưng V2 sẽ tự loại
      # ngày hiện tại ở bước FILTER.
      #
      # Lý do:
      # timezone của Twelve Data không áp dụng cho D1.
      # ======================================================

      - name: Blind - Fetch D1
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          TD_SYMBOL="${{ steps.map.outputs.td_symbol }}"
          CUTOFF="${{ steps.request.outputs.cutoff }}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --get \
            "https://api.twelvedata.com/time_series" \
            --data-urlencode "symbol=$TD_SYMBOL" \
            --data-urlencode "interval=1day" \
            --data-urlencode "outputsize=250" \
            --data-urlencode "end_date=$CUTOFF" \
            --data-urlencode "order=asc" \
            --data-urlencode "apikey=$TD_API_KEY" \
            -o data/backtest-temp/D1-raw.json


      # ======================================================
      # 7. WAIT
      # ======================================================

      - name: Blind - Wait quota 1
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        run: |
          sleep 65


      # ======================================================
      # 8. FETCH H4/H1/M15/M5
      # ======================================================

      - name: Blind - Fetch intraday group
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          TD_SYMBOL="${{ steps.map.outputs.td_symbol }}"
          CUTOFF="${{ steps.request.outputs.cutoff }}"
          TIMEZONE="${{ steps.request.outputs.timezone }}"

          fetch_frame () {

            INTERVAL="$1"
            NAME="$2"

            echo \
              "Fetching $NAME"

            curl \
              --fail-with-body \
              --silent \
              --show-error \
              --location \
              --get \
              "https://api.twelvedata.com/time_series" \
              --data-urlencode "symbol=$TD_SYMBOL" \
              --data-urlencode "interval=$INTERVAL" \
              --data-urlencode "outputsize=250" \
              --data-urlencode "end_date=$CUTOFF" \
              --data-urlencode "timezone=$TIMEZONE" \
              --data-urlencode "order=asc" \
              --data-urlencode "apikey=$TD_API_KEY" \
              -o \
              "data/backtest-temp/$NAME-raw.json"
          }

          fetch_frame \
            "4h" \
            "H4"

          fetch_frame \
            "1h" \
            "H1"

          fetch_frame \
            "15min" \
            "M15"

          fetch_frame \
            "5min" \
            "M5"


      # ======================================================
      # 9. WAIT
      # ======================================================

      - name: Blind - Wait quota 2
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        run: |
          sleep 65


      # ======================================================
      # 10. FETCH M1
      # ======================================================

      - name: Blind - Fetch M1
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          TD_SYMBOL="${{ steps.map.outputs.td_symbol }}"
          CUTOFF="${{ steps.request.outputs.cutoff }}"
          TIMEZONE="${{ steps.request.outputs.timezone }}"

          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --get \
            "https://api.twelvedata.com/time_series" \
            --data-urlencode "symbol=$TD_SYMBOL" \
            --data-urlencode "interval=1min" \
            --data-urlencode "outputsize=250" \
            --data-urlencode "end_date=$CUTOFF" \
            --data-urlencode "timezone=$TIMEZONE" \
            --data-urlencode "order=asc" \
            --data-urlencode "apikey=$TD_API_KEY" \
            -o data/backtest-temp/M1-raw.json


      # ======================================================
      # 11. STRICT CLOSED-CANDLE FILTER
      #
      # QUY TẮC:
      #
      # Intraday:
      # candle_start + duration <= cutoff
      #
      # D1:
      # candle date < cutoff local date
      #
      # Ví dụ cutoff 10:00:
      #
      # H4 -> latest 04:00
      # H1 -> latest 09:00
      # M15 -> latest 09:45
      # M5 -> latest 09:55
      # M1 -> latest 09:59
      #
      # Nến chưa đóng bị loại.
      # ======================================================

      - name: Blind - Remove incomplete candles
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys

          from datetime import (
              datetime,
              timedelta
          )

          from zoneinfo import (
              ZoneInfo
          )


          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              req = json.load(f)


          timezone_name = req.get(
              "timezone",
              "Asia/Ho_Chi_Minh"
          )

          tz = ZoneInfo(
              timezone_name
          )

          cutoff_naive = (
              datetime.fromisoformat(
                  req["cutoff"]
              )
          )

          cutoff = cutoff_naive.replace(
              tzinfo=tz
          )


          intervals = {

              "H4":
                  timedelta(
                      hours=4
                  ),

              "H1":
                  timedelta(
                      hours=1
                  ),

              "M15":
                  timedelta(
                      minutes=15
                  ),

              "M5":
                  timedelta(
                      minutes=5
                  ),

              "M1":
                  timedelta(
                      minutes=1
                  )
          }


          def load_api(
              path
          ):

              try:

                  with open(
                      path,
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

              except Exception as e:

                  print(
                      "ERROR reading",
                      path,
                      e
                  )

                  sys.exit(1)

              if (
                  data.get(
                      "status"
                  )
                  ==
                  "error"
              ):

                  print(
                      "Twelve Data error:",
                      json.dumps(
                          data,
                          indent=2
                      )
                  )

                  sys.exit(1)

              values = data.get(
                  "values",
                  []
              )

              if not values:

                  print(
                      "ERROR: no values in",
                      path
                  )

                  sys.exit(1)

              return (
                  data,
                  values
              )


          # ================================================
          # D1 FILTER
          #
          # Không dùng candle cùng calendar date với cutoff.
          #
          # Đây là cách bảo thủ để tránh partial D1 leakage.
          # ================================================

          d1_raw, d1_values = load_api(
              "data/backtest-temp/"
              "D1-raw.json"
          )

          d1_filtered = []

          cutoff_date = (
              cutoff.date()
          )

          removed_d1 = []

          for row in d1_values:

              try:

                  candle_date = (
                      datetime.strptime(
                          row[
                              "datetime"
                          ][
                              :10
                          ],
                          "%Y-%m-%d"
                      ).date()
                  )

              except Exception:

                  continue

              if (
                  candle_date
                  <
                  cutoff_date
              ):

                  d1_filtered.append(
                      row
                  )

              else:

                  removed_d1.append(
                      row[
                          "datetime"
                      ]
                  )


          if not d1_filtered:

              print(
                  "ERROR: no closed D1 candles."
              )

              sys.exit(1)


          d1_out = dict(
              d1_raw
          )

          d1_out[
              "values"
          ] = d1_filtered


          with open(
              "data/backtest-temp/"
              "D1.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  d1_out,
                  f,
                  ensure_ascii=False
              )


          # ================================================
          # INTRADAY FILTER
          # ================================================

          last_closed = {}

          removed = {}


          for (
              name,
              duration
          ) in intervals.items():

              raw_path = (
                  f"data/backtest-temp/"
                  f"{name}-raw.json"
              )

              raw, values = load_api(
                  raw_path
              )

              good = []
              rejected = []


              for row in values:

                  dt_text = row.get(
                      "datetime"
                  )

                  if not dt_text:
                      continue


                  try:

                      start_naive = (
                          datetime.fromisoformat(
                              dt_text
                          )
                      )

                  except Exception:

                      rejected.append(
                          dt_text
                      )

                      continue


                  start = (
                      start_naive.replace(
                          tzinfo=tz
                      )
                  )

                  close_time = (
                      start
                      +
                      duration
                  )


                  if (
                      close_time
                      <=
                      cutoff
                  ):

                      good.append(
                          row
                      )

                  else:

                      rejected.append(
                          dt_text
                      )


              if not good:

                  print(
                      "ERROR:",
                      name,
                      "has no closed candles."
                  )

                  sys.exit(1)


              filtered = dict(
                  raw
              )

              filtered[
                  "values"
              ] = good


              with open(
                  f"data/backtest-temp/"
                  f"{name}.json",
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      filtered,
                      f,
                      ensure_ascii=False
                  )


              last_closed[
                  name
              ] = good[-1][
                  "datetime"
              ]

              removed[
                  name
              ] = rejected


          metadata = {

              "cutoff":
                  req[
                      "cutoff"
                  ],

              "timezone":
                  timezone_name,

              "lastClosedD1":
                  d1_filtered[
                      -1
                  ][
                      "datetime"
                  ],

              "lastClosed":
                  last_closed,

              "removedIncomplete": {

                  "D1":
                      removed_d1,

                  **removed
              }
          }


          with open(
              "data/backtest-temp/"
              "filter-metadata.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  metadata,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("================================")
          print("STRICT CANDLE FILTER PASS")
          print(
              "D1:",
              metadata[
                  "lastClosedD1"
              ]
          )

          for name in [
              "H4",
              "H1",
              "M15",
              "M5",
              "M1"
          ]:

              print(
                  name,
                  ":",
                  last_closed[
                      name
                  ]
              )

          print("================================")
          PY


      # ======================================================
      # 12. ANTI-LOOKAHEAD VALIDATOR
      #
      # Đọc lại toàn bộ file sau filter.
      # Nếu còn cây chưa đóng -> FAIL.
      # ======================================================

      - name: Blind - Anti look-ahead validation
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys

          from datetime import (
              datetime,
              timedelta
          )

          from zoneinfo import (
              ZoneInfo
          )


          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              req = json.load(f)


          tz = ZoneInfo(
              req.get(
                  "timezone",
                  "Asia/Ho_Chi_Minh"
              )
          )


          cutoff = (
              datetime.fromisoformat(
                  req[
                      "cutoff"
                  ]
              ).replace(
                  tzinfo=tz
              )
          )


          interval_map = {

              "H4":
                  timedelta(
                      hours=4
                  ),

              "H1":
                  timedelta(
                      hours=1
                  ),

              "M15":
                  timedelta(
                      minutes=15
                  ),

              "M5":
                  timedelta(
                      minutes=5
                  ),

              "M1":
                  timedelta(
                      minutes=1
                  )
          }


          violations = []


          # ================================================
          # D1
          # ================================================

          with open(
              "data/backtest-temp/"
              "D1.json",
              encoding="utf-8"
          ) as f:

              d1 = json.load(f)


          for row in d1[
              "values"
          ]:

              candle_date = (
                  datetime.strptime(
                      row[
                          "datetime"
                      ][
                          :10
                      ],
                      "%Y-%m-%d"
                  ).date()
              )

              if (
                  candle_date
                  >=
                  cutoff.date()
              ):

                  violations.append(
                      "D1 "
                      +
                      row[
                          "datetime"
                      ]
                  )


          # ================================================
          # INTRADAY
          # ================================================

          for (
              name,
              duration
          ) in interval_map.items():

              with open(
                  f"data/backtest-temp/"
                  f"{name}.json",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)


              for row in data[
                  "values"
              ]:

                  start = (
                      datetime.fromisoformat(
                          row[
                              "datetime"
                          ]
                      ).replace(
                          tzinfo=tz
                      )
                  )

                  close_time = (
                      start
                      +
                      duration
                  )

                  if (
                      close_time
                      >
                      cutoff
                  ):

                      violations.append(
                          name
                          +
                          " "
                          +
                          row[
                              "datetime"
                          ]
                      )


          if violations:

              print(
                  "LOOK-AHEAD DETECTED!"
              )

              for item in violations:

                  print(
                      item
                  )

              sys.exit(1)


          print(
              "ANTI-LOOKAHEAD VALIDATION PASS"
          )

          print(
              "No incomplete/future candles."
          )
          PY


      # ======================================================
      # 13. BUILD BLIND SNAPSHOT
      # ======================================================

      - name: Blind - Build clean snapshot
        if: steps.request.outputs.phase == 'blind'
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys

          from datetime import (
              datetime,
              timezone
          )


          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              req = json.load(f)


          with open(
              "data/backtest-temp/"
              "filter-metadata.json",
              encoding="utf-8"
          ) as f:

              filter_meta = (
                  json.load(f)
              )


          files = {

              "D1":
                  "data/backtest-temp/"
                  "D1.json",

              "H4":
                  "data/backtest-temp/"
                  "H4.json",

              "H1":
                  "data/backtest-temp/"
                  "H1.json",

              "M15":
                  "data/backtest-temp/"
                  "M15.json",

              "M5":
                  "data/backtest-temp/"
                  "M5.json",

              "M1":
                  "data/backtest-temp/"
                  "M1.json"
          }


          def load_rows(
              path
          ):

              with open(
                  path,
                  encoding="utf-8"
              ) as f:

                  raw = json.load(f)


              values = raw.get(
                  "values",
                  []
              )


              rows = []


              for item in values:

                  try:

                      rows.append({

                          "datetime":
                              item[
                                  "datetime"
                              ],

                          "open":
                              float(
                                  item[
                                      "open"
                                  ]
                              ),

                          "high":
                              float(
                                  item[
                                      "high"
                                  ]
                              ),

                          "low":
                              float(
                                  item[
                                      "low"
                                  ]
                              ),

                          "close":
                              float(
                                  item[
                                      "close"
                                  ]
                              )
                      })

                  except Exception:

                      continue


              if not rows:

                  raise RuntimeError(
                      "No valid rows: "
                      +
                      path
                  )


              return rows


          def ema(
              values,
              period
          ):

              if (
                  len(values)
                  <
                  period
              ):

                  return None


              value = (
                  sum(
                      values[
                          :period
                      ]
                  )
                  /
                  period
              )


              alpha = (
                  2
                  /
                  (
                      period
                      +
                      1
                  )
              )


              for current in values[
                  period:
              ]:

                  value = (
                      alpha
                      *
                      current
                      +
                      (
                          1
                          -
                          alpha
                      )
                      *
                      value
                  )


              return value


          def rsi(
              values,
              period=14
          ):

              if (
                  len(values)
                  <=
                  period
              ):

                  return None


              gains = []
              losses = []


              for i in range(
                  1,
                  len(values)
              ):

                  diff = (
                      values[
                          i
                      ]
                      -
                      values[
                          i - 1
                      ]
                  )

                  gains.append(
                      max(
                          diff,
                          0
                      )
                  )

                  losses.append(
                      max(
                          -diff,
                          0
                      )
                  )


              avg_gain = (
                  sum(
                      gains[
                          :period
                      ]
                  )
                  /
                  period
              )

              avg_loss = (
                  sum(
                      losses[
                          :period
                      ]
                  )
                  /
                  period
              )


              for (
                  gain,
                  loss
              ) in zip(
                  gains[
                      period:
                  ],
                  losses[
                      period:
                  ]
              ):

                  avg_gain = (
                      (
                          avg_gain
                          *
                          (
                              period
                              -
                              1
                          )
                      )
                      +
                      gain
                  ) / period


                  avg_loss = (
                      (
                          avg_loss
                          *
                          (
                              period
                              -
                              1
                          )
                      )
                      +
                      loss
                  ) / period


              if avg_loss == 0:

                  return 100.0


              rs = (
                  avg_gain
                  /
                  avg_loss
              )


              return (
                  100
                  -
                  (
                      100
                      /
                      (
                          1
                          +
                          rs
                      )
                  )
              )


          def atr(
              rows,
              period=14
          ):

              if (
                  len(rows)
                  <=
                  period
              ):

                  return None


              true_ranges = []


              for i in range(
                  1,
                  len(rows)
              ):

                  high = rows[
                      i
                  ][
                      "high"
                  ]

                  low = rows[
                      i
                  ][
                      "low"
                  ]

                  previous_close = (
                      rows[
                          i - 1
                      ][
                          "close"
                      ]
                  )


                  tr = max(

                      high
                      -
                      low,

                      abs(
                          high
                          -
                          previous_close
                      ),

                      abs(
                          low
                          -
                          previous_close
                      )
                  )


                  true_ranges.append(
                      tr
                  )


              value = (
                  sum(
                      true_ranges[
                          :period
                      ]
                  )
                  /
                  period
              )


              for tr in true_ranges[
                  period:
              ]:

                  value = (
                      (
                          value
                          *
                          (
                              period
                              -
                              1
                          )
                      )
                      +
                      tr
                  ) / period


              return value


          frames = {}


          for (
              name,
              path
          ) in files.items():

              rows = load_rows(
                  path
              )


              closes = [
                  row[
                      "close"
                  ]
                  for row
                  in rows
              ]


              latest = rows[
                  -1
              ]


              recent = (
                  rows[
                      -50:
                  ]
                  if len(
                      rows
                  )
                  >=
                  50
                  else rows
              )


              e20 = ema(
                  closes,
                  20
              )

              e50 = ema(
                  closes,
                  50
              )

              e200 = ema(
                  closes,
                  200
              )

              r14 = rsi(
                  closes,
                  14
              )

              a14 = atr(
                  rows,
                  14
              )


              trend = "neutral"


              if (
                  e20 is not None
                  and
                  e50 is not None
              ):

                  if (
                      latest[
                          "close"
                      ]
                      >
                      e20
                      >
                      e50
                  ):

                      trend = (
                          "bullish"
                      )


                  elif (
                      latest[
                          "close"
                      ]
                      <
                      e20
                      <
                      e50
                  ):

                      trend = (
                          "bearish"
                      )


              frames[
                  name
              ] = {

                  "latestClosedCandle":
                      latest,

                  "summary": {

                      "close":
                          latest[
                              "close"
                          ],

                      "ema20":
                          e20,

                      "ema50":
                          e50,

                      "ema200":
                          e200,

                      "rsi14":
                          r14,

                      "atr14":
                          a14,

                      "recent50High":
                          max(
                              row[
                                  "high"
                              ]
                              for row
                              in recent
                          ),

                      "recent50Low":
                          min(
                              row[
                                  "low"
                              ]
                              for row
                              in recent
                          ),

                      "trend":
                          trend
                  },

                  "recentClosedCandles":
                      rows[
                          -20:
                      ]
              }


          output = {

              "status":
                  "ok",

              "mode":
                  "BLIND_BACKTEST_V2",

              "phase":
                  "blind",

              "symbol":
                  req[
                      "symbol"
                  ].upper(),

              "cutoff":
                  req[
                      "cutoff"
                  ],

              "timezone":
                  req.get(
                      "timezone",
                      "Asia/Ho_Chi_Minh"
                  ),

              "requestId":
                  req.get(
                      "id",
                      0
                  ),

              "futureDataIncluded":
                  False,

              "lookAheadDetected":
                  False,

              "lookAheadProtection":
                  "STRICT_CLOSED_CANDLES",

              "lastClosed": {

                  "D1":
                      filter_meta[
                          "lastClosedD1"
                      ],

                  **filter_meta[
                      "lastClosed"
                  ]
              },

              "frames":
                  frames,

              "dataGuard": {

                  "cutoffLocked":
                      True,

                  "onlyClosedCandles":
                      True,

                  "incompleteCandlesRemoved":
                      True,

                  "futureDataIncluded":
                      False,

                  "lookAheadDetected":
                      False,

                  "revealAllowed":
                      False
              },

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }


          with open(
              "data/backtest-blind.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("================================")
          print("BLIND BACKTEST V2 READY")
          print(
              "Symbol:",
              output[
                  "symbol"
              ]
          )

          print(
              "Cutoff:",
              output[
                  "cutoff"
              ]
          )

          print(
              "Future data:",
              output[
                  "futureDataIncluded"
              ]
          )

          print(
              "Look-ahead:",
              output[
                  "lookAheadDetected"
              ]
          )

          print("LAST CLOSED:")

          for (
              key,
              value
          ) in output[
              "lastClosed"
          ].items():

              print(
                  key,
                  value
              )

          print("================================")
          PY


      # ======================================================
      # ================= REVEAL PHASE ========================
      # ======================================================


      # ======================================================
      # 14. VERIFY BLIND FILE
      # ======================================================

      - name: Reveal - Verify blind snapshot
        if: steps.request.outputs.phase == 'reveal'
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import sys


          path = (
              "data/"
              "backtest-blind.json"
          )


          if not os.path.exists(
              path
          ):

              print(
                  "ERROR: blind snapshot missing."
              )

              sys.exit(1)


          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              req = json.load(f)


          with open(
              path,
              encoding="utf-8"
          ) as f:

              blind = json.load(f)


          if (
              blind.get(
                  "lookAheadDetected"
              )
              is not False
          ):

              print(
                  "ERROR: blind snapshot "
                  "did not pass look-ahead protection."
              )

              sys.exit(1)


          if (
              blind.get(
                  "futureDataIncluded"
              )
              is not False
          ):

              print(
                  "ERROR: blind contains future data."
              )

              sys.exit(1)


          if (
              blind.get(
                  "symbol"
              )
              !=
              req[
                  "symbol"
              ].upper()
          ):

              print(
                  "ERROR: symbol mismatch."
              )

              sys.exit(1)


          if (
              blind.get(
                  "cutoff"
              )
              !=
              req[
                  "cutoff"
              ]
          ):

              print(
                  "ERROR: cutoff mismatch."
              )

              sys.exit(1)


          print(
              "Reveal authorization PASS"
          )
          PY


      # ======================================================
      # 15. FETCH FUTURE M5
      # ======================================================

      - name: Reveal - Fetch future M5
        if: steps.request.outputs.phase == 'reveal'
        shell: bash
        env:
          TD_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          TD_SYMBOL="${{ steps.map.outputs.td_symbol }}"
          CUTOFF="${{ steps.request.outputs.cutoff }}"
          TIMEZONE="${{ steps.request.outputs.timezone }}"

          END_DATE=$(python3 - <<'PY'
          import json

          from datetime import (
              datetime,
              timedelta
          )

          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              d = json.load(f)


          cutoff = (
              datetime.fromisoformat(
                  d[
                      "cutoff"
                  ]
              )
          )


          end = (
              cutoff
              +
              timedelta(
                  hours=24
              )
          )


          print(
              end.isoformat(
                  timespec="seconds"
              )
          )
          PY
          )


          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --get \
            "https://api.twelvedata.com/time_series" \
            --data-urlencode "symbol=$TD_SYMBOL" \
            --data-urlencode "interval=5min" \
            --data-urlencode "start_date=$CUTOFF" \
            --data-urlencode "end_date=$END_DATE" \
            --data-urlencode "timezone=$TIMEZONE" \
            --data-urlencode "outputsize=5000" \
            --data-urlencode "order=asc" \
            --data-urlencode "apikey=$TD_API_KEY" \
            -o \
            data/backtest-temp/future-M5.json


      # ======================================================
      # 16. BUILD REVEAL
      # ======================================================

      - name: Reveal - Build result
        if: steps.request.outputs.phase == 'reveal'
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import sys

          from datetime import (
              datetime,
              timezone
          )


          with open(
              "backtest-request.json",
              encoding="utf-8"
          ) as f:

              req = json.load(f)


          with open(
              "data/backtest-temp/"
              "future-M5.json",
              encoding="utf-8"
          ) as f:

              raw = json.load(f)


          if (
              raw.get(
                  "status"
              )
              ==
              "error"
          ):

              print(
                  json.dumps(
                      raw,
                      indent=2
                  )
              )

              sys.exit(1)


          rows = []


          for item in raw.get(
              "values",
              []
          ):

              try:

                  rows.append({

                      "datetime":
                          item[
                              "datetime"
                          ],

                      "open":
                          float(
                              item[
                                  "open"
                              ]
                          ),

                      "high":
                          float(
                              item[
                                  "high"
                              ]
                          ),

                      "low":
                          float(
                              item[
                                  "low"
                              ]
                          ),

                      "close":
                          float(
                              item[
                                  "close"
                              ]
                          )
                  })

              except Exception:

                  continue


          if not rows:

              print(
                  "ERROR: no future data."
              )

              sys.exit(1)


          highest = max(
              rows,
              key=lambda row: (
                  row[
                      "high"
                  ]
              )
          )


          lowest = min(
              rows,
              key=lambda row: (
                  row[
                      "low"
                  ]
              )
          )


          output = {

              "status":
                  "ok",

              "mode":
                  "BACKTEST_REVEAL",

              "phase":
                  "reveal",

              "symbol":
                  req[
                      "symbol"
                  ].upper(),

              "cutoff":
                  req[
                      "cutoff"
                  ],

              "timezone":
                  req.get(
                      "timezone",
                      "Asia/Ho_Chi_Minh"
                  ),

              "requestId":
                  req.get(
                      "id",
                      0
                  ),

              "futureWindow": {

                  "firstCandle":
                      rows[
                          0
                      ],

                  "lastCandle":
                      rows[
                          -1
                      ],

                  "startPrice":
                      rows[
                          0
                      ][
                          "open"
                      ],

                  "endPrice":
                      rows[
                          -1
                      ][
                          "close"
                      ],

                  "highestPrice":
                      highest[
                          "high"
                      ],

                  "highestPriceTime":
                      highest[
                          "datetime"
                      ],

                  "lowestPrice":
                      lowest[
                          "low"
                      ],

                  "lowestPriceTime":
                      lowest[
                          "datetime"
                      ],

                  "candleCount":
                      len(
                          rows
                      ),

                  "candles":
                      rows
              },

              "blindValidation": {

                  "required":
                      True,

                  "passed":
                      True
              },

              "generatedAt":
                  datetime.now(
                      timezone.utc
                  ).isoformat()
          }


          with open(
              "data/"
              "backtest-reveal.json",
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  output,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print("================================")
          print("REVEAL READY")
          print(
              "Start:",
              output[
                  "futureWindow"
              ][
                  "startPrice"
              ]
          )

          print(
              "High:",
              output[
                  "futureWindow"
              ][
                  "highestPrice"
              ]
          )

          print(
              "Low:",
              output[
                  "futureWindow"
              ][
                  "lowestPrice"
              ]
          )

          print(
              "End:",
              output[
                  "futureWindow"
              ][
                  "endPrice"
              ]
          )

          print("================================")
          PY


      # ======================================================
      # 17. CLEAN TEMP
      # ======================================================

      - name: Clean temporary files
        if: always()
        shell: bash
        run: |
          rm -rf \
            data/backtest-temp


      # ======================================================
      # 18. COMMIT OUTPUT
      # ======================================================

      - name: Commit backtest output
        shell: bash
        run: |
          git config \
            user.name \
            "market-data-bot"

          git config \
            user.email \
            "market-data-bot@users.noreply.github.com"


          PHASE="${{ steps.request.outputs.phase }}"


          if [ "$PHASE" = "blind" ]; then

            git add \
              data/backtest-blind.json

          elif [ "$PHASE" = "reveal" ]; then

            git add \
              data/backtest-reveal.json

          fi


          if git diff \
            --cached \
            --quiet
          then

            echo \
              "No backtest changes."

            exit 0

          fi


          SYMBOL="${{ steps.request.outputs.symbol }}"


          git commit \
            -m \
            "Backtest $PHASE data for $SYMBOL"


      # ======================================================
      # 19. SAFE PUSH
      # ======================================================

      - name: Sync and push safely
        shell: bash
        run: |
          LAST_MESSAGE=$(git log \
            -1 \
            --pretty=%B)


          if echo \
            "$LAST_MESSAGE" \
            | grep -q \
            "^Backtest "
          then

            echo \
              "Synchronizing latest main..."

            git pull \
              --rebase \
              origin \
              main


            echo \
              "Pushing backtest output..."

            git push \
              origin \
              HEAD:main

          else

            echo \
              "Nothing to push."

          fi
