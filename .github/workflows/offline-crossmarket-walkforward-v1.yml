name: Offline Crossmarket Walkforward V1

on:
  push:
    paths:
      - 'scripts/offline_crossmarket_walkforward_v1.py'
      - '.github/workflows/offline-crossmarket-walkforward-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run zero-credit walk-forward
        run: |
          python scripts/offline_crossmarket_walkforward_v1.py
          echo '--- RESULT ---'
          cat data/offline_crossmarket_walkforward_v1.json
