name: Validate Bybit Branch
on:
  push:
    branches:
      - 'gpt/bybit-*'
    paths:
      - 'cloudflare-worker/**'
      - '.github/workflows/bybit-branch-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Worker syntax and safety validator
        working-directory: cloudflare-worker
        run: node validate-worker.mjs
      - name: Bybit learning integrity validator
        working-directory: cloudflare-worker
        run: node validate-bybit-learning.mjs
