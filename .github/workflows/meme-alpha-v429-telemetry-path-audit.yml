name: Meme Alpha V429 Telemetry Path Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/meme-alpha-v429-telemetry-path-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 10
    steps:
      - name: Inspect V429 telemetry path and source
        shell: bash
        run: |
          set -euo pipefail
          APP=/opt/meme-alpha/app
          E="$APP/src/micro-live-executor.js"
          RT="$APP/runtime-status"
          DATA=/var/lib/meme-alpha/data/micro-live
          echo '=== SOURCE MARKERS ==='
          grep -nE "capitalVelocityVersion|deployablePct|exitPreviewBackoffRemainingMs|atomic\(.*capital-observability|const DATA|DATA=" "$E" | head -120 || true
          echo '=== FILE LOCATIONS ==='
          for p in "$RT/capital-observability.json" "$DATA/capital-observability.json"; do
            echo PATH=$p
            if [ -e "$p" ]; then stat -c 'mtime=%y size=%s inode=%i' "$p"; cat "$p"; else echo MISSING; fi
          done
          echo '=== RESOLUTION ==='
          readlink -f "$RT/capital-observability.json" 2>/dev/null || true
          readlink -f "$DATA/capital-observability.json" 2>/dev/null || true
          echo '=== EXECUTOR ENV ==='
          PID=$(pgrep -f '/opt/meme-alpha/app/src/micro-live-executor.js' | head -1)
          echo PID=$PID
          tr '\0' '\n' < /proc/$PID/environ 2>/dev/null | grep -E 'MEME|DATA|RUNTIME|APP|NODE' || true
          echo V429_TELEMETRY_PATH_AUDIT=PASS
