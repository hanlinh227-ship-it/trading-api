name: Offline Crypto Regime V3 Fast
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_regime_optimizer_v3_fast.py'
      - '.github/workflows/offline-crypto-regime-v3-fast.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/offline_crypto_regime_optimizer_v3_fast.py
