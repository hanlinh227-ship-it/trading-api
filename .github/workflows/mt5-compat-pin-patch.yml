# trigger: current installer Wine10 compatibility repair
name: Apply MT5 Wine Compatibility Pin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-compat-pin-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mt5-compat-pin-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Pin current MT5 installer to WineHQ 10
        shell: python
        run: |
          from pathlib import Path
          p=Path('vps/mt5-forex/install-mt5-forex.sh')
          s=p.read_text()
          if 'PINNED_WINEHQ_VERSION=' in s:
              print('MT5_COMPAT_PATCH=ALREADY_APPLIED')
          else:
              old='''WINEHQ_VERSION="${MT5_WINE_COMPAT_VERSION:-$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | head -n1 || true)}"
[[ -n "$WINEHQ_VERSION" ]] || { echo "ERROR: WineHQ stable unavailable" >&2; exit 56; }'''
              new='''PINNED_WINEHQ_VERSION="${MT5_WINE_COMPAT_VERSION:-10.0.0.0~${CODENAME}-1}"
if apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | grep -Fxq "$PINNED_WINEHQ_VERSION"; then
  WINEHQ_VERSION="$PINNED_WINEHQ_VERSION"
  echo "MT5_WINE_COMPAT_PIN=ACTIVE version=$WINEHQ_VERSION"
else
  WINEHQ_VERSION="$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | awk '$0 ~ /^10\\./ {print; exit}' || true)"
  if [[ -z "$WINEHQ_VERSION" ]]; then
    WINEHQ_VERSION="$(apt-cache madison winehq-stable 2>/dev/null | awk '{print $3}' | head -n1 || true)"
  fi
  echo "MT5_WINE_COMPAT_PIN=FALLBACK version=${WINEHQ_VERSION:-MISSING}"
fi
[[ -n "$WINEHQ_VERSION" ]] || { echo "ERROR: WineHQ stable unavailable" >&2; exit 56; }'''
              if old not in s:
                  raise SystemExit('current Wine selector block not found')
              p.write_text(s.replace(old,new,1))

      - name: Commit compatibility patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add vps/mt5-forex/install-mt5-forex.sh
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'MT5_COMPAT_PATCH=ALREADY_APPLIED'
            exit 0
          fi
          git commit -m 'mt5: pin MetaEditor runtime to WineHQ 10'
          git push origin HEAD:main
          echo 'MT5_COMPAT_PATCH=PUSHED'
