name: V13 Saved Diagnostic
on:
  push:
    paths:
      - "scripts/v13_saved_diagnostic.py"
      - ".github/workflows/v13-saved-diagnostic.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: python3 scripts/v13_saved_diagnostic.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/v13_saved_diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Run V13 saved diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
