name: Apply V77.9.0 Adaptive Symbol Hub

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_v7790_adaptive_symbol_hub.js'
      - '.github/workflows/apply-v7790-adaptive-symbol-hub.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply adaptive symbol intelligence
        run: node scripts/apply_v7790_adaptive_symbol_hub.js
      - name: Syntax check Worker
        run: node --check cloudflare-worker/index.js
      - name: Verify adaptive engine
        run: |
          grep -q 'V77.9.0' cloudflare-worker/index.js
          grep -q 'methodAssessment' cloudflare-worker/index.js
          grep -q 'setupScore' cloudflare-worker/index.js
          grep -q 'forexStrengthMap' cloudflare-worker/index.js
          grep -q 'cryptoDerivativesContext' cloudflare-worker/index.js
          grep -q 'STRUCTURE_LIQUIDITY' cloudflare-worker/index.js
          grep -q 'Điểm Hub = độ hoàn thiện setup' cloudflare-worker/index.js
          grep -q 'validExecutablePosition' cloudflare-worker/index.js
      - name: Install Worker dependencies
        working-directory: cloudflare-worker
        run: npm install
      - name: Generate test Wrangler config
        working-directory: cloudflare-worker
        env:
          TRADING_KV_NAMESPACE_ID: 00000000000000000000000000000000
        run: npm run prepare:wrangler
      - name: Wrangler dry run
        working-directory: cloudflare-worker
        run: npx wrangler deploy --dry-run
      - name: Commit canonical Worker
        run: |
          if git diff --quiet -- cloudflare-worker/index.js; then
            echo 'No V77.9 changes required.'
            exit 0
          fi
          git config user.name 'trading-runtime-bot'
          git config user.email 'trading-runtime-bot@users.noreply.github.com'
          git add cloudflare-worker/index.js
          git commit -m 'Upgrade production runtime to V77.9.0 Adaptive Symbol Hub'
          git push origin main
