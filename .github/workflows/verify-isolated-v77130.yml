name: Verify Isolated V77.13
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-isolated-v77130.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Build validation
        shell: bash
        run: |
          set +e
          : > V77130_ISOLATED_CHECK.txt
          node --check cloudflare-worker/index.js >> V77130_ISOLATED_CHECK.txt 2>&1; echo SYNTAX_EXIT=$? >> V77130_ISOLATED_CHECK.txt
          cd cloudflare-worker
          npm install >> ../V77130_ISOLATED_CHECK.txt 2>&1; echo NPM_EXIT=$? >> ../V77130_ISOLATED_CHECK.txt
          TRADING_KV_NAMESPACE_ID=00000000000000000000000000000000 npm run prepare:wrangler >> ../V77130_ISOLATED_CHECK.txt 2>&1; echo PREPARE_EXIT=$? >> ../V77130_ISOLATED_CHECK.txt
          npx wrangler deploy --dry-run >> ../V77130_ISOLATED_CHECK.txt 2>&1; echo WRANGLER_EXIT=$? >> ../V77130_ISOLATED_CHECK.txt
          cd ..
      - name: Wait for a clean Twelve Data minute
        shell: bash
        run: |
          sec=$(date -u +%S); wait=$((65-10#$sec)); if [ "$wait" -lt 5 ]; then wait=$((wait+60)); fi; echo "Waiting $wait seconds"; sleep "$wait"
      - name: Isolated market checks
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          curl -fsS --max-time 90 "$BASE/run-now?group=forex" -o /tmp/f.json; echo FOREX_CURL=$? >> V77130_ISOLATED_CHECK.txt
          sleep 3
          curl -fsS --max-time 90 "$BASE/run-now?group=metal" -o /tmp/m.json; echo METAL_CURL=$? >> V77130_ISOLATED_CHECK.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/o.json; echo ORDERS_CURL=$? >> V77130_ISOLATED_CHECK.txt
          node - <<'NODE' >> V77130_ISOLATED_CHECK.txt 2>&1
          const fs=require('fs');const r=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json'))}catch(e){return {e:e.message}}};const f=r('f'),m=r('m'),o=r('o');
          const line=x=>(x.status||'-')+':'+(x.broadOk??'-')+'/'+(x.requested??'-')+':deep='+(x.deepOk??'-')+'/'+(x.deepRequested??'-')+':left='+(x.diagnostics?.tdCreditsLeft??'-')+':need='+(x.diagnostics?.tdCreditsRequired??x.diagnostics?.tdCreditsPlanned??'-');
          console.log('FOREX='+line(f));console.log('METAL='+line(m));
          console.log('FOREX_ERRORS='+((f.diagnostics?.broadErrors||[]).length));console.log('METAL_ERRORS='+((m.diagnostics?.broadErrors||[]).length));
          console.log('WATCH_DURABLE_ZERO='+(['forex','crypto','metal'].every(g=>(o[g]?.watch||[]).length===0)?'YES':'NO'));
          const pass=f.broadOk===28&&f.deepOk===3&&m.broadOk===2&&m.deepOk===2&&['forex','crypto','metal'].every(g=>(o[g]?.watch||[]).length===0);
          console.log('MARKET_VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77130_ISOLATED_CHECK.txt
          git commit -m 'Report isolated V77.13 build and market verification' || exit 0
          git push origin main
