name: MT5 Wine11 Terminal Recover

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mt5-wine11-terminal-recover.yml'

# VPS canonical runtime only. Windows execution lane retired 2026-08-27.
permissions:
  contents: read

concurrency:
  group: mt5-forex-vps
  cancel-in-progress: true

jobs:
  recover:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 35
    env:
      MT5_ACCOUNT_LOGIN: ${{ secrets.MT5_ACCOUNT_LOGIN }}
      MT5_ACCOUNT_PASSWORD: ${{ secrets.MT5_ACCOUNT_PASSWORD }}
      MT5_ACCOUNT_SERVER: ${{ secrets.MT5_ACCOUNT_SERVER }}
      MT5_ACCOUNT_ENDPOINT: ${{ secrets.MT5_ACCOUNT_ENDPOINT }}
      MT5_BRIDGE_TOKEN: ${{ secrets.MT5_BRIDGE_TOKEN }}
      MT5_HUB_URL: ${{ secrets.MT5_HUB_URL }}
      MT5_ALLOW_LIVE: ${{ vars.MT5_ALLOW_LIVE || secrets.MT5_ALLOW_LIVE || 'false' }}
    steps:
      - name: Recover MT5 files and verify Wine11
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_NAME:-}" = trading-vps
          repo=/opt/trading/trading-api-main
          sudo git -C "$repo" fetch --prune origin main
          sudo git -C "$repo" reset --hard origin/main
          sudo systemctl stop mt5-forex-bridge.service 2>/dev/null || true
          sudo systemctl stop mt5-forex.service 2>/dev/null || true
          prefix=/var/lib/trading/mt5-forex/wine
          echo 'MT5_CANONICAL_EXECUTION=VPS_ONLY'
          echo '=== WINE11 RECOVERY INVENTORY ==='
          sudo find /var/lib/trading/mt5-forex -maxdepth 2 -type d -name 'wine*' -print 2>/dev/null || true
          wine_version=$(/usr/bin/wine --version)
          wine_major=$(printf '%s' "$wine_version" | sed -nE 's/.*wine-([0-9]+).*/\1/p' | head -1)
          echo "MT5_RECOVERY_WINE=$wine_version"
          [[ -n "$wine_major" && "$wine_major" -ge 11 ]]
          if [[ ! -f "$prefix/system.reg" ]]; then
            echo 'MT5_WINE11_PREFIX=REBUILDING'
            sudo rm -rf "$prefix"
            sudo install -d -o mt5forex -g mt5forex -m 0750 "$prefix"
            sudo -u mt5forex env HOME=/var/lib/trading/mt5-forex WINEPREFIX="$prefix" WINEDEBUG=-all timeout 240 xvfb-run -a -s '-screen 0 1280x1024x24' /usr/bin/wineboot -i >/tmp/wine11-recovery-wineboot.log 2>&1 || true
            sudo -u mt5forex env HOME=/var/lib/trading/mt5-forex WINEPREFIX="$prefix" /usr/bin/wineserver -k >/dev/null 2>&1 || true
            test -f "$prefix/system.reg"
          fi
          printf '%s\n' WINEHQ_STABLE_11 | sudo tee "$prefix/.trading-wine-stack" >/dev/null
          sudo chown mt5forex:mt5forex "$prefix/.trading-wine-stack"
          sudo chmod 0600 "$prefix/.trading-wine-stack"
          if ! find "$prefix/drive_c" -type f -iname terminal64.exe -print -quit 2>/dev/null | grep -q .; then
            src=$(sudo find /var/lib/trading/mt5-forex -type f -path '*/wine.pre-wine11-*/drive_c/*' -iname terminal64.exe -printf '%h\n' -quit 2>/dev/null || true)
            if [[ -z "$src" ]]; then src=$(sudo find /var/lib/trading/mt5-forex -type f -path '*/wine.pre-*/*' -iname terminal64.exe -printf '%h\n' -quit 2>/dev/null || true); fi
            [[ -n "$src" ]] || { echo 'ERROR: no recoverable MT5 terminal directory found' >&2; sudo find /var/lib/trading/mt5-forex -type f -iname terminal64.exe -print 2>/dev/null || true; exit 61; }
            echo "MT5_WINE11_FILE_SOURCE=${src%/terminal64.exe}"
            sudo rm -rf "$prefix/drive_c/MT5Forex"
            sudo cp -a "$src" "$prefix/drive_c/MT5Forex"
            sudo chown -R mt5forex:mt5forex "$prefix/drive_c/MT5Forex"
          fi
          test -f "$prefix/drive_c/MT5Forex/terminal64.exe"
          echo 'MT5_WINE11_TERMINAL_FILES=PASS'
          sudo chmod +x "$repo/vps/mt5-forex/install-mt5-forex.sh"
          sudo FOREX_RESEARCH_REPO="$repo" "$repo/vps/mt5-forex/install-mt5-forex.sh"
          source /var/lib/trading/mt5-forex/runtime.env
          echo "MT5_RUNTIME_WINE=$MT5_WINE_VERSION"
          echo "MT5_RUNTIME_STACK=$MT5_WINE_STACK"
          test "$MT5_WINE_STACK" = WINEHQ_STABLE_11
          test -f "$MT5_INSTALL_DIR/MQL5/Experts/ForexAutoThe5ers.ex5"

      - name: Install LIVE config and start runtime
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          app=/var/lib/trading/mt5-forex
          prefix="$app/wine"
          tmp=$(mktemp); trap 'rm -f "$tmp"' EXIT
          HUB="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}"
          LIVE="${MT5_ALLOW_LIVE:-false}"
          case "${LIVE,,}" in true|1|yes) LIVE=true ;; *) LIVE=false ;; esac
          umask 077
          {
            printf 'MT5_ACCOUNT_LOGIN=%q\n' "$MT5_ACCOUNT_LOGIN"
            printf 'MT5_ACCOUNT_PASSWORD=%q\n' "$MT5_ACCOUNT_PASSWORD"
            printf 'MT5_ACCOUNT_SERVER=%q\n' "$MT5_ACCOUNT_SERVER"
            printf 'MT5_ACCOUNT_ENDPOINT=%q\n' "${MT5_ACCOUNT_ENDPOINT:-}"
            printf 'MT5_SERVER_BOOTSTRAP_PREFER=%q\n' 'display'
            printf 'MT5_HUB_URL=%q\n' "$HUB"
            printf 'MT5_BRIDGE_TOKEN=%q\n' "$MT5_BRIDGE_TOKEN"
            printf 'MT5_ALLOW_LIVE=%q\n' "$LIVE"
          } > "$tmp"
          sudo install -o root -g mt5forex -m 0640 "$tmp" /etc/trading/mt5-forex.env
          printf '%s\n' 'VPS_ONLY' | sudo tee /etc/trading/mt5-forex-vps-only >/dev/null
          sudo chown root:mt5forex /etc/trading/mt5-forex-vps-only
          sudo chmod 0640 /etc/trading/mt5-forex-vps-only
          marker="$app/broker-authenticated.marker"
          pulse="$prefix/drive_c/MT5Forex/MQL5/Files/FOREX_BRIDGE/pulse.json"
          connected=false
          if [[ -s "$pulse" ]]; then connected=$(python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); print("true" if bool((p.get("mt5") or {}).get("connected")) else "false")' "$pulse" 2>/dev/null || echo false); fi
          if [[ -f "$marker" && "$connected" != true ]]; then
            sudo rm -f "$marker"
            echo 'MT5_FOREX_STALE_AUTH_MARKER_CLEARED=yes'
          else
            echo 'MT5_FOREX_STALE_AUTH_MARKER_CLEARED=no'
          fi
          broker_token="${MT5_ACCOUNT_SERVER%%-*}"
          servers="$prefix/drive_c/MT5Forex/Config/servers.dat"
          if [[ -s "$servers" ]] && { strings -el "$servers" 2>/dev/null; strings "$servers" 2>/dev/null; } | grep -qiF -- "$broker_token"; then
            echo 'MT5_FOREX_PREFLIGHT_SERVERS_DAT_HAS_BROKER=yes'
          else
            echo 'MT5_FOREX_PREFLIGHT_SERVERS_DAT_HAS_BROKER=no'
          fi
          [[ -n "${MT5_ACCOUNT_ENDPOINT:-}" ]] && echo 'MT5_FOREX_PREFLIGHT_ENDPOINT=SET' || echo 'MT5_FOREX_PREFLIGHT_ENDPOINT=EMPTY'
          echo "MT5_FOREX_PREFLIGHT_SERVER_NAME=$MT5_ACCOUNT_SERVER"
          echo 'MT5_FOREX_PREFLIGHT_BOOTSTRAP_PREFER=display'
          sudo chmod +x "$repo/vps/mt5-forex/run-mt5-forex.sh" "$repo/vps/mt5-forex/forex-mt5-sidecar.py" "$repo/vps/mt5-forex/verify-hub-pulse.py" "$repo/vps/mt5-forex/verify-local-pulse.py" "$repo/vps/mt5-forex/verify-live-readiness.sh"
          sudo install -m 0644 "$repo/vps/mt5-forex/mt5-forex.service" /etc/systemd/system/mt5-forex.service
          sudo install -m 0644 "$repo/vps/mt5-forex/mt5-forex-bridge.service" /etc/systemd/system/mt5-forex-bridge.service
          sudo systemctl daemon-reload
          sudo systemctl reset-failed mt5-forex.service mt5-forex-bridge.service || true
          sudo systemctl restart mt5-forex.service
          sleep 15
          sudo systemctl restart mt5-forex-bridge.service
          sudo systemctl is-active --quiet mt5-forex.service
          sudo systemctl is-active --quiet mt5-forex-bridge.service
          echo 'MT5_WINE11_RUNTIME_START=PASS'

      - name: Verify connected broker end-to-end
        shell: bash
        run: |
          set -euo pipefail
          repo=/opt/trading/trading-api-main
          sudo -u mt5forex env FOREX_RESEARCH_REPO="$repo" MT5_ACCOUNT_LOGIN="$MT5_ACCOUNT_LOGIN" MT5_ACCOUNT_SERVER="$MT5_ACCOUNT_SERVER" MT5_ACCOUNT_ENDPOINT="${MT5_ACCOUNT_ENDPOINT:-}" MT5_BRIDGE_TOKEN="$MT5_BRIDGE_TOKEN" MT5_HUB_URL="${MT5_HUB_URL:-https://trading-v77-scanner.hanlinh227.workers.dev}" MT5_ALLOW_LIVE="${MT5_ALLOW_LIVE:-false}" MT5_LOCAL_READY_TIMEOUT_SECONDS=480 MT5_SIDECAR_READY_TIMEOUT_SECONDS=120 MT5_HUB_READY_TIMEOUT_SECONDS=180 "$repo/vps/mt5-forex/verify-live-readiness.sh"
          echo 'MT5_CONNECTED=PASS'
          echo 'MT5_BALANCE_EQUITY=PASS'
          echo 'MT5_FOREX_RUNTIME_READINESS=PASS'
