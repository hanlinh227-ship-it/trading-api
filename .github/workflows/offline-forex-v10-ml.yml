name: Offline Forex V10 ML
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_forex_v10_ml_ensemble.py'
      - '.github/workflows/offline-forex-v10-ml.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q scikit-learn
      - name: Run Forex V10 zero-credit ML walk-forward
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_forex_v10_ml_ensemble.py
