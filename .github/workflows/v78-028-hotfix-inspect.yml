name: V78-028 Hotfix Inspector
on:
  issues:
    types: [opened]
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    if: github.event.issue.title == 'INSPECT-V78-028-HOTFIX-030'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Capture latest non-skipped final-pass status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          META=$(gh run list --workflow v78-final-pass.yml --limit 20 --json databaseId,status,conclusion,headSha,createdAt,url --jq 'map(select(.conclusion != "skipped")) | .[0]')
          RUN=$(printf '%s' "$META" | jq -r '.databaseId')
          test "$RUN" != "null"
          printf '%s\n' "$META" > /tmp/meta.json
          { echo '=== META ==='; cat /tmp/meta.json; echo; echo '=== FAILED LOGS ==='; gh run view "$RUN" --log-failed || true; } > docs/ai-coengineer/V78-028_HOTFIX_RUN_DIAGNOSTIC.txt
          git config user.name 'V78 Inspector'
          git config user.email 'actions@users.noreply.github.com'
          git add docs/ai-coengineer/V78-028_HOTFIX_RUN_DIAGNOSTIC.txt
          git commit -m 'Record final V78 pass diagnostic' || true
          git push origin HEAD:main
