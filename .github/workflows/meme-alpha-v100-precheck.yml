name: Meme Alpha v1.0 Precheck

on:
  push:
    paths:
      - 'ops/meme-alpha/v100-precheck.sh'
      - '.github/workflows/meme-alpha-v100-precheck.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  precheck:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PAPER execution engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ops/meme-alpha/v100-precheck.sh
          nice -n 10 bash ops/meme-alpha/v100-precheck.sh
