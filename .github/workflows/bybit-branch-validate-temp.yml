name: TEMP Bybit Branch Validate

on:
  push:
    branches:
      - 'claude/bybit-audit-20260827'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate worker source
        shell: bash
        run: |
          set -euo pipefail
          cd cloudflare-worker
          node validate-worker.mjs
