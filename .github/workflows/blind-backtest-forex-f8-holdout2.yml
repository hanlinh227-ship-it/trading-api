name: Blind Backtest Forex F8 Holdout2

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/blind_backtest_forex_f8_holdout2.py"
      - ".github/workflows/blind-backtest-forex-f8-holdout2.yml"

permissions:
  contents: write

concurrency:
  group: twelvedata-api
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cool down Twelve Data quota
        run: sleep 70
      - name: Run frozen F8 second holdout
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          test -n "$TWELVEDATA_API_KEY" || (echo "TWELVEDATA_API_KEY missing" && exit 1)
          python scripts/blind_backtest_forex_f8_holdout2.py
      - name: Commit result
        run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_forex_f8_holdout2.json
          git commit -m "Run frozen F8 second blind holdout" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
