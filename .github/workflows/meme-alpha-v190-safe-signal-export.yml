name: Meme Alpha v1.9 Safe Signal Export
on:
  push:
    paths:
      - 'ops/meme-alpha/v190-safe-signal-export.sh'
      - '.github/workflows/meme-alpha-v190-safe-signal-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Deploy exporter
        run: bash ops/meme-alpha/v190-safe-signal-export.sh
