name: AI Brain V4 Evergreen Scan

on:
  schedule:
    - cron: '17 * * * *'
    - cron: '23 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-quarantine:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Verify current immutable release and V4 policy
        run: |
          python AI_SKILL_LIBRARY/v4/tools/release.py check --root .
          python AI_SKILL_LIBRARY/validate_v4.py
      - name: Revalidate registered upstream sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python AI_SKILL_LIBRARY/validate_registry.py --check-remote | tee /tmp/v4-source-registry-audit.txt
      - name: Scan public GitHub for machine-readable V4 skill candidates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python AI_SKILL_LIBRARY/v4/tools/evergreen.py scan --root . --output /tmp/v4-quarantine-scan.json
      - name: Discover free-model candidates into quarantine
        run: python AI_SKILL_LIBRARY/v4/tools/discover_free_models.py --root . --output /tmp/v4-free-model-mesh-candidates.json
      - name: Build continuous intelligence audit report
        run: python AI_SKILL_LIBRARY/v4/tools/evergreen.py audit --root . --output /tmp/v4-intelligence-audit.json
      - name: Summarize quarantine scan
        run: |
          python -c "import json; d=json.load(open('/tmp/v4-quarantine-scan.json')); print('quarantine candidates=', len(d.get('candidates', [])), 'errors=', len(d.get('errors', [])))"
          python -c "import json; d=json.load(open('/tmp/v4-free-model-mesh-candidates.json')); print('model candidates=', len(d.get('candidates', [])), 'state=', d.get('state'))"
      - name: Upload source refresh artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v4-evergreen-source-refresh
          path: |
            /tmp/v4-source-registry-audit.txt
            /tmp/v4-quarantine-scan.json
            /tmp/v4-free-model-mesh-candidates.json
            /tmp/v4-intelligence-audit.json
          retention-days: 7

  weekly-intelligence-audit:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '23 3 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator dependencies
        run: python -m pip install -r AI_SKILL_LIBRARY/requirements.txt
      - name: Verify Brain 4.8 continuous intelligence contract
        run: python -m unittest AI_SKILL_LIBRARY.tests.test_brain_4_8_continuous_intelligence AI_SKILL_LIBRARY.tests.test_adaptive_free_model_mesh_evergreen -v
      - name: Verify immutable release freshness
        run: python AI_SKILL_LIBRARY/v4/tools/release.py check --root .
      - name: Run canonical Brain validation
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          python AI_SKILL_LIBRARY/v4/tools/ci_validate.py --source-sha "$SOURCE_SHA"
      - name: Generate continuous intelligence audit report
        run: python AI_SKILL_LIBRARY/v4/tools/evergreen.py audit --root . --output /tmp/v4-continuous-intelligence-audit.json
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: v4-continuous-intelligence-weekly-audit
          path: /tmp/v4-continuous-intelligence-audit.json
          retention-days: 30
