name: Reward Solver - Kaggriculture Status Check

on:
  push:
    branches:
      - reward-solver-kaggriculture-quick-submit
    paths:
      - '.github/reward-kaggriculture-status-check-trigger'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Kaggle CLI
        run: python -m pip install -U kaggle
      - name: Check Kaggriculture submissions
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KAGGLE_API_TOKEN:-}" || { echo 'KAGGLE_API_TOKEN missing'; exit 20; }
          kaggle competitions submissions -c kaggriculture | head -n 20
