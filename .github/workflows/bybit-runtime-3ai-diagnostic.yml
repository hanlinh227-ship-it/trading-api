name: Bybit Runtime 3AI Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-diagnostic:
    runs-on: [self-hosted, trading-vps]
    timeout-minutes: 5
    steps:
      - name: Runtime and 3AI health
        shell: bash
        run: |
          set -euo pipefail
          echo '=== 3AI BRIDGE SERVICE ==='
          systemctl is-active v11-manual-ai-bridge.service
          echo '=== 3AI BRIDGE HEALTH ==='
          SECRET="${V11_AI_BRIDGE_SECRET:-}"
          if [ -z "$SECRET" ] && [ -f /etc/trading-v11-ai-bridge.env ]; then
            SECRET="$(sudo awk -F= '/^V11_AI_BRIDGE_SECRET=/{sub(/^[^=]*=/,""); print; exit}' /etc/trading-v11-ai-bridge.env | tr -d '\r\n')"
          fi
          test -n "$SECRET" || { echo 'V11_AI_BRIDGE_SECRET unavailable'; exit 1; }
          HEALTH="$(curl -fsS --max-time 10 -H "Authorization: Bearer $SECRET" http://127.0.0.1:8789/health)"
          python3 - "$HEALTH" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1]); ps=j.get('providers',{})
          names=('claude','codex','deepseek')
          configured=sum(bool(ps.get(n,{}).get('configured')) for n in names)
          print(json.dumps({'service':j.get('service'),'mode':j.get('mode'),'configured':configured,'providers':{n:{'configured':bool(ps.get(n,{}).get('configured')),'state':ps.get(n,{}).get('state') or ps.get(n,{}).get('status'),'model':ps.get(n,{}).get('model')} for n in names}},ensure_ascii=False))
          if configured < 3: raise SystemExit('3AI configured quorum incomplete')
          PY
          echo '=== REAL 3AI REVIEW ==='
          REVIEW="$(curl -fsS --max-time 125 -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' http://127.0.0.1:8789/review --data '{"evidence":{"mode":"RUNTIME_DIAGNOSTIC_REVIEW_ONLY","task_id":"runtime-diagnostic","instruction":"Connectivity diagnostic only. Review supplied evidence and return the required response. Do not trade.","context":{"executionAllowed":false,"diagnostic":true},"requestedProviders":["claude","codex","deepseek"]}}')"
          python3 - "$REVIEW" <<'PY'
          import json,sys
          j=json.loads(sys.argv[1]); ps=j.get('providers',{}); names=('claude','codex','deepseek')
          ok=[n for n in names if str(ps.get(n,{}).get('status','')).upper()=='OK']
          print(json.dumps({'okProviders':ok,'quorum':len(ok),'required':2,'returnedEarly':j.get('returnedEarly'),'decisionLatencyMs':j.get('decisionLatencyMs')},ensure_ascii=False))
          if len(ok)<2: raise SystemExit('3AI real review quorum failed')
          PY
          echo 'RUNTIME_3AI_DIAGNOSTIC_PASS'
