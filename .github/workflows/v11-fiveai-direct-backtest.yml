name: V11 Direct 5AI Backtest

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-fiveai-direct-backtest.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: v11-direct-fiveai-backtest
  cancel-in-progress: true

jobs:
  direct-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONUNBUFFERED: '1'
      V11_DATASET_START: '2025-08-26T16:00:00Z'
      V11_DATASET_END: '2026-08-23T16:00:00Z'
      V11_SHARD_COUNT: '4'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore immutable market-data cache
        uses: actions/cache@v4
        with:
          path: data/v11_mtf_cache
          key: v11-mtf-data-20250826T1600-20260823T1600-r1

      - name: Preflight direct runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_mtf_data_cache.py scripts/v11_backtest_mtf.py scripts/v11_backtest_mtf_run.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import v11_mtf_data_cache as d
          c=d.load_catalog()
          assert sum(map(len,c.values()))==95
          print('DIRECT_PREFLIGHT_OK 95 symbols')
          PY

      - name: Resolve 5AI gateway
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo CLOUDFLARE_API_TOKEN_MISSING; exit 2; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo CLOUDFLARE_ACCOUNT_ID_MISSING; exit 2; }
          SUBDOMAIN="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json; print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')"
          test -n "$SUBDOMAIN" || { echo CLOUDFLARE_WORKERS_SUBDOMAIN_MISSING; exit 2; }
          echo "GATEWAY_URL=https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review" >> "$GITHUB_ENV"
          OIDC="$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json; print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          echo "GATEWAY_OIDC=$OIDC" >> "$GITHUB_ENV"

      - name: Five AI council + direct parallel backtest
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p data/v11_mtf_out logs
          rm -f data/v11_mtf_out/v11_mtf_shard_*.json data/v11_mtf_out/v11_mtf_profiles_shard_*.json

          python3 - <<'PY'
          import json
          from pathlib import Path
          ctx=[]
          for p,limit in [
              ('scripts/v11_backtest_mtf.py',42000),
              ('scripts/v11_backtest_mtf_run.py',18000),
              ('data/symbol_knowledge_registry.json',26000),
              ('data/v76_entry_summary.json',18000),
              ('data/nocut_intraday_allpass_v73.json',10000),
          ]:
              try:
                  s=Path(p).read_text(encoding='utf-8')[:limit]
                  ctx.append('\n--- '+p+' ---\n'+s)
              except Exception:
                  pass
          instruction='''You are one of five independent AI research lanes participating in the SAME direct Signal V11 multi-timeframe backtest round. Study the supplied current engine and historical research priors. Independently identify the strongest defensible method improvements for the mandatory contract: all 95 symbols independent; every eligible symbol/day must have 1-3 real executions; RR exactly 1:1 or 1:2; per-symbol target WR >=80%; positive expectancy; no lookahead, proxy promotion, fabricated trades, silent day deletion, or final-holdout tuning. Timeframe intent is W1/D1 macro, H4/H1 bias/structure, M30/M15 setup/location, M5 trigger, M1 refinement only with exact deep data. Learn from V62/V63/V73/V74/V76 but do not treat historical development-fit as proof. Return concise method hypotheses, leakage/integrity risks, and what to test next. Do not fabricate backtest results. This is research-only; production remains locked.'''
          req={'task_id':'v11-direct-fiveai-backtest-20260823','instruction':instruction,'context':{'text':'\n'.join(ctx)}}
          Path('/tmp/fiveai-request.json').write_text(json.dumps(req,ensure_ascii=False),encoding='utf-8')
          PY

          echo '5AI_COUNCIL_START claude codex deepseek qwen openrouter'
          (
            for attempt in 1 2; do
              code="$(curl -sS --max-time 600 -o /tmp/fiveai-result.json -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $GATEWAY_OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/fiveai-request.json || true)"
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then exit 0; fi
              echo "5AI_RETRY attempt=$attempt http=$code"
              sleep 3
            done
            exit 1
          ) > logs/fiveai.log 2>&1 &
          AI_PID=$!

          echo 'BACKTEST_START mode=FAST shards=4 dataset=frozen'
          PIDS=''
          for i in 0 1 2 3; do
            (
              python -u scripts/v11_backtest_mtf_run.py \
                --mode fast \
                --history-start "$V11_DATASET_START" \
                --history-end "$V11_DATASET_END" \
                --shard-index "$i" --shard-count "$V11_SHARD_COUNT" \
                2>&1 | tee "logs/shard-$i.log"
            ) &
            PIDS="$PIDS $!"
          done

          BT_RC=0
          for p in $PIDS; do wait "$p" || BT_RC=1; done
          python -u scripts/v11_backtest_mtf_run.py --merge || BT_RC=1
          cp data/v11_mtf_merged.json data/v11_mtf_fast_merged.json 2>/dev/null || true

          wait "$AI_PID" || AI_HTTP_RC=1
          AI_HTTP_RC=${AI_HTTP_RC:-0}
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected=['claude','codex','deepseek','qwen','openrouter']
          p=Path('/tmp/fiveai-result.json')
          out={'allFiveReady':False,'providers':{},'error':None}
          if p.exists():
              try:
                  d=json.loads(p.read_text(encoding='utf-8'))
                  raw={str(k).lower():v for k,v in (d.get('providers') or {}).items()}
                  out['providers']={k:{'status':str((raw.get(k) or {}).get('status') or 'MISSING'),'review':(raw.get(k) or {}).get('review') or {}} for k in expected}
                  out['allFiveReady']=all(str(out['providers'][k]['status']).upper()=='OK' for k in expected)
              except Exception as e:
                  out['error']=str(e)
          else:
              out['error']='NO_5AI_RESULT'
          Path('data/v11_fiveai_direct_council.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print('5AI_READY',out['allFiveReady'],[(k,v['status']) for k,v in out['providers'].items()])
          PY

          FAST_ALL="$(python3 - <<'PY'
          import json
          d=json.load(open('data/v11_mtf_fast_merged.json',encoding='utf-8'))
          s=d.get('symbols') or {}
          print('1' if len(s)==95 and all(bool(v.get('pass')) for v in s.values()) else '0')
          PY
          )"

          if [ "$FAST_ALL" = '1' ]; then
            echo 'FAST_ALL95_PASS -> FINAL_START'
            rm -f data/v11_mtf_out/v11_mtf_shard_*.json data/v11_mtf_out/v11_mtf_profiles_shard_*.json
            PIDS=''
            for i in 0 1 2 3; do
              (
                python -u scripts/v11_backtest_mtf_run.py \
                  --mode final \
                  --history-start "$V11_DATASET_START" \
                  --history-end "$V11_DATASET_END" \
                  --profiles data/v11_mtf_profiles.json \
                  --shard-index "$i" --shard-count "$V11_SHARD_COUNT" \
                  2>&1 | tee "logs/final-shard-$i.log"
              ) &
              PIDS="$PIDS $!"
            done
            for p in $PIDS; do wait "$p" || BT_RC=1; done
            python -u scripts/v11_backtest_mtf_run.py --merge || BT_RC=1
            cp data/v11_mtf_merged.json data/v11_mtf_final_merged.json 2>/dev/null || true
          else
            echo 'FAST_NOT_ALL95_PASS final_holdout_remains_sealed'
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path
          f=Path('data/v11_mtf_fast_merged.json')
          d=json.loads(f.read_text(encoding='utf-8')) if f.exists() else {'symbols':{}}
          s=d.get('symbols') or {}
          council=json.loads(Path('data/v11_fiveai_direct_council.json').read_text(encoding='utf-8'))
          summary={
            'mode':'DIRECT_5AI_BACKTEST',
            'datasetStart':'2025-08-26T16:00:00Z',
            'datasetEnd':'2026-08-23T16:00:00Z',
            'symbolCount':len(s),
            'allFiveAIReady':bool(council.get('allFiveReady')),
            'fastAll95Passed':len(s)==95 and all(bool(v.get('pass')) for v in s.values()),
            'finalRan':Path('data/v11_mtf_final_merged.json').exists(),
            'productionUnlocked':False,
          }
          Path('data/v11_direct_backtest_status.json').write_text(json.dumps(summary,indent=2),encoding='utf-8')
          print('DIRECT_STATUS',summary)
          PY

          exit "$BT_RC"

      - name: Upload direct evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v11-direct-fiveai-${{ github.run_id }}
          path: |
            data/v11_direct_backtest_status.json
            data/v11_fiveai_direct_council.json
            data/v11_mtf_fast_merged.json
            data/v11_mtf_final_merged.json
            data/v11_mtf_profiles.json
            data/v11_mtf_out/*.json
            logs/*.log
          if-no-files-found: warn
          retention-days: 14
