name: V11 Direct 5AI Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: v11-direct-fiveai-backtest
  cancel-in-progress: true

jobs:
  direct-backtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[V11-RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      PYTHONUNBUFFERED: '1'
      V11_DATASET_START: '2025-08-26T16:00:00Z'
      V11_DATASET_END: '2026-08-23T16:00:00Z'
      V11_SHARD_COUNT: '4'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Restore immutable legacy-route market-data cache
        uses: actions/cache@v4
        with:
          path: data/v11_mtf_cache
          key: v11-legacy-no-yahoo-v2-20250826-20260823
      - name: Preflight exact legacy routes
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_mtf_data_cache.py scripts/v11_backtest_mtf_engine_r1.py scripts/v11_backtest_mtf.py scripts/v11_backtest_mtf_run.py scripts/v11_direct_backtest.py
          test -n "${TWELVEDATA_API_KEY:-}" || { echo TWELVEDATA_API_KEY_MISSING; exit 2; }
          python - <<'PY'
          import sys;sys.path.insert(0,'scripts');import v11_mtf_data_cache as d
          assert sum(map(len,d.load_catalog().values()))==95
          print('LEGACY_DATA_PREFLIGHT_OK symbols=95')
          PY
      - name: Resolve required 5AI gateway
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')"
          test -n "$SUBDOMAIN"
          OIDC="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
          echo "::add-mask::$OIDC"
          echo "GATEWAY_URL=https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review" >> "$GITHUB_ENV"
          echo "GATEWAY_OIDC=$OIDC" >> "$GITHUB_ENV"
          echo "GATEWAY_RESOLVE_OK"
      - name: Require all five AI pre-research
        run: |
          set -uo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          ctx=[]
          for p in ['scripts/v11_backtest_mtf.py','scripts/v11_mtf_data_cache.py']:
            try: ctx.append('\n---'+p+'---\n'+Path(p).read_text(encoding='utf-8')[:12000])
            except Exception: pass
          Path('/tmp/pre.json').write_text(json.dumps({'task_id':'v11-pre-'+os.environ['GITHUB_RUN_ID'],'instruction':'5AI connectivity smoke and bounded V11 research review. Return provider status for claude,codex,deepseek,qwen,openrouter. Do not fabricate results.','context':{'text':'\n'.join(ctx)}}))
          PY
          CODE="$(curl -sS --connect-timeout 10 --max-time 90 -o /tmp/pre-result.json -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $GATEWAY_OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/pre.json || echo CURL_FAIL)"
          echo "5AI_HTTP_STATUS=$CODE"
          echo '===== 5AI GATEWAY RESPONSE ====='
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/pre-result.json')
          print(p.read_text(errors='replace')[:12000] if p.exists() else 'NO_RESPONSE_BODY')
          PY
          echo '===== END 5AI GATEWAY RESPONSE ====='
          [[ "$CODE" =~ ^2[0-9][0-9]$ ]] || { echo "5AI_HTTP_FAIL=$CODE"; exit 20; }
          python - <<'PY'
          import json
          try:
            d=json.load(open('/tmp/pre-result.json'))
          except Exception as e:
            raise SystemExit('5AI_INVALID_JSON '+repr(e))
          p=d.get('providers') or {}
          expected=['claude','codex','deepseek','qwen','openrouter']
          for x in expected:
            v=p.get(x) or {}
            print('5AI_PROVIDER',x,'status='+str(v.get('status')),'error='+str(v.get('error') or v.get('message') or ''))
          bad=[x for x in expected if str((p.get(x) or {}).get('status','')).upper()!='OK']
          if bad: raise SystemExit('5AI_PRE_FAIL '+','.join(bad))
          json.dump({'allFiveReady':True,'providers':{x:{'status':'OK'} for x in expected}},open('data/v11_fiveai_direct_pre.json','w'),indent=2)
          print('5AI_PRE_OK '+','.join(expected))
          PY
      - name: Direct deterministic backtest
        run: |
          set -euo pipefail
          rm -rf data/v11_mtf_out; mkdir -p data/v11_mtf_out logs
          PIDS=''; for i in 0 1 2 3; do (python -u scripts/v11_direct_backtest.py --mode fast --history-start "$V11_DATASET_START" --history-end "$V11_DATASET_END" --shard-index "$i" --shard-count "$V11_SHARD_COUNT" 2>&1 | tee "logs/shard-$i.log") & PIDS="$PIDS $!"; done
          for p in $PIDS; do wait "$p"; done
          python -u scripts/v11_direct_backtest.py --merge
          cp data/v11_mtf_merged.json data/v11_mtf_fast_merged.json
      - name: Publish machine-readable status
        if: always()
        run: |
          set +e
          if [ -f data/v11_fiveai_direct_pre.json ]; then
            echo '{"status":"5AI_PRE_PASS","fiveAIReady":true}' > data/v11_direct_backtest_status.json
          else
            echo '{"status":"5AI_PRE_FAIL","fiveAIReady":false}' > data/v11_direct_backtest_status.json
          fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v11-research-status:v11-research-status 2>/dev/null || git checkout --orphan v11-research-status
          git checkout v11-research-status 2>/dev/null || true
          mkdir -p status; cp data/v11_direct_backtest_status.json status/latest.json
          git add status/latest.json; git commit -m "status: V11 5AI diagnostic $GITHUB_RUN_ID" || true; git push -f origin HEAD:v11-research-status || true