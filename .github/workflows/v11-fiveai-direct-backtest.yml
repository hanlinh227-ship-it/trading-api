name: V11 Direct 5AI Backtest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: v11-direct-fiveai-backtest
  cancel-in-progress: true

jobs:
  direct-backtest:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[V11-RUN]')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
      PYTHONUNBUFFERED: '1'
      # Legacy V64/V69/V73 development evidence used data through 2026-07-31.
      # Starting here makes the wrapper's last ~18% begin in early August, so
      # those old priors cannot contaminate the untouched FINAL period.
      V11_DATASET_START: '2026-05-07T00:00:00Z'
      V11_DATASET_END: '2026-08-23T23:00:00Z'
      V11_SHARD_COUNT: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 1}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Restore immutable research market-data cache
        uses: actions/cache@v4
        with:
          path: data/v11_mtf_cache
          key: v11-exact-r4-${{ hashFiles('scripts/v11_mtf_data_cache.py') }}-20260507-20260823

      - name: Preflight exact research contract
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_mtf_data_cache.py scripts/v11_backtest_geometry_r4.py scripts/v11_backtest_mtf.py scripts/v11_backtest_mtf_run.py scripts/v11_direct_backtest.py
          test -n "${TWELVEDATA_API_KEY:-}" || { echo TWELVEDATA_API_KEY_MISSING; exit 2; }
          python - <<'PY'
          import sys
          sys.path.insert(0,'scripts')
          import v11_mtf_data_cache as d
          cats=d.load_catalog()
          assert sum(map(len,cats.values()))==95
          print('V11_CONTRACT_PREFLIGHT_OK symbols=95 markets='+','.join(cats))
          PY

      - name: Resolve required 5AI gateway
        run: |
          set -euo pipefail
          SUBDOMAIN="$(curl -fsS --max-time 15 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | python3 -c 'import sys,json;print((json.load(sys.stdin).get("result") or {}).get("subdomain") or "")')"
          test -n "$SUBDOMAIN"
          echo "GATEWAY_URL=https://trading-v77-scanner.${SUBDOMAIN}.workers.dev/internal/multi-ai/review" >> "$GITHUB_ENV"

      - name: Five-AI pre-research review
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          context={
            'contract':{'symbols':95,'independent':True,'eligibleDayExecutions':'1..3','rr':[1,2],'minWinRatePct':80.0,'positiveExpectancy':True,'exactInstrumentData':True,'forbidden':['pooling','symbol deletion','fabrication','lookahead/leakage','silent eligible-day deletion','FINAL tuning']},
            'priorEvidence':{'V64_V69_V73':'EXPOSED DEVELOPMENT; NOT UNTOUCHED OOS','use':'bounded hypothesis seed only','knownThrough':'2026-07-31'},
            'currentResearch':{'data':'exact exchange/provider history; crypto H1 OKX-first with continuity-checked fallbacks; forex Twelve Data M5','method':'per-symbol H1 family/hour/entry-geometry coordinate search; conservative same-bar SL','final':'early-August onward untouched by legacy priors'},
            'task':'Audit integrity and propose bounded DEV/VALIDATION-only refinements. Deterministic replay is performance truth.'
          }
          instruction='V11 95-symbol pre-research. Claude, Codex, DeepSeek, Qwen and OpenRouter must independently review data integrity and the bounded per-symbol geometry research plan. Earlier V64/V69/V73 evidence is hypothesis material only. Never use FINAL for tuning and never claim performance without deterministic replay.'
          open('/tmp/pre.json','w').write(json.dumps({'task_id':'v11-pre-'+os.environ['GITHUB_RUN_ID'],'instruction':instruction,'context':context}))
          PY
          rm -f /tmp/pre-result.json
          for ATTEMPT in 1 2 3; do
            OIDC="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
            echo "::add-mask::$OIDC"
            CODE="$(curl -sS --connect-timeout 10 --max-time 150 -o /tmp/pre-attempt.json -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary @/tmp/pre.json || echo CURL_FAIL)"
            cp /tmp/pre-attempt.json /tmp/pre-result.json 2>/dev/null || true
            echo "5AI_PRE_ATTEMPT=$ATTEMPT HTTP=$CODE"
            if python - <<'PY'
          import json,sys
          e=['claude','codex','deepseek','qwen','openrouter']
          try:d=json.load(open('/tmp/pre-attempt.json'))
          except Exception:sys.exit(1)
          p=d.get('providers') or {}
          sys.exit(0 if all(str((p.get(x) or {}).get('status','')).upper()=='OK' for x in e) else 1)
          PY
            then break; fi
            sleep $((ATTEMPT*8))
          done
          python - <<'PY'
          import json,os
          e=['claude','codex','deepseek','qwen','openrouter']
          try:d=json.load(open('/tmp/pre-result.json'))
          except Exception:d={'ok':False,'error':'NO_VALID_RESPONSE','providers':{}}
          json.dump(d,open('data/v11_fiveai_direct_pre.json','w'),indent=2)
          p=d.get('providers') or {};complete=all(str((p.get(x) or {}).get('status','')).upper()=='OK' for x in e)
          for x in e:print('5AI_PRE',x,(p.get(x) or {}).get('status'))
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FIVE_AI_PRE_COMPLETE='+('1' if complete else '0')+'\n')
          print('FIVE_AI_PRE_COMPLETE',complete)
          PY

      - name: Deterministic DEV and VALIDATION replay
        run: |
          set -euo pipefail
          rm -rf data/v11_mtf_out; mkdir -p data/v11_mtf_out logs
          python -u scripts/v11_direct_backtest.py --mode fast --history-start "$V11_DATASET_START" --history-end "$V11_DATASET_END" --shard-index 0 --shard-count 1 2>&1 | tee logs/shard-0.log
          python -u scripts/v11_direct_backtest.py --merge
          cp data/v11_mtf_merged.json data/v11_mtf_fast_merged.json
          sha256sum data/v11_mtf_profiles.json > data/v11_profiles.sha256
          python - <<'PY'
          import json
          d=json.load(open('data/v11_mtf_fast_merged.json'));sy=d.get('symbols') or {};per={}
          for s,r in sorted(sy.items()):
            v=r.get('validation') or {};dev=r.get('dev') or {};p=r.get('profile') or {}
            per[s]={'market':r.get('market'),'pass':bool(r.get('pass')),'reasons':r.get('reasons') or [],'profile':p,'dev':{k:dev.get(k) for k in ('trades','eligibleDays','coveragePct','zeroExecutionDays','winRate','meanR','minTradesInDay','maxTradesInDay')},'validation':{k:v.get(k) for k in ('trades','eligibleDays','coveragePct','zeroExecutionDays','winRate','meanR','minTradesInDay','maxTradesInDay')}}
          passed=sum(1 for r in sy.values() if r.get('pass'));unavailable=sum(1 for r in sy.values() if 'DATA_UNAVAILABLE' in (r.get('reasons') or []))
          out={'catalogCount':95,'resultCount':len(sy),'passCount':passed,'failCount':95-passed,'dataUnavailable':unavailable,'allValidationPass':len(sy)==95 and passed==95 and unavailable==0,'symbols':per}
          json.dump(out,open('data/v11_fast_summary.json','w'),indent=2);print('FAST_SUMMARY',passed,'/95','DATA_UNAVAILABLE',unavailable)
          PY

      - name: Five-AI evidence review
        if: always()
        run: |
          set -euo pipefail
          rm -rf /tmp/v11-post-batches
          mkdir -p /tmp/v11-post-batches
          python - <<'PY'
          import json,os
          try: summary=json.load(open('data/v11_fast_summary.json'))
          except Exception: summary={'error':'DETERMINISTIC_EVIDENCE_MISSING','symbols':{}}
          rows=[]
          for s,r in sorted((summary.get('symbols') or {}).items()):
            d=r.get('dev') or {};v=r.get('validation') or {};p=r.get('profile') or {}
            rows.append([s,r.get('market'),bool(r.get('pass')),r.get('reasons') or [],p.get('rr'),
                         d.get('coveragePct'),d.get('winRate'),d.get('meanR'),d.get('zeroExecutionDays'),
                         v.get('coveragePct'),v.get('winRate'),v.get('meanR'),v.get('zeroExecutionDays')])
          # Claude consistently completed the small PRE payload (~33s) but hit the
          # bridge's ~60s limit on one monolithic 95-symbol POST. Keep all evidence,
          # but split it into five deterministic chunks of at most 19 symbols.
          size=19
          batches=[rows[i:i+size] for i in range(0,len(rows),size)]
          manifest={'catalogCount':summary.get('catalogCount'),'resultCount':summary.get('resultCount'),
                    'passCount':summary.get('passCount'),'failCount':summary.get('failCount'),
                    'dataUnavailable':summary.get('dataUnavailable'),'batchCount':len(batches),
                    'schema':['symbol','market','pass','reasons','rr','devCoverage','devWR','devMeanR','devZeroDays','valCoverage','valWR','valMeanR','valZeroDays']}
          json.dump(manifest,open('/tmp/v11-post-batches/manifest.json','w'),indent=2)
          instruction=('V11 post-VALIDATION evidence review, deterministic batch {batch}/{total}. '
                       'Claude, Codex, DeepSeek, Qwen and OpenRouter must independently analyze every symbol in this batch. '
                       'Use DEV/VALIDATION only. V64/V69/V73 are exposed-development hypothesis history only. '
                       'Propose bounded per-symbol/regime/geometry refinements preserving 1-3 real executions per eligible day, '
                       'RR only 1 or 2, WR>=80%, positive expectancy, exact data, and no pooling, deletion, fabrication or leakage. '
                       'FINAL is forbidden for learning. Do not infer missing evidence.')
          common={'catalogSummary':{k:manifest.get(k) for k in ('catalogCount','resultCount','passCount','failCount','dataUnavailable')},
                  'schema':manifest['schema'],
                  'priorEvidence':{'V64_V69_V73':'EXPOSED DEVELOPMENT ONLY','knownThrough':'2026-07-31','use':'hypothesis seed only'},
                  'integrity':{'sameBar':'SL conservative','final':'sealed','dailyExecutions':'1..3'}}
          for n,b in enumerate(batches,1):
            body={'task_id':f"v11-post-{os.environ['GITHUB_RUN_ID']}-b{n}",
                  'instruction':instruction.format(batch=n,total=len(batches)),
                  'context':{**common,'batch':n,'totalBatches':len(batches),'symbols':b}}
            json.dump(body,open(f'/tmp/v11-post-batches/request-{n}.json','w'),separators=(',',':'))
          print('5AI_POST_BATCHES',len(batches),'SYMBOLS',len(rows))
          PY

          BATCH_COUNT="$(python -c "import json;print(json.load(open('/tmp/v11-post-batches/manifest.json'))['batchCount'])")"
          ALL_COMPLETE=1
          for BATCH in $(seq 1 "$BATCH_COUNT"); do
            rm -f "/tmp/v11-post-batches/result-$BATCH.json"
            BATCH_OK=0
            for ATTEMPT in 1 2 3; do
              OIDC="$(curl -fsS --max-time 15 -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=trading-multi-ai-gateway" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')"
              echo "::add-mask::$OIDC"
              CODE="$(curl -sS --connect-timeout 10 --max-time 150 -o "/tmp/v11-post-batches/attempt-$BATCH.json" -w '%{http_code}' -X POST "$GATEWAY_URL" -H "Authorization: Bearer $OIDC" -H 'Content-Type: application/json' --data-binary "@/tmp/v11-post-batches/request-$BATCH.json" || echo CURL_FAIL)"
              cp "/tmp/v11-post-batches/attempt-$BATCH.json" "/tmp/v11-post-batches/result-$BATCH.json" 2>/dev/null || true
              echo "5AI_POST_BATCH=$BATCH ATTEMPT=$ATTEMPT HTTP=$CODE"
              if python - "$BATCH" <<'PY'
          import json,sys
          n=sys.argv[1];expected=['claude','codex','deepseek','qwen','openrouter']
          try:d=json.load(open(f'/tmp/v11-post-batches/attempt-{n}.json'))
          except Exception:sys.exit(1)
          p=d.get('providers') or {}
          sys.exit(0 if all(str((p.get(x) or {}).get('status','')).upper()=='OK' for x in expected) else 1)
          PY
              then BATCH_OK=1; break; fi
              sleep $((ATTEMPT*8))
            done
            if [ "$BATCH_OK" != "1" ]; then ALL_COMPLETE=0; fi
          done

          python - <<'PY'
          import json,os
          expected=['claude','codex','deepseek','qwen','openrouter']
          manifest=json.load(open('/tmp/v11-post-batches/manifest.json'))
          batches=[]
          aggregate={p:{'status':'OK','batchStatuses':[]} for p in expected}
          all_complete=True
          for n in range(1,int(manifest['batchCount'])+1):
            try:d=json.load(open(f'/tmp/v11-post-batches/result-{n}.json'))
            except Exception:d={'ok':False,'error':'NO_VALID_RESPONSE','providers':{}}
            batches.append({'batch':n,'task_id':d.get('task_id'),'ok':bool(d.get('ok')),'providers':d.get('providers') or {}})
            for p in expected:
              st=str((((d.get('providers') or {}).get(p) or {}).get('status') or 'MISSING')).upper()
              aggregate[p]['batchStatuses'].append(st)
              if st!='OK': aggregate[p]['status']=st
            if not all(str((((d.get('providers') or {}).get(p) or {}).get('status') or '')).upper()=='OK' for p in expected):
              all_complete=False
          out={'ok':all_complete,'mode':'BATCHED_5AI_POST_REVIEW','manifest':manifest,'providers':aggregate,'batches':batches}
          json.dump(out,open('data/v11_fiveai_post.json','w'),indent=2)
          for p in expected:print('5AI_POST',p,aggregate[p]['status'],aggregate[p]['batchStatuses'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FIVE_AI_POST_COMPLETE='+('1' if all_complete else '0')+'\n')
          print('FIVE_AI_POST_COMPLETE',all_complete)
          PY

      - name: Seal FINAL eligibility
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          try:s=json.load(open('data/v11_fast_summary.json'))
          except Exception:s={}
          ready=bool(s.get('allValidationPass')) and os.environ.get('FIVE_AI_PRE_COMPLETE')=='1' and os.environ.get('FIVE_AI_POST_COMPLETE')=='1'
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('FINAL_READY='+('1' if ready else '0')+'\n')
          print('FINAL_READY',ready)
          PY

      - name: Untouched FINAL replay
        if: env.FINAL_READY == '1'
        run: |
          set -euo pipefail
          sha256sum -c data/v11_profiles.sha256
          rm -rf data/v11_mtf_out; mkdir -p data/v11_mtf_out
          python -u scripts/v11_direct_backtest.py --mode final --history-start "$V11_DATASET_START" --history-end "$V11_DATASET_END" --shard-index 0 --shard-count 1 2>&1 | tee logs/final-0.log
          python -u scripts/v11_direct_backtest.py --merge
          cp data/v11_mtf_merged.json data/v11_mtf_final_merged.json
          python - <<'PY'
          import json
          d=json.load(open('data/v11_mtf_final_merged.json'));sy=d.get('symbols') or {};passed=sum(1 for r in sy.values() if r.get('pass'))
          per={s:{'market':r.get('market'),'pass':bool(r.get('pass')),'reasons':r.get('reasons') or [],'oos':{k:(r.get('oos') or {}).get(k) for k in ('trades','eligibleDays','coveragePct','zeroExecutionDays','winRate','meanR','minTradesInDay','maxTradesInDay')}} for s,r in sorted(sy.items())}
          json.dump({'catalogCount':95,'resultCount':len(sy),'passCount':passed,'failCount':95-passed,'allFinalPass':len(sy)==95 and passed==95,'symbols':per},open('data/v11_final_summary.json','w'),indent=2);print('FINAL_SUMMARY',passed,'/95')
          PY

      - name: Publish machine-readable research status
        if: always()
        run: |
          set +e
          python - <<'PY'
          import json,os
          def load(p,default=None):
            try:return json.load(open(p))
            except Exception:return default
          fast=load('data/v11_fast_summary.json',{}) or {};final=load('data/v11_final_summary.json',{}) or {};pre=load('data/v11_fiveai_direct_pre.json',{}) or {};post=load('data/v11_fiveai_post.json',{}) or {}
          providers=['claude','codex','deepseek','qwen','openrouter']
          pstat=lambda d:{p:str(((d.get('providers') or {}).get(p) or {}).get('status') or 'MISSING') for p in providers}
          preok=all(v=='OK' for v in pstat(pre).values())
          postok=bool(post.get('ok')) and all(v=='OK' for v in pstat(post).values())
          if final.get('allFinalPass') and preok and postok:status='COMPLETE_ALL_95_PASS'
          elif fast.get('allValidationPass') and not (preok and postok):status='FIVE_AI_BLOCKED_WITH_DETERMINISTIC_EVIDENCE'
          elif fast.get('allValidationPass'):status='FINAL_INCOMPLETE_OR_FAIL'
          elif fast:status='REFINEMENT_REQUIRED'
          else:status='HARD_BLOCKER_RUN_INCOMPLETE'
          out={'status':status,'runId':os.environ.get('GITHUB_RUN_ID'),'commit':os.environ.get('GITHUB_SHA'),'fiveAiPre':pstat(pre),'fiveAiPost':pstat(post),'fiveAiPostMode':post.get('mode'),'fiveAiPostComplete':postok,'fast':{k:fast.get(k) for k in ('catalogCount','resultCount','passCount','failCount','dataUnavailable','allValidationPass')},'final':{k:final.get(k) for k in ('catalogCount','resultCount','passCount','failCount','allFinalPass')}}
          json.dump(out,open('data/v11_direct_backtest_status.json','w'),indent=2)
          PY
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin v11-research-status:v11-research-status 2>/dev/null || git checkout --orphan v11-research-status
          git checkout v11-research-status 2>/dev/null || true
          mkdir -p status;cp data/v11_direct_backtest_status.json status/latest.json
          test -f data/v11_fast_summary.json && cp data/v11_fast_summary.json status/fast-summary.json
          test -f data/v11_final_summary.json && cp data/v11_final_summary.json status/final-summary.json
          test -f data/v11_fiveai_direct_pre.json && cp data/v11_fiveai_direct_pre.json status/fiveai-pre.json
          test -f data/v11_fiveai_post.json && cp data/v11_fiveai_post.json status/fiveai-post.json
          git add status;git commit -m "status: V11 direct research $GITHUB_RUN_ID" || true;git push -f origin HEAD:v11-research-status || true
