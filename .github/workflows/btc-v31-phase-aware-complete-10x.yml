name: BTC V31 Phase Aware Complete 10X

on:
  push:
    paths:
      - 'research/btc_v31_phase_aware_complete_10x.py'
      - '.github/workflows/btc-v31-phase-aware-complete-10x.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Run BTC V31 phase-aware complete-data backtest
        shell: bash
        run: |
          set -o pipefail
          mkdir -p research/results
          python3 research/btc_v31_phase_aware_complete_10x.py 2>&1 | tee research/results/BTC_v31_phase_aware_complete_10x.txt
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: BTC-v31-phase-aware-complete-10x-result
          path: research/results/BTC_v31_phase_aware_complete_10x.txt
          retention-days: 30
