name: Blind Crypto Backtest V24
on:
  push:
    paths:
      - 'scripts/blind_backtest_crypto_v24.py'
      - '.github/workflows/blind-backtest-v24.yml'
  workflow_dispatch:
jobs:
  v24:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/blind_backtest_crypto_v24.py
      - run: |
          git config user.name "blind-backtest-bot"
          git config user.email "blind-backtest-bot@users.noreply.github.com"
          git add data/blind_backtest_v24.json
          git commit -m "Run V24 market-flow true blind" || exit 0
          git pull --rebase origin main || true
          git push || true
