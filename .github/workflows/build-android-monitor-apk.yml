name: Build Android Monitor APK

on:
  push:
    branches: [main]
    paths:
      - 'android-monitor/**'
      - '.github/workflows/build-android-monitor-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-monitor
        run: gradle --no-daemon :app:assembleDebug

      - name: Copy APK with stable name
        run: |
          mkdir -p dist
          cp android-monitor/app/build/outputs/apk/debug/app-debug.apk dist/SignalHub-Android-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: SignalHub-Android-APK
          path: dist/SignalHub-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
