# Capture upstream licence and card metadata for staged models.
#
# `license_verified: true` in the Open Model Universe record has to mean someone
# checked, and the runtime cannot: huggingface.co is 403 at its gateway. Citing
# the repo URL as "evidence" would be citing a page nobody fetched.
#
# So the fetch happens on a runner, against the Hugging Face API, and records
# what it actually got - the declared licence, the licence link, the gated flag
# and the commit the metadata was read at. Metadata only; no weights are
# downloaded here.
#
# If a repo does not declare a licence, that is recorded as undeclared rather
# than filled in from what the family is generally known to use. A licence
# assumed from a model's reputation is not a verified licence.
name: Capture staged model metadata

on:
  push:
    branches: ['ops/publish-model-release']
    paths:
      - .github/workflows/model-metadata.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, pathlib, urllib.request, datetime

          manifest = json.load(open("AI_SKILL_LIBRARY/v4/open_model_universe/staging_manifest.json"))

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "model-metadata"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          out = {"fetched_at": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
                 "fetched_by": "github-actions", "models": {}}

          for entry in manifest["entries"]:
              repo = entry["hf_repo"]
              row = {"hf_repo": repo, "model_id": entry["id"]}
              try:
                  info = get(f"https://huggingface.co/api/models/{repo}")
                  card = info.get("cardData") or {}
                  licence = card.get("license") or info.get("license")
                  row.update({
                      "license_declared": licence or None,
                      "license_name_raw": card.get("license_name"),
                      "license_link": card.get("license_link"),
                      "gated": info.get("gated", False),
                      "private": info.get("private", False),
                      "head_sha_at_fetch": info.get("sha"),
                      "pipeline_tag": info.get("pipeline_tag"),
                      "tags": (info.get("tags") or [])[:20],
                      "status": "fetched" if licence else "license_undeclared",
                  })
              except Exception as exc:
                  row["status"] = f"fetch_failed:{type(exc).__name__}"
              out["models"][entry["id"]] = row

          pathlib.Path("model-metadata.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          PY

          TAG=staged-model-metadata
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Staged model upstream metadata" \
              --notes "Licence and card metadata fetched from the Hugging Face API on a runner, because the runtime cannot reach it. Metadata only - no weights." --prerelease
          fi
          gh release upload "$TAG" model-metadata.json --clobber
