name: V11 Immediate Backtest Bootstrap

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v11-backtest-now.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v11-immediate-backtest-bootstrap
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 111
    env:
      V11_BT_DAYS: '122'
      V11_HISTORY_DAYS: '330'
      V11_REQUIRED_WR: '80'
      V11_MIN_TOTAL_TRADES: '60'
      V11_MIN_TUNE_DAYS: '18'
      V11_OPT_WORKERS: '4'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install research dependencies
        run: python -m pip install --disable-pip-version-check -q numpy scikit-learn

      - name: Validate V11 runner
        run: |
          set -euo pipefail
          python -m py_compile scripts/v11_backtest_legacy_ml_4m.py scripts/v11_backtest_legacy_ml_4m_run.py
          grep -q 'ALLOWED_RR = (1.0, 2.0)' scripts/v11_backtest_legacy_ml_4m.py
          grep -q 'MAXTRADES = (1, 2, 3)' scripts/v11_backtest_legacy_ml_4m.py

      - name: Run V11 122-day per-symbol backtest now
        run: |
          set -euo pipefail
          echo "BOOTSTRAP_SHA=$(git rev-parse HEAD)"
          python -u scripts/v11_backtest_legacy_ml_4m_run.py

      - name: Verify result integrity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          r=json.load(open('data/v11_legacy_ml_backtest_4m.json',encoding='utf-8'))
          g=json.load(open('data/v11_legacy_ml_backtest_gate.json',encoding='utf-8'))
          assert r['meta']['allowedRR']==[1,2]
          assert r['meta']['maxEntriesPerEligibleDay']==3
          assert len(r['symbols'])==r['meta']['totalSymbols']==95
          assert g['totalSymbols']==95
          assert g['passCount']==sum(bool(x.get('pass')) for x in r['symbols'].values())
          assert g['allPassed']==(g['passCount']==95)
          print({'integrity':'PASS','passCount':g['passCount'],'totalSymbols':95,'allPassed':g['allPassed']})
          PY

      - name: Upload bootstrap evidence
        uses: actions/upload-artifact@v4
        with:
          name: v11-immediate-bootstrap-${{ github.run_id }}
          path: |
            data/v11_legacy_ml_backtest_4m.json
            data/v11_legacy_ml_backtest_gate.json
          retention-days: 14
