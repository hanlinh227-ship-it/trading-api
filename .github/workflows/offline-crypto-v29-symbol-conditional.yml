name: Offline Crypto V29 Symbol Conditional
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/offline_crypto_v29_symbol_conditional.py'
      - '.github/workflows/offline-crypto-v29-symbol-conditional.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Crypto V29 zero-credit optimizer
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/offline_crypto_v29_symbol_conditional.py
