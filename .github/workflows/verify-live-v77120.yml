name: Verify Live V77.12 Fresh Scan State

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare-worker/index.js'
      - '.github/workflows/verify-live-v77120.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Wait Cloudflare deploy
        run: sleep 45
      - name: Verify fresh scans and persistent orders
        shell: bash
        run: |
          set +e
          BASE='https://trading-v77-scanner.hanlinh227.workers.dev'
          : > V77120_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/status" -o /tmp/status.json; echo "STATUS_CURL=$?" >> V77120_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/orders_before.json; echo "ORDERS_BEFORE_CURL=$?" >> V77120_LIVE_CHECK.txt
          curl -fsS --max-time 90 "$BASE/run-now?group=crypto" -o /tmp/c1.json; echo "CRYPTO1_CURL=$?" >> V77120_LIVE_CHECK.txt
          sleep 3
          curl -fsS --max-time 90 "$BASE/run-now?group=crypto" -o /tmp/c2.json; echo "CRYPTO2_CURL=$?" >> V77120_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/latest-scan?group=crypto" -o /tmp/latest.json; echo "LATEST_CURL=$?" >> V77120_LIVE_CHECK.txt
          curl -fsS --max-time 30 "$BASE/orders" -o /tmp/orders_after.json; echo "ORDERS_AFTER_CURL=$?" >> V77120_LIVE_CHECK.txt
          curl -fsS --max-time 120 "$BASE/hub" -o /tmp/hub.json; echo "HUB_CURL=$?" >> V77120_LIVE_CHECK.txt
          node - <<'NODE' >> V77120_LIVE_CHECK.txt 2>&1
          const fs=require('fs');
          const read=n=>{try{return JSON.parse(fs.readFileSync('/tmp/'+n+'.json','utf8'))}catch(e){return {parseError:e.message}}};
          const s=read('status'),b1=read('orders_before'),c1=read('c1'),c2=read('c2'),ls=read('latest'),b2=read('orders_after'),h=read('hub');
          const counts=b=>['forex','crypto','metal'].map(g=>{const x=b[g]||{};return [g,(x.marketActive||[]).length,(x.limitActive||[]).length,(x.limitPending||[]).length,(x.watch||[]).length].join(':')}).join('|');
          console.log('VERSION='+(s.version||'-')); console.log('STATUS_OK='+(s.ok===true?'YES':'NO'));
          console.log('CRYPTO1='+(c1.broadOk??'-')+'/'+(c1.requested??'-')+' deep='+(c1.deepOk??'-')+'/'+(c1.deepRequested??'-'));
          console.log('CRYPTO1_SCAN='+(c1.scanId||'-')); console.log('CRYPTO1_AT='+(c1.scannedAt||'-'));
          console.log('CRYPTO2='+(c2.broadOk??'-')+'/'+(c2.requested??'-')+' deep='+(c2.deepOk??'-')+'/'+(c2.deepRequested??'-'));
          console.log('CRYPTO2_SCAN='+(c2.scanId||'-')); console.log('CRYPTO2_AT='+(c2.scannedAt||'-'));
          console.log('SCAN_IDS_DIFFER='+(c1.scanId&&c2.scanId&&c1.scanId!==c2.scanId?'YES':'NO'));
          console.log('LATEST_MATCHES_SECOND='+(ls.snapshot?.scanId===c2.scanId?'YES':'NO'));
          console.log('ORDERS_BEFORE='+counts(b1)); console.log('ORDERS_AFTER='+counts(b2));
          console.log('ORDER_COUNTS_PRESERVED='+(counts(b1)===counts(b2)?'YES':'NO'));
          console.log('DURABLE_WATCH_ZERO='+(['forex','crypto','metal'].every(g=>(b2[g]?.watch||[]).length===0)?'YES':'NO'));
          console.log('HUB_OK='+(h.ok===true?'YES':'NO')); console.log('HUB_SCAN='+(h.hubScanId||'-')); console.log('HUB_AT='+(h.scannedAt||'-'));
          console.log('HUB_GROUP_SCANS='+['crypto','forex','metal'].map(g=>g+':'+(h.runs?.[g]?.scanId||'-')).join('|'));
          console.log('HUB_TOP='+((h.top||[]).map(a=>a.symbol+':'+a.status+':'+(a.score??'-')+':'+(a.scannedAt||'-')).join('|')));
          const pass=s.version==='V77.12.0'&&s.ok===true&&c1.scanId&&c2.scanId&&c1.scanId!==c2.scanId&&ls.snapshot?.scanId===c2.scanId&&counts(b1)===counts(b2)&&['forex','crypto','metal'].every(g=>(b2[g]?.watch||[]).length===0)&&h.ok===true&&h.hubScanId;
          console.log('VERDICT='+(pass?'PASS':'FAIL'));
          NODE
      - name: Commit report
        run: |
          git config user.name trading-runtime-bot
          git config user.email trading-runtime-bot@users.noreply.github.com
          git add V77120_LIVE_CHECK.txt
          git commit -m 'Report V77.12 live fresh-scan state verification' || exit 0
          git push origin main
