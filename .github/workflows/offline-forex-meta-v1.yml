name: Offline Forex Meta V1

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/offline_forex_meta_v1.py"
      - ".github/workflows/offline-forex-meta-v1.yml"

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run offline Forex meta analysis
        run: python scripts/offline_forex_meta_v1.py
      - name: Commit result
        run: |
          git config user.name "offline-meta-bot"
          git config user.email "offline-meta-bot@users.noreply.github.com"
          git add data/offline_forex_meta_v1.json
          git commit -m "Run offline Forex meta analysis" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main || true
