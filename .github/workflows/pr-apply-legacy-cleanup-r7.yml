name: V77.18.43 PR Legacy Cleanup R7
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/migrate_legacy_cleanup_r7.mjs'
      - '.github/workflows/pr-apply-legacy-cleanup-r7.yml'
permissions:
  contents: write
jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply legacy cleanup
        run: node scripts/migrate_legacy_cleanup_r7.mjs
      - name: Syntax check
        run: |
          node --check cloudflare-worker/index.js
          node --check cloudflare-worker/engine-v77168.js
      - name: Commit runtime cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cloudflare-worker/index.js cloudflare-worker/engine-v77168.js
          if git diff --cached --quiet; then echo 'No runtime changes'; exit 0; fi
          git commit -m 'V77.18.43 remove legacy global scan/live and sync version'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
