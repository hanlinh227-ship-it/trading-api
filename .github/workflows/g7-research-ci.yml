name: G7 Research CI

on:
  push:
    branches:
      - research/cloud-10coin-g7-regime-router-20260913
  workflow_dispatch:

concurrency:
  group: g7-research-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/cloud_10coin_backtest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: research/cloud_10coin_backtest/requirements.txt
      - run: pip install -r requirements.txt
      - name: G7 regime RED/GREEN tests
        run: PYTHONPATH=. pytest tests/test_g7_regime.py -q
      - name: Full regression suite
        run: PYTHONPATH=. pytest tests -q
