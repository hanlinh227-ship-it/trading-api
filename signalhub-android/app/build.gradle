plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanlinh.signalhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanlinh.signalhub'
        minSdk 26
        targetSdk 33
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
