plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hanlinh.signalhub'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hanlinh.signalhub'
        minSdk 26
        targetSdk 33
        versionCode 10
        versionName '3.4.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
