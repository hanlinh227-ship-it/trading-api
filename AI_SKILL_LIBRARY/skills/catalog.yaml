version: 2
policy:
  lazy_load: true
  mandatory_skill: task_router
  default_primary_count: 1
  default_max_supporting: 2
  canonical_router: AI_SKILL_LIBRARY/v4/stable/router.yaml
  alias_rows_are_never_primary: true
  alias_triggers_fold_into_canonical_skill: true
  one_primary_skill_per_purpose: true
_templates:
  core: &core {domain: core, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [], sources: [], output_contract: "Return a scoped, evidence-aware result with material uncertainty, explicit assumptions, and a verification checkpoint when the conclusion is consequential."}
  engineering: &engineering {domain: engineering, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [software_development_workflow], sources: [code, software], output_contract: "Return a repository-grounded implementation or technical answer with bounded context, reversible/isolate-first changes, and tests or verification appropriate to the change; do not claim completion without evidence."}
  trading: &trading {domain: trading, triggers: [], excludes: [game economy, fictional trading], requires: [task_router], conflicts_with: [], priority: 80, tools: [multi_asset_market_data], sources: [trading], output_contract: "Return read-only analysis with source freshness, current project authority, instrument/venue semantics, risk context, and realistic execution assumptions when material; never fabricate live state or convert research into execution permission."}
  game: &game {domain: game, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [software_development_workflow], sources: [game, code], output_contract: "Return game-specific design/implementation guidance with engine constraints, bounded change scope, and runtime/visual/debug verification checkpoints where applicable."}
  design: &design {domain: design, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [ux_ui_design], sources: [ux_ui], output_contract: "Return design decisions tied to goals, constraints, accessibility, token/component consistency, deliverable format, and validation of the final artifact or design-to-code mapping when relevant."}
  adobe: &adobe {domain: adobe, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [video_generation], sources: [], output_contract: "Return an application-specific non-destructive workflow and export/verification checks."}
  prompt: &prompt {domain: prompt, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [video_generation], sources: [prompt], output_contract: "Return a render-ready prompt/workflow with an explicit objective, preserved positive/negative constraints, measurable revision criteria when iterating, and no false guarantee for stochastic generation."}
  writing: &writing {domain: writing, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [], sources: [script], output_contract: "Return task-appropriate writing while preserving audience, tone, continuity, and factual boundaries."}
  academic: &academic {domain: academic, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [scientific_evidence], sources: [], output_contract: "Return evidence-grounded academic work with methodology, citation, and uncertainty checks."}
  data_docs: &data_docs {domain: data_docs, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [], sources: [], output_contract: "Return a correct data/document artifact or workflow with format-specific validation."}
  business: &business {domain: business, triggers: [], excludes: [], requires: [task_router], conflicts_with: [], priority: 80, tools: [product_design], sources: [], output_contract: "Return a decision-oriented business/marketing result with assumptions, trade-offs, and measurable next steps."}
skills:
  - {<<: *core, id: task_router, triggers: [route task, new chat, classify intent], requires: [], priority: 100}
  - {<<: *core, id: core_reasoning, triggers: [reason, explain, solve]}
  - {<<: *core, id: critical_thinking, triggers: [critique, phản biện, challenge assumption], priority: 95}
  - {<<: *core, id: fact_checking, triggers: [fact check, verify claim], tools: [scientific_evidence]}
  - {<<: *core, id: research, triggers: [research, sources, evidence], tools: [scientific_evidence]}
  - {<<: *core, id: planning, triggers: [plan, roadmap, implementation plan], output_contract: "Return a bounded plan with dependencies, sequencing, bottleneck/risk checks, verification gates, rollback path, and no unnecessary subsystem growth."}
  - {<<: *core, id: verification, triggers: [verify, validate, final check], priority: 95, output_contract: "Return an evidence-based verification result that distinguishes checked facts from assumptions, confirms protected constraints, and refuses success claims when required proof is missing."}
  - {<<: *core, id: troubleshooting, triggers: [troubleshoot, error, broken], output_contract: "Return a root-cause-oriented troubleshooting result: reproduce or characterize the failure, isolate the cause, propose the smallest safe fix, and verify against regression."}
  - {<<: *core, id: comparison, triggers: [compare, versus]}
  - {<<: *core, id: recommendation, triggers: [recommend, choose]}
  - {<<: *core, id: learning, triggers: [learn, teach, tutorial]}
  - {<<: *core, id: summarization, triggers: [summarize, summary]}
  - {<<: *core, id: translation, triggers: [translate, translation]}
  - {<<: *core, id: general_problem_solving, triggers: [general question, how to]}
  - {<<: *core, id: error_recovery, triggers: [recover, rollback, conflict]}
  - {<<: *engineering, id: coding, triggers: [code, implement], output_contract: "Return a repository-grounded implementation using the smallest coherent change, explicit interfaces/dependencies, tests or executable verification, and no unverified completion claim."}
  - {<<: *engineering, id: debugging, triggers: [bug, debug, unexpected behavior, github actions failure], output_contract: "Return a reproduce-to-root-cause-to-regression-test debugging result; fix the causal defect rather than symptoms and verify the final behavior."}
  - {<<: *engineering, id: tdd, triggers: [tdd, test driven], output_contract: "Return a strict RED -> minimum GREEN -> refactor/cleanup workflow with the failing behavior demonstrated before implementation and regression proof afterward."}
  - {<<: *engineering, id: software_architecture, triggers: [architecture, system design]}
  - {<<: *engineering, id: github, triggers: [github, repository, pull request], output_contract: "Return a GitHub workflow grounded in the exact repository/ref with isolated branch changes, CI evidence, review handling, and expected-head protection for merge-sensitive work."}
  - {<<: *engineering, id: api, triggers: [api, endpoint, contract]}
  - {<<: *engineering, id: database, triggers: [database, sql, schema]}
  - {<<: *engineering, id: security, triggers: [security, threat model, repository threat model], excludes: [unauthorized exploitation]}
  - {<<: *engineering, id: android, triggers: [android, apk, widget]}
  - {<<: *engineering, id: web_app, triggers: [web app, frontend, backend]}
  - {<<: *engineering, id: deployment, triggers: [deploy, production, ci cd], output_contract: "Return a deploy plan/result with immutable source identity, preflight checks, rollback target, runtime-switch preservation, and post-deploy production verification."}
  - {<<: *engineering, id: automation, triggers: [automation, workflow], output_contract: "Return a bounded, idempotent automation design with explicit triggers, permissions, failure handling, observability, and no silent permission widening."}
  - {<<: *engineering, id: skill_engineering, triggers: [create a skill, design a skill, update a skill, skill manifest, skill contract, skill registry design, normalize a skill], priority: 94, output_contract: "Return a canonical skill design or revision with strengthen-existing-skill-first overlap decision, typed contract, permission ceiling, provenance/license/maintenance status, context/performance impact, eval requirements, and promotion path."}
  - {<<: *engineering, id: eval_engineering, triggers: [evaluate this skill, benchmark this skill, regression test this skill, compare skill versions, build an eval suite, canary this capability], priority: 93, output_contract: "Return an evidence-based capability evaluation with baseline, representative and adversarial cases, protected-regression checks, source/license validity, context/latency cost, and promote/revise/reject recommendation without self-promotion."}
