version: 2
defaults:
  route_every_request: true
  mandatory_skill: task_router
  max_domain_skills: 3
  max_supporting_skills: 2
  cross_cutting_skills: [critical_thinking, verification]
  unknown_intent: general_problem_solving
  load_project_authority_after_routing: true
  preload_all_skills: false
  preload_trading_state: false
  skill_catalog_path: AI_SKILL_LIBRARY/skills/catalog.yaml
  project_registry_path: AI_SKILL_LIBRARY/projects.yaml
  dynamic_catalog_selection: true

execution_order:
  - task_router
  - project_authority
  - primary_skill
  - supporting_skills
  - relevant_sources
  - relevant_plugins
  - critical_review
  - execute
  - verification
  - answer

skills:
  - {id: task_router, path: AI_SKILL_LIBRARY/skills/core/task_router.md, domains: [core], aliases: [intent_classification, task_decomposition, skill_selection], triggers: [route task, choose skill, mixed task, new chat], excludes: [], requires: [], conflicts_with: [], priority: 100, plugin_ids: [], source_categories: []}
  - {id: critical_thinking, path: AI_SKILL_LIBRARY/skills/core/critical_thinking.md, domains: [core], aliases: [critique, phản_biện, argumentation, decision_analysis, evidence_synthesis], triggers: [critique, phản biện, compare evidence, challenge assumption, decision], excludes: [], requires: [], conflicts_with: [], priority: 95, plugin_ids: [scientific_evidence], source_categories: []}
  - {id: research, path: AI_SKILL_LIBRARY/skills/core/research.md, domains: [core, research], aliases: [fact_checking, web_research, source_triangulation], triggers: [research, verify facts, current information, sources], excludes: [], requires: [], conflicts_with: [], priority: 90, plugin_ids: [scientific_evidence], source_categories: []}
  - {id: planning, path: AI_SKILL_LIBRARY/skills/core/planning.md, domains: [core], aliases: [project_planning, implementation_plan], triggers: [plan, architecture, multi step, project], excludes: [], requires: [], conflicts_with: [], priority: 80, plugin_ids: [software_development_workflow], source_categories: [software]}
  - {id: verification, path: AI_SKILL_LIBRARY/skills/core/verification.md, domains: [core], aliases: [qa, validation, completion_check], triggers: [verify, test, final check, complete], excludes: [], requires: [], conflicts_with: [], priority: 100, plugin_ids: [], source_categories: []}
  - {id: error_recovery, path: AI_SKILL_LIBRARY/skills/core/error_recovery.md, domains: [core], aliases: [troubleshooting, recovery], triggers: [error, failed, broken, recover, conflict], excludes: [], requires: [], conflicts_with: [], priority: 90, plugin_ids: [], source_categories: []}
  - {id: general_problem_solving, path: AI_SKILL_LIBRARY/skills/core/general_problem_solving.md, domains: [general], aliases: [comparison, recommendation, troubleshooting, how_to, learning, translation, summarization], triggers: [compare, recommend, how to, explain, learn, summarize, translate], excludes: [], requires: [], conflicts_with: [], priority: 10, plugin_ids: [], source_categories: []}

  - {id: software_engineering, path: AI_SKILL_LIBRARY/skills/engineering/software_engineering.md, domains: [engineering], aliases: [coding, software_architecture, code_review, github_ops, api_design, database, security], triggers: [code, app, api, database, architecture, github, security], excludes: [pure creative writing], requires: [], conflicts_with: [], priority: 80, plugin_ids: [software_development_workflow], source_categories: [code, software]}
  - {id: debugging_tdd, path: AI_SKILL_LIBRARY/skills/engineering/debugging_tdd.md, domains: [engineering], aliases: [debugging, tdd, tests, root_cause, regression], triggers: [bug, test failure, unexpected behavior, fix], excludes: [], requires: [software_engineering], conflicts_with: [], priority: 90, plugin_ids: [software_development_workflow], source_categories: [code, software]}
  - {id: platform_engineering, path: AI_SKILL_LIBRARY/skills/engineering/platform_engineering.md, domains: [engineering], aliases: [deployment, cloudflare, android, web_app, automation, agent_coordination], triggers: [deploy, cloudflare, android, web app, automation, agent workflow], excludes: [], requires: [software_engineering], conflicts_with: [], priority: 75, plugin_ids: [software_development_workflow], source_categories: [software]}

  - {id: trading_router, path: AI_SKILL_LIBRARY/skills/trading/trading_router.md, domains: [trading], aliases: [crypto, forex, futures, indices, trading_bot], triggers: [trade, trading, crypto, forex, futures, index, market entry, bot], excludes: [game economy, ecommerce price], requires: [], conflicts_with: [], priority: 100, plugin_ids: [multi_asset_market_data, crypto_market_data], source_categories: [trading]}
  - {id: market_analysis, path: AI_SKILL_LIBRARY/skills/trading/market_analysis.md, domains: [trading], aliases: [technical_analysis, market_microstructure, live_data_validation, orderflow], triggers: [chart, structure, orderbook, liquidity, live price, technical], excludes: [], requires: [trading_router], conflicts_with: [], priority: 90, plugin_ids: [multi_asset_market_data, crypto_market_data], source_categories: [trading]}
  - {id: risk_execution, path: AI_SKILL_LIBRARY/skills/trading/risk_execution.md, domains: [trading], aliases: [risk_management, execution, sl_tp, position_sizing], triggers: [risk, stop loss, take profit, sizing, leverage, execute], excludes: [], requires: [trading_router], conflicts_with: [], priority: 90, plugin_ids: [multi_asset_market_data, crypto_market_data], source_categories: [trading]}
  - {id: quant_backtesting, path: AI_SKILL_LIBRARY/skills/trading/quant_backtesting.md, domains: [trading], aliases: [backtesting, quant_research, strategy_validation, statistics], triggers: [backtest, quant, strategy test, win rate, monte carlo], excludes: [], requires: [trading_router], conflicts_with: [], priority: 80, plugin_ids: [], source_categories: [trading, code]}
  - {id: mt5_mql5, path: AI_SKILL_LIBRARY/skills/trading/mt5_mql5.md, domains: [trading, engineering], aliases: [mt5, mql5, expert_advisor, ea], triggers: [MT5, MQL5, EA, MetaEditor, expert advisor], excludes: [], requires: [trading_router], conflicts_with: [], priority: 95, plugin_ids: [software_development_workflow], source_categories: [trading, code]}

  - {id: game_dev, path: AI_SKILL_LIBRARY/skills/creative/game_dev.md, domains: [game, creative, engineering], aliases: [game_design, gameplay_systems, godot, unity, web_game, game_ai, level_design, game_2d, game_3d, optimization], triggers: [game, Godot, Unity, gameplay, level, NPC, game engine], excludes: [gambling trading], requires: [], conflicts_with: [], priority: 85, plugin_ids: [software_development_workflow], source_categories: [game, code, software]}
  - {id: design_2d_ux, path: AI_SKILL_LIBRARY/skills/creative/design_2d_ux.md, domains: [creative, design], aliases: [graphic_design, ux_ui, product_design, design_system, branding, typography, color, layout, illustration, product_photography], triggers: [design, UX, UI, graphic, brand, typography, layout, product image], excludes: [3D modeling only], requires: [], conflicts_with: [], priority: 80, plugin_ids: [ux_ui_design, product_design], source_categories: [ux_ui]}
  - {id: design_3d_blender, path: AI_SKILL_LIBRARY/skills/creative/design_3d_blender.md, domains: [creative, design, 3d], aliases: [design_3d, modeling, topology, uv, texturing, materials, lighting, rigging, animation_3d, rendering, asset_optimization, blender], triggers: [3D, Blender, model, topology, UV, rig, render, material], excludes: [2D-only layout], requires: [], conflicts_with: [], priority: 85, plugin_ids: [two_d_to_three_d], source_categories: [game, software]}
  - {id: adobe_media, path: AI_SKILL_LIBRARY/skills/creative/adobe_media.md, domains: [creative, media], aliases: [photoshop, illustrator, premiere_pro, after_effects, lightroom, audition, indesign, acrobat], triggers: [Photoshop, Illustrator, Premiere, After Effects, Lightroom, Audition, InDesign, Acrobat, Adobe], excludes: [], requires: [], conflicts_with: [], priority: 90, plugin_ids: [video_generation], source_categories: []}
  - {id: prompt_engineering, path: AI_SKILL_LIBRARY/skills/creative/prompt_engineering.md, domains: [creative, ai], aliases: [image_prompt, video_prompt, agent_prompt, negative_constraints, prompt_debugging, prompt_optimization], triggers: [prompt, negative prompt, prompt error, prompt optimize], excludes: [], requires: [], conflicts_with: [], priority: 90, plugin_ids: [video_generation], source_categories: [prompt]}
  - {id: generative_media, path: AI_SKILL_LIBRARY/skills/creative/generative_media.md, domains: [creative, media], aliases: [image_generation, image_editing, video_generation, character_consistency, scene_continuity, camera_direction, storyboard, video_editing], triggers: [generate image, edit image, video scene, character consistency, camera, storyboard], excludes: [], requires: [], conflicts_with: [], priority: 85, plugin_ids: [video_generation, two_d_to_three_d], source_categories: [prompt, script]}
  - {id: scriptwriting, path: AI_SKILL_LIBRARY/skills/creative/scriptwriting.md, domains: [creative, writing], aliases: [screenwriting, voice_over, advertising_copy, hook_retention, storytelling, children_content, youtube_script, social_content], triggers: [script, voice over, hook, story, screenplay, YouTube, social content], excludes: [], requires: [], conflicts_with: [], priority: 80, plugin_ids: [], source_categories: [script, prompt]}

  - {id: academic_research, path: AI_SKILL_LIBRARY/skills/academic/research_methodology.md, domains: [academic, research], aliases: [literature_review, methodology, qualitative_research, quantitative_analysis, interdisciplinary_research, citation_review, argumentation], triggers: [paper, thesis, academic, methodology, literature review, qualitative, quantitative, citation], excludes: [], requires: [research], conflicts_with: [], priority: 85, plugin_ids: [scientific_evidence], source_categories: []}
  - {id: data_documents, path: AI_SKILL_LIBRARY/skills/productivity/data_documents.md, domains: [productivity, data], aliases: [data_analysis, spreadsheet, charts, report, docx, pdf, slides, presentation, google_docs_workflow], triggers: [spreadsheet, Excel, chart, report, Word, docx, PDF, slides, presentation, Google Docs], excludes: [], requires: [], conflicts_with: [], priority: 80, plugin_ids: [], source_categories: [software]}
  - {id: marketing_business, path: AI_SKILL_LIBRARY/skills/business/marketing_business.md, domains: [business, marketing], aliases: [marketing, content_strategy, product_marketing, creative_campaign, customer_research, pitching, business_analysis, remote_work], triggers: [marketing, campaign, customer, pitch, business, remote job, content strategy], excludes: [], requires: [], conflicts_with: [], priority: 70, plugin_ids: [product_design], source_categories: []}

routes:
  - {id: software_bugfix, intent: software bug or failing test, primary: debugging_tdd, supporting: [software_engineering]}
  - {id: software_build, intent: build or change an application/system, primary: software_engineering, supporting: [planning, platform_engineering]}
  - {id: trading_live_analysis, intent: current market analysis or entry decision, primary: trading_router, supporting: [market_analysis, risk_execution]}
  - {id: trading_quant, intent: backtest or quantitative strategy work, primary: trading_router, supporting: [quant_backtesting, software_engineering]}
  - {id: mt5_bot, intent: MT5/MQL5/EA engineering, primary: mt5_mql5, supporting: [trading_router, software_engineering]}
  - {id: game_build, intent: game design or implementation, primary: game_dev, supporting: [software_engineering]}
  - {id: ux_product, intent: UX/UI or product design, primary: design_2d_ux, supporting: []}
  - {id: blender_3d, intent: Blender or 3D asset workflow, primary: design_3d_blender, supporting: []}
  - {id: adobe_workflow, intent: Adobe application workflow, primary: adobe_media, supporting: []}
  - {id: ai_video_prompt, intent: image/video generation prompt with continuity constraints, primary: prompt_engineering, supporting: [generative_media, scriptwriting]}
  - {id: academic_review, intent: academic research or critical evidence review, primary: academic_research, supporting: [critical_thinking, research]}
  - {id: document_data, intent: spreadsheet/document/report/presentation work, primary: data_documents, supporting: []}
  - {id: business_marketing, intent: marketing, pitch, or business analysis, primary: marketing_business, supporting: [critical_thinking]}

authorities:
  - {scope: ai_brain, status: CURRENT_AUTHORITY, path: AI_SKILL_LIBRARY/GITHUB_BRAIN_V2.md}
  - {scope: trading, status: CURRENT_AUTHORITY, path: docs/checkpoints/CURRENT_HANDOFF.md, follows: docs/checkpoints/BYBIT_BTC_STATEFLOW_2_1_20260904.md}
