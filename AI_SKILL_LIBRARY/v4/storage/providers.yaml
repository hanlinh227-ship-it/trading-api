# Federated Free Storage Mesh - provider registry.
#
# Registry membership is not admission and not activation. Every external row
# below is UNVERIFIED and QUARANTINED because nothing here has been checked
# against a real account: no quota has been observed, no hard stop has been
# seen, no free tier has been confirmed for this account. Those are the honest
# values, and Spec S16 requires unknown cost/privacy fields to fail closed.
#
# Quota numbers are null rather than the figures a provider's pricing page
# advertises. A documented free tier is a claim about a product; the mesh needs
# a fact about this account, and the two differ often enough that recording the
# first as if it were the second is how a "free" mesh acquires a bill.
#
# No credential of any kind belongs in this file - no token, no key, no bucket
# secret, no account identifier. Adapters resolve credentials from the secret
# store at runtime; the registry only says which backends exist and what has
# been proven about them.
version: 1
purpose: federated_free_storage_mesh_provider_registry
authority: false
authority_flags:
  storage_authority: false
  routing_authority: false
  reasoning_authority: false
  model_selection_authority: false
  admission_authority: false
  scheduling_authority: false
  merge_authority: false
  trading_authority: false
canonical_authority: GITHUB_BRAIN_V4
policy: AI_SKILL_LIBRARY/v4/storage/policy.yaml
record_schema: AI_SKILL_LIBRARY/v4/schemas/storage_provider.schema.json
registry_membership_is_admission: false
registry_membership_is_activation: false
accounts_created_here: false

providers:
  - provider_id: local_owned_store
    adapter_type: local_filesystem
    external: false
    free_status: NOT_APPLICABLE
    free_status_evidence:
      evidence_class: not_applicable
    quota_total: null
    quota_used: null
    hard_stop_verified: true
    paid_spillover_possible: false
    privacy_classes_allowed: [PUBLIC, INTERNAL, CONFIDENTIAL, LOCAL_ONLY]
    encryption_required_classes: []
    health: HEALTHY
    autonomous_write_allowed: true
    read_enabled: true
    write_enabled: true
    bulk_object_backend_allowed: true
    tiers_allowed: [HOT]
    preferred_tiers: [HOT]
    retention_policy_class: owned-local
    acceptable_use_class: owned-storage
    last_probe_at: null
    authority: false

  - provider_id: cloudflare_r2
    adapter_type: s3_compatible
    external: true
    free_status: UNVERIFIED
    free_status_evidence:
