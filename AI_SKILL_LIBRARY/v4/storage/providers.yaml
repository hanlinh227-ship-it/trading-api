    free_expiry_at: null
    quota_total: null
    quota_used: null
    hard_stop_verified: false
    paid_spillover_possible: unknown
    privacy_classes_allowed: []
    encryption_required_classes: [CONFIDENTIAL]
    health: QUARANTINED
    autonomous_write_allowed: false
    read_enabled: false
    write_enabled: false
    bulk_object_backend_allowed: true
    tiers_allowed: [HOT, WARM]
    preferred_tiers: [HOT]
    acceptable_use_class: object-storage
