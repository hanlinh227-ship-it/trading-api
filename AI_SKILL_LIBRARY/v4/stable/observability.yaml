version: 4
policy:
  persist_hidden_chain_of_thought: false
  record_decision_summaries: true
  record_evidence_references: true
  record_tool_outcomes: true
  record_verification_results: true
  record_route_outcomes: true
  record_context_cost: true
  redact_sensitive_data: true
  traces_are_diagnostic_not_authority: true
telemetry:
  sanitized_for_evergreen: true
  fields: [route, profile, domain, skills, tools, latency_ms, context_tokens, retries, verification, correction, failure_category]
  forbidden: [raw_private_chat, secrets, credentials, authentication_tokens, private_keys, account_data, hidden_chain_of_thought]
ai_semantics:
  open_telemetry_aligned: true
  optional_fields: [operation_class, role, model_provider_id, duration_ms, status, verification_outcome]
  roles: [model, tool, retriever, evaluator, guardrail]
  sensitive_payloads_forbidden: true
  raw_prompts_forbidden: true
  raw_private_tool_payloads_forbidden: true
  hidden_reasoning_forbidden: true
  diagnostic_not_authority: true
profiles:
  FAST: {persistence: none, sampling_rate: 0.0}
  STANDARD: {persistence: on_error_or_correction, sampling_rate: 0.1}
  DEEP: {persistence: bounded, sampling_rate: 1.0}
limits:
  max_events_per_trace: 80
  max_event_chars: 1200
  max_trace_chars: 20000
  max_tool_payload_chars: 3000
universal_fabric:
  enabled: true
  authority: false
  per_client_audit_identity: true
  fast_synchronous_persistence: false
  allowed_fields: [event_type, client_id, request_id, profile, domain, primary_skill, capsule_hash, release_id, source_sha, latency_ms, tool_class, provider_id, model_family, cache_outcome, retrieval_outcome, fallback_state, memory_event, promotion_event, recovery_event, failure_category, verification, status, timestamp]
  forbidden_fields: [raw_private_chat, raw_prompt, prompt, secrets, credentials, authentication_tokens, private_keys, account_data, hidden_chain_of_thought, chain_of_thought, raw_private_tool_payload, private_tool_payload, private_provider_payload]
  telemetry_failure_blocks_stable: false
