version: 4
profile_order: [FAST, STANDARD, DEEP]

selection:
  FAST:
    all: [single_intent, low_risk, no_project_mutation, no_fresh_external_state, no_external_tool_required]
  STANDARD:
    any: [domain_skill_required, project_context_required, ordinary_research, artifact_creation, external_tool_required]
  DEEP:
    any: [multi_step_architecture, brain_or_protocol_change, deployment_or_runtime_claim, live_or_trading_task, destructive_action, financial_action, credential_sensitive_action, complex_research]

adaptive:
  enabled: true
  bounded: true
  may_escalate: [FAST_TO_STANDARD, STANDARD_TO_DEEP]
  may_not_override: [security, authority, permission_ceiling, trading_hard_risk_controls]
  signals: [risk, task_complexity, freshness_requirement, tool_requirement, prior_route_eval, verification_need]

capability_fusion:
  policy_path: AI_SKILL_LIBRARY/v4/stable/capability_fusion.yaml
  native_contracts_only: true
  mandatory_external_runtime_dependency: false
  fast_safe_subset_only: true
  standard_deep_retrieval_enabled: true
  may_not_override: [security, authority, permission_ceiling, trading_hard_risk_controls]

profiles:
  FAST:
    context_tokens: 2500
    durable_memory_items: 0
    tool_candidates: 0
    replan_budget: 0
    primary_skill_count: 1
    skill_capsule_required: true
    max_supporting_skills: 0
    max_bridge_nodes: 0
    max_parallel_tasks: 1
    evergreen_sync: false
    preload_trading: false
    persistent_trace: false
    stages: [task_router, minimal_core, fast_knowledge_plane, primary_domain, primary_skill, skill_execution_capsule, response_quality_gate, answer]
  STANDARD:
    context_tokens: 7000
    durable_memory_items: 4
    tool_candidates: 3
    replan_budget: 1
    primary_skill_count: 1
    skill_capsule_required: true
    max_supporting_skills: 2
    max_bridge_nodes: 1
    max_parallel_tasks: 2
    evergreen_sync: false
    preload_trading: false
    persistent_trace: conditional
    stages: [task_router, runtime_profile, authority, capability_fusion, primary_domain, primary_skill, skill_execution_capsule, permitted_bridges, skills, retrieval_plane, memory, sources, tools, execute, response_quality_gate, verify, answer]
  DEEP:
    context_tokens: 16000
    durable_memory_items: 8
    tool_candidates: 5
    replan_budget: 2
    primary_skill_count: 1
    skill_capsule_required: true
    max_supporting_skills: 2
    max_bridge_nodes: 2
    max_parallel_tasks: 4
    evergreen_sync: false
    preload_trading: route_only
    persistent_trace: bounded
    stages: [task_router, runtime_profile, authority, capability_fusion, context_plan, planner, task_graph, primary_domain, primary_skill, skill_execution_capsule, permitted_bridges, skills, retrieval_plane, memory, sources, tools, security_gate, execute, critic, response_quality_gate, verify, eval, answer]

hard_limits:
  max_context_tokens: 20000
  max_memory_items: 12
  max_tool_candidates: 8
  max_replans: 3
  max_parallel_tasks: 4
  max_supporting_skills: 2
  max_bridge_nodes: 2
