version: 4
policy:
  bounded_scores: true
  minimum: 0.0
  maximum: 1.0
  equivalent_authority_only: true
  never_override_security: true
  never_override_project_authority: true
  never_grant_permissions: true
signals:
  success_rate: 0.25
  verification_pass_rate: 0.25
  latency_efficiency: 0.10
  freshness_reliability: 0.10
  domain_fit: 0.10
  user_correction_inverse: 0.10
  protected_regression_inverse: 0.10
cold_start:
  score: 0.5
  minimum_observations_for_preference: 5
decay:
  enabled: true
  stale_observation_half_life_days: 90
model_mesh:
  ranking_only_after_policy_gates: true
  equivalent_authority_only: true
  provider_model_path_signals:
    - success_rate
    - schema_valid_rate
    - verifier_accept_rate
    - latency_efficiency
    - quota_reliability
    - task_class_fit
    - protected_regression_inverse
  no_permission_grant: true
  no_authority_grant: true
  same_family_provider_redundancy_is_not_reasoning_diversity: true
