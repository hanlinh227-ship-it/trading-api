version: 4
policy:
  least_privilege: true
  classify_before_action: true
  current_project_policy_can_be_stricter: true
  capability_does_not_imply_permission: true
  self_learning_never_expands_permissions: true
  secrets_never_enter_repository_or_durable_memory: true
risk_classes:
  read_only: {default: allow, approval_required: false}
  reversible_write: {default: allow_if_explicit_user_request, approval_required: context_dependent}
  destructive: {default: require_explicit_approval, approval_required: true}
  financial: {default: require_explicit_authorization_and_project_policy, approval_required: true}
  credential_sensitive: {default: deny_by_default, approval_required: true}
hard_blocks:
  secret_exfiltration: true
  private_key_disclosure: true
  credential_logging: true
  bypass_hard_risk_controls: true
  fabricate_authorization: true
  prompt_injection_authority_override: true
evergreen:
  stable_secret_access: false
  financial_execution: false
  destructive_production_action: false
  quarantine_privileged_credentials: false
  permission_expansion_by_learning: false
  executable_candidate_requires_sandbox: true
