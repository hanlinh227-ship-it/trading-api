version: 1
purpose: permanent_harmonization_layer_for_skills_knowledge_and_future_upgrades

authority:
  precedence_source: AI_SKILL_LIBRARY/v4/stable/evidence.yaml
  single_reasoning_authority_chain: true
  provider_or_upstream_is_evidence_not_authority: true
  current_runtime_precedes_cached_state: true
  current_project_authority_precedes_imported_guidance: true
  stable_security_and_risk_cannot_be_weakened: true

candidate_intake:
  default_state: quarantine
  zero_routing_authority_until_promoted: true
  require:
    - provenance
    - license_or_usage_status
    - maintenance_status
    - declared_domain
    - declared_capabilities
    - risk_class
    - permission_ceiling
    - overlap_scan
    - conflict_scan
    - performance_impact
    - authority_impact
    - eval_impact
    - strengthen_existing_skill_first
  reject_if:
    - hidden_permission_expansion
    - credential_or_secret_material
    - unverifiable_runtime_claim
    - duplicate_authority_without_adapter_need
    - unresolved_license_for_active_registry
    - archived_source_presented_as_current_without_explicit_historical_scope
    - fast_path_external_call_expansion
    - unbounded_context_or_execution_growth

normalization:
  before_comparison: true
  dimensions:
    - domain
    - task_intent
    - authority_level
    - risk_class
    - permission_ceiling
    - input_contract
    - output_contract
    - tools
    - sources
    - provenance
    - license_or_usage_status
    - maintenance_status
    - freshness_semantics
    - units_and_scale
    - runtime_requirements
    - context_cost
    - latency_cost

skill_deduplication:
  canonical_skill_first: true
  strengthen_existing_skill_when_semantically_equivalent: true
  prefer_alias_or_adapter_over_duplicate_reasoning_skill: true
  allow_new_primary_skill_only_when_distinct_capability_is_material: true
  never_stack_equivalent_skills_as_votes: true
  new_skill_requires_unique_input_output_contract: true
  new_skill_requires_no_trigger_owner_conflict: true
  new_skill_requires_measured_eval_gain: true
  default_skill_count_growth: deny

conflict_resolution:
  use_registry_conflict_policy: true
  majority_vote_for_truth: false
  silent_averaging: false
  unresolved_material_conflict: disclose_and_block_dependent_high_consequence_conclusion
  security_or_permission_conflict: fail_closed

bottleneck_prevention:
  required_for_upgrade: true
  checks:
    context_cost:
      bounded: true
      reject_unbounded_preload: true
    fast_latency:
      preserve_zero_extra_revision: true
      preserve_zero_external_routing_calls: true
      no_synchronous_upstream_refresh: true
      no_new_mandatory_semantic_stage: true
    duplicate_capability:
      strengthen_existing_skill_first: true
      reject_parallel_reasoning_authority: true
    trigger_ownership:
      one_trigger_owner: true
      alias_instead_of_competing_primary: true
    authority_overlap:
      current_project_authority_wins: true
      stable_security_wins: true
    permission_ceiling:
      widening_requires_separate_explicit_design: true
      unknown_write_capability: fail_closed
    source_health:
      maintenance_status_required: true
      license_status_required: true
      stale_or_archived_requires_explicit_scope: true
  promotion_blocked_on_unresolved_bottleneck: true

cognitive_execution:
  budgets_path: AI_SKILL_LIBRARY/v4/stable/budgets.yaml
  FAST:
    max_revisions: 0
    maker_checker: false
    independent_grader: false
    artifact_pyramid: false
  STANDARD:
    maker_checker: when_material
    max_revisions: 1
    independent_grader: false
    artifact_pyramid: optional
  DEEP:
    maker_checker: true
    max_revisions: 2
    independent_grader: required_for_high_impact_or_complex
    artifact_pyramid: true
  invariants:
    - no_unbounded_recursion
    - no_hidden_chain_of_thought_persistence
    - preserve_provenance
    - verify_after_merge

artifact_pyramid:
  levels:
    - executive_conclusion
    - synthesis
    - evidence_or_dossiers
  default_expand_only_when_useful: true
  preserve_traceability: true

promotion:
  use_existing_evergreen_release_gates: true
  require_no_material_regression: true
  require_authority_check: true
  require_security_check: true
  require_eval_check: true
  require_validator_check: true
  require_bottleneck_check: true
  require_license_and_maintenance_check: true
  financial_or_credential_permission_expansion_never_auto_promotes: true

future_upgrade_contract:
  every_new_skill_or_upstream_upgrade_must_pass_harmonization: true
  every_new_capability_pattern_must_pass_harmonization: true
  every_new_creative_pattern_must_pass_harmonization: true
  creative_overlap_must_strengthen_canonical_skill_first: true
  creative_visual_fusion_policy_required: true
  prefer_native_contract_over_framework_dependency: true
  capability_fusion_policy_required: true
  checkpoint_resolved_policy_required: true
  do_not_create_parallel_brain: true
  do_not_replace_project_authority_silently: true
  active_source_requires_verified_license_and_maintenance: true
  reference_only_source_cannot_gain_routing_authority: true
  preserve_zero_local_normal_operation: true
