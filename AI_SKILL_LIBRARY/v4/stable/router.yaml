version: 4
policy:
  route_every_request: true
  mandatory_router: task_router
  adaptive_profile_selection: true
  knowledge_mesh_required: true
  release_bundle_only: true
  one_primary_domain: true
  max_supporting_skills: 2
  full_catalog_preload: false
  evergreen_on_request_path: false
  unresolved_material_conflict_escalates: true
  authority_before_memory: true

domain_routes:
  core: [task_router, core_reasoning, critical_thinking, fact_checking, research, planning, verification, troubleshooting]
  engineering: [coding, debugging, tdd, software_architecture, github, api, database, security, android, web_app, deployment, automation]
  trading: [trading_router, crypto, forex, futures, indices, market_microstructure, technical_analysis, risk_management, backtesting, mt5_mql5, trading_bot, live_data_validation]
  game: [game_development, game_design, godot, unity, game_ai, game_2d, game_3d]
  design_2d: [ux_ui, product_design, graphic_design, branding, typography, layout, design_2d]
  design_3d: [design_3d, modeling, topology, uv, materials, lighting, rigging, animation, rendering, blender]
  adobe: [photoshop, illustrator, premiere_pro, after_effects, lightroom, audition, indesign, acrobat]
  prompt_media: [prompt_engineering, image_prompt, video_prompt, negative_constraints, prompt_debugging, character_consistency, scene_continuity, camera_direction, storyboard]
  writing: [scriptwriting, screenwriting, voice_over, advertising_copy, hook_retention, storytelling]
  academic: [academic_research, literature_review, methodology, qualitative_research, quantitative_analysis, interdisciplinary_research, citation_review]
  data_docs: [data_analysis, spreadsheet, chart, report, docx, pdf, slides, presentation]
  business: [business, marketing, marketing_business]

selection_order:
  - task_router
  - runtime_profile
  - project_authority_if_required
  - primary_domain
  - permitted_mesh_bridges
  - primary_skill
  - supporting_skills
  - bounded_memory
  - relevant_sources
  - relevant_tools
  - security_gate_if_required
  - execute
  - verification
  - answer
