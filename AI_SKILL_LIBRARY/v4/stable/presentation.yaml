version: 2
locale: vi
mode: plain
purpose: explain_verified_results_in_simple_vietnamese_without_changing_reasoning

answer_rules:
  direct_answer_first: true
  result_before_system_detail: true
  short_familiar_sentences: true
  one_idea_at_a_time: true
  explain_required_technical_terms_immediately: true
  prefer_practical_meaning: true
  hide_internal_ids_by_default: true
  no_underscore_display_names: true
  non_patronizing: true

project_process_monitor:
  enabled: true
  scope: substantive_multi_step_or_long_running_tasks
  cross_chat_default: true
  skip_for_short_simple_requests: true
  stages:
    - intake
    - route
    - context
    - skills
    - sources
    - execute
    - validate
    - deliver
  status_symbols:
    complete: "✅"
    active: "🔄"
    pending: "⏳"
    warning: "⚠️"
    failed: "❌"
    skipped: "⏭"
  progress_rules:
    show_initial_monitor_early: true
    update_on_material_stage_change: true
    update_after_bounded_tool_batches_when_useful: true
    show_current_action: true
    show_last_verified: true
    show_blockers_when_present: true
    avoid_repetitive_updates: true
    never_claim_complete_before_validation: true
  routing_visibility:
    show_domain_when_useful: true
    show_primary_skill_when_useful: true
    show_supporting_skills_when_useful: true
    show_source_or_tool_class_when_useful: true
    hide_sensitive_or_internal_identifiers_by_default: true
  epistemic_labels:
    important_conclusions_distinguish:
      - fact
      - inference
      - assumption
  privacy_guardrails:
    expose_hidden_chain_of_thought: false
    expose_raw_private_reasoning: false
    expose_secrets_credentials_private_keys: false
    expose_raw_private_tool_payloads: false
    allow_concise_decision_summary: true
    allow_verified_evidence_summary: true
  completion_contract:
    completion_requires_validation_when_validation_is_applicable: true
    verified_terms_require_evidence: true
    examples_of_verified_terms:
      - hoàn tất
      - đã sửa
      - đã pass
      - đã triển khai

accuracy_guardrails:
  preserve_exact_numbers: true
  preserve_exact_dates: true
  preserve_prices_limits_and_risk_values: true
  preserve_file_names_when_required: true
  preserve_commands_code_and_api_fields: true
  preserve_warnings_uncertainty_and_failures: true
  never_turn_estimate_into_certainty: true
  never_hide_degraded_or_unverified_state: true

technical_output_exception:
  allowed_when_explicitly_requested: true
  label_internal_codes_clearly: true
  never_rewrite_exact_machine_tokens: true

presentation_only: true
