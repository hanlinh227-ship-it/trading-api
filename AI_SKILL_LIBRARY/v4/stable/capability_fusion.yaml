version: 1
purpose: fuse_open_source_capability_patterns_into_native_v4_without_parallel_authority

authority:
  precedence_source: AI_SKILL_LIBRARY/v4/stable/evidence.yaml
  budgets_path: AI_SKILL_LIBRARY/v4/stable/budgets.yaml
  retrieval_contract: AI_SKILL_LIBRARY/v4/stable/retrieval.yaml
policy:
  single_authority_chain: true
  upstream_is_reference_not_authority: true
  mandatory_external_runtime_dependency: false
  zero_local_cloud_runtime_preserved: true
  native_contracts_preferred: true
  project_authority_precedes_capability_patterns: true
  stable_security_precedes_capability_patterns: true
  capability_failure_must_not_disable_stable: true

fast_knowledge_plane:
  exact_cache: true
  semantic_cache: true
  semantic_cache_profiles: [STANDARD, DEEP]
  fast_exact_only: true
  semantic_similarity_min: 0.93
  compatibility_fingerprint:
    - primary_skill
    - domain
    - output_contract
    - checkpoint_id
    - release_version
    - authority_revision
  cache_forbidden_for:
    - live_or_current_state
    - trading_entry_or_execution
    - credentials_or_secrets
    - destructive_action
    - private_connected_source_content
    - deployment_or_runtime_claim
  require_freshness_compatibility: true
  require_authority_compatibility: true
  on_cache_miss: execute_normally
  on_cache_backend_failure: execute_normally
  routing_authority: false

retrieval_plane:
  contract_owner: AI_SKILL_LIBRARY/v4/stable/retrieval.yaml
  exact_before_semantic: true
  index_backend: pluggable_optional
  routing_authority: false
  authority_filter_required: true
  freshness_filter_required: true
  stages:
    - normalize
    - authority_filter
    - freshness_filter
    - lexical_retrieve
    - semantic_retrieve
    - metadata_filter
    - rerank
    - dedupe
    - context_pack
  metadata_dimensions:
    - domain
    - project_scope
    - authority_revision
    - source_revision
    - freshness
    - verification
    - confidence
  on_index_unavailable: fallback_to_canonical_retrieval
  on_semantic_retrieval_conflict: prefer_authoritative_verified_source

execution_graph:
  budgets_path: AI_SKILL_LIBRARY/v4/stable/budgets.yaml
  bounded: true
  stateful_when_useful: true
  resumable_artifacts_only: true
  max_nodes_standard: 4
  max_nodes_deep: 10
  max_parallel_standard: 2
  max_parallel_deep: 4
  max_resume_attempts: 1
  max_revisions_standard: 1
  max_revisions_deep: 2
  persist_hidden_reasoning: false
  persisted_state_may_include:
    - task_status
    - accepted_constraints
    - evidence_references
    - artifact_locations
    - verification_outcomes
  persisted_state_must_exclude:
    - hidden_chain_of_thought
    - secrets
    - credentials
    - private_keys
    - raw_sensitive_personal_data

maker_checker_grader:
  FAST: {maker_checker: false, independent_grader: false}
  STANDARD: {maker_checker: when_material, independent_grader: false}
  DEEP: {maker_checker: true, independent_grader: required_for_high_impact_or_complex}
  checker_cannot_expand_permissions: true
  grader_is_not_authority: true

typed_capability_contracts:
  input_schema_required: true
  output_contract_required: true
  permission_ceiling_required: true
  domain_required: true
  tools_declared: true
  sources_declared: true
  risk_ceiling_required: true
  provenance_required: true
  capsule_hash_required_for_routed_skill: true
  on_schema_failure: fail_closed
  on_permission_expansion: fail_closed
  on_unknown_tool: fail_closed
  normalize_provider_output_before_use: true

mcp_interoperability:
  external_framework_required: false
  routing_authority: false
  reasoning_authority: false
  discovery_separate_from_invocation: true
  protocol_compatibility_required: true
  typed_input_output_contracts: true
  permission_ceiling_required: true
  unknown_capability_action: fail_closed
  incompatible_schema_action: fail_closed
  permission_widening_action: fail_closed
  credentials_are_external_restricted_state: true
  local_server_mandatory: false

document_intelligence:
  external_framework_required: false
  routing_authority: false
  reasoning_authority: false
  structured_extraction_before_ocr: true
  preserve_hierarchy: true
  preserve_page_section_provenance: true
  preserve_table_structure_when_material: true
  preserve_reading_order_when_material: true
  distinguish_extraction_from_inference: true
  ocr_is_degraded_fallback: true
  unsupported_structure_must_be_disclosed: true

oss_intake_firewall:
  external_scanner_required_for_stable_requests: false
  routing_authority: false
  reasoning_authority: false
  posture_is_evidence_not_authority: true
  high_score_never_auto_promotes: true
  unresolved_critical_risk_may_block_promotion: true
  signals: [archived_or_disabled, maintenance, spdx_license, dependency_vulnerability, secret_scanning, sbom_or_inventory, release_provenance]

browser_runtime_verification:
  external_framework_required: false
  routing_authority: false
  reasoning_authority: false
  prefer_runnable_flow_when_environment_exists: true
  checks: [navigation, state_transition, visible_outcome, accessibility_state, network_failure_handling, cross_browser_when_material]
  static_success_claim_rejected_on_runtime_failure: true

memory_patterns:
  retrieve_before_write: true
  semantic_ranking_allowed: true
  authority_precedes_memory: true
  verified_newer_state_may_supersede_old: true
  contradiction_action: reverify_or_supersede
  majority_vote_for_memory_truth: false

provider_routing_patterns:
  providers_are_execution_resources_not_authority: true
  signals:
    - capability_fit
    - health
    - latency
    - rate_limit_state
    - reliability
    - cost_when_relevant
  bounded_fallback: true
  cooldown_on_transient_failure: true
  circuit_breaker: true
  no_majority_vote_for_truth: true
  no_permission_widening_on_fallback: true

self_hosted_serving_patterns:
  default_enabled: false
  optional_only: true
  requires_explicit_runtime_adapter: true
  patterns:
    - prefix_cache
    - continuous_batching
    - paged_attention
    - speculative_decoding_when_supported
  cannot_change_reasoning_authority: true

creative_visual_fusion:
  policy_path: AI_SKILL_LIBRARY/v4/stable/creative_visual_fusion.yaml
  routing_authority: false
  reasoning_authority: false
  canonical_skill_first: true
  zero_local_preserved: true
  activation_domains: [prompt, design, adobe, writing]
  use_existing_primary_skills: true
  external_framework_required: false
  may_not_override: [security, project_authority, permission_ceiling, primary_skill_contract]

brain_4_6_selective_fusion:
  baseline_release: 4.5.0
  target_release: 4.6.0
  canonical_skill_count_target: 109
  strengthen_existing_skill_first: true
  bulk_repository_import: false
  reference_only_by_default: true
  code_reuse_by_default: false
  active_registry_requires_allowed_license: true
  unresolved_or_disallowed_license_action: reference_only_not_active_registry
  fast_path_changes: false
  routing_authority: false
  permission_expansion: false
  mandatory_runtime_dependency: false
  bottleneck_checks:
    - context_cost
    - fast_latency
    - external_routing_calls
    - duplicate_capability
    - trigger_ownership
    - authority_overlap
    - permission_ceiling
    - source_maintenance

brain_4_7_selective_fusion:
  baseline_release: 4.6.0
  target_release: 4.7.0
  canonical_skill_count_target: 109
  strengthen_existing_skill_first: true
  bulk_repository_import: false
  code_reuse_by_default: false
  fast_path_changes: false
  routing_authority: false
  reasoning_authority: false
  permission_expansion: false
  mandatory_runtime_dependency: false
  zero_local_preserved: true
  new_primary_skills: 0
  active_source_count_added: 8
  bottleneck_checks:
    - context_cost
    - fast_latency
    - external_routing_calls
    - duplicate_capability
    - trigger_ownership
    - authority_overlap
    - permission_ceiling
    - source_maintenance
    - source_security_posture

