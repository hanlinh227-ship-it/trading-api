version: 1
authority: GITHUB_BRAIN_V4
adapter_authority: false
routing:
  FAST:
    online_brain_required: false
    external_routing_calls: 0
    hot_snapshot_required: true
    synchronous_shared_state: false
  STANDARD:
    online_brain_required: true
    external_routing_calls: bounded
  DEEP:
    online_brain_required: true
    external_routing_calls: bounded
degraded:
  safe_mode: last_verified_stable
  fail_closed_classes:
    - live_or_trading
    - deployment_or_runtime_claim
    - credential_sensitive
    - financial
    - destructive
    - permission_change
shared_state:
  canonical_authority: github
  runtime_authority: false
  raw_chat_sync: false
  secrets_allowed: false
learning:
  candidate_first: true
  autonomous_promotion_classes: [A, B]
  approval_required_classes: [C, D]
  permission_widening: false
subordinate_subsystems:
  federated_free_storage_mesh:
    role: subordinate_persistence_and_placement
    extends: AI_SKILL_LIBRARY/v4/runtime/shared_state.yaml#interfaces.ObjectStore
    policy: AI_SKILL_LIBRARY/v4/storage/policy.yaml
    providers: AI_SKILL_LIBRARY/v4/storage/providers.yaml
    canonical_authority: github
    storage_authority: false
    routing_authority: false
    reasoning_authority: false
    model_selection_authority: false
    admission_authority: false
    scheduling_authority: false
    merge_authority: false
    trading_authority: false
    paid_storage_allowed: false
    overage_allowed: false
    secrets_allowed: false
    second_portable_state_abstraction: false
