version: 1
purpose: first_party_evidence_registry_for_free_model_mesh_provider_discovery
policy:
  evidence_is_not_entitlement: true
  runtime_account_state_outranks_docs: true
  unknown_free_status: exclude
  secrets_in_registry: forbidden
  # A mixed catalog holds paid and zero-price models at the same time, so
  # eligibility is decided per model. One paid or 402 model never blacklists
  # the provider; only every eligible candidate failing does.
  eligibility_scope: model_level
  provider_blacklist_on_single_model_failure: false
providers:
  groq:
    provider_class_hint: F1
    zero_cost_class: account_specific
    treatment: headroom_aware_rotation
    notes: Verified zero-cost operation. Rotate on low headroom rather than running to 429.
    evidence:
      rate_limits: https://console.groq.com/docs/rate-limits
      data_policy: https://console.groq.com/docs/your-data
  gemini_developer_api:
    provider_class_hint: F1
    zero_cost_class: recurring
    treatment: probe_driven_model_selection
    transient_failures: [429, 503]
    notes: 429/503 are transient. Cooldown, fail over, re-enter after the cooldown; never read transient health as permanent loss.
    evidence:
      rate_limits: https://ai.google.dev/gemini-api/docs/rate-limits
      pricing_privacy: https://ai.google.dev/gemini-api/docs/pricing
  cloudflare_workers_ai:
    provider_class_hint: F1
    zero_cost_class: recurring
    treatment: headroom_aware_rotation
    notes: Daily neuron allowance. Rotate on low headroom rather than running to exhaustion.
    evidence:
      pricing: https://developers.cloudflare.com/workers-ai/platform/pricing/
  openrouter:
    provider_class_hint: F1
    zero_cost_class: recurring
    treatment: dynamic_free_pool
    notes: Free router is a dynamic pool. Verify no paid route is selected before each admission refresh.
    evidence:
      free_models: https://openrouter.ai/collections/free-models
      pricing_limits: https://openrouter.ai/pricing
  mistral:
    provider_class_hint: F1
    zero_cost_class: account_specific
    treatment: bounded_backoff_then_failover
    notes: Rate limits rotate immediately to another zero-cost model and reprobe after cooldown.
    evidence:
      usage_limits: https://docs.mistral.ai/admin/billing-usage/usage-limits
  cohere:
    provider_class_hint: F1
    zero_cost_class: trial_credit
    autonomous_use: false
    treatment: discovery_only
    notes: Current access is trial/evaluation. Re-evaluate automatically only if a recurring or account-specific zero-cost tier appears.
    evidence:
      trial_rate_limits: https://docs.cohere.com/v1/docs/rate-limits
  huggingface_inference_providers:
    provider_class_hint: F1
    zero_cost_class: trial_credit
    autonomous_use: false
    treatment: finite_included_credit_guard
    notes: Free accounts receive a small recurring monthly credit, not unlimited free inference. Route only while remaining included credit is verifiable and paid-credit spillover is impossible; otherwise standby discovery-only.
    evidence:
      pricing: https://huggingface.co/docs/inference-providers/pricing
  nvidia_nim:
    provider_class_hint: F1
    zero_cost_class: unverified
    treatment: probe_and_select_from_live_listing
    prefer_labels: ["Free Endpoint"]
    probe_evidence: "probe run 35047130298: listing 200 with 82 models, meta/muse-glimmer-30b returned 200 on chat completions on the first probed candidate. probe run 35048454601 (2026-09-16T02:35:10Z, main aa06e73): catalog rows carry only created/id/object/owned_by and 0 of 82 models expose any free-tier field"
    account_evidence: "account-holder verification 2026-09-16: NVIDIA Build shows models carrying a Free Endpoint label"
    free_catalog_ref: AI_SKILL_LIBRARY/v4/model_mesh/provider_free_catalogs.json
    notes: "The API exposes no free-tier field at all (0 of 82 rows), so pricing evidence comes from the vendor Free Endpoint catalog and liveness from the API probe - two sources, recorded separately. A model is admitted only when it is on the recorded catalog capture, present in the live API listing, returns a completion PASS, and the account holder attests the account is on the Free Endpoint tier. The capture carries a timestamp and revalidates on a 30-day window; past it the model quarantines itself. Missing any of the four, fail closed."
    evidence:
      developer_access: https://docs.api.nvidia.com/nim/docs/product
  cerebras:
    provider_class_hint: F3
    zero_cost_class: trial_credit
    autonomous_use: false
    treatment: discovery_only
    notes: Official pricing is a finite free trial, not recurring-free access. Excluded from autonomous FREE_ONLY once trial credit is exhausted; never route into the paid Developer tier.
    evidence:
      rate_limits: https://inference-docs.cerebras.ai/support/rate-limits
      pricing: https://www.cerebras.ai/pricing
  sambanova:
    provider_class_hint: Q
    zero_cost_class: unverified
    treatment: probe_and_select_from_live_listing
    probe_evidence: "probe run 35047130298 (2026-09-16T02:14:46Z, main 69dd282): listing 200 with 7 models; every one publishes a price above zero, so all 7 were skipped before any billable call was made"
    notes: Model-level evidence is now decisive rather than inferred from one 402 - this account's entire SambaNova catalog is priced, with no zero-price model to admit. Discovery-only until a zero-price model appears in the listing. Never route into the priced tier.
    evidence:
      rate_limits: https://docs.sambanova.ai/docs/en/models/rate-limits
  alibaba_model_studio:
    provider_class_hint: F3
    zero_cost_class: free_quota_hard_stop
    treatment: rotate_among_still_free_model_quotas
    notes: Free quota is finite and region-specific, and billing-enabled accounts can be charged after exhaustion unless Free Quota Only is enabled. Autonomous use requires a verified no-billing hard stop; otherwise discovery-only.
    evidence:
      free_quota: https://help.aliyun.com/en/model-studio/new-free-quota
  opencode_zen:
    provider_class_hint: F2
    zero_cost_class: temporary_zero_price
    autonomous_use: false
    treatment: discovery_only
    account_evidence: "account-holder verification 2026-09-16: the Zen workspace still offers Enable billing, so billing is off and no call can become billable"
    probe_evidence: "probe run 35049301279 (2026-09-16T02:49:45Z, main 3861173): all 8 documented free ids matched the live catalog (8/8). big-pickle returned 400 'OpenCode free tier can only be used in OpenCode'; deepseek-v4-flash-free 400 'Model is unavailable'; muse-spark-1.3-contributor-free 500. Catalog rows carry only created/id/object/owned_by and 0 of 70 expose a price or free field."
    notes: "Settled, and not on cost. The free models exist, billing is verified off and the credential lists successfully - but the provider restricts its free tier to the OpenCode client, so the mesh cannot use it from an API client at all. That is a provider policy limit, not a pricing or credential gap, and working around it by impersonating the client would be circumvention. Discovery-only. Re-evaluate only if the provider opens the free tier to API clients; never enable billing and never fall back to a paid Zen model."
    evidence:
      models: https://opencode.ai/zen/v1/models
      docs: https://opencode.ai/docs/zen
catalog_sources:
  models_dev:
    url: https://models.dev/api.json
    authority: discovery_metadata_only
  portkey_models:
    url: https://github.com/Portkey-AI/models
    authority: discovery_metadata_only
future_provider_intake:
  evergreen_required: true
  harmonization_required: true
  default_state: quarantine
  routing_authority: false
