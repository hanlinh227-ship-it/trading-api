version: 1
purpose: selective_open_source_patterns_for_adaptive_free_model_mesh
policy:
  upstream_is_reference_not_authority: true
  mandatory_runtime_dependency: false
  code_reuse_default: false
sources:
  - id: anomalyco/models.dev
    url: https://github.com/anomalyco/models.dev
    license: MIT
    status: approved_reference
    absorbs: [provider_model_catalog, capability_metadata, pricing_metadata, model_family_identity]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
  - id: anomalyco/opencode
    url: https://github.com/anomalyco/opencode
    license: MIT
    status: approved_reference
    absorbs: [provider_discovery, provider_plugin_order, zen_adapter_patterns, broad_provider_compatibility]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
  - id: Portkey-AI/models
    url: https://github.com/Portkey-AI/models
    license: MIT
    status: approved_reference
    absorbs: [supplementary_provider_model_metadata, pricing_config_metadata]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
  - id: Portkey-AI/gateway
    url: https://github.com/Portkey-AI/gateway
    license: MIT
    status: approved_reference
    absorbs: [bounded_retry, fallback, load_balancing, conditional_routing]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
  - id: vllm-project/semantic-router
    url: https://github.com/vllm-project/semantic-router
    license: Apache-2.0
    status: approved_reference
    absorbs: [mixture_of_models_selection, capability_routing, route_evaluation, policy_signals]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
  - id: microsoft/agent-framework
    url: https://github.com/microsoft/agent-framework
    license: MIT
    status: approved_reference
    absorbs: [bounded_sequential_workflow, bounded_concurrent_workflow, handoff_patterns]
    routing_authority: false
    reasoning_authority: false
    mandatory_runtime_dependency: false
    code_reuse: false
historical_reference:
  microsoft/autogen:
    status: maintenance_reference_only
    replacement_reference: microsoft/agent-framework
    routing_authority: false
    reasoning_authority: false
