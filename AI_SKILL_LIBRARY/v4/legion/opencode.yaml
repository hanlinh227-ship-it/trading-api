auto_mode_can_override_denies: false
modes:
  plan:
    read: allow
    edit: deny
    bash: deny
    webfetch: ask
    websearch: ask
  explore:
    read: allow
    edit: deny
    bash: deny
    webfetch: deny
    websearch: deny
  research:
    read: allow
    edit: deny
    bash: deny
    webfetch: allow
    websearch: allow
  patch:
    read: allow
    edit: allow
    bash: ask
    webfetch: deny
    websearch: deny
  test:
    read: allow
    edit: deny
    bash: allow
    webfetch: deny
    websearch: deny
  review:
    read: allow
    edit: deny
    bash: deny
    webfetch: deny
    websearch: deny
always_deny:
