version: 1
purpose: recorded_zero_cost_execution_paths_for_wave3_placement
generated_at: "2026-09-17"
policy:
  # The two rules this file exists to hold.
  capability_fallback_is_never_availability: true
  unverified_is_never_absent: true
  # Nothing here may be promoted without the operator.
  paid_account_creation: forbidden
  paid_plan_enablement: forbidden
  model_licence_acceptance_on_behalf_of_operator: forbidden
  routing_authority: false
  model_selection_authority: false
  admission_authority: false

verification_legend:
  live_account_api: "read from the operator's own Cloudflare account through the connected Cloudflare tool"
  vendor_docs: "read from the vendor's own published documentation, URL recorded"
  local_measurement: "measured on this container by detect_resources()"
  not_verifiable_here: "could not be established from this runtime; recorded as unverified, never as false"

paths:

  - provider_id: ephemeral-local-0
    execution_type: LOCAL_PROCESS
    cost_class: OWNED_ZERO_MARGINAL
    custom_weights: true
    supported_artifact_formats: [gguf]
    authentication_required: false
    credential_available_here: true
    operator_authorized: true
    model_cache_capability: "per-container; the cache dies with the container"
    max_ram_mb: 15517
    max_disk_mb: 12000
    quota: none
    inference_provable_by: "already proven - the Wave 0 benchmark suites and the federation proof ran here"
    verification_state: VERIFIED_AVAILABLE
    verification_evidence: >-
      real completions from admitted local models, repeatedly: the Wave 0
      capability suites, PERSONAL_AI_BASELINE_001, and WAVE3_FEDERATION_PROOF at
      nine rounds. This is execution proof, not a catalog claim.
    notes: >-
      The container this runtime is in. Its ~16 GB of RAM and its disk watermark
      are facts about this container and nothing else, which is the whole reason
      the other paths below were inspected.
    evidence: [local_measurement]

  - provider_id: github_actions_ubuntu_latest
    execution_type: EPHEMERAL_JOB
    cost_class: FREE_HARD_STOP
    custom_weights: true
    supported_artifact_formats: [gguf, safetensors]
    authentication_required: true
    credential_available_here: true
    operator_authorized: true
    operator_evidence: "the Wave 3 discovery lane already runs on this path in this repository"
    model_cache_capability: "none between jobs; actions/cache is a fetch, not a resident model"
    cold_start_ms: 60000
    max_job_seconds: 21600
    max_ram_mb: 16384
    max_disk_mb: 14336
    quota: "standard GitHub-hosted runner; larger runners are a paid product and are not used"
    egress_note: >-
      Runners reach huggingface.co, which this container does not. That is why
      artifact discovery and staging run there and not here.
    inference_provable_by: >-
      a workflow job that loads the artifact and runs a real completion, with
      the log as evidence.
    verification_state: VERIFIED_LIMITED
    verification_evidence: >-
      execution is proven and inference is not, and the two are recorded
      separately because they are different claims. Real jobs have run here -
      the Wave 3 discovery lane, artifact staging, the ClamAV scan lane and the
      Workers AI probe, all with logs. No model has been loaded and no
      completion returned on this path yet, so it is VERIFIED_LIMITED rather
      than VERIFIED_AVAILABLE, and the limit is exactly that.
    notes: >-
      A real machine with real RAM, for six hours at a time. It is NOT a
      persistent inference server and must not be recorded as one: every job
      starts with an empty cache, so a 12 GB artifact is re-fetched each time
      and a model cannot be kept warm between requests. It raises the RAM
      ceiling from 15.5 GB to 16 GB, which is not enough for either of the
      models that exceed this host.
    evidence: [vendor_docs]

  - provider_id: cloudflare_workers_ai
    execution_type: SERVERLESS_HOSTED_CATALOG
    cost_class: FREE_HARD_STOP
    custom_weights: false
    supported_artifact_formats: []
    authentication_required: true
    credential_available_here: false
    operator_authorized: true
    operator_evidence: >-
      live_account_api 2026-09-17: the operator's Cloudflare account lists 5 deployed
      Workers, and android-brain-agent-gateway declares an AI binding. The federation
      has this path; this container simply holds no token for it.
    model_cache_capability: "provider-managed; models are resident on Cloudflare's side at no cost to us"
    max_job_seconds: 30
    quota: "10,000 Neurons per day on the Workers Free plan; beyond it, requests fail rather than bill"
    quota_resets: "daily at 00:00 UTC"
    egress_note: >-
      developers.cloudflare.com is blocked by this container's egress proxy, so
      the catalog was read through the connected Cloudflare documentation tool
      rather than by fetching it here.
    inference_provable_by: >-
      a request from a deployed Worker with the AI binding, or a direct API call
      with a token scoped for Workers AI. Attempted on 2026-09-17 from a runner
      holding the repository's Cloudflare credential; see verification_state.
    verification_state: AUTH_REQUIRED
    verification_evidence: >-
      probe run 35252697668 (2026-09-17T17:29:54Z, branch head 486fa406), after the
      operator reported updating the token. Four facts are established and one is
      not. Established: the stored token is valid and active (/user/tokens/verify
      200); it is scoped to exactly one account and CLOUDFLARE_ACCOUNT_ID is that
      account; the account id is a well-formed 32-character hex id; and Workers AI
      is refused on that account anyway - 403 on models/search, 401 with error
      10000 on ai/run for all three recorded models. Not established: whether the
      secret holds the newly scoped token or the previous deploy token, because a
      valid old token also verifies 200. The token id is recorded in
      CHECKPOINTS/evidence/WORKERS_AI_FREE_TIER_PROBE.json so the operator can tell.
      No model was served, so nothing here is VERIFIED_AVAILABLE and free-tier
      eligibility remains unestablished in either direction.
    operator_action_required: >-
      Compare the token id in the probe evidence with the token that was given
      Workers AI permissions. If it differs, replace the CLOUDFLARE_API_TOKEN
      secret's VALUE with the new token - its permissions are already right, the
      secret is simply still holding the old one. If it matches, re-open that
      token in the Cloudflare dashboard and confirm the Workers AI permission was
      saved through to the end rather than left on the edit screen. Neither path
      involves a new account, a plan change or a payment; the Workers Free plan
      already carries the 10,000 daily Neuron allowance and cannot bill.
    notes: >-
      A hosted catalog, and that is the load-bearing limit. It serves models
      Cloudflare has published under @cf/ ids; there is no documented path for
      uploading our own GGUF, and the only weight customisation on a model page
      is a `lora` adapter name against a Cloudflare-hosted base. So this path can
      answer a capability, but it can never run an artifact we admitted.
      Billing is impossible on the Workers Free plan - the pricing table records
      "N/A - Upgrade to Workers Paid" for it - so exhausting the allowance fails
      the request instead of charging. Some resource-intensive models are
      Paid-only and return 403 / internal error 5035 on Free; that list is
      recorded per model, not assumed.
    evidence:
      - https://developers.cloudflare.com/workers-ai/platform/pricing/
      - https://developers.cloudflare.com/changelog/post/2026-07-28-models-require-workers-paid/
    account_evidence: >-
      live_account_api 2026-09-17: the operator's Cloudflare account lists 5
      deployed Workers, and android-brain-agent-gateway already declares an AI
      binding in its wrangler.jsonc. The Workers AI lane exists and is wired;
      what is missing here is a credential in this container, not the lane.

offerings:
  # Keyed by the model the registry names, not by what a provider would rather
  # serve. A CAPABILITY row is a different model doing a similar job and is
  # never allowed to stand in for the named one's evidence.

  - requested_model_id: openai/gpt-oss-20b
    provider_id: cloudflare_workers_ai
    match: EXACT
    provider_model_id: "@cf/openai/gpt-oss-20b"
    context_window: 128000
    unit_pricing: "$0.20 per M input tokens, $0.30 per M output tokens, billed in Neurons"
    free_tier_eligible: null
    free_tier_note: >-
      Not on the published Paid-only list (kimi-k2.6, kimi-k2.7-code, glm-5.2),
      which is evidence but not proof. Recorded null, which fails closed: the
      model is not treated as free-tier available until a request on the free
      plan returns 200 rather than 403/5035.
    evidence:
      - https://developers.cloudflare.com/workers-ai/models/gpt-oss-20b/
      - https://developers.cloudflare.com/changelog/post/2025-08-05-openai-open-models/

  - requested_model_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    provider_id: cloudflare_workers_ai
    match: CAPABILITY
    provider_model_id: "@cf/qwen/qwen2.5-coder-32b-instruct"
    substitution_reason: >-
      Cloudflare's entire Qwen catalog is three models - qwen2.5-coder-32b-instruct,
      qwen3-30b-a3b-fp8 and qwen3-embedding-0.6b - and Qwen3-Coder-30B-A3B-Instruct
      is none of them. qwen2.5-coder-32b-instruct is the code-specialised Qwen
      Cloudflare does serve: a different generation and a dense 32B rather than a
      30B MoE, so it covers the coding capability under its own name and its own
      evidence. It is not Qwen3-Coder and no measurement taken on it may be
      recorded against Qwen3-Coder.
    free_tier_eligible: null
    evidence:
      - https://developers.cloudflare.com/workers-ai/models/
      - https://developers.cloudflare.com/workers-ai/models/qwen2.5-coder-32b-instruct/

  - requested_model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
    provider_id: cloudflare_workers_ai
    match: CAPABILITY
    provider_model_id: "@cf/deepseek-ai/deepseek-r1-distill-qwen-32b"
    substitution_reason: >-
      Cloudflare serves the 32B distill of DeepSeek-R1, not the 7B. Same distillation
      family and the same reasoning capability, a different model at four times the
      size. The 7B is the candidate because it fits this host; the 32B exists only
      on the provider, so the two are not interchangeable evidence in either
      direction.
    context_window: 80000
    unit_pricing: "$0.497 per M input tokens, $4.881 per M output tokens"
    free_tier_eligible: null
    license_note: "DeepSeek-R1 licence, linked from the model page; no acceptance gate on the provider side"
    evidence:
      - https://developers.cloudflare.com/workers-ai/models/deepseek-r1-distill-qwen-32b/

  - requested_model_id: microsoft/Phi-4-mini-instruct
    provider_id: cloudflare_workers_ai
    match: UNVERIFIED
    unverified_reason: >-
      Repeated catalog queries for Microsoft/Phi models returned no results, which
      is not evidence of absence - the same query shape returned empty for models
      later confirmed present. Recorded UNVERIFIED rather than ABSENT. It is also
      moot for placement: Phi-4-mini needs ~5000 MB and runs on this host, so its
      blocker is artifact provenance, not capacity.

  - requested_model_id: Qwen/Qwen3-8B-GGUF
    provider_id: cloudflare_workers_ai
    match: ABSENT
    absent_reason: >-
      Cloudflare's Qwen catalog was read in full and contains no Qwen3-8B. It runs
      on this host anyway, at a measured 8655 MB peak.
    evidence:
      - https://developers.cloudflare.com/workers-ai/models/
