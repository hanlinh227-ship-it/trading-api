- id: phi-4-mini-instruct
  upstream: microsoft/Phi-4-mini-instruct
  source_url: https://huggingface.co/microsoft/Phi-4-mini-instruct
  upstream_format: safetensors
  license_observed: mit
  languages_observed: 24
  candidate_roles:
  - verifier_checker
  - fast_low_resource_worker
  - multilingual
  local_artifact_strategy: discover_verified_local_quantization_or_existing_supported_backend
  state: QUARANTINED_PROVENANCE
  wave3_terminal: true
  terminal_finding: >-
    Final provenance search read the artifacts' own GGUF metadata, which is
    where a converter records what it built from - stronger evidence than any
    README claim. Microsoft publishes no GGUF. Two conversions exist and neither
    is complete: unsloth records its converter in GGUF metadata
    (general.quantized_by: Unsloth) but no base revision; lmstudio-community
    records neither converter nor base revision. Both name the base model only
    via a hub tag. Without the base revision nothing pins WHICH weights were
    converted, so the artifact is quarantined rather than admitted. Capacity was
    never the blocker: a worker meets its ~5000 MB comfortably.
  clears_when: >-
    Microsoft publishes a GGUF, or a converter records general.base_model.0.version
    alongside its quantized_by. Nothing here may be relaxed to admit it.
  superseded_interim_finding: >-
    Replaced by terminal_finding above, which reads the artifact metadata
    rather than the README.
    Discovery run 2026-09-17T17:49:36Z. The author publishes no GGUF, and every
    community conversion found names a base model but neither a base revision nor
    the converter that produced it, so provenance_complete is not satisfied for any
    of them. A digest proves these bytes are these bytes; it says nothing about what
    they were made from. The candidate is refused on that rule rather than admitted
    on reputation - the same rule that keeps a vendor documentation page out of the
    capability ledger. Not permanent: it clears the moment the author publishes a
    GGUF, or a converter records its base revision and tool. Nothing here may be
    relaxed to admit it.
  requires_before_staging:
  - immutable revision pin
  - local artifact provenance and digest verification
  - existing runtime compatibility proof
  - benchmark against current Phi-3-mini before active consideration
  worker_requirement:
    artifact_mb: 2500
