version: 1
purpose: fail_closed_local_model_admission_boundary

authority:
  routing: false
  reasoning: false
  runtime_residency: false

flow:
  - open_model_universe
  - admission_gate
  - model_mesh_local_candidate
  - claude_runtime_projection

registry_membership_implies_activation: false
ingress_hardcodes_model: false
runtime_residency_owner: claude_local_runtime
model_selection_authority: model_mesh

artifact_identity_source: artifact_identity
artifact_identity_required_fields:
  - model_id
  - family
  - variant
  - immutable_revision
  - sha256
  - size_bytes
  - format
  - quantization

candidate_gate:
  governance_state_required: AVAILABLE
  require_license_verified: true
  require_provenance_verified: true
  require_safe_format_verified: true
  require_pickle_safe: true
  trust_remote_code_required_must_be: false
  custom_code_required_must_be: false
  malware_scan_status_required: pass
  quarantine_status_required: clear
  unknown_critical_evidence_blocks: true

  # An operator may accept a named, scoped risk when a check cannot be run in
  # this environment. It is a recorded decision, never a substitute finding:
  # the underlying evidence field keeps its true value (malware_scan_status
  # stays not_run) and the acceptance is carried alongside it.
  #
  # Deliberately narrow. It covers exactly one gate, it is bound to one
  # artifact by digest so it cannot become a blanket "skip scanning", and it
  # can never stand in for licence, provenance, format safety, pickle safety,
  # remote-code restrictions or the structural scan - those are either
  # obtainable here or are the reason the format is safe to open at all.
  operator_risk_acceptance:
    permitted: true
    may_substitute_for:
      - malware_scan_status
    never_substitutes_for:
      - license_verified
      - provenance_verified
      - safe_format_verified
      - pickle_safe
      - trust_remote_code_required
      - custom_code_required
      - structural_scan
    required_fields:
      - accepted_by
      - accepted_at
      - artifact_sha256
      - basis
      - missing_evidence
      - scope
    scope_must_be: single_artifact
    must_bind_artifact_digest: true
    must_record_missing_evidence: true
    must_not_alter_underlying_evidence: true

  blocked_states:
    - DISCOVERED
    - QUARANTINED
    - QUARANTINED_UPDATE
    - REGISTERED
    - APPROVED
    - BLOCKED
    - SUPERSEDED
    - RETIRED

runtime_first_load_contract:
  isolated_first_load_if_required: true
  deny_first_load_egress_when_first_load_egress_allowed_false: true
  runtime_may_not_relax_admission: true
  runtime_may_not_mutate_artifact_identity: true
