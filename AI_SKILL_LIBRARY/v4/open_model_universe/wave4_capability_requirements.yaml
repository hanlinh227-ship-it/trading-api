version: 1
purpose: wave4_capability_requirements_and_measured_coverage
status: MEASURED  # see wave_closure_gate.py --wave 4
measured_at: "2026-09-17T19:16:06Z"  # wave4_multimodal_v2
evidence: CHECKPOINTS/evidence/WAVE4_MULTIMODAL_BENCHMARK.json

# Coverage below is MEASURED by real inference against a provider that is
# VERIFIED_AVAILABLE, with inputs built inside the job so the answers have one
# correct value. A tag with measured_covered false is an honest gap, not an
# omission, and no catalog row or provider claim may fill it.

architecture:
  unchanged: true
  flow: >-
    USER -> GITHUB_BRAIN_V4 -> task_router -> AI Legion -> Model Mesh
    -> existing runtime scheduler -> Free Worker Mesh -> worker/provider
    -> inference -> verifier -> evidence -> synthesis
  forbidden_additions:
    - another Brain
    - another router
    - another Model Mesh
    - another model registry
    - another scheduler
    - another worker registry
    - another admission authority
    - another evidence authority

