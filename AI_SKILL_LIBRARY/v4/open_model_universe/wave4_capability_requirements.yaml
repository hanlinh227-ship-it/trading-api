rules_carried_forward:
  declared_never_qualifies: >-
    A declared capability advertises; only a measured one makes a worker
    eligible. Every tag above with measured_covered false is ineligible.
  provenance_unchanged: >-
    A third-party conversion must name its base model, its base revision and
    the converter that produced it. Wave 3 closed two candidates as
    QUARANTINED_PROVENANCE under this rule. Wave 4 does not relax it.
  exact_versus_capability_unchanged: >-
    A provider serving a different model covers a capability under its own
    name and is never recorded as the requested model being available.
  execution_proof_unchanged: >-
    A provider is VERIFIED_AVAILABLE only after a real request returns a real
    completion on a zero-cost tier. Documentation is not execution proof.

observed_failures:
  - model: "@cf/myshell-ai/melotts"
    result: HTTP 500 twice, across two runs and a retry
    treatment: >-
      Recorded as a real failure, not a flake. One model failing is not the
      capability failing, so an alternative was tried and text_to_speech is
      covered by @cf/deepgram/aura-1 instead.
  - model: "@cf/moondream/moondream3.1-9B-A2B"
    result: HTTP 200 with an empty result object
    treatment: >-
      EMPTY_RESPONSE, which is not a wrong answer and is not a capability
      claim in either direction. llava answered the same prompts correctly,
      so vision and OCR coverage rests on llava and not on this.

