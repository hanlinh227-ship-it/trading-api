# Packaging this contract into the immutable stable release bundle is deliberately
# deferred. Releases are immutable, so the new files cannot be added to 4.13.0 in
# place, and cutting a successor is blocked by the repository's own rollback
# invariant: rollback_release() targets the last release marked known_good, and
# AI_SKILL_LIBRARY/v4/releases/history.yaml records 4.13.0 as known_good=false.
# A successor built on top of it would leave the immediate predecessor
# un-rollbackable. Marking 4.13.0 known_good would assert a production
# verification that has not happened, so the gate is respected rather than lowered.
#
# The expansion contract is therefore resolved through checkpoint pointers, which
# is sufficient for every adapter here because all of them are disabled by default
# and none is on the stable request path.
release_packaging:
  packaged_in_stable_release: true
  resolved_via: stable_release_manifest
  packaged_at_release: 4.14.0
  blocked_by: ''
  resolution: >-
    Closed 2026-09-17. Release 4.13.0 was production-verified by the canonical
    gate (Deploy Skill-Mandatory Fast Gateway run 124 on main 8c9499e: exact-SHA
    deploy, /brain/health, /brain/mesh/health, /brain/route matrix, planner
    smoke, FREE_ONLY guard and final exact-SHA gate all PASS, rollback step
    skipped), recorded known_good via evergreen.py mark-known-good, and the four
    expansion paths were added to release.py RELEASE_FILES and packaged into
    successor release 4.14.0 with release.py build.
  production_evidence:
    workflow: Deploy Skill-Mandatory Fast Gateway
    run_id: 35173044514
    run_number: 124
    verified_source_sha: 8c9499e23c0eee17229a80cb1884f0cb078643e2
    production_live_revision: 8c9499e23c0eee17229a80cb1884f0cb078643e2
    result: SKILL_MANDATORY_FAST_GATEWAY_DEPLOY=PASS
    adapters_enabled_during_verification: none
