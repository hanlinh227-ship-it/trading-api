# Brain Expansion adapter registry.
#
# One normalized contract per candidate registered in
# brain_expansion_architecture.yaml. This file is the single place that records
# audited upstream provenance, activation stage, feature flag and rollback for
# the expansion lanes. It creates no second configuration system: it follows the
# same upstream-record shape already used by v4/integrations/policy.yaml.
#
# Nothing here holds authority. task_router remains the only routing authority,
# Legion the multi-agent execution authority, Model Mesh the model/provider
# selector, and Memory Continuity the memory authority.
#
# Provenance was verified on 2026-09-17 against the live GitHub API (repository
# identity, default branch, archived state, license classification) and against
# `git ls-remote --tags` for the exact commit each pinned tag resolves to.
version: 1
status: adapters_registered_upstream_audited_no_executable_dependency
brain_authority: GITHUB_BRAIN_V4
routing_authority: false
reasoning_authority: false
stable_mutation: false
audited_at: '2026-09-17'
audit_method: github_api_repository_metadata_plus_git_ls_remote_tag_resolution

canonical_authorities:
  routing: task_router
  multi_agent_execution: legion
  model_provider_selection: model_mesh
  memory: memory_continuity
  promotion: repository_native_deterministic_evals

# Auto-activation. An adapter turns itself on only when every condition it
# actually requires is verified; FAIL, UNKNOWN, a missing probe or a probe that
# raises all leave it off. There is deliberately no always-on mode.
auto_activation:
  mode: AUTO_ACTIVATE_WHEN_VERIFIED
  auto_activate_when_verified: true
  always_on: false
  fail_closed: true
  unknown_is_failure: true
  paid_dependency_auto_install: false
  billing_auto_enable: false
  fast_path_synchronous_probe: false
  eligibility_ttl_seconds: 3600
  conditions:
    - license_verified
    - dependency_audit
    - dependency_available
    - security_policy
    - credential_present
    - network_allowed
    - runtime_health_probe
    - sandbox_test
    - no_protected_regression
    - rollback_verified
  hard_blocking_conditions: [license_verified, security_policy]
  degrading_conditions: [runtime_health_probe]

# A candidate may only ever weaken to a lower stage. Raising a stage requires the
# promotion gates in brain_expansion_architecture.yaml.
stages: [architecture_registered, reference_only, audited, sandbox_ready, enabled, production_verified]

candidates:

  # ---------------------------------------------------------------- observability
  langfuse:
    lane: observability
    role: observability_adapter_candidate
    stage: sandbox_ready
    mode: sanitized_otel_compatible_trace_adapter
    focus: "Sanitized, OpenTelemetry-aligned diagnostic trace export. Diagnostic evidence only."
    enabled: false
    feature_flag: BRAIN_EXPANSION_LANGFUSE_ENABLED
    executable_dependency_added: false
    network_execution_enabled: false
    production_dependency: false
    independently_disableable: true
    provider_lock_in: false
    memory_writeback_allowed: false
    replaces: []
    auto_activation:
      activation_mode: SANITIZED_EXPORT
      required_conditions:
        - license_verified
        - dependency_audit
        - dependency_available
        - security_policy
        - credential_present
        - network_allowed
        - runtime_health_probe
        - sandbox_test
        - no_protected_regression
        - rollback_verified
    health: unknown
    failure: none
    runtime_evidence: null
    rollback: "Unset BRAIN_EXPANSION_LANGFUSE_ENABLED (or set it false). The adapter then emits nothing and the stable request path is unchanged."
    blockers:
      - "license_ambiguous: langfuse/langfuse is a mixed-license (open-core) monorepo. Re-audited 2026-09-17 by reading both licence files directly from the canonical upstream at the pinned tag v4.37.0. /LICENSE grants MIT Expat for content outside ee/, web/src/ee/ and worker/src/ee/; ee/LICENSE is the Langfuse Enterprise License (Copyright 2023-2026 ClickHouse, Inc.) which states it is 'forbidden to copy, merge, publish, distribute, sublicense, and/or sell the Software' without a valid Langfuse Enterprise License. The repository therefore carries no single auto-approved SPDX licence (GitHub reports NOASSERTION) and is outside the registry's ALLOWED_LICENSES. Executable dependency on the monorepo stays blocked; the adapter is vendor-neutral and imports nothing from upstream."
    upstream:
      repo: langfuse/langfuse
      default_branch: main
      tag: v4.37.0
      ref: e35c5e108652887b8a22ef54bb2b7c148b397bac
      license: "MIT-Expat-for-core-plus-separate-commercial-ee-license (GitHub SPDX: NOASSERTION)"
      license_status: ambiguous
      archived: false
      audited_at: '2026-09-17'
    # A cleanly-licensed upstream exists, but recording it is NOT activation.
    # Depending on it would still be an executable-dependency plus network-egress
    # decision that this change does not take. Langfuse stays disabled with no
    # dependency; this block only documents the concrete unblock path so a future
    # promotion does not have to redo the audit.
    activation_path:
      candidate_upstream: langfuse/langfuse-python
      tag: v4.15.4
      ref: 6c3842a3b8b96df0326dcfeca04dd7a1c1cbcdd9
      license: MIT
      license_status: verified
      license_evidence: "LICENSE read from the canonical upstream at the pinned tag: 'MIT License, Copyright (c) 2022 Finto Technologies'. pyproject.toml declares license = \"MIT\" with license-files = [\"LICENSE\"]. No ee/ directory exists, so unlike the monorepo it is single-licensed."
      distribution: "PyPI package `langfuse` 4.15.4, requires-python >=3.10,<4.0; OpenTelemetry-based SDK."
      executable_dependency_added: false
      enabled: false
      still_required_before_use:
        - explicit_dependency_and_network_egress_authorization
        - transitive_dependency_licence_review
        - sandbox_run_with_sanitized_events_only
    audit:
      maintenance: "Active. Pushed 2026-09-17; ~34.7k stars; no archive or disable flag."
      license_reaudit: "2026-09-17, canonical upstream at pinned tag v4.37.0. Read /LICENSE (MIT Expat core) and ee/LICENSE (Langfuse Enterprise License, ClickHouse Inc.) directly from the repository rather than relying on the GitHub SPDX label or on memory. Finding is determinate: the repository is open-core/mixed, not merely unclassified. Conclusion unchanged - not a single auto-approved licence, so the executable-dependency gate stays closed."
      dependency_license_concerns: "ee/ subtree is commercially licensed; any vendoring or self-hosting of the monorepo must exclude it. The separately published client SDK (see activation_path) is single-licensed MIT but is deliberately not depended upon here."
      supply_chain_risk: "Not taken: no npm/PyPI package and no upstream source is installed. Risk surface is limited to the repository audit itself."
      network_behavior: "None. The adapter hands a sanitized dict to an injected exporter callable; the repository ships no exporter that opens a socket."
      overlap: "Strengthens the existing stable observability contract (v4/stable/observability.yaml). Adds no new telemetry field and no new persistence location."
      permission_ceiling: "Read-only over already-sanitized diagnostic metadata. Cannot read raw prompts, private chat, private tool payloads, credentials or hidden reasoning."
      performance_cost_impact: "Zero while disabled. When enabled, one allowlist filter per event, bounded by observability limits.max_event_chars."
      rollback: "Feature flag off; no schema, no migration, no persisted state to unwind."

