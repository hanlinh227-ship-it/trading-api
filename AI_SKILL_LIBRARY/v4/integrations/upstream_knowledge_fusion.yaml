version: 1
purpose: bounded_upstream_capability_knowledge_fusion_for_all_ai
status: reference_registry_active_no_executable_dependencies
audited_at: '2026-09-19'
brain_authority: GITHUB_BRAIN_V4
routing_authority: false
reasoning_authority: false
model_selection_authority: false
stable_mutation: false

selection:
  load_after_domain_selection: true
  preload_all_entries: false
  exact_capability_match_first: true
  max_candidates_per_request: 3
  fast_profile: index_only
  standard_profile_max_candidates: 2
  deep_profile_max_candidates: 3
  unresolved_material_conflict: escalate
  unknown_entry_action: quarantine_no_routing

safety:
  upstream_is_reference_not_authority: true
  code_reuse_default: false
  executable_dependency_default: false
  auto_activate_default: false
  permission_expansion: false
  provider_or_framework_cannot_replace_task_router: true
  provider_or_framework_cannot_replace_model_mesh: true
  provider_or_framework_cannot_replace_legion: true
  provider_or_framework_cannot_replace_memory_continuity: true
  project_authority_precedes_upstream_patterns: true
  stable_security_precedes_upstream_patterns: true
  development_lab_cannot_write_stable_directly: true
  manual_review_licenses_never_enable_code_reuse: true
  archived_upstreams_never_become_runtime_dependencies: true

canonical_targets:
  desktop_actions: future_bounded_desktop_action_adapter
  worker_orchestration: AI_SKILL_LIBRARY/v4/legion
  workflow_execution: AI_SKILL_LIBRARY/v4/tools/legion.py
  control_tower_ux: control-center
  runtime_fabric: AI_SKILL_LIBRARY/v4/local_runtime/runtime.py
  learning_lab: AI_SKILL_LIBRARY/v4/learning
  observability: AI_SKILL_LIBRARY/v4/stable/observability.yaml
  retrieval: AI_SKILL_LIBRARY/v4/stable/retrieval.yaml
  document_intelligence: AI_SKILL_LIBRARY/v4/stable/capability_fusion.yaml
  creative_visual: AI_SKILL_LIBRARY/v4/stable/creative_visual_fusion.yaml
  prompt_media: AI_SKILL_LIBRARY/v4/mesh/domains/prompt_media.yaml

