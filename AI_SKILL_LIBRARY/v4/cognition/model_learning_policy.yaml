version: 1
purpose: shared_cognitive_core_and_model_specific_continuous_learning
status: DEVELOPMENT_LAB
authority:
  routing_authority: false
  reasoning_authority: false
  model_selection_authority: false
  admission_authority: false
  scheduling_authority: false
  stable_write_authority: false
  merge_authority: false
  trading_authority: false

shared_cognitive_core:
  model_agnostic: true
  compile_once_per_release: true
  prompt_prefix_cache_preferred: true
  rules:
    - distinguish_verified_fact_from_inference
    - current_authority_precedes_cached_or_learned_state
    - measured_capability_precedes_declared_capability
    - unresolved_material_conflict_must_be_exposed
    - never_majority_vote_truth
    - never_invent_missing_evidence
    - preserve_provenance
    - verify_after_material_action
    - least_permission_and_fail_closed_on_unknown_permission
    - memory_is_context_not_authority
    - no_hidden_chain_of_thought_persistence
    - no_secret_or_credential_persistence

token_economy:
  full_skill_scan_on_model_path: false
  runtime_model_visible_skill_material: compact_delta_only
  maximum_runtime_priority_units_per_model: 6
  full_curriculum_stays_off_prompt: true
  skill_and_branch_metadata_precompiled: true
  prefix_cache_key_fields: [brain_release, cognitive_core_hash, security_revision, authority_revision]

model_specific_learning:
  enabled: true
  consume_all_canonical_skills: true
  consume_all_role_branches: true
  consume_measured_capability_evidence: true
  consume_sanitized_experience: true
  declared_capability_is_training_hint_only: true
  measured_weakness_gets_higher_replay_priority: true
  unmeasured_capability_gets_measurement_priority: true
  strong_capability_gets_maintenance_replay: true
  cross_model_weight_copy: forbidden
  model_family_specific_delta: true
  provider_specific_delta: allowed_when_non_authoritative

continuous_loop:
  enabled: true
  scheduler: existing_continuous_intelligence_only
  cadence: hourly
  event_driven_inputs: [sanitized_experience, verified_failure, capability_measurement, upstream_capability_diff]
  yield_on_user_activity: true
  stable_request_dependency: false
  direct_stable_write: false
  direct_model_mesh_write: false
  candidate_output_only: true
  protected_regressions_max: 0

weight_training:
  automatic_weight_mutation: false
  candidate_generation_for_local_open_weight_models: true
  preferred_methods: [replay_distillation, instruction_tuning, lora]
  requires:
    - local_or_explicitly_trainable_weights
    - license_allows_training
    - frozen_replay
    - baseline_score
    - protected_regression_suite
    - rollback_artifact
  promotion: existing_evergreen_gates_only
  hosted_closed_models: prompt_and_replay_adaptation_only
