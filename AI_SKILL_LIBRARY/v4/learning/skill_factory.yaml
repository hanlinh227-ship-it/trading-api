version: 1
purpose: brain_native_experience_to_skill_candidate_factory
routing_authority: false
reasoning_authority: false
stable_write_allowed: false
allowed_triage_actions: [discard, improve, merge, create]
default_status: incubating
default_permission_ceiling: read_only
default_risk_class: A
source_layers: [experience, curated, exploration]
peer_layer_priority: none
lineage_required: true
provenance_required: true
eval_plan_required: true
permission_widening_on_merge: forbidden
risk_downgrade_on_merge: forbidden
stable_catalog_mutation: promotion_pipeline_only
universal_fabric:
  gap_triage_tool: AI_SKILL_LIBRARY/v4/tools/skill_forge.py
  strengthen_existing_skill_first: true
  distinct_contract_required_for_new_primary: true
  upstream_watch_path: AI_SKILL_LIBRARY/v4/learning/upstream_watch.yaml
  candidate_memory_may_signal_gap: true
  candidate_memory_is_not_skill_authority: true

continuous_skill_learning:
  curriculum_gap_is_candidate_input_only: true
  competency_gap_is_candidate_input_only: true
  competency_gap_requires_evidence_refs: true
  strengthen_existing_skill_first: true
  stable_catalog_mutation: promotion_pipeline_only
  direct_stable_write: false
  direct_router_write: false
  direct_model_mesh_write: false
