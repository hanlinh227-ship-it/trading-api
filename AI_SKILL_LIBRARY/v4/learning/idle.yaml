version: 1
purpose: bounded_idle_continuous_learning_scheduler
routing_authority: false
reasoning_authority: false
yield_on_user_activity: true
max_concurrent_jobs: 2
max_retries_per_job: 2
max_network_calls_per_job: 20
max_candidate_mutations: 6
storage_growth_guard: true
provider_quota_is_dynamic: true
allowed_jobs:
  - failure_analysis
  - capability_gap_detection
  - public_source_discovery
  - free_model_discovery
  - skill_mining
  - skill_mutation
  - replay_eval
  - regression_eval
  - knowledge_dedupe
  - retrieval_benchmark
  - routing_benchmark
forbidden_jobs:
  - live_financial_execution
  - transfer_funds
  - credential_mutation
  - permission_widening
  - destructive_production
  - disable_security
  - authority_hierarchy_change
  - quota_bypass
priority:
  failure_analysis: 90
  capability_gap_detection: 80
  regression_eval: 75
  free_model_discovery: 70
  public_source_discovery: 65
  skill_mining: 62
  skill_mutation: 60
  replay_eval: 58
  retrieval_benchmark: 50
  routing_benchmark: 48
  knowledge_dedupe: 40
