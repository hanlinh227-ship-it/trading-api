version: 1
purpose: portable_subordinate_runtime_state_for_universal_brain_fabric
canonical_authority: github
runtime_state_authority: false
routing_authority: false
reasoning_authority: false

interfaces:
  StateKV:
    required: true
    first_backend: cloudflare_kv_namespaced
    preferred_binding: BRAIN_STATE
    compatible_existing_binding: TRADING_STATE
    namespace_prefix: 'brain:v1:'
    never_read_on_fast_route: true
  MetadataStore:
    required: true
    first_backend: cloudflare_kv_json
    namespace_prefix: 'brain:v1:meta:'
    future_backends: [d1, postgres]
  VectorIndex:
    required: false
    first_backend: optional_vectorize
    binding: BRAIN_VECTOR
    on_unavailable: canonical_ranked_retrieval
    future_backends: [qdrant, pgvector]
  ObjectStore:
    required: false
    first_backend: optional_r2
    binding: BRAIN_OBJECTS
    on_unavailable: inline_bounded_metadata_only
    future_backends: [s3_compatible]
    # Subordinate extension of THIS interface, not a second abstraction.
    # GitHub stays canonical; the mesh only places and persists bytes.
    federated_storage_mesh:
      role: subordinate_persistence_and_placement
      extends_interface: ObjectStore
      second_portable_state_abstraction: false
      authority: false
      storage_authority: false
      routing_authority: false
      canonical_authority: github
      metadata_service_authority: false
      policy: AI_SKILL_LIBRARY/v4/storage/policy.yaml
      providers: AI_SKILL_LIBRARY/v4/storage/providers.yaml
      object_manifest_schema: AI_SKILL_LIBRARY/v4/schemas/storage_object_manifest.schema.json
      provider_schema: AI_SKILL_LIBRARY/v4/schemas/storage_provider.schema.json
      # A JSON Schema validates one document alone: it cannot open the provider
      # registry, so the manifest schema could name a backend that had been
      # admitted for nothing. This resolver is the other half - read-only, no
      # authority, activates no account - and a placement is admissible only
      # when both it and the schemas agree.
      backend_resolver: AI_SKILL_LIBRARY/v4/storage/mesh_validator.py
      backend_resolver_authority: false
      paid_storage_allowed: false
      overage_allowed: false
      secrets_allowed: false
      on_unavailable: inline_bounded_metadata_only
  TaskQueue:
    required: false
    first_backend: optional_cloudflare_queue
    binding: BRAIN_QUEUE
    on_unavailable: existing_evergreen_scheduler
  LeaseLock:
    required: false
    first_backend: optional_durable_object
    binding: BRAIN_LOCK
    on_unavailable: existing_update_plane_locks

privacy:
  forbidden_content: [hidden_reasoning, raw_private_chat, secrets, credentials, private_keys, authentication_tokens, raw_sensitive_tool_payloads]
  secrets_in_vector_index: false
  secrets_in_metadata_store: false

fast_path:
  synchronous_state_reads: 0
  synchronous_state_writes: 0
  synchronous_queue_calls: 0

fallback:
  backend_failure_never_promotes_cache_to_authority: true
  stable_request_survives_optional_backend_failure: true
  disclose_degraded_state_when_material: true
