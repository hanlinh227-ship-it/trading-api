version: 2
superseded_by: GITHUB_BRAIN_V4
authority_role: compatibility_alias
canonical_authority: AI_SKILL_LIBRARY/checkpoint.json
checkpoint_id: GITHUB_BRAIN_V3
protocol_version: 3.0.0
mandatory_router: task_router
default_profile: FAST
kernel: AI_SKILL_LIBRARY/kernel.yaml

paths:
  brain: AI_SKILL_LIBRARY/GITHUB_BRAIN_V3.md
  core_protocol: AI_SKILL_LIBRARY/CORE_PROTOCOL.md
  kernel: AI_SKILL_LIBRARY/kernel.yaml
  router: AI_SKILL_LIBRARY/router.yaml
  runtime: AI_SKILL_LIBRARY/runtime.yaml
  context: AI_SKILL_LIBRARY/context.yaml
  reliability: AI_SKILL_LIBRARY/reliability.yaml
  evidence: AI_SKILL_LIBRARY/evidence.yaml
  orchestration: AI_SKILL_LIBRARY/orchestration.yaml
  projects: AI_SKILL_LIBRARY/projects.yaml
  skills: AI_SKILL_LIBRARY/skills/catalog.yaml
  sources: AI_SKILL_LIBRARY/sources.yaml
  plugins: AI_SKILL_LIBRARY/plugins.yaml
  memory: AI_SKILL_LIBRARY/memory.yaml
  evals: AI_SKILL_LIBRARY/evals.yaml
  observability: AI_SKILL_LIBRARY/observability.yaml
  security: AI_SKILL_LIBRARY/security.yaml
  migration: AI_SKILL_LIBRARY/migration.yaml

lazy_load:
  full_skill_catalog: true
  project_state: true
  trading_state: true
  sources: true
  plugins: true
  durable_memory: true
  evals: true
  observability: true
  security_detail: true
  context_detail: true
  reliability_detail: true
  evidence_detail: true
  orchestration_detail: true

fast_path:
  requires_all:
    - single_intent
    - low_risk
    - no_project_mutation
    - no_live_or_external_freshness_requirement
    - no_external_tool_required
  escalate_on:
    - multi_step
    - architecture
    - project_mutation
    - external_freshness
    - live_data
    - trading
    - deployment
    - destructive_action
    - financial_action
    - credential_sensitive_action
    - material_evidence_conflict
    - dependency_graph_required

refresh_triggers:
  - new_chat_or_work_cycle
  - user_requests_checkpoint_or_refresh
  - continue_existing_project
  - current_project_state_required
  - code_or_config_change
  - pre_merge_or_deploy
  - active_or_live_status_claim

fallback:
  marker: fresh_git_context=false
  behavior: continue_from_last_known_context_and_disclose_refresh_failure
