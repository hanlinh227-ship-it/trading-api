version: 1
policy:
  default_rag: true
  default_training: false
  default_usage_tier: RAG_ONLY
  allowed_usage_tiers: [TRAINING_OK, RAG_ONLY, REFERENCE_ONLY, MANUAL_REVIEW]
  require_license: true
  preserve_provenance: true
  new_sources_require_explicit_training_approval: true
  auto_fine_tune_from_registry: false
  sources_are_authority: false
  precedence_source: AI_SKILL_LIBRARY/v4/stable/evidence.yaml
  tiers: [WARM, COLD]
  default_tier: WARM
  max_sources_per_category: 20
  max_total_sources: 96
  load_only_after_domain_selection: true
  fast_profile_loads_sources: false
  new_source_requires: [provenance, license, capability_overlap_scan, risk_class, permission_ceiling, performance_impact, eval_impact, authority_impact]

_defaults:
  rag_only: &rag_only {rag: true, training: false, usage_tier: RAG_ONLY, tier: WARM}
  reference_only: &reference_only {rag: false, training: false, usage_tier: REFERENCE_ONLY, tier: COLD}
  manual_review: &manual_review {rag: false, training: false, usage_tier: MANUAL_REVIEW, manual_approval: true, tier: COLD}

sources:
  # GAME DEVELOPMENT
  - {<<: *rag_only, category: game, repo: godotengine/godot, license: MIT, focus: "2D/3D engine architecture, editor, rendering, gameplay systems"}
  - {<<: *rag_only, category: game, repo: bevyengine/bevy, license: MIT OR Apache-2.0, focus: "Rust ECS, engine architecture, rendering"}
  - {<<: *rag_only, category: game, repo: phaserjs/phaser, license: MIT, focus: "HTML5/TypeScript/JavaScript 2D games"}
  - {<<: *rag_only, category: game, repo: cocos/cocos-engine, license: MIT, focus: "C++/TypeScript cross-platform 2D/3D engine"}
  - {<<: *rag_only, category: game, repo: libgdx/libgdx, license: Apache-2.0, focus: "Java cross-platform game framework"}
  - {<<: *rag_only, category: game, repo: Unity-Technologies/ml-agents, license: Apache-2.0, focus: "reinforcement/imitation learning for games and simulations"}

  # UX / UI / DESIGN SYSTEMS
  - {<<: *rag_only, category: ux_ui, repo: shadcn-ui/ui, license: MIT, focus: "accessible component composition and modern app UI"}
  - {<<: *rag_only, category: ux_ui, repo: radix-ui/primitives, license: MIT, focus: "accessible headless UI primitives"}
  - {<<: *rag_only, category: ux_ui, repo: mui/material-ui, license: MIT, focus: "Material Design React components"}
  - {<<: *rag_only, category: ux_ui, repo: ant-design/ant-design, license: MIT, focus: "enterprise UI patterns and components"}
  - {<<: *rag_only, category: ux_ui, repo: chakra-ui/chakra-ui, license: MIT, focus: "accessible React design system"}
  - {<<: *rag_only, category: ux_ui, repo: mantinedev/mantine, license: MIT, focus: "React components, hooks and UX patterns"}
  - {<<: *rag_only, category: ux_ui, repo: microsoft/fluentui, license: MIT, focus: "Fluent design, accessibility and enterprise UI", exclude: "fonts/icons unless separately licensed"}
  - {<<: *rag_only, category: ux_ui, repo: carbon-design-system/carbon, license: Apache-2.0, focus: "IBM Carbon design system and component architecture"}

  # PROMPT ENGINEERING
  - {<<: *rag_only, category: prompt, repo: dair-ai/Prompt-Engineering-Guide, license: MIT, focus: "prompt methods, examples and research-oriented guidance"}
  - {<<: *rag_only, category: prompt, repo: bigscience-workshop/promptsource, license: Apache-2.0, focus: "structured prompt templates and prompt tooling", note: "linked datasets may have separate licenses"}
  - {<<: *rag_only, category: prompt, repo: microsoft/PromptWizard, license: MIT, focus: "prompt optimization"}
  - {<<: *rag_only, category: prompt, repo: microsoft/generative-ai-for-beginners, license: MIT, focus: "generative AI curriculum and prompt/app patterns"}
  - {<<: *rag_only, category: prompt, repo: openai/openai-cookbook, license: MIT, focus: "AI application examples, evals, retrieval and prompting"}
  - {<<: *rag_only, category: prompt, repo: f/awesome-chatgpt-prompts, license: CC0-1.0, focus: "community prompt patterns"}

  # CREATIVE VISUAL / IMAGE GENERATION / EDITING
  - {<<: *rag_only, category: prompt, repo: lllyasviel/ControlNet, license: Apache-2.0, focus: "pose, depth, edge and structural composition conditioning patterns for visual generation; reference methodology only"}
  - {<<: *rag_only, category: prompt, repo: tencent-ailab/IP-Adapter, license: Apache-2.0, focus: "image-reference, identity and style conditioning patterns for visual consistency"}
  - {<<: *rag_only, category: prompt, repo: facebookresearch/segment-anything, license: Apache-2.0, focus: "mask-first segmentation and precise visual edit targeting patterns"}
  - {<<: *rag_only, category: prompt, repo: IDEA-Research/GroundingDINO, license: Apache-2.0, focus: "text-to-object grounding and open-set target detection patterns for local visual edits"}
  - {<<: *rag_only, category: prompt, repo: xinntao/Real-ESRGAN, license: BSD-3-Clause, focus: "image/video restoration, super-resolution and artifact-reduction finalization patterns"}

  # SCRIPT / SCREENWRITING / STORY STRUCTURE TOOLS
  - {<<: *rag_only, category: script, repo: nyousefi/Fountain, license: MIT, focus: "screenplay structure and Fountain format"}
  - {<<: *rag_only, category: script, repo: wildwinter/screenplay-tools, license: MIT, focus: "screenplay parsing/writing across Fountain and FDX"}
  - {<<: *rag_only, category: script, repo: vilcans/screenplain, license: MIT, focus: "screenplay formatting and parsing"}
  - {<<: *rag_only, category: script, repo: mattdaly/Fountain.js, license: MIT, focus: "screenplay tokenization and structure"}
  - {<<: *manual_review, category: script, repo: GITenberg, license: PER_ITEM, focus: "public-domain literary corpus", note: "enable only individual works whose repository/license confirms usable rights in the relevant jurisdiction"}

  # CODING / SOFTWARE AGENTS
  - {<<: *rag_only, category: code, repo: OpenHands/OpenHands, license: MIT, focus: "agentic software development workflows"}
  - {<<: *rag_only, category: code, repo: OpenHands/software-agent-sdk, license: MIT, focus: "SDK patterns for coding agents"}
  - {<<: *rag_only, category: code, repo: Aider-AI/aider, license: Apache-2.0, focus: "Git-aware code editing and repo maps"}
  - {<<: *rag_only, category: code, repo: cline/cline, license: Apache-2.0, focus: "autonomous IDE/CLI coding agent patterns"}
  - {<<: *reference_only, category: code, repo: continuedev/continue, license: Apache-2.0, status: archived, focus: "coding agent/IDE architecture; historical reference"}

  # TRADING: FOREX / CRYPTO / FUTURES / INDEX / QUANT
  - {<<: *rag_only, category: trading, repo: QuantConnect/Lean, license: Apache-2.0, focus: "multi-asset event-driven engine: forex, futures, options, equities, crypto"}
  - {<<: *rag_only, category: trading, repo: ccxt/ccxt, license: MIT, focus: "crypto exchange APIs, market data and execution abstractions"}
  - {<<: *rag_only, category: trading, repo: microsoft/qlib, license: MIT, focus: "AI-oriented quantitative research platform"}
  - {<<: *rag_only, category: trading, repo: AI4Finance-Foundation/FinRL, license: MIT, focus: "financial reinforcement learning"}
  - {<<: *rag_only, category: trading, repo: AI4Finance-Foundation/FinRL-Trading, license: Apache-2.0, focus: "AI-native modular quantitative trading infrastructure"}
  - {<<: *rag_only, category: trading, repo: AI4Finance-Foundation/FinRL_Crypto, license: MIT, focus: "crypto reinforcement-learning examples"}
  - {<<: *rag_only, category: trading, repo: AI4Finance-Foundation/FinGPT, license: MIT, focus: "financial LLM code/research", note: "external datasets/checkpoints require separate license review"}
  - {<<: *rag_only, category: trading, repo: hummingbot/hummingbot, license: Apache-2.0, focus: "crypto market making, connectors and bot architecture"}
  - {<<: *rag_only, category: trading, repo: vnpy/vnpy, license: MIT, focus: "quant trading framework, gateways, futures/derivatives architecture"}

  # SOFTWARE DESIGN / APPLICATION ENGINEERING
  - {<<: *rag_only, category: software, repo: donnemartin/system-design-primer, license: CC-BY-4.0, attribution_required: true, focus: "system design, scalability and architecture"}
  - {<<: *rag_only, category: software, repo: fastapi/fastapi, license: MIT, focus: "Python API architecture and production patterns"}
  - {<<: *rag_only, category: software, repo: tauri-apps/tauri, license: MIT OR Apache-2.0, focus: "secure desktop/mobile app architecture with Rust + web frontend", exclude: "logo assets"}
  - {<<: *rag_only, category: software, repo: flutter/flutter, license: BSD-3-Clause, focus: "cross-platform app framework and UI architecture", note: "third-party components/assets may have separate licenses"}
  - {<<: *rag_only, category: software, repo: supabase/supabase, license: Apache-2.0, focus: "Postgres platform, auth, realtime, storage and backend architecture"}
  - {<<: *rag_only, category: software, repo: appwrite/appwrite, license: BSD-3-Clause, focus: "backend platform architecture and APIs"}
  - {<<: *rag_only, category: software, repo: kubernetes/kubernetes, license: Apache-2.0, focus: "distributed systems, orchestration and production engineering"}
  - {<<: *rag_only, category: software, repo: django/django, license: BSD-3-Clause, focus: "mature web framework architecture and testing"}
  - {<<: *rag_only, category: software, repo: facebook/react, license: MIT, focus: "frontend architecture, rendering and component systems"}
  - {<<: *rag_only, category: software, repo: nestjs/nest, license: MIT, focus: "TypeScript backend architecture and dependency injection"}

  # AI ORCHESTRATION / RETRIEVAL / MEMORY / EVAL / SERVING
  - {<<: *rag_only, category: software, repo: langchain-ai/langgraph, license: MIT, focus: "bounded stateful agent graphs, checkpoint/resume and explicit execution transitions; reference patterns only"}
  - {<<: *rag_only, category: software, repo: pydantic/pydantic-ai, license: MIT, focus: "typed agent/capability contracts, schema validation and eval harness patterns"}
  - {<<: *rag_only, category: software, repo: deepset-ai/haystack, license: Apache-2.0, focus: "context-engineered retrieval pipelines with explicit retrieval, routing, memory and generation boundaries"}
  - {<<: *rag_only, category: software, repo: qdrant/qdrant, license: Apache-2.0, focus: "hybrid semantic/vector retrieval, metadata filtering and high-performance indexing"}
  - {<<: *rag_only, category: software, repo: mem0ai/mem0, license: Apache-2.0, focus: "selective scoped memory, consolidation and long-term retrieval patterns"}
  - {<<: *rag_only, category: software, repo: promptfoo/promptfoo, license: MIT, focus: "LLM/agent eval matrices, CI regression testing and red-team patterns"}
  - {<<: *reference_only, category: software, repo: sgl-project/sglang, license: Apache-2.0, focus: "optional self-hosted inference patterns: prefix caching, batching and high-performance serving"}
  - {<<: *reference_only, category: software, repo: zilliztech/GPTCache, license: MIT, focus: "semantic cache similarity thresholds, cache safety and miss fallback patterns"}
