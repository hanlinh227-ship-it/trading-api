# Immutable trusted pytest configuration for AI-loop validation.
#
# Executing validators MUST be invoked as `pytest -c scripts/ai/tests/pytest.ini
# <validator>`. Passing -c makes THIS file the single configuration source, so
# pytest does not auto-load pytest.ini, .pytest.ini, pytest.toml, .pytest.toml,
# pyproject.toml, tox.ini or setup.cfg from the task-writable worktree, and a
# task cannot inject addopts such as `-p evil`.
#
# Intentionally minimal: no addopts, no plugin loading, no testpaths.
[pytest]
addopts =
